[[behavior]]
id = "textToken.keyPath"
area = "font-info"
milestone = "M7"
summary = "In a font or instance context the token may be a property path on the font or instance object, e.g. `{{{fullName}}}`. The reference resolves paths through its scripting object model; FontCraft needs a documented list of supported paths."
