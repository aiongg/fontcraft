]

[[behavior]]
id = "textToken.numberValue"
area = "font-info"
milestone = "M7"
summary = "In a master context the token may be the name of a number value."
ref = "Appendix › Text Tokens"
status = "handbook"
notes = "Documented, not yet observed. The token reads the master's value of the font's number value of that name. In a master context only number values (and the tokens of every context) resolve; an instance context reads no number values until instances interpolate them (M9). M7 plan § 4: M7.13."
