summary = "mark (Mark to Base Positioning). Trigger: Base glyphs carry anchors without underscore (top, bottom) and combining marks carry the matching underscore anchors (_top, _bottom). Generated: Built at export only and never listed in the Features tab: mark classes per anchor name and mark-to-base lookups from the anchor positions of each master or instance. Mark glyphs get zero advance width at export."
ref = "Appendix › Automatic Feature Generation"
status = "handbook"
notes = "Moved from M8 by the M6 plan, which the owner accepted (docs/plans/M6.md § 7 question 2 (b)): package M6.17 ports fontc's mark writer (`fontbe/src/features/marks.rs`) and GDEF rules to write the mark feature at export from the propagated anchors. Contextual anchors, the zero advance width of marks and hand-written mark features stay in M8. Documented, not yet observed. Built in M6.17 (`compile.markFeatureWriter`)."

