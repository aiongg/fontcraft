[[behavior]]
id = "autoFeature.ccmp"
area = "features"
milestone = "M8"
summary = "ccmp (Glyph Composition and Decomposition). Trigger: Many constellations across scripts. Documented example: i and j, their dotless forms idotless and jdotless, and combining marks that sit on top. Generated: For the Latin case, a lookup that swaps the dotted letter for its dotless form when a top mark follows; other scripts add their own lookups, which are not documented."
ref = "Appendix › Automatic Feature Generation"
status = "handbook"
notes = "The reference's stored output in the corpus (5 sources): a lookup `ccmp_DFLT_1` with `lookupflag 0;` and ligatures of stacked marks (`sub brevecomb acutecomb by brevecomb_acutecomb;`), and lookups `ccmp_Other_N` with an inline `@CombiningTopAccents = [...]`, `lookupflag UseMarkFilteringSet @CombiningTopAccents;` and `sub i' @CombiningTopAccents by idotless;` (M8 planning pass). Generated by `features::auto::ccmp`; against the 5 automatic ccmp entries of the corpus: Markow (version 4) and Oswald-glyph-categories (version 3.2) match; Oswald-Italic (version 3.2) differs only in naming its dotless lookup `ccmp_Other_1`; Oswald_Heavy (version 1) and fontc's Fea_Feature fixture hold older forms (a `[i j]` class rule, the `@Markscomb` case-mark lookups) or hand-edited code."
guesses = [
  "Latin ccmp is generated in the corpus's form: mark-ligature lookup first, then the dotless lookups with the top-accent filtering set; scripts other than Latin get no ccmp until a source shows their form.",
  "Lookups are numbered `ccmp_DFLT_1`, `ccmp_DFLT_2` in that order, as the newest corpus sources name a lone mark-ligature or dotless lookup `ccmp_DFLT_1`; Update in the reference app on a font with both would settle it.",
  "`@CombiningTopAccents` holds the encoded marks of canonical combining class 230, sorted by name, which matches every stored list in the corpus; a font with an unencoded top mark in the reference app would settle whether anchors count too.",
  "The Latin split lookup `ccmp_latn_1` (fi, fl, the lj, nj and dž digraphs into their letters, in a fixed order) is kept from a version 3 source, as no newer source has those glyphs; Update in the reference app on a font with fi would settle it.",
]
observe = [
  "In F1 (Latin features), press Update in Font Info › Features and copy the code of the ccmp entry: compare it with FontCraft's generator for the same font, or note that no ccmp entry is created.",
  "In F3 (Devanagari), press Update in Font Info › Features and copy the code of the ccmp entry: compare it with FontCraft's generator for the same font, or note that no ccmp entry is created.",
]

[[behavior]]
