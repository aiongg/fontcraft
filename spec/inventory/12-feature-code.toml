# Feature inventory: OpenType feature code editor, tokens, extensions and automatic features
# Sources: Glyphs 4 Handbook, chapter "Feature Code" (https://handbook.glyphsapp.com/feature-code/);
#          chapter "Font Info", section "Features" (https://handbook.glyphsapp.com/font-info/);
#          "Appendix": Text Tokens, Regular Expressions, URL Scheme, Custom Feature Code Snippets,
#          Automatic Feature Generation (https://handbook.glyphsapp.com/appendix/);
#          fea-rs (refs/fontc/fea-rs, MIT OR Apache-2.0) for how the open compiler treats the same extensions.
# Date: 2026-10-07
#
# Scope note. The Features tab itself (panel `fontInfo.features`, the `font.features.*` commands for
# adding, removing, editing, updating and compiling entries, snippets, stylistic set names, and the
# `fontInfo.features.*` behaviours) is inventoried in 06-font-info.toml. Regex search behaviour of the
# individual fields is in 05-font-view.toml, kerning-group classes in 08-spacing-kerning.toml and the
# Edit View feature preview in 03b-edit-view-display.toml. This file adds only what those files lack:
# the remaining editor popovers and queries, the token grammar, the syntax extensions, conditional and
# variable feature code, the per-tag automatic feature rules, text tokens, regex syntax, the URL scheme
# and snippet files. Command ids here continue the `font.features.*` prefix used there.
#
# All text is our own wording. Rows marked `inferred` are FontCraft design decisions or assumptions
# that the handbook does not state; rows marked `docs` rest on fea-rs documentation and tests.

# ----------------------------------------------------------------------------
# Panels
# ----------------------------------------------------------------------------

[[panel]]
id = "fontInfo.featureAutocomplete"
label = "Autocomplete suggestions"
location = "window"
controls = [
  "list of matching glyph names, class names or lookup names",
  "Up/Down to move, Return to accept",
  "list narrows as more characters are typed",
]
area = "features"
milestone = "M8"
summary = "Suggestion menu that appears while a glyph name, class name or lookup name is being typed in the code editor, for example after `sub` or after `lookup`."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"
notes = "Documented, not yet observed."

[[panel]]
id = "fontInfo.featureNamePreview"
label = "Glyph and class preview"
location = "window"
controls = [
  "rendered glyph for a glyph name",
  "list of member glyphs for a class name",
]
area = "features"
milestone = "M8"
summary = "Popover opened by Option-clicking a glyph name or class name in the code editor: shows the glyph, or for a class all member glyphs."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"
notes = "Documented, not yet observed."

[[panel]]
id = "fontInfo.featureTokenPreview"
label = "Token value preview"
location = "window"
controls = [
  "computed number for number-value and glyph-property tokens",
  "list of matching glyphs for predicate tokens",
]
area = "features"
milestone = "M8"
summary = "Popover opened by Option-clicking a token in the code editor: a number value or glyph property token shows its computed value, a predicate token shows every glyph it matches."
ref = "Feature Code › Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[panel]]
id = "fontInfo.featureErrorDetails"
label = "Feature error details"
location = "window"
controls = [
  "expanded error description",
  "Fix button when a fix is suggested (wrench icon)",
]
area = "features"
milestone = "M8"
summary = "Opened by clicking an inline error icon in the code editor: gives the long form of the compile error and, for errors marked with a wrench, a Fix button that applies the suggested correction."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"
notes = "Documented, not yet observed."

[[panel]]
id = "fontInfo.featureSnippetsMenu"
label = "Feature snippets menu"
location = "window"
controls = [
  "built-in snippets, including the automatic-code placeholder",
  "one group per user snippet file",
  "Show Snippet Folder",
]
area = "features"
milestone = "M8"
summary = "Menu behind the snippets button at the bottom right of the Features tab. Choosing a snippet inserts its code into the editor; Show Snippet Folder reveals the folder where user snippet files live."
ref = "Appendix › Custom Feature Code Snippets"
status = "handbook"
notes = "Documented, not yet observed."

# ----------------------------------------------------------------------------
# Commands
# ----------------------------------------------------------------------------

[[command]]
id = "font.features.reorder"
label = "Reorder Entries"
menu = []
shortcut = ""
kind = "engine"
params = "{font?, kind, order: [names]}"
area = "features"
milestone = "M8"
summary = "Changes the order of entries within one sidebar group; the order of features sets the order of feature blocks in the generated file and the expected order of chained name suffixes. Dragging in the sidebar is assumed; the handbook only states that the order matters."
ref = "Font View › Glyph Naming Rules; Font Info › Features › Editing Feature Code"
status = "inferred"
guesses = [
  "Entries are dragged within their group, and the order of features is the order of feature blocks and of chained suffixes; the running app would settle whether dragging exists.",
]
observe = [
  "In F1 (Latin features), drag a feature entry to another place in the sidebar: note whether it moves and whether the order is kept on save.",
]

[[command]]
id = "font.features.showErrorDetails"
label = "Show Error Details"
menu = []
shortcut = ""
kind = "ui"
params = "{kind, name: string, error: int}"
area = "features"
milestone = "M8"
summary = "Opens the expanded description of an inline error; triggered by clicking its error icon in the editor."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"
notes = "Documented, not yet observed."

[[command]]
id = "font.features.evaluateToken"
label = "Evaluate Token"
menu = []
shortcut = ""
kind = "engine"
params = "{font?, token: string, master?: id, instance?: id}"
area = "features"
milestone = "M8"
summary = "Query: evaluates one feature-code token and returns the number for number-value and glyph-property tokens or the glyph list for predicate tokens. Backs the Option-click token popover."
ref = "Feature Code › Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[command]]
id = "font.features.expandCode"
label = "Expand Feature Code"
menu = []
shortcut = ""
kind = "engine"
params = "{font?, target: {instance?: id}|{variable: true}, includeImplicit?: bool}"
area = "features"
milestone = "M8"
summary = "Query: returns the complete standard feature file for one export target after resolving tokens, conditional blocks, syntax extensions and, optionally, the implicit features. Not a reference command; needed so agents and the CLI can inspect what the compiler receives."
ref = "Feature Code › Tokens; Feature Code › Conditional Feature Code"
status = "inferred"

[[command]]
id = "font.features.showSnippetFolder"
label = "Show Snippet Folder"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "features"
milestone = "M8"
summary = "Reveals the folder in which user snippet files are placed."
ref = "Appendix › Custom Feature Code Snippets"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The snippet folder is `snippets/` inside FontCraft's configuration folder, created on first use; the reference's folder is inside its application support folder, which the running app would show.",
]
observe = [
  "In any font, choose Show Snippet Folder from the snippets menu: note which folder opens.",
]

[[command]]
id = "font.expandTextTokens"
label = "Expand Text Tokens"
menu = []
shortcut = ""
kind = "engine"
params = "{font?: path, text: string, master?: id, instance?: id}"
area = "font-info"
milestone = "M7"
summary = "Query: returns a text field value with every triple-brace token replaced, in the context of a font, master or instance. Not a reference command; lets agents preview name fields."
ref = "Appendix › Text Tokens"
status = "inferred"
notes = "Our own query. Returns the expanded text, the tokens that named nothing and the context used; `master` and `instance` take an id, a name or an index. M7 plan § 4: M7.13."

[[command]]
id = "url.open"
label = "Open URL"
menu = []
shortcut = ""
kind = "engine"
params = "{url: string}"
area = "automation"
milestone = "M13"
summary = "Parses a `fontcraft://` URL and runs the action it names; the entry point registered with the operating system. Proposed counterpart of the reference's URL scheme handler."
ref = "Appendix › URL Scheme"
status = "inferred"
notes = "Proposed by the reference handbook's URL Scheme page; FontCraft's scheme is `fontcraft://` (docs/plans/M13.md, M13.13). Registering the scheme with the operating system is packaging work for M14."

[[command]]
id = "url.show"
label = "Show Glyphs in New Tab"
menu = []
shortcut = ""
kind = "ui"
params = "{files: [{path: string, glyphs: [{glyph?: name, production?: name, layers?: [id]}]}]}"
area = "automation"
milestone = "M13"
summary = "Opens each listed file unless it is already open and adds a new Edit tab to it containing the listed glyph layers in order. Proposed target of `fontcraft://show/`."
ref = "Appendix › URL Scheme"
status = "inferred"
notes = "Proposed by the reference handbook's URL Scheme page; FontCraft's scheme is `fontcraft://` (docs/plans/M13.md, M13.13). Registering the scheme with the operating system is packaging work for M14."

# ----------------------------------------------------------------------------
# Behaviours: Feature editor
# ----------------------------------------------------------------------------

[[behavior]]
id = "featureEditor.classContent"
area = "features"
milestone = "M8"
summary = "A class entry holds only member names separated by spaces or line breaks, without `@name =` or brackets; predicate tokens may be mixed in with literal names. It is emitted as `@Name = [ ... ];`."
ref = "Font Info › Features › Editing Feature Code; Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "featureEditor.outputOrder"
area = "features"
milestone = "M8"
summary = "The generated feature file is assembled as classes, then prefixes, then features, each group in sidebar order, as both reference compilers assemble a source's code; the language systems sit in the automatic Languagesystems prefix. The handbook only says prefix code is placed before feature code."
ref = "Font Info › Features › Editing Feature Code"
status = "inferred"
notes = "Checked in the M8 planning pass: glyphsLib (`builder/features.py`) and fontc (`glyphs-reader`, `font.rs`) both write all classes, then all prefixes, then all features, separated by blank lines."
guesses = [
  "Classes come before prefixes, as both reference compilers assemble them; the expanded code of a reference export whose prefix uses a class would settle the reference app's own order.",
]
observe = [
  "In F1 (Latin features), add a prefix that uses a class, export, then export again with that class broken: note from the error position the order in which classes, prefixes and features are assembled.",
]

[[behavior]]
id = "featureEditor.featureBody"
area = "features"
milestone = "M8"
summary = "A feature entry stores only the body; the surrounding `feature tag { ... } tag;` wrapper is added when the file is assembled. Assumed from the examples, which show bare rules."
ref = "Font Info › Features › Editing Feature Code"
status = "inferred"
notes = "Both reference compilers wrap a feature's stored code in `feature tag { … } tag;`, and every corpus source stores bare bodies (M8 planning pass)."

[[behavior]]
id = "featureEditor.afdkoSyntax"
area = "features"
milestone = "M8"
summary = "Feature code is written in the AFDKO feature-file language plus the extensions listed under featureCode.* and the tokens under token.*; FontCraft lowers the extensions to standard syntax before handing the file to the compiler."
ref = "Font Info › Features › Manual Feature Code; Feature Code › (intro)"
status = "inferred"

# ----------------------------------------------------------------------------
# Behaviours: Implicit features
# ----------------------------------------------------------------------------

[[behavior]]
id = "implicit.markerMissing"
area = "features"
milestone = "M8"
summary = "An explicit kern feature without a `# Automatic Code` line gets the generated kerning after its own code, as both reference compilers add the line at its end; an explicit mark, mkmk, abvm, blwm, curs or dist feature without the line gets none of that generated feature (the skip mode of `compile.featureWriterModes`). The handbook does not say."
ref = "Font Info › Features › Implicit Features"
status = "inferred"
notes = "Checked in the M8 planning pass: glyphsLib and fontc append `# Automatic Code` to a manual kern feature that lacks it; ufo2ft's and fontc's writers skip a generated feature the code already has."
guesses = [
  "Generated kerning follows a hand-written kern feature and a hand-written mark-family feature replaces the generated one, as glyphsLib and fontc do; a reference export of a font with a hand-written mark feature without the line would settle it.",
]
observe = [
  "In F6 (contextual anchors), add a mark feature with one hand-written rule and no `# Automatic Code` line, export and read GPOS: note whether the generated mark lookups remain.",
]

[[behavior]]
id = "implicit.markZeroWidth"
area = "features"
milestone = "M8"
summary = "Combining marks used for mark attachment are exported with zero advance width."
ref = "Appendix › Automatic Feature Generation"
status = "handbook"
notes = "Built by M2 (`compile.nonSpacingMarkWidth`): non-spacing marks get advance 0 in a static build, as both oracles do. M8 checks it again with feature code compiled."

# ----------------------------------------------------------------------------
# Behaviours: Tokens
# ----------------------------------------------------------------------------

[[behavior]]
id = "token.kinds"
area = "features"
milestone = "M8"
summary = "Feature-code tokens start with `$` and are replaced by text before compilation. Three kinds exist: number values (`$name`, `${expr}`), glyph properties (`${glyph:path}`) and glyph predicates (`$[...]`)."
ref = "Feature Code › Tokens"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A `$` inside a comment or a double-quoted string is left as it is, and any other `$` that starts no token is an error at it; a comment and a name string holding `$x` in a font exported from the reference app would settle it.",
]

[[behavior]]
id = "token.expansionTiming"
area = "features"
milestone = "M8"
summary = "Tokens are evaluated separately for each export target (static instance, variable font, preview master) just before compiling, never stored expanded in the source."
ref = "Feature Code › Tokens"
status = "inferred"
notes = "glyphsLib expands tokens per master before compiling (`TokenExpander`); fontc leaves number values to fea-rs and expands nothing else. FontCraft expands every token itself, so one source map covers all of them (M8 planning pass)."

[[behavior]]
id = "token.numberValue.simple"
area = "features"
milestone = "M8"
summary = "`$name` inserts the master number value called name, defined under Font Info > Masters > Number Values."
ref = "Feature Code › Number Value Tokens"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A master that stores no value for a number name reads 0; a source file whose master lacks one of the values, exported from the reference app, would settle it.",
]

[[behavior]]
id = "token.numberValue.interpolated"
area = "features"
milestone = "M8"
summary = "With several masters the inserted number is interpolated for the instance being built."
ref = "Feature Code › Number Value Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.numberValue.arithmetic"
area = "features"
milestone = "M8"
summary = "`${name*2}` evaluates an expression with +, -, * and /. The number value name must come first in the expression."
ref = "Feature Code › Number Value Tokens"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Expressions that do not start with the name (`${2*padding}`, `${(a+b)/2}`, literals only) are accepted, as the feature compiler and the reference library accept them; typing one in the reference app would show whether it refuses them.",
]

[[behavior]]
id = "token.numberValue.expressionDetails"
area = "features"
milestone = "M8"
summary = "Details the handbook leaves open: fea-rs, which implements this token, accepts several operators and numeric literals (including decimals and negatives) in one expression, gives * and / precedence over + and -, allows spaces, and rounds the result to an integer. FontCraft follows that."
ref = "fea-rs test-data/parse-tests/good/glyphsapp_number_value.fea; Feature Code › Number Value Tokens"
status = "docs"
guesses = [
  "Results are rounded half away from zero, as fea-rs rounds, where glyphsLib truncates, and division by zero is a compile error at the token; an expression giving 2.5 exported from the reference app would settle the rounding.",
]
observe = [
  "In F5 (tokens), use `${tracking/4}` where it gives 2.5, export and read GPOS: note how the value was rounded.",
]

[[behavior]]
id = "token.numberValue.variable"
area = "features"
milestone = "M9"
summary = "For a variable font a number token becomes a value that varies with the master locations instead of a single number; fea-rs resolves the token to a per-location map for this purpose."
ref = "fea-rs src/compile/glyphsapp_syntax_ext.rs; Feature Code › Number Value Tokens"
status = "docs"

[[behavior]]
id = "token.numberValue.unknownName"
area = "features"
milestone = "M8"
summary = "A token naming a number value that no master defines is a compile error reported at the token. Assumed; the handbook does not say."
ref = "Feature Code › Number Value Tokens"
status = "inferred"
notes = "glyphsLib stops the build with an error naming the token (`builder/tokens.py`); fea-rs reports an error at the token. FontCraft reports a compile error at the token, mapped to its entry (M8 planning pass)."

[[behavior]]
id = "token.numberValue.inspect"
area = "features"
milestone = "M8"
summary = "Option-clicking a number value token shows the value it currently evaluates to."
ref = "Feature Code › Number Value Tokens"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Option-click evaluates the token for the master of the active Edit View tab, else the first master; Option-clicking a token in a two-master font with the second master showing in the reference app would settle it.",
]
observe = [
  "In F5 (tokens), with the second master showing in Edit View, Option-click `$tracking` in a feature: note which master's value is shown.",
]

[[behavior]]
id = "token.glyphProperty.syntax"
area = "features"
milestone = "M8"
summary = "`${glyphName:property}` inserts a number read from a glyph's layer; property is a dot-separated path."
ref = "Feature Code › Glyph Property Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.glyphProperty.metrics"
area = "features"
milestone = "M8"
summary = "Metric properties are width, LSB, RSB, TSB and BSB."
ref = "Feature Code › Glyph Property Tokens"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "LSB, RSB, TSB and BSB are measured as the spacing commands measure them (slanted back in an italic master), and on a layer without an outline they are an error at the token; Option-clicking `${space:LSB}` and the token of an italic glyph in the reference app would settle both.",
]

[[behavior]]
id = "token.glyphProperty.anchors"
area = "features"
milestone = "M8"
summary = "Anchor coordinates are read as anchors.<name>.x and anchors.<name>.y, for example `${h:anchors.top_tall.x}` inside an `<anchor ...>`."
ref = "Feature Code › Glyph Property Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.glyphProperty.arithmetic"
area = "features"
milestone = "M8"
summary = "The same arithmetic as number tokens is allowed after the property: `${comma:RSB*3}`."
ref = "Feature Code › Glyph Property Tokens"
status = "handbook"
notes = "Documented, not yet observed. Inside a property token a name reads the glyph's property first and a number value otherwise, as glyphsLib does (`builder/tokens.py`)."

[[behavior]]
id = "token.glyphProperty.layerChoice"
area = "features"
milestone = "M8"
summary = "The value comes from the glyph's layer for the master or interpolated instance being compiled. Assumed by analogy with number values; other key paths than metrics and anchors are not documented."
ref = "Feature Code › Glyph Property Tokens"
status = "inferred"
notes = "glyphsLib reads the glyph's layer of the master being built and any layer attribute by name; an unknown property or a missing anchor stops the build (`builder/tokens.py`). fea-rs has no glyph property tokens."
guesses = [
  "Only the documented properties (width, LSB, RSB, TSB, BSB, anchors.<name>.x and .y) are accepted and any other is an error naming it; Option-clicking a token with another layer property in the reference app would show what else exists.",
]
observe = [
  "In F5 (tokens), Option-click `${b:bounds}` and `${b:LSB}` in a feature: note the values shown and whether other layer properties are offered.",
]

[[behavior]]
id = "token.glyphProperty.inspect"
area = "features"
milestone = "M8"
summary = "Option-clicking a glyph property token shows its value."
ref = "Feature Code › Glyph Property Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.predicate.syntax"
area = "features"
milestone = "M8"
summary = "`$[predicate]` expands to the names, separated by spaces, of all glyphs for which the predicate is true."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed. A token ends at the `]` that closes it outside quoted text, so `$[name matches \"[a-z]\"]` is one token (`features::tokens_predicate::token_len`); glyphsLib ends it at the first `]`."

[[behavior]]
id = "token.predicate.inClassEntry"
area = "features"
milestone = "M8"
summary = "Inside a class entry a predicate token stands directly among literal names: `hyphen endash $[category == \"Number\"]`."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.predicate.inCode"
area = "features"
milestone = "M8"
summary = "In prefix and feature code the token must sit inside class brackets: `@Minuscule = [$[case == lower]];`."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed. `features::tokens_predicate::check_placement` refuses a token in a prefix or feature that is not inside class brackets; comments, quoted text and other tokens are skipped when the brackets are counted."

[[behavior]]
id = "token.predicate.boolean"
area = "features"
milestone = "M8"
summary = "Boolean glyph properties are compared with true or false: `isAligned == false`, `hasHints == true`, `isColorGlyph == false`."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed. Also accepted: hasPostScriptHints, hasTrueTypeHints, hasCorners, hasComponents, hasAnnotations, hasSpecialLayers, isAnyColorGlyph, isAppleColorGlyph, isSVGColorGlyph, isFullColorGlyph, isColorPaletteGlyph, isSmartGlyph, locked; yes and no stand for true and false; a yes-or-no attribute alone means `== true`."
guesses = [
  "isAligned holds when every master layer has a component placed automatically (a forced or horizontal component, or one left to the usual rule on a layer without paths), with the font setting off; a composite with one master unaligned in the reference app would settle it.",
  "hasHints counts stem and TrueType hints on any layer and not corner components, caps, brushes or segments; a glyph with only a corner component in the reference app would settle it.",
  "isColorGlyph holds for glyphs with colour palette layers only, and isAnyColorGlyph for every kind of colour layer; an SVG colour glyph in the reference app would settle it.",
]

[[behavior]]
id = "token.predicate.numeric"
area = "features"
milestone = "M8"
summary = "Numeric properties are compared with numbers: `countOfLayers > 2`, `countOfUnicodes == 1`. Only == and > appear in the handbook; <, <=, >=, != are assumed."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.predicate.colorIndex"
area = "features"
milestone = "M8"
summary = "`colorIndex == N` tests the glyph's colour label by its number."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.predicate.case"
area = "features"
milestone = "M8"
summary = "`case == X` compares against the bare words noCase, upper, lower, smallCaps, minor or other."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.predicate.direction"
area = "features"
milestone = "M8"
summary = "`direction == X` compares against the bare words LTR, BIDI or RTL."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.predicate.string"
area = "features"
milestone = "M8"
summary = "String properties (name, script, category, also note) are compared with quoted strings using == , endswith or contains: `name endswith \".tf\"`, `script == \"armenian\"`, `category == \"Mark\"`."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "token.predicate.stringOperators"
area = "features"
milestone = "M8"
summary = "Further operators accepted by fea-rs for this syntax: =, != and <> , beginswith, single-quoted strings, and case-insensitive operator keywords. Listed there but rejected: matches and like."
ref = "fea-rs test-data/parse-tests/good/glyphsapp_predicate.fea"
status = "docs"
notes = "FontCraft expands every predicate before fea-rs sees the code, so it also accepts `like` (`*` and `?` wildcards over the whole value), `matches` (a regular expression over the whole value), `=<` and `=>`, `in {…}` lists and `between {low, high}`, as Apple's predicate format has them. glyphsLib finds a `matches` expression anywhere in the value and refuses `=>`."

[[behavior]]
id = "token.predicate.keyPaths"
area = "features"
milestone = "M8"
summary = "Nested data is reached with dotted paths: `layer.anchors.center.y > 250`, `layer.maxX > 520`."
ref = "Feature Code › Glyph Predicate Tokens"
status = "handbook"
notes = "Documented, not yet observed. Layer paths read the target's master (Font View: the shown master): layer.width, layer.minX, layer.maxX, layer.minY, layer.maxY (the outline with components resolved and curve extremes included; none for an empty layer), layer.LSB, layer.RSB, layer.isAligned, layer.colorIndex, layer.hasAnnotations, layer.countOfPaths, layer.countOfComponents, layer.countOfAnchors, layer.anchors.<name>.x and .y. Glyph attributes besides the handbook's: productionName (also production), unicode (upper-case hexadecimal), string, sortName, description, the four kerning groups, the six metrics keys, countOfTags, countOfPartsSettings. Any other path is an error naming it."

[[behavior]]
id = "token.predicate.tags"
area = "features"
milestone = "M8"
summary = "Membership uses `in`: `\"draft\" in tags` is true for glyphs that carry that tag."
