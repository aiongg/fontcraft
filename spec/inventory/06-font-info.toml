[[behavior]]
id = "fontInfo.features.editingKeys"
area = "features"
milestone = "M8"
summary = "Editing keys of the feature code editor: Cmd+/ comments or uncomments the selected lines, Tab and Shift+Tab indent and outdent a selection over more than one line, Cmd+] and Cmd+[ indent and outdent the caret's lines, Return keeps the line's indentation, and the bracket matching the one beside the caret is marked."
ref = "Font Info › Features"
status = "inferred"
notes = "Not in the handbook. FontCraft: crates/ui/src/panels/font_info/code_editor.rs (M8.27). The keys edit the text as typed; the code is stored when the field loses the keyboard, as typing is. Indentation is one tab; outdent removes a tab or up to four spaces. Tab without a selection over lines moves the keyboard on, so the field never traps it; the arrows keep moving the caret. Comments are `# ` after a line's indentation; a selection whose non-blank lines all start with `#` loses it. Bracket matching pairs (), [] and {}, looking at most 100,000 characters away."
guesses = [
  "Cmd+/ toggles `#` comments line by line.",
  "Tab indents only a selection that spans lines; with a caret it moves the keyboard to the next control.",
  "Indentation is one tab, as the generated code is written.",
]
observe = [
  "In F1 (Latin features), select three lines in the feature code editor and press Cmd+/, then Tab and Shift+Tab: note what changes. Put the caret after a `{` and note whether its `}` is marked.",
]
