# Source: Glyphs 4 Handbook, chapter "Font Info" (https://handbook.glyphsapp.com/font-info/)
#   sections: Font, Masters, Exports, Features, Other Settings, Notes.
# Source-file key names (rows and fields marked "docs"): GlyphsSDK,
#   refs/GlyphsSDK/GlyphsFileFormat/GlyphsFileFormatv3.md and GlyphsFileFormatv4.md.
# Date: 2026-10-07
#
# Scope notes
# - [[parameter]] rows here cover only the built-in fields of the Font / Masters / Exports tabs.
#   Their names carry a scope prefix ("font.", "master.", "instance.") so they cannot collide with
#   the custom parameters of the appendix (several of which share a bare name with a built-in
#   field, e.g. unitsPerEm).
# - The feature language itself, text tokens, the custom parameter catalogue and the user settings
#   are inventoried from their own chapters; rows here cover only the Font Info window.
# - Command targets are explicit so the commands work headless: masters and instances are addressed
#   by id, name or index; "selection" is only the default when a UI is attached.

# ───────────────────────────── Window and shared row mechanics ─────────────────────────────

[[panel]]
id = "fontInfo"
label = "Font Info"
location = "window"
controls = [
  "tab bar: Font, Masters, Exports, Features, Other Settings, Notes",
  "Font / Masters / Exports: rows of fields grouped under bold headings",
  "plus button beside each bold heading: add a field or entry to that group",
  "minus button at the right of a row: delete the row",
  "Alt held: rows that show a plus button show a minus button instead",
  "row selection (click, Cmd+click for several)",
  "language menu and plus button on localizable fields",
]
area = "font-info"
milestone = "M7"
summary = "Per-document window holding the font-wide metadata, the masters, the exports (instances and variable font settings), the feature code, document settings and a note. One window per open font, split into six tabs."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. The Features tab is M8's (fontInfo.features); until M8 the tab shows the stored prefixes, classes and features read-only. M7 plan § 4: M7.15."
guesses = [
  "Font Info opens on the tab it last showed for that document, and on the Font tab the first time; opening it twice in the reference app settles it.",
  "One Font Info window shows the active document, and switching documents shows the other document's information in it; opening Font Info in two documents of the reference app settles whether each keeps a window of its own.",
]
observe = [
  "In font A (m7-one), open Font Info, switch to the Exports tab, close the window and open it again: note which tab it opens on.",
]

[[command]]
id = "font.info"
label = "Font Info…"
menu = ["File"]
shortcut = "Cmd+I"
kind = "ui"
params = "{tab?: 'font'|'masters'|'exports'|'features'|'other'|'notes'}"
area = "font-info"
milestone = "M7"
summary = "Opens the Font Info window of the current font, optionally on a given tab. The Info button at the top-left of the main window runs the same command."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.15."

