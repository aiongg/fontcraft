status = "handbook"

[[behavior]]
id = "fontInfo.grid.subdivision"
area = "guides-metrics"
milestone = "M3"
summary = "Subdivision divides the grid step: the effective step is spacing divided by subdivision. Spacing 100 with subdivision 5 gives a 20-unit grid, and spacing 1 with subdivision 10 gives coordinates with one decimal."
ref = "Font Info › Other Settings › Grid Spacing & Subdivision"
status = "handbook"

[[behavior]]
