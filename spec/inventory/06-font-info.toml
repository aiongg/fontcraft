status = "inferred"
notes = "Not in the handbook. FontCraft: crates/ui/src/panels/font_info/code_find.rs (M8.27). The matches come from font.features.find with the editor's text as typed; matches in the shown entry are underlined in the accent colour and the current one is marked. Next and Previous select the following or preceding match in the code field and wrap at the end; in the all-entries scope they go on to the next or previous entry with matches and select it. Return in the query field is Next. Cmd+G and Shift+Cmd+G in the code field are Next and Previous. The keyboard stays where it is, so a match selected while the query field has it is marked by its underline only, and the field does not scroll to it yet. Replace runs font.features.replace on the selected match with the text as typed (with no match selected it acts as Next), Replace All on the scope; the close button hides the bar. Cmd+F with a selection inside one line puts it in the query."
guesses = [
