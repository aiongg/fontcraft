[[command]]
id = "font.features.check"
label = "Check Feature Code"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, index?: integer, code: string, master?: id|name}"
area = "features"
milestone = "M8"
summary = "Compiles the font's feature code with one entry's code replaced by a draft and returns the errors found in it, placed in the draft, without changing the font. The Features tab checks the code as it is typed."
ref = "Font Info › Features › Manual Feature Code"
status = "inferred"
notes = "A query (M8.25). The draft is at most 1 MB, the most one entry may hold; the code is compiled on its own, without generated kerning and marks, and the answer has the shape of font.features.listErrors without fixes. The Features tab runs it on a worker thread (at once on the web) once the typed code has stood for half a second, one check at a time, and drops an answer whose draft is no longer the one typed. After setCode, Update and Update Entry the tab builds the preview fonts in the background and then runs font.features.compile, which takes that build. Measured on the corpus: on Inter Roman's largest feature entry (ss07, 9,530 bytes; 49 entries, 3,017 glyphs) a check takes 15.5 ms median of 5 runs in a release build (target 250 ms). With `targets` (M8.51) the draft is checked for the builds named; while code is typed the tab checks the current master only."
guesses = [
  "The Features tab checks the code as it is typed, half a second after the last keystroke; watching the error markers while typing a misspelt glyph name in the reference app would settle whether it checks before Compile and after what pause.",
  "Diagnostics stay valid while the compiler's input (assembled code, stored code, glyph order with code points, master) is unchanged, so a node move keeps them; moving a node after a compile with an error in the reference app would settle it.",
]
