[[command]]
id = "font.info.get"
label = "Get Font Info"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: 'font'|'master'|'instance', target?: id|name|index, keys?: [string]}"
area = "font-info"
milestone = "M7"
summary = "Reads Font Info fields as structured data: the font-wide fields, or the fields of one master or one export. Without keys it returns every built-in field, every added field with all its localizations, and the custom parameters of that scope."
ref = "Font Info"
status = "inferred"
own = true
notes = "Extends the M2 `font.info.get` (font scope, four keys) to the three scopes, the added fields with their languages and the custom parameters. M7 plan § 4: M7.3."

[[command]]
id = "font.info.set"
label = "Set Font Info"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: 'font'|'master'|'instance', targets?: [id|name|index], values: {key: value}}"
area = "font-info"
milestone = "M7"
summary = "Writes one or more built-in or added fields in a single undoable step. With several masters or instances as targets the same value is written to each, matching the multi-selection editing of the UI."
ref = "Font Info"
status = "inferred"
own = true
notes = "Extends the M2 `font.info.set` (four font keys) to every built-in and added field of the three scopes; unitsPerEm keeps its rule of changing the number only. M7 plan § 4: M7.3."
guesses = [
  "Setting a field the scope offers but the target lacks adds it, and a text sets a localizable field's default language; typing into an empty field row in the reference app settles it.",
]

[[command]]
id = "font.info.listFields"
