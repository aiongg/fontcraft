[[parameter]]
name = "font.familyName"
scope = ["font"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Family Name field. Names the exported fonts and groups them into one family in font menus; should use only ASCII letters, digits and spaces. Drives the export file name, name IDs 1, 3, 4 and 6, and in CFF fonts the FontName and FullName. Glyphs source key: familyName."
ref = "Font Info › Font › Family Name; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"
notes = "Stored by the model and kept by every source format since M1. Edited with font.info.set (M7.3); compiled into the names since M2."

[[parameter]]
name = "font.unitsPerEm"
scope = ["font"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Units per Em field: the number of coordinate units across the em square, 1000 in a new file. Editing the number alone leaves outlines and metrics untouched. Glyphs source key: unitsPerEm."
ref = "Font Info › Font › Units per Em; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"
notes = "Stored by the model and kept by every source format since M1. Edited with font.info.set (number only) and font.info.scaleToUnitsPerEm (M7.3, M7.4)."

[[parameter]]
name = "font.versionMajor"
scope = ["font"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Integer part of the Version field, 1 in a new file. Written together with the minor part to head.fontRevision and used for the version string in name ID 5. Glyphs source key: versionMajor."
ref = "Font Info › Font › Version; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"
notes = "Stored by the model and kept by every source format since M1. Edited with font.info.set (M7.3); compiled since M2."

[[parameter]]
name = "font.versionMinor"
scope = ["font"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Part of the Version field after the period, shown with three digits (1.000 in a new file) and changed by the stepper buttons. Glyphs source key: versionMinor."
ref = "Font Info › Font › Version; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"
notes = "Stored by the model and kept by every source format since M1. Edited with font.info.set and font.info.stepVersion (M7.3); compiled since M2."

[[parameter]]
name = "font.date"
scope = ["font"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Creation Date field: a date, time and time zone that export writes to both head.created and head.modified. Glyphs source key: date."
ref = "Font Info › Font › Creation Date; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"
notes = "Stored by the model and kept by every source format since M1. Edited with font.info.set and font.info.updateDate (M7.3); head.created since M2."

[[parameter]]
name = "font.properties"
scope = ["font"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "The optional General fields added with the plus button, each a key with either one value or a list of language/value pairs. The chapter names familyNames, postscriptFontName and postscriptFullName; the full catalogue comes from the appendix. Glyphs source key: properties (items with key and value or values)."
ref = "Font Info › Font › Family Name; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"
notes = "Stored by the model and kept by every source format since M1. Edited with the field commands (M7.3)."

[[parameter]]
name = "font.axes"
scope = ["font"]
kind = "list"
area = "interpolation"
milestone = "M9"
summary = "Ordered list of design axes, each defined by a name, a tag of four characters and a flag that marks it hidden. The list defines the dimensions of the designspace that master and instance coordinates refer to. Glyphs source key: axes (items with name, tag, hidden)."
ref = "Font Info › Font › Axes; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.customParameters"
scope = ["font"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "Ordered list of font-level custom parameters (name and value). A parameter that also exists on a master or an export is overridden there. Glyphs source key: customParameters."
ref = "Font Info › Font › Custom Parameters; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"
notes = "Stored by the model and kept by every source format since M1. Edited with font.customParameters.* (M7.2)."

[[behavior]]
id = "fontInfo.familyName.allowedCharacters"
area = "font-info"
milestone = "M7"
summary = "The Family Name should contain only A-Z, a-z, 0-9 and spaces; other characters can stop fonts from exporting or installing. The UI should warn rather than block, and point to the familyNames field for non-ASCII or localized family names."
ref = "Font Info › Font › Family Name"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.3 (warning in the result), M7.16 (shown under the field)."
guesses = [
  "Other characters are accepted with a warning, not refused; typing an ampersand or an accented letter in the reference app settles whether it warns, refuses or neither.",
]
observe = [
  "In font A (m7-one), type the family name `Café & Co`: note any warning, refusal or nothing.",
]

[[behavior]]
id = "fontInfo.familyName.derivedNames"
area = "compile"
milestone = "M7"
summary = "Export derives the file name and name IDs 1, 3, 4 and 6 from the Family Name, and for CFF-flavoured fonts also the CFF FontName and FullName. The postscriptFontName and postscriptFullName fields, when present, set those two values independently."
ref = "Font Info › Font › Family Name"
status = "handbook"
notes = "The compiler derives these names as fontc does (M2, crates/compile/src/info.rs); the postscriptFullNames property also sets the CFF FullName (M7 plan § 4: M7.8)."

[[behavior]]
id = "fontInfo.familyName.instanceOverride"
area = "font-info"
milestone = "M7"
summary = "An export that carries its own familyNames field uses that family name instead of the one on the Font tab."
ref = "Font Info › Font › Family Name; Font Info › Exports › Style Linking"
status = "handbook"
notes = "The compiler applies an instance's familyNames already (M2: properties are overlaid font, master, instance). M7 plan § 4: M7.8 (test)."

[[behavior]]
id = "fontInfo.unitsPerEm.limits"
area = "font-info"
milestone = "M7"
summary = "New files start at 1000 UPM. The format allows 16 to 16384; the handbook warns that some applications misbehave above 3000, Adobe InDesign and Illustrator above 5000, that CFF glyph widths become unreliable beyond 4096 UPM, and that no point coordinate may exceed plus or minus 32768."
ref = "Font Info › Font › Units per Em"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.3."
guesses = [
  "font.info.set refuses values outside 16–16384 and returns a warning above 3000, above 4096 (glyph widths of CFF-flavoured fonts, given whatever the outline flavour) and above 5000; the reference app settles whether it warns at all.",
]
observe = [
  "In font A (m7-one), type 3500 and then 6000 as Units per Em: note any warning or refusal for each.",
]

[[command]]
id = "font.info.scaleToUnitsPerEm"
label = "Scale Font to Units per Em"
menu = []
shortcut = ""
kind = "engine"
params = "{unitsPerEm: integer}"
area = "font-info"
milestone = "M7"
summary = "Sets a new UPM and scales the whole font by new/old so glyphs keep their apparent size; this is the double-arrow button beside the Units per Em field. The handbook says outlines scale with the UPM and does not list which other data (metrics, kerning, anchors, guides, stems) is scaled."
ref = "Font Info › Font › Units per Em"
status = "handbook"
notes = "Documented, not yet observed. The same scaling serves the Scale to UPM parameter at export (M7 plan § 4: M7.4)."
guesses = [
  "Scaling by new/old covers every layer of every glyph (paths, component offsets but not component scales, anchors, guides, hints, backgrounds, special layers), the advance widths and vertical metrics, master metric positions and zone sizes, stems, kerning, global guides, and the custom parameters whose catalogue entry is measured in units (typoAscender, hheaAscender, winAscent, underlinePosition and the like); metrics keys, italic angles and percentages are kept; the reference app on a font holding all of these settles the list.",
  "Scaled coordinates are rounded to the font's grid (none when the grid spacing is 0), and a scale that would put a coordinate beyond ±32768 is refused; the reference app settles the rounding.",
  "A placed image keeps its place over the scaled outline (its position is scaled and its own scale multiplied by the factor), stroke widths and the positions and widths of hints not attached to nodes are scaled, and named number values are kept; the reference app on a font holding these settles it.",
  "Shapes the model keeps as stored (shape groups, paths with node kinds it cannot read) are not scaled, and a font with a locked glyph is refused naming the glyph, as every other edit of a locked glyph is; the reference app settles whether it scales locked glyphs.",
]
observe = [
  "In font A (m7-one), click the double arrow beside Units per Em, scale to 2048 and save: note which of outlines, component offsets, anchors, the guide, kerning, metrics, zones, stems and typoAscender changed, and how half units were rounded.",
]

[[behavior]]
id = "fontInfo.unitsPerEm.resizeTrick"
area = "font-info"
milestone = "M7"
summary = "Because typing a new UPM does not touch outlines while the scale button does, lowering the UPM by typing and then scaling back to the original value enlarges every glyph; raising it first and scaling back shrinks them. Both steps must stay separate undoable actions."
ref = "Font Info › Font › Units per Em"
