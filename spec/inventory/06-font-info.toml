[[behavior]]
id = "fontInfo.rows.valueEditors"
area = "font-info"
milestone = "M7"
summary = "A custom parameter row edits its value with the control its kind calls for: a check box for yes or no, a number field, a text field, a field of several lines for a list, a menu for a value from a fixed list, check boxes for a list of such values, a menu of the font's masters for a parameter that names a master, and an Edit button for a value with a dialog of its own (OS/2 bits, PANOSE, TTFZones, TTFStems and the others). A value the parameter's check refuses is not stored, and the check's message shows under the row."
ref = "Font Info › Font › Custom Parameters"
status = "inferred"
notes = "Not documented and not yet observed. M7 plan: M7.22, `crates/ui/src/panels/font_info/param_value.rs` and `rows.rs`; the editor of each row is chosen in `crates/ui/src/app/models/font_info.rs` from the catalogue's kind and value list. A typed value goes through the check of font.customParameters.set (`fontcraft_fontinfo::value::check`) before anything is sent, so the row and the command refuse the same values with the same words; a dictionary or localized value is checked as a whole when one of its fields changes. Every edit is one font.customParameters.set. A master's TTFZones and TTFStems rows open their editors with window.ttfZones and window.ttfStems on that master."
guesses = [
  "Variable Font Origin, Get Hints From Master and Link Metrics With Master are menus of the font's masters that store the master's id; the reference app's row and the file it writes settle it.",
  "A refused value's message stays under its row until the next edit; the reference app with vendorID ABCDE settles it.",
  "A value from a fixed list of whole numbers (Post Table Type) is stored as a number, any other as text; the file the reference app writes after picking one settles it.",
]
observe = [
  "In font A (m7-one), add Variable Font Origin and Get Hints From Master on the Font tab and Link Metrics With Master on a master: note whether each is a menu of masters or a text field, and what the file stores after picking one.",
