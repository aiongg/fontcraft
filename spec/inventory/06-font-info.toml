id = "fontInfo.unitsPerEm.resizeTrick"
area = "font-info"
milestone = "M7"
summary = "Because typing a new UPM does not touch outlines while the scale button does, lowering the UPM by typing and then scaling back to the original value enlarges every glyph; raising it first and scaling back shrinks them. Both steps must stay separate undoable actions."
ref = "Font Info › Font › Units per Em"
status = "handbook"
notes = "Documented, not yet observed. `font.info.set` with unitsPerEm changes the value alone and `font.info.scaleToUnitsPerEm` scales, each its own undo step (engine test `font_info_unitsperem_resize_trick_is_two_undo_steps`)."

[[behavior]]
id = "fontInfo.unitsPerEm.exportOverrides"
area = "compile"
milestone = "M7"
summary = "Two custom parameters change the UPM of exported files only: Scale to UPM on an instance rescales outlines and metrics to the new value, while unitsPerEm changes the value without scaling anything."
ref = "Font Info › Font › Units per Em"
status = "handbook"
notes = "Documented, not yet observed. The unitsPerEm parameter is read by the compiler since M2; Scale to UPM is M7.4."

