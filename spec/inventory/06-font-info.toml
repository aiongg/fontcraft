# Source: Glyphs 4 Handbook, chapter "Font Info" (https://handbook.glyphsapp.com/font-info/)
#   sections: Font, Masters, Exports, Features, Other Settings, Notes.
# Source-file key names (rows and fields marked "docs"): GlyphsSDK,
#   refs/GlyphsSDK/GlyphsFileFormat/GlyphsFileFormatv3.md and GlyphsFileFormatv4.md.
# Date: 2026-10-07
#
# Scope notes
# - [[parameter]] rows here cover only the built-in fields of the Font / Masters / Exports tabs.
#   Their names carry a scope prefix ("font.", "master.", "instance.") so they cannot collide with
#   the custom parameters of the appendix (several of which share a bare name with a built-in
#   field, e.g. unitsPerEm).
# - The feature language itself, text tokens, the custom parameter catalogue and the user settings
#   are inventoried from their own chapters; rows here cover only the Font Info window.
# - Command targets are explicit so the commands work headless: masters and instances are addressed
#   by id, name or index; "selection" is only the default when a UI is attached.

# ───────────────────────────── Window and shared row mechanics ─────────────────────────────

[[panel]]
id = "fontInfo"
label = "Font Info"
location = "window"
controls = [
  "tab bar: Font, Masters, Exports, Features, Other Settings, Notes",
  "Font / Masters / Exports: rows of fields grouped under bold headings",
  "plus button beside each bold heading: add a field or entry to that group",
  "minus button at the right of a row: delete the row",
  "Alt held: rows that show a plus button show a minus button instead",
  "row selection (click, Cmd+click for several)",
  "language menu and plus button on localizable fields",
]
area = "font-info"
milestone = "M7"
summary = "Per-document window holding the font-wide metadata, the masters, the exports (instances and variable font settings), the feature code, document settings and a note. One window per open font, split into six tabs."
ref = "Font Info"
status = "handbook"

[[command]]
id = "font.info"
label = "Font Info…"
menu = ["File"]
shortcut = "Cmd+I"
kind = "ui"
params = "{tab?: 'font'|'masters'|'exports'|'features'|'other'|'notes'}"
area = "font-info"
milestone = "M7"
summary = "Opens the Font Info window of the current font, optionally on a given tab. The Info button at the top-left of the main window runs the same command."
ref = "Font Info"
status = "handbook"

[[command]]
id = "font.info.selectTab"
label = "Select Font Info Tab"
menu = []
shortcut = ""
kind = "ui"
params = "{tab: 'font'|'masters'|'exports'|'features'|'other'|'notes'}"
area = "font-info"
milestone = "M7"
summary = "Switches the open Font Info window to one of its six tabs. The handbook only describes clicking the tabs; no shortcut is given."
ref = "Font Info"
status = "inferred"

[[command]]
id = "font.info.get"
label = "Get Font Info"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: 'font'|'master'|'instance', target?: id|name|index, keys?: [string]}"
area = "font-info"
milestone = "M7"
summary = "Reads Font Info fields as structured data: the font-wide fields, or the fields of one master or one export. Without keys it returns every built-in field, every added field with all its localizations, and the custom parameters of that scope."
ref = "Font Info"
status = "inferred"

[[command]]
id = "font.info.set"
label = "Set Font Info"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: 'font'|'master'|'instance', targets?: [id|name|index], values: {key: value}}"
area = "font-info"
milestone = "M7"
summary = "Writes one or more built-in or added fields in a single undoable step. With several masters or instances as targets the same value is written to each, matching the multi-selection editing of the UI."
ref = "Font Info"
status = "inferred"

[[command]]
id = "font.info.listFields"
label = "List Available Fields"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', query?: string}"
area = "font-info"
milestone = "M7"
summary = "Returns the fields that the plus button beside a General heading offers for the given scope, each with its key, whether it is localizable and whether it is already present."
ref = "Font Info"
status = "inferred"

[[command]]
id = "font.info.addField"
label = "Add Field"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], key: string, value?: any, language?: string}"
area = "font-info"
milestone = "M7"
summary = "Adds an optional field row (for example familyNames, postscriptFontName or postscriptFullName) under the General heading of the Font, Masters or Exports tab. In the UI this is the plus button beside the heading followed by picking the field and pressing Add."
ref = "Font Info; Font Info › Font › Family Name"
status = "handbook"

[[command]]
id = "font.info.removeField"
label = "Remove Field"
menu = []
shortcut = "Cmd+Delete"
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], keys: [string]}"
area = "font-info"
milestone = "M7"
summary = "Deletes the selected field rows. Reached through the minus button at the right of a row (shown with Alt held on rows that normally show a plus button) or by selecting rows and pressing the shortcut."
ref = "Font Info"
status = "handbook"

[[command]]
id = "font.info.setLocalizedValue"
label = "Set Localized Value"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', target?: id|name|index, key: string, language: string, value: string}"
area = "font-info"
milestone = "M7"
summary = "Adds or changes one language entry of a localizable field. In the UI the plus button beside the field adds another localization row and the language menu picks its language."
ref = "Font Info"
status = "handbook"

[[command]]
id = "font.info.removeLocalizedValue"
label = "Remove Localized Value"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', target?: id|name|index, key: string, language: string}"
area = "font-info"
milestone = "M7"
summary = "Removes one language entry from a localizable field, the counterpart of the minus button on a localization row."
ref = "Font Info"
status = "handbook"

[[command]]
id = "font.info.copyRows"
label = "Copy Rows"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', target?: id|name|index, keys?: [string]}"
area = "font-info"
milestone = "M7"
summary = "Returns the selected Font Info rows (fields, custom parameters) as a transferable value and, in the UI, puts them on the clipboard. The UI reaches it through the normal Edit > Copy (Cmd+C) while rows are selected, so it has no menu entry or shortcut of its own."
ref = "Font Info"
status = "handbook"

[[command]]
id = "font.info.pasteRows"
label = "Paste Rows"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], rows?: [row]}"
area = "font-info"
milestone = "M7"
summary = "Inserts previously copied rows into the current tab. The UI reaches it through Edit > Paste (Cmd+V); how a pasted row that already exists is merged, and whether pasting into another font or tab is allowed, is not documented."
ref = "Font Info"
status = "handbook"

[[behavior]]
id = "fontInfo.rows.plusAddsField"
area = "font-info"
milestone = "M7"
summary = "On the Font, Masters and Exports tabs every bold group heading carries a plus button that adds another field or entry to that group."
ref = "Font Info"
status = "handbook"

[[behavior]]
id = "fontInfo.rows.altRevealsMinus"
area = "font-info"
milestone = "M7"
summary = "A row normally shows a minus button at its right edge; rows that show a plus button there (localizable fields) swap it for the minus button while Alt is held."
ref = "Font Info"
status = "handbook"

[[behavior]]
id = "fontInfo.rows.selection"
area = "font-info"
milestone = "M7"
summary = "Clicking a row selects it and Cmd+click builds a selection of several rows. The selection is what Cmd+Delete, Copy and Paste act on."
ref = "Font Info"
status = "handbook"

[[behavior]]
id = "fontInfo.rows.localizable"
area = "font-info"
milestone = "M7"
summary = "A localizable field shows a language menu and a plus button; each added row holds the same field in another language chosen from the menu."
ref = "Font Info"
status = "handbook"

[[behavior]]
id = "fontInfo.general.textTokens"
area = "font-info"
milestone = "M7"
summary = "Fields under the General heading of the Font tab and of the Exports tab, and the stylistic set name fields, accept text tokens written in curly braces that are expanded at export. The token syntax is specified with the Text Tokens section."
ref = "Font Info › Font; Font Info › Exports; Font Info › Features › Naming Stylistic Sets"
status = "handbook"

# ───────────────────────────── Font tab ─────────────────────────────

[[panel]]
id = "fontInfo.font"
label = "Font"
location = "window"
controls = [
  "General heading with plus button (add optional fields such as familyNames, postscriptFontName, postscriptFullName)",
  "Family Name: text field",
  "Units per Em: number field with a double-arrow button that scales the whole font to a new UPM",
  "Version: major and minor number separated by a period, with stepper buttons for the minor part",
  "Creation Date: date and time field with an update button that sets it to now",
  "optional localizable fields: value field, language menu, plus button",
  "Axes heading with plus button; per axis: name field with predefined names, four-character tag field, Hidden checkbox",
  "Custom Parameters heading with plus button; one row per parameter with its value editor",
]
area = "font-info"
milestone = "M7"
summary = "First tab of Font Info: metadata shared by every exported font file, the design axes, and the font-level custom parameters."
ref = "Font Info › Font"
status = "handbook"

[[panel]]
id = "fontInfo.fieldPicker"
label = "Add Field"
location = "dialog"
controls = ["list of optional fields for the current tab", "Add button"]
area = "font-info"
milestone = "M7"
summary = "Picker opened by the plus button beside a General heading. The user selects one or more optional fields and confirms with Add; the fields appear as new rows."
ref = "Font Info › Font › Family Name"
status = "handbook"

[[parameter]]
name = "font.familyName"
scope = ["font"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Family Name field. Names the exported fonts and groups them into one family in font menus; should use only ASCII letters, digits and spaces. Drives the export file name, name IDs 1, 3, 4 and 6, and in CFF fonts the FontName and FullName. Glyphs source key: familyName."
ref = "Font Info › Font › Family Name; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.unitsPerEm"
scope = ["font"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Units per Em field: the number of coordinate units across the em square, 1000 in a new file. Editing the number alone leaves outlines and metrics untouched. Glyphs source key: unitsPerEm."
ref = "Font Info › Font › Units per Em; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.versionMajor"
scope = ["font"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Integer part of the Version field, 1 in a new file. Written together with the minor part to head.fontRevision and used for the version string in name ID 5. Glyphs source key: versionMajor."
ref = "Font Info › Font › Version; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.versionMinor"
scope = ["font"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Part of the Version field after the period, shown with three digits (1.000 in a new file) and changed by the stepper buttons. Glyphs source key: versionMinor."
ref = "Font Info › Font › Version; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.date"
scope = ["font"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Creation Date field: a date, time and time zone that export writes to both head.created and head.modified. Glyphs source key: date."
ref = "Font Info › Font › Creation Date; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.properties"
scope = ["font"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "The optional General fields added with the plus button, each a key with either one value or a list of language/value pairs. The chapter names familyNames, postscriptFontName and postscriptFullName; the full catalogue comes from the appendix. Glyphs source key: properties (items with key and value or values)."
ref = "Font Info › Font › Family Name; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.axes"
scope = ["font"]
kind = "list"
area = "interpolation"
milestone = "M9"
summary = "Ordered list of design axes, each defined by a name, a tag of four characters and a flag that marks it hidden. The list defines the dimensions of the designspace that master and instance coordinates refer to. Glyphs source key: axes (items with name, tag, hidden)."
ref = "Font Info › Font › Axes; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.customParameters"
scope = ["font"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "Ordered list of font-level custom parameters (name and value). A parameter that also exists on a master or an export is overridden there. Glyphs source key: customParameters."
ref = "Font Info › Font › Custom Parameters; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[behavior]]
id = "fontInfo.familyName.allowedCharacters"
area = "font-info"
milestone = "M7"
summary = "The Family Name should contain only A-Z, a-z, 0-9 and spaces; other characters can stop fonts from exporting or installing. The UI should warn rather than block, and point to the familyNames field for non-ASCII or localized family names."
ref = "Font Info › Font › Family Name"
status = "handbook"

[[behavior]]
id = "fontInfo.familyName.derivedNames"
area = "compile"
milestone = "M7"
summary = "Export derives the file name and name IDs 1, 3, 4 and 6 from the Family Name, and for CFF-flavoured fonts also the CFF FontName and FullName. The postscriptFontName and postscriptFullName fields, when present, set those two values independently."
ref = "Font Info › Font › Family Name"
status = "handbook"

[[behavior]]
id = "fontInfo.familyName.instanceOverride"
area = "font-info"
milestone = "M7"
summary = "An export that carries its own familyNames field uses that family name instead of the one on the Font tab."
ref = "Font Info › Font › Family Name; Font Info › Exports › Style Linking"
status = "handbook"

[[behavior]]
id = "fontInfo.unitsPerEm.limits"
area = "font-info"
milestone = "M7"
summary = "New files start at 1000 UPM. The format allows 16 to 16384; the handbook warns that some applications misbehave above 3000, Adobe InDesign and Illustrator above 5000, that CFF glyph widths become unreliable beyond 4096 UPM, and that no point coordinate may exceed plus or minus 32768."
ref = "Font Info › Font › Units per Em"
status = "handbook"

[[command]]
id = "font.info.scaleToUnitsPerEm"
label = "Scale Font to Units per Em"
menu = []
shortcut = ""
kind = "engine"
params = "{unitsPerEm: integer}"
area = "font-info"
milestone = "M7"
summary = "Sets a new UPM and scales the whole font by new/old so glyphs keep their apparent size; this is the double-arrow button beside the Units per Em field. The handbook says outlines scale with the UPM and does not list which other data (metrics, kerning, anchors, guides, stems) is scaled."
ref = "Font Info › Font › Units per Em"
status = "handbook"

[[behavior]]
id = "fontInfo.unitsPerEm.resizeTrick"
area = "font-info"
milestone = "M7"
summary = "Because typing a new UPM does not touch outlines while the scale button does, lowering the UPM by typing and then scaling back to the original value enlarges every glyph; raising it first and scaling back shrinks them. Both steps must stay separate undoable actions."
ref = "Font Info › Font › Units per Em"
status = "handbook"

[[behavior]]
id = "fontInfo.unitsPerEm.exportOverrides"
area = "compile"
milestone = "M7"
summary = "Two custom parameters change the UPM of exported files only: Scale to UPM on an instance rescales outlines and metrics to the new value, while unitsPerEm changes the value without scaling anything."
ref = "Font Info › Font › Units per Em"
status = "handbook"

[[command]]
id = "font.info.stepVersion"
label = "Step Minor Version"
menu = []
shortcut = ""
kind = "engine"
params = "{delta?: integer}"
area = "font-info"
milestone = "M7"
summary = "Raises or lowers the minor version by one step per click of the stepper beside the Version field (delta defaults to +1). Behaviour at the ends of the range is not documented."
ref = "Font Info › Font › Version"
status = "handbook"

[[behavior]]
id = "fontInfo.version.headAndNameId5"
area = "compile"
milestone = "M7"
summary = "Export writes major.minor to head.fontRevision and builds name ID 5 as 'Version <major>.<minor>' followed by a semicolon and the exporting application's own name and build. A versionString parameter replaces the generated string; some applications require it to start with 'Version <major>.<minor>'."
ref = "Font Info › Font › Version"
status = "handbook"

[[command]]
id = "font.info.updateDate"
label = "Update Creation Date"
menu = []
shortcut = ""
kind = "engine"
params = "{date?: iso8601}"
area = "font-info"
milestone = "M7"
summary = "Sets the Creation Date to the current date and time (or to the given timestamp when run headless), like the update button beside the field."
ref = "Font Info › Font › Creation Date"
status = "handbook"

[[behavior]]
id = "fontInfo.date.headCreatedModified"
area = "compile"
milestone = "M7"
summary = "The single date field feeds both the created and the modified timestamps of the head table."
ref = "Font Info › Font › Creation Date"
status = "handbook"

# Axes

[[command]]
id = "font.axes.list"
label = "List Axes"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "interpolation"
milestone = "M9"
summary = "Returns the design axes in order, each with name, tag and hidden flag."
ref = "Font Info › Font › Axes"
status = "inferred"

[[command]]
id = "font.axes.add"
label = "Add Axis"
menu = []
shortcut = ""
kind = "engine"
params = "{name?: string, tag?: string, hidden?: bool}"
area = "interpolation"
milestone = "M9"
summary = "Appends a design axis, as the plus button beside the Axes heading does. Every master and instance gains a coordinate for the new axis; the default name, tag and coordinate of a new axis are not stated."
ref = "Font Info › Font › Axes"
status = "handbook"

[[command]]
id = "font.axes.set"
label = "Edit Axis"
menu = []
shortcut = ""
kind = "engine"
params = "{axis: index|tag, name?: string, tag?: string, hidden?: bool}"
area = "interpolation"
milestone = "M9"
summary = "Changes the name, the four-character tag or the Hidden flag of an axis. Choosing one of the predefined names also sets the matching tag."
ref = "Font Info › Font › Axes"
status = "handbook"

[[command]]
id = "font.axes.remove"
label = "Remove Axis"
menu = []
shortcut = ""
kind = "engine"
params = "{axis: index|tag}"
area = "interpolation"
milestone = "M9"
summary = "Deletes an axis through the minus button of its row or Cmd+Delete on the selected row. What happens to the stored master and instance coordinates of that axis is not described."
ref = "Font Info; Font Info › Font › Axes"
status = "handbook"

[[command]]
id = "font.axes.listPredefined"
label = "List Predefined Axis Names"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "interpolation"
milestone = "M9"
summary = "Returns the predefined axis names offered by the name field together with the tag each one sets. The chapter says such a list exists but does not enumerate it."
ref = "Font Info › Font › Axes"
status = "inferred"

[[behavior]]
id = "fontInfo.axes.predefinedNameSetsTag"
area = "interpolation"
milestone = "M9"
summary = "Picking a predefined axis name rewrites the tag field to the tag registered for that name; a free-form name leaves the tag for the user to enter."
ref = "Font Info › Font › Axes"
status = "handbook"

[[behavior]]
id = "fontInfo.axes.hidden"
area = "interpolation"
milestone = "M9"
summary = "An axis marked Hidden is still used for interpolation but is flagged so that font users are not shown it in exported variable fonts."
ref = "Font Info › Font › Axes"
status = "handbook"

# Custom parameters (shared by the Font, Masters and Exports tabs)

[[panel]]
id = "fontInfo.customParameterPicker"
label = "Add Custom Parameter"
location = "dialog"
controls = [
  "search field",
  "scrolling list of the parameters valid for the current tab",
  "description of the clicked parameter",
  "Add button (adds every selected parameter)",
]
area = "font-info"
milestone = "M7"
summary = "Picker opened by the plus button beside a Custom Parameters heading. Searching or scrolling finds a parameter, clicking its name shows what it does, and Add inserts the selected parameters into the font, master or export."
ref = "Font Info › Font › Custom Parameters"
status = "handbook"

[[command]]
id = "font.customParameters.list"
label = "List Custom Parameters"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', target?: id|name|index}"
area = "font-info"
milestone = "M7"
summary = "Returns the custom parameters set on the font, on one master or on one export, in row order with their values."
ref = "Font Info › Font › Custom Parameters"
status = "inferred"

[[command]]
id = "font.customParameters.describe"
label = "Describe Custom Parameters"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: 'font'|'master'|'instance', query?: string}"
area = "font-info"
milestone = "M7"
summary = "Searches the catalogue of known custom parameters and returns name, value type, valid scopes and description, the data behind the picker's list and description pane."
ref = "Font Info › Font › Custom Parameters"
status = "inferred"

[[command]]
id = "font.customParameters.add"
label = "Add Custom Parameter"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], name: string, value?: any}"
area = "font-info"
milestone = "M7"
summary = "Adds a custom parameter row to the font, to masters or to exports. Whether the same parameter may be added twice to one scope is not stated in this chapter."
ref = "Font Info › Font › Custom Parameters; Masters › Custom Parameters; Exports › Custom Parameters"
status = "handbook"

[[command]]
id = "font.customParameters.set"
label = "Set Custom Parameter"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], name: string, index?: integer, value: any}"
area = "font-info"
milestone = "M7"
summary = "Changes the value of an existing custom parameter row."
ref = "Font Info › Font › Custom Parameters"
status = "inferred"

[[command]]
id = "font.customParameters.remove"
label = "Remove Custom Parameter"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], name: string, index?: integer}"
area = "font-info"
milestone = "M7"
summary = "Deletes a custom parameter row, as the row's minus button or Cmd+Delete on the selected rows does."
ref = "Font Info"
status = "handbook"

[[behavior]]
id = "fontInfo.customParameters.precedence"
area = "font-info"
milestone = "M7"
summary = "When one parameter exists at several levels the most specific wins: an export's value overrides the master's and the font's, and a master's value overrides the font's."
ref = "Font Info › Masters › Custom Parameters; Font Info › Exports › Custom Parameters"
status = "handbook"

[[behavior]]
id = "fontInfo.customParameters.masterInterpolation"
area = "interpolation"
milestone = "M9"
summary = "A custom parameter present on every master is interpolated for instances that lie between masters; one missing from any master is not."
ref = "Font Info › Masters › Custom Parameters"
status = "handbook"

# ───────────────────────────── Masters tab ─────────────────────────────

[[panel]]
id = "fontInfo.masters"
label = "Masters"
location = "window"
controls = [
  "master list sidebar with icons; drag to reorder; multiple selection",
  "plus button (bottom): Add Master, Add Other Font, Duplicate Selected",
  "minus button (bottom-left): delete selected masters",
  "General: master name field, master icon button",
  "Axes Coordinates: one number field per font axis",
  "Metrics & Alignment Zones: per metric a clickable name, position field, zone size field (Italic Angle has one field)",
  "Stems heading with plus button: per stem an orientation icon (vertical/horizontal), name, value, actions button for the glyph scope",
  "Custom Parameters heading with plus button",
  "Number Values heading with plus button: name and value per row",
  "gray 'Multiple Values' placeholder in fields whose value differs across the selected masters",
]
area = "font-info"
milestone = "M7"
summary = "Second tab of Font Info: the list of masters on the left and the properties of the selected master or masters on the right."
ref = "Font Info › Masters"
status = "handbook"

[[command]]
id = "font.master.list"
label = "List Masters"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "interpolation"
milestone = "M7"
summary = "Returns the masters in list order with id, name, icon and axis coordinates."
ref = "Font Info › Masters › Managing Masters"
status = "inferred"

[[command]]
id = "font.master.get"
label = "Get Master"
menu = []
shortcut = ""
kind = "engine"
