shortcut = ""
kind = "engine"
params = "{instance: id|name|index, toIndex: integer}"
area = "font-info"
milestone = "M7"
summary = "Moves an export entry within the list, as dragging does. The order is organisational only and has no effect on exported files."
ref = "Font Info › Exports"
status = "handbook"

[[command]]
id = "font.instance.setActive"
label = "Set Export Active"
menu = []
shortcut = ""
kind = "engine"
params = "{instances: [id|name|index], active: bool}"
area = "font-info"
milestone = "M7"
summary = "Turns the Active flag on or off. Inactive entries are skipped by File > Export and drawn with a gray icon in the list."
ref = "Font Info › Exports › Active"
status = "handbook"

[[command]]
id = "font.instance.setAxisLocation"
label = "Set Instance Axes Coordinates"
menu = []
shortcut = ""
kind = "engine"
params = "{instances: [id|name|index], location: {tag: number}}"
area = "interpolation"
milestone = "M9"
summary = "Places an instance in the designspace with one coordinate per font axis. Locations between masters are interpolated; locations beyond the masters are extrapolated."
ref = "Font Info › Exports › Axes Coordinates"
status = "handbook"

[[command]]
id = "font.instance.setStyleLinking"
label = "Set Style Linking"
menu = []
shortcut = ""
kind = "engine"
params = "{instances: [id|name|index], isBold?: bool, isItalic?: bool, linkStyle?: string}"
area = "font-info"
milestone = "M7"
summary = "Declares an instance to be the bold, the italic or the bold italic of another instance by setting the two checkboxes and the style name of the base instance. The link only works between fonts that share a family name."
ref = "Font Info › Exports › Style Linking"
status = "handbook"

[[command]]
id = "font.instance.setWeightClass"
label = "Set Weight Class"
menu = []
shortcut = ""
kind = "engine"
params = "{instances: [id|name|index], weightClass: integer}"
area = "font-info"
milestone = "M7"
summary = "Sets the Weight Class to any integer from 1 to 1000; the disclosure menu offers the standard steps 100 to 900. Values outside the range must be rejected."
ref = "Font Info › Exports › Weight & Width"
status = "handbook"

[[command]]
id = "font.instance.setWidthClass"
label = "Set Width Class"
menu = []
shortcut = ""
kind = "engine"
params = "{instances: [id|name|index], widthClass: integer}"
area = "font-info"
milestone = "M7"
summary = "Sets the Width Class to one of the values 1 to 9 offered by the disclosure menu."
ref = "Font Info › Exports › Weight & Width"
status = "handbook"

[[parameter]]
name = "instance.exports"
scope = ["instance"]
kind = "bool"
area = "font-info"
milestone = "M7"
summary = "Active checkbox: whether File > Export produces this entry. Glyphs source key: instances[].exports (default true)."
ref = "Font Info › Exports › Active; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.name"
scope = ["instance"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Style Name shown in application font menus, such as Regular, Bold or Light Italic Display. Should stay within ASCII letters, digits, spaces and a little punctuation such as the hyphen; Unicode style names go in styleNames. Glyphs source key: instances[].name."
ref = "Font Info › Exports › Style Name; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.weightClass"
scope = ["instance"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Weight Class, an integer from 1 to 1000 with 100 to 900 as the standard steps, following the OS/2 table definition. Used by other applications and by CSS to order and select weights; independent of the weight axis coordinate. Glyphs source key: instances[].weightClass (default 400)."
ref = "Font Info › Exports › Weight & Width; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.widthClass"
scope = ["instance"]
kind = "number"
area = "font-info"
milestone = "M7"
summary = "Width Class, 1 to 9 following the OS/2 table definition. Used by other applications to categorise fonts; independent of the width axis coordinate. Glyphs source key: instances[].widthClass (default 5)."
ref = "Font Info › Exports › Weight & Width; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.axesValues"
scope = ["instance"]
kind = "list"
area = "interpolation"
milestone = "M9"
summary = "Axes Coordinates of the instance: one number per font axis in axis order, its location in the designspace. Glyphs source key: instances[].axesValues."
ref = "Font Info › Exports › Axes Coordinates; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.isBold"
scope = ["instance"]
kind = "bool"
area = "font-info"
milestone = "M7"
summary = "Bold checkbox of Style Linking: marks the instance as the bold of the instance named in the link field. Glyphs source key: instances[].isBold."
ref = "Font Info › Exports › Style Linking; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.isItalic"
scope = ["instance"]
kind = "bool"
area = "font-info"
milestone = "M7"
summary = "Italic checkbox of Style Linking: marks the instance as the italic of the instance named in the link field. Glyphs source key: instances[].isItalic."
ref = "Font Info › Exports › Style Linking; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.linkStyle"
scope = ["instance"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Text field of Style Linking: the style name of the base instance this one is the bold and/or italic of, for example Regular on a Bold Italic instance. Glyphs source key: instances[].linkStyle."
ref = "Font Info › Exports › Style Linking; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.type"
scope = ["instance"]
kind = "choice"
area = "interpolation"
milestone = "M9"
summary = "Kind of export entry: a static instance or a variable font setting. The handbook distinguishes the two by the plus-menu entry that creates them; the stored values come from the file-format documentation. Glyphs source key: instances[].type (single by default, variable for a variable font setting)."
ref = "Font Info › Exports; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.properties"
scope = ["instance"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "Optional General fields added to an export, such as a familyNames override of the font's family name. Glyphs source key: instances[].properties."
ref = "Font Info › Exports › Style Linking; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.customParameters"
scope = ["instance"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "Ordered list of custom parameters on the export; they override master-level and font-level parameters of the same name. Glyphs source key: instances[].customParameters."
ref = "Font Info › Exports › Custom Parameters; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "instance.manualInterpolation"
scope = ["instance"]
kind = "bool"
area = "interpolation"
milestone = "M9"
summary = "Whether the instance uses hand-entered master factors instead of factors computed from its axis coordinates. Not described in this handbook chapter; taken from the file-format documentation. Glyphs source key: instances[].manualInterpolation."
ref = "GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

[[parameter]]
name = "instance.instanceInterpolations"
scope = ["instance"]
kind = "dict"
area = "interpolation"
milestone = "M9"
summary = "Interpolation factors per master id, each either one number or an x/y pair, used when manual interpolation is on. Not described in this handbook chapter; taken from the file-format documentation. Glyphs source key: instances[].instanceInterpolations."
ref = "GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

[[behavior]]
id = "fontInfo.exports.selection"
area = "font-info"
milestone = "M7"
summary = "In the export list Cmd+click toggles single entries and Shift+click selects a range; the selection is what the minus button and the Instance as Master entry act on."
ref = "Font Info › Exports"
status = "handbook"

[[behavior]]
id = "fontInfo.exports.orderIsCosmetic"
area = "font-info"
milestone = "M7"
summary = "The order of export entries is kept for the user's organisation only and must not influence any exported file."
ref = "Font Info › Exports"
status = "handbook"

[[behavior]]
id = "fontInfo.exports.inactiveGrayIcon"
area = "font-info"
milestone = "M7"
summary = "An export entry with Active off is drawn with a gray icon in the list and is left out by File > Export."
ref = "Font Info › Exports › Active"
status = "handbook"

[[behavior]]
id = "fontInfo.styleName.limits"
area = "font-info"
milestone = "M7"
summary = "Style names outside ASCII letters, digits, spaces and simple punctuation are not safe everywhere; family plus style name longer than about 20 characters can fail in older systems, applications and printers. The remedy is abbreviated postscriptFontName and postscriptFullName values, and styleNames for Unicode names."
ref = "Font Info › Exports › Style Name"
status = "handbook"

[[behavior]]
id = "fontInfo.weightClass.range"
area = "font-info"
milestone = "M7"
summary = "The weight class accepts typed values from 1 to 1000 (350 for a Semi Light, say) besides the nine standard steps, although values between the standard steps are refused by some applications. Neither class is bound to the range or the values of the weight or width axis."
ref = "Font Info › Exports › Weight & Width"
status = "handbook"

[[behavior]]
id = "fontInfo.instance.extrapolation"
area = "interpolation"
milestone = "M9"
summary = "An instance whose coordinates lie inside the range covered by masters is interpolated; one outside is extrapolated. With masters at weight 40 and 120, weight 80 interpolates while 20 and 150 extrapolate."
ref = "Font Info › Exports › Axes Coordinates"
status = "handbook"

[[behavior]]
id = "fontInfo.styleLinking.sameFamily"
area = "font-info"
milestone = "M7"
summary = "Style linking connects only fonts with an identical family name. All instances inherit the Font tab's family name unless they carry a familyNames field, and instances from different source files (a roman and an italic file) can share a family name and link to each other."
ref = "Font Info › Exports › Style Linking"
status = "handbook"

[[behavior]]
id = "fontInfo.styleLinking.recommendedScheme"
area = "qa"
milestone = "M12"
summary = "Recommended scheme, usable as a lint: Bold, Italic and Bold Italic link to Regular; every other italic links to its upright of the same weight. Linking a non-bold weight as the bold of another (Semibold as bold of Light) is allowed but hides it from family pickers that only expose four styles."
ref = "Font Info › Exports › Style Linking"
status = "handbook"

# ───────────────────────────── Features tab ─────────────────────────────

[[panel]]
id = "fontInfo.features"
label = "Features"
location = "window"
controls = [
  "sidebar in three groups: Prefix, Classes, Features, each heading with a plus button",
  "update button beside each automatic entry; error icon beside entries with errors",
  "minus button (bottom-left): delete selected sidebar entries",
  "Update button (bottom-left): regenerate all automatic entries and add newly possible ones",
  "Compile button (bottom-left)",
  "checkbox Generate Feature Automatically, placed over the code editor",
  "stylistic set name rows above the editor (ss01-ss20 only): language picker, name field, plus and minus buttons",
  "feature code editor with syntax colouring, autocomplete, inline error markers and Fix buttons",
  "notes field below the editor with a draggable divider",
  "snippets button (bottom-right)",
  "Spec button (top-right, only while a feature is selected)",
]
area = "features"
milestone = "M8"
summary = "Fourth tab of Font Info: the font's feature code organised as prefixes, classes and features, each either generated automatically or written by hand. Kerning, mark attachment and cursive attachment features are generated at export and are not listed."
ref = "Font Info › Features"
status = "handbook"

[[panel]]
id = "fontInfo.featurePicker"
label = "Add Feature"
location = "dialog"
controls = ["search field (matches feature tag or feature name)", "result list; Up/Down move, Return or double-click adds"]
area = "features"
milestone = "M8"
summary = "Picker opened by the plus button beside the Features heading. Typing filters the registered features by tag or name; double-clicking a result or pressing Return adds it to the sidebar."
ref = "Font Info › Features › Editing Feature Code"
status = "handbook"

[[command]]
id = "font.features.list"
label = "List Feature Entries"
menu = []
shortcut = ""
kind = "engine"
params = "{kind?: 'prefix'|'class'|'feature'}"
area = "features"
milestone = "M8"
summary = "Returns the sidebar entries in order: kind, name or tag, automatic flag and whether the entry currently has compile errors."
ref = "Font Info › Features › Editing Feature Code"
status = "inferred"

[[command]]
id = "font.features.get"
label = "Get Feature Entry"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, index?: integer}"
area = "features"
milestone = "M8"
summary = "Returns one prefix, class or feature with its code, automatic flag, notes and, for stylistic sets, the localized names."
ref = "Font Info › Features › Editing Feature Code"
status = "inferred"

[[command]]
id = "font.features.listAvailable"
label = "Search Feature Tags"
menu = []
shortcut = ""
kind = "engine"
params = "{query?: string}"
area = "features"
milestone = "M8"
summary = "Searches the registered feature tags by tag or by descriptive name, the data behind the Add Feature picker, and reports for each whether automatic code generation is possible in this font."
ref = "Font Info › Features › Editing Feature Code"
status = "inferred"

[[command]]
id = "font.features.addPrefix"
label = "Add Prefix"
menu = []
shortcut = ""
kind = "engine"
params = "{name?: string, code?: string, automatic?: bool}"
area = "features"
milestone = "M8"
summary = "Adds a prefix entry: free-form feature code placed outside every feature, mainly for lookups that features share."
ref = "Font Info › Features › Editing Feature Code"
status = "handbook"

[[command]]
id = "font.features.addClass"
label = "Add Class"
menu = []
shortcut = ""
kind = "engine"
params = "{name: string, code?: string, glyphs?: [glyphName], automatic?: bool}"
area = "features"
milestone = "M8"
summary = "Adds a glyph class whose body is a list of glyph names separated by spaces or line breaks. Classes that can be generated but are not added by Update, such as All (every exporting glyph), are added this way."
ref = "Font Info › Features › Editing Feature Code; Automatic Feature Code"
status = "handbook"

[[command]]
id = "font.features.addFeature"
label = "Add Feature"
menu = []
shortcut = ""
kind = "engine"
params = "{tag: string, code?: string, automatic?: bool}"
area = "features"
milestone = "M8"
summary = "Adds a feature identified by its four-character tag. Also used to add features that Update leaves out, such as cpsp, and to add an implicit feature such as kern in order to extend it by hand."
ref = "Font Info › Features › Editing Feature Code; Implicit Features"
status = "handbook"

[[command]]
id = "font.features.remove"
label = "Remove Feature Entries"
menu = []
shortcut = ""
kind = "engine"
params = "{entries: [{kind: 'prefix'|'class'|'feature', name: string, index?: integer}]}"
area = "features"
milestone = "M8"
summary = "Deletes the selected prefixes, classes and features; this is the minus button at the bottom-left of the Features tab."
ref = "Font Info › Features › Editing Feature Code"
status = "handbook"

[[command]]
id = "font.features.rename"
label = "Rename Feature Entry"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, index?: integer, newName: string}"
area = "features"
milestone = "M8"
summary = "Changes the name of a prefix or class, or the tag of a feature. The handbook does not describe renaming in the sidebar."
ref = "Font Info › Features › Editing Feature Code"
status = "inferred"

[[command]]
id = "font.features.setCode"
label = "Set Feature Code"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, index?: integer, code: string}"
area = "features"
milestone = "M8"
summary = "Replaces the code of one entry. Whether writing code to an automatic entry switches it to manual or is refused is not documented."
ref = "Font Info › Features › Manual Feature Code"
status = "inferred"

[[command]]
id = "font.features.setAutomatic"
label = "Generate Feature Automatically"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, index?: integer, automatic: bool}"
area = "features"
milestone = "M8"
summary = "Sets the checkbox above the code editor. Turning it off keeps the current code as hand-editable text that Update no longer touches; entries that cannot be generated, such as calt, are always manual and cannot be switched on."
ref = "Font Info › Features › Automatic Feature Code; Manual Feature Code"
status = "handbook"

[[command]]
id = "font.features.setNotes"
label = "Set Feature Notes"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, index?: integer, notes: string}"
area = "features"
milestone = "M8"
summary = "Writes the free-text note kept with a prefix, class or feature, shown in the field under the code editor."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[command]]
id = "font.features.update"
label = "Update"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "features"
milestone = "M8"
summary = "Regenerates every automatic prefix, class and feature in one step and adds entries that have become possible since the last run, for example liga after ligature glyphs with underscore names were added. Manual entries are left alone, and optional ones such as the All class or cpsp are never added by this command."
ref = "Font Info › Features › Automatic Feature Code"
status = "handbook"

[[command]]
id = "font.features.updateEntry"
label = "Update Entry"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, index?: integer}"
area = "features"
milestone = "M8"
summary = "Regenerates the code of a single automatic entry, as the update button beside its name in the sidebar does."
ref = "Font Info › Features › Automatic Feature Code"
status = "handbook"

[[command]]
id = "font.features.compile"
label = "Compile"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "features"
milestone = "M8"
summary = "Compiles the feature code so that Edit View can preview it and returns the errors found. Edit View previews hand-written substitution rules but not hand-written positioning rules."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[command]]
id = "font.features.listErrors"
label = "List Feature Errors"
menu = []
shortcut = ""
kind = "engine"
params = "{kind?: 'prefix'|'class'|'feature', name?: string}"
area = "features"
milestone = "M8"
summary = "Returns the current compile errors with entry, text range, message, expanded description and, where one exists, the suggested fix. The UI shows the same data as inline markers and sidebar icons."
ref = "Font Info › Features › Manual Feature Code"
status = "inferred"

[[command]]
id = "font.features.applyFix"
label = "Fix"
menu = []
shortcut = ""
kind = "engine"
params = "{error: id}"
area = "features"
milestone = "M8"
summary = "Applies the correction suggested for an error; only errors drawn with a wrench icon carry such a suggestion."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[command]]
id = "font.features.jumpToError"
label = "Jump to Error"
menu = []
shortcut = ""
kind = "ui"
params = "{kind: 'prefix'|'class'|'feature', name: string, error?: id}"
area = "features"
milestone = "M8"
summary = "Selects the entry and scrolls the editor to the faulty code, as clicking the error icon of an entry in the sidebar does."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[command]]
id = "font.features.listSnippets"
label = "List Code Snippets"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "features"
milestone = "M8"
summary = "Returns the predefined and user-defined feature code snippets offered by the snippets button, including the automatic-code placeholder."
ref = "Font Info › Features › Manual Feature Code"
status = "inferred"

[[command]]
id = "font.features.insertSnippet"
label = "Insert Snippet"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, snippet: string, position?: integer}"
area = "features"
milestone = "M8"
summary = "Inserts a snippet chosen from the snippets button at the bottom-right of the tab into the code of the current entry. One snippet inserts the '# Automatic Code' placeholder line."
ref = "Font Info › Features › Manual Feature Code; Implicit Features"
status = "handbook"

[[command]]
id = "font.features.openSpec"
label = "Spec"
menu = []
shortcut = ""
kind = "ui"
params = "{tag: string}"
area = "features"
milestone = "M8"
summary = "Opens the specification page of the selected feature on Microsoft's OpenType site in the browser. The button is shown at the top-right only while a feature is selected."
ref = "Font Info › Features › Editing Feature Code"
status = "handbook"

[[command]]
id = "font.features.setLabel"
label = "Set Stylistic Set Name"
menu = []
shortcut = ""
kind = "engine"
params = "{tag: string, language?: string, name: string}"
area = "features"
milestone = "M8"
summary = "Adds or changes one localized display name of a stylistic set feature (ss01 to ss20). The language defaults to the Default entry, which acts as the fallback name."
ref = "Font Info › Features › Naming Stylistic Sets"
status = "handbook"

[[command]]
id = "font.features.removeLabel"
label = "Remove Stylistic Set Name"
menu = []
shortcut = ""
kind = "engine"
params = "{tag: string, language: string}"
area = "features"
milestone = "M8"
summary = "Removes one localized name row from a stylistic set feature, as the row's minus button does."
ref = "Font Info › Features › Naming Stylistic Sets"
status = "handbook"

[[command]]
id = "font.features.complete"
label = "Complete Feature Code"
menu = []
shortcut = ""
kind = "engine"
params = "{kind: 'prefix'|'class'|'feature', name: string, position: integer, prefix?: string}"
area = "features"
milestone = "M8"
summary = "Returns the glyph names, class names and lookup names that fit at a position in the code, the data behind the editor's autocomplete menu."
ref = "Font Info › Features › Manual Feature Code"
status = "inferred"

[[command]]
id = "font.features.previewName"
label = "Preview Glyph or Class"
menu = []
shortcut = ""
kind = "ui"
params = "{name: string}"
area = "features"
milestone = "M8"
summary = "Shows a popover with a drawing of the glyph, or with all member glyphs of the class, for the glyph or class name that was Alt-clicked in the code editor."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.sidebarGroups"
area = "features"
milestone = "M8"
summary = "The sidebar always has three groups in fixed order: Prefix (arbitrary code outside features), Classes (whitespace-separated glyph name lists) and Features (rules under a four-character tag)."
ref = "Font Info › Features › Editing Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.automaticIndicator"
area = "features"
milestone = "M8"
summary = "Automatic entries carry an update button beside their name in the sidebar; manual entries do not."
ref = "Font Info › Features › Automatic Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.updateDetectsNew"
area = "features"
milestone = "M8"
summary = "Update inspects glyph names for features it can newly generate: underscore names produce liga, dot suffixes such as .sc or .tf fill the matching feature, and a suffix equal to a feature tag (g.ss01) puts the glyph into that feature."
ref = "Font Info › Features › Automatic Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.optionalAutomatic"
area = "features"
milestone = "M8"
summary = "Some entries can be generated but are not added by Update, among them the All class and the cpsp feature; the user adds them by hand and may then leave them automatic."
ref = "Font Info › Features › Automatic Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.manualNotUpdated"
area = "features"
milestone = "M8"
summary = "Entries with Generate Feature Automatically off are skipped by Update, and entries that have no generator, such as calt, are permanently manual."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.syntaxColouring"
area = "features"
milestone = "M8"
summary = "The code editor colours keywords, glyph names, numbers, lookup names and comments differently."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.autocomplete"
area = "features"
milestone = "M8"
summary = "Typing where a glyph, class or lookup name is expected opens a suggestion menu. Up and Down move through it, further typing narrows it and Return inserts the highlighted suggestion."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.inlineErrors"
area = "features"
milestone = "M8"
summary = "Code that fails to compile is flagged inline. Clicking the error icon expands the message, a wrench icon signals an available Fix, and every entry with errors also gets an icon in the sidebar."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.notesDivider"
area = "features"
milestone = "M8"
summary = "The notes field under the editor is resized by dragging the gray divider line above it."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"

[[behavior]]
id = "fontInfo.features.stylisticSetNames"
area = "features"
milestone = "M8"
summary = "Selecting one of ss01 to ss20 shows name rows above the editor, each with a language and a text. The Default language is the fallback, which many systems treat as English, so the usual set-up is Default for English plus rows for other languages. The texts accept text tokens."
ref = "Font Info › Features › Naming Stylistic Sets"
status = "handbook"

[[behavior]]
id = "fontInfo.features.implicit"
area = "features"
milestone = "M8"
summary = "kern, dist, mark, abvm, blwm, mkmk and curs are produced at export from kerning and anchors and never appear in the Features tab, because their code differs for each master and instance. dist behaves like kerning but is not under user control."
ref = "Font Info › Features › Implicit Features"
status = "handbook"

[[behavior]]
id = "fontInfo.features.automaticCodePlaceholder"
area = "features"
milestone = "M8"
summary = "An implicit feature added by hand may contain the comment line '# Automatic Code'. Code above the line is emitted before the generated rules and code below it after them."
ref = "Font Info › Features › Implicit Features"
status = "handbook"

[[behavior]]
id = "fontInfo.features.exportSpecific"
area = "features"
milestone = "M8"
summary = "Per-instance feature changes are made with the custom parameters Add, Remove and Replace for Prefix, Class and Feature. Automatic classes and features need no such parameters because they are regenerated for the glyph set of each instance."
ref = "Font Info › Features › Export-Specific Features"
status = "handbook"

# ───────────────────────────── Other Settings tab ─────────────────────────────

[[panel]]
id = "fontInfo.other"
label = "Other Settings"
location = "window"
controls = [
  "Grid Spacing: number field",
  "Subdivision: number field",
  "Keyboard Increments: Shift value and Command value fields",
  "Use Custom Naming: checkbox",
  "Disable Automatic Alignment: checkbox",
  "Keep Alternates Next to Base Glyph: checkbox",
  "File Format Version: menu (Version 2, 3, 4)",
  "Font Type: menu (Default, Variable)",
]
area = "font-info"
milestone = "M7"
summary = "Fifth tab of Font Info: document-wide working settings for coordinate rounding, arrow-key steps, glyph naming, component alignment, glyph sorting, the saved file format and the interpolation model."
ref = "Font Info › Other Settings"
status = "handbook"

[[command]]
id = "font.settings.get"
label = "Get Font Settings"
menu = []
shortcut = ""
kind = "engine"
params = "{keys?: [string]}"
area = "font-info"
milestone = "M7"
summary = "Reads the Other Settings values: gridSpacing, gridSubdivision, keyboardIncrementShift, keyboardIncrementCmd, useCustomNaming, disableAutomaticAlignment, keepAlternatesNextToBase, fileFormatVersion and fontType."
ref = "Font Info › Other Settings"
status = "inferred"

[[command]]
id = "font.settings.set"
label = "Set Font Settings"
menu = []
shortcut = ""
kind = "engine"
params = "{gridSpacing?: number, gridSubdivision?: integer, keyboardIncrementShift?: number, keyboardIncrementCmd?: number, useCustomNaming?: bool, disableAutomaticAlignment?: bool, keepAlternatesNextToBase?: bool, fileFormatVersion?: 2|3|4, fontType?: 'default'|'variable'}"
area = "font-info"
milestone = "M7"
summary = "Writes one or more Other Settings values. Changing a setting never rewrites existing glyph data by itself: coordinates are not re-rounded and glyphs are not renamed."
ref = "Font Info › Other Settings"
status = "inferred"

[[behavior]]
id = "fontInfo.grid.spacing"
area = "guides-metrics"
milestone = "M3"
summary = "Grid Spacing sets the rounding step for point coordinates. The default 1 rounds to whole units, 5 rounds to multiples of 5 (3.142, 7.816 becomes 5, 10) and 0 switches rounding off. Every tool and every modification snaps to this grid."
ref = "Font Info › Other Settings › Grid Spacing & Subdivision"
status = "handbook"

[[behavior]]
id = "fontInfo.grid.subdivision"
area = "guides-metrics"
milestone = "M3"
summary = "Subdivision divides the grid step: the effective step is spacing divided by subdivision. Spacing 100 with subdivision 5 gives a 20-unit grid, and spacing 1 with subdivision 10 gives coordinates with one decimal."
ref = "Font Info › Other Settings › Grid Spacing & Subdivision"
status = "handbook"

[[behavior]]
id = "fontInfo.grid.noRetroactiveRounding"
area = "guides-metrics"
milestone = "M3"
summary = "Changing the grid does not move existing points; Path > Round Coordinates rounds the selected points to the current grid on request."
ref = "Font Info › Other Settings › Grid Spacing & Subdivision"
status = "handbook"

[[behavior]]
id = "fontInfo.grid.fractionalCff"
area = "compile"
milestone = "M2"
summary = "Fractional coordinates produced by a zero or subdivided grid may be written as they are into CFF-flavoured fonts; the compiler must not round them."
ref = "Font Info › Other Settings › Grid Spacing & Subdivision"
status = "handbook"

[[behavior]]
id = "fontInfo.keyboardIncrements"
area = "drawing"
milestone = "M3"
summary = "Arrow keys nudge points in Edit View and step numbers in text fields (Up and Down). Holding Shift uses a larger step, 10 by default, and holding Cmd a still larger one, 100 by default; both values are set per font on the Other Settings tab."
ref = "Font Info › Other Settings › Keyboard Increments"
status = "handbook"

[[behavior]]
id = "fontInfo.useCustomNaming"
area = "font-view"
milestone = "M4"
summary = "With Use Custom Naming on, glyph names that differ from the built-in glyph database are kept instead of being replaced automatically. Turning it off renames nothing until Glyph > Update Glyph Info is run on a selection, which can break imported or hand-written feature code."
ref = "Font Info › Other Settings › Use Custom Naming"
status = "handbook"

[[behavior]]
id = "fontInfo.useCustomNaming.import"
area = "import-export"
milestone = "M1"
summary = "When an OpenType font or UFO is opened, glyph names are either kept or converted to database names according to the user setting Keep Glyph Names from Imported Files."
ref = "Font Info › Other Settings › Use Custom Naming"
status = "handbook"

[[behavior]]
id = "fontInfo.disableAutomaticAlignment"
area = "components"
milestone = "M6"
summary = "Disable Automatic Alignment switches off, for the whole font, both the automatic positioning of components and the automatic syncing of metrics in composite glyphs such as accented letters. Single components can instead be locked from the Edit View context menu, and a user setting applies the option to imported files."
ref = "Font Info › Other Settings › Disable Automatic Alignment"
status = "handbook"

[[behavior]]
id = "fontInfo.keepAlternatesNextToBase"
area = "font-view"
milestone = "M4"
summary = "With Keep Alternates Next to Base Glyph on, glyphs with a dot suffix sort directly after their base glyph (a, a.alt, a.loclDEU, a.ss15) rather than after the whole run of base glyphs."
ref = "Font Info › Other Settings › Keep Alternates Next to Base Glyph"
status = "handbook"

[[behavior]]
id = "fontInfo.fileFormatVersion"
area = "import-export"
milestone = "M1"
summary = "The document remembers which Glyphs file format version (2, 3 or 4) it is saved in. Files from older application versions stay in their format when opened, some newer features cannot be stored there, and switching the setting to Version 4 unlocks them. The handbook says new files start in version 3."
ref = "Font Info › Other Settings › File Format Version"
status = "handbook"

[[behavior]]
id = "fontInfo.fontType"
area = "interpolation"
milestone = "M9"
summary = "Font Type picks the interpolation model for static instances. Default uses the Multiple Master style model and is what new documents get; Variable reproduces variable-font interpolation so static and variable exports of one project differ as little as possible."
ref = "Font Info › Other Settings › Font Type"
status = "handbook"

# ───────────────────────────── Notes tab ─────────────────────────────

[[panel]]
id = "fontInfo.notes"
label = "Notes"
location = "window"
controls = ["multi-line text field with Markdown syntax highlighting"]
area = "font-info"
milestone = "M7"
summary = "Last tab of Font Info: one free-text note for the font, kept in the source and never exported."
ref = "Font Info › Notes"
status = "handbook"

[[command]]
id = "font.note.get"
label = "Get Font Note"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "font-info"
milestone = "M7"
summary = "Returns the font note as plain text."
ref = "Font Info › Notes"
status = "inferred"

[[command]]
id = "font.note.set"
label = "Set Font Note"
menu = []
shortcut = ""
kind = "engine"
params = "{text: string}"
area = "font-info"
milestone = "M7"
summary = "Replaces the font note. The same text is what the font's note custom parameter reads and writes."
ref = "Font Info › Notes"
status = "inferred"

[[behavior]]
id = "fontInfo.notes.notExported"
area = "font-info"
milestone = "M7"
summary = "The font note exists only in the source file and is identical to the font's note custom parameter; no exported font carries it."
ref = "Font Info › Notes"
status = "handbook"

[[behavior]]
id = "fontInfo.notes.markdownHighlighting"
area = "font-info"
milestone = "M7"
summary = "The note field highlights Markdown as plain text styling: italic with single asterisks or underscores, bold with double ones, inline links and angle-bracket autolinks, and headings of level one to six marked with number signs. The text is stored unrendered."
ref = "Font Info › Notes"
status = "handbook"
