ref = "Font Info › Masters › Managing Masters"
status = "handbook"

[[command]]
id = "font.master.setIcon"
label = "Set Master Icon"
menu = []
shortcut = ""
kind = "engine"
params = "{masters: [id|name|index], icon?: string, glyph?: glyphName}"
area = "font-info"
milestone = "M7"
summary = "Sets the icon that represents a master in the UI: either one of 25 built-in lowercase-n drawings of differing weight and width, or a glyph of the font given by name."
ref = "Font Info › Masters › General"
status = "handbook"

[[panel]]
id = "fontInfo.masterIconPicker"
label = "Master Icon"
location = "dialog"
controls = ["grid of 25 predefined lowercase-n icons in various widths and weights", "glyph name text field at the bottom"]
area = "font-info"
milestone = "M7"
summary = "Popover opened by clicking the master icon. Clicking a drawing picks it; typing a glyph name in the field uses that glyph of the font as the icon."
ref = "Font Info › Masters › General"
status = "handbook"

[[command]]
id = "font.master.setAxisLocation"
