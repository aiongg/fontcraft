[[command]]
id = "font.features.compile"
label = "Compile"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id|name, targets?: 'all'|'variable'|[{master}|{instance}|'variable'], instance?: index|id|name, force?: bool}"
area = "features"
milestone = "M8"
summary = "Compiles the feature code so that Edit View can preview it and returns the errors found. Edit View previews hand-written substitution rules but not hand-written positioning rules."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"
notes = "Documented, not yet observed. The compile checks the whole code, positioning included, for one master and keeps the result as the document's feature state (session only, no undo step); the preview font Edit View shapes with holds substitutions only. One compile of the code gives the diagnostics, Edit View's font and Text Preview's font (generated kerning and marks included); a Text Preview build of the same document revision and master is taken without compiling. When that build fails outside the code's entries, the code is compiled on its own for its diagnostics. Compiling unchanged code again reuses the last result. With `instance` (M8.31) the code is compiled as that instance exports it, its Add, Replace and Remove parameters applied one by one, on its own and kept nowhere: the document's feature state stays the master's. A diagnostic in code an Add or Replace parameter wrote names it (`param: {name, index}`, the index among the instance's parameters of that name; the line counted in the parameter's code), and a parameter value that cannot be applied comes back under `refused`. With `targets` (M8.51) the code is also checked for other builds, assembled as each exports it and compiled on its own: a master's values, an instance's parameters and interpolated values, the variable font's blocks and variable syntax. Targets with the same assembled text compile once, and an instance between the masters is interpolated only when the code has a `$` token. A check of `all` is kept for font.features.listErrors. The Compile button and the compile after each change check every target on a worker thread."
observe = [
  "In any font, look for a shortcut or menu item for Compile in Font Info › Features: note both.",
]
guesses = [
  "Compile checks every master, every exported instance and the variable font; compiling code with an error inside #ifdef VARIABLE, and code whose token fails at one instance only, in the reference app would settle which builds its Compile reads.",
  "Compile reads the master the Features tab passes (the active Edit View tab's), else the first master; compiling in a two-master font whose masters differ in a number value used by the code, with the second master showing, would settle it.",
  "Compile checks the code without the generated kerning and mark features; an error the reference app reports only when the generated code is added would show the difference.",
]

