[[behavior]]
id = "fontInfo.features.inlineErrors"
area = "features"
milestone = "M8"
summary = "Code that fails to compile is flagged inline. Clicking the error icon expands the message, a wrench icon signals an available Fix, and every entry with errors also gets an icon in the sidebar."
ref = "Font Info › Features › Manual Feature Code"
status = "handbook"
notes = "Documented, not yet observed. The markers, messages, wrench and sidebar icons read `font.features.listErrors` (and the `errors` flag of `font.features.list`) for the last compile while it still describes the font (an outline edit keeps it). While code is typed, they come from `font.features.check` of exactly the text shown, half a second after the last keystroke, without storing the code (M8.25). A gutter left of the code numbers each line and marks a line with diagnostics with one icon (an error disc if any is an error, else a warning triangle) and a wrench when one has a fix; the line's first message is drawn dimmed after its text, and error ranges are underlined. A click on the icon opens `fontInfo.featureErrorDetails`; nothing is listed under the code (M8.26). The coloured runs are kept while the text, the underlined ranges and the colours stay the same. An error that only other targets have is drawn like the others with the names of its targets after its message; what the compile found outside the entries (generated features, the glyph order, a preview font that could not be built, code an instance's parameter writes) is listed over the code (M8.51)."
guesses = [
  "The code editor has a gutter with line numbers; a wrapped row gets no number.",
  "One icon per line, whatever the number of diagnostics on it, with the error icon winning over the warning icon.",
  "The first message of a line is drawn dimmed after the line's text, clipped at the editor's edge, rather than on a row of its own under the line.",
  "Error ranges stay underlined besides the gutter icon.",
]

