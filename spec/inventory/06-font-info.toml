area = "interpolation"
milestone = "M9"
summary = "Places a master in the designspace by giving it one coordinate per font axis. Axes not named in the call keep their current coordinate."
ref = "Font Info › Masters › Axes Coordinates"
status = "handbook"

[[parameter]]
name = "master.name"
scope = ["master"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Master name. Used only inside the editor to identify the master; exported fonts take their names from instances. A new file has one master called Regular. Glyphs source key: fontMaster[].name."
ref = "Font Info › Masters › General; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "master.iconName"
scope = ["master"]
kind = "string"
area = "font-info"
milestone = "M7"
summary = "Master icon: either a named icon from the built-in set of 25 lowercase-n drawings or a glyph name from the font. Glyphs source key: fontMaster[].iconName (default Regular)."
ref = "Font Info › Masters › General; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "master.axesValues"
scope = ["master"]
kind = "list"
area = "interpolation"
milestone = "M9"
summary = "Axes Coordinates of the master: one number per font axis, in axis order, giving its position in the designspace. Glyphs source key: fontMaster[].axesValues."
ref = "Font Info › Masters › Axes Coordinates; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "master.metricValues"
scope = ["master"]
kind = "list"
area = "guides-metrics"
milestone = "M7"
summary = "Per-master values of the font's metrics, in metric order: the offset from the baseline and the alignment zone size that starts at that offset. Italic Angle carries a single value in degrees clockwise. Glyphs source key: fontMaster[].metricValues (pos, over)."
ref = "Font Info › Masters › Metrics & Alignment Zones; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "master.stemValues"
scope = ["master"]
kind = "list"
area = "hinting-ps"
milestone = "M7"
summary = "Per-master widths of the font's stem definitions, in stem order. Read by the autohinter and interpolated between masters by matching stem name. Glyphs source key: fontMaster[].stemValues."
ref = "Font Info › Masters › Stems; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "master.numberValues"
scope = ["master"]
kind = "list"
area = "features"
milestone = "M8"
summary = "Per-master values of the font's named numbers, in number order. Feature code reads them through number value tokens so the inserted number interpolates between masters. Glyphs source key: fontMaster[].numberValues."
ref = "Font Info › Masters › Number Values; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "master.customParameters"
scope = ["master"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "Ordered list of custom parameters on the master. They override font-level parameters of the same name and are interpolated when present on all masters. Glyphs source key: fontMaster[].customParameters."
ref = "Font Info › Masters › Custom Parameters; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "master.properties"
scope = ["master"]
kind = "list"
area = "font-info"
milestone = "M7"
summary = "Optional fields added under the master's General heading. The handbook gives the plus-button rule for all three tabs but names no master field; the storage key comes from the file-format documentation. Glyphs source key: fontMaster[].properties."
ref = "Font Info; GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

[[parameter]]
name = "font.metrics"
scope = ["font"]
kind = "list"
area = "guides-metrics"
milestone = "M7"
summary = "Definitions of the metrics shown on the Masters tab: each has a category (the metric type), a freely chosen name and an optional glyph scope. They are defined once per font while every master stores its own values. Glyphs source key: metrics (type, name, filter, horizontal)."
ref = "Font Info › Masters › Metrics & Alignment Zones; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.stems"
scope = ["font"]
kind = "list"
area = "hinting-ps"
milestone = "M7"
summary = "Stem definitions shown on the Masters tab: each has a name, an orientation (vertical for stems measured across from left to right, horizontal for stems measured from top to bottom) and an optional glyph scope. Glyphs source key: stems (name, horizontal, filter)."
ref = "Font Info › Masters › Stems; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[parameter]]
name = "font.numbers"
scope = ["font"]
kind = "list"
area = "features"
milestone = "M8"
summary = "Names of the Number Values shown on the Masters tab; every master stores one value per name. Glyphs source key: numbers."
ref = "Font Info › Masters › Number Values; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[behavior]]
id = "fontInfo.masters.newFileHasRegular"
area = "font-info"
milestone = "M7"
summary = "A newly created font starts with exactly one master named Regular."
ref = "Font Info › Masters › Managing Masters"
status = "handbook"

[[behavior]]
id = "fontInfo.masters.multipleValues"
area = "font-info"
milestone = "M7"
summary = "With several masters selected, name, metrics, stems, numbers and custom parameters are edited for all of them at once. A field whose values differ shows a gray Multiple Values placeholder until a new value is typed."
ref = "Font Info › Masters › Managing Masters"
status = "handbook"

[[behavior]]
id = "fontInfo.masters.firstMasterHints"
area = "hinting-ps"
milestone = "M10"
summary = "Glyph-level hinting information is taken from the first master in the list unless the Get Hints From Master parameter points to another one, so reordering masters can change hinting output."
ref = "Font Info › Masters › Managing Masters"
status = "handbook"

[[behavior]]
id = "fontInfo.masters.nameIsInternal"
area = "font-info"
milestone = "M7"
summary = "The master name never reaches exported files; only instances define exported style names."
ref = "Font Info › Masters › General"
status = "handbook"

# Metrics and alignment zones

[[command]]
id = "font.metrics.list"
label = "List Metrics"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id|name|index}"
area = "guides-metrics"
milestone = "M7"
summary = "Returns the metric definitions (category, name, scope) and, when a master is given, that master's position and zone size for each."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "inferred"

[[command]]
id = "font.metrics.add"
label = "Add Metric"
menu = []
shortcut = ""
kind = "engine"
params = "{category: string, name?: string, scope?: filter}"
area = "guides-metrics"
milestone = "M7"
summary = "Adds a metric definition to the font, giving every master a new position and zone value. The handbook states the general plus-button rule for bold headings but does not describe the Metrics plus button itself."
ref = "Font Info; Font Info › Masters › Metrics & Alignment Zones"
status = "inferred"

[[command]]
id = "font.metrics.set"
label = "Edit Metric"
menu = []
shortcut = ""
kind = "engine"
params = "{metric: index|name, category?: string, name?: string, scope?: filter}"
area = "guides-metrics"
milestone = "M7"
summary = "Changes the category (metric type), the display name or the glyph scope of a metric; in the UI these are edited in a popover opened by clicking the metric's name. A scope hides the metric's alignment line in glyphs that do not match it."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[command]]
id = "font.metrics.remove"
label = "Remove Metric"
menu = []
shortcut = ""
kind = "engine"
params = "{metric: index|name}"
area = "guides-metrics"
milestone = "M7"
summary = "Deletes a metric definition and its values from every master, through the row's minus button or Cmd+Delete. Whether built-in metrics such as Baseline can be removed is not stated."
ref = "Font Info"
status = "inferred"

[[command]]
id = "font.master.setMetric"
label = "Set Master Metric"
menu = []
shortcut = ""
kind = "engine"
params = "{masters: [id|name|index], metric: index|name, position?: number, zone?: number}"
area = "guides-metrics"
milestone = "M7"
summary = "Sets a master's value for one metric: the left field is the offset from the baseline and the right field the size of the alignment zone that begins at that offset. Italic Angle takes only one value."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[panel]]
id = "fontInfo.metricEditor"
label = "Metric"
location = "dialog"
controls = ["category menu (metric type)", "name field", "scope editor (glyph filter, same rules as smart filters)"]
area = "guides-metrics"
milestone = "M7"
summary = "Popover opened by clicking the name of a metric on the Masters tab; it edits the metric's category, name and the subset of glyphs it applies to."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[behavior]]
id = "fontInfo.metrics.defaultsByScript"
area = "guides-metrics"
milestone = "M7"
summary = "The default set of metrics depends on the font's script and language choice. Latin gets Ascender, Cap Height, x-Height, Baseline, Descender and Italic Angle; Arabic gets Ascender, Baseline, Descender, Alef Height, Joining Line and Meem Depth."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[behavior]]
id = "fontInfo.metrics.baselineAndSigns"
area = "guides-metrics"
milestone = "M7"
summary = "Metric positions are offsets from the baseline, which is always 0; the descender is therefore negative. Italic Angle is measured in degrees clockwise."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[behavior]]
id = "fontInfo.metrics.italicAngleUses"
area = "guides-metrics"
milestone = "M7"
summary = "The master's italic angle feeds the sidebearing calculation, the alignment of anchors between selected nodes and every transformation that offers to respect the italic angle."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[behavior]]
id = "fontInfo.metrics.scopeHidesLine"
area = "guides-metrics"
milestone = "M7"
summary = "A metric with a glyph scope is drawn only in glyphs matching the scope; for example a metric scoped to Devanagari glyphs shows no alignment line elsewhere. Scopes use the smart-filter rule model."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[behavior]]
id = "fontInfo.metrics.shownInEditView"
area = "guides-metrics"
milestone = "M3"
summary = "Edit View draws the master metrics as orange alignment lines while View > Show Metrics is on."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

[[behavior]]
id = "fontInfo.zones.highlightAndHinting"
area = "guides-metrics"
milestone = "M7"
summary = "An alignment zone starts at its metric's position and extends by the zone size. Nodes and anchors inside a zone are highlighted in Edit View, and the PostScript autohinter uses the zones so overshoots collapse onto the flat metric at small sizes; TrueType hinting can use separately configured zones."
ref = "Font Info › Masters › Metrics & Alignment Zones"
status = "handbook"

