# Source: Glyphs 4 Handbook, chapter "Font Info" (https://handbook.glyphsapp.com/font-info/)
#   sections: Font, Masters, Exports, Features, Other Settings, Notes.
# Source-file key names (rows and fields marked "docs"): GlyphsSDK,
#   refs/GlyphsSDK/GlyphsFileFormat/GlyphsFileFormatv3.md and GlyphsFileFormatv4.md.
# Date: 2026-10-07
#
# Scope notes
# - [[parameter]] rows here cover only the built-in fields of the Font / Masters / Exports tabs.
#   Their names carry a scope prefix ("font.", "master.", "instance.") so they cannot collide with
#   the custom parameters of the appendix (several of which share a bare name with a built-in
#   field, e.g. unitsPerEm).
# - The feature language itself, text tokens, the custom parameter catalogue and the user settings
#   are inventoried from their own chapters; rows here cover only the Font Info window.
# - Command targets are explicit so the commands work headless: masters and instances are addressed
#   by id, name or index; "selection" is only the default when a UI is attached.

# ───────────────────────────── Window and shared row mechanics ─────────────────────────────

[[panel]]
id = "fontInfo"
label = "Font Info"
location = "window"
controls = [
  "tab bar: Font, Masters, Exports, Features, Other Settings, Notes",
  "Font / Masters / Exports: rows of fields grouped under bold headings",
  "plus button beside each bold heading: add a field or entry to that group",
  "minus button at the right of a row: delete the row",
  "Alt held: rows that show a plus button show a minus button instead",
  "row selection (click, Cmd+click for several)",
  "language menu and plus button on localizable fields",
]
area = "font-info"
milestone = "M7"
summary = "Per-document window holding the font-wide metadata, the masters, the exports (instances and variable font settings), the feature code, document settings and a note. One window per open font, split into six tabs."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. The Features tab is M8's (fontInfo.features); until M8 the tab shows the stored prefixes, classes and features read-only. M7 plan § 4: M7.15."
guesses = [
  "Font Info opens on the tab it last showed for that document, and on the Font tab the first time; opening it twice in the reference app settles it.",
]
observe = [
  "In font A (m7-one), open Font Info, switch to the Exports tab, close the window and open it again: note which tab it opens on.",
]

[[command]]
id = "font.info"
label = "Font Info…"
menu = ["File"]
shortcut = "Cmd+I"
kind = "ui"
params = "{tab?: 'font'|'masters'|'exports'|'features'|'other'|'notes'}"
area = "font-info"
milestone = "M7"
summary = "Opens the Font Info window of the current font, optionally on a given tab. The Info button at the top-left of the main window runs the same command."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.15."

[[command]]
id = "font.info.selectTab"
label = "Select Font Info Tab"
menu = []
shortcut = ""
kind = "ui"
params = "{tab: 'font'|'masters'|'exports'|'features'|'other'|'notes'}"
area = "font-info"
milestone = "M7"
summary = "Switches the open Font Info window to one of its six tabs. The handbook only describes clicking the tabs; no shortcut is given."
ref = "Font Info"
status = "inferred"
notes = "Our own command so a script can switch tabs; the reference app has only the tab clicks. M7 plan § 4: M7.15."

[[command]]
id = "font.info.get"
label = "Get Font Info"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: 'font'|'master'|'instance', target?: id|name|index, keys?: [string]}"
area = "font-info"
milestone = "M7"
summary = "Reads Font Info fields as structured data: the font-wide fields, or the fields of one master or one export. Without keys it returns every built-in field, every added field with all its localizations, and the custom parameters of that scope."
ref = "Font Info"
status = "inferred"
own = true
notes = "Extends the M2 `font.info.get` (font scope, four keys) to the three scopes, the added fields with their languages and the custom parameters. M7 plan § 4: M7.3."

[[command]]
id = "font.info.set"
label = "Set Font Info"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: 'font'|'master'|'instance', targets?: [id|name|index], values: {key: value}}"
area = "font-info"
milestone = "M7"
summary = "Writes one or more built-in or added fields in a single undoable step. With several masters or instances as targets the same value is written to each, matching the multi-selection editing of the UI."
ref = "Font Info"
status = "inferred"
own = true
notes = "Extends the M2 `font.info.set` (four font keys) to every built-in and added field of the three scopes; unitsPerEm keeps its rule of changing the number only. M7 plan § 4: M7.3."
guesses = [
  "Setting a field the scope offers but the target lacks adds it, and a text sets a localizable field's default language; typing into an empty field row in the reference app settles it.",
]

[[command]]
id = "font.info.listFields"
label = "List Available Fields"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', query?: string, target?: id|name|index}"
area = "font-info"
milestone = "M7"
summary = "Returns the fields that the plus button beside a General heading offers for the given scope, each with its key, whether it is localizable and whether it is already present."
ref = "Font Info"
status = "inferred"
notes = "The keys come from the file format's property list (GlyphsSDK `infoProperty`) and the keys glyphsLib reads (`PROPERTIES_WHITELIST`); plural keys are localizable (a `values` list of language and text), singular keys hold one value. M7 plan § 4: M7.3."
guesses = [
  "The Font tab offers familyNames, designers, designerURL, manufacturers, manufacturerURL, copyrights, versionString, vendorID, uniqueID, licenses, licenseURL, trademarks, descriptions, sampleTexts, postscriptFontName, postscriptFullNames, compatibleFullNames, WWSFamilyName, WWSSubfamilyName and variationsPostScriptNamePrefix; the Exports tab the same plus styleNames, styleMapFamilyNames, styleMapStyleNames, preferredFamilyNames, preferredSubfamilyNames and variableStyleNames; the Masters tab offers none and keeps master properties as read. The pickers of the reference app settle the three lists.",
]
observe = [
  "In font A (m7-one), click the plus button beside General on the Font tab: write down the fields offered, in their order.",
]

[[command]]
id = "font.info.addField"
label = "Add Field"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], key: string, value?: any, language?: string}"
area = "font-info"
milestone = "M7"
summary = "Adds an optional field row (for example familyNames, postscriptFontName or postscriptFullName) under the General heading of the Font, Masters or Exports tab. In the UI this is the plus button beside the heading followed by picking the field and pressing Add."
ref = "Font Info; Font Info › Font › Family Name"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.3."
guesses = [
  "Adding a field that is already present on a target is refused with a message pointing to Set Localized Value; the reference app settles it.",
  "A new localizable field gets one entry in the default language (dflt) holding the given value, or else the built-in value it overrides (familyNames takes the Family Name, styleNames the Style Name), else empty text; adding the field in the reference app settles it.",
]
observe = [
  "In font A (m7-one), add familyNames from the plus button beside General, then try to add it again: note the new row's language and value, and whether the second add is offered or refused.",
]

[[command]]
id = "font.info.removeField"
label = "Remove Field"
menu = []
shortcut = "Cmd+Delete"
when = "panel:fontInfo"
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], keys: [string]}"
area = "font-info"
milestone = "M7"
summary = "Deletes the selected field rows. Reached through the minus button at the right of a row (shown with Alt held on rows that normally show a plus button) or by selecting rows and pressing the shortcut."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.3."
guesses = [
  "Built-in fields (Family Name, Units per Em, Version, Creation Date, Style Name, Weight Class, Width Class) cannot be removed; only added fields and custom parameters can; the reference app settles it.",
]

[[command]]
id = "font.info.setLocalizedValue"
label = "Set Localized Value"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', target?: id|name|index, key: string, language: string, value: string}"
area = "font-info"
milestone = "M7"
summary = "Adds or changes one language entry of a localizable field. In the UI the plus button beside the field adds another localization row and the language menu picks its language."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. Languages are OpenType language system tags without trailing spaces, as the file format stores them (GlyphsSDK `infoValue.language`: dflt, DEU…). M7 plan § 4: M7.3."
guesses = [
  "A language tag the name table cannot map to a Windows language id is refused, except dflt (the default); the language menu of the reference app settles which tags it offers.",
]
observe = [
  "In font A (m7-one), open the language menu of a familyNames row: write down the languages offered, then save and note how each language is written in the file.",
]

[[command]]
id = "font.info.removeLocalizedValue"
label = "Remove Localized Value"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', target?: id|name|index, key: string, language: string}"
area = "font-info"
milestone = "M7"
summary = "Removes one language entry from a localizable field, the counterpart of the minus button on a localization row."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.3."
guesses = [
  "Removing the last language entry of a field removes the field; removing its default (dflt) entry while others remain is allowed, and export then uses the English entry as the default name; the reference app settles both.",
]
observe = [
  "In font A (m7-one), give familyNames a default-language row and a German row, remove the default-language row, then remove the last row: note what remains each time and whether the field disappears.",
]

[[command]]
id = "font.info.copyRows"
label = "Copy Rows"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', target?: id|name|index, keys?: [string]}"
area = "font-info"
milestone = "M7"
summary = "Returns the selected Font Info rows (fields, custom parameters) as a transferable value and, in the UI, puts them on the clipboard. The UI reaches it through the normal Edit > Copy (Cmd+C) while rows are selected, so it has no menu entry or shortcut of its own."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.3."
guesses = [
  "Rows are copied as our own JSON (scope, kind, key, value, enabled) and, for custom parameters and fields, also as property-list text in the file format's spelling, so a text editor or another document can read them; copying rows in the reference app and pasting into a text editor settles the format.",
]
observe = [
  "In font A (m7-one), select a field row and a custom-parameter row together, choose Copy and paste into a text editor: keep the clipboard text.",
]

[[command]]
id = "font.info.pasteRows"
label = "Paste Rows"
menu = []
shortcut = ""
kind = "engine"
params = "{scope: 'font'|'master'|'instance', targets?: [id|name|index], rows?: [row], text?: string, mode?: 'replace'|'append'|'skip'}"
area = "font-info"
milestone = "M7"
summary = "Inserts previously copied rows into the current tab. The UI reaches it through Edit > Paste (Cmd+V); how a pasted row that already exists is merged, and whether pasting into another font or tab is allowed, is not documented."
ref = "Font Info"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.3."
guesses = [
  "The mode append adds parameters after the others and, since a field cannot repeat, replaces a field the target has; skip leaves out every row the target already has; pasting in the reference app settles both.",
  "A pasted row whose field or single-valued parameter is already present replaces its value, a repeatable parameter is appended, a row not allowed in the target scope is skipped and listed, and pasting between tabs and between documents is allowed; pasting in the reference app settles all four.",
]
observe = [
  "In font A (m7-one), copy a field row and a parameter row, then paste them into the Exports tab, into font B (m7-two)'s Font tab, and back into font A (m7-one)'s Font tab where they already exist: note for each whether the rows are added, replaced, duplicated or refused.",
]

