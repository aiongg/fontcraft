[[behavior]]
id = "fea.var.conditionset"
area = "features"
milestone = "M9"
summary = "`conditionset NAME { tag min max; ... } NAME;` names a set of axis ranges that must all hold. This is not in AFDKO spec 1.27, which leaves feature variations unspecified; it comes from the syntax proposed in afdko pull request 1350 and implemented by fontTools feaLib. fea-rs: yes (variable_conditionset tests; fractional bounds allowed; unknown axis and out-of-range bounds are errors)."
ref = "fea-rs (fontc/fea-rs) parse grammar and tests; afdko PR 1350"
status = "docs"
notes = "FontCraft (M9.12): compiled by fea-rs in the variable font export, with the variation info of `fontcraft_features::var_info`; a static export refuses it, as fea-rs does outside a variable font. Bounds are user coordinates, normalised through the axis mapping; a condition set equal to one of the alternate layers' gives one record holding both."

[[behavior]]
id = "fea.var.variation"
area = "features"
milestone = "M9"
summary = "`variation TAG CONDSET { ... } TAG;` gives the lookups that replace the feature's normal lookups while the condition set matches, producing a FeatureVariations record. The lookups of the ordinary feature block of the same tag are included as well. fea-rs: yes (variation_block, variable_feature_include_base tests)."
ref = "fea-rs (fontc/fea-rs) parse grammar and tests; afdko PR 1350"
status = "docs"
notes = "FontCraft (M9.12): compiled by fea-rs in the variable font export, with the variation info of `fontcraft_features::var_info`; a static export refuses it, as fea-rs does outside a variable font."

[[behavior]]
id = "fea.var.variationNull"
area = "features"
milestone = "M9"
summary = "`variation TAG NULL { ... } TAG;` writes a feature variation record with no condition set, which therefore always applies. fea-rs: yes (variable_feature_null_conditionset test)."
ref = "fea-rs (fontc/fea-rs) compile tests"
status = "docs"
notes = "FontCraft (M9.12): compiled by fea-rs in the variable font export, with the variation info of `fontcraft_features::var_info`; a static export refuses it, as fea-rs does outside a variable font."
