[[behavior]]
id = "file.openTwiceActivates"
area = "import-export"
milestone = "M1"
summary = "Opening a file that is already open makes its document the active one instead of opening a second copy, so two documents never write the same file."
ref = "FontCraft design"
status = "inferred"

[[behavior]]
id = "commands.batchIsOneUndoStep"
area = "automation"
milestone = "M1"
summary = "The edits of all steps of a command batch are one undo step per document they changed, labelled with the batch's label. Undo and redo cannot be steps of a batch."
ref = "FontCraft design"
status = "inferred"

[[behavior]]
id = "commands.failedCommandChangesNothing"
area = "automation"
milestone = "M0"
summary = "A command that returns an error leaves every document, its history and the journal exactly as they were. The engine snapshots before each top-level command and restores on error or on an internal failure."
ref = "FontCraft design (docs/architecture.md › Commands)"
status = "inferred"

[[behavior]]
id = "commands.neverPanic"
area = "automation"
milestone = "M0"
summary = "No command panics, whatever its parameters and the document state: wrong types, absurd sizes, missing glyphs, cyclic components and non-finite numbers are errors that name the command and the parameter. Checked by the junk-parameter sweep over the whole registry."
ref = "AGENTS.md › Never crash"
status = "inferred"

[[behavior]]
id = "commands.explicitTargets"
area = "automation"
milestone = "M0"
summary = "Every engine command can name what it acts on (glyphs, layer, nodes, paths) in its parameters. The UI fills those from its selection; agents and the CLI pass them. No engine command depends on UI state."
ref = "FontCraft design (docs/architecture.md › Commands)"
status = "inferred"

[[behavior]]
id = "commands.queriesNotJournaled"
area = "automation"
milestone = "M0"
summary = "Commands that only read are queries: they are not recorded in the journal and do not create undo steps."
ref = "FontCraft design"
status = "inferred"

[[behavior]]
id = "shortcuts.platformMapping"
area = "ui-chrome"
milestone = "M14"
summary = "Shortcuts are stored in Mac notation. On Windows and Linux, Cmd maps to Ctrl and Alt stays Alt; a shortcut that already uses Ctrl together with Cmd gets a documented alternative, since the two would collide. The mapping table lives with the shortcut editor."
ref = "FontCraft design, following the sibling apps"
status = "inferred"

[[command]]
id = "dialog.open"
label = "Open Dialog"
menu = []
shortcut = ""
kind = "ui"
params = "{dialog: id | command: id, params?: {…}} → the open dialog as ui.dialog.inspect shows it"
area = "ui-chrome"
milestone = "M3"
summary = "Opens a command's dialog, by the dialog's id or by the command it runs. Parameters of its fields set their first values; the others (glyph, glyphs, layer, points…) say what it acts on, else the selection does. A menu item whose command has a dialog opens it the same way. Agents fill it with ui.dialog.set and close it with ui.dialog.confirm or ui.dialog.cancel."
ref = "FontCraft design (decision 0004, item 6)"
status = "inferred"
guesses = [
  "Our own command with no counterpart in the reference; its parameters and result are our design.",
]

[[behavior]]
id = "dialog.livePreview"
area = "ui-chrome"
milestone = "M3"
summary = "A dialog is a form over its command's parameters. Every change of a field shows the command's result on the canvas at once, computed from the font as it was when the dialog opened, without an undo step. OK keeps the last preview as one undo step labelled with the dialog's title; Cancel puts back the font the dialog opened on. Filling the dialog and pressing OK gives the same font as running the command with the same parameters. Every filter with parameters has a dialog generated from its filter.list schema. While a dialog is open the rest of the app takes no editing input."
ref = "FontCraft design (decision 0004, item 6)"
status = "inferred"
guesses = [
  "Every filter dialog previews its result live and OK keeps it as one undo step; a tutorial video shows this for Transformations only.",
  "Dialogs remember their last values for the session, and their first values are ours (11-filters open questions).",
]

[[behavior]]
id = "dialog.fieldKeys"
area = "ui-chrome"
milestone = "M3"
summary = "In a dialog's number field, Return takes the typed value, Escape drops it and leaves the field, Tab and Shift+Tab take it and move to the next or previous field, Up and Down change the value by 1 and by 10 with Shift, each change previewed. Text that is not a value in the field's range is refused and the field keeps its value. With no field taking the keyboard, Return is OK and Escape is Cancel."
ref = "Edit View › Measuring › Measuring with the Info box (the field rules); platform convention (Return and Escape)"
status = "inferred"
guesses = [
  "Dialog number fields follow the Info box's editing and arrow-key rules (infoBox.fieldEditing, infoBox.arrowKeyStepping); the handbook documents them for the Info box only.",
]
