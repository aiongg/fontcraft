menu = ["File"]
shortcut = "Cmd+W"
kind = "engine"
params = "{discard?: bool} → {closed: title}"
area = "ui-chrome"
milestone = "M0"
summary = "Closes the active document. With unsaved changes the app asks Save, Don't Save or Cancel; headless, the command fails unless discard is true."
ref = "platform convention"
status = "memory"
notes = "Window (M14.3): File › Close, Cmd+W and `ui.menu.invoke` on a modified document open window.closePrompt for it instead of failing. Save writes it (with the save chooser when it has no file) and closes it; Don't Save closes it with discard; Cancel, a cancelled chooser or a failed save keep it open. Run as a command (`engine.execute`, MCP, the CLI) it keeps refusing unsaved changes unless discard is true."
guesses = [
  "The Save, Don't Save and Cancel question and Cmd+W are recalled from the reference, not read in a source.",
]

