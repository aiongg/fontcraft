# Application-wide commands and rules that no handbook chapter owns: the Edit menu's undo and
# clipboard commands, closing and quitting, and the commands agents use to discover the others.
# Written for FontCraft on 2026-10-07. The menu items and shortcuts are the platform conventions
# every document app follows (status "memory": to be checked against the running reference app);
# the agent-facing commands are our own design (status "inferred").

[[command]]
id = "edit.undo"
label = "Undo"
menu = ["Edit"]
shortcut = "Cmd+Z"
kind = "engine"
params = "{} → {undone: label, revision}"
area = "ui-chrome"
milestone = "M0"
summary = "Reverts the last change of the active document and moves it to the redo list. FontCraft keeps one history per document; the reference keeps one per glyph, with font-level changes outside it (docs/spec/00-open-decisions.md, D4)."
ref = "platform convention"
status = "memory"
guesses = [
  "The menu label and Cmd+Z are recalled from the reference, not read in a source.",
]

[[command]]
id = "edit.redo"
label = "Redo"
menu = ["Edit"]
shortcut = "Cmd+Shift+Z"
kind = "engine"
params = "{} → {redone: label, revision}"
area = "ui-chrome"
milestone = "M0"
summary = "Reapplies the change last undone. Any new change empties the redo list."
ref = "platform convention"
status = "memory"
guesses = [
  "The menu label and Cmd+Shift+Z are recalled from the reference, not read in a source.",
]

[[command]]
id = "edit.cut"
label = "Cut"
menu = ["Edit"]
shortcut = "Cmd+X"
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}]} → {json: string, svg: string, selection}"
area = "drawing"
milestone = "M3"
summary = "Copies the targeted points, shapes, anchors and guides (edit.copy) and then deletes them (edit.delete), as one undo step. Font View cuts whole glyphs and text mode cuts text (M4, M5). The handbook names Cut in the Edit menu; the data it returns is our design (clipboard format)."
ref = "Edit View › Duplicating Paths; Import & Export › Vector Drawing Applications"
status = "inferred"
guesses = [
  "What Cut puts on the clipboard (our JSON text with an SVG flavour) is our format; the reference's clipboard content is not documented.",
]

[[command]]
id = "edit.copy"
label = "Copy"
menu = ["Edit"]
shortcut = "Cmd+C"
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}]} → {json: string, svg: string, skipped?: count}"
area = "drawing"
milestone = "M3"
summary = "Returns the targeted points, shapes, anchors and guides as our JSON fragment (clipboard format) and as an SVG path for other apps. A partly selected path is copied as open paths made of its selected segments; without targets the whole layer side is copied. The engine never touches the system clipboard. The handbook names copy and paste as the alternative to Option-drag; the flavours are our design."
ref = "Edit View › Duplicating Paths; Import & Export › Vector Drawing Applications"
status = "inferred"
notes = "Shell (M3.8): Cmd+C and Edit › Copy in Edit View run this on the selection and put the `json` text on the system clipboard. egui hands the platform one text per copy, so the SVG flavour reaches other apps only through this command's result. Cmd+X and Edit › Cut do the same with edit.cut. In Font View, Cmd+C and Edit › Copy run it with the selected glyphs as `glyphs` and the master shown as `master`, and put the copied glyphs on the system clipboard; Cut does nothing there. Nothing is copied while a text field has the keyboard or a dialog is open."
guesses = [
  "The clipboard text is our JSON format with an SVG flavour; what the reference puts on the clipboard is not documented.",
]

[[command]]
id = "edit.paste"
label = "Paste"
menu = ["Edit"]
shortcut = "Cmd+V"
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, json?: string, svg?: string, pdf?: base64, text?: string, at?: [x, y]} → {pasted: count, flavour: json|svg|pdf, outOfBounds: bool, bounds?: [xMin, yMin, xMax, yMax], correction?: [dx, dy], notes?: string, selection}"
area = "drawing"
milestone = "M3"
summary = "Inserts a JSON fragment, SVG or PDF into the layer at the original coordinates (or at `at`), rounds them to the grid (paste.roundsToGrid) and reports when the result lies far outside the glyph box (paste.outOfBoundsCorrection): more than half an em outside it, with the move that brings the box's bottom left to the origin as the suggested correction (our choices; the handbook gives neither). Paste Special and Paste After are separate commands (edit.pasteSpecial, edit.pasteAfter). The handbook names Edit › Paste for outlines from vector apps (paste.vectorOutlines); the flavours are our design."
ref = "Edit View › Duplicating Paths; Import & Export › Vector Drawing Applications"
status = "inferred"
notes = "Shell (M3.8): Cmd+V in Edit View runs this with the system clipboard's text as `text` on the edited layer, as the person's run, so dialog.pastedOutlineBounds can follow. Edit › Paste asks the platform for the clipboard text first. In Font View, Cmd+V runs it with the clipboard text when that text holds copied glyphs (from this document or another); other text is not pasted there, and the status bar says why. Clipboard text over 16 MiB is refused with a message. `pdf` is a drawing app's PDF clipboard data as base64, read by `fontcraft-io-pdf` (first page, outlines only, a stroked path's line width kept as its stroke width); over 64 MiB it is refused with a message, and io-pdf's own limits refuse hostile files. On the canvas the desktop window reads the system clipboard's PDF (`ClipboardFlavours` in `crates/ui/src/app/clipboard.rs`; the desktop app reads it in `apps/fontcraft-next/src/clipboard/`, through the system clipboard's own interface on Windows and macOS, and through `wl-paste` or `xclip` on Linux and BSD) and passes it as `pdf` when the clipboard's text is neither our fragment nor SVG, and when Edit › Paste or the paste key finds no text. The read runs off the window's thread; a later frame pastes into the glyph that was edited when the read started, or pastes the text when the clipboard holds no PDF. Paste Special and Font View never read the PDF. The browser has no reader and pastes text only."
guesses = [
  "Paste reads our JSON clipboard format, SVG or PDF; which other clipboard data the reference accepts is not documented.",
  "A pasted PDF keeps one font unit per point with its page's bottom-left corner on the glyph's origin, as a pasted SVG keeps its own coordinates; pasting a PDF of known geometry from a drawing app into the reference would settle it.",
  "When several flavours are given, JSON is read first, then SVG, then PDF, and one that cannot be read gives way to the next; which flavour the reference prefers when a drawing app offers both SVG and PDF is not documented.",
  "The desktop shell passes the clipboard's PDF only when its text cannot be pasted, so readable text wins over a PDF; copying a shape from a drawing app that offers both and pasting it into the reference would settle it.",
  "A paste made while the clipboard's PDF is still being read for the previous one is dropped with a message in the status bar; pasting twice quickly from a drawing app into the reference would settle what it does.",
]

[[command]]
id = "file.close"
