[[behavior]]
id = "commands.batchIsOneUndoStep"
area = "automation"
milestone = "M1"
summary = "The edits of all steps of a command batch are one undo step per document they changed, labelled with the batch's label. Undo and redo cannot be steps of a batch."
ref = "FontCraft design"
