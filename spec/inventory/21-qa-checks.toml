# Panels
# ---------------------------------------------------------------------------

[[panel]]
id = "window.fontAudit"
label = "Font Audit"
location = "window"
controls = [
  "profile pop-up (outlines, opentype, universal, strict, user and project profiles)",
  "target pop-up (this font, selected glyphs, current glyph, export of this font, family of open fonts)",
  "Run button with progress and cancel",
  "summary counters for fail, warn, info, passed and skipped",
  "severity filter toggles, group filter, search field, 'fixable only' and 'current glyph only' toggles",
  "result outline grouped by check, by glyph or by severity; each row shows severity, glyph or table, master and message",
  "detail area for the selected result: description of the check, location, data values, fix preview",
  "Fix button for the selected results and Fix All Safe button",
  "Ignore button with reason field, and a 'show ignored' toggle",
  "double-click or Return on a row reveals the issue in Edit View or Font Info",
  "gear menu: edit profiles, thresholds, export report, clear cache, live audit",
]
area = "qa"
milestone = "M12"
summary = "Runs audits and lists their results. Selecting a row reveals the issue; fixes and ignores apply to the selected rows. Every control dispatches an audit.* command, so the panel holds no logic of its own."
ref = "Our design; cf. fontbakery HTML report, fontTools varLib.interpolatable report"
status = "inferred"
notes = "Built in M12.64 (crates/ui-egui/src/shell/font_audit.rs). Click selects a row, Cmd-click adds or removes one, Shift-click selects a range; double-click or Return reveals the current row. The detail area shows the check's description, the location, the result's data and the fix's description with whether it is safe; a computed fix preview (audit.fix dryRun) is not built. Fix, Fix All Safe, Ignore and Stop Ignoring run their engine command and then run the audit again. The profile pop-up lists the built-in and the user's profiles; the document's project profiles are listed once audit.profile.list returns them. The gear menu has Edit Profiles and Thresholds, Clear Cache and Live Audit; Export Report is not built (it needs a save-file chooser), audit.export does it from the command line and the control channel. Progress and cancel are not built."
guesses = [
  "Fix runs the selected rows' fixes with safeOnly false, since the person chose them, while Fix All Safe keeps safeOnly true; watching how people use the panel would settle it.",
  "Ignoring several rows at once is one undo step (a command.batch); nothing settles it.",
  "The panel sits at the top right of the window and lists sixteen rows before it scrolls; a layout review would settle it.",
]

[[panel]]
id = "dialog.auditProfile"
label = "Audit Profile"
location = "dialog"
controls = [
  "profile name and storage (user or project)",
  "included profiles list",
  "check list grouped by group with a checkbox and a severity override pop-up per check",
  "threshold fields for the selected check with their defaults",
  "project values: vendor ID, foundry URL, allowed tables, reference glyph set, file size limits",
  "Duplicate, Delete, Cancel and Save buttons",
]
area = "qa"
milestone = "M12"
summary = "Edits a user or project audit profile: which checks run, with which severity and thresholds. Built-in profiles open read-only and can be duplicated."
ref = "Our design; cf. fontbakery profile and configuration file"
status = "inferred"
notes = "Built in M12.64 (crates/ui-egui/src/dialogs/audit_profile.rs), opened by audit.editProfile and closed by audit.closeProfileDialog. It is modal and changes nothing until Save. A check's box adds it to checks or exclude, or takes it out of the list that turned it on or off; the severity pop-up sets an override for every message of the check (overrides of single message codes are kept as read). Threshold fields show the selected check's thresholds with their defaults. Project values are the open document's (audit.config.set), saved with the profile as one command.batch. The id of a saved profile and its storage cannot change in the dialog; Duplicate makes a copy under a new id."
guesses = [
  "A built-in profile opens as a read-only draft that includes it, and Duplicate turns that into a user profile `<id>-copy` that includes the built-in one instead of listing its checks; nothing settles it.",
  "Project values are edited in the profile dialog although they belong to the document, not to the profile, because the inventory row lists them there; a design review would settle it.",
]

