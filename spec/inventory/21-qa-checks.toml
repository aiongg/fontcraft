fixable = false
area = "qa"
milestone = "M12"
summary = "A menu name breaks the hard limits of old systems: one of IDs 1, 2, 4, 16, 17 or 18 is longer than 63 characters, the Mac compatible full name (ID 18) is not unique among the family's fonts within its first 31 characters, or the full name (ID 4) is not unique within a typographic family."
ref = "comparefamily single-face test 1; comparefamily single-face test 2"
status = "docs"
notes = "The binary check reports the 63-character limits. The two uniqueness rules need several fonts: full names that repeat are check.family.duplicateFullNames; the rule that name ID 18 is unique within its first 31 characters is not built yet."

[[check]]
id = "check.names.versionString"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The version cannot be read from name ID 5, or it differs from head.fontRevision by more than rounding (a tiny difference warns). Stricter house rules: the string starts with 'Version ' followed by digits with three decimals, is above 1.000, and does not contain the word Development. The fix rewrites ID 5 from head.fontRevision."
ref = "fontbakery opentype/font_version; comparefamily single-face test 4; fontbakery googlefonts/name/version_format; fontbakery microsoft/version"
status = "docs"
notes = "The comparison with head.fontRevision follows FontBakery exactly (fail beyond 1/2000, warn beyond 1/65536). The house rules use comparefamily test 4's pattern on the Windows English record."
guesses = ["The house-rule messages (Version prefix, three decimals, above 1.000, the word Development) are informational by default, so the opentype verdict equals FontBakery's opentype/font_version; a profile can raise them. Comparing verdicts on corpus fonts with short version strings would show whether that suits users."]

[[check]]
id = "check.names.italicNames"
severity = "fail"
