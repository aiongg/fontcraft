# ---------------------------------------------------------------------------
# Panels
# ---------------------------------------------------------------------------

[[panel]]
id = "window.fontAudit"
label = "Font Audit"
location = "window"
controls = [
  "profile pop-up (outlines, opentype, universal, strict, user and project profiles)",
  "target pop-up (this font, selected glyphs, current glyph, export of this font, family of open fonts)",
  "Run button with progress and cancel",
  "summary counters for fail, warn, info, passed and skipped",
  "severity filter toggles, group filter, search field, 'fixable only' and 'current glyph only' toggles",
  "result outline grouped by check, by glyph or by severity; each row shows severity, glyph or table, master and message",
  "detail area for the selected result: description of the check, location, data values, fix preview",
  "Fix button for the selected results and Fix All Safe button",
  "Ignore button with reason field, and a 'show ignored' toggle",
  "double-click or Return on a row reveals the issue in Edit View or Font Info",
  "gear menu: edit profiles, thresholds, export report, clear cache, live audit",
]
area = "qa"
milestone = "M12"
summary = "Runs audits and lists their results. Selecting a row reveals the issue; fixes and ignores apply to the selected rows. Every control dispatches an audit.* command, so the panel holds no logic of its own."
ref = "Our design; cf. fontbakery HTML report, fontTools varLib.interpolatable report"
status = "inferred"

[[panel]]
id = "dialog.auditProfile"
label = "Audit Profile"
location = "dialog"
controls = [
  "profile name and storage (user or project)",
  "included profiles list",
  "check list grouped by group with a checkbox and a severity override pop-up per check",
  "threshold fields for the selected check with their defaults",
  "project values: vendor ID, foundry URL, allowed tables, reference glyph set, file size limits",
  "Duplicate, Delete, Cancel and Save buttons",
]
area = "qa"
milestone = "M12"
summary = "Edits a user or project audit profile: which checks run, with which severity and thresholds. Built-in profiles open read-only and can be duplicated."
ref = "Our design; cf. fontbakery profile and configuration file"
status = "inferred"

# ---------------------------------------------------------------------------
# Behaviours
# ---------------------------------------------------------------------------

[[behavior]]
id = "audit.scopeResolution"
area = "qa"
milestone = "M3"
summary = "A check with scope source reads the editable document; one with scope binary reads compiled tables, and when the target is a source the auditor compiles each exporting instance in memory first and maps findings back to source glyphs and Font Info fields where it can; one with scope family needs at least two fonts and is skipped otherwise."
ref = "Our design"
status = "inferred"

[[behavior]]
id = "audit.preconditions"
area = "qa"
milestone = "M3"
summary = "Each check declares preconditions (TrueType or CFF outlines, variable or static, hinted, a table present, a script covered, network allowed, project value set). When one is not met the check is recorded as skipped with the reason and produces no results."
ref = "fontbakery check conditions"
status = "docs"

[[behavior]]
id = "audit.severityOverrides"
area = "qa"
milestone = "M12"
summary = "A profile may change the severity of a whole check or of one message code of a check, and a check may emit several codes with different severities; the row's severity in the inventory is the most severe one it can emit by default."
ref = "fontbakery profile overrides"
status = "docs"

[[behavior]]
id = "audit.resultCap"
area = "qa"
milestone = "M3"
summary = "Heuristic outline checks are capped: when one check yields more than `maxResults` (default 100) results in a font, the individual results are replaced by one informational summary result with the count, since that many hits usually means the heuristic does not suit the design."
ref = "fontbakery outline checks FALSE_POSITIVE_CUTOFF"
status = "docs"
notes = "Built in M3. audit.fix ignores the cap, so a capped check is still fixed everywhere."

[[behavior]]
id = "audit.glyphHashCache"
area = "qa"
milestone = "M3"
summary = "For source targets the auditor stores a hash of each glyph's outline and metrics with the results; a later run skips glyphs whose hash is unchanged and reuses their results, unless `all` is set. Results fixed or changed by hand invalidate the hash of that glyph only."
ref = "AFDKO checkoutlinesufo hash map (--all, --clear-hash-map)"
status = "docs"
notes = "Not built in M3: every run examines every selected glyph. audit.results marks the results of glyphs edited since the run as stale."

[[behavior]]
id = "audit.glyphSelectionSyntax"
area = "qa"
milestone = "M12"
summary = "Wherever a glyph list is accepted on the command line, entries may be glyph names, glyph indexes, ranges written first-last, and CID values written with a leading slash; separators are commas or any white space, and a list may be read from a file. Entries that match no glyph draw a warning and are skipped."
ref = "AFDKO checkoutlinesufo -g, -f"
status = "docs"

[[behavior]]
id = "audit.overlapTestsDecomposedCopy"
area = "qa"
milestone = "M3"
summary = "Outline geometry checks look at a glyph as it will be exported: components are decomposed in a temporary copy before the test. A fix that changes such a glyph writes the decomposed, repaired outline; glyphs whose test passes are left as composites."
ref = "AFDKO checkoutlinesufo (decomposeAllComponents before testing)"
status = "docs"
notes = "M3 tests the decomposed outline but does not decompose when fixing: with safeOnly the layer is skipped, without it Remove Overlap merges the paths and leaves the components."

[[behavior]]
id = "audit.outlineFixOrder"
area = "qa"
milestone = "M3"
summary = "Outline fixes run in a fixed order: coincident points, flat curves and collinear lines first, then overlap removal, then tiny-contour removal, then collinear lines once more, because overlap removal can create new collinear nodes and slivers."
ref = "AFDKO checkoutlinesufo (do_overlap_removal, do_cleanup)"
status = "docs"
notes = "M3 order: close open paths, Tidy up Paths, Remove Overlap, Tidy up Paths again (only after an overlap removal), Correct Path Direction, Add Extremes, add inflections, start points, Round Coordinates. Tiny-contour removal has no command yet. The layer is checked again before each step."

[[behavior]]
id = "audit.outlineFixRounding"
area = "qa"
milestone = "M3"
summary = "After an outline fix the coordinates are rounded to integers, or to three decimals when decimal coordinates are allowed, and points that became coincident through rounding are merged."
ref = "AFDKO checkoutlinesufo -d and post-fix clean-up"
status = "docs"
notes = "Not built in M3: the fix commands put the points they create on the font's grid, and nothing else is rounded afterwards."

[[behavior]]
id = "audit.outlineFixKeepsContourOrder"
area = "qa"
milestone = "M3"
summary = "After overlap removal the auditor puts contours back in their earlier order: untouched contours keep their index, merged contours are matched by their topmost point, and a contour's start point is moved back to its old node when that node survives. Can be switched off."
ref = "AFDKO checkoutlinesufo restore_contour_order, --ignore-contour-order"
status = "docs"
notes = "Not built in M3: path.removeOverlap keeps node names and data, but not the earlier contour order or start points."

[[behavior]]
id = "audit.fixKeepsOriginal"
area = "qa"
milestone = "M3"
summary = "A fix applied to a source glyph first copies the unfixed layer to a backup layer of the same master, unless told not to; a fix applied to a font file overwrites the file unless an output path is given."
ref = "AFDKO checkoutlinesufo processed-glyphs layer, -w, -o"
status = "docs"
notes = "Built in M3 for the open document through layers.addBackupLayer (named by date and time). The backup is made only for a layer the fix changes."

[[behavior]]
id = "audit.fixIsOneUndoStep"
area = "qa"
milestone = "M3"
summary = "All edits made by one audit.fix call form a single undo step, and each fix is an ordinary engine command call that is logged like any other."
ref = "Our design"
status = "inferred"
notes = "Built in M3. The journal records the audit.fix call; its result lists each command call with its parameters, so the fix can be replayed without the auditor."

[[behavior]]
id = "audit.interpolationComparesNeighbours"
area = "qa"
milestone = "M12"
summary = "Master compatibility is tested between each master and its nearest neighbour toward the default master, not between all pairs, so one bad master is reported once; kink and weight tests look at the halfway interpolation of each such pair."
ref = "fontTools varLib.interpolatable (master ordering, mid-point tests)"
status = "docs"

[[behavior]]
id = "audit.interpolationTolerance"
area = "qa"
milestone = "M12"
summary = "The contour-order, start-point and weight tests each yield a score from 0 to 1 and report when it falls below `tolerance` (default 0.95; values of 10 or more are read as percentages). The score is included in the result so that results can be ranked."
ref = "fontTools varLib.interpolatable --tolerance"
status = "docs"

[[behavior]]
id = "audit.familyGrouping"
area = "qa"
milestone = "M12"
summary = "Family checks work on two groupings: style-linked groups, fonts with the same family name (name ID 1), and typographic families, fonts with the same typographic family name (name ID 16, falling back to ID 1). Each family check states which grouping it uses."
ref = "AFDKO comparefamily (compatible family vs preferred family groups)"
status = "docs"

[[behavior]]
id = "audit.metricTolerance"
area = "qa"
milestone = "M12"
summary = "Family and single-face metric comparisons accept differences up to `tolerance` design units (default 0); this applies to the BASE table, ligature width and accented-glyph width checks."
ref = "AFDKO comparefamily -tolerance"
status = "docs"

[[behavior]]
id = "audit.projectValues"
area = "qa"
milestone = "M12"
summary = "Checks that compare against house values (vendor ID, foundry URL, embedding permission, allowed tables, reference glyph set) read them from the audit settings and are skipped, not failed, while the value is unset."
ref = "AFDKO comparefamily CF_DEFAULT_URL, CF_DEFAULT_FOUNDRY_CODE; fontbakery configuration file"
status = "docs"

[[behavior]]
id = "audit.validatorKnownIssues"
area = "qa"
milestone = "M12"
summary = "Findings imported from an external validator are filtered through a list of messages known to be wrong or irrelevant for well-formed fonts: recommended TrueType-only tables missing from CFF fonts, registered feature parameters and stylistic-set tags reported as invalid, OS/2 version 4 reported as corrupt, code-page bits without full coverage, low lowestRecPPEM in CFF fonts, italic angle without the italic bit in single-style faces, line-gap and win-metric recommendations, and a loca range error caused by trailing empty glyphs."
ref = "AFDKO docs/MSFontValidatorIssues.md"
status = "docs"

[[behavior]]
id = "audit.liveAudit"
area = "qa"
milestone = "M3"
summary = "With live audit on, the outlines profile is re-run on a glyph shortly after each edit to it, and its markers and the panel rows for that glyph update in place; all other checks run only on request."
ref = "Our design"
status = "inferred"
notes = "Built in M3.17: one audit.run per document revision on the edited layer of the active master, at the next frame, never per frame and not while a drag or a dialog preview runs. The run replaces the document's kept run, as any audit.run does. The panel rows wait for the Font Audit panel (M12)."

[[behavior]]
id = "audit.canvasMarkers"
area = "qa"
milestone = "M3"
summary = "In Edit View each current result with a point, segment, component or anchor location draws a marker coloured by severity at that location; hovering shows the message and clicking selects what the result reports in Edit View (its nodes, both ends of its segments, its components) and the result in the Font Audit panel."
ref = "Our design"
status = "inferred"
notes = "Built in M3.17 without the panel (M12). A reported node gets a ring, a segment or a whole path is drawn over the outline, and each result has a round badge beside the spot it names, up and to the right where that keeps clear of the outline, else in the first clear direction around it, so badges never cover a node or lie on a path. Messages count nodes, handles and paths from 1; result addresses stay 0-based. With live audit off the markers show the last audit.run's results for the edited layer, except stale ones."

[[behavior]]
id = "audit.ignoreListStorage"
area = "qa"
milestone = "M12"
summary = "Ignored issues are stored in the source as a list of check id, optional glyph, master and location, reason and date; entries whose issue no longer occurs are flagged so they can be pruned."
ref = "Our design"
status = "inferred"

[[behavior]]
id = "audit.exitStatus"
area = "qa"
milestone = "M12"
summary = "On the command line the check command exits with 0 when no result reaches the `--fail-on` severity (default fail), 1 when one does, 2 for usage errors and 3 for targets that cannot be read (the statuses every subcommand shares: cli.global.exitCodes). Skipped and ignored results never affect the status."
ref = "fontbakery exit codes and --error-code-on; fontTools varLib.interpolatable --quiet"
status = "docs"

