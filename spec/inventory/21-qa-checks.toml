[[check]]
id = "check.tables.glyfIntegrity"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The glyf table is damaged: loca points at data that is missing, there is unused data after the last glyph, or the number of loca entries does not match maxp.numGlyphs. This is a compiler fault. Trailing empty glyphs are a known source of false reports in other validators."
ref = "fontbakery opentype/glyf_unused_data; fontbakery opentype/loca/maxp_num_glyphs; MS Font Validator E1703 (afdko MSFontValidatorIssues.md 5.a)"
status = "docs"

[[check]]
id = "check.tables.cmapFormat12"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A format 12 cmap subtable exists without a format 4 one, maps no codepoint that needs it, or (warning) leaves out characters that the format 4 subtable maps. The fix rebuilds the subtables from one mapping."
ref = "fontbakery cmap/format_12"
status = "docs"

[[check]]
id = "check.tables.cmapSubtables"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The cmap table has subtables other than the usual Unicode ones (format 4 for the BMP and format 12 for the full repertoire, plus format 14 for variation sequences)."
ref = "fontbakery notofonts/cmap/unexpected_subtables"
status = "docs"

[[check]]
id = "check.tables.fsSelection"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2.fsSelection bits 0 (italic), 5 (bold) and 6 (regular) do not match the style, or disagree with the bold and italic bits of head.macStyle. The fix sets all of them from the style-linking settings."
ref = "fontbakery opentype/fsselection; fontbakery opentype/mac_style; comparefamily single-face test 14"
status = "docs"

[[check]]
id = "check.tables.vendorId"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "OS/2.achVendID differs from the vendor ID configured for the project (`vendorId`); when none is configured, an empty, placeholder or unregistered ID is a warning."
ref = "fontbakery opentype/vendor_id; fontbakery googlefonts/vendor_id"
status = "docs"

[[check]]
id = "check.tables.codePageRanges"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2 ulCodePageRange1/2 are all zero or the table is missing, which makes some Windows applications treat the font as covering no character set. In the stricter variant each code page and Unicode range bit is compared with a coverage heuristic, and supplementary-plane bits require a 32-bit cmap. The fix recomputes the bits from the cmap."
