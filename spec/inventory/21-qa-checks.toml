# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------

[[command]]
id = "audit.run"
label = "Run Audit"
menu = []
shortcut = ""
kind = "engine"
params = "{target?: 'document'|path|[paths], profile?: id, checks?: [id|glob], exclude?: [id|glob], groups?: [group], scope?: ['source'|'binary'|'family'], glyphs?: [names|ranges], glyphFile?: path, masters?: [ids], layers?: [ids], minSeverity?: 'info'|'warn'|'fail', config?: {checkId: {threshold: value}}, maxResults?: count, all?: bool, network?: bool, includeIgnored?: bool, includePassed?: bool}"
area = "qa"
milestone = "M3"
summary = "Runs the selected checks on the open document, a source or font file, or a set of files treated as a family, and returns the result document described in docs/spec/21-qa.md. Defaults: the current document, the document's default profile, every glyph and master, and only glyphs changed since the last run unless `all` is set. Changes nothing in the font."
ref = "fontbakery check-profile; AFDKO checkoutlinesufo; AFDKO comparefamily; fontTools varLib.interpolatable"
status = "docs"
notes = "M3 built the open-document target. M12.44 adds file targets (a source, a compiled font with each face of a collection and the contents of WOFF and WOFF2, several files or a folder of compiled fonts as one family), every check scope (glyph, source, binary and family checks besides the layer checks), preconditions, glyph selection entries and glyphFile (audit.glyphSelectionSyntax), the document's and the application's default profile and project or user profiles with their severity overrides and thresholds, network and includeIgnored. A source's exporting static instances, at most 32, and its variable font (with more than one master) are compiled in memory for the binary and family checks. Only a run on the open document is kept for audit.results and audit.fix. The per-glyph hash cache (`all`) is not built: every run examines every selected glyph."
guesses = ["A source's instances are compiled as TrueType for the binary checks whatever outline format the source exports, and at most 32 of them; a run of the reference auditors on a source would settle whether the CFF flavour or every instance should be read.", "On a source, the family checks receive every instance compiled from it, the variable font included; checks that should compare only the static instances would need the reference tools' behaviour on sources to settle it."]

[[command]]
id = "audit.list"
label = "List Checks"
menu = []
shortcut = ""
kind = "engine"
params = "{profile?: id, groups?: [group], scope?: ['source'|'binary'|'family'], fixable?: bool}"
area = "qa"
milestone = "M3"
summary = "Returns the check registry: id, group, severity, scope, home profile, whether a fix exists, and the one-line description of each check, optionally filtered."
ref = "fontbakery --list-checks"
status = "docs"
notes = "The `scope` filter keeps or drops every check: all registered checks read the source."

[[command]]
id = "audit.describe"
label = "Describe Check"
menu = []
shortcut = ""
kind = "engine"
params = "{check: id}"
area = "qa"
milestone = "M3"
summary = "Returns everything known about one check: description, preconditions, message codes, thresholds with their defaults, the fix id and its parameters, and the profiles that include it."
ref = "Our design; cf. fontbakery check rationale display"
status = "inferred"
own = true
notes = "M3 returns no fix parameters: the registry does not hold them yet. The message codes are those the check emits, with `too-many-results` for a capped check."

[[command]]
id = "audit.results"
label = "Get Audit Results"
menu = []
shortcut = ""
kind = "engine"
params = "{target?: 'document'|path, checks?: [id|glob], exclude?: [id|glob], glyphs?: [names], minSeverity?: 'info'|'warn'|'fail', fixable?: bool, includeIgnored?: bool}"
area = "qa"
milestone = "M3"
summary = "Returns the cached results of the last run for a target without running anything, optionally filtered. Results for glyphs edited since that run are marked stale."
ref = "Our design"
status = "inferred"
own = true
notes = "M3 keeps the last run of each open document until the next run or until the document closes; saving keeps it. A glyph counts as edited when its layers differ from the run's."

[[command]]
id = "audit.fix"
label = "Fix Issues"
menu = []
shortcut = ""
kind = "engine"
params = "{target?: 'document'|path, results?: [resultId], profile?: id, checks?: [id|glob], exclude?: [id|glob], groups?: [group], glyphs?: [names], masters?: [ids], layers?: [ids], minSeverity?: 'info'|'warn'|'fail', config?: object, maxResults?: count, safeOnly?: bool, dryRun?: bool, keepOriginal?: 'backupLayer'|'none', decimal?: bool, keepContourOrder?: bool, output?: path}"
area = "qa"
milestone = "M3"
summary = "Applies the registered fix of every selected result that has one, as a single undo step, then re-runs the affected checks and returns what changed and what remains. `dryRun` reports the planned edits only; `safeOnly` (default true) skips fixes that alter the design; `output` writes a fixed copy of a file target instead of overwriting it."
ref = "AFDKO checkoutlinesufo -e, -o, -w, -d, --ignore-contour-order"
status = "docs"
notes = "M3 fixes the open document. `results` takes ids of the kept run and cannot be combined with the filters; a result whose glyph changed since the run is skipped. The first stage runs each selected Font Info fix (syncVerticalMetrics, syncVersion, syncStyleLinking, syncFamilyValues, sortZones, clearInfoFields, and the source side of cleanNameRecords and cleanInstances) once, through its font.info or font.instance command with that command's defaults, for findings of any scope; with filters, the checks of those fixes run in full, compiling the source when they read compiled fonts. Then each layer runs the outline steps of audit.outlineFixOrder. A fix whose call audit.fix cannot build yet (the glyph-data fixes, the component steps, the kerning, feature and hinting fixes, and the table fixes) is skipped with the reason, and its result reports `available: false`. The result cap does not hide findings from a fix. `decimal`, `keepContourOrder` and file targets wait for M12; `output` is refused."
guesses = [
  "An outline fix on a composite glyph only reports unless `safeOnly` is false (21-qa question 4).",
  "The fixes of M12 run in the three stages and the order of docs/spec/21-qa.md § 5 › Fix calls (glyph data, then layers, then kerning, feature code and hints); no reference tool fixes all of these, so a case where the order changes the result would settle it.",
  "alignHandles turns both handles onto the line that bisects their two directions, keeping their lengths; a type designer's review of fixed kinks would settle whether one handle should stay put instead.",
  "setGdefClasses makes a glyph that must not be a mark a Symbol when the glyph database classes it as a mark; a review of the fixed glyphs' categories would settle it.",
  "cleanKerning leaves a tabular glyph that is kerned through a group shared with other glyphs in the report, because removing the group pair would change their kerning; an exception pair of zero is the other choice, which a review of fixed fonts would settle.",
]

[[command]]
id = "audit.clearCache"
label = "Clear Audit Cache"
menu = []
shortcut = ""
kind = "engine"
params = "{target?: 'document'|path}"
area = "qa"
milestone = "M12"
summary = "Discards cached results and the per-glyph change hashes of a target, so the next run examines every glyph again."
ref = "AFDKO checkoutlinesufo --clear-hash-map"
status = "docs"
notes = "Built in M12.59. No per-glyph hash cache exists yet (audit.glyphHashCache), so clearing drops the run kept for audit.results and audit.fix; a file target keeps no cache and reports `cleared: false`."

[[command]]
id = "audit.profile.list"
