# ---------------------------------------------------------------------------

[[check]]
id = "check.color.paletteBrightness"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A COLR version 0 layer uses a fixed palette colour that is very dark or very bright, so it vanishes on a dark or a light background; such layers should use the text foreground colour instead."
ref = "fontbakery color_cpal_brightness"
status = "docs"
notes = "Follows FontBakery 1.1.0 color_cpal_brightness on the first palette, with the threshold minBrightness (default 0.1 of full brightness from black and from white). Brightness weighs red 0.299, green 0.587 and blue 0.114; FontBakery applies those weights to blue, green and red (fontTools stores colours blue first), so verdicts can differ on purpose."

[[check]]
id = "check.color.emptyGlyphOneForColrV0"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A COLR version 0 font has contours in glyph 1. One Windows renderer paints glyph 1 over other glyphs, so an empty glyph must hold that slot. The fix inserts an empty glyph after .notdef."
ref = "fontbakery empty_glyph_on_gid1_for_colrv0"
status = "docs"
notes = "Follows FontBakery 1.1.0 empty_glyph_on_gid1_for_colrv0: glyph 1 fails when its outline has an area (curves measured in 16 straight steps, areas under 0.01 square units count as empty)."

[[check]]
id = "check.color.colorTableSet"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The colour tables do not suit broad delivery: a COLR version 0 font also carries an SVG table it does not need, a COLR version 1 font has no SVG fallback, an SVG table has no COLR companion, or a variable font carries an SVG table (which cannot vary)."
ref = "fontbakery googlefonts/colorfont_tables"
status = "docs"
notes = "Follows FontBakery 1.1.0 googlefonts/colorfont_tables, with its message codes drop-svg, add-svg, variable-svg and add-colr."

