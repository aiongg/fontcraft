fixable = false
area = "qa"
milestone = "M12"
summary = "A required table is missing: cmap, head, hhea, hmtx, maxp, name, OS/2 or post, plus glyf for TrueType-flavoured files, CFF or CFF2 for OTTO files, and STAT for variable fonts. The optional tables that are present are listed as information."
ref = "fontbakery required_tables"
status = "docs"

[[check]]
id = "check.tables.recommendedTrueTypeTables"
severity = "info"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A TrueType-flavoured font lacks gasp, or the legacy device tables kern, hdmx and VDMX. Never raised for CFF fonts, which have no use for them."
