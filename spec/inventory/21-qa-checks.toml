area = "qa"
milestone = "M3"
summary = "A check with scope source reads the editable document; one with scope binary reads compiled tables, and when the target is a source the auditor compiles each exporting instance in memory first and maps findings back to source glyphs and Font Info fields where it can; one with scope family needs at least two fonts and is skipped otherwise."
ref = "Our design"
status = "inferred"

[[behavior]]
id = "audit.preconditions"
area = "qa"
milestone = "M3"
summary = "Each check declares preconditions (TrueType or CFF outlines, variable or static, hinted, a table present, a script covered, network allowed, project value set). When one is not met the check is recorded as skipped with the reason and produces no results."
ref = "fontbakery check conditions"
status = "docs"

[[behavior]]
id = "audit.severityOverrides"
area = "qa"
milestone = "M12"
summary = "A profile may change the severity of a whole check or of one message code of a check, and a check may emit several codes with different severities; the row's severity in the inventory is the most severe one it can emit by default."
ref = "fontbakery profile overrides"
status = "docs"

[[behavior]]
id = "audit.resultCap"
area = "qa"
milestone = "M3"
summary = "Heuristic outline checks are capped: when one check yields more than `maxResults` (default 100) results in a font, the individual results are replaced by one informational summary result with the count, since that many hits usually means the heuristic does not suit the design."
ref = "fontbakery outline checks FALSE_POSITIVE_CUTOFF"
status = "docs"
notes = "Built in M3. audit.fix ignores the cap, so a capped check is still fixed everywhere."

[[behavior]]
id = "audit.glyphHashCache"
area = "qa"
milestone = "M3"
summary = "For source targets the auditor stores a hash of each glyph's outline and metrics with the results; a later run skips glyphs whose hash is unchanged and reuses their results, unless `all` is set. Results fixed or changed by hand invalidate the hash of that glyph only."
ref = "AFDKO checkoutlinesufo hash map (--all, --clear-hash-map)"
status = "docs"
notes = "Not built in M3: every run examines every selected glyph. audit.results marks the results of glyphs edited since the run as stale."

[[behavior]]
id = "audit.glyphSelectionSyntax"
area = "qa"
milestone = "M12"
summary = "Wherever a glyph list is accepted on the command line, entries may be glyph names, glyph indexes, ranges written first-last, and CID values written with a leading slash; separators are commas or any white space, and a list may be read from a file. Entries that match no glyph draw a warning and are skipped."
ref = "AFDKO checkoutlinesufo -g, -f"
status = "docs"
notes = "Built in M12.44 for audit.run (`glyphs`, `glyphFile`) and the shortcuts. Unmatched entries come back in the result's `warnings`."
guesses = ["A piece that is a glyph name is read as a name even when it holds a hyphen, and `/N` names the glyph `cidNNNNN` (five digits) before glyph index N; a CID-keyed source in the reference tool would settle it."]

[[behavior]]
id = "audit.overlapTestsDecomposedCopy"
area = "qa"
milestone = "M3"
summary = "Outline geometry checks look at a glyph as it will be exported: components are decomposed in a temporary copy before the test. A fix that changes such a glyph writes the decomposed, repaired outline; glyphs whose test passes are left as composites."
ref = "AFDKO checkoutlinesufo (decomposeAllComponents before testing)"
status = "docs"
notes = "M3 tests the decomposed outline but does not decompose when fixing: with safeOnly the layer is skipped, without it Remove Overlap merges the paths and leaves the components."

[[behavior]]
id = "audit.outlineFixOrder"
area = "qa"
milestone = "M3"
summary = "Outline fixes run in a fixed order: coincident points, flat curves and collinear lines first, then overlap removal, then tiny-contour removal, then collinear lines once more, because overlap removal can create new collinear nodes and slivers."
ref = "AFDKO checkoutlinesufo (do_overlap_removal, do_cleanup)"
status = "docs"
notes = "The layer steps audit.fix builds run in the order of docs/spec/21-qa.md § 5 › Fix calls (steps 7 to 33): clear empty glyphs, the component steps (flatten, delete repeats, decompose, realign), close open paths, delete duplicate contours, erase open corners, Tidy up Paths, Remove Overlap, delete tiny contours, Tidy up Paths again (only after an overlap removal), Correct Path Direction, Add Extremes and inflections, convert the curve type, set smooth, align handles, harmonize, snap handles, snap to metric lines, start points, start points that differ between masters, Round Coordinates, then repeated anchors, default anchors, widths from keys and mark widths. Before each step the layer is checked again (glyph checks on the glyph); results of compiled instances are fixed on every master layer of their source glyph from the selection's findings, since a layer cannot be compiled on its own. The contour-order part of fixCompatibility is not built: its result does not carry the proposed order."
guesses = ["The findings of binary checks are not computed again between layer steps; their calls (widths, anchors, emptying a glyph) do not depend on point addresses. Comparing with a run that recompiles before each step would settle whether it matters."]

[[behavior]]
id = "audit.outlineFixRounding"
area = "qa"
milestone = "M3"
summary = "After an outline fix the coordinates are rounded to integers, or to three decimals when decimal coordinates are allowed, and points that became coincident through rounding are merged."
ref = "AFDKO checkoutlinesufo -d and post-fix clean-up"
status = "docs"
notes = "Not built in M3: the fix commands put the points they create on the font's grid, and nothing else is rounded afterwards."

[[behavior]]
id = "audit.outlineFixKeepsContourOrder"
area = "qa"
milestone = "M3"
summary = "After overlap removal the auditor puts contours back in their earlier order: untouched contours keep their index, merged contours are matched by their topmost point, and a contour's start point is moved back to its old node when that node survives. Can be switched off."
ref = "AFDKO checkoutlinesufo restore_contour_order, --ignore-contour-order"
status = "docs"
notes = "Not built in M3: path.removeOverlap keeps node names and data, but not the earlier contour order or start points."

[[behavior]]
id = "audit.fixKeepsOriginal"
area = "qa"
milestone = "M3"
summary = "A fix applied to a source glyph first copies the unfixed layer to a backup layer of the same master, unless told not to; a fix applied to a font file overwrites the file unless an output path is given."
ref = "AFDKO checkoutlinesufo processed-glyphs layer, -w, -o"
status = "docs"
notes = "Built in M3 for the open document through layers.addBackupLayer (named by date and time). The backup is made only for a layer the fix changes."

[[behavior]]
id = "audit.fixIsOneUndoStep"
area = "qa"
milestone = "M3"
summary = "All edits made by one audit.fix call form a single undo step, and each fix is an ordinary engine command call that is logged like any other."
ref = "Our design"
status = "inferred"
notes = "Built in M3. The journal records the audit.fix call; its result lists each command call with its parameters, so the fix can be replayed without the auditor."

[[behavior]]
id = "audit.interpolationComparesNeighbours"
area = "qa"
milestone = "M12"
summary = "Master compatibility is tested between each master and its nearest neighbour toward the default master, not between all pairs, so one bad master is reported once; kink and weight tests look at the halfway interpolation of each such pair."
ref = "fontTools varLib.interpolatable (master ordering, mid-point tests)"
status = "docs"
notes = "Built inside the compatibility checks (checks/compat.rs); M12.44 runs them on sources, designspaces and multi-master files given by path."

[[behavior]]
id = "audit.interpolationTolerance"
area = "qa"
milestone = "M12"
summary = "The contour-order, start-point and weight tests each yield a score from 0 to 1 and report when it falls below `tolerance` (default 0.95; values of 10 or more are read as percentages). The score is included in the result so that results can be ranked."
ref = "fontTools varLib.interpolatable --tolerance"
status = "docs"
notes = "Built in M12.44: audit.checkInterpolation reads 10 or more as a percentage and sets the tolerance of each check that has one; the score is in each result's `data`."

[[behavior]]
id = "audit.familyGrouping"
area = "qa"
milestone = "M12"
summary = "Family checks work on two groupings: style-linked groups, fonts with the same family name (name ID 1), and typographic families, fonts with the same typographic family name (name ID 16, falling back to ID 1). Each family check states which grouping it uses."
ref = "AFDKO comparefamily (compatible family vs preferred family groups)"
status = "docs"
notes = "Built in M12.44: every family check receives all fonts of the run (at most 256) and groups them itself, by name ID 1 or by name ID 16 falling back to ID 1, as checks/family.rs lists per check."
guesses = ["On a compiled font without its source the style comes from name IDs 2 and 17 and the fsSelection bits, never from the file name; only check.files.canonicalFileName reads the file name (21-qa.md question 9)."]

[[behavior]]
id = "audit.metricTolerance"
area = "qa"
milestone = "M12"
summary = "Family and single-face metric comparisons accept differences up to `tolerance` design units (default 0); this applies to the BASE table, ligature width and accented-glyph width checks."
ref = "AFDKO comparefamily -tolerance"
status = "docs"
notes = "audit.compareFamily (M12.44) sets `tolerance` on every selected check with a `tolerance` threshold. The BASE, ligature-width and accent-width checks it names are not in the registry yet."

[[behavior]]
id = "audit.projectValues"
area = "qa"
milestone = "M12"
summary = "Checks that compare against house values (vendor ID, foundry URL, embedding permission, allowed tables, reference glyph set) read them from the audit settings and are skipped, not failed, while the value is unset."
ref = "AFDKO comparefamily CF_DEFAULT_URL, CF_DEFAULT_FOUNDRY_CODE; fontbakery configuration file"
status = "docs"

[[behavior]]
id = "audit.validatorKnownIssues"
area = "qa"
milestone = "M12"
summary = "Findings imported from an external validator are filtered through a list of messages known to be wrong or irrelevant for well-formed fonts: recommended TrueType-only tables missing from CFF fonts, registered feature parameters and stylistic-set tags reported as invalid, OS/2 version 4 reported as corrupt, code-page bits without full coverage, low lowestRecPPEM in CFF fonts, italic angle without the italic bit in single-style faces, line-gap and win-metric recommendations, and a loca range error caused by trailing empty glyphs."
ref = "AFDKO docs/MSFontValidatorIssues.md"
status = "docs"
notes = "The list is fontcraft_audit::export::KNOWN_VALIDATOR_ISSUES, matched by the validator's message code and the font's facts; the importer of the validator's output (files.externalValidator) applies it. The document's private use area warning (W0307) is left in: the audit reports private use code points itself in the strict profile."
guesses = [
  "W2106 (OS/2 version below 3) is treated as wrong for OS/2 version 2 and later, and a ssNN tag counts as registered for 01 to 20 and cvNN for 01 to 99; a run of the validator on fonts with those values would settle it.",
]

[[behavior]]
id = "audit.liveAudit"
area = "qa"
milestone = "M3"
summary = "With live audit on, the outlines profile is re-run on a glyph shortly after each edit to it, and its markers and the panel rows for that glyph update in place; all other checks run only on request."
ref = "Our design"
status = "inferred"
notes = "Built in M3.17: one audit.run per document revision on the edited layer of the active master, at the next frame, never per frame and not while a drag or a dialog preview runs. The run replaces the document's kept run, as any audit.run does. The panel rows wait for the Font Audit panel (M12)."

[[behavior]]
id = "audit.canvasMarkers"
area = "qa"
milestone = "M3"
summary = "In Edit View each current result with a point, segment, component or anchor location draws a marker coloured by severity at that location; hovering shows the message and clicking selects what the result reports in Edit View (its nodes, both ends of its segments, its components) and the result in the Font Audit panel."
ref = "Our design"
status = "inferred"
notes = "Built in M3.17 without the panel (M12). A reported node gets a ring, a segment or a whole path is drawn over the outline, and each result has a round badge beside the spot it names, up and to the right where that keeps clear of the outline, else in the first clear direction around it, so badges never cover a node or lie on a path. Messages count nodes, handles and paths from 1; result addresses stay 0-based. With live audit off the markers show the last audit.run's results for the edited layer, except stale ones."

[[behavior]]
id = "audit.ignoreListStorage"
area = "qa"
milestone = "M12"
summary = "Ignored issues are stored in the source as a list of check id, optional glyph, master and location, reason and date; entries whose issue no longer occurs are flagged so they can be pruned."
ref = "Our design"
status = "inferred"
notes = "Built in M12.59: the list lives in the font user data under `com.fontcraft.audit` with the document's default profile, threshold overrides, project values and project profiles, and survives a save and reopen as .fontcraft, .glyphs and UFO. Entries that cannot be read are dropped and reported. audit.listIgnored flags entries whose issue no longer occurs."

[[behavior]]
id = "audit.exitStatus"
area = "qa"
milestone = "M12"
summary = "On the command line the check command exits with 0 when no result reaches the `--fail-on` severity (default fail), 1 when one does, 2 for usage errors and 3 for targets that cannot be read (the statuses every subcommand shares: cli.global.exitCodes). Skipped and ignored results never affect the status."
ref = "fontbakery exit codes and --error-code-on; fontTools varLib.interpolatable --quiet"
status = "docs"
notes = "Settled by the M12 planning pass (20-cli.md question 20): 3 for an unreadable target, as every subcommand uses. Built in M12.44: a check that failed to run also gives 1, and the run asks the engine for results down to the lower of --min-severity and --fail-on so hidden results still count."
guesses = ["Results hidden by --min-severity still make the exit status 1 when they reach --fail-on; the reference tools have no separate display threshold, so nothing settles it."]

[[behavior]]
id = "audit.networkOptIn"
area = "qa"
milestone = "M13"
summary = "Checks that need network access (name registry lookup, auditor version) never run unless the run explicitly allows network use."
ref = "fontbakery network condition"
status = "docs"
notes = "Moved from M12 to M13 with the two network checks (docs/plans/M12.md § 7, question 4): M12 has no check that needs the network. audit.run takes `network` and `fontcraft-cli check` takes --network (M12.44); the Network precondition holds only when it is set."

# ───────────────────────────── Fix commands (M12 spec pass) ─────────────────────────────

[[command]]
id = "path.eraseOpenCorners"
label = "Erase Open Corners"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]]} → {erased: count, skipped: [[shape, node]], selection}"
area = "path-ops"
milestone = "M12"
summary = "Trims each open corner (two segments that cross just before they meet, joined by a short segment, leaving a small loop outside the outline) back to the crossing point, so the corner is one node again. `points` names either node of each corner; without it, every open corner on the layer is trimmed. The two segments are split at the crossing (curves keep their shape), the loop beyond it is dropped, and the corner's two nodes become one corner node at the crossing. A named node with no open corner is left as it is and listed in `skipped`."
ref = "Our design; docs/spec/21-qa.md § 5 (fix eraseOpenCorners)"
status = "inferred"
own = true
notes = "The audit fix eraseOpenCorners runs it; added by the M12 spec pass because no other chapter has the command."
guesses = ["A corner counts only when the crossing lies in the later half of the first segment and the earlier half of the second, so the part dropped is the smaller one; watching the reference's Erase Open Corners on a corner with a long loop would settle it.", "The new corner node and the handles of the split curves are rounded to the font's grid; checking the coordinates the reference writes after erasing a corner on a curve would settle it."]

[[command]]
id = "component.flatten"
label = "Flatten Components"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, components?: [indices]} → {replaced: count, skipped: [index], selection}"
area = "components"
milestone = "M12"
summary = "Replaces each nested component (one whose base glyph is itself made only of components) by components of the innermost glyphs, with the transformations combined, so the drawn outline stays the same. The new components take the nested component's place in the shape list, in the order of its base glyph's components, and follow nesting to any depth up to `model::MAX_COMPONENT_DEPTH` (32). A named component whose base glyph also has paths, or has no components, is left as it is and listed in `skipped`. Without `components`, every nested component of the layer is flattened. The new components have automatic alignment off, so they stay where they were drawn."
ref = "Our design; ufo2ft flattenComponents filter; docs/spec/21-qa.md § 5 (fix flattenComponents)"
status = "inferred"
own = true
notes = "The audit fix flattenComponents runs it; added by the M12 spec pass."
guesses = ["The flattened components keep the inner components' settings but have automatic alignment off, so the drawn outline cannot move; comparing with the reference's flatten filter output on an automatically aligned composite would settle it."]

[[command]]
id = "tables.recalculate"
label = "Recalculate Table Fields"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, fields?: [string], output?: path, inPlace?: bool} → {changed: [{field, old, new}]}"
area = "cli-tools"
milestone = "M12"
summary = "Recomputes the fields of a compiled font that are derived from its other data: the head and glyph bounding boxes, maxp counts, hhea and vhea extents, OS/2 xAvgCharWidth, Unicode and code-page range bits and first and last character index, the head flags and the checksums. `fields` limits it to the named fields, written `table.field`; every other byte stays as it was."
ref = "Our design; fontTools ttLib (recalcBBoxes, OS/2 range helpers); docs/spec/21-qa.md § 5 (fix patchTable)"
status = "inferred"
own = true
notes = "The audit fix patchTable runs it on compiled fonts; added by the M12 spec pass."

[[command]]
id = "tables.cleanNameRecords"
label = "Clean Name Records"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, dropMac?: bool, output?: path, inPlace?: bool} → {removed: count, changed: count}"
area = "cli-tools"
milestone = "M12"
summary = "Trims and collapses white space in name records, removes empty and repeated records and, unless `dropMac` is false, the Macintosh-platform records, and makes the PostScript name records agree with name ID 6."
ref = "Our design; docs/spec/21-qa.md § 5 (fix cleanNameRecords)"
status = "inferred"
own = true
notes = "The audit fix cleanNameRecords runs it on compiled fonts; added by the M12 spec pass."

[[command]]
id = "tables.rebuildCmap"
label = "Rebuild cmap"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, output?: path, inPlace?: bool} → {mappings: count, conflicts: [{codepoint, kept, dropped}]}"
area = "cli-tools"
milestone = "M12"
summary = "Rebuilds the cmap subtables from one mapping: the union of the existing Unicode subtables, where the platform 3 subtables win a conflict. It writes format 4 for the Basic Multilingual Plane, adds format 12 when a code point lies above it, and keeps format 14 variation sequences as they are."
ref = "Our design; docs/spec/21-qa.md § 5 (fix rebuildCmap)"
status = "inferred"
own = true
notes = "The audit fix rebuildCmap runs it on compiled fonts; added by the M12 spec pass."

[[command]]
id = "tables.recompileCff"
label = "Recompile CFF"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, output?: path, inPlace?: bool} → {glyphs: count, removedKeys: [string]}"
area = "cli-tools"
milestone = "M12"
summary = "Rewrites the CFF table without the charstring operators and dictionary keys the current CFF specification marks obsolete, keeping outlines, hints and widths; an accented glyph drawn with the endchar accent form is written as plain outlines."
ref = "Our design; Adobe Technical Note 5176 and 5177; docs/spec/21-qa.md § 5 (fix recompileCff)"
status = "inferred"
own = true
notes = "The audit fix recompileCff runs it on compiled fonts; added by the M12 spec pass."

[[command]]
id = "tables.cleanInstances"
label = "Clean Named Instances"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, output?: path, inPlace?: bool} → {removed: count, reordered: bool}"
area = "cli-tools"
milestone = "M12"
summary = "Sorts the named instances of fvar by their coordinates, removes repeated ones, writes every record in the same form (all with a PostScript name ID or all without), and points the instance at the default location at the font's own subfamily name."
ref = "Our design; docs/spec/21-qa.md § 5 (fix cleanInstances)"
status = "inferred"
own = true
notes = "The audit fix cleanInstances runs it on compiled fonts; added by the M12 spec pass."

[[command]]
id = "tables.recompileLayout"
label = "Recompile Contextual Positioning"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, output?: path, inPlace?: bool} → {converted: [lookup index]}"
area = "cli-tools"
milestone = "M12"
summary = "Rewrites each contextual positioning lookup of GPOS (type 7, also when it sits inside an extension lookup) as a chained contextual lookup (type 8) with empty backtrack and lookahead sequences, which applies the same rules. Formats 1, 2 and 3 become the same formats of type 8; lookup indices, lookup flags, mark filtering sets and every other table stay as they were. A font without such lookups is left unchanged."
ref = "Our design; OpenType GPOS specification (lookup types 7 and 8); fontbakery gpos7; docs/spec/21-qa.md § 5 (fix recompileLayout)"
status = "inferred"
own = true
notes = "The audit fix recompileLayout runs it on compiled fonts (check.layout.gpos7); added by the M12 spec pass. Sources need no such fix: the feature compiler writes contextual positioning as type 8."

[[command]]
id = "tables.dropAxis"
label = "Drop Axis"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, axis: tag, output?: path, inPlace?: bool}"
area = "cli-tools"
milestone = "M12"
summary = "Removes a variation axis whose minimum equals its maximum: its fvar record and instance coordinates, its avar segment map, its STAT records, and its column in every variation region. An axis with a range is refused."
ref = "Our design; docs/spec/21-qa.md § 5 (fix dropAxis)"
status = "inferred"
own = true
notes = "The audit fix dropAxis runs it on compiled fonts; added by the M12 spec pass."

# ───────────────────────────── Font Info fixes (M12.63) ─────────────────────────────
[[command]]
id = "font.info.syncVerticalMetrics"
label = "Sync Vertical Metrics"
menu = []
shortcut = ""
kind = "engine"
params = "{masters?: [id|name], dryRun?: bool} → {changed: [{scope, target, field, old, new}], dryRun}"
area = "font-info"
milestone = "M12"
summary = "Gives each master one consistent set of vertical metrics without changing its line height: the typo and hhea ascenders become the hhea ascender plus the hhea line gap the master compiles to, both descenders its hhea descender, both line gaps 0, and winAscent and winDescent the highest and lowest point of any glyph of any master. The eight values are written as master custom parameters; without `masters`, the instances' own values of them are removed."
ref = "Our design; docs/spec/21-qa.md § 5 (fix syncVerticalMetrics)"
status = "inferred"
own = true
notes = "The source side of the audit fix syncVerticalMetrics (check.metrics.hheaMatchesTypo, winAscentDescent, lineGaps); added by M12.63. The glyph extents come from compiling each master, as the checks read them."
guesses = [
  "The line gap moves into the ascenders so the hhea line height stays as it was; a reference tool that recommends vertical metrics would settle it.",
  "winAscent and winDescent take the extremes of all masters, so every instance between them is covered; a reference tool's recommendation would settle it.",
]

[[command]]
id = "font.info.syncVersion"
label = "Sync Version String"
menu = []
shortcut = ""
kind = "engine"
params = "{dryRun?: bool} → {changed: [{scope, target, field, old, new}], dryRun}"
area = "font-info"
milestone = "M12"
summary = "Rewrites every version string the source sets (the font's and the instances' versionString, and the versionString and openTypeNameVersion parameters) to `Version <major>.<minor>` from the font's version, the minor with three digits, keeping whatever follows the first semicolon. Strings with a placeholder the compiler fills in are left alone."
ref = "Our design; docs/spec/21-qa.md § 5 (fix syncVersion)"
status = "inferred"
own = true
notes = "The source side of the audit fix syncVersion (check.names.versionString); added by M12.63."

[[command]]
id = "font.instance.syncStyleLinking"
label = "Sync Style Linking"
menu = []
shortcut = ""
kind = "engine"
params = "{dryRun?: bool} → {changed: [{scope, target, field, old, new}], dryRun}"
area = "font-info"
milestone = "M12"
summary = "Sets the style linking of each static instance from its style name: Bold, Italic and Bold Italic link to Regular with their Bold and Italic flags, Regular has neither flag and no link, and another style with the word Italic becomes the italic of the same style without that word. Other styles keep their settings. The compiler derives fsSelection, macStyle and the subfamily name from these settings."
ref = "Handbook: Font Info › Exports › Style Linking (the recommended linking strategy); docs/spec/21-qa.md § 5 (fix syncStyleLinking)"
status = "handbook"
