[[command]]
id = "audit.profile.save"
label = "Save Audit Profile"
menu = []
shortcut = ""
kind = "engine"
params = "{profile: id, label?: string, include?: [profileId], checks?: [id|glob], exclude?: [id|glob], overrides?: [{check, code?, severity}], config?: {checkId: {threshold: value}}, store?: 'user'|'project'}"
area = "qa"
milestone = "M12"
summary = "Creates or replaces a user profile (application settings) or a project profile (stored beside the source). Built-in profiles cannot be overwritten."
