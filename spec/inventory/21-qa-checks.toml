status = "docs"

[[check]]
id = "check.tables.unwantedTables"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The file carries tool-private tables that should not ship: FFTM, TTFA, the VTT sources TSI0-3, TSI5 and TSIC, the VOLT sources TSIV, TSIP, TSIS, TSID, TSIJ and TSIB, and Debg; also GSUB/GPOS features or language systems whose tags begin with zz, left by VOLT. The fix removes them."
ref = "fontbakery unwanted_tables; fontbakery vtt_volt_data"
status = "docs"

[[check]]
id = "check.tables.unwantedAatTables"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The file carries Apple-only tables that are not part of OpenType: acnt, ankr, bdat, bhed, bloc, bmap, bsln, fdsc, feat, fond, gcid, just, kerx, lcar, ltag, mort, morx, opbd, prop, trak, xref or Zaph. The fix removes them."
ref = "fontbakery opentype/unwanted_aat_tables"
status = "docs"

[[check]]
id = "check.tables.unsupportedTables"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The file contains a table outside a configured allow-list (`allowedTables`), for delivery pipelines that reject unknown tables."
ref = "fontbakery adobefonts/unsupported_tables"
status = "docs"

[[check]]
id = "check.tables.dsig"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A DSIG table is present. Nothing current needs a digital signature (or a dummy one), so the table is dead weight. The fix removes it."
ref = "fontbakery opentype/dsig"
status = "docs"

[[check]]
id = "check.tables.postVersion"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The post table format does not suit the font: CFF fonts must use format 3; TrueType fonts with format 3 lose glyph names (warning); formats 2.5 and 4 are not allowed."
