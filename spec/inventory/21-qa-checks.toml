# ---------------------------------------------------------------------------
# files: Files
# ---------------------------------------------------------------------------

[[check]]
id = "check.files.sfntVersion"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The file's sfnt version tag does not match its outlines: 0x00010000 for TrueType outlines, OTTO for CFF and CFF2. The fix rewrites the header."
ref = "fontbakery sfnt_version"
status = "docs"
notes = "Follows FontBakery's sfnt_version: a font with a 'glyf' table needs 0x00010000 even when it also has CFF data. The fix runs tables.recalculate."

[[check]]
id = "check.files.fileSize"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The font file is larger than `warnSize` (default 1 MB) or, as a failure, larger than `failSize` (default 9 MB)."
ref = "fontbakery file_size"
status = "docs"
notes = "The limits are FontBakery's, 1 MiB and 9 MiB, as the thresholds warnSize and failSize. The size is the file's size on disk; a font compiled in memory is measured by its sfnt bytes."
guesses = [
  "A font compiled in memory is measured by its uncompressed sfnt bytes, so a WOFF2 export can warn here and pass in FontBakery; measuring the compressed output would settle it.",
]

[[check]]
id = "check.files.singleDirectory"
severity = "fail"
scope = "family"
fixable = false
area = "qa"
milestone = "M12"
summary = "The files given as one family lie in more than one directory, so they may not belong together."
ref = "fontbakery family/single_directory"
status = "docs"
notes = "Compares the directories of the files given as one family, as FontBakery does; fonts compiled in memory have no directory and the check skips."

[[check]]
id = "check.files.sanitiser"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The font is rejected by a browser-style table sanitiser (structural errors that make browsers refuse the file); sanitiser warnings are passed on as warnings. FontCraft needs its own strict parse pass for this."
ref = "fontbakery ots"
status = "docs"
notes = "Our own strict pass: the sfnt version, the table directory (search fields, order, duplicates, bounds, 4-byte alignment, overlaps), the tables every font needs and an outline table, then every table FontCraft reads (head magic, hhea, maxp, hmtx, OS/2, post, name records, cmap subtables, CFF, CFF2, GDEF, GSUB and GPOS lists and lookups, fvar, avar, gvar, HVAR, STAT) and every 'glyf' glyph. An external sanitiser's errors and warnings are added when one is installed and the run asks for it (AuditServices::run_external)."
guesses = [
  "Unsorted, duplicated, misaligned, overlapping and out-of-bounds tables are failures and wrong search fields a warning, as we read the sanitiser's published behaviour; running the sanitiser on fonts built with each fault would settle it.",
]

[[check]]
id = "check.files.roundTrip"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "Decompiling every table to the text dump and compiling the dump again fails, which exposes structurally broken tables."
ref = "fontbakery ttx_roundtrip"
status = "docs"
notes = "Runs the TTX round trip service (AuditServices::ttx_round_trip) and skips without it. Only a dump or read that fails is reported, as in FontBakery."
guesses = [
  "A table that reads back with different bytes is not reported, because FontBakery reports only errors of the dump and the read; comparing verdicts on the corpus would settle it.",
]

[[check]]
id = "check.files.rasterises"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "Rasterising every glyph at a test size raises an error or crashes the rasteriser."
ref = "fontbakery freetype_rasterizer"
status = "docs"
notes = "Draws every glyph with skrifa at ppem pixels per em (default 48, FontBakery's size), unhinted and, when the font has 'fpgm', 'prep' or CFF hints, hinted with the font's own programs, not pedantically."
guesses = [
  "Every glyph is drawn, where FontBakery loads one character with FreeType, so this check can fail where FontBakery passes; the verdict measure on the corpus would show how often.",
]

[[check]]
id = "check.files.externalValidator"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "Passes on the findings of an external validator when one is installed and configured (`validatorPath`), mapped to our severities and filtered through the known-false-positive list."
ref = "fontbakery fontvalidator; afdko docs/MSFontValidatorIssues.md"
status = "docs"
notes = "Runs only when the project sets validatorPath and the engine provides the validator (AuditServices::run_external); otherwise skipped. The validator's errors and warnings are warnings here, anything milder information. Known false positives are dropped through the list of audit.validatorKnownIssues (export::known_validator_issue), matched by message code and the font's facts."
guesses = [
  "One face audited alone counts as part of a family, so the allowance for a slanted face without the italic bit (italicAngleWithoutItalicBit) never applies here; running the validator on a single slanted face and comparing would settle it.",
]

[[check]]
id = "check.files.canonicalFileName"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The file name is not built from the names inside the font: Family-Style.ext for static fonts, Family[axis tags in alphabetical order].ext for variable ones."
ref = "fontbakery googlefonts/canonical_filename"
status = "docs"
notes = "After FontBakery's googlefonts/canonical_filename, which builds the name with axisregistry's build_filename. Fonts not read from a file skip."
guesses = [
  "The family comes from name ID 16, else 1, and the style from ID 17, else 2, with spaces removed, and an empty style counts as Regular; axisregistry's build_filename would settle it.",
  "A .woff or .woff2 file keeps its extension; any other file is expected to end in .otf for CFF outlines and .ttf otherwise.",
]

