notes = "Only CFF fonts are measured, as comparefamily measures them; CID-keyed fonts are skipped. Each name counts with two bytes, and the warning comes when the total plus two bytes per glyph passes 32767."
observe = [
  "Fault font (one master: an open path, a glyph named with a space, two glyphs with U+0041, a component of a missing glyph, two glyphs that use each other as components, a glyph name of 70 characters): export OTF and TTF; note the export result message for the 70-character glyph name, its wording, and whether the export stops or continues.",
]

[[check]]
id = "check.glyphset.productionNames"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A glyph (or a part of a ligature name) still uses a working name where the glyph database defines a different final name, or uses a name that is neither in the database nor a uniXXXX/uXXXXX name, so it cannot be mapped back to Unicode. The fix renames to production names."
ref = "comparefamily single-face test 26 (working vs final names, unmappable names)"
status = "docs"
notes = "The glyph database replaces the reference's glyph dictionary: a name the database has as a nice name with a different production name is a working name; a name it knows in any form, or a uni or u name, maps to Unicode. Names starting with a period and CID-keyed fonts are skipped."

[[check]]
id = "check.glyphset.unreachableGlyphs"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A glyph cannot be reached: it has no codepoint, no substitution produces it, and no composite, COLR, MATH or variation-selector entry refers to it. The fix removes such glyphs from the export."
ref = "fontbakery unreachable_glyphs"
status = "docs"
notes = "Components of reachable composites are followed to any depth; the reference looks one level down in glyph order, so a component of a component listed before its user is unreachable there. That difference is deliberate. JSTF extender glyphs are exempt, as in the reference."

