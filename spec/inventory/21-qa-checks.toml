status = "docs"

[[check]]
id = "check.metrics.whitespaceWidths"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The space and the no-break space have different advances, or the space has none. The fix copies the space's advance to the no-break space."
