summary = "A DSIG table is present. Nothing current needs a digital signature (or a dummy one), so the table is dead weight. The fix removes it."
ref = "fontbakery opentype/dsig"
status = "docs"

[[check]]
id = "check.tables.postVersion"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The post table format does not suit the font: CFF fonts must use format 3; TrueType fonts with format 3 lose glyph names (warning); formats 2.5 and 4 are not allowed."
ref = "fontbakery opentype/post_table_version"
status = "docs"
notes = "As in FontBakery, every font without a CFF table counts as losing its glyph names with format 3, CFF2 fonts included."

[[check]]
id = "check.tables.glyfIntegrity"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The glyf table is damaged: loca points at data that is missing, there is unused data after the last glyph, or the number of loca entries does not match maxp.numGlyphs. This is a compiler fault. Trailing empty glyphs are a known source of false reports in other validators."
ref = "fontbakery opentype/glyf_unused_data; fontbakery opentype/loca/maxp_num_glyphs; MS Font Validator E1703 (afdko MSFontValidatorIssues.md 5.a)"
status = "docs"
notes = "Up to 3 bytes after the last glyph are padding, not unused data. Codes: loca-too-short, offsets-decrease, missing-data, unreachable-data."

[[check]]
id = "check.tables.cmapFormat12"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A format 12 cmap subtable exists without a format 4 one, maps no codepoint that needs it, or (warning) leaves out characters that the format 4 subtable maps. The fix rebuilds the subtables from one mapping."
ref = "fontbakery cmap/format_12"
status = "docs"
notes = "Departs from FontBakery in two places: no-cmap-4 is reported only when a format 12 subtable exists, and a format 12 subtable is pointless when it maps nothing beyond U+FFFF (FontBakery's test accepts any code point above U+0FFF)."

[[check]]
id = "check.tables.cmapSubtables"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The cmap table has subtables other than the usual ones: format 4 for the BMP and format 12 for the full repertoire on the Unicode and Windows platforms, format 14 for variation sequences, and the Mac Roman formats 0 and 6."
ref = "fontbakery notofonts/cmap/unexpected_subtables"
status = "docs"
notes = "Severity is warn, as FontBakery's notofonts check reports it. The accepted subtables are FontBakery's list: Unicode formats 4, 12 and 14, Windows formats 4 and 12, Mac Roman formats 0 and 6, and for CJK fonts (more than 150 code points in the CJK blocks) the Mac format 6 placeholders for Japanese, Chinese and Korean."

[[check]]
id = "check.tables.fsSelection"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2.fsSelection bits 0 (italic), 5 (bold) and 6 (regular) do not match the style, or disagree with the bold and italic bits of head.macStyle. The fix sets all of them from the style-linking settings."
ref = "fontbakery opentype/fsselection; fontbakery opentype/mac_style; comparefamily single-face test 14"
status = "docs"
notes = "The style comes from the names, never the file name: italic when name ID 2 or 17 contains Italic, bold when name ID 2 begins with Bold or a variable font's default weight is 700 (FontBakery reads the file name). The fix syncStyleLinking runs font.instance.syncStyleLinking (docs/spec/21-qa.md § 5); it stays report-only until audit.fix dispatches source fixes to their commands."

[[check]]
id = "check.tables.vendorId"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "OS/2.achVendID differs from the vendor ID configured for the project (`vendorId`); when none is configured, an empty, placeholder or unregistered ID is a warning."
ref = "fontbakery opentype/vendor_id; fontbakery googlefonts/vendor_id"
status = "docs"
notes = "Built in M12.51 without the project value: the compiled-font checks do not receive the document's project values yet, so the ID is compared with the vendor registry only (empty, placeholder and unregistered IDs are warnings); the comparison with a configured ID is built and tested."

[[check]]
id = "check.tables.codePageRanges"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2 ulCodePageRange1/2 are all zero or the table is missing, which makes some Windows applications treat the font as covering no character set. In the stricter variant each code page and Unicode range bit is compared with a coverage heuristic, and supplementary-plane bits require a 32-bit cmap. The fix recomputes the bits from the cmap."
ref = "fontbakery opentype/code_pages; comparefamily single-face test 28; fontbakery notofonts/unicode_range_bits; MS Font Validator W2101 (afdko MSFontValidatorIssues.md 4.a)"
status = "docs"
notes = "The stricter variant is the threshold `strict` (off by default): each code page bit is compared with the coverage rule of the code page data set and each Unicode range bit with the code points the cmap maps; the OEM and Symbol code page bits are never compared. Bit 57 set without a format 12 subtable is reported in the strict variant."

[[check]]
id = "check.tables.os2Version"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The OS/2 table version is below 4, so the newer fsSelection bits cannot be used. Some old validators reject version 4 and later; that is their error. The fix upgrades the table."
ref = "comparefamily family test 17; MS Font Validator E2127/E2132/W0051/W2106 (afdko MSFontValidatorIssues.md 3.a)"
status = "docs"

[[check]]
id = "check.tables.weightClassRange"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "OS/2.usWeightClass is below 250 in a static CFF font (old Windows renderers then smear the glyphs bolder), a face with the bold bit set has a weight below 500, or the value is not on the scale expected for its style name."
ref = "comparefamily single-face test 9; comparefamily single-face test 10; fontbakery googlefonts/weightclass; fontbakery typenetwork/weightclass"
status = "docs"
notes = "The style-name scale follows FontBakery's typenetwork rule: Thin may be 100 or 250, ExtraLight 200 or 275, the other weights exact; an unknown weight word is an informational result. A variable font's value must equal its default weight (400 without a wght axis)."

[[check]]
id = "check.tables.fsType"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2.fsType is not the configured embedding permission (`fsType`: 0 installable for open fonts, 8 editable for the Adobe and Microsoft conventions)."
ref = "fontbakery googlefonts/fstype; fontbakery microsoft/fstype; comparefamily family test 14"
status = "docs"
notes = "Built in M12.51 without the project value: the compiled-font checks do not receive the document's project values yet, so the check is skipped with that reason until the binary context carries them (the comparison is built and tested)."

[[check]]
id = "check.tables.lowestRecPpem"
severity = "info"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "head.lowestRecPPEM is very small. Informational only: for CFF fonts a low value such as 3 is deliberate."
ref = "MS Font Validator W1305 (afdko MSFontValidatorIssues.md 4.c)"
status = "docs"
notes = "The limit is the threshold `minimum`."
guesses = ["We report head.lowestRecPPEM below 6 pixels per em; the validator note names 3 as the value it questions but gives no limit, so a survey of shipped TrueType fonts would settle it."]

[[check]]
id = "check.tables.cffCallDepth"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A CFF or CFF2 charstring nests subroutine calls more than 10 deep, or calls itself."
ref = "fontbakery opentype/cff_call_depth; fontbakery opentype/cff2_call_depth"
status = "docs"
notes = "The charstrings are walked with the subroutine biases of the Type 2 format; walking stops after 20,000,000 charstring bytes per font and the check is then skipped with that reason."

[[check]]
id = "check.tables.cffAsciiStrings"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A string in the CFF top dictionary contains non-ASCII characters or cannot be decoded."
ref = "fontbakery opentype/cff_ascii_strings"
status = "docs"
notes = "Reads the font name of the Name INDEX and the version, Notice, Copyright, FullName, FamilyName and Weight strings of each top dictionary; a string ID the String INDEX lacks is cannot-decode."

[[check]]
id = "check.tables.cffDeprecatedOperators"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A CFF charstring uses endchar with four arguments to build an accented glyph (seac; a failure, known to break rendering) or the dotsection operator (a warning). The fix decomposes seac glyphs and drops dotsection."
ref = "fontbakery opentype/cff_deprecated_operators; comparefamily single-face test 7"
status = "docs"
notes = "An endchar with four or more operands counts as seac, inside subroutines too, as in FontBakery."

[[check]]
id = "check.tables.cffUniqueIds"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A name-keyed CFF font has UniqueID, XUID or UIDBase entries, which are obsolete and risk cache collisions. The fix removes them."
ref = "comparefamily single-face test 25"
status = "docs"

[[check]]
id = "check.tables.cffCharstringSize"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A CFF charstring is longer than 32 kB, a limit of some old interpreters."
ref = "comparefamily single-face test 18 (charstring size)"
status = "docs"
notes = "Reads CFF2 charstrings as well; the limit is 32,767 bytes."

[[check]]
id = "check.tables.baseTable"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The BASE table is missing, structurally inconsistent (counts that do not match their lists), uses baseline or script tags that are not registered, has a non-zero offset for the default baseline, or (warning) has an ideographic baseline that does not centre the cap height in the em box."
ref = "comparefamily single-face test 11 (-tolerance)"
status = "docs"
notes = "The tolerance is the threshold `tolerance` (0 by default, as comparefamily's). The ideographic baseline is compared only when it is not the default baseline, as in comparefamily."

[[check]]
id = "check.tables.metaScriptLangTags"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The meta table is missing or lacks the dlng (design languages) or slng (supported languages) entries; present entries are listed as information."
ref = "fontbakery googlefonts/meta/script_lang_tags"
status = "docs"

[[check]]
id = "check.tables.statInStatics"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A static font carries a STAT table with more than one axis value per axis, typically the variable family's STAT copied unchanged, which misdescribes the single style."
ref = "fontbakery STAT_in_statics"
status = "docs"

# ---------------------------------------------------------------------------
# layout: OpenType layout
# ---------------------------------------------------------------------------

[[check]]
id = "check.layout.validFeatureTags"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "GSUB or GPOS uses a feature tag that is not registered and is not a private tag (private tags are up to four uppercase letters)."
ref = "fontbakery opentype/layout_valid_feature_tags"
status = "docs"
notes = "A private tag is one to four capital letters A-Z padded with spaces, as the reference checker's rationale says; its code also accepts digits beside capitals."

[[check]]
id = "check.layout.validScriptTags"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "GSUB or GPOS uses a script tag that is not registered."
ref = "fontbakery opentype/layout_valid_script_tags; comparefamily family test 12 (unknown script tag); comparefamily single-face test 11 (BASE script tags)"
status = "docs"
notes = "Reads the script lists of GSUB, GPOS and both BASE axes."

[[check]]
id = "check.layout.validLanguageTags"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "GSUB or GPOS uses a language-system tag that is not registered. The common slip of TUR for Turkish instead of TRK is named explicitly, and the fix corrects that case."
ref = "fontbakery opentype/layout_valid_language_tags; comparefamily family test 12 (unknown language tag, TUR vs TRK)"
status = "docs"
notes = "The fix renameLanguageTag runs font.features.setCode on each prefix and feature that uses the wrong tag (docs/spec/21-qa.md § 5); other unregistered tags carry no fix. It stays report-only until audit.fix dispatches source fixes to their commands."

[[check]]
id = "check.layout.defaultLanguageSystems"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "GSUB or GPOS lacks the script/language pair DFLT/dflt, or latn/dflt in a font with Latin features."
ref = "comparefamily family test 12 (DFLT/dflt and latn/dflt)"
status = "docs"
guesses = [
  "latn/dflt is asked for only in fonts whose character map holds a basic Latin letter (A-Z, a-z); the legacy family comparison asks for it in every font with features, and its findings on non-Latin fonts would settle it.",
]

[[check]]
id = "check.layout.defaultLanguagesystemStatement"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "The feature code declares language systems but `languagesystem DFLT dflt` is not the first of them, so the compiler will not add it and default-script behaviour may be lost. The fix inserts the statement at the top."
ref = "fontbakery ufo_features_default_languagesystem"
status = "docs"
notes = "Reads the language-system statements of the switched-on prefixes, classes and features in that order, comments left out. The fix addDefaultLanguagesystem runs font.features.setCode on the first prefix with a languagesystem statement (docs/spec/21-qa.md § 5); it stays report-only until audit.fix dispatches source fixes to their commands."

[[check]]
id = "check.layout.gdefMarkClass"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The GDEF glyph classes disagree with Unicode: a non-spacing mark character is not in the mark class, a non-mark character is in it, or a glyph in the mark class has an advance width. The fix rebuilds the classes from glyph categories."
ref = "fontbakery opentype/gdef_mark_chars; fontbakery opentype/gdef_non_mark_chars; fontbakery opentype/gdef_spacing_marks"
status = "docs"

[[check]]
id = "check.layout.legacyAccents"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A spacing legacy accent (U+0060, U+00A8, U+00AF, U+00B4, U+00B8, U+02C6, U+02C7, U+02D8-02DD) has zero advance or is classed as a mark in GDEF. These characters are typed on their own and must behave as base glyphs. The fix sets the base class; the width has to be designed."
ref = "fontbakery legacy_accents"
status = "docs"

[[check]]
id = "check.layout.smallCapsGlyphs"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The font has smcp or c2sc but the lookups do not provide a small-cap glyph for every letter they should cover; the result lists the letters left out."
ref = "fontbakery missing_small_caps_glyphs"
status = "docs"
guesses = [
  "The letters smcp must cover are the mapped lowercase letters with an uppercase partner (uppercase with a lowercase partner for c2sc), limited to the scripts of the letters the feature does cover; the reference checker only reports substituted glyphs that do not exist (also reported here), and its results on fonts with partial small caps would settle it.",
]

[[check]]
id = "check.layout.smallCapsBeforeLigatures"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The first liga lookup runs before the first smcp lookup, so ligatures form before small caps are applied and survive in small-cap text. The fix reorders the features."
ref = "fontbakery smallcaps_before_ligatures"
status = "docs"
notes = "Skipped when the font has no smcp or no liga lookups. The fix reorderFeatures runs font.features.reorder with smcp moved before liga (docs/spec/21-qa.md § 5); it stays report-only until audit.fix dispatches source fixes to their commands."

[[check]]
id = "check.layout.stylisticSetNames"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A stylistic set feature (ss01-ss20) has no descriptive name, so applications can only show its number."
ref = "fontbakery stylisticset_description"
status = "docs"
notes = "Also reports a stylistic set whose name ID is not in the name table, which the reference checker leaves as a to-do."

[[check]]
id = "check.layout.gpos7"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "GPOS contains a type 7 (contextual, non-chaining) lookup, which at least one major shaping engine does not apply. The fix recompiles the rules as chaining context lookups (type 8)."
ref = "fontbakery gpos7"
status = "docs"
notes = "Finds type 7 lookups directly and inside extension lookups. The fix recompileLayout runs tables.recompileLayout on the compiled font (docs/spec/21-qa.md § 5); it stays report-only until that command is built."

[[check]]
id = "check.layout.cjkSpacingFeatures"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A CJK font lacks the contextual half-width spacing features chws and vchw."
ref = "fontbakery cjk_chws_feature"
status = "docs"
notes = "A CJK font maps more than 150 characters in the CJK blocks; other fonts skip."

[[check]]
id = "check.layout.dottedCircle"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The font has non-spacing marks but no U+25CC DOTTED CIRCLE (a warning; a failure for scripts that use a complex shaper), or the dotted circle lacks attachment anchors for marks that attach to other bases."
ref = "fontbakery dotted_circle"
status = "docs"
notes = "Runs on CFF fonts too; the reference checker runs it on TrueType fonts only. The scripts that need a complex shaper are the Indic and USE scripts of ufo2ft with Khmer and Myanmar."

[[check]]
id = "check.layout.softDotted"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "Shaping a soft-dotted letter (i, j and similar) followed by a mark above leaves the dot in place. The result separates the sequences a known orthography needs from the rest."
ref = "fontbakery soft_dotted"
status = "docs"
notes = "Shapes through the audit's shaping service and skips while no shaper is available."

[[check]]
id = "check.layout.sizeFeature"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The GPOS size feature is inconsistent: the design size lies outside its own range, or the menu name ID it refers to is not in the name table."
ref = "comparefamily single-face test 24"
status = "docs"
notes = "The range is checked only when the parameters name a menu name, as the legacy comparison does."

[[check]]
id = "check.layout.shapingRegression"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A project-supplied shaping test suite does not pass: the shaped output differs from the expected glyph sequence and positions, a forbidden glyph such as .notdef appears, or listed glyph pairs collide. Runs only when the project names test files."
ref = "fontbakery shaping/regression; fontbakery shaping/forbidden; fontbakery shaping/collides"
status = "docs"
notes = "Skipped with a reason until M8 brings the shaping engine and a reader for shaping test files."

[[check]]
id = "check.layout.languageShaping"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "For the languages of each glyph set the font claims to cover, a rule from a shaping-expectations database fails (missing mark attachment, missing locl form, unreachable letter). Needs our own or a licensed rule database."
ref = "fontbakery googlefonts/glyphsets/shape_languages"
status = "docs"
notes = "Skipped with a reason: no shaping-expectations database is available."

[[check]]
id = "check.layout.undefinedGlyphInFeatures"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "The feature code names a glyph or class member that does not exist or does not export, so the features cannot compile."
ref = "Editor audit convention (feature code references)"
status = "inferred"
notes = "Skipped with a reason until M8's feature-code parser can tell glyph names from other tokens."

# ---------------------------------------------------------------------------
# variations: Variations and master compatibility
# ---------------------------------------------------------------------------
observe = ["Feature font (a liga feature substituting f i by f_i, no f_i glyph): compile the features; copy the message's wording and note where it points (line, feature, glyph name)."]

[[check]]
id = "check.variations.glyphMissingInMaster"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A glyph exists in some masters but not in others. Sparse masters can be exempted with `ignoreMissing`."
ref = "fontTools varLib.interpolatable missing (--ignore-missing)"
status = "docs"
notes = "Reported only for a glyph that at least two masters have, as the reference does; the result names the default master first. `ignoreMissing` is a threshold where 1 turns the check off. Read from the compatibility report of the audit services."

[[check]]
id = "check.variations.openPathInMaster"
severity = "fail"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A contour is open in a master, so the glyph cannot be compared or interpolated; the remaining compatibility tests are skipped for that glyph."
ref = "fontTools varLib.interpolatable open_path"
status = "docs"
notes = "A path whose closed flag is off counts as open; the reference calls a contour open when it ends away from its start. The heuristic tests skip the glyph; the structural tests still run."

[[check]]
id = "check.variations.pathCount"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A glyph has a different number of contours in two masters. Each master is compared with its parent master along the designspace, not with every other master."
ref = "fontTools varLib.interpolatable path_count"
status = "docs"
notes = "Counts paths only. The reference counts components among the contours, so a component added in one master is a path-count result there and check.variations.componentMismatch here. Masters are paired along the minimum spanning tree of their normalised locations, as the reference pairs them when SciPy is installed (without it, it pairs each master with the previous one)."
guesses = ["An intermediate layer is compared with the nearest master layer of its glyph; running the reference tool on a designspace that holds intermediate layers as sparse sources would settle whether its pairs agree."]
observe = [
  "Incompatible font (two masters; O has two paths in one master and one in the other; n has a different node count): export a variable font; note the message about O, whether it names the glyph, the path or both, and whether the export stops.",
]

[[check]]
id = "check.variations.nodeCount"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "Matching contours have a different number of nodes in two masters."
ref = "fontTools varLib.interpolatable node_count"
status = "docs"
notes = "Counts nodes, on- and off-curve. The reference counts segments, so a line against a curve at the same place is a node-count result here and a node-type result there."
observe = [
  "Incompatible font (two masters; O has two paths in one master and one in the other; n has a different node count): export a variable font; note the message about n, whether it names the glyph, the path or the node, and whether the export stops.",
]

[[check]]
id = "check.variations.nodeTypeMismatch"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "Matching contours have the same number of nodes but a node differs in kind (line, curve or off-curve) between two masters."
ref = "fontTools varLib.interpolatable node_incompatibility"
status = "docs"
notes = "One result per node whose kind (line, curve, quadratic curve, off-curve) differs; the reference compares segment kinds."

[[check]]
id = "check.variations.contourOrder"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "The contours of a glyph appear in a different order in two masters: a cheaper matching by shape exists than the stored order, by a margin above `tolerance` (default 0.95). The fix reorders the contours to the proposed matching."
ref = "fontTools varLib.interpolatable contour_order (--tolerance); fontbakery interpolation_issues"
status = "docs"
notes = "Ported from fontTools 4.66.1 varLib.interpolatable: the same contour statistics, matching and score; on our test outlines the score equals the reference's. Components take part with the statistics of their outline. The fix command reorders the shapes."

[[check]]
id = "check.variations.wrongStartPoint"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A contour starts at a different node, or runs in the opposite direction, in two masters; the result carries the proposed start node and whether to reverse. The fix applies both."
ref = "fontTools varLib.interpolatable wrong_start_point (--tolerance); fontbakery interpolation_issues"
status = "docs"
notes = "Ported from fontTools 4.66.1; the proposed node and the score equal the reference's on our test outlines. The fix makes the proposed node first; a result that also needs the path reversed is report-only."

[[check]]
id = "check.variations.kink"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
