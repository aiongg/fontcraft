ref = "fontbakery mandatory_glyphs; comparefamily single-face test 26 (glyph 0)"
status = "docs"
guesses = [
  "A font that stores no glyph names has .notdef as glyph 0, as the reference reads such fonts; a font with stored names whose .notdef is missing is settled by the reference on a TTF with a version 3 post table.",
  "A cmap entry pointing at glyph 0 means \"no glyph\" in cmap, so only a .notdef placed elsewhere is reported as having a code point; the reference on a font mapping a character to glyph 0 would settle it.",
]
observe = ["Glyph-order font (A, B and space, no .notdef, space last in the glyph order): export a TTF and read its glyph order; note whether .notdef is added and placed first."]

