]

[[command]]
id = "font.info.cleanNames"
label = "Clean Up Names"
menu = []
shortcut = ""
kind = "engine"
params = "{keepLineBreaks?: bool, dryRun?: bool} → {changed: [{scope, target, field, old, new}], dryRun}"
area = "font-info"
milestone = "M12"
summary = "Tidies every name the source sets (the family name, instance names, the name properties of the font, masters and instances in every language, and the name parameters): line breaks become spaces unless `keepLineBreaks`, white space at either end goes, runs of white space inside menu names become one space, and values left empty are deleted. An empty family or instance name keeps its old value."
ref = "Our design; docs/spec/21-qa.md § 5 (fix cleanNameRecords)"
status = "inferred"
own = true
notes = "The source side of the audit fix cleanNameRecords (check.names.emptyRecords, whitespace, lineBreaks); compiled fonts use tables.cleanNameRecords. A source has no Macintosh name records and one PostScript name field per instance, so noMacRecords and postScriptNameConsistency have nothing to fix in it. Added by M12.63."
guesses = [
  "Line breaks become spaces in every name, the licence text included, because check.names.lineBreaks reports them anywhere; `keepLineBreaks` keeps them.",
]

[[command]]
id = "font.instance.cleanUp"
label = "Clean Up Instances"
menu = []
shortcut = ""
kind = "engine"
params = "{dryRun?: bool} → {changed: [{scope, target, field, old, new}], dryRun}"
area = "font-info"
milestone = "M12"
summary = "Removes each static instance that repeats an earlier one (same name, location and export setting) and sorts the static instances by their weight coordinate, then their other coordinates in axis order, so a variable font's named instances come in rising weight. Other instances keep their places."
ref = "Our design; docs/spec/21-qa.md § 5 (fix cleanInstances)"
status = "inferred"
own = true
notes = "The source side of the audit fix cleanInstances (check.variations.instanceRecords, instancesInOrder); compiled fonts use tables.cleanInstances. The names of the instance at the default location (defaultInstanceNames) are a design choice and stay as they are. Added by M12.63."

