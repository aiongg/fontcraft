milestone = "M12"
summary = "An encoded letter (Unicode categories Lu, Ll, Lt, Lm, Lo) has no ink. The Hangul filler characters are exempt and empty Hangul syllables only warn."
ref = "fontbakery empty_letters"
status = "docs"
notes = "A CFF glyph counts as empty when it draws no segment; the reference counts a charstring of at most one byte as empty, so a glyph that only moves the pen differs."

[[check]]
