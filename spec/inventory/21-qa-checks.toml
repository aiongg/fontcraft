area = "qa"
milestone = "M3"
summary = "Lists the built-in profiles (outlines, opentype, universal, strict) and any user or project profiles, each with its check count and where it is stored."
ref = "fontbakery profiles"
status = "docs"
notes = "M3 lists the four built-in profiles; the counts are of the checks registered so far. User and project profiles wait for M12."

[[command]]
