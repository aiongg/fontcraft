fixable = true
area = "qa"
milestone = "M12"
summary = "In a TrueType font the first four glyphs are not .notdef, NULL, CR and space in that order, or NULL, CR and space are not mapped from U+0000, U+000D and U+0020; the names .null and nonmarkingreturn draw a warning. Also reports an OS/2 default character other than 0."
