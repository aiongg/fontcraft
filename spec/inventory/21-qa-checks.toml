status = "inferred"
observe = ["Kerning font (A and V kerned, then V removed): export; note whether the A V pair is reported, dropped without a message, or exported."]
notes = "The pairs reported are the ones kerning.cleanUp deletes (codes missing-glyph and empty-group). Group members cannot name a missing glyph: groups are a property of each glyph."
