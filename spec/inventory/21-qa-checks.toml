milestone = "M12"
summary = "The Windows subfamily name (ID 2) is not the one the bold and italic bits call for: Regular, Bold, Italic or Bold Italic. Any other style word belongs in the family name (ID 1) or in IDs 16/17. The fix rewrites ID 2 from the bits."
ref = "comparefamily single-face test 8; fontbakery microsoft/office_ribz_req; fontbakery fontwerk/style_linking"
status = "docs"
notes = "The bold and italic bits are those of OS/2 fsSelection, or of head.macStyle when the font has no OS/2 table; comparefamily reads macStyle. check.tables.fsSelection reports fonts where the two disagree."
guesses = ["We read the style bits from OS/2 fsSelection rather than head.macStyle; a comparefamily run on a font whose two bit sets disagree would show the difference."]
observe = ["Style font (instances Light, Regular, Semibold and Bold, each with an Italic): link Semibold as the bold of Light, export, and note whether name ID 2 of Semibold and its fsSelection bold bit agree."]

