guesses = [
  "An italic style whose Bold flag was set by hand keeps its flag and its link, since the handbook allows linking bolds to other styles; nothing in the reference settles it.",
  "A link is made only to a style the font exports as a static instance; otherwise the link stays as it was.",
]

[[command]]
id = "font.info.syncFamilyValues"
label = "Sync Family Values"
menu = []
