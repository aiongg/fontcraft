ref = "fontbakery typenetwork/composite_glyphs"
status = "docs"
notes = "As the reference check: the share is of all glyphs, empty glyphs count as outlines, glyphs named with one ASCII character are not counted as outlines, and more than 50 percent (threshold maxOutlinePercent) warns."

