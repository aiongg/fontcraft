# anchors: Anchors
# ---------------------------------------------------------------------------

[[check]]
id = "check.anchors.missing"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A base letter lacks an anchor that its glyph-data entry expects (such as top or bottom) while the font contains marks that attach there. The fix adds the default anchors for the glyph at their computed positions."
ref = "Editor audit convention (missing anchors)"
status = "inferred"
notes = "Not registered yet: the check needs the default-anchor table of the components crate, which the audit crate does not depend on."

[[check]]
id = "check.anchors.markWithoutAttachment"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A combining mark has no attaching anchor (one whose name starts with an underscore), so it cannot be positioned or used to build composites. The fix adds the default mark anchor."
ref = "Editor audit convention (mark anchors)"
status = "inferred"
notes = "Not registered yet: telling combining marks apart needs the glyph data and the default-anchor table of the components crate, which the audit crate does not depend on."

[[check]]
id = "check.anchors.duplicateName"
severity = "fail"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A layer has two anchors with the same name. The fix keeps the first and deletes the rest."
ref = "Editor audit convention (anchor names)"
status = "inferred"

[[check]]
id = "check.anchors.unknownName"
severity = "info"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "An anchor name matches no mark anchor, caret, entry/exit or other known anchor role in the font, so it has no effect."
ref = "Editor audit convention (anchor names)"
status = "inferred"
notes = "An anchor's role is its name without a leading underscore or asterisk, up to the first underscore (top_1, top_viet and *top are all top). A base anchor is paired when some glyph has the underscore anchor of its role, and a mark anchor when some glyph has the base anchor. origin, entry, exit, caret and vcaret (with prefixes # and *, and suffixes) and smart-glyph property names are always known; corner, cap, segment and brush glyphs are not checked. Backup layers are left out."
guesses = ["Anchors on corner, cap, segment and brush component glyphs are not checked, because their roles are not documented; observing which anchor names those glyphs use in the reference app would settle it."]

[[check]]
id = "check.anchors.ligatureCaretsMissing"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The font has ligature glyphs but no, or incomplete, caret positions for them in GDEF, so the text cursor cannot be placed inside a ligature. In sources carets are anchors named caret_N; the fix adds evenly spaced ones."
ref = "fontbakery ligature_carets"
status = "docs"
notes = "As the reference check, the ligatures are the outputs of the ligature substitutions of the liga feature; a font without them is skipped. Findings on a font given as a binary carry no fix."

