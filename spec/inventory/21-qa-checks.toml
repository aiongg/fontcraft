# ---------------------------------------------------------------------------
# metrics: Metrics
# ---------------------------------------------------------------------------

[[check]]
id = "check.metrics.unitsPerEm"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "head.unitsPerEm is outside 16-16384 (failure), or is an unusual value: any value that is not a power of two from 16 to 16384, 1000 or 2000 draws a warning."
ref = "fontbakery opentype/unitsperem; comparefamily single-face test 16 (em square not 1000 or 2048)"
status = "docs"
notes = "comparefamily's family-level warning for an em that is neither 1000 nor 2048 is not reported; the FontBakery rule decides."

[[check]]
id = "check.metrics.italicAngle"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "post.italicAngle is implausible: magnitude over 90 degrees (failure), over 30 or over 20 (warnings), positive although the glyphs lean right or negative although they lean left (the lean is measured on a reference glyph), non-zero in an upright style, or zero in an italic style."
ref = "fontbakery opentype/italic_angle; comparefamily single-face test 12; MS Font Validator E1316/E2308 (afdko MSFontValidatorIssues.md 4.d)"
status = "docs"
notes = "The lean is measured on the first of bar, bracketleft, H and I (found through cmap) at 20% and 80% of its height, using the leftmost crossing; FontBakery takes the first crossing in path order. The style comes from the fsSelection italic bit or Italic in name ID 17 or 2, never the file name (guess on audit.familyGrouping)."

[[check]]
id = "check.metrics.italicBitVsAngle"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The italic bit of head.macStyle and post.italicAngle disagree: the bit is set while the angle is 4 degrees or less either way, or clear while it is more. A single-style script face with a real slant is a legitimate exception."
ref = "comparefamily single-face test 12; MS Font Validator E1316/E2308 (afdko MSFontValidatorIssues.md 4.d)"
status = "docs"

[[check]]
id = "check.metrics.caretSlope"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "hhea.caretSlopeRise and caretSlopeRun describe an angle more than 0.1 degrees away from post.italicAngle; a rise of 0 is a failure. The fix sets rise 1 and run 0 for upright fonts and rise = unitsPerEm with the matching run for slanted ones."
ref = "fontbakery opentype/caret_slope"
status = "docs"

[[check]]
id = "check.metrics.maxAdvanceWidth"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "hhea.advanceWidthMax differs from the largest advance in hmtx. The fix recomputes it."
ref = "fontbakery opentype/maxadvancewidth"
status = "docs"

[[check]]
id = "check.metrics.xAvgCharWidth"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2.xAvgCharWidth differs from the value computed for the table version (average of all non-zero advances from version 3 on; the weighted a-z and space formula before). A difference of 1 passes, under 10 units is informational, more is a warning. The fix recomputes it."
ref = "fontbakery opentype/xavgcharwidth"
status = "docs"

[[check]]
id = "check.metrics.monospaceFlags"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The monospace markers disagree with the advances. A font is taken as monospaced when at least 80% of its ASCII glyphs share one width; then post.isFixedPitch must be non-zero and PANOSE must say monospaced, with numberOfHMetrics 3 recommended and odd-width glyphs listed. Otherwise the markers must be clear. Also covers CFF isFixedPitch against post."
ref = "fontbakery opentype/monospace; comparefamily single-face test 13; comparefamily family test 10"
status = "docs"
notes = "The hhea.advanceWidthMax test of the upstream monospace check is left to check.metrics.maxAdvanceWidth. Outliers are counted against the most common non-zero advance (upstream: the most common advance and side-bearing pair). When fewer than 80% of ASCII is covered, printable characters are approximated by leaving out control, separator, format and private-use code points and GDEF marks."
guesses = ["One rule decides monospacing: at least 80% of the ASCII glyphs share one width, as the conformance checker of the opentype profile does; comparefamily's all-glyph hint is not reported separately (21-qa.md question 8)."]

[[check]]
id = "check.metrics.fontBBox"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The font bounding box is improbable (x beyond 2 em or y beyond 1.5 em from the origin), or the head table box differs from the CFF FontBBox. The fix recomputes both boxes from the glyphs."
ref = "comparefamily single-face test 15"
status = "docs"

[[check]]
id = "check.metrics.typoMetricsVsEm"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "OS/2.sTypoAscender minus sTypoDescender does not equal the em size (Adobe's convention); for CID-keyed fonts sTypoLineGap should equal the em size."
ref = "comparefamily single-face test 16 (typo ascender/descender vs em square)"
status = "docs"

[[check]]
id = "check.metrics.hheaMatchesTypo"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "hhea ascent, descent or lineGap differs from OS/2 sTypoAscender, sTypoDescender or sTypoLineGap, so line spacing differs between platforms. Skipped for CJK fonts. The fix copies the typo values into hhea."
ref = "fontbakery os2_metrics_match_hhea; comparefamily single-face test 16 (hhea vs OS/2); MS Font Validator W1405/W1406 (afdko MSFontValidatorIssues.md 4.e)"
status = "docs"
observe = ["Tall font (ascender 750, descender -250, Aringacute reaching 1,042): export and read hhea and OS/2; note the hhea ascender, descender and line gap next to the typo values."]

[[check]]
id = "check.metrics.winAscentDescent"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2.usWinAscent is smaller than the font's yMax or usWinDescent smaller than |yMin|, which clips glyphs on Windows, or either is more than twice that extent. Skipped for CJK fonts. The fix sets both to the bounding box extents."
ref = "fontbakery family/win_ascent_and_descent; comparefamily single-face test 16 (usWin vs bounding box)"
status = "docs"
observe = ["Tall font (ascender 750, descender -250, Aringacute reaching 1,042): export and read OS/2; note usWinAscent and usWinDescent."]

[[check]]
id = "check.metrics.lineGaps"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "hhea.lineGap or OS/2.sTypoLineGap is not 0. Line gap is applied differently by browsers, desktop apps and Windows, so zero gives the most even result; the fix moves the gap into ascender and descender."
ref = "fontbakery linegaps; MS Font Validator W1404 (afdko MSFontValidatorIssues.md 4.e)"
status = "docs"

[[check]]
id = "check.metrics.useTypoMetrics"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2.fsSelection bit 7 (USE_TYPO_METRICS) is not set (CJK fonts excepted), or it is set while the OS/2 table version is below 4; both are failures. The fix sets the bit and raises the table version to 4."
ref = "comparefamily single-face test 16 (USE_TYPO_METRICS); fontbakery googlefonts/use_typo_metrics"
status = "docs"
observe = ["Tall font (ascender 750, descender -250, Aringacute reaching 1,042): export and read OS/2; note whether the fsSelection use-typo-metrics bit (bit 7) is set."]

[[check]]
id = "check.metrics.typoAscenderVsAgrave"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "OS/2.sTypoAscender is lower than the top of Agrave. macOS then ignores the value and falls back to a much taller line height, per style."
ref = "fontbakery typoascender_exceeds_Agrave"
status = "docs"

[[check]]
id = "check.metrics.capsVerticallyCentred"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The capitals (A B C D E H I M O S T X) are not centred between hhea.ascender and hhea.descender within 18% of 1.2 em, so text will not sit centred in buttons and list rows without extra layout work. Skipped when one of those capitals is missing. One possible vertical-metrics scheme; ignore when another is intended."
ref = "fontbakery caps_vertically_centered"
status = "docs"

[[check]]
id = "check.metrics.verticalMetricsScheme"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The vertical metrics do not follow the house scheme the `scheme` parameter chooses. 0, Google Fonts: both line gaps 0, hhea total 120-200% of the em (over 150% a warning), ascenders positive, descenders 0 or negative; CJK fonts get its CJK scheme instead (USE_TYPO_METRICS clear, typo 0.88 and -0.12 em, line gaps 0, hhea equal to win, hhea total over 110% and up to 150% as a warning). 1, Microsoft: hhea equal to typo when USE_TYPO_METRICS is set, else equal to win. 2, Type Network: hhea equal to typo with no line gaps when USE_TYPO_METRICS is set; otherwise a warning to set it, and hhea equal to win with the typo total equal to the hhea total; and the space above the cap height and below the baseline within 30% of each other."
ref = "fontbakery googlefonts/vertical_metrics; fontbakery googlefonts/cjk_vertical_metrics; fontbakery microsoft/vertical_metrics; fontbakery typenetwork/vertical_metrics; fontbakery typenetwork/font_is_centered_vertically"
status = "docs"
notes = "Type Network's centring check has an unreachable warning band upstream; only its failure at 30% or more is ported."
guesses = ["The `scheme` parameter defaults to the Google Fonts scheme (0); no reference names a default, so the owner's choice of house scheme would settle it."]

[[check]]
id = "check.metrics.baseGlyphWidth"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "An encoded glyph that is not a mark and not an invisible space has an advance width of zero."
ref = "fontbakery base_has_width"
status = "docs"
notes = "Characters that may draw nothing are FontBakery's: separators (Zs, Zl, Zp), format and control characters, non-spacing marks (Mn) and the private-use planes. A glyph mapped from several code points is judged by the highest, as FontBakery's reversed cmap does."
guesses = ["Glyphs that GDEF classes as marks are left out by glyph id; FontBakery compares glyph ids with mark glyph names, so its own mark exclusion never applies. A font with a zero-width enclosing mark (Me) not in GDEF would settle whether the reference warns."]

[[check]]
id = "check.metrics.markWidths"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "A non-spacing combining mark has a non-zero advance, or a spacing mark has none. The fix zeroes the advance of non-spacing marks."
ref = "fontbakery typenetwork/marks_width"
status = "docs"
notes = "FontBakery reports both cases under one message code; here a spacing modifier without width has its own code (`spacing-zero`) and no fix, since the fix only zeroes non-spacing marks."
observe = ["Mark font (acutecomb U+0301 with width 200, a, aacute): export and read hmtx; note whether acutecomb keeps its 200 advance or is written with 0."]

[[check]]
id = "check.metrics.whitespaceWidths"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "The space has no advance, or the no-break space has a different one. In a font that does not seem monospaced, the other encoded spaces are also compared with their conventional advances (a warning): the tab as the space, en and em quads and spaces, third-, fourth- and sixth-em spaces, figure space as the zero, punctuation space as the period, thin space within a sixth to a fifth of the em, hair space within a sixteenth to a tenth, zero width space 0. The fix copies the space's advance to the no-break space."
ref = "fontbakery whitespace_widths; fontbakery notofonts/hmtx/whitespace_advances"
status = "docs"
notes = "Skipped when the font lacks the space or the no-break space, as FontBakery's condition does. The conventional advances are the rule of FontBakery's notofonts/hmtx/whitespace_advances, with its monospace test (glyph_metrics_stats); an advance whose reference character (space, zero, period) is not encoded is not compared."
guesses = ["The conventional advances of the other space characters come from a vendor profile's check and are reported as warnings under this universal check rather than as a separate strict check; running the reference conformance checker's vendor profile on the corpus would show whether failures there are common enough to deserve their own check."]

[[check]]
id = "check.metrics.mathSignWidths"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The mathematical operators and relations (plus, minus, equals, less-than and the rest of a fixed list) do not all share one advance; the result names the most common width and the glyphs that depart from it."
ref = "fontbakery math_signs_width"
status = "docs"
notes = "One finding per glyph off the most common width. As in FontBakery, the first width in list order wins a tie, and a most common width of 0 passes."

[[check]]
id = "check.metrics.tabularWidths"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "Glyphs meant to be tabular do not share one advance: the encoded figures 0-9 after the single substitutions of the tnum feature (at every named instance of a variable font); or, going by name, the tabular lining, tabular old-style and tabular numerator groups, each once ten or more of its glyphs are present and more than half agree on a width; or figurespace differs from one.tab (else one.taboldstyle)."
ref = "fontbakery tnum_glyphs_equal_widths; comparefamily single-face test 17; comparefamily single-face test 26 (tabular widths)"
status = "docs"
notes = "FontBakery shapes the figures with the tnum feature on; this check reads the tnum feature's single substitutions from GSUB instead and measures advances with HVAR at each named instance. Figures the font does not encode are left out rather than shaped as .notdef. comparefamily's fixed-pitch exception list of three PostScript names is not carried over."
guesses = ["The tnum targets are found by applying the feature's single substitutions directly instead of shaping, so contextual or default-feature substitutions are ignored; comparing with the reference checker on corpus fonts whose tnum feature is contextual would settle it."]

[[check]]
id = "check.metrics.digitWidths"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The default digits 0-9 do not all have the same advance, or comma and period differ in advance."
ref = "fontbakery notofonts/hmtx/encoded_latin_digits; fontbakery notofonts/hmtx/comma_period"
status = "docs"
notes = "Skipped when the font maps neither the zero nor both comma and period, as the two FontBakery checks skip."

[[check]]
id = "check.metrics.fixedFractionWidths"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "The en dash or one of the one-, two- and three-dot leaders is not half the em wide, or the em dash is not one em wide (found by glyph name)."
ref = "comparefamily single-face test 26 (half-width and full-width glyph names)"
status = "docs"
notes = "comparefamily's list spells the en dash with a trailing space, so it never checks it; this check does."
guesses = ["The en dash is held to half the em like the dot leaders, although comparefamily's typo means it never checks it; running comparefamily with the typo fixed on the Oswald families would show whether the rule misfires."]

[[check]]
id = "check.metrics.ligatureWidths"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "A ligature (from liga, clig, dlig, hlig or rlig) is not wider than its first component, or its left and right sidebearings differ from those of its first and last components by more than `tolerance` units."
ref = "comparefamily single-face test 22 (-tolerance)"
status = "docs"
notes = "Ligatures come from the ligature substitutions (type 4) of the five features; comparefamily also reads ligatures out of contextual lookups through spot's listing, which this check does not. Sidebearings are measured from the rounded exact bounds of the outline at the default location; an empty glyph has its edges at 0, as tx reports it."

[[check]]
id = "check.metrics.accentedWidths"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "An accented glyph's advance differs from that of its base letter by more than `tolerance` units. The fix copies the base letter's width."
ref = "comparefamily single-face test 23 (-tolerance)"
status = "docs"
notes = "The base glyph name is found the way comparefamily finds it: each accent name part (accent, acute, bar, dot, ring, slash and the rest of its list) is removed wherever it occurs, in sorted order, and a trailing period is dropped; the check runs only when a glyph of that name exists. This is a heuristic (Hbar is compared with H, Lslash with L), so the check is capped."
guesses = ["When the accented glyph has no width key, audit.fix keys its width to its first component's glyph, standing in for the base glyph the check derives from the name; a fix run in the reference on a glyph whose first component is not its base would settle it."]

[[check]]
id = "check.metrics.strikeoutAndScripts"
severity = "fail"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "OS/2 strikeout size and position, or the subscript and superscript sizes and offsets, differ by more than 5 units from the defaults derived from underline thickness, x-height, em size and italic angle (a warning). A strikeout size or underline thickness of zero is a failure because nothing is drawn. The fix writes the derived values."
ref = "comparefamily single-face test 27; fontbakery typenetwork/family/valid_strikeout; fontbakery typenetwork/family/valid_underline"
status = "docs"

[[check]]
id = "check.metrics.metricsKeyOutOfSync"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A glyph's sidebearings or width no longer match the metrics key or formula stored for them. The fix recomputes the metrics from the keys."
ref = "Editor audit convention (metrics keys out of sync)"
status = "inferred"
notes = "Reported through the spacing crate's out-of-sync scan (spacing.scan_glyph): out-of-sync, unlinked and unreadable keys. Only out-of-sync keys carry the update fix; an unlinked or unreadable key needs a new key first."

[[check]]
id = "check.metrics.negativeAdvance"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A glyph has a negative advance width, which cannot be compiled."
ref = "Editor audit convention (advance widths)"
status = "inferred"
notes = "Master layers and layers with attributes (intermediate, alternate, colour) are checked; backup layers are not."

