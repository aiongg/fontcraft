# FontCraft feature inventory: font quality checks (the auditor)
# Date: 2026-10-07
# Sources (all permissively licensed; read as code and docs, re-worded here):
#   - FontBakery (Apache-2.0), github.com/fonttools/fontbakery @ 9a85e003: Lib/fontbakery/checks/**, Lib/fontbakery/profiles/*.py
#   - AFDKO (Apache-2.0), github.com/adobe-type-tools/afdko: python/afdko/checkoutlinesufo.py,
#     python/afdko/comparefamily.py, docs/MSFontValidatorIssues.md
#   - fontTools (MIT), github.com/fonttools/fonttools: Lib/fontTools/varLib/interpolatable*.py, Lib/fontTools/ttLib/removeOverlaps.py
#   - Rows with status = "inferred" are outline and source checks of the kind font editors' audit panels offer; they are
#     our own design and have no reference text behind them.
# Behaviour notes: docs/spec/21-qa.md (profiles, result format, fix mapping).
# Conventions used in this file:
#   - `ref` names the originating check(s); "fontbakery <id>" is a FontBakery check id, "comparefamily single-face test N" /
#     "comparefamily family test N" are the numbered tests of comparefamily, "checkoutlinesufo <name>" a test of that tool,
#     "fontTools varLib.interpolatable <type>" a problem type.
#   - `severity` is the most severe status any of the referenced checks emits by default (FAIL/Error -> fail,
#     WARN/Warning -> warn, INFO/Note -> info); failures that only say a required table is absent are not counted, since
#     check.tables.requiredTables reports those. checkoutlinesufo messages carry no severity upstream and are mapped to
#     warn; varLib.interpolatable problem types carry none either: the ones that make interpolation impossible are fail,
#     the heuristic ones warn. Lesser severities of individual messages are described in `summary`.
#   - `scope` is the artefact the check reads: the editable source, a compiled font (a source is compiled in memory first),
#     or several fonts of one family.
#   - Profile membership and the fix id of each check are listed in docs/spec/21-qa.md (the row schema has no field for them).

# ---------------------------------------------------------------------------
# outlines: Outline geometry
# ---------------------------------------------------------------------------

[[check]]
id = "check.outlines.overlap"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "After components are decomposed, the glyph's contours cross each other or themselves, or a contour lies inside another contour that runs the same way. Curves are flattened into 24 line pieces each and only proper crossings count; the contours of one component are not compared with each other. Message codes: `crossing` and `nested-same-direction`. The fix replaces the paths involved with their union (Remove Overlap); open paths and components stay."
ref = "checkoutlinesufo overlap removal (do_overlap_removal); fontTools ttLib.removeOverlaps"
status = "docs"
notes = "Restoring the earlier contour order and start points after the union (audit.outlineFixKeepsContourOrder) is not built yet."

[[check]]
id = "check.outlines.coincidentPoints"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "Two consecutive on-curve points of a contour have identical coordinates, giving a zero-length segment. The fix deletes the later point and, when that point ends a curve, its two handles as well."
ref = "checkoutlinesufo coincident points (remove_coincident_points)"
status = "docs"

[[check]]
id = "check.outlines.flatCurve"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A cubic segment whose two handles both lie on the straight line between its end points, within `tolerance` units (default 0). The fix turns the segment into a line and drops the handles."
ref = "checkoutlinesufo flat curves (remove_flat_curves, --tolerance)"
status = "docs"

[[check]]
id = "check.outlines.collinearLines"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "Two consecutive line segments lie on one straight line, so the node between them is redundant. Tested by distance from the line (`tolerance`, default 0 units) and, in the looser variant, by an angle difference under 0.1 rad; the looser variant is skipped for sources with more than one master and stays silent above 100 hits. The fix removes the middle node."
ref = "checkoutlinesufo colinear line segments (remove_colinear_lines, --tolerance); fontbakery outline_colinear_vectors"
status = "docs"

[[check]]
id = "check.outlines.tinyContour"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A contour with four or fewer on-curve points whose bounding box area is below `minArea` (default 25 square units), typically a sliver left by overlap removal. The fix deletes the contour."
ref = "checkoutlinesufo tiny sub-paths (remove_tiny_sub_paths, --min-area)"
status = "docs"
notes = "audit.fix deletes the reported paths with edit.delete, right after overlap removal (docs/spec/21-qa.md § 5 › Fix calls)."

[[check]]
id = "check.outlines.noContours"
severity = "info"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "A glyph layer has neither paths nor components, and the glyph is not a space. A glyph is a space when it is mapped to U+0020, U+00A0, U+1680, U+180E, U+2000-200B, U+202F, U+205F, U+3000 or U+FEFF, or when its name up to the first period is `space`, `nbspace` or `uniXXXX` for one of those code points."
ref = "checkoutlinesufo 'has no contours' report"
status = "docs"

[[check]]
id = "check.outlines.pathDirection"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A contour winds the wrong way for its nesting depth: outer contours run counter-clockwise (the PostScript convention of sources), counters clockwise, and so on alternately. A contour encloses another when the inner contour's bounding box lies inside the outer one's (and is not equal to it) and every sampled on-curve point of the inner contour (up to 16) is inside the outer contour. Message codes: `outer-clockwise`, `counter-same-direction`, `nested-clockwise`. The fix runs Correct Path Direction on the layer: directions from nesting, each closed path starting at its lowest, then leftmost, node, and the paths sorted."
ref = "fontbakery outline_direction"
status = "docs"

[[check]]
id = "check.outlines.alignmentMiss"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "An on-curve point sits within 2 units of, but not on, a vertical metric: baseline, x-height (lowercase letters only), cap height (uppercase only), ascender or descender. The report is dropped when more than 100 points match. The fix moves the point and its handles onto the metric line."
ref = "fontbakery outline_alignment_miss"
status = "docs"
notes = "audit.fix runs selection.move on each reported node with dy taking it onto the metric line (docs/spec/21-qa.md § 5 › Fix calls, step 26); its handles move with it."

[[check]]
id = "check.outlines.jaggySegments"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "Two neighbouring segments meet at a very sharp angle (under 0.25 rad between the incoming and outgoing tangents, and not zero), which usually marks a spike or a folded-back node. Deep ink traps trigger it too, so it is advisory. The check is not run on sources with more than one master."
ref = "fontbakery outline_jaggy_segments"
status = "docs"

[[check]]
id = "check.outlines.almostOrthogonalLine"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "A line segment is within 0.5 degrees of horizontal or vertical without being exactly so. Skipped for italic masters and for sources with more than one master, where such lines are often intended."
ref = "fontbakery outline_semi_vertical"
status = "docs"

[[check]]
id = "check.outlines.shortSegments"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "A segment is shorter than 3 units or shorter than 0.6% of its contour's length; a short line that follows another line is not counted. The report is dropped above 100 hits and is not produced for sources with more than one master."
ref = "fontbakery outline_short_segments"
status = "docs"

[[check]]
id = "check.outlines.overlappingSegments"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "Two segments in the same glyph have the same end points and the same handles, compared exactly and in either direction, so one edge is drawn twice; some rasterisers mishandle this. The fix removes the overlap."
ref = "fontbakery overlapping_path_segments"
status = "docs"

[[check]]
id = "check.outlines.pointsOutsideBBox"
severity = "warn"
scope = "binary"
fixable = true
area = "qa"
milestone = "M12"
summary = "In a `glyf` glyph a point (including an off-curve point) lies outside the bounding box stored for the glyph, or a coordinate exceeds 32766 in magnitude. Usually the source lacks extreme points; recomputing the stored box is the mechanical repair, adding extremes the design one."
ref = "fontbakery opentype/points_out_of_bounds"
status = "docs"
notes = "Composite glyphs are compared through their drawn outline, which also yields the implied on-curve points between off-curve points; those lie inside the box whenever their neighbours do."

[[check]]
id = "check.outlines.contourCount"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "For encoded glyphs with a known shape, the number of contours differs from the set of counts expected for that character (for example two for a double quote); a zero count where ink is expected is a failure. Needs our own expected-count table; static TrueType only, private-use codepoints excluded."
ref = "fontbakery contour_count"
status = "docs"
notes = "Expected counts are looked up by code point only; the reference also looks them up by glyph name. Composites count the contours of their components; components named .ttfautohint are left out, as the reference leaves them out."

[[check]]
id = "check.outlines.mixedCurveTypes"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "The source mixes cubic and quadratic curves, either inside one glyph layer (code `mixed-in-layer`) or in a layer whose curves are all of the type the font uses less (code `differs-from-font`), which is normally accidental and can confuse the build. The fix converts everything to the font's main curve type."
ref = "fontbakery ufo_consistent_curve_type (not in any fontbakery profile)"
status = "docs"
notes = "audit.fix converts the layer with path.convertToCubic or path.convertToQuadratic, whichever is the font's main curve type."

[[check]]
id = "check.outlines.openCorners"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A contour contains an open corner: two segments that cross a short distance before a corner node, leaving a small triangular overlap outside the shape. Reported per layer; matters for sources that must round or offset cleanly. The fix trims the corner to the crossing point."
ref = "fontbakery ufo_no_open_corners (not in any fontbakery profile)"
status = "docs"
notes = "audit.fix runs path.eraseOpenCorners on the reported corner nodes (docs/spec/21-qa.md § 5 › Fix calls, step 14)."

[[check]]
id = "check.outlines.missingExtremes"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A curve segment reaches a horizontal or vertical extreme between its nodes instead of at a node. Extremes closer than `minDistance` units (default 1) to an existing node are ignored. The fix splits the segment at each extreme without changing its shape."
ref = "Editor audit convention (extremum points); related: fontbakery opentype/points_out_of_bounds"
status = "inferred"
guesses = [
  "The default `minDistance` of 1 unit is a first guess to tune on real fonts (21-qa question 5).",
]

[[check]]
id = "check.outlines.inflections"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A cubic segment changes its bending direction (has an inflection) between its nodes. The fix inserts a node at each inflection."
ref = "Editor audit convention (inflection points)"
status = "inferred"
notes = "Report-only until the command path.addInflections exists."

[[check]]
id = "check.outlines.almostStraightCurve"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A curve segment deviates from the straight line between its end points by less than `maxDeviation` units (default 2) but is not exactly flat. The fix converts it to a line."
ref = "Editor audit convention (almost-straight curves); extends checkoutlinesufo flat curves"
status = "inferred"
guesses = [
  "The default `maxDeviation` of 2 units is a first guess to tune on real fonts (21-qa question 5).",
]

[[check]]
id = "check.outlines.almostOrthogonalHandle"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A handle is within `maxAngle` degrees (default 2) of horizontal or vertical without being exact, or is less than `maxOffset` units (default 2) off the axis while within 10 degrees of it; the angle limit on the offset rule keeps short diagonal handles out. The fix snaps the handle to the axis, keeping its length."
ref = "Editor audit convention (slightly slanted handles)"
status = "inferred"
notes = "audit.fix runs selection.setPosition on each reported handle, turning it onto the horizontal or vertical through its node, whichever is nearer, keeping its length (docs/spec/21-qa.md § 5 › Fix calls, step 25)."
guesses = [
  "The defaults `maxAngle` 2° and `maxOffset` 2 units are first guesses to tune on real fonts (21-qa question 5).",
]

[[check]]
id = "check.outlines.zeroLengthHandle"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A handle has the same coordinates as the on-curve point it belongs to. When both handles of a segment are retracted the fix turns the segment into a line; a single retracted handle is reported only."
ref = "Editor audit convention (zero handles)"
status = "inferred"

[[check]]
id = "check.outlines.nearCoincidentPoints"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "Two consecutive on-curve points are closer than `minDistance` units (default 1) without being identical. The fix merges them into one node, keeping the outer handles."
ref = "Editor audit convention (duplicate or stacked nodes); extends checkoutlinesufo coincident points"
status = "inferred"
guesses = [
  "The default `minDistance` of 1 unit is a first guess to tune on real fonts (21-qa question 5).",
]

[[check]]
id = "check.outlines.duplicateContour"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "Two contours of one glyph have the same points (same or opposite direction), as happens after pasting twice. The fix deletes the extra copies."
ref = "Editor audit convention (duplicate paths)"
status = "inferred"
notes = "audit.fix deletes every copy after the first with edit.delete."

[[check]]
id = "check.outlines.openPath"
severity = "fail"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A contour is open. Open paths are left out of exported fonts and block interpolation. The fix closes the path by joining its ends when they coincide and by adding a line otherwise."
ref = "Editor audit convention (open paths); fontTools varLib.interpolatable open_path"
status = "inferred"
observe = [
  "Fault font (one master: an open path, a glyph named with a space, two glyphs with U+0041, a component of a missing glyph, two glyphs that use each other as components, a glyph name of 70 characters): export OTF and TTF; note the export result message for the open path, its wording, and whether the export stops or continues.",
]

[[check]]
id = "check.outlines.strayPoint"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A contour consists of a single point, or of only off-curve points with no usable shape. The fix deletes it."
ref = "Editor audit convention (stray points); fontbakery outline_direction also reports paths with no bounds"
status = "inferred"
notes = "audit.fix deletes the reported paths with edit.delete, right after overlap removal."

[[check]]
id = "check.outlines.zeroAreaContour"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A closed contour encloses no area, for example two points joined by lines or a path folded back onto itself. The fix deletes it."
ref = "Editor audit convention (degenerate paths)"
status = "inferred"
notes = "audit.fix deletes the reported paths with edit.delete, right after overlap removal."

[[check]]
id = "check.outlines.invalidSegmentStructure"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "A contour marked as cubic has a run of off-curve points that is not exactly two long, or a quadratic contour is malformed, so the path cannot be compiled as written."
ref = "Editor audit convention (path structure)"
status = "inferred"

[[check]]
id = "check.outlines.nodesOffGrid"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A node or handle coordinate is not a multiple of the font's grid step (grid spacing divided by subdivision); with the default grid of 1 this means fractional coordinates. The fix rounds every coordinate to the grid."
ref = "Editor audit convention (points off grid); checkoutlinesufo -d/--decimal rounding rule"
status = "inferred"

[[check]]
id = "check.outlines.coordinatesOutOfRange"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "A coordinate lies outside the range a compiled font can store (magnitude above 32766, code `beyond-storage`, fail) or implausibly far from the em square (more than `maxEmMultiple` em, default 4, code `far-from-em`, warn)."
ref = "Editor audit convention; limit from fontbakery opentype/points_out_of_bounds"
status = "inferred"
guesses = [
  "The default `maxEmMultiple` of 4 em is a first guess to tune on real fonts (21-qa question 5).",
]

[[check]]
id = "check.outlines.nearAlignmentZone"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "An extreme on-curve point lies just outside an alignment zone, within `margin` units (default 2) of its edge, so it will not be treated as an overshoot by the hinter."
ref = "Editor audit convention (near-miss of zones); complements fontbakery outline_alignment_miss"
status = "inferred"
guesses = [
  "The default `margin` of 2 units is a first guess to tune on real fonts (21-qa question 5).",
]

[[check]]
id = "check.outlines.kinkedSmoothNode"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A node flagged smooth has incoming and outgoing directions that differ by more than `maxAngle` degrees (default 1), so the curve has a visible kink. The fix rotates the handles onto a common line, keeping their lengths."
ref = "Editor audit convention (non-collinear smooth nodes)"
status = "inferred"
notes = "audit.fix runs selection.setPosition on each handle of the node: both turn about the node, keeping their lengths, onto the line along the mean of the incoming and outgoing directions (docs/spec/21-qa.md § 5 › Fix calls, step 23)."
guesses = [
  "The default `maxAngle` of 1° is a first guess to tune on real fonts (21-qa question 5).",
  "When one side of the smooth node is a straight segment, the fix turns only the handle onto the line's direction and leaves the line; running the reference's fix on such a node would settle it.",
]

[[check]]
id = "check.outlines.unflaggedSmoothNode"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A node flagged as corner has exactly collinear handles; it probably should be smooth. The fix sets the smooth flag."
ref = "Editor audit convention (node type clean-up)"
status = "inferred"
notes = "audit.fix sets the reported nodes smooth with path.toggleNodeType (to: smooth, keepOutline: true)."

[[check]]
id = "check.outlines.unbalancedHandles"
severity = "info"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "The two handles of a curve segment have very different relative lengths (ratio above `maxRatio`, default 4) or one handle is longer than the distance to the handles' intersection, which makes the curve lumpy."
ref = "Editor audit convention (unbalanced handles)"
status = "inferred"
guesses = [
  "The default `maxRatio` of 4 is a first guess to tune on real fonts (21-qa question 5).",
]

[[check]]
id = "check.outlines.crossedHandles"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M3"
summary = "The two handles of a cubic segment cross each other, so the segment forms a loop or a cusp."
ref = "Editor audit convention (crossed handles)"
status = "inferred"

[[check]]
id = "check.outlines.curvatureBreak"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "At a smooth node the curvature on the two sides differs by more than `maxRatio` (default 2). The fix moves the node along its handle line until the curvatures match."
ref = "Editor audit convention (curvature continuity)"
status = "inferred"
notes = "audit.fix moves the reported nodes with path.harmonizeNodes."

[[check]]
id = "check.outlines.startPointPosition"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M3"
summary = "A contour's first node is not the conventional one (the lowest, then leftmost on-curve node), which makes masters harder to keep compatible. The fix moves the start point; it is offered only when every master agrees on the result."
ref = "Editor audit convention (start points); checkoutlinesufo restore_contour_order start-point matching"
status = "inferred"

# ---------------------------------------------------------------------------
# components: Components
# ---------------------------------------------------------------------------

[[check]]
id = "check.components.nested"
severity = "fail"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A component points at a glyph that itself contains components. Nested composites have rendered and printed wrongly in several environments, especially in variable fonts. The fix flattens the nesting to one level, combining the transforms."
ref = "fontbakery nested_components"
status = "docs"
notes = "On sources a component is nested when its base glyph exports and is made of components only, as the TrueType export keeps such a base as a composite; a base that also has paths is decomposed on export and is reported by mixedWithOutlines instead."
guesses = ["Only glyphs that export are checked, since the reference check reads the compiled font; checking the exported TrueType font with the reference check would settle it."]

[[check]]
id = "check.components.transformed"
severity = "fail"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A component is scaled, rotated, skewed or mirrored. In a hinted TrueType font any non-identity 2x2 transform counts; in an unhinted one only a mirrored component (which reverses the outline direction) does. The fix decomposes the offending components."
ref = "fontbakery transformed_components"
status = "docs"
guesses = ["A source does not say whether its TrueType export will be hinted, so a mirrored component (negative determinant) is a failure and any other transform a warning; the reference check makes both failures on hinted fonts and only mirroring on unhinted ones."]

[[check]]
id = "check.components.duplicate"
severity = "fail"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A glyph contains the same component twice with the same offset and no transform, so the copies cover each other (the classic broken double quote). The fix removes the extra copy."
ref = "fontbakery opentype/glyf_non_transformed_duplicate_components"
status = "docs"
notes = "Copies count as duplicates when they name the same glyph, their offsets round to the same integers and their 2x2 transforms are equal; the reference check compares only the glyph and the offset. The finding names the later copy, which the fix deletes."

[[check]]
id = "check.components.overlap"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "Two components of a composite glyph overlap each other. Static exports that promise overlap-free outlines must decompose and merge such glyphs; variable TrueType exports must set the overlap flag instead."
ref = "fontTools ttLib.removeOverlaps (componentsOverlap)"
status = "docs"
notes = "Each component is drawn as its outline (curves flattened into 24 pieces); two components overlap when their edges cross properly or a contour of one lies inside the filled area of the other. Edges that only touch do not count. Only glyphs that export are checked."

[[check]]
id = "check.components.mixedWithOutlines"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A glyph holds both contours and components. TrueType cannot store that mix, so the export decomposes the glyph, which loses component reuse and component hinting. The fix decomposes in the source."
ref = "Editor audit convention (mixed outlines and components)"
status = "inferred"

[[check]]
id = "check.components.orphaned"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A component names a glyph that is not in the font."
ref = "Editor audit convention (orphaned components)"
status = "inferred"
observe = [
  "Fault font (one master: an open path, a glyph named with a space, two glyphs with U+0041, a component of a missing glyph, two glyphs that use each other as components, a glyph name of 70 characters): export OTF and TTF; note the export result message for the component of a missing glyph, its wording, and whether the export stops or continues.",
]

[[check]]
id = "check.components.circular"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A component chain leads back to the glyph it started from."
ref = "Editor audit convention (component cycles)"
status = "inferred"
observe = [
  "Fault font (one master: an open path, a glyph named with a space, two glyphs with U+0041, a component of a missing glyph, two glyphs that use each other as components, a glyph name of 70 characters): export OTF and TTF; note the export result message for the two glyphs that use each other, its wording, and whether the export stops or continues.",
]

[[check]]
id = "check.components.nonExportingBase"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A component points at a glyph that is excluded from export. The exporter must decompose it; the fix does so in the source."
ref = "Editor audit convention (non-exporting base glyphs)"
status = "inferred"

[[check]]
id = "check.components.emptyBase"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A component points at a glyph with no outline in the same master, so it contributes nothing."
ref = "Editor audit convention (empty base glyphs)"
status = "inferred"

[[check]]
id = "check.components.misaligned"
severity = "info"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A mark component is not where its anchor pair would put it, or a composite's width differs from its base letter although automatic alignment would apply. The fix re-applies automatic alignment."
ref = "Editor audit convention (components out of alignment)"
status = "inferred"
notes = "Not registered yet: the check needs the alignment routine of the components crate, which the audit crate does not depend on."

[[check]]
id = "check.components.caronAlternate"
severity = "fail"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
summary = "Lcaron, dcaron, lcaron or tcaron is composed with the ordinary caron (U+02C7 or U+030C), a failure, or with a comma, apostrophe or single quote glyph, a warning, instead of a dedicated vertical-caron glyph. Decomposed or single-component forms are warned about because the mark cannot be verified. TrueType composites only."
ref = "fontbakery alt_caron"
status = "docs"

[[check]]
id = "check.components.fewComposites"
severity = "warn"
scope = "binary"
fixable = false
area = "qa"
milestone = "M12"
