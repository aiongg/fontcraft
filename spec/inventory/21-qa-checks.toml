status = "docs"
notes = "Follows FontBakery 1.1.0 tabular_kerning without shaping: pair values are read from the kern feature's pair lookups (lookups add up, the first subtable that applies decides), with the tnum single substitutions applied to the default figures. Device and variation deltas, contextual kerning, lookup flags and FontBakery's digraph exception are not read, and excluded code points are matched on the glyph itself, not on the name without its suffix."
guesses = [
