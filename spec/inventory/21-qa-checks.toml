id = "check.files.auditorVersion"
severity = "info"
scope = "binary"
fixable = false
area = "qa"
milestone = "M13"
summary = "The auditor is older than the latest published release, so its rules may be out of date. Needs network access. A failure upstream; informational here by design, so that an offline or pinned tool never fails a run."
ref = "fontbakery fontbakery_version"
status = "docs"

# ---------------------------------------------------------------------------
# sources: Source files
# ---------------------------------------------------------------------------
notes = "Moved from M12 to M13 by the answer to docs/plans/M12.md § 7, question 4: it needs a network request, FontCraft makes none, and the check is informational."

[[check]]
id = "check.sources.designspaceLoads"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A designspace document cannot be parsed, lists no sources, or lists sources that cannot be opened."
ref = "fontbakery designspace_has_sources"
status = "docs"
notes = "A designspace in the model with no masters lists no sources. Parse errors and sources that cannot be opened come from reading the files again (AuditServices::check_source_files); without that service the check skips."

[[check]]
id = "check.sources.defaultMaster"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "No source sits at the default location of every axis, so there is no default master."
ref = "fontbakery designspace_has_default_master"
status = "docs"
notes = "Each axis's default in user coordinates goes through the axis map to design coordinates; a master within 0.001 design units of every default is the default master. Sources from the reference app always pass: their axis defaults derive from the origin master."

[[check]]
id = "check.sources.consistentGlyphSet"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A non-default master contains glyphs that the default master lacks."
ref = "fontbakery designspace_has_consistent_glyphset"
status = "docs"
notes = "The default master is the designspace's default source, else the origin master. A glyph with a master layer for another master but none for the default master is reported."
guesses = [
  "The check runs on every source with several masters, not only on designspace documents as in FontBakery; for .glyphs sources it can repeat a missing-glyph finding of the variations checks.",
]

[[check]]
id = "check.sources.consistentCodepoints"
severity = "fail"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "A glyph has different codepoints in different masters. The fix copies the default master's codepoints."
ref = "fontbakery designspace_has_consistent_codepoints"
status = "docs"
notes = "Reads the code points the designspace reader keeps on a master layer where that master's file differs from the default source; they count only while the glyph's code points are still the ones read."

[[check]]
id = "check.sources.ufoStructure"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A UFO fails structural validation: missing or malformed property lists, layer contents that do not match the files on disk, or invalid glyph files."
ref = "fontbakery ufolint"
status = "docs"
notes = "Applies to UFO and designspace sources. The validation is the engine's strict re-reading of the files (AuditServices::check_source_files); without it the check skips."

[[check]]
id = "check.sources.requiredInfoFields"
severity = "fail"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A font-info value the compiler cannot work without is unset: unitsPerEm, ascender, descender, xHeight, capHeight or familyName."
ref = "fontbakery ufo_required_fields"
status = "docs"
notes = "The model's terms: units per em, the family name, and each master's ascender, descender, x-height and cap height metric values."
guesses = [
  "A master's metric counts as unset only when its value list ends before it; a value stated as 0 between others cannot be told from an unset one.",
]

[[check]]
id = "check.sources.recommendedInfoFields"
severity = "warn"
scope = "source"
fixable = false
area = "qa"
milestone = "M12"
summary = "A font-info value every release font should set is unset: underline thickness and position, major and minor version, style name, copyright or PANOSE."
ref = "fontbakery ufo_recommended_fields"
status = "docs"
notes = "The model's terms: the copyright property, each master's name as its style name, and a panose parameter on the font or the master."
guesses = [
  "Underline thickness and position and the version are never reported: the model gives them the reference's defaults, so they always have a value.",
]

[[check]]
id = "check.sources.unnecessaryInfoFields"
severity = "warn"
scope = "source"
fixable = true
area = "qa"
milestone = "M12"
summary = "The font info sets values the compiler generates itself or that are obsolete: openTypeNameUniqueID, openTypeNameVersion, postscriptUniqueID or year. The fix clears them."
ref = "fontbakery ufo_unnecessary_fields"
status = "docs"
notes = "Looks for the properties uniqueID and versionString and the parameters openTypeNameUniqueID, openTypeNameVersion, postscriptUniqueID, year, uniqueID and versionString, on the font and on each master. Report-only until a Font Info command clears them."
guesses = [
  "versionString and uniqueID are reported in .glyphs sources too, since they compile to the same name records as the UFO keys FontBakery names.",
]

