[[command]]
id = "path.transformations"
label = "Transformations"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph?: name, glyphs?: [names], layer?: id, layers?: [ids] (with glyphs), side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index] (lists with glyph), translate?: {x: number, y: number}, origin?: \"capHeight\"|\"halfCapHeight\"|\"xHeight\"|\"halfXHeight\"|\"baseline\" | origin object (default baseline), scale?: {x: percent, y?: percent}, slant?: degrees, cursivy?: bool, string?: export-filter string}"
area = "drawing"
milestone = "M3"
summary = "Applies an affine transform (move, scale, slant) to the selected points or to whole selected layers, around a chosen origin. scale.y defaults to scale.x (locked); cursivy switches the slant to the optically corrected variant. The origin choices come from the export parameter documentation, not from this chapter."
ref = "Filters › Built-in Filters › Transformations › Transformations; Appendix › Custom Parameters › Filter"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 1:49–2:24: Path › Transformations opens the dialog and the canvas previews a 10° slant. Not shown: translate and scale results, Cursivy."

[[panel]]
id = "dialog.transformations"
label = "Transformations"
location = "dialog"
controls = [
  "Translate X and Y fields",
  "Origin pop-up",
  "Scale horizontal and vertical fields with lock button",
  "Slant field whose label opens a pop-up (its items: path.transformations.slantVsCursivy)",
  "Cancel and OK buttons",
  "round \"…\" button at the bottom left, opening a menu with Copy Filter Parameter and Copy PreFilter Parameter",
]
area = "drawing"
milestone = "M3"
summary = "Dialog for a one-off affine transformation of the selection or of selected layers. While it is open the canvas shows the result; Cancel puts the outlines back as they were."
ref = "Filters › Built-in Filters › Transformations › Transformations"
status = "observed"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 1:49–2:24: fields Translate X and Y, an Origin pop-up (set to baseline), Scale horizontal and vertical with a lock, a Slant field whose label carries a pop-up arrow, Cancel and OK, and a round \"…\" button at the bottom left. The glyph is drawn transformed while the dialog is open and returns to its old shape after Cancel. FontCraft's dialog has these controls in that order: under the heading Translate X and Y; the Origin pop-up; under Scale Horizontal and Vertical and a lock button (closed: the two scale fields hold the same value); under Slant a Kind pop-up (Slant or Cursivy, see path.transformations.slantVsCursivy) and the Angle field. It runs path.transformations with `translate` and `scale` objects, leaving out a translation of 0 and a scale of 100 %. The \"…\" menu runs Copy Filter Parameter and Copy PreFilter Parameter and puts the text on the system clipboard (ui.click with copyFilterParameter or copyPreFilterParameter)."

