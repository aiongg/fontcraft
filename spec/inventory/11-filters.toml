ref = "Filters › Built-in Filters › Transformations; Appendix › Custom Parameters › Filter"
status = "handbook"

[[command]]
id = "glyph.transformMetrics"
label = "Transform Metrics"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids] (default: the first master's layer), width?: number, onBothSides?: bool, lsb?: number, rsb?: number, relative?: bool}"
area = "spacing-kerning"
milestone = "M5"
summary = "Sets a new advance width, or new left and/or right sidebearings, on the selected glyph layers. Passing width selects width mode; otherwise each of lsb and rsb that is present is changed, absolutely or (relative) as a delta. width does not combine with lsb or rsb."
ref = "Filters › Built-in Filters › Transformations › Transform Metrics"
status = "handbook"
notes = "Documented, not yet observed. The outline, components, anchors, local guides, annotations, the placed image and the background move together; hints stay. With `glyphs`, a locked glyph or one without the layer is skipped and listed, as for the other whole-layer commands."
guesses = [
  "Shifts and new widths are rounded to the font's grid, so an absolute sidebearing measured with a fraction lands within half a grid step of the entered value; watching the reference app on a glyph with a fractional extremum would settle it.",
  "In sidebearing mode a layer without an outline is skipped and listed, because it has no sidebearings to set; running the dialog on the space glyph in the reference app would settle it.",
  "Metrics keys are left as they are, so a glyph whose key the command overrides then shows as out of sync; the reference app on a glyph with a key would settle it.",
  "A layer of a master that links its metrics to another master is changed like any other; the reference app on a linked master would settle it.",
]

[[panel]]
id = "dialog.transformMetrics"
label = "Transform Metrics"
location = "dialog"
controls = [
  "Width checkbox with value field",
  "on both sides checkbox",
  "LSB checkbox with value field",
  "RSB checkbox with value field",
  "Relative checkbox",
]
area = "spacing-kerning"
milestone = "M5"
summary = "Dialog for assigning widths or sidebearings to many layers at once. The Width checkbox switches between width mode and sidebearing mode."
ref = "Filters › Built-in Filters › Transformations › Transform Metrics"
status = "handbook"
notes = "Opens from Glyph › Transform Metrics on the selected glyphs (Font View) or the edited layer, with a live preview. Width on sends `width` and `onBothSides`; Width off sends `lsb` and `rsb` for the checked sides, and `relative`. The values of the other mode stay in their fields and are not sent. Parameters in the command's shape set the checkboxes when the dialog opens. Documented, not yet observed."
guesses = [
  "The dialog opens in sidebearing mode with LSB, RSB and Relative checked and both values 0, so opening it changes nothing; the reference app's first opening would settle it.",
  "The width field starts at half the units per em; the reference app's first opening would settle it.",
  "Each checkbox and its value field are two rows of the form (\"LSB\", \"LSB value\") instead of one row; observing the reference dialog would settle the layout.",
]

[[behavior]]
id = "glyph.transformMetrics.widthMode"
area = "spacing-kerning"
milestone = "M5"
summary = "With Width enabled every target layer gets the entered advance width. Point coordinates are left unchanged, so the whole difference lands on the right sidebearing, unless on both sides is checked."
ref = "Filters › Built-in Filters › Transformations › Transform Metrics"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "glyph.transformMetrics.onBothSides"
area = "spacing-kerning"
milestone = "M5"
summary = "on both sides distributes the width change equally between the left and right sidebearing, instead of putting it all on one side: everything in the layer moves by half the change."
ref = "Filters › Built-in Filters › Transformations › Transform Metrics"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "When half the change is not on the grid, the left side's half is rounded to the grid and the right side takes the rest; an odd width change in the reference app would settle it.",
]

[[behavior]]
