notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 1:53–2:47: the dialog's Origin pop-up is set to baseline, and Copy Filter Parameter writes it as Origin:4. The other four codes are not shown."

