# --- Extrude ---

[[command]]
id = "filter.extrude"
label = "Extrude"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], offset: number, angle: number, dontSubtract?: bool = false}"
area = "path-ops"
milestone = "M3"
summary = "Builds a solid drop-shadow body by sweeping the glyph shape along a straight vector of the given length and direction. By default the original shape is then cut out of the swept shape, leaving only the shadow; Don't Subtract keeps the full swept shape."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"
notes = "Documented, not yet observed. Curves are split where they run parallel to the sweep. The sweep vector is rounded to the grid, so are new points; an offset of 0 (or one that rounds to 0) changes nothing. Open paths, components and locked paths are not changed. No export string form is documented, so Extrude has none until a written source shows one (owner's decision): filter.apply refuses an Extrude string or positional items and runs it with named parameters only."
guesses = [
  "The construction is ours: the swept shape is the original area plus the band each piece of a closed path sweeps.",
  "The offset runs from 0 to 1000000 units and the angle from -360 to 360 degrees.",
]

[[panel]]
id = "dialog.filterExtrude"
label = "Extrude"
location = "dialog"
controls = [
  "Offset number field",
  "Angle number field",
  "Don't Subtract checkbox",
]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Extrude filter. Default values of Offset and Angle are not stated in the source; Don't Subtract is off by default."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"
notes = "The first values are the `default` of each parameter in filter.list. M3.33: the dialog opens with the values of its last OK in the session, the defaults the first time (crates/ui/src/dialogs/form.rs, DialogState::remember); test filter_dialogs_remember_their_last_ok_and_the_lock_ties_vertical_to_horizontal."
guesses = [
  "First values: offset 50, angle -45 (down and to the right), Don't Subtract off.",
  "The values of the last OK are kept for the session and not saved; Cancel keeps the earlier ones.",
]

[[behavior]]
id = "filter.extrude.offsetIsLength"
area = "path-ops"
milestone = "M3"
summary = "Offset is the shadow length, measured in font units along the extrusion direction."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"

[[behavior]]
id = "filter.extrude.angleConvention"
area = "path-ops"
milestone = "M3"
summary = "Angle is in degrees, counterclockwise, with 0 pointing horizontally to the right."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"

[[behavior]]
id = "filter.extrude.subtractsOriginalByDefault"
area = "path-ops"
milestone = "M3"
summary = "Unless Don't Subtract is on, the result is the swept shape minus the original outline; with it on, the original area stays part of the result."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"

# --- Hatch Outline ---

[[command]]
id = "filter.hatchOutline"
label = "Hatch Outline"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], originX?: number = 0, originY?: number = 0, stepWidth?: number = 20, angle?: number = 45, offsetPath?: bool = true, strokeWidth?: number = 5}"
area = "path-ops"
milestone = "M3"
summary = "Replaces the glyph shape with parallel hatch strokes clipped to it. Strokes start from an origin point, repeat every Step Width units at the given angle, and are either expanded to closed shapes of the Offset Path thickness or left as open centre lines when Offset Path is off."
ref = "Filters › Built-in Filters › Hatch Outline"
status = "handbook"
notes = "Documented, not yet observed. The hatched area is the filled area of the closed paths (nonzero rule). One line passes through the origin, the others repeat every stepWidth units (1 to 1000000). strokeWidth runs from 1 to 1000000 units; the stroke ends follow the outline. Open paths, single-node paths and components stay; locked paths are not changed; new points are rounded to the grid."
guesses = [
  "The construction is ours: with offsetPath each line becomes a rectangle strokeWidth units thick intersected with the outline, and without it each piece of line inside the outline becomes an open two-node path.",
  "A layer that would need more than 10000 lines is an error.",
]

