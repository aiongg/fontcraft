# Inventory: Filters
# Source: Glyphs 4 Handbook, chapter "Filters" (https://handbook.glyphsapp.com/single-page/),
#         plus the "Filter" / "PreFilter" entries of its Appendix "Custom Parameters" for the
#         export-string syntax, and one shortcut from the "Font View" chapter.
# Date: 2026-10-07
# All wording is our own. Rows with status "inferred" are FontCraft design, not reference facts.
# Note: Transform Metrics, Transformations, Interpolate with Background, Add Extremes and Remove
# Overlap live in the Glyph / Path menus of the reference but are documented as filters; they are
# listed here under filter.* ids with their real menu in `menu`.

# --- Filter menu and targeting rules ---

[[command]]
id = "filter.repeatLastFilter"
label = "Repeat Last Filter"
menu = []
shortcut = "Cmd+R"
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], points?: [[shape, node]], segments?: [[shape, node]] (with one glyph)}"
area = "path-ops"
milestone = "M3"
summary = "Runs the most recently used filter again on the current target. The source gives only the shortcut: the label is ours, a menu position is not confirmed, and whether the previous values are reused silently or the dialog reopens, are not stated."
ref = "Filters › Applying Filters › Filter Menu"
status = "handbook"
notes = "FontCraft (our design, not observed): the last filter is the last filter.* command of the registry, or filter.apply, in the session journal; it runs again silently with the same settings, on the targets given. Disabled until a filter has run."

[[command]]
id = "filter.apply"
label = "Apply Filter"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name | glyphs?: [names], layer?: id | layers?: [ids], points?, segments? (with glyph), filter: string, args?: [string] | {name: value}, string?: export string (in place of filter and args), include?: [names], exclude?: [names]}"
area = "path-ops"
milestone = "M3"
summary = "Generic headless entry point: runs any registered filter (built-in or plug-in) by its filter name with the same arguments the export-time parameter string accepts. Not a reference menu item; proposed so agents and the CLI can run a filter without a dialog."
ref = "Filters › Applying Filters; Appendix › Custom Parameters › Filter"
status = "inferred"
notes = "FontCraft: `filter` is the export name (case ignored) or the command id; `args` as a list holds export-string items, as an object the filter command's parameters; `string` holds a whole export string. Without glyph or glyphs it runs on every glyph of the font, as export does; include and exclude narrow the list. Transformations, AddExtremes and RemoveOverlap run their Path menu commands."

[[command]]
id = "filter.list"
label = "List Filters"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "path-ops"
milestone = "M3"
summary = "Read-only query returning every registered filter with its filter name, label, origin (built-in or plug-in) and parameter schema. Not in the reference; proposed so the Filter menu, the CLI and agents share one registry."
ref = "Filters (chapter introduction)"
status = "inferred"

[[behavior]]
id = "filter.menu.contents"
area = "path-ops"
milestone = "M3"
summary = "The Filter menu lists the built-in filters followed by every installed filter plug-in; choosing an entry applies that filter to the current target, through its options dialog where it has one."
ref = "Filters (chapter introduction); Filters › Applying Filters › Filter Menu"
status = "handbook"

[[behavior]]
id = "filter.menu.pluginFiltersListed"
area = "extensions"
milestone = "M13"
summary = "Filters installed through the Plugin Manager appear in the Filter menu next to the built-in ones and can be used as export-time custom parameters in the same way."
ref = "Filters (chapter introduction)"
status = "handbook"

[[behavior]]
id = "filter.target.fontViewSelection"
area = "path-ops"
milestone = "M3"
summary = "Run from Font View, a filter processes every selected glyph."
ref = "Filters › Applying Filters › Filter Menu"
status = "handbook"

[[behavior]]
id = "filter.target.editViewTextSelection"
area = "path-ops"
milestone = "M3"
summary = "Run from Edit View while the Text tool is active, a filter processes the glyphs covered by the text selection."
ref = "Filters › Applying Filters › Filter Menu"
status = "handbook"

[[behavior]]
id = "filter.target.editViewCurrentGlyph"
area = "path-ops"
milestone = "M3"
summary = "Run from Edit View with any tool other than Text, a filter processes only the current glyph."
ref = "Filters › Applying Filters › Filter Menu"
status = "handbook"

[[behavior]]
id = "filter.target.visibleLayerOnly"
area = "path-ops"
milestone = "M3"
summary = "A filter normally changes only the layer currently shown for each target glyph. Other masters are untouched, so covering all masters means switching master and running the filter again (Cmd+R helps)."
ref = "Filters › Applying Filters › Filter Menu"
status = "handbook"

[[behavior]]
id = "filter.target.headlessExplicitTargets"
area = "path-ops"
milestone = "M3"
summary = "Every filter command accepts explicit glyph names and layer ids so that it works without a UI selection; when both are omitted the UI targeting rules above apply. A layers list may name several masters, which removes the need to re-run per master."
ref = "Filters › Applying Filters › Filter Menu"
status = "inferred"
notes = "FontCraft: a filter command takes one glyph or a glyphs list (the shell fills them from its selection) and the first master's layer unless layer or layers is given. With glyphs, a locked glyph or a missing layer is skipped and listed; with one glyph it is an error. filter.apply without glyph or glyphs runs on every glyph."

# --- Extrude ---

[[command]]
id = "filter.extrude"
label = "Extrude"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], offset: number, angle: number, dontSubtract?: bool = false}"
area = "path-ops"
milestone = "M3"
summary = "Builds a solid drop-shadow body by sweeping the glyph shape along a straight vector of the given length and direction. By default the original shape is then cut out of the swept shape, leaving only the shadow; Don't Subtract keeps the full swept shape."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"
notes = "Documented, not yet observed. FontCraft geometry (ours): the swept shape is the original area plus the band each piece of a closed path sweeps; curves are split where they run parallel to the sweep. The sweep vector is rounded to the grid, so are new points; an offset of 0 (or one that rounds to 0) changes nothing. Open paths, components and locked paths are not changed. Offset 0 to 1000000 units, angle -360 to 360 degrees. No export string form is documented, so Extrude has none until a written source shows one (owner's decision): filter.apply refuses an Extrude string or positional items and runs it with named parameters only."

[[panel]]
id = "dialog.filterExtrude"
label = "Extrude"
location = "dialog"
controls = [
  "Offset number field",
  "Angle number field",
  "Don't Subtract checkbox",
]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Extrude filter. Default values of Offset and Angle are not stated in the source; Don't Subtract is off by default."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"
notes = "FontCraft first values (ours): offset 50, angle -45 (down and to the right), Don't Subtract off (the `default` of each parameter in filter.list)."

[[behavior]]
id = "filter.extrude.offsetIsLength"
area = "path-ops"
milestone = "M3"
summary = "Offset is the shadow length, measured in font units along the extrusion direction."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"

[[behavior]]
id = "filter.extrude.angleConvention"
area = "path-ops"
milestone = "M3"
summary = "Angle is in degrees, counterclockwise, with 0 pointing horizontally to the right."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"

[[behavior]]
id = "filter.extrude.subtractsOriginalByDefault"
area = "path-ops"
milestone = "M3"
summary = "Unless Don't Subtract is on, the result is the swept shape minus the original outline; with it on, the original area stays part of the result."
ref = "Filters › Built-in Filters › Extrude"
status = "handbook"

# --- Hatch Outline ---

[[command]]
id = "filter.hatchOutline"
label = "Hatch Outline"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], originX?: number = 0, originY?: number = 0, stepWidth?: number = 20, angle?: number = 45, offsetPath?: bool = true, strokeWidth?: number = 5}"
area = "path-ops"
milestone = "M3"
summary = "Replaces the glyph shape with parallel hatch strokes clipped to it. Strokes start from an origin point, repeat every Step Width units at the given angle, and are either expanded to closed shapes of the Offset Path thickness or left as open centre lines when Offset Path is off."
ref = "Filters › Built-in Filters › Hatch Outline"
status = "handbook"
notes = "Documented, not yet observed. FontCraft geometry (ours): the hatched area is the filled area of the closed paths (nonzero rule). One line passes through the origin, the others repeat every stepWidth units (1 to 1000000). With offsetPath each line becomes a rectangle strokeWidth units thick (1 to 1000000) intersected with the outline, so the stroke ends follow the outline; without it each piece of line inside the outline becomes an open path of two nodes whose ends lie on the outline. At most 10000 lines per layer, else an error. Open paths, single-node paths and components stay; locked paths are not changed; new points are rounded to the grid."

[[panel]]
id = "dialog.filterHatchOutline"
label = "Hatch Outline"
location = "dialog"
controls = [
  "Origin X and Y fields",
  "Step Width field",
  "Angle field",
  "Offset Path checkbox with thickness field",
]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Hatch Outline filter. No default values are stated in the source."
ref = "Filters › Built-in Filters › Hatch Outline"
status = "handbook"
notes = "FontCraft first values (ours): origin (0, 0), step width 20, angle 45, Offset Path on with thickness 5 (the `default` of each parameter in filter.list)."

[[behavior]]
id = "filter.hatchOutline.origin"
area = "path-ops"
milestone = "M3"
summary = "Origin (X, Y) is the point the hatch pattern is anchored to; moving it shifts the phase of the stripes."
ref = "Filters › Built-in Filters › Hatch Outline"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: one hatch line passes through the origin (originX, originY)."

[[behavior]]
id = "filter.hatchOutline.stepWidth"
area = "path-ops"
milestone = "M3"
summary = "Step Width is the spacing between neighbouring hatch strokes."
ref = "Filters › Built-in Filters › Hatch Outline"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: stepWidth is measured at right angles to the lines, in units, from 1 to 1000000."

[[behavior]]
id = "filter.hatchOutline.angleConvention"
area = "path-ops"
milestone = "M3"
summary = "Hatch angle: 0 degrees gives horizontal strokes, 90 degrees vertical strokes."
ref = "Filters › Built-in Filters › Hatch Outline"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: degrees counter-clockwise from horizontal, from -360 to 360."

[[behavior]]
id = "filter.hatchOutline.openPathsWhenOffsetOff"
area = "path-ops"
milestone = "M3"
summary = "Offset Path sets the stroke thickness. Switching it off outputs the hatch lines as open paths, meant as input for further filters or plug-ins."
ref = "Filters › Built-in Filters › Hatch Outline"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: each piece of line inside the outline is an open path of two line nodes, drawn in the direction of the angle."

# --- Offset Curve ---

[[command]]
id = "filter.offsetCurve"
label = "Offset Curve"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], horizontal: number, vertical?: number = horizontal, makeStroke?: bool = false, autoStroke?: bool = false, position?: percent 0..100 = 50, keepCompatible?: bool = false, capStyle?: \"flat\"|\"square\"|\"round\"|\"roundInset\"|\"aligned\" = \"flat\"}"
area = "path-ops"
milestone = "M3"
summary = "Moves the outline outward (positive) or inward (negative) by separate horizontal and vertical distances, thickening or thinning stems. With Make Stroke it instead expands each path to both sides into a stroke outline, with a position split, optional vertical-dimension preservation (Auto Stroke) and a cap style for open paths. vertical defaults to horizontal (the locked state)."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed; the geometry is ours. A point whose path runs in unit direction t moves by (−t.y · horizontal, t.x · vertical) to the outward side, so vertical edges move by horizontal and horizontal edges by vertical. Corners stay sharp (a mitre, bevelled beyond 4 times the offset). Curves are offset as cubics within 0.25 units of the true offset, split where needed; the outline is then united with (positive) or reduced by (negative) the stroke of its own paths, so overlaps, loops and stems thinner than the offset resolve; distances of opposite signs run as two passes, horizontal first. Quadratic curves come out cubic. An open path without Make Stroke moves to the right of its direction, as the outward side of a counter-clockwise outer path does. Make Stroke uses the absolute distances. Vertical left out in the command or the export string is the horizontal distance (`filter.list` shows its default as null with `sameAs: \"horizontal\"`, and the dialog's field starts empty); the lock button is the dialog's. Export string: OffsetCurve; horizontal; vertical; makestroke; position, the position as a fraction 0–1 or `auto` for Auto Stroke; Keep Compatible and Cap Style have no place in it. Components and locked paths are not changed; new points are rounded to the grid."

[[panel]]
id = "dialog.filterOffsetCurve"
label = "Offset Curve"
location = "dialog"
controls = [
  "Horizontal field",
  "Vertical field",
  "lock button linking the two fields",
  "Make Stroke checkbox",
  "Auto Stroke checkbox",
  "Position percent field",
  "Keep Compatible checkbox",
  "Cap Style picker: flat, square, round, round inset, aligned to axes",
]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Offset Curve filter. Default values are not stated in the source."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "FontCraft first values (ours): horizontal 10, vertical empty (the horizontal value), Make Stroke off, Auto Stroke off, position 50 %, Keep Compatible off, cap style flat (the `default` of each parameter in filter.list). The lock button keeps vertical equal to horizontal while it is engaged."

[[behavior]]
id = "filter.offsetCurve.signConvention"
area = "path-ops"
milestone = "M3"
summary = "Positive Horizontal/Vertical values grow the outline, negative values shrink it; the two axes are offset independently."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: outward is away from the filled side, read from nesting as Correct Path Direction does, so a path drawn the wrong way grows the same way."

[[behavior]]
id = "filter.offsetCurve.lockUsesHorizontal"
area = "path-ops"
milestone = "M3"
summary = "With the lock button engaged the Horizontal value is applied to both axes and the Vertical field is ignored."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: the lock is the dialog's; in the command and the export string a vertical distance left out is the horizontal one, and the string written by FontCraft always holds both values."

[[behavior]]
id = "filter.offsetCurve.makeStroke"
area = "path-ops"
milestone = "M3"
summary = "Make Stroke offsets to both sides of the path and joins the two results into a stroke outline; this is the way to get an outlined (hollow) version of a closed shape. It is destructive, unlike stroke styles on paths."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: each side reaches horizontal and vertical units at position 50 (a stroke twice the distance wide), measured with the same pen as the offset; the two sides are joined with sharp outer corners and the overlaps of each path, then of all paths, removed. A closed path gives two paths: an outer one and a counter."

[[behavior]]
id = "filter.offsetCurve.autoStrokeKeepsVerticals"
area = "path-ops"
milestone = "M3"
summary = "Auto Stroke expands to both sides but keeps the shape's vertical dimensions unchanged; while it is on, Position is treated as 50 %."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed; the method is ours. Before stroking, the layer's paths are squeezed vertically about the middle of their bounds by the vertical distance at the top and at the bottom, so the stroke's horizontal edges and round extremes end at the original height."

[[behavior]]
id = "filter.offsetCurve.positionDistribution"
area = "path-ops"
milestone = "M3"
summary = "Position splits the stroke across the path: 0 % puts all of it on the left of the path direction, 100 % all on the right, 50 % half on each side."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: the left side reaches 2 · (1 − position) times the distances and the right side 2 · position times them."

[[behavior]]
id = "filter.offsetCurve.keepCompatible"
area = "path-ops"
milestone = "M3"
summary = "Keep Compatible forbids adding nodes or handles, so the result keeps the same point structure in every master; the price is a less accurate offset."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed; the method is ours. Each node moves to where the offset lines of its two segments meet (a mitre, shortened to 4 times the offset), each pair of handles is refitted to the new ends along the offset's directions, quadratic off-curve points move to where the offset legs of their control polygon meet; retracted handles stay retracted. No overlap is removed. In a stroke, caps add a fixed number of nodes, so masters stay compatible."

[[behavior]]
id = "filter.offsetCurve.capStyles"
area = "path-ops"
milestone = "M3"
summary = "Cap Style applies to the ends of open paths when making a stroke. Five choices: flat, square, round, round inset, and aligned to the horizontal/vertical axes."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed; the shapes are ours. Flat: a line across the end. Square: extends by half the stroke width. Round: a half ellipse beyond the end. Round inset: the stroke is shortened by half its width at each end, then capped round, so the cap ends at the path's end. Aligned: the end is cut along the vertical through the end node when the path ends closer to horizontal, else along the horizontal."

[[behavior]]
id = "filter.offsetCurve.nonDestructiveAlternative"
area = "path-ops"
milestone = "M3"
summary = "The same offsetting is available non-destructively as a stroke style on a path; the filter is the baked version."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"

# --- Roughen ---

[[command]]
id = "filter.roughen"
label = "Roughen"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], segmentLength: number, horizontal: number, vertical: number, angle?: number = 0, seed?: integer = 0}"
area = "path-ops"
milestone = "M3"
summary = "Flattens every outline into straight segments of about Segment Length and then displaces each resulting node by a random amount of at most Horizontal units in x and Vertical units in y. seed is our addition for reproducible headless runs; the reference does not mention one."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "Documented, not yet observed. FontCraft (ours): segmentLength is 1 to 1000000 units, horizontal and vertical 0 to 1000000 units; first values 50, 10 and 10. A segment of length L is cut into max(1, round(L / segmentLength)) equal pieces measured along the curve, so the result has line nodes only; a layer that would need more than the node limit is an error and changes nothing. The move of each node is uniform in [-horizontal, horizontal] by [-vertical, vertical], drawn in node order from a small deterministic generator (SplitMix64) seeded with seed (0 to 2^53, default 0), so one seed gives one result. The export string is Roughenizer; segmentlength; x; y; angle and has no slot for the seed. The fourth value angle is read as the turn of the move box in degrees counter-clockwise (-360 to 360, default 0, 0 keeps x and y); the handbook names the value without describing it. Moves that leave the coordinate range are an error. New and moved points are rounded to the grid; with horizontal and vertical both 0 only the new points are. Components and locked paths are not changed."

[[panel]]
id = "dialog.filterRoughen"
label = "Roughen"
location = "dialog"
controls = ["Segment Length field", "Horizontal field", "Vertical field", "Angle field"]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Roughen filter. No default values are stated in the source."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "FontCraft first values (ours): segment length 50, horizontal 10, vertical 10, angle 0 (the `default` of each parameter in filter.list). The Angle field is ours: the handbook's export string has an angle value but its dialog has no such field. The seed is a command parameter only and has no field."

[[behavior]]
id = "filter.roughen.segmentsThenJitter"
area = "path-ops"
milestone = "M3"
summary = "Roughen works in two steps: curves and lines are first cut into line segments of the chosen length, then all nodes (original and new) are moved randomly within the per-axis limits."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "Documented, not yet observed. FontCraft cuts each segment into equal pieces by length along the curve and moves the original nodes too; curves become polylines of line nodes."

[[behavior]]
id = "filter.roughen.maxOffsetPerAxis"
area = "path-ops"
milestone = "M3"
summary = "Horizontal and Vertical are upper bounds of the random displacement on each axis, not fixed distances."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "Documented, not yet observed. FontCraft draws each move uniformly from the box of plus or minus the bounds (turned by angle), so the bounds are reached but never exceeded."

# --- Round Corners ---

[[command]]
id = "filter.roundCorners"
label = "Round Corners"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], points?: [[shape, node]], segments?: [[shape, node]] (with one glyph), radius: number, visualCorrections?: bool = false}"
area = "path-ops"
milestone = "M3"
summary = "Replaces corner nodes with arcs of the given radius (font units). With a node selection it rounds exactly the selected corners; with none it rounds only convex (outward-pointing) corners of the layer."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "Documented, not yet observed. FontCraft geometry (ours): a rounded corner becomes two smooth nodes joined by a cubic close to a circular arc, each radius / tan(a / 2) units from a corner of inner angle a; a curved neighbour is split on its own curve. That distance is at most half of either neighbouring segment, so the radius shrinks where it does not fit, and a segment between two roundings that meet disappears. Smooth nodes, nearly straight nodes and corners next to quadratic segments stay. Components and locked paths are not changed; new points are rounded to the grid."

[[panel]]
id = "dialog.filterRoundCorners"
label = "Round Corners"
location = "dialog"
controls = ["Radius field", "Visual corrections checkbox"]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Round Corners filter. Defaults are not stated in the source."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "FontCraft first values (ours): radius 20, visual corrections off (the `default` of each parameter in filter.list)."

[[behavior]]
id = "filter.roundCorners.selectionRule"
area = "path-ops"
milestone = "M3"
summary = "Selected corners are rounded whatever their direction, so inward corners can be rounded by selecting them; with no selection only outward-pointing corners are rounded."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: selected corners are selected on-curve nodes and both end nodes of selected segments. Outward-pointing means the outline turns toward the filled side, which is read from nesting (as Correct Path Direction does), so a glyph drawn in the wrong direction gets the same corners. An open path has no filled side: with no selection all its corners are rounded."

[[behavior]]
id = "filter.roundCorners.visualCorrections"
area = "path-ops"
milestone = "M3"
summary = "Visual corrections varies the effective radius by corner angle: sharp (acute) corners get a smaller radius and blunt (obtuse) corners a larger one, so all corners look equally rounded."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "Documented, not yet observed; the formula is ours. The radius is multiplied by tan(a / 2) for a corner of inner angle a (1 at a right angle), limited to between a quarter and four times the radius, so every rounding starts `radius` units from its corner."

# --- Rounded Font ---

[[command]]
id = "filter.roundedFont"
label = "Rounded Font"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], stem?: units}"
area = "path-ops"
milestone = "M3"
summary = "Rounds the ends of stems into full round terminals and adds a fitting overshoot. Stem widths are taken from the master's vertical stem values in Font Info; the optional stem argument (known only from the export parameter syntax) overrides them. Dialog controls are not described in the source."
ref = "Filters › Built-in Filters › Rounded Font; Appendix › Custom Parameters › Filter"
status = "handbook"
notes = "Documented, not yet observed. FontCraft (ours): `stem` defaults to 0, which means the master's widest vertical stem; the export string writes the stem only when one is given (`RoundedFont;`). A stem ending is a straight segment between two outward corners whose neighbouring segments are straight and parallel (within 5°), at most the stem width plus 10% across, cut at most 20° off square. It becomes two quarter-circle cubics as wide as the ending. Endings are taken in path order; two endings never share a corner, and an ending whose sides are too short for its rounding stays. Open paths, counters, components and locked paths are not changed; new points are rounded to the grid."

[[behavior]]
id = "filter.roundedFont.usesVerticalStems"
area = "path-ops"
milestone = "M3"
summary = "Rounded Font reads the vertical stem metrics of the current master (Font Info › Masters › Stems) to recognise stem endings; with no stems defined its result is undefined in the source."
ref = "Filters › Built-in Filters › Rounded Font"
status = "handbook"
notes = "Documented, not yet observed. FontCraft (ours): the widest of the master's vertical stems sets the widest ending that is rounded; thinner endings, such as arms measured by horizontal stems, are rounded too. With no vertical stem and no `stem` parameter the command fails with a message naming the missing vertical stem and changes nothing."

[[behavior]]
id = "filter.roundedFont.overshoot"
area = "path-ops"
milestone = "M3"
summary = "Rounded terminals are pushed slightly past their original end so they keep their optical length (overshoot compensation)."
ref = "Filters › Built-in Filters › Rounded Font"
status = "handbook"
notes = "Documented, not yet observed; the amount is ours. The half circle covers the same area as the square end it replaces: for an ending of width w its centre sits w·π/8 inside the old end, so the tip stands w·(1 − π/4)/2 (about 0.107 w) past it."

# --- Transformations: Transform Metrics, Transformations, Interpolate with Background ---

[[behavior]]
id = "path.transformations.threeDialogs"
