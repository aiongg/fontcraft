milestone = "M7"
summary = "A filter string is the filter name followed by arguments, all separated by semicolons. Arguments are positional values or key: value pairs depending on the filter."
ref = "Appendix › Custom Parameters › Filter"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 2:34–2:47: the app writes Transformations;Slant:10;SlantCorrection:0;Origin:4; that is, the name, then Key:value arguments, with no spaces and a semicolon after every item. Not shown: positional arguments. M3.12 parses the string (engine `parse_filter_string`); the engine's export stage runs it at export (M7.10)."

