notes = "Documented, not yet observed. FontCraft (M13.4, M13.6): installed filter modules are listed in the Filter menu below a separator and are accepted by id or name in the Filter and PreFilter export parameters (see `filter.customParameter.thirdParty`); the menu and the export run a module on a layer through the same code, so they give the same outline."
