# --- Offset Curve ---

[[command]]
id = "filter.offsetCurve"
label = "Offset Curve"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], horizontal: number, vertical?: number = horizontal, makeStroke?: bool = false, autoStroke?: bool = false, position?: percent 0..100 = 50, keepCompatible?: bool = false, capStyle?: \"flat\"|\"square\"|\"round\"|\"roundInset\"|\"aligned\" = \"flat\"}"
area = "path-ops"
milestone = "M3"
summary = "Moves the outline outward (positive) or inward (negative) by separate horizontal and vertical distances, thickening or thinning stems. With Make Stroke it instead expands each path to both sides into a stroke outline, with a position split, optional vertical-dimension preservation (Auto Stroke) and a cap style for open paths. vertical defaults to horizontal (the locked state)."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. A point whose path runs in unit direction t moves by (−t.y · horizontal, t.x · vertical) to the outward side, so vertical edges move by horizontal and horizontal edges by vertical. Corners stay sharp (a mitre, bevelled beyond 4 times the offset). Curves are offset as cubics within 0.25 units of the true offset, split where needed; the outline is then united with (positive) or reduced by (negative) the stroke of its own paths, so overlaps, loops and stems thinner than the offset resolve; a curve that turns tighter than the offset is also stroked stretch by stretch, so no part of its stroke cancels another; distances of opposite signs run as two passes, horizontal first. Quadratic curves come out cubic. Make Stroke uses the absolute distances. Vertical left out in the command or the export string is the horizontal distance (`filter.list` shows its default as null with `sameAs: \"horizontal\"`, and the dialog's field starts empty); the lock button is the dialog's. Export string: OffsetCurve; horizontal; vertical; makestroke; position, the position as a fraction 0–1 or `auto` for Auto Stroke; Keep Compatible and Cap Style have no place in it. Components and locked paths are not changed; new points are rounded to the grid."
guesses = [
  "The offset construction is ours: corners stay sharp (mitred, bevelled beyond 4 times the offset), curves are offset as cubics within 0.25 units, and overlaps resolve by a union with the stroke of the paths.",
  "An open path without Make Stroke moves to the right of its direction, as the outward side of a counter-clockwise outer path does.",
]
observe = [
  "Offset Curve +20 on an O whose counter is tighter than 20 units at its ends, and on a wedge of 30°: is the corner mitred, how far does the mitre reach, and what becomes of the counter's ends?",
]

[[panel]]
id = "dialog.filterOffsetCurve"
label = "Offset Curve"
location = "dialog"
controls = [
  "Horizontal field",
  "Vertical field",
  "lock button linking the two fields",
  "Make Stroke checkbox",
  "Auto Stroke checkbox",
  "Position percent field",
  "Keep Compatible checkbox",
  "Cap Style picker: flat, square, round, round inset, aligned to axes",
]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Offset Curve filter. Default values are not stated in the source."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "The first values are the `default` of each parameter in filter.list. The lock button keeps vertical equal to horizontal while it is engaged. M3.33: the dialog opens with the values of its last OK in the session, the defaults the first time (crates/ui/src/dialogs/form.rs, DialogState::remember); test filter_dialogs_remember_their_last_ok_and_the_lock_ties_vertical_to_horizontal. The lock is a field of its own (`vertical.lock`, Same as Horizontal), closed when the dialog first opens: while closed, Vertical is greyed and holds the Horizontal value, which the run takes; the lock is no parameter of the command."
guesses = [
  "First values: horizontal 10, vertical empty (the horizontal value), Make Stroke off, Auto Stroke off, position 50 %, Keep Compatible off, cap style flat.",
  "The values of the last OK are kept for the session and not saved; Cancel keeps the earlier ones.",
  "The lock sits on a row of its own above Vertical, labelled Same as Horizontal, and starts closed.",
]
observe = [
  "Open Offset Curve, note whether the lock starts closed and Vertical greyed, then open the lock and note what Vertical shows.",
]

[[behavior]]
id = "filter.offsetCurve.signConvention"
area = "path-ops"
milestone = "M3"
summary = "Positive Horizontal/Vertical values grow the outline, negative values shrink it; the two axes are offset independently."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Outward is away from the filled side, read from nesting as Correct Path Direction does, so a path drawn the wrong way grows the same way.",
]

[[behavior]]
id = "filter.offsetCurve.lockUsesHorizontal"
area = "path-ops"
milestone = "M3"
summary = "With the lock button engaged the Horizontal value is applied to both axes and the Vertical field is ignored."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: the lock is the dialog's; in the command and the export string a vertical distance left out is the horizontal one, and the string written by FontCraft always holds both values. M3.33: the dialog's lock copies the Horizontal value into Vertical and greys it while closed; tested in filter_dialogs_remember_their_last_ok_and_the_lock_ties_vertical_to_horizontal."

[[behavior]]
id = "filter.offsetCurve.makeStroke"
area = "path-ops"
milestone = "M3"
summary = "Make Stroke offsets to both sides of the path and joins the two results into a stroke outline; this is the way to get an outlined (hollow) version of a closed shape. It is destructive, unlike stroke styles on paths."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: each side is measured with the same pen as the offset; the two sides are joined with sharp outer corners and the overlaps of each path, then of all paths, removed. A closed path gives two paths: an outer one and a counter."
guesses = [
  "Each side of a stroke reaches the full distances at position 50, so the stroke is twice the distance wide.",
]

[[behavior]]
id = "filter.offsetCurve.autoStrokeKeepsVerticals"
area = "path-ops"
milestone = "M3"
summary = "Auto Stroke expands to both sides but keeps the shape's vertical dimensions unchanged; while it is on, Position is treated as 50 %."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Auto Stroke first squeezes the paths vertically about the middle of their bounds by the vertical distance at top and bottom, so the stroke ends at the original height; the method is ours.",
]

[[behavior]]
id = "filter.offsetCurve.positionDistribution"
area = "path-ops"
milestone = "M3"
summary = "Position splits the stroke across the path: 0 % puts all of it on the left of the path direction, 100 % all on the right, 50 % half on each side."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The left side reaches 2 · (1 − position) times the distances and the right side 2 · position times them.",
]

[[behavior]]
id = "filter.offsetCurve.keepCompatible"
area = "path-ops"
milestone = "M3"
summary = "Keep Compatible forbids adding nodes or handles, so the result keeps the same point structure in every master; the price is a less accurate offset."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed. Mitres are shortened to 4 times the offset; quadratic off-curve points move to where the offset legs of their control polygon meet; retracted handles stay retracted. In a stroke, caps add a fixed number of nodes, so masters stay compatible."
guesses = [
  "Keep Compatible moves each node to where the offset lines of its two segments meet and refits each pair of handles along the offset's directions, removing no overlap; the method is ours.",
]
observe = [
  "Make Stroke with Keep Compatible on an open path whose stroke overlaps itself: are the overlapping parts merged or left as one contour with the path's node count?",
]

[[behavior]]
id = "filter.offsetCurve.capStyles"
area = "path-ops"
milestone = "M3"
summary = "Cap Style applies to the ends of open paths when making a stroke. Five choices: flat, square, round, round inset, and aligned to the horizontal/vertical axes."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The cap shapes are ours: flat cuts across the end, square extends by half the width, round is a half ellipse, round inset shortens the stroke by half its width before a round cap, and aligned cuts along the vertical or horizontal through the end node.",
]

[[behavior]]
id = "filter.offsetCurve.nonDestructiveAlternative"
area = "path-ops"
milestone = "M3"
summary = "The same offsetting is available non-destructively as a stroke style on a path; the filter is the baked version."
ref = "Filters › Built-in Filters › Offset Curve"
status = "handbook"

# --- Roughen ---

[[command]]
id = "filter.roughen"
label = "Roughen"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], segmentLength: number, horizontal: number, vertical: number, angle?: number = 0, seed?: integer = 0}"
area = "path-ops"
milestone = "M3"
summary = "Flattens every outline into straight segments of about Segment Length and then displaces each resulting node by a random amount of at most Horizontal units in x and Vertical units in y. seed is our addition for reproducible headless runs; the reference does not mention one."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "Documented, not yet observed. segmentLength is 1 to 1000000 units, horizontal and vertical 0 to 1000000 units. Segments are cut along the curve, so the result has line nodes only; a layer that would need more than the node limit is an error and changes nothing. The move of each node is uniform in [-horizontal, horizontal] by [-vertical, vertical], drawn in node order; seed runs from 0 to 2^53. The export string is Roughenizer; segmentlength; x; y; angle and has no slot for the seed. Moves that leave the coordinate range are an error. New and moved points are rounded to the grid; with horizontal and vertical both 0 only the new points are. Components and locked paths are not changed."
guesses = [
  "The fourth export value is read as the turn of the move box in degrees counter-clockwise (-360 to 360, default 0, 0 keeps x and y); the handbook names it without describing it.",
  "The moves come from a deterministic generator (SplitMix64) seeded with `seed` (default 0), so one seed gives one result; the export string has no slot for the seed.",
  "A segment of length L is cut into max(1, round(L / segmentLength)) equal pieces along the curve.",
]

[[panel]]
id = "dialog.filterRoughen"
label = "Roughen"
location = "dialog"
controls = ["Segment Length field", "Horizontal field", "Vertical field", "Angle field"]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Roughen filter. No default values are stated in the source."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "The first values are the `default` of each parameter in filter.list. The seed is a command parameter only and has no field. M3.33: the dialog opens with the values of its last OK in the session, the defaults the first time (crates/ui/src/dialogs/form.rs, DialogState::remember); test filter_dialogs_remember_their_last_ok_and_the_lock_ties_vertical_to_horizontal."
guesses = [
  "First values: segment length 50, horizontal 10, vertical 10, angle 0.",
  "The Angle field is ours: the handbook's export string has an angle value, but its dialog has no such field.",
  "The values of the last OK are kept for the session and not saved; Cancel keeps the earlier ones.",
]

[[behavior]]
id = "filter.roughen.segmentsThenJitter"
area = "path-ops"
milestone = "M3"
summary = "Roughen works in two steps: curves and lines are first cut into line segments of the chosen length, then all nodes (original and new) are moved randomly within the per-axis limits."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Each segment is cut into equal pieces by length along the curve and the original nodes move too, so curves become polylines of line nodes.",
]

[[behavior]]
id = "filter.roughen.maxOffsetPerAxis"
area = "path-ops"
milestone = "M3"
summary = "Horizontal and Vertical are upper bounds of the random displacement on each axis, not fixed distances."
ref = "Filters › Built-in Filters › Roughen"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Each move is drawn uniformly from the box of plus or minus the bounds, turned by the angle, so the bounds are reached but never exceeded (11-filters open questions).",
]

# --- Round Corners ---

[[command]]
id = "filter.roundCorners"
label = "Round Corners"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], points?: [[shape, node]], segments?: [[shape, node]] (with one glyph), radius: number, visualCorrections?: bool = false}"
area = "path-ops"
milestone = "M3"
summary = "Replaces corner nodes with arcs of the given radius (font units). With a node selection it rounds exactly the selected corners; with none it rounds only convex (outward-pointing) corners of the layer."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "Documented, not yet observed. A curved neighbour is split on its own curve. The radius shrinks where it does not fit, and a segment between two roundings that meet disappears. Smooth nodes and nearly straight nodes stay. Next to a quadratic spline the piece that touches the corner is the neighbouring segment, and the arc is a quadratic spline within 0.25 units of the cubic one. Components and locked paths are not changed; new points are rounded to the grid."
guesses = [
  "The rounding is ours: two smooth nodes joined by a cubic close to a circular arc, each radius / tan(a / 2) units from a corner of inner angle a, at most half of either neighbouring segment.",
]

[[panel]]
id = "dialog.filterRoundCorners"
label = "Round Corners"
location = "dialog"
controls = ["Radius field", "Visual corrections checkbox"]
area = "path-ops"
milestone = "M3"
summary = "Options dialog of the Round Corners filter. Defaults are not stated in the source."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "The first values are the `default` of each parameter in filter.list. M3.33: the dialog opens with the values of its last OK in the session, the defaults the first time (crates/ui/src/dialogs/form.rs, DialogState::remember); test filter_dialogs_remember_their_last_ok_and_the_lock_ties_vertical_to_horizontal."
guesses = [
  "First values: radius 20, visual corrections off.",
  "The values of the last OK are kept for the session and not saved; Cancel keeps the earlier ones.",
]
observe = [
  "Run Round Corners with a radius of 33, open it again and read the radius field; then quit, relaunch and open it once more.",
]

[[behavior]]
id = "filter.roundCorners.selectionRule"
area = "path-ops"
milestone = "M3"
summary = "Selected corners are rounded whatever their direction, so inward corners can be rounded by selecting them; with no selection only outward-pointing corners are rounded."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "Documented, not yet observed. Outward-pointing means the outline turns toward the filled side, read from nesting as Correct Path Direction does, so a glyph drawn in the wrong direction gets the same corners."
guesses = [
  "Selected corners are selected on-curve nodes and both end nodes of selected segments (11-filters open questions).",
  "An open path has no filled side, so with no selection all its corners are rounded.",
]

[[behavior]]
id = "filter.roundCorners.visualCorrections"
area = "path-ops"
milestone = "M3"
summary = "Visual corrections varies the effective radius by corner angle: sharp (acute) corners get a smaller radius and blunt (obtuse) corners a larger one, so all corners look equally rounded."
ref = "Filters › Built-in Filters › Round Corners"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Visual corrections multiply the radius by tan(a / 2) for a corner of inner angle a, limited to between a quarter and four times the radius; the formula is ours.",
]

# --- Rounded Font ---

[[command]]
id = "filter.roundedFont"
label = "Rounded Font"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer?: id | layers?: [ids], stem?: units}"
area = "path-ops"
milestone = "M3"
summary = "Rounds the ends of stems into full round terminals and adds a fitting overshoot. Stem widths are taken from the master's vertical stem values in Font Info; the optional stem argument (known only from the export parameter syntax) overrides them. Dialog controls are not described in the source."
ref = "Filters › Built-in Filters › Rounded Font; Appendix › Custom Parameters › Filter"
status = "handbook"
notes = "Documented, not yet observed. The export string writes the stem only when one is given (`RoundedFont;`). Endings are taken in path order; two endings never share a corner, and an ending whose sides are too short for its rounding stays. Open paths, counters, components and locked paths are not changed; new points are rounded to the grid."
guesses = [
  "`stem` 0 means the master's vertical stems, the one nearest each ending's width.",
  "A stem ending is a straight segment between two outward corners whose neighbours are straight and parallel within 5°, at most the stem width plus 10% across and at most 20° off square; it becomes two quarter-circle cubics.",
]

[[behavior]]
id = "filter.roundedFont.usesVerticalStems"
area = "path-ops"
milestone = "M3"
summary = "Rounded Font reads the vertical stem metrics of the current master (Font Info › Masters › Stems) to recognise stem endings; with no stems defined its result is undefined in the source."
ref = "Filters › Built-in Filters › Rounded Font"
status = "handbook"
notes = "Documented, not yet observed. Thinner endings, such as arms measured by horizontal stems, are rounded too; the failure message names the missing vertical stem and nothing changes."
guesses = [
  "An ending is measured against the vertical stem nearest its width (the wider of two equally near) and is rounded when it is at most a tenth wider; with no vertical stem and no `stem` the command fails (11-filters open questions).",
]

[[behavior]]
id = "filter.roundedFont.overshoot"
area = "path-ops"
milestone = "M3"
summary = "Rounded terminals are pushed slightly past their original end so they keep their optical length (overshoot compensation)."
ref = "Filters › Built-in Filters › Rounded Font"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The half circle covers the same area as the square end it replaces, so its tip stands w·(1 − π/4)/2 (about 0.107 w) past the old end; the amount is ours.",
]

# --- Transformations: Transform Metrics, Transformations, Interpolate with Background ---

[[behavior]]
