area = "spacing-kerning"
milestone = "M5"
summary = "With Width disabled the dialog sets sidebearings; the LSB and RSB checkboxes choose which of the two sides are written, so either side can be left alone."
ref = "Filters › Built-in Filters › Transformations › Transform Metrics"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
