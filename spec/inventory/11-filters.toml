# --- Filters as export-time custom parameters ---

[[behavior]]
id = "filter.customParameter.filter"
area = "path-ops"
milestone = "M7"
summary = "A Filter custom parameter on an instance (export) holds one filter string; at export the named filter runs on that instance's glyphs after composites have been decomposed."
ref = "Appendix › Custom Parameters › Filter"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 2:34–2:47 and 4:44–5:15: pasting in an instance's custom parameters adds a Filter entry holding the copied Transformations string, and the exported instance is slanted. Not shown: when it runs relative to decomposition. fontmake honours Filter on masters and instances with ufo2ft filter names only; fontc ignores it. FontCraft (M7.10): at export every composite of the target master is decomposed first, then each Filter string runs through `filter.apply`."
observe = [
  "In font C (m7-export), put Filter `Transformations;Slant:10` on an instance and export a TTF; read the exported TTF with ttx: note whether Aacute stays a composite and whether the slant reaches its outlines.",
]

[[behavior]]
id = "filter.customParameter.preFilter"
area = "path-ops"
milestone = "M7"
summary = "PreFilter takes the same strings as Filter but runs before decomposition, so components are still intact. It is honoured for static fonts only."
ref = "Appendix › Custom Parameters › PreFilter"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 0:54–1:30: PreFilter entries Decompose and RemoveOverlap are added to an instance. Their timing and the static-only limit are not shown. fontmake treats PreFilter as Filter; fontc ignores it. FontCraft (M7.10): PreFilter strings run on the target master's layers with components in place, before Scale to UPM and before decomposition; every export is static until M9."

[[behavior]]
id = "filter.customParameter.syntax"
