[[behavior]]
id = "kerning.compressRules"
area = "spacing-kerning"
milestone = "M5"
summary = "Compress replaces a glyph side of a pair by that glyph's kerning group when it has one, turning glyph–glyph and glyph–group pairs into group pairs. A pair that is a genuine exception (its value differs from the group pair it would collide with) is kept; an exception whose value equals the group value is redundant and is absorbed."
ref = "Spacing & Kerning › Kerning › Kerning Window › Maintaining Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed: Compress keeps an exception unless its value equals the group value. A pair is not compressed when a group pair with another value exists (developer's answer, thread \"Way to close all kerning locks?\", forum.glyphsapp.com/t/5706, 2017-07-21). Values of glyph pairs are copied to the group pair, so a group whose only kerned member is an exception takes that value (developer's answer, thread \"Kerning exceptions and Compress kerning issue\", forum.glyphsapp.com/t/15803, 2020-09-07, where a user saw the lowest value taken; thread \"Weird \\\"compress\\\" kerning behavior\", forum.glyphsapp.com/t/20458, 2021-10-20)."
guesses = [
  "Within one run the pairs are taken in stored order and each sees the lifts made before it, so when two pairs would lift to the same group pair the first is lifted and the second meets it (absorbed with an equal value, kept as an exception with another). Sources confirm that a pair is not lifted when a group pair with another value is there, and that a lone exception becomes the group pair (notes); which of two clashing pairs is taken first is not documented, and one user saw the lowest value win.",
  "A glyph–group pair is not lifted or absorbed while group–glyph pairs stored for members of its group would take over those glyphs once it is gone; a pair list with T–@n and @T–m in the reference app settles it.",
  "A later pair with the same sides as an earlier one (one group in two spellings, or two entries for one master) never applies, so it is removed together with the earlier pair when that one is lifted or absorbed; compressing such a pair list in the reference app settles it.",
]
observe = [
  "Store T–m -60 and T–ň -40 (m, n and ň in the group n; T in T), run Compress twice and read the pairs; repeat with the two stored in the other order.",
  "Store T–@n -60 and @T–m -30, run Compress and read the pairs.",
  "Write a source by hand with one group pair in two spellings and a glyph pair it covers, run Compress and read the file.",
]

