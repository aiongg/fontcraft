area = "spacing-kerning"
milestone = "M5"
summary = "The kerning shortcuts work with the Text tool, with the cursor between the two glyphs to be kerned, and only while the kerning mode is not 'no kerning'. They adjust the pair selected by the lock states; that a missing pair is created on the first keypress is assumed."
