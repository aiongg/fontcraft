# ───────────────────────────── Kerning groups ─────────────────────────────

[[behavior]]
id = "kerning.groupSemantics"
area = "spacing-kerning"
milestone = "M5"
summary = "A kerning pair may name a group on either side; it then applies to every glyph that belongs to that group on that side. Kerning A against V thus also kerns every glyph sharing A's right group against every glyph sharing V's left group, unless an exception exists for a specific combination."
ref = "Spacing & Kerning › Kerning › Kerning Groups"
status = "handbook"

[[behavior]]
id = "kerning.twoGroupsPerGlyph"
area = "spacing-kerning"
milestone = "M5"
summary = "Each glyph has at most two kerning groups, a left one and a right one, which are independent namespaces: a left group and a right group with the same name are unrelated. Membership belongs to the glyph, so all masters share it, and so do left-to-right and right-to-left kerning."
ref = "Spacing & Kerning › Kerning › Kerning Groups"
status = "handbook"
notes = "The file format stores the groups on the glyph (`kernLeft`, `kernRight`; GlyphsSDK file-format specification). Both oracles use the same groups for right-to-left pairs, with the side that faces the pair (`kerning.directionsStoredSeparately`)."

[[behavior]]
id = "kerning.verticalGroups"
area = "spacing-kerning"
milestone = "M5"
summary = "Glyphs set top to bottom use a top group and a bottom group in place of left and right. The chapter gives no further detail on vertical kerning (pair storage, shortcuts, feature output)."
ref = "Spacing & Kerning › Kerning › Kerning Groups"
status = "handbook"
notes = "Neither oracle exports vertical kerning: a test font with a `kerningVertical` pair compiles to a GPOS table with only `kern` in fontc 1.0.0 and fontmake 3.12.1. The reference exports vertical kerning: release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs3.4-3434.html) fix its export (version 3, build 3117) and its variation (builds 3119 and 3120). FontCraft writes one `vkrn` lookup of y advances, static and variable, skipping marks unless a pair names one (08 question 22); a `vkrn` feature in the code without an automatic-code marker, or a feature-writer setting that names its features, keeps it out, as `kern`. The prefixes: thread \"Importing vertical kerning from OTFs\" (forum.glyphsapp.com/t/35157, 2025-09-17, fixed in build 3430); the scripting API has topKerningKey and bottomKerningKey (version 3, docu.glyphsapp.com)."
guesses = [
  "The `vkrn` feature is in the default script, in every script and language with generated kerning, and in the code's language systems of the scripts of the vertically kerned glyphs when they hold another positioning feature; the rest read the default script's, with its `kern`.",
  "A vertical group side is written `@MMK_T_` with the upper glyph's bottom group and `@MMK_B_` with the lower glyph's top group, by analogy with the left-to-right prefixes. The two prefixes are confirmed by a user's report, where an import that listed `@MMK_B` first was a bug that was then fixed (notes); the order in a saved file is not documented.",
]
observe = [
  "Export a font with vertical kerning between kana and between Latin capitals and note the scripts and the lookups of its `vkrn` feature.",
  "In top-to-bottom text kern the bottom group of one glyph against the top group of another, save and read the pair in the file.",
]

[[behavior]]
id = "kerning.groupNameCharset"
area = "spacing-kerning"
milestone = "M5"
summary = "A kerning group name may contain only A–Z, a–z, 0–9, underscore, period and hyphen. Names are otherwise free; the convention is to use the name of a representative glyph (right group 'R' for R and its accented forms) but descriptive names such as 'stem' are equally valid."
ref = "Spacing & Kerning › Kerning › Kerning Groups"
status = "handbook"

[[behavior]]
id = "kerning.groupsEditedForManyGlyphs"
area = "spacing-kerning"
milestone = "M5"
summary = "Group names are typed into the Group fields of the Info box. Several glyphs get the same group in one step either through the Font View inspector with the glyphs selected, or by selecting several glyphs in Edit View."
ref = "Spacing & Kerning › Kerning › Kerning Groups"
status = "handbook"
notes = "Documented, not yet observed. `kerning.setLeftGroup` and its siblings take every selected glyph in `glyphs` and change them in one undo step; `spacing.getSharedMetrics` reports the group they share or that they differ (M5.22)."

[[command]]
id = "kerning.setLeftGroup"
label = "Set Left Kerning Group"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], group: string|null}'
