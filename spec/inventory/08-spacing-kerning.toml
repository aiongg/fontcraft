# Source: Glyphs 4 Handbook, chapter "Spacing & Kerning"
#         https://handbook.glyphsapp.com/ (single-page edition, chapter 8)
#         One row (kerning.pairLookupOrder) also cites the UFO 3 specification, kerning.plist
#         (refs/ufo-spec/versions/ufo3/kerning.plist.md).
# Date:   2026-10-07
# Rows are written in our own words.
# Not repeated here because other chapters document them in full: view.showMetrics (Cmd+Shift+M),
# view.showInfo (Cmd+Shift+I), edit.copy / edit.paste / edit.selectAll, the Text tool, the
# writing-direction switch, the Font View inspector, Appearance settings, smart filters, and the
# metrics import/export commands (file.importMetrics, file.exportMetrics in 07-import-export.toml).
# The chapter says nothing about automatic spacing, kerning value limits, or how the implicit
# kern feature is generated; no rows exist for those.

# ───────────────────────────── Spacing: display and Info box ─────────────────────────────

[[panel]]
id = "infoBox.spacing"
label = "Info box: metrics fields"
location = "inspector"
controls = [
  "left sidebearing field (number or metrics key), left of the metrics icon",
  "right sidebearing field (number or metrics key), right of the metrics icon",
  "width field (number or metrics key)",
  "vertical layout: T (top sidebearing) and B (bottom sidebearing) fields instead",
  "per-field update button, shown beside a metrics key whose value is out of date",
  "auto-aligned glyphs: fields read 'auto' with the derived value in parentheses",
]
area = "spacing-kerning"
milestone = "M5"
summary = "The part of the Edit View Info box (View › Show Info, Cmd+Shift+I) that shows and edits the sidebearings and width of the current glyph. Horizontal scripts, both left-to-right and right-to-left, show left and right sidebearings; top-to-bottom text shows top and bottom sidebearings."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.8a (`panels/info_box_metrics.rs`): each field shows the key that applies, else the number, from `spacing.getMetrics`, and typing runs the field's setter on the current glyph's active layer. The auto-aligned display waits for M6."
guesses = [
  "The glyph box hangs under the current glyph's descender, centred on its advance, separate from the selection box at the foot of the canvas; a screenshot of the reference app with a selection settles it.",
  "Emptying a field that holds a key stores the metric's current number, so the key goes and nothing moves; emptying such a field in the reference app settles it.",
  "A key that cannot be evaluated (a cycle, a division by zero, a result out of range) is drawn red like an out-of-sync key, without the update button; a cyclic key in the reference app settles it.",
  "A master that takes its metrics from another master shows that master's values read only, with a line naming it; a linked master in the reference app settles it.",
]

[[behavior]]
id = "spacing.metricsOverlayInTextMode"
area = "spacing-kerning"
milestone = "M5"
summary = "While View › Show Metrics (Cmd+Shift+M) is on and the Text tool is in use, every glyph in the Edit View line is labelled with its left sidebearing, right sidebearing and advance width."
ref = "Spacing & Kerning › Spacing"
status = "handbook"
notes = "Documented, not yet observed. Edit View labels every glyph on the canvas (`canvas/text.rs`); in vertical text the labels are the top and bottom sidebearings and the vertical width."
guesses = [
  "Under the descender, the left sidebearing sits at the glyph's left edge, the right one at its right edge and the width centred below them; in vertical text they run along the column's left edge; a screenshot of the reference app settles it.",
  "A label keeps to the part of the advance a negatively kerned neighbour does not cover, so neighbouring labels do not overlap; a tightly kerned pair in the reference app settles it.",
  "Glyphs less than 24 screen points wide get no labels; the reference app zoomed out settles it.",
  "A glyph whose advance on screen is too narrow for its two sidebearing labels side by side shows only its width label; the labels of a narrow glyph such as `i` at a small zoom in the reference app settle it.",
]

[[behavior]]
id = "spacing.currentGlyphFollowsCursor"
area = "spacing-kerning"
milestone = "M5"
summary = "In text mode the 'current glyph', which the Info box shows and the spacing and kerning shortcuts act on, is the glyph immediately after the text cursor."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "handbook"
notes = "Documented, not yet observed: in text mode the current glyph is the one after the cursor."

[[behavior]]
id = "spacing.infoBoxFollowsLayoutDirection"
area = "spacing-kerning"
milestone = "M5"
summary = "The Info box shows left/right sidebearings on either side of a central metrics icon for horizontal text in both directions, and top/bottom sidebearings labelled T and B for top-to-bottom text."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.8a: the tab's writing direction picks the layout; left-to-right and right-to-left text show LSB, RSB and width, top-to-bottom text T and B."

[[behavior]]
id = "spacing.infoBoxArrowSteps"
area = "spacing-kerning"
milestone = "M5"
summary = "With the caret in a numeric Info box field, Up raises and Down lowers the value by 1 unit; with Shift the step is 10 and with Cmd+Shift it is 100. What the keys do in a field holding a metrics key is not stated."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "handbook"
notes = "Documented, not yet observed: Up and Down raise and lower an Info box value, by 10 with Shift and by 100 with Cmd+Shift. The kern fields are Info box values and take the same steps; a user report on the reference forum (thread \"Glyphs 3 bug report: arrow keys in kerning\") describes the 1 and 10 steps in a kern field. Built in M5.8a for the metrics fields: each press commits at once."
guesses = [
  "Up and Down in a field that holds a metrics key leave the key unchanged; no source says what they do there, and pressing Up in such a field in the reference app settles it.",
]

[[command]]
id = "spacing.setLeftSidebearing"
label = "Set Left Sidebearing"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the left sidebearing of a glyph layer to a number, or stores a metrics key (a string such as 'l', '=h+8' or '==u') for it. A number changes the space left of the outline and, we assume, the advance width with it (as the spacing shortcuts do); a key is stored and evaluated. This is what typing into the Info box field does."
ref = "Spacing & Kerning › Spacing › Info Box; Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A numeric left sidebearing moves the outline, components, anchors, guides, annotations, placed image and background sideways and changes the width by the same amount, so the right sidebearing stays.",
  "A key is evaluated and applied as soon as it is stored.",
  "A glyph-level key is applied to the edited layer only; the glyph's other layers keep their numbers, out of sync, until Update Metrics runs.",
  "A key that cannot be evaluated (a missing glyph, division by zero, an empty referenced glyph, a result out of range) is refused and nothing is stored.",
  "A key typed with one `=` into a field that shows a layer key removes that layer key, so the new glyph-level key applies on that layer.",
  "The sidebearing setters skip a layer without an outline and report it, since such a layer has no sidebearings.",
]

[[command]]
id = "spacing.setRightSidebearing"
label = "Set Right Sidebearing"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the right sidebearing of a glyph layer to a number (changing the width) or stores a metrics key for it. This is what typing into the Info box field does."
ref = "Spacing & Kerning › Spacing › Info Box; Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A key is evaluated and applied as soon as it is stored.",
]

[[command]]
id = "spacing.setWidth"
label = "Set Width"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the advance width of a glyph layer to a number or stores a metrics key for it; the handbook names the width as the third metric a key can link. A numeric width change moves the right sidebearing; the left one stays."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A numeric width change is absorbed by the right sidebearing; the handbook does not say how it is split.",
  "A width key may be a glyph name, a constant or a calculation; `|` and `@` are refused in the width field.",
]

[[command]]
id = "spacing.setTopSidebearing"
label = "Set Top Sidebearing"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the top sidebearing (the T field of the vertical Info box). The chapter only says the field is shown for top-to-bottom text; editing it and its effect on the vertical origin and height are assumed by analogy with the horizontal fields."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "inferred"
guesses = [
  "Setting the top sidebearing moves the vertical origin and changes the vertical width by the same amount, so the bottom sidebearing stays, as the left sidebearing does horizontally.",
  "The top and bottom fields take the same key forms as the left and right ones, with `|` naming the opposite vertical sidebearing; `@` is refused there.",
]

[[command]]
id = "spacing.setBottomSidebearing"
label = "Set Bottom Sidebearing"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the bottom sidebearing (the B field of the vertical Info box). As with the top sidebearing, the chapter documents the display only; the editing behaviour is assumed."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "inferred"
guesses = [
  "Setting the bottom sidebearing changes the vertical width only.",
]

[[command]]
id = "spacing.getMetrics"
label = "Get Metrics"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer?: id}'
area = "spacing-kerning"
milestone = "M5"
summary = "Query, our addition for agents: returns the layer's sidebearings and width, the metrics key stored for each (with whether it is glyph-level or layer-local), the value each key currently evaluates to, and whether each is in sync."
ref = "Spacing & Kerning › Spacing › Info Box; Metrics Keys"
status = "inferred"

