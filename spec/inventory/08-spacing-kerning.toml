[[behavior]]
id = "kerning.pasteConflictChoice"
area = "spacing-kerning"
milestone = "M5"
summary = "If any pasted pair already exists in the target master a warning appears with two outcomes: Overwrite pastes all pairs and replaces the clashing ones, Keep Existing pastes only the pairs that do not clash."
ref = "Spacing & Kerning › Kerning › Kerning Window › Editing Kerning Pairs"
status = "handbook"

[[behavior]]
id = "kerning.obsoletePairs"
area = "spacing-kerning"
milestone = "M5"
summary = "Stored pairs are not removed automatically when a glyph is deleted or a group loses its last member; they stay as obsolete pairs until Clean Up is run."
ref = "Spacing & Kerning › Kerning › Kerning Window › Maintaining Kerning Pairs"
status = "handbook"
notes = "glyph.removeGlyph leaves every pair in place, as the handbook says. Documented, not yet observed."

[[behavior]]
id = "kerning.compressRules"
area = "spacing-kerning"
milestone = "M5"
summary = "Compress replaces a glyph side of a pair by that glyph's kerning group when it has one, turning glyph–glyph and glyph–group pairs into group pairs. A pair that is a genuine exception (its value differs from the group pair it would collide with) is kept; an exception whose value equals the group value is redundant and is absorbed."
ref = "Spacing & Kerning › Kerning › Kerning Window › Maintaining Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed: Compress keeps an exception unless its value equals the group value."
guesses = [
  "Within one run the pairs are taken in stored order and each sees the lifts made before it, so when two pairs would lift to the same group pair the first is lifted and the second meets it (absorbed with an equal value, kept as an exception with another); running Compress on such a pair list in the reference app settles it.",
  "A glyph–group pair is not lifted or absorbed while group–glyph pairs stored for members of its group would take over those glyphs once it is gone; a pair list with T–@n and @T–m in the reference app settles it.",
  "A later pair with the same sides as an earlier one (one group in two spellings, or two entries for one master) never applies, so it is removed together with the earlier pair when that one is lifted or absorbed; compressing such a pair list in the reference app settles it.",
]

[[behavior]]
id = "kerning.compressOneStepPerRun"
area = "spacing-kerning"
milestone = "M5"
summary = "A single Compress run may lift only one side of a pair: T–m (T in right group T, m in left group n) becomes @T–m after the first run and @T–@n after the second. The user repeats the command until the list stops changing."
ref = "Spacing & Kerning › Kerning › Kerning Window › Maintaining Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed: the handbook example lifts the left side first: T–m becomes @T–m, then @T–@n."
guesses = [
  "A run lifts the left side of every pair that can lift it, else its right side; one run on a pair list where both sides can lift, in the reference app, settles it.",
]

# ───────────────────────────── Kerning and feature code ─────────────────────────────

[[behavior]]
id = "kerning.implicitKernFeature"
area = "features"
milestone = "M5"
summary = "Kerning data is compiled into an OpenType kern feature that is generated implicitly at export: it is not listed in Font Info › Features and has no editable code there. The chapter gives no rules for how the lookups are built."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"
notes = "Moved from M8 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 3): M5.17 ports fontc's kern writer (fontbe/src/features/kern.rs) to write pair kerning to GPOS at export. A hand-written kern feature and `# Automatic Code` stay in M8."
guesses = [
  "The generated lookups follow fontc's kern writer (split by script and direction, glyph pairs before class pairs, values rounded half up); the handbook gives no rules, and the GPOS of a font the reference app exports from a test source settles it.",
]

[[behavior]]
id = "kerning.explicitKernFeature"
area = "features"
milestone = "M8"
summary = "The user may add a feature named kern in Font Info › Features to hold hand-written positioning rules, typically contextual kerning that looks at more than two glyphs (for example extra space after f when a space and then T, V, W or Y follow). How the hand-written code is combined with the implicit pair kerning is not stated."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"

[[behavior]]
id = "kerning.groupClassNames"
area = "features"
milestone = "M8"
summary = "Every kerning group is available in feature code as a glyph class named after the side of the pair it occupies: a glyph's left group G is @MMK_R_G (it is used when the glyph is the right member of a pair) and a right group G is @MMK_L_G (used when the glyph is the left member). So left group H gives @MMK_R_H and right group quote gives @MMK_L_quote."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"

[[behavior]]
id = "kerning.kernCodeTokens"
area = "features"
milestone = "M8"
summary = "Hand-written kerning code may use feature-code tokens, so adjustment values can be derived from a master's number values or from glyph sidebearings instead of being hard-coded."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"
