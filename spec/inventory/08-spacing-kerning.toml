[[behavior]]
id = "kerning.copyPasteBetweenMasters"
area = "spacing-kerning"
milestone = "M5"
summary = "Kerning is transferred between masters, and between font files, by selecting pairs in the Kerning window, copying, switching to the other master and pasting. This is also the route for kerning values that metrics import cannot take from a Glyphs file."
