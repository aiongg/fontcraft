[[behavior]]
id = "spacing.infoBoxArrowSteps"
area = "spacing-kerning"
milestone = "M5"
summary = "With the caret in a numeric Info box field, Up raises and Down lowers the value by 1 unit; with Shift the step is 10 and with Cmd+Shift it is 100. What the keys do in a field holding a metrics key is not stated."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "handbook"
notes = "Documented, not yet observed: Up and Down raise and lower an Info box value, by 10 with Shift and by 100 with Cmd+Shift. The kern fields are Info box values and take the same steps; a user report on the reference forum (thread \"Glyphs 3 bug report: arrow keys in kerning\") describes the 1 and 10 steps in a kern field. Built in M5.8a for the metrics fields: each press commits at once."
guesses = [
  "Up and Down in a field that holds a metrics key leave the key unchanged; no source says what they do there, and pressing Up in such a field in the reference app settles it.",
]
observe = [
  "Give n the LSB key =h, put the keyboard in the field and press Up: note the field's text and the sidebearing.",
]

[[command]]
id = "spacing.setLeftSidebearing"
label = "Set Left Sidebearing"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string, beam?: number}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the left sidebearing of a glyph layer to a number, or stores a metrics key (a string such as 'l', '=h+8' or '==u') for it. A number changes the space left of the outline and, we assume, the advance width with it (as the spacing shortcuts do); a key is stored and evaluated. This is what typing into the Info box field does."
ref = "Spacing & Kerning › Spacing › Info Box; Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed. Entering a glyph's name gives the field that glyph's value at once (tutorial \"Spacing\", glyphsapp.com/learn/spacing, updated 2022-01-16). FontLab's metrics expressions always measure at the bounding box, whatever the Metrics line shows (FontLab 8 What's new › Metrics & kerning), so a key has no meaning at the beam."
guesses = [
  "A numeric left sidebearing moves the outline, components, anchors, guides, annotations, placed image and background sideways and changes the width by the same amount, so the right sidebearing stays.",
  "A glyph-level key is applied to the edited layer only; the glyph's other layers keep their numbers, out of sync, until Update Metrics runs.",
  "A key that cannot be evaluated (a missing glyph, division by zero, an empty referenced glyph, a result out of range) is refused and nothing is stored.",
  "A key typed with one `=` into a field that shows a layer key removes that layer key, so the new glyph-level key applies on that layer.",
  "The sidebearing setters skip a layer without an outline and report it, since such a layer has no sidebearings.",
]
observe = [
  "Type 60 into the LSB of a glyph with paths, a component, an anchor, a local guide, an annotation, an image and a background, in a font with a locked guide: note what moves and what the width becomes.",
  "In a font with two masters enter =n in one master's LSB and read the number and the colour of the field in the other.",
  "Enter `=nosuch`, `=n/0` and a key to an empty glyph, and note what is stored and shown.",
  "On a layer with the local key ==n type =h into the same field and look at both masters.",
  "Type 50 into the LSB of an empty glyph and read LSB, RSB and width.",
]

