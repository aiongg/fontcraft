# Source: Glyphs 4 Handbook, chapter "Spacing & Kerning"
#         https://handbook.glyphsapp.com/ (single-page edition, chapter 8)
#         One row (kerning.pairLookupOrder) also cites the UFO 3 specification, kerning.plist
#         (refs/ufo-spec/versions/ufo3/kerning.plist.md).
# Date:   2026-10-07
# Rows are written in our own words.
# Not repeated here because other chapters document them in full: view.showMetrics (Cmd+Shift+M),
# view.showInfo (Cmd+Shift+I), edit.copy / edit.paste / edit.selectAll, the Text tool, the
# writing-direction switch, the Font View inspector, Appearance settings, smart filters, and the
# metrics import/export commands (file.importMetrics, file.exportMetrics in 07-import-export.toml).
# The chapter says nothing about automatic spacing, kerning value limits, or how the implicit
# kern feature is generated; no rows exist for those.

# ───────────────────────────── Spacing: display and Info box ─────────────────────────────

[[panel]]
id = "infoBox.spacing"
label = "Info box: metrics fields"
location = "inspector"
controls = [
  "left sidebearing field (number or metrics key), left of the metrics icon",
  "right sidebearing field (number or metrics key), right of the metrics icon",
  "width field (number or metrics key)",
  "vertical layout: T (top sidebearing) and B (bottom sidebearing) fields instead, with O (vertical origin) and H (vertical width)",
  "per-field update button, shown beside a metrics key whose value is out of date",
  "auto-aligned glyphs: fields read 'auto' with the derived value in parentheses",
]
area = "spacing-kerning"
milestone = "M5"
summary = "The part of the Edit View Info box (View › Show Info, Cmd+Shift+I) that shows and edits the sidebearings and width of the current glyph. Horizontal scripts, both left-to-right and right-to-left, show left and right sidebearings; top-to-bottom text shows top and bottom sidebearings."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.8a (`panels/info_box_metrics.rs`): each field shows the key that applies, else the number, from `spacing.getMetrics`, and typing runs the field's setter on the current glyph's active layer. On an automatically aligned layer `spacing.getMetrics` lists the derived fields (`derived`) for the panel to grey out. The handbook's vertical Info box has O and H besides T and B; M5.20 added their setters (`spacing.setVerticalOrigin`, `spacing.setVerticalWidth`) and their values and keys in `spacing.getMetrics` (`vertOrigin`, `vertWidth`); the old panel does not show them; the Info box of `crates/ui` (`panels/info_box.rs`) edits them in its vertical layout. With several glyphs selected (M5.22) a typed value goes to every glyph in `glyphs`, one undo step, and `spacing.getSharedMetrics` gives each field's shared value or marks it mixed. Emptying a field removes its key and the spacing stays: developers' answers recommend clearing the keys to keep the glyph as it is (threads \"Some metrics keys are out of sync after converting to Glyphs 3\", forum.glyphsapp.com/t/19855, 2021-08-08, and \"Clearing linked metrics\", forum.glyphsapp.com/t/6360, 2017-10-10). Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs4.0-4000.html and updates.glyphsapp.com/Glyphs3.4-3434.html): the Info box for several glyphs has placeholders (4.0, builds 3844 and 3866), and invalid keys have a filter of their own (version 3, build 3315)."
observe = [
  "Select H, O and D with different left sidebearings in text mode and read the Info box's left sidebearing field: empty, grey Multiple Values, or one of the values?",
  "Select a word in text mode and note where the Info box is drawn (under the current glyph or elsewhere) and where the box for a selection of nodes is drawn.",
  "Give n the LSB key =h and h the LSB key =n, then give another glyph =n/0: note how each field is drawn and whether an update button shows.",
  "In a master with Link Metrics With Master, look at the Info box's fields and try to type in one.",
]
guesses = [
  "With several glyphs selected, a field whose values differ is empty with the grey Multiple Values placeholder the handbook gives the Font View inspector. The reference has an Info box for several glyphs with placeholders in its fields (notes); their wording is not documented.",
  "The glyph box hangs under the current glyph's descender, centred on its advance, separate from the selection box at the foot of the canvas; a screenshot of the reference app with a selection settles it.",
  "A key that cannot be evaluated (a cycle, a division by zero, a result out of range) is drawn red like an out-of-sync key, without the update button; a cyclic key in the reference app settles it.",
  "A master that takes its metrics from another master shows that master's values read only, with a line naming it; a linked master in the reference app settles it.",
]

[[behavior]]
id = "spacing.metricsOverlayInTextMode"
area = "spacing-kerning"
milestone = "M5"
summary = "While View › Show Metrics (Cmd+Shift+M) is on and the Text tool is in use, every glyph in the Edit View line is labelled with its left sidebearing, right sidebearing and advance width."
ref = "Spacing & Kerning › Spacing"
status = "handbook"
notes = "Documented, not yet observed. Edit View labels every glyph on the canvas (`canvas/text.rs`); in vertical text the labels are the top and bottom sidebearings and the vertical width."
guesses = [
  "Under the descender, the left sidebearing sits at the glyph's left edge, the right one at its right edge and the width centred below them; in vertical text they run along the column's left edge; a screenshot of the reference app settles it.",
  "A label keeps to the part of the advance a negatively kerned neighbour does not cover, so neighbouring labels do not overlap; a tightly kerned pair in the reference app settles it.",
  "Glyphs less than 24 screen points wide get no labels; the reference app zoomed out settles it.",
  "A glyph whose advance on screen is too narrow for its two sidebearing labels side by side shows only its width label; the labels of a narrow glyph such as `i` at a small zoom in the reference app settle it.",
]
observe = [
  "With Show Metrics on in text mode, look at a word and at a top-to-bottom column: note where the three numbers of a glyph stand.",
  "Type AV with a kerning of -100 and look at the numbers of the two glyphs.",
  "Zoom out step by step and note the glyph width in points at which the numbers go.",
  "Type `il` at a small zoom and note which numbers of the narrow glyphs show.",
]

