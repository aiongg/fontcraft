# ───────────────────────────── Group exceptions and locks ─────────────────────────────

[[behavior]]
id = "kerning.exceptionOverridesGroup"
area = "spacing-kerning"
milestone = "M5"
summary = "A kerning exception is a stored pair in which at least one side is a single glyph that also belongs to a group; for that combination it replaces the value the group pair would give. All other members keep the group value."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Both oracles keep an exception whose value is 0: in a test font, T–oacute = 0 against T–@o = −60 compiles to 0 (fontc 1.0.0, fontmake 3.12.1)."

[[behavior]]
id = "kerning.lockStates"
area = "spacing-kerning"
milestone = "M5"
summary = "Each side of the pair at the cursor has a lock in the Info box. Closed (the normal state) means edits are stored against that glyph's group; open means edits are stored against the glyph itself. With T closed and ö open, editing the pair writes right-group-of-T against ö: an exception for ö that still applies to every member of T's right group."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Documented, not yet observed: with the cursor between the pair, opening a glyph's lock in the Info box makes that side an exception, and closing it removes the exception. The reference scripting API reads and sets whether the kerning to the previous or next glyph is an exception (GSLayer kerning methods, docu.glyphsapp.com), and the file format has no lock field, so the lock state follows from the stored pairs. A lock is open when the pair stored for that side names a glyph that has a group; nothing else stores the lock (developers' answers in the threads \"Way to close all kerning locks?\", forum.glyphsapp.com/t/5706, 2017-01-05, and \"Applying a kerning group without producing an exception automatically\", forum.glyphsapp.com/t/19672, 2021-07-21). Opening the first lock stores a pair with the value 0 (developer's answer, thread \"Zero Values (kerning)\", forum.glyphsapp.com/t/12067, 2019-07-05). Opening both locks leaves the pair of the first opened lock stored, so other pairs show an open lock (user report, forum.glyphsapp.com/t/36338, 2026-05-12). Giving a kerned glyph a group opens its lock, since its glyph pairs stay (t/19672)."
guesses = [
  "Opening a lock stores the exception at the value that applied, so the kerning does not change. The reference stores a pair when a lock is opened, and for an unkerned pair its value is 0 (notes); the value when a group pair applied is not documented.",
]
observe = [
  "Kern @T against @o by -60, put the cursor in To, open o's lock and read the kern field and the Kerning window; then open T's lock as well and read both again.",
]

[[behavior]]
id = "kerning.closingLockRemovesException"
area = "spacing-kerning"
milestone = "M5"
summary = "Closing an open lock removes the exception, so the glyph falls back to its group's kerning for that pair. The handbook does not say whether the exception pair is deleted at once or what happens to its value."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Documented, not yet observed: closing the lock removes the exception. An older answer on the reference forum, not the handbook, says that closing a lock applies the existing group value, so the number shown can change; deleting the exception pair gives that result. Closing a lock deletes the exception whatever its value (developer's answer, thread \"Way to close all kerning locks?\", forum.glyphsapp.com/t/5706, 2017-07-18)."
guesses = [
  "Closing a lock deletes the exception pair in the current master only; the all-masters variant exists only for deletion in the Kerning window. That the pair is deleted, whatever its value, is settled (notes); the master is not. Closing a lock in a font with two masters and reading the other master's pairs settles it.",
  "Closing one lock while both are open keeps the other lock open: the glyph–glyph pair is replaced by the closed side's group against the open side's glyph, at the value that applied, unless that pair is already stored. Closing one lock of such a pair in the running app settles it.",
  "Closing the left lock alone of a glyph–glyph pair is refused when the left glyph's pair with the right glyph's group exists, because that pair would apply before the group–glyph pair and the left lock would stay open. The owner chose the refusal over deleting that exception. Closing the left lock in that situation in the running app settles it.",
]
observe = [
  "In a font with two masters, kern A's group against V's group to -60, open the lock on A's side, type -20, close the lock again and read the kern field: back to -60, or still -20.",
  "After closing that lock, switch to the other master and look in the Kerning window for the exception pair of A with V's group.",
  "Open both locks of a pair, type -20, close one and read the kern field, the other lock and the Kerning window.",
  "Store @T–@o -60, T–@o -40 and T–o -20, put the cursor in To and close the left lock: note the locks, the value and the pairs left.",
]

