milestone = "M5"
summary = "Adds the kerning pairs on the clipboard to the current master, which may be a different master or a different font than the one they were copied from. In the UI this is Edit › Paste (Cmd+V) in the Kerning window. Pairs that already exist are handled according to the conflict choice."
ref = "Spacing & Kerning › Kerning › Kerning Window › Editing Kerning Pairs"
status = "handbook"
notes = "The engine has no clipboard: the pairs come as kerning-text (`text`) or as JSON (`pairs`). `ask`, the default, changes nothing when a pair conflicts and returns the conflicts, which is what the dialog shows; without conflicts it pastes at once. A linked master is refused. At most 500,000 pairs. Values are rounded half up to whole units and must be from −32,767 to 32,767, as for `kerning.setPair`; glyph names with control characters are refused."
guesses = [
  "A pasted group side keeps its name; a group the target font lacks is pasted as it is and reported.",
  "A glyph the target font lacks is pasted as it is and reported, like a missing group.",
  "A pasted pair that exists with the same value is not a conflict, so it does not bring up the question; pasting an unchanged selection back into its master settles it.",
  "When the pasted pairs name one pair twice, the later value counts.",
]

[[panel]]
id = "dialog.pasteKerningConflict"
label = "Paste Kerning: existing pairs"
location = "dialog"
controls = ["Overwrite: paste everything, replacing conflicting pairs", "Keep Existing: paste only pairs that do not exist yet"]
area = "spacing-kerning"
milestone = "M5"
summary = "Warning shown when pasted kerning pairs would replace pairs already present in the target master. A cancel option is likely but not mentioned."
ref = "Spacing & Kerning › Kerning › Kerning Window › Editing Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed. It opens after a paste the person starts (`kerning.pastePairs` with `onConflict: \"ask\"`) reports conflicts; Overwrite and Keep Existing run the paste again with that answer. Agents read the conflicts from the result instead."
guesses = [
  "The warning has a Cancel button besides Overwrite and Keep Existing.",
  "Overwrite is the default button that Return presses; the warning in the reference app settles it.",
  "The warning lists the conflicting pairs with the pasted and the current value; the handbook names no list, and a screenshot of the warning settles it.",
]

[[command]]
id = "kerning.deletePairs"
label = "Delete Kerning Pairs"
menu = []
shortcut = ""
kind = "engine"
params = '{pairs: [{left, right}], master?: id, allMasters?: bool, direction?: "ltr"|"rtl"|"vertical"}'
area = "spacing-kerning"
milestone = "M5"
summary = "Deletes the selected kerning pairs from the current master (the minus button at the bottom left of the Kerning window). With Option held, the same pairs are deleted from every master."
ref = "Spacing & Kerning › Kerning › Kerning Window › Editing Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A pair the master lacks (with all masters: that no master has) refuses the whole command; the reference can only delete listed rows, so the question does not arise there.",
  "A linked master is refused, as for the other kerning edits.",
]
[[command]]
id = "kerning.cleanUp"
label = "Clean Up"
menu = []
shortcut = ""
kind = "engine"
params = '{master?: id, direction?: "ltr"|"rtl"|"vertical"}'
area = "spacing-kerning"
milestone = "M5"
summary = "Actions-menu command: deletes every obsolete kerning pair, meaning pairs that name a glyph no longer in the font or a group that no glyph belongs to any more. Whether it covers all masters or only the current one is not stated."
ref = "Spacing & Kerning › Kerning › Kerning Window › Maintaining Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Clean Up acts on the given master and direction only, like the Kerning window list; running it on a font with two masters and reading the other master's pairs settles it.",
]

[[command]]
id = "kerning.compress"
label = "Compress"
menu = []
shortcut = ""
kind = "engine"
params = '{master?: id, direction?: "ltr"|"rtl"|"vertical", untilStable?: bool}'
area = "spacing-kerning"
milestone = "M5"
summary = "Actions-menu command: rewrites glyph–glyph and glyph–group pairs to use the kerning groups of the glyphs involved wherever possible, reducing the pair count. One run lifts one side per pair, so it may need repeating; untilStable (our addition) repeats until nothing changes."
ref = "Spacing & Kerning › Kerning › Kerning Window › Maintaining Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed: Compress turns glyph–glyph and glyph–group pairs into group kerning wherever possible and may need several runs."
guesses = [
  "Compress acts on the given master and direction only; running it on a font with two masters and reading the other master's pairs settles it.",
]

[[behavior]]
id = "kerning.windowListsCurrentDirection"
area = "spacing-kerning"
milestone = "M5"
summary = "The Kerning window lists only the pairs of the writing direction currently chosen in Edit View; switching direction switches the list. It shows the current master, and switching master (for example to paste) switches the list too."
ref = "Spacing & Kerning › Kerning › Kerning Window"
status = "handbook"

[[behavior]]
id = "kerning.windowSearchOptions"
area = "spacing-kerning"
milestone = "M5"
summary = "The search term filters the list to pairs that contain it; the options change the test to exact match, prefix, suffix or exclusion, restrict to group or non-group entries, restrict the search to the left or right side, and optionally keep only pairs involving glyphs selected in Font View. Reset restores the defaults."
ref = "Spacing & Kerning › Kerning › Kerning Window › Viewing Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The defaults are contains, every entry kind, both sides and not limited to the Font View selection; Reset returns to them. The options menu of a newly opened Kerning window settles them.",
  "A pair is listed when one of the searched sides matches the term, has the chosen entry kind and, with the selection option, is a selected glyph or a group one of them belongs to; a search on a running Kerning window with mixed pairs settles it.",
  "Does not contain keeps a pair only when no searched side contains the term; a search for a letter that occurs on one side of a pair settles it.",
  "The term is compared with the bare name of a group, and with its @ spelling when the term starts with @; searching for @ in the reference settles it.",
  "The search is case-sensitive, since glyph names are; searching for t in a font with T settles it.",
]

