[[command]]
id = "spacing.setWidth"
label = "Set Width"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the advance width of a glyph layer to a number or stores a metrics key for it; the handbook names the width as the third metric a key can link. A numeric width change moves the right sidebearing; the left one stays."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed. A width change moves only the right sidebearing (developer's answer in the thread \"Glyph Info box and changing width\", forum.glyphsapp.com/t/838, 2015-03-25; users' reports of 2023 and 2024 in \"How to change multiple width values\", forum.glyphsapp.com/t/26481). The 2015 answer adds that the field takes no plain arithmetic."
guesses = [
  "A width key may be a glyph name, a constant or a calculation; `|` and `@` are refused in the width field.",
]
observe = [
  "Enter `=|n`, `=n@200` and `==n` in the width field and note which are accepted.",
]

[[command]]
id = "spacing.setTopSidebearing"
label = "Set Top Sidebearing"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the top sidebearing (the T field of the vertical Info box). The chapter only says the field is shown for top-to-bottom text; editing it and its effect on the vertical origin and height are assumed by analogy with the horizontal fields."
ref = "Spacing & Kerning › Spacing › Info Box"
status = "inferred"
notes = "The scripting API has settable TSB and BSB and, since 3.4, topMetricsKey and bottomMetricsKey (docu.glyphsapp.com)."
guesses = [
  "Setting the top sidebearing moves the vertical origin and changes the vertical width by the same amount, so the bottom sidebearing stays, as the left sidebearing does horizontally.",
  "The top and bottom fields take the same key forms as the left and right ones, with `|` naming the opposite vertical sidebearing; `@` is refused there.",
]
observe = [
  "In top-to-bottom text type 50 into the T field and read B, O and H.",
  "Enter `=n`, `=|n`, `=n+10` and `=n@200` in the T field and note which are accepted.",
]

[[command]]
id = "spacing.setBottomSidebearing"
