[[behavior]]
id = "kerning.infoBoxFieldEditing"
area = "spacing-kerning"
milestone = "M5"
summary = "A value typed into a kern field is applied when Return is pressed or the field loses focus. Emptying the field deletes the kerning between the two glyphs (rather than storing zero). An unset pair shows the grey placeholder 'Kern'."
ref = "Spacing & Kerning › Kerning › Info Box"
status = "handbook"
notes = "Documented, not yet observed: a value typed into a kern field is confirmed with Return or by leaving the field, and clearing the field removes the pair. Up and Down step the value as in every numeric Info box field (spacing.infoBoxArrowSteps)."
guesses = [
  "A typed 0 is stored as a pair with value 0, which overrides a group value; both oracles keep such a pair (a 0 exception against a −60 group pair compiles to 0). Typing 0 in the reference app and reading the Kerning window settles it.",
  "A typed value with a fraction is rounded to a whole unit; values read from files keep their fractions. Typing a fraction in the reference app settles it.",
  "Emptying the field removes the stored pair that applies, which can be a group pair that other glyph pairs share; emptying a kern field kerned through groups in the running app and reading the Kerning window settles it.",
  "Up and Down in an empty field step from zero and create the pair; pressing Up in a field showing the placeholder in the running app settles it.",
]

[[command]]
id = "kerning.setPair"
label = "Set Kerning Pair"
menu = []
shortcut = ""
kind = "engine"
params = '{left: name|"@group", right: name|"@group", value: number, master?: id, direction?: "ltr"|"rtl"|"vertical"}'
area = "spacing-kerning"
milestone = "M5"
summary = "Stores a kerning value for a pair in one master and one writing direction. Each side is a glyph name or a group written with a leading '@'. In the UI the sides are derived from the two glyphs at the cursor and their locks: a closed lock substitutes the glyph's group, an open lock keeps the glyph itself."
ref = "Spacing & Kerning › Kerning › Info Box; Kerning Window › Editing Kerning Pairs"
status = "handbook"
notes = "Documented, not yet observed: a kern field and the Kerning window store a value for a pair in the current master and writing direction. The value is rounded and kept as a zero pair as kerning.infoBoxFieldEditing says; a pair already stored keeps its spelling (`@MMK_…` or the UFO's), a new one is written with the prefix of its position."
guesses = [
  "A group side must be the group some glyph has on the side that faces the pair, and a glyph side a glyph of the font, so a typo is refused rather than stored as a pair that never applies; storing a pair for an unknown group in the running app's Kerning window settles it.",
  "Values beyond ±32,767 are refused, the range a compiled pair value holds; typing a larger value in a kern field settles what the reference does.",
]

[[command]]
id = "kerning.removePair"
label = "Remove Kerning Pair"
menu = []
shortcut = ""
kind = "engine"
params = '{left: name|"@group", right: name|"@group", master?: id, direction?: "ltr"|"rtl"|"vertical"}'
area = "spacing-kerning"
milestone = "M5"
summary = "Deletes one stored kerning pair from a master; this is what clearing a kern field in the Info box does."
ref = "Spacing & Kerning › Kerning › Info Box"
status = "handbook"
notes = "Documented, not yet observed: clearing a kern field removes the pair. The pair is found in whatever spelling it is stored in, and a side may name a glyph the font no longer has, so obsolete pairs can be removed one by one."
guesses = [
  "Removing a pair the master does not store is refused with a message rather than ignored; clearing an empty kern field in the running app shows nothing either way, so only the scripting API's behaviour would settle it.",
]

[[command]]
