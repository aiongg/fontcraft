]
observe = [
  "Store T–m with both glyphs in groups, run Compress once and read the pair: @T–m or T–@n.",
]

# ───────────────────────────── Kerning and feature code ─────────────────────────────

[[behavior]]
id = "kerning.implicitKernFeature"
area = "features"
milestone = "M5"
summary = "Kerning data is compiled into an OpenType kern feature that is generated implicitly at export: it is not listed in Font Info › Features and has no editable code there. The chapter gives no rules for how the lookups are built."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"
notes = "Moved from M8 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 3): M5.17 ports fontc's kern writer (fontbe/src/features/kern.rs) to write pair kerning to GPOS at export. A hand-written kern feature and `# Automatic Code` stay in M8. Built in M5.17: export writes each master's kerning to GPOS unless the source has a hand-written kern feature or a top-level include (`crates/features`); code the editor writes itself does not stop it, and the features of the code are named in a warning, not compiled, until M8. Vertical kerning is not written. Documented, not yet observed. Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs3.4-3434.html): the parameter Keep Kerning in one Lookup (version 3, build 3169) keeps the kerning together, so without it the reference uses several lookups; a 0 between two groups is left out at export (developer's answer, forum.glyphsapp.com/t/12067, 2019-08-27)."
guesses = [
  "The generated lookups follow fontc's kern writer (split by script and direction, glyph pairs before class pairs, values rounded half up); the handbook gives no rules, and the GPOS of a font the reference app exports from a test source settles it.",
  "Until feature code is compiled (M8), a top-level include in enabled feature code leaves the generated kerning out with a warning naming the file, because the file may hold a kern feature; following the include would settle it, and an export from the reference app of a source whose included file has no kern feature shows what it writes.",
]
observe = [
  "Export a font with Latin and Hebrew pairs, group pairs and exceptions and dump its GPOS: compare the lookups with ours.",
  "Add an include of a file without a kern feature to the features and export: note whether the kerning is written.",
]

[[behavior]]
id = "kerning.explicitKernFeature"
area = "features"
milestone = "M8"
summary = "The user may add a feature named kern in Font Info › Features to hold hand-written positioning rules, typically contextual kerning that looks at more than two glyphs (for example extra space after f when a space and then T, V, W or Y follow). How the hand-written code is combined with the implicit pair kerning is not stated."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"
notes = "Documented, not yet observed. A hand-written `kern` feature without a `# Automatic Code` line gets one at its end, as glyphsLib and fontc add it, so the generated kerning follows the hand-written rules."

[[behavior]]
id = "kerning.groupClassNames"
area = "features"
milestone = "M8"
summary = "Every kerning group is available in feature code as a glyph class named after the side of the pair it occupies: a glyph's left group G is @MMK_R_G (it is used when the glyph is the right member of a pair) and a right group G is @MMK_L_G (used when the glyph is the left member). So left group H gives @MMK_R_H and right group quote gives @MMK_L_quote."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"
notes = "Documented, not yet observed. Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs3.4-3434.html): kerning classes are written before any feature at export (version 3, build 3053), and groups can be used as classes in the feature editor (build 3051)."
guesses = [
  "Only the `@MMK_L_`/`@MMK_R_` classes the code refers to and no class entry defines are written, before the first entry, with the glyphs the target exports in font order, and a group without such glyphs stays undefined so the compiler names the reference. The place, before every feature, is settled (note); the expanded code of a reference export settles the rest.",
]
observe = [
  "Refer to `@MMK_L_T` in a feature and look at the complete feature code of an export: which MMK classes are in it, with which glyphs, and what happens for a group without exporting glyphs.",
]

[[behavior]]
id = "kerning.kernCodeTokens"
area = "features"
milestone = "M8"
summary = "Hand-written kerning code may use feature-code tokens, so adjustment values can be derived from a master's number values or from glyph sidebearings instead of being hard-coded."
ref = "Spacing & Kerning › Kerning › Manual Kerning Code"
status = "handbook"
notes = "Documented, not yet observed."
