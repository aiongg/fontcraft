[[command]]
id = "spacing.setVerticalOrigin"
label = "Set Vertical Origin"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the vertical origin of a glyph layer (the O field of the vertical Info box and of the Font View inspector) to a number or stores a metrics key for it. The origin is stored as `vertOrigin`, measured down from the master's ascender; the vertical width stays, so the top and bottom sidebearings change in opposite directions."
ref = "Edit View › Info Box › Vertical Layout; Font View › Glyph Properties › Metrics"
status = "inferred"
notes = "The handbook documents the O field in the vertical Info box and the inspector; editing it is assumed by analogy with the other fields. Built in M5.20 (`cmd/vertical_metrics.rs`, sharing the setter of `cmd/spacing.rs`); the key is stored in `vertOrigin` metrics keys, glyph-level or, with `==`, on the layer. One undo step. A developer's answer says the vertical origin defaults to the ascender and can be changed for glyphs shared with horizontal text (thread \"Ideas about a better vertical mode of the Edit view\", forum.glyphsapp.com/t/14230, 2020-03-29); the scripting API resets vertOrigin to its default with None (docu.glyphsapp.com); the Info box also shows a negative origin (version 3 release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs3.4-3434.html), build 3308)."
guesses = [
  "Setting the vertical origin keeps the vertical width, so the whole vertical box moves; a glyph with a vertical origin typed into the reference Info box settles it.",
  "The vertical origin field takes the width's key forms (a glyph name, a constant, a calculation, `==` for the layer); `|` and `@` are refused.",
  "A layer with no stored vertical origin reads 0, which stands for the ascender, the reference's default place (notes); the number its field shows is not documented.",
]
observe = [
  "In top-to-bottom text, type 50 into the O field of a glyph and read T, B and H: which of them change?",
  "Enter `=n`, `=|n` and `=n@200` in the O field and note which are accepted.",
  "Read the O field of a glyph that never had a vertical origin, with the ascender at 800.",
]

[[command]]
id = "spacing.setVerticalWidth"
label = "Set Vertical Width"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id, value: number|string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Sets the vertical width (the H field of the vertical Info box and of the Font View inspector) of a glyph layer to a number or stores a metrics key for it; the handbook lists `vertWidthMetricsKey` among the stored metrics keys. The vertical origin stays, so the bottom sidebearing takes the change."
ref = "Edit View › Info Box › Vertical Layout; Font View › Glyph Properties › Metrics"
status = "inferred"
notes = "The handbook documents the H field and the `vertWidthMetricsKey` attribute; editing the field is assumed by analogy with the width. Built in M5.20 (`cmd/vertical_metrics.rs`). Update Metrics and the out-of-sync scan cover the key; a layer with no stored vertical width reads the master's ascender minus its descender. One undo step."
guesses = [
  "A numeric vertical width change is absorbed by the bottom sidebearing, as the width's is by the right one.",
  "A vertical width key may be a glyph name, a constant or a calculation; `|` and `@` are refused, as in the width field.",
]
observe = [
  "Give a glyph the vertical width key =n+100 in the H field, then change n's vertical width: does the field show the key as out of sync, and does Update Metrics set it?",
  "Type 1200 into the H field and read T, B and O.",
  "Enter `=|n` and `=n@200` in the H field and note which are accepted.",
]

[[command]]
id = "spacing.getMetrics"
label = "Get Metrics"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer?: id}'
area = "spacing-kerning"
milestone = "M5"
summary = "Query, our addition for agents: returns the layer's sidebearings and width, the metrics key stored for each (with whether it is glyph-level or layer-local), the value each key currently evaluates to, and whether each is in sync."
ref = "Spacing & Kerning › Spacing › Info Box; Metrics Keys"
status = "inferred"
own = true

[[command]]
id = "spacing.getSharedMetrics"
label = "Get Shared Metrics"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs: [names], layer?: id}'
area = "spacing-kerning"
milestone = "M5"
summary = "Query, our addition for the Info box and the Font View inspector with several glyphs selected: for each metric field and each kerning group field, the value all the glyphs share, or that the values differ."
ref = "Spacing & Kerning › Spacing › Info Box; Kerning › Kerning Groups; Font View › Glyph Properties"
status = "inferred"
own = true
notes = "Built in M5.22 (`cmd/spacing_shared.rs`). A metric field shows the metrics key the glyphs share, else, with no key on any glyph, the measured value they share to two decimals; anything else is mixed. Group fields compare every glyph, metric fields only the glyphs that have the layer."
guesses = [
  "A metric field whose glyphs share a key shows the key even when their measured values differ; several glyphs with one key, one of them out of sync, in the reference app settle it.",
]
observe = [
  "Select two glyphs with the LSB key =n, one of them out of sync, and read the field: the key, a number or a placeholder.",
]

[[command]]
id = "spacing.getDerivedMetrics"
label = "Get Derived Metrics"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer?: id}'
area = "spacing-kerning"
milestone = "M6"
summary = "Query, our addition for agents and the Info box: whether automatic alignment sets the layer's width and side sidebearings, the values it derives from the base components with the offset keys added, and the offset keys as a field shows them."
ref = "Spacing & Kerning › Spacing › Metrics Keys & Automatic Alignment"
status = "inferred"
notes = "Built in M6.15 (`cmd/spacing.rs`) on `fontcraft_components::metrics::derived_metrics`; the Info box reads it to show `auto (value)`."
