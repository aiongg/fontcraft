[[behavior]]
id = "kerning.pairLookupOrder"
area = "spacing-kerning"
milestone = "M5"
summary = "Effective kerning for two glyphs is taken from the most specific stored pair: glyph–glyph, then glyph–group (left glyph, right group), then group–glyph, then group–group, else zero. The handbook only states that exceptions override group kerning; the full four-step order, including the tie between the two mixed forms, is taken from the UFO 3 kerning.plist rules and must be checked against the reference app."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions; UFO 3 spec › kerning.plist › Exceptions"
status = "docs"
notes = "Both oracles compile this order. In a test font with A–@V = −30 and @A–V = −40, the pair A V gets −30 (glyph–group wins) in fontc 1.0.0 and fontmake 3.12.1; Aacute V gets −40 and Aacute W the group–group −50. fontc resolves pairs in the same order (`fontbe/src/features/kern.rs`, `lookup_kerning_value`, after fontTools `ufoLib/kerning.py`). What the reference Edit View shows is documented only as far as exceptions overriding groups."
guesses = [
  "When two stored pairs name the same sides in different spellings (the reference's group prefix and the UFO's), the first in stored order applies; a source with both, opened in the reference app, settles it.",
]
observe = [
  "Write a source by hand with the pair A–V stored twice, once as `@MMK_L_A` and once as `public.kern1.A`, and open it: note the value shown for AV.",
]

