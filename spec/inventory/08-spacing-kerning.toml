# ───────────────────────────── Group exceptions and locks ─────────────────────────────

[[behavior]]
id = "kerning.exceptionOverridesGroup"
area = "spacing-kerning"
milestone = "M5"
summary = "A kerning exception is a stored pair in which at least one side is a single glyph that also belongs to a group; for that combination it replaces the value the group pair would give. All other members keep the group value."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Both oracles keep an exception whose value is 0: in a test font, T–oacute = 0 against T–@o = −60 compiles to 0 (fontc 1.0.0, fontmake 3.12.1)."

[[behavior]]
id = "kerning.lockStates"
area = "spacing-kerning"
milestone = "M5"
summary = "Each side of the pair at the cursor has a lock in the Info box. Closed (the normal state) means edits are stored against that glyph's group; open means edits are stored against the glyph itself. With T closed and ö open, editing the pair writes right-group-of-T against ö: an exception for ö that still applies to every member of T's right group."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Documented, not yet observed: with the cursor between the pair, opening a glyph's lock in the Info box makes that side an exception, and closing it removes the exception. The reference scripting API reads and sets whether the kerning to the previous or next glyph is an exception (GSLayer kerning methods, docu.glyphsapp.com), and the file format has no lock field, so the lock state follows from the stored pairs."
guesses = [
  "A lock is open when the pair that applies names that glyph itself on that side while the glyph has a group there; opening a lock stores such a pair at the value that applied, so the kerning does not change. The kern field and the Kerning window right after a lock is opened, in the running app or a video, settle it.",
]

[[behavior]]
id = "kerning.closingLockRemovesException"
area = "spacing-kerning"
milestone = "M5"
summary = "Closing an open lock removes the exception, so the glyph falls back to its group's kerning for that pair. The handbook does not say whether the exception pair is deleted at once or what happens to its value."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Documented, not yet observed: closing the lock removes the exception. An older answer on the reference forum, not the handbook, says that closing a lock applies the existing group value, so the number shown can change; deleting the exception pair gives that result."
guesses = [
  "Closing a lock deletes the exception pair in the current master only; the all-masters variant exists only for deletion in the Kerning window. Closing a lock in a font with two masters and reading the other master's pairs settles it.",
  "Closing one lock while both are open keeps the other lock open: the glyph–glyph pair is replaced by the closed side's group against the open side's glyph, at the value that applied, unless that pair is already stored. Closing one lock of such a pair in the running app settles it.",
  "Closing the left lock alone of a glyph–glyph pair is refused when the left glyph's pair with the right glyph's group exists, because that pair would apply before the group–glyph pair and the left lock would stay open. Closing the left lock in that situation in the running app settles it.",
]

[[command]]
id = "kerning.addException"
label = "Open Kerning Lock"
menu = []
shortcut = ""
kind = "engine"
params = '{left: name, right: name, side: "left"|"right"|"both", value?: number, master?: id, direction?: "ltr"|"rtl"|"vertical"}'
area = "spacing-kerning"
milestone = "M5"
summary = "Marks one or both glyphs of a pair as an exception to their group (opening the lock in the Info box), so that kerning set for the pair is stored against the glyph instead of the group. Whether opening the lock alone already creates a stored pair (seeded with the group value) or only the next edit does is not stated."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Documented, not yet observed: opening a glyph's lock makes that side of the pair an exception. Whether a pair is stored at once is open (guess on kerning.lockStates)."

[[command]]
id = "kerning.removeException"
label = "Close Kerning Lock"
menu = []
shortcut = ""
kind = "engine"
params = '{left: name, right: name, side: "left"|"right"|"both", master?: id, direction?: "ltr"|"rtl"|"vertical"}'
area = "spacing-kerning"
milestone = "M5"
summary = "Closes the lock on one or both sides of a pair, removing the glyph-specific exception so the group kerning applies again."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions"
status = "handbook"
notes = "Documented, not yet observed: closing the lock removes the exception, and the group's kerning applies again (kerning.closingLockRemovesException)."

[[behavior]]
id = "kerning.pairLookupOrder"
area = "spacing-kerning"
milestone = "M5"
summary = "Effective kerning for two glyphs is taken from the most specific stored pair: glyph–glyph, then glyph–group (left glyph, right group), then group–glyph, then group–group, else zero. The handbook only states that exceptions override group kerning; the full four-step order, including the tie between the two mixed forms, is taken from the UFO 3 kerning.plist rules and must be checked against the reference app."
ref = "Spacing & Kerning › Kerning › Kerning Group Exceptions; UFO 3 spec › kerning.plist › Exceptions"
status = "docs"
notes = "Both oracles compile this order. In a test font with A–@V = −30 and @A–V = −40, the pair A V gets −30 (glyph–group wins) in fontc 1.0.0 and fontmake 3.12.1; Aacute V gets −40 and Aacute W the group–group −50. fontc resolves pairs in the same order (`fontbe/src/features/kern.rs`, `lookup_kerning_value`, after fontTools `ufoLib/kerning.py`). What the reference Edit View shows is documented only as far as exceptions overriding groups."
guesses = [
  "When two stored pairs name the same sides in different spellings (the reference's group prefix and the UFO's), the first in stored order applies; a source with both, opened in the reference app, settles it.",
]

