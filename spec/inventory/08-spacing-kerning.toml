status = "handbook"
notes = "Documented, not yet observed. The commands take `glyphs` and `layer`; in text mode the shell fills them with the current glyph and the layer its text item shows. Outside text mode the keys run nothing; in locked kerning mode the key changes nothing and the status line says why. In top-to-bottom text the shell adds `vertical: true` and the keys are Up and Down (M5.53)."
guesses = [
  "A spacing shortcut on a metric that holds a metrics key changes the number and keeps the key, which then shows as out of sync; no source says whether the reference keeps the key, removes it or ignores the keypress.",
]
observe = [
  "Give n the LSB key =h and press Ctrl+Left in text mode: note the number, and whether the key is kept, removed or out of sync.",
]

[[behavior]]
id = "spacing.shortcutModifierScheme"
area = "spacing-kerning"
milestone = "M5"
summary = "Modifier scheme for the arrow-key spacing shortcuts: Ctrl addresses the left sidebearing, Cmd the right one, Ctrl and Cmd together shift the outline within the width, and Shift multiplies the 1-unit step to 10. Left/Right arrows give the direction in which the addressed edge moves."
ref = "Spacing & Kerning › Spacing › Spacing Shortcuts"
status = "handbook"
notes = "Documented, not yet observed. In top-to-bottom text the commands take `vertical: true` (M5.20): the left-side shortcuts set the top sidebearing, the right-side ones the bottom sidebearing, and a shift moves the outline up (Left) or down (Right) by changing the vertical origin, so the outline's coordinates and the horizontal metrics stay. In top-to-bottom text Up is pressed for Left and Down for Right (M5.53)."
guesses = [
  "In top-to-bottom text the keys are the arrows along the column, Up where horizontal text has Left and Down where it has Right, so the arrow still shows which way the edge moves; Left and Right with Ctrl do nothing. Trying the keys in top-to-bottom text settles it.",
  "In right-to-left text the shortcuts address the visual left and right sidebearings, as in left-to-right text. No source says.",
  "In top-to-bottom text the spacing shortcuts act on the top and bottom sidebearings: Ctrl on the top one, Cmd on the bottom one, both together shift the outline vertically. No source says; trying the shortcuts in top-to-bottom text settles it.",
]
observe = [
  "In top-to-bottom text with the Text tool, press Ctrl+Left, Cmd+Right and Cmd+Ctrl+Right (and the Up/Down arrows with the same modifiers) on a glyph and read T, B, O and H after each: what changes?",
  "In a right-to-left tab press Ctrl+Left and Cmd+Right on alef-hb: note which sidebearing changes and in which direction.",
]

[[behavior]]
id = "spacing.shiftKeepsWidth"
area = "spacing-kerning"
milestone = "M5"
summary = "Shifting the outline changes both sidebearings by equal and opposite amounts and never changes the advance width, which is why it is the spacing tool for monospaced designs."
ref = "Spacing & Kerning › Spacing › Spacing Shortcuts"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "spacing.ctrlArrowSystemConflict"
area = "ui-chrome"
milestone = "M14"
summary = "On macOS, Ctrl+Left and Ctrl+Right are taken by the system's Mission Control shortcuts by default, so the left-sidebearing shortcuts do not reach the application until the user changes those system shortcuts. The UI should say so; other platforms need their own conflict check."
ref = "Spacing & Kerning › Spacing › Spacing Shortcuts"
status = "handbook"

# ───────────────────────────── Metrics keys ─────────────────────────────

[[behavior]]
id = "metricsKey.linkByGlyphName"
area = "spacing-kerning"
milestone = "M5"
summary = "Typing a glyph name instead of a number into the LSB, RSB or width field stores a metrics key: the field then takes the value of the same metric of the named glyph (LSB from its LSB, RSB from its RSB, width from its width)."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Without a leading `=` the whole text is one glyph name: on the reference forum, its developers explain that `n-20` names a glyph and `=n-20` subtracts 20 (thread \"Build 1015 metrics keys\", 2017)."

[[behavior]]
id = "metricsKey.notSyncedAutomatically"
area = "spacing-kerning"
milestone = "M5"
summary = "A linked metric is not recalculated when the glyph it refers to changes. The stored number stays as it is until an update command runs, and the key is flagged as out of sync in the meantime."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed: metrics keys are not synced automatically."
guesses = [
  "A key whose chain of references returns to its own glyph, or runs deeper than 32 steps, is an error: the metric keeps its number and the key is reported. A forum answer by the reference developers shows the reference does not stop such cycles (thread \"Possible bug with spacing formula\"). Watching the reference app with such a key settles what it shows.",
  "Division by zero, and a result outside 0 to 65,535 units for a width or −32,768 to 32,767 for a sidebearing, are errors reported the same way; watching the reference app with such a key settles what it shows.",
]
observe = [
  "Give n the LSB key =h and h =n, run Update Metrics three times and read both numbers; note any message.",
  "Enter =n/0 and =n*100000 as a sidebearing and as a width: note what each field stores and shows.",
]

[[behavior]]
id = "metricsKey.outOfSyncInEditView"
area = "spacing-kerning"
milestone = "M5"
summary = "In Edit View a metrics key whose evaluated value differs from the layer's actual metric is drawn in red with an update button next to it; pressing the button brings that one metric in line."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed: an out-of-sync key is shown in red with an update button. Built in M5.8a: the Info box draws the key red, and its update button runs `spacing.updateMetricsKey` for that field."

[[behavior]]
id = "metricsKey.outOfSyncInFontView"
area = "font-view"
milestone = "M5"
summary = "In Font View a glyph with any out-of-sync metrics key has its cell marked with a warning triangle at the top right. Such glyphs can be collected with a smart filter."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed. Drawn by fontView.cell.badgeMetricsOutOfSync; the triangle follows edits to the glyphs a key reads."

[[command]]
id = "spacing.updateMetricsKey"
label = "Update Metrics Key"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer?: id, field: "left"|"right"|"width"|"top"|"bottom"}'
area = "spacing-kerning"
milestone = "M5"
summary = "The update button beside one out-of-sync metrics key: re-evaluates that key and applies the result to that metric of the layer only. The button label is ours (icon-only in the reference)."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed: the update button beside an out-of-sync key."
guesses = [
  "A metric whose value rounded half up already equals its key's value is left as it is, so the command makes no change there; watching the button on a fractional metric in the reference app would settle it.",
]
observe = [
  "Give a glyph an LSB of 10.4 and a key whose value is 10: note whether the field is red and what the button does.",
]

[[command]]
id = "glyph.updateMetrics"
label = "Update Metrics"
menu = ["Glyph"]
shortcut = "Cmd+Ctrl+M"
kind = "engine"
params = '{glyphs?: [names], layer?: id}'
area = "spacing-kerning"
milestone = "M5"
summary = "Re-evaluates every metrics key on the current layer of the current glyph, or of all selected glyphs, and applies the results, clearing all out-of-sync flags there."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed: Glyph › Update Metrics (Cmd+Ctrl+M) brings the keys of the current layer in line. Keys of empty glyphs are not applied (4.0 release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs4.0-4000.html and updates.glyphsapp.com/Glyphs3.4-3434.html), build 3812; version 3, build 3235), which agrees with ours. Fired in the edit view it gets the shown layer, in a text selection each item's layer, in Font View the current master's layer of the selected glyphs (M5.50)."
guesses = [
  "Keys are evaluated in dependency order (the metrics a key reads, and the left sidebearings of the glyphs a composite's components show, come first), so a glyph whose reference or base was updated in the same run gets the new value; one Update Metrics on a two-step chain and on a composite of a keyed base in the reference app settles it.",
  "A key that cannot be evaluated (unlinked, in error, or on an empty layer) is skipped and the other keys are still updated; running it on a font with one unlinked key in the reference app would settle it.",
]
observe = [
  "Give h the LSB =n and m the LSB =h, change n, select m and h and run Update Metrics once: read both. Do the same with a composite of h.",
  "In a selection with one key to a missing glyph run Update Metrics and note whether the other keys are updated.",
]

[[command]]
id = "glyph.updateMetricsForAllMasters"
label = "Update Metrics for All Masters"
menu = ["Glyph"]
shortcut = "Cmd+Ctrl+Alt+M"
kind = "engine"
params = '{glyphs?: [names]}'
area = "spacing-kerning"
milestone = "M5"
summary = "The Option-key variant of Update Metrics: re-evaluates the metrics keys of the current or selected glyphs on every master instead of only the current one."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "handbook"
notes = "Documented, not yet observed: Option added to Update Metrics acts on all masters."
guesses = [
  "Besides the master layers it updates the layers with attributes (intermediate, alternate, colour, smart), the layers the out-of-sync scan lists, and leaves out masters that take their metrics from another master; a brace layer with an out-of-sync key in the reference app would settle it.",
]
observe = [
  "Run it on a glyph with a brace layer, an alternate layer and a backup layer, all out of sync, in a font with a linked master: note which layers changed.",
]

[[command]]
id = "spacing.evaluateMetricsKey"
label = "Evaluate Metrics Key"
menu = []
shortcut = ""
kind = "engine"
params = '{key: string, glyph: name, layer?: id, field: "left"|"right"|"width"|"top"|"bottom"}'
area = "spacing-kerning"
milestone = "M5"
summary = "Query, our addition for agents and tests: parses a metrics key in the context of a glyph, layer and field and returns the rounded value it yields or a parse/lookup error, without changing the document."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "inferred"
own = true

[[command]]
id = "spacing.listOutOfSyncMetrics"
label = "List Out-of-Sync Metrics"
menu = []
shortcut = ""
kind = "engine"
params = '{glyphs?: [names], masters?: [ids]}'
area = "spacing-kerning"
milestone = "M5"
summary = "Query, our addition: lists glyph, layer and field for each metrics key whose evaluated value differs from the stored metric. Headless counterpart of the red markers and the Font View warning triangles."
ref = "Spacing & Kerning › Spacing › Metrics Keys"
status = "inferred"
own = true
notes = "In a master with an italic angle, sidebearings are measured along lines at that angle through half the x-height (the handbook says the italic angle feeds the sidebearing calculation, `fontInfo.metrics.italicAngleUses`). With that rule, of the corpus keys on master layers 17,217 values equal the stored metric; 1,994 differ on glyphs aligned automatically (M6); 15 differ in files that are out of sync (Andika Mini 4 `W`, the format document's sample, Oswald `ae`); 12 differ by at most 1.4 units in Inter Italic, cause not settled; 48 are unlinked and 4 read empty glyphs in fontc's test data. Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs4.0-4000.html and updates.glyphsapp.com/Glyphs3.4-3434.html): Extra Sync Metrics Threshold for Linked Masters (4.0, build 3822), and a slightly larger threshold when a layer has a width and a sidebearing key (build 3855). Empty glyphs give no warning (version 3, build 3201)."
guesses = [
  "A key is out of sync when its value differs from the layer's metric rounded half up. The reference allows a difference up to a threshold, a little larger on a layer with both a width and a sidebearing key, and a parameter sets an extra one for linked masters (notes); the numbers are not documented, so FontCraft keeps its exact test (08 question 23).",
  "Master layers and layers with attributes (intermediate, alternate, colour, smart) are scanned; backup layers and the layers of a master that takes its metrics from another master are not.",
]
observe = [
  "Give n the LSB 50 and other glyphs =n with sidebearings 50.4, 51, 52 and 53: note which fields are red.",
  "Look at which of a glyph's layers, brace, alternate and backup, show a red key.",
]

[[behavior]]
id = "metricsKey.calculationSyntax"
area = "spacing-kerning"
milestone = "M5"
summary = "A calculated key is an equals sign, a glyph name, one arithmetic operator and a number, in that order: '=h+8', '=hyphen/2'. Only this single-operation form is documented; chained operations and parentheses are not."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Metrics Key Calculations"
status = "handbook"
notes = "Files saved by the reference combine `|` with an operator (`=|quoteleft*0.5`, 3 keys in the corpus), so that form is valid. Corpus keys by form (4,413 keys in 18 sources): bare name 2,929; `=` and a signed number 616; `=|name` 405; `=` and a number 203; `=name` with an operation 153; `=name` 104; `=|name` with an operation 3; none with `@`. Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs4.0-4000.html and updates.glyphsapp.com/Glyphs3.4-3434.html): a metrics key can name a master (4.0, build 3815; no page gives the syntax), and longer keys are allowed (version 3, build 3244)."
guesses = [
  "Spaces around the parts of a key are ignored.",
  "A key holds at most one operation; a second operator or a parenthesis makes it invalid, and it is reported, not evaluated. Every source shows one operation; none rules out more. From version 4 a key can also name a master (notes), a form FontCraft does not read yet (08 question 20).",
  "`@` and its height come last, after the operation (`=H+8@200`).",
]
observe = [
  "Enter `= n + 10` as a sidebearing: note whether it is accepted and how the field shows it.",
  "Enter `=n+10-5` and `=(n+10)/2`: note which are accepted and their values.",
  "Enter `=n+10@200` and `=n@200+10`: note which are accepted and their values.",
  "Enter `=n+10`, then a key that names another master of the font (for example n with the master's name added): note the form the field accepts.",
]

[[behavior]]
id = "metricsKey.operators"
area = "spacing-kerning"
milestone = "M5"
summary = "The four operators are + (add), - (subtract), * (multiply) and / (divide), applied to the referenced glyph's metric on the left and the literal number on the right."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Metrics Key Calculations"
status = "handbook"

[[behavior]]
id = "metricsKey.decimalOperands"
area = "spacing-kerning"
milestone = "M5"
summary = "The number in a calculation may have a decimal fraction ('=o*1.2', '=koKai-thai/1.5'). Note that glyph names can themselves contain a hyphen, so the parser must not read the hyphen in 'ka-deva' as a minus sign."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Metrics Key Calculations"
status = "handbook"
guesses = [
  "The glyph name is the longest leading part of the key that names a glyph in the font; what follows must be nothing, an operation, or `@` and a number. So `=ka-deva/1.4` reads ka-deva even when a glyph `ka` exists.",
  "When no leading part names a glyph, the key is unlinked and names the shortest leading part after which the rest is valid: `=xa-deva-5` names `xa-deva`.",
]
observe = [
  "In a font with ka and ka-deva enter `=ka-deva/1.4`, then `=ka-10` in a font with ka-10-like names absent: note the values.",
  "Enter `=xa-deva-5` in a font without xa-deva and note which name is shown as unlinked.",
]

[[behavior]]
id = "metricsKey.resultRounded"
area = "spacing-kerning"
milestone = "M5"
summary = "Before a calculated metrics key takes effect, its result is rounded to a whole number of font units. Tie-breaking for exact halves is not stated."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Metrics Key Calculations"
status = "handbook"
guesses = [
  "Exact halves round up (toward positive infinity), as both oracles round kerning values: fontc 1.0.0 and fontmake 3.12.1 write −10.5 as −10 and 10.5 as 11.",
]
observe = [
  "Give n the sidebearing 21 and enter =n/2 and, with -21, =n/2 in another glyph: note the two results.",
]

[[behavior]]
id = "metricsKey.constant"
area = "spacing-kerning"
milestone = "M5"
summary = "'=' followed by just a number ('=64') pins the metric to that constant. Unlike a plain numeric entry, the key is remembered, so the value can be restored by an update after outline edits have changed the sidebearing."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Constant Metrics Keys"
status = "handbook"
guesses = [
  "On a glyph that is not aligned automatically, `=-30` and `=+30` are constants; reports on the reference forum treat `=-30` as a key that should work (thread \"Build 1015 metrics keys\"). On a glyph aligned automatically the form is the offset of `metricsKey.autoAlignedOffset`, evaluated from M6.",
]
observe = [
  "Enter `=-30` and `=+30` in the LSB of a glyph that is not aligned automatically: note the numbers and whether the keys stay.",
]

[[behavior]]
id = "metricsKey.bareNameEqualsReference"
area = "spacing-kerning"
milestone = "M5"
summary = "'=' followed by only a glyph name ('=n') means exactly the same as the bare glyph name ('n')."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Constant Metrics Keys"
status = "handbook"

[[behavior]]
id = "metricsKey.mirrored"
area = "spacing-kerning"
milestone = "M5"
summary = "A pipe character straight after the equals sign makes the key read the opposite sidebearing of the referenced glyph: '=|n' in a right sidebearing field takes n's left sidebearing, and in a left field it takes n's right sidebearing."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Mirrored Metrics Keys"
status = "handbook"

[[behavior]]
id = "metricsKey.selfMirrorCentres"
area = "spacing-kerning"
milestone = "M5"
summary = "'=|' with no glyph name refers to this glyph's own sidebearing on the other side, making the two sidebearings equal and so keeping the outline centred in its advance width."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Mirrored Metrics Keys"
status = "handbook"

[[behavior]]
id = "metricsKey.glyphLevelByDefault"
area = "spacing-kerning"
milestone = "M5"
summary = "A metrics key entered with a single '=' (or as a bare name) belongs to the glyph and applies on every master; each master layer evaluates it against the referenced glyph's layer of the same master."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Local Metrics Keys"
status = "handbook"
notes = "The file format stores glyph-level keys on the glyph (`metricLeft`, `metricRight`, `metricWidth`) and local keys on the layer (GlyphsSDK file-format specification, versions 3 and 4). On a brace layer the key reads the referenced glyph's interpolated value at that place, not its master's layer: a user reports the master's value as wrong and a developer fixes it (thread \"Brace trick, metrics keys sync with master layer\", forum.glyphsapp.com/t/16722, 2020-11-29, version 3); version 3 release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs3.4-3434.html), builds 3191 and 3192, keep working on keys on brace layers."
guesses = [
  "A layer that is not a master layer (intermediate, alternate, backup) reads the referenced glyph's layer with the same layer id, else the layer of its own master. On a brace layer the reference reads the interpolated value instead (notes; 08 question 21); no source covers alternate and backup layers.",
]
observe = [
  "Give M a brace layer and the LSB key =H, H having none, in a font with two masters: run Update Metrics on the brace layer and compare with H interpolated there.",
  "Do the same on an alternate and on a backup layer: note which layer of H is read.",
]

[[behavior]]
id = "metricsKey.localPrefix"
area = "spacing-kerning"
milestone = "M5"
summary = "A key starting with two equals signs ('==u', '==endash+12') is local: it is stored on the layer it was typed on, affects only that master, and serves as an exception to the glyph-level key the other masters keep using."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Local Metrics Keys"
status = "handbook"
notes = "In the file a local key is the layer key, written without `==` (Inter Roman has 448 layers with keys, such as `metricLeft = n;` on a layer of `l.ss02`); `==` is how the field shows and takes it. A local key can be an exception (handbook, Spacing › Local Metrics Keys, version 4), so on its layer it wins over the glyph-level key."
guesses = [
  "A plain number typed into a field removes the key the field showed: a local key from the layer, a glyph-level key from the glyph.",
]
observe = [
  "In a font with two masters, give n the key =o in its left sidebearing field, type the plain number 40 into that field and look at the field and at the other master: is the key gone on both masters, gone on this master only, or kept?",
]

[[behavior]]
id = "metricsKey.baselineOffset"
area = "spacing-kerning"
milestone = "M5"
summary = "A key may end with '@' and a number to take the referenced sidebearing at one height instead of from the bounding box: '=H@0' measures H's sidebearing along the baseline and '=H@150' along a horizontal line 150 units above it."
ref = "Spacing & Kerning › Spacing › Metrics Keys › Metrics Keys at Baseline Offsets"
status = "handbook"
guesses = [
  "When the line at the given height does not cross the outline, the key uses the bounding-box sidebearing; no source says.",
  "In a master with an italic angle, the crossing at the given height is moved along the italic angle to half the x-height, where the bounding-box sidebearings are measured; no source says.",
]
observe = [
  "Enter `=A@5000` in a sidebearing and note the value.",
  "In a master with an italic angle of 12° give two glyphs `=H@0` and `=H@600` and compare with H's own left sidebearing.",
]

[[behavior]]
id = "metricsKey.autoAlignedDisplay"
area = "spacing-kerning"
milestone = "M6"
summary = "For a glyph under automatic alignment the metric fields are not editable numbers: they show the word 'auto' followed by the value derived from the components in parentheses."
ref = "Spacing & Kerning › Spacing › Metrics Keys & Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed. Built in M6.15 (`panels/info_box_metrics.rs`): the left, right and width fields of a layer aligned automatically read `spacing.getDerivedMetrics` and show `auto (value)`, the value derived from the base components."
guesses = [
  "A sidebearing that holds an offset key shows the key followed by the derived value in parentheses (`=+18 (68)`) instead of the word auto; an aligned glyph with an offset in the reference app settles it.",
  "Emptying an aligned field that holds an offset removes the offset; the reference app with an offset deleted from the field settles it.",
]
observe = [
  "Give an aligned composite such as Aacute the left sidebearing =+20 and read the field: does it show auto, the key, or both, and is the value in parentheses the one with the offset?",
  "Delete the text of an aligned field that holds =+20 and press Return: note the field and the width.",
]

[[behavior]]
id = "metricsKey.autoAlignedOffset"
area = "spacing-kerning"
milestone = "M6"
summary = "An automatically aligned metric can be adjusted without giving up alignment by entering '=' plus a signed number ('=+18', '=-12'): the amount is added to or taken from the derived value. Typical use is a composite whose mark sticks out of the glyph box (idieresis, dcaron, lcaron)."
ref = "Spacing & Kerning › Spacing › Metrics Keys & Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed. Built in M6.15: alignment adds the offsets (`fontcraft_components::metrics`); the spacing setters store them and refuse every other value on an aligned layer (`cmd/spacing.rs`); evaluation, the out-of-sync scan and Update Metrics leave the left, right and width keys of aligned layers alone (`crates/spacing/src/aligned.rs`). The 1,994 key values on master layers of corpus sources that differ from the stored metric because the glyph is aligned automatically (M5 plan § 5) are the measure for this row. An offset adds to or takes from the sides; ordinary keys on an aligned glyph stay stored without effect and come back, out of sync and not applied, when alignment ends (developer's answers in the thread \"Does Glyphs store hidden SB formulas?\", forum.glyphsapp.com/t/35652, 2025-12-15 and 2025-12-16). `=|` is not accepted on an aligned glyph (thread \"Allow \\\"=|\\\" key in auto-aligned metrics keys\", forum.glyphsapp.com/t/35672, 2025-12-20)."
guesses = [
  "Offsets apply to the left and right sidebearing keys only: a left offset moves every component right and widens the glyph, a right offset widens it; an offset typed into the width field of an aligned glyph is refused, and one stored there by a file is ignored; entering =+N in the width field of an aligned glyph in the reference app settles it.",
]
observe = [
  "Enter =+20 in the width field of an aligned glyph and note what happens; enter it in the LSB and the RSB and read the width and each component's position.",
]

# ───────────────────────────── Kerning: basics, modes, Info box ─────────────────────────────

[[behavior]]
id = "kerning.directionsStoredSeparately"
area = "spacing-kerning"
milestone = "M5"
summary = "Left-to-right kerning and right-to-left kerning are separate data sets. Edits, the Info box and the Kerning window all work on the set of the writing direction currently selected in Edit View, so the direction must be set before kerning mixed-direction fonts."
ref = "Spacing & Kerning › Kerning"
status = "handbook"
notes = "Right-to-left pairs are stored in logical order, and a group side names the side that faces the pair: the first glyph (on the right) is given by its left group, written `@MMK_R_…`, the second by its right group, written `@MMK_L_…`. Both oracles read them so: a test font with `@MMK_R_alef` – `@MMK_L_bet` = −77 compiles to −77 between alef and bet in the `hebr` kern lookup (fontc 1.0.0 and fontmake 3.12.1; glyphsLib `builder/groups.py` and `builder/kerning.py`, fontc `glyphs2fontir/src/source.rs`)."

[[behavior]]
id = "kerning.highlightColors"
area = "spacing-kerning"
milestone = "M5"
summary = "With the Text tool active, a kerned gap between two glyphs is tinted: light blue when the kerning value is negative, yellow when it is positive. Both colours are user-configurable in the Appearance settings."
ref = "Spacing & Kerning › Kerning"
status = "handbook"
