status = "handbook"
notes = "Documented, not yet observed: the shortcuts work with the Text tool and the cursor between the two glyphs. The commands take the pair as `left` and `right` in logical order; the shell fills them from the cursor (Ctrl: the glyphs before and after it; Cmd: the glyph after it and the next one; in right-to-left text the other way round, so the keys follow the visual side), with the tab's master and direction. In no-kerning mode and in top-to-bottom text the key changes nothing and the status line says why; outside text mode it runs nothing. A master that takes its kerning from another master is refused."
guesses = [
