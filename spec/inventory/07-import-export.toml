guesses = [
  "The menu label and place are our assumption, and the shortcut is the platform convention; the chapter states neither.",
  "File › Open… without a path asks the system chooser for files with one filter, Fonts, that holds every extension file.open reads (gz standing for .pcf.gz and .bdf.gz); the reference app's chooser filter is not documented.",
