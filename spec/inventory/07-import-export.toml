]

[[behavior]]
id = "open.kerningMostlyPreserved"
area = "spacing-kerning"
milestone = "M5"
summary = "Pair kerning and kerning groups (classes) from a compiled font are mostly recovered into the document's kerning data; contextual kerning is not recovered."
ref = "Import & Export › Opening Font Files › Importing OpenType Features"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.15: opening a compiled font reads the pair lookups (glyph pairs and class pairs, extension lookups included) of the GPOS `kern` feature and stores kerning that gives every covered pair the value a shaper takes from the font: lookups add up in lookup-list order, and in one lookup the first subtable that applies decides. Classes become groups, class pairs group pairs, and covered pairs the groups do not reproduce become glyph pairs. At most 2,000,000 covered pairs are read; a class table of more than 1,000,000 class pairs is skipped with a warning. Contextual kerning is not read."
guesses = [
  "A class read from a compiled font becomes a kerning group named after its first glyph in glyph order; no source says how the reference names recovered groups.",
  "A glyph keeps the first class it is in on each side, and pairs of a later class with other members are stored as glyph pairs; opening a font whose subtables use overlapping classes in the reference app would settle it.",
  "A `kern` feature record used only by right-to-left scripts fills the right-to-left kerning, any other the left-to-right kerning; opening an Arabic font in the reference app would settle it.",
  "A pair two feature records of one direction cover (for two scripts) takes the first record's value; no source says what the reference does.",
]

[[behavior]]
id = "open.postscriptHintsPreserved"
area = "hinting-ps"
milestone = "M10"
summary = "From a CFF or Type 1 font, most glyph-level stem hints, the alignment zones and the standard stems are kept. Imported glyph hints are mostly positional and no longer attached to outline nodes; in a multi-master font the user re-attaches them by dragging each hint's two handles (drawn as a blue circle and a blue triangle) onto matching nodes."
ref = "Import & Export › Opening Font Files › Importing PostScript Hints"
status = "handbook"

# ───────────────────────────── Importing font data ─────────────────────────────

[[command]]
id = "file.importOutlines"
label = "Outlines…"
menu = ["File", "Import"]
shortcut = ""
kind = "engine"
params = "{files: [paths], glyphs?: [names], layer?: id, onMissingGlyph?: add|skip, scale?: unscaled|em} → {imported: [{file, glyph, paths, notes?}], added: [names], unmatched: [files], failed: [{file, error}]}"
area = "import-export"
milestone = "M3"
summary = "Imports the vector paths of PDF, EPS or SVG files as glyph outlines. From Font View several files are matched to glyphs by file name; from Edit View one file goes into the current glyph. With an explicit glyph parameter the file-name matching is bypassed."
ref = "Import & Export › Importing Font Data › Importing Outlines"
status = "handbook"
notes = "SVG and EPS files import (EPS through the fixed PostScript subset of the SVG crate's EPS reader, recognised by its header); PDF input waits for a PDF content-stream reader. `scale: em` fits the drawing's box to the em, and points are rounded to the grid as a paste does. File › Import › Outlines… in the desktop app opens the system file chooser (SVG files, several at once) and imports them as the person's run, so dialog.importOutlinesMissingGlyph can follow; without a chooser it says to run the command with `files`. From Edit View the files are matched by name too, not put into the current glyph (not built)."
guesses = [
  "An SVG reads as one font unit per SVG unit with SVG y = 0 at the ascender; the handbook does not say how a drawing is scaled.",
]

[[panel]]
id = "dialog.importOutlinesMissingGlyph"
label = "Import Outlines: no matching glyph"
location = "dialog"
controls = ["Files with no glyph: pop-up menu, add (default) or skip (`onMissingGlyph`)", "OK: run the import of those files again with that choice", "Cancel: skip those files"]
area = "import-export"
milestone = "M3"
summary = "Prompt shown once per imported file whose base name matches no glyph in the font."
ref = "Import & Export › Importing Font Data › Importing Outlines"
