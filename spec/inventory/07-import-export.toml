status = "handbook"
notes = "Built (M5.14): `importMetrics` takes lsbAndWidth, rsbAndWidth, bothSidebearings or widthCentered (true is lsbAndWidth). AFM gives the LSB and RSB from its bounding box. An empty glyph takes the width only. Documented, not yet observed."
