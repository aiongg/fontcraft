# Source: Glyphs 4 Handbook, chapter "Import & Export"
#         https://handbook.glyphsapp.com/ (single-page edition, chapter 7)
# Date:   2026-10-07
# Rows are written in our own words. [[format]] rows for the file formats named here live in
# another inventory file; this file holds the commands, dialogs and rules around them.
# Commands that this chapter only touches and that other chapters document in full are NOT
# repeated here (file.save, file.saveAs, edit.copy, edit.paste, edit.selectAll, path.removeOverlap,
# path.convertToCubic, the Font Info tabs, the two import settings); behaviours below refer to them.

# ───────────────────────────── Export: commands ─────────────────────────────

[[command]]
id = "file.export"
label = "Export…"
menu = ["File"]
shortcut = "Cmd+E"
kind = "ui"
params = '{tab?: "otf"|"variable"|"ufo"|"metrics"}'
area = "compile"
milestone = "M2"
summary = "Opens the export dialog for the frontmost document, with one tab per output kind (static OpenType, variable fonts, UFO, metrics). The dialog collects options and then runs the matching file.export* engine command."
ref = "Import & Export › Exporting Font Files"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 4:28–4:39: File › Export opens the dialog with the static OpenType tab set to PostScript (CFF) outlines. Not shown: Cmd+E, the other tabs. FontCraft: a shell command that opens dialog.export on the tab `tab` names: OTF (the default), Variable Fonts, UFO or Metrics."

[[command]]
id = "file.exportAll"
label = "Export All"
menu = ["File"]
shortcut = "Cmd+Alt+E"
kind = "engine"
params = '{documents?: [titles or paths], outlines?: ["truetype"|"cff"], containers?: ["plain"|"woff"|"woff2"], destination?: path, fallbackDestination?: path, removeOverlap?: bool, autohint?: bool, cbdt?: bool, timestamp?: number|"now"}'
area = "compile"
milestone = "M2"
summary = "Exports every open document in one go without showing the export dialog; the menu item replaces Export… while Option is held. Each document is exported with its last-used export settings: every exportable instance of each chosen document, in each outline flavour and container, into its folder, reporting what it wrote and what it skipped."
ref = "Import & Export › Exporting Font Files"
status = "handbook"
notes = "A designspace without axes is refused when it states a location, or when it has two or more sources and instances to build, as fontmake refuses it (docs/spec/40-compile.md). M3.39: what the parameters leave out comes from each document's kept OTF-tab settings (file.exportSettings), else from the command's defaults (TrueType, plain, Remove Overlap on). The kept folder counts only while its Export Destination box was ticked. A document with no folder is refused headless, naming it; fired from the menu with no parameters while some document has none, the desktop asks for one folder once (export.promptWhenNoDestination) and passes it as fallbackDestination, which only those documents use. Documents that share a folder are staged together, and all folders move into place as one step. M2.20: the glyph names of every document are checked first; a refused export lists the problems of every document, each with its document."
guesses = [
  "The reference's settings for Export All are not documented; using each document's last-used settings of the OTF tab is our assumption.",
  "A document never exported uses the command's defaults (TrueType, plain), not the OTF tab's opening flavour (PostScript/CFF), so calls that name only a destination write what they wrote before.",
  "One folder asked once serves every document without a ticked folder of its own; documents with one keep it.",
]
observe = [
  "Export one font from the OTF tab to folder A with WOFF2 ticked, then open a second font, hold Option and choose Export All: note which folder and formats each font is written with, and whether a folder is asked for the second font.",
]

[[command]]
id = "file.exportSettings"
label = "Export Settings"
menu = []
shortcut = ""
kind = "engine"
params = '{document?: title or path, tab?: "otf"|"variable"}'
area = "compile"
milestone = "M3"
summary = "FontCraft's query of the Export dialog's settings kept from a document's last successful export, per tab: outline format, containers, Remove Overlap, Autohint, CBDT, the export folder and whether its Export Destination box was ticked. The dialog opens with them and Export All reuses the OTF tab's."
ref = "Import & Export › Exporting Font Files"
status = "inferred"
notes = "M3.39. file.exportStatic and file.exportVariable keep the settings they ran with after they succeed; a failing export keeps the settings before. A saved document's settings live in the user settings under export.keptSettings, keyed by its path (at most 64 documents, newest first); an unsaved document's are kept for the session. Entries read from the settings file are checked; one that fails is listed under problems and not used."
guesses = [
  "Settings are kept per document path, not app-wide: the handbook says Export All uses each document's last settings.",
  "An unsaved document's settings last for the session only; after Save As they are kept by path from its next export.",
]
observe = [
  "Export font 1 from the OTF tab as TrueType with WOFF ticked, then open the Export dialog on font 2: note whether it shows TrueType and WOFF (app-wide) or the defaults (per document).",
]

[[command]]
id = "file.exportStatic"
label = "Export Static Fonts"
menu = []
shortcut = ""
kind = "engine"
params = '{instances?: [names], outlines?: "cff"|"truetype", containers?: ["plain"|"woff"|"woff2"], removeOverlap?: bool, autohint?: bool, cbdt?: bool, destination?: path, testInstall?: bool, timestamp?: number|"now"}'
area = "compile"
milestone = "M2"
summary = "Compiles one static font per export instance (or one default instance derived from the first master when the font defines none) in the chosen outline flavour, writing each requested container format. Existing files with the same name are replaced. This is the headless form of the dialog's OTF tab."
ref = "Import & Export › Exporting Font Files › OpenType Export"
status = "handbook"
notes = "A designspace without axes is refused when it states a location, or when it has two or more sources and instances to build, as fontmake refuses it (docs/spec/40-compile.md). M2.20: a font refused by the compiler fails with every problem file.exportCheck finds; a skipped instance that cannot be interpolated lists its glyphs."

[[command]]
id = "file.exportVariable"
label = "Export Variable Fonts"
menu = []
shortcut = ""
kind = "engine"
params = '{settings?: [names], outlines?: "truetype"|"cff2", containers?: ["plain"|"woff"|"woff2"], destination?: path, optimizeDeltas?: bool, timestamp?: number|"now", versionStamp?: bool}'
area = "compile"
milestone = "M9"
summary = "Compiles one variable font per variable font setting, or one from a default setting when the font defines none. Output is TrueType-flavoured unless `outlines: cff2` asks for CFF2 (an addition of ours; the dialog offers TrueType only); container formats and destination work as for static export. Headless form of the dialog's Variable Fonts tab."
ref = "Import & Export › Exporting Font Files › Exporting Variable Fonts"
status = "handbook"
notes = "Documented, not yet observed. Built in M9.5 (`fontcraft_compile::var::compile_variable`); the command line runs it as `compile --variable`. CFF2 (`outlines: cff2`, M9.13) writes an .otf file; the command line runs it as `compile --variable --format otf`. The dialog's test-install option is the app's (M9.23), not this command's. Alternate layers (M9.8) and variable kerning and marks (M9.9) are not in the font yet; `GPOS` comes from the origin master. M2.20: a refused font fails with every problem file.exportCheck finds."
guesses = [
  "A glyph that has no layer for the origin master does not vary and keeps the origin's empty outline, with a warning; exporting such a font from the reference app would settle it.",
  "An intermediate layer that lies outside the axes of a variable font setting (one that disables masters) is left out of that font, with a note; exporting such a setting from the reference app would settle it.",
]

[[command]]
id = "file.exportUfo"
label = "Export UFO"
menu = []
shortcut = ""
kind = "engine"
params = "{destination: path, masters?: [ids], productionNames?: bool, decomposeSmartStuff?: bool (default true), strict?: bool}"
area = "import-export"
milestone = "M1"
summary = "Writes each chosen master as its own UFO 3 package into the destination folder. Options rename glyphs to production names and decide whether editor-only constructs are turned into plain paths or dropped. Headless form of the dialog's UFO tab. Smart components are drawn as outlines unless decomposeSmartStuff is false, as in the reference's export dialog; file.saveAs and CLI convert keep them as components unless asked."
ref = "Import & Export › Exporting Font Files › Exporting UFO"
status = "handbook"
notes = "productionNames renames a copy of the font before writing it (export.ufoProductionNames, M1.9)."

[[command]]
id = "file.exportCheck"
label = "Check Export"
menu = []
shortcut = ""
kind = "engine"
params = '{document?: title or path, tab?: "otf"|"variable", params?: {…}} → {tab, document, ok, errors: [{kind, message, glyph?, layer?, character?, position?, codepoint?, glyphs?, entry?, line?, column?, instances?}], more?, skipped, warnings, files}'
area = "compile"
milestone = "M2"
summary = "What would stop an export of a document, or keep one of its fonts from being written, all at once and without writing anything: glyph names, code points on two glyphs, incompatible layers, feature code, and whatever else decides a font's glyphs and tables. The export commands list the same problems when they fail."
ref = "FontCraft addition"
status = "docs"
guesses = [
  "Feature code is compiled per exported font for the OTF tab; for the Variable Fonts tab it is compiled for the first master, and not at all when it uses the variable syntax.",
]

[[command]]
id = "file.exportResults"
label = "Export Results…"
menu = []
