[[command]]
id = "file.importOutlines"
label = "Outlines…"
menu = ["File", "Import"]
shortcut = ""
kind = "engine"
params = "{files: [paths], glyphs?: [names], layer?: id, onMissingGlyph?: add|skip, scale?: unscaled|em} → {imported: [{file, glyph, paths, notes?}], added: [names], unmatched: [files], failed: [{file, error}]}"
area = "import-export"
milestone = "M3"
summary = "Imports the vector paths of PDF, EPS or SVG files as glyph outlines. From Font View several files are matched to glyphs by file name; from Edit View one file goes into the current glyph. With an explicit glyph parameter the file-name matching is bypassed."
ref = "Import & Export › Importing Font Data › Importing Outlines"
status = "handbook"
notes = "SVG, EPS and PDF files import (EPS through the fixed PostScript subset of the SVG crate's EPS reader, PDF through `fontcraft-io-pdf`, each recognised by its header). A PDF gives the paths of its first page; unscaled puts the top of its page (crop box, else media box) at the ascender, one unit per point. `scale: em` fits the drawing's box to the em, and points are rounded to the grid as a paste does. File › Import › Outlines… in the desktop app opens the system file chooser (SVG files, several at once) and imports them as the person's run, so dialog.importOutlinesMissingGlyph can follow; without a chooser it says to run the command with `files`. From Edit View the files are matched by name too, not put into the current glyph (not built)."
guesses = [
  "An SVG reads as one font unit per SVG unit with SVG y = 0 at the ascender; the handbook does not say how a drawing is scaled.",
]

[[panel]]
id = "dialog.importOutlinesMissingGlyph"
label = "Import Outlines: no matching glyph"
location = "dialog"
controls = ["Files with no glyph: pop-up menu, add (default) or skip (`onMissingGlyph`)", "OK: run the import of those files again with that choice", "Cancel: skip those files"]
area = "import-export"
milestone = "M3"
summary = "Prompt shown once per imported file whose base name matches no glyph in the font."
ref = "Import & Export › Importing Font Data › Importing Outlines"
status = "handbook"
notes = "The handbook asks once per file, with OK (skip) and Add Glyph. FontCraft asks once for all the files `file.importOutlines` lists as `unmatched`: OK runs it again on them with `onMissingGlyph` (add creates each glyph), with a live preview; Cancel skips them. It opens after the person runs the import (menu, shortcut), not after a control-channel or MCP run. Documented but not yet observed."
guesses = [
  "One question covers every unmatched file, with the buttons Add Glyphs and Skip; the handbook asks once per file, with Add Glyph and OK (skip).",
]

