[[behavior]]
id = "project.separateFromFont"
area = "font-info"
milestone = "M7"
summary = "A project is a separate .glyphsproject file holding instance definitions and a reference to one font file. Editing it never alters the font file, so alternative font versions can be set up without touching the original."
ref = "Import & Export › Projects"
status = "handbook"
notes = "Documented, not yet observed. The project file format of the reference app (.glyphsproject) has no public specification and no sample in the corpus; until a project saved by the reference app is available (M7 plan § 8), projects are saved in FontCraft's own project format (M7 plan § 7, question 3). M7 plan § 4: M7.14."

