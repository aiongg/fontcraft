[[panel]]
id = "dialog.saveChangedOnDisk"
label = "Save: file changed on disk"
location = "dialog"
controls = ["Overwrite: save again with force, replacing the file on disk", "Cancel: leave the file and the document as they are"]
area = "import-export"
milestone = "M13"
summary = "Asked when Save refuses because another program changed the document's file since it was read, so the person can always save their work."
ref = "File › Save"
status = "inferred"
own = true
notes = "Our design: file.save refuses to overwrite a file that changed on disk unless force is true, and this question is how the desktop app passes force. File › Review External Changes… takes the other program's changes in instead."
guesses = [
  "The reference app asks before overwriting a file changed on disk, with Overwrite and Cancel; saving over a file another program changed in the reference app settles it.",
]
