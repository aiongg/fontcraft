# Source: Glyphs 4 Handbook, chapter "Import & Export"
#         https://handbook.glyphsapp.com/ (single-page edition, chapter 7)
# Date:   2026-10-07
# Rows are written in our own words. [[format]] rows for the file formats named here live in
# another inventory file; this file holds the commands, dialogs and rules around them.
# Commands that this chapter only touches and that other chapters document in full are NOT
# repeated here (file.save, file.saveAs, edit.copy, edit.paste, edit.selectAll, path.removeOverlap,
# path.convertToCubic, the Font Info tabs, the two import settings); behaviours below refer to them.

# ───────────────────────────── Export: commands ─────────────────────────────

[[command]]
id = "file.export"
label = "Export…"
menu = ["File"]
shortcut = "Cmd+E"
kind = "ui"
params = '{tab?: "otf"|"variable"|"ufo"|"metrics"}'
area = "compile"
milestone = "M2"
summary = "Opens the export dialog for the frontmost document, with one tab per output kind (static OpenType, variable fonts, UFO, metrics). The dialog collects options and then runs the matching file.export* engine command."
ref = "Import & Export › Exporting Font Files"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 4:28–4:39: File › Export opens the dialog with the static OpenType tab set to PostScript (CFF) outlines. Not shown: Cmd+E, the other tabs. FontCraft: a shell command that opens dialog.export on the OTF tab (`tab: \"otf\"`, the default) or the UFO tab (`tab: \"ufo\"`); the Variable Fonts and Metrics tabs are not built and answer with an error."

[[command]]
id = "file.exportAll"
label = "Export All"
menu = ["File"]
shortcut = "Cmd+Alt+E"
kind = "engine"
params = '{documents?: [titles or paths], outlines?: ["truetype"|"cff"], containers?: ["plain"|"woff"|"woff2"], destination: path, removeOverlap?: bool, autohint?: bool, timestamp?: number|"now"}'
area = "compile"
milestone = "M2"
summary = "Exports every open document in one go without showing the export dialog; the menu item replaces Export… while Option is held. Each document is exported with its last-used export settings. FontCraft has no remembered settings yet, so the command takes them as parameters: every exportable instance of each chosen document, in each outline flavour and container asked for, into one destination folder, reporting what it wrote and what it skipped."
ref = "Import & Export › Exporting Font Files"
status = "handbook"
guesses = [
  "The reference's settings for Export All are not documented; using each document's last-used export settings is our assumption, and until FontCraft remembers settings the command takes them as parameters.",
]

[[command]]
id = "file.exportStatic"
label = "Export Static Fonts"
menu = []
shortcut = ""
kind = "engine"
params = '{instances?: [names], outlines?: "cff"|"truetype", containers?: ["plain"|"woff"|"woff2"], removeOverlap?: bool, autohint?: bool, destination?: path, testInstall?: bool, timestamp?: number|"now"}'
area = "compile"
milestone = "M2"
summary = "Compiles one static font per export instance (or one default instance derived from the first master when the font defines none) in the chosen outline flavour, writing each requested container format. Existing files with the same name are replaced. This is the headless form of the dialog's OTF tab."
ref = "Import & Export › Exporting Font Files › OpenType Export"
status = "handbook"

[[command]]
id = "file.exportVariable"
label = "Export Variable Fonts"
menu = []
shortcut = ""
kind = "engine"
params = '{settings?: [names], outlines?: "truetype"|"cff2", containers?: ["plain"|"woff"|"woff2"], destination?: path, optimizeDeltas?: bool, timestamp?: number|"now", versionStamp?: bool}'
area = "compile"
milestone = "M9"
summary = "Compiles one variable font per variable font setting, or one from a default setting when the font defines none. Output is TrueType-flavoured unless `outlines: cff2` asks for CFF2 (an addition of ours; the dialog offers TrueType only); container formats and destination work as for static export. Headless form of the dialog's Variable Fonts tab."
ref = "Import & Export › Exporting Font Files › Exporting Variable Fonts"
status = "handbook"
notes = "Documented, not yet observed. Built in M9.5 (`fontcraft_compile::var::compile_variable`); the command line runs it as `compile --variable`. CFF2 (`outlines: cff2`, M9.13) writes an .otf file; the command line runs it as `compile --variable --format otf`. The dialog's test-install option is the app's (M9.23), not this command's. Alternate layers (M9.8) and variable kerning and marks (M9.9) are not in the font yet; `GPOS` comes from the origin master."
guesses = [
  "A glyph that has no layer for the origin master does not vary and keeps the origin's empty outline, with a warning; exporting such a font from the reference app would settle it.",
  "An intermediate layer that lies outside the axes of a variable font setting (one that disables masters) is left out of that font, with a note; exporting such a setting from the reference app would settle it.",
]

[[command]]
id = "file.exportUfo"
label = "Export UFO"
menu = []
shortcut = ""
kind = "engine"
params = "{destination: path, masters?: [ids], productionNames?: bool, decomposeSmartStuff?: bool (default true)}"
area = "import-export"
milestone = "M1"
summary = "Writes each chosen master as its own UFO 3 package into the destination folder. Options rename glyphs to production names and decide whether editor-only constructs are turned into plain paths or dropped. Headless form of the dialog's UFO tab. Smart components are drawn as outlines unless decomposeSmartStuff is false, as in the reference's export dialog; file.saveAs and CLI convert keep them as components unless asked."
ref = "Import & Export › Exporting Font Files › Exporting UFO"
status = "handbook"

[[command]]
id = "file.exportMetrics"
label = "Export Metrics"
menu = []
shortcut = ""
kind = "engine"
params = '{master?: id, format: "metrics"|"afm", direction?: "ltr"|"rtl"|"vertical", path?: path, destination?: folder, fileName?: string}'
area = "spacing-kerning"
milestone = "M5"
summary = "Writes the spacing and kerning of one master to a metrics file or an AFM file, or returns the text. Commands take explicit targets, so the master defaults to the first master; the dialog's Metrics tab passes the master the toolbar shows. Headless form of that tab."
ref = "Import & Export › Exporting Font Files › Exporting Metrics"
status = "handbook"
notes = "Built (M5.14) in `crates/engine/src/cmd/metrics_io.rs`. metrics: kerning-text with the master's pairs of one direction, its kerning groups on the two sides facing that direction and one metrics line per glyph (LSB, RSB, width and the three keys as the fields show them); file.importMetrics reads it back to the same font. afm: `fontcraft_spacing::afm::from_master`. A linked master writes what it shows: the widths and kerning of the master it follows. `destination` with `fileName` (default Family-Master) adds .tsv or .afm; the file is written atomically. Documented, not yet observed."
guesses = [
  "The `metrics` format is our kerning-text format (`kerning-text` in 30-formats.toml), because the reference does not document its own metrics file; files in the reference format are neither read nor written.",
  "A metrics file holds the pairs of one direction (left to right by default, `direction` for the others), because kerning-text has one direction line; an export of a master with right-to-left or vertical pairs needs one file per direction. A reference metrics file with such pairs would settle it.",
  "The metrics file's extension is .tsv; the reference's own extension is not documented.",
]

# ───────────────────────────── Export: dialogs ─────────────────────────────

[[panel]]
id = "dialog.export"
label = "Export"
location = "dialog"
controls = [
  "tab switcher: OTF, Variable Fonts, UFO, Metrics",
  "tab body (see dialog.exportOtf, dialog.exportVariable, dialog.exportUfo, dialog.exportMetrics)",
  "Next… button: start the export, or go on to a folder / file chooser when the tab needs one",
]
area = "compile"
milestone = "M3"
summary = "The export dialog attached to the current document. Each tab is an output kind with its own options; Next… either exports straight away or first asks where to write."
ref = "Import & Export › Exporting Font Files"
status = "handbook"
notes = "Built: the tab switcher with the OTF tab (dialog.exportOtf) and the UFO tab (dialog.exportUfo). Each tab is a dialog of its own command. Switching tabs keeps each tab's values; a tab shown for the first time takes the values of the fields it shares with the tab shown before (the export folder). The Variable Fonts and Metrics tabs wait for their commands (M9, M5). Whether the reference keeps values across tabs is not observed."

[[panel]]
id = "dialog.exportOtf"
label = "Export › OTF"
location = "dialog"
controls = [
  "Outline Flavor: PostScript/CFF or TrueType (exactly one)",
  "File Format checkboxes: .otf/.ttf, WOFF, WOFF2 (any combination)",
  "Remove Overlap checkbox",
  "Autohint checkbox",
  "Export Destination: checkbox plus clickable folder path",
  "Test Install checkbox",
  "Next… button",
]
area = "compile"
milestone = "M3"
summary = "Options for static OpenType export: outline flavour, the container formats to write, overlap removal, autohinting and the two destinations (a folder, or direct installation into the system)."
ref = "Import & Export › Exporting Font Files › OpenType Export"
status = "handbook"
notes = "Runs file.exportStatic. Fields: outlines (cff or truetype; opens on cff, as the video named in file.export shows it; whether that is the default or a remembered setting is not observed), containers (File Format checkboxes OTF/TTF, WOFF, WOFF2; plain ticked), removeOverlap (on) and autohint (off; the engine refuses it on until hinting on export exists), destination (Export Folder: a path with Choose…, see dialog.chooseExportFolder). Not built: the destination checkbox and Test Install (M14), so the folder is the only destination. The dialog does not preview, as exporting writes files: Next… runs the command once, journaled, and a failure keeps the dialog open with the message. Next… with no folder asks for one (export.promptWhenNoDestination). The flavour menu shows PostScript/CFF and TrueType for the words cff and truetype."

[[panel]]
id = "dialog.exportVariable"
label = "Export › Variable Fonts"
location = "dialog"
controls = [
  "File Format checkboxes (as on the OTF tab)",
  "Export Destination: checkbox plus clickable folder path",
  "Test Install checkbox",
  "Next… button",
]
area = "compile"
milestone = "M9"
summary = "Options for variable font export. The handbook only says file formats and destination are set as on the OTF tab; there is no flavour choice because the output is always TrueType. Whether Remove Overlap and Autohint appear here is not stated."
ref = "Import & Export › Exporting Font Files › Exporting Variable Fonts"
status = "handbook"

[[panel]]
id = "dialog.exportUfo"
label = "Export › UFO"
location = "dialog"
controls = [
  "masters list with multiple selection (Cmd-click toggles, Shift-click extends, Select All)",
  "Convert Glyph Names to Production Names checkbox",
  "Decompose Smart Stuff checkbox",
  "Next… button: opens a folder chooser",
]
area = "import-export"
milestone = "M1"
summary = "Options for UFO export: which masters to write and how to treat glyph names and editor-only constructs. Next… asks for the destination folder."
ref = "Import & Export › Exporting Font Files › Exporting UFO"
status = "handbook"
notes = "Built (M3.14) as a tab of dialog.export running file.exportUfo. Masters: one checkbox per master, all ticked (the handbook's list with multiple selection). Convert Glyph Names to Production Names: off; the engine refuses it until the glyph database exists (M4). Decompose Smart Stuff: on. Export Folder: a path with Choose…; Next… with no folder opens the folder chooser, as the handbook describes. Documented, not yet observed."

[[panel]]
id = "dialog.exportMetrics"
label = "Export › Metrics"
location = "dialog"
controls = [
  "Master pop-up: the master the toolbar shows at first",
  "Format pop-up: Metrics File or AFM File",
  "File Name field (without extension; empty: family and master name)",
  "Export Folder with Choose…",
  "Next… / Cancel",
]
area = "spacing-kerning"
milestone = "M5"
summary = "Exports the metrics of the master currently active in the toolbar. The tab itself has no stated options; destination and format are picked in the save dialog that follows."
ref = "Import & Export › Exporting Font Files › Exporting Metrics"
status = "handbook"
notes = "Built (M5.14) as the Metrics tab of dialog.export (`crates/ui-egui/src/dialogs/export.rs`), running file.exportMetrics on Next…; Next… with no folder asks for one, as the other tabs do. Documented, not yet observed."
guesses = [
  "The format, file name and folder sit on the tab, with the folder chooser for the folder, because the dialog framework has no save-file chooser; the handbook puts them in a save dialog after Next…. A save-file chooser in the shell would settle it.",
  "The tab shows a Master pop-up that starts on the toolbar's master, so a master can be exported without changing the toolbar; the handbook names no such control.",
]

[[panel]]
id = "dialog.chooseExportFolder"
label = "Choose Export Folder"
location = "dialog"
controls = ["folder browser", "confirm / cancel"]
area = "compile"
milestone = "M3"
summary = "Folder chooser shown when the destination path in the export dialog is clicked, when a font export starts with neither destination ticked, and after Next… on the UFO tab."
ref = "Import & Export › Exporting Font Files › Export Destination"
status = "handbook"
notes = "Built (M3.14): the system folder chooser, opened by the desktop shell from Choose… beside an export folder field and from Next… with that field empty; the engine only takes the chosen path as the command's destination. The browser and headless hosts (MCP, tests) have no chooser: Choose… is hidden and the folder is typed, or set with ui.dialog.set."

# ───────────────────────────── Export: rules ─────────────────────────────

[[behavior]]
id = "export.overwritesExisting"
area = "compile"
milestone = "M2"
summary = "Export replaces files that already exist at the target path; the handbook mentions no confirmation prompt."
ref = "Import & Export › Exporting Font Files"
status = "handbook"

[[behavior]]
id = "export.exportAllSkipsDialog"
area = "compile"
milestone = "M2"
summary = "Holding Option turns File › Export… into Export All, which processes all open documents and never shows the export dialog."
ref = "Import & Export › Exporting Font Files"
status = "handbook"

[[behavior]]
id = "export.staticUsesInstancesOrDefault"
area = "compile"
milestone = "M2"
summary = "Static export produces the font's configured instances. A font with no instances still exports: a default instance is synthesised from the first master."
ref = "Import & Export › Exporting Font Files › OpenType Export"
status = "handbook"

[[behavior]]
id = "export.fileNaming"
area = "compile"
milestone = "M2"
summary = "Each exported file is named by the font's PostScript name (family and style without spaces, joined by a hyphen) plus the extension of its flavour and container: .ttf or .otf, .woff, .woff2. An instance's fileName custom parameter replaces that stem. FontCraft drops characters that cannot be in a file name, and names the files of a font with no family name by the source file's name without its extension (Draft-Bold.ttf, not -Bold.ttf); the name table keeps the empty family."
ref = "Import & Export › Exporting Font Files; Appendix › Custom Parameters › fileName"
status = "memory"
guesses = [
  "The PostScript-name stem is recalled from the reference, not read in a source; dropping characters a file name cannot hold and falling back to the source file's name are ours.",
]

[[behavior]]
id = "export.instancesBetweenMasters"
area = "compile"
milestone = "M2"
summary = "Until interpolation exists (M9), static export builds an instance only where it sits exactly at a master and draws that master's layers; an instance between masters is skipped and listed in the result with the reason. An export in which nothing can be built fails."
ref = "docs/plans/M2.md › Open questions: answers for M2"
status = "inferred"

[[behavior]]
id = "export.flavourSubfolders"
area = "compile"
milestone = "M2"
summary = "An export that writes both outline flavours at once (file.exportAll, font.compile) puts each flavour's files into a subfolder named ttf or otf of the destination, so the WOFF and WOFF2 files of the two flavours do not overwrite each other. Two fonts with the same file name in one export: the later one is kept, with a warning."
ref = "docs/spec/40-compile.md › 1.12 Export"
status = "inferred"
guesses = [
  "An export of both flavours at once puts them into ttf and otf subfolders; how the reference lays out such an export is not documented.",
]

[[behavior]]
id = "export.failingExportWritesNothing"
area = "compile"
milestone = "M2"
summary = "Every font of an export is compiled and wrapped before any file is moved into place: files are written under temporary names beside their destination and renamed at the end. When any font fails, the temporary files and the folders the export created are removed, and the destination is as it was."
ref = "docs/spec/40-compile.md › 1.12 Export"
status = "inferred"

[[behavior]]
id = "export.singleFileDestination"
area = "compile"
milestone = "M2"
summary = "A headless static export may name one file instead of a folder. Its extension (.ttf, .otf, .woff, .woff2) sets the outline flavour and container when they are not given and must agree with them when they are; the file receives the first instance that can be built, and the others are listed as skipped."
ref = "docs/spec/40-compile.md › 1.12 Export"
status = "inferred"

[[behavior]]
id = "export.outlineFlavorChoice"
area = "compile"
milestone = "M2"
summary = "Exactly one outline flavour is chosen per static export: PostScript/CFF (cubic outlines in a CFF table, file suffix .otf) or TrueType (quadratic outlines in glyf plus the related TrueType tables, file suffix .ttf)."
ref = "Import & Export › Exporting Font Files › OpenType Export › Outline Flavor"
status = "handbook"

[[behavior]]
id = "export.cubicToQuadraticOnTrueType"
area = "compile"
milestone = "M2"
summary = "Sources hold cubic paths; a TrueType export converts them to quadratic curves at compile time and leaves the source untouched. The result may differ from the drawn outline by a very small amount. Paths that are already quadratic in the source are an existing case the compiler must accept."
ref = "Import & Export › Exporting Font Files › OpenType Export › Outline Flavor"
status = "handbook"

[[behavior]]
id = "export.truetypeKeepsComponents"
area = "compile"
milestone = "M2"
summary = "A TrueType export writes components as component references instead of flattening them to outlines. (The CFF flavour has no components, so they are flattened there; that half is implied, not stated in this chapter.)"
ref = "Import & Export › Exporting Font Files › OpenType Export › Outline Flavor"
status = "handbook"

[[behavior]]
id = "export.flavorsDifferInHinting"
area = "compile"
milestone = "M10"
summary = "The two flavours carry different hinting: PostScript hints for CFF and TrueType instructions for glyf. The export options and the hinting data used depend on the flavour."
ref = "Import & Export › Exporting Font Files › OpenType Export › Outline Flavor"
status = "handbook"

[[behavior]]
id = "export.containerFormats"
area = "compile"
milestone = "M2"
summary = "Three container formats can be ticked independently and all ticked ones are written in one export: the plain desktop file (.otf or .ttf according to flavour), WOFF (.woff) and WOFF2 (.woff2). The handbook does not say what happens when none is ticked."
ref = "Import & Export › Exporting Font Files › OpenType Export › File Format"
status = "handbook"

[[behavior]]
id = "export.removeOverlapOption"
area = "compile"
milestone = "M3"
summary = "With Remove Overlap on, every exported glyph layer has its paths and components merged into non-overlapping outlines, using the same operation as Path › Remove Overlap. It is meant to be on for release builds and off only to speed up test exports or when the font already applies the Remove Overlap filter through custom parameters."
ref = "Import & Export › Exporting Font Files › OpenType Export › Options"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 4:28–4:39: the export dialog has a Remove Overlap checkbox, left on. Its effect is not shown separately. Implemented (M3.7) as documented, not yet observed: `removeOverlap` on file.exportStatic and file.exportAll, on by default (the dialog's checkbox too); font.compile's outlines.removeOverlaps and the CLI's --keep-overlaps. Components are merged where the compiler decomposes them (a glyph mixing paths and components, every glyph in CFF); a glyph made only of components stays a composite and its components keep their overlaps, as in fontmake. Whether the reference app also merges such composites is to be observed. Open paths are left out with a warning. A glyph whose overlap removal fails or takes longer than 5 s keeps its overlaps and is named in a warning (docs/plans/M3.md › M3.6, rule 8)."

[[behavior]]
id = "export.autohintCff"
area = "hinting-ps"
milestone = "M10"
summary = "With Autohint on and the CFF flavour, the PostScript autohinter runs only on glyphs that carry no manual PostScript hints; manually hinted glyphs keep their hints."
ref = "Import & Export › Exporting Font Files › OpenType Export › Options"
status = "handbook"
notes = "Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 4:28–4:39: the export dialog has an Autohint checkbox, left on, with CFF outlines. Its handling of manual hints is not shown. FontCraft: `file.exportStatic {autohint: true}` (and an instance's Autohint parameter) runs the otfautohint port on each glyph whose hint-source layer has no PostScript hints, except the glyphs Disable autohinting for glyphs lists, against the zones and stems of the Private dict being written, on the outline as the charstring draws it (rounded, with the steps the specialiser drops removed); identical zones are merged first. Measured against otfautohint 5.0.1 on FontCraft's unhinted builds of the 337 corpus sources it builds as CFF: 6,853 of 6,855 glyphs identical in stems, hint masks, counter masks and flex."
guesses = ["Zones or stems the autohinter cannot use (overlapping zones, fewer than two BlueValues zones, a direction without stems) make the export autohint without them, with a warning, where otfautohint refuses the font; a reference export of a font with overlapping zones would show what it does."]

[[behavior]]
id = "export.autohintTrueType"
area = "hinting-tt"
milestone = "M10"
summary = "With Autohint on and the TrueType flavour, the TrueType autohinter is applied to the whole font and any manual TrueType hints in the source are ignored."
ref = "Import & Export › Exporting Font Files › OpenType Export › Options"
status = "handbook"

[[behavior]]
id = "export.destinationFolder"
area = "compile"
milestone = "M2"
summary = "The folder destination is a checkbox next to a path. Ticking it writes font files into that folder; clicking the path opens a folder chooser to change it. Whether the OTF and Variable Fonts tabs share one remembered folder is not stated."
ref = "Import & Export › Exporting Font Files › Export Destination"
status = "handbook"

[[behavior]]
id = "export.testInstall"
area = "compile"
milestone = "M14"
summary = "Test Install registers the compiled fonts directly with the operating system's font system without writing files. They become usable in applications that go through the system text framework (Core Text on macOS) but not in applications with their own font handling, sidestep font-cache staleness, and are gone after a reboot. Platform-specific; needs an equivalent per OS."
ref = "Import & Export › Exporting Font Files › Export Destination"
status = "handbook"

[[behavior]]
id = "export.promptWhenNoDestination"
area = "compile"
milestone = "M2"
summary = "If neither the folder checkbox nor Test Install is ticked, pressing Next… asks for an export folder before compiling. The two destinations are separate checkboxes; whether ticking both writes files and installs in one run is not spelled out."
ref = "Import & Export › Exporting Font Files › Export Destination"
status = "handbook"
notes = "Built (M3.14) in the export dialog, where the folder is the only destination until Test Install exists: Next… pressed by the person with an empty Export Folder opens dialog.chooseExportFolder; cancelling it exports nothing and leaves the dialog open. Over the control channel (ui.dialog.confirm) an empty folder is an error that names the field. Documented, not yet observed."

[[behavior]]
id = "export.instanceExportFolder"
area = "compile"
milestone = "M7"
summary = "An instance carrying the Export Folder custom parameter is written to that sub-path, resolved relative to the export destination. Forward slashes create nested folders and '..' segments climb out of the destination (for example '../Trial Versions')."
ref = "Import & Export › Exporting Font Files › Export Destination"
status = "handbook"
notes = "Documented, not yet observed. The Export Folder parameter itself is an M2 row. Since M7.10 File › Export, `font.compile` and `font.compilePlan` place each instance's files in it; a one-file destination ignores it. The destination is made absolute first, so `..` climbs out of the folder it names even when typed as `.`. Exports run in the desktop app write outside the destination as the parameter asks; headless, MCP and control-channel exports skip such an instance with the reason (a safety limit of ours for callers that are not the person at the app)."
guesses = [
  "The sub-path is used as written, `..` segments included, as the handbook says; an absolute path, an empty segment, a folder name with a character such as `:` or `\\`, or a path of more than 32 segments makes export skip that instance with the reason, one trailing `/` is ignored, and the warnings name every file written outside the export destination; an Export Folder of `../x` and one of `/tmp/x` in the reference app settle it.",
  "Exports from the command line, MCP and the control channel skip an instance whose Export Folder resolves outside the destination folder; the reference app has no such callers, so nothing there settles it.",
]
observe = [
  "In font C (m7-export), export with Export Folder `../trial`, then `/tmp/x`: note where the files go.",
]

[[behavior]]
id = "export.variableUsesSettingsOrDefault"
area = "compile"
milestone = "M9"
summary = "Variable export produces one font per variable font setting defined in the font's exports. With none defined, a default variable font setting is used so the export still yields one file."
ref = "Import & Export › Exporting Font Files › Exporting Variable Fonts"
status = "handbook"

[[behavior]]
id = "export.variableAlwaysTrueType"
area = "compile"
milestone = "M9"
summary = "Variable fonts are always compiled with TrueType outlines (glyf/gvar); no CFF2 output is offered from the export dialog."
ref = "Import & Export › Exporting Font Files › Exporting Variable Fonts"
status = "handbook"

[[behavior]]
id = "export.ufoMasterSelection"
area = "import-export"
milestone = "M1"
summary = "The UFO tab lists the font's masters. Cmd-click toggles single entries, Shift-click selects a range and Edit › Select All (Cmd+A) selects every master; each selected master becomes one UFO."
ref = "Import & Export › Exporting Font Files › Exporting UFO"
status = "handbook"

[[behavior]]
id = "export.ufoProductionNames"
area = "import-export"
milestone = "M1"
summary = "Convert Glyph Names to Production Names writes glyphs under their production names instead of the editor's readable names, for downstream tools that expect the simpler scheme. Off, the readable names are written unchanged."
ref = "Import & Export › Exporting Font Files › Exporting UFO"
status = "handbook"

[[behavior]]
id = "export.ufoDecomposeSmartStuff"
area = "import-export"
milestone = "M1"
summary = "UFO cannot hold editor-only constructs such as smart components and corner components. With Decompose Smart Stuff on (the default) they are converted to ordinary paths; with it off they are left out of the exported UFO altogether. FontCraft draws smart components as outlines when it is on (export.ufoSmartComponentsAsOutlines) and keeps them as components with their values in the glyph lib when it is off."
ref = "Import & Export › Exporting Font Files › Exporting UFO"
status = "handbook"

[[behavior]]
id = "export.ufoSmartComponentsAsOutlines"
area = "import-export"
milestone = "M2"
summary = "Writing a UFO or designspace keeps smart components as components, their values in the glyph lib key com.schriftgestaltung.componentsSmartComponentValues, unless smart components are to be drawn as outlines (file.saveAs and convert with smartComponents outlines, file.exportUfo with decomposeSmartStuff, which is on by default). Then, as glyphsLib does, each component of a glyph with smart properties and more than one pole layer for the layer's master becomes the pole layers' outlines interpolated at the component's values: the master layer (else the first pole layer) is the default location, the others sit at -1 or 1 on each property whose end differs from it, values are normalized with the property's bottom, default and top, and a variation model with extrapolation weighs the layers. Smart components inside pole layers are drawn first; the component's transform is applied and contours are reversed when it flips them. One pole layer: a plain component. A smart component that cannot be interpolated (pole layers with different node counts, no pole layer for the master) stays a component and is listed in the losses. The document keeps its components."
ref = "glyphsLib builder/smart_components.py, builder/components.py; docs/spec/31-glyphslib-crosswalk.md § 9.3"
status = "docs"

[[behavior]]
id = "export.ufoWritesVersion3"
area = "import-export"
milestone = "M1"
summary = "UFOs created by the export dialog are always UFO version 3, whatever the source format is."
ref = "Import & Export › Exporting Font Files › Exporting UFO"
status = "handbook"

[[behavior]]
id = "export.metricsCurrentMaster"
area = "spacing-kerning"
milestone = "M5"
summary = "Metrics export covers exactly one master: the one selected in the toolbar at the time of export."
ref = "Import & Export › Exporting Font Files › Exporting Metrics"
status = "handbook"
notes = "Built (M5.14): the Metrics tab opens on the master the toolbar shows (the showing tab's active master, else Font View's master); file.exportMetrics writes one master. Documented, not yet observed."

[[behavior]]
id = "export.metricsFileIsComplete"
area = "spacing-kerning"
milestone = "M5"
summary = "The reference's own metrics file format carries all spacing and kerning data of the master, including what AFM cannot express. Its layout is proprietary and undocumented in the handbook; we need our own lossless equivalent."
ref = "Import & Export › Exporting Font Files › Exporting Metrics"
status = "handbook"
notes = "Built (M5.14) with kerning-text: pairs in stored order, groups, LSB, RSB, width and the left, right and width keys of every glyph. Exporting a master and importing the file into the master again gives back the same glyphs and kerning (test `kerning_text_export_then_import_restores_the_master_exactly_as_one_undo_step`). Vertical metrics (TSB, BSB, vertical width) and their keys are not in the format."

[[behavior]]
id = "export.afmIsLossy"
area = "spacing-kerning"
milestone = "M5"
summary = "AFM export is for exchange with other editors and drops what the format cannot represent; group kerning and metrics keys are named as unsupported. How group kerning is reduced (expanded to glyph pairs, or omitted) is not stated."
ref = "Import & Export › Exporting Font Files › Exporting Metrics"
status = "handbook"
notes = "Built (M5.14): every glyph pair a stored pair covers is written with the value that applies to it (exceptions included), rounded half up, as are widths and bounding boxes; groups and keys are not written. fontTools afmLib reads the file (the § 5 measure on Inter, `afm_from_inter_regular_reads_back_with_afmlib_both_ways`)."
guesses = [
  "Group pairs are expanded to glyph pairs with the exceptions applied, so the AFM file holds the kerning that applies to every covered glyph pair; the handbook does not say.",
  "AFM values stay in the font's units and are not scaled to 1,000 units per em, so a round trip loses nothing; Adobe's note assumes 1,000. An AFM exported by the reference from a 2,048-unit font would settle it.",
]

# ───────────────────────────── Source formats and saving ─────────────────────────────

[[behavior]]
id = "source.saveAsChoosesFormat"
area = "import-export"
milestone = "M1"
summary = "File › Save As… (Cmd+Shift+S; the command row file.saveAs is in 03a-edit-view-drawing.toml) is where the source format is picked. Its format parameter should accept glyphs, glyphspackage, ufo, or the id of a format added by a plug-in. It is also the only way to turn an opened compiled font into an editable source."
ref = "Import & Export › Source Formats; Opening Font Files"
status = "handbook"

[[panel]]
id = "dialog.saveAs"
label = "Save As"
location = "dialog"
controls = ["file name", "folder", "source format choice: Glyphs File, Glyphs File Package, Unified Font Object (plus plug-in formats)"]
area = "import-export"
milestone = "M1"
summary = "Save dialog with a format chooser offering the three built-in source formats and any formats contributed by plug-ins."
ref = "Import & Export › Source Formats"
status = "handbook"

[[behavior]]
id = "source.threeBuiltInFormats"
area = "import-export"
milestone = "M1"
summary = "A document can live in one of three source formats (.glyphs, .glyphspackage, .ufo) and can be moved between them at any time with Save As. New documents default to the single-file Glyphs format."
ref = "Import & Export › Source Formats"
status = "handbook"

[[behavior]]
id = "source.glyphsFileIsFlatPlist"
area = "import-export"
milestone = "M1"
summary = "A .glyphs file is one flat file holding the entire font, written as an old-style (NeXTSTEP/OpenStep) text property list, so it can be read and edited in a text editor. Any change rewrites the whole file."
ref = "Import & Export › Source Formats › Glyphs File"
status = "handbook"

[[behavior]]
id = "source.formatVersionKeptOnOpen"
area = "import-export"
milestone = "M1"
summary = "A file made by an older application version is kept in its original format version when saved, so the older version can still open it. Features that the older version cannot store are then unavailable or lost until the font's File format version (Font Info › Other › File Saving) is switched to Version 3."
ref = "Import & Export › Source Formats › Glyphs File"
status = "handbook"

[[behavior]]
id = "source.newFilesAreVersion3"
area = "import-export"
milestone = "M1"
summary = "Newly created Glyphs documents use format Version 3."
ref = "Import & Export › Source Formats › Glyphs File"
status = "handbook"

[[behavior]]
id = "source.packageLayout"
area = "import-export"
milestone = "M1"
summary = "A .glyphspackage holds the same data as a .glyphs file but split across files inside a folder: notably one file per glyph. The Edit View tab strings, which change constantly, sit apart in UIState.plist so a version control system can ignore them. The operating system should present the folder as a single openable document."
ref = "Import & Export › Source Formats › Glyphs File Package"
status = "handbook"

[[behavior]]
id = "source.packageSavesOnlyChangedFiles"
area = "import-export"
milestone = "M1"
summary = "Saving a package rewrites only the files whose content changed (for instance the glyph files that were edited), unlike the single-file format which is rewritten in full. This is why packages suit very large fonts (CJK) and version control."
ref = "Import & Export › Source Formats › Glyphs File Package"
status = "handbook"

[[behavior]]
id = "source.ufoIsSingleMaster"
area = "import-export"
milestone = "M1"
summary = "A UFO holds one master only, unlike the two Glyphs formats; it is a folder shown as a single file. A document saved as UFO therefore cannot carry several masters in one file."
ref = "Import & Export › Source Formats › Unified Font Object"
status = "handbook"

[[behavior]]
id = "source.ufoVersionPreserved"
area = "import-export"
milestone = "M1"
summary = "UFO version 2 and version 3 can both be opened and saved. A UFO keeps the version it was opened with when saved again; only UFOs newly created through export are forced to version 3."
ref = "Import & Export › Source Formats › Unified Font Object"
status = "handbook"

[[behavior]]
id = "source.ufoUnsupportedFeatureWarning"
area = "import-export"
milestone = "M1"
summary = "While a document's source format is UFO, editor features the format cannot store are restricted: turning one on raises a warning message. The handbook does not list the affected features."
ref = "Import & Export › Source Formats › Unified Font Object"
status = "handbook"

[[behavior]]
id = "source.ufoPerFileImportOptions"
area = "import-export"
milestone = "M1"
summary = "For a particular UFO, the two import behaviours (renaming glyphs to the built-in scheme, auto-aligning components) are controlled per file in Font Info › Other through Use Custom Naming and Disable Automatic Alignment, independently of the application-wide settings."
ref = "Import & Export › Source Formats › Unified Font Object"
status = "handbook"

[[behavior]]
id = "interop.otherEditors"
area = "import-export"
milestone = "M1"
summary = "UFO is the general exchange format with other editors; FontLab 7 reads and writes .glyphs directly and keeps more detail than a UFO round trip, and FontLab Studio 5 relies on import/export macros shipped by the reference. Any exchange may simplify data (decomposed outlines) or drop font information, so nothing here should be assumed lossless."
ref = "Import & Export › File Format Interoperability"
status = "handbook"

