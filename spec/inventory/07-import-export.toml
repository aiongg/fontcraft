guesses = [
  "Only names the glyph data knows are renamed (production, alternative, legacy and code-point names, with their suffixes); names it does not know stay as they are. Opening a TTF with such names in the reference app would settle it.",
  "A glyph whose name occurs in feature code, a custom parameter, a hint or a display string keeps it, with a warning, because those texts are not rewritten and the font would stop compiling. Opening a UFO whose features.fea names a uni-named glyph would settle it.",
  "A nice name that is already a glyph's name, or that an earlier glyph takes, is not used, and the glyph keeps its name without a warning.",
  "Renamed glyphs keep their places in the glyph order; they are not sorted by the default order.",
  "The user setting Keep Glyph Names from Imported Files does not switch on the font's Use Custom Naming option, so names typed later still become nice names.",
