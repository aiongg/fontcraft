notes = "Documented, not yet observed. Built in M6.15 (`cmd/file.rs`): file.open aligns every composite of a UFO or designspace before the document is shown and reports how many glyphs changed (`aligned`); a font whose own Disable Automatic Alignment option is on is left as read. A compiled font is left as compiled: it opens view-only, and without anchors alignment would set its mark components side by side as bases. The web app adds documents from bytes without this step."
