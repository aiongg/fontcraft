[[command]]
id = "file.importMetrics"
label = "Metrics…"
menu = ["File", "Import"]
shortcut = ""
kind = "engine"
params = '{file: path, master?: id, sourceMaster?: id, importKerning?: bool, importKerningGroups?: bool, importMetrics?: false|"lsbAndWidth"|"rsbAndWidth"|"bothSidebearings"|"widthCentered", keepAlignedComponents?: bool, glyphs?: [names]}'
area = "spacing-kerning"
milestone = "M5"
summary = "Reads spacing and kerning for one master from a metrics file, an AFM file, a Glyphs file or a UFO and applies the parts the user ticks to the open document. Available from Font View. Which options exist depends on the file type (see the two dialogs); sourceMaster for multi-master source files is our addition."
ref = "Import & Export › Importing Font Data › Importing Metrics"
status = "handbook"
notes = "Built (M5.14) in `crates/engine/src/cmd/metrics_io.rs`; one undo step, refused for a linked master. Sources by content: kerning-text, AFM (`StartFontMetrics`), or any font source FontCraft opens; `text` takes a file's contents (for the browser) and `sourceDocument` another open document. Kerning replaces the master's pairs in each direction the source holds; values keep their fractions. Kerning classes: kerning-text sets the groups on the sides its group lines name (a file of pairs alone leaves the groups); a font source copies the groups of glyphs of the same name. Glyph metrics in the four modes of import.metricsModes; a glyph with components takes its metrics after the glyphs its components show (a composite of composites after the composites in it), as it measures them. An AFM box is the upright outline's, so AFM sidebearings are compared with the upright box and an italic master comes back unchanged from an AFM export and import. Unknown glyphs and groups are listed. `keepAlignedComponents` waits for automatic alignment (M6); until then it is accepted and has no effect. Documented, not yet observed."
guesses = [
  "The import goes to the master given, else the first master, and `sourceMaster` defaults to the first master of the source file.",
  "Importing kerning replaces the master's pairs in each imported direction, so export then import gives back the same table; the handbook does not say whether it merges. Importing into a master with pairs in the reference app would settle it.",
  "Import Kerning and Import Kerning Classes default to on (Import Kerning off for a Glyphs file, which cannot give kerning values), and Import Metrics to off; the handbook states no defaults.",
  "A metrics file also sets the left, right and width keys as it gives them, an empty key field removing the key the field shows; an AFM leaves the keys as they are.",
  "Width, Outline Centred rounds the new LSB half up, so the outline stays on whole units; the handbook does not say.",
  "Selected Glyphs limits glyph metrics and kerning classes; kerning values are imported whole.",
  "Selected Glyphs means the glyphs selected in Font View, also while an Edit View tab shows; the handbook does not say which selection. Ticking it with a tab open in the reference app would settle it.",
]

