]

[[behavior]]
id = "import.metricsBreaksAutoAlignment"
area = "spacing-kerning"
milestone = "M6"
summary = "If an imported value for an automatically aligned composite differs from what alignment would compute, alignment is switched off for the affected components so the imported value can hold. Ticking Keep Aligned Components prevents this and the aligned glyph keeps its derived metrics."
ref = "Import & Export › Importing Font Data › Importing Metrics"
status = "handbook"
notes = "Moved from M5 to M6 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 5). Built in M6.15 (`cmd/metrics_io.rs`): an aligned composite is first aligned with its bases' new metrics and the file's keys, then compared with the imported values; where they differ, its components on that master's layer get alignment Disabled and the values are applied (listed in `unaligned`), or, with Keep Aligned Components, the glyph is left as it was and listed in `skipped`. Documented, not yet observed."
guesses = [
  "Imported values that round to the derived ones (less than half a unit away) leave alignment on; importing a metrics file whose values differ by fractions in the reference app settles it.",
  "Alignment is switched off only on the layer of the master being imported, for every component of that layer; the other masters' layers stay aligned; importing into one master of a two-master font in the reference app settles it.",
]

[[behavior]]
id = "import.metricsSelectedGlyphs"
area = "spacing-kerning"
milestone = "M5"
summary = "Metrics are applied to every glyph unless Selected Glyphs is ticked, which limits the import to the Font View selection; with that option ticked and nothing selected, all glyphs are still processed."
ref = "Import & Export › Importing Font Data › Importing Metrics"
status = "handbook"
notes = "Built (M5.14): the dialogs pass the Font View selection as `glyphs` when Selected Glyphs is ticked and an empty list (every glyph) when it is not; file.importMetrics treats an absent or empty list as every glyph. Documented, not yet observed."

[[command]]
id = "file.importFeatures"
label = "Features…"
menu = ["File", "Import"]
shortcut = ""
kind = "engine"
params = '{file?: path, text?: string}'
area = "features"
milestone = "M8"
summary = "Reads a feature file in AFDKO syntax (.fea) and adds the features it contains to the font's feature list in Font Info › Features. How name clashes with existing features, classes and prefixes are resolved is not stated."
ref = "Import & Export › Importing Font Data › Importing Feature Files"
status = "handbook"
notes = "Documented, not yet observed. Built (M8.22) in `crates/engine/src/cmd/features_io.rs`. The file's includes are inlined first, resolved against its folder and then the including file's folder (`fea.include.resolution`) and kept inside the file's folder; 16 MB of text, 4,096 files and 50 levels at most. A text in the form UFO features are written in splits back into its entries with their automatic and disabled flags; any other text splits at the top level: class definitions become classes, `feature tag { … } tag;` blocks features, and each run of other statements and comments between them a prefix. The entries go after the font's as one undo step."
guesses = [
  "A class or prefix whose name the font already has gets the first free numeric suffix from 2 (`Upper2`), and the imported code's references to a renamed class follow it; importing into a font with clashing names in the reference app would settle it.",
  "A feature whose tag the font already has is added as a second entry with that tag, because blocks of one tag add up in the feature-file language and a suffixed tag is not a tag; the same check would settle it.",
  "Each run of top-level statements other than class definitions and feature blocks becomes a prefix named Prefix, and a `# Prefix: name` comment names the prefix after it; importing a file with lookups and language systems in the reference app would settle it.",
  "Statements the split cannot place (a `useExtension` feature, an `anon` block, a class whose value is not a list) stay in a prefix as written rather than failing the import.",
]
observe = [
  "In F1 (Latin features), import a `.fea` file whose class and feature names already exist in the font: note how each clash is resolved.",
]

