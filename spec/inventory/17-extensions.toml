summary = "Newly installed scripts appear without relaunching once the Script menu is reloaded (hold Option, Script › Reload Scripts). FontCraft: the macros and modules folders are checked for changes when the app regains focus and every few seconds, and the Script menu is rebuilt; Reload Scripts forces it."
