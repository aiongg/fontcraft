  "console output area",
]
area = "extensions"
milestone = "M13"
summary = "Window with a console showing script and plug-in log output; in the reference it also runs ad-hoc Python (recalled, not stated in these chapters). FontCraft: a Command Console with command-id completion, parameter docs from the registry, history and a log pane; no Python."
ref = "Settings › Addons › Console Output"
status = "inferred"

# --- Plug-in kinds ---

[[behavior]]
id = "plugin.kind.reporter"
area = "extensions"
milestone = "M13"
summary = "Reporter plug-ins (.glyphsReporter) draw extra information in Edit View and each gets a Show … entry at the foot of the View menu that switches it. FontCraft: a live-reporter WebAssembly module receives read-only layer data and returns drawing primitives; each registers a view.show… toggle command at the end of the View menu."
ref = "Extensions › Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.kind.filter"
area = "extensions"
milestone = "M13"
summary = "Filter plug-ins (.glyphsFilter) process glyph layers and are listed in the Filter menu (and usable as export-time filter parameters). FontCraft: an object-filter WebAssembly module takes layer objects plus parameters and returns replacements; each registers a filter.* command, so it is in the Filter menu, the CLI, MCP and export filter strings alike."
ref = "Extensions › Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.kind.palette"
area = "extensions"
milestone = "M13"
summary = "Palette plug-ins (.glyphsPalette) add sections to the Palette sidebar (Window › Palette, Cmd+Shift+P). FontCraft: not a module kind at first; a module may declare a parameter form for its commands which the app renders as a palette section, without running custom UI code."
ref = "Extensions › Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.kind.fileFormat"
area = "import-export"
milestone = "M13"
summary = "File Format plug-ins (.glyphsFileFormat) add formats to open and export. FontCraft: not a module kind at first; formats are built in, and other formats are handled by external converters calling the CLI. Import/export modules may follow once the module interface is stable."
ref = "Extensions › Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.kind.tool"
area = "extensions"
milestone = "M13"
summary = "Tool plug-ins (.glyphsTool) add tools to the toolbar that extend Edit View. FontCraft: not supported as modules, since a pointer tool needs event handling and UI access the sandbox does not grant; new tools are contributed to the app itself."
ref = "Extensions › Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.kind.general"
area = "extensions"
milestone = "M13"
summary = "General plug-ins (.glyphsPlugin) cover anything the other five types do not. FontCraft: no catch-all kind; such needs are met by macros, by external programs on the control channel or MCP, or by proposing a new narrowly scoped module kind."
ref = "Extensions › Plug-ins"
status = "inferred"

# --- Installing and removing plug-ins ---

[[behavior]]
id = "plugin.loadedAtLaunch"
area = "extensions"
milestone = "M13"
summary = "Plug-ins are loaded once when the app starts, hence the relaunch after installing. FontCraft: modules are instantiated on install and on demand, and can be reloaded while documents are open."
ref = "Extensions › Plug-ins › Installing Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.requiresModules"
area = "extensions"
milestone = "M13"
summary = "A plug-in may depend on modules that have to be installed separately from the Modules tab. FontCraft: a module is a single self-contained .wasm file with a manifest; nothing else needs installing."
ref = "Extensions › Plug-ins › Installing Plug-ins"
status = "inferred"

[[command]]
id = "plugin.installFromFile"
label = "Install Plug-in from File"
menu = []
shortcut = ""
kind = "engine"
params = "{path: string}"
area = "extensions"
milestone = "M13"
summary = "A plug-in outside the catalogue is installed by dropping its bundle on the app's Dock icon; the app moves it into the Plugins folder. FontCraft: dropping a module file on the window, or calling this command with a path, validates the manifest, shows the requested capabilities and copies it into the modules folder."
ref = "Extensions › Plug-ins › Installing Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.pluginsFolder"
area = "extensions"
milestone = "M13"
summary = "Installed plug-ins live in a Plugins folder that sits beside the Scripts folder. FontCraft: a modules folder beside the macros folder in the per-user data directory."
ref = "Extensions › Plug-ins › Installing Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.noManualMove"
area = "extensions"
milestone = "M13"
summary = "Plug-ins must not be copied into the Plugins folder by hand because that conflicts with the operating system's security checks; installation has to go through the app. FontCraft: copying a file into the modules folder is allowed, but an unknown module stays disabled until the user approves its capabilities."
ref = "Extensions › Plug-ins › Installing Plug-ins"
status = "inferred"

[[behavior]]
id = "plugin.uninstall"
area = "extensions"
milestone = "M13"
summary = "Plug-ins from the manager are removed there; any plug-in can also be removed by deleting its file in the Plugins folder. FontCraft: both ways work, and deleting the file unregisters the module's commands at the next folder scan."
ref = "Extensions › Plug-ins › Installing Plug-ins"
status = "inferred"

# --- Authoring surface: SDK, APIs, external automation ---

[[behavior]]
id = "sdk.templates"
area = "extensions"
milestone = "M13"
summary = "The open-source Glyphs SDK supplies plug-in templates in two languages, Python and Objective-C, and plug-ins start from those. FontCraft: a module SDK with templates for the two module kinds (object filter, live reporter), Rust first, usable from any language that compiles to WebAssembly."
ref = "Extensions › Plug-ins › Creating Plug-ins"
status = "inferred"

[[behavior]]
id = "api.python"
area = "extensions"
milestone = "M13"
summary = "A documented Python API exposes the application and its font objects to scripts and plug-ins; the chapter refers to that documentation rather than listing the API. FontCraft: the API is the command registry itself, documented from the same metadata (id, params doc) for all surfaces; an optional thin Python client wraps the control channel outside the app."
ref = "Extensions › Scripts › Creating Scripts; Extensions › Plug-ins › Creating Plug-ins"
status = "inferred"

[[behavior]]
id = "api.objectiveC"
area = "extensions"
milestone = "M13"
summary = "A documented Objective-C API serves compiled plug-ins. FontCraft: the native counterpart is the module ABI, a small versioned interface that passes layer data and parameters into the sandbox and results back."
ref = "Extensions › Plug-ins › Creating Plug-ins"
status = "inferred"

[[behavior]]
id = "api.externalInterop"
area = "automation"
milestone = "M13"
summary = "The SDK also provides ways for a separate application to work with the running app. FontCraft: this is the primary model: the JSON control channel and the MCP server expose every command to other processes, with the same parameters as the UI."
ref = "Extensions › Plug-ins › Creating Plug-ins"
status = "inferred"

[[behavior]]
id = "api.openScriptingArchitecture"
area = "automation"
milestone = "M13"
summary = "The reference additionally answers the system's Open Scripting Architecture, so AppleScript or JavaScript can drive it. FontCraft: no OSA dictionary; the CLI and control channel serve the same purpose on every platform and can be called from those languages."
ref = "Extensions › Plug-ins › Creating Plug-ins"
status = "inferred"

[[behavior]]
id = "extensions.authoringDocs"
area = "extensions"
milestone = "M13"
summary = "Authors are pointed to API references, a scripting tutorial series, a plug-in writing tutorial, existing scripts as examples and the vendor's forum. FontCraft: generated command reference, module SDK guide with worked examples, and a porting table from common reference-API tasks to commands."
ref = "Extensions › Scripts › Creating Scripts; Extensions › Plug-ins › Creating Plug-ins"
status = "inferred"

[[behavior]]
id = "extensions.sandboxCapabilities"
area = "extensions"
milestone = "M13"
summary = "The chapter mentions no permission model for extensions beyond the operating system's check on installed plug-ins. FontCraft: a module gets no file, network or UI access by default and sees only the data passed to it; anything more is a declared capability the user approves at install time."
ref = "Extensions › Plug-ins"
status = "inferred"
