[[command]]
id = "pluginManager.install"
label = "Install"
menu = []
shortcut = ""
kind = "engine"
params = "{id: string, version?: string, index?: path, dataBase64?: string}"
area = "extensions"
milestone = "M13"
summary = "Downloads and installs the extension whose green Install button is clicked; plug-ins and modules become usable after a relaunch, scripts after reloading the Script menu. FontCraft: copies a module or macro named by an index entry into its folder after checking its size and SHA-256, and makes it usable at once, with no relaunch. The entry's file is read from a path (beside a local index), or downloaded over HTTPS by the desktop app and handed over as `dataBase64` (docs/plans/M13.md § 7 question 5); an installed copy is replaced."
ref = "Extensions › Plugin Manager"
status = "inferred"
guesses = [
  "An install from an index entry whose checksum does not match the downloaded bytes is refused and nothing is written; the reference's handling of a failed download is not documented.",
  "A macro installed from an index is saved in the Macros folder as `<id>.fcmacro`, so the listing and Remove find it by the entry's id; the reference's scripts keep their repository's file names.",
]

