# --- Modules ---

[[behavior]]
id = "extensions.modules"
area = "extensions"
milestone = "M13"
summary = "Modules are shared libraries (Python itself and Python packages) that some scripts and plug-ins depend on; they are installed from the Modules tab of the Plugin Manager and need a relaunch. FontCraft: no equivalent, because there is no embedded Python and each WebAssembly module is self-contained; shared functionality is exposed as commands instead."
ref = "Extensions › Scripts; Extensions › Plug-ins › Installing Plug-ins"
status = "inferred"

# --- Scripts and Macro Panel ---

[[behavior]]
id = "script.scope"
area = "extensions"
milestone = "M13"
summary = "Scripts are Python files that can automate every part of the app through its Python API. FontCraft: everything a script could do is a command, so a script is either a macro (a stored list of command invocations with parameters) or an external program in any language calling the CLI, control channel or MCP server."
ref = "Extensions › Scripts"
status = "inferred"

[[command]]
id = "script.run"
label = "(script name)"
menu = ["Script"]
shortcut = ""
kind = "engine"
params = "{script: path | name, args?: object}"
area = "extensions"
milestone = "M13"
summary = "Each installed script is a Script menu item; choosing it runs the script. FontCraft: each macro is a Script menu item and a command; running it dispatches its command list in order as one undo group and reports the first failing step."
ref = "Extensions › Scripts › Run Scripts"
status = "inferred"

