[[behavior]]
id = "pluginManager.automaticUpdates"
area = "extensions"
milestone = "M13"
summary = "Installed extensions are updated to newer versions automatically. FontCraft: when an index lists another version of an installed module, the update is installed when the indexes are read (`pluginManager.reloadIndexes`), as the handbook describes; turning automatic updates off for an index makes the Extension Manager only offer its updates."
ref = "Extensions › Plugin Manager"
status = "inferred"
notes = "FontCraft (M13.10): automatic updates are on for every index unless its line in the list starts with `manual `. An update keeps the module's on/off switch. Nothing is installed in safe mode. Updates whose files are on the network are downloaded and installed by the desktop app. Macros have no installed version, so only modules are updated. Documented in the handbook, not yet observed."
guesses = [
  "Automatic updates can be turned off per index, and are then offered with an Update button; the reference installs them automatically and does not say whether that can be turned off (open question in docs/spec/17-extensions.md).",
  "Any version other than the installed one counts as an update, so an index can also roll a module back; the reference's version comparison is not documented.",
]
observe = [
  "In Settings › Addons and the Plugin Manager, look for any switch that turns automatic extension updates off, globally or per extension.",
]

