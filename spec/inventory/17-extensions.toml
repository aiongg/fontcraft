# --- Scripts and Macro Panel ---

[[behavior]]
id = "script.scope"
area = "extensions"
milestone = "M13"
summary = "Scripts are Python files that can automate every part of the app through its Python API. FontCraft: everything a script could do is a command, so a script is either a macro (a stored list of command invocations with parameters, the same file as an action set) or an external program in any language calling the CLI, control channel or MCP server."
ref = "Extensions › Scripts"
status = "inferred"

[[command]]
id = "script.run"
label = "(script name)"
menu = []
shortcut = ""
kind = "engine"
params = "{macro: name | path | {title?, description?, args?, requires?, steps: [{command: id, params?: object}]}, args?: object, glyphs?: [name], layers?: [id] | \"active\" | \"visible\" | \"masters\", dryRun?: bool}"
area = "extensions"
milestone = "M13"
summary = "Each installed script is a Script menu item; choosing it runs the script. FontCraft: each macro in the macros folder is a Script menu item; script.run checks every step's command id and placeholders first, then runs the steps in order as one transaction and one undo step, and on the first failing step changes nothing and names the step. Arguments fill the macro's placeholders; the shell passes the Font View or Edit View selection as `glyphs`."
ref = "Extensions › Scripts › Run Scripts"
status = "inferred"
notes = "The command has no static menu item: the Script menu lists each macro of the Macros folder as an item that runs script.run with its path. Arguments the macro does not declare are refused, and steps are counted from 1 in error messages."
guesses = [
  "A macro runs as one undo step that is undone as a whole, like command.batch; the reference undoes script edits per glyph and does not say how a script's changes group.",
  "One top-level macro run executes at most 1,000,000 steps, the steps of the macros it runs included, and reads at most 256 MiB of macro files; past either it fails as a whole. Our own limit; no source describes one for scripts in the reference.",
]

