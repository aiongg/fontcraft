label = "Extension Manager"
menu = ["Window"]
shortcut = ""
kind = "ui"
params = "{tab?: \"extensions\"|\"indexes\"}"
area = "extensions"
milestone = "M13"
summary = "Opens the Plugin Manager window, the catalogue of installable scripts, plug-ins and modules. FontCraft: opens an Extension Manager listing WebAssembly modules and command macros from the registry index; every action in it is also a command."
ref = "Extensions › Plugin Manager"
status = "inferred"
notes = "FontCraft (M13.10): Window › Extension Manager. Opening it reloads the extension indexes (`pluginManager.reloadIndexes`); the desktop app downloads HTTPS indexes in the background and reloads again when they arrive. The Indexes tab holds the list of indexes until the Settings window exists (M14)."
guesses = [
  "The window and its menu item are called Extension Manager, since it lists modules and macros rather than plug-ins; the reference calls it Plugin Manager.",
]
observe = [
  "Open Window › Plugin Manager in the trial: note the window's default size, whether it is a separate window or a sheet, which filter buttons are selected at first, and whether the Window menu item has a shortcut.",
