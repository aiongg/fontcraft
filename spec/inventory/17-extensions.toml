# Inventory: Extensions
# Source: Glyphs 4 Handbook, chapter "Extensions" (https://handbook.glyphsapp.com/single-page/),
#         with the Macro Panel shortcut taken from its "Settings" chapter (Addons › Console Output).
# Date: 2026-10-07
# All wording is our own. Every summary first states what the reference offers and then, after
# "FontCraft:", proposes our equivalent (commands on CLI/MCP/control channel, sandboxed WebAssembly
# modules for object filters and live reporters, no embedded Python). Because each row carries such
# a proposal, every row is marked status = "inferred"; the part before "FontCraft:" is from the
# handbook section named in `ref`.

# --- Overview ---

[[behavior]]
id = "extensions.twoFamilies"
area = "extensions"
milestone = "M13"
summary = "The reference is extended by scripts (run on demand from a menu) and plug-ins (loaded at launch, adding menu entries, drawing, tools, palettes or formats); many are free through the Plugin Manager, others are sold elsewhere, and users can write their own. FontCraft: two layers replace both: the command registry driven from outside (CLI, JSON control channel, MCP) for automation, and sandboxed WebAssembly modules for code that must run inside the app."
ref = "Extensions (chapter introduction)"
status = "inferred"

[[behavior]]
id = "extensions.pythonBased"
area = "extensions"
milestone = "M13"
summary = "In the reference every script and the majority of plug-ins are Python, so a working Python must be chosen in Settings › Addons before they run. FontCraft: no interpreter is embedded; automation is written in any language against the command surfaces and in-app extensions are compiled to WebAssembly, so there is nothing to configure."
ref = "Extensions (chapter introduction)"
status = "inferred"

