status = "inferred"
notes = "FontCraft (M13.10): each entry shows its title, kind, version, vendor, description, size and SHA-256, a Website link and a Donate button when the index gives them, a Preview button when it has a screenshot, and Install, Update, Remove and an on/off switch for installed modules. A second tab, Indexes, lists the indexes with an automatic-updates switch each, the Modules and Macros folders, and a field to add an index."
