status = "handbook"

[[behavior]]
id = "color.fullColor.gradientReplacesFill"
area = "color"
milestone = "M11"
summary = "A path has either a solid fill or a gradient. Adding a gradient hides the Fill control; how a gradient is removed again is not documented."
