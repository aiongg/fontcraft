[[behavior]]
id = "color.export.colrToSvg"
area = "compile"
milestone = "M11"
summary = "A palette-layer font is converted to an SVG colour font per instance with three parameters: Color Layers to SVG checked, Color Palette for SVG set to the 0-based palette number whose colours are baked into the SVG, and Export SVG Table checked."
ref = "Color Fonts › COLR/CPAL Fonts › Exporting"
status = "handbook"
notes = "Neither oracle converts colour layers to SVG; nanoemoji's `untouchedsvg` output gives the document layout (one document per glyph, a group with the id `glyph<ID>` and a transform)."

[[behavior]]
id = "color.export.colorPaletteForSvg"
area = "compile"
milestone = "M11"
summary = "Color Palette for SVG picks which palette supplies the literal colours when palette layers are converted to SVG. It has an effect only together with Color Layers to SVG."
ref = "Appendix › Custom Parameters › Color Palette for SVG"
status = "handbook"

