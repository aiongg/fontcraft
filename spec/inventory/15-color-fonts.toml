[[behavior]]
id = "color.export.fullColorToColrV1"
area = "compile"
milestone = "M11"
summary = "Full-colour layers are compiled to COLR version 1 when any of them needs a gradient: consecutive paths with the same attributes become one layer glyph, each layer glyph a PaintGlyph over a PaintSolid, PaintLinearGradient or PaintRadialGradient (PaintSweepGradient for conic gradients), grouped by PaintColrLayers, with a clip box per glyph. Colours that are not palette references are added once to every palette, numbered in the colour glyphs' source order (before a glyph order parameter), and referenced there with their alpha in CPAL."
ref = "fontc fontbe/src/colr.rs, fontbe/src/cpal.rs; OpenType spec › COLR"
status = "docs"
notes = "Both oracles split runs of equal attributes and write the paints this way. Differences: fontc 1.0.0 reads full-colour attributes only on the master layer itself and ignores a separate Color layer (the usual case in the reference's files), which fontmake and FontCraft compile; fontmake adds each colour to the palettes again for every use and applies a translucent colour's alpha twice (in CPAL and in the paint), where FontCraft adds each colour once and applies its alpha once, as fontc does. Conic gradients and the extend modes come from the version 4 file format; neither oracle writes them. A master layer marked as full colour (how fontc's test sources store their paints) is read too, below the master's colour layers, as fontmake reads it. A full-colour glyph always gets layer glyphs `<base>.color<i>`; fontc paints the base glyph itself when the glyph has a single run. A palette reference's alpha goes into the paint; a colour of its own is an opaque paint over a CPAL row that holds its alpha."
guesses = [
  "A full-colour Color layer exports as COLR version 1 without any parameter, as both oracles do; the handbook names only SVG for these layers. Settled by exporting the full-colour test font from the reference with no parameters.",
  "A path on a full-colour layer with neither a fill colour nor a gradient, and not a stroke alone, is painted 50 % gray, the colour a new shape gets, and a fill or stroke colour with zero opacity paints nothing; fontc refuses such a path and fontmake strokes it 1 unit wide. Settled by exporting a full-colour path without paint attributes from the reference.",
]
observe = ["Full-colour font: export with no colour parameters and read it with fontTools; note whether COLR version 1, an SVG table or neither is written."]

[[behavior]]
id = "color.export.colrGlyphComponent"
area = "compile"
milestone = "M11"
summary = "A component on a full-colour layer whose glyph has full-colour layers of its own, and which has no fill colour or gradient, paints that glyph's colours: a PaintColrGlyph of the glyph, inside a PaintTranslate when the component is only moved and a PaintTransform for any other transform. It takes its own place in the layer list, is never merged with the shapes next to it and has no layer glyph; the layer glyphs after it are numbered as if it had one."
ref = "glyphsLib builder/color_layers.py and builder/glyph.py; fontTools otTables Paint.computeClipBox"
status = "inferred"
notes = "Follows fontmake (glyphsLib and ufo2ft) on a Glyphs source with such components: the referenced glyph gets a paint of its own in the BaseGlyphList even when it is one solid layer, so that the reference reaches it; the referencing glyph's clip box covers the referenced glyph's layer glyphs moved by the transform. fontc 1.0.0 writes no COLR for a Glyphs source whose colours are on Color layers rather than master layers, and follows a UFO's colour layer list, where glyphsLib's PaintColrGlyph is written as it is. A component of a glyph with only palette layers stays an outline, as glyphsLib keeps it. A reference that would lead back to its own glyph through such components, or nest more than 64 deep, or that names a glyph that does not export or paints nothing, is drawn as the component's outline in 50 % gray, with a warning. Edit View draws a reference as the referenced glyph's colour layers moved by the component's transform, following nested references, and falls back to the grey outline in the same cases; its fills count towards the referring glyph's drawing budget. The SVG table copies the referenced glyph's drawing into the referring glyph's document inside a group with the component's transform (documents are separate per glyph, so a `<use>` across them is not possible); a referenced glyph whose document comes from an svg layer has no drawing to copy, so the reference is its outline there, with a warning. Text Preview and Font View draw the compiled font, which follows it."
guesses = [
  "The reference app writes a component of a colour glyph as a PaintColrGlyph of that glyph, as glyphsLib does, rather than as its outline. Settled by exporting a full-colour glyph holding a moved component of another full-colour glyph from the reference and reading its COLR.",
  "Shapes keep their order on the layer: glyphsLib puts a layer's paths below its components, FontCraft keeps the order of the shapes, as fontc does for master layers. Settled by exporting a full-colour layer with a component below a path from the reference.",
  "A component whose transform differs between masters is written with the default master's transform; fontmake would write a variable transform. Settled by a variable full-colour font with a moved colour component in the reference.",
  "A component of a colour glyph that Remove Glyphs or Keep Glyphs leaves out is drawn as its outline in its own layer glyph, with a warning, rather than stopping the export. Settled by exporting such a font from the reference with the referenced glyph removed.",
  "Color Layers to SVG writes a component of a colour glyph as a copy of that glyph's drawing moved by the component's transform, as the COLR reference draws it. Settled by exporting the same font with Color Layers to SVG from the reference and reading the SVG document of the referring glyph.",
  "Copying referenced drawings into one SVG document stops after 65 536 paints, the limit Edit View draws with; the references met after that are drawn as their component's outline in grey, with a warning, rather than leaving the glyph without a document. Settled by exporting from the reference a glyph whose colour components nest and fan out to many thousands of copies with Color Layers to SVG.",
]
observe = ["Full-colour font: glyph A with a red square, glyph B whose Color layer holds a component of A moved by (100, 50); export and read COLR; note whether B's paint is a PaintTranslate around a PaintColrGlyph of A."]

[[behavior]]
id = "color.export.colrVersionChoice"
area = "compile"
milestone = "M11"
summary = "The compiler writes COLR version 0 when every colour glyph is a plain stack of solid palette-indexed layers and version 1 as soon as any glyph needs gradients or other paints. This is the rule fontc applies; the reference app's own rule is unconfirmed."
ref = "fontc fontbe/src/colr.rs"
status = "docs"
notes = "The two oracles differ. fontc 1.0.0 writes version 0 for full-colour layers with only solid fills and version 1 otherwise; fontmake writes version 1 for every full-colour glyph and version 0 only for palette layers. FontCraft follows fontc, because version 0 renders in more places; the difference from fontmake is listed in the M11 measures. The choice is made per glyph, as fontc makes it: in a version 1 table a glyph that is a stack of solid layers keeps version 0 base glyph and layer records, and only the other glyphs go into the BaseGlyphList. A palette reference with an alpha below 1 needs version 1, which has an alpha per paint."
guesses = [
  "Solid-only full-colour layers export as COLR version 0, as fontc does, not version 1 as fontmake does. Settled by exporting the full-colour test font with only solid fills from the reference.",
]
observe = ["Full-colour font with the gradient and stroke paths deleted (solid fills only): export and read COLR; note whether it is version 0 or version 1."]

[[behavior]]
id = "color.export.variableColr"
area = "color"
milestone = "M11"
summary = "In a variable font, gradient geometry and colour stops of full-colour layers that differ between masters become variable COLR paints (PaintVarLinearGradient and the other Var formats) with a DeltaSetIndexMap and an ItemVariationStore; palette-layer outlines vary through the layer glyphs' own variations. Static instances between masters interpolate the colour layers like the master layers."
ref = "Color Fonts"
status = "docs"
own = true
notes = "fontmake 3.12.1 writes variable COLR for fontc's test source COLRv1-var (one region, PaintVarLinearGradient, no clip list); fontc 1.0.0 writes it static. The handbook is silent (open question 21). FontCraft follows fontmake: the k-th palette or full-colour layer of a master matches the k-th of the default master, and layer glyph i of a master's paint matches layer glyph i of the default's (both oracles match by position). A number of a paint or colour stop that differs between the masters gets a delta set in the ItemVariationStore and makes the paint its Var form, with one DeltaSetIndexMap entry per number of the paint (0xFFFFFFFF for those that do not vary), placed as fontTools places them; a glyph whose paints vary is written with version 1 paints even when it is a stack of solid layers. Layer glyphs become glyphs of the font before the outlines, with one layer per master, so gvar varies them; an intermediate palette layer becomes an intermediate layer of the layer glyph whose n-th occurrence of its palette row it is at its location, as fontc and glyphsLib pair them. A variable COLR has no clip list, as fontmake writes it. A static instance between masters interpolates its colour layers like master layers (intermediate palette layers included) and mixes their paint attributes with the master weights."
guesses = [
  "Gradient geometry and stop colours vary when they differ between masters, as fontmake writes them. Settled by exporting the two-master palette font and a two-master gradient font as variable fonts from the reference.",
  "A master whose colour layers differ from the default master's in kind, count, palette rows, colours of their own or stop counts leaves the glyph's paints static towards that master, with a warning, and its layer glyph outlines take the default master's there; fontmake refuses such a font. Settled by exporting a variable font from the reference with one master missing a colour layer.",
  "A layer glyph whose layers are not compatible between the masters keeps the default master's outline everywhere, with a warning. Settled by exporting a variable font from the reference whose colour layers differ in point count between the masters.",
  "A variable font is written without sbix, SVG and CBDT tables, with a warning. Settled by exporting a two-master iColor font and a two-master svg-layer font as variable fonts from the reference.",
  "An interpolated static instance takes the origin master's iColor and svg layers, with a warning naming the master. Settled by exporting an instance between the masters of a two-master iColor font from the reference.",
  "The paint attributes of an interpolated instance's colour layers (colours, gradient positions and stops) are mixed with the master weights when every master with a weight has the layer; otherwise they are the heaviest master's. Settled by exporting an instance halfway between two masters whose gradient positions differ.",
]
observe = ["Two-master palette font: export a variable font and read COLR; note whether it has a variation store or Var paints, or is static."]

[[behavior]]
id = "color.export.strokeInColr"
area = "compile"
milestone = "M11"
summary = "COLR has no stroke paint, so a stroked path on a full-colour layer must be expanded to an outline (respecting width and alignment) before it can be a COLR layer, while SVG can keep it as a stroke. Our design; the reference's handling is unknown."
ref = "OpenType spec › COLR"
status = "inferred"
own = true
notes = "fontc 1.0.0 refuses a stroked colour path; fontmake outlines centred strokes with butt caps and miter joins and refuses other stroke positions. FontCraft expands every stroke with its own stroke code, position, caps and joins included, so it goes beyond both."
guesses = [
  "A stroke becomes its own layer glyph painted in the stroke colour, above the path's fill, expanded with the path's stroke position, caps and joins. Settled by exporting the full-colour test font from the reference.",
]

