status = "handbook"
notes = "A gradient is removed with `attributes.removeGradient`, which restores the fill the path had."

[[behavior]]
id = "color.fullColor.gradientTypes"
area = "color"
milestone = "M11"
summary = "The chapter describes two gradient types, linear and radial, each with at least two colour stops. The Glyphs 4 file format additionally defines a conic gradient and an extend mode, which the chapter does not mention."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient; GlyphsSDK GlyphsFileFormatv4.md › gradient"
status = "handbook"
observe = ["Full-colour font: look in the Attributes inspector for conic gradients and for extend modes (pad, repeat, reflect); note whether any UI offers them."]

[[behavior]]
id = "color.fullColor.gradientCanvasKnobs"
area = "color"
milestone = "M11"
summary = "While a path with a gradient is selected, Edit View shows draggable knobs for the gradient geometry: two for a linear gradient (start and end), one for a radial gradient (its origin)."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient"
status = "handbook"

[[behavior]]
id = "color.fullColor.imageOnlyEffects"
area = "color"
milestone = "M11"
summary = "Shadow, Inner Shadow and Pattern Image cannot be written to SVG. Only Filter › Glyph as Image respects them, in its PNG and PDF output; font export ignores them."
