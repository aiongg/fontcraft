summary = "Exporting a layered colour font writes one plain, colourless font file per instance, that is per colour layer; the user stacks and colours them in the layout application. No colour table is written."
ref = "Color Fonts › Layered Color Fonts › Exporting"
status = "handbook"

[[behavior]]
id = "color.layered.toSvg"
area = "compile"
milestone = "M11"
summary = "An extra instance with both Color Layers to SVG and Export SVG Table checked exports a single font whose SVG table holds all colour masters stacked, each drawn in its Master Color."
ref = "Color Fonts › Layered Color Fonts › Exporting; Appendix › Custom Parameters › Color Layers to SVG"
status = "handbook"
guesses = [
  "The SVG document stacks the masters as Color Layers to COLR does, each filled with its Master Color, opacity included. Settled by exporting the layered test font with Color Layers to SVG from the reference.",
]
observe = ["Layered font: export an instance with Color Layers to SVG and read the SVG table; note the paint order, the master whose outline becomes the fallback glyph, and the colours used."]

[[behavior]]
id = "color.layered.toColr"
area = "compile"
milestone = "M11"
summary = "Color Layers to COLR on an instance converts a layered setup into CPAL and COLR tables in one font, with colours read off every master carrying a Master Color parameter. Documented in the appendix only, not in the chapter."
ref = "Appendix › Custom Parameters › Color Layers to COLR"
status = "handbook"
guesses = [
  "The masters with a Master Color become palette layers of one glyph in master order, the last master at the bottom and the first on top (as Edit View stacks them), each in a palette entry made from its Master Color; the fallback outline is the instance's own master. Settled by exporting the layered test font with Color Layers to COLR from the reference.",
  "The Master Colors become palette rows after the font's own palettes, the same rows in every palette, numbered in the order the layers first use them; without palettes they are the one palette. Settled by reading CPAL of the layered test font exported from the reference.",
  "A glyph that has palette or full-colour layers of its own keeps them; only glyphs without such layers are converted from the masters, and a master layer without outlines adds no layer. Settled by exporting a layered font in which one glyph also has palette layers.",
]
notes = "Master Color is read as the text `R,G,B,A` or `R,G,B` with components from 0 to 255, as a list of such numbers, or as `#RRGGBB(AA)`; a value that is not a colour leaves its master out, with a warning. Components of other masters are drawn with that master's outlines, so their layer glyphs are written as outlines."

# ───────────────────────────── Behaviours: palettes and palette layers (CPAL + COLR v0) ─────────────────────────────
observe = ["Layered font: export an instance with Color Layers to COLR and read COLR and CPAL; note the paint order, the master whose outline becomes the fallback glyph, and the colours used."]

[[behavior]]
id = "color.palette.fontLevelParameter"
area = "color"
milestone = "M11"
summary = "Palettes are stored on the font as the Color Palettes custom parameter, added in Font Info › Font: a list of palettes, each a list of colours. It is the source of the CPAL table."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"

[[behavior]]
id = "color.palette.indexFromZero"
area = "color"
milestone = "M11"
summary = "Colours are addressed by a colour index that counts up from 0, and palettes by a palette number that also starts at 0 and is shown in the column header of the editor."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"

[[behavior]]
id = "color.palette.multiplePalettes"
area = "color"
milestone = "M11"
summary = "A font may define several palettes. They share the same colour indices (one row per index, one column per palette), so every palette has the same number of entries, as CPAL requires."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"
notes = "M13.65: the palette names, background styles (light, dark) and colour names of the version 4 Color Palettes form are written to CPAL version 1 as palette types, palette labels and palette entry labels, each label a name ID above the font's other names; without any of them CPAL stays version 0. M13.65b: opening a compiled font reads palette types and labels back into the version 4 form (`color.open.compiledColorTables`); saving as `.glyphs` version 2 or 3 or as UFO keeps only the colours and reports the names and background styles as lost (`Color Palettes`). `color.describeExport` reports the CPAL version, each palette's type and label and the number of named colours."
guesses = [
  "CPAL is version 1 only when a palette has a name or a background style or a colour has a name, and version 0 otherwise, as both reference compilers write it; a font the reference exports from a version 4 file with named palettes would settle it.",
]

[[behavior]]
id = "color.palette.perMaster"
area = "color"
milestone = "M11"
summary = "A master may carry its own Color Palettes parameter, which replaces the font's palettes for that master's colour layers and for exports from it."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "docs"
notes = "Not in the handbook. fontc's test source COLRv0-palette-redefinition has a master-level Color Palettes, and both fontc 1.0.0 and fontmake 3.12.1 let it win over the font's value. The palette commands take `master` to read or edit a master's own palettes."
guesses = [
  "A palette command given `master` edits that master's own Color Palettes, and creates it from the font's palettes when the master has none. Settled by checking whether the reference offers the palette editor on a master's Color Palettes and what it starts with.",
]

[[behavior]]
id = "color.palette.editorIsTransactional"
area = "color"
milestone = "M11"
summary = "Changes in the palette editor take effect only on OK; Cancel throws all of them away. In FontCraft the editor therefore produces one undoable change."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
notes = "Built in M11.15: OK runs the staged edits as one `command.batch`, one undo step; Cancel leaves the font as it was. Documented, not yet observed."
status = "handbook"
observe = ["Palette font: make several edits in the Color Palettes editor and press Cancel; note whether the palettes are unchanged and whether anything appears in Undo."]

[[behavior]]
id = "color.paletteLayer.naming"
area = "color"
milestone = "M11"
summary = "A Color Palette layer is labelled with the word Color followed by its colour index (Color 0, Color 1, …). In the Glyphs file format the index is the layer attribute colorPalette, an integer or \"*\"."
ref = "Color Fonts › COLR/CPAL Fonts › Color Palette Layers; GlyphsSDK GlyphsFileFormatv3.md › layerAttr"
status = "handbook"
notes = "Glyphs 2 files have no layer attribute: a layer named `Color n` or `Color *` is a palette layer (glyphsLib reads the same names), and the name is what is written back."

[[behavior]]
id = "color.paletteLayer.foregroundColor"
area = "color"
milestone = "M11"
summary = "The asterisk choice means the colour the font user sets for the text. The editor previews it in black, or in white under dark appearance; in the Glyphs format and in COLR it is palette index 0xFFFF."
ref = "Color Fonts › COLR/CPAL Fonts › Color Palette Layers; GlyphsSDK GlyphsFileFormatv3.md › layerAttr"
status = "handbook"

[[behavior]]
id = "color.paletteLayer.freeAssignment"
area = "color"
milestone = "M11"
summary = "Within a glyph several layers may use the same colour index, and palette colours may go unused. Glyphs need not have the same number of colour layers; one glyph may have a single layer, another several per colour."
ref = "Color Fonts › COLR/CPAL Fonts › Color Palette Layers"
status = "handbook"

[[behavior]]
id = "color.paletteLayer.belongsToMaster"
area = "color"
milestone = "M11"
summary = "Colour layers are special layers attached to a master and listed indented under it; each master of a glyph has its own set."
ref = "Palette › Layers › Special Layers; Color Fonts › COLR/CPAL Fonts › Color Palette Layers"
status = "handbook"

[[behavior]]
id = "color.fallback.masterLayerColr"
area = "compile"
milestone = "M11"
summary = "For a glyph with palette layers the master layer is the fallback: its outline is what the base glyph contains, shown by software without COLR support and never shown where COLR is supported. The master layer should therefore hold a sensible one-colour version of the glyph."
ref = "Color Fonts › COLR/CPAL Fonts › Master Layer as Fallback"
status = "handbook"

[[behavior]]
id = "color.export.colrFromPaletteLayers"
area = "compile"
milestone = "M11"
summary = "If glyphs have Color Palette layers, export writes CPAL and COLR: each palette layer becomes an unencoded layer glyph named after its base glyph with `.color` and its position among the palette layers (`A.color0`, `A.color1`, …), and the base glyph's COLR version 0 record lists those layer glyphs with their palette indices, the first layer in the file first (painted at the bottom). Identical layers of different glyphs are not shared."
ref = "Color Fonts › COLR/CPAL Fonts; fontc fontbe/src/colr.rs"
status = "handbook"
notes = "Naming, order and the absence of sharing are what fontc 1.0.0 and fontmake 3.12.1 both write (M11 planning pass, the fontc colour test sources and a probe with two identical glyphs); the reference's own output is not observed. Layer glyphs follow the source glyphs in the glyph order, numbered numerically (`B.color2` before `B.color10`), as fontc orders them; fontmake sorts them as strings. A layer glyph is named from the base glyph's production name, as fontc does. As fontc writes them (its `glyphs2fontir/src/toir.rs`): a palette layer without paths or components makes no layer glyph; intermediate colour layers are not layers of their own; a layer glyph keeps the layer's components and takes the colour layer's advance, which for a mark is not the zero advance its base glyph gets. Unlike fontc, a layer glyph carries no anchors, as fontmake writes it. A UFO's font-wide `com.github.googlei18n.ufo2ft.colorLayers` list opens as palette layers that each hold one unmoved component of the listed glyph; where that glyph is named `<base>.color<i>` (the name a new layer glyph would get), the layer record points at it and no glyph is made, as both oracles write such a UFO. In a variable font, layer glyphs the source does not have become glyphs of the font before the outlines, so they vary as any glyph does (`color.export.variableColr`)."
guesses = [
  "The first palette layer in the file paints at the bottom, as both oracles write it. Settled by exporting the palette test font from the reference and comparing its layer records with the Layers palette order.",
]
observe = [
  "Palette font: export the default instance and read it with fontTools; note the COLR version, the layer record order against the Layers palette order, the layer glyph names, whether B's layer shares A's layer glyph, and the CPAL version, labels and types.",
]

[[behavior]]
id = "color.export.defaultPalette"
area = "compile"
milestone = "M11"
summary = "Without further parameters an instance exports with the first palette (number 0)."
ref = "Color Fonts › COLR/CPAL Fonts › Exporting"
status = "handbook"
notes = "Neither oracle reads the instance colour parameters; both write the palettes in their stored order, palette 0 first."

[[behavior]]
id = "color.export.colorPaletteForCpal"
area = "compile"
milestone = "M11"
summary = "Color Palette for CPAL on an instance holds a palette number (0-based) and makes that palette the one the instance's CPAL table uses. Whether the other palettes are still written after it is not documented."
ref = "Color Fonts › COLR/CPAL Fonts › Exporting; Appendix › Custom Parameters › Color Palette for CPAL"
status = "handbook"
guesses = [
  "Every palette is written, with the chosen palette moved to position 0, so the font keeps its alternatives and renders the chosen one by default. Settled by exporting the palette test font with Color Palette for CPAL = 1 from the reference.",
  "A palette number the font does not have leaves the palettes in their stored order, with an export warning. Settled by exporting the palette test font with Color Palette for CPAL = 5 from the reference.",
]
notes = "Neither oracle reads the parameter; fontmake ignores it on instances and fontc warns that it is unknown."
observe = ["Palette font: export an instance with Color Palette for CPAL set to 1 and read CPAL; note whether one palette or both are written, and in which order."]

[[behavior]]
id = "color.export.exportColrTableOff"
area = "compile"
milestone = "M11"
summary = "Export COLR Table added to an instance and unchecked strips all colour from that instance: neither CPAL nor COLR is written and only the fallback outlines remain."
