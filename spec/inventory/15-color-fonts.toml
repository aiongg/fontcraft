[[behavior]]
id = "color.export.sbixAutomatic"
area = "compile"
milestone = "M11"
summary = "An sbix table is written automatically whenever the font contains iColor layers: one strike per distinct pixel size, holding each glyph's image for that size. Placed images on ordinary layers are not exported."
ref = "Color Fonts › sbix Fonts › Exporting; Edit View › Images › Adding Images"
status = "handbook"
notes = "Neither oracle builds sbix (both ignore `sbixSize` layers silently) and no corpus source has an iColor layer; nanoemoji's sbix output gives the table layout (version 1, flags 1, 72 pixels per inch). write-fonts' sbix types leave the strike layout to the caller, so FontCraft serialises the table itself."
guesses = [
  "A glyph whose image file is missing at export is left out of that strike, with a warning naming the glyph and the file. Settled by exporting the sbix test font from the reference with one file moved away.",
  "The origin offsets are the bottom-left corner of the image's box on the iColor layer, in strike pixels from the glyph origin, rounded; the advance width comes from the master layer. Settled by reading sbix from the reference export of a glyph whose image was moved.",
  "The whole image file is written; a crop set on an iColor layer's image is not applied. Settled by cropping an image on an iColor layer in the reference and exporting.",
]
observe = ["sbix font: export with no colour parameters and read the result; note whether sbix is written, the origin offsets, and what happens to a glyph whose image file is missing."]

