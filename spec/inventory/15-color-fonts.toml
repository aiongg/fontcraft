# Source: Glyphs 4 Handbook, chapter "Color Fonts" (https://handbook.glyphsapp.com/color-fonts/),
#   read from the converted chapter text 15-color-fonts.txt.
# Cross-checked for terminology only against:
#   - Glyphs 4 Handbook, Appendix › Custom Parameters (parameter names and value types)
#   - GlyphsSDK/GlyphsFileFormat/GlyphsFileFormatv3.md and v4.md (layer attribute keys)
#   - fontations: read-fonts 0.45.0, write-fonts 0.54.0 (colour table coverage)
#   - fontc: fontbe/src/colr.rs, fontbe/src/cpal.rs (how Glyphs colour layers map to COLR v0 / v1)
# Date: 2026-10-07
#
# Notes for readers of this file:
#   - Custom parameters named here (Color Palettes, Master Color, Export COLR Table, …) are owned
#     as [[parameter]] rows by the Appendix inventory; this file only records what each one does to
#     colour output, as [[behavior]] rows with ids under `color.export.*` and `color.*`.
#   - Commands that belong to other chapters (window.palette Cmd+Alt+P, view.showInfo Cmd+Shift+I,
#     glyph.addImage, the Font Info axis / master / instance commands) are referenced, not redefined.
#   - Layer-type items live in the Layers palette context menu, so their `menu` is [].

# ───────────────────────────── Commands: colour palettes ─────────────────────────────

[[command]]
id = "colorPalette.edit"
label = "Edit Color Palettes"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "color"
milestone = "M11"
summary = "Opens the palette editor for the font-level Color Palettes parameter; in the reference this happens when the parameter's value cell is clicked in Font Info › Font. Edits made in the editor are applied to the font only when it is confirmed with OK."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
notes = "Built in M11.15. Opens the editor (`dialog.colorPalettes`) on the font's palettes with optional staged `edits`; OK runs them as one `command.batch`. Font Info does not open it from the parameter's value yet. Documented, not yet observed."
guesses = [
  "The editor edits the font-level Color Palettes only; a master's own palettes are edited with the colorPalette commands and their `master` parameter. Settled by clicking a master's Color Palettes value in the reference.",
]
status = "handbook"

[[command]]
id = "colorPalette.list"
label = "List Color Palettes"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id}"
area = "color"
milestone = "M11"
summary = "Query: returns every palette of the font as an ordered list of RGBA colours, with palette numbers and colour indices both counting from 0. Headless counterpart of reading the palette editor; our addition."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "inferred"
own = true

[[command]]
id = "colorPalette.addColor"
label = "Add Color"
menu = []
shortcut = ""
kind = "engine"
params = "{color?: \"#RRGGBBAA\", colors?: [\"#RRGGBBAA\" per palette], master?: id}"
area = "color"
milestone = "M11"
summary = "Appends one colour entry to the palette table (the plus button of the editor); the new entry takes the next free colour index. The source does not state the initial colour of a new entry or how it is filled in the other palettes, so the defaults here are ours."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"
guesses = [
  "A new row is opaque black (#000000FF) in every palette unless `color` or `colors` is given. Settled by pressing plus in the reference's palette editor.",
]
observe = ["Palette font: in Font Info › Font, open the Color Palettes editor and press plus; note the colour of the new row in each of the two palettes."]

[[command]]
id = "colorPalette.removeColor"
label = "Remove Color"
menu = []
shortcut = ""
kind = "engine"
params = "{index: int, master?: id}"
area = "color"
milestone = "M11"
summary = "Deletes one colour row from every palette (the minus button of the editor). Layers that use a higher index are renumbered down by one in the same step, so they keep their colour; while any layer uses the row itself, the command is refused with a message naming the glyphs."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"
guesses = [
  "Removing a row renumbers the layers that use higher rows and refuses while a layer uses the row. Settled by removing a used row in the reference's editor and reading the layers afterwards.",
  "Palette colours of shapes (fills, strokes, gradient stops, shadows) count as uses of a row and are renumbered with the palette layers. Settled by removing a row a full-colour layer's gradient uses in the reference's editor.",
  "The last colour row can be removed, which leaves every palette empty. Settled by removing every colour in the reference's editor.",
  "Palette colours of shapes in a layer's background count as uses of a row too: they hold it and are renumbered with the foreground. Settled by removing a row only a background shape uses in the reference's editor.",
]
observe = [
  "Palette font: in the Color Palettes editor remove row 1, which a palette layer of A uses, and press OK; note whether A's layers are renumbered, left pointing at the old index, or the removal is refused.",
]

[[command]]
id = "colorPalette.setColor"
label = "Set Palette Color"
menu = []
shortcut = ""
kind = "engine"
params = "{palette?: int = 0, index: int, color: \"#RRGGBBAA\", master?: id}"
area = "color"
milestone = "M11"
summary = "Changes one entry of one palette to a new colour; in the editor this is done by clicking the entry's swatch and choosing a value in the colour picker."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"

[[command]]
id = "colorPalette.addPalette"
label = "Add Palette"
menu = []
shortcut = ""
kind = "engine"
params = "{copyFrom?: int, master?: id}"
area = "color"
milestone = "M11"
summary = "Adds another palette (a new column in the editor) so the font carries several alternative colour sets; reached from the gear menu of the editor. The palette gets the next number, counting from 0; what colours a new palette starts with is not documented."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"
guesses = [
  "A new palette is a copy of palette 0 (`copyFrom` defaults to 0). Settled by Add Palette in the reference's editor.",
]
observe = ["Palette font: in the Color Palettes editor choose Add Palette from the gear menu; note the new palette's colours (a copy of palette 0, all black, or empty)."]

[[command]]
id = "colorPalette.removePalette"
label = "Remove Palette"
menu = []
shortcut = ""
kind = "engine"
params = "{palette: int, master?: id}"
area = "color"
milestone = "M11"
summary = "Removes one palette column; in the editor it is offered after clicking that palette's column heading. Whether the last remaining palette can be removed is not documented."
ref = "Color Fonts › COLR/CPAL Fonts › Defining the Color Palette"
status = "handbook"
guesses = [
  "The last remaining palette cannot be removed; the command is refused. Settled by removing every palette in the reference's editor.",
]

# ───────────────────────────── Commands: colour layer types ─────────────────────────────
observe = ["Palette font: in the Color Palettes editor remove every palette but one, then try to remove the last palette and its last colour; note whether either can be removed."]

[[command]]
id = "layer.convertToColorPalette"
label = "Color Palette"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id, index?: int | "*"}'
area = "color"
milestone = "M11"
summary = "Turns a layer (normally one just added with the Layers palette plus button) into a Color Palette layer that paints its outlines in one palette colour. Chosen from the context menu of the layer entry; the layer is then labelled Color plus its colour index."
ref = "Color Fonts › COLR/CPAL Fonts › Color Palette Layers"
status = "handbook"
notes = "Built in M11.3. Converting replaces any other colour kind and gives the layer its master layer's width. Documented, not yet observed."
guesses = [
  "Without `index` the layer gets colour index 0, and a layer that already is a palette layer keeps its index. Settled by choosing Color Palette on a new layer in the reference.",
  "A master layer cannot become a colour layer, and converting a colour layer to another kind replaces its kind. Settled by the Layers palette context menu on a master layer and on a colour layer.",
]
context = [
  "layers.row",
]
observe = ["Palette font: add a layer, choose Color Palette from its context menu, then another colour kind; note whether the later kind replaces the Color Palette kind or the choice is refused."]

[[command]]
id = "layer.setColorPaletteIndex"
label = "Set Palette Color of Layer"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id, index: int | "*"}'
area = "color"
milestone = "M11"
summary = "Assigns a palette colour to a Color Palette layer: either a colour index from the Color Palettes parameter or the asterisk, which stands for the text colour chosen by the font user. Done from the swatch at the right of the layer name; the layer name follows the new index."
ref = "Color Fonts › COLR/CPAL Fonts › Color Palette Layers"
status = "handbook"
notes = "Built in M11.3. Refused on a layer that is not a Color Palette layer. Documented, not yet observed."
guesses = [
  "The headless command accepts any index up to 65,533, also one beyond the rows of the font's palettes, so layers can be set up before the palettes grow. Settled by opening a file whose colorPalette index is beyond its palettes in the reference.",
]

[[command]]
id = "layer.convertToIColor"
label = "iColor"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id, size?: int}'
area = "color"
milestone = "M11"
summary = "Turns a layer into an iColor layer, the bitmap layer type that feeds the sbix table; chosen from the context menu of the layer entry. The layer carries a pixel size and is labelled iColor plus that size; the default size of a fresh iColor layer is not documented."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs"
status = "handbook"
notes = "Built in M11.3. Without `size` a layer that already is an iColor layer keeps its size. Documented, not yet observed."
guesses = [
  "Without `size` a new iColor layer gets 128 pixels per em. Settled by the label of a new iColor layer in the reference.",
]
context = [
  "layers.row",
]
observe = ["sbix font: add a new iColor layer; note the default size shown in its label."]

[[command]]
id = "layer.setIColorSize"
label = "Set iColor Size"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id, size: int}'
area = "color"
milestone = "M11"
summary = "Changes the pixel size of an iColor layer; in the UI by double-clicking the layer entry and editing the number. The size is the strike's pixels-per-em, so raising it above the image's own resolution makes the image draw smaller and lowering it makes the image draw larger."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs"
status = "handbook"
notes = "Built in M11.3. Refused on a layer that is not an iColor layer, and when the rescaled image would be scaled to 0 or beyond the coordinate limit. Documented, not yet observed."
guesses = [
  "The layer's placed image is rescaled about its bottom-left corner so it keeps unitsPerEm ÷ size units per pixel. Settled by the size change in the observe step.",
]
observe = ["sbix font: double-click an iColor layer entry and type 256; note the new label and whether the image is drawn half as large as at 128."]

[[command]]
id = "layer.setIColorImage"
label = "Set iColor Image"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id, path: string}'
area = "color"
milestone = "M11"
summary = "References a PNG, JPEG or TIFF file as the image of an iColor layer and positions it using the bounding box of the master layer's paths. The chapter does not name the gesture (the general image commands, drag-and-drop or Glyph › Add Image, are assumed), so this explicit headless form is ours."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs"
status = "inferred"
notes = "Built in M11.3. Takes a .png, .jpg, .jpeg, .tif or .tiff path and stores it as Add Image does: relative to the document's folder, absolute in a document never saved (a relative path taken from the working directory). The file is not read. Refused on a layer that is not an iColor layer."
own = true
guesses = [
  "Only the master layer's paths set the bounds, not its components. Settled by dropping an image on an iColor layer of a glyph made of components in the reference.",
  "The image is placed with its bottom-left corner at the bottom-left of the master layer's path bounds (the origin when the master layer has no paths) and scaled to unitsPerEm ÷ size units per pixel, so the iColor size alone sets its scale. Settled by dropping an image on an iColor layer in the reference.",
]
observe = ["sbix font: drop E 64.png on the iColor 64 layer of E; note where the image lands relative to the two corner paths and whether it fills their box."]

[[command]]
id = "layer.convertToSvg"
label = "svg"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id}'
area = "color"
milestone = "M11"
summary = "Turns a layer into an svg layer, which holds one referenced SVG document that is written to the SVG table for this glyph; chosen from the context menu of the layer entry."
ref = "Color Fonts › SVG Color Fonts › Importing Existing SVG Files"
status = "handbook"
notes = "Built in M11.3. Documented, not yet observed."
context = [
  "layers.row",
]

[[command]]
id = "layer.setSvgImage"
label = "Set SVG Image"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id, path: string}'
area = "color"
milestone = "M11"
summary = "References an SVG file as the artwork of an svg layer; in the UI the file is dragged onto the layer. The file is linked by path, not embedded, and can afterwards be moved and scaled like any placed image."
ref = "Color Fonts › SVG Color Fonts › Importing Existing SVG Files"
status = "handbook"
notes = "Built in M11.3. Takes an .svg path and stores it as Add Image does: relative to the document's folder, absolute in a document never saved (a relative path taken from the working directory). The file is not read. Refused on a layer that is not an svg layer. Documented, not yet observed."
guesses = [
  "The SVG's viewBox is placed with its bottom-left corner at the layer origin, one SVG user unit per font unit, y pointing up. Settled by dropping an SVG file on an svg layer in the reference.",
]
observe = ["SVG font: drop F.svg on the svg layer of F; note where the viewBox lands and at which scale."]

[[command]]
id = "layer.convertToColor"
label = "Color"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id}'
area = "color"
milestone = "M11"
summary = "Turns a layer into a full-colour layer, labelled Color and marked with a colour-spectrum disc, on which each path carries its own fill, stroke or gradient. Chosen from the context menu of the layer entry."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs"
status = "handbook"
notes = "Built in M11.3. Documented, not yet observed."
context = [
  "layers.row",
]
observe = ["Palette font: open the context menu of a master layer in the Layers palette; note whether the colour layer kinds are offered for it."]

[[command]]
id = "layer.listColorLayers"
label = "List Color Layers"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], master?: id}"
area = "color"
milestone = "M11"
summary = "Query: for each glyph returns its colour layers with type (palette, iColor, svg, full colour), palette index or pixel size, referenced image path and whether that file exists. Our addition so agents can audit a colour setup without the Layers palette."
ref = "Color Fonts"
status = "inferred"
notes = "Built in M11.3. Without `glyphs` it lists every glyph with a colour layer; `exists` asks the document's asset store."
own = true

# ───────────────────────────── Commands: path attributes on full-colour layers ─────────────────────────────

[[command]]
id = "attributes.addAttribute"
label = "Add Attribute"
menu = []
shortcut = ""
kind = "engine"
params = '{glyph: name, layer: id, shapes?: [index], attribute: "gradient" | "shadow" | "innerShadow" | "patternImage", blur?: number, offset?: [x, y], color?: "#RRGGBBAA", image?: path, type?, stops?, extend?}'
area = "color"
milestone = "M11"
summary = "Adds a further style control to the selected paths from the plus button beside the Attributes heading. Gradient is exportable; Shadow, Inner Shadow and Pattern Image only affect PNG/PDF output from Filter › Glyph as Image and are never written to a font."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app. A Pattern Image path longer than 4,096 bytes or holding a control character is refused, as the colour layers' image paths are."
guesses = [
  "Shadow and Inner Shadow have blur, offset and colour fields, as the file format stores them; Pattern Image has an image reference. Settled by adding each in the reference's inspector.",
  "A new Shadow or Inner Shadow is black at 50 % opacity with blur 10 and offset (10, −10) font units; Pattern Image keeps only a file reference, in a FontCraft key. Settled by adding each in the reference and reading the saved file.",
]
observe = ["Full-colour font: add Shadow, Inner Shadow and Pattern Image to a path; note the controls each one shows."]

[[command]]
id = "attributes.setStrokeWidth"
label = "Set Stroke Width"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], width: number | null}"
area = "color"
milestone = "M11"
summary = "Sets the stroke width of the selected paths in font units, from the field beside the Stroke heading. An empty field counts as 0, which means no visible stroke."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Stroke"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "A stroke added to a path without one is opaque black. Settled by entering a stroke width in the reference's Attributes inspector.",
]
observe = ["Full-colour font: give a path a stroke width in the Attributes inspector; note the default stroke colour."]

[[command]]
id = "attributes.setStrokeAlignment"
label = "Set Stroke Alignment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], alignment: \"center\" | \"inside\" | \"outside\"}"
area = "color"
milestone = "M11"
summary = "Chooses where the stroke sits relative to the path: centred on it (the default), inside the shape or outside it. The inspector's left and right buttons are inside and outside; the file format stores the choice as the stroke position."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Stroke"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "The left button is inside and the right button outside, for paths in the usual direction. Settled by choosing each in the reference and reading `strokePos` in the saved file.",
]
observe = ["Full-colour font: on a counter-clockwise path with a stroke, choose left, then right stroke alignment; note which side the stroke moves to and the strokePos value saved in the file."]

[[command]]
id = "attributes.setStrokeColor"
label = "Set Stroke Color"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], color: \"#RRGGBBAA\"}"
area = "color"
milestone = "M11"
summary = "Sets the stroke colour of the selected paths, from the swatch button in the Stroke row."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Stroke"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."

[[command]]
id = "attributes.removeStroke"
label = "Remove Stroke"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index]}"
area = "color"
milestone = "M11"
summary = "The minus button of the Stroke row: on the selected paths, zeroes the stroke width and makes the stroke colour fully transparent."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Stroke"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "The removed stroke's colour is transparent black. Settled by reading `strokeColor` in a file saved after the minus button.",
]

[[command]]
id = "attributes.setFillColor"
label = "Set Fill Color"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], color: \"#RRGGBBAA\"}"
area = "color"
milestone = "M11"
summary = "Sets the solid fill colour of the selected paths, from the swatch button in the Fill row. Not available while the paths carry a gradient."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Fill"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."

[[command]]
id = "attributes.removeFill"
label = "Remove Fill"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index]}"
area = "color"
milestone = "M11"
summary = "The minus button of the Fill row: makes the fill of the selected paths fully transparent."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Fill"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."

[[command]]
id = "attributes.removeGradient"
label = "Remove Gradient"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index]}"
area = "color"
milestone = "M11"
summary = "Removes the gradient from the selected paths of a full-colour layer and shows the Fill row again with the fill colour the paths had."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs"
status = "inferred"
notes = "The handbook says how a gradient is added and that it replaces the fill, not how it is removed."
guesses = [
  "The Gradient row has a minus button, like the Stroke and Fill rows, that removes the gradient. Settled by looking at the Gradient row of the reference's Attributes inspector.",
]
observe = ["Full-colour font: on a path with a gradient, look for a way to remove the gradient (a minus button or another control); note what it is."]

[[command]]
id = "attributes.addGradient"
label = "Add Gradient"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], type?: \"linear\" | \"radial\" | \"conic\", stops?: [{offset: 0..1, color}], extend?: \"pad\" | \"repeat\" | \"reflect\"}"
area = "color"
milestone = "M11"
summary = "Gives the selected paths a gradient, which takes the place of their solid fill. A gradient always has at least two colour stops; the initial type, stop colours and position are not documented."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "A new gradient is linear, from the path's fill colour at offset 0 to the same colour fully transparent at offset 1, running from the left middle to the right middle of the path's bounds. Settled by adding a gradient in the reference.",
  "Conic gradients and the extend mode, which the version 4 file format has and the handbook does not describe, are accepted as parameters; the inspector shows only linear and radial. Settled by looking for them in the reference's inspector.",
  "A new radial gradient is centred in the path's bounds and runs from radius 0 to half the bounds' width; a new conic gradient is centred and turns 360°. Settled by switching a new gradient to radial in the reference and reading the saved file.",
]
observe = ["Full-colour font: add a gradient to a path; note its type, its stop colours and its start and end positions."]

[[command]]
id = "attributes.setGradientType"
label = "Set Gradient Type"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], type?: \"linear\" | \"radial\" | \"conic\", extend?: \"pad\" | \"repeat\" | \"reflect\"}"
area = "color"
milestone = "M11"
summary = "Switches the gradient of the selected paths between linear and radial by clicking the matching icon in the Gradient row."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "Switching the type places the gradient as a new gradient of that type and keeps its stops and extend mode. Settled by switching a moved gradient between linear and radial in the reference.",
]

[[command]]
id = "attributes.addGradientStop"
label = "Add Gradient Stop"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], offset: 0..1, color?: \"#RRGGBBAA\"}"
area = "color"
milestone = "M11"
summary = "Inserts a colour stop at a position along the gradient; in the UI, a click at any spot on the gradient bar does this. The colour a new stop starts with is not documented (interpolating the bar at that position is our default)."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "A new stop takes the colour of the gradient at its offset. Settled by clicking the gradient bar in the reference.",
]
observe = ["Full-colour font: click the gradient bar between two stops; note the colour of the new stop."]

[[command]]
id = "attributes.removeGradientStop"
label = "Remove Gradient Stop"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], stop: int}"
area = "color"
milestone = "M11"
summary = "Deletes a colour stop; in the UI by dragging its knob off the gradient bar. Must refuse to go below two stops."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."

[[command]]
id = "attributes.setGradientStopColor"
label = "Set Gradient Stop Color"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], stop: int, color?: \"#RRGGBBAA\", offset?: 0..1}"
area = "color"
milestone = "M11"
summary = "Edits one colour stop: clicking its knob under the gradient bar opens the colour picker for that stop. Moving a stop along the bar is assumed (not stated in the chapter) and is covered by the optional offset."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "A stop can be moved along the bar, which `offset` does. Settled by dragging a stop knob sideways in the reference.",
]
observe = ["Full-colour font: drag a stop knob along the gradient bar; note whether the stop moves and how its offset changes."]

[[command]]
id = "attributes.setGradientPosition"
label = "Set Gradient Position"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, shapes?: [index], start: [x, y], end?: [x, y], relative?: bool}"
area = "color"
milestone = "M11"
summary = "Places the gradient on the shape, the headless form of dragging the gradient knobs in Edit View: start and end for a linear gradient, a single origin for a radial one. The Glyphs file format stores these points relative to the shape's bounds."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Gradient"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app."
guesses = [
  "Without `end`, the end moves by as much as the start, so the gradient moves as a whole. Settled by dragging the start knob of a linear gradient in the reference's Edit View.",
]

[[command]]
id = "color.describeExport"
label = "Describe Color Export"
menu = []
shortcut = ""
kind = "engine"
params = "{instance?: index | name, master?: id, cbdt?: bool}"
area = "compile"
milestone = "M11"
summary = "Query: for one instance (or all) reports which colour tables would be written (CPAL, COLR and its version, sbix, SVG), from which layers and parameters, plus problems such as missing image files or mismatched aspect ratios. Our addition; the reference has no such report."
ref = "Color Fonts › Working with Color Fonts › Exporting Color Fonts"
status = "inferred"
own = true
notes = "Reads the same export plan the compiler builds its tables from. Without `instance` or `master` it covers every static instance that exports, or the first master when there is none, as a plain export does. `master` describes an export of that master; `cbdt` adds the export option that writes CBDT and CBLC. Each export lists its resolved switches, its tables, the CPAL version with each palette's type bits (1 light, 2 dark) and label and the number of named colours, the COLR glyphs with the layers they are made from, the strikes, the SVG documents and their sources, and the warnings and refusals."

