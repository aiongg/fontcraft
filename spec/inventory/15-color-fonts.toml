# ───────────────────────────── Behaviours: common to all colour fonts ─────────────────────────────

[[behavior]]
id = "color.fourKinds"
area = "color"
milestone = "M11"
summary = "Four colour workflows are supported: layered fonts (one font file per colour), palette layers written as CPAL + COLR, bitmap layers written as sbix, and SVG glyphs written as an SVG table. All are built from extra layers on a glyph."
ref = "Color Fonts"
status = "handbook"
guesses = [
  "A glyph may mix kinds: its palette and full-colour layers feed COLR, its iColor layers sbix and its svg layer the SVG table, each written by its own rule; an svg layer wins over a conversion by Color Layers to SVG for that glyph. Settled by exporting a glyph with a palette layer and an svg layer from the reference.",
]
observe = ["Palette font: give a glyph both a palette layer and an svg layer, export, and note which colour tables are written and which one carries that glyph."]

[[behavior]]
id = "color.metrics.linkWithFirstMaster"
area = "color"
milestone = "M11"
summary = "Colour masters must share metrics and kerning so the layers register. Give each master but the first a Link Metrics With First Master parameter and those masters take sidebearings and kerning from the first master."
ref = "Color Fonts › Working with Color Fonts › Keeping the Metrics in Sync"
status = "handbook"

[[behavior]]
id = "color.metrics.linkWithMaster"
area = "color"
milestone = "M11"
summary = "Link Metrics With Master does the same as the first-master variant but names the master to follow, so any master can be the metrics source."
ref = "Color Fonts › Working with Color Fonts › Keeping the Metrics in Sync"
status = "handbook"

[[behavior]]
id = "color.preview.editViewOtherGlyphs"
area = "color"
milestone = "M11"
summary = "In Edit View, when the layer selected in the current glyph is a colour layer, the other glyphs in the tab are also drawn in colour; with a plain master layer selected they are drawn as ordinary outlines."
ref = "Color Fonts › Working with Color Fonts › Previewing Color Fonts"
status = "handbook"
guesses = [
  "Other glyphs are drawn with the colour layers of the current master, in palette 0. Settled by selecting a colour layer in a tab of several colour glyphs in the reference.",
  "The edited glyph is drawn in colour too, all its colour layers of the master in paint order behind the edited outline, its active iColor or svg layer itself when that is the active layer. Settled by editing a palette layer of a glyph with several palette layers in the reference.",
  "Another glyph of the tab shows the colour kind of the active layer when it has it, else palette and full-colour layers, then its svg layer, then its iColor layer of the active layer's size or else its largest. Settled by a tab of glyphs with mixed colour kinds in the reference.",
  "A palette index the palette does not have is drawn in the text colour. Settled by setting a palette layer's index past the last row in the reference.",
  "An svg layer's SVG filters are drawn in Edit View, as the compiled font shows them; a file without filters keeps the plainer drawing of paths and strokes. Settled by selecting an svg layer whose file has a drop shadow in the reference and looking at the canvas.",
  "Edit View runs an svg file's filters only on the part of the drawing within the canvas and a 256-pixel margin, so a blur reaching further than the margin fades towards the margin's edge, and says at the canvas's bottom left why a file is drawn without some or all of its filters. Settled by zooming into an svg layer with a large blur in the reference and scrolling it to the canvas edge.",
]
observe = [
  "Palette font: select a palette layer of A and type AB in the Edit View tab; note whether B is drawn in colour and with which palette.",
  "svg layer whose file has an feDropShadow: select the layer and note whether Edit View draws the shadow.",
]
notes = "Documented in the handbook; not yet observed in the reference app. Drawn by `ui-egui/src/canvas/color.rs` from the paint graph the COLR writer reads. svg layers are drawn from their file's paths and strokes; clip paths, masks, filters, patterns, text and embedded images are not drawn, and even-odd fills are filled non-zero. An svg layer whose file has SVG filters is drawn as Text Preview draws an SVG glyph (`fontcraft_render::color::SvgFile`): with its filters, clip paths, masks, patterns and embedded images, rasterised only within the canvas and a margin of 256 pixels around it; a glyph wholly outside that is not rasterised. When that drawing is refused (its part within the canvas past 2,097,152 pixels or 4,096 on a side, or its work budget) the file is drawn from its paths and strokes, and is not tried again until the zoom, the file or the glyph changes; a group whose filters would paint more than 1,048,576 pixels of that part is drawn unfiltered. A line at the canvas's bottom left names the first such glyph, the reason and how many others there are."

[[behavior]]
id = "color.preview.previewArea"
area = "proofing"
milestone = "M11"
summary = "Two previews, the strip that the eye button opens below the Edit View canvas and the Preview Panel from Window › Preview Panel, draw a glyph in colour only while one of that glyph's colour layers is the selected layer."
ref = "Color Fonts › Working with Color Fonts › Previewing Color Fonts"
status = "handbook"
guesses = [
  "The colour glyphs are not inverted by Invert, and the text colour row draws in the preview's text colour. Settled by inverting the Preview Area of a palette font in the reference.",
  "A preview showing an instance or all instances draws every glyph in its text colour, since the instance has no selected layer. Settled by choosing an instance in the Preview Area of a palette font in the reference.",
]
notes = "Documented in the handbook; not yet observed in the reference app. The colour glyphs are drawn over the strip before Flip and Blur."

[[behavior]]
id = "color.preview.textPreview"
area = "proofing"
milestone = "M11"
summary = "Text Preview (Window › Text Preview) shows the font as the system text engine renders it (Core Text in the reference), so it reflects what the compiled colour tables really do. FontCraft must feed it the compiled font, not the editor's own colour drawing."
ref = "Color Fonts › Working with Color Fonts › Previewing Color Fonts"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app. FontCraft compiles the shown master, or the instance the style pop-up names, with its colour tables and export switches on a thread of its own once editing pauses, and draws each colour glyph from that font (`fontcraft_render::color`): COLR versions 0 and 1 with palette 0 of CPAL, SVG documents (gzip-compressed or not, with their embedded PNG and JPEG images, clip paths, masks, patterns and filters), sbix PNG and JPEG images, and CBDT strikes. An SVG document whose root gives a viewBox, width or height is fitted to the em square, as the OpenType SVG table specification defines. SVG filters are run by FontCraft's own filter code on the glyph's pixels: feGaussianBlur, feOffset, feFlood, feColorMatrix, feComposite, feMerge, feBlend, feDropShadow, feComponentTransfer, feConvolveMatrix, feMorphology, feDisplacementMap, feTile, feTurbulence (the SVG 1.1 reference algorithm) and feDiffuseLighting and feSpecularLighting with distant, point and spot lights, with SourceGraphic, SourceAlpha and named results as inputs, within the filter region and primitive subregions (`fontcraft_color::svg_filter`, `fontcraft_render::color`); clip paths of enclosing elements apply to the filter's result, as the SVG rendering model has it. An element whose filter uses feImage is drawn unfiltered, and the glyph's drawing carries one warning for it. Such warnings, and why a colour glyph is drawn as its outline, show under the text: the first with its glyph's name and a count of the others. Glyphs without colour in the compiled font, and colour glyphs past the drawing limits, are drawn as their outlines; when the colour font cannot be built, every glyph is an outline and the reason shows under the text."
guesses = [
  "A glyph in more than one colour table is drawn from COLR, else SVG, else sbix, the order Edit View picks a glyph's colour layers in. Settled by exporting a glyph with palette, svg and iColor layers and looking at it in the reference's Text Preview.",
  "The sbix image is drawn from the smallest strike at least as large as the pixel size, else the largest, with its bottom left at the record's origin offsets from the glyph origin and no side bearing added. Settled by previewing an iColor font with two sizes at several text sizes in the reference.",
  "Colour glyphs are drawn with their origin on a whole pixel, so a glyph can sit up to half a pixel from its outline position. Settled by comparing small colour text with plain text in the reference's Text Preview.",
  "A colour glyph larger than 4,096 pixels on a side, or than 2,097,152 pixels, is drawn as its outline. Settled by previewing a colour font at the largest text size in the reference.",
  "A glyph with a CBDT image and no other colour is drawn from the CBDT strike nearest the pixel size by the sbix rule, its top left at the image's bearings. Settled only outside the reference, which does not export CBDT; compare with a system text engine on a nanoemoji-built CBDT font.",
  "An SVG document's embedded image that cannot be decoded, or that would take its document past 4,194,304 decoded pixels, is left out and the rest of the document drawn. Settled by previewing an SVG glyph with a damaged embedded PNG in the reference.",
  "An SVG mask's luminance is taken from its sRGB values with the weights 0.2125, 0.7154 and 0.0721, without converting to linear RGB first. Settled by previewing an SVG glyph masked by a mid-grey rectangle in the reference.",
  "An SVG document fitted to the em square with preserveAspectRatio slice is clipped to the em square unless its root's overflow (its style property, else its attribute) is visible or auto; a document fitted with meet is not clipped. Settled by previewing such a glyph whose content overflows the em in the reference.",
  "SVG filters work on 8-bit premultiplied pixels in linear RGB unless color-interpolation-filters says sRGB; blur deviations and offsets scale by the lengths of the transform's axes, so a rotated element's blur is not rotated, and offsets round to whole pixels. Settled by previewing an SVG glyph with a blur and an offset shadow in the reference.",
  "An SVG element whose filters use feImage, a transfer function of more than 1,024 values or a convolution kernel more than 16 cells on a side, hold more than 32 primitives (each feMerge input counting as one), nest inside 4 filtered elements, could paint more than 1,048,576 sprite pixels (what the element draws grown by its blurs, offsets, dilations, convolutions and displacements, or the whole filter region when a flood, tile, turbulence or light paints where its input is clear), or would take the glyph past its work budget is drawn unfiltered with a warning, and the glyph is still drawn in colour; blurs past a deviation of 256 pixels blur by 256, dilations and erosions past a radius of 256 pixels reach 256, and turbulence runs at most 10 octaves. Settled by previewing an SVG glyph with feImage in the reference.",
  "feTurbulence takes the noise at each pixel's top left corner in user space; feConvolveMatrix adds its bias by the Filter Effects formula (the bias to the alpha, the bias times that alpha to each premultiplied colour, or the bias to straight colour with preserveAlpha), ignores kernelUnitLength and reads its kernel cells as sprite pixels; feMorphology radii and feDisplacementMap moves round to whole pixels. Settled by previewing an SVG glyph with each primitive at two text sizes in the reference.",
  "feDisplacementMap converts only its map (in2) to the color-interpolation-filters space and moves the in image's pixels in the space they are in, as the Filter Effects specification says. Settled by previewing an SVG glyph displaced by a gradient map in linearRGB and in sRGB in the reference.",
  "A negative diffuseConstant or specularConstant lights nothing, so the lit result is black; the specification calls such a value an error. Settled by previewing an SVG glyph lit with diffuseConstant=-1 in the reference.",
  "Lighting takes light positions through the filter's transform, z scaled by the square root of its determinant, uses the Filter Effects specification's Sobel kernels with its edge kernels, clamps specularExponent to 1 to 128 and gives a spot light's cone a hard edge. Settled by previewing an SVG glyph lit by a point and a spot light in the reference.",
  "An SVG glyph whose masks and clip paths nest more than 8 layers deep, or that uses more than 4,096 pattern tiles, is drawn as its outline. Settled by previewing such a glyph in the reference.",
]
observe = [
  "Palette font with an instance whose Export COLR Table is off: open Text Preview, choose the instance in the style pop-up and note whether the glyphs show as plain outlines.",
  "SVG font with a glyph filtered by feGaussianBlur and one by feImage: open Text Preview and note whether each filter shows, and whether the second glyph draws unfiltered.",
  "SVG font with glyphs filtered by feTurbulence, feDiffuseLighting and feConvolveMatrix: open Text Preview at two sizes and compare the noise, the lighting and the convolution with FontCraft's.",
  "SVG font with a half-transparent glyph filtered by feConvolveMatrix with bias=0.5: note whether the colour gains half the bias where the glyph is half transparent.",
  "SVG font with a glyph filtered by feConvolveMatrix with kernelUnitLength=4: note whether the kernel cells grow with the text size.",
  "SVG font with a glyph lit by feSpotLight with limitingConeAngle=20: note whether the cone's edge is hard or soft.",
  "SVG font with a glyph lit by feDiffuseLighting with diffuseConstant=-1: note whether the glyph shows black, unfiltered or not at all.",
  "SVG font with a glyph displaced by feDisplacementMap in linearRGB: compare its colours with the same glyph in sRGB.",
  "SVG font with a glyph dilated by feMorphology radius=400 at a large text size: note whether the dilation stops growing.",
]

[[behavior]]
id = "color.preview.paletteDrivesFontView"
area = "color"
milestone = "M11"
summary = "Once the Color Palettes parameter exists, glyphs with palette layers are previewed in colour in Font View cells as well as in Edit View."
ref = "Appendix › Custom Parameters › Color Palettes"
status = "handbook"
notes = "Documented, not yet observed. A cell draws a glyph with colour layers in Font View's master in colour, in place of its outline, through the same paint graph as Edit View: palette and full-colour layers, else an svg layer, else an iColor image. When the master has a Master Color, every glyph is drawn with the layers of each master that has one, in its colour."
guesses = [
  "Cells use palette 0 of the master's palettes, as Edit View does. Settled by the palette font with two palettes in Font View in the reference.",
  "Of several iColor layers, a cell draws the largest size. Settled by a glyph with iColor 64 and iColor 128 layers in Font View in the reference.",
  "In a layered font, a cell stacks every master that has a Master Color, the first on top, whichever master Font View shows; a master without one shows plain outlines. Settled by the layered font in Font View in the reference.",
]
observe = ["Palette font: look at A in Font View; note whether its cell is drawn in colour and with which palette."]

[[behavior]]
id = "color.export.anyFlavour"
area = "compile"
milestone = "M11"
summary = "Colour data is added to ordinary OpenType fonts and can go into every export flavour: CFF-based .otf, TrueType .ttf, WOFF and WOFF2. Whether the colours show depends only on the rendering environment."
ref = "Color Fonts › Working with Color Fonts › Exporting Color Fonts"
status = "handbook"
notes = "CPAL and COLR are written the same way for TrueType and CFF outlines; the layer glyphs are written like any glyph in `glyf` or `CFF `."

