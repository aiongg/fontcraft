[[behavior]]
id = "color.fullColor.imageOnlyEffects"
area = "color"
milestone = "M11"
summary = "Shadow, Inner Shadow and Pattern Image cannot be written to SVG. Only Filter › Glyph as Image respects them, in its PNG and PDF output; font export ignores them."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs"
status = "handbook"
notes = "Documented in the handbook; not yet observed in the reference app. Built in M11.21: `glyph.exportArtwork` and `filter.glyphAsImage` draw a palette or full-colour layer in colour in PNG and PDF (`fontcraft_render::color::artwork`), with these effects; SVG pictures and font export leave them out. A PDF holds the effects as images at `pixelsPerEm`. Edit View does not draw them."
guesses = [
  "A Shadow is the path's silhouette (fill and stroke) moved by the offset (font units, y up) and blurred by a Gaussian whose standard deviation is half the blur value, in the shadow colour, drawn just below the path and above the paths before it. Settled by exporting a square with a blur-0 shadow and a square with a blur-20 shadow through Glyph as Image and measuring the PNGs.",
  "An Inner Shadow is the outside of the path moved by the offset and blurred the same way, kept inside the path, over the fill and the pattern and below the stroke. Settled by exporting a square with an inner shadow through Glyph as Image.",
  "A Pattern Image is tiled from the glyph origin at one image pixel per font unit (a PDF by its points), over the path's fill, which shows where the image is transparent; an image that cannot be read is left out with a warning. Settled by exporting a path with a small pattern image through Glyph as Image.",
  "A picture is widened to take in the shadows: the offset plus one and a half times the blur past the silhouette. Settled by exporting a glyph whose shadow reaches past the advance width.",
  "Effects of paths inside a component that refers to another colour glyph are not drawn. Settled by exporting such a component through Glyph as Image.",
]
observe = [
  "Full-colour layer: give a path a Shadow and an Inner Shadow; note whether Edit View draws either of them.",
  "Export a 200-unit square with Shadow blur 0, offset 100 −100 through Filter › Glyph as Image as PNG; measure where the shadow lies and whether the picture widens to show it.",
  "Give a path a Pattern Image of a known pixel size; export it as PNG and measure how many font units one image pixel spans and where the tiling starts.",
]

