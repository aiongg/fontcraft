status = "handbook"

[[behavior]]
id = "color.export.fullColorToSvg"
area = "compile"
milestone = "M11"
summary = "With Color Layers to SVG checked on an instance, the paths of each glyph's Color layer are written with their fills, strokes and gradients as one SVG document per glyph in the SVG table of that instance."
ref = "Color Fonts › SVG Color Fonts › Creating SVG Glyphs › Exporting"
status = "handbook"
guesses = [
  "One uncompressed SVG document per glyph whose group has the id `glyph<ID>` and a transform that flips y at the baseline; centred strokes are SVG strokes, inside and outside strokes are expanded to outlines. Settled by exporting the full-colour test font with Color Layers to SVG from the reference and reading the documents.",
]
observe = [
  "Full-colour font: export an instance with Color Layers to SVG and read the SVG table; note whether there is one document per glyph or grouped documents, whether they are compressed, the transform and viewBox, and whether strokes are written as strokes or outlines.",
]

[[behavior]]
id = "color.export.fullColorToColrV1"
area = "compile"
milestone = "M11"
summary = "Full-colour layers are compiled to COLR version 1 when any of them needs a gradient: consecutive paths with the same attributes become one layer glyph, each layer glyph a PaintGlyph over a PaintSolid, PaintLinearGradient or PaintRadialGradient (PaintSweepGradient for conic gradients), grouped by PaintColrLayers, with a clip box per glyph. Colours that are not palette references are added once to every palette and referenced there with their alpha in CPAL."
ref = "fontc fontbe/src/colr.rs, fontbe/src/cpal.rs; OpenType spec › COLR"
status = "docs"
notes = "Both oracles split runs of equal attributes and write the paints this way. Differences: fontc 1.0.0 reads full-colour attributes only on the master layer itself and ignores a separate Color layer (the usual case in the reference's files), which fontmake and FontCraft compile; fontmake adds each colour to the palettes again for every use and applies a translucent colour's alpha twice (in CPAL and in the paint), where FontCraft adds each colour once and applies its alpha once, as fontc does. Conic gradients and the extend modes come from the version 4 file format; neither oracle writes them."
guesses = [
  "A full-colour Color layer exports as COLR version 1 without any parameter, as both oracles do; the handbook names only SVG for these layers. Settled by exporting the full-colour test font from the reference with no parameters.",
]
observe = ["Full-colour font: export with no colour parameters and read it with fontTools; note whether COLR version 1, an SVG table or neither is written."]

[[behavior]]
id = "color.export.colrVersionChoice"
area = "compile"
milestone = "M11"
summary = "The compiler writes COLR version 0 when every colour glyph is a plain stack of solid palette-indexed layers and version 1 as soon as any glyph needs gradients or other paints. This is the rule fontc applies; the reference app's own rule is unconfirmed."
ref = "fontc fontbe/src/colr.rs"
status = "docs"
notes = "The two oracles differ. fontc 1.0.0 writes version 0 for full-colour layers with only solid fills and version 1 otherwise; fontmake writes version 1 for every full-colour glyph and version 0 only for palette layers. FontCraft follows fontc, because version 0 renders in more places; the difference from fontmake is listed in the M11 measures."
guesses = [
  "Solid-only full-colour layers export as COLR version 0, as fontc does, not version 1 as fontmake does. Settled by exporting the full-colour test font with only solid fills from the reference.",
]
observe = ["Full-colour font with the gradient and stroke paths deleted (solid fills only): export and read COLR; note whether it is version 0 or version 1."]

[[behavior]]
id = "color.export.variableColr"
area = "color"
milestone = "M11"
summary = "In a variable font, gradient geometry and colour stops of full-colour layers that differ between masters become variable COLR paints (PaintVarLinearGradient and the other Var formats) with a DeltaSetIndexMap and an ItemVariationStore; palette-layer outlines vary through the layer glyphs' own variations. Static instances between masters interpolate the colour layers like the master layers."
ref = "Color Fonts"
status = "docs"
own = true
notes = "fontmake 3.12.1 writes variable COLR for fontc's test source COLRv1-var (one region, PaintVarLinearGradient, no clip list); fontc 1.0.0 writes it static. The handbook is silent (open question 21). Needs M9's variation model; package M11.19."
guesses = [
  "Gradient geometry and stop colours vary when they differ between masters, as fontmake writes them. Settled by exporting the two-master palette font and a two-master gradient font as variable fonts from the reference.",
]
observe = ["Two-master palette font: export a variable font and read COLR; note whether it has a variation store or Var paints, or is static."]

[[behavior]]
id = "color.export.strokeInColr"
area = "compile"
milestone = "M11"
summary = "COLR has no stroke paint, so a stroked path on a full-colour layer must be expanded to an outline (respecting width and alignment) before it can be a COLR layer, while SVG can keep it as a stroke. Our design; the reference's handling is unknown."
ref = "OpenType spec › COLR"
status = "inferred"
own = true
notes = "fontc 1.0.0 refuses a stroked colour path; fontmake outlines centred strokes with butt caps and miter joins and refuses other stroke positions. FontCraft expands every stroke with its own stroke code, position, caps and joins included, so it goes beyond both."
guesses = [
  "A stroke becomes its own layer glyph painted in the stroke colour, above the path's fill, expanded with the path's stroke position, caps and joins. Settled by exporting the full-colour test font from the reference.",
]

# ───────────────────────────── Behaviours: bitmap colour (sbix) ─────────────────────────────
observe = ["Full-colour font: export with no colour parameters and read COLR; note how C's 20-unit stroke is written (an outlined layer, a separate glyph, or dropped)."]

[[behavior]]
id = "color.sbix.bitmapFormats"
area = "color"
milestone = "M11"
summary = "sbix glyphs are made from bitmap files, not vectors. PNG, JPEG and TIFF sources are accepted."
ref = "Color Fonts › sbix Fonts › Standard Bitmap Graphics"
status = "handbook"
guesses = [
  "PNG and JPEG data are stored as read, with the graphic types `png ` and `jpg `; TIFF is converted to PNG. Settled by exporting the sbix test font from the reference and reading the graphic types.",
]
observe = ["sbix font: export and read sbix with fontTools; note the strikes and the graphic type tags written for the JPEG and the TIFF image."]

[[behavior]]
id = "color.sbix.imagePerSize"
area = "color"
milestone = "M11"
summary = "A glyph has one image per pixel size and may have several sizes (for example 512, 128, 32, 16) so a renderer can pick the closest. Small sizes can be redrawn for clarity and spare the renderer from downscaling; above the largest size the image is scaled up and looks soft."
ref = "Color Fonts › sbix Fonts › Standard Bitmap Graphics"
status = "handbook"

[[behavior]]
id = "color.sbix.sizeIsPixels"
area = "color"
milestone = "M11"
summary = "Image sizes are pixel heights (pixels per em of the strike), not font units."
ref = "Color Fonts › sbix Fonts › Preparing Images"
status = "handbook"

[[behavior]]
id = "color.sbix.sameAspectRatio"
area = "color"
milestone = "M11"
summary = "All sizes of one glyph's image must have the same width-to-height ratio; a square 512 px image requires square images at every other size. FontCraft should warn when the ratios differ."
ref = "Color Fonts › sbix Fonts › Preparing Images"
status = "handbook"
guesses = [
  "Unequal ratios are exported as they are, with a warning from export and from `color.describeExport`. Settled by exporting the non-square image in the sbix test font from the reference.",
]
observe = ["sbix font: export and read sbix; note what happens to the non-square PNG (written, scaled, refused) and any message."]

[[behavior]]
id = "color.sbix.fileNamingTip"
area = "color"
milestone = "M11"
summary = "Recommended file naming is the glyph name, a space and the pixel size, such as sun 48.png. It is a convention for people only; the chapter does not say the app matches files by name."
ref = "Color Fonts › sbix Fonts › Preparing Images"
status = "handbook"

[[behavior]]
id = "color.images.referencedNotEmbedded"
area = "color"
milestone = "M11"
summary = "Bitmap and SVG files added to colour layers are stored as file references, not copied into the source. Moving, renaming or deleting a file breaks the link, so the images should live in a folder beside the source file (the handbook suggests one named Images)."
ref = "Color Fonts › sbix Fonts › Preparing Images; SVG Color Fonts › Importing Existing SVG Files"
status = "handbook"

[[behavior]]
id = "color.sbix.masterLayerBounds"
area = "color"
milestone = "M11"
summary = "The master layer of an sbix glyph has no real outline, but two tiny paths at the bottom-left and top-right corners should be placed on it. Their bounding box is the rectangle the app fits the images into on the iColor layers, and some software (Chrome, Photoshop) clips the bitmap to it."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs"
status = "handbook"
observe = ["sbix font: drop E 64.png on the iColor 64 layer of E; note whether the image is fitted to the box of the corner paths at (50, -100) and (550, 700)."]

[[behavior]]
id = "color.sbix.zeroSizeCornerPaths"
area = "color"
milestone = "M11"
summary = "The corner paths may have all their nodes on one point, making them invisible. The red marker normally drawn behind coinciding nodes appears for them and is harmless here."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs"
status = "handbook"

[[behavior]]
id = "color.sbix.iColorNaming"
area = "color"
milestone = "M11"
summary = "sbix layers are labelled iColor followed by their pixel size (iColor 256, iColor 20). One iColor layer is added per image resolution; in the Glyphs file format the size is the layer attribute sbixSize."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs; GlyphsSDK GlyphsFileFormatv3.md › layerAttr"
status = "handbook"

[[behavior]]
id = "color.sbix.sizeScalesImage"
area = "color"
milestone = "M11"
summary = "The image on an iColor layer is drawn at image pixels divided by the layer's pixel size, in ems. A layer size larger than the image makes it appear smaller and a smaller size makes it appear larger; changing the size is the way to scale it."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs"
status = "handbook"
observe = ["sbix font: double-click an iColor layer entry and type 256; note whether the image is drawn half as large as at 128."]

[[behavior]]
id = "color.layers.widthFollowsMaster"
area = "color"
milestone = "M11"
summary = "iColor and svg layers have no advance width of their own: a new width on the master layer applies to all its iColor layers and to its svg layer as well."
ref = "Color Fonts › sbix Fonts › Adding Images to Glyphs; SVG Color Fonts › Importing Existing SVG Files"
status = "handbook"
notes = "Built in M11.3. FontCraft keeps the widths equal in the engine: a width change on a master layer writes the same width to its colour layers in the same undo step, and export reads the master layer's width."
guesses = [
  "Palette and full-colour layers follow the master's width as iColor and svg layers do. Settled by changing a master width in the reference with a palette layer present.",
]
observe = ["sbix font and SVG font: change the master layer's width; note the width of every iColor and svg layer of that glyph afterwards."]

[[behavior]]
id = "color.export.sbixAutomatic"
area = "compile"
milestone = "M11"
summary = "An sbix table is written automatically whenever the font contains iColor layers: one strike per distinct pixel size, holding each glyph's image for that size. Placed images on ordinary layers are not exported."
ref = "Color Fonts › sbix Fonts › Exporting; Edit View › Images › Adding Images"
status = "handbook"
notes = "Neither oracle builds sbix (both ignore `sbixSize` layers silently) and no corpus source has an iColor layer; nanoemoji's sbix output gives the table layout (version 1, flags 1, 72 pixels per inch). write-fonts' sbix types leave the strike layout to the caller, so FontCraft serialises the table itself."
guesses = [
  "A glyph whose image file is missing at export is left out of that strike, with a warning naming the glyph and the file. Settled by exporting the sbix test font from the reference with one file moved away.",
]
observe = ["sbix font: export with no colour parameters and read the result; note whether sbix is written, the origin offsets, and what happens to a glyph whose image file is missing."]

[[behavior]]
id = "color.export.exportSbixTableOff"
area = "compile"
milestone = "M11"
summary = "Export sbix Table added to an instance and unchecked leaves the sbix table out of that instance."
ref = "Color Fonts › sbix Fonts › Exporting"
status = "handbook"

[[behavior]]
id = "color.export.sbixToSvg"
area = "compile"
milestone = "M11"
summary = "SBIX to SVG on an instance takes a pixel size and additionally writes the bitmaps of that size into an SVG table, each wrapped in an SVG document, for software that reads SVG but not sbix."
ref = "Color Fonts › sbix Fonts › Exporting"
status = "handbook"
guesses = [
  "Each bitmap becomes an `<image>` element with embedded PNG data, placed where the image sits on its iColor layer. Settled by exporting the sbix test font with SBIX to SVG from the reference.",
]
observe = ["sbix font: export an instance with SBIX to SVG set to 100 and read the SVG table; note how each document places its <image> element (position, size, transform)."]

[[behavior]]
id = "color.export.sbixToSvgSizeChoice"
area = "compile"
milestone = "M11"
summary = "For SBIX to SVG the layer is chosen per glyph: the iColor layer of exactly the requested size if present, otherwise the smallest one larger than it, otherwise the largest one below it."
ref = "Color Fonts › sbix Fonts › Exporting"
status = "handbook"
observe = ["sbix font: export an instance with SBIX to SVG set to 100 and read the SVG table; note which iColor size each glyph uses."]

[[behavior]]
id = "color.export.svgOnlyFromSbix"
area = "compile"
milestone = "M11"
summary = "Combining an unchecked Export sbix Table with SBIX to SVG yields a font that carries the bitmaps only in its SVG table."
ref = "Color Fonts › sbix Fonts › Exporting"
status = "handbook"

[[behavior]]
id = "color.export.cbdtNotInReference"
area = "compile"
milestone = "M11"
summary = "The chapter has no CBDT/CBLC workflow; the only bitmap output it describes is sbix. FontCraft builds CBDT/CBLC from the same iColor layers as an export option of its own (off by default; an export dialog checkbox and a command-line flag, not a custom parameter), with its own table writer."
ref = "Color Fonts › sbix Fonts"
status = "inferred"
own = true
notes = "Decided in docs/plans/M11.md § 7, question 2 (a): built, at the lowest priority, in the plan's last wave (package M11.11). nanoemoji's `cbdt` output (CBLC and CBDT version 3, index subtable format 1, glyph bitmap format 17) is the layout oracle."

# ───────────────────────────── Behaviours: SVG colour glyphs ─────────────────────────────

[[behavior]]
id = "color.svg.threeSources"
area = "color"
milestone = "M11"
summary = "An SVG table can come from three sources: conversion of another colour setup (layered masters, palette layers or iColor bitmaps), SVG files referenced on svg layers, or paths with attributes drawn on full-colour layers. The result is an OpenType font with SVG glyph images, not the obsolete SVG font format."
ref = "Color Fonts › SVG Color Fonts"
status = "handbook"

[[behavior]]
id = "color.svg.layerHoldsFile"
area = "color"
milestone = "M11"
summary = "An svg layer holds one SVG file dropped onto it, which may contain vector and embedded bitmap content. In the Glyphs file format it is the boolean layer attribute svg."
ref = "Color Fonts › SVG Color Fonts › Importing Existing SVG Files; GlyphsSDK GlyphsFileFormatv3.md › layerAttr"
status = "handbook"

[[behavior]]
id = "color.svg.fileNamingTip"
area = "color"
milestone = "M11"
summary = "Recommended naming for SVG sources is the glyph name plus .svg (A.svg) in a folder called Images. As with bitmaps this is advice, not a lookup rule."
ref = "Color Fonts › SVG Color Fonts › Importing Existing SVG Files"
status = "handbook"

[[behavior]]
id = "color.svg.imageTransform"
area = "color"
milestone = "M11"
summary = "The SVG on an svg layer is positioned and scaled like any placed image: by dragging, the bounding box, the Scale and Rotate tools, the Transformations palette, or the image fields of the Info box. The placement must be carried into the exported document."
ref = "Color Fonts › SVG Color Fonts › Importing Existing SVG Files; Edit View › Images › Manipulating Images"
status = "handbook"
guesses = [
  "The placed SVG's transform is written as a group transform inside the glyph's document, combined with the y flip at the baseline; the SVG's own content is kept as usvg normalises it. Settled by exporting the SVG test font with a moved and scaled svg layer from the reference.",
]
observe = ["SVG font: move and scale the svg layer's image, export and read F's SVG document; note how the placement appears in the document."]

[[behavior]]
id = "color.fallback.masterLayerSvg"
area = "compile"
milestone = "M11"
summary = "For a glyph with an svg layer the master layer outline is the fallback, shown where SVG glyphs are unsupported and hidden where they are supported."
ref = "Color Fonts › SVG Color Fonts › Importing Existing SVG Files"
status = "handbook"

[[behavior]]
id = "color.export.exportSvgTable"
area = "compile"
milestone = "M11"
summary = "Export SVG Table controls whether SVG data is included in an instance. The chapter asks for it to be checked alongside Color Layers to SVG when converting; the appendix says an SVG table is exported by default and the parameter exists to switch it off, so the two descriptions do not fully agree."
ref = "Color Fonts › Layered Color Fonts › Exporting; Appendix › Custom Parameters › Export SVG Table"
status = "handbook"
guesses = [
  "The SVG table is written whenever svg layers exist or a conversion asks for it, without Export SVG Table, as the appendix says; the parameter set off removes it. Settled by exporting the SVG test font from the reference with no parameters.",
]
observe = ["SVG font: export with no colour parameters; note whether an SVG table is written."]

[[behavior]]
id = "color.export.colorLayersToSvg"
area = "compile"
milestone = "M11"
summary = "Color Layers to SVG, a boolean on an instance, is the single switch that turns vector colour layers into SVG documents: Master Color masters in a layered setup, palette layers, or full-colour layers with path attributes, whichever the font has."
ref = "Color Fonts › Layered Color Fonts › Exporting; COLR/CPAL Fonts › Exporting; SVG Color Fonts › Creating SVG Glyphs › Exporting"
status = "handbook"

[[behavior]]
id = "color.export.perInstance"
area = "compile"
milestone = "M11"
summary = "Every colour export switch (Color Layers to SVG, Color Layers to COLR, Color Palette for CPAL, Color Palette for SVG, Export COLR Table, Export sbix Table, Export SVG Table, SBIX to SVG) is set per instance in Font Info › Exports, so one source can export differently coloured or differently encoded fonts side by side."
ref = "Color Fonts › COLR/CPAL Fonts › Exporting; sbix Fonts › Exporting"
status = "handbook"

[[behavior]]
id = "color.export.glyphFilterTokens"
area = "compile"
milestone = "M11"
summary = "Export glyph filters can test colour properties: colorIndex (palette index of layers), isAnyColorGlyph (palette, sbix or full-colour glyph) and isAppleColorGlyph (has an iColor layer). Feature-code tokens likewise offer isColorGlyph."
ref = "Appendix › Custom Parameters › Remove Glyphs; Feature Code › Tokens"
status = "handbook"

[[behavior]]
id = "color.open.compiledColorTables"
area = "color"
milestone = "M11"
summary = "Opening a compiled font reads its CPAL into the Color Palettes parameter, its COLR version 0 records into palette layers and its COLR version 1 paints into full-colour layers where they map to fills and linear, radial or conic gradients; other paints, sbix, SVG and CBDT data are reported as lost."
ref = "Color Fonts"
status = "inferred"
own = true
guesses = [
  "Opening a compiled colour font recovers palettes and vector colour layers and reports bitmap and SVG glyphs as lost. Settled by opening a COLR font in the reference.",
]
observe = [
  "Palette font: open its exported .ttf in the app; note whether the palettes and palette layers come back, and how bitmap and SVG glyphs of the sbix and SVG fonts' exports are reported when those files are opened.",
]
