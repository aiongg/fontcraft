[[behavior]]
id = "fontView.image.caseSensitivity"
area = "color"
milestone = "M11"
summary = "Glyph names are case-sensitive but many file systems are not, so A.png and a.png cannot share a folder there. The documented workaround is to keep uppercase and lowercase images in separate folders; on case-sensitive systems we match exactly."
