[[command]]
id = "fontView.queryGlyphs"
label = "Query Glyphs"
menu = []
shortcut = ""
kind = "engine"
params = "{entries?: [path], rules?: ruleTree, search?: {query, fields?, matchCase?, regex?} | string, master?: id, sidebar?: bool, knownCompatibility?: bool}"
area = "font-view"
milestone = "M4"
summary = "Our headless filter evaluation: returns the glyph names matching the given sidebar entries, an ad-hoc smart-filter rule tree and/or a search query, without touching the window state."
ref = "Font View › Filtering Font View"
status = "inferred"
guesses = [
  "Our own query for agents; it must give the glyphs the sidebar and search would show for the same entries and text.",
]
notes = "Paths name the section first (all, categories/Letter/Uppercase, languages/latin/<language>, filters/<folder>/<filter>), as text or as a list of names. `master` picks the layer the layer rules read (default the first master). `sidebar: true` adds every entry with its count and, for entries that know their full set, how many of the expected glyphs the font has. The evaluator is crates/glyphquery. The engine gives it the built-in language sets (crates/glyphdata/data/sets.bin) and the entries of the user's Groups*.plist files (Session::set_user_groups; the desktop app reads them from the Info folder of its settings folder). `knownCompatibility: true` takes the Master Compatible rule's answers from the glyphs already checked, which the window uses while it checks a large font in slices; `compatibilityPending` counts the others."

