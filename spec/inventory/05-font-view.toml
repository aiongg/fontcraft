milestone = "M4"
summary = "When only the layer of the current master has a colour label, the colour fills the whole cell except for a cut-out at the top left."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"
guesses = [
  "The cut-out is a triangle over 30% of the side at the top-left corner. Settled by observation.",
]
observe = [
  "Give a glyph a layer colour only and measure the cut-out against the cell.",
]

[[behavior]]
id = "fontView.cell.colorGlyphAndLayer"
area = "font-view"
milestone = "M4"
summary = "When both labels are set, the glyph colour fills the cell and the layer colour is painted over its right half."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "fontView.cell.imageDisplay"
area = "color"
milestone = "M11"
summary = "A cell shows the image placed on the layer when View → Show Image is on. A glyph with no paths and no components shows its image even when that option is off."
ref = "Font View › Images"
status = "handbook"
notes = "Documented, not yet observed. The cell draws the image of the glyph's layer of Font View's master under the outline, with its transform, crop and opacity as in Edit View, clipped to the cell. Thumbnails are decoded a few files per frame and kept within a byte limit. In `crates/ui` (`canvas/images/cells.rs`) a cell draws a thumbnail of the decoded file no larger than the cell (a power of two from 32 to 1,024 pixels), kept per file and side within 4,096 thumbnails and 128 MiB; a PDF image's thumbnail is made from its first page as Edit View draws it."
guesses = [
  "The image is drawn at its own opacity (50 % when the file states none), as Edit View draws it. Settled by a Font View cell of a glyph with an image in the reference.",
  "A missing or unreadable file draws the missing-image marker in the cell. Settled by moving an image file away and looking at Font View in the reference.",
]
observe = [
  "Place an image at 30% opacity on an empty glyph and compare the cell with Edit View.",
  "Move the image file away, reopen the font and look at the cell.",
]

# ── List View columns ──

[[behavior]]
id = "fontView.column.id"
area = "font-view"
milestone = "M4"
summary = "The ID column holds the glyph's position in glyph order, which is the order used in exported fonts; sorting by it shows the font in export order."
ref = "Font View › Glyph Properties › ID"
status = "handbook"

[[behavior]]
id = "fontView.column.char"
area = "font-view"
milestone = "M4"
summary = "The Char column renders the glyph's character in the system font. A glyph with several code points shows only the first; a glyph with none shows nothing."
ref = "Font View › Glyph Properties › Char"
status = "handbook"
guesses = ["A character the interface font lacks is drawn with the glyph's own outline from the document, at row height in the text colour, instead of a system font's. Settled by observing the reference with a code point that the system fonts lack."]
observe = [
  "Give a glyph the value U+E000 and an unassigned CJK code point: note what the Char column draws.",
]

[[behavior]]
id = "fontView.column.name"
area = "font-view"
milestone = "M4"
summary = "The Name column shows the nice name and is editable by a single click, with the same renaming rules as the grid."
ref = "Font View › Names & Unicode › Naming Glyphs"
status = "handbook"

[[behavior]]
id = "fontView.column.unicode"
area = "font-view"
milestone = "M4"
summary = "The Unicode column lists the code points of the glyph and can be edited in place."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "fontView.column.note"
area = "font-view"
milestone = "M4"
summary = "The Note column shows and edits the free-text glyph note; List View is the documented place to edit notes in Font View."
ref = "Font View › Glyph Properties › Note"
status = "handbook"

[[behavior]]
id = "fontView.column.components"
area = "components"
milestone = "M6"
summary = "The Components column lists the names of the components used by the glyph; editing the cell adds or removes components to match."
ref = "Font View › Glyph Properties › Components"
status = "handbook"
notes = "Documented, not yet observed. The cell lists the component names of the layer of the master Font View shows, separated by commas. Editing it runs glyph.setComponents on that layer: names may be separated by commas or spaces, a name typed more often than the layer has it appends a component, one typed less often loses its last components, and paths stay."
guesses = [
  "The cell shows and edits the layer of the master Font View shows, not the first master's; editing the cell with a second master selected in the reference app settles it.",
]
observe = [
  "With the second master shown, edit a Components cell and look at both masters.",
]

[[behavior]]
id = "fontView.column.lastChanged"
area = "font-view"
milestone = "M4"
summary = "The Last Changed column shows a timestamp refreshed whenever the glyph is modified. A font-level Write lastChange parameter set to off stops the timestamp from being updated, which keeps version-control diffs quiet."
ref = "Font View › Glyph Properties › Last Changed"
status = "handbook"
notes = "Session::edit stamps every glyph whose contents an edit changed (new and renamed glyphs included) with the time of the clock the app gives the session (Session::set_clock); a session without a clock stamps nothing, and tests use a fixed clock. The Disable Last Change parameter, which glyphsLib reads, also stops it. The column itself comes with the List View."

[[behavior]]
id = "fontView.column.otherProperties"
area = "font-view"
milestone = "M4"
summary = "List View has a column for every property the Glyph Properties section describes: besides ID, Char, Name, Unicode, Note, Components and Last Changed, these are the metrics (LSB, RSB, width), kerning groups, Exports, colour label, tags, production name, script, category, subcategory, case, writing direction and sort name."
ref = "Font View › List View"
status = "handbook"
notes = "The handbook says each column is a glyph property and points at Glyph Properties for the list (05 question 14, checked in the M4 planning pass). Metric and kerning-group cells are read-only until M5. Documented, not yet observed."
guesses = [
  "Every column is shown by default, in this order: ID, Char, Name, Unicode, Production Name, Script, Category, Subcategory, Case, Direction, Exports, Color, Tags, Sort Name, Note, Components, Last Changed, LSB, RSB, Width, Left Group, Right Group. Settled by observation (05 question 14).",
  "Besides the four cells the handbook calls editable (Name, Unicode, Note, Components), cells of properties that have a set command (Exports, colour, tags, production name, script, category, subcategory, case, direction, sort name) are editable too. Settled by observation.",
]
observe = [
  "Show List View in a new document: write down the columns shown and, from the header's menu, all columns in order.",
  "Click into each column's cell of one selected glyph and note which can be edited.",
]

# ── Inspector ──

[[behavior]]
id = "fontView.inspector.mixedText"
area = "font-view"
milestone = "M4"
summary = "When the selected glyphs differ in a text property, the field shows a grey Multiple Values placeholder. Typing a value replaces the property on every selected glyph."
ref = "Font View › Glyph Properties"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "fontView.inspector.mixedExport"
area = "font-view"
milestone = "M4"
summary = "When some selected glyphs export and others do not, the Exports checkbox shows a line (indeterminate) state."
ref = "Font View › Glyph Properties"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A click on the mixed box makes every selected glyph export. Settled by observation.",
]
observe = [
  "Select an exporting and a non-exporting glyph and click the mixed box: note the state of both.",
]

[[behavior]]
id = "fontView.inspector.metricsFields"
area = "spacing-kerning"
milestone = "M5"
summary = "The inspector shows LSB, RSB and width of the selected glyph on the current master, or TSB, BSB, vertical origin and vertical width after switching orientation. The fields accept numbers or metrics keys as defined in the spacing chapter."
ref = "Font View › Glyph Properties › Metrics"
status = "handbook"
notes = "Documented, not yet observed. LSB, RSB, width, TSB and BSB edit through spacing.setLeftSidebearing, setRightSidebearing, setWidth, setTopSidebearing and setBottomSidebearing, one command for all selected glyphs, on the layer of Font View's master. A developer's answer says the vertical origin defaults to the ascender (thread \"Ideas about a better vertical mode of the Edit view\", forum.glyphsapp.com/t/14230, 2020-03-29); the scripting API resets vertWidth and vertOrigin to their defaults with None (docu.glyphsapp.com). Vertical origin and vertical width edit through spacing.setVerticalOrigin and spacing.setVerticalWidth (`crates/ui/src/panels/font_view/metrics.rs`)."
guesses = [
  "A field shows the metrics key that governs it (the layer's own key first, written with ==), else the measured value with up to two decimals; a screenshot of the reference inspector on a glyph with a key would settle it.",
  "The orientation icon sits after the first field; the vertical set puts TSB and BSB on the first row and vertical origin and vertical width on a second row; a screenshot of the reference inspector would settle it.",
  "A field left empty commits nothing; trying it in the reference app would settle it.",
  "The vertical origin shows 0 and the vertical width shows ascender minus descender when the layer stores none; the reference inspector on a new glyph would settle it. The default place of the origin is the ascender (note), which the stored 0 stands for; the number the field shows for it is not documented.",
]
observe = [
  "Give a glyph an LSB key and a second one a fractional width: read their fields in the inspector.",
  "Switch to the vertical set and write down the fields and the place of the icon.",
  "Empty the LSB field of a glyph with a number and press Tab: note the value.",
  "Read O and H of a new glyph, with the ascender at 800 and the descender at −200.",
]

[[behavior]]
id = "fontView.inspector.kerningGroups"
area = "spacing-kerning"
milestone = "M5"
summary = "The inspector shows and edits the left and right kerning group names of the selected glyphs, so many glyphs can be assigned to a group in one step."
ref = "Font View › Glyph Properties › Kerning Groups"
status = "handbook"
notes = "Documented, not yet observed. The fields edit through kerning.setLeftGroup and kerning.setRightGroup, one command for all selected glyphs; an emptied field clears the group."

[[behavior]]
id = "fontView.inspector.tagsField"
area = "font-view"
milestone = "M4"
summary = "In the Tags field, a comma or the Return key commits the typed text as a tag on all selected glyphs and draws it as a blue capsule. The field lists the tags only when every selected glyph has the same set; otherwise it shows Multiple Values."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Leaving the Tags field also commits the typed text as a tag; Escape drops it. Settled by observation.",
  "Each capsule has a cross that removes the tag from every selected glyph (glyph.removeTag). Settled by observation.",
  "Several tags pasted at once with commas are added one command each. Settled by observation.",
]
observe = [
  "Type `foo` in Tags without Return and click a glyph cell; type `bar` and press Escape: note which is added.",
  "Look at a tag capsule for a cross, and at two glyphs that share it when it is removed.",
  "Paste `a, b, c` into the field and undo once.",
]

[[behavior]]
id = "fontView.contextMenu.tags"
area = "font-view"
milestone = "M4"
summary = "The Tags submenu of the glyph context menu lists every tag used anywhere in the font and is absent when the font has no tags. A checkmark means the selected glyphs carry the tag, a dash means only some do; choosing a tag adds it to all selected glyphs."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"
notes = "Answers 05 question 17 from the handbook: choosing a tag adds it to all selected glyphs, a checked tag included; tags are removed in the Tags field (glyph.removeTag). Documented, not yet observed."

# ── Glyph properties: rules ──

[[behavior]]
id = "glyph.nameIsUnique"
area = "font-view"
milestone = "M4"
summary = "The glyph name is the glyph's identity inside a font, so two glyphs can never share one. Any operation that would produce a duplicate must rename or refuse."
ref = "Font View › Glyph Properties › Glyph Name"
status = "handbook"

[[behavior]]
id = "glyph.niceNameVersusProductionName"
area = "import-export"
milestone = "M4"
summary = "Each glyph has a readable nice name used everywhere in the editor and a production name used only in exported font files. The swap happens automatically at export."
ref = "Font View › Glyph Properties › Glyph Name; Production Name"
status = "handbook"
notes = "Moved from M2 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): production names need the glyph database (M4). The production name of each name comes from crates/glyphdata (M4.1); the swap at export comes with M4.2."

[[behavior]]
id = "glyph.exportDefault"
area = "font-view"
milestone = "M4"
summary = "Glyphs are exported by default; the exception is any glyph whose name begins with an underscore. An instance can drop further glyphs through its Remove Glyphs parameter without touching the glyph flag."
ref = "Font View › Glyph Properties › Exports"
status = "handbook"

[[behavior]]
id = "glyph.colorLabelIndices"
area = "font-view"
milestone = "M4"
summary = "The twelve label colours are addressed by index or name: 0 Red, 1 Orange, 2 Brown, 3 Yellow, 4 Light Green, 5 Dark Green, 6 Cyan, 7 Blue, 8 Purple, 9 Pink, 10 Light Gray, 11 Dark Gray. Filters and scripts use these numbers and names."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "glyph.colorLabelsNotExported"
area = "font-view"
milestone = "M4"
summary = "Glyph and layer colour labels are source-only organisation aids and have no effect on exported fonts."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "glyph.tagRules"
area = "font-view"
milestone = "M4"
summary = "A glyph holds any number of short text tags. Tags may contain letters, digits, spaces and punctuation; the comma is the only forbidden character because it ends a tag while typing. Tags can drive smart filters, metric scopes and OpenType feature tokens."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"

[[behavior]]
id = "glyph.unicodeMultipleValues"
area = "font-view"
milestone = "M4"
summary = "A glyph may map several code points (an all-caps font can give A both U+0041 and U+0061) or none (glyphs reached only through features, and glyphs used purely as components)."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.unicodeFromName"
area = "font-view"
milestone = "M4"
summary = "A glyph's code points are derived from its name through the glyph database when the glyph is created or renamed. A value typed by the user is stored in the file and takes precedence for that file only."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.unicodeCustomGlyph"
area = "font-view"
milestone = "M4"
summary = "A glyph the database does not know needs its code point entered by hand, and should not reuse the name of a registered glyph. Private Use Area values such as U+E000 to U+F8FF are the suggested home for characters without a standard code point."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.unicodeNameForm"
area = "font-view"
milestone = "M4"
summary = "Glyphs without a readable name (most Han characters) are named after their code point: uni plus four hexadecimal digits, or u plus five or six digits, as in uni5B57 and u20547."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.productionNameDefault"
area = "import-export"
milestone = "M4"
summary = "Every glyph has a default production name following the Adobe Glyph List conventions, often of the uniXXXX or uXXXXX form. The user can override it per glyph in the expanded inspector or in Selection Info."
ref = "Font View › Glyph Properties › Production Name"
status = "handbook"
notes = "Moved from M2 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): production names need the glyph database (M4). The default comes from crates/glyphdata (M4.1); export writes it from M4.2."

[[behavior]]
id = "glyph.scriptProperty"
area = "font-view"
milestone = "M4"
summary = "The script property names the writing system of a glyph (R is latin, De-cy cyrillic, beh-ar arabic, ka-deva devanagari). Glyphs used by many scripts, such as digits, punctuation and spaces, have no script."
ref = "Font View › Glyph Properties › Script"
status = "handbook"

[[behavior]]
id = "glyph.categoryDefault"
area = "font-view"
milestone = "M4"
summary = "Exporting glyphs get a category, and where one exists a subcategory, from their name (T is Letter, six is Number, plus is Symbol, hyphen is Punctuation / Dash). Non-exporting helper glyphs such as component parts get none."
ref = "Font View › Glyph Properties › Category & Subcategory"
status = "handbook"

[[behavior]]
id = "glyph.caseValues"
area = "font-view"
milestone = "M4"
summary = "Case is one of uppercase, lowercase, small capital, minor or none. Uppercase and lowercase also apply to some punctuation (question is upper, questiondown lower) and to marks (acutecomb lower, acutecomb.case upper); everything else, including caseless scripts and most punctuation, has no case."
ref = "Font View › Glyph Properties › Case"
status = "handbook"

[[behavior]]
id = "glyph.caseFromSuffix"
area = "font-view"
milestone = "M4"
summary = "A name ending in .sc or .smcp gets the small-capital case. Minor case is given to subscript and superscript figures, letters and punctuation such as five.sups, ainferior and equalinferior."
ref = "Font View › Glyph Properties › Case"
status = "handbook"

[[behavior]]
id = "glyph.directionValues"
area = "font-view"
milestone = "M4"
summary = "Each glyph has a writing direction: left to right, right to left, or bidirectional. Much punctuation (hyphen, asterisk, underscore) is bidirectional."
ref = "Font View › Glyph Properties › Writing Direction"
status = "handbook"

[[behavior]]
id = "glyph.sortNameScope"
area = "font-view"
milestone = "M4"
summary = "The sort name replaces the glyph name as the ordering key in Font View and in exports. It is ignored while a list filter is shown (the list order wins) and when the font has a custom glyph order."
ref = "Font View › Glyph Properties › Sort Name"
status = "handbook"

[[behavior]]
id = "glyph.noteSearchable"
area = "font-view"
milestone = "M4"
summary = "A glyph note is arbitrary text stored with the glyph and is one of the fields the Font View search matches."
ref = "Font View › Glyph Properties › Note"
status = "handbook"

# ── Adding glyphs: input syntax ──

[[behavior]]
id = "addGlyphs.itemSeparator"
area = "font-view"
milestone = "M4"
summary = "The Add Glyphs text is split into items at spaces, line breaks and tabs."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs; tutorial \"Adding glyphs to your font\" (glyphsapp.com/learn)"
status = "handbook"
notes = "Line breaks and tabs come from the tutorial, checked in the M4 planning pass. Documented, not yet observed."

[[behavior]]
id = "addGlyphs.byName"
area = "font-view"
milestone = "M4"
summary = "An item that is a glyph name (Ccedilla, dollar, beh-ar.medi) creates a glyph with exactly that name; its Unicode values and other properties come from the database."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.byCharacter"
area = "font-view"
milestone = "M4"
summary = "An item that is a literal character creates the glyph for that code point under its database nice name, so typing the letter a-dieresis yields adieresis."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs; Naming Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.byUnicodeName"
area = "font-view"
milestone = "M4"
summary = "An item of the form uniXXXX (or uXXXXX) is treated as a code point and converted to the nice name when the database has one, so uni00E4 yields adieresis. With Use Custom Naming on, the typed name is kept."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs; Naming Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.range"
area = "font-view"
milestone = "M4"
summary = "Two items joined by a colon form an inclusive range: uni0218:uni021B adds four glyphs, alpha:omega adds the run of code points between the two named glyphs. The endpoints are resolved to code points and every code point in between is added."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.recipe"
area = "components"
milestone = "M6"
summary = "The Add Glyphs text field also accepts glyph recipes. The three forms are those of the Components page: component=glyph, base+mark=glyph and base+base=glyph (components.recipeSingleComponent, components.recipeBasePlusMarks, components.recipeMultipleBases). A recipe item builds the glyph named after the equals sign from the listed components."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs; Reusing Shapes › Components › Recipes"
status = "handbook"
notes = "Verified by the M6 planning pass against the handbook pages Glyph Set (the field accepts recipes) and Components › Recipes (the three forms); the recalled forms were right, the examples differ. Documented, not yet observed. glyph.addGlyphs parses each recipe item with `components::recipe` (at most 4,096 bytes and 64 parts) and builds the glyph with `components::compose::composite_glyph`: the parts in the written order, marks aligned to their base by anchors, bases side by side. The plain items of the same text are added first, so a recipe may use them, and a recipe may use an earlier recipe's glyph. The recipe forms base+mark=name and base=name are in the release notes since 1.3.11 (updates.glyphsapp.com/changelog.php)."
guesses = [
  "A recipe that names a glyph the font does not have adds nothing and is listed in `skipped` with the missing names; trying a recipe with a missing part in the reference app settles it.",
  "A recipe for a glyph the font already has follows the same Keep, Replace and Cancel answers as a plain name, and Replace rebuilds the glyph from the recipe, keeping its code points; a recipe for an existing glyph in the reference app settles it.",
  "The name after `=` is kept as typed, without turning a legacy name into a nice name, and gets the code point the glyph data gives it unless another glyph has it; a recipe ending in `=uni00E9` in the reference app settles it.",
]
observe = [
  "Add `A+nosuchcomb=Atest`: note what is added and what is said.",
  "Add `A+acutecomb=Aacute` when Aacute exists, with Replace: note the glyph and its Unicode values.",
  "Add `E+acutecomb=uni00C9`: note the name and the Unicode value.",
]

[[behavior]]
id = "addGlyphs.existingNotDuplicated"
area = "font-view"
milestone = "M4"
summary = "Requested names that already exist are never added a second time. They are listed in a dialog with three outcomes: Replace (existing glyphs become new empty glyphs), Keep Existing (only the new names are added), Cancel (nothing is added, including the new names)."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.autoInfo"
area = "font-view"
milestone = "M4"
summary = "A newly created glyph takes its Unicode values, category, subcategory, script and default composition from the database entry of its name, and its name decides which automatic OpenType features it joins."
ref = "Font View › Names & Unicode › Naming Glyphs"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.missingBadge"
area = "font-view"
milestone = "M4"
summary = "A sidebar entry with a known full set shows a grey badge with glyphs present and glyphs expected when some are missing, a checkmark when all are present, and a plain count when no expected total is known."
ref = "Font View › Filtering Font View › Categories; Adding From the Sidebar"
status = "handbook"
notes = "The expected glyphs are glyph names: a glyph with the character but another name counts as missing (developer's answer in the thread \"Sidebar 'Missing Glyphs' - conceptual flaw\", forum.glyphsapp.com/t/5422, 2016-11-21, version 2; Unicode lists were then only considered). FontCraft counts a glyph that has the character too (05 question 21)."
observe = [
  "In a font whose euro glyph is named Euro (with U+20AC), read the badge of Symbol › Currency or a language that needs it: is the glyph counted as missing?",
]

# ── Copy and paste of glyphs ──

[[behavior]]
id = "fontView.copy.glyphs"
area = "font-view"
milestone = "M4"
summary = "In Font View, edit.copy (Cmd+C) puts the selected glyphs, with all their data, on the clipboard so they can be pasted into another font file."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "edit.copy with `glyphs` returns the glyphs whole as JSON text (format fontcraft-glyphs) with the masters they belong to, the master shown and each master layer's side bearings, for edit.paste and edit.pasteSpecial. Documented, not yet observed."

[[behavior]]
id = "fontView.paste.glyphs"
area = "font-view"
milestone = "M4"
summary = "In Font View, edit.paste (Cmd+V) adds the copied glyphs to the target font as new glyphs."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "edit.paste recognises the copied-glyphs text in `json` or `text`. Documented, not yet observed."
guesses = [
  "Pasted glyphs take their place in the default sort order, like added glyphs. Settled by observation.",
]
observe = [
  "Paste B from another font into a font that lacks it: note where it stands.",
]

[[behavior]]
id = "fontView.paste.nameClashSuffix"
area = "font-view"
milestone = "M4"
summary = "A pasted glyph whose name is taken is renamed with the first free three-digit counter suffix: A.001, then A.002, and so on. The existing glyph is left untouched."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs3.4-3434.html): pasting in Font View brings up the dialog about glyphs already in the font (version 3, build 3228), while the version 4 handbook describes the suffix only."
guesses = [
  "A renamed pasted glyph has no code points, so the existing glyph stays the one for its characters. Settled by observation.",
]
observe = [
  "Paste A into a font that has A: note whether a dialog appears, the new glyph's name and its Unicode value.",
]

[[behavior]]
id = "fontView.paste.componentsRelink"
area = "components"
milestone = "M6"
summary = "Components in pasted glyphs are re-pointed by name at glyphs of the target font. A component whose base glyph does not exist there stays unresolved and is drawn as the triangle placeholder used for components without a base glyph."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "Documented. Components name their base glyph, so a pasted composite draws the target font's glyph of that name; a name the target lacks stays on the component, which draws as the missing-base placeholder until the glyph is added (`pasted_composites_draw_the_target_fonts_glyphs`)."

[[behavior]]
id = "pasteSpecial.modeSameName"
area = "font-view"
milestone = "M4"
summary = "Glyphs With Same Name: each copied glyph overwrites the target glyph of the same name; copied glyphs with no counterpart are added as new glyphs."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.modeSelected"
area = "font-view"
milestone = "M4"
summary = "Selected Glyphs: the copied glyphs overwrite the glyphs selected in the target, paired in order, and the targets keep their own names. Copied glyphs beyond the number of selected targets are dropped."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.modeAsComponents"
area = "components"
milestone = "M4"
summary = "As Components: each copied glyph is inserted as a component into the selected target glyphs, keeping the paths and components already there. All Masters inserts on every master instead of the current one."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "Moved from M6 to M4: edit.pasteSpecial adds the components; nothing else of M6 is needed. Documented, not yet observed."

[[behavior]]
id = "pasteSpecial.partAllData"
area = "font-view"
milestone = "M4"
summary = "All Data transfers the whole glyph: shapes, anchors, layer attributes and metrics. It implies every other part."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.partActiveLayer"
area = "font-view"
milestone = "M4"
summary = "Content of Active Layer transfers only the layer that was displayed when copying."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.partKerningGroups"
area = "spacing-kerning"
milestone = "M4"
summary = "Kerning Groups transfers only the left and right kerning group names, which lets kerning classes be mirrored between related fonts."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "Moved from M5 to M4 with edit.pasteSpecial, which copies the stored group names. Documented, not yet observed."

[[behavior]]
id = "pasteSpecial.partMetricsKeys"
area = "spacing-kerning"
milestone = "M4"
summary = "Metric Keys transfers only the sidebearing and width formulas. The numeric metrics are not recomputed until Update Metrics (Cmd+Ctrl+M) or Update Metrics for All Masters (Cmd+Ctrl+Alt+M) is run."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "Moved from M5 to M4 with edit.pasteSpecial, which copies the glyph's and its master layers' keys. Update Metrics stays with M5. Documented, not yet observed."

[[behavior]]
id = "pasteSpecial.partMetricValues"
area = "spacing-kerning"
milestone = "M4"
summary = "LSB, RSB and Width are separate choices that transfer the numeric left sidebearing, right sidebearing and advance width. When RSB and Width are both chosen, the right sidebearing wins and the width follows from it."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
notes = "Moved from M5 to M4 with edit.pasteSpecial. Side bearings are measured with components resolved, in the source font when copying and in the target font when pasting. Documented, not yet observed."

# ── Deleting glyphs ──

[[behavior]]
id = "removeGlyph.confirm"
area = "font-view"
milestone = "M4"
summary = "Glyph removal always asks for confirmation first; Cancel leaves the font unchanged."
ref = "Font View › Deleting Glyphs"
status = "handbook"
notes = "The dialog belongs to the shell; running glyph.removeGlyph is the confirmed action. With `confirm: false` the command changes nothing and returns the components and metrics keys the follow-up questions concern, so the dialog knows which buttons to show."

[[behavior]]
id = "removeGlyph.usedAsComponent"
area = "components"
milestone = "M4"
summary = "When a glyph to be deleted is referenced by components elsewhere, the dialog gains a Decompose button. Remove deletes the glyph together with every component pointing at it; Decompose first converts those components to outlines and then deletes the glyph."
ref = "Font View › Deleting Glyphs"
status = "handbook"
notes = "Moved from M6 to M4: glyph.removeGlyph takes the answer as `components`, and decomposing needs only the layers, not M6's component editing. In dialog.removeGlyph, Decompose is the default button. Documented, not yet observed."
guesses = ["Decompose reverses each path that a mirroring component transform (negative determinant) places, as export decomposition does, so the outline keeps its direction. Settled by decomposing a mirrored component in the reference app and checking the path direction."]
observe = [
  "Decompose a component mirrored with a negative scale and note the path's direction.",
]

[[behavior]]
id = "removeGlyph.linkedMetricsKeys"
area = "spacing-kerning"
milestone = "M4"
summary = "If glyphs that remain hold metrics keys pointing at a glyph being deleted, a dialog comes up with Remove, which dissolves those keys, or Cancel, which keeps the dangling keys in place."
ref = "Font View › Deleting Glyphs"
status = "handbook"
notes = "Moved from M5 to M4: glyph.removeGlyph takes the answer as `metricsKeys` (dissolve or keep). Showing a dangling key in turquoise stays with M5. Documented, not yet observed."

[[behavior]]
id = "metricsKeys.unlinkedDisplay"
area = "spacing-kerning"
milestone = "M5"
summary = "A metrics key whose target glyph does not exist is shown in turquoise. It is repaired by pointing it at another glyph, replacing it with a number, or creating the missing glyph."
ref = "Font View › Deleting Glyphs"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.8a for the Edit View Info box: a key that `spacing.listOutOfSyncMetrics` reports as unlinked is drawn turquoise and has no update button."

# ── Glyph database ──

[[behavior]]
id = "glyphData.fields"
area = "font-view"
milestone = "M4"
summary = "Each database record carries: nice name, production name, Unicode value, components of composites, default anchors, marks shown in the mark cloud, script, category and subcategory. The published GlyphData.xml adds case, direction, description, alternative names and a legacy Unicode value."
ref = "Font View › Names & Unicode › Glyph Info Database; GlyphsInfo GlyphData.xml"
status = "handbook"
notes = "FontCraft's built-in database is GlyphsInfo's GlyphData.xml and GlyphData_Ideographs.xml at a pinned commit, with the Adobe Glyph List and the Unicode Character Database for names GlyphsInfo lacks. This is the owner's decision (docs/plans/M4.md § 7 question 2): it is the only open data with the reference's names, categories and production names, and fontc and glyphsLib read the same file. Components, anchors and mark-cloud marks are not in the published data and stay empty unless custom data gives them. M4.1 bundles the data, with the AGL and Unicode 17.0 properties, as crates/glyphdata/data/glyphdata.bin (cargo xtask glyphdata --generate)."

[[behavior]]
id = "glyphData.xmlAttributes"
area = "font-view"
milestone = "M4"
summary = "A GlyphData.xml file is a glyphData root holding empty glyph elements. name and category are required attributes; unicode, unicodeLegacy, subCategory, case, direction, script, description, production and altNames are optional. Code points are bare hexadecimal without a prefix and altNames is a comma-separated list."
ref = "GlyphsInfo GlyphData.xml (DTD)"
status = "docs"
notes = "crates/glyphdata/src/xml.rs reads this form, for the bundled files and for custom ones (M4.1)."

[[behavior]]
id = "glyphData.tabularFields"
area = "font-view"
milestone = "M4"
summary = "The tab-separated form of the database has these columns in order: unicode, name, sortName, sortNameKeep, decompose, category, subCategory, script, production, altNames, description, anchors, accents. The last-named extras (sort names, decomposition, anchors, accents) are absent from the published XML but may appear in custom data."
ref = "GlyphsInfo Convert to tabbed file.py"
status = "docs"
notes = "A custom GlyphData.xml may carry sortName, sortNameKeep, decompose, anchors and marks (or accents); crates/glyphdata reads them into the record (M4.1)."

[[behavior]]
id = "glyphData.categoryVocabulary"
area = "font-view"
milestone = "M4"
summary = "Categories used by the published data are Letter, Mark, Number, Punctuation, Separator and Symbol. Readers of the format also accept Space and Other."
ref = "GlyphsInfo GlyphData.xml; fontc glyphs-reader glyphdata.rs"
status = "docs"
notes = "The Category type of crates/glyphdata holds these values (M4.1)."

[[behavior]]
id = "glyphData.subCategoryVocabulary"
area = "font-view"
milestone = "M4"
summary = "Subcategories in the published data: Arrow, Compatibility, Currency, Dash, Decimal Digit, Emoji, Enclosing, Format, Fraction, Geometry, Halfform, Jamo, Letter, Ligature, Math, Matra, Modifier, Nonspacing, Parenthesis, Quote, Radical, Small, Space, Spacing, Spacing Combining, Superscript, Syllable. Readers also accept Composition, Conjunct, Lowercase, Number, Other, Smallcaps and Uppercase."
ref = "GlyphsInfo GlyphData.xml; fontc glyphs-reader glyphdata.rs"
status = "docs"
notes = "The SubCategory type of crates/glyphdata holds these values (M4.1)."

[[behavior]]
id = "glyphData.caseAndDirectionEncoding"
area = "font-view"
milestone = "M4"
summary = "In the data, case is upper, lower, minor or smallCaps and a missing attribute means no case; direction is RTL or BIDI and a missing attribute means left to right. Source files may additionally store noCase / other and LTR / VTR / VTL."
ref = "GlyphsInfo GlyphData.xml; GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). A record without a direction gets one from its script (the tutorial \"Roll your own glyph data\" mentions a list of directions per script)."
guesses = [
  "A script is right to left when most of its letters with a code point are strong right-to-left characters in Unicode 17.0: adlam, arabic, avestan, chorasmian, elymaic, hebrew, mandaic, nko, rovas, samaritan, syriac, thaana and yezidi. A glyph with neither a stated direction nor a script is right to left when the character its name stands for is. Settled by observing the reference's directions.",
]
observe = [
  "Read the writing direction of alef-hb, meem-ar, a Syriac, an NKo and an Adlam glyph, and of a name such as `uni061F`.",
]

[[behavior]]
id = "glyphData.ideographsFile"
area = "font-view"
milestone = "M4"
summary = "Han ideographs live in a second file, GlyphData_Ideographs.xml, with the same record shape. Their names are code-point names, their script is han, and they carry little more than category and subcategory (for example Radical or Compatibility)."
ref = "GlyphsInfo README.md; GlyphData_Ideographs.xml"
status = "docs"
notes = "crates/glyphdata bundles these records as code-point ranges (1,641 ranges for 40,337 records) and builds each record on demand (M4.1)."

[[behavior]]
id = "glyphData.niceNameScheme"
area = "font-view"
milestone = "M4"
summary = "Nice names start from the Adobe Glyph List with adjustments; glyphs outside it get a short invented name based on the Unicode description. A hyphen plus script tag separates scripts: short tags for common scripts (-ar, -cy), the full script name for most others."
ref = "GlyphsInfo README.md"
status = "docs"
notes = "GlyphData::nice_name (code point to name) and GlyphData::canonical_name (legacy, production, alternative and code-point names to the nice name, suffixes kept) in crates/glyphdata (M4.1)."

[[behavior]]
id = "glyphData.implicitProductionName"
area = "import-export"
milestone = "M4"
summary = "A database record without a production attribute uses its nice name as the production name (Aacute stays Aacute). Records that need a different export name state it, mostly as uniXXXX or uXXXXX and occasionally as a custom name such as two_fraction_seven."
ref = "GlyphsInfo GlyphData.xml"
status = "docs"
notes = "Moved from M2 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): production names need the glyph database (M4). Built in crates/glyphdata (M4.1). A record found by code point or alternative name that has no production attribute exports under the glyph's own name, as both oracles do. `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.legacyUnicode"
area = "font-view"
milestone = "M4"
summary = "unicodeLegacy records a code point that is not written into a font, mostly a compatibility or presentation form (noon-ar.init has FEE7, f_f_l has FB04). It is never assigned to a glyph."
ref = "GlyphsInfo GlyphData.xml; tutorial \"Roll your own glyph data\" (glyphsapp.com/learn)"
status = "docs"
notes = "Answers 05 question 3 from the tutorial, checked in the M4 planning pass. The tutorial names one exception, the Use Arabic Presentation Form Unicodes parameter, meant for testing only; it is not an M4 row. Documented, not yet observed. Lookup never uses legacy code points, as in both oracles; GlyphData::by_legacy_code_point in crates/glyphdata finds the record for the guess below (M4.1)."
guesses = [
  "Adding by a legacy character (typing U+FB04) finds the record through unicodeLegacy and creates f_f_l without a code point. Settled by observation.",
]
observe = [
  "Type ﬄ (U+FB04) in Add Glyphs: note the name and the Unicode value.",
]

[[behavior]]
id = "glyphData.altNames"
area = "font-view"
milestone = "M4"
summary = "Alternative names are extra lookup keys for a record (A-cy also answers to Acyrillic and afii10017). They never displace a record's own name, and a match by alternative name yields category, script and production name but no code point."
ref = "GlyphsInfo GlyphData.xml; fontc glyphs-reader glyphdata.rs"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). Three alternative names in the pinned data are another record's own name (ustroke, compass, perpendicular); they resolve to that record. `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.lookupOrder"
area = "font-view"
milestone = "M4"
summary = "A property is resolved in this order: the value stored on the glyph in the file, a custom glyph-data entry (by name, then by one of the glyph's code points), the built-in record (by nice name, then by production name, then by code point), and finally synthesis from the name."
ref = "fontc glyphs-reader glyphdata.rs; GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). The built-in order is nice name, alternative name, production name, then code point, as in both oracles. `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."
guesses = [
  "When two built-in records share a code point or a production name, the first by name wins; the pinned data has no such pair. Settled by observation.",
]
observe = [
  "Put two records with the same code point in a custom GlyphData.xml, add a glyph by that character and note which record names it.",
]

[[behavior]]
id = "glyphData.suffixInheritance"
area = "font-view"
milestone = "M4"
summary = "A name with a dot suffix takes the properties of the name before the dot: n.alt, n.ss05 and n.002 all behave like n. Names without the dot (nalt, nss05, n002) inherit nothing and need every property set by hand."
ref = "Font View › Names & Unicode › Glyph Info Database"
status = "handbook"
notes = "Built in crates/glyphdata (M4.1). A suffixed name also takes its base's script and case, and a .sc, .smcp or .c2sc suffix gives small-caps case. `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.suffixSplit"
area = "font-view"
milestone = "M4"
summary = "The base name is normally everything before the first dot. When a name has several dots, a longer prefix that is itself a known database name is preferred, so a record whose own name contains a dot is still found."
ref = "fontc glyphs-reader glyphdata.rs"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.ligatureCategory"
area = "font-view"
milestone = "M4"
summary = "An unknown base name containing underscores is split into parts and judged by the first part: a Mark first part makes the whole glyph a Mark with that subcategory; a Letter followed only by marks, separators or unknown parts keeps the first part's category and subcategory; a Letter followed by anything else becomes Letter / Ligature."
ref = "fontc glyphs-reader glyphdata.rs"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.ligatureScriptSuffix"
area = "font-view"
milestone = "M4"
summary = "When a ligature name ends in a script suffix, that suffix is applied to every part that has none before the parts are looked up (lam_alif-ar is read as lam-ar plus alif-ar). A part keeps its bare form when the bare name is known and the suffixed one is not."
ref = "fontc glyphs-reader glyphdata.rs; Font View › Glyph Naming Rules"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.aglFallbackCategory"
area = "font-view"
milestone = "M4"
summary = "A base name unknown to the database is parsed by the Adobe Glyph List rules; the Unicode general category of its first character then picks the category and subcategory (for example Nonspacing Mark gives Mark / Nonspacing, Math Symbol gives Symbol / Math, Private Use gives Letter / Compatibility). An underscore in the name turns any non-mark result into subcategory Ligature."
ref = "fontc glyphs-reader glyphdata.rs; agl-aglfn README.md"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). The general categories are Unicode 17.0's, as in glyphs-reader 1.0.0. `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.underscorePrefixNoCategory"
area = "font-view"
milestone = "M4"
summary = "A name starting with an underscore is never given a synthesised category, matching the rule that non-exporting helper glyphs have none."
ref = "fontc glyphs-reader glyphdata.rs; Font View › Category & Subcategory"
status = "docs"
notes = "Built in crates/glyphdata (M4.1). Such names get no synthesised script or case either. `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."

[[behavior]]
id = "glyphData.customFile"
area = "font-view"
milestone = "M4"
summary = "A user-supplied GlyphData.xml changes glyph properties for all files on the machine and can teach the app custom names, so that Unicode values and categories are still assigned automatically for them. Per-file overrides on individual glyphs remain possible on top."
ref = "Font View › Names & Unicode › Glyph Info Database; Naming Glyphs"
status = "handbook"
notes = "crates/glyphdata reads custom files (GlyphData::with_custom): files later in the list win per record. The session merges the user's files (GlyphData*.xml in the Info folder of the settings folder, read once at launch by Session::load_user_info) and the files beside the document's source (read by file.open); a malformed file is skipped and reported, the others still apply (crates/engine/src/glyph_data.rs). A custom file whose XML is broken is ignored (tutorial \"Roll your own glyph data\", glyphsapp.com/learn, updated 2022-08-08). Glyph data, groups and filters also load from the Info folder of the system-wide Application Support folder (4.0 release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs4.0-4000.html), build 3837)."
guesses = [
  "A custom record replaces the built-in record of the same name as a whole: fields it leaves out are empty, not taken from the built-in record. Settled by observation.",
  "A file over a limit (16 MB, 200,000 records, 1,024 bytes per attribute value, two levels of elements) or with an entity declaration is rejected as a whole, as a file with broken XML is (note); attributes the format does not define are skipped with a warning.",
  "The user's files are read once, when the window opens; a changed file applies at the next launch. FontCraft reads no system-wide folder.",
  "Beside a source file and in the Info folder beside it, every file named GlyphData*.xml is read, in name order, those beside the file first; at most 32 files of the user's and 32 of a document's. The reference also reads the user's Info folder and, from 4.0 build 3837, a system-wide one; the order between several files is not documented.",
]
observe = [
  "Give a custom record for A with only name and category, restart, and read A's Unicode value, script and production name.",
  "Break one attribute of one record in a custom file, restart, and note whether the file's other records are used.",
  "Put GlyphData-x.xml and GlyphData-a.xml with different records for one name into the Info folder and note which applies.",
]

[[behavior]]
id = "glyphData.aglRecordFormats"
area = "import-export"
milestone = "M4"
summary = "The Adobe Glyph List is a text file of name;codepoints records (one or more four-digit uppercase hex values separated by spaces). AGLFN, the subset recommended for new fonts, has codepoint;name;character-name records. Lines starting with # are comments and blank lines are skipped."
ref = "agl-aglfn README.md; glyphlist.txt; aglfn.txt"
status = "docs"
notes = "Moved from M2 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): the Adobe Glyph List arrives with the glyph database (M4). Built in crates/glyphdata (M4.1). The generator reads both files (build::parse_agl, build::parse_aglfn)."

