# ═════════════════════════════ Behaviours ═════════════════════════════

# ── Grid cells ──

[[behavior]]
id = "fontView.cell.followsMaster"
area = "font-view"
milestone = "M4"
summary = "Every grid cell draws the glyph's layer for the master currently selected in the font window, so switching masters redraws the whole grid."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.contentBySize"
area = "font-view"
milestone = "M4"
summary = "Large cells show outline, glyph name and Unicode information; small cells show the outline only. The size at which the labels disappear is not stated."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.unicodeIndicator"
area = "font-view"
milestone = "M4"
summary = "A glyph with a code point shows a small marker at the bottom right of its cell, beside the name. For CJK glyphs the marker is replaced by the character itself rendered small in the system font."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.displayUnicodeValue"
area = "font-view"
milestone = "M4"
summary = "With the application setting Display Unicode Value on, cells print the full hexadecimal code point instead of the small marker."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.badgeMetricsOutOfSync"
area = "spacing-kerning"
milestone = "M5"
summary = "A cell shows a warning triangle at its top right when at least one metrics key of the glyph no longer matches its computed value."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.badgeAnnotation"
area = "font-view"
milestone = "M4"
summary = "A yellow note badge marks a glyph that has an annotation on the layer of the active master."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.badgeCustomInfo"
area = "font-view"
milestone = "M4"
summary = "A black info badge marks a glyph whose stored properties deviate from what the glyph database would give for its name."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.badgeIncompatible"
area = "interpolation"
milestone = "M9"
summary = "A red top-left corner marks a glyph whose layers are not all compatible for interpolation."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.badgeNonExporting"
area = "font-view"
milestone = "M4"
summary = "A glyph whose export flag is off is marked by a struck-through red ring."
ref = "Font View › Grid View"
status = "handbook"

[[behavior]]
id = "fontView.cell.colorGlyphOnly"
area = "font-view"
milestone = "M4"
summary = "A glyph colour label tints the whole cell."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "fontView.cell.colorLayerOnly"
area = "font-view"
milestone = "M4"
summary = "When only the layer of the current master has a colour label, the colour fills the whole cell except for a cut-out at the top left."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "fontView.cell.colorGlyphAndLayer"
area = "font-view"
milestone = "M4"
summary = "When both labels are set, the glyph colour fills the cell and the layer colour is painted over its right half."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "fontView.cell.imageDisplay"
area = "color"
milestone = "M11"
summary = "A cell shows the image placed on the layer when View → Show Image is on. A glyph with no paths and no components shows its image even when that option is off."
ref = "Font View › Images"
status = "handbook"

# ── List View columns ──

[[behavior]]
id = "fontView.column.id"
area = "font-view"
milestone = "M4"
summary = "The ID column holds the glyph's position in glyph order, which is the order used in exported fonts; sorting by it shows the font in export order."
ref = "Font View › Glyph Properties › ID"
status = "handbook"

[[behavior]]
id = "fontView.column.char"
area = "font-view"
milestone = "M4"
summary = "The Char column renders the glyph's character in the system font. A glyph with several code points shows only the first; a glyph with none shows nothing."
ref = "Font View › Glyph Properties › Char"
status = "handbook"

[[behavior]]
id = "fontView.column.name"
area = "font-view"
milestone = "M4"
summary = "The Name column shows the nice name and is editable by a single click, with the same renaming rules as the grid."
ref = "Font View › Names & Unicode › Naming Glyphs"
status = "handbook"

[[behavior]]
id = "fontView.column.unicode"
area = "font-view"
milestone = "M4"
summary = "The Unicode column lists the code points of the glyph and can be edited in place."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "fontView.column.note"
area = "font-view"
milestone = "M4"
summary = "The Note column shows and edits the free-text glyph note; List View is the documented place to edit notes in Font View."
ref = "Font View › Glyph Properties › Note"
status = "handbook"

[[behavior]]
id = "fontView.column.components"
area = "components"
milestone = "M6"
summary = "The Components column lists the names of the components used by the glyph; editing the cell adds or removes components to match."
ref = "Font View › Glyph Properties › Components"
status = "handbook"

[[behavior]]
id = "fontView.column.lastChanged"
area = "font-view"
milestone = "M4"
summary = "The Last Changed column shows a timestamp refreshed whenever the glyph is modified. A font-level Write lastChange parameter set to off stops the timestamp from being updated, which keeps version-control diffs quiet."
ref = "Font View › Glyph Properties › Last Changed"
status = "handbook"

[[behavior]]
id = "fontView.column.otherProperties"
area = "font-view"
milestone = "M4"
summary = "The source says every glyph property has a column but names only seven. We plan columns for production name, script, category, subcategory, case, direction, export, colour label, tags, sort name, metrics, metrics keys and kerning groups as well; the reference's actual column set must be observed."
ref = "Font View › List View"
status = "inferred"

# ── Inspector ──

[[behavior]]
id = "fontView.inspector.mixedText"
area = "font-view"
milestone = "M4"
summary = "When the selected glyphs differ in a text property, the field shows a grey Multiple Values placeholder. Typing a value replaces the property on every selected glyph."
ref = "Font View › Glyph Properties"
status = "handbook"

[[behavior]]
id = "fontView.inspector.mixedExport"
area = "font-view"
milestone = "M4"
summary = "When some selected glyphs export and others do not, the Exports checkbox shows a line (indeterminate) state."
ref = "Font View › Glyph Properties"
status = "handbook"

[[behavior]]
id = "fontView.inspector.metricsFields"
area = "spacing-kerning"
milestone = "M5"
summary = "The inspector shows LSB, RSB and width of the selected glyph on the current master, or TSB, BSB, vertical origin and vertical width after switching orientation. The fields accept numbers or metrics keys as defined in the spacing chapter."
ref = "Font View › Glyph Properties › Metrics"
status = "handbook"

[[behavior]]
id = "fontView.inspector.kerningGroups"
area = "spacing-kerning"
milestone = "M5"
summary = "The inspector shows and edits the left and right kerning group names of the selected glyphs, so many glyphs can be assigned to a group in one step."
ref = "Font View › Glyph Properties › Kerning Groups"
status = "handbook"

[[behavior]]
id = "fontView.inspector.tagsField"
area = "font-view"
milestone = "M4"
summary = "In the Tags field, a comma or the Return key commits the typed text as a tag on all selected glyphs and draws it as a blue capsule. The field lists the tags only when every selected glyph has the same set; otherwise it shows Multiple Values."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"

[[behavior]]
id = "fontView.contextMenu.tags"
area = "font-view"
milestone = "M4"
summary = "The Tags submenu of the glyph context menu lists every tag used anywhere in the font and is absent when the font has no tags. A checkmark means the selected glyphs carry the tag, a dash means only some do; choosing a tag adds it to all selected glyphs."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"

# ── Glyph properties: rules ──

[[behavior]]
id = "glyph.nameIsUnique"
area = "font-view"
milestone = "M4"
summary = "The glyph name is the glyph's identity inside a font, so two glyphs can never share one. Any operation that would produce a duplicate must rename or refuse."
ref = "Font View › Glyph Properties › Glyph Name"
status = "handbook"

[[behavior]]
id = "glyph.niceNameVersusProductionName"
area = "import-export"
milestone = "M2"
summary = "Each glyph has a readable nice name used everywhere in the editor and a production name used only in exported font files. The swap happens automatically at export."
ref = "Font View › Glyph Properties › Glyph Name; Production Name"
status = "handbook"

[[behavior]]
id = "glyph.exportDefault"
area = "font-view"
milestone = "M4"
summary = "Glyphs are exported by default; the exception is any glyph whose name begins with an underscore. An instance can drop further glyphs through its Remove Glyphs parameter without touching the glyph flag."
ref = "Font View › Glyph Properties › Exports"
status = "handbook"

[[behavior]]
id = "glyph.colorLabelIndices"
area = "font-view"
milestone = "M4"
summary = "The twelve label colours are addressed by index or name: 0 Red, 1 Orange, 2 Brown, 3 Yellow, 4 Light Green, 5 Dark Green, 6 Cyan, 7 Blue, 8 Purple, 9 Pink, 10 Light Gray, 11 Dark Gray. Filters and scripts use these numbers and names."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "glyph.colorLabelsNotExported"
area = "font-view"
milestone = "M4"
summary = "Glyph and layer colour labels are source-only organisation aids and have no effect on exported fonts."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[behavior]]
id = "glyph.tagRules"
area = "font-view"
milestone = "M4"
summary = "A glyph holds any number of short text tags. Tags may contain letters, digits, spaces and punctuation; the comma is the only forbidden character because it ends a tag while typing. Tags can drive smart filters, metric scopes and OpenType feature tokens."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"

[[behavior]]
id = "glyph.unicodeMultipleValues"
area = "font-view"
milestone = "M4"
summary = "A glyph may map several code points (an all-caps font can give A both U+0041 and U+0061) or none (glyphs reached only through features, and glyphs used purely as components)."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.unicodeFromName"
area = "font-view"
milestone = "M4"
summary = "A glyph's code points are derived from its name through the glyph database when the glyph is created or renamed. A value typed by the user is stored in the file and takes precedence for that file only."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.unicodeCustomGlyph"
area = "font-view"
milestone = "M4"
summary = "A glyph the database does not know needs its code point entered by hand, and should not reuse the name of a registered glyph. Private Use Area values such as U+E000 to U+F8FF are the suggested home for characters without a standard code point."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.unicodeNameForm"
area = "font-view"
milestone = "M4"
summary = "Glyphs without a readable name (most Han characters) are named after their code point: uni plus four hexadecimal digits, or u plus five or six digits, as in uni5B57 and u20547."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[behavior]]
id = "glyph.productionNameDefault"
area = "import-export"
milestone = "M2"
summary = "Every glyph has a default production name following the Adobe Glyph List conventions, often of the uniXXXX or uXXXXX form. The user can override it per glyph in the expanded inspector or in Selection Info."
ref = "Font View › Glyph Properties › Production Name"
status = "handbook"

[[behavior]]
id = "glyph.scriptProperty"
area = "font-view"
milestone = "M4"
summary = "The script property names the writing system of a glyph (R is latin, De-cy cyrillic, beh-ar arabic, ka-deva devanagari). Glyphs used by many scripts, such as digits, punctuation and spaces, have no script."
ref = "Font View › Glyph Properties › Script"
status = "handbook"

[[behavior]]
id = "glyph.categoryDefault"
area = "font-view"
milestone = "M4"
summary = "Exporting glyphs get a category, and where one exists a subcategory, from their name (T is Letter, six is Number, plus is Symbol, hyphen is Punctuation / Dash). Non-exporting helper glyphs such as component parts get none."
ref = "Font View › Glyph Properties › Category & Subcategory"
status = "handbook"

[[behavior]]
id = "glyph.caseValues"
area = "font-view"
milestone = "M4"
summary = "Case is one of uppercase, lowercase, small capital, minor or none. Uppercase and lowercase also apply to some punctuation (question is upper, questiondown lower) and to marks (acutecomb lower, acutecomb.case upper); everything else, including caseless scripts and most punctuation, has no case."
ref = "Font View › Glyph Properties › Case"
status = "handbook"

[[behavior]]
id = "glyph.caseFromSuffix"
area = "font-view"
milestone = "M4"
summary = "A name ending in .sc or .smcp gets the small-capital case. Minor case is given to subscript and superscript figures, letters and punctuation such as five.sups, ainferior and equalinferior."
ref = "Font View › Glyph Properties › Case"
status = "handbook"

[[behavior]]
id = "glyph.directionValues"
area = "font-view"
milestone = "M4"
summary = "Each glyph has a writing direction: left to right, right to left, or bidirectional. Much punctuation (hyphen, asterisk, underscore) is bidirectional."
ref = "Font View › Glyph Properties › Writing Direction"
status = "handbook"

[[behavior]]
id = "glyph.sortNameScope"
area = "font-view"
milestone = "M4"
summary = "The sort name replaces the glyph name as the ordering key in Font View and in exports. It is ignored while a list filter is shown (the list order wins) and when the font has a custom glyph order."
ref = "Font View › Glyph Properties › Sort Name"
status = "handbook"

[[behavior]]
id = "glyph.noteSearchable"
area = "font-view"
milestone = "M4"
summary = "A glyph note is arbitrary text stored with the glyph and is one of the fields the Font View search matches."
ref = "Font View › Glyph Properties › Note"
status = "handbook"

# ── Adding glyphs: input syntax ──

[[behavior]]
id = "addGlyphs.itemSeparator"
area = "font-view"
milestone = "M4"
summary = "The Add Glyphs text is split into items at spaces. Whether line breaks and tabs also separate items is not stated; we treat any whitespace as a separator."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.byName"
area = "font-view"
milestone = "M4"
summary = "An item that is a glyph name (Ccedilla, dollar, beh-ar.medi) creates a glyph with exactly that name; its Unicode values and other properties come from the database."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.byCharacter"
area = "font-view"
milestone = "M4"
summary = "An item that is a literal character creates the glyph for that code point under its database nice name, so typing the letter a-dieresis yields adieresis."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs; Naming Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.byUnicodeName"
area = "font-view"
milestone = "M4"
summary = "An item of the form uniXXXX (or uXXXXX) is treated as a code point and converted to the nice name when the database has one, so uni00E4 yields adieresis. With Use Custom Naming on, the typed name is kept."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs; Naming Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.range"
area = "font-view"
milestone = "M4"
summary = "Two items joined by a colon form an inclusive range: uni0218:uni021B adds four glyphs, alpha:omega adds the run of code points between the two named glyphs. The endpoints are resolved to code points and every code point in between is added."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.recipe"
area = "components"
milestone = "M6"
summary = "The field also accepts glyph recipes, defined in another chapter. From memory a recipe has the form base+mark=newName, which builds newName as a composite of the listed glyphs, and source=newName, which builds newName from a single component; exact syntax must be taken from the components chapter."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "memory"

[[behavior]]
id = "addGlyphs.existingNotDuplicated"
area = "font-view"
milestone = "M4"
summary = "Requested names that already exist are never added a second time. They are listed in a dialog with three outcomes: Replace (existing glyphs become new empty glyphs), Keep Existing (only the new names are added), Cancel (nothing is added, including the new names)."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[behavior]]
id = "addGlyphs.autoInfo"
area = "font-view"
milestone = "M4"
summary = "A newly created glyph takes its Unicode values, category, subcategory, script and default composition from the database entry of its name, and its name decides which automatic OpenType features it joins."
ref = "Font View › Names & Unicode › Naming Glyphs"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.missingBadge"
area = "font-view"
milestone = "M4"
summary = "A sidebar entry with a known full set shows a grey badge with glyphs present and glyphs expected when some are missing, a checkmark when all are present, and a plain count when no expected total is known."
ref = "Font View › Filtering Font View › Categories; Adding From the Sidebar"
status = "handbook"

# ── Copy and paste of glyphs ──

[[behavior]]
id = "fontView.copy.glyphs"
area = "font-view"
milestone = "M4"
summary = "In Font View, edit.copy (Cmd+C) puts the selected glyphs, with all their data, on the clipboard so they can be pasted into another font file."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "fontView.paste.glyphs"
area = "font-view"
milestone = "M4"
summary = "In Font View, edit.paste (Cmd+V) adds the copied glyphs to the target font as new glyphs."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "fontView.paste.nameClashSuffix"
area = "font-view"
milestone = "M4"
summary = "A pasted glyph whose name is taken is renamed with the first free three-digit counter suffix: A.001, then A.002, and so on. The existing glyph is left untouched."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "fontView.paste.componentsRelink"
area = "components"
milestone = "M6"
summary = "Components in pasted glyphs are re-pointed by name at glyphs of the target font. A component whose base glyph does not exist there stays unresolved and is drawn as the triangle placeholder used for components without a base glyph."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.modeSameName"
area = "font-view"
milestone = "M4"
summary = "Glyphs With Same Name: each copied glyph overwrites the target glyph of the same name; copied glyphs with no counterpart are added as new glyphs."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.modeSelected"
area = "font-view"
milestone = "M4"
summary = "Selected Glyphs: the copied glyphs overwrite the glyphs selected in the target, paired in order, and the targets keep their own names. Copied glyphs beyond the number of selected targets are dropped."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.modeAsComponents"
area = "components"
milestone = "M6"
summary = "As Components: each copied glyph is inserted as a component into the selected target glyphs, keeping the paths and components already there. All Masters inserts on every master instead of the current one."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.partAllData"
area = "font-view"
milestone = "M4"
summary = "All Data transfers the whole glyph: shapes, anchors, layer attributes and metrics. It implies every other part."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.partActiveLayer"
area = "font-view"
milestone = "M4"
summary = "Content of Active Layer transfers only the layer that was displayed when copying."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.partKerningGroups"
area = "spacing-kerning"
milestone = "M5"
summary = "Kerning Groups transfers only the left and right kerning group names, which lets kerning classes be mirrored between related fonts."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.partMetricsKeys"
area = "spacing-kerning"
milestone = "M5"
summary = "Metric Keys transfers only the sidebearing and width formulas. The numeric metrics are not recomputed until Update Metrics (Cmd+Ctrl+M) or Update Metrics for All Masters (Cmd+Ctrl+Alt+M) is run."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

[[behavior]]
id = "pasteSpecial.partMetricValues"
area = "spacing-kerning"
milestone = "M5"
summary = "LSB, RSB and Width are separate choices that transfer the numeric left sidebearing, right sidebearing and advance width. When RSB and Width are both chosen, the right sidebearing wins and the width follows from it."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

# ── Deleting glyphs ──

[[behavior]]
id = "removeGlyph.confirm"
area = "font-view"
milestone = "M4"
summary = "Glyph removal always asks for confirmation first; Cancel leaves the font unchanged. Headless calls must pass an explicit confirmation flag."
ref = "Font View › Deleting Glyphs"
status = "handbook"

[[behavior]]
id = "removeGlyph.usedAsComponent"
area = "components"
milestone = "M6"
summary = "When a glyph to be deleted is referenced by components elsewhere, the dialog gains a Decompose button. Remove deletes the glyph together with every component pointing at it; Decompose first converts those components to outlines and then deletes the glyph."
ref = "Font View › Deleting Glyphs"
status = "handbook"

[[behavior]]
id = "removeGlyph.linkedMetricsKeys"
area = "spacing-kerning"
milestone = "M5"
summary = "If glyphs that remain hold metrics keys pointing at a glyph being deleted, a dialog comes up with Remove, which dissolves those keys, or Cancel, which keeps the dangling keys in place."
ref = "Font View › Deleting Glyphs"
status = "handbook"

[[behavior]]
id = "metricsKeys.unlinkedDisplay"
area = "spacing-kerning"
milestone = "M5"
summary = "A metrics key whose target glyph does not exist is shown in turquoise. It is repaired by pointing it at another glyph, replacing it with a number, or creating the missing glyph."
ref = "Font View › Deleting Glyphs"
status = "handbook"

# ── Glyph database ──

[[behavior]]
id = "glyphData.fields"
area = "font-view"
milestone = "M4"
summary = "Each database record carries: nice name, production name, Unicode value, components of composites, default anchors, marks shown in the mark cloud, script, category and subcategory. The published GlyphData.xml adds case, direction, description, alternative names and a legacy Unicode value."
ref = "Font View › Names & Unicode › Glyph Info Database; GlyphsInfo GlyphData.xml"
status = "handbook"

[[behavior]]
id = "glyphData.xmlAttributes"
area = "font-view"
milestone = "M4"
summary = "A GlyphData.xml file is a glyphData root holding empty glyph elements. name and category are required attributes; unicode, unicodeLegacy, subCategory, case, direction, script, description, production and altNames are optional. Code points are bare hexadecimal without a prefix and altNames is a comma-separated list."
ref = "GlyphsInfo GlyphData.xml (DTD)"
status = "docs"

[[behavior]]
id = "glyphData.tabularFields"
area = "font-view"
milestone = "M4"
summary = "The tab-separated form of the database has these columns in order: unicode, name, sortName, sortNameKeep, decompose, category, subCategory, script, production, altNames, description, anchors, accents. The last-named extras (sort names, decomposition, anchors, accents) are absent from the published XML but may appear in custom data."
ref = "GlyphsInfo Convert to tabbed file.py"
status = "docs"

[[behavior]]
id = "glyphData.categoryVocabulary"
area = "font-view"
milestone = "M4"
summary = "Categories used by the published data are Letter, Mark, Number, Punctuation, Separator and Symbol. Readers of the format also accept Space and Other."
ref = "GlyphsInfo GlyphData.xml; fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "glyphData.subCategoryVocabulary"
area = "font-view"
milestone = "M4"
summary = "Subcategories in the published data: Arrow, Compatibility, Currency, Dash, Decimal Digit, Emoji, Enclosing, Format, Fraction, Geometry, Halfform, Jamo, Letter, Ligature, Math, Matra, Modifier, Nonspacing, Parenthesis, Quote, Radical, Small, Space, Spacing, Spacing Combining, Superscript, Syllable. Readers also accept Composition, Conjunct, Lowercase, Number, Other, Smallcaps and Uppercase."
ref = "GlyphsInfo GlyphData.xml; fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "glyphData.caseAndDirectionEncoding"
area = "font-view"
milestone = "M4"
summary = "In the data, case is upper, lower, minor or smallCaps and a missing attribute means no case; direction is RTL or BIDI and a missing attribute means left to right. Source files may additionally store noCase / other and LTR / VTR / VTL."
ref = "GlyphsInfo GlyphData.xml; GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

[[behavior]]
id = "glyphData.ideographsFile"
area = "font-view"
milestone = "M4"
summary = "Han ideographs live in a second file, GlyphData_Ideographs.xml, with the same record shape. Their names are code-point names, their script is han, and they carry little more than category and subcategory (for example Radical or Compatibility)."
ref = "GlyphsInfo README.md; GlyphData_Ideographs.xml"
status = "docs"

[[behavior]]
id = "glyphData.niceNameScheme"
area = "font-view"
milestone = "M4"
summary = "Nice names start from the Adobe Glyph List with adjustments; glyphs outside it get a short invented name based on the Unicode description. A hyphen plus script tag separates scripts: short tags for common scripts (-ar, -cy), the full script name for most others."
ref = "GlyphsInfo README.md"
status = "docs"

[[behavior]]
id = "glyphData.implicitProductionName"
area = "import-export"
milestone = "M2"
summary = "A database record without a production attribute uses its nice name as the production name (Aacute stays Aacute). Records that need a different export name state it, mostly as uniXXXX or uXXXXX and occasionally as a custom name such as two_fraction_seven."
ref = "GlyphsInfo GlyphData.xml"
status = "docs"

[[behavior]]
id = "glyphData.legacyUnicode"
area = "font-view"
milestone = "M4"
summary = "unicodeLegacy records a compatibility or presentation-form code point (noon-ar.init has FEE7, f_f_l has FB04) for glyphs that should normally be reached through features. We read it as informational: it is not assigned to a new glyph automatically. This reading needs confirmation."
ref = "GlyphsInfo GlyphData.xml"
status = "inferred"

[[behavior]]
id = "glyphData.altNames"
area = "font-view"
milestone = "M4"
summary = "Alternative names are extra lookup keys for a record (A-cy also answers to Acyrillic and afii10017). They never displace a record's own name, and a match by alternative name yields category, script and production name but no code point."
ref = "GlyphsInfo GlyphData.xml; fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "glyphData.lookupOrder"
area = "font-view"
milestone = "M4"
summary = "A property is resolved in this order: the value stored on the glyph in the file, a custom glyph-data entry (by name, then by one of the glyph's code points), the built-in record (by nice name, then by production name, then by code point), and finally synthesis from the name."
ref = "fontc glyphs-reader glyphdata.rs; GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

[[behavior]]
id = "glyphData.suffixInheritance"
area = "font-view"
milestone = "M4"
summary = "A name with a dot suffix takes the properties of the name before the dot: n.alt, n.ss05 and n.002 all behave like n. Names without the dot (nalt, nss05, n002) inherit nothing and need every property set by hand."
ref = "Font View › Names & Unicode › Glyph Info Database"
status = "handbook"

[[behavior]]
id = "glyphData.suffixSplit"
area = "font-view"
milestone = "M4"
summary = "The base name is normally everything before the first dot. When a name has several dots, a longer prefix that is itself a known database name is preferred, so a record whose own name contains a dot is still found."
ref = "fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "glyphData.ligatureCategory"
area = "font-view"
milestone = "M4"
summary = "An unknown base name containing underscores is split into parts and judged by the first part: a Mark first part makes the whole glyph a Mark with that subcategory; a Letter followed only by marks, separators or unknown parts keeps the first part's category and subcategory; a Letter followed by anything else becomes Letter / Ligature."
ref = "fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "glyphData.ligatureScriptSuffix"
area = "font-view"
milestone = "M4"
summary = "When a ligature name ends in a script suffix, that suffix is applied to every part that has none before the parts are looked up (lam_alif-ar is read as lam-ar plus alif-ar). A part keeps its bare form when the bare name is known and the suffixed one is not."
ref = "fontc glyphs-reader glyphdata.rs; Font View › Glyph Naming Rules"
status = "docs"

[[behavior]]
id = "glyphData.aglFallbackCategory"
area = "font-view"
milestone = "M4"
summary = "A base name unknown to the database is parsed by the Adobe Glyph List rules; the Unicode general category of its first character then picks the category and subcategory (for example Nonspacing Mark gives Mark / Nonspacing, Math Symbol gives Symbol / Math, Private Use gives Letter / Compatibility). An underscore in the name turns any non-mark result into subcategory Ligature."
ref = "fontc glyphs-reader glyphdata.rs; agl-aglfn README.md"
status = "docs"

[[behavior]]
id = "glyphData.underscorePrefixNoCategory"
area = "font-view"
milestone = "M4"
summary = "A name starting with an underscore is never given a synthesised category, matching the rule that non-exporting helper glyphs have none."
ref = "fontc glyphs-reader glyphdata.rs; Font View › Category & Subcategory"
status = "docs"

[[behavior]]
id = "glyphData.customFile"
area = "font-view"
milestone = "M4"
summary = "A user-supplied GlyphData.xml changes glyph properties for all files on the machine and can teach the app custom names, so that Unicode values and categories are still assigned automatically for them. Per-file overrides on individual glyphs remain possible on top."
ref = "Font View › Names & Unicode › Glyph Info Database; Naming Glyphs"
status = "handbook"

[[behavior]]
id = "glyphData.aglRecordFormats"
area = "import-export"
milestone = "M2"
summary = "The Adobe Glyph List is a text file of name;codepoints records (one or more four-digit uppercase hex values separated by spaces). AGLFN, the subset recommended for new fonts, has codepoint;name;character-name records. Lines starting with # are comments and blank lines are skipped."
ref = "agl-aglfn README.md; glyphlist.txt; aglfn.txt"
status = "docs"

# ── Production names at export ──

[[behavior]]
id = "export.productionNameResolution"
area = "import-export"
milestone = "M2"
summary = "At export each glyph is written under, in order of preference: its own production-name override, the production name of its database record, a name synthesised from suffix and ligature rules, or its unchanged nice name."
ref = "Font View › Glyph Properties › Production Name; fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "export.productionNameSuffix"
area = "import-export"
milestone = "M2"
summary = "For a suffixed name whose base has a database production name, the result is that production name followed by the same dot suffix (a small-cap Cyrillic A-cy.sc becomes uni0410.sc)."
ref = "fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "export.productionNameLigature"
area = "import-export"
milestone = "M2"
summary = "For an underscore-joined name each part is resolved to its production name, or kept if it is already an AGLFN name; if any part is unknown, no production name is synthesised. If at least one part is a uniXXXX name and no part lies beyond the BMP, the parts collapse to uni followed by all the four-digit values; otherwise the parts are joined with underscores. The dot suffix is re-attached at the end."
ref = "fontc glyphs-reader glyphdata.rs"
status = "docs"

[[behavior]]
id = "export.productionNameForm"
area = "import-export"
milestone = "M2"
summary = "A code-point production name is uni plus exactly four uppercase hexadecimal digits for the BMP, and u plus five or six uppercase hexadecimal digits above it."
ref = "Font View › Glyph Properties › Production Name; fontc glyphs-reader glyphdata.rs"
status = "handbook"

[[behavior]]
id = "export.aglNameParsing"
area = "import-export"
milestone = "M2"
summary = "Reading a production name back to text follows the Adobe Glyph List specification: drop everything from the first dot, split at underscores, and map each part through the glyph list, the uniXXXX form (groups of four hex digits) or the uXXXX to uXXXXXX form; parts that match nothing map to no character."
ref = "agl-aglfn README.md (AGL Specification)"
status = "docs"

[[behavior]]
id = "export.cidMapping"
area = "compile"
milestone = "M7"
summary = "For CJK fonts glyphs are addressed by character identifier instead of name. A Registry-Ordering-Supplement decides which CID each nice-named glyph receives; exporting glyphs the ROS does not cover are appended after the mapped ones."
ref = "Font View › Names & Unicode › CID Mapping"
status = "handbook"

[[behavior]]
id = "import.keepGlyphNames"
area = "import-export"
milestone = "M1"
summary = "When a compiled OTF or TTF is opened with the user setting Keep Glyph Names from Imported Files on, the file's glyph order is preserved by adding a glyphOrder parameter to the font automatically."
ref = "Font View › Glyph Order"
status = "handbook"

# ── Naming rules ──

[[behavior]]
id = "glyphName.allowedCharacters"
area = "font-view"
milestone = "M4"
summary = "A valid glyph name contains only A to Z, a to z, 0 to 9, underscore, hyphen and period. White space and any non-ASCII character are invalid."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.firstCharacter"
area = "font-view"
milestone = "M4"
summary = "A name must begin with a letter. The exceptions are non-exporting glyphs, which usually start with an underscore, and the special .notdef glyph."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.invalidBlocksExport"
area = "compile"
milestone = "M2"
summary = "A font with an invalid glyph name cannot be exported. The export results report an Illegal glyph name error that names the glyph and the position of the bad character, with a Show button that opens the glyph in a new tab; the same error can come from compiling feature code in Font Info."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.underscorePrefix"
area = "components"
milestone = "M6"
summary = "A leading underscore marks a helper glyph that does not export by default. The prefixes _part., _smart., _cap. and _corner. are used for the reusable-shape glyphs described in the components chapter."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.scriptSuffix"
area = "font-view"
milestone = "M4"
summary = "A hyphen suffix names the script: A is Latin, A-cy Cyrillic, Alpha Greek (most Latin and Greek names carry no suffix); -ar Arabic, -hb Hebrew, -ko Korean, -thai Thai. The same scheme covers special sets: -math, -braille, -fraktur, -musical."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.dotSuffix"
area = "font-view"
milestone = "M4"
summary = "A variant of a glyph has the base name, a period and an identifier: h.sc for the small cap of h, beh-ar.medi for the medial form. Certain identifiers are recognised by automatic feature generation."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.chainedSuffixes"
area = "features"
milestone = "M8"
summary = "A name may carry several dot suffixes in a row. Automatic features only work when the suffixes follow the order of the features in Font Info, so a small cap in stylistic set 2 is h.sc.ss02, not h.ss02.sc."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.ligature"
area = "font-view"
milestone = "M4"
summary = "A ligature is named by joining its component names with underscores, as in f_f_l. Script and variant suffixes appear once at the end of the whole name, never per component: lam_alif-ar and lam_alif-ar.fina."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "handbook"

[[behavior]]
id = "glyphName.clickToEdit"
area = "font-view"
milestone = "M4"
summary = "A single click on the name under a grid cell or in the Name column starts editing the name in place."
ref = "Font View › Names & Unicode › Naming Glyphs; Renaming Glyphs"
status = "handbook"

[[behavior]]
id = "glyphName.renameUpdatesInfo"
area = "font-view"
milestone = "M4"
summary = "Renaming a glyph re-derives its database properties only when the base name changes: eacute to plus changes Unicode and category, while eacute.sc to eacute.pc changes nothing else."
ref = "Font View › Names & Unicode › Renaming Glyphs"
status = "handbook"

[[behavior]]
id = "glyphName.useCustomNaming"
area = "font-view"
milestone = "M4"
summary = "The per-font option Use Custom Naming (Font Info → Other) turns off the automatic conversion of typed names to nice names. With custom names, automatic feature generation and automatic category assignment stop working unless a custom glyph database describes those names."
ref = "Font View › Names & Unicode › Naming Glyphs"
status = "handbook"

# ── Copy Glyph Names formats ──

[[behavior]]
id = "copyGlyphNames.spaceSeparated"
area = "font-view"
milestone = "M4"
summary = "Space Separated: all names on one line, each followed by a single space, including the last (five six seven plus a trailing space)."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

[[behavior]]
id = "copyGlyphNames.onePerLine"
area = "font-view"
milestone = "M4"
summary = "One per Line: each name on its own line with no other separator. This is the form a list filter accepts."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

[[behavior]]
id = "copyGlyphNames.commaSeparated"
area = "font-view"
milestone = "M4"
summary = "Comma Separated: all names on one line, each followed by a comma and a space, including the last."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

[[behavior]]
id = "copyGlyphNames.slashed"
area = "font-view"
milestone = "M4"
summary = "Slashed: each name prefixed with a slash and run together on one line (/five/six/seven). The result can be pasted into Edit View as text."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

[[behavior]]
id = "copyGlyphNames.pythonList"
area = "font-view"
milestone = "M4"
summary = "Python List: each name in double quotes followed by a comma, one per line, ready to paste between list brackets in a script."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

[[behavior]]
id = "copyGlyphNames.unicodes"
area = "font-view"
milestone = "M4"
summary = "Unicodes: one line per glyph holding its code points as hexadecimal, with leading zeros up to a minimum of four digits and without a prefix; several values are joined by a comma and a space. A glyph without a code point is written as a hyphen, a space, a hash sign, a space and the glyph name."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

# ── Selection and batch processing ──

[[behavior]]
id = "fontView.selectAllScope"
area = "font-view"
milestone = "M4"
summary = "In Font View, edit.selectAll (Cmd+A) selects every glyph currently visible, not every glyph of the font, so the sidebar and search decide the scope."
ref = "Font View › Batch-Processing › Selecting Glyphs"
status = "handbook"

[[behavior]]
id = "fontView.deselectAll"
area = "font-view"
milestone = "M4"
summary = "In Font View, edit.deselectAll (Cmd+Alt+A) clears the glyph selection."
ref = "Font View › Batch-Processing › Selecting Glyphs"
status = "handbook"

[[behavior]]
id = "fontView.invertSelection"
area = "font-view"
milestone = "M4"
summary = "In Font View, edit.invertSelection (Cmd+Alt+Shift+I) selects exactly the glyphs that were not selected. We take the scope to be the visible glyphs, as for Select All; the source does not say."
ref = "Font View › Batch-Processing › Selecting Glyphs"
status = "handbook"

[[behavior]]
id = "fontView.batch.appliesToSelection"
area = "font-view"
milestone = "M4"
summary = "Glyph-menu and Path-menu commands run from Font View act on every selected glyph, on the layer of the current master. Commands marked as master-wide act on all masters when Option is held."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.updateMetrics"
area = "spacing-kerning"
milestone = "M5"
summary = "Glyph → Update Metrics (Cmd+Ctrl+M) recalculates metrics keys of all selected glyphs; with Option it covers all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.transformMetrics"
area = "spacing-kerning"
milestone = "M5"
summary = "Glyph → Transform Metrics applies its metric changes to all selected glyphs. No all-masters modifier is documented for it."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.addComponent"
area = "components"
milestone = "M6"
summary = "Glyph → Add Component (Cmd+Shift+C) adds the chosen component to all selected glyphs; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.createComposite"
area = "components"
milestone = "M6"
summary = "Glyph → Create Composite (Cmd+Ctrl+C) rebuilds all selected glyphs from their database recipes; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.decomposeComponents"
area = "components"
milestone = "M6"
summary = "Glyph → Decompose Components (Cmd+Shift+D) turns the components of all selected glyphs into outlines; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.setAnchors"
area = "components"
milestone = "M6"
summary = "Glyph → Set Anchors (Cmd+U) adds the default anchors to all selected glyphs; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.resetAnchors"
area = "components"
milestone = "M6"
summary = "Glyph → Reset Anchors (Cmd+Shift+U) replaces the anchors of all selected glyphs with the defaults; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.reverseContours"
area = "path-ops"
milestone = "M3"
summary = "Path → Reverse Contours (Cmd+Ctrl+Alt+R) reverses every path of all selected glyphs on the current master. No all-masters modifier is documented."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.correctPathDirection"
area = "path-ops"
milestone = "M3"
summary = "Path → Correct Path Direction (Cmd+Shift+R) fixes path direction in all selected glyphs; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.roundCoordinates"
area = "path-ops"
milestone = "M3"
summary = "Path → Round Coordinates rounds point positions in all selected glyphs; with Option on all masters. No shortcut is given."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.tidyUpPaths"
area = "path-ops"
milestone = "M3"
summary = "Path → Tidy up Paths (Cmd+Shift+T) cleans the outlines of all selected glyphs; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.addExtremes"
area = "path-ops"
milestone = "M3"
summary = "Path → Add Extremes inserts extreme points in all selected glyphs. Holding Option changes the command to Force Extremes rather than extending it to all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.removeOverlap"
area = "path-ops"
milestone = "M3"
summary = "Path → Remove Overlap (Cmd+Shift+O) merges overlapping paths in all selected glyphs; with Option on all masters."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"
notes = "FontCraft: the `glyphs` form of path.removeOverlap (and path.removeOverlapForAllMasters); locked glyphs and layers that cannot be done, one taking longer than 5 s included, are listed in `skipped`."

[[behavior]]
id = "fontView.batch.transformations"
area = "path-ops"
milestone = "M3"
summary = "Path → Transformations applies its dialog settings to all selected glyphs."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.selectionToBackground"
area = "layers"
milestone = "M3"
summary = "Path → Selection to Background (Cmd+J) copies the foreground of all selected glyphs to their background, replacing it. With Option the command becomes Add Selection to Background (Cmd+Alt+J), which keeps the existing background content."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.assignBackground"
area = "layers"
milestone = "M3"
summary = "Path → Assign Background… fills the background of all selected glyphs from a chosen source. With Option the command becomes Clear Background, which empties the backgrounds."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.swapWithBackground"
area = "layers"
milestone = "M3"
summary = "Path → Swap with Background (Cmd+Ctrl+J) exchanges foreground and background in all selected glyphs."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.interpolateWithBackground"
area = "path-ops"
milestone = "M3"
summary = "Path → Interpolate with Background blends the foreground of all selected glyphs toward their background by the chosen amount."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.convertToCubic"
area = "path-ops"
milestone = "M3"
summary = "Path → Other → Convert to Cubic converts the outlines of all selected glyphs to cubic curves."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.convertToQuadratic"
area = "path-ops"
milestone = "M3"
summary = "Path → Other → Convert to Quadratic converts the outlines of all selected glyphs to quadratic curves."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[behavior]]
id = "fontView.batch.filters"
area = "path-ops"
milestone = "M3"
summary = "Any entry of the Filter menu can be run from Font View and is then applied to every selected glyph."
ref = "Font View › Batch-Processing › Filters"
status = "handbook"

[[behavior]]
id = "fontView.batch.palette"
area = "ui-chrome"
milestone = "M4"
summary = "Palette (Cmd+Alt+P) sections work from Font View: Fit Curve and Transformations act on all selected glyphs, and plug-in sections may too. For node-level controls (Fit Curve, for one), each glyph contributes the node selection it last had in Edit View."
ref = "Font View › Batch-Processing › Palette"
status = "handbook"

[[behavior]]
id = "fontView.batch.pluginsAndScripts"
area = "extensions"
milestone = "M13"
summary = "Plug-ins and scripts may operate on the Font View glyph selection, so the selection must be exposed to extensions as the default target set."
ref = "Font View › Batch-Processing › Plug-ins & Scripts"
status = "handbook"

[[behavior]]
id = "findReplace.plainMode"
area = "font-view"
milestone = "M4"
summary = "Without Regex, every occurrence of the Find text inside each selected glyph's name is replaced by the Replace text; names that do not contain it are left alone."
ref = "Font View › Batch-Processing › Batch-Renaming Glyphs"
status = "handbook"

[[behavior]]
id = "findReplace.emptyFindAppends"
area = "font-view"
milestone = "M4"
summary = "With an empty Find field the Replace text is appended to the name of every selected glyph, which is the quick way to add a suffix such as .ss07."
ref = "Font View › Batch-Processing › Batch-Renaming Glyphs"
status = "handbook"

[[behavior]]
id = "findReplace.regexMode"
area = "font-view"
milestone = "M4"
summary = "With Regex on, Find is a regular expression and Replace can refer to captured groups by backslash and number. Example: finding a literal dot, cv and two captured digits and replacing with .ss plus the first group turns someGlyph.cv03 into someGlyph.ss03 and otherglyph.cv15.alt into otherglyph.ss15.alt."
ref = "Font View › Batch-Processing › Batch-Renaming Glyphs"
status = "handbook"

# ── Search ──

[[behavior]]
id = "fontView.search.fields"
area = "font-view"
milestone = "M4"
summary = "A search term matches a glyph by name (thorn), by hexadecimal code point (00FE), by the character itself, or by text in its note. The magnifier menu can restrict matching to name, Unicode value or note alone."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"

[[behavior]]
id = "fontView.search.matchCase"
area = "font-view"
milestone = "M4"
summary = "Search ignores letter case unless Match Case is on. With it on, Oslash finds Oslash and Oslashacute but not oslash; matching is by substring."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"

[[behavior]]
id = "fontView.search.regex"
area = "font-view"
milestone = "M4"
summary = "With Regex on the term is a regular expression that must match the whole glyph name: one dot finds one-character names, two dots two-character names, a pattern ending in an escaped .sc finds small caps, and a bracketed A or a followed by anything and -cy finds Cyrillic names starting with A or a."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"

[[behavior]]
id = "fontView.search.combinesWithSidebar"
area = "font-view"
milestone = "M4"
summary = "Search narrows whatever the sidebar selection shows. To see the whole font, All must be selected in the sidebar and the search field must be empty."
ref = "Font View › Filtering Font View"
status = "handbook"

# ── Sidebar filtering ──

[[behavior]]
id = "fontView.sidebar.categoryFilter"
area = "font-view"
milestone = "M4"
summary = "Selecting a category shows only glyphs of that category; expanding it reveals subcategories, each selectable on its own and labelled with its glyph count."
ref = "Font View › Filtering Font View › Categories"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.multiSelectSameSection"
area = "font-view"
milestone = "M4"
summary = "Cmd-clicking several category entries shows glyphs belonging to any of them (union). Scripts in the Languages section can be multi-selected the same way."
ref = "Font View › Filtering Font View › Categories; Languages"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.crossSectionIntersect"
area = "font-view"
milestone = "M4"
summary = "When entries from different sections are selected together (a category with a language or a filter), only glyphs that belong to both are shown (intersection)."
ref = "Font View › Filtering Font View › Categories"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.filtersIntersect"
area = "font-view"
milestone = "M4"
summary = "Selecting several filters in the Filters section (Cmd-click, or Shift-click for a range) narrows the view to glyphs that every one of them contains, unlike multi-selected categories."
ref = "Font View › Filtering Font View › Managing Filters"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.folderUnion"
area = "font-view"
milestone = "M4"
summary = "Selecting a filter folder shows every glyph that belongs to at least one filter contained in it."
ref = "Font View › Filtering Font View › Managing Filters"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.languageEntries"
area = "font-view"
milestone = "M4"
summary = "The Languages section lists scripts, each expandable into language or subset filters, with the same counts, badges and checkmarks as categories."
ref = "Font View › Filtering Font View › Languages"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.scriptAutoShown"
area = "font-view"
milestone = "M4"
summary = "Only a short default list of scripts is shown. A script is added to the sidebar automatically as soon as the font contains a glyph of that script."
ref = "Font View › Filtering Font View › Languages"
status = "handbook"

[[behavior]]
id = "fontView.sidebar.customGroups"
area = "font-view"
milestone = "M14"
summary = "Extra entries for the Categories and Languages sections can be defined in a Groups.plist file placed in the application's Glyphs Info folder. The file format is described in another chapter."
ref = "Font View › Filtering Font View › Custom Categories & Languages"
status = "handbook"

[[behavior]]
id = "fontView.filtersDoNotAffectOrder"
area = "font-view"
milestone = "M4"
summary = "Categories, languages and filters only change what Font View shows. They never change the glyph order of the exported font."
ref = "Font View › Glyph Order"
status = "handbook"

# ── Smart filter rules ──

[[behavior]]
id = "smartFilter.rule.glyphName"
area = "font-view"
milestone = "M4"
summary = "Rule Glyph Name tests the glyph's nice name as text. The comparison operators offered are not listed in the source."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.countOfPaths"
area = "font-view"
milestone = "M4"
summary = "Rule Count of Paths compares the number of paths on the layer of the first master (not the selected master)."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.countOfComponents"
area = "font-view"
milestone = "M4"
summary = "Rule Count of Components compares the number of components on the layer of the first master (not the selected master)."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.tags"
area = "font-view"
milestone = "M4"
summary = "Rule Tags tests the glyph's tag list."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.script"
area = "font-view"
milestone = "M4"
summary = "Rule Script tests the script the glyph belongs to."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.categoryAndSubcategory"
area = "font-view"
milestone = "M4"
summary = "Rule Category & Subcategory tests the glyph's category and subcategory."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.case"
area = "font-view"
milestone = "M4"
summary = "Rule Case matches on the glyph's case: uppercase, lowercase, small capital or caseless. Minor is not named among the choices in the source."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.masterCompatible"
area = "interpolation"
milestone = "M9"
summary = "Rule Master Compatible is true when the glyph's master layers can be interpolated."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.exportGlyph"
area = "font-view"
milestone = "M4"
summary = "Rule Export Glyph is true when the glyph's export flag is on."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasUnicode"
area = "font-view"
milestone = "M4"
summary = "Rule Has Unicode is true when the glyph has at least one code point."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasComponents"
area = "components"
milestone = "M6"
summary = "Rule Has Components is true when the glyph's layer for the selected master contains any component."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasHints"
area = "hinting-ps"
milestone = "M10"
summary = "Rule Has Hints is true when the layer of the selected master carries any manually placed hint, of either kind."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasPostScriptHints"
area = "hinting-ps"
milestone = "M10"
summary = "Rule Has PostScript Hints is true when the layer of the selected master carries manually placed PostScript hints."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasTrueTypeHints"
area = "hinting-tt"
milestone = "M10"
summary = "Rule Has TrueType Hints is true when the layer of the selected master carries manually placed TrueType hints."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasCorners"
area = "components"
milestone = "M6"
summary = "Rule Has Corners is true when the layer of the selected master uses corner components."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasAnchors"
area = "components"
milestone = "M6"
summary = "Rule Has Anchors is true when the layer of the selected master has at least one anchor."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.containsComponent"
area = "components"
milestone = "M6"
summary = "Rule Contains Component takes a glyph name and is true when the layer of the selected master has a component pointing at that glyph."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasSpecialLayers"
area = "layers"
milestone = "M9"
summary = "Rule Has Special Layers is true when the glyph has any special layer (the layer kinds beyond plain master and backup layers, as defined in the layers chapter)."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasCustomGlyphInfo"
area = "font-view"
milestone = "M4"
summary = "Rule Has Custom Glyph Info is true when any stored property of the glyph differs from the database value for its name; these are the glyphs carrying the black info badge."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasAnnotations"
area = "font-view"
milestone = "M4"
summary = "Rule Has Annotations matches glyphs with at least one annotation on the selected master's layer."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.isAutoAligned"
area = "components"
milestone = "M6"
summary = "Rule Is Auto-Aligned is true when the layer of the selected master has automatic component alignment active."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasMetricsKeys"
area = "spacing-kerning"
milestone = "M5"
summary = "Rule Has Metrics Keys is true when any metric of the glyph is defined by a metrics key."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.metricsKeysOutOfSync"
area = "spacing-kerning"
milestone = "M5"
summary = "Rule Metrics Keys Out of Sync is true when a metrics key of the glyph no longer matches the stored metric and needs updating; these are the glyphs carrying the warning triangle."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.hasKerningGroups"
area = "spacing-kerning"
milestone = "M5"
summary = "Rule Has Kerning Groups is true when the glyph has a kerning group assigned."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.colorLabel"
area = "font-view"
milestone = "M4"
summary = "Rule Color Label compares the glyph colour label with one of the twelve colours, or with Not Set to find unlabelled glyphs."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.layerColorLabel"
area = "font-view"
milestone = "M4"
summary = "Rule Layer Color Label compares the colour label of the selected master's layer with a colour, or with Not Set to find unlabelled layers."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.isHangulKey"
area = "font-view"
milestone = "M14"
summary = "Rule Is Hangul Key is true when the glyph is listed as a key glyph in the font's Hangul Composition Groups parameter."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.rule.custom"
area = "features"
milestone = "M8"
summary = "Rule Custom holds a free-form glyph predicate written in the same expression language as glyph predicate tokens in feature code."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.groups"
area = "font-view"
milestone = "M4"
summary = "Rules can be nested in groups of three kinds: All (every nested rule must match), Any (at least one must match), None (no nested rule may match). A group is added by holding Option, which turns the plus button into a dots button, and groups may contain groups."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.evaluationLayer"
area = "font-view"
milestone = "M4"
summary = "Rules are evaluated against three different scopes: the whole glyph (name, tags, script, category, case, export, Unicode, kerning groups, colour label), the first master's layer (the two count rules), and the selected master's layer (the Has … layer rules and Layer Color Label). A smart filter's result can therefore change when the selected master changes."
ref = "Font View › Filtering Font View › Smart Filters"
status = "handbook"

[[behavior]]
id = "smartFilter.live"
area = "font-view"
milestone = "M4"
summary = "A smart filter stores rules, not glyphs: its contents are recomputed from the current font whenever it is shown. The refresh timing is not described in the source."
ref = "Font View › Filtering Font View › Smart Filters"
status = "inferred"

# ── List filters ──

[[behavior]]
id = "listFilter.contents"
area = "font-view"
milestone = "M4"
summary = "A list filter is a named list of glyph names separated by spaces or line breaks. Selecting it shows the glyphs of the font whose names are in the list; listed names the font lacks count as missing and can be generated from the sidebar."
ref = "Font View › Filtering Font View › List Filters"
status = "handbook"

[[behavior]]
id = "listFilter.order"
area = "font-view"
milestone = "M4"
summary = "While a list filter is selected, glyphs appear in the order of the list instead of glyph order, and sort names are ignored."
ref = "Font View › Filtering Font View › List Filters; Sort Name"
status = "handbook"

[[behavior]]
id = "listFilter.defaultFromSelection"
area = "font-view"
milestone = "M4"
summary = "A new list filter starts with the names of the glyphs selected at the moment it is created."
ref = "Font View › Filtering Font View › List Filters"
status = "handbook"

[[behavior]]
id = "fontView.filter.removeFolderRecursive"
area = "font-view"
milestone = "M4"
summary = "Removing a filter folder deletes every filter and folder inside it; no separate confirmation is described."
ref = "Font View › Filtering Font View › Managing Filters"
status = "handbook"

# ── Glyph order ──

[[behavior]]
id = "glyphOrder.default"
area = "font-view"
milestone = "M4"
summary = "Without a custom order, glyphs are ordered by sort name, where a glyph's sort name is its own override, else the database value, else its glyph name. The same order is used in Font View and in exported fonts."
ref = "Font View › Glyph Order; Sort Name; GlyphsSDK GlyphsFileFormatv3.md"
status = "handbook"

[[behavior]]
id = "glyphOrder.customParameter"
area = "font-info"
milestone = "M7"
summary = "A font-level glyphOrder parameter holding glyph names, one per line, replaces the default order in Font View and in exports, and makes sort names irrelevant. How glyphs missing from the list are placed is not stated in this chapter."
ref = "Font View › Glyph Order"
status = "handbook"

[[behavior]]
id = "glyphOrder.keepAlternatesSortName"
area = "font-view"
milestone = "M4"
summary = "Source files can store a second sort key, sortNameKeep, used by a display mode that keeps alternates next to their base glyph. The mode is not described in this chapter and must be located in the reference's settings."
ref = "GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

# ── Images ──

[[behavior]]
id = "fontView.image.addImageSingle"
area = "color"
milestone = "M11"
summary = "Run from Font View with one file chosen, glyph.addImage (Glyph → Add Image…) places the image on the selected glyph. Headless params we propose for that command: {files: [path], glyphs?: [names], layer?: id}."
ref = "Font View › Images"
status = "handbook"

[[behavior]]
id = "fontView.image.dropOnCell"
area = "color"
milestone = "M11"
summary = "Dropping an image file from the file manager onto a glyph cell places the image on that glyph's currently active layer."
ref = "Font View › Images"
status = "handbook"

[[behavior]]
id = "fontView.image.batchByFileName"
area = "color"
milestone = "M11"
summary = "When Add Image is given several files, each is matched to a glyph by file name without extension and placed on that glyph's current-master layer. Files with no matching glyph are presumably skipped; the source does not say."
ref = "Font View › Images"
status = "handbook"

[[behavior]]
id = "fontView.image.caseSensitivity"
area = "color"
milestone = "M11"
summary = "Glyph names are case-sensitive but many file systems are not, so A.png and a.png cannot share a folder there. The documented workaround is to keep uppercase and lowercase images in separate folders; on case-sensitive systems we match exactly."
ref = "Font View › Images"
status = "handbook"

[[behavior]]
id = "fontView.image.showImageOption"
area = "color"
milestone = "M11"
summary = "View → Show Image controls whether placed images are drawn in Font View cells; empty glyphs show their image regardless of the option."
ref = "Font View › Images"
status = "handbook"

# ── Rows added after the audit of 2026-10-07: commands the Font View chapter states that had only
#    been recorded as batch behaviours. ──

[[command]]
id = "path.roundCoordinates"
label = "Round Coordinates"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?} | {glyphs: [names], layer?: id | layers?: [ids]} | {glyphs | glyph, allMasters: true} → {glyphs, skipped}"
area = "path-ops"
milestone = "M3"
summary = "Moves every node, handle, anchor and component offset of the targeted layers to the nearest position on the font's grid (whole units unless the grid spacing says otherwise)."
ref = "Font View › Batch-Processing; Font Info › Other Settings (grid)"
status = "handbook"
guesses = [
  "A font whose grid is off (spacing 0) rounds to whole units.",
]

[[command]]
id = "path.roundCoordinatesForAllMasters"
label = "Round Coordinates for All Masters"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs: [names] | glyph: name} → {glyphs, skipped}"
area = "path-ops"
milestone = "M3"
summary = "The Option-key form of Round Coordinates: applies it to every master layer of the targeted glyphs. An alias of path.roundCoordinates with allMasters; the label is ours."
ref = "Font View › Batch-Processing"
status = "handbook"
guesses = [
  "The label \"… for All Masters\" is ours; the handbook describes the Option key but not the item's label (03a question 18).",
]

[[command]]
id = "path.removeOverlapForAllMasters"
label = "Remove Overlap for All Masters"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs: [names] | glyph: name, keepOpenPaths?: bool} → {glyphs, skipped}"
area = "path-ops"
milestone = "M3"
summary = "The Option-key form of Remove Overlap: applies it to every master layer of the targeted glyphs. An alias of path.removeOverlap over all masters; the label is ours."
ref = "Font View › Batch-Processing"
status = "handbook"
guesses = [
  "The label \"… for All Masters\" is ours; the handbook describes the Option key but not the item's label (03a question 18).",
]

[[command]]
id = "glyph.decomposeGlyphForAllMasters"
label = "Decompose Components for All Masters"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names]}"
area = "components"
milestone = "M6"
summary = "The Option-key form of Decompose Components (the Font View chapter's name for Decompose Glyph): decomposes on every master layer of the targeted glyphs. An alias of glyph.decomposeGlyph over all masters; the label is ours."
ref = "Font View › Batch-Processing"
status = "handbook"

[[command]]
id = "path.convertToQuadratic"
label = "Convert to Quadratic"
menu = ["Path", "Other"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?} | {glyphs: [names], layer?: id | layers?: [ids]} | {glyphs | glyph, allMasters: true}, tolerance?: units (default 0.001 em) → {glyphs, skipped, segments: count}"
area = "path-ops"
milestone = "M3"
summary = "Rewrites cubic segments as quadratic ones, approximating within a tolerance (the compiler's by default), as TrueType outlines need. The opposite is path.convertToCubic."
ref = "Font View › Batch-Processing"
status = "handbook"
guesses = [
  "New off-curve points are rounded to the grid.",
  "With allMasters, master layers with the same node structure are converted together (one spline length for all), so they stay compatible.",
]
