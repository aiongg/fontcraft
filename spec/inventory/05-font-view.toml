[[behavior]]
id = "fontView.batch.appliesToSelection"
area = "font-view"
milestone = "M4"
summary = "Glyph-menu and Path-menu commands run from Font View act on every selected glyph, on the layer of the current master. Commands marked as master-wide act on all masters when Option is held."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"
notes = "The shell fills `glyphs` from the Font View selection, and the layer parameter with Font View's master (`layer?`, `layers?`, `master?`, where the default is the first master), for every command whose targets include glyphs (`crates/ui/src/app/targets.rs`). A command on nodes, paths or one layer refuses with \"<label>: edit a glyph first\"; the glyph of the tab behind Font View is never a target, and the glyph panels show the one selected glyph, or nothing while several or none are selected (M4.35). Option for all masters is not wired to the key yet; the ForAllMasters commands do it. In `crates/ui`, a glyph command fired from the window (menu, shortcut, context menu, ui.menu.invoke) with no glyph in the edit view and nothing selected in Font View changes nothing and puts \"<label>: select a glyph first\" in the status line, as its dialog does (`FontCraftApp::fired`); Paste of a drawing refuses the same way, and a command whose `glyphs` default to every glyph refuses too. Commands with explicit parameters (`engine.execute`, the CLI) are unaffected."
guesses = [
  "With no glyph shown and nothing selected, a glyph command refuses with a status message instead of acting on the font's first glyph or on every glyph; whether the reference greys such menu items out would settle it.",
]
observe = [
  "Deselect everything in Font View and look at the Glyph and Path menus: note which items are greyed and what Update Metrics does.",
]

