summary = "Renames the selected glyphs by replacing every occurrence of the Find text in their names with the Replace text. An empty Find appends the Replace text to each name; with Regex on, Find is a regular expression and Replace may use numbered group references such as \\1."
ref = "Font View › Batch-Processing › Batch-Renaming Glyphs"
status = "handbook"
notes = "Regex mode and the `\\1` group references are documented in the handbook but not yet observed. The pattern is read within the same size and nesting limits as the search field's regular expressions; a pattern that cannot be compiled, or a reference to a group the pattern lacks, refuses the command and names the problem. Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs4.0-4000.html): renames through Find and Replace also bring up the dialog about uses of renamed glyphs (4.0, build 3854)."
guesses = [
  "A batch that would give two glyphs the same name, or any glyph an invalid name, is refused as a whole and the clashes are listed. Each rename follows glyph.rename. The reference prevents duplicate names here (version 3 release notes, build 3177); whether it refuses the batch, skips the clashing glyphs or adds a suffix is not documented. Settled by observation (05 question 9).",
  "The results are not converted to nice names: Find and Replace gives the names it computes. Settled by observation.",
  "In Regex mode a group reference is a backslash and one digit (`\\0` is the whole match, `\\10` is group 1 followed by 0), `\\\\` is a backslash, and `$` is plain text. Settled by renaming with a two-digit group reference and a `$` in the reference app.",
  "Matching is case-sensitive unless `matchCase` is false, in plain and Regex mode alike; with it false, plain Find is still plain text. The reference has a case option in its search-and-replace dialog (4.0 release notes, build 3823); its default and its effect in Regex mode are not documented.",
