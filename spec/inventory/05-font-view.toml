# ── Glyph order ──

[[behavior]]
id = "glyphOrder.default"
area = "font-view"
milestone = "M4"
summary = "Without a custom order, glyphs are ordered by sort name, where a glyph's sort name is its own override, else the database value, else its glyph name. The same order is used in Font View and in exported fonts."
ref = "Font View › Glyph Order; Sort Name; GlyphsSDK GlyphsFileFormatv3.md; tutorials \"Alter the glyph order in Font view\" and \"Roll your own glyph data\" (glyphsapp.com/learn)"
status = "handbook"
notes = "The tutorials say the default orders glyphs alphabetically within their category, and that glyph data can change it with sortName. Documented, not yet observed. The owner chose to keep a file's stored order and place new glyphs by the sort key (docs/plans/M4.md § 7 question 5); the key itself is our guess (below). The key is GlyphData::sort_key in crates/glyphdata; fontcraft_model::glyph_order gives the order and fontcraft_model::insertion_index a new glyph's place (glyph.newGlyph uses it). Export reads the same order (Font::resolve, M4.2)."
guesses = [
  "An opened file keeps its stored glyph order, which is the order the oracles compile; only glyphs added later, renamed, or given a sort name move to the place the sort key gives. Settled by observing where the reference puts a new glyph (05 question 2).",
  "The published data has no sort names, so the key is ours: category in the order Letter, Number, Punctuation, Symbol, Separator, Mark, then glyphs without one; within a category the base glyph's first code point, then the name; suffixed glyphs after the run of base glyphs, or right after their base with Keep Alternates Next to Base Glyph on. Settled by observation (05 question 2).",
  "A sort name (from custom glyph data or the glyph itself) places the glyph after the others of its category, ordered by the sort name.",
  "In a stored order that is not sorted by the key, a new glyph goes right after the last glyph whose key is not greater than its own (first when there is none), so it follows the glyphs it would follow in a sorted font. Settled by observing where the reference puts a new glyph in a hand-ordered font.",
]

[[behavior]]
id = "glyphOrder.customParameter"
area = "font-info"
milestone = "M4"
summary = "A font-level glyphOrder parameter holding glyph names, one per line, replaces the default order in Font View and in exports, and makes sort names irrelevant. How glyphs missing from the list are placed is not stated in this chapter."
ref = "Font View › Glyph Order"
status = "handbook"
notes = "Moved from M7 to M4 by the M7 planning pass: M4 built it (crates/model/src/order.rs; the compiler uses the same order)."

[[behavior]]
id = "glyphOrder.keepAlternatesSortName"
area = "font-view"
milestone = "M4"
summary = "Source files can store a second sort key, sortNameKeep, used by a display mode that keeps alternates next to their base glyph. The mode is not described in this chapter and must be located in the reference's settings."
ref = "GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

