# ── Glyph order ──

[[behavior]]
id = "glyphOrder.default"
area = "font-view"
milestone = "M4"
summary = "Without a custom order, glyphs are ordered by sort name, where a glyph's sort name is its own override, else the database value, else its glyph name. The same order is used in Font View and in exported fonts."
ref = "Font View › Glyph Order; Sort Name; GlyphsSDK GlyphsFileFormatv3.md; tutorials \"Alter the glyph order in Font view\" and \"Roll your own glyph data\" (glyphsapp.com/learn)"
status = "handbook"
notes = "The tutorials say the default orders glyphs alphabetically within their category, and that glyph data can change it with sortName. Documented, not yet observed. The owner chose to keep a file's stored order and place new glyphs by the sort key (docs/plans/M4.md § 7 question 5); the key follows the release notes and the tutorial where they say (script first, alphabetical within a category, a sort name in the name's place), the rest is our guess (below). The key is GlyphData::sort_key in crates/glyphdata; fontcraft_model::glyph_order gives the order and fontcraft_model::insertion_index a new glyph's place (glyph.newGlyph uses it). Export reads the same order (Font::resolve, M4.2). Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs4.0-4000.html and updates.glyphsapp.com/Glyphs3.4-3434.html): glyphs sort by script first (4.0, build 3844); Font View puts punctuation and numbers in a group per script (version 3, builds 3327 and 3328; 4.0, build 3826). The tutorial \"Roll your own glyph data\" says a sort name takes the place of the name in the alphabetical order within the category (`Az` moves AE behind the accented A) (05 question 23). With a glyphOrder parameter, glyphs it does not name follow the listed ones, sorted (developer's answer, thread \"Alternate glyph position/order in font window\", forum.glyphsapp.com/t/27889, 2023-11-16)."
guesses = [
  "An opened file keeps its stored glyph order, which is the order the oracles compile; only glyphs added later, renamed, or given a sort name move to the place the sort key gives. Settled by observing where the reference puts a new glyph (05 question 2).",
  "The published data has no sort names and the order of the scripts and of the categories is not documented, so these parts of the key are ours: the scripts in the order Latin, Greek, Cyrillic, the others by name, then glyphs without one; in a script the categories in the order Letter, Number, Punctuation, Symbol, Separator, Mark, then glyphs without one; suffixed glyphs after the run of base glyphs, or right after their base with Keep Alternates Next to Base Glyph on (05 question 23).",
  "Numbers without a sort name are in order of their code points; other glyphs of a category in the order of their names' characters, capitals before small letters.",
  "In a stored order that is not sorted by the key, a new glyph goes right after the last glyph whose key is not greater than its own (first when there is none), so it follows the glyphs it would follow in a sorted font. Settled by observing where the reference puts a new glyph in a hand-ordered font.",
]
observe = [
  "Open a file whose stored order is B, A, C and add D, then a suffixed A.alt: note where each goes, before and after Update Glyph Info.",
  "In a new font add A, a, be-cy, one, one-ar, period, plus and acutecomb, and write down the order and the section headers.",
  "Reorder nothing, set A's sort name to `Cz`, and note A's place.",
  "In a font with a hand-made glyphOrder that lists only some glyphs, add two glyphs and note their places.",
]

[[behavior]]
id = "glyphOrder.customParameter"
area = "font-info"
milestone = "M4"
summary = "A font-level glyphOrder parameter holding glyph names, one per line, replaces the default order in Font View and in exports, and makes sort names irrelevant. How glyphs missing from the list are placed is not stated in this chapter."
ref = "Font View › Glyph Order"
status = "handbook"
notes = "Moved from M7 to M4 by the M7 planning pass: M4 built it (crates/model/src/order.rs; the compiler uses the same order)."

[[behavior]]
id = "glyphOrder.keepAlternatesSortName"
area = "font-view"
milestone = "M4"
summary = "Source files can store a second sort key, sortNameKeep, used by a display mode that keeps alternates next to their base glyph. The mode is not described in this chapter and must be located in the reference's settings."
ref = "GlyphsSDK GlyphsFileFormatv3.md"
status = "docs"

# ── Images ──

[[behavior]]
id = "fontView.image.addImageSingle"
area = "color"
milestone = "M11"
summary = "Run from Font View with one file chosen, glyph.addImage (Glyph → Add Image…) places the image on the selected glyph's active layer."
ref = "Font View › Images"
status = "handbook"
notes = "Documented, not yet observed. Commands take no UI state, so the caller names the glyphs (`glyphs`) and the layer; without `layer` the first master's layer is used."

[[behavior]]
id = "fontView.image.dropOnCell"
area = "color"
milestone = "M11"
summary = "Dropping an image file from the file manager onto a glyph cell places the image on that glyph's currently active layer."
ref = "Font View › Images"
status = "handbook"
notes = "Documented, not yet observed. The drop runs `glyph.addImage` with the file, the glyph under the pointer and Font View's master layer; List View rows take drops the same way."
guesses = [
  "The active layer of a glyph in Font View is its layer of Font View's master. Settled by dropping an image on a cell while Font View shows the second master in the reference.",
  "Several files dropped on Font View are matched to glyph names, whatever cell they land on, as Add Image does with several files. Settled by dropping two files on one cell in the reference.",
]
observe = [
  "With the second master shown drop an image on a cell: note which layer holds it.",
  "Drop two images on one cell and note where each goes.",
]

[[behavior]]
id = "fontView.image.batchByFileName"
area = "color"
milestone = "M11"
summary = "When Add Image is given several files, each is matched to a glyph by file name without extension and placed on that glyph's current-master layer. Files with no matching glyph are listed in the command's result and change nothing."
ref = "Font View › Images"
status = "handbook"
notes = "Documented, not yet observed. A glyph name is the file name without its folder and last extension (`A.alt.png` names `A.alt`). The placed and unmatched files are listed in the result; when no file matches, the call is refused."
guesses = [
  "Files with no glyph of their name are skipped and listed in the result; no glyph is created. Settled by Add Image with an unmatched file in the reference.",
]
observe = ["Image font: in Font View, Add Image with H.png, I.png, J.png and a.png; note which glyphs receive an image and any message about J, which has no glyph."]

[[behavior]]
id = "fontView.image.caseSensitivity"
area = "color"
milestone = "M11"
summary = "Glyph names are case-sensitive but many file systems are not, so A.png and a.png cannot share a folder there. The documented workaround is to keep uppercase and lowercase images in separate folders; on case-sensitive systems we match exactly."
ref = "Font View › Images"
status = "handbook"
notes = "Documented, not yet observed. Images for upper- and lower-case glyphs can be kept in separate folders and added in one call."
guesses = [
  "File names are matched to glyph names exactly, case included, on every platform. Settled by Add Image with `a.png` in a font with `A` and `a` in the reference.",
]
observe = ["Image font: in Font View, Add Image with H.png, I.png, J.png and a.png; note whether a.png goes to a only or also to A."]

[[behavior]]
id = "fontView.image.showImageOption"
area = "color"
milestone = "M11"
summary = "View → Show Image controls whether placed images are drawn in Font View cells; empty glyphs show their image regardless of the option."
ref = "Font View › Images"
status = "handbook"
notes = "Documented, not yet observed. The option is the one `view.showImage` sets for Edit View."

# ── Rows added after the audit of 2026-10-07: commands the Font View chapter states that had only
#    been recorded as batch behaviours. ──
observe = ["Image font: in Font View turn Show Image off; note whether H (which has paths) is drawn without its image and I (empty) with its image."]

[[command]]
id = "path.roundCoordinates"
label = "Round Coordinates"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]]} | {glyphs: [names], layer?: id | layers?: [ids]} | {glyphs | glyph, allMasters: true} → {glyphs, skipped, incompatible}"
area = "path-ops"
milestone = "M3"
summary = "Moves every node, handle, anchor and component offset of the targeted layers to the nearest position on the font's grid (whole units unless the grid spacing says otherwise). In Edit View, with a selection, it rounds only the selected points."
ref = "Font View › Batch-Processing; Font Info › Other Settings (grid)"
status = "handbook"
notes = "The handbook's grid section says the command rounds the selected points; documented, not yet observed. FontCraft: with `points` or `segments` (the window passes the Edit View selection) only those nodes move, with the handles next to each selected on-curve node and every node of each selected segment. `incompatible` is always empty, as path.tidyUpPaths returns it: rounding adds, removes or retypes no point."
guesses = [
  "A font whose grid is off (spacing 0) rounds to whole units.",
  "With a selection, the handles next to a selected on-curve node are rounded with it.",
  "With a selection, anchors and components stay where they are, even when selected.",
]
observe = [
  "Select two nodes of a path with fractional coordinates and an anchor, run Round Coordinates, and note which nodes, handles and anchors move.",
  "Set the grid spacing to 0, give a node the coordinate 10.4 and run Round Coordinates: note the coordinate.",
]

