status = "handbook"

[[behavior]]
id = "copyGlyphNames.onePerLine"
area = "font-view"
milestone = "M4"
summary = "One per Line: each name on its own line with no other separator. This is the form a list filter accepts."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

[[behavior]]
id = "copyGlyphNames.commaSeparated"
area = "font-view"
milestone = "M4"
summary = "Comma Separated: all names on one line, each followed by a comma and a space, including the last."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

[[behavior]]
id = "copyGlyphNames.slashed"
area = "font-view"
milestone = "M4"
summary = "Slashed: each name prefixed with a slash and run together on one line (/five/six/seven). The result can be pasted into Edit View as text."
