# Source: Glyphs 4 Handbook, chapter "Font View" (https://handbook.glyphsapp.com, sections Viewing
#   Glyphs, Managing the Glyph Set, Glyph Properties, Names & Unicode, Batch-Processing, Filtering
#   Font View, Glyph Order, Images).
# Supporting sources (permissive licences, read for facts about the glyph database):
#   refs/GlyphsInfo (BSD-3-Clause): README.md, the GlyphData.xml DTD and attribute vocabulary,
#     "Convert to tabbed file.py" (field list of the tabular form)
#   refs/agl-aglfn (BSD-3-Clause): README.md, glyphlist.txt / aglfn.txt record formats
#   refs/fontc glyphs-reader/src/glyphdata.rs (Apache-2.0): name -> category / production-name rules
#   refs/GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv3.md: the per-glyph keys stored in a source
# Date: 2026-10-07
# Behaviour notes: docs/spec/05-font-view.md
#
# Commands that belong to other chapters (Edit > Copy/Paste/Select All, the Path menu, most of the
# Glyph menu) are NOT redefined here; their Font View semantics are [[behavior]] rows that name the
# command id they refine.

# ───────────────────────────── View: window, grid, list ─────────────────────────────

[[command]]
id = "fontView.show"
label = "Show Font View"
menu = []
shortcut = "Cmd+Alt+1"
kind = "ui"
params = "{}"
area = "font-view"
milestone = "M4"
summary = "Switches the font window to the Font View tab, which is always the leftmost tab. It is also the tab a newly created document opens on. Font View always occupies the first tab of a window."
ref = "Font View › (introduction)"
status = "handbook"

[[command]]
id = "fontView.setViewMode"
label = "Grid View / List View"
menu = []
shortcut = ""
kind = "ui"
params = "{mode: \"grid\" | \"list\"}"
area = "font-view"
milestone = "M4"
summary = "Switches Font View between the cell grid and the property table. Bound to the two buttons at the top left of the font window. Whether selection and filters carry over is not stated."
ref = "Font View › Viewing Glyphs"
status = "handbook"

[[command]]
id = "fontView.setCellSize"
label = "Cell Size"
menu = []
shortcut = ""
kind = "ui"
params = "{size: number}"
area = "font-view"
milestone = "M4"
summary = "Sets the grid cell size (the slider at the bottom right). Below a size threshold cells show the outline only; above it they also show the name and the Unicode marker."
ref = "Font View › Grid View"
status = "handbook"

[[command]]
id = "fontView.sortByColumn"
label = "Sort by Column"
menu = []
shortcut = ""
kind = "ui"
params = "{column: string, ascending?: bool}"
area = "font-view"
milestone = "M4"
summary = "Sorts the List View rows by one column. Clicking the same header a second time reverses the direction; sorting by the ID column restores glyph order."
ref = "Font View › List View"
status = "handbook"

[[command]]
id = "fontView.setColumns"
label = "Show / Hide / Reorder Columns"
menu = []
shortcut = ""
kind = "ui"
params = "{visible?: [column], order?: [column]}"
area = "font-view"
milestone = "M4"
summary = "Chooses which List View columns are shown and in what order. In the UI, columns are reordered by dragging a header and toggled from the header context menu (Ctrl-click or right-click)."
ref = "Font View › List View"
status = "handbook"

[[command]]
id = "fontView.toggleInspector"
label = "Show / Hide Glyph Inspector"
menu = []
shortcut = ""
kind = "ui"
params = "{visible?: bool}"
area = "font-view"
milestone = "M4"
summary = "Opens or closes the glyph inspector at the bottom left of Font View (the disclosure button)."
ref = "Font View › Glyph Properties"
status = "handbook"

[[command]]
id = "fontView.toggleInspectorDetails"
label = "Show / Hide Extra Glyph Properties"
menu = []
shortcut = ""
kind = "ui"
params = "{expanded?: bool}"
area = "font-view"
milestone = "M4"
summary = "Expands or collapses the extra inspector rows for production name, script, category and subcategory (the chevron beside the Unicode field)."
ref = "Font View › Glyph Properties"
status = "handbook"

[[command]]
id = "fontView.toggleMetricsOrientation"
label = "Horizontal / Vertical Metrics"
menu = []
shortcut = ""
kind = "ui"
params = "{orientation?: \"horizontal\" | \"vertical\"}"
area = "spacing-kerning"
milestone = "M5"
summary = "Switches the inspector's metric fields between the horizontal set (LSB, RSB, width) and the vertical set (TSB, BSB, vertical origin, vertical width). Bound to the icon between the fields."
ref = "Font View › Glyph Properties › Metrics"
status = "handbook"

[[command]]
id = "fontView.setSelection"
label = "Set Glyph Selection"
menu = []
shortcut = ""
kind = "ui"
params = "{glyphs: [names], mode?: \"replace\" | \"add\" | \"remove\"}"
area = "font-view"
milestone = "M4"
summary = "Our headless equivalent of clicking cells: sets the Font View glyph selection by name. Every batch command without explicit targets acts on this selection."
ref = "Font View › Batch-Processing › Selecting Glyphs"
status = "inferred"
guesses = [
  "Our own command with no counterpart in the reference; its parameters and result are our design.",
]

[[command]]
id = "fontView.getState"
label = "Get Font View State"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "font-view"
milestone = "M4"
summary = "Our query for agents: returns view mode, cell size, sort column, selected sidebar entries, search query and options, the selected glyph names, the visible glyph names in display order, and the three counts shown in the status area."
ref = "Font View › Filtering Font View"
status = "inferred"

# ───────────────────────────── Adding, duplicating, removing glyphs ─────────────────────────────

[[command]]
id = "glyph.addGlyphs"
label = "Add Glyphs…"
menu = ["Glyph"]
shortcut = "Cmd+Shift+G"
kind = "engine"
params = "{text: string, onExisting?: \"ask\" | \"replace\" | \"keep\" | \"cancel\"}"
area = "font-view"
milestone = "M4"
summary = "Opens a dialog with one text field and adds a glyph for every space-separated item: a glyph name, a literal character, a uniXXXX / uXXXXX value, a colon range, or a glyph recipe. Items given as a character or Unicode name are converted to the database nice name; names already in the font trigger the Replace / Keep Existing / Cancel dialog."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs"
status = "handbook"

[[command]]
id = "glyph.newGlyph"
label = "New Glyph"
menu = ["Glyph"]
shortcut = "Cmd+Alt+Shift+N"
kind = "engine"
params = "{name?: string}"
area = "font-view"
milestone = "M4"
summary = "Adds one empty glyph called newGlyph. The plus button at the bottom left of Font View runs the same command. The source does not say what name is used when newGlyph already exists."
ref = "Font View › Adding New Glyphs › Adding a Single Glyph"
status = "handbook"

[[command]]
id = "glyph.duplicateGlyph"
label = "Duplicate Glyph"
menu = ["Glyph"]
shortcut = "Cmd+D"
kind = "engine"
params = "{glyphs?: [names], suffix?: string}"
area = "font-view"
milestone = "M4"
summary = "Makes a copy of every selected glyph in the same font. This chapter only lists the command and shortcut; from memory the copy gets the next free numeric suffix (A.001, A.002 …), the same pattern the chapter documents for name clashes on paste."
ref = "Font View › Batch-Processing › Batch Commands"
status = "handbook"

[[command]]
id = "glyph.removeGlyph"
label = "Remove Glyph"
menu = ["Glyph"]
shortcut = "Cmd+Delete"
kind = "engine"
params = "{glyphs?: [names], components?: \"remove\" | \"decompose\", metricsKeys?: \"dissolve\" | \"keep\", confirm?: bool}"
area = "font-view"
milestone = "M4"
summary = "Deletes the selected glyphs after a confirmation dialog (Remove / Cancel). Applies to glyphs selected in Font View, to the glyph being edited in Edit View and to a Text-tool selection; the minus button at the bottom left of Font View does the same. Follow-up choices cover glyphs used as components and metrics keys that point at a deleted glyph."
ref = "Font View › Deleting Glyphs"
status = "handbook"

[[command]]
id = "glyph.updateGlyphInfo"
label = "Update Glyph Info"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names]}"
area = "font-view"
milestone = "M4"
summary = "Batch command on the selected glyphs. The chapter only lists it; from memory it re-reads each glyph's properties (nice name, Unicode values, category, subcategory, script, production name) from the glyph database and discards per-glyph deviations."
ref = "Font View › Batch-Processing › Batch Commands"
status = "memory"

[[command]]
id = "window.glyphInfo"
label = "Glyph Info"
menu = ["Window"]
shortcut = ""
kind = "ui"
params = "{}"
area = "font-view"
milestone = "M4"
summary = "Opens the Glyph Info window: a searchable, sortable table of every entry in the glyph database."
ref = "Font View › Names & Unicode › Glyph Info Database"
status = "handbook"

[[command]]
id = "glyphInfo.addToFont"
label = "Add to Font"
menu = []
shortcut = ""
kind = "engine"
params = "{names: [names]}"
area = "font-view"
milestone = "M4"
summary = "Adds the database entries selected in the Glyph Info window to the current font as new glyphs (the Add to Font button)."
ref = "Font View › Adding New Glyphs › Adding From the Glyph Info Database"
status = "handbook"

[[command]]
id = "fontView.listMissingGlyphs"
label = "Show Missing Glyphs"
menu = []
shortcut = ""
kind = "engine"
params = "{entry: string}"
area = "font-view"
milestone = "M4"
summary = "For a sidebar entry that knows its full glyph set (a subcategory, language, script or list filter), returns the glyph names it expects that the font does not contain. In the UI this is the list opened by Ctrl-click or right-click on the entry."
ref = "Font View › Adding New Glyphs › Adding From the Sidebar"
status = "handbook"

[[command]]
id = "fontView.generateMissingGlyphs"
label = "Generate"
menu = []
shortcut = ""
kind = "engine"
params = "{entry: string, glyphs?: [names]}"
area = "font-view"
milestone = "M4"
summary = "Adds the glyphs chosen in the missing-glyphs list of a sidebar entry to the font (the Generate button). Without `glyphs`, adds every missing glyph of the entry, matching Cmd+A followed by Generate."
ref = "Font View › Adding New Glyphs › Adding From the Sidebar"
status = "handbook"

[[command]]
id = "edit.pasteSpecial"
label = "Paste Special"
menu = ["Edit"]
shortcut = "Cmd+Alt+V"
kind = "engine"
params = "{mode: \"sameName\" | \"selected\" | \"asComponents\", parts?: [\"all\" | \"activeLayer\" | \"kerningGroups\" | \"metricsKeys\" | \"lsb\" | \"rsb\" | \"width\"], allMasters?: bool, targets?: [names]}"
area = "font-view"
milestone = "M4"
summary = "Pastes copied glyphs over existing ones through a dialog with three modes (Glyphs With Same Name, Selected Glyphs, As Components) and, for the first two, a choice of which parts of each glyph to transfer. The menu item appears in place of Paste while Option is held."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"

# ───────────────────────────── Glyph properties ─────────────────────────────

[[command]]
id = "edit.infoForSelection"
label = "Info for Selection"
menu = ["Edit"]
shortcut = "Cmd+Alt+I"
kind = "ui"
params = "{}"
area = "font-view"
milestone = "M4"
summary = "Opens the Selection Info window for the selected glyphs, where name, Unicode values, production name, script, category, subcategory and sort name can be read and overridden."
ref = "Font View › Glyph Properties"
status = "handbook"

[[command]]
id = "glyph.getInfo"
label = "Get Glyph Info"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names]}"
area = "font-view"
milestone = "M4"
summary = "Our query for agents: returns every property the inspector, List View and Selection Info show for each glyph, with a flag per property saying whether the value is stored in the file or resolved from the glyph database."
ref = "Font View › Glyph Properties"
status = "inferred"

[[command]]
id = "glyph.rename"
label = "Rename Glyph"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, newName: string, updateInfo?: bool}"
area = "font-view"
milestone = "M4"
summary = "Changes a glyph's name (click the name under a cell, in the Name column, or in the inspector). When the base name before the first dot changes, the database-derived properties (Unicode values, category and so on) are re-resolved; when only the dot suffix changes they are left alone. Fails if the new name is already taken."
ref = "Font View › Names & Unicode › Renaming Glyphs"
status = "handbook"

[[command]]
id = "glyph.setUnicodes"
label = "Set Unicode Values"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], unicodes: [hex]}"
area = "font-view"
milestone = "M4"
summary = "Replaces the list of code points of a glyph, overriding the database value for this file only. Editable in three places: the inspector's Unicode field, List View's Unicode column, and the Selection Info window; a glyph may hold zero, one or several values."
ref = "Font View › Glyph Properties › Unicode"
status = "handbook"

[[command]]
id = "glyph.setProductionName"
label = "Set Production Name"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], productionName: string | null}"
area = "import-export"
milestone = "M4"
summary = "Overrides the name a glyph is exported under; null returns to the default derived from the glyph database. Editable in the expanded inspector and in Selection Info."
ref = "Font View › Glyph Properties › Production Name"
status = "handbook"

[[command]]
id = "glyph.setScript"
label = "Set Script"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], script: string | null}"
area = "font-view"
milestone = "M4"
summary = "Overrides the writing script of a glyph (lowercase ids such as latin, cyrillic, arabic, thai); null returns to the database value, which is empty for glyphs shared between scripts such as digits, punctuation and spaces."
ref = "Font View › Glyph Properties › Script"
status = "handbook"

[[command]]
id = "glyph.setCategory"
label = "Set Category & Subcategory"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], category?: string | null, subCategory?: string | null}"
area = "font-view"
milestone = "M4"
summary = "Overrides the category and/or subcategory of a glyph (for example Punctuation / Quote); null returns the field to the database value."
ref = "Font View › Glyph Properties › Category & Subcategory"
status = "handbook"

[[command]]
id = "glyph.setCase"
label = "Set Case"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], case: \"upper\" | \"lower\" | \"smallCaps\" | \"minor\" | \"noCase\" | null}"
area = "font-view"
milestone = "M4"
summary = "Overrides the case of a glyph; null returns to the derived value. The chapter describes the property and its five values but does not say where it is edited, so the control placement is our design."
ref = "Font View › Glyph Properties › Case"
status = "inferred"

[[command]]
id = "glyph.setDirection"
label = "Set Writing Direction"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], direction: \"LTR\" | \"RTL\" | \"BIDI\" | null}"
area = "font-view"
milestone = "M4"
summary = "Overrides a glyph's writing direction; null returns to the database value. The chapter describes the three values but not where the property is edited."
ref = "Font View › Glyph Properties › Writing Direction"
status = "inferred"

[[command]]
id = "glyph.setExport"
label = "Exports"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], export: bool}"
area = "font-view"
milestone = "M4"
summary = "Sets whether a glyph is written into exported fonts (the Exports checkbox of the inspector). New glyphs export unless their name begins with an underscore."
ref = "Font View › Glyph Properties › Exports"
status = "handbook"

[[command]]
id = "glyph.setColorLabel"
label = "Color Label"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], color: 0..11 | name | null}"
area = "font-view"
milestone = "M4"
summary = "Sets or clears the glyph-level colour label, chosen from twelve fixed colours in the glyph context menu; the cross button clears it. In Edit View the same command is in the canvas context menu of the active glyph. Labels are organisational only and never reach an exported font."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[command]]
id = "glyph.setLayerColorLabel"
label = "Layer Color Label"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], layer?: id, color: 0..11 | name | null}"
area = "font-view"
milestone = "M4"
summary = "Sets or clears the colour label of the current layer of each selected glyph. In the UI the context-menu colour swatches act on the layer instead of the glyph while Option is held."
ref = "Font View › Glyph Properties › Color Label"
status = "handbook"

[[command]]
id = "glyph.setTags"
label = "Set Tags"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], tags: [string]}"
area = "font-view"
milestone = "M4"
summary = "Replaces the tag list of the selected glyphs (the Tags field of the inspector). A tag may contain letters, digits, spaces and punctuation, but never a comma."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"

[[command]]
id = "glyph.addTag"
label = "Add Tag"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], tag: string}"
area = "font-view"
milestone = "M4"
summary = "Adds one tag to every selected glyph. Run by typing a comma or Return in the Tags field, or by picking a tag in the Tags submenu of the glyph context menu."
ref = "Font View › Glyph Properties › Tags"
status = "handbook"

[[command]]
id = "glyph.removeTag"
label = "Remove Tag"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], tag: string}"
area = "font-view"
milestone = "M4"
summary = "Removes one tag from every selected glyph (deleting its capsule in the Tags field). Whether picking an already checked tag in the context menu also removes it is not stated in the source."
ref = "Font View › Glyph Properties › Tags"
status = "inferred"

[[command]]
id = "glyph.setSortName"
label = "Set Sort Name"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], sortName: string | null}"
area = "font-view"
milestone = "M4"
summary = "Sets the key a glyph is ordered by in Font View and in exported fonts; null (unchecked box, empty field) means the glyph name is the key. Edited in Selection Info after ticking the checkbox next to the field."
ref = "Font View › Glyph Properties › Sort Name"
status = "handbook"

[[command]]
id = "glyph.setNote"
label = "Set Glyph Note"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], note: string}"
area = "font-view"
milestone = "M4"
summary = "Sets the free-text note of a glyph, edited in the Note column of List View. Notes are matched by the Font View search field."
ref = "Font View › Glyph Properties › Note"
status = "handbook"

[[command]]
id = "glyph.setComponents"
label = "Edit Components List"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, components: [names]}"
area = "components"
milestone = "M6"
summary = "Rewrites which components a glyph uses from a list of base-glyph names, adding and removing components to match (the editable Components cell of List View). Separator syntax, placement of added components and which layers are affected are not stated in the source."
ref = "Font View › Glyph Properties › Components"
status = "handbook"

[[command]]
id = "glyph.copyGlyphNames"
label = "Copy Glyph Names"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], format: \"spaceSeparated\" | \"onePerLine\" | \"commaSeparated\" | \"slashed\" | \"pythonList\" | \"unicodes\"}"
area = "font-view"
milestone = "M4"
summary = "Writes the names (or code points) of the selected glyphs to the clipboard in one of six text formats. Reached from the Copy Glyph Names submenu of the glyph context menu; headless it returns the text."
ref = "Font View › Names & Unicode › Copy Glyph Names"
status = "handbook"

# ───────────────────────────── Glyph data queries ─────────────────────────────

[[command]]
id = "glyphData.lookup"
label = "Look Up Glyph Data"
menu = []
shortcut = ""
kind = "engine"
params = "{name?: string, unicode?: hex, char?: string}"
area = "font-view"
milestone = "M4"
summary = "Our query: resolves a nice name, production name, alternative name, code point or character against the glyph database (custom entries first) and returns the full record, plus whether each field was found directly or synthesised from suffix, ligature or AGL rules."
ref = "Font View › Names & Unicode › Glyph Info Database; GlyphsInfo GlyphData.xml"
status = "inferred"

[[command]]
id = "glyphData.search"
label = "Search Glyph Data"
menu = []
shortcut = ""
kind = "engine"
params = "{query: string, sortBy?: string, limit?: number}"
area = "font-view"
milestone = "M4"
summary = "Our query behind the Glyph Info window's search field: returns database entries matching the text, optionally sorted by one field."
ref = "Font View › Names & Unicode › Glyph Info Database"
status = "inferred"

[[command]]
id = "glyphData.productionName"
label = "Resolve Production Name"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names]}"
area = "import-export"
milestone = "M2"
summary = "Our query: returns the name each glyph will carry in an exported font, applying the per-glyph override, the database value, then the suffix and ligature rules, and falling back to the nice name."
ref = "Font View › Glyph Properties › Production Name; fontc glyphs-reader glyphdata.rs"
status = "inferred"

[[command]]
id = "font.validateGlyphNames"
label = "Validate Glyph Names"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names]}"
area = "font-view"
milestone = "M4"
summary = "Our query: reports every glyph whose name breaks the naming rules, with the position of the first offending character, so the problem can be found before an export or feature compile fails."
ref = "Font View › Names & Unicode › Glyph Naming Rules"
status = "inferred"

# ───────────────────────────── Batch renaming ─────────────────────────────

[[command]]
id = "edit.findAndReplace"
label = "Find and Replace…"
menu = ["Edit", "Find"]
shortcut = "Cmd+Shift+F"
kind = "engine"
params = "{glyphs?: [names], find: string, replace: string, regex?: bool}"
area = "font-view"
milestone = "M4"
summary = "Renames the selected glyphs by replacing every occurrence of the Find text in their names with the Replace text. An empty Find appends the Replace text to each name; with Regex on, Find is a regular expression and Replace may use numbered group references such as \\1."
ref = "Font View › Batch-Processing › Batch-Renaming Glyphs"
status = "handbook"

# ───────────────────────────── Search and sidebar filters ─────────────────────────────

[[command]]
id = "fontView.focusSearch"
label = "Find (Search Glyphs)"
menu = []
shortcut = "Cmd+F"
kind = "ui"
params = "{}"
area = "font-view"
milestone = "M4"
summary = "Moves keyboard focus to the glyph search field at the top of Font View."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"

[[command]]
id = "fontView.setSearch"
label = "Search Glyphs"
menu = []
shortcut = ""
kind = "ui"
params = "{query: string, fields?: [\"name\" | \"unicode\" | \"note\"], matchCase?: bool, regex?: bool}"
area = "font-view"
milestone = "M4"
summary = "Sets the search query that narrows the visible glyphs. By default the text is matched against glyph name, Unicode value, the literal character and the glyph note; the magnifier menu restricts the fields and toggles Match Case and Regex. An empty query removes the restriction."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"

[[command]]
id = "fontView.selectSidebarEntries"
label = "Select Sidebar Entries"
menu = []
shortcut = ""
kind = "ui"
params = "{entries: [path], mode?: \"replace\" | \"toggle\" | \"range\"}"
area = "font-view"
milestone = "M4"
summary = "Selects the sidebar entries that filter Font View: All, categories and subcategories, scripts and languages, smart filters, list filters and folders. Cmd-click toggles one entry, Shift-click selects a range of filters; selecting All shows every glyph."
ref = "Font View › Filtering Font View"
status = "handbook"

[[command]]
id = "fontView.queryGlyphs"
label = "Query Glyphs"
menu = []
shortcut = ""
kind = "engine"
params = "{entries?: [path], rules?: ruleTree, search?: {query, fields?, matchCase?, regex?}}"
area = "font-view"
milestone = "M4"
summary = "Our headless filter evaluation: returns the glyph names matching the given sidebar entries, an ad-hoc smart-filter rule tree and/or a search query, without touching the window state."
ref = "Font View › Filtering Font View"
status = "inferred"

[[command]]
id = "fontView.setVisibleScripts"
label = "Edit Languages List"
menu = []
shortcut = ""
kind = "ui"
params = "{show?: [script], hide?: [script]}"
area = "font-view"
milestone = "M4"
summary = "Chooses which scripts are listed in the Languages section by default (the plus button beside the section title opens a checklist). Scripts that have glyphs in the font are listed regardless."
ref = "Font View › Filtering Font View › Languages"
status = "handbook"

[[command]]
id = "fontView.addSmartFilter"
label = "Add Smart Filter"
menu = []
shortcut = ""
