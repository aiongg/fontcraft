[[command]]
id = "glyph.rename"
label = "Rename Glyph"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, newName: string, updateInfo?: bool}"
area = "font-view"
milestone = "M4"
summary = "Changes a glyph's name (click the name under a cell, in the Name column, or in the inspector). When the base name before the first dot changes, the database-derived properties (Unicode values, category and so on) are re-resolved; when only the dot suffix changes they are left alone. Fails if the new name is already taken."
ref = "Font View › Names & Unicode › Renaming Glyphs; tutorial \"Getting your glyph names right\" (glyphsapp.com/learn)"
status = "handbook"
notes = "The tutorial adds that a Private Use Area value set on a glyph stays when the glyph is renamed to a name the database does not know. Documented, not yet observed."
guesses = [
  "When the base name changes, the Unicode values become the glyph data's for the new name whenever the data knows the name, directly or through the suffix, ligature or code-point rules, so renaming B to A.alt clears them; a name the data does not know keeps the stored values. Settled by observation (05 question 4).",
  "Rename updates the font's references by name: components (also in backgrounds), kerning pairs, UFO groups, the glyphOrder parameter of the font and its instances, and metrics keys of the glyph and its layers. Feature code, kerning contexts, other custom parameters, hints and display strings are not rewritten; the result lists where the old name is still used. Settled by observation (05 question 9).",
  "A typed production, alternative or code-point name becomes the nice name (as for a new glyph), unless the font uses custom naming. Settled by observation.",
  "A name that breaks the naming rules is refused, as Find and Replace refuses one. Settled by observing whether the reference accepts an illegal name typed in Font View.",
  "When a locked glyph uses the renamed glyph as a component, the rename is refused, because a locked glyph refuses changes to its layers. Settled by observation.",
]

