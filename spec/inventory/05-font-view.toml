summary = "With Regex on, Find is a regular expression and Replace can refer to captured groups by backslash and number. Example: finding a literal dot, cv and two captured digits and replacing with .ss plus the first group turns someGlyph.cv03 into someGlyph.ss03 and otherglyph.cv15.alt into otherglyph.ss15.alt."
ref = "Font View › Batch-Processing › Batch-Renaming Glyphs"
status = "handbook"
notes = "Not built yet: edit.findAndReplace refuses `regex: true` until the engine depends on the regex crate (regex.engine)."

# ── Search ──

[[behavior]]
id = "fontView.search.fields"
area = "font-view"
milestone = "M4"
summary = "A search term matches a glyph by name (thorn), by hexadecimal code point (00FE), by the character itself, or by text in its note. The magnifier menu can restrict matching to name, Unicode value or note alone."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"
notes = "Release notes (\"What's new in Glyphs\", updates.glyphsapp.com/Glyphs3.4-3434.html): the search takes more than one name part (version 3, build 3201), and a search by character also finds its unencoded alternates (build 3193). How the parts are separated and combined is not stated."
guesses = [
  "A plain term matches names and notes by substring; it matches a code point when it is four to six hexadecimal digits (optionally after U+ or 0x) equal to it, and a character when it is that one character. Shorter hexadecimal terms such as FE only match names, so a term like a does not also find every code point containing A. The reference also takes several name parts and finds the unencoded alternates of a character (note), which FontCraft does not yet (05 question 22). Settled by observing a search for 00FE and for FE.",
]
observe = [
  "Search `FE`, `00FE`, `U+00FE`, `þ`, `thorn alt` and `þ` in a font with thorn and thorn.alt: note the glyphs found each time.",
]

[[behavior]]
id = "fontView.search.matchCase"
area = "font-view"
milestone = "M4"
summary = "Search ignores letter case unless Match Case is on. With it on, Oslash finds Oslash and Oslashacute but not oslash; matching is by substring."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"

[[behavior]]
id = "fontView.search.regex"
area = "font-view"
milestone = "M4"
summary = "With Regex on the term is a regular expression that must match the whole glyph name: one dot finds one-character names, two dots two-character names, a pattern ending in an escaped .sc finds small caps, and a bracketed A or a followed by anything and -cy finds Cyrillic names starting with A or a."
ref = "Font View › Filtering Font View › Search Field"
status = "handbook"
guesses = [
  "With Regex on, the pattern must match a whole field (name, hex code point or note) among the fields the magnifier menu selects; the handbook's examples only show names. Settled by observation (05 question 13).",
]
observe = [
  "With Regex on search `00FE`, `00F.` and a word that stands inside a note: note which match a whole field and which part of it.",
]

[[behavior]]
