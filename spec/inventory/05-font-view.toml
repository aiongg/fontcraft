  "In Regex mode replace `(.)(.)` with `\\10`, then with `$1`: note both results.",
  "Type `a` in Find for a selection of A and a, with and without the case option: note which names change, in plain and Regex mode.",
  "Leave Find empty with Regex on and Replace `.alt`: note the result.",
]

