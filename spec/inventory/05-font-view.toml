# Source: Glyphs 4 Handbook, chapter "Font View" (https://handbook.glyphsapp.com, sections Viewing
#   Glyphs, Managing the Glyph Set, Glyph Properties, Names & Unicode, Batch-Processing, Filtering
#   Font View, Glyph Order, Images).
# Supporting sources (permissive licences, read for facts about the glyph database):
#   refs/GlyphsInfo (MIT until 2024-11-22, BSD-3-Clause after; its README carries the Adobe Glyph List's BSD-3-Clause notice): README.md,
#     the GlyphData.xml DTD and attribute vocabulary,
#     "Convert to tabbed file.py" (field list of the tabular form)
#   refs/agl-aglfn (BSD-3-Clause): README.md, glyphlist.txt / aglfn.txt record formats
#   refs/fontc glyphs-reader/src/glyphdata.rs (Apache-2.0): name -> category / production-name rules
#   refs/GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv3.md: the per-glyph keys stored in a source
# Date: 2026-10-07
# Behaviour notes: docs/spec/05-font-view.md
#
# Commands that belong to other chapters (Edit > Copy/Paste/Select All, the Path menu, most of the
# Glyph menu) are NOT redefined here; their Font View semantics are [[behavior]] rows that name the
# command id they refine.

# ───────────────────────────── View: window, grid, list ─────────────────────────────

[[command]]
id = "fontView.show"
label = "Show Font View"
menu = []
shortcut = "Cmd+Alt+1"
kind = "ui"
params = "{}"
area = "font-view"
milestone = "M4"
summary = "Switches the font window to the Font View tab, which is always the leftmost tab. It is also the tab a newly created document opens on. Font View always occupies the first tab of a window."
ref = "Font View › (introduction)"
status = "handbook"

[[command]]
id = "fontView.setViewMode"
label = "Grid View / List View"
menu = []
shortcut = ""
kind = "ui"
params = "{mode: \"grid\" | \"list\"}"
area = "font-view"
milestone = "M4"
summary = "Switches Font View between the cell grid and the property table. Bound to the two buttons at the top left of the font window. Whether selection and filters carry over is not stated."
ref = "Font View › Viewing Glyphs"
status = "handbook"
guesses = [
  "The selection, the sidebar entries, the search and the sort carry over when the mode changes. Settled by observation.",
]

[[command]]
id = "fontView.setCellSize"
label = "Cell Size"
menu = []
shortcut = ""
kind = "ui"
params = "{size: number}"
area = "font-view"
milestone = "M4"
summary = "Sets the grid cell size (the slider at the bottom right). Below a size threshold cells show the outline only; above it they also show the name and the Unicode marker."
ref = "Font View › Grid View"
status = "handbook"
guesses = [
  "Cells run from 16 to 512 points on a logarithmic slider, 64 by default. Settled by observation.",
]

[[command]]
id = "fontView.sortByColumn"
label = "Sort by Column"
menu = []
shortcut = ""
kind = "ui"
params = "{column: string, ascending?: bool}"
area = "font-view"
milestone = "M4"
summary = "Sorts the List View rows by one column. Clicking the same header a second time reverses the direction; sorting by the ID column restores glyph order."
ref = "Font View › List View"
status = "handbook"
guesses = [
  "Glyphs without a value in the sort column go last in both directions, and ties keep glyph order. Settled by observation.",
  "The sort belongs to the Font View tab and is not saved with the document. Settled by observation.",
]

[[command]]
id = "fontView.setColumns"
label = "Show / Hide / Reorder Columns"
menu = []
shortcut = ""
kind = "ui"
params = "{visible?: [column], order?: [column]}"
area = "font-view"
milestone = "M4"
summary = "Chooses which List View columns are shown and in what order. In the UI, columns are reordered by dragging a header and toggled from the header context menu (Ctrl-click or right-click)."
ref = "Font View › List View"
status = "handbook"
guesses = [
  "At least one column stays shown; the header's context menu lists every column with a check mark. Settled by observation.",
]

[[command]]
id = "fontView.toggleInspector"
label = "Show / Hide Glyph Inspector"
menu = []
shortcut = ""
kind = "ui"
params = "{visible?: bool}"
area = "font-view"
milestone = "M4"
summary = "Opens or closes the glyph inspector at the bottom left of Font View (the disclosure button)."
ref = "Font View › Glyph Properties"
status = "handbook"
guesses = [
  "The inspector is shown when a document opens. Settled by observation.",
]

[[command]]
id = "fontView.toggleInspectorDetails"
label = "Show / Hide Extra Glyph Properties"
menu = []
shortcut = ""
kind = "ui"
params = "{expanded?: bool}"
area = "font-view"
milestone = "M4"
summary = "Expands or collapses the extra inspector rows for production name, script, category and subcategory (the chevron beside the Unicode field)."
ref = "Font View › Glyph Properties"
status = "handbook"
guesses = [
  "The extra rows start collapsed. Settled by observation.",
]

[[command]]
id = "fontView.toggleMetricsOrientation"
label = "Horizontal / Vertical Metrics"
menu = []
shortcut = ""
kind = "ui"
params = "{orientation?: \"horizontal\" | \"vertical\"}"
area = "spacing-kerning"
milestone = "M5"
summary = "Switches the inspector's metric fields between the horizontal set (LSB, RSB, width) and the vertical set (TSB, BSB, vertical origin, vertical width). Bound to the icon between the fields."
ref = "Font View › Glyph Properties › Metrics"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The orientation is a panel setting kept across documents and sessions, not stored per font; watching the reference app reopen a file would settle it.",
  "The switch shows the icon of the set on show (left to right, or top to bottom); a screenshot of the reference inspector would settle it.",
]

[[command]]
id = "fontView.setSelection"
label = "Set Glyph Selection"
menu = []
shortcut = ""
kind = "ui"
params = "{glyphs: [names], mode?: \"replace\" | \"add\" | \"remove\"}"
area = "font-view"
milestone = "M4"
summary = "Our headless equivalent of clicking cells: sets the Font View glyph selection by name. Every batch command without explicit targets acts on this selection."
ref = "Font View › Batch-Processing › Selecting Glyphs"
status = "inferred"
own = true

[[command]]
id = "fontView.getState"
label = "Get Font View State"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "font-view"
milestone = "M4"
summary = "Our query for agents: returns view mode, cell size, sort column, selected sidebar entries, search query and options, the selected glyph names, the visible glyph names in display order, and the three counts shown in the status area."
ref = "Font View › Filtering Font View"
status = "inferred"
guesses = [
  "Our own query for agents; there is no reference behaviour to settle.",
]

# ───────────────────────────── Adding, duplicating, removing glyphs ─────────────────────────────

[[command]]
id = "glyph.addGlyphs"
label = "Add Glyphs…"
menu = ["Glyph"]
shortcut = "Cmd+Shift+G"
kind = "engine"
params = "{text: string, onExisting?: \"ask\" | \"replace\" | \"keep\" | \"cancel\" (default keep)} → {added, replaced, existing, skipped: [{item, reason}]}"
area = "font-view"
milestone = "M4"
summary = "Opens a dialog with one text field and adds a glyph for every item, items separated by spaces, line breaks or tabs: a glyph name, a literal character, a uniXXXX / uXXXXX value, a colon range, or a glyph recipe. Items given as a character, a Unicode name or a legacy name are converted to the database nice name; names already in the font trigger the Replace / Keep Existing / Cancel dialog."
ref = "Font View › Adding New Glyphs › Adding Multiple Glyphs; tutorial \"Adding glyphs to your font\" (glyphsapp.com/learn)"
status = "handbook"
notes = "Separators and the conversion of legacy names (uni0421, dotlessi) come from the tutorial, checked in the M4 planning pass. Recipe items (component=glyph, base+mark=glyph) are built with M6, which owns components and anchors; until then they are listed in the result's `skipped` (the owner's decision, docs/plans/M4.md § 7 question 7). Documented, not yet observed. The text parser is `crates/glyphdata/src/items.rs`; its limits make hostile text an error with a message: at most 512 KB of text, 65,535 items, 65,536 code points spanned by one range and 65,535 glyphs asked for."
guesses = [
  "A comma is not a separator: an item containing one is an invalid name and is reported. Settled by observation (05 question 7).",
  "A range covers every code point from the first endpoint's to the second's; code points Unicode does not assign, and surrogates, are skipped, and one range holds at most 65,536 code points. Settled by observation (05 question 7).",
  "An invalid item is reported in `skipped` and the valid items are still added. Settled by observation.",
  "Replace puts a fresh empty glyph with database properties in the old glyph's place in the glyph order; kerning and other references by name stay. Settled by observation (05 question 8).",
  "A range whose second endpoint comes before its first is reported in `skipped`, not reversed. Settled by observation.",
  "With Use Custom Naming on, a typed character and the code points of a range are named uniXXXX or uXXXXX, as typed code-point names are kept. Settled by observing a font with the option on.",
  "New glyphs that land between the same two existing glyphs are in sort-key order; the glyphs already in the font are never moved. Settled by observation (05 question 2).",
  "Headless calls default to Keep Existing (05-font-view.md § 3.1); the dialog first calls with ask, which changes nothing when a name exists and returns the existing names. Our design; nothing to settle.",
]

[[command]]
id = "glyph.newGlyph"
label = "New Glyph"
menu = ["Glyph"]
shortcut = "Cmd+Alt+Shift+N"
kind = "engine"
params = "{name?: string}"
area = "font-view"
milestone = "M4"
summary = "Adds one empty glyph called newGlyph. The plus button at the bottom left of Font View runs the same command. The source does not say what name is used when newGlyph already exists."
ref = "Font View › Adding New Glyphs › Adding a Single Glyph"
status = "handbook"
notes = "The tutorial \"Adding glyphs to your font\" (glyphsapp.com/learn) adds that the new glyph's name is selected for typing, and that a typed legacy name or character becomes the nice name on Return; the shell's inline rename runs glyph.rename. Documented, not yet observed."
guesses = [
  "When newGlyph is taken the new glyph is named newGlyph.001, newGlyph.002 and so on, the rule documented for duplicated and pasted glyphs. Settled by observation (05 question 6).",
]

[[command]]
id = "glyph.duplicateGlyph"
label = "Duplicate Glyph"
menu = ["Glyph"]
shortcut = "Cmd+D"
kind = "engine"
params = "{glyphs: [names], suffix?: string} → {glyphs: [copies], copies: [{glyph, copy}]}"
area = "font-view"
milestone = "M4"
summary = "Makes a copy of every selected glyph in the same font, named with the first free three-digit suffix (A.001, then A.002 when A.001 is taken). The copies become the selection."
ref = "Font View › Batch-Processing › Batch Commands; tutorial \"Adding glyphs to your font\" (glyphsapp.com/learn)"
status = "handbook"
notes = "The naming rule and the new selection come from the tutorial, checked in the M4 planning pass (05 question 6). Documented, not yet observed."
guesses = [
  "Each copy is placed directly after its original in the glyph order. Settled by observation.",
  "A copy of a suffixed glyph gets one more suffix (A.ss01 gives A.ss01.001). Settled by observation.",
  "The copy keeps everything but the code points, so the original stays the glyph for its characters. Settled by observation.",
  "The `suffix` parameter names the copy A.<suffix> (A.<suffix>.001 when taken), for scripts that want a feature suffix in one step. Our addition; nothing to settle.",
]

[[command]]
id = "glyph.removeGlyph"
label = "Remove Glyph"
menu = ["Glyph"]
shortcut = "Cmd+Delete"
kind = "engine"
params = "{glyphs: [names], components?: \"remove\" | \"decompose\", metricsKeys?: \"dissolve\" | \"keep\", confirm?: bool} → {removed, usedAsComponent, metricsKeys, needs}"
area = "font-view"
milestone = "M4"
summary = "Deletes the selected glyphs after a confirmation dialog (Remove / Cancel). Applies to glyphs selected in Font View, to the glyph being edited in Edit View and to a Text-tool selection; the minus button at the bottom left of Font View does the same. Follow-up choices cover glyphs used as components and metrics keys that point at a deleted glyph."
ref = "Font View › Deleting Glyphs"
status = "handbook"
notes = "The answers are parameters: without a needed `components` or `metricsKeys` answer the command refuses and names it; `confirm: false` changes nothing and returns what the dialog asks about (removeGlyph.confirm). Kerning pairs that name a removed glyph stay, as obsolete pairs until Clean Up removes them (kerning.obsoletePairs). Group membership leaves with the glyph. Documented, not yet observed."
guesses = [
  "Decompose replaces each component of a removed glyph with that glyph's shapes from the matching layer; components inside it that point at glyphs that stay remain components. Settled by observation.",
  "A metrics key points at a glyph when its formula starts with that glyph's name (=H, =|H, =O-4); the longest leading name that is a glyph wins, since names may contain hyphens. Settled by observation.",
]

[[command]]
id = "glyph.updateGlyphInfo"
label = "Update Glyph Info"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names]}"
area = "font-view"
milestone = "M4"
summary = "Batch command on the selected glyphs: re-derives each glyph's properties from the glyph database (built-in and custom), its name included. A legacy, production or alternative name (uni0416, ostroke) becomes the database nice name, and the Unicode values follow the name."
ref = "Font Info › Other Settings › Use Custom Naming; Font View › Batch-Processing › Batch Commands; tutorial \"Getting your glyph names right\" (glyphsapp.com/learn)"
status = "handbook"
notes = "Checked against written sources in the M4 planning pass (it was a `memory` row). The handbook (Use Custom Naming) says the command updates the properties of the selected glyphs, the glyph name included. The tutorial says it synchronises names and Unicode values with the built-in database and respects custom glyph data; the tutorial \"Roll your own glyph data\" says legacy alternative names are updated to the nice name. Documented, not yet observed."
guesses = [
  "Stored overrides of category, subcategory, script, production name, case and direction are dropped, so those properties follow the database again; the sort name, tags, colour labels, note and export flag stay. Settled by observing a glyph with a custom category before and after the command (05 question 5).",
  "With Use Custom Naming on, names are kept and only the other properties are updated. Settled by observation.",
  "A rename the command makes goes through glyph.rename, so references follow it; a new name that is already taken (by any glyph of the font before the command, or by an earlier glyph of the batch) leaves the glyph's name and Unicode values unchanged and is reported. Settled by observation.",
  "The Unicode values follow the name whether or not it changed: the glyph data's code point for it, none for a name it knows without one (A.alt), and the stored values for a name it does not know. Settled by observation.",
]

[[command]]
id = "window.glyphInfo"
label = "Glyph Info"
menu = ["Window"]
shortcut = ""
kind = "ui"
params = "{open?: bool, query?: string, sortBy?: string, select?: [names]} → {open, query, sortBy, count, selected}"
area = "font-view"
milestone = "M4"
summary = "Opens the Glyph Info window: a searchable, sortable table of every entry in the glyph database."
ref = "Font View › Names & Unicode › Glyph Info Database"
status = "handbook"
notes = "The tutorial \"Adding glyphs to your font\" (glyphsapp.com/learn) lists the columns: glyph name, Unicode value, category, subcategory, script and composition. Multiple rows are selected with Shift or Cmd. The composition column is left out until M6 provides decomposition data. Documented, not yet observed. FontCraft: crates/ui-egui/src/shell/glyph_info.rs; the table shows what glyphData.search returns for the search field and the sorted column, so the window and the headless query agree. Add to Font runs glyphInfo.addToFont with the selected names."
guesses = [
  "The table adds a Description column (ours). Settled by observing the window.",
  "With an empty search field the table lists the whole database in the sorted order, up to the search's limit of 10,000 rows (the CJK ideographs past it are reached by searching). Settled by observing the window when it opens.",
  "Sorting is ascending only; a second click on the sorted header keeps the order. Settled by observing a second header click.",
  "Shift+click selects the rows from the last clicked one; Cmd+click adds or removes one row. Settled by observing the window.",
]

[[command]]
id = "glyphInfo.addToFont"
label = "Add to Font"
menu = []
shortcut = ""
kind = "engine"
params = "{names: [names]}"
area = "font-view"
milestone = "M4"
summary = "Adds the database entries selected in the Glyph Info window to the current font as new glyphs (the Add to Font button)."
ref = "Font View › Adding New Glyphs › Adding From the Glyph Info Database"
status = "handbook"
guesses = [
  "Names the font already has are left as they are and listed in `existing`; no Replace question is asked. Settled by observation.",
]

[[command]]
id = "fontView.listMissingGlyphs"
label = "Show Missing Glyphs"
menu = []
shortcut = ""
kind = "engine"
params = "{entry: string}"
area = "font-view"
milestone = "M4"
summary = "For a sidebar entry that knows its full glyph set (a subcategory, language, script or list filter), returns the glyph names it expects that the font does not contain. In the UI this is the list opened by Ctrl-click or right-click on the entry."
ref = "Font View › Adding New Glyphs › Adding From the Sidebar"
status = "handbook"
notes = "List filters, Groups*.plist `list` entries, scripts and languages know their set; a script expects the union of its languages. Categories know theirs through the languages of the listed scripts (see guesses). An entry without a known set (All, a smart filter, a Groups*.plist script or predicate entry) is refused with a message."
guesses = [
  "A Categories entry expects the glyphs that the languages of the listed scripts need and that the glyph data puts in that category, subcategory or case group; without language data it has no expected set. Settled by observing the badge of a category in a font with one language list shown.",
]

[[command]]
id = "fontView.generateMissingGlyphs"
label = "Generate"
menu = []
shortcut = ""
kind = "engine"
params = "{entry: string, glyphs?: [names]}"
area = "font-view"
milestone = "M4"
summary = "Adds the glyphs chosen in the missing-glyphs list of a sidebar entry to the font (the Generate button). Without `glyphs`, adds every missing glyph of the entry, matching Cmd+A followed by Generate."
ref = "Font View › Adding New Glyphs › Adding From the Sidebar"
status = "handbook"
guesses = [
  "Generated glyphs are empty, as wide as the Default Layer Width parameter or the built-in width makes a new glyph (as New Glyph), take the code point the entry gives or the glyph data gives their name, and are placed by the default sort key; all of them are one undo step. Settled by observing Generate on a list filter.",
]

[[command]]
id = "edit.pasteSpecial"
label = "Paste Special"
menu = ["Edit"]
shortcut = "Cmd+Alt+V"
kind = "engine"
params = "{json | text: string, mode: \"sameName\" | \"selected\" | \"asComponents\", parts?: [\"all\" | \"activeLayer\" | \"kerningGroups\" | \"metricsKeys\" | \"lsb\" | \"rsb\" | \"width\"], allMasters?: bool, targets?: [names], master?: id} → {mode, glyphs, added, skipped}"
area = "font-view"
milestone = "M4"
summary = "Pastes copied glyphs over existing ones through a dialog with three modes (Glyphs With Same Name, Selected Glyphs, As Components) and, for the first two, a choice of which parts of each glyph to transfer. The menu item appears in place of Paste while Option is held."
ref = "Font View › Copying Glyphs Between Files"
status = "handbook"
guesses = [
  "Selected Glyphs pairs the copied glyphs, in copy order, with the selected targets in glyph order. Settled by observation (05 question 18).",
  "Content of Active Layer writes into the target's layer for the master Font View shows. Settled by observation (05 question 18).",
  "Copied masters are matched to the target's by id, then by name, then by position; layers of an unmatched master are not pasted. Settled by pasting between fonts with different masters.",
  "All Data keeps the target's name and code points. Settled by observation.",
  "In Edit View's text mode Paste Special (menu item or the paste key with Option) is refused with a message instead of typing the clipboard's text; the Edit menu of the running reference app in text mode settles it.",
  "LSB moves the outline and keeps the right side bearing; RSB sets the width from the outline's right edge. Settled by observation.",
  "As Components adds each component at the origin, after the shapes already there, and leaves out a component that would make a glyph refer to itself. Settled by observation.",
]
notes = "The shell's Paste Special (Cmd+Alt+V, Edit › Paste Special) opens dialog.pasteSpecial on the copied glyphs on the system clipboard."

