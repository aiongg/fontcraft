status = "inferred"
notes = "The database behind it is crates/glyphdata (M4.1): GlyphData::lookup returns every field with its source (custom, database, synthesised, default); the command returns them as JSON (M4.3). `cargo xtask glyphdata --check` agrees with fontc's glyphs-reader 1.0.0 on every name of its set and with glyphsLib 6.15.0 apart from the causes in crates/glyphdata/crosscheck/allow.toml."
guesses = [
  "Our own query for agents; its answers must equal what the reference shows in Glyph Info and the inspector for the same name, which the oracles' copies of the data (fontc, glyphsLib) check.",
  "A ligature without a record takes the script that all its known parts share, and no case. Settled by observation.",
]

