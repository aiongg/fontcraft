# Inventory: interpolation, masters, instances, special layers, variable fonts, multi-font work.
# Source: Glyphs 4 Handbook, chapter "Interpolation" (public web handbook,
#         https://handbook.glyphsapp.com/interpolation/), read from the scratch conversion
#         handbook/10-interpolation.txt. Cross-checked for labels only against the chapters
#         "Font Info", "Feature Code" and "Appendix › Custom Parameters" of the same handbook.
# Terminology cross-checks (permissive): fonttools Doc/source/designspaceLib/xml.rst,
#         Lib/fontTools/varLib/__init__.py and models.py; GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv4.md;
#         fontc glyphs-reader / glyphs2fontir (bracket layers, axis mapping precedence).
# Date: 2026-10-07
#
# Notes for whoever merges the inventory:
# - Commands whose home is another chapter are NOT repeated here, to keep ids unique across
#   files. This chapter relies on: font.axes.add / set / remove / list / listPredefined,
#   font.master.add / addFromOtherFont / setAxisLocation, font.instance.add / addForEachMaster /
#   addVariableFontSetting / toMaster / setAxisLocation (06-font-info.toml);
#   path.correctPathDirection, path.correctPathDirectionForAllMasters, filter.shapeOrder
#   (03a-edit-view-drawing.toml); layers.addBackupLayer, layers.toggleVisibility (04-palette.toml).
# - The nine [[parameter]] rows at the end were requested for this file although the appendix
#   inventory (18-custom-parameters.toml) holds rows with the same names. Merge, do not keep
#   both; the rows here carry the scope the Interpolation chapter states.
# - Rows with status "inferred" are FontCraft design (headless equivalents of UI gestures, or
#   queries an agent needs); rows with status "memory" are recalled from the reference app and
#   are not stated in the handbook chapter.

# ───────────────────────────────────────────────────────────────────────────────
# Axes (Font Info › Font › Axes)
# ───────────────────────────────────────────────────────────────────────────────

[[command]]
id = "font.axes.reorder"
label = "Reorder Axes"
menu = []
shortcut = ""
kind = "engine"
params = "{order: [index|tag]}"
area = "interpolation"
milestone = "M9"
summary = "Changes the axis order. Order matters because intermediate-layer coordinates and alternate-layer ranges are shown and stored in axis order, so the command must permute those lists too. Not described in the chapter."
ref = "Interpolation › Setting up Axes"
status = "inferred"
guesses = [
  "Reordering permutes every master, instance, virtual master and special-layer coordinate list with the axes, so no location changes; settle by dragging axes in the reference app's Font Info, if it allows it.",
  "The entries of Axis Location, Virtual Master and Axis Mappings are put in the new axis order too; settle by reordering axes in a font with those parameters in the reference app and saving.",
  "`order` takes axis indexes as well as tags, so a font with two axes of one tag can be reordered; Font Info sends indexes. A tag two axes share is refused.",
]
observe = [
  "In F2 (special layers) with two axes, try to reorder the axes: note whether a drag or a button does it, and how the layer labels read afterwards.",
]

[[behavior]]
id = "axes.definition"
area = "interpolation"
milestone = "M9"
summary = "An axis names one aspect of the design that varies between masters. A font has zero or more axes; one axis is a line, two a plane, three or more a higher-dimensional designspace, any point of which can become an instance."
ref = "Interpolation › (introduction)"
status = "handbook"

[[behavior]]
id = "axes.tagRules"
area = "interpolation"
milestone = "M9"
summary = "Axis tags are four characters. Registered axes use their registered tag; a private axis takes any name and a tag of four capital letters so it cannot clash with a tag registered later."
ref = "Interpolation › Setting up Axes"
status = "handbook"
guesses = [
  "A tag of fewer than four printable ASCII characters is padded with spaces and a longer one exports its first four; settle by typing a three- and a five-character tag in the reference app's axis dialog and exporting.",
  "Font Info › Font shows under each axis the warnings font.axes.list gives for its tag (not registered and not four capital letters, shorter than four characters, shared with another axis); typing `swln` as a tag in the reference app settles whether it says anything.",
]
observe = [
  "In any font, give an axis the tag `swln` in Font Info › Font: note any hint or warning the app shows.",
]

[[behavior]]
id = "axes.coordinatesAreFreeNumbers"
area = "interpolation"
milestone = "M9"
summary = "Internal axis coordinates are arbitrary numbers chosen by the designer, not tied to OpenType ranges. Typical choices: the stem width for Weight (e.g. 45 for Light, 160 for Bold), 0–100 for an abstract axis such as Serif or a smoothly slanting Italic, and 0–1 for an axis whose outlines flip rather than blend."
ref = "Interpolation › Setting up Masters › Axes Coordinates"
status = "handbook"

[[behavior]]
id = "axes.linearSpread"
area = "interpolation"
milestone = "M9"
summary = "Between two masters, internal coordinates are distributed linearly: a location halfway between two master coordinates yields the halfway shape. Non-linear user-facing ranges are produced only by axis mappings and only in variable fonts."
ref = "Interpolation › Setting up Masters › Axes Coordinates"
status = "handbook"

[[behavior]]
id = "axes.internalVersusExternal"
area = "interpolation"
milestone = "M9"
summary = "Two coordinate systems exist per axis. Internal coordinates are the values typed into master, instance and special-layer coordinate fields; external coordinates are what a variable font exposes to its user. Without Axis Location or Axis Mappings the two are identical."
ref = "Interpolation › Variable Font Options › Axis Location; Axis Mappings"
status = "handbook"

[[behavior]]
id = "axes.unusedAxesDropped"
area = "compile"
milestone = "M9"
summary = "When masters are disabled for a variable-font export, any axis on which the remaining masters all share one coordinate is left out of the exported font."
ref = "Interpolation › Setting up Instances › Subsetting the Designspace"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "An axis is dropped only when Disable Masters removes a master, and an axis a virtual master still varies is kept; settle by exporting F1 with a third axis all masters share, without Disable Masters, and again with a virtual master on that axis.",
]

# ───────────────────────────────────────────────────────────────────────────────
# Masters (Font Info › Masters)
# ───────────────────────────────────────────────────────────────────────────────

[[behavior]]
id = "masters.mustCoverDesignspace"
area = "interpolation"
milestone = "M9"
summary = "Masters should be placed so that the wanted region of the designspace lies between them. One axis needs two masters (e.g. Light 300, Bold 700); a third in between (Regular 400) refines the transition."
ref = "Interpolation › Setting up Masters › Axes Coordinates"
status = "handbook"

[[behavior]]
id = "masters.minimalSetup"
area = "interpolation"
milestone = "M9"
summary = "The smallest valid setup is one origin master plus one master per axis, where each non-origin master differs from the origin on exactly one axis. Take Weight and Width with three masters, Thin Narrow (200, 60), Thin (200, 100) and Black (900, 100): Thin can serve as origin, whereas Black cannot, since it lies away from Thin Narrow on both axes."
ref = "Interpolation › Setting up Masters › Minimal Multiple Masters Setup"
status = "handbook"

[[behavior]]
id = "masters.originAutomaticForStatic"
area = "interpolation"
milestone = "M9"
summary = "The origin master is a designer's choice only for variable fonts. When interpolating static instances the engine determines a suitable origin by itself."
ref = "Interpolation › Setting up Masters › Minimal Multiple Masters Setup"
status = "handbook"
guesses = [
  "Static instances use the same variation model as the variable font, anchored at the variable origin; the result does not depend on the origin for the variable model. Settle by comparing instances of an irregular two-axis setup in the reference app (docs/plans/M9.md § 8).",
]
observe = [
  "In F3 (irregular two axes), export the instance at (650, 60) with Font Type Default, then Variable: note whether the outlines differ, which shows whether a static export picks its origin automatically.",
]

[[behavior]]
id = "masters.cornerAndIntermediateSetups"
area = "interpolation"
milestone = "M9"
summary = "A minimal setup reaches the whole designspace but gives no direct control where two axes are both away from the origin (e.g. Bold Condensed). Adding masters at every corner, and further masters inside the space (e.g. a 3 × 3 grid of weights and widths), gives that control; the model must accept any number of masters at arbitrary positions."
ref = "Interpolation › Setting up Masters › Elaborate Multiple Masters Setups"
status = "handbook"

[[behavior]]
id = "masters.namingAndIcon"
area = "font-info"
milestone = "M7"
summary = "Each master has a free name (Light, Regular Condensed, Bold Caption…) and an icon chosen to represent it; both are organisational only."
ref = "Interpolation › Setting up Masters"
status = "handbook"
notes = "Documented, not yet observed. M7 plan § 4: M7.5."

[[behavior]]
id = "masters.metricsInterpolate"
area = "interpolation"
milestone = "M9"
summary = "Besides outlines, per-master data must interpolate between masters: advance widths, anchors, component placement, vertical metrics, kerning, and stems and number values matched by name. The chapter only says an instance has outlines and metrics; the name-matching rule for stems and numbers is in the Font Info chapter, and the rest of the list is our reading of what an instance needs."
ref = "Interpolation › Working with Multiple Fonts; Font Info › Masters"
status = "inferred"
notes = "In variable fonts, kerning and anchors vary through GPOS device deltas (M9.9, `compile.instanceLayoutInterpolation`); a master linked with Link Metrics With Master takes the kerning of the master it names."

# ───────────────────────────────────────────────────────────────────────────────
# Instances and variable font settings (Font Info › Exports)
# ───────────────────────────────────────────────────────────────────────────────

[[command]]
id = "file.generateInstances"
label = "Generate Instances"
menu = ["File"]
shortcut = ""
kind = "engine"
params = "{instances?: [id|name|index], open?: bool, destination?: path}"
area = "interpolation"
milestone = "M9"
summary = "Interpolates the instances of the current document, turns each into a master and creates new source documents from them, so each instance can be edited as ordinary outlines. The chapter says a file per instance in one sentence and a new file holding those masters in the next; which it is must be observed."
ref = "Interpolation › Working with Multiple Fonts › Glyphs Files, Masters, & Instances"
status = "handbook"
notes = "Documented, not yet observed. Every instance is interpolated before any document opens or any file is written."
guesses = [
  "Without a list, every active static instance is generated; settle with an inactive instance in F1 in the reference app.",
  "The new document keeps the instance as its only export, without the parameters only interpolation reads, and saved files are named Family-Style; settle by running the command in the reference app.",
  "One new document per instance, as the Several Fonts section of the handbook says (a file per instance), holding one master with the instance's outlines, metrics, kerning and features and no special layers; settle by running the command in the reference app.",
]
observe = [
  "In F1 (two masters), choose File › Generate Instances: count the documents made and look in them for special layers, kerning and feature code.",
]

[[command]]
id = "interpolation.interpolateGlyph"
label = "Interpolate Glyph at Location"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, location: {tag: number}, coordinates?: internal|external, model?: default|variable}"
area = "interpolation"
milestone = "M9"
summary = "Query: returns the interpolated layer (shapes, anchors, width) of one glyph at an arbitrary location, applying intermediate layers, alternate-layer switching and the nodes' higher-order interpolation curves as an export would. Fails with a compatibility report when the contributing layers are incompatible."
ref = "Interpolation › Setting up Instances"
status = "inferred"
guesses = [
  "`coordinates: external` converts the location through Axis Location and Axis Mappings first; the default is internal, as the coordinate fields of the reference take internal values.",
  "Axes the location leaves out take the origin master's coordinate, and `model` defaults to the font's Font Type setting; settle by comparing with the reference's preview of an instance that sets only one of two axes.",
]

[[command]]
id = "interpolation.describeDesignspace"
label = "Describe Designspace"
menu = []
shortcut = ""
kind = "engine"
params = "{variableFontSetting?: id|name}"
area = "interpolation"
milestone = "M9"
summary = "Query: returns axes with internal and external ranges, masters and virtual masters with locations, the origin master, instances with an inside/extrapolated flag, mappings, and the glyphs carrying intermediate or alternate layers."
ref = "Interpolation › Setting up Axes; Setting up Masters; Setting up Instances"
status = "inferred"
guesses = [
  "A query of ours: one reply with axes (internal and external ranges, mapping), masters, virtual masters, the origin, instances with an extrapolated flag and the glyphs with special layers; the reference app spreads these facts over Font Info and the glyph windows.",
]

[[behavior]]
id = "instances.multiAxisCoordinates"
area = "interpolation"
milestone = "M9"
summary = "An instance holds one coordinate per axis, so a Weight × Width font can define styles such as Thin Condensed or Bold Expanded at any combination."
ref = "Interpolation › Interpolation Applications"
status = "handbook"

[[behavior]]
id = "instances.extrapolatedExcludedFromVariable"
area = "compile"
milestone = "M9"
summary = "Static instances inside the designspace are written into a variable font as named instances; an instance whose location is outside the designspace is skipped."
ref = "Interpolation › Setting up Instances › Static Instances"
status = "handbook"

[[behavior]]
id = "instances.namedInstancesInVariable"
area = "compile"
milestone = "M9"
summary = "A variable font lists the document's static instances as predefined axis settings, so a font menu can offer style names instead of raw axis values."
ref = "Interpolation › Interpolation Applications; Setting up Instances › Static Instances"
status = "handbook"
notes = "Documented, not yet observed. `var::fvar::named_instances` (M9.6) writes every exported static instance inside the axis ranges as an `fvar` named instance, named by `variableStyleNames` when set, else by its name, with its `variablePostscriptFontName` (else PostScript Font Name) as PostScript name, as fontc does."
guesses = [
  "Instances that do not export are left out of `fvar`, as the oracles do; settle by exporting F1 with one instance's export switch off and reading `fvar`.",
]

[[behavior]]
id = "instances.parametersStaticOnly"
area = "compile"
milestone = "M9"
summary = "Custom parameters on a static instance, filters included, take effect only when that instance is exported as its own file. They are ignored when the instance is merely listed inside a variable font, because all locations of a variable font must share glyph set, features and compatible outlines."
ref = "Interpolation › Setting up Instances › Static Instances"
status = "handbook"

[[behavior]]
id = "instances.weightWidthClassIndependent"
area = "font-info"
milestone = "M7"
summary = "The Weight Class and Width Class of an instance are stored separately from its axis coordinates; changing one never changes the other."
ref = "Interpolation › Setting up Instances › Static Instances"
status = "handbook"
notes = "Documented, not yet observed. fontmake writes an instance's Weight Class to usWeightClass (350 in the planning probe); fontc builds no static instance. FontCraft writes a static instance's location on the weight axis to usWeightClass, as fontmake does, and without a weight axis its Weight Class, as the handbook says; the width the same way (M7.8). M7 plan § 4: M7.7 (test that editing one leaves the other)."

[[behavior]]
id = "variableFontSetting.wholeFontParameters"
area = "compile"
milestone = "M9"
summary = "A variable font setting acts on the whole variable font, so it accepts the parameters that static instances cannot pass on: filters, glyph removal, added features. If such a parameter leaves outlines incompatible, export stops with an error."
ref = "Interpolation › Setting up Instances › Variable Font Settings"
status = "handbook"
notes = "The setting's parameters stand in for the font's of the same name, so Keep, Remove, Rename and Reencode Glyphs apply to every source. M12.101 runs its PreFilter and Filter strings on every master, the composites drawn as contours first for Filter. Intermediate layers are not filtered: a filter that changes their point structure stops the export."
guesses = [
  "A variable font runs the Filter and PreFilter parameters of its setting only, not those of the font or its masters; a font-wide Filter exported as a variable font would settle it.",
]
observe = [
  "Add Remove Glyphs and Rename Glyphs to a variable font setting, export it, and list the glyph order of the font.",
  "Add a Filter parameter to the font (not the setting), export a variable font, and note whether its outlines are filtered.",
]

[[behavior]]
id = "variableFontSetting.defaultWhenNone"
area = "compile"
milestone = "M9"
summary = "Exporting a variable font from a document without any variable font setting uses an implicit default setting. Stated in the Import & Export chapter, repeated here because the compiler must synthesise it."
ref = "Import & Export › Exporting Variable Fonts"
status = "handbook"

[[behavior]]
id = "variableFontSetting.disableMasters"
area = "compile"
milestone = "M9"
summary = "A Disable Masters parameter on a variable font setting lists master names separated by a comma and a space; those masters contribute nothing to that export, giving a variable font over a subset of the designspace."
ref = "Interpolation › Setting up Instances › Subsetting the Designspace"
status = "handbook"
notes = "Neither oracle reads Disable Masters (fontc 1.0.0, glyphsLib 6.15.0); the measure builds the oracle from a copy of the source without those masters (docs/plans/M9.md § 5). The value is read as a list of names or as one text of names separated by commas."
observe = [
  "In F1 (two masters), add Disable Masters naming Black on a variable font setting and export it: read `fvar` and note the axis range and named instances.",
]
guesses = [
  "A name that is not a master is ignored and reported as a warning instead of refusing the export; settle by naming a missing master in the reference app and exporting.",
]

[[behavior]]
id = "variableFontSetting.splitFamily"
area = "compile"
milestone = "M9"
summary = "One document may export several variable fonts (e.g. retail and reduced trial versions) through several variable font settings. A family may also be split over several documents, e.g. upright and italic, when glyph sets or features differ a lot."
ref = "Interpolation › Working with Multiple Fonts › Grouping Fonts into Families"
status = "handbook"
notes = "glyphsLib turns each variable font setting into a designspace variable font and fontmake builds one file per setting; fontc 1.0.0 builds one variable font only."

[[behavior]]
id = "family.groupingByFamilyName"
area = "font-info"
milestone = "M7"
summary = "Exported fonts are grouped by family name, taken from Font Info › Font › General › Family Name unless an instance or variable font setting overrides it with a familyNames parameter. Only the Default-language name groups fonts; localised names are display-only. Style linking provides the Bold/Italic relationships."
ref = "Interpolation › Working with Multiple Fonts › Grouping Fonts into Families"
status = "handbook"

# ───────────────────────────────────────────────────────────────────────────────
# Outline compatibility
# ───────────────────────────────────────────────────────────────────────────────
notes = "Documented, not yet observed. Only the default-language family name reaches name ID 1; a family name in another language gets a record in that language (M7.8, tested in crates/compile/src/instance_names_tests.rs)."

[[behavior]]
id = "compatibility.rules"
area = "interpolation"
milestone = "M9"
summary = "Two layers of a glyph can interpolate only when they match in: the number of paths and, per path, the order of nodes (which we read as node count plus the sequence of line and curve segments); anchors, by count and by name; components, by count and by the glyph each one references; and the order of shapes, paths and components counted together."
ref = "Interpolation › Outline Compatibility"
status = "handbook"
guesses = [
  "An open path against a closed one with the same nodes is incompatible, images are left out of the shape order, and shapes the model keeps unread match each other. Settle by opening the Master Compatibility view on such layers in the reference app.",
  "Anchors match by their set of names, in any order. Settle by giving two masters the same anchors in a different order and looking for the red indicator.",
]

[[behavior]]
id = "compatibility.editViewRedBar"
area = "interpolation"
milestone = "M9"
summary = "In Edit View a glyph whose layers are incompatible shows a red bar above its ascender line."
ref = "Interpolation › Outline Compatibility › Identifying Incompatible Outlines"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: crates/ui/src/canvas/compatibility.rs, over every glyph of the tab whose layers cannot interpolate, hidden while Enforce Compatibility Check is present and off."
guesses = [
  "The bar spans the glyph's advance a few screen points above the ascender, a few points high. Settle by measuring it in a screenshot of the reference app.",
]

[[behavior]]
id = "compatibility.smartFilterIncompatibleMasters"
area = "font-view"
milestone = "M9"
summary = "A built-in Smart Filter named Incompatible masters lists every glyph whose masters cannot interpolate. Requires a glyph predicate for master compatibility in the smart-filter engine."
ref = "Interpolation › Outline Compatibility › Identifying Incompatible Outlines"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: fontcraft_glyphquery::default_filters gives the Filters section this filter (rule Master Compatible is false) until the user changes the section; the first change stores it with the rest, so it can be renamed or removed."
guesses = [
  "The filter lists incompatible glyphs even while Enforce Compatibility Check is off, which hides only the red indicators. Settle by turning the parameter off in the reference app and selecting the filter.",
]

[[behavior]]
id = "compatibility.checkScope"
area = "interpolation"
milestone = "M9"
summary = "Compatibility is tested only between masters that are both needed to interpolate some defined instance. Adding Enforce Compatibility Check and leaving it on widens the test to all masters; adding it unchecked hides the red indicators altogether, for fonts whose masters differ on purpose such as colour fonts."
ref = "Interpolation › Outline Compatibility › Identifying Incompatible Outlines; Appendix › Custom Parameters › Enforce Compatibility Check"
status = "handbook"
guesses = [
  "Masters needed by an instance are those with a non-zero scalar at the instance's location in the variation model; variable font settings count as needing every master they do not disable. Settle by observing the indicators with an instance between two of three masters.",
  "The scope is the union of the masters of every instance that needs two or more masters, rather than the pairs each instance needs; as compatibility is an equivalence the two differ only when two groups of masters share no instance. Settle with two instances, each between a different pair of four masters, and one pair incompatible with the other.",
]
observe = [
  "In F1 (two masters) with a third master at 400 and only a Thin instance, give Black an incompatible glyph: note whether that glyph shows the red indicators.",
]

[[behavior]]
id = "compatibility.exportBlocked"
area = "compile"
milestone = "M9"
summary = "Export of interpolated static instances and of variable fonts fails while any exported glyph has incompatible layers; the error names the glyphs."
ref = "Interpolation › Outline Compatibility › Identifying Incompatible Outlines"
status = "handbook"
notes = "M2.20: a variable export stopped by incompatible layers lists each glyph with the first difference and its layer. A static export skips the instances that cannot be interpolated, naming their glyphs, and writes the others; the reference app may refuse the whole export."

[[command]]
id = "interpolation.checkCompatibility"
label = "Check Master Compatibility"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [name], masters?: [id], includeSpecialLayers?: bool, enforceAll?: bool}"
area = "interpolation"
milestone = "M9"
summary = "Query: reports per glyph whether its layers are compatible and, if not, the first mismatch per layer pair (path count, node count or segment type at path/segment index, anchor set, component count or reference, shape order), plus warnings for segments whose angle differs by more than 20° and for crossing shape correspondences. Alternate layers are compared among themselves, not with master layers."
ref = "Interpolation › Outline Compatibility"
status = "inferred"
guesses = [
  "The 20° warning measures the angle of each segment's chord from its start node to its end node; settle with the Master Compatibility view on a segment that turns by 19° and 21°.",
]
notes = "FontCraft does not yet warn about crossing shape correspondences; the command reports shape count and kind, node count, segment type, component glyph and anchor differences, and the angle warnings."
observe = [
  "In F5 (incompatible), open the glyphs whose segment turns by 19° and by 21° between masters: note the segment colours of each.",
]

[[command]]
id = "glyph.setShapeOrder"
label = "Set Shape Order"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, order: [int]} → {glyph, layer, order}"
area = "interpolation"
milestone = "M9"
summary = "Headless form of a drag in the Shape Order window: reorders the shapes (paths and components) of one layer to the given permutation of current indices. Hints on that side follow their shapes: corner components by shape index, PostScript hints and TrueType instructions by path index. Rejects lists that are not a permutation."
ref = "Interpolation › Outline Compatibility › Reordering Shapes; docs/spec/21-qa.md § 5 (fix fixCompatibility)"
status = "inferred"
notes = "The audit fix fixCompatibility names it, with path.makeNodeFirst and path.reverseContours, to give a master the contour order of the reference master. audit.fix does not call it yet: a check.variations.contourOrder result names the shapes that move but not the proposed order, so that fix is reported as not available."
guesses = [
  "A headless form of our own for the drag in the Shape Order window: it takes the whole new order of one layer and refuses anything but a permutation; watching a drag in the reference app would show whether one drag moves a single shape or swaps two.",
]

[[command]]
id = "glyph.swapShapes"
label = "Swap Shapes"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, a: int, b: int}"
area = "interpolation"
milestone = "M9"
summary = "Exchanges two shapes in the order of one non-current layer. This is what dragging the end of a connecting line onto the end of another line does in Master Compatibility view; the same gesture applies to start nodes and anchors, whose headless forms need their own parameters."
ref = "Interpolation › Outline Compatibility › Master Compatibility"
status = "inferred"
guesses = [
  "A drag that ends on no other line end changes nothing; settle by observing the drag in the Master Compatibility view.",
  "Swapping a shape with itself is refused instead of making an empty undo step; settle by dropping a line end on its own start in the Master Compatibility view.",
]
observe = [
  "In F5 (incompatible), in Show Master Compatibility, drag a line end onto empty space: note what happens to the shape order.",
]

[[panel]]
id = "window.shapeOrder"
label = "Shape Order"
location = "window"
controls = [
  "one column (or row) per layer of the current glyph, masters and special layers alike",
  "one thumbnail per shape (path or component) in its current order",
  "drag a thumbnail to change that layer's shape order",
]
area = "interpolation"
milestone = "M9"
summary = "Shows every path and component of every layer of the current glyph and lets the shapes be rearranged until all layers use the same order. The exact layout and whether it colours shapes like Master Compatibility view are not described."
ref = "Interpolation › Outline Compatibility › Reordering Shapes"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: crates/ui/src/panels/shape_order.rs, shown by window.shapeOrder. One column per master layer, each followed by its master's intermediate and alternate layers; numbered thumbnails in stacking order, each shape in a colour that follows its index over the dim layer. Dropping a thumbnail on another in the same column runs glyph.setShapeOrder for that layer. The window follows the glyph being edited unless it is opened on a named glyph. In crates/ui it is the dock panel `shapeOrder` (crates/ui/src/panels/shape_order.rs): one section per layer in the same order, each a list of rows with the thumbnail and the shape's index and kind; a row dropped between two others, or moved with the list's reorder keys, runs glyph.setShapeOrder; the tints are the Master Compatibility view's."
