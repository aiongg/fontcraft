status = "handbook"

[[behavior]]
id = "intermediateLayer.mustBeCompatible"
area = "interpolation"
milestone = "M9"
summary = "An intermediate layer takes part in interpolation like a master layer for its glyph, so it must be compatible with the layers it interpolates with and is included in the compatibility indicators. Implied by the chapter, not spelled out."
ref = "Interpolation › Intermediate Layers"
status = "inferred"
guesses = [
  "An intermediate layer is checked against every master layer of its glyph, not only its neighbours, because the variable font needs all of them compatible. Settle by observing the indicators with an incompatible intermediate layer between unrelated masters.",
]
observe = [
