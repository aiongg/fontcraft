]

[[behavior]]
id = "intermediateLayer.sparseInExport"
area = "compile"
milestone = "M9"
summary = "In a variable font an intermediate layer adds variation data only for its own glyph; static instances interpolate that glyph with the extra support point. Components that reference a glyph with intermediate layers are decomposed in variable export by default (Decompose Brace Layers, appendix)."
ref = "Interpolation › Intermediate Layers; Appendix › Custom Parameters › Decompose Brace Layers"
status = "handbook"
notes = "Observed with both oracles on a probe (fontc's `IntermediateLayer.glyphs` plus a composite of `H`): a composite whose base glyph has intermediate layers stays a composite with no variation data of its own. FontCraft keeps such composites as the oracles do, and decomposes them only when Decompose Brace Layers is on (docs/plans/M9.md § 7, question 4 (a), decided by the orchestrator on the owner's behalf); the handbook's default is to decompose them (docs/spec/40-compile.md § 4a)."

[[behavior]]
id = "virtualMaster.concept"
area = "interpolation"
milestone = "M9"
summary = "A virtual master is a designspace location declared at font level that behaves as a master but has no master layers and no kerning of its own. Only glyphs that carry an intermediate layer at that location change there; all other glyphs and all kerning are unaffected."
ref = "Interpolation › Intermediate Layers › Virtual Masters"
status = "handbook"
guesses = [
  "On an axis a virtual master does not name, it sits at the origin's coordinate; settle by adding a virtual master that names one of two axes in the reference app and reading the exported `gvar` regions.",
]

[[behavior]]
id = "virtualMaster.setupSteps"
area = "interpolation"
milestone = "M9"
summary = "To use one: add the axis (registered or private), give every real master a coordinate on it, add a Virtual Master parameter in Font Info › Font holding the virtual master's coordinates, then add intermediate layers at those coordinates to the glyphs the axis should affect."
ref = "Interpolation › Intermediate Layers › Virtual Masters"
status = "handbook"

[[behavior]]
id = "virtualMaster.extendsAxisRange"
area = "compile"
milestone = "M9"
summary = "A virtual master's coordinates count when computing each axis's range, so an axis on which all real masters share one value still gets a real extent. A variable font then stores deltas for the affected glyphs only, which keeps the file small."
ref = "Interpolation › Intermediate Layers › Virtual Masters; Appendix › Custom Parameters › Virtual Master"
status = "handbook"
notes = "Observed with fontc 1.0.0 and fontmake 3.12.1 on fontc's `glyphs3/IntermediateLayer.glyphs`: both extend the axis to the virtual masters' coordinates (CPHT 600 to 800) and give gvar data on that axis only to the glyphs with intermediate layers there."

