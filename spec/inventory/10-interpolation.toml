[[behavior]]
id = "alternateLayer.onMasterLayer"
area = "interpolation"
milestone = "M9"
summary = "A master layer can itself be given an axis range. Its counterpart is an extra layer under the same master marked Alternate with both bounds empty, shown as []; in that case the master layer holds the alternate outline while the [] layer holds the normal one. Which arrangement is used changes nothing in exported fonts."
ref = "Interpolation › Switching Shapes › Alternate Layers"
status = "handbook"
notes = "fontc reads no range on a master layer (glyphs-reader 1.0.0 clears it), so in its builds the master layer stays the normal shape and the `[]` layer becomes an alternate that covers every axis."
guesses = [
  "A master layer with a range and no `[]` partner is both the master's normal shape and its alternate shape. Settle by exporting such a font from the reference app at a location inside the range.",
  "A `[]` layer whose master layer has no range is not a source. Settle by exporting such a font from the reference app and comparing the glyph with and without the `[]` layer.",
]

[[behavior]]
id = "alternateLayer.rangeSemantics"
area = "interpolation"
milestone = "M9"
summary = "A range is a conjunction over axes of min ≤ value ≤ max in internal coordinates, a missing bound meaning the end of the axis. Both bounds are inclusive, as fontTools evaluates designspace rules for static instances and as OpenType feature variations store them."
ref = "Interpolation › Switching Shapes › Alternate Layers; Feature Code › Conditional Feature Code"
status = "inferred"
notes = "Checked in the M9 planning pass: fontTools 4.66.1 `designspaceLib.evaluateConditions` (used by ufo2ft's instantiator, hence by fontmake's static instances) keeps both bounds; fontc and glyphsLib write the rule bounds as FeatureVariations condition ranges, which are inclusive by the OpenType specification."
guesses = [
  "Both bounds inclusive, as the oracles; the handbook does not say. Settle with an instance exactly on a bound in the reference app (docs/plans/M9.md § 8).",
  "A range whose minimum is above its maximum is refused with a message naming the axis, rather than swapped or treated as empty; settle by typing a reversed range into the reference app's layer dialog and exporting.",
]
observe = [
  "In F2 (special layers), export instances at exactly 600 and at 599 and preview them: note which shows the alternate `dollar`.",
]

[[behavior]]
id = "alternateLayer.staticExport"
area = "compile"
milestone = "M9"
summary = "For a static instance, each glyph with alternate layers is interpolated from the alternate layers when the instance location lies inside their range and from the normal layers otherwise; no substitution feature is involved."
ref = "Interpolation › Switching Shapes"
status = "handbook"
notes = "Documented, not yet observed. Built in M9.4: bounds are inclusive, and at a master's location an alternate layer that applies replaces the master layer too, which makes the compiler build such an instance from the interpolated font. Agrees with fontmake on the corpus bracket sources except `manual_bracket_layer_and_component_has_one_too.glyphs`, where fontmake keeps the master layers at Black."
guesses = [
  "When several alternate sets contain the location, every one applies and the set with more bounds wins for a master both replace; settle with overlapping bracket ranges in the reference app.",
]

[[behavior]]
id = "alternateLayer.variableExport"
area = "compile"
milestone = "M9"
summary = "In a variable font, alternate layers are switched on by an OpenType feature whose substitution applies only inside the stated region (a feature variation). The feature is chosen by the Feature for Feature Variations parameter; without it a default is used (the chapter says rlig, the appendix says rvrn). Compiling the alternate outlines as extra glyphs that the feature swaps in is our implementation choice, following fontc and fonttools."
ref = "Interpolation › Switching Shapes › Alternate Layers"
status = "handbook"
notes = "Both oracles default to `rvrn` (fontc `glyphs2fontir/src/source.rs` `make_feature_variations`, glyphsLib `builder/bracket_layers.py`); fontc's comment notes the reference's own tutorial says `rlig`. FontCraft's default is `rvrn` (docs/plans/M9.md § 7, question 2 (a), decided by the orchestrator on the owner's behalf). M9.8b: `compile_variable` builds the alternate glyphs and merges the feature variations into the feature code's GSUB; the variable measure's GSUB variations, kerning and marks match both oracles on the corpus sources with alternate layers, except where a layer has axis rules with every bound empty: both oracles make such a layer an alternate set covering the whole designspace (BlankAlternateLayers, ReverseBracketLayers, ReverseBracketLayersMirror), where FontCraft reads it as the `[]` partner of a master layer with a range (`alternateLayer.onMasterLayer`)."
observe = [
  "In F2 (special layers), export the variable font with no Feature for Feature Variations parameter and read GSUB: note the feature that holds the `dollar` swap (rvrn or rlig).",
]

[[behavior]]
id = "switching.threeMethods"
area = "interpolation"
milestone = "M9"
summary = "Shapes can be switched in three ways: alternate layers (static and variable), swapping whole glyphs at export through instance parameters (static and variable font settings), and conditional substitutions in feature code (variable only)."
ref = "Interpolation › Switching Shapes"
status = "handbook"

[[behavior]]
id = "switching.renameGlyphsAtExport"
area = "compile"
milestone = "M9"
summary = "A Rename Glyphs parameter on an instance or variable font setting lists one swap per line as name=othername, e.g. cent=cent.simple; the two glyphs trade places in that export. Adding Remove Glyphs with the names that now hold the unwanted normal outlines turns the swap into a replacement."
ref = "Interpolation › Switching Shapes › Replacing Glyphs at Export"
status = "handbook"
notes = "The static half is the compiler's Rename Glyphs export filter (M7); a document made by Generate Instances keeps the parameter. Video \"How To Make an Italic Font The Easy Method | Glyphs 3 For Beginners\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=4AJrNUWGRds; it shows Glyphs 3, not Glyphs 4), 3:35–4:11 and 4:44–5:15: a Rename Glyphs parameter on an instance holds one rule per line (a=a.ss01, g=g.ss01) and the exported instance shows the alternate shapes as a and g. Not shown: Remove Glyphs."

[[behavior]]
id = "switching.conditionalSubstitution"
area = "features"
milestone = "M9"
summary = "Inside an #ifdef VARIABLE … #endif block, a line such as condition 80 < wght; followed by substitution rules confines those rules to a designspace region, compiled as feature variations. Since this exists only in variable fonts, static exports should mirror it with Rename Glyphs on the instances beyond the threshold."
ref = "Interpolation › Switching Shapes › Conditional Glyph Substitutions"
status = "handbook"

