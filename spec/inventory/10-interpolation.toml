[[tool]]
id = "higherOrderInterpolation"
label = "Higher-Order Interpolation"
shortcut = "I"
group = ""
gestures = [
  "drag a grey knob on a dotted line: bend that node's interpolation path, the knob becoming its intermediate point",
  "Return with an intermediate point selected: convert it to a pair of handles",
  "right-click a knob › Interpolation › Linear | Intermediate Point | Handles | Rotation: change the interpolation type",
  "Delete with a knob selected: return that node to linear interpolation",
  "pop-up button at the bottom right of the window: choose the axis being edited",
]
area = "interpolation"
milestone = "M13"
summary = "Edits, per node and per axis, the path a node follows between neighbouring layers: straight (default), through one intermediate point, shaped by two handles, or rotating about a centre. It requires a font with one axis or more and no fewer than two masters. The result affects static and variable export alike."
