[[command]]
id = "edit.compareFamily"
label = "Compare Family…"
menu = ["Edit"]
shortcut = ""
kind = "ui"
params = "{}"
area = "interpolation"
milestone = "M9"
summary = "Opens the Compare Family window, a table with one column per open document and one row per glyph, for checking one glyph attribute across a family kept in separate files."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "handbook"
guesses = [
  "Each column shows the document's first master; settle by opening Compare Family on documents with several masters.",
]
observe = [
  "In F7 (two documents) with two masters in each document, open Compare Family: note which master is shown and the column order.",
]

[[panel]]
id = "window.compareFamily"
label = "Compare Family"
location = "window"
controls = [
  "attribute menu at top left: Component Names | Anchors | Left Kerning Group | Right Kerning Group | Glyphs",
  "one column per open document, one row per glyph",
  "filter button: All | Missing in One | Ignore If Missing in One",
  "pin button: keep the window above all document windows",
  "Update button: reload glyph data after edits",
  "double-click a cell: open that glyph in Edit View of that document",
]
area = "interpolation"
milestone = "M9"
summary = "Shows the chosen attribute for every glyph in every open document. An empty value prints as two dashes, a glyph absent from a document as (missing glyph); with the Glyphs attribute the cell shows the glyph image, and a struck-through red ring where it is missing. The table does not refresh by itself."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "handbook"

[[command]]
id = "compareFamily.setAttribute"
label = "Compare Family: Attribute"
menu = []
shortcut = ""
kind = "ui"
params = "{attribute: componentNames|anchors|leftKerningGroup|rightKerningGroup|glyphs}"
area = "interpolation"
milestone = "M9"
summary = "Chooses which glyph attribute the Compare Family table displays."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "handbook"

[[command]]
id = "compareFamily.setFilter"
label = "Compare Family: Filter"
menu = []
shortcut = ""
kind = "ui"
params = "{filter: all|missingInOne|ignoreIfMissingInOne}"
area = "interpolation"
milestone = "M9"
summary = "Filters the rows: All shows every glyph that has relevant data, Missing in One only glyphs absent from at least one document, Ignore If Missing in One only glyphs present in all of them."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "handbook"

[[command]]
id = "compareFamily.togglePin"
label = "Compare Family: Keep on Top"
menu = []
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "interpolation"
milestone = "M9"
summary = "The pin button: keeps the Compare Family window floating above all document windows."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "handbook"

[[command]]
id = "compareFamily.update"
label = "Update"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "interpolation"
milestone = "M9"
summary = "Re-reads glyph information from all open documents into the Compare Family table after they have been edited."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "handbook"

[[command]]
id = "compareFamily.openGlyph"
label = "Open Glyph from Compare Family"
menu = []
shortcut = ""
kind = "ui"
params = "{document: path|documentId, glyph: name}"
area = "interpolation"
milestone = "M9"
summary = "Double-clicking a cell opens that glyph in an Edit View of the document the column stands for."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "handbook"

[[command]]
id = "compareFamily.report"
label = "Family Comparison Report"
menu = []
shortcut = ""
kind = "engine"
params = "{documents?: [index|title|path], attribute: componentNames|anchors|leftKerningGroup|rightKerningGroup|glyphs, filter?: all|missingInOne|ignoreIfMissingInOne, offset?: number, limit?: number}"
area = "interpolation"
milestone = "M9"
summary = "Query: returns the Compare Family table as data, with null for empty values and a missing marker for absent glyphs."
ref = "Interpolation › Working with Multiple Fonts › Compare Family"
status = "inferred"
notes = "Our own query. Columns are the documents in the order they were opened (or as listed), each read from its first master; rows are glyph names in the first document's order, then the names later documents add. `offset` and `limit` page the rows; `total` counts them all."
guesses = [
  "All lists a glyph with a non-empty value in any document; Ignore If Missing in One also requires such a value, Missing in One does not. Settle by filtering a family where a glyph absent from one document has no value in the others.",
]

