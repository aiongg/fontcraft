[[behavior]]
id = "variable.originMaster"
area = "compile"
milestone = "M9"
summary = "A variable font stores the outlines of one origin master in full and every other master as differences from it. The origin is the first master in the Masters tab unless a Variable Font Origin parameter names another."
ref = "Interpolation › Variable Font Options › Variable Font Origin"
status = "handbook"
notes = "Both oracles pick a different default when no parameter names the origin: the master named by the words all master names share (Regular when none), else the first (fontc `glyphs-reader/src/font.rs` `default_master_idx`, glyphsLib `find_base_style`). FontCraft follows the handbook's first-master rule (docs/plans/M9.md § 7, question 3 (a), decided by the orchestrator on the owner's behalf); the difference from both oracles is in docs/spec/40-compile.md § 4a, and the variable-font measure allow-lists `fvar` defaults and `glyf` where the origins differ."
observe = [
  "In F4 (three named masters), export the variable font without Variable Font Origin and read `fvar`: note whether the default is Light (the first master) or Regular.",
]

[[behavior]]
id = "variable.originIsFallback"
area = "compile"
milestone = "M9"
summary = "Software without variable-font support renders the origin master, so a regular master is the safe choice. A central origin needs more delta data than a corner master (a Thin or a Thin Narrow, say), so a corner origin gives smaller files, relevant for webfonts. The trade-off is a designer's decision; no automatic choice is made."
ref = "Interpolation › Variable Font Options › Variable Font Origin"
status = "handbook"

[[behavior]]
id = "variable.originNeedsMinimalSetup"
area = "compile"
milestone = "M9"
summary = "A variable font needs the origin master and at least one further master per variation axis, arranged as in the minimal setup rule; the compiler must report a designspace that the chosen origin cannot span."
ref = "Interpolation › Variable Font Options › Variable Font Origin"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The check asks, for each side of the origin an axis range reaches, for a master or virtual master that differs from the origin on that axis alone, and virtual masters count; settle by exporting the handbook's three-master example with Black as the origin.",
]

[[behavior]]
id = "variable.alwaysTrueTypeFlavour"
area = "compile"
milestone = "M9"
summary = "The reference exports variable fonts with TrueType outlines only. Stated in the Import & Export chapter; listed here because it decides which variation tables are produced."
ref = "Import & Export › Exporting Variable Fonts"
status = "handbook"

[[behavior]]
id = "axisLocation.perMasterRemap"
area = "compile"
milestone = "M9"
summary = "By default a variable font's axes use the internal coordinates unchanged. An Axis Location parameter on a master states, per axis, the external coordinate that master stands for (e.g. a stem-based Weight of 45 exposed as 300, within the 1–1000 range OpenType recommends). It should be present on all masters; similar recommended ranges exist for Italic, Optical Size, Slant and Width."
ref = "Interpolation › Variable Font Options › Axis Location"
status = "handbook"

[[behavior]]
id = "axisLocation.definesExternalRange"
area = "compile"
milestone = "M9"
summary = "The external range of each exported axis is the span of the masters' Axis Location values, while the internal range is the span of their Axes Coordinates. Between masters the internal-to-external relation is piecewise linear through the master pairs unless Axis Mappings says otherwise."
ref = "Interpolation › Variable Font Options › Axis Location; Appendix › Custom Parameters › Axis Mappings"
status = "handbook"
notes = "Observed with fontmake 3.12.1 on fontc's `glyphs2/AxisMappingsBeyondMasters.glyphs`: an Axis Mappings parameter that reaches beyond the masters widens `fvar` to its ends (wght 300 to 900); fontc 1.0.0 keeps the masters' span (400 to 700), and fontc's later source follows fontmake. FontCraft follows fontmake."

