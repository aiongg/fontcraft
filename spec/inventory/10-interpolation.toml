status = "handbook"
notes = "The file format stores HOI per node: GlyphsSDK's version 4 description (Apache-2.0) gives the node attribute `hoi`, keyed by axis tag and kept in the lower node of a span, holding an intermediate point (`ip`), a rotation centre and direction (`rc`, `rd`) or a Bézier timing (`tl`, `tu`, `al`, `au`). No corpus source uses it, neither oracle reads it, and no source documents how a variable font encodes it. M9 reads, keeps and writes this data so files round-trip (docs/plans/M9.md § 7, question 5 (b), decided by the orchestrator on the owner's behalf); editing it, drawing it and using it at export are M13's."

