status = "handbook"

[[behavior]]
id = "axisMappings.controlPoints"
area = "compile"
milestone = "M9"
summary = "A mapping is, per axis, a list of control points pairing an internal coordinate with an external one; values between points are interpolated linearly, and points off the diagonal make the user's slider more sensitive in some parts of the range than in others."
ref = "Interpolation › Variable Font Options › Axis Mappings"
status = "handbook"
notes = "Checked in the M9 planning pass: a `.glyphs` file stores the parameter per axis tag as a dictionary from external to internal value (Oswald: 700 to 710), and both oracles write `avar` from normalised external to normalised internal coordinates with `fvar` in external coordinates (Oswald: wght 200 to 700)."
guesses = [
  "A mapping read from a file whose internal values neither rise nor fall throughout is ignored (identity) and reported as a warning; settle by giving the reference app such a mapping and exporting.",
  "The mapping editor accepts internal values that fall throughout as the external values rise (an axis whose internal coordinate shrinks as the user value grows), and refuses a map that rises in one part and falls in another; settle by entering a falling map in the reference app's Axis Mappings dialog.",
]

[[behavior]]
