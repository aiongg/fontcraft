[[tool]]
id = "higherOrderInterpolation"
label = "Higher-Order Interpolation"
shortcut = "I"
group = ""
gestures = [
  "drag a grey knob on a dotted line: bend that node's interpolation path, the knob becoming its intermediate point",
  "Return with an intermediate point selected: convert it to a pair of handles",
  "right-click a knob › Interpolation › Linear | Intermediate Point | Handles | Rotation: change the interpolation type",
  "Delete with a knob selected: return that node to linear interpolation",
  "pop-up button at the bottom right of the window: choose the axis being edited",
]
area = "interpolation"
milestone = "M9"
summary = "Edits, per node and per axis, the path a node follows between neighbouring layers: straight (default), through one intermediate point, shaped by two handles, or rotating about a centre. It requires a font with one axis or more and no fewer than two masters. The result affects static and variable export alike."
ref = "Interpolation › Higher-Order Interpolation"
status = "handbook"
notes = "Built in M9.31 (crates/tools/src/hoi.rs; drawn by crates/ui/src/canvas/hoi). Every node of the edited layer shows its path to the next layer up and the next layer down the axis. A drag runs `hoi.setControlPoints` as one undo step; Return, Delete and the Interpolation submenu run `hoi.convertToHandles`, `hoi.removeCurve` and `hoi.setInterpolationType` on the picked knobs, once per side of the layer. The letter I is shared with the TrueType Instructor; Shift+I steps to the other. The tool can be chosen in any font, and shows nothing without an axis and two masters or while the background is edited."
guesses = [
  "A click picks a knob, Shift+click adds or removes one, and a marquee from empty canvas picks the knobs inside it; settle by picking knobs in the reference app.",
  "Return and Delete do nothing to the outline while the tool is active, whatever is picked; both Delete and Backspace remove a curve. Settle by selecting nodes, choosing the tool and pressing Delete in the reference app.",
  "Dragging one of several picked knobs moves that knob alone, and a dragged knob lands on whole units; settle by dragging one of two picked knobs in the reference app.",
  "Off-curve nodes have a path and a knob like on-curve nodes; settle by looking at a curve's handles with the tool in the reference app.",
]
observe = [
  "With the HOI tool in a two-master font, pick a knob with an intermediate point: press Return, then Delete, then Backspace, and note which of them act; then select two nodes with the Select tool, choose the HOI tool and press Delete.",
  "Draw a curve in a two-master font and look at its handles with the HOI tool: note whether they have diamonds, dotted lines and knobs.",
]

[[command]]
id = "hoi.setInterpolationType"
label = "Interpolation Type"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]], axis: tag, toward?: up|down, type: linear|intermediatePoint|handles|rotation}"
area = "interpolation"
milestone = "M9"
summary = "Sets how the given nodes travel from this layer to the next layer along the axis. Offered in the tool's Info box and in the Interpolation submenu of the context menu; linear removes any custom curve."
ref = "Interpolation › Higher-Order Interpolation › Editing Interpolation Curves"
status = "handbook"
notes = "Built in M9.30 (`crates/engine/src/cmd/hoi.rs`). Targets: `glyph`, `layer`, `points` ([shape, node] on that layer) and `axis`; `toward` (up, the default, or down) picks the span from the layer to its neighbour up or down the axis, the next layer with the same coordinates on the other axes. The curve is kept in the node of the span's lower layer, the same [shape, node] on both layers. A font with no axis or fewer than two masters is refused. Documented in the handbook, not yet observed. Linear removes the curve. Intermediate Point puts the point where the node is halfway along its present path (the midpoint of the straight line for a linear node). Handles takes the cubic equal to an intermediate point, or to the present path through its halfway position; a linear node gets the default handles (a straight line). Rotation turns about the automatic centre in the automatic direction. A node already of the type is left as it is."
observe = [
  "Choose Rotation for a knob in the reference app, save, and read whether the node's `hoi` holds `rc = auto` or coordinates.",
]
guesses = [
  "A curve belongs to the node of the lower layer of a span, so editing the span down from a layer (`toward` down) changes the layer below; settle by bending a node toward the layer below in the reference app and saving.",
  "A new intermediate point lies where the node is halfway along its present path; settle by switching a Handles node to Intermediate Point in the reference app's Info box and reading the point.",
  "Switching a rotation to Handles takes the cubic through the rotation's halfway position; settle by switching a rotation to Handles in the reference app and comparing the drawn handles.",
  "A new rotation keeps an automatic centre (`rc = auto`) rather than fixed coordinates; settle by choosing Rotation in the reference app and saving.",
]

