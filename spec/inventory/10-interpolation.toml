status = "handbook"
guesses = [
  "An empty coordinate shows the master value it inherits; settle by leaving a field empty in the reference app's popover and reading the label.",
  "Coordinates with a fraction show it, rounded to three decimals (`{90.5}`); settle by entering 90.25 and reading the label.",
