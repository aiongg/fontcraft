[[behavior]]
id = "intermediateLayer.purpose"
area = "interpolation"
milestone = "M9"
summary = "An intermediate layer is an extra support point for one glyph at one designspace location, used to correct that glyph's interpolation without adding a font-wide master (e.g. thickening the bar of e at regular weight between Thin and Black)."
ref = "Interpolation › Intermediate Layers"
status = "handbook"

[[behavior]]
id = "intermediateLayer.inheritsEmptyCoordinates"
area = "interpolation"
milestone = "M9"
summary = "For any axis without an explicit value, an intermediate layer uses the coordinate of the master layer it hangs under; hence it should be created under the master nearest to the intended location."
ref = "Interpolation › Intermediate Layers › Intermediate Layer Setup"
status = "handbook"

[[behavior]]
id = "intermediateLayer.braceLabel"
area = "layers"
milestone = "M9"
summary = "The Layers palette labels an intermediate layer with its coordinates, comma-separated in axis order inside curly braces, e.g. {110} or {65, 140}; hence the name brace layer. Special-layer labels are bold and indented under their master."
