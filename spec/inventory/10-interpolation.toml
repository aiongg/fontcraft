summary = "An alternate layer holds a different outline for a glyph together with the designspace region in which it takes over. It is the one switching method that works for both static instances and variable fonts (e.g. a cent sign whose bar shrinks to two stubs in heavy weights, or a g that trades its two-storey form for a single-storey one at narrow widths)."
