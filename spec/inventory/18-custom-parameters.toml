# Source: Glyphs 4 Handbook, chapter "Appendix", section "Custom Parameters"
#   (https://handbook.glyphsapp.com/), read from the converted chapter text 18-appendix.txt,
#   lines 686 to the end. Date: 2026-10-07.
# One [[parameter]] row per entry of that section, in the source's order: 205 entries, 205 rows.
# `name` is the file-format key exactly as the reference spells it. All other text is our own wording.
# `scope` is [] wherever the appendix entry itself does not say font, master or instance.
# Extra field `effect`: table-value | export-filter | naming | interpolation | hinting | features | ui | other.
#   Rule used: parameters in the hinting areas are "hinting" even when they set a table field;
#   name-table and name-string parameters are "naming"; whole-table on/off switches, export
#   format/destination and source-file storage switches are "other".
# Value syntaxes too long for a summary are in docs/spec/18-custom-parameters.md.

[[behavior]]
id = "customParameters.enableCheckbox"
area = "font-info"
milestone = "M7"
summary = "Each custom parameter in the Font, Masters and Exports tabs of Font Info has a checkbox left of its name; unchecking it disables the parameter without deleting it. Enabled parameters are drawn in black and disabled ones in grey."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. The model keeps a disabled flag per parameter (M1) and the compiler ignores disabled rows (M2). M7 plan § 4: M7.2 (command), M7.15 (checkbox)."
observe = [
  "In font A (m7-one), untick a custom parameter's checkbox and save: note how the row is drawn and the key written to the file.",
]

[[behavior]]
id = "customParameters.nameCaseConvention"
area = "font-info"
milestone = "M7"
summary = "Parameter names in camelCase are font-info keys defined by the UFO 3 specification and change font information; names in Title Case with spaces are specific to the reference application and usually change the font itself, for example by running a filter on the outlines."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. The catalogue records each parameter's kind and effect; nothing else depends on the case. M7 plan § 4: M7.2."

[[behavior]]
id = "customParameters.shortAndLongNames"
area = "font-info"
milestone = "M7"
summary = "UFO-derived parameter names are accepted both in the full UFO spelling and in a short form with the keyword prefix dropped, for example `description` for `openTypeNameDescription` and `blueScale` for `postscriptBlueScale`. Both spellings must be read as the same parameter."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. The compiler reads both spellings already for the names it handles (M2, crates/compile/src/info.rs); the catalogue lists every alias so the picker, `describe` and the compiler share one table. M7 plan § 4: M7.2."
guesses = [
  "A parameter added under another spelling is stored under the catalogue's spelling (the short name), and set and remove find rows of either spelling; the saved file of the observe step settles which spelling the reference app keeps.",
]
observe = [
  "In font A (m7-one), add the parameter `description`, then search the picker for `openTypeNameDescription`: note which spelling the list shows and which the saved file uses.",
]

[[parameter]]
name = "Add Class"
scope = []
kind = "string"
area = "features"
milestone = "M8"
effect = "features"
summary = "Adds an OpenType glyph class at export. The value is the class name without the leading @, then a semicolon, then the class contents."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed."

[[parameter]]
name = "Add Feature"
scope = []
kind = "string"
area = "features"
milestone = "M8"
effect = "features"
summary = "Adds an OpenType feature at export. The value is the feature tag, a semicolon, then the feature code; the new feature goes to the end of the feature list, so its position among the other features may be wrong."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed."

[[parameter]]
name = "Add Prefix"
scope = []
kind = "string"
area = "features"
milestone = "M8"
effect = "features"
summary = "Adds a feature-code prefix at export. The value is the prefix name, a semicolon, then the prefix code."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed."

[[parameter]]
name = "ascender"
scope = []
kind = "string"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Replaces the ascender for one script: the value is the lowercase script name, a colon and the height (for example `greek: 705`). Edit View uses it for glyphs belonging to that script; add the parameter once per script."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Autohint"
scope = ["instance"]
kind = "bool"
area = "hinting-ps"
milestone = "M10"
effect = "hinting"
summary = "Turns autohinting on for the instance it is set on, overriding the choice made in the export dialog. The source does not say whether this covers PostScript, TrueType or both."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Axis Location"
scope = ["master", "instance"]
kind = "list"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Gives a master or instance its external (user-facing) coordinate on each axis, separate from the internal design-space coordinate. Used when internal coordinates do not follow the value scales the OpenType spec recommends; these values also define the external range that Axis Mappings works within."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Axis Mappings"
scope = ["font", "instance"]
kind = "dict"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Builds the avar table from pairs of internal design coordinate and external user coordinate, one list per axis, editable as numbers or by dragging in a chart. The internal range comes from the master axis positions and the external range from the masters' Axis Location parameters; a mapping applies to one axis only and cannot depend on the position on another axis. The source gives no value type."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "blueFuzz"
scope = []
kind = "number"
area = "hinting-ps"
milestone = "M10"
effect = "hinting"
summary = "Integer written to the Type 1/CFF BlueFuzz entry: a horizontal stem edge within this many units outside a zone is treated as inside it. Default 1; zones must then lie at least 2 x BlueFuzz + 1 units apart, and the recommended practice is to fix the zones and set the value to 0."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "M10 planning pass: glyphsLib passes the short name blueFuzz through as a raw lib key, so fontmake ignores it; FontCraft reads it as the handbook says and writes it, a difference from fontmake recorded in docs/spec/40-compile.md § 4a by M10.14."

[[parameter]]
name = "blueScale"
scope = []
kind = "number"
area = "hinting-ps"
milestone = "M10"
effect = "hinting"
summary = "Float written to the Type 1/CFF BlueScale entry, computed as (point size at 300 dpi - 0.49) / 240; default 0.037 (overshoots appear from 40 pixels per em). The largest usable value is limited by the tallest zone: (maximum point size - 0.49) x tallest zone height must stay below 240, i.e. maximum PPM = 2.04 + 1000 / tallest zone."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "blueShift"
scope = ["font"]
kind = "number"
area = "hinting-ps"
milestone = "M10"
effect = "hinting"
summary = "Integer written to the Type 1/CFF BlueShift entry, default 7. Above the blueScale size, an overshoot inside a zone is rendered when it is at least this deep, or when it is shallower but still covers more than half a pixel."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "capHeight"
scope = []
kind = "string"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Replaces the cap height for one script: lowercase script name, colon, value (for example `armenian: 690`). Edit View uses it for glyphs of that script; add the parameter once per script."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "CJK Grid"
scope = []
kind = "number"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Integer giving both the number of rows and of columns of a dotted grid drawn while editing CJK glyphs. No grid is drawn unless this or one of the two directional variants is set; it can be limited to a script with the same prefix syntax as CJK Guide."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "CJK Grid Horizontal"
scope = []
kind = "number"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Integer number of columns of the dotted grid drawn while editing CJK glyphs. Accepts the same script prefix as CJK Guide."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "CJK Grid Vertical"
scope = []
kind = "number"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Integer number of rows of the dotted grid drawn while editing CJK glyphs. Accepts the same script prefix as CJK Guide."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "CJK Guide"
scope = []
kind = "string"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "For CJK glyphs, shows one more guide, a square marking the virtual body, inset by the given percentage (`12` means 12 percent). A script name and colon before the number limits it to that script (`han:6`); add one parameter per script."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "codePageRanges"
scope = []
kind = "list"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "List of code pages whose bits are set in OS/2.ulCodePageRange1 and ulCodePageRange2. Each listed code page is an independent flag declaring that the font works for that Windows code page."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Color Layers to COLR"
scope = []
kind = "bool"
area = "color"
milestone = "M11"
effect = "other"
summary = "When on, export writes COLR and CPAL tables from the font's colour setup, taking the layers from masters that carry a Master Color parameter."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Color Layers to SVG"
scope = []
kind = "bool"
area = "color"
milestone = "M11"
effect = "other"
summary = "When on, export writes an SVG table. Its source is the glyphs' palette colour layers or, when the file is set up as a layered font, every master carrying a Master Color parameter."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Color Palette for CPAL"
scope = ["instance"]
kind = "number"
area = "color"
milestone = "M11"
effect = "table-value"
summary = "Integer index into the Color Palettes parameter choosing which palette the CPAL table is built from."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Color Palette for SVG"
scope = []
kind = "number"
area = "color"
milestone = "M11"
effect = "table-value"
summary = "Integer index into the Color Palettes parameter choosing the palette used for the SVG table. Only meaningful together with Color Layers to SVG."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Color Palettes"
scope = []
kind = "list"
area = "color"
milestone = "M11"
effect = "table-value"
summary = "List of colour palettes exported as the CPAL table of a COLR/CPAL colour font. The same palettes are used to preview colour glyphs in Font View and Edit View."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "A master may carry its own Color Palettes, which wins over the font's for that master (`color.palette.perMaster`); both oracles read it so. Values are stored as `\"r,g,b,a\"` strings in version 2, integer lists in version 3 and floats in version 4."
observe = ["Palette font: edit a colour in the Color Palettes editor, press OK and save; note how the stored value is written in the file (version 3 integers or version 4 floats)."]

[[parameter]]
name = "Compatible name Table"
scope = []
kind = "bool"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "When on, export writes a legacy name table layout that some Mac applications (QuarkXPress, FontExplorer) need to group styles correctly in their font menus. It can break behaviour elsewhere, notably in Microsoft Office, so it is opt-in."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle reads it (fontmake 3.12.1 with glyphsLib 6.15.0, fontc 1.0.0; probe of the M7 planning pass), so FontCraft follows the handbook and nothing is compared. M7 plan § 4: M7.8."
guesses = [
  "When on, every name record is also written on the Macintosh platform (Roman encoding, English), with name ID 1 holding the family and style name together and ID 2 the style name, the layout older Macintosh applications group by; exporting with the parameter in the reference app and reading the name table settles it.",
  "Compatible name Table writes its Macintosh records even when Export Mac Name Table Entries is absent, and none when that parameter is present and off; both parameters together in the reference app settle it.",
]
observe = [
  "In font C (m7-export), export with Compatible name Table on; read the exported TTF with ttx: note which name records change.",
]

[[parameter]]
name = "compatibleFullNames"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 18, the Mac-only name preferred over ID 4. When absent, ID 18 is derived as family name, a space and the instance's style name. Using it can make Mac and Windows full names differ. Stored as a localizable property, a list of language and text (GlyphsSDK `infoProperty`); files of format version 2 hold it as the parameter `compatibleFullName`, which is read as the same field."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. fontmake 3.12.1 (glyphsLib 6.15.0, ufo2ft 3.9.1) writes name ID 18 from the format 2 parameter compatibleFullName and ignores this property; fontc writes neither. FontCraft writes ID 18 from either spelling, as the handbook says; when absent no ID 18 is written, as both oracles do. M7 plan § 4: M7.8."
guesses = [
  "Without the field no name ID 18 is written, as both oracles do, though the handbook says the reference derives it from family and style name; an export in the reference app settles whether it writes ID 18 by default.",
]

[[parameter]]
name = "copyrights"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 0 and takes precedence over the Copyright field on the Font tab of Font Info. Stored as a localizable property, a list of language and text (GlyphsSDK `infoProperty`); files of format version 2 hold it as the parameter `copyright`, which is read as the same field."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Written to name ID 0 by the compiler since M2, at font, master and instance level, as fontmake 3.12.1 (glyphsLib 6.15.0, ufo2ft 3.9.1) does; fontc reads the font's only. M7 plan § 4: M7.8."

[[parameter]]
name = "cvt Table"
scope = []
kind = "string"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Holds the control value table as a string of values. It is filled in when a TTF is opened so the existing TrueType hinting survives re-export; it is not meant for hand editing and should be deleted before hinting the font afresh."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Decompose Brace Layers"
scope = []
kind = "bool"
area = "interpolation"
milestone = "M9"
effect = "export-filter"
summary = "For variable-font export: components whose base glyph has intermediate (brace) layers are turned into outlines. On by default; set to off to keep them as components."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Neither oracle reads this parameter, and both keep such composites as composites (observed with fontc 1.0.0 and fontmake 3.12.1 in the M9 planning pass). FontCraft follows the oracles (docs/plans/M9.md § 7, question 4 (a), decided by the orchestrator on the owner's behalf): such composites stay composites, and the parameter set to on decomposes them. This departs from the handbook's default (docs/spec/40-compile.md § 4a)."
observe = [
  "In F2 (special layers), export the variable font with no Decompose Brace Layers parameter and read `glyf`: note whether `Hcomp` is a composite or contours.",
]

[[parameter]]
name = "Decompose Components"
scope = []
kind = "bool"
area = "components"
milestone = "M6"
effect = "export-filter"
summary = "Decomposes all components at export, for environments that mishandle composites; file size grows. Only relevant to TrueType outlines because CFF output never contains components."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle reads this parameter (glyphsLib, ufo2ft, fontmake and fontc searched by the M6 planning pass). FontCraft follows the handbook: when it is on, every composite of a TrueType build becomes contours (`fontcraft_compile::components_opt`); `docs/spec/40-compile.md` § 4a lists the difference from the oracles."
guesses = [
  "A decomposed glyph keeps its own contours first, then its components' contours in the order the compiler decomposes a glyph that mixes contours and components (fontc's order); a composite exported by the reference app with the parameter on would settle it.",
]

[[parameter]]
name = "Decompose Components in Variable Font"
scope = []
kind = "bool"
area = "components"
milestone = "M9"
effect = "export-filter"
summary = "When exporting a TrueType-flavoured variable font, decomposes all components. Exists to avoid an old macOS text-rendering bug (before 10.14.5) that mis-spaced composites whose left sidebearing varies; the file gets much larger."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Decompose Glyphs"
scope = []
kind = "list"
area = "components"
milestone = "M6"
effect = "export-filter"
summary = "List of glyph names whose components are turned into outlines at export. Useful to freeze a composite before Rename Glyphs swaps one of its base glyphs."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle reads this parameter (glyphsLib, ufo2ft, fontmake and fontc searched by the M6 planning pass). FontCraft follows the handbook: the listed composites of a TrueType build become contours, and a composite that uses a listed glyph keeps it as a component (`fontcraft_compile::components_opt`); `docs/spec/40-compile.md` § 4a lists the difference from the oracles."
guesses = [
  "A text value is read as glyph names separated by commas or spaces, besides the documented list; the reference app with a text value would settle it.",
]

[[parameter]]
name = "Default Layer Width"
scope = []
kind = "number"
area = "spacing-kerning"
milestone = "M5"
effect = "ui"
summary = "Width in units for new glyphs and layers, replacing the built-in defaults of 600 (1000 for CJK glyphs, 200 for corner components). The source types it as an integer but also allows a `script: value` form (for example `hebrew: 460`) that limits it to one script; repeat the parameter per script."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. A master layer that a drawing command adds to a glyph without one (Add Path, Add Rectangle, Add Ellipse) takes its width from the parameter: the entry for the glyph's script (stored, else from the glyph data), else the entry without a script, else the built-in width (1000 for a glyph of a CJK script, 200 for a glyph named `_corner.…`, 600 otherwise). New Glyph without a `width`, Add Glyphs, Add to Font, Generate in Font View, a new document from glyph sets, glyphs that Import Outlines adds and pasted glyphs without layers take the same width, master by master; the script of a new glyph comes from the glyph data for its name and code points."
guesses = [
  "Entries are looked up in the master's parameters before the font's, as for the other per-script parameters; the reference app with the parameter on a master would settle it.",
  "A value that is not a number from 0 to 65535 is ignored; the reference app with such a value would settle it.",
  "The CJK scripts are han, hangul, kana and bopomofo; a new layer of a glyph of each script in the reference app would settle it.",
]

[[parameter]]
name = "descender"
scope = []
kind = "string"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Replaces the descender for one script: lowercase script name, colon, value (for example `thai: -260`). Edit View uses it for glyphs of that script; add the parameter once per script."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "descriptions"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 10, a description that may hold revision notes, usage advice, history or feature lists. Stored as a localizable property, a list of language and text (GlyphsSDK `infoProperty`); files of format version 2 hold it as the parameter `description`, which is read as the same field."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Written to name ID 10 since M2, at all levels as fontmake 3.12.1 (glyphsLib 6.15.0, ufo2ft 3.9.1) does. M7 plan § 4: M7.8."

[[parameter]]
name = "Design Grid"
scope = []
kind = "string"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Sets a dotted grid, mainly for CJK design, with the value syntax `[script:]horizontal,vertical`. The source calls this three values without explaining the unit or how it relates to the CJK Grid parameters."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "designers"
scope = ["instance"]
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 9 for the instance it is on, taking precedence over the Designer field on the Font tab. Stored as a localizable property, a list of language and text (GlyphsSDK `infoProperty`); files of format version 2 hold it as the parameter `designer`, which is read as the same field."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Written to name ID 9 since M2, at all levels as fontmake 3.12.1 (glyphsLib 6.15.0, ufo2ft 3.9.1) does. M7 plan § 4: M7.8."

[[parameter]]
name = "designerURL"
scope = ["instance"]
kind = "string"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 12 for the instance it is on, taking precedence over the designer URL on the Font tab. The value should include the protocol."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Written to name ID 12 since M2, at all levels as fontmake 3.12.1 (glyphsLib 6.15.0, ufo2ft 3.9.1) does. M7 plan § 4: M7.8."

[[parameter]]
name = "Disable autohinting for glyphs"
scope = []
kind = "list"
area = "hinting-ps"
milestone = "M10"
effect = "hinting"
summary = "List of glyph names left out of PostScript autohinting at export, for shapes such as ornaments that hint badly. It has no effect on TrueType autohinting, which cannot be switched off per glyph."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Disable Masters"
scope = ["instance"]
kind = "list"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "List of masters to ignore. Meant for special production setups and for testing, such as checking how interpolation behaves without an in-between master."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Neither oracle reads it and no corpus source sets it (M9 planning pass)."

[[parameter]]
name = "Disable Subroutines"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "other"
summary = "When set, CFF charstrings are exported without subroutines. Used when very complex outlines fail to export, or to shorten test exports of fonts with many glyphs."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "DisableAllAutomaticBehaviour"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "other"
summary = "Disables most automatic export steps. The source names two: moving .notdef and space to the start of the glyph order, and setting the advance width of non-spacing marks to zero; the full list is not given."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Don't use Production Names"
scope = []
kind = "bool"
area = "compile"
milestone = "M4"
effect = "export-filter"
summary = "When checked, glyphs keep their source names in the exported font instead of being renamed to the production names from the glyph database. Same effect as Font Info > Other Settings > Use Custom Naming; some older environments expect AGL-style names."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Moved from M2 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6), with the production names it switches off. Built in M4.2: the font's, master's or instance's value (Resolved::production_names); a UFO's com.github.googlei18n.ufo2ft.useProductionNames reads as its negation. Documented, not yet observed."

[[parameter]]
name = "EditView Line Height"
scope = []
kind = "number"
area = "edit-text"
milestone = "M5"
effect = "ui"
summary = "Float setting the distance between lines of text in Edit View, for fonts whose vertical metrics make the default leading unsuitable. Never affects the exported font."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Documented, not yet observed. Read by `textlayout::line_height` for the master a tab draws in; without it, lines are the master's ascender minus its descender plus a tenth of the em apart (docs/plans/M5.md § 3)."

[[parameter]]
name = "Elidable STAT Axis Value Name"
scope = ["instance"]
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "The value is a four-letter axis tag; the instance's style name is then flagged in STAT as elidable for that axis, meaning it is dropped when combined with other names (as with Regular). Typically added to the regular instance once per axis for which its name is the default."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Enforce Compatibility Check"
scope = ["font"]
kind = "bool"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "By default two masters are only checked against each other when some defined instance needs both. This forces the check across every master, which matters for variable fonts with no instance between certain masters."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Export AAT"
scope = []
kind = "bool"
area = "features"
milestone = "M14"
