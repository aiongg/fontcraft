[[parameter]]
name = "Italic Style Linking"
scope = []
kind = "bool"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Controls whether a variable font's STAT table gets a format 3 axis value on the ital axis linking ital=0 to ital=1, overriding the automatic choice. Should not be added to a font that is only italic."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "italicAngle"
scope = []
kind = "string"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Replaces the master's italic angle, in degrees clockwise from vertical; a `script: value` form (for example `cyrillic: 9`) limits it to one script. It feeds post.italicAngle, CFF ItalicAngle, the hhea caret slope and, in OS/2, the horizontal offsets for subscript and superscript."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Keep Glyphs"
scope = []
kind = "list"
area = "compile"
milestone = "M7"
