status = "handbook"

[[parameter]]
name = "fsType"
scope = []
kind = "list"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "List of bit numbers set in OS/2.fsType. The offered states are installable, restricted (forbidden; only valid as the sole level), editable, preview and print, plus the no-subsetting flag."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "gasp Table"
scope = []
kind = "dict"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Writes the gasp table for TrueType fonts from two PPM thresholds, default 8 and 20. Up to the first: no grid-fitting, symmetric smoothing; between them: grid-fitting with asymmetric (ClearType) rendering; above: grid-fitting with symmetric smoothing. The source gives no value type."
