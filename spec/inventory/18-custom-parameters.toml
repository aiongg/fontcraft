[[parameter]]
name = "Import Master"
scope = []
kind = "string"
area = "import-export"
milestone = "M7"
effect = "other"
summary = "References a master in another source file so it behaves like a master of the host. Both files need mutually compatible axis values, and each linked master takes a parameter of its own. The source gives no value type."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Instance Preview"
scope = ["instance"]
kind = "list"
area = "font-info"
milestone = "M7"
effect = "ui"
summary = "List of glyph names replacing the default `Aang126` preview string shown for an instance in Font Info."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "InterpolationWeightY"
scope = ["instance"]
kind = "number"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Float used to interpolate y coordinates of an instance while x coordinates keep using the instance's weight value; it only acts when it differs from that value. Large differences distort diagonals."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "isFixedPitch"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Sets post.isFixedPitch. As a side effect every glyph's width is made equal to the width of the space glyph; a `.monospace` number in the master settings can override that width."
