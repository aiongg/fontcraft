status = "handbook"

[[parameter]]
name = "hheaDescender"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Negative integer written to hhea.descender."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "hheaLineGap"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to hhea.lineGap. Some legacy software treats negative values as zero."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Ignore custom GlyphData file"
scope = []
kind = "bool"
area = "font-view"
milestone = "M4"
effect = "other"
summary = "When set, a GlyphData.xml sitting next to the source file, or in an `Info` subfolder next to it, is not loaded."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "file.open reads the GlyphData*.xml files beside the source and in its Info folder; while this parameter is on, Session::glyph_data leaves them out (crates/engine/src/glyph_data.rs)."

[[parameter]]
name = "Ignore out of bounds instances"
scope = []
kind = "bool"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
