effect = "export-filter"
summary = "List of `glyphname=hex` entries; several code points are comma-separated (`space=0020,00A0`) and an empty right side removes the glyph's code points. A code point taken from another glyph is removed from that glyph, and production names stay unchanged."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Remove Classes"
scope = ["instance"]
kind = "list"
area = "features"
milestone = "M8"
effect = "features"
summary = "List of class names not to export, for hand-written classes that refer to glyphs removed by subsetting. Automatic classes already disappear when the glyphs that trigger them are gone."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Remove Features"
scope = []
kind = "list"
area = "features"
milestone = "M8"
effect = "features"
summary = "List of feature tags not to export, for an unwanted auto-generated feature or to switch a manual feature off in one instance. Automatic features already disappear when the glyphs that trigger them are gone."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Remove Glyphs"
scope = []
kind = "list"
area = "compile"
milestone = "M7"
effect = "export-filter"
summary = "One entry per line: a full glyph name, a name with `*` wildcards, or a `key=value` query on glyph properties (name, unicode, note, script, category, subCategory, production, metrics keys, kerning groups, colorIndex, countOfLayers, mastersCompatible, export, colour and special-layer flags). Matching glyphs are not exported and automatic features follow the reduced glyph set."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Remove post names for webfonts"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "other"
summary = "When set, web font exports carry no glyph names, which makes the files smaller."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Remove Prefixes"
scope = []
kind = "list"
area = "features"
milestone = "M8"
effect = "features"
summary = "List of prefix names as defined in the Features tab; their code is not compiled into the exported font."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Rename Glyphs"
scope = []
kind = "list"
area = "compile"
milestone = "M7"
effect = "export-filter"
summary = "List of `oldname=newname` entries (for example `g.single=g`); the two glyphs trade names. Composites using them and automatic features are updated, and the glyphs' export flags are swapped too, so the unwanted one must be non-exporting or handled with Export Glyphs."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Replace Class"
scope = []
kind = "string"
area = "features"
milestone = "M8"
effect = "features"
summary = "Value is the class name without @, a semicolon, then the new contents. Only works for a class that exists in the Features tab and is only needed for manual classes."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Replace Feature"
scope = []
kind = "string"
area = "features"
milestone = "M8"
effect = "features"
summary = "Value is the four-letter feature tag, a semicolon, then the new code. Only works when that feature exists in the Features tab."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Replace Prefix"
scope = []
kind = "string"
area = "features"
milestone = "M8"
effect = "features"
summary = "Value is the prefix name exactly as written in the Features tab, a semicolon, then the replacement code."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "ROS"
scope = []
kind = "string"
area = "compile"
milestone = "M7"
effect = "table-value"
summary = "One of Adobe-CNS1-6, Adobe-GB1-5, Adobe-Japan1-3, Adobe-Japan1-6, Adobe-Korea1-2 or Adobe-Identity-0. With Adobe-Identity-0 the GSUB table is built from the font's own features; with the others Adobe's cmap and GSUB resources for that collection are used."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "sampleTexts"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 19, the text an application may use to show the font off. The source gives no value type; the plural key suggests one text per language (inferred)."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Save as TrueType"
scope = ["instance"]
kind = "bool"
area = "compile"
milestone = "M2"
effect = "other"
summary = "Forces the instance to be written as a TTF, overriding the format chosen in the export dialog."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "SBIX to SVG"
scope = []
kind = "number"
area = "color"
milestone = "M11"
effect = "other"
summary = "When set, the bitmaps prepared for sbix are also written as bitmap images in an SVG table for wider compatibility. Combine with Export sbix Table set to off to get SVG only. The source types it as an integer without saying what the number means."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Scale to UPM"
scope = []
kind = "number"
area = "compile"
milestone = "M7"
effect = "export-filter"
summary = "Integer target UPM; everything in the font is scaled to it at export, for example to 2048 (or another power of two from 16 to 16384) for TrueType."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "shoulderHeight"
scope = []
kind = "number"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Integer height shown as a metric line instead of the x-height in glyphs of those scripts. Automatic alignment-zone creation takes it into account."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "smallCapHeight"
scope = []
kind = "number"
area = "guides-metrics"
milestone = "M3"
effect = "ui"
summary = "Integer height that takes the place of the x-height line for small-cap glyphs while metrics are visible. Automatic alignment-zone creation takes it into account."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "strikeoutPosition"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.yStrikeoutPosition; positive is above the baseline. Usually matched to the em dash, but should not coincide with crossbars."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "strikeoutSize"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.yStrikeoutSize; normally the em dash thickness and equal to the underline thickness."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Style Name as STAT entry"
scope = ["instance"]
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Value is a four-letter axis tag: the instance's style name becomes the combinable display name for that axis in STAT. Only for instances that are non-default on exactly that axis and default on all others (for example Light for wght)."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "styleMapFamilyNames"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Family name used for regular/italic/bold/bold-italic style linking, letting a large family be split into groups of up to four linked fonts; linking itself follows each instance's style name and style-linking settings. The source gives no value type; the plural key suggests one text per language (inferred)."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "styleMapStyleNames"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Described only as the localised font subfamily name, name ID 2. The source gives no value type; the plural key suggests one text per language (inferred)."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "styleNames"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 2, which distinguishes fonts sharing a family name (ID 1) and should express style and weight variants only. The source gives no value type; the plural key suggests one text per language (inferred)."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "subscriptXOffset"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySubscriptXOffset. Should stay 0 in upright fonts."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "subscriptXSize"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySubscriptXSize, the recommended em width of scaled subscript glyphs in font units."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "subscriptYOffset"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySubscriptYOffset; a positive number moves the subscript below the baseline."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "subscriptYSize"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySubscriptYSize."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "superscriptXOffset"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySuperscriptXOffset. Should stay 0 in upright fonts."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "superscriptXSize"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySuperscriptXSize."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "superscriptYOffset"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySuperscriptYOffset. The source describes a positive value as going below the baseline, which looks carried over from the subscript entry."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "superscriptYSize"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.ySuperscriptYSize."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "trademarks"
scope = []
kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 7, kept separate from the copyright. The source gives no value type; the plural key suggests one text per language (inferred)."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TrueType Curve Error"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "export-filter"
summary = "Float, default 0.6: the largest distance in units the quadratic approximation may deviate from the cubic outline. A larger value needs fewer quadratic segments and gives a smaller glyf table."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TrueType Keep GlyphOrder"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "other"
summary = "When set, the order from the source is kept except that .notdef and space stay in the first two slots. When off (default) the first four glyphs become .notdef, NULL, CR, space; NULL and CR are only moved if present, while .notdef and space are generated when missing."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFAutohint binary path"
scope = []
kind = "string"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "File path of a precompiled ttfautohint binary to run in place of the built-in one, to pin or update the version."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFAutohint control instructions"
scope = []
kind = "string"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Multi-line text of ttfautohint control instructions: `left`, `right`, `nodir`, `touch` and `point` lines addressing glyphs by production name and points by index, with optional offsets, x/y shifts and PPM ranges. Lines starting with # are comments and instruction words may be abbreviated to their first letter."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFAutohint options"
scope = []
kind = "string"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Option string for ttfautohint, edited through a dialog: hint set range, default and fallback script, hinting limit (default 200), fallback stem width, x-height increase limit (default 14), x-height snapping exceptions, and flags for adjusting subglyphs, dehinting, version info, composites, restrictions, symbol fonts, a TTFA table, Windows compatibility and strong stems per rendering target."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFBlueFuzz"
scope = []
kind = "number"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Integer, default and fallback 1, extending each zone defined in TTFZones by that many units up and down, like the PostScript BlueFuzz."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFDontPreserveDiagonals"
scope = []
kind = "bool"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Normally manual hinting keeps the angle of a slanted stem intact where a hinted stem crosses it. Setting this drops that protection (no projection onto freedom vectors), giving smaller hinting code."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFFamilyZonesThreshold"
scope = []
kind = "number"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Integer PPM limit for applying family zones in TrueType hinting. Family zones are given by a TTFZones parameter on the font rather than on a master, with the same number of zones in both places."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFMinimumDistance"
scope = []
kind = "number"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Float, default 0.25: any stem with a stem hint is rendered at least this thick at every PPM size, so thin parts do not vanish at small sizes."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFOvershootSuppressionBelowPPM"
scope = []
kind = "number"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Integer PPM limit below which overshoots are reliably suppressed. Applies to manual TrueType hinting only, not to the autohinter."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFStems"
scope = ["master"]
kind = "list"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "List of stems, each with orientation (horizontal or vertical), a unique name and a width that stems round towards; PostScript stems of the master can be imported. In the hint-source master each stem also has per-PPM, per-instance deltas (none, up, down) and a glyph scope built from Name, Category, Subcategory and Script filters with AND/OR nesting."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFZoneRoundingThreshold"
scope = []
kind = "number"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "Float, default 0.09375, typically 0.1 to 0.2: added to each positive zone position before rounding to pixels, and added twice for the zone named xHeight."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "TTFZones"
scope = ["font", "master"]
kind = "list"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "List of zones, each with a unique name, position, size (positive for top zones, negative for bottom zones) and an optional zone to align to; PostScript zones of the master can be imported. In the hint-source master each zone also has per-PPM, per-instance deltas and a glyph scope; set on the font it supplies family zones."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "typoAscender"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.sTypoAscender; with typoDescender and typoLineGap it defines default line spacing. For CJK fonts used vertically it must equal the top of the ideographic em box."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "typoDescender"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Negative integer written to OS/2.sTypoDescender."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "typoLineGap"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to OS/2.sTypoLineGap, the recommended extra space between lines."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "underlinePosition"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to post.underlinePosition; negative is below the baseline. Default -100."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "underlineThickness"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to post.underlineThickness. Default 50; should match the underscore glyph and the strikeout thickness."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "unicodeRanges"
scope = []
kind = "list"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "List of Unicode ranges whose bits are set in OS/2.ulUnicodeRange1 to ulUnicodeRange4, each an independent flag. The editing dialog has a search field to filter the range list."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "uniqueID"
scope = []
kind = "string"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 3."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "unitsPerEm"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer UPM value; default 1000 for CFF-flavoured fonts, and normally a power of two from 16 to 16384 (usually 2048) for TrueType. It changes only the declared value, not coordinates or measurements; use Scale to UPM to rescale."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Update Features"
scope = []
kind = "bool"
area = "features"
milestone = "M8"
effect = "features"
summary = "When on, all automatic feature code is regenerated, which helps while the glyph set is changing; when explicitly off, automatic feature generation is suppressed."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Use Arabic Presentation Form Unicodes"
scope = []
kind = "bool"
area = "compile"
milestone = "M7"
effect = "export-filter"
summary = "When set, Arabic glyphs are given the legacy presentation-form Unicode values. The source gives no further detail on which glyphs are affected."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Use Extension Kerning"
scope = []
kind = "bool"
area = "features"
milestone = "M8"
effect = "features"
summary = "When checked, additional kerning lookups are written as GPOS extension lookups (type 9), which use 32-bit offsets and so hold more kerning. For fonts whose export fails with a GPOS offset overflow."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Use Line Breaks"
scope = []
kind = "bool"
area = "import-export"
milestone = "M1"
effect = "other"
summary = "When checked, line breaks inside feature code are saved as real line breaks rather than as the escape `\\012`. The source's wording about which state helps version control is ambiguous."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Use Typo Metrics"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Sets bit 7 of OS/2.fsSelection so that supporting applications use typoAscender, typoDescender and typoLineGap instead of winAscent and winDescent for line spacing. Default off; recommended on for variable fonts, with hhea values equal to the typo values."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Variable Font Family Name"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "naming"
summary = "Family name for the variable font, so static and variable versions installed side by side do not share a name."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Variable Font File Name"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "other"
summary = "Replaces the default variable-font file name, which ends in `VF.ttf`."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Variable Font Optimize Deltas"
scope = []
kind = "bool"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Described identically to Optimize Variable Deltas: on by default, drops the deltas of any contour whose nodes all move by half a unit or less; set to off to keep them."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Variable Font Origin"
scope = ["font"]
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Names the master stored as the default outlines of the variable font; every other master and instance is reached by deltas from it."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Variable Font Style Name"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "naming"
summary = "By its key a style name for the variable font, but the source repeats the description of Variable Font Family Name word for word, so its exact role is unconfirmed."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Variable SubfamilyName"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "naming"
summary = "Style name given to the default outlines of the exported variable font, i.e. the origin master."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "variablePostscriptFontName"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "naming"
summary = "Sets name ID 6 and the PostScript name of the named instance in fvar. ASCII without spaces; must differ from the static font's PostScript name, ideally the name ID 25 prefix, a hyphen and the style name. The source gives no value type."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "variableStyleName"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "naming"
summary = "By its key a style name for the variable font, but the source repeats the description of Variable Font Family Name word for word, so its exact role is unconfirmed."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "variableStyleNames"
scope = []
kind = "dict"
area = "interpolation"
milestone = "M9"
effect = "naming"
summary = "Alternative style name for the variable export, needed when the same static style name occurs under several static family names and would otherwise produce duplicate fvar instance names. The source gives no value type; the plural key suggests one text per language (inferred)."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Variation Font Origin"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Described identically to Variable Font Origin: names the master stored as the variable font's default outlines."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "variationsPostScriptNamePrefix"
scope = []
kind = "string"
area = "interpolation"
milestone = "M9"
effect = "naming"
summary = "Sets name ID 25, the family prefix used when PostScript names of arbitrary variable instances are generated (limit 127 characters); only ASCII letters and digits. Without it, the typographic family name stripped to those characters is used."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "vendorID"
scope = []
kind = "string"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Four printable ASCII characters written to OS/2.achVendID. Defaults to `UKWN` when not set."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "versionString"
scope = []
kind = "string"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Text beginning with `Version ` and a number; may be a template such as `Version %d.%03d` into which the major and minor version are inserted. The number is digits, a period, digits (each below 65535), and extra information is best separated with a semicolon."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "vheaVertAscender"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to vhea.vertTypoAscender, measured from the vertical centre baseline out to the ideographic em box's right edge; usually UPM / 2."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "vheaVertDescender"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer, usually negative, written to vhea.vertTypoDescender, measured from the vertical centre baseline out to the ideographic em box's left edge; usually -UPM / 2."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "vheaVertLineGap"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Integer written to vhea.vertTypoLineGap; recommended vertical line spacing is the em-box width plus this value."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Virtual Master"
scope = ["font"]
kind = "list"
area = "interpolation"
milestone = "M9"
effect = "interpolation"
summary = "Declares an extra master position for a variable font without real master data; its outlines are drawn only as intermediate (brace) layers named with the coordinates in curly braces, in the glyphs that need them. Suited to an axis that affects few glyphs, and avoids re-kerning. The source gives no value type."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Webfont Formats"
scope = ["instance"]
kind = "list"
area = "compile"
milestone = "M2"
effect = "other"
summary = "List drawn from TTF, EOT, WOFF and WOFF2; the instance carrying it is exported in exactly those web formats, overriding the export dialog."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Webfont Only"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "other"
summary = "When on, removes information that desktop use needs, making the web font harder to convert or install locally. The result is technically a damaged font that still works in browsers; the source does not say what is removed."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "winAscent"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Positive integer written to OS/2.usWinAscent; Windows may clip anything drawn above it, so it should cover all important glyphs."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "winDescent"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Positive integer written to OS/2.usWinDescent; should cover the lowest descenders."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Write DisplayStrings"
scope = []
kind = "bool"
area = "import-export"
milestone = "M1"
effect = "other"
summary = "On by default. When off, the text contents of the Edit tabs are not written to the source file, which keeps version-control diffs clean."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Write lastChange"
scope = []
kind = "bool"
area = "import-export"
milestone = "M1"
effect = "other"
summary = "On by default. When off, the last-changed date is not written to the source file, which keeps version-control diffs clean."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "WWSFamilyName"
scope = []
kind = "string"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 21, needed when IDs 16 and 17 do not follow the weight/width/slope model, for example when the subfamily includes an optical size."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "WWSSubfamilyName"
scope = []
kind = "string"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 22, used with ID 21 to give a subfamily name that reflects only weight, width and slope."
ref = "Appendix › Custom Parameters"
status = "handbook"
