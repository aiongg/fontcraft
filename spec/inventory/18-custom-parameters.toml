status = "handbook"

[[parameter]]
name = "Get Hints From Master"
scope = []
kind = "string"
area = "hinting-ps"
milestone = "M10"
effect = "hinting"
summary = "Chooses the master that supplies manual PostScript and TrueType hints; hints in other masters are ignored. Defaults to the first master. Only that master's TTFStems and TTFZones editors offer the delta and scope controls."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "glyphOrder"
scope = ["font"]
kind = "list"
area = "font-info"
milestone = "M4"
effect = "other"
summary = "List of glyph names, one per line, fixing the glyph order in the working file and in exports. Glyphs not listed are appended afterwards in the application's default order."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "Moved from M7 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): Font View's order (glyphOrder.default, M4) reads it, and export uses the same order. Editing it in Font Info comes with M7's parameter commands. The tutorial \"Alter the glyph order in Font view\" (glyphsapp.com/learn) adds that a line written **Title** shows as a section header in Font View; such lines name no glyph and are ignored at export. Exported fonts follow the order (Font::resolve, M4.2), as fontc and glyphsLib do. Documented, not yet observed."

[[parameter]]
name = "Grid Spacing"
