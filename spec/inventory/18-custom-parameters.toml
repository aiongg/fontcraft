kind = "dict"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 13, which describes the permitted uses of the font. The source gives no value type; the plural key suggests one text per language (inferred)."
ref = "Appendix › Custom Parameters"
