summary = "Value is `nameID; text`, `nameID platformID; text` or `nameID platformID encID langID; text`. Missing parts default to platform 3, encoding 1 and the language the source prints as 0x0049 (Windows English), or to encoding 0 and language 0 when only platform 1 is given; IDs 1, 2, 3, 5 and 6 cannot be set. Platform is 1 or 3, and encoding and language may be decimal, octal (leading 0) or hexadecimal (0x)."
