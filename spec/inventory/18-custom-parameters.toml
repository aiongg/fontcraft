ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Has WWS Names"
scope = []
kind = "bool"
area = "compile"
milestone = "M2"
effect = "table-value"
summary = "Sets bit 8 of OS/2.fsSelection, stating that the name table is weight/width/slope-consistent without name IDs 21 and 22. Only correct when the family naming really follows that scheme."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "hheaAscender"
scope = []
kind = "number"
area = "compile"
milestone = "M2"
