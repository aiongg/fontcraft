status = "handbook"

[[parameter]]
name = "Ignore Vertical Hints"
scope = []
kind = "bool"
area = "hinting-tt"
milestone = "M10"
effect = "hinting"
summary = "In TrueType export, leaves out every manual stem hint linked to a vertical stem defined in TTFStems. Suits subpixel-rendering targets and small web fonts; no effect on the TrueType autohinter or on PostScript hinting."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Import Font"
scope = []
kind = "string"
area = "import-export"
milestone = "M7"
effect = "other"
summary = "References another source file; glyphs it has that the host lacks appear in the host as if copied, in layer and master order, visible and typeable but locked. Used to split work across people or share smart components. The source gives no value type."
ref = "Appendix › Custom Parameters"
