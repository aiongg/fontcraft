[[parameter]]
name = "licenseURL"
scope = []
kind = "string"
area = "font-info"
milestone = "M7"
effect = "naming"
summary = "Sets name ID 14. The value should start with the protocol, usually https://."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Link Metrics With First Master"
scope = ["master"]
kind = "bool"
area = "spacing-kerning"
milestone = "M5"
effect = "other"
summary = "Set on a master to mirror the spacing and kerning of the first master, so only the first master needs spacing and kerning. Suits colour-layer fonts and families whose metrics stay constant across weights."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "fontc and glyphsLib take a linked master advance widths (horizontal, vertical width and vertical origin) and its kerning from the master it follows, for master layers only, not intermediate layers (fontc `glyphs2fontir/src/source.rs` and `glyphs-reader/src/font.rs`, glyphsLib `builder/kerning.py`). A staff answer on the reference forum says metrics and kerning cannot be linked separately (thread \"Link Metrics With Master but not the kerning\"). Documented, not yet observed. Export follows fontc: a glyph with no layer in the followed master keeps its own width, and a vertical width or origin the followed layer does not state falls back to the glyph's own."
guesses = [
  "Spacing and kerning commands refuse to edit a linked master and name the master it follows; no source says what the reference does with such an edit.",
]

[[parameter]]
name = "Link Metrics With Master"
scope = ["master"]
kind = "string"
area = "spacing-kerning"
milestone = "M5"
effect = "other"
summary = "Like Link Metrics With First Master, but the value names the master to follow. Master names should be unique when this is used."
ref = "Appendix › Custom Parameters"
status = "handbook"
notes = "fontc and glyphsLib take a linked master advance widths (horizontal, vertical width and vertical origin) and its kerning from the master it follows, for master layers only, not intermediate layers (fontc `glyphs2fontir/src/source.rs` and `glyphs-reader/src/font.rs`, glyphsLib `builder/kerning.py`). A staff answer on the reference forum says metrics and kerning cannot be linked separately (thread \"Link Metrics With Master but not the kerning\"). The value is a master id or name; fontc tries the id first. With both parameters on a master, Link Metrics With First Master wins (fontc). The source master's own link parameters are not followed (fontc). Documented, not yet observed. Export follows fontc: a glyph with no layer in the followed master keeps its own width, and a vertical width or origin the followed layer does not state falls back to the glyph's own."

