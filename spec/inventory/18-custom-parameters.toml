kind = "number"
area = "compile"
milestone = "M2"
effect = "export-filter"
summary = "Corresponds to grid spacing divided by subdivision from Other Settings. At export any value below 1 gives coordinates with hundredth-unit precision and any value of 1 or more gives whole-unit rounding; TrueType outlines are unaffected."
ref = "Appendix › Custom Parameters"
status = "handbook"

[[parameter]]
name = "Hangul Composition Groups"
