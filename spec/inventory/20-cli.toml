ref = "AFDKO otf2otc.py help; fontTools ttLib __main__"
notes = "The layout follows otf2otc 5.0.1 (checked by running it on fonts built in code): header version 1, font directories in input order, then the tables grouped by tag in the order the tags first appear (a tag new to a later font goes in at that font's table position), each group holding the distinct versions in the order met. Table bytes are kept, head.checkSumAdjustment included; directory checksums are computed. DSIG tables are kept as they are."
guesses = ["A --share-table that names a font past the inputs, or a font without that table, is refused; otf2otc ignores it silently. A user report of a script that relies on otf2otc's behaviour would settle it."]
