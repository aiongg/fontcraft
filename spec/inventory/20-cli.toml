]
command = "tables.checksum"
equivalents = [
  "sfntedit: -c; -f",
]
area = "cli-tools"
milestone = "M12"
summary = "Verifies every table checksum and the whole-font checksum adjustment in head and reports mismatches; exit status 1 when any is wrong. With --fix it rewrites the font with correct values, which also reorders tables and recomputes the directory search fields."
