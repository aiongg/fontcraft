  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "outlines.decompose"
equivalents = [
  "ttfdecomponentizer: INPUT; -d / --directory; -o; -v / --verbose; --version",
  "fontmake: -f / --flatten-components",
  "fontc: --decompose-components / --decompose-transformed-components / --flatten-components",
]
area = "cli-tools"
milestone = "M12"
summary = "Replaces component references with the contours they stand for. In a TrueType font the decomposed glyphs lose their instructions. Options restrict the action to nested components (flattening to one level) or to components with a transform."
ref = "AFDKO ttfdecomponentizer.py; fontmake -f; fontc --decompose-components, --decompose-transformed-components"
status = "docs"
notes = "Built in M12.28. Full decomposition matches ttfdecomponentizer (AFDKO 5.0.1) on a font built in code: contours start at their first on-curve point, decomposed glyphs have no instructions. --transformed-only decomposes a whole glyph when a direct component has a 2x2 transform (a glyf glyph cannot mix contours and components); --nested-only rewrites composites of composites as composites of simple glyphs with composed transforms, offsets rounded. Sources call glyph.decomposeGlyphForAllMasters (M6), whose options are not offered on sources yet."

[[cli]]
id = "autohint"
usage = "fontcraft-cli autohint INPUT... [-o OUT...] [--glyphs LIST] [--all] [--reference FONT] [--allow-changes] [--report-only] [options]"
options = [
  "INPUT...: Type 1, CFF, OTF (name- or CID-keyed, static or CFF2 variable), UFO, or TrueType font",
  "-o, --output PATH...: one output per input, written instead of modifying the inputs",
  "--glyphs SELECTOR, --glyphs-file FILE: hint only these glyphs",
  "--exclude-glyphs SELECTOR, --exclude-glyphs-file FILE: hint all but these glyphs",
  "--all: hint every glyph even when it already has hints or its outline has not changed since it was last hinted (UFO); default skips those",
  "--reference FONT, --reference-out PATH: hint the inputs compatibly with this reference master, and where to write the hinted reference",
  "--overlap-glyphs SELECTOR, --overlaps-file FILE: glyphs whose overlapping contours should be accounted for when placing hints",
  "--force-overlap / --force-no-overlap: account for overlap in every glyph (default with --reference and for variable fonts) or in none (default for single static fonts)",
  "--loose-overlap-mapping: relax the matching between an overlap-removed outline and the original when many segments cannot be mapped",
  "--write-layer NAME|processed: UFO layer that receives the hinted glyphs; default the font's own glyphs, 'processed' writes to the AFDKO layer com.adobe.type.processedglyphs instead",
  "--keep-conflicts: when hinting a variable font, keep a stem whose order relative to another stem changes between masters instead of removing it",
  "--allow-changes: allow small outline changes that improve hinting: reorder contours to reduce hint substitution and turn nearly straight curves into lines",
  "--report-only: analyse and report without writing",
  "--decimal: keep fractional coordinates",
  "--no-flex: do not generate flex",
  "--no-hint-sub: do not use hint substitution (one hint set per glyph)",
  "--no-zones-stems: allow hinting a font that has no alignment zones or stem widths",
  "--fontinfo-file FILE, --ignore-fontinfo: read per-glyph-set hinting parameters (FDDict and GlyphSet blocks) from FILE instead of a file named fontinfo beside the font, or ignore such a file",
  "--print-list-fddict, --print-all-fddict: list the hint dictionaries in effect and the glyphs assigned to each, for the reference font or default instance only, or for every font or instance",
  "--max-segments N: skip hinting a glyph in a direction when it has more than N segments there; default 100",
  "--tt-options STRING, --tt-control FILE: options and control instructions for the TrueType autohinter (TrueType input only)",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "autohint.ps.run"
equivalents = [
  "otfautohint: FONT…; -o / --output; -g / --glyphs, --glyphs-file; -x / --exclude-glyphs, --exclude-glyphs-file; -m / --overlap-glyphs, --overlaps-file; --force-overlap / --force-no-overlap; --loose-overlap-mapping; -r / --reference-font; -b / --reference-out; -a / --all; -w / --write-to-default-layer; -k / --keep-conflicts; -c / --allow-changes; --report-only; -d / --decimal; --no-flex; --no-hint-sub; --no-zones-stems; --fontinfo-file / --ignore-fontinfo; --print-list-fddict / --print-all-fddict; --doc-fontinfo / --info; --max-segments; --log; -p / --processes; -v / --verbose; --traceback; --version",
  "fontmake: -a / --autohint [ARGS]; -A / --no-autohint",
]
area = "hinting-ps"
milestone = "M12"
summary = "Adds hints automatically. For CFF, CFF2, Type 1 and cubic UFO input it runs the PostScript autohinter, which derives stem hints, hint masks, counter hints and flex from each glyph and the font's alignment zones and standard stems. For TrueType fonts it runs the TrueType autohinter with the given option string. Several masters can be hinted together so that their hints stay compatible."
ref = "AFDKO otfautohint __main__.py (options, --info, --doc-fontinfo), otfautohint_Notes.md; fontmake -a / -A (ttfautohint)"
status = "docs"
notes = "Checked in AFDKO 5.0.1's otfautohint source: for OTF input every glyph is hinted again and existing hints are replaced; --all only matters for UFO input, where unchanged glyphs are skipped by their stored hashes (20-cli.md question 5). Built in M12.39 as a shell over autohint.ps.run and autohint.tt.run on sources: each input opens in its own session, the hints go on the master layers, and the document is saved to INPUT.autohinted.EXT unless -o (comma-separated, one per input), --output-dir or --in-place says otherwise (cli.global rule: the input is never written over by default; otfautohint writes over it). Layers that already have hints are skipped unless --all, for every source format. The TrueType autohinter runs when --tt-options or --tt-control is given or the first input is a compiled TrueType font. A compiled font opens view-only, so it can only be analysed with --report-only; hinting compiled CFF or TrueType fonts in place waits for a binary autohint command. Not built yet, and refused with exit status 4: --reference, --reference-out, the overlap options except --force-no-overlap, --write-layer, --keep-conflicts, --allow-changes, --decimal, and --fontinfo-file when hinting (--print-list-fddict reads it). A fontinfo file beside the first input is reported as not applied. --print-list-fddict and --print-all-fddict print autohint.ps.listFdDicts as text in the reference's order of font name, set name, keys and glyphs; the key lines are not compared with otfautohint's output yet. A designspace output in the input's folder is refused, since its UFOs could land on the input's."

