# ============================================================ companion tools (M12 planning pass)
# Our own rows for what the reference vendor's free companion tools do: a table viewer with a
# font comparison, and a source comparison with merging. The windows' rows sit here with the
# commands they show, because they hold no logic of their own.

[[cli]]
id = "tables show"
notes = "Decoded tables: head, hhea, maxp, OS/2, post, name, cmap, hmtx, loca, glyf, GDEF, GSUB, GPOS, fvar, avar, gasp, DSIG (header); others are listed with their length. Glyph names come from post formats 1 and 2; CFF charset names are not read yet. Offsets are given for subtables, not for every field. Lookup subtables show their glyphs and values for single, pair and mark-to-base positioning and single, multiple, alternate and ligature substitution; contextual subtables show formats and coverages."
usage = "fontcraft-cli tables show FONT [TAG...] [--path PATH] [--depth N] [--offsets] [--format json|text]"
options = [
  "TAG...: the tables to show (default: every table the reader decodes; the others are listed with their size only)",
  "--path PATH: show one record or field, for example GPOS.lookupList.lookups[3]",
  "--depth N: how many levels of nested records to expand (default 3)",
  "--offsets: also show each record's offset in the table and its size",
  "--format json|text: a JSON tree (default with --json) or an indented listing",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "tables.show"
equivalents = [
  "ttx: -t TAG (decoded XML of the named tables)",
  "spot: -t TAG (the raw view)",
]
area = "cli-tools"
milestone = "M12"
summary = "Shows the decoded fields of a font's tables as a tree: each record with its field names and values, offsets followed to the records they point to, and glyph indices shown with their names, down to the requested depth. It follows each table's own structure from the OpenType specification rather than a dump format of a reference tool; the Table Viewer window shows the same tree. Two fonts are compared table by table with diff."
ref = "Our design, after the reference vendor's free table-viewer companion tool; OpenType specification table layouts"
status = "inferred"
own = true
guesses = ["Records are expanded three levels deep unless --depth says otherwise; a user's need to see deeper by default would settle it."]

[[cli]]
id = "sources"
usage = "fontcraft-cli sources (diff | merge) ..."
options = [
  "ACTION: diff or merge",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = ""
equivalents = []
area = "cli-tools"
milestone = "M12"
summary = "Group of two actions on source files (.glyphs, .glyphspackage, .fontcraft, UFO, designspace): compare two sources glyph by glyph and field by field, and merge chosen changes from one into the other."
ref = "Our design, after the reference vendor's free source-comparison companion tool"
status = "inferred"
own = true

[[cli]]
id = "sources diff"
usage = "fontcraft-cli sources diff A B [--parts glyphs,info,masters,instances,axes,kerning,features] [--glyphs LIST] [--tolerance UNITS] [--format text|json]"
options = [
  "A, B: the two sources; they may be in different formats",
  "--parts LIST: which parts to compare (default all)",
  "--glyphs LIST, --glyph-file PATH: compare only these glyphs (glyph list syntax)",
  "--tolerance UNITS: coordinates closer than this count as equal (default 0)",
  "--format text|json: one line per change (default) or the change list as JSON",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "source.diff"
equivalents = []
area = "cli-tools"
milestone = "M12"
summary = "Compares two sources and lists every difference: glyphs added, removed or renamed; per glyph and master the outlines, components, anchors, metrics, code points and properties that changed; Font Info fields, masters, instances, axes, kerning and groups, and feature code, field by field. Masters are matched by axis location, then by name. Each change has an id that sources merge accepts. Exit status 1 when the sources differ."
ref = "Our design, after the reference vendor's free source-comparison companion tool"
status = "inferred"
own = true
guesses = ["Masters and instances are matched by axis location first and by name second, and glyphs by name; a renamed glyph is reported as a rename when its outlines and code points are unchanged. A comparison with the companion tool on two versions of one font would settle it.", "A change id is the part name and a hash of the change's place and both values (`glyphs:3f2a1c9b04de`), so it is stable between runs and changes when either side changes; the companion tool's own way of naming changes would settle it.", "Kerning groups are compared per glyph under the kerning part, and the non-kerning glyph groups of a UFO under the features part; how the companion tool groups them would settle it."]
notes = "Text output: one line per change with its id, kind, place and short values. --glyphs and --glyph-file take plain glyph names; the shared glyph-list grammar (ranges, code points, patterns) is not applied yet. Values are compared in the native file's form, so data a format keeps unread (extra keys) takes part."

[[cli]]
id = "sources merge"
usage = "fontcraft-cli sources merge BASE OTHER (--take ID,... | --take-all) [--parts LIST] [--glyphs LIST] (-o OUT | --in-place)"
options = [
  "BASE: the source the changes are applied to; OTHER: the source they are taken from",
  "--take ID,...: the change ids printed by sources diff",
  "--take-all: every change of the selected parts and glyphs",
  "--parts LIST, --glyphs LIST, --glyph-file PATH, --tolerance UNITS: limit --take-all, as in sources diff",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "source.merge"
equivalents = []
area = "cli-tools"
milestone = "M12"
summary = "Applies chosen changes from OTHER to BASE and writes the result in BASE's format: the change ids printed by sources diff, or every change of some parts or glyphs. A change whose place in BASE no longer matches what the diff saw is refused, and then nothing is written. BASE is replaced only with --in-place."
ref = "Our design, after the reference vendor's free source-comparison companion tool"
status = "inferred"
own = true
guesses = ["Merging is two-way only (base and other), with no common ancestor; a three-way merge needs version history, which FontCraft does not keep. A user workflow that needs three-way merging would settle it.", "Without -o or --in-place the merge is refused rather than written beside BASE under a derived name; a user who expects a default output name would settle it."]
notes = "--glyphs and --glyph-file take plain glyph names; the shared glyph-list grammar (ranges, code points, patterns) is not applied yet."

