  "--exclude ID_OR_GLOB: leave matching checks out; repeatable",
  "--group NAME: run only the checks of this group; repeatable",
  "--glyphs SELECTOR, --glyphs-file FILE: restrict glyph-level checks to these glyphs",
  "--master ID: restrict to these masters; repeatable",
  "--set CHECK.NAME=VALUE: override a threshold of a check; repeatable",
  "--min-severity info|warn|fail: lowest severity that is reported; default info",
  "--fail-on info|warn|fail: lowest severity that makes the exit status 1; default fail",
  "--all: examine every glyph, ignoring the cache of unchanged glyphs",
  "--network: allow the checks that need network access",
