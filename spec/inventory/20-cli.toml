  "--automation-write-root DIR: every file a command writes must lie inside DIR; given once; implies --headless",
  "--read-only: expose only commands that do not modify documents or files",
  "--allow PATTERN, --deny PATTERN: restrict the exposed commands by id pattern; repeatable",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = ""
equivalents = []
area = "cli-tools"
milestone = "M13"
summary = "Runs a Model Context Protocol server that exposes the command registry as tools, one tool per engine command with its parameter schema, plus resources for open documents. Agents then drive FontCraft headless exactly as the CLI does."
ref = "brief.md › MCP server dispatches the same commands"
status = "inferred"
notes = "Built: stdio transport, `--connect` and `--headless`; tools list_commands, run_command and inspect_document; `--read-only`, `--allow` and `--deny` command patterns; `--automation-read-root` and `--automation-write-root`, which the engine enforces on every command's declared file parameters, the places commands use without a parameter and the files a document links to (a link outside the read root is a missing file); the desktop app takes the same flags and FONTCRAFT_AUTOMATION_READ_ROOT / FONTCRAFT_AUTOMATION_WRITE_ROOT for its control channel (docs/mcp.md, Permissions; docs/control-protocol.md); logging/setLevel with notifications/message; five workflow prompts; resources for the document, glyphs, commands, custom parameters and features; completion/complete for glyph names, command ids, parameter names, feature tags and master names. `--transport http` with `--listen ADDR` serves the streamable HTTP transport at /mcp on a small HTTP/1.1 server of our own (no dependency), loopback by default, with sessions, per-session log levels, event-stream replies that carry the log notifications, and capped heads, bodies, connections, sessions and message rate (docs/mcp.md, HTTP transport). The summary's one tool per command is not how it works: run_command reaches every command, and list_commands describes them."
guesses = [
  "`--read-only` admits only commands that declare themselves queries; `--allow` and `--deny` take shell-style patterns over command ids, deny winning. No reference has such options; settled by the sibling apps' conventions.",
  "File access is unrestricted by default; `--automation-read-root` and `--automation-write-root` each take one folder, grant read and write access separately, and are an error with `--connect`. No reference has such options; settled by the sibling apps' conventions.",
  "Macro, recent-document and URL commands are refused while a root, `--read-only`, `--allow` or `--deny` is set, because their files and steps are not in their parameters; agents' needs would settle whether a checked macro runner is worth building.",
  "No log notifications are sent until the client calls logging/setLevel; the protocol leaves the default to the server, and client feedback would settle it.",
  "The five prompts are start_family, add_master, build_accented_glyphs, kern_pair_list and prepare_release, with the steps of docs/mcp.md; agents' use of them would settle the wording.",
  "The HTTP transport listens on 127.0.0.1:7986 by default, next to the app's control port 7985; the sibling apps' choice, once one serves HTTP, would settle it.",
  "All HTTP sessions share one backend and so one document, each with its own log level, and a 65th session ends the one unused for longest; agents' use of several sessions would settle it.",
  "The HTTP transport admits a request with an Origin header only when it is the server's own origin, refusing every web page; a browser-based MCP client that needs access would settle it.",
]

[[cli]]
id = "bench"
usage = "fontcraft-cli bench [--runs N] [--warmup N] [--compare COMMAND]... [--stages] [--save FILE] [--baseline FILE] [--threshold PCT] [--json] SUBCOMMAND [ARGS...]"
options = [
  "SUBCOMMAND [ARGS...]: the fontcraft-cli invocation to time; it comes after bench's own options (or after --)",
  "--runs N: timed repetitions; default 10",
  "--warmup N: untimed runs first; default 1",
  "--compare COMMAND: also time this reference command line (quoted, found on PATH), for example 'fontc Source.glyphs'; may be repeated",
  "--stages: include the per-stage timing table of one more run with --timing",
  "--save FILE / --baseline FILE: store the result, or compare with a stored result and exit 1 on a slowdown beyond --threshold PCT (default 10)",
  "--json: print the result as JSON instead of text",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = ""
equivalents = [
  "cu2qu: benchmark module",
  "qu2cu: benchmark module",
]
area = "cli-tools"
milestone = "M12"
summary = "Times a subcommand: runs it several times on the given inputs, discards its outputs, and reports the minimum, median and spread of wall time and peak memory together with the per-stage breakdown. It can run reference tools found on PATH on the same input for a side-by-side figure."
ref = "fontTools cu2qu/benchmark.py, qu2cu/benchmark.py; fontc --emit-timing; fontmake --timing"
status = "inferred"
notes = "Built in M12.43. Each run is a child process with its output discarded, so the figures include process start-up for us and for the reference tools alike. The figures are minimum, median, maximum and sample standard deviation of wall time (ms) and of peak resident memory (KiB, the VmHWM sampled every millisecond from /proc: Linux only, a lower bound for very short runs). A run of ours completes with exit status 0 or 1 (1 means it found something); a reference tool must exit 0, and one that fails or is not on PATH is reported in its entry without failing the run. --baseline compares the median wall time only; a timed subcommand that fails stops bench with exit status 4. --stages adds the standard error of one extra run with --timing, and reports none while the subcommand refuses that option. Limits: --runs 1 to 10,000, --warmup up to 1,000, 16 --compare lines, a stored result of at most 1 MiB."
guesses = [
  "Bench's options come before the timed subcommand and everything from the subcommand on is timed, so a subcommand's own options (such as --json) never clash with bench's; the reference benchmark modules take no such command line, so use will settle it.",
]

