[[cli]]
id = "glyphs rename"
usage = "fontcraft-cli glyphs rename FONT (--goadb FILE | --map FILE | --production-names | OLD=NEW...) [-o OUT | --in-place]"
options = [
  "OLD=NEW...: individual renames",
  "--goadb FILE: rename from the second column (source name) to the first (final name)",
  "--reverse: apply a GOADB or map in the other direction",
  "--map FILE: two-column text file, new name then old name, '#' comments",
  "--production-names: derive names from code points (uniXXXX, uXXXXX) and AGLFN",
  "--update-unicodes: also set code points from the GOADB's third column",
  "--order: also reorder as the GOADB or map lists the glyphs (CFF standard-string glyphs first, unlisted glyphs last in their old order)",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.renameGlyphs"
equivalents = [
  "tx: -gf; -gr; -go",
  "makeotf: -ga with -gf",
]
area = "cli-tools"
milestone = "M12"
summary = "Renames glyphs everywhere they are referenced: outline table, post or CFF names, and for sources also components, kerning, groups and feature code. Names come from a GOADB (source name to final name), a two-column map, the production-name rules, or pairs on the command line. Renaming two glyphs to the same name is an error."
ref = "AFDKO tx -gf / -gr, MakeOTFUserGuide.md › GlyphOrderAndAliasDB; mergefonts glyph alias file"
status = "docs"
notes = "Built in M12.15 (crates/tables/src/rename.rs, cmd/glyph_order_file.rs). A compiled font gets new names in post (version 2) and, for a CFF font, in the charset; a CID-keyed font is refused. A source is renamed with the model's rename, so components, kerning, groups and the glyph order parameter follow; feature code is not rewritten yet: the result lists where an old name is still used. --update-unicodes works on sources only; on a compiled font it is refused."
guesses = [
  "Names a GOADB or map lists that the font lacks are reported as missing, not refused, since one GOADB serves a whole family. Settled by running tx -gf with a GOADB that names an absent glyph.",
]

[[cli]]
id = "glyphs reorder"
usage = "fontcraft-cli glyphs reorder FONT (--order-file FILE | --goadb FILE | --sort KEY | NAME...) [-o OUT | --in-place]"
options = [
  "NAME...: the new order given directly",
  "--order-file FILE: one glyph name per line",
  "--goadb FILE: order of the GOADB's rows",
  "--sort unicode|name|cid|size: derive the order from a key instead of a list",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.reorderGlyphs"
equivalents = [
  "ttLib.reorderGlyphs: reorderGlyphs(font, new_glyph_order)",
  "tx: -go; +b / -b",
]
area = "cli-tools"
milestone = "M12"
summary = "Changes the glyph order of a font and rewrites everything indexed by glyph: outlines, metrics, cmap, coverage and class tables in GDEF/GSUB/GPOS, variation data, colour tables. The new order must contain every glyph exactly once, except that glyphs left unnamed keep their relative order at the end; .notdef stays at index 0."
ref = "fontTools ttLib.reorderGlyphs (library); AFDKO tx -go, +b"
status = "docs"
notes = "Built in M12.15 (crates/tables/src/reorder.rs). Compiled fonts: glyf and loca, hmtx and vmtx (with the long-metric counts), cmap, post, CFF, GDEF, GSUB, GPOS, kern, gvar, HVAR, VVAR, VORG, hdmx and LTSH are rewritten, as fontTools ttLib.reorderGlyphs does through its object model; a font with CFF2, colour, bitmap, MATH, JSTF, SVG or Apple layout tables is refused. Unlike reorderGlyphs, a partial order is accepted (the rest follows in its old order). An HVAR or VVAR without an advance mapping gets an explicit one, since the implicit mapping goes by glyph id. Sources: unicode and name sorting only."
guesses = [
  "--sort unicode puts encoded glyphs first by their lowest code point and keeps the unencoded ones after them in their old order. Settled by tx's +b ordering on a font with unencoded glyphs.",
  "--sort size sorts by the byte size of each glyph's outline data (glyf entry or charstring), smallest first. Settled by finding a reference tool that documents a size order.",
  "A post version 3 TrueType font, which stores no names, gets the names glyphNNNNN; fontTools derives names from cmap instead. Settled by comparing glyph orders with fontTools on such a font.",
]

[[cli]]
id = "metrics"
usage = "fontcraft-cli metrics FONT... [--format text|json|csv|afm] [--precision integer|real] [--aggregate-bbox] [--kerning] [--statistics] [--glyphs SELECTOR]"
options = [
  "--format text|json|csv|afm: plain listing (default), structured data, or an Adobe Font Metrics file",
  "--precision integer|real: round values to integers (default) or print exact values",
  "--aggregate-bbox: add the font bounding box and name the glyph that sets each of its four edges",
  "--sidebearings: add left and right (and for vertical fonts top and bottom) side bearings",
  "--units font|1000: values in the font's units (default) or rescaled to 1000 per em",
  "--kerning: add the kerning pairs, flattened from GPOS (or the kern table when there is no GPOS kerning)",
  "--statistics: add per-glyph area, centre of mass, variance, covariance, correlation and slant computed from the filled outline, and the glyph-averaged values for the font",
  "--control-box: with --statistics, measure the control polygon instead of integrating the curves",
  "--font-only: with --statistics, print only the font-wide values",
  "--glyphs SELECTOR, --exclude-glyphs SELECTOR, --fd LIST: restrict the glyphs",
  "--location AXIS=VALUE...: measure a variable font at this location; default the default instance",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.reportMetrics"
equivalents = [
  "tx: -mtx -0 / -1; -mtx -2 / -3; -afm; -g / -gx / -fd / -fdx; -U",
  "spot: -t hmtx=5 / =6; -t hmtx=7 / =8; -t kern=5, -t GPOS=6",
  "pens.statisticsPen: font [glyph…]; -y; -c / --control; -q / --quiet; --variations",
]
area = "cli-tools"
milestone = "M12"
summary = "Reports glyph metrics computed from the outlines: per glyph the identity, advance width and exact bounding box, optionally side bearings, the font-wide bounding box with the glyphs that set each edge, the kerning pair list, and shape statistics (area, centre of mass, slant). It can also write an AFM file."
ref = "AFDKO tx -mtx / -afm help, spot hmtx and kern views; fontTools pens.statisticsPen, cffLib.width"
status = "docs"
notes = "Statistics are reported in font units (the statistics pen scales to the em first); the area is signed, negative for clockwise outer contours as in TrueType. Bounds checked against tx -mtx -1 and statistics against pens.statisticsPen on a font built with fontTools. Not yet: vertical side bearings, sources as input (compile first), re: items in glyph lists; --location needs the instancer (M12.20)."
guesses = [
  "The text form adds statistics, font-statistics and kerning sections in the same bracketed style as the glyph lines; a comparison with a future tx release or user feedback would settle the layout.",
  "Glyph names come from post, then the CFF charset, then uniXXXX from the cmap, then glyphNNNNN, with #n added to repeats as fontTools does; tx's own fallback names (g1, g2) were not followed.",
  "With several fonts on the command line the text forms print a '## FONT' line before each report.",
]

[[cli]]
id = "convert"
usage = "fontcraft-cli convert IN OUT [options] | convert INPUT... --to FORMAT [-o PATH | --output-dir DIR] [options]"
options = [
  "IN OUT: the two-argument form the sibling Crafting Apps use: the output format is the one OUT's extension names",
  "INPUT...: binary font, bare CFF/CFF2, Type 1 (PFA, PFB or decrypted text), TTX XML, or a source",
  "--to FORMAT: ttf | otf | otf-cff2 | cff | cff2 | pfa | pfb | t1-text | ttx | ufo | ufoz | designspace | glyphs | native | svg-font",
  "--container plain|woff|woff2: wrap a binary result; default plain",
  "--name-by filename|postscript-name: default output name from the input file name or from the font's PostScript name",
  "--max-error EM: largest cubic-to-quadratic deviation as a fraction of the em when producing TrueType outlines; default 0.001 (AFDKO otf2ttf states the bound in font units, default 1.0)",
  "--curve-conversion optimized|exact: quadratic to cubic: merge adjacent segments where the result stays within tolerance (default), or convert each segment exactly",
  "--keep-direction: do not reverse contours when changing between cubic and quadratic flavours",
  "--post-format 2|3: with TrueType or CFF2 output keep glyph names (2, default) or drop them (3)",
  "--subroutinize / --no-subroutinize, --max-subrs N: CFF and CFF2 subroutines; default off for bare CFF output, on for OTF",
  "--charstring-optimize specialize|none: use the compact operator forms (default) or only the general ones",
  "--optimize-widths / --no-optimize-widths: choose defaultWidthX/nominalWidthX to minimise size (default) or not",
  "--keep-glyph-order: do not let the CFF writer reorder glyphs to save space (.notdef still goes first)",
  "--goadb-order: order glyphs as the GOADB lists them",
  "--flatten-seac: turn seac accented composites into plain paths and drop dotsection",
  "--cff-embed-minimal: drop purely descriptive Top DICT entries, for fonts meant to be embedded",
  "--dedupe-family-blues: drop FamilyBlues and FamilyOtherBlues when they equal BlueValues and OtherBlues (default on)",
  "--standard-encoding: give a bare CFF or Type 1 result StandardEncoding",
  "--allow-missing-notdef: do not add a .notdef when the input has none",
  "--warn-hints / --no-warn-hints: report glyphs without stem hints and duplicate hint-substitution groups",
  "--remove-overlaps, --ignore-overlap-errors: merge overlapping contours while converting; with the second option glyphs that fail are kept as they are",
  "--no-hints: drop stem hints or TrueType instructions instead of carrying them over",
  "--t1-leniv N: charstring encryption padding for Type 1 output: 4 (default), 1, 0, or -1 for unencrypted charstrings",
  "--keep-unique-id / --no-keep-unique-id: keep or remove UniqueID and XUID in Type 1 output (default remove)",
  "--newline lf|cr|crlf: line ending for text formats (Type 1, TTX, SVG)",
  "--cid-keyed[=R-O-S], --cid-info FILE: make a name-keyed font CID-keyed, with Adobe-Identity-0 or the given registry-ordering-supplement and optionally a cidfontinfo file for the top-level dictionary",
  "--decid, --fd N: make a CID-keyed font name-keyed; glyphs must come from one font dict (select with --fd-select) unless --fd forces a dict's hint values onto all; glyphs are named cidN",
  "--glyphs SELECTOR, --exclude-glyphs SELECTOR, --fd-select LIST, --exclude-fd LIST: convert only part of the glyph set",
  "--goadb FILE, --no-rename, --subset-to-goadb: rename glyphs through a GOADB while converting, use it without renaming, or keep only the glyphs it lists",
  "--location AXIS=VALUE..., --no-clamp: take a snapshot of a variable or multiple-master font at this location first; do not clamp to the axis ranges",
  "--layer NAME|default|processed, --write-layer NAME: UFO layer to read and to write",
  "--ufo-version 2|3, --ufo-structure package|zip|json, --indent-json: form of UFO output",
  "--skip-export-key public|glyphs: when writing UFOs from a .glyphs source, store export flags in public.skipExportGlyphs (default) or in the older per-glyph lib key",
  "--emit-designspace PATH, --master-dir DIR, --family-name NAME: where the designspace and master UFOs go when a multi-master source is converted",
  "--smart-components components|outlines: when writing a UFO or designspace, keep smart components as components with their values (default) or draw them as interpolated outlines (export.ufoSmartComponentsAsOutlines)",
  "--normalize: write sources in canonical form: sorted keys, fixed number formatting and indentation",
  "--svg-glyph-names none|non-ascii|all, --svg-absolute, --svg-standalone: SVG-font output: which glyphs carry glyph-name attributes, absolute instead of relative path coordinates, and a complete SVG document instead of a font fragment",
  "--recalc-bounds / --no-recalc-bounds: recompute bounding boxes when compiling TTX (default) or trust the values in the dump",
  "--rebuild-tables TAG,...|all: parse and re-serialise these tables instead of copying their bytes when the format does not change",
  "--optimize-for size|speed: favour small files (default) or simpler structures that text engines process faster (glyf, gvar)",
  "--zopfli: with --container woff, use the slower, denser compressor",
  "--validate-sources: strict validation while reading UFO and designspace input",
  "--allow-virtual-gids: accept glyph references beyond the glyph count when compiling TTX",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
