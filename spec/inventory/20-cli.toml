[[cli]]
id = "transform"
usage = "fontcraft-cli transform FONT [--rotate DEG] [--translate X,Y] [--scale SX[,SY]] [--slant DEG] [--matrix A,B,C,D,E,F] [--upem N] [--glyph-table FILE] [--widths auto|keep|transform|em] [-o OUT]"
options = [
  "--rotate DEG: rotate clockwise about the origin by this many degrees",
  "--translate X,Y: shift after the other operations",
  "--scale SX[,SY]: scale factors; SY defaults to SX",
  "--slant DEG: shear horizontally by this angle",
  "--matrix A,B,C,D,E,F: explicit matrix, x' = a·x + c·y + e, y' = b·x + d·y + f; excludes the four options above",
  "--scale-em: with a matrix or --scale, also scale the units per em by the horizontal factor so the design keeps its apparent size",
  "--upem N: set units per em to N and scale outlines, metrics, kerning, positioning values, hint values and variation deltas accordingly",
  "--glyph-table FILE: lines of 'source-name output-name advance x-offset y-offset' ('#' comments; 'None' keeps the advance); only listed glyphs are written, with their own offsets replacing --translate; names are CIDs for a CID-keyed font; .notdef must be listed",
  "--widths auto|keep|transform|em: advance widths: transform them when the matrix has no rotation, a half turn or only a horizontal shear and set them to the em for quarter turns (auto, default); pass through; always transform; always the em",
  "--glyphs SELECTOR, --exclude-glyphs SELECTOR, --fd LIST, --exclude-fd LIST: transform and write only these glyphs",
  "--to FORMAT: output format when it should differ from the input's",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.transform"
equivalents = [
  "rotatefont: -rt degrees xOffset yOffset; -matrix a b c d e f; -fm; -rtf; -row / -rtw / -rew; -g / -gx / -fd / -fdx; -t1 / -cff and the other tx options; -u / -h / -v",
  "ttLib.scaleUpem: font new-upem; --output-file",
]
area = "cli-tools"
milestone = "M12"
summary = "Applies one affine transformation to every glyph of a font (rotation, shift, scale, slant or an explicit matrix), or changes the units per em and scales the whole font to match. A per-glyph table can rename glyphs and set individual offsets and advance widths, which is how rotated copies of Latin glyphs are produced for vertical CJK text."
ref = "AFDKO rotatefont usage and help; fontTools ttLib.scaleUpem"
status = "docs"
notes = "M12.24: built for TrueType-flavoured fonts: --rotate, --translate, --scale, --slant, --matrix, --scale-em, --upem, --widths, --glyphs and --exclude-glyphs, with -o, --output-dir, --in-place, --no-clobber, --face and --json. A source takes --upem only. Not built: --glyph-table, --fd and --exclude-fd, --to, CFF and CFF2 outlines, and a matrix on a variable font. The rotation direction and the auto width rule were checked by running rotatefont 5.0.1 on a corpus OpenType font: -rt turns clockwise, and the advance becomes a·w + e when the matrix's b is 0 (a half turn included, giving negative widths there) and the em otherwise; the help text's rule in terms of the third value does not match what the tool does."
guesses = ["A negative advance width, which rotatefont writes into CFF, is set to 0 with a warning because hmtx cannot hold it; a font that relies on such widths would settle it.", "On a TrueType font a matrix strips the instructions of every changed glyph, drops fpgm, prep, cvt and cvar when no glyph keeps instructions, and drops hdmx, LTSH and VDMX whenever a glyph or width changed; rotatefont writes only CFF, so a TrueType user would settle it.", "A matrix leaves vmtx, post.italicAngle, the hhea caret slope, kerning and GPOS as they are, as rotatefont leaves everything but outlines and widths; a user of slanted output would settle whether the slant should reach italicAngle."]

[[cli]]
id = "optimize"
usage = "fontcraft-cli optimize FONT... [--for size|speed] [--subroutinize | --desubroutinize] [--cff-widths] [--charstrings specialize|generalize] [--gpos-compaction N] [--varstore] [--gvar-iup] [options] [-o OUT]"
options = [
  "--for size|speed: preset: smallest file (default) or structures that are cheaper to read (short loca avoided, gvar and glyf written without sharing tricks)",
  "--subroutinize, --max-subrs N: factor repeated charstring fragments of CFF/CFF2 into subroutines, at most N of them",
  "--desubroutinize: expand all subroutines",
  "--charstrings specialize|generalize: rewrite charstrings with the compact operator forms, or with general operators only",
  "--cff-widths[=exhaustive]: choose the defaultWidthX and nominalWidthX that minimise the charstring bytes; 'exhaustive' tries every candidate instead of the fast search",
  "--gpos-compaction N: 0 leaves pair kerning as is; 1 to 8 split each class-kerning subtable into at most that many extra subtables when this halves its size; 9 splits as far as size keeps dropping",
  "--varstore[=QUANTUM]: merge and re-pack the item variation store shared by GDEF and GPOS; QUANTUM rounds deltas to multiples of that many units first (default 1, lossless)",
  "--gvar-iup / --no-gvar-iup: drop gvar deltas that interpolation of untouched points reproduces, or write every delta",
  "--drop-implied-oncurves: remove TrueType on-curve points that lie exactly midway between their off-curve neighbours",
  "--colr-layer-reuse: share identical layer sequences in COLR",
  "--canonical-order: write tables in the recommended order",
  "--report: only measure: print per-table size now and after each optimisation without writing",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.optimize"
equivalents = [
  "otlLib.optimize: font -o; --gpos-compression-level; -v / --verbose / -q / --quiet",
  "cffLib.width: FILE…; -b / --brute-force",
  "cffLib.specializer: --font FONTFILE, -o / --output-file",
  "varLib.varStore: fontfile [outfile]; --quantization",
  "tx: +S; -S; -maxs; +W",
  "fontmake: --optimize-cff 0|1|2; --no-optimize-gvar; --drop-implied-oncurves",
  "varLib: --disable-iup, --no-colr-layer-reuse, --drop-implied-oncurves",
  "pyftsubset: --desubroutinize; --canonical-order",
  "ttx: --optimize-font-speed",
  "ttLib: --optimize-font-speed",
]
area = "cli-tools"
milestone = "M12"
summary = "Re-encodes parts of an existing binary font more compactly, or more simply for speed, without changing how it renders or shapes: CFF subroutines and operator forms, CFF default and nominal widths, class-kerning subtable layout, shared variation-store data, gvar delta optimisation, implied on-curve points and table order. Without options it applies every lossless size optimisation."
ref = "fontTools otlLib.optimize, cffLib.width, cffLib.specializer, varLib.varStore, config (GPOS compression level), ttx --optimize-font-speed; AFDKO tx +S/-S, +W/-W; fontmake --optimize-cff, --subroutinizer"
status = "docs"

