]
command = "font.subset"
equivalents = [
  "pyftsubset: font-file, glyph…; --gids / --gids-file; --glyphs / --glyphs-file; --text / --text-file; --unicodes / --unicodes-file; --ignore-missing-glyphs / --no-ignore-missing-glyphs; --ignore-missing-unicodes / --no-ignore-missing-unicodes; --output-file; --flavor; --with-zopfli; --retain-gids; --notdef-glyph / --no-notdef-glyph; --notdef-outline / --no-notdef-outline; --recommended-glyphs / --no-recommended-glyphs; --layout-closure / --no-layout-closure; --bidi-closure / --no-bidi-closure; --layout-features[+|-]=; --layout-scripts[+|-]=; --hinting / --no-hinting; --hinting-tables; --desubroutinize / --no-desubroutinize; --drop-tables; --no-subset-tables; --passthrough-tables / --no-passthrough-tables; --legacy-kern / --no-legacy-kern; --name-IDs; --name-legacy / --no-name-legacy; --name-languages; --obfuscate-names; --glyph-names / --no-glyph-names; --legacy-cmap / --no-legacy-cmap; --symbol-cmap / --no-symbol-cmap; --recalc-bounds / --no-recalc-bounds; --recalc-timestamp / --no-recalc-timestamp; --canonical-order / --no-canonical-order; --prune-unicode-ranges / --no-prune-unicode-ranges; --prune-codepage-ranges / --no-prune-codepage-ranges; --recalc-average-width / --no-recalc-average-width; --recalc-max-context / --no-recalc-max-context; --font-number; --pretty-svg; --verbose; --timing; --option=? (query current value)",
  "tx: -g; -gx; -fd / -fdx; -p; -P; -pg; -gs with -gf",
  "mergefonts: one source font with -g / -gx or a glyph alias file",
  "makeotf: -gs",
  "fontmake: --subset / --no-subset",
