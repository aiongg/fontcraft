  "--baseline N: y position of the baseline inside the em box; default from BASE, else -120 for CID-keyed fonts, else 0",
  "--show LIST / --hide LIST: turn drawing elements on or off: em-box, bbox, advance, baseline, zones, hhints, vhints, points, handles, point-labels, contour-labels, center-marks, name, numeric-labels, sidebearings, hint-counts, path-counts, filled-thumbnail",
  "--point-labels LIST: what a point label contains: index, type, position",
