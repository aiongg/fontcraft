[[cli]]
id = "subset"
usage = "fontcraft-cli subset FONT [GLYPH...] [--unicodes LIST] [--text STRING] [--glyphs LIST] [--gids LIST] [options] [-o OUT]"
options = [
  "GLYPH...: glyph names to keep; '*' keeps all glyphs",
  "--glyphs LIST, --glyphs-file FILE: glyphs to keep, in the shared selector grammar",
  "--gids LIST, --gids-file FILE: glyph indices and ranges to keep (10-12,14)",
  "--unicodes LIST, --unicodes-file FILE: code points and ranges in hex, with or without U+; '*' keeps every mapped character",
  "--text STRING, --text-file FILE: keep the characters of this UTF-8 text; line breaks in the file are not added",
  "--exclude-glyphs LIST, --exclude-glyphs-file FILE: keep everything except these glyphs (never removes .notdef)",
  "--fd LIST, --exclude-fd LIST: keep or drop the glyphs of these font dicts of a CID-keyed font",
  "--random PERCENT, --seed N|random: keep a random share of the glyphs (at least one); the default seed is derived from the font so the choice repeats",
  "--goadb FILE: keep only the glyphs named in the first two columns of the GOADB",
  "--export-flags: keep only glyphs the source marks as exported (sources only)",
  "--ignore-missing-glyphs / --no-ignore-missing-glyphs: tolerate requested glyphs or indices the font lacks; default error",
  "--ignore-missing-unicodes / --no-ignore-missing-unicodes: tolerate requested characters the font lacks; default tolerate",
  "--retain-gids: keep glyph indices stable by leaving emptied glyphs in place",
  "--notdef-glyph / --no-notdef-glyph: keep .notdef (default); dropping it is refused for CFF fonts",
  "--notdef-outline / --no-notdef-outline: keep the outline of .notdef or empty it (default empty)",
  "--recommended-glyphs / --no-recommended-glyphs: also keep glyphs 1 to 3 (.null, CR, space) of a TrueType font; default no",
  "--layout-closure / --no-layout-closure: add glyphs that retained features can substitute in (default), or only trim rules to the given set",
  "--bidi-closure / --no-bidi-closure: add the mirrored partner of kept bidirectional characters (default on)",
  "--layout-features LIST: features to keep; default a core set (calt ccmp clig curs dnom frac kern liga locl mark mkmk numr rclt rlig rvrn and those script shaping requires); '*' all, empty none",
  "--layout-scripts LIST: scripts to keep, optionally with language as script.LANG; default all",
  "--hinting / --no-hinting: keep hints (default) or strip glyph hints, the tables in --hinting-tables and hint-related data in other tables",
  "--hinting-tables LIST: font-wide tables removed by --no-hinting; default cvt cvar fpgm prep hdmx VDMX",
  "--desubroutinize / --no-desubroutinize: expand CFF subroutines or only discard unused ones (default)",
  "--drop-tables LIST: tables removed outright; default JSTF DSIG EBDT EBLC EBSC PCLT LTSH and the Graphite tables Feat Glat Gloc Silf Sill",
  "--no-subset-tables LIST: tables copied without subsetting; default avar BASE fvar gasp head hhea maxp vhea OS/2 loca name cvt fpgm prep VDMX DSIG CPAL MVAR cvar STAT",
  "--passthrough-tables / --no-passthrough-tables: keep tables the subsetter does not understand, or drop them (default)",
  "--legacy-kern / --no-legacy-kern: keep the kern table even when GPOS exists; default drop it then",
  "--name-ids LIST: name IDs to keep; default 0 to 6; '*' all",
  "--name-languages LIST: language IDs to keep; default 0x409; '*' all",
