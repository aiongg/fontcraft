[[command]]
id = "font.transform"
label = "Transform Font"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, matrix?: [a, b, c, d, e, f], rotate?: degrees, translate?: {x: number, y: number}, scale?: {x: number, y?: number}, slant?: degrees, scaleEm?: bool, unitsPerEm?: int, glyphTable?: path | [{source: name, output: name, advance?: number, x: number, y: number}], widths?: \"auto\"|\"keep\"|\"transform\"|\"em\", glyphs?: selector, excludeGlyphs?: selector, fd?: [int], excludeFd?: [int], to?: string, output?: path, inPlace?: bool}"
area = "cli-tools"
milestone = "M12"
summary = "Applies one affine transform to all (or selected) glyphs of a binary font or source, with advance widths handled by the chosen policy and hints kept where the transform allows, or rescales the entire font to a new units-per-em value. Returns the matrix applied and whether hints were kept."
ref = "docs/spec/20-cli.md › transform"
status = "docs"
notes = "M12.24: returns {output, matrix, unitsPerEm: {from, to} | null, hintsKept, glyphsChanged, tablesChanged, tablesRemoved, warnings}. Also takes outputDir and noClobber (file plumbing). glyphs and excludeGlyphs take glyph names. A source takes unitsPerEm only, scaled as font.info.scaleToUnitsPerEm scales it. Units per em on a compiled font follow fontTools ttLib.scaleUpem table by table (glyf, hmtx, vmtx, head, hhea, vhea, OS/2, post, VORG, kern format 0, gvar, GPOS, GDEF, BASE and the item variation stores of GDEF, BASE, HVAR, VVAR and MVAR), with composite bounds, head bounds and the hhea and vhea extremes worked out again as fontTools does on saving; head.modified is kept where fontTools sets it to the time of saving. Beyond scaleUpem, cvt and cvar values scale too, as docs/spec/20-cli.md says. MATH, COLR, VARC and the Apple and Graphite tables are kept unscaled with a warning, and CFF and CFF2 fonts are refused; scaleUpem scales MATH, COLR and CFF. Not built: glyphTable, fd, excludeFd and to (refused with a message)."
guesses = ["A composite whose component glyph is transformed keeps showing it as before when the composite itself is not selected: the component's transform becomes the inverse of the matrix; a user transforming part of a font would settle whether the composite should follow its component instead.", "scaleEm multiplies units per em by the absolute value of the matrix's a and changes nothing else, as rotatefont's -fm changes only the FontMatrix; a TrueType user would settle whether metrics should follow."]

