# FontCraft feature inventory: the command-line tool suite (fontcraft-cli)
#
# Sources (all read from the permissively licensed reference checkouts, 2026-10-07):
#   AFDKO (Apache-2.0)      refs/afdko: docs/AFDKO-Overview.md, MakeOTFUserGuide.md, CommandLineHowTo.md,
#                           CFF2_Support.md, CIDKeyedUFOGuide.md, otfautohint_Notes.md, WinWeights.md;
#                           pyproject.toml [project.scripts]; python/afdko/*.py and c/* option help
#                           https://github.com/adobe-type-tools/afdko
#   fontTools (MIT)         refs/fonttools: Lib/fontTools/**/__main__.py and main() functions, ttx.py,
#                           subset/__init__.py documentation  https://github.com/fonttools/fonttools
#   fontmake (Apache-2.0)   refs/fontmake: README.md, Lib/fontmake/__main__.py
#                           https://github.com/googlefonts/fontmake
#   fontc (Apache-2.0/MIT)  refs/fontc: fontc/src/args.rs, ttx_diff, otl-normalizer, fontc_crater
#                           https://github.com/googlefonts/fontc
#
# Row kinds in this file:
#   [[behavior]]  cli.global.*   conventions shared by every subcommand
#   [[cli]]       one row per subcommand; multi-action subcommands have a parent row (command = ""
#                 unless the bare subcommand does work itself) and one row per action whose id is
#                 the two words typed on the command line
#   [[command]]   the engine commands those subcommands dispatch that are not editor menu items
#
# `equivalents` lists, per reference tool, the options the row replaces. The option-by-option
# mapping tables and the list of options deliberately not carried over are in docs/spec/20-cli.md.
# status: "docs" = capability and options taken from the reference documentation or help text;
#         "inferred" = our own design.


# ============================================================ conventions

[[behavior]]
id = "cli.global.inputDetection"
area = "cli-tools"
milestone = "M1"
summary = "Every input is identified by its content, never by its file name: sfnt version tag (TrueType, OTTO, ttcf), WOFF/WOFF2 signature, bare CFF/CFF2 header, Type 1 in PFA, PFB or decrypted-text form, TTX XML root element, UFO package or zip, designspace XML, .glyphs plist or package, native project. A mismatch between extension and content is only a warning."
ref = "AFDKO tx help (format detection from the first bytes); fontmake (detection by extension, not carried over)"
status = "docs"

[[behavior]]
id = "cli.global.output"
area = "cli-tools"
milestone = "M1"
summary = "-o/--output PATH names the single output; '-' means standard output. It is an error to give -o when a run produces more than one file, except where the subcommand documents a template. If -o names an existing directory the output goes into it under its default name."
ref = "makeotf -o; ttx -o; fontmake --output-path"
status = "docs"

[[behavior]]
id = "cli.global.outputDir"
area = "cli-tools"
milestone = "M1"
summary = "--output-dir DIR places every output in DIR under its default name and creates DIR when missing. Default names are the input stem plus the new extension, or the PostScript name for compiled fonts when --name-by postscript-name is given."
ref = "ttx -d; tx -dd; fontmake --output-dir; cu2qu -d"
status = "docs"

[[behavior]]
id = "cli.global.inPlace"
area = "cli-tools"
milestone = "M2"
summary = "A subcommand that modifies a font never writes over its input unless --in-place is given. Without -o, --output-dir or --in-place it writes next to the input with a suffix that names the operation (for example Font.subset.ttf). In-place writes go to a temporary file in the same directory and are renamed over the original only after the output has been written completely."
ref = "sfntedit (edits in place through a temporary file); otf2ttf --overwrite; checkoutlinesufo -o"
status = "docs"

[[behavior]]
id = "cli.global.overwrite"
area = "cli-tools"
milestone = "M1"
summary = "An existing output file is replaced by default; --no-clobber turns that into an error. The tool never invents a numbered alternative name."
ref = "ttx -f and ttx's default unique naming (the latter not carried over)"
status = "docs"

[[behavior]]
id = "cli.global.stdinStdout"
area = "cli-tools"
milestone = "M1"
summary = "'-' as an input reads one font from standard input (binary fonts, TTX and feature text; not directory formats such as UFO). With no -o, subcommands whose result is text (dump, info, metrics, diff, check, tables list, features decompile) write to standard output; subcommands whose result is a binary font require -o, --output-dir or --in-place and refuse to write binary data to a terminal."
ref = "tx help (stdin to stdout by default); ttx '-' input and '-o -'"
status = "docs"

[[behavior]]
id = "cli.global.batch"
area = "cli-tools"
milestone = "M1"
summary = "Most subcommands accept several inputs and process each independently; the shell expands globs, and on Windows the tool expands '*' and '?' itself. A directory argument is expanded only where the subcommand says so. With --json, one JSON object per input is written as a line. One failing input does not stop the others; the exit status then reports a partial failure."
ref = "tx -a/-A; ttfdecomponentizer -d; sfntdiff directory arguments"
status = "docs"

[[behavior]]
id = "cli.global.responseFiles"
area = "cli-tools"
milestone = "M12"
summary = "An argument of the form @FILE is replaced by the arguments read from FILE: whitespace-separated, double quotes group words, '#' starts a comment, newlines are ordinary whitespace. Response files do not nest. A file holding several complete command lines is run with 'fontcraft-cli run --script'."
ref = "tx -s; sfntedit -X; spot -X; sfntdiff -X; pyftmerge --input-file"
status = "docs"

[[behavior]]
id = "cli.global.optionsFile"
area = "cli-tools"
milestone = "M2"
summary = "--options FILE loads option values from a TOML file (keys are the long option names of the subcommand); an AFDKO .fpr project file is also accepted and translated. Options given on the command line override the file. --save-options FILE writes the effective option set of this run. Relative paths inside the file are resolved against the file's own directory."
ref = "makeotf -fp / -sp project files"
status = "docs"

[[behavior]]
id = "cli.global.optionOrder"
area = "cli-tools"
milestone = "M2"
summary = "When two options contradict each other the one given last wins, and an explicit option always beats an option implied by a bundle such as --release."
ref = "AFDKO MakeOTFUserGuide.md › MakeOTF options (order of application)"
status = "docs"

[[behavior]]
id = "cli.global.booleanFlags"
area = "cli-tools"
milestone = "M2"
summary = "Every on/off option has both spellings, --name and --no-name, so that either default can be overridden from a script or an options file. Tri-state options that default to the source's own setting take an optional value: --name, --name=true, --name=false."
ref = "makeotf -b/-nb pairs; pyftsubset --x/--no-x; fontc --flatten-components[=bool]"
status = "docs"

[[behavior]]
id = "cli.global.listValues"
area = "cli-tools"
milestone = "M2"
summary = "List-valued options take comma-separated values and may be repeated. A value whose items all start with '+' or '-' edits the default list instead of replacing it (--drop-tables=+GSUB,-BASE); '*' means everything and an empty value means nothing."
ref = "pyftsubset option syntax (=, +=, -=)"
status = "docs"

[[behavior]]
id = "cli.global.json"
area = "cli-tools"
milestone = "M0"
summary = "--json switches standard output to machine-readable JSON: one object per input with the keys input, ok, outputs, warnings, errors and a subcommand-specific result. Human-readable progress never appears on standard output in this mode. The result object is exactly what the engine command returns, so the CLI, the control channel and MCP agree."
ref = "ttx_diff --json; fontTools varLib.interpolatable --json"
status = "inferred"
own = true

[[behavior]]
id = "cli.global.exitCodes"
area = "cli-tools"
milestone = "M0"
summary = "Exit status: 0 success; 1 the run worked but found something (differences in diff, failed checks in check, lint errors); 2 command-line usage error; 3 an input could not be read or is not a supported format; 4 the operation failed; 5 some inputs of a batch failed and some succeeded; 130 interrupted. --quiet does not change the status."
ref = "ttx_diff exit codes (0 identical, 2 different); fontTools varLib.interpolatable --quiet"
status = "inferred"
own = true

[[behavior]]
id = "cli.global.logging"
area = "cli-tools"
milestone = "M0"
summary = "Diagnostics, warnings, progress and timing go to standard error, each line prefixed with its level. -q shows errors only, the default shows warnings, -v adds informational messages, -vv adds debug output. --log takes a level or per-module levels (compile=debug,layout=warn). --log-file PATH writes the same stream to a file as well. Every message names the input it belongs to, and for compiled fonts the PostScript name."
ref = "fontc --log; fontmake --verbose LEVEL; otfautohint -v/-vv and --log; comparefamily -l; tx -N"
status = "docs"

[[behavior]]
id = "cli.global.color"
area = "cli-tools"
milestone = "M0"
summary = "--color auto|always|never controls ANSI colour in diagnostics and diffs; auto colours only when the stream is a terminal and NO_COLOR is unset."
ref = "fonttools diff --color"
status = "docs"

[[behavior]]
id = "cli.global.determinism"
area = "cli-tools"
milestone = "M2"
summary = "The same inputs and options produce byte-identical output on every platform and with every --jobs value: table order, glyph order, name-record order, subroutine numbering and hash-map iteration are all fixed. Nothing derived from the clock, the user name, the host, the working directory or absolute paths is written into a font. Version stamps of the tool are written only when asked for."
ref = "fontc ttx_diff (sets SOURCE_DATE_EPOCH so both compilers agree)"
status = "inferred"
own = true

[[behavior]]
id = "cli.global.timestamp"
area = "cli-tools"
milestone = "M2"
summary = "--timestamp keep|source|now|EPOCH controls head.created and head.modified. Compiling uses the source's date fields; editing an existing font keeps 'created' and keeps 'modified' unless the subcommand changed font data, in which case 'modified' is set from SOURCE_DATE_EPOCH when that variable is set and otherwise from the clock. 'keep' never touches either field."
ref = "ttx --recalc-timestamp/--no-recalc-timestamp; pyftsubset --recalc-timestamp; varLib.instancer --no-recalc-timestamp"
status = "docs"

[[behavior]]
id = "cli.global.faceSelection"
area = "cli-tools"
milestone = "M1"
summary = "--face selects a member of a collection by zero-based index, by PostScript name, or 'all'. A collection given to a single-font subcommand without --face is an error that lists the members, except for info, dump and tables list, which then report every member."
ref = "ttx -y; tx -i / -y; pyftsubset --font-number; otf2ttf --face-index; spot -o"
status = "docs"

[[behavior]]
id = "cli.global.glyphSelector"
area = "cli-tools"
milestone = "M1"
summary = "Glyph lists share one grammar: comma-separated items, each a glyph name, a glyph index (plain integer or gidN), a CID (/N or cidN), a code point (U+XXXX), a range (A..Z between two glyphs by glyph order, N-M between two integers or two CIDs, U+XXXX-YYYY between code points), re:PATTERN for a regular expression matched against whole names, or '*'. --glyphs-file and --exclude-glyphs-file read the same items from a file, separated by commas or whitespace, with '#' comments. Exclusion is applied after inclusion and never removes .notdef."
ref = "tx -g/-gx; otfautohint -g/--glyphs-file/-x; proofpdf -g/-gf; pyftsubset --glyphs/--gids/--unicodes; fontc --glyph-name-filter"
status = "docs"

[[behavior]]
id = "cli.global.locationSyntax"
area = "cli-tools"
milestone = "M12"
summary = "Design-space locations are written AXIS=VALUE with the axis tag or name, in user-space units; several are separated by spaces or commas. Subcommands that restrict rather than pin an axis also accept AXIS=MIN:MAX, AXIS=MIN:DEFAULT:MAX (an empty part keeps the current value) and AXIS=drop. A bare comma-separated number list is read in axis order."
ref = "fontTools varLib.instancer AXIS=LOC; tx -U"
status = "docs"

[[behavior]]
id = "cli.global.tableTags"
area = "cli-tools"
milestone = "M1"
summary = "Table tags shorter than four characters are padded with spaces ('cvt' means 'cvt '); tags are case-sensitive and more than four characters is an error. Where a tag is used in a file name, characters that are not letters or digits become '_' and trailing underscores are dropped."
ref = "AFDKO sfntedit help"
status = "docs"

[[behavior]]
id = "cli.global.parallelism"
area = "cli-tools"
milestone = "M2"
summary = "-j/--jobs N sets the number of worker threads; the default is the number of cores, 0 means the same, and a negative N means that many fewer than the core count with a minimum of one. Results never depend on N."
ref = "otfautohint -p; cu2qu -j"
status = "docs"

[[behavior]]
id = "cli.global.timing"
area = "cli-tools"
milestone = "M2"
summary = "--timing prints the time spent in each stage to standard error when the run ends; --trace FILE also writes the stages as a Chrome trace-event JSON file."
ref = "fontmake --timing; pyftsubset --timing; fontc --emit-timing"
status = "docs"

[[behavior]]
id = "cli.global.backtrace"
area = "cli-tools"
milestone = "M0"
summary = "Errors are printed as one message with its chain of causes and the location in the input (file, table, glyph, line and column for text sources). --backtrace adds the internal stack for bug reports."
ref = "otfautohint --traceback; feaLib --traceback; ttx -e"
status = "docs"

[[behavior]]
id = "cli.global.dryRun"
area = "cli-tools"
milestone = "M12"
summary = "--dry-run performs all reading, validation and planning and reports what would be written, without creating or changing any file."
ref = "docs/spec/20-cli.md › Conventions"
status = "inferred"

[[behavior]]
id = "cli.global.help"
area = "cli-tools"
milestone = "M0"
summary = "-h prints a one-screen usage summary, --help the full option reference, 'fontcraft-cli help SUBCOMMAND' the same text. --version prints the version; with -v it adds the build commit, target triple and the versions of the font-handling crates."
ref = "AFDKO tools -u (usage) / -h (help) / tx -v (component versions); fontc --vv"
status = "docs"

[[behavior]]
id = "cli.global.abbreviations"
area = "cli-tools"
milestone = "M12"
summary = "Subcommands and long options may be shortened to any unambiguous prefix when typed interactively; scripts should spell them out, and --json output always uses full names."
ref = "afdko invoker abbreviations (mo, ah, se …)"
status = "inferred"
guesses = ["A subcommand or long option may be shortened to any prefix that names exactly one subcommand, or one option of that subcommand; an ambiguous prefix is a usage error listing the candidates. No source fixes the rule; a user complaint about a clash would settle it."]

[[behavior]]
id = "cli.global.commandDispatch"
area = "cli-tools"
milestone = "M0"
summary = "Each subcommand builds a parameter object from its options and dispatches exactly one engine command (or, for the shells, a fixed sequence). 'fontcraft-cli run ID --params JSON' reaches the same command directly, so nothing is available from the CLI that an agent cannot also call."
ref = "docs/spec/20-cli.md › Conventions"
status = "inferred"
own = true

[[behavior]]
id = "cli.global.sourceOrBinary"
area = "cli-tools"
milestone = "M12"
summary = "Subcommands that edit outlines or hints accept both sources (UFO, designspace, .glyphs, native) and binary fonts. For a binary font only the tables that the operation concerns are rebuilt; every other table is carried over byte for byte."
ref = "docs/spec/20-cli.md › Conventions"
status = "inferred"

[[behavior]]
id = "cli.global.afdkoProcessedLayer"
area = "cli-tools"
milestone = "M12"
summary = "For UFO input the option --layer NAME|default|processed chooses the glyph layer to read. Without it the default layer is read; 'processed' selects the AFDKO layer com.adobe.type.processedglyphs when present and falls back to the default layer glyph by glyph. Tools that write corrected outlines or hints into a UFO write to the default layer unless --write-layer NAME is given."
ref = "AFDKO makeotf -f help; tx -ufo -altLayer; checkoutlinesufo -w; otfautohint -w"
status = "docs"


# ============================================================ subcommands

[[cli]]
id = "compile"
usage = "fontcraft-cli compile SOURCE... [--format FMT]... [--container plain|woff|woff2]... [-o PATH | --output-dir DIR] [options]"
options = [
  "SOURCE...: native project, .glyphs/.glyphspackage, .designspace, one or more .ufo, or a bare outline font; kind detected from content",
  "--afdko-project [DIR]: gather inputs by AFDKO default names in DIR (font.ufo, font.pfa, font.ps, font.txt, cidfont.ps; features or features.fea; fontinfo or cidfontinfo; FontMenuNameDB and GlyphOrderAndAliasDB in DIR or up to two levels above); implies --format otf and --layer processed",
  "--format FMT: ttf | otf | otf-cff2 | variable | variable-cff2 | ttf-interpolatable | otf-interpolatable; repeatable",
  "--container plain|woff|woff2: also wrap each output in this container; repeatable, default plain",
  "--output-layout flat|by-format: with --output-dir, put everything in one folder (default) or in per-format subfolders named as fontmake names them (master_ttf, instance_otf, variable_ttf …)",
  "--name-by filename|postscript-name: default output name from the source file name or from the PostScript name of each font",
  "--instances[=NAME,...]: build the export instances (the default), or only those named; until interpolation (M9) an instance is built only where it sits at a master, and the others are listed as skipped",
  "--masters-as-instances: also build each master as a static font",
  "--ttfautohint PATH: the trusted ttfautohint program; an autohinted TrueType font whose TTFAutohint binary path parameter names that same file is hinted by it, and no other program runs",
  "--variable-fonts REGEX: build only the variable fonts (designspace v5 variable-font entries or variable font settings) whose name or file name matches; default all",
  "--family-name NAME: use this family name for masters and keep only instances of this family",
  "--round-instances: round interpolated geometry to integers",
  "--features FILE: feature file to compile instead of the one in the source",
  "--include-dir DIR: directory against which relative include() paths in feature code are resolved",
  "--mti-source FILE: Monotype (FontDame) layout sources listed in a plist, used instead of feature code",
  "--skip-features: do not compile OpenType layout",
  "--feature-writer NAME[,k=v…]: choose the automatic feature generators (kern, mark, mkmk, curs, gdef, …) and their settings; repeatable, 'none' disables all, '...' keeps the source's list at that position",
  "--generate-gdef / --no-generate-gdef: build GDEF automatically, or keep the one written in the feature code untouched",
  "--variable-features / --no-variable-features: compile one variable feature set for a variable font (default), or compile layout per master and merge the tables",
  "--interpolate-binary-layout[=DIR]: for instances, interpolate GDEF/GPOS from compiled master fonts found in DIR instead of compiling features per instance",
  "--expand-features-to-instances: resolve include() statements and store the full feature text in every generated instance source",
  "--debug-feature-file FILE: write the generated feature code (kerning, marks and other automatic features included) to FILE",
  "--debug-lookups: add a Debg table that maps lookups back to feature-source locations",
  "--stub-gsub / --no-stub-gsub: write an empty GSUB when the features contain no substitutions",
  "--kern-class0-optimization / --no-kern-class0-optimization: let class kerning use first-class 0 for non-zero values (smaller, default) or avoid it for applications that mis-read it",
  "--menu-names FILE: AFDKO FontMenuNameDB supplying family, style and compatible menu names",
  "--goadb FILE: AFDKO GlyphOrderAndAliasDB; alone it only supplies Unicode values from its third column",
  "--apply-goadb / --no-apply-goadb: also rename glyphs to the final names and order them as the GOADB lists them",
  "--subset-to-goadb: drop glyphs the GOADB does not name (needs --apply-goadb or --release)",
  "--lookup-final-names: resolve Unicode values through the GOADB's final names",
  "--show-final-names: use final rather than source glyph names in messages",
  "--afdko-fontinfo FILE: AFDKO fontinfo keyword file (IsBoldStyle, IsItalicStyle, PreferOS/2TypoMetrics, IsOS/2WidthWeigthSlopeOnly, IsOS/2OBLIQUE); lowest priority after options file and command line",
  "--designspace FILE: with a bare variable font as source, the designspace used to translate axis locations written in design units in feature code",
  "--glyph-data FILE: extra glyph-info XML (production names, category, script); repeatable",
  "--uvs FILE: Unicode Variation Sequence list; adds a cmap format 14 subtable",
  "--cmap-mac FILE, --cmap-h FILE, --cmap-v FILE: Adobe CMap resources for the Mac, Unicode horizontal and Unicode vertical encodings of a CID-keyed font; default chosen from the font's registry and ordering",
  "--mac-cmap-script N, --mac-cmap-language N: script and language ids of the Mac cmap subtable instead of the guessed ones",
  "--stub-cmap4: write only a two-segment format 4 cmap subtable",
  "--legacy-double-mapping: give the twelve glyphs of the old AFDKO list (Delta, Omega, mu, hyphen, space …) their second code point when nothing else maps to it",
  "--bold / --no-bold, --italic / --no-italic: style-link flags",
  "--fs-selection-on N, --fs-selection-off N: set or clear an OS/2 fsSelection bit; repeatable; off is applied after on; bits 7, 8 and 9 must be given together",
  "--os2-version N: OS/2 table version; default 3, or 4 when fsSelection bits above 6 are used",
  "--license-code TEXT: text appended to name ID 3",
  "--bump-version[=N|X.YYY]: raise head.fontRevision and the version string, by 0.005 without a value, by N thousandths with an integer, or set it to X.YYY",
  "--mac-names / --no-mac-names: write Macintosh-platform menu names in addition to the Windows ones",
  "--feature-names-override: let name-table statements in feature code replace generated menu names (never IDs 2 and 6)",
  "--release / --no-release: release bundle: subroutinize, apply the GOADB, add a stub DSIG and drop the word Development from the version string",
  "--stub-dsig / --no-stub-dsig: add or omit a minimal empty DSIG",
  "--keep-mvar: with a bare variable font as source, keep MVAR values that the build does not overwrite",
  "--production-names / --no-production-names: rename glyphs to production names (default) or keep source names",
  "--post-format 2|3: keep glyph names in a TrueType or CFF2 font (2) or omit them (3)",
  "--subset / --no-subset: apply the glyph-subsetting settings of the source (export flags, an instance's keep-glyphs list) or ignore them and build everything; default: apply when the source defines any",
  "--glyphs SELECTOR: compile only these glyphs; a development aid, features are compiled against the reduced set",
  "--notdef auto|replace|allow-missing: add a generated .notdef when the source has none (default), always replace it, or build without one",
  "--remove-overlaps / --keep-overlaps: default removes overlaps in static fonts and keeps them in interpolatable and variable fonts",
  "--keep-direction: do not reverse contours for TrueType output",
  "--ttf-curves cu2qu|mixed|keep-quad|keep-cubic: how cubic curves reach glyf; mixed and keep-cubic need glyf format 1",
  "--conversion-error EM: largest allowed cubic-to-quadratic deviation as a fraction of the em; default 0.001",
  "--flatten-components[=BOOL]: make nested components reference simple glyphs only; default from the source",
  "--decompose-components: turn every component into contours",
  "--decompose-transformed-components: decompose components whose 2x2 transform is not the identity",
  "--prefer-simple-glyphs[=BOOL]: when a glyph mixes contours and components, decompose its components (default true)",
  "--erase-open-corners[=BOOL], --propagate-anchors[=BOOL]: run these source preprocessing steps or not; default from the source",
  "--auto-use-my-metrics / --no-auto-use-my-metrics: set the USE_MY_METRICS composite flag where it applies; default on for static fonts only",
  "--drop-implied-oncurves: remove on-curve points lying exactly midway between two off-curve points (TrueType)",
  "--filter NAME[,k=v…]: run a registered filter command on the glyphs, after the built-in outline steps or with pre=true before them; repeatable, '...' stands for the filters stored in the source",
  "--cff-round-tolerance F: round a CFF coordinate only when it is within F of an integer; default 0.5 rounds everything, 0 rounds nothing",
  "--optimize-cff 0|1|2: 0 plain charstrings, 1 specialised operators, 2 specialised and subroutinized (default)",
  "--subroutinize / --no-subroutinize, --max-subrs N: force CFF subroutines on or off and cap their number (0 means the format limit)",
  "--optimize-widths / --no-optimize-widths: choose defaultWidthX and nominalWidthX to minimise size (default) or leave widths explicit",
  "--cid-keyed[=R-O-S]: write a CID-keyed CFF, Adobe-Identity-0 when no registry-ordering-supplement is given",
  "--keep-outline-table: with a bare CFF, CFF2 or OTF source, embed its outline table unchanged",
  "--optimize-gvar / --no-optimize-gvar: omit deltas that interpolation of untouched points reproduces (default on)",
  "--colr-layer-reuse / --no-colr-layer-reuse: share identical layer runs in a variable COLR table (default on)",
  "--exclude-table TAG: do not build this table; repeatable",
  "--check-compatibility[=fix] / --no-check-compatibility: verify that masters interpolate before building; on by default for variable output; 'fix' also repairs curves that are flat in some masters",
  "--master-finder TEMPLATE: build the variable font from already compiled master fonts located by a path template with {stem}, {basename}, {dirname}, {ext}, {fullname}",
  "--sparse-glyphs FILE: JSON or TOML map from master to the glyph names it contributes, for sparse masters",
  "--autohint[=OPTIONS] / --no-autohint: run the autohinter matching the outline flavour; default follows the source's instance settings",
  "--warn-unhinted / --no-warn-unhinted: report CFF glyphs without stem hints",
  "--emit-designspace PATH, --master-dir DIR, --instance-dir DIR: keep the intermediate designspace, master UFOs and instance UFOs ('{tmp}' for a temporary folder)",
  "--ufo-structure package|zip|json, --indent-json: structure of intermediate UFOs",
  "--build-dir DIR: working directory for intermediate and debug files; default 'build'",
  "--emit-debug: write the intermediate representation and per-stage debug files into the build directory",
  "--tables TAG,...: build only these tables (and what they depend on) and write each into the output directory as a raw table file named <stem>.<TAG>; for inspecting one stage",
  "--plan: build nothing; print what would be built: the output files, the final glyph order with production names, the tables per output and the feature code after automatic features are added",
  "--validate-sources: run strict source validation while reading",
  "--warnings default|all|none: 'all' adds notes about common, usually harmless conditions such as a glyph falling in two GDEF classes",
