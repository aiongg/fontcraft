[[cli]]
id = "oracle"
usage = "fontcraft-cli oracle (SOURCE... | --corpus [DIR]) [--against fontc|fontmake] [--format ttf|otf] [--reference-bin PATH] [--output-dir DIR] [--timestamp SECS] [--timeout SECS] [--differences N] [--match TEXT] [--variable | --instances] [--json]"
options = [
  "SOURCE...: sources to compile both ways (.glyphs, .glyphspackage, .designspace, .ufo)",
  "--corpus [DIR]: the comparison set in the fetched corpus folder DIR (default ./corpus): every source under fontc/resources/testdata, and Oswald",
  "--against fontc|fontmake: the reference compiler; default fontc for --format ttf, fontmake for --format otf",
  "--format ttf|otf: outline flavour of both builds; default ttf. otf builds only the reference until FontCraft writes CFF",
  "--reference-bin PATH: the reference compiler's executable; otherwise FONTCRAFT_FONTC or FONTCRAFT_FONTMAKE, then PATH, then the documented install locations",
  "--output-dir DIR: keep both fonts and the tool's log in a folder per source under DIR; otherwise they go to a temporary folder that is removed",
  "--timestamp SECS: SOURCE_DATE_EPOCH for both builds; default 1700000000",
  "--timeout SECS: time limit for one reference build; default 300",
  "--differences N: how many differences to show per table; default 5",
  "--match TEXT: compare only the sources whose path contains TEXT",
  "--variable: compare variable fonts (TrueType) of the sources with two masters or more, against fontc's or fontmake's, at the masters, virtual masters, instances inside the axes and midpoints between neighbouring masters (M9.10)",
  "--instances: compare each exported static instance with fontmake's -i build by the static comparison; implies --against fontmake (M9.10)",
  "--json: one JSON document with every source's report and the summary, instead of text",
]
command = ""
equivalents = [
  "ttx_diff: source; --fontc_path; --compare default|gftools; --config; --rebuild both|fontc|fontmake|none; --off_by_one_budget; --expected_fontc_ttf_hash; --json; --outdir; --production_names; --keep_overlaps; --keep_direction; --timings; --unwrap_extensions; --fontc_font / --fontmake_font; --version / -V",
  "fontc_crater: ci TO_RUN; -c / --cache; -o / --out; --gftools; --html-only",
]
area = "compile"
milestone = "M2"
summary = "Development aid for differential testing: compiles each source with FontCraft and with a reference compiler run as a subprocess (fontc for TrueType, fontmake for CFF), both static and with the same timestamp, reads both fonts back and reports per table whether they are identical, equivalent once normalised, allowed (every difference on the allow-list with its reason) or different, with the first differences, and apart from that the differences in how the two programs read the source (glyph set, glyph order). A missing tool is reported and nothing is compared. Exit status 1 when a table differs or a build fails. With --variable or --instances, a font FontCraft does not build yet counts as not built and does not set the exit status; the summary ends with the counts equal, different, not built and failed. Not built yet: a prebuilt reference font, the gftools builder mode, rebuild control, an expected hash, an off-by-one budget, extension unwrapping, shared build options, a repository cache and an HTML report."
ref = "fontc ttx_diff README and core.py; fontc_crater README and args.rs; fontc --help and fontmake --help (1.0.0, 3.12.1)"
status = "observed"

[[cli]]
id = "dump"
usage = "fontcraft-cli dump FONT... [-t TAG[=VIEW]]... [-x TAG]... [--format ttx|json|text|hex] [--split tables|glyphs] [-o PATH]"
options = [
  "FONT...: any binary font, collection, WOFF/WOFF2, bare CFF/CFF2 or Type 1 font",
  "-t, --table TAG[=VIEW]: dump only this table, optionally in a named view; repeatable; pseudo-tables @font and @glyphs select the font program's global data and per-glyph data",
  "-x, --exclude-table TAG: dump everything except this table; repeatable; cannot be combined with -t",
  "--format ttx|json|text|hex: XML that fontTools ttx can read back (default), JSON with the same structure, a human-readable report, or offset-annotated hex",
  "--split tables|glyphs: one file per table plus an index file that references them; 'glyphs' also writes one file per glyph outline",
  "--no-disassemble: leave TrueType programs (fpgm, prep, glyph instructions) as hex instead of assembly",
  "--bitmap-format raw|row|bitwise|extfile: how embedded bitmap data is written: one hex block, hex per row, 0/1 art per row, or external image files (EBDT all four, CBDT raw and extfile)",
  "--strict: stop at the first table that fails to parse instead of falling back to hex for it",
  "--allow-virtual-gids: accept references to glyph indices beyond the glyph count",
  "--unicode-data FILE: character-name database used for the names written as comments in cmap",
  "--newline lf|cr|crlf: line ending of the output; default lf",
  "--glyphs SELECTOR, --exclude-glyphs SELECTOR: restrict per-glyph tables and @glyphs to these glyphs",
  "--fd LIST, --exclude-fd LIST: restrict a CID-keyed font to glyphs of these font dicts",
  "--glyph-detail short|medium|long: amount of data per glyph in @glyphs: identity and metrics, plus path summary, plus full path with hints",
  "--flatten-seac: show accented composites built with the seac operator as plain paths and drop dotsection",
  "--no-hints: leave stem hints, hint masks and flex out of outline dumps",
  "--normalize: produce an order-independent dump for comparison: charstrings without subroutines, layout rules grouped by feature and sorted, records sorted, table checksums removed",
  "--no-version: with --normalize, also blank head.fontRevision and name ID 3 and 5",
  "--show-extensions: with --normalize or a fea view, say which lookups are wrapped in Extension lookups",
  "--cff-parts LETTERS: for the CFF literal view, which structures to show: h header, n Name INDEX, t Top DICT, s String INDEX, g global subrs, e Encoding, C charset, f FDSelect, F FDArray, c CharStrings, p Private DICT, l local subrs; default all",
  "--cff-level offsets|bytes|values: literal view detail: byte ranges only, every byte including INDEX structure, or decoded values (default)",
  "--no-wrap: keep array-like data on one line in the literal view",
  "--cmap-subtable N: which cmap subtable the cmap views use; default the best Unicode subtable",
  "--units font|1000: scale metric values in text views to the font's own units (default) or to 1000 per em",
  "--names source|final, --goadb FILE: show glyphs under their development names by mapping back through a GOADB",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.dumpTables"
equivalents = [
  "ttx: FONT (dump direction); -o / -d; -f; -v / -q; -a; -l; -t / -x; -s; -g; -i; -z; -e; -y; --unicodedata; --newline; -h / --version",
  "ttxn: (default normalised dump, one file per table); -nh; -nv; -se; -t / -x / -o / -d and the other ttx dump options",
  "spot: -t TAG[=N]; -T; -n / -nc; -ngid; -m / -ag; -F; -o; -C; -of; -g; -u / -h / -ht; -X",
  "tx: -dump -0; -dump -1 / -2 / -3; -dump -4 / -5 / -6; -dump -d; -dump -n; -dcf; -dcf -T; -dcf -0 / -1 / -5; -dcf -b; -g / -gx; -fd / -fdx; -gf / -gr; -i / -y",
  "detype1: font [text]; -h",
  "otl-normalizer: font_path, -o, -t, -i",
  "varLib.avar.unbuild: font",
  "ttLib: -t",
  "pyftsubset: --xml",
]
area = "cli-tools"
milestone = "M12"
summary = "Writes the contents of a font as text: every table or chosen tables, as TTX-compatible XML, JSON, a readable report or hex. Tables can be shown in named views (raw fields, a friendlier listing, feature-file syntax, kerning pairs and so on), and the font program can be listed per glyph. A Type 1 font is dumped as its decrypted, readable text."
ref = "fontTools ttx; AFDKO spot (main.c usage and per-table usage), tx -dump / -dcf help, ttxn.py, detype1; fontc otl-normalizer; fontTools varLib.avar.unbuild"
status = "docs"
notes = "M12.4: --format ttx, json and hex, -t (repeatable, in the order given), -x, --split tables, -o, --output-dir, --face, --no-disassemble, --strict, --no-clobber and --newline are built. The TTX form follows ttx 4.66 for the core tables (head hhea maxp OS/2 name post cmap hmtx loca glyf gasp vhea vmtx fpgm prep cvt hdmx), checked against its output on a font built in the tests. The character names ttx writes as comments after cmap mappings are left out. M12.5: CFF, CFF2 and VORG follow ttx 4.66 (Top, Private and font dicts with their defaults, encodings, FDSelect, blends, the CFF2 variation store, decompiled charstrings and subroutines, uncalled subroutines as hex), checked against its output on four fonts built in the tests; charstrings with more than 513 operands or subroutines nested deeper than 10 levels, and the expert charsets, are written as hex where ttx reads them. M12.6: GSUB, GPOS, GDEF, BASE, JSTF, MATH, STAT, fvar, avar and meta follow ttx 4.66 as well, checked against its output on two fonts built in the tests (every lookup type, feature parameters, a variation store, avar version 2, the STAT axis value formats). M12.7: gvar, cvar, HVAR, VVAR, MVAR, COLR version 0, CPAL, SVG, sbix, kern, DSIG, FFTM, LTSH, VDMX and prop follow ttx 4.66, checked against its output on fonts built in the tests; COLR version 1, SVG documents compressed with gzip, the bitmap tables (CBDT CBLC EBDT EBLC) and the Apple tables other than prop are written as hex. Tables no writer knows are written as hex. M12.10: --normalize (with --no-version, --no-hints and --show-extensions), -t @font, -t @glyphs with --glyphs and --glyph-detail, and the views GSUB=fea, GPOS=fea, GDEF=fea, GPOS=normalized and GDEF=normalized are built. The normalised dump follows ttxn 1.21.2 of AFDKO 5.0.1 table by table: GSUB and GPOS line for line (checked on fonts built in the tests), CFF and glyf through the tx -dump text. @font and @glyphs follow tx -dump -0 and -4 to -6 (checked on a TrueType font built in the tests and on glyph records of corpus CFF fonts). Not built: the spot table listings (-t TAG and -t TAG=VIEW with the other views of the table above), the CFF literal view, --split glyphs, and splitting the text views or the normalised dump into files."
guesses = ["A table view, @font or @glyphs given with --format ttx (the default) writes text as if --format text were given; a user of the reference command line would settle whether that should be refused instead.", "Where ttxn stops with a Python error (format-3 anchors, GPOS chaining contexts of format 2, --no-version on a Windows name ID 5), the normalised dump goes on: the anchor prints its coordinates, the rule prints in the GSUB form, and name ID 5 keeps the text before its first semicolon; a fixed ttxn would settle it.", "@glyphs names a TrueType glyph by its post name where tx printed g<index> for an unencoded glyph of a font built with fontTools; reading when tx ignores post names would settle it.", "In @glyphs, two off-curve TrueType points in a row become one cubic with handles four-thirds along the quadratic handles and every TrueType coordinate is rounded to an integer, as tx printed them on two corpus glyphs and one test glyph; more glyphs with long off-curve runs would settle it.", "Vertical ghost stems of width -20 and -21 print as rightedge and leftedge by analogy with the horizontal ones, and a CFF2 font's @font says CFF2 (CID-keyed); no corpus font has either, and running tx on one would settle it.", "Without -o or --output-dir the dump goes to standard output, where ttx writes FONT.ttx beside the input; a user of the reference command line would settle it.", "The JSON form is the TTX element tree, each element an object with name, attributes, text and children; no reference tool writes JSON, so readers of it settle the shape.", "The hex form lists each table with a header line, then offset, 16 bytes in two groups of eight and their ASCII, as hexdump -C does; no reference tool settles it.", "A dump past 1 GiB of text (the JSON form counting its element tree) stops with an error, and a simple glyph whose contour end points decrease is written as hex with the decompilation error, where ttx would write repeated points; a font that needs more would settle the limit.", "A coverage or class definition table whose ranges list more than 10,000,000 glyphs, or layout subtables nested so deep that their elements would pass 64 levels (extension lookups pointing at extension lookups), make the table be written as hex with the decompilation error, where ttx writes the glyphs in full and fails on the nesting; a font that needs more would settle the limits."]

