notes = "Tables are put into the font as fontTools feaLib 4.66.1 puts them (see the features compile row). Name ids of 256 and above that the code declares move above the highest id the font already uses, as fontc moves them; feaLib keeps an explicit nameid and gives feature names the first unused id, so the two differ only for a font that already has ids of 256 and above. Code with errors fails with the first errors as file:line:column and writes nothing. The result lists the tables written and removed, the features with their language systems and lookup counts, and the compiler's warnings with their places. debugLookups is refused as not built yet. The compile is static: variable syntax in the code is refused for a variable font."

[[command]]
id = "layout.decompileFeatures"
label = "Decompile Layout to Feature Code"
menu = []
shortcut = ""
kind = "engine"
params = "{font: path, face?: int|name, tables?: [tag], features?: [tag], showExtensions?: bool, names?: \"source\"|\"final\", goadb?: path, classes?: \"auto\"|\"inline\", output?: path}"
area = "features"
milestone = "M12"
summary = "Read-only query that writes the GSUB, GPOS, GDEF and BASE tables of a binary font as feature code with stable generated class and lookup names, and returns the text or the path written plus a list of constructs that had no feature syntax."
ref = "docs/spec/20-cli.md › features"
status = "docs"
notes = "Checked with fontTools feaLib 4.66.1: text written for a font built in code compiles back to the same lookup types, lookup order, language systems (exclude_dflt where a language drops default lookups) and GDEF classes. Lookups are top-level blocks in lookup-list order, except that a lookup a contextual rule calls comes first, because the compiler resolves lookup names as it reads. Known differences after a round trip: a type 5 or 7 contextual lookup comes back as chaining (6 or 8); the aalt feature is rebuilt by the compiler; feature parameters other than size, feature variations and variation indices are written as comments. Glyph names follow the names fontTools gives the font (CFF charset, post, then cmap names); cmap-derived names use the glyph list only for ASCII, uniXXXX otherwise."
guesses = ["A lookup a feature uses is named feature_script_language_index after the first language system that uses it, and any other lookup GSUB_index or GPOS_index; the round-trip measure on the corpus would show whether stabler names are needed.", "Glyph sets of two or more glyphs used at least twice become named classes (@first_last); sets used once stay inline. Reading the decompiled text of a few corpus fonts would settle the threshold.", "Mark classes are named @MC_lookup_subtable_class, one set per subtable, so a mark that has different anchors in two subtables of one lookup never collides."]

[[command]]
id = "layout.lintFeatures"
label = "Check Feature Code"
menu = []
shortcut = ""
kind = "engine"
params = "{source: path, font?: path, face?: int|name, glyphOrder?: path, glyphNames?: [name], includeDir?: path, warnings?: \"default\"|\"all\"}"
area = "features"
milestone = "M12"
summary = "Read-only query that parses and validates feature code as the compiler would, without building tables, and returns diagnostics as {severity, message, file, line, column}."
ref = "docs/spec/20-cli.md › features"
status = "inferred"
notes = "A glyph set comes from a font (the names a compiler sees for it), a glyph list file (the first word of each line, so a GOADB works) or a list of names; a path and a list of names are separate parameters so file-access rules can tell them apart. With a glyph set the code is compiled in memory and nothing is written; without one it is only validated. Lines and columns count from 1, columns in characters; a message about the request as a whole has no place. The result also counts errors, warnings and notes."
guesses = ["Without a glyph set the compiler's messages about glyphs missing from the font are left out and hyphenated names are read as ranges; addfeatures always checks against a font. A request to check names against the code's own classes would change it."]

