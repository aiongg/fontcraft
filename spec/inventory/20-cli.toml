  "--sizes LIST: point sizes of a waterfall; default 36,24,20,18,16,14,12,10,9,8,7,6; ranges such as 8-12 are accepted",
  "--sort gid|name|unicode|lookup: order of glyphs: glyph order (default), alphabetical by name, by code point, or for feature proofs the order of the rules in the font",
  "--text STRING: text for the text and waterfall layouts; default all glyphs in groups that fit the line",
