area = "cli-tools"
milestone = "M12"
summary = "Reduces a font to chosen glyphs and removes everything that becomes unreachable: cmap entries, layout rules, variation data, names, hint tables. The kept set starts from glyph names, glyph indices, code points or text, and is closed over components and over the substitutions of the retained layout features. Defaults follow pyftsubset, which aims at small web fonts; each trimming step can be switched off."
ref = "fontTools subset (pyftsubset) documentation; AFDKO tx help › Subsetting, mergefonts usage, makeotf -gs; fontmake --subset"
status = "docs"
notes = "Default layout features checked with fontTools 4.66.1 (`Options().layout_features`): abvf abvm abvs akhn blwf blwm blws calt ccmp cfar chws cjct clig cswh curs dist dnom fin2 fin3 fina frac half haln halt init isol jalt kern liga ljmo locl ltra ltrm mark med2 medi mkmk mset nukt numr palt pref pres pstf psts rand rclt rkrf rlig rphf rtla rtlm rvrn stch tjmo valt vatu vchw vert vhal vjmo vkrn vpal vrt2 (64 tags, plus four internal pseudo-tags that are not carried over). Default name IDs 0 to 6; dropped tables JSTF DSIG EBDT EBLC EBSC PCLT LTSH Feat Glat Gloc Silf Sill (20-cli.md question 8). Built in M12.17: selections by text, code points and ranges, glyph names, glyph ids and '*' (with the list files); closure over cmap (bidi mirrors, format 14 sequences), glyf components and CFF seac; the .notdef, retain-gids, hinting, name, cmap, glyph-name, passthrough and OS/2 range options; tables cmap, glyf, loca, CFF, hmtx, vmtx, post, name, OS/2, maxp, head, hhea, vhea, with gasp, cvt, fpgm, prep and VDMX copied. Layout, variation, colour and the other glyph-indexed tables are dropped with a reason in the result until M12.18 and M12.19; CFF2 fonts are refused; unused CFF subroutines are kept."
guesses = [
  "While variation subsetting is not built, a variable font loses every variation table together (fvar, avar, gvar, cvar, HVAR, VVAR, MVAR, STAT), so no subset claims axes without the data behind them; M12.19 replaces this.",
  "Unused CFF subroutines stay in the subset (pyftsubset removes them); outlines are the same, the file is larger. Comparing sizes on the corpus would show whether pruning is worth porting.",
]

[[cli]]
id = "instance"
usage = "fontcraft-cli instance INPUT [AXIS=LOC...] [--named REGEX | --all | --index LIST] [--static] [--to same|ttf|otf|ufo] [-o OUT | --output-dir DIR]"
options = [
  "INPUT: variable font, designspace, or multi-master source",
  "AXIS=LOC...: per axis a value to pin, MIN:MAX or MIN:DEFAULT:MAX to limit (empty parts keep the current bound), or 'drop' to pin at the default; user-space units",
  "--location AXIS=LOC: the same as a positional location, for use in options files; repeatable",
  "--static: pin every axis that is not mentioned at its default, giving a static font",
  "--named REGEX: build the named instances (fvar instances or export instances of a source) whose name matches",
  "--all: build every named instance",
  "--index LIST: build the instances with these zero-based indices as listed by info --section instances",
  "--to same|ttf|otf|ufo: output kind; 'same' keeps the input's flavour (default for fonts), ufo is the default for sources",
  "--no-clamp: allow a location outside an axis range (extrapolate) instead of clamping to it",
  "--optimize-gvar / --no-optimize-gvar: re-run delta optimisation on the variation data that remains (default on)",
  "--overlap-flag / --no-overlap-flag: mark glyphs of a fully pinned TrueType font as possibly overlapping (default on)",
  "--remove-overlaps, --ignore-overlap-errors: merge overlapping contours in a fully pinned font; with the second option glyphs that fail are kept as they are",
  "--update-name-table: rename the result from the STAT axis-value names of the chosen location (family, subfamily, typographic names, PostScript name)",
  "--downgrade-cff2: when every axis is pinned, write a CFF table instead of CFF2",
  "--recalc-bounds / --no-recalc-bounds: recompute bounding boxes of the result (default on)",
  "--round / --no-round: round interpolated coordinates to integers (default on)",
  "--autohint / --no-autohint: PostScript-autohint interpolated source instances (default on for sources)",
  "--normalize / --no-normalize: write instance sources in canonical form (default on)",
  "--strict: treat interpolation problems in a source (incompatible glyphs, missing kerning masters) as errors instead of skipping the glyph with a warning",
  "--ufo-version 2|3: format of UFO instances; default 3",
  "--instance-dir DIR: folder for UFO instances; default the paths recorded in the designspace",
  "--layout-only, --master-finder TEMPLATE: interpolate only GDEF, GPOS and GSUB from compiled master fonts of a designspace and write a font holding them",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.instantiate"
equivalents = [
  "varLib.instancer: INPUT.ttf AXIS=LOC…; -o / --output; --static; --no-optimize; --no-overlap-flag; --remove-overlaps; --ignore-overlap-errors; --update-name-table; --downgrade-cff2; --no-recalc-timestamp; --no-recalc-bounds; -v / --verbose / -q / --quiet",
  "varLib.mutator: INPUT.ttf AXIS=LOC…; -o / --output; --no-recalc-timestamp; --no-overlap; -v / --verbose / -q / --quiet",
  "varLib.interpolate_layout: DESIGNSPACE LOCATION…; -o / --output; -l / --loglevel",
  "makeinstancesufo: -d / --designspace; (all instances); -i; -a / --no-autohint; -c / --no-remove-overlap; -n / --no-normalize; -r / --no-round; -s / --strict; --ufo-version; --instance_info; -v / --verbose / --version",
  "fontmake: -i / --interpolate [NAME]; --round-instances; --instance-dir; --interpolate-binary-layout",
  "tx: -U; -UNC",
]
area = "cli-tools"
milestone = "M12"
summary = "Produces an instance of a variable design: from a variable font, a static font or a variable font with fewer or narrower axes; from a designspace or other multi-master source, interpolated UFO or binary instances. Each axis can be pinned to a value, limited to a range, dropped at its default or left alone."
ref = "fontTools varLib.instancer, varLib.mutator, varLib.interpolate_layout; AFDKO makeinstancesufo.py, tx -U / -UNC; fontmake -i"
status = "docs"

[[cli]]
id = "merge"
usage = "fontcraft-cli merge FONT [--map FILE] [--glyphs LIST] FONT [--map FILE] ... -o OUT [options]"
options = [
  "FONT...: fonts to merge, first one is the base; binary fonts, bare CFF, Type 1 or UFO, detected from content",
  "--map FILE: glyph map for the preceding FONT: a header line 'mergefonts [PostScriptName LanguageGroup]' followed by lines 'output-name source-name'; only listed glyphs are taken; numeric output names make the result CID-keyed",
  "--glyphs LIST, --exclude-glyphs LIST, --fd LIST, --exclude-fd LIST: glyph selection for the preceding FONT",
  "--input-list FILE: read the font paths from a text file, one per line, '#' comments",
  "--layout merge|base|drop: union cmap, GSUB, GPOS and GDEF of all fonts (default for sfnt input), keep the base font's only, or drop layout",
  "--duplicates first|last|error|rename: what to do when two fonts supply a glyph of the same name; default first, except that identical glyphs are always shared silently",
  "--drop-tables TAG,...: tables to leave out of the result",
  "--import-ttx FILE: compile this XML dump into the result after merging, to set metadata",
  "--cid-info FILE: make the result CID-keyed and take the top-level dictionary values (FontName, FullName, FamilyName, Weight, version, Registry, Ordering, Supplement, optional Trademark and XUID) from this file",
  "--hint-dict-from FONT: take global metrics and hint dictionary (zones, stems) from FONT and everything else from the other input",
  "--ps-name NAME, --language-group 0|1: override the PostScript name and LanguageGroup, as a map-file header would",
  "--to FORMAT: output format when it should differ from the base font's; same values as convert --to",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.merge"
equivalents = [
  "mergefonts: output-font-file; [glyph alias file] merge-font-file …; -cid; -hints; -g / -gx; -fd / -fdx; glyph alias file header (FontName, LanguageGroup); tx output-mode options (-cff, -t1 …); -u / -h / -v",
  "pyftmerge: font1 … fontN; --input-file; --output-file; --import-file; --drop-tables; --verbose; --timing",
]
