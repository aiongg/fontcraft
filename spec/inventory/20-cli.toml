  "--cid-layout FILE: CID layout file; glyphs of a CID-keyed font are then shown in its order with hint-dict and row-font names",
  "--error-log FILE: with the digi layout, a text file of per-glyph notes (glyph name followed by words or x,y pairs) printed under each glyph",
  "--fit-bbox L,B,R,T, --scale SX[,SY]: for the outline layout, fit the drawing to this box or scale it by these factors",
  "--units font|1000: print coordinates in font units (default) or rescaled to 1000 per em",
