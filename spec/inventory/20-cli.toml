  "mtiLib: FILE… (prints XML); --font / -f, --table / -t",
]
area = "features"
milestone = "M12"
summary = "Translates layout source between syntaxes without compiling into a font: a VOLT project or a font carrying VOLT source tables to feature code, and FontDame text to feature code or to an XML table dump."
ref = "fontTools voltLib.voltToFea, mtiLib (main)"
status = "docs"
notes = "VOLT: a port of voltToFea that writes the text fontTools writes; the tests compare it with fontTools' output, including the oracle's test projects Nutso and NamdhinggoSIL1006; a font input is read through its TSIV table and its glyph order renames the project's glyphs by id, as voltToFea does. FontDame: the reader ports mtiLib; mtiLib builds binary tables, so the feature-code form is ours: one lookup block per lookup named GSUB_<name> or GPOS_<name>, `subtable;` between the file's subtables, a called lookup defined before the lookups that call it (a warning names the lookups that move), languagesystem statements and one feature block per tag. Several FontDame files convert together, so GSUB and GPOS lookup flags can name the mark attachment classes and mark filtering sets of the GDEF file. --to ttx compiles the feature code against --font and prints the GDEF, GSUB and GPOS it builds; without --font it is refused. What feature code cannot hold is printed as a warning and left out: features no language system lists, class 0 without a glyph order, mark attachment classes without their GDEF file. A FontDame cmap file is refused: it is not layout."
guesses = [
  "FontDame backtrack sequences (glyph, class and coverage rules, reverse chaining) are read nearest glyph first, as the binary stores them, and reversed for feature code; a FontDame file with a multi-glyph backtrack and the table the reference tool compiles from it would settle it.",
  "A FontDame `U XXXX` glyph reference becomes uniXXXX (uXXXXX above U+FFFF), where mtiLib takes the Adobe Glyph List name when there is one; a glyph-list lookup in the tables crate would match it.",
]

[[cli]]
id = "features normalize"
usage = "fontcraft-cli features normalize FONT [--table gpos|gsub|gdef|all] [--location AXIS=VALUE,...] [--face N|NAME] [-o OUT] [--no-clobber]"
options = [
  "--table gpos|gsub|gdef|all: which part to print; default all",
  "--location AXIS=VALUE...: resolve variable values at this location instead of printing them as default plus deltas",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "layout.normalize"
equivalents = [
  "otl-normalizer: FONT_PATH; -o / --out; -t / --table; -i / --index",
]
area = "features"
milestone = "M12"
summary = "Prints the effective layout rules of a font in a canonical text form that does not depend on how the compiler arranged lookups and subtables, so that two builds can be compared with a text diff. Covers GPOS kerning, mark attachment and cursive attachment, and the GDEF ligature-caret list; GSUB is accepted but prints no rules, as in otl-normalizer."
ref = "fontc otl-normalizer README, args.rs and source"
status = "docs"
notes = "Ported from otl-normalizer 1.0.0 (MIT OR Apache-2.0) with its text format kept byte for byte: rules grouped by feature and by the language systems with the same lookups; within a lookup the first subtable that covers a pair or glyph wins; kerning values of one pair add up across the lookups of a feature, later mark and cursive rules replace earlier ones; variable values print as the default plus the value at each master location ({…}). otl-normalizer 1.0.0 prints nothing for GSUB (its GSUB printer is a stub), so neither do we. Glyph names come from post, else the AGLFN name of the lowest code point of the Unicode-platform cmap subtables, else uniXXXX/uXXXXX, else glyph.NNNNN, as otl-normalizer names them. Where otl-normalizer panics on damaged data we report an error; a pair or rule count past the work limit is refused. --location is ours (otl-normalizer has no location option): user coordinates normalised through fvar and avar, each value printed once. -o writes the file even when the text is empty, where otl-normalizer creates no file. Unconfirmed until the corpus measure: text identical to otl-normalizer on every corpus font with GPOS and on fontc's builds."

