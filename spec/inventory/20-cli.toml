[[cli]]
id = "diff"
usage = "fontcraft-cli diff A B [--summary | --detail LEVEL] [-t TAG]... [-x TAG]... [--normalize none|dump|compiler] [--context N] [--output-dir DIR]"
options = [
  "A B: two fonts; or two folders; or a font and a folder holding a font of the same name",
  "--summary: only say, per table, whether it exists on each side and whether the bytes are equal",
  "--detail tables|offset|hex|fields|verbose: tables (same as --summary) | first differing byte offset per table | line-by-line diff of hex dumps | diff of decoded fields (default) | decoded fields including values that are equal around each difference",
  "-t, --table TAG: compare only these tables; repeatable; cannot be combined with -x",
  "-x, --exclude-table TAG: compare all but these tables; repeatable",
  "--compare-identical: also decode and diff tables whose bytes are equal (they then show no difference; useful to time or test the decoder)",
  "--context N: unchanged lines shown around each difference; default 3",
  "--normalize none|dump|compiler: none compares decoded tables as they are; dump first rewrites both in the order-independent form of dump --normalize; compiler applies the fuller clean-up used to compare two compilers' output",
  "--no-hints: with --normalize, ignore hint data in outlines",
  "--no-version: with --normalize, ignore head.fontRevision and the version and unique-id name records",
  "--show-extensions / --unwrap-extensions: keep or strip Extension lookup wrappers before comparing (default strip in compiler mode)",
  "--off-by-one-budget PCT: in compiler mode, the share of glyf coordinates and gvar deltas that may differ by one unit without counting; default 0.1",
  "--size-threshold PCT: report tables whose byte size on side B exceeds side A by more than this; default 10",
  "--similarity: print for each differing table a ratio between 0 and 1 of matching lines instead of the diff text",
  "--tool COMMAND, --tool-args ARGS: hand the two decoded texts of each differing table to an external diff program instead of the built-in one",
  "--face-a N, --face-b N: member to use when A or B is a collection",
  "--show-mtime: print each file's modification time in the header",
  "--output-dir DIR: write the per-table texts that were compared (A.TAG.txt and B.TAG.txt), for inspection with other tools",
  "--all: list every difference instead of stopping at 1000 removed or added lines (64 KiB of hex) per table",
  "[global options]: -o/--output, --output-dir, --in-place, --no-clobber, --face, --json, -q/--quiet, -v/--verbose, --log, --log-file, --color, -j/--jobs, --timing, --trace, --backtrace, --options, --save-options, --dry-run, --timestamp, @FILE, -h/--help, --version (behavior rows cli.global.*)",
]
command = "font.diff"
equivalents = [
  "sfntdiff: fontfile1 fontfile2 | fontfile dir | dir1 dir2; -T; -d 0; -d 1; -d 2; -d 3; -d 4; -x; -i; -u / -h; -X",
  "fonttools diff: FILE1 FILE2; -l / --summary; -U / --lines; -t / --include; -x / --exclude; --diff; --diff-arg; --color; --y1 / --y2; -a / --always; -b / --binary; -q / --quiet",
  "ttxn: (run on two fonts, then diff the per-table files); -nh / -nv / -se",
  "ttx_diff: --fontc_font A --fontmake_font B; --off_by_one_budget; --unwrap_extensions; --json; --outdir",
]
area = "cli-tools"
milestone = "M12"
summary = "Compares two fonts table by table and says which tables differ and how: presence, byte equality, the first differing offset, a hex diff, or a text diff of the decoded tables. Normalisation modes hide differences that do not change behaviour, for comparing two versions of a font or the output of two compilers. A and B may also be two folders, or a font and a folder, in which case fonts with the same file name are paired."
ref = "AFDKO sfntdiff (usage and help), ttxn.py; fontTools diff; fontc ttx_diff core.py"
status = "docs"
notes = "Built in M12.32. The fields text is each table's TTX; a table no TTX writer reads is compared as its TTX hex. Hex dumps are compared in rows of 16 bytes. Every diff is a unified diff with --context lines. --normalize compiler ports fontc's ttx_diff except three steps that stay open: filling in gvar deltas left to interpolation, matching contour order and start points, and renumbering the classes of class-based contextual rules. --normalize dump compares the normalised dump of `dump --normalize` and fails until that view exists. --tool is refused: --output-dir writes the texts for an external program. -t and -x take comma-separated lists; a repeated option replaces the earlier list."
guesses = [
  "Without --all a table lists at most 1000 removed or added lines, or 4096 hex rows; none of the reference tools caps its output, so the cap is ours.",
  "In compiler mode the index sorting, name-ID resolution and the removal of a one-sided name ID 25 apply to both fonts alike, where ttx_diff applies some only to the fontmake side; comparing verdicts on corpus pairs would show whether this matters.",
  "The off-by-one budget is counted on B's coordinates (ttx_diff's fontmake side) and A's values are set to B's; ttx_diff's own pairing of the two sides is not symmetric either.",
  "The hex detail prints offset, bytes and ASCII per 16-byte row as a unified diff; the exact layout of sfntdiff -d 2 has not been compared.",
]

