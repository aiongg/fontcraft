# Source: Glyphs 4 Handbook, chapter "Palette"
#         (https://handbook.glyphsapp.com/palette/ ; scratch copy handbook/04-palette.txt, whole file)
# Date:   2026-10-07
# All wording is our own. Labels, menu paths and shortcuts match the reference where it states them.
# The Palette buttons carry icons, not text, in the reference; command labels are therefore ours
# unless the handbook names the action. Rows marked `inferred` are FontCraft designs.

# ───────────────────────────── Sidebar ─────────────────────────────

[[panel]]
id = "palette"
label = "Palette"
location = "sidebar"
controls = [
  "sidebar button at the window's top-right corner: show or hide the Palette",
  "section header with a chevron on its left: collapse or expand the section",
  "built-in sections in order: Dimensions, Fit Curve, Layers, Transformations",
  "additional sections contributed by plug-ins",
  "contextual controls at the bottom, shown while View > Show Info is on",
]
area = "ui-chrome"
milestone = "M3"
summary = "Right-hand sidebar of the font window made of collapsible sections. Four sections are built in and plug-ins can add more."
ref = "Palette"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 5:08: the Palette shows Alignment, Dimensions, Fit Curve, Layers and Transformations, plus Stroke while a path is selected. The Alignment section is not in this row's built-in list; it may come from a plug-in or be Glyphs 3 only. Not shown: collapsing sections, the sidebar button."

[[command]]
id = "window.palette"
label = "Palette"
menu = ["Window"]
shortcut = "Cmd+Alt+P"
kind = "ui"
params = "{on?: bool}"
area = "ui-chrome"
milestone = "M3"
summary = "Shows or hides the Palette sidebar. The sidebar button at the top right of the window does the same."
ref = "Palette"
status = "handbook"

[[command]]
id = "palette.toggleSection"
label = "Collapse / Expand Section"
menu = []
shortcut = ""
kind = "ui"
params = "{section: 'dimensions'|'fitCurve'|'layers'|'transformations'|pluginId, expanded?: bool}"
area = "ui-chrome"
milestone = "M3"
summary = "Collapses a Palette section to its title row or expands it again, as clicking the chevron beside the section name does."
ref = "Palette"
status = "handbook"

[[behavior]]
id = "palette.pluginSections"
area = "extensions"
milestone = "M13"
summary = "Plug-ins can register their own Palette sections, which appear alongside the built-in ones and collapse the same way."
ref = "Palette"
status = "handbook"

# ───────────────────────────── Dimensions ─────────────────────────────

[[panel]]
id = "palette.dimensions"
label = "Dimensions"
location = "palette"
controls = [
  "diagram of typical letter parts with one number field per labelled measurement",
  "empty fields show -- ; click a number or an empty field to type a value",
  "the set of fields depends on the script of the current glyph",
]
area = "guides-metrics"
milestone = "M3"
summary = "Notepad for recurring measurements of the design such as stem and bowl thicknesses. The numbers are stored per master and are reference only: they change nothing in the outlines or the exported font."
ref = "Palette › Dimensions"
status = "handbook"

[[command]]
id = "dimensions.setValue"
label = "Set Dimension"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id, key: string, value: number|null}"
area = "guides-metrics"
milestone = "M3"
summary = "Stores one measurement in the Dimensions notepad of a master, or clears it with null. The field keys per script are not listed in the handbook."
ref = "Palette › Dimensions"
status = "handbook"

[[command]]
id = "dimensions.getValues"
label = "Get Dimensions"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id, script?: string}"
area = "guides-metrics"
milestone = "M3"
summary = "Query returning the Dimensions values noted for a master, optionally limited to the fields of one script."
ref = "Palette › Dimensions"
status = "inferred"

[[behavior]]
id = "dimensions.perMaster"
area = "guides-metrics"
milestone = "M3"
summary = "Dimensions values are kept separately for every master, so switching master switches the numbers shown."
ref = "Palette › Dimensions"
status = "handbook"

[[behavior]]
id = "dimensions.fieldsFollowScript"
area = "guides-metrics"
milestone = "M3"
summary = "Which measurement fields the Dimensions section offers follows the script assigned to the current glyph. That script can be overridden per glyph through Edit > Info for Selection."
ref = "Palette › Dimensions"
status = "handbook"

[[behavior]]
id = "dimensions.noEffectOnFont"
area = "guides-metrics"
milestone = "M3"
summary = "Dimensions are informational. No tool, filter or export step is documented in this chapter as reading them."
ref = "Palette › Dimensions"
status = "handbook"

# ───────────────────────────── Fit Curve ─────────────────────────────

[[panel]]
id = "palette.fitCurve"
label = "Fit Curve"
location = "palette"
controls = [
  "left percentage field: handle length applied by the leftmost button (lower bound)",
  "right percentage field: handle length applied by the rightmost button (upper bound)",
  "eight round buttons: evenly spaced handle lengths from the left to the right value",
  "small grey marker under the buttons: current length of the selected handle",
  "plus button: lengthen the handles of the selected segments",
  "minus button: shorten the handles of the selected segments",
  "scale (balance) button: even out the two handles of each segment",
]
area = "drawing"
milestone = "M3"
summary = "Section for setting the handle lengths of curve segments as a percentage, to get evenly curved outlines. Every action treats both handles of a segment together even if only one is selected."
ref = "Palette › Fit Curve"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 10:31–10:35 and 26:01: two percentage fields, reading 50% and 70%, with eight round buttons between a minus and a plus button. Not shown: the grey marker, the balance button. The 50/70 values are 04 open question 10."

[[command]]
id = "fitCurve.applyStep"
label = "Fit Curve"
menu = []
shortcut = "Ctrl+Alt+1"
when = "editView"
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]], step: 1..8}"
area = "drawing"
milestone = "M3"
summary = "Sets the handles of the selected curve segments to one of eight lengths. Step 1 is the value of the left field, step 8 the value of the right field, and steps 2 to 7 divide the range between them evenly. Ctrl+Alt+1 through Ctrl+Alt+8 run steps 1 to 8."
ref = "Palette › Fit Curve"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 10:31–10:35 and 26:01–26:16: handle lengths change step by step while an on-screen key overlay reads Ctrl, Cmd and Opt with 1 to 8 (Cmd+Ctrl+Alt+1 … 8), not this row's Ctrl+Alt; see 04 open question 11."

[[command]]
id = "fitCurve.setHandleLength"
label = "Set Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]], percent: 1..100}"
area = "drawing"
milestone = "M3"
summary = "Sets both handles of each selected curve segment to an explicit percentage. Generalises the eight buttons for agents; values are clamped to 1 to 100."
ref = "Palette › Fit Curve"
status = "inferred"

[[command]]
id = "fitCurve.increase"
label = "Increase Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]}"
area = "drawing"
milestone = "M3"
summary = "Plus button: lengthens the handles of the selected curve segments uniformly by one increment. The size of the increment is not documented."
ref = "Palette › Fit Curve"
status = "handbook"

[[command]]
id = "fitCurve.decrease"
label = "Decrease Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]}"
area = "drawing"
milestone = "M3"
summary = "Minus button: shortens the handles of the selected curve segments uniformly by one increment."
ref = "Palette › Fit Curve"
status = "handbook"

[[command]]
id = "fitCurve.setRange"
label = "Set Fit Curve Range"
menu = []
shortcut = ""
kind = "ui"
params = "{min?: percent, max?: percent}"
area = "drawing"
milestone = "M3"
summary = "Sets the two percentage fields that define what the first and the last of the eight buttons apply. A per-font custom parameter can supply these two values instead."
ref = "Palette › Fit Curve"
status = "handbook"

[[command]]
id = "fitCurve.balanceHandles"
label = "Balance Handles"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]}"
area = "drawing"
milestone = "M3"
summary = "Scale button of the Fit Curve section: redistributes the lengths of the two handles of each selected segment so they are balanced while the segment keeps its overall curvature. The exact balancing rule is not given."
ref = "Palette › Fit Curve"
status = "handbook"

[[command]]
id = "fitCurve.getHandleLength"
label = "Get Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]}"
area = "drawing"
milestone = "M3"
summary = "Query returning the current handle length percentage of each selected segment, the value the grey marker under the buttons indicates."
ref = "Palette › Fit Curve"
status = "inferred"

[[behavior]]
id = "fitCurve.bothHandles"
area = "drawing"
milestone = "M3"
summary = "Fit Curve always changes the two handles of a segment as a pair, also when the selection contains only one of them."
ref = "Palette › Fit Curve"
status = "handbook"

[[behavior]]
id = "fitCurve.percentRange"
area = "drawing"
milestone = "M3"
summary = "Handle length is expressed as a percentage from 1 to 100. About 55 percent approximates a circular or elliptical arc; higher values flatten the curve near its nodes, lower values flatten its middle and sharpen its ends."
ref = "Palette › Fit Curve"
status = "handbook"

[[behavior]]
id = "fitCurve.lengthIndicator"
area = "drawing"
milestone = "M3"
summary = "With a handle selected, a small grey marker appears under the row of buttons and shows where its current length falls within the range."
ref = "Palette › Fit Curve"
status = "handbook"

[[behavior]]
id = "fitCurve.panelSettingsParameter"
area = "font-info"
milestone = "M7"
summary = "A font-level custom parameter named Fit Curve Panel Settings fixes the lower and upper percentage for that document. Its value is two comma-separated numbers, for example 52, 78."
ref = "Palette › Fit Curve"
status = "handbook"

# ───────────────────────────── Layers ─────────────────────────────

[[panel]]
id = "palette.layers"
label = "Layers"
location = "palette"
controls = [
  "layer list of the current glyph, grouped by master",
  "eye toggle per layer: show the layer as an outline while another layer is active",
  "master layer rows: master name in bold",
  "backup layer rows: indented under their master, regular weight, default name is creation date and time",
  "special layer rows (intermediate, alternate, colour, plug-in defined): indented, type label in bold",
  "click: make a layer active; Shift+click: select a range; Cmd+click: non-contiguous selection",
  "double-click a name: rename (not for master layers)",
  "drag a row: reorder within its master; drag a backup onto a master row: use it as master",
  "plus button (bottom left): new backup layer",
  "minus button: delete the selected layer",
  "actions menu: Use as Master",
  "filter menu: Only Show Layers from Current Master, Hide Backup Layers",
  "drag handle at the bottom edge: resize the section",
]
area = "layers"
milestone = "M3"
summary = "Lists every layer of the current glyph: one master layer per font master plus any backup and special layers beneath it. It is where layers are switched, shown, added, renamed, reordered and promoted."
ref = "Palette › Layers"
status = "handbook"

[[command]]
id = "layers.select"
label = "Select Layer"
menu = []
shortcut = ""
kind = "ui"
params = "{glyphs: [names], layer: id, extend?: range|toggle}"
area = "layers"
milestone = "M3"
summary = "Makes a layer of the current glyph the active one, or extends the layer selection as Shift+click and Cmd+click do. Choosing a master layer changes the master shown for the edited or text-selected glyphs only."
ref = "Palette › Layers"
status = "handbook"

[[command]]
id = "layers.toggleVisibility"
label = "Show / Hide Layer"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layer: id, visible?: bool} → {glyphs: [names], layer, visible}"
area = "layers"
milestone = "M3"
summary = "Toggles the eye of a layer. A visible layer is drawn as a faint blue outline behind the active layer of the same glyph. Whether the flag is saved in the document is not stated; we treat it as document data."
ref = "Palette › Layers"
status = "handbook"

[[command]]
id = "layers.addBackupLayer"
label = "New Backup Layer"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs: [names], master?: id, name?: string, from?: id} → {glyphs: [names], layer: id, name}"
area = "layers"
milestone = "M3"
summary = "Plus button: adds a backup layer under the current master of the glyph, named with the current date and time. The handbook describes backups as copies of earlier drawings but does not state outright that the new layer starts as a copy of the active one; we copy the active layer."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[command]]
id = "layers.delete"
label = "Delete Layer"
menu = []
context = ["layers.row"]
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layers: [ids]} → {glyphs: [names], deleted: count}"
area = "layers"
milestone = "M3"
summary = "Minus button: removes the selected layer or layers of the glyph. Master layers are refused; they can only be removed by deleting the master in Font Info."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[command]]
id = "layers.rename"
label = "Rename Layer"
menu = []
context = ["layers.row"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, name: string} → {glyph, layer, name}"
area = "layers"
milestone = "M3"
summary = "Renames a non-master layer, as double-clicking its name in the list does. Master layers always carry the master's name and cannot be renamed here."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[command]]
id = "layers.reorder"
label = "Reorder Layer"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer: id, toIndex: number} → {glyph, layer, index}"
area = "layers"
milestone = "M3"
summary = "Moves a layer to another position among the layers of the same master. A move that would take it under a different master is not allowed."
ref = "Palette › Layers"
status = "handbook"

[[command]]
id = "layers.useAsMaster"
label = "Use as Master"
menu = []
context = ["layers.row"]
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layer: id, name?: string} → {glyphs: [names], backup: id}"
area = "layers"
milestone = "M3"
summary = "Restores a backup layer: its content becomes the master layer's content, the previous master content is saved to a newly created backup layer, and the restored backup is removed. Dragging a backup row onto a master row does the same."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[command]]
id = "layers.onlyShowLayersFromCurrentMaster"
label = "Only Show Layers from Current Master"
menu = []
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "layers"
milestone = "M3"
summary = "Filter-menu toggle that hides all rows belonging to masters other than the current one, to shorten the list in fonts with many masters."
ref = "Palette › Layers › Master Layers"
status = "handbook"

[[command]]
id = "layers.hideBackupLayers"
label = "Hide Backup Layers"
menu = []
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "layers"
milestone = "M3"
summary = "Filter-menu toggle that removes all backup layers from the list without deleting them."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[command]]
id = "layers.list"
label = "List Layers"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name} → {glyph, layers: [{id, name, kind: master|backup|intermediate|alternate|color|other, master, visible}]}"
area = "layers"
milestone = "M3"
summary = "Query returning the layers of a glyph in palette order with id, name, kind (master, backup, intermediate, alternate, colour, other), owning master and visibility."
ref = "Palette › Layers"
status = "inferred"

[[behavior]]
id = "layers.sortedByMaster"
area = "layers"
milestone = "M3"
summary = "The layer list is grouped by master in master order, with each master's backup and special layers indented beneath its master layer."
ref = "Palette › Layers"
status = "handbook"

[[behavior]]
id = "layers.threeKinds"
area = "layers"
milestone = "M1"
summary = "A glyph's layers are of three kinds: master layers (exactly one per font master, needed for interpolation), backup layers (any number, inert copies) and special layers (intermediate, alternate, colour, or plug-in defined)."
ref = "Palette › Layers"
status = "handbook"

[[behavior]]
id = "layers.masterLayersFixed"
area = "layers"
milestone = "M3"
summary = "Master layers cannot be created, deleted or renamed from the Layers section; they follow the masters defined in Font Info > Masters."
ref = "Palette › Layers › Master Layers"
status = "handbook"

[[behavior]]
id = "layers.visibleLayerOutline"
area = "layers"
milestone = "M3"
summary = "A layer whose eye is on is drawn as a thin blue line whenever a different layer of that glyph is being edited. The colour is an appearance setting."
ref = "Palette › Layers"
status = "handbook"

[[behavior]]
id = "layers.rowStyling"
area = "layers"
milestone = "M3"
summary = "Row typography encodes the kind: master layers bold at the top level, backup layers indented in regular weight, special layers indented with a bold label that states their type."
ref = "Palette › Layers"
status = "handbook"

[[behavior]]
id = "layers.backupDefaultName"
area = "layers"
milestone = "M3"
summary = "A new backup layer is named after the date and time of its creation until the user renames it."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[behavior]]
id = "layers.sectionResizable"
area = "ui-chrome"
milestone = "M3"
summary = "The height of the Layers section is changed by dragging the handle at its lower edge."
ref = "Palette › Layers"
status = "handbook"

[[behavior]]
id = "layers.pluginSpecialLayers"
area = "extensions"
milestone = "M13"
summary = "Plug-ins may introduce further kinds of special layers, which the list shows like the built-in ones."
ref = "Palette › Layers › Special Layers"
status = "handbook"

# ───────────────────────────── Transformations ─────────────────────────────

[[panel]]
id = "palette.transformations"
label = "Transformations"
location = "palette"
controls = [
  "origin row: transformation box (3x3 grid on the selection bounds: four corners, four edge centres, centre)",
  "origin row: reference point (the origin clicked with the Scale or Rotate tool)",
  "origin row: metrics point (baseline, half x-height, x-height, half cap height, cap height)",
  "origin row, CJK glyphs: layer dimensions control in place of the metrics point (centre of the layer)",
  "mirror horizontally / mirror vertically buttons",
  "reverse scale button | horizontal percent field over vertical percent field with lock | scale button",
  "rotate counterclockwise button | angle field | rotate clockwise button",
  "slant left button | angle field | slant right button, plus slant down and slant up buttons",
  "align buttons: left, horizontal centre, right, top, vertical centre, bottom",
  "boolean buttons (bottom row): union, subtraction, intersection",
]
area = "drawing"
milestone = "M3"
summary = "Section for numeric transformations of whatever is selected: points, segments, paths, components, anchors, guides and images in Edit View, or whole layers of the glyphs selected in Font View. The button on each side of a field performs the opposite operation with the same value."
ref = "Palette › Transformations"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:54–14:07: the Glyphs 3 section shows a 3×3 origin picker, a crosshair, a metrics-origin picker, two mirror buttons, a scale percentage with a lock and a greyed second percentage, a rotate field with buttons on each side, two slant rows each with its own angle field, six align buttons and three boolean buttons. The two separate slant angle fields differ from this row's single slant field."

[[command]]
id = "transform.setOrigin"
label = "Set Transformation Origin"
menu = []
shortcut = ""
kind = "ui"
params = "{mode: 'box'|'reference'|'metrics'|'layer', boxPoint?: 'topLeft'|'top'|'topRight'|'left'|'center'|'right'|'bottomLeft'|'bottom'|'bottomRight', metric?: 'baseline'|'halfXHeight'|'xHeight'|'halfCapHeight'|'capHeight', point?: [x, y]}"
area = "drawing"
milestone = "M3"
summary = "Chooses the fixed point for Palette transformations: a point of the selection bounding box, the reference point set with the Scale or Rotate tool, a vertical metric of the master, or (for CJK glyphs) the centre of the layer. Alignment ignores this setting, except through Path > Align Selection."
ref = "Palette › Transformations › Transformation Origin"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:54–14:07: the Transformations section shows the 3×3 box picker, a reference-point crosshair and a metrics-origin picker. Choosing an origin is not shown."

[[command]]
id = "transform.mirrorHorizontal"
label = "Mirror Horizontally"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, glyphs?: [names], layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index] (lists with glyph; without them, the whole layer), origin?: {mode: box|reference|metrics|layer, boxPoint?, metric?, point?} | metric name | [x, y] (default the box centre)}"
area = "drawing"
milestone = "M3"
summary = "Flips the selection left to right across a vertical axis through the transformation origin. With a metrics point as origin the axis is the horizontal centre of the layer (half the advance width). A mirrored corner component changes handedness, left corner becoming right corner."
ref = "Palette › Transformations › Mirroring"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:54–14:07 and 19:23–19:50: the Palette button with the tooltip \"flip horizontal\" mirrors the selected copy in place. Not shown: a metrics origin, corner components."

[[command]]
id = "transform.mirrorVertical"
label = "Mirror Vertically"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, glyphs?: [names], layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index] (lists with glyph; without them, the whole layer), origin?: {mode: box|reference|metrics|layer, boxPoint?, metric?, point?} | metric name | [x, y] (default the box centre)}"
area = "drawing"
milestone = "M3"
summary = "Flips the selection top to bottom across a horizontal axis through the transformation origin. With the origin set to half x-height or half cap height, overshoots are kept, so an overshooting arch ends up overshooting the baseline."
ref = "Palette › Transformations › Mirroring"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 29:36–29:42: a copy of an arch is flipped top to bottom and moved down (partly visible; the button is not seen). Not shown: the overshoot rule."

[[command]]
id = "transform.scale"
label = "Scale"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, glyphs?: [names], layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index] (lists with glyph; without them, the whole layer), x: percent, y?: percent (default x), origin?: {mode: box|reference|metrics|layer, boxPoint?, metric?, point?} | metric name | [x, y] (default the box centre)}"
area = "drawing"
milestone = "M3"
summary = "Scales the selection about the transformation origin by the horizontal and vertical percentages of the two fields. Above 100 enlarges, below 100 shrinks, 100 is a no-op; with the lock closed, both axes scale by the value of the horizontal field."
ref = "Palette › Transformations › Scaling"
status = "handbook"

[[command]]
id = "transform.reverseScale"
label = "Reverse Scale"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, glyphs?: [names], layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index] (lists with glyph; without them, the whole layer), x: percent, y?: percent (default x), origin?: {mode: box|reference|metrics|layer, boxPoint?, metric?, point?} | metric name | [x, y] (default the box centre)}"
area = "drawing"
