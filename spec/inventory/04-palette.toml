[[behavior]]
id = "transform.targetsBySelection"
area = "drawing"
milestone = "M3"
summary = "What a Palette transformation acts on follows the selection: selected segments or whole paths in Edit View, otherwise complete glyph layers, including every glyph selected in Font View."
ref = "Palette › Transformations"
status = "handbook"

[[behavior]]
id = "transform.supportedObjects"
area = "drawing"
milestone = "M3"
summary = "Palette transformations apply to points, paths, components, anchors, guides and placed images alike."
ref = "Palette › Transformations"
status = "handbook"
notes = "M3.24: the align buttons move guides and annotations too (crates/engine/src/cmd/transform.rs, align_units); test align_buttons_move_guides_and_annotations."
guesses = [
  "An aligned guide counts as the point it passes through, and keeps its angle; an annotation counts as its position.",
]
observe = [
  "Select a rectangle and a vertical guide to its right, press Align Left, and note whether the guide moves to the rectangle's left edge.",
]

[[behavior]]
id = "transform.oppositeButtonsExact"
area = "drawing"
milestone = "M3"
summary = "The buttons on either side of a value field are exact inverses of each other, and applying one after the other returns the original coordinates without the rounding drift the unit grid could otherwise cause. How the reference achieves this (stored unrounded positions or an undo-like shortcut) is not explained."
ref = "Palette › Transformations"
status = "handbook"
notes = "M3.24: crates/engine/src/cmd/transform.rs (LastPalette, undone_layers); test opposite_buttons_give_back_the_coordinates_exactly."
guesses = [
  "Exactness comes from a remembered pre-state: the next Palette mirror, scale, rotation or slant whose map undoes the last one (product within 1e-9 of the identity), on the same targets and origin with no edit in between, puts back the layers from before it (Palette question 5).",
  "Any edit in between, an undo included, breaks the link; a drag with the Rotate or Scale tool keeps no memory.",
]
observe = [
  "Draw a 7-unit square, scale it 90 % with the origin at its bottom left, press the reverse scale button, save, and read the coordinates in the saved file.",
]

[[behavior]]
id = "transform.originIndicator"
area = "drawing"
milestone = "M3"
summary = "The reference point is set by clicking the canvas with the Scale or Rotate tool. While one of those tools is active it appears as a crosshair inside a red ring, and as a bare crosshair with any other tool."
ref = "Palette › Transformations › Transformation Origin"
status = "handbook"
notes = "Documented, not yet observed. M6.32 draws it (`crates/ui/src/canvas/bounding_box.rs`); the placed point is the Rotate and Scale tools' common fixed point. While none is placed, those tools show the centre of the selection's box, which a drag is about."
guesses = [
  "A placed reference point serves the Rotate and Scale tools in every glyph and document until another is placed, or until a box point is chosen in the Palette or Reference Point is pressed while it is on, which take it away; rotating in a second glyph after a click in the first settles it.",
  "With other tools the crosshair shows only while the Transformations section works about the reference point; placing a point and switching to the Select tool in the reference app settles it.",
]
observe = [
  "Click with the Rotate tool, then choose the Select tool with the box origin and with the reference point chosen in the Palette: note when the crosshair shows.",
  "Click with the Rotate tool in one glyph, open another glyph and drag with the Rotate tool: note the point it turns about. Then choose a box point in the Palette and drag again.",
]

[[behavior]]
id = "transform.originMetricsChoices"
area = "drawing"
milestone = "M3"
summary = "The metrics-point origin offers five heights taken from the master's metrics: baseline, half x-height, x-height, half cap height and cap height. Its horizontal position is the centre of the layer, at least for mirroring."
ref = "Palette › Transformations › Transformation Origin"
status = "handbook"

[[behavior]]
id = "transform.originCjkLayerCenter"
area = "drawing"
milestone = "M3"
summary = "For CJK glyphs the metrics-point control is replaced by a layer-dimensions control whose origin is the centre of the layer: half the advance width horizontally and midway between ascender and descender vertically."
ref = "Palette › Transformations › Transformation Origin"
status = "handbook"
notes = "M3.24: the engine turns a metrics origin into the layer origin for such glyphs (transform.rs, origin_for); the section shows Layer Center in place of the metric heights (crates/ui/src/panels/transformations.rs). Tests a_cjk_glyph_takes_the_layer_centre_for_a_metrics_origin and cjk_glyphs_offer_the_layer_centre."
guesses = [
  "A glyph counts as CJK when its script, as stored or from the glyph data, is han, hangul, kana or bopomofo, the scripts that also get the 1000-unit default width.",
  "Path › Transformations treats a metrics origin of a CJK glyph the same way.",
  "The control is one button named Layer Center; it reads as pressed while the metrics or layer origin is chosen.",
]
observe = [
  "Open a han glyph and note what the Transformations section shows in place of the metric heights, and whether Path › Transformations changes too.",
]

[[behavior]]
id = "transform.alignIgnoresOrigin"
area = "drawing"
milestone = "M3"
summary = "The align buttons are the only Palette transformations that do not use the transformation origin; they always work from the bounding box of the selection. Path > Align Selection (Cmd+Shift+A), by contrast, does honour the origin setting."
ref = "Palette › Transformations › Aligning"
status = "handbook"

[[behavior]]
id = "transform.mirrorComponentAnchors"
area = "components"
milestone = "M6"
summary = "Flipping a glyph component vertically swaps the roles of the base glyph's top and bottom anchors for that component, so a mark drawn for the top can be reused below."
ref = "Palette › Transformations › Mirroring"
status = "handbook"
notes = "Documented, not yet observed. The same rule as components.verticalFlipSwapsTopBottomAnchors; one implementation. M6.1: implemented in crates/components/src/propagate.rs."

[[behavior]]
id = "transform.mirrorCornerComponent"
area = "components"
milestone = "M6"
summary = "Mirroring a corner component changes its handedness: a left corner becomes a right corner and the reverse."
ref = "Palette › Transformations › Mirroring"
status = "handbook"
notes = "Documented, not yet observed. The same rule as corner.mirrorViaPalette; one implementation: `cornerComponent.setScale` with `flip` (M6.9), which the Palette's mirror buttons reach with corners selected on the canvas (M6.20)."

[[behavior]]
id = "transform.slantNotAdditive"
area = "drawing"
milestone = "M3"
summary = "Slant amounts do not add up: slanting twice by an angle gives a different shape from slanting once by twice that angle. The handbook gives no formula; a shear by the tangent of the angle would explain it."
ref = "Palette › Transformations › Rotating & Slanting"
status = "handbook"

[[behavior]]
id = "transform.booleanNeedsClosedPaths"
area = "path-ops"
milestone = "M3"
summary = "The three boolean buttons combine closed paths. Behaviour for open paths in the selection is not described."
ref = "Palette › Transformations › Boolean Operations"
status = "handbook"
