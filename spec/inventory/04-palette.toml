# Source: Glyphs 4 Handbook, chapter "Palette"
#         (https://handbook.glyphsapp.com/palette/ ; scratch copy handbook/04-palette.txt, whole file)
# Date:   2026-10-07
# All wording is our own. Labels, menu paths and shortcuts match the reference where it states them.
# The Palette buttons carry icons, not text, in the reference; command labels are therefore ours
# unless the handbook names the action. Rows marked `inferred` are FontCraft designs.

# ───────────────────────────── Sidebar ─────────────────────────────

[[panel]]
id = "palette"
label = "Palette"
location = "sidebar"
controls = [
  "sidebar button at the window's top-right corner: show or hide the Palette",
  "section header with a chevron on its left: collapse or expand the section",
  "built-in sections in order: Dimensions, Fit Curve, Layers, Transformations",
  "additional sections contributed by plug-ins",
  "contextual controls at the bottom, shown while View > Show Info is on",
]
area = "ui-chrome"
milestone = "M3"
summary = "Right-hand sidebar of the font window made of collapsible sections. Four sections are built in and plug-ins can add more."
ref = "Palette"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 5:08: the Palette shows Alignment, Dimensions, Fit Curve, Layers and Transformations, plus Stroke while a path is selected. The Alignment section is not in this row's built-in list; it may come from a plug-in or be Glyphs 3 only. Not shown: collapsing sections, the sidebar button. Built in M3.15: the four built-in sections in order, each collapsed or expanded with `palette.toggleSection`; the contextual area at the foot shows only while Show Info is on. Plug-in sections are M13."

[[command]]
id = "window.palette"
label = "Palette"
menu = ["Window"]
shortcut = "Cmd+Alt+P"
kind = "ui"
params = "{on?: bool}"
area = "ui-chrome"
milestone = "M3"
summary = "Shows or hides the Palette sidebar. The sidebar button at the top right of the window does the same."
ref = "Palette"
status = "handbook"
notes = "In `crates/ui` (UI.41c) the Palette sections are dock panels, and the Palette is every panel docked at the window's end edge: hiding closes them and keeps their list, showing opens that list again where each panel was, with the same tabs in front, or the panels the default layout docks there. The sidebar button sits at the options bar's end, the window's top right (`shell/bars.rs`), lit while the Palette shows, its tooltip naming Cmd+Alt+P. Documented, not yet observed."
guesses = [
  "With every Palette panel closed one at a time, Window › Palette opens the panels the default layout docks at the end edge; settle by closing the reference app's Palette sections one by one and choosing Window › Palette.",
]

[[command]]
id = "window.togglePanel"
label = "Show or Hide Panel"
menu = []
shortcut = ""
kind = "ui"
params = "{panel: id}"
area = "ui-chrome"
milestone = "M3"
summary = "Opens a dock panel that is closed, or closes it. Window › Panels lists every panel but the document area as a check row, checked while the panel is open."
ref = "Palette"
status = "inferred"
own = true
notes = "`crates/ui` only (UI.41c): the panel ids are `PanelId::id`. A panel open behind another tab of its group counts as open, so its row closes it."
guesses = [
  "The panel rows sit in a Panels submenu of the Window menu rather than in the Window menu itself, which keeps the windows the reference lists there apart; settle against the reference app's Window menu.",
]

[[command]]
id = "window.resetLayout"
label = "Reset Layout"
menu = ["Window"]
shortcut = ""
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M3"
summary = "Puts every dock panel back where it starts and shows the Palette sections that were hidden."
ref = "Palette"
status = "inferred"
own = true
notes = "`crates/ui` only: the dock layout goes back to `dock::default_workspace` and the hidden Palette sections are shown again. The reference app's panels are fixed around the window, so it has nothing to reset."

[[command]]
id = "palette.toggleSection"
label = "Collapse / Expand Section"
menu = []
shortcut = ""
kind = "ui"
params = "{section: 'dimensions'|'fitCurve'|'layers'|'transformations'|'infoBox'|'modules'|panel id, expanded?: bool}"
area = "ui-chrome"
milestone = "M3"
summary = "Collapses a Palette section to its title row or expands it again, as clicking the chevron beside the section name does."
ref = "Palette"
status = "handbook"
notes = "`crates/ui` (`shell/window.rs`): every Palette section is a dock panel, and the command minimizes or expands the dock group that holds it, as the group's own minimize button does. Omitted, `expanded` toggles. A section that is not open, or an id that is no panel, is refused. Plug-in sections are forms in the Modules panel (`palette.pluginSections`) and collapse with it (`section: modules`)."
guesses = [
  "A section collapses with the panels tabbed in its dock group (Dimensions, Transformations and Fit Curve share one by default); the reference stacks its sections, each with its own chevron.",
  "Plug-in sections collapse together with the Modules panel, not one by one.",
]
observe = ["Collapse the Transformations section with its chevron: note whether the sections around it stay expanded and whether the state is kept after a restart."]

[[behavior]]
id = "palette.pluginSections"
area = "extensions"
milestone = "M13"
summary = "Plug-ins can register their own Palette sections, which appear alongside the built-in ones and collapse the same way."
ref = "Palette"
status = "handbook"
notes = "Documented, not yet observed. Built in M13.6: every installed filter module that declares parameters has a Palette section after the built-in ones, titled with the module's name, with one field per parameter and an Apply button; it collapses with palette.toggleSection like the built-in sections. Modules run no interface code (plugin.kind.palette)."
guesses = [
  "Module sections follow the built-in sections in the order of the modules' names; the handbook does not say where plug-in sections go.",
  "Values typed into a module's form are kept for the session only, and a module replaced by another version starts again from its defaults.",
]
observe = [
  "Install a palette plug-in from the Plugin Manager, relaunch and note where its section appears among the built-in Palette sections and whether it collapses like them.",
]

[[command]]
id = "palette.setModuleValue"
label = "Set Module Parameter"
menu = []
shortcut = ""
kind = "ui"
params = "{id: filter module id, name: parameter name, value: number|bool|string}"
area = "extensions"
milestone = "M13"
summary = "Sets one field of a filter module's Palette section, held to the parameter's range. The value is kept for the session."
ref = "Palette"
status = "inferred"
notes = "The command id and label are ours: the handbook describes plug-in Palette sections, not how their fields are stored. The form values are view state."
guesses = [
  "A module's field values last for the session and are not saved with the document or the settings; the handbook does not say whether plug-in Palette sections keep their values, and a plug-in section in the reference app, edited and reopened after a restart, settles it.",
]

[[command]]
id = "palette.applyModule"
label = "Apply Module"
menu = []
shortcut = ""
kind = "ui"
params = "{id: filter module id}"
area = "extensions"
milestone = "M13"
summary = "The Apply button of a filter module's Palette section: runs the module with the section's values on what its Filter menu item acts on (the edited glyph and its selected nodes, or the glyphs selected in Font View)."
ref = "Palette"
status = "inferred"
notes = "The command id and label are ours. It runs plugin.runFilter, one undo step; with no glyph chosen it refuses as the Filter menu item does."

# ───────────────────────────── Dimensions ─────────────────────────────
guesses = [
  "Apply acts on the same glyphs and nodes as the module's Filter menu item and makes one undo step; the handbook does not describe a filter section's Apply button, and running one in the reference app with nodes selected settles it.",
]

[[panel]]
id = "palette.dimensions"
label = "Dimensions"
location = "palette"
controls = [
  "diagram of typical letter parts with one number field per labelled measurement",
  "empty fields show -- ; click a number or an empty field to type a value",
  "the set of fields depends on the script of the current glyph",
]
area = "guides-metrics"
milestone = "M3"
summary = "Notepad for recurring measurements of the design such as stem and bowl thicknesses. The numbers are stored per master and are reference only: they change nothing in the outlines or the exported font."
ref = "Palette › Dimensions"
status = "handbook"
notes = "Built in M3.15: one labelled field per key of the script of the current glyph, without the letter diagram. In `crates/ui` (`panels/dimensions.rs`) the notepad is the one of the master the canvas shows, in Font View too; it docks with Transformations and Fit Curve in the default layout."
guesses = [
  "In Font View the panel shows the notepad of the current master rather than the first master's; switching masters in Font View in the reference app with the Dimensions section open settles it.",
]

[[command]]
id = "dimensions.setValue"
label = "Set Dimension"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id, key: string, value?: number|null} → {master, key, value}"
area = "guides-metrics"
milestone = "M3"
summary = "Stores one measurement in the Dimensions notepad of a master, or clears it with null. The field keys per script are not listed in the handbook."
ref = "Palette › Dimensions"
status = "handbook"
notes = "Stored in the font's user data under `GSDimensionPlugin.Dimensions`, one dictionary of field key to number per master id, as the corpus `.glyphs` files hold them. A field that held text keeps text."

[[command]]
id = "dimensions.getValues"
label = "Get Dimensions"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id, script?: string, glyph?: name} → {master, script?, fields?, values}"
area = "guides-metrics"
milestone = "M3"
summary = "Query returning the Dimensions values noted for a master, optionally limited to the fields of one script."
ref = "Palette › Dimensions"
status = "inferred"
notes = "An unknown script given explicitly is an error; a glyph whose script has no known fields gets every value."
guesses = [
  "The field keys per script come from the corpus files (Latin: HH, HV, OH, OV, nV, nd, oH, oV, tH; Arabic: arAlef, arBar); the reference does not document them.",
]

[[behavior]]
id = "dimensions.perMaster"
area = "guides-metrics"
milestone = "M3"
summary = "Dimensions values are kept separately for every master, so switching master switches the numbers shown."
ref = "Palette › Dimensions"
status = "handbook"
guesses = [
  "Values are stored under `GSDimensionPlugin.Dimensions` in the font's user data, one dictionary per master id, the key the corpus files use (Palette question 1).",
]

[[behavior]]
id = "dimensions.fieldsFollowScript"
area = "guides-metrics"
milestone = "M3"
summary = "Which measurement fields the Dimensions section offers follows the script assigned to the current glyph. That script can be overridden per glyph through Edit > Info for Selection."
ref = "Palette › Dimensions"
status = "handbook"

[[behavior]]
id = "dimensions.noEffectOnFont"
area = "guides-metrics"
milestone = "M3"
summary = "Dimensions are informational. No tool, filter or export step is documented in this chapter as reading them."
ref = "Palette › Dimensions"
status = "handbook"

# ───────────────────────────── Fit Curve ─────────────────────────────

[[panel]]
id = "palette.fitCurve"
label = "Fit Curve"
location = "palette"
controls = [
  "left percentage field: handle length applied by the leftmost button (lower bound)",
  "right percentage field: handle length applied by the rightmost button (upper bound)",
  "eight round buttons: evenly spaced handle lengths from the left to the right value",
  "small grey marker under the buttons: current length of the selected handle",
  "plus button: lengthen the handles of the selected segments",
  "minus button: shorten the handles of the selected segments",
  "scale (balance) button: even out the two handles of each segment",
]
area = "drawing"
milestone = "M3"
summary = "Section for setting the handle lengths of curve segments as a percentage, to get evenly curved outlines. Every action treats both handles of a segment together even if only one is selected."
ref = "Palette › Fit Curve"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 10:31–10:35 and 26:01: two percentage fields, reading 50% and 70%, with eight round buttons between a minus and a plus button. Not shown: the grey marker, the balance button. The 50/70 values are 04 open question 10. Built in M3.15: the balance button sits between the two range fields so the row of steps fits the sidebar."

[[command]]
id = "fitCurve.applyStep"
label = "Fit Curve"
menu = []
shortcut = "Ctrl+Alt+1"
when = "editView"
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]], step: 1..8, min?: percent, max?: percent} → {segments: count, percent, selection}"
area = "drawing"
milestone = "M3"
summary = "Sets the handles of the selected curve segments to one of eight lengths. Step 1 is the value of the left field, step 8 the value of the right field, and steps 2 to 7 divide the range between them evenly. Ctrl+Alt+1 through Ctrl+Alt+8 run steps 1 to 8."
ref = "Palette › Fit Curve"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 10:31–10:35 and 26:01–26:16: handle lengths change step by step while an on-screen key overlay reads Ctrl, Cmd and Opt with 1 to 8 (Cmd+Ctrl+Alt+1 … 8), not this row's Ctrl+Alt; see 04 open question 11."
observe = [
  "Select a curve segment, press Ctrl+Alt+1, then Cmd+Ctrl+Alt+1, and note which of the two changes the handle lengths; then read the Fit Curve entries in Settings › Shortcuts.",
]

[[command]]
id = "fitCurve.setHandleLength"
label = "Set Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]], percent: 1..100} → {segments: count, percent, selection}"
area = "drawing"
milestone = "M3"
summary = "Sets both handles of each selected curve segment to an explicit percentage. Generalises the eight buttons for agents; values are clamped to 1 to 100."
ref = "Palette › Fit Curve"
status = "inferred"
guesses = [
  "A handle's percentage is its length over the distance from its node to the intersection of the two handles, or the chord when the handles are parallel (Palette question 2).",
]

[[command]]
id = "fitCurve.increase"
label = "Increase Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]], min?: percent, max?: percent} → {segments: count, selection}"
area = "drawing"
milestone = "M3"
summary = "Plus button: lengthens the handles of the selected curve segments uniformly by one increment. The handbook does not give the increment; ours is the next of the eight steps above the segment's mean percentage, at most the top of the range."
ref = "Palette › Fit Curve"
status = "inferred"
guesses = [
  "Plus moves to the next of the eight steps above the segment's mean percentage; the handbook gives no increment.",
]

[[command]]
id = "fitCurve.decrease"
label = "Decrease Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]], min?: percent, max?: percent} → {segments: count, selection}"
area = "drawing"
milestone = "M3"
summary = "Minus button: shortens the handles of the selected curve segments uniformly by one increment. Ours is the step below the segment's mean percentage, at least the bottom of the range."
ref = "Palette › Fit Curve"
status = "inferred"
guesses = [
  "Minus moves to the step below the segment's mean percentage; the handbook gives no increment.",
]

[[command]]
id = "fitCurve.setRange"
label = "Set Fit Curve Range"
menu = []
shortcut = ""
kind = "ui"
params = "{min?: percent, max?: percent}"
area = "drawing"
milestone = "M3"
summary = "Sets the two percentage fields that define what the first and the last of the eight buttons apply. A per-font custom parameter can supply these two values instead."
ref = "Palette › Fit Curve"
status = "handbook"

[[command]]
id = "fitCurve.balanceHandles"
label = "Balance Handles"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]]} → {segments: count, selection}"
area = "drawing"
milestone = "M3"
summary = "Scale button of the Fit Curve section: redistributes the lengths of the two handles of each selected segment so they are balanced while the segment keeps its overall curvature. The handbook does not give the rule; ours sets both handles to their mean percentage."
ref = "Palette › Fit Curve"
status = "inferred"
guesses = [
  "Balance sets both handles to their mean percentage; the handbook gives no rule.",
]

[[command]]
id = "fitCurve.getHandleLength"
label = "Get Handle Length"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]]} → {segments: [{segment, percents}], percent}"
area = "drawing"
milestone = "M3"
summary = "Query returning the current handle length percentage of each selected segment, the value the grey marker under the buttons indicates."
ref = "Palette › Fit Curve"
status = "inferred"
own = true

[[behavior]]
id = "fitCurve.bothHandles"
area = "drawing"
milestone = "M3"
summary = "Fit Curve always changes the two handles of a segment as a pair, also when the selection contains only one of them."
ref = "Palette › Fit Curve"
status = "handbook"

[[behavior]]
id = "fitCurve.percentRange"
area = "drawing"
milestone = "M3"
summary = "Handle length is expressed as a percentage from 1 to 100. About 55 percent approximates a circular or elliptical arc; higher values flatten the curve near its nodes, lower values flatten its middle and sharpen its ends."
ref = "Palette › Fit Curve"
status = "handbook"
guesses = [
  "Without the `Fit Curve Panel Settings` parameter the range is 48 to 74 %, the handbook's example, and values beyond the range are clamped to it (Palette question 2).",
]
observe = [
  "In a new font without the Fit Curve Panel Settings parameter, open the Palette's Fit Curve section and read the two percentage fields.",
]

[[behavior]]
id = "fitCurve.lengthIndicator"
area = "drawing"
milestone = "M3"
summary = "With a handle selected, a small grey marker appears under the row of buttons and shows where its current length falls within the range."
ref = "Palette › Fit Curve"
status = "handbook"

[[behavior]]
id = "fitCurve.panelSettingsParameter"
area = "font-info"
milestone = "M3"
summary = "A font-level custom parameter named Fit Curve Panel Settings fixes the lower and upper percentage for that document. Its value is two comma-separated numbers, for example 52, 78."
ref = "Palette › Fit Curve"
status = "handbook"

# ───────────────────────────── Layers ─────────────────────────────
notes = "Moved from M7 to M3 by the M7 planning pass: M3 built it (crates/engine/src/cmd/fit_curve.rs reads the parameter)."

[[panel]]
id = "palette.layers"
label = "Layers"
location = "palette"
controls = [
  "layer list of the current glyph, of the glyphs selected in Font View or in the text (the layers all of them have), grouped by master",
  "eye toggle per layer: show the layer as an outline while another layer is active",
  "master layer rows: master name in bold",
  "backup layer rows: indented under their master, regular weight, default name is creation date and time",
  "special layer rows (intermediate, alternate, colour, plug-in defined): indented, type label in bold",
  "click: make a layer active; Shift+click: select a range; Cmd+click: non-contiguous selection",
  "double-click a name: rename (not for master layers)",
  "drag a row: reorder within its master; drag a backup onto a master row: use it as master",
  "plus button (bottom left): new backup layer",
  "minus button: delete the selected layer",
  "actions menu: Use as Master",
  "filter menu: Only Show Layers from Current Master, Hide Backup Layers",
  "drag handle at the bottom edge: resize the section",
]
area = "layers"
milestone = "M3"
summary = "Lists every layer of the current glyph: one master layer per font master plus any backup and special layers beneath it. It is where layers are switched, shown, added, renamed, reordered and promoted."
ref = "Palette › Layers"
status = "handbook"
notes = "Built in M3.15, M3.10 and M3.40. In Edit View a click runs `layers.select`; in Font View, where no layer is active, a click picks the row the buttons act on. With several glyphs (M3.91) a row stands for the layer each glyph has: the master layer, else the layer with the same id, else the next one under the same master with the same name and special attributes; every command changes all of them in one undo step. The row menu acts on every selected row when the clicked one is selected. A deleted active layer gives way to its master layer. A non-master row is dragged by its name: dropped on a row of the same master it runs `layers.reorder`, a backup dropped on its master's row runs `layers.useAsMaster`, and a drop under another master is refused (the cursor shows it, nothing runs). The section's resize handle is not built. Documented, not yet observed: the minus button deletes every selected row that is not a master layer."
guesses = [
  "With several glyphs selected in Font View or in the text the section lists only the layers all of them have, and a layer of one glyph is the other's by its id or by its name under the same master; with Font View in front and nothing selected it is empty. Palette › Layers with one and three glyphs selected settles it.",
  "The row menu acts on every selected row when the clicked one is selected; Use as Master then needs one backup of each master, and the intermediate and alternate editors need one row and one glyph. A right-click on one of three selected rows settles it.",
  "The master layer becomes active when the active layer is deleted, also when another master is the current one.",
  "While a row is dragged, an accent-coloured line between rows shows where it will land, and the master row is outlined when a backup dropped there would replace the master layer.",
  "Dropping on a row's upper half puts the dragged row above it, on its lower half below it.",
  "A row that is not a backup, dropped on its own master's row, moves to the top of that master's rows.",
  "A backup dropped on another master's row is refused, as Use as Master restores a backup only into its own master.",
  "In text mode, a click on a master row with glyphs selected in the text switches those glyphs and the edited glyph (the one after the cursor, whose rows the section shows) when it has that master's layer. Settled by selecting the first two letters of a three-letter text and clicking another master's row in the reference.",
]
observe = [
  "Drag a backup layer of F4's first master onto the second master's row: note whether it is refused or becomes that master's layer.",
  "In text mode, type ABC, select A and B with the cursor ending before C, click the second master's row: note which of A, B and C switch.",
  "Drag a layer within its master: note how the drop position is shown.",
]

[[command]]
id = "layers.select"
label = "Select Layer"
menu = []
shortcut = ""
kind = "ui"
params = "{glyphs?: [names], layer: id, extend?: range|toggle}"
area = "layers"
milestone = "M3"
summary = "Makes a layer of the current glyph the active one, or extends the layer selection as Shift+click and Cmd+click do. Choosing a master layer changes the master shown for the edited or text-selected glyphs only."
ref = "Palette › Layers"
status = "handbook"
notes = "Built in M3.10. The tab keeps the layer per glyph name, so a glyph that appears twice in the line shows the same layer in both places. The active layer is what the canvas draws and the tools and shell commands edit; metric lines and zones are its master's. A range runs from the active layer to the clicked row in the order the section lists them, after its filters. Documented, not yet observed: whether a range or Cmd+click also changes the active layer; we keep it."

[[command]]
id = "layers.toggleVisibility"
label = "Show / Hide Layer"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layer: id, visible?: bool} → {glyphs: [names], layer, visible}"
area = "layers"
milestone = "M3"
summary = "Toggles the eye of a layer. A visible layer is drawn as a faint blue outline behind the active layer of the same glyph. Whether the flag is saved in the document is not stated; we treat it as document data."
ref = "Palette › Layers"
status = "handbook"
guesses = [
  "Visibility is stored with the layer and saved (Palette question 3).",
]

[[command]]
id = "layers.addBackupLayer"
label = "New Backup Layer"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs: [names], master?: id, name?: string, from?: id} → {glyphs: [names], layer: id, name}"
area = "layers"
milestone = "M3"
summary = "Plus button: adds a backup layer under the current master of the glyph, named with the current date and time. The handbook describes backups as copies of earlier drawings but does not state outright that the new layer starts as a copy of the active one; we copy the active layer."
ref = "Palette › Layers › Backup Layers"
status = "handbook"
guesses = [
  "Plus copies the active layer (Palette question 3).",
  "The section names the backup by the local date and time as 2026-10-10 14:05; the command alone, which agents run, by UTC. The name of a new backup in the reference app settles the spelling.",
]

[[command]]
id = "layers.delete"
label = "Delete Layer"
menu = []
context = ["layers.row"]
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layers: [ids]} → {glyphs: [names], deleted: count}"
area = "layers"
milestone = "M3"
summary = "Minus button: removes the selected layer or layers of the glyph. Master layers are refused; they can only be removed by deleting the master in Font Info."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[command]]
id = "layers.rename"
label = "Rename Layer"
menu = []
context = ["layers.row"]
shortcut = ""
kind = "engine"
params = "{glyph: name | glyphs: [names], layer: id, name: string} → {glyph | glyphs, layer, name}"
area = "layers"
milestone = "M3"
summary = "Renames a non-master layer, as double-clicking its name in the list does. Master layers always carry the master's name and cannot be renamed here."
ref = "Palette › Layers › Backup Layers"
status = "handbook"

[[command]]
id = "layers.reorder"
label = "Reorder Layer"
menu = []
shortcut = ""
kind = "engine"
