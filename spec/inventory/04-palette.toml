[[command]]
id = "transform.setSettings"
label = "Set Transformation Values"
menu = []
shortcut = ""
kind = "ui"
params = "{scaleX?: percent, scaleY?: percent, rotate?: degrees, slant?: degrees}"
area = "drawing"
