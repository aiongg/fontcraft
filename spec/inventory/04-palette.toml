# ───────────────────────────── Transformations ─────────────────────────────

[[panel]]
id = "palette.transformations"
label = "Transformations"
location = "palette"
controls = [
  "origin row: transformation box (3x3 grid on the selection bounds: four corners, four edge centres, centre)",
  "origin row: reference point (the origin clicked with the Scale or Rotate tool)",
  "origin row: metrics point (baseline, half x-height, x-height, half cap height, cap height)",
  "origin row, CJK glyphs: layer dimensions control in place of the metrics point (centre of the layer)",
  "mirror horizontally / mirror vertically buttons",
  "reverse scale button | horizontal percent field over vertical percent field with lock | scale button",
  "rotate counterclockwise button | angle field | rotate clockwise button",
  "slant left button | angle field | slant right button, plus slant down and slant up buttons",
  "align buttons: left, horizontal centre, right, top, vertical centre, bottom",
  "boolean buttons (bottom row): union, subtraction, intersection",
]
area = "drawing"
milestone = "M3"
summary = "Section for numeric transformations of whatever is selected: points, segments, paths, components, anchors, guides and images in Edit View, or whole layers of the glyphs selected in Font View. The button on each side of a field performs the opposite operation with the same value."
ref = "Palette › Transformations"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:54–14:07: the Glyphs 3 section shows a 3×3 origin picker, a crosshair, a metrics-origin picker, two mirror buttons, a scale percentage with a lock and a greyed second percentage, a rotate field with buttons on each side, two slant rows each with its own angle field, six align buttons and three boolean buttons. The two separate slant angle fields differ from this row's single slant field. Built in M3.15 without the CJK layer origin control. The boolean buttons (labelled Union, Subtract, Intersect) take the selected paths, a path counting as selected when any of its nodes or handles is; with none selected they act on every path of the layer, and in Font View on the selected glyphs."

[[command]]
id = "transform.setOrigin"
label = "Set Transformation Origin"
menu = []
shortcut = ""
kind = "ui"
params = "{mode?: 'box'|'reference'|'metrics'|'layer', boxPoint?: 'topLeft'|'top'|'topRight'|'left'|'center'|'right'|'bottomLeft'|'bottom'|'bottomRight', metric?: 'baseline'|'halfXHeight'|'xHeight'|'halfCapHeight'|'capHeight', point?: [x, y] | null}"
area = "drawing"
milestone = "M3"
summary = "Chooses the fixed point for Palette transformations: a point of the selection bounding box, the reference point set with the Scale or Rotate tool, a vertical metric of the master, or (for CJK glyphs) the centre of the layer. Alignment ignores this setting, except through Path > Align Selection."
ref = "Palette › Transformations › Transformation Origin"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:54–14:07: the Transformations section shows the 3×3 box picker, a reference-point crosshair and a metrics-origin picker. Choosing an origin is not shown. Built in M3.5: `point` without `mode` places the reference point and keeps the mode (what a click with the Rotate or Scale tool sends); `boxPoint` and `metric` are kept for their modes; mode `reference` needs a placed point. `point: null` takes the reference point away; choosing a box point in the Palette sends it, and so does pressing Reference Point while it is on."
guesses = [
  "The metrics-point origin sits at half the advance width for every operation, not only mirroring (Palette question 5).",
]

[[command]]
id = "transform.mirrorHorizontal"
label = "Mirror Horizontally"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, glyphs?: [names], layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index] (lists with glyph; without them, the whole layer), image?: bool (with glyph: the layer's placed image too; without lists, the image alone), origin?: {mode: box|reference|metrics|layer, boxPoint?, metric?, point?} | metric name | [x, y] (default the box centre)}"
area = "drawing"
milestone = "M3"
summary = "Flips the selection left to right across a vertical axis through the transformation origin. With a metrics point as origin the axis is the horizontal centre of the layer (half the advance width). A mirrored corner component changes handedness, left corner becoming right corner."
ref = "Palette › Transformations › Mirroring"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:54–14:07 and 19:23–19:50: the Palette button with the tooltip \"flip horizontal\" mirrors the selected copy in place. Not shown: a metrics origin, corner components."

[[command]]
id = "transform.mirrorVertical"
label = "Mirror Vertically"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, glyphs?: [names], layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index] (lists with glyph; without them, the whole layer), image?: bool (with glyph: the layer's placed image too; without lists, the image alone), origin?: {mode: box|reference|metrics|layer, boxPoint?, metric?, point?} | metric name | [x, y] (default the box centre)}"
area = "drawing"
milestone = "M3"
summary = "Flips the selection top to bottom across a horizontal axis through the transformation origin. With the origin set to half x-height or half cap height, overshoots are kept, so an overshooting arch ends up overshooting the baseline."
ref = "Palette › Transformations › Mirroring"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 29:36–29:42: a copy of an arch is flipped top to bottom and moved down (partly visible; the button is not seen). Not shown: the overshoot rule."

