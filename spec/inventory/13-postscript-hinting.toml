# Inventory: PostScript hinting
# Sources:
#   - Glyphs 4 Handbook, chapter "PostScript Hinting" (https://handbook.glyphsapp.com/), status "handbook"
#   - AFDKO (Apache-2.0), refs/afdko/docs/otfautohint_Notes.md, refs/afdko/docs/AFDKO-Overview.md and
#     refs/afdko/python/afdko/otfautohint/{__main__,autohint,fdTools,hinter}.py, status "docs"
# Date: 2026-10-07
#
# Notes for readers of this file:
#   - Custom parameters named here (Autohint, blueScale, blueShift, blueFuzz, Family Alignment Zones,
#     Get Hints From Master) are described as [[behavior]] rows; their [[parameter]] rows belong to
#     the custom-parameter inventory so that parameter names stay unique across files.
#   - Context-menu commands carry menu = [] (the schema has no slot for context menus); the summary
#     says where the item appears.
#   - Ids: hinting.ps.* = rules, hint.ps.* = commands on glyph-level hints, autohint.ps.* = the
#     autohinter engine as documented by otfautohint.

# ---------------------------------------------------------------------------------------------
# Concepts and font-level hints
# ---------------------------------------------------------------------------------------------

[[behavior]]
id = "hinting.ps.twoLevels"
area = "hinting-ps"
milestone = "M10"
summary = "PostScript hinting data comes in two levels: font-level values (standard stems and alignment zones, plus a few optional numbers) that end up in the CFF Private dict, and glyph-level hints stored on a layer, each of which is either a stem hint or a ghost hint. The intended workflow is to set the font-level values well and let the autohinter produce the glyph-level hints."
ref = "PostScript Hinting › introduction"
status = "handbook"

[[behavior]]
id = "hinting.ps.hintingIsOptional"
area = "hinting-ps"
milestone = "M10"
summary = "Hinting is never required: a font can be exported with no glyph-level hints, and existing hinting can be left out. The reference recommends this for irregular designs (handwriting, ornament, grunge), for connected scripts and icon fonts where shape fidelity matters more than crisp pixels, and for fonts used only where hints are ignored, because the hint data only adds file size there."
ref = "PostScript Hinting › introduction"
status = "handbook"

[[behavior]]
id = "hinting.ps.standardStems"
area = "hinting-ps"
milestone = "M10"
summary = "Each master holds a list of horizontal stem widths (thickness of horizontal strokes: crossbars, serifs, top and bottom of a round) and a list of vertical stem widths (thickness of upright strokes), edited in Font Info › Masters. Up to twelve values per orientation are meaningful; the reference advises one or two representative values each, merging values that lie close together."
ref = "PostScript Hinting › Standard Stems"
status = "handbook"

[[behavior]]
id = "hinting.ps.standardStems.firstValueIsPrimary"
area = "hinting-ps"
milestone = "M10"
summary = "The first horizontal and first vertical stem of a master are the primary values and should describe the most common glyphs (usually lowercase). Other features read them too (the Cursivy algorithm and the Rounded Font filter are named); every further value is used for hinting only, and the horizontal stems also feed TrueType hinting."
ref = "PostScript Hinting › Standard Stems"
status = "handbook"

[[behavior]]
id = "hinting.ps.standardStems.interpolateByName"
area = "hinting-ps"
milestone = "M10"
summary = "When an instance is interpolated, a stem value is computed only from stems that carry the same name in the contributing masters; the name, not the list position, is the matching key."
ref = "PostScript Hinting › Standard Stems"
status = "handbook"

[[behavior]]
id = "hinting.ps.standardStems.privateDictMapping"
area = "hinting-ps"
milestone = "M10"
summary = "At export the first horizontal stem becomes StdHW and the first vertical stem StdVW; the full sorted lists (at most twelve each) become StemSnapH and StemSnapV. The handbook only says the values live in the Private dict; this mapping follows the CFF Private dict definition and how otfautohint treats Dominant/StemSnap values."
ref = "PostScript Hinting › Font-Wide Hints; AFDKO otfautohint --doc-fontinfo"
status = "docs"
notes = "Checked by the M10 planning pass: FontCraft's CFF writer has used this mapping since M2 (compile.cffPrivateDictValues, observed), following glyphsLib's blue_values.py and ufo2ft's OutlineOTFCompiler, and fontmake's CFF builds of the corpus agree. The reference app's own export has not been observed. StdHW, StdVW, StemSnapH and StemSnapV are written only when the master has stems in both directions, as ufo2ft does."
guesses = ["More than twelve stems in one direction: the export writes the first twelve in list order and warns, and hint.ps.validateFontHints reports it; an export from the reference app with thirteen stems would settle it."]
observe = ["T5 (13 vertical stems): export as CFF and read the Private dict; count the StemSnapV values, note which stems are left out, and note any warning in the export results."]

[[behavior]]
id = "hinting.ps.measureStems"
area = "hinting-ps"
milestone = "M10"
summary = "Stem widths are found by measuring: selecting two nodes shows their distance in the Info box, and the Measurement tool gives the same reading. No dedicated stem-measuring command is described by the reference."
ref = "PostScript Hinting › Standard Stems"
status = "handbook"

[[behavior]]
id = "hinting.ps.alignmentZones"
area = "hinting-ps"
milestone = "M10"
summary = "An alignment zone is a pair of numbers per master: a position (the flat edge, normally a vertical metric such as baseline, x-height, cap height, ascender, descender) and a size (the largest overshoot expected there). A positive size makes a top zone reaching upward from the position; a negative size makes a bottom zone reaching downward."
ref = "PostScript Hinting › Alignment Zones"
status = "handbook"

[[behavior]]
id = "hinting.ps.alignmentZones.effect"
area = "hinting-ps"
milestone = "M10"
summary = "A zone only acts on outline parts that carry a horizontal stem hint or a ghost hint: at low resolution, such a part whose edge falls inside a zone is pulled to the zone's flat edge, which hides overshoots. Outline edges without a horizontal hint are not aligned, however deep inside a zone they sit."
ref = "PostScript Hinting › Alignment Zones"
status = "handbook"

[[behavior]]
id = "hinting.ps.alignmentZones.limits"
area = "hinting-ps"
milestone = "M10"
summary = "Validity rules for a master's zones: at most 6 top zones, at most 5 bottom zones, plus the baseline zone; the baseline zone sits at position 0; zones never overlap and keep at least one unit between them; no zone is larger than 25 units, and none is larger than 240 / (240 x blueScale - 0.98). A font-info check should report each violated rule."
ref = "PostScript Hinting › Alignment Zones"
status = "handbook"
notes = "hint.ps.validateFontHints reports each rule (crates/hinting/src/validate.rs): overlap, a gap below 2 × blueFuzz + 1 (at least one unit), more than 6 top or 5 bottom zones besides the baseline zone, no zone at 0, a zone above 25 units or above 240 ÷ (240 × blueScale − 0.98), blueScale not positive. Documented, not yet observed."
guesses = ["Overlapping zones and values that are not positive are errors and every other broken rule a warning, and the export still writes what fits the CFF limits; the reference app's font-info check would show how it ranks them."]
observe = ["T5: give master 1 two overlapping zones and a 30-unit zone, open Font Info and export as CFF; note every warning or error shown and whether the export goes ahead."]

[[behavior]]
id = "hinting.ps.alignmentZones.gridCompensation"
area = "hinting-ps"
milestone = "M10"
summary = "When the font uses a non-default grid (grid spacing or subdivision), zones should be widened by one unit at each end to absorb coordinate rounding: move the position one unit away from the zone and grow the size by two units. The baseline zone is the exception: its position stays 0 and only its size grows by one unit."
ref = "PostScript Hinting › Alignment Zones"
status = "handbook"
guesses = ["The check flags a zone whose size is a whole number of grid steps when the grid is coarser than one unit (it was not widened), and says nothing for finer or fractional grids, where a widened zone cannot be told apart; whether the reference app checks this at all would settle it."]
observe = ["T1 with a grid spacing of 10 and a zone of size 20: open Font Info and export as CFF; note any warning about the zone."]

[[behavior]]
id = "hinting.ps.alignmentZones.blueValuesMapping"
area = "hinting-ps"
milestone = "M10"
summary = "At export the zones are written as pairs into the Private dict: the baseline zone followed by every top zone, in ascending order, forms BlueValues; every other bottom zone forms OtherBlues. Each pair is (lower edge, upper edge), so a bottom zone of position p and size -s is written as p-s, p. The handbook does not spell this out; it follows the Type 1/CFF definitions and the otfautohint fontinfo documentation."
ref = "PostScript Hinting › Alignment Zones; AFDKO otfautohint --doc-fontinfo"
status = "docs"
notes = "Checked by the M10 planning pass: FontCraft's CFF writer has used this mapping since M2 (compile.cffPrivateDictValues, observed), following glyphsLib's blue_values.py and ufo2ft's OutlineOTFCompiler, and fontmake's CFF builds of the corpus agree. The reference app's own export has not been observed. The ordering rule is glyphsLib's: zones sorted by position, a zone at 0 or with a positive size goes to BlueValues."
guesses = ["Too many zones (more than seven BlueValues pairs or five OtherBlues pairs): the export keeps the first pairs in ascending order and warns, and hint.ps.validateFontHints reports it; an export from the reference app with eight top zones would settle it."]
observe = ["T5 (8 top zones): export as CFF and read the Private dict; count the BlueValues pairs, note which zones are left out, and note any warning in the export results."]

[[behavior]]
id = "hinting.ps.alignmentZones.metricDerived"
area = "hinting-ps"
milestone = "M10"
summary = "Zones are edited per master together with the vertical metrics (Font Info › Masters › Metrics); the usual set is a top zone at ascender, cap height and x-height and a bottom zone at baseline and descender. The editing UI itself is specified in the Font Info chapter; this chapter only defines what the values mean."
ref = "PostScript Hinting › Alignment Zones"
status = "handbook"

[[behavior]]
id = "hinting.ps.blueScale"
area = "hinting-ps"
milestone = "M10"
summary = "blueScale is an optional custom parameter written to the Private dict as BlueScale. It fixes the size below which overshoots are suppressed and thereby caps the zone size (see hinting.ps.alignmentZones.limits). When the source sets none, the export writes 0.037, the default the parameter's description gives (overshoots show from 40 pixels per em)."
ref = "PostScript Hinting › Custom Parameters"
status = "handbook"
guesses = [
  "As in fontmake, BlueScale, BlueFuzz and BlueShift are written only when the master has alignment zones; a reference export of a font with no zone settings would settle it.",
  "When BlueScale times the tallest zone reaches 1, the export keeps the BlueScale and warns rather than lowering it; a reference export of a font with a 30-unit zone and no blueScale parameter would settle it.",
]
notes = "The default is documented in the parameter description (Appendix › Custom Parameters) and not yet observed. The same description limits BlueScale × tallest zone to below 1; the export warns when the written value breaks it. fontmake computes BlueScale as 3 / (4 × the tallest zone) instead; FontCraft follows the handbook (docs/plans/M10.md § 7, question 6), also for UFO sources, and docs/spec/40-compile.md § 4a records the difference."
observe = [
  "T5 (no blueScale, blueFuzz or blueShift parameter): export as CFF and read the Private dict with fontTools; note the BlueScale, BlueFuzz and BlueShift values (FontCraft writes 0.037, 1 and 7).",
  "T1 with every alignment zone removed from the master and no blue parameters: export as CFF and read the Private dict; note whether BlueScale, BlueFuzz and BlueShift are written at all, and with which values.",
  "T5 with one alignment zone 30 units deep and no blueScale parameter: export as CFF, read BlueScale from the Private dict and note any export message; it shows whether the app lowers BlueScale below 1 / 30 or keeps 0.037 (FontCraft keeps it and warns).",
]

[[behavior]]
id = "hinting.ps.blueShift"
area = "hinting-ps"
milestone = "M10"
summary = "blueShift is an optional custom parameter (set in Font Info › Font) written to the Private dict as BlueShift. For flex hints to work it must be at least the depth of the shallow curve plus one unit, e.g. 6 or more for serifs cupped 5 units deep. The CFF default of 7 is recalled, not confirmed here."
ref = "PostScript Hinting › Custom Parameters; Flex Hints"
status = "handbook"
notes = "The default 7 is documented in the parameter description (Appendix › Custom Parameters) and not yet observed."
guesses = ["blueShift, blueScale, blueFuzz and the other hinting parameters whose scope the handbook does not give are read from the instance, else the master, else the font, as FontCraft reads every other parameter; a reference export with a master-level and a font-level blueShift that differ would settle it."]
observe = ["T5: set blueShift 9 on the font and 11 on master 1, export master 1 as CFF and note the BlueShift in the Private dict."]

[[behavior]]
id = "hinting.ps.blueFuzz"
area = "hinting-ps"
milestone = "M10"
summary = "blueFuzz is an optional custom parameter written to the Private dict as BlueFuzz; it widens every zone by that many units at both ends when the rasterizer and the autohinter test whether an edge is inside a zone. When the source sets none, the export writes 1, the Type 1 default the parameter's description quotes. The meaning is taken from otfautohint, which also uses 2 x BlueFuzz + 1 as the minimum gap between zones."
ref = "PostScript Hinting › Custom Parameters; Appendix › Custom Parameters; AFDKO otfautohint fdTools.py"
status = "docs"
notes = "The default is documented in the parameter description (Appendix › Custom Parameters) and not yet observed. fontmake writes BlueFuzz 0 instead; FontCraft follows the handbook (docs/plans/M10.md § 7, question 6) and docs/spec/40-compile.md § 4a records the difference."
observe = [
  "T5 (no blueScale, blueFuzz or blueShift parameter): export as CFF and read the Private dict with fontTools; note the BlueScale, BlueFuzz and BlueShift values (FontCraft writes 0.037, 1 and 7).",
  "T1 with every alignment zone removed from the master and no blue parameters: export as CFF and read the Private dict; note whether BlueScale, BlueFuzz and BlueShift are written at all, and with which values.",
]

[[behavior]]
id = "hinting.ps.familyAlignmentZones"
area = "hinting-ps"
milestone = "M10"
summary = "Family Alignment Zones is an optional custom parameter holding a second zone list shared by all fonts of a family, written as FamilyBlues (baseline and top zones) and FamilyOtherBlues (other bottom zones). The handbook only names the parameter; its exact scope (font, master or instance) and editor are not described in this chapter."
ref = "PostScript Hinting › Custom Parameters"
status = "handbook"
guesses = ["Family Alignment Zones is read where it is most specific (instance, then master, then font) and written as FamilyBlues and FamilyOtherBlues with the same rule as the master zones (a zone at 0 or of positive size to FamilyBlues); an export from the reference app would confirm the scope and the split."]
observe = ["T1: add a Family Alignment Zones parameter with one top zone and two bottom zones, export as CFF and read the Private dict; note which zones go to FamilyBlues and which to FamilyOtherBlues."]

[[command]]
id = "hint.ps.validateFontHints"
label = "Check PostScript Font Hints"
menu = []
shortcut = ""
kind = "engine"
params = "{masters?: [id]}"
area = "hinting-ps"
milestone = "M10"
summary = "Read-only query that checks the stems and zones of each master against the documented limits (zone counts, overlap, minimum gap, baseline at 0, maximum size from blueScale and the 25-unit cap, at most twelve stems per orientation) and returns one finding per violation. Not a reference feature; it makes the stated rules testable headless."
ref = "PostScript Hinting › Alignment Zones; Standard Stems"
status = "inferred"
own = true
notes = "M10.4: lists the findings of fontcraft_hinting::validate_font_hints for each master, with the rule id and the severity; the rules are in crates/hinting/src/validate.rs."

[[command]]
id = "hint.ps.getFontHints"
label = "Get PostScript Font Hints"
menu = []
shortcut = ""
kind = "engine"
params = "{master?: id, instance?: id}"
area = "hinting-ps"
milestone = "M10"
summary = "Read-only query returning the values that would be written to the Private dict for a master or an interpolated instance: BlueValues, OtherBlues, FamilyBlues, FamilyOtherBlues, StdHW, StdVW, StemSnapH, StemSnapV, BlueScale, BlueShift, BlueFuzz. Our design, for agents and tests."
ref = "PostScript Hinting › Font-Wide Hints"
status = "inferred"
own = true
notes = "M10.4: the values come from the CFF export's own Private dict code (fontcraft_compile::cff::private_dict_entries), so they cannot drift from what an export writes. Without `master` or `instance` it reports the first master; `instance` takes an index or a name and must be a static instance."

# ---------------------------------------------------------------------------------------------
# Autohinting at export
# ---------------------------------------------------------------------------------------------

[[behavior]]
id = "hinting.ps.export.autohintOption"
area = "hinting-ps"
milestone = "M10"
summary = "The export dialog (File › Export) has an Autohint checkbox. When it is on and the output has CFF outlines, the autohinter creates glyph-level hints for every glyph that has no manual hints, using the master's zones and standard stems. Sensible results need those font-level values to be set first."
ref = "PostScript Hinting › Autohinting"
status = "handbook"

[[behavior]]
id = "hinting.ps.export.autohintParameter"
area = "hinting-ps"
milestone = "M10"
summary = "An Autohint custom parameter forces the autohint setting for an export regardless of the state of the checkbox in the export dialog. The handbook does not say on which Font Info tab it belongs; an instance-level override is the likely scope."
ref = "PostScript Hinting › Autohinting"
status = "handbook"
guesses = ["The Autohint parameter is read on the instance only, and covers both outline flavours; when the instance has none the export dialog's checkbox (default off) decides; a reference export would show whether a font-level parameter counts."]
observe = ["T1: add the Autohint parameter to the font only (not to an instance), export as CFF with the Export dialog's Autohint off, and read the charstrings; note whether the glyphs carry hints."]

[[behavior]]
id = "hinting.ps.export.manualGlyphsSkipped"
area = "hinting-ps"
milestone = "M10"
summary = "Manual and automatic hints never mix inside one glyph: a glyph that has at least one manual hint is left out of autohinting at export and is written with exactly its manual hints. Such a glyph therefore has to be hinted completely by hand."
ref = "PostScript Hinting › Manual hinting"
status = "handbook"
notes = "Documented, not yet observed. A glyph whose hint-source layer has any PostScript hint is written with those hints only, even when none of them can be placed (crates/compile/src/cff_hints.rs)."

[[behavior]]
id = "hinting.ps.export.stemHintsMadePositive"
area = "hinting-ps"
milestone = "M10"
summary = "Stem hints in the exported font must have a width above zero. A stem hint stored with a negative size is flipped at export (origin moved to the lower or left edge, size made positive) without changing the source. Ghost hints are not stem hints and are exempt (see autohint.ps.ghostStems)."
ref = "PostScript Hinting › Stem Hints"
status = "handbook"
notes = "Documented, not yet observed. The charstring encoder also sorts the stems by lower edge, as the format requires."

[[behavior]]
id = "hinting.ps.export.hintReplacement"
area = "hinting-ps"
milestone = "M10"
summary = "Stem hints of one direction may overlap in the source (the two bowls of a figure eight, for example), which the charstring format forbids for simultaneously active hints. The exporter resolves this itself by inserting hint replacement: it splits the hints into non-overlapping groups and switches the active group along the outline. There is no manual control over this."
ref = "PostScript Hinting › Manual hinting"
status = "handbook"
guesses = ["Manual hints that overlap get masks from FontCraft's own rule: the first mask applies from the start, a new one starts at the first node on an edge of a stem that overlaps a stem the current mask holds, the first of two overlapping stems at one node wins, and a stem no node touches joins every mask it fits; the reference's masks for a hand-hinted 8 would settle it."]
notes = "Documented, not yet observed. The rule is in docs/spec/13-postscript-hinting.md § 5 and crates/compile/src/cff_hints.rs; every mask is checked to hold no two overlapping stems before the charstring is written."
observe = ["T1: hint eight by hand on its two overlapping vertical stems, export as CFF and read its charstring; note where hintmask operators appear and which stems each mask holds."]

[[behavior]]
id = "hinting.ps.flex.automatic"
area = "hinting-ps"
milestone = "M10"
summary = "Flex hints flatten very shallow curves (cupped serifs, slightly tapered stems) at low resolution. They cannot be placed by hand and are not stored in the source: the exporter adds them wherever the outline qualifies."
ref = "PostScript Hinting › Flex Hints"
status = "handbook"
guesses = ["Flex is added to every exported glyph that qualifies, hand-hinted glyphs included, with otfautohint's flex test (the handbook's conditions plus its length ratio); an export from the reference app of a cupped serif under 20 units, hinted by hand, would settle both points."]
observe = ["T1: set blueShift to 6, hint n.serif by hand, export as CFF and read its charstring; note whether the 5-unit cupped serifs are written with a flex operator."]
notes = "The charstring encoder writes all four flex forms (crates/cff/src/hints.rs). Hand-hinted glyphs get no flex until the flex test runs at export with the autohinter (M10.15)."

[[behavior]]
id = "hinting.ps.flex.conditions"
area = "hinting-ps"
milestone = "M10"
summary = "An outline part qualifies for flex when: it consists of exactly two consecutive curve segments between three nodes (they need not be symmetric); the first and third node share the same Y (cupped serif) or the same X (tapered stem); all three nodes are extremes of the two segments, with handles that stay within the span of the three nodes but need not be exactly horizontal or vertical; the total depth is at most 20 units; and blueShift is at least depth + 1."
ref = "PostScript Hinting › Flex Hints"
status = "handbook"

[[behavior]]
id = "hinting.ps.flex.zonePlacement"
area = "hinting-ps"
milestone = "M10"
summary = "For cupped serifs the recommended placement is that all three nodes lie inside the matching alignment zone with the middle node exactly on the flat edge and the two outer nodes reaching into the zone. For bottom serifs this means the outer nodes sit slightly below the baseline, inside the baseline zone."
ref = "PostScript Hinting › Flex Hints"
status = "handbook"

[[behavior]]
id = "hinting.ps.testing.external"
area = "hinting-ps"
milestone = "M10"
summary = "The reference has no built-in PostScript hinting preview. Testing means exporting, setting text in an Adobe application at a size of only a few pixels, and enlarging the screen with the operating system's zoom; problems are fixed by adjusting font-level values or hand-hinting the glyph, then exporting again."
ref = "PostScript Hinting › Autohinting"
status = "handbook"

[[command]]
id = "hint.ps.renderPreview"
label = "Render Hinted Preview"
menu = []
shortcut = ""
kind = "engine"
params = "{instance?: name (default: the first master), text: string, ppem: number or [numbers], hinted?: bool, format?: 'png'|'json', autohint?: bool}"
area = "hinting-ps"
milestone = "M10"
summary = "Compiles the given instance in memory with its PostScript hints and rasterizes a text at the listed pixel sizes with a hint-applying rasterizer, returning bitmaps (and optionally the unhinted rendering for comparison). Our design, replacing the reference's export-and-look-in-another-app loop for people and agents."
ref = "PostScript Hinting › Autohinting"
status = "inferred"
guesses = ["The preview rasterizes with skrifa's PostScript hinter (a port of FreeType's), not with an Adobe rasterizer; comparing with the Adobe application preview the handbook suggests would show how far they differ."]
own = true
notes = "`hinted: false` renders the same text without hints, for comparison; `format: 'json'` returns each glyph's outline in pixels instead of the line's PNG."

# ---------------------------------------------------------------------------------------------
# Manual hinting: commands
# ---------------------------------------------------------------------------------------------

[[command]]
id = "hint.ps.autohintGlyph"
label = "Autohint"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layer?: id}"
area = "hinting-ps"
milestone = "M10"
summary = "Edit View context-menu item. Runs the autohinter on the current layer and stores its result as editable glyph-level hints, identical to what export would have generated. From then on the glyph counts as manually hinted and is skipped by autohinting at export."
ref = "PostScript Hinting › Manual hinting"
status = "handbook"
guesses = [
  "Autohint replaces any hints the layer already has and acts on every glyph selected in Edit View or Font View; the reference app would settle both.",
  "Only the stems are stored (an export rebuilds the hint masks from them; counter masks and flex stay export-only), each edge linked to the layer's first on-curve node at that position, else stored as a number; a reference glyph autohinted from the context menu and read back would show which nodes it links.",
]
notes = "`layer` names a master (default the first); the glyph is hinted as a CFF export of that master hints it, against the zones and stems of the Private dict that export writes."
observe = [
  "T1: give n two manual hints and choose Autohint from the context menu; note whether the old hints are replaced or kept. Then select n, m and o and choose Autohint again; note whether only one glyph or all three get hints.",
]

[[command]]
id = "hint.ps.addHorizontalHint"
label = "Add Horizontal Hint"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, nodes?: [nodeRef] | [[nodeRef, nodeRef]], origin?: number, size?: number}"
area = "hinting-ps"
milestone = "M10"
summary = "Edit View context-menu item that adds a horizontal stem hint (a band between two Y positions) to the layer. With two nodes selected the hint is linked to that pair; with several pairs selected, each on its own contour, one linked hint is made per pair. Invoked on exactly one node it creates a ghost hint attached to that node instead."
ref = "PostScript Hinting › Stem Hints; Ghost Hints"
status = "handbook"
notes = "M10.4: crates/engine/src/cmd/hint_ps.rs. `nodes` lists the selected nodes; one node makes a ghost hint, two nodes one hint linked to both (the first is the origin), more nodes one hint per path, each path holding exactly two. Explicit pairs in `nodes` are our addition for headless use and may span paths. `layer` defaults to the main master's layer. New hints go to the end of the layer's list. Documented, not yet observed in the reference app."
guesses = [
  "With no node selected the new hint sits at the vertical centre of the bounding box of the layer's on-curve nodes with the master's first horizontal stem as its size (50 units without stems), and on an empty layer it starts at the baseline; doing it in the reference app would settle it.",
  "Two selected nodes make one hint even when they lie on different paths (the stem of an O); selecting the outer and inner nodes of an O's stem in the reference app would settle it.",
]
observe = ["T1: open n with nothing selected and choose Add Horizontal Hint; note where the new hint starts and how wide it is (centred on the bounding box, the first stem's width, or something else)."]

[[command]]
id = "hint.ps.addVerticalHint"
label = "Add Vertical Hint"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, nodes?: [nodeRef] | [[nodeRef, nodeRef]], origin?: number, size?: number}"
area = "hinting-ps"
milestone = "M10"
summary = "Edit View context-menu item that adds a vertical stem hint (a band between two X positions) to the layer. Node-pair linking works as for the horizontal command; vertical hints have no ghost form."
ref = "PostScript Hinting › Stem Hints"
status = "handbook"
notes = "M10.4: nodes as for hint.ps.addHorizontalHint; a single node is refused, since only horizontal hints have a ghost form. Documented, not yet observed in the reference app."
