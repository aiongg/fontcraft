[[panel]]
id = "window.start"
label = "Start Window"
location = "window"
controls = [
  "left: list of recently opened documents (double-click opens one; context menu: Show in Finder)",
  "right: application version information and links to the project website",
  "checkbox: Show window on startup",
  "plus button: switches the window to the new-document script chooser",
  "script list (it also appears whenever the recent-documents list is empty); included scripts get a coloured icon",
  "No / Yes toggle (top right) that includes the clicked script in the new document",
  "glyph set checkboxes for the clicked script (right side)",
  "search field (top right) filtering scripts by name",
  "Create Document button (lower right)",
]
area = "ui-chrome"
milestone = "M4"
summary = "Window shown when the app starts with no document open. It lists recent documents and, after pressing plus, lets the user pick scripts and glyph sets and create a document with empty glyphs for them."
ref = "Create"
status = "handbook"
notes = "Documented, not yet observed. FontCraft: crates/ui/src/dialogs/start_window.rs. The chooser's scripts and sets are the built-in glyph sets (see file.newFromGlyphSets), so its lists differ from the reference's by design. The Create Document button runs file.newFromGlyphSets with the included scripts and their checked sets, so the window and the headless command give the same document."
guesses = [
  "Each glyph set's checkbox shows its glyph count after its name. Settled by observing the chooser.",
  "Without earlier picks, Latin is included with its default sets. Settled by observing the chooser on a fresh install.",
  "A script switched on takes its default sets (its Core set) checked; the checkboxes of a script that is not included are greyed out. Settled by observing the chooser.",
  "While there are recent documents the chooser has a Recent Documents button that goes back to the list. Settled by observing the window.",
  "The window closes when a document is opened or created. Settled by observing the window.",
]

