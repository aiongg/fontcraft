# ───────────────────────────── Moving ─────────────────────────────

[[command]]
id = "selection.move"
label = "Move"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index], image?: bool, dx: number, dy: number, mode?: normal|pointsOnly|nudge|mirror, duplicate?: bool} → {selection}"
area = "drawing"
milestone = "M3"
summary = "Moves the selected nodes, handles, anchors or guides by an offset in font units. It is what the arrow keys run: one unit per press, 10 with Shift, 100 with Cmd; the mode follows the Option (points only) and Ctrl+Option (nudge) modifiers, and Ctrl+Option on a dragged handle of a smooth node (mirror)."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:42–13:45: dragging the two selected top nodes of a rectangle moves only them, which slants the stem. Arrow-key steps: see move.arrowKeyIncrements. `image: true` moves the layer's placed image too (M11.13b); the arrow keys send it while an image is selected, with the same steps (image.directManipulation). Components follow the rule of component.move: a locked component and one aligned in both directions stay, one aligned horizontally takes only the vertical part, and a move in which nothing named moves fails with a message naming the components (components.lockedCannotMove, components.autoAlignedCannotMove)."

[[behavior]]
id = "move.arrowKeyIncrements"
area = "drawing"
milestone = "M3"
summary = "Each arrow key press moves the selection by 1 unit, by 10 units with Shift and by 100 units with Cmd. The same steps apply to selected handles, anchors and guides."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 6:48–6:51 and 8:02–8:06: with the pointer still, a selected shape moves in steps of exactly 10 units and a selected node in steps of 1 unit. The keys are not visible."

[[behavior]]
id = "move.nodesCarryHandles"
area = "drawing"
milestone = "M3"
summary = "Moving a node moves the handles attached to it by the same offset even when those handles are not selected. Holding Option moves only the points that are actually selected."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
guesses = [
  "Alt with an arrow key moves only the selected points (03a question 1).",
  "Only the handle of a smooth node next to a line turns when the node moves (nodes.tangentFollowsLine); all other handles keep their offset from their node.",
]

[[behavior]]
id = "move.shiftConstrains"
area = "drawing"
milestone = "M3"
summary = "Holding Shift while dragging the selection (nodes, handles, segments, components, anchors, guides, annotations, the placed image) keeps the drag horizontal or vertical, whichever is nearer to the pointer's way; Shift can be pressed and released during the drag. A single dragged handle goes onto the horizontal or the vertical through its node. Snapping then works along the drag only. Shift+Option on a node is the sliding aid."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "docs"
notes = "Users of the reference app describe the constraint for dragged nodes on the public forum (forum.glyphsapp.com topics 36658, 24347, 31911 and 35615). `snap_along` in tools/snap.rs: nodes and handles count as targets only on the held line, then guides where they cross it, sidebearings or metric lines, and lining up with a node; the suggestions are off. A drag of handles with Option keeps the angle and ignores Shift. Image: ImageDrag."
guesses = [
  "A single handle is held to the axes through its node, not to the axes through its place at the press.",
  "In an italic master the vertical is upright; the italic angle adds no axis.",
  "Only horizontal and vertical; no 45° directions, unlike the Draw tool.",
]
observe = [
  "Shift-drag a node, then a lone handle, then a component: note the directions each drag allows.",
  "In a master with an italic angle of 12°, Shift-drag a node upwards: note whether it goes straight up or along the angle.",
]

[[behavior]]
id = "move.nudge"
area = "drawing"
milestone = "M3"
summary = "Nudging (Ctrl+Option while moving nodes, or Option pressed after a drag has begun) moves the selected nodes and at the same time rescales the surrounding unselected handles in proportion, so the neighbouring curves keep their character instead of being sheared."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
guesses = [
  "Ctrl+Alt with an arrow key nudges, by the arrow increments 1, 10 and 100 (03a question 2).",
  "After the handles are scaled, the handle of a smooth node next to a line turns onto the line (nodes.tangentFollowsLine); a smooth node between two curves is left as the scaling puts it.",
]

[[behavior]]
id = "move.handles"
area = "drawing"
milestone = "M3"
summary = "A handle moves by dragging or with the arrow keys (Shift 10, Cmd 100); several selected handles move together. With Option held the handle keeps its angle and only its length changes."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Documented, not yet observed. M3.19: a drag of handles only (nothing else selected) runs selection.move with mode pointsOnly while Alt is held, whether Alt went down before or during the drag; a handle alone has nothing to copy, so Alt never duplicates it."
observe = [
  "Option-drag a handle of a smooth node, then press Option halfway through a plain handle drag: note whether the angle is kept in both cases and whether the opposite handle turns.",
]

[[behavior]]
id = "nodes.impliedOnCurve"
area = "drawing"
milestone = "M3"
summary = "In a quadratic segment with several off-curve nodes, the implied node halfway between two of them shows and can be grabbed: a press selects its two handles and a drag moves both, so the implied node follows the pointer. A one-handle quadratic segment keeps both its smooth ends smooth when its handle, an end or a line beside it moves."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "inferred"
own = true
notes = "Built in M3.54: `Hit::Implied` (the Select tool and the context menu only), drawn as a hollow handle (`canvas/paint/nodes.rs`), `Path::implied_nodes`. The one-handle rule is `keep_both_smooth` in crates/engine/src/cmd/node/moving.rs. Deleting a node between quadratic segments refits with one quadratic segment (builds 3848 and 3826 of the release notes name adding, removing and copying points of quadratic outlines without detail); Fit Curve refuses quadratic segments with a message."
guesses = [
  "Grabbing the implied node moves its two handles.",
  "Where a smooth node lies between the only handles of two segments, it slides onto the line between them, dividing it as before; where the side beyond is a curve with another handle, that handle turns and keeps its length.",
  "Between two straight sides, an only handle stays where their lines cross; with no crossing ahead of both, it stays in place.",
  "Fit Curve leaves quadratic segments alone and says so, since its percentages describe cubic handles.",
]
observe = [
  "In a TrueType outline with a segment of three off-curve points, press and drag the place halfway between two of them, and note what is selected and what moves.",
  "Drag the off-curve point between two smooth on-curve nodes of a TrueType circle and note whether the nodes or the next off-curve points move.",
  "Select an off-curve point of a TrueType outline and press a Fit Curve step: note whether anything changes.",
]

[[behavior]]
id = "move.mirrorHandleAcrossSmoothNode"
area = "drawing"
milestone = "M3"
summary = "While a handle of a smooth node is being moved with Ctrl and Option held, the opposite handle of that node is given the same length and the matching (opposite) angle, making the node symmetric."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Documented, not yet observed. M3.19: a drag of handles only with Ctrl+Alt held runs selection.move with mode mirror: each moved handle of a smooth node that stays puts the opposite handle at the moved handle's mirror image through the node. Ctrl also suspends snapping, as in every drag."
guesses = [
  "On a corner node, Ctrl+Alt moves the handle as a plain drag would; observing a corner's handle under Ctrl+Option would settle it.",
  "When the other side of the smooth node is a straight segment, the handle slides along that line as in a plain drag, since mirroring would bend the line; observing such a node would settle it.",
  "A handle dragged onto its node leaves the opposite handle where it is, since it has no direction to mirror; observing that drag would settle it.",
]
observe = [
  "Ctrl+Option-drag a handle of a smooth node whose two handles differ in length: note whether the opposite handle takes the dragged handle's length during the drag or only on release.",
  "Ctrl+Option-drag a handle of a corner node: note whether the opposite handle changes.",
]

[[behavior]]
id = "move.dragSegment"
area = "drawing"
milestone = "M3"
summary = "Dragging a segment moves its two end nodes together with their handles. Option-dragging a curve segment instead lengthens or shortens its handles along their existing angles, leaving the nodes in place."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Documented, not yet observed. M3.19: an Alt-drag that starts on a cubic segment selected alone runs path.reshapeSegment as one interaction; the segment's point under the pointer at the press follows the pointer. An Alt-drag on a line segment copies it (duplicate.optionDrag); an Alt-drag on a segment of a larger selection copies the selection. M3.54: a quadratic segment is reshaped too: its first and last handles keep their directions, the handles between them move freely by the smallest change, and an only handle moves freely with the handles beyond its smooth ends following."
guesses = [
  "The two handle lengths are solved so the grabbed point of the curve lands on the pointer (a 2x2 least-squares problem; with parallel handles, the smallest change that gets nearest); observing the curve under the pointer during an Option-drag would settle it.",
  "With nearly parallel handles the solve is damped, so the lengths change smoothly and the point may stop short of the pointer instead of the handles swinging by thousands of units; observing an Option-drag on a segment with almost parallel handles would settle it.",
  "A handle is held between 1 unit (or the grid step, if larger) and 10 times the larger of the end nodes' distance and the current handle lengths, and within the coordinate limit, so it never turns through its node; a retracted handle stays on its node unless the drag lengthens it. When both lengths reach a limit, their change is scaled back together. Observing an Option-drag past the chord would settle it.",
  "An Alt-drag on a segment that is part of a larger selection duplicates the selection instead of reshaping; observing that case would settle it.",
]
observe = [
  "Option-drag a curve segment at its middle and then near one end: note whether the point under the pointer stays under it and whether both handles change or only the nearer one.",
  "Option-drag a curve segment across its chord: note whether the handles shrink to zero, stop, or turn round.",
]

[[command]]
id = "path.reshapeSegment"
label = "Reshape Segment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, segment: [shape, node], t: number, to: [x, y]} → {changed, selection}"
area = "drawing"
milestone = "M3"
summary = "Changes the lengths of a curve segment's first and last handles, keeping both end nodes and each handle's direction, so that the segment's point at t lands on a given position. It is what an Option-drag on a curve segment runs."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Documented gesture (move.dragSegment), not yet observed; the construction is ours. t runs from 0.01 to 0.99. A line segment is left as it is and returns changed: false; a quadratic segment is reshaped as move.dragSegment says. The selection afterwards is the segment's two end nodes, as the press selected them."
guesses = [
  "A handle that lies on its node takes the direction towards the other handle, else towards the other end node.",
]

