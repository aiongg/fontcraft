status = "handbook"

# ───────────────────────────── Extremes and inflections ─────────────────────────────

[[behavior]]
id = "extremes.definitions"
area = "path-ops"
milestone = "M3"
summary = "An extremum is a spot on a path where the tangent is exactly horizontal or vertical; an inflection is a spot inside a segment where the bend switches between clockwise and counter-clockwise. Nodes at extremes are expected by hinting and some renderers, and nodes at inflections help offsetting and avoid interpolation kinks."
ref = "Edit View › Extremes & Inflections"
status = "handbook"

[[command]]
id = "path.addExtremes"
label = "Add Extremes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layer?: id, points?: [[shape, node]], shapes?: [index] (with one glyph)}"
area = "path-ops"
milestone = "M3"
summary = "Inserts nodes at the horizontal and vertical extremes of all paths on the active layer. An extreme is skipped when adding it would leave a very short segment (the existing node placement is assumed deliberate); a node sitting only slightly off an extreme is moved onto it, with the shape preserved as far as possible and its handles made exactly horizontal or vertical."
ref = "Edit View › Extremes & Inflections"
status = "handbook"
notes = "FontCraft (03a question 17): a node within 2 units and 2° of an extreme keeps its place, and its handles within 2° of the axis are made exactly horizontal or vertical, which puts the extreme on the node. An extreme is skipped when the chord from it to the end of its segment, or to the extreme before it, is shorter than 3 units. New nodes are smooth and rounded to the grid, with their handles lined up with them."

[[command]]
id = "path.forceExtremes"
label = "Force Extremes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layer?: id, points?: [[shape, node]], shapes?: [index] (with one glyph)}"
area = "path-ops"
milestone = "M3"
summary = "Option variant of Add Extremes that inserts a node at every extreme without the short-segment exception."
ref = "Edit View › Extremes & Inflections"
status = "handbook"
notes = "FontCraft: every extreme that rounds to a new point is added; the near-extreme handle rule of Add Extremes still applies."

[[command]]
id = "path.addInflections"
label = "Add Inflections"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs: [names], layer?: id, points?: [[shape, node]], shapes?: [index] (with one glyph)} → {glyphs: [names], added: count}"
area = "path-ops"
milestone = "M3"
summary = "Inserts a node at every inflection of the targeted cubic segments, splitting each segment there without changing the outline. It is the repair the audit runs for check.outlines.inflections; the Draw tool's Shift+click adds one inflection at a time."
ref = "Edit View › Extremes & Inflections; docs/spec/21-qa.md § 5"
status = "inferred"

[[command]]
id = "path.insertNode"
label = "Insert Node"
menu = []
context = ["canvas.segment"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, segment: [shape, node], t?: number, near?: [x, y], snap?: extremum|inflection} → {selection}"
area = "path-ops"
milestone = "M3"
summary = "Headless equivalent of the Draw tool's Shift-click on a segment: splits a segment at a parameter, or at the extremum or inflection closest to a given position, without changing the shape. Our own command."
ref = "Edit View › Extremes & Inflections"
status = "inferred"

[[behavior]]
id = "extremes.addedAtExportByFilter"
area = "compile"
milestone = "M7"
summary = "Extremes can be left out of the source and added only in the exported font through a Filter custom parameter with the value AddExtremes, which keeps shallow curves and some multi-master outlines simpler to edit."
ref = "Edit View › Extremes & Inflections"
status = "handbook"

