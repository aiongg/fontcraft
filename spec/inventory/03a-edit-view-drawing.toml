# Source: Glyphs 4 Handbook (public web handbook, glyphsapp.com/learn), chapters
#   "Glyphs", "Create", and "Edit View" up to and including the section "Guides"
#   (intro, Drawing Paths, Editing Paths, Strokes, Compositing, Anchors, Guides).
#   The rest of "Edit View" (Info Box onward) is inventoried in a sibling file.
# Date: 2026-10-07
# All summaries are our own wording. Labels, menu paths and shortcuts match the reference.
# Rows with status = "inferred" are our own design (mostly headless equivalents of pointer gestures).

# ───────────────────────────── Application basics ("Glyphs") ─────────────────────────────

[[behavior]]
id = "app.launchWithoutPlugins"
area = "extensions"
milestone = "M13"
summary = "Holding Option and Shift while the application starts launches it with every plug-in disabled, as a way out when a plug-in makes the app crash."
ref = "Glyphs › Issues"
status = "handbook"

[[behavior]]
id = "app.crashReportOnNextLaunch"
area = "ui-chrome"
milestone = "M14"
summary = "After a crash, the next launch shows a dialog offering to send a crash report to the developers."
ref = "Glyphs › Issues"
status = "handbook"

# ───────────────────────────── Document creation ("Create") ─────────────────────────────

[[panel]]
id = "window.start"
label = "Start Window"
location = "window"
controls = [
  "left: list of recently opened documents (double-click opens one; context menu: Show in Finder)",
  "right: application version information and links to the project website",
  "checkbox: Show window on startup",
  "plus button: switches the window to the new-document script chooser",
  "script list (it also appears whenever the recent-documents list is empty); included scripts get a coloured icon",
  "No / Yes toggle (top right) that includes the clicked script in the new document",
  "glyph set checkboxes for the clicked script (right side)",
  "search field (top right) filtering scripts by name",
  "Create Document button (lower right)",
]
area = "ui-chrome"
milestone = "M4"
summary = "Window shown when the app starts with no document open. It lists recent documents and, after pressing plus, lets the user pick scripts and glyph sets and create a document with empty glyphs for them."
ref = "Create"
status = "handbook"

[[command]]
id = "window.startWindow"
label = "Start Window"
menu = ["Window"]
shortcut = ""
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M4"
summary = "Opens the Start Window at any time, not only at launch."
ref = "Create"
status = "handbook"

[[behavior]]
id = "start.shownAtLaunchWithoutDocuments"
area = "ui-chrome"
milestone = "M4"
summary = "The Start Window appears at launch when no document is open. Clearing its Show window on startup checkbox suppresses it on later launches (a persisted preference)."
ref = "Create"
status = "handbook"

[[behavior]]
id = "start.recentDocumentsList"
area = "ui-chrome"
milestone = "M4"
summary = "Double-clicking an entry of the recent documents list opens that document. When the list is empty the script chooser is shown in its place."
ref = "Create"
status = "handbook"

[[command]]
id = "file.showInFinder"
label = "Show in Finder"
menu = []
shortcut = ""
kind = "ui"
params = "{path: string}"
area = "ui-chrome"
milestone = "M4"
summary = "Context-menu item on a recent document in the Start Window (Ctrl-click or right-click) that reveals the file in the system file manager."
ref = "Create"
status = "handbook"

[[command]]
id = "file.new"
label = "New"
menu = ["File"]
shortcut = "Cmd+N"
kind = "engine"
params = "{}"
area = "import-export"
milestone = "M1"
summary = "Creates a new untitled document that contains the basic ASCII glyphs, without asking anything."
ref = "Create"
status = "handbook"

[[command]]
id = "file.newFromGlyphSets"
label = "New from Glyph Sets…"
menu = ["File"]
shortcut = ""
kind = "engine"
params = "{scripts?: [{script: string, glyphSets?: [string]}]}"
area = "font-view"
milestone = "M4"
summary = "Opens the script and glyph-set chooser (the same one the Start Window plus button shows), preselected with the choices made last time, and creates a document holding one empty glyph for every glyph of the chosen sets. With explicit params it creates the document without showing the chooser."
ref = "Create"
status = "handbook"

[[behavior]]
id = "start.scriptChooserRules"
area = "font-view"
milestone = "M4"
summary = "In the chooser a script is included by clicking it and switching its toggle from No to Yes; individual glyph sets of an included script are switched with checkboxes; the search field filters the script list by name; the chooser remembers which scripts and glyph sets were picked last time."
ref = "Create"
status = "handbook"

[[command]]
id = "file.save"
label = "Save"
menu = ["File"]
shortcut = "Cmd+S"
kind = "engine"
params = "{path?: string, format?: string}"
area = "import-export"
milestone = "M1"
summary = "Writes the document to disk. The first save asks for a name, a folder and one of three source file formats (the default being the native single-file format)."
ref = "Create"
status = "handbook"

[[command]]
id = "file.saveAs"
label = "Save As…"
menu = ["File"]
shortcut = "Cmd+Shift+S"
kind = "engine"
params = "{path: string, format?: string, smartComponents?: components|outlines}"
area = "import-export"
milestone = "M1"
summary = "Saves the document under a new name or location, and is the way to switch an existing document to another of the source file formats at any time. FontCraft: smartComponents chooses whether a UFO or designspace holds smart components as components (default) or drawn as outlines (export.ufoSmartComponentsAsOutlines)."
ref = "Create"
status = "handbook"

# ───────────────────────────── Tabs and Edit View modes ─────────────────────────────

[[command]]
id = "view.newTab"
label = "New Tab"
menu = ["View"]
shortcut = "Cmd+T"
kind = "ui"
params = "{glyphs?: [names], text?: string}"
area = "ui-chrome"
milestone = "M3"
summary = "Opens a new Edit View tab in the current window showing the glyphs that are selected at the time, so several glyphs can be opened together."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.editSelectedGlyphs"
label = "Edit Selected Glyphs"
menu = []
shortcut = "Cmd+Down"
kind = "ui"
params = "{glyphs?: [names]}"
area = "font-view"
milestone = "M4"
summary = "In Font View, opens the selected glyphs for editing in Edit View; double-clicking a glyph or a selection does the same. The reference gives the key but no menu label for it."
ref = "Edit View"
status = "handbook"
notes = "Built in M3.2 (our decision): shows the tab that holds exactly these glyphs if one is open, else opens a new tab."

[[command]]
id = "view.showTab"
label = "Show Tab"
menu = []
shortcut = "Cmd+Alt+2"
kind = "ui"
params = "{index: integer}"
area = "ui-chrome"
milestone = "M3"
summary = "Switches to the tab at the given position. The reference binds Cmd+Alt+2 through Cmd+Alt+9 to tab positions 2 to 9 (position 1 is Font View); the shortcut field holds only the first of that range."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.showNextTab"
label = "Show Next Tab"
menu = ["View", "Navigation"]
shortcut = "Ctrl+Tab"
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M3"
summary = "Activates the tab to the right of the current one."
ref = "Edit View"
status = "handbook"
notes = "Built in M3.2 (our decision): after the last tab comes Font View, and before Font View the last tab."

[[command]]
id = "view.showPreviousTab"
label = "Show Previous Tab"
menu = ["View", "Navigation"]
shortcut = "Ctrl+Shift+Tab"
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M3"
summary = "Activates the tab to the left of the current one."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.closeTab"
label = "Close Tab"
menu = ["View"]
shortcut = "Cmd+Shift+W"
kind = "ui"
params = "{index?: integer}"
area = "ui-chrome"
milestone = "M3"
summary = "Closes the current Edit View tab. The close button that appears when the pointer is over a tab title does the same for that tab."
ref = "Edit View"
status = "handbook"
notes = "Built in M3.2 (our decision): `index` is a strip position (1 is Font View, which cannot be closed); the tab to the left of a closed showing tab shows next. Closed tabs are kept, the last 32, for Reopen Last Closed Tab."

[[command]]
id = "view.closeOtherTabs"
label = "Close Other Tabs"
menu = []
shortcut = ""
kind = "ui"
params = "{keep?: integer}"
area = "ui-chrome"
milestone = "M3"
summary = "Closes every tab except one. The reference offers this only as Option-click on a tab's close button, which keeps the current tab; it names no menu item."
ref = "Edit View"
status = "handbook"
notes = "Built in M3.2: `keep` is a strip position; with Font View showing and no `keep`, every Edit View tab closes."

[[command]]
id = "view.reopenLastClosedTab"
label = "Reopen Last Closed Tab"
menu = ["View"]
shortcut = "Cmd+Alt+Shift+W"
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M3"
summary = "Brings back the most recently closed tab. In the reference it is an alternate menu item that shows while Option is held."
ref = "Edit View"
status = "handbook"
notes = "Built in M3.2: the tab comes back at its old position with its camera and selection."

[[behavior]]
id = "tabs.windowHoldsFontViewPlusEditTabs"
area = "ui-chrome"
milestone = "M3"
summary = "One document window holds Font View as its fixed first tab followed by any number of Edit View tabs; clicking a tab title switches to it."
ref = "Edit View"
status = "handbook"

[[behavior]]
id = "menus.optionRevealsAlternateItems"
area = "ui-chrome"
milestone = "M3"
summary = "Holding Option while a menu or context menu is open swaps some items for an alternate form, typically the same action applied to all masters (Tidy up Paths, Correct Path Direction, Reverse Contours, Set/Reset Anchors, Expand Outline), plus Force Extremes, Add Global Guide and Reopen Last Closed Tab."
ref = "Edit View › Editing Paths"
status = "handbook"

[[behavior]]
id = "editView.textModeAndEditMode"
area = "edit-text"
milestone = "M3"
summary = "Edit View is always in one of two modes. Text mode (entered by choosing the Text tool, shortcut T) inserts and removes glyphs and adjusts spacing and kerning; edit mode works on the outline of one glyph."
ref = "Edit View"
status = "handbook"

[[behavior]]
id = "editView.enteringEditMode"
area = "edit-text"
milestone = "M3"
summary = "Edit mode starts when any tool other than Text is chosen, when a glyph in the tab is double-clicked, or when Escape is pressed in text mode, which makes the glyph just after the text cursor the edited one."
ref = "Edit View"
status = "handbook"

# ───────────────────────────── Drawing tools ─────────────────────────────

[[tool]]
id = "draw"
label = "Draw"
shortcut = "P"
group = ""
gestures = [
  "click on empty canvas: place a node; successive nodes are joined into one path",
  "drag on empty canvas: place a node and pull two handles out of it, giving a curved segment",
  "Alt while dragging: change only the handle of the coming segment and leave the handle of the previous segment where it is",
  "Cmd while dragging: change only the length of the coming handle while both handles keep their shared angle",
  "Space while dragging: move the node being placed instead of its handles",
  "click on the first node of the open path being drawn: close the path",
  "click on a node of an existing path: open the path at that node",
  "Shift+click on a segment: insert a node at the extremum or inflection nearest to the click",
]
area = "drawing"
milestone = "M3"
summary = "Pen tool for building Bézier outlines node by node. Clicks give straight joins, drags give curve handles whose length sets the curvature; it also opens paths at a node and inserts nodes at extremes and inflections."
ref = "Edit View › Draw Tool"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 22:56–23:12 and 29:57–30:03: clicks place corner nodes joined by straight segments, a drag places a node with two handles and a curved segment, and a click on the first node closes the path, which then fills. Not shown: the Alt, Cmd and Space drag variants, opening a closed path at a node, Shift+click on a segment. At 22:57 a click on another path's segment starts the new line there; whether that also inserts a node into the clicked path is not visible (03a open question 3)."

[[tool]]
id = "pencil"
label = "Pencil"
shortcut = "B"
group = "pencil"
gestures = [
  "drag: draw a freehand stroke that is converted into a Bézier path following the pointer or stylus",
]
area = "drawing"
milestone = "M3"
summary = "Freehand drawing tool aimed at tablets and styluses. The traced result follows the hand closely and therefore carries more nodes than a constructed path, so it normally needs cleaning up afterwards."
ref = "Edit View › Pencil Tool"
status = "handbook"

[[tool]]
id = "rectangle"
label = "Primitives (Rectangle)"
shortcut = "F"
group = "primitives"
gestures = [
  "click: open a dialog to type the measurements of the rectangle to create at that spot",
  "drag: draw a rectangle between the press and release points",
  "Shift while dragging: constrain to a square",
  "Alt while dragging: grow the shape from its centre instead of from a corner",
  "Shift+F or click-and-hold on the toolbar icon: switch to the ellipse mode",
  "context menu › Draw Circle: switch to the ellipse mode",
]
area = "drawing"
milestone = "M3"
summary = "Rectangle mode of the Primitives tool, which adds a closed rectangular path either by dragging or from typed measurements."
ref = "Edit View › Primitives"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 5:06–5:08 and 6:22–6:28: a drag creates a closed four-node rectangle, selected afterwards; during the drag a grey badge near the pointer shows the live width × height. At 12:21 the toolbar button opens a menu listing Rectangle and Circle. Not shown: the click dialog, Shift, Alt, Shift+F."

[[tool]]
id = "ellipse"
label = "Primitives (Ellipse)"
shortcut = "F"
group = "primitives"
gestures = [
  "click: open a dialog to type the measurements of the ellipse to create at that spot",
  "drag: draw an ellipse inside the dragged box",
  "Shift while dragging: constrain to a circle",
  "Alt while dragging: grow the shape from its centre instead of from a corner",
  "Shift+F or click-and-hold on the toolbar icon: switch to the rectangle mode",
  "context menu › Draw Rectangle: switch to the rectangle mode",
]
area = "drawing"
milestone = "M3"
summary = "Ellipse mode of the Primitives tool, which adds a closed elliptical path either by dragging or from typed measurements."
ref = "Edit View › Primitives"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 9:06–9:11: a drag creates a closed ellipse with four smooth nodes at its extremes (top, bottom, left, right), with a size badge during the drag. At 12:21 the toolbar button opens a menu listing Rectangle and Circle. Not shown: the click dialog, Shift, Alt, Shift+F."

[[command]]
id = "tool.drawRectangle"
label = "Draw Rectangle"
menu = []
context = ["toolbar"]
shortcut = ""
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Context-menu item of the Primitives tool that puts the tool into rectangle mode."
ref = "Edit View › Primitives"
status = "handbook"

[[command]]
id = "tool.drawCircle"
label = "Draw Circle"
menu = []
