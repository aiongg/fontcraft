# Source: Glyphs 4 Handbook (public web handbook, glyphsapp.com/learn), chapters
#   "Glyphs", "Create", and "Edit View" up to and including the section "Guides"
#   (intro, Drawing Paths, Editing Paths, Strokes, Compositing, Anchors, Guides).
#   The rest of "Edit View" (Info Box onward) is inventoried in a sibling file.
# Date: 2026-10-07
# All summaries are our own wording. Labels, menu paths and shortcuts match the reference.
# Rows with status = "inferred" are our own design (mostly headless equivalents of pointer gestures).

# ───────────────────────────── Application basics ("Glyphs") ─────────────────────────────

[[behavior]]
id = "app.launchWithoutPlugins"
area = "extensions"
milestone = "M13"
summary = "Holding Option and Shift while the application starts launches it with every plug-in disabled, as a way out when a plug-in makes the app crash. FontCraft: the same keys (Alt and Shift on other platforms), or `fontcraft --safe-mode`, start the app with every module listed but none run; Help › Load Extensions (`app.loadExtensions`) turns them back on for the session."
ref = "Glyphs › Issues"
status = "handbook"
observe = [
  "Hold Option and Shift while launching: note any dialog or message, and whether plug-ins can be turned back on without relaunching.",
]
notes = "The keys are documented, not yet observed. Listing a module loads it in the sandbox (its manifest is read under the instruction and memory limits), which cannot crash the app, so safe mode still reads the Modules folder."
guesses = [
  "The launch keys are read on the window's first frame, since the toolkit reports modifier keys only once the window exists; whether the reference also offers a way back without relaunching would settle Load Extensions.",
]

[[behavior]]
id = "app.crashReportOnNextLaunch"
area = "ui-chrome"
milestone = "M14"
summary = "After a crash, the next launch shows a dialog offering to send a crash report to the developers."
ref = "Glyphs › Issues"
status = "handbook"

