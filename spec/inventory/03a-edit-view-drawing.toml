notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:54–12:05: tooltip \"Knife (E)\"; a line dragged across both contours of an O cuts them, and after a second cut the piece between the two lines is its own closed shape. Not shown: cuts across several overlapping paths, Shift+E."

[[tool]]
