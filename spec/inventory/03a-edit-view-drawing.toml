# Source: Glyphs 4 Handbook (public web handbook, glyphsapp.com/learn), chapters
#   "Glyphs", "Create", and "Edit View" up to and including the section "Guides"
#   (intro, Drawing Paths, Editing Paths, Strokes, Compositing, Anchors, Guides).
#   The rest of "Edit View" (Info Box onward) is inventoried in a sibling file.
# Date: 2026-10-07
# All summaries are our own wording. Labels, menu paths and shortcuts match the reference.
# Rows with status = "inferred" are our own design (mostly headless equivalents of pointer gestures).

# ───────────────────────────── Application basics ("Glyphs") ─────────────────────────────

[[behavior]]
id = "app.launchWithoutPlugins"
area = "extensions"
milestone = "M13"
summary = "Holding Option and Shift while the application starts launches it with every plug-in disabled, as a way out when a plug-in makes the app crash."
ref = "Glyphs › Issues"
status = "handbook"

[[behavior]]
id = "app.crashReportOnNextLaunch"
area = "ui-chrome"
milestone = "M14"
summary = "After a crash, the next launch shows a dialog offering to send a crash report to the developers."
ref = "Glyphs › Issues"
status = "handbook"

# ───────────────────────────── Document creation ("Create") ─────────────────────────────

[[panel]]
id = "window.start"
label = "Start Window"
location = "window"
controls = [
  "left: list of recently opened documents (double-click opens one; context menu: Show in Finder)",
  "right: application version information and links to the project website",
  "checkbox: Show window on startup",
  "plus button: switches the window to the new-document script chooser",
  "script list (it also appears whenever the recent-documents list is empty); included scripts get a coloured icon",
  "No / Yes toggle (top right) that includes the clicked script in the new document",
  "glyph set checkboxes for the clicked script (right side)",
  "search field (top right) filtering scripts by name",
  "Create Document button (lower right)",
]
area = "ui-chrome"
milestone = "M4"
summary = "Window shown when the app starts with no document open. It lists recent documents and, after pressing plus, lets the user pick scripts and glyph sets and create a document with empty glyphs for them."
ref = "Create"
status = "handbook"

[[command]]
id = "window.startWindow"
label = "Start Window"
menu = ["Window"]
shortcut = ""
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M4"
summary = "Opens the Start Window at any time, not only at launch."
ref = "Create"
status = "handbook"

[[behavior]]
id = "start.shownAtLaunchWithoutDocuments"
area = "ui-chrome"
milestone = "M4"
summary = "The Start Window appears at launch when no document is open. Clearing its Show window on startup checkbox suppresses it on later launches (a persisted preference)."
ref = "Create"
status = "handbook"

[[behavior]]
id = "start.recentDocumentsList"
area = "ui-chrome"
milestone = "M4"
summary = "Double-clicking an entry of the recent documents list opens that document. When the list is empty the script chooser is shown in its place."
ref = "Create"
status = "handbook"

[[command]]
id = "file.showInFinder"
label = "Show in Finder"
menu = []
shortcut = ""
kind = "ui"
params = "{path: string}"
area = "ui-chrome"
milestone = "M4"
summary = "Context-menu item on a recent document in the Start Window (Ctrl-click or right-click) that reveals the file in the system file manager."
ref = "Create"
status = "handbook"

[[command]]
id = "file.new"
label = "New"
menu = ["File"]
shortcut = "Cmd+N"
kind = "engine"
params = "{}"
area = "import-export"
milestone = "M1"
summary = "Creates a new untitled document that contains the basic ASCII glyphs, without asking anything."
ref = "Create"
status = "handbook"

[[command]]
id = "file.newFromGlyphSets"
label = "New from Glyph Sets…"
menu = ["File"]
shortcut = ""
kind = "engine"
params = "{scripts?: [{script: string, glyphSets?: [string]}]}"
area = "font-view"
milestone = "M4"
summary = "Opens the script and glyph-set chooser (the same one the Start Window plus button shows), preselected with the choices made last time, and creates a document holding one empty glyph for every glyph of the chosen sets. With explicit params it creates the document without showing the chooser."
ref = "Create"
status = "handbook"

[[behavior]]
id = "start.scriptChooserRules"
area = "font-view"
milestone = "M4"
summary = "In the chooser a script is included by clicking it and switching its toggle from No to Yes; individual glyph sets of an included script are switched with checkboxes; the search field filters the script list by name; the chooser remembers which scripts and glyph sets were picked last time."
ref = "Create"
status = "handbook"

[[command]]
id = "file.save"
label = "Save"
menu = ["File"]
shortcut = "Cmd+S"
kind = "engine"
params = "{path?: string, format?: string}"
area = "import-export"
milestone = "M1"
summary = "Writes the document to disk. The first save asks for a name, a folder and one of three source file formats (the default being the native single-file format)."
ref = "Create"
status = "handbook"

[[command]]
id = "file.saveAs"
label = "Save As…"
menu = ["File"]
shortcut = "Cmd+Shift+S"
kind = "engine"
params = "{path: string, format?: string, smartComponents?: components|outlines}"
area = "import-export"
milestone = "M1"
summary = "Saves the document under a new name or location, and is the way to switch an existing document to another of the source file formats at any time. FontCraft: smartComponents chooses whether a UFO or designspace holds smart components as components (default) or drawn as outlines (export.ufoSmartComponentsAsOutlines)."
ref = "Create"
status = "handbook"

# ───────────────────────────── Tabs and Edit View modes ─────────────────────────────

[[command]]
id = "view.newTab"
label = "New Tab"
menu = ["View"]
shortcut = "Cmd+T"
kind = "ui"
params = "{glyphs?: [names], text?: string}"
area = "ui-chrome"
milestone = "M3"
summary = "Opens a new Edit View tab in the current window showing the glyphs that are selected at the time, so several glyphs can be opened together."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.editSelectedGlyphs"
