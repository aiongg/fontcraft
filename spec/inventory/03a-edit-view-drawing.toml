summary = "The Draw tool draws quadratic curves in a glyph whose curves are quadratic, and cubic ones otherwise; in a glyph without a curve the font's curves decide. A path that has curves is continued with its own type. Convert Segment to Curve and a corner turned smooth follow the same rule, after the path's own curves."
