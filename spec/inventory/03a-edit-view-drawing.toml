ref = "Create"
status = "handbook"
notes = "FontCraft UI: Save As… from the menu or Cmd+Shift+S asks the system save chooser for the file, offering the document's title with the extension of its current format, and runs the command with the chosen `path`; the format follows the chosen extension, and a name without a source extension is saved in the offered format. Cancel saves nothing. The .glyphs format version is the document's own (pass `version` to change it). A window without a chooser (the browser, the control channel, MCP) runs the command as given, which refuses without a `path`."
guesses = [
  "Save As offers one filter with every source extension and no format or version pop-up, so the extension picks the format; the reference's save sheet picks the format from a pop-up, which observing it would let us match.",
]

