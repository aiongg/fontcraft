[[behavior]]
id = "guides.globalScopeFilter"
area = "guides-metrics"
milestone = "M4"
summary = "A global guide appears on all glyphs by default. Running Edit › Info for Selection (Cmd+Alt+I) on a selected global guide opens rules, built like Smart Filter rules, that limit the guide to the glyphs matching them."
ref = "Edit View › Local & Global Guides"
status = "handbook"
notes = "The evaluation is fontcraft_glyphquery::guide_in_scope. Edit View draws a global guide only in the glyphs its `filter` (a glyph predicate, as files store it; guide.setProperties sets it) matches, read against the edited layer's master. A guide left out is not hit by clicks, snapped to or reached by Select Next either. Built in M3.41: Info for Selection on one global guide selected alone in Edit View opens dialog.guideScope (crates/ui/src/dialogs/guide_scope.rs), the smart filter rule tree over the guide; OK compiles the rules (`RuleTree::compile`), writes the predicate with `Expr`'s `Display` and runs `guide.setProperties {filter}`. Rules that do not compile set nothing, and the dialog's Predicate line says so."
guesses = [
  "A filter that does not read as a predicate leaves the guide shown in every glyph. Settled by opening a file whose guide filter the reference cannot read.",
  "A stored filter opens as one Custom rule holding its text, since a predicate does not always read back as rules.",
  "The starter rule (every glyph name) writes an empty filter, so the guide shows in every glyph.",
]
observe = [
  "Give a global guide rules in the reference app, save, and read its filter in the file; then open the rules again and note whether they come back as rows or as one Custom rule.",
]

[[behavior]]
id = "undo.perGlyphHistory"
area = "drawing"
milestone = "M3"
summary = "Undo in Edit View and Font View is kept per glyph: each glyph has its own history. Changes to data that does not belong to a glyph, notably global guides (which belong to a master), are not recorded and cannot be undone."
ref = "Edit View › Glyph-Specific Undo History"
status = "handbook"
notes = "FontCraft differs on purpose (decision 0004 item 4, open decision D4): one history per document, every edit undoable, global guides included. No per-glyph filter in M3."

