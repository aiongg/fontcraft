[[command]]
id = "path.addPath"
label = "Add Path"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, closed?: bool, nodes: [{x, y, type?: line|curve|qcurve|offcurve, smooth?: bool}]} → {glyph, layer, shape: index, nodes: count, selection: {glyph, layer, shapes: [index]}}"
