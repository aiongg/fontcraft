[[behavior]]
id = "anchors.contextual"
area = "features"
milestone = "M8"
summary = "An anchor whose name starts with an asterisk (for example *bottom) is contextual: it replaces the plain anchor of the same base name for mark attachment whenever the glyph occurs in the context written in the anchor's Anchor Context field, and the plain anchor is used everywhere else. Several contextual anchors for one base name are told apart by a free suffix (*bottom.noon, *bottom.reh)."
ref = "Edit View › Contextual Mark Attachment"
status = "handbook"
notes = "Documented, not yet observed. Export follows ufo2ft's mark writer, which fontmake runs on the `GPOS_Context` user data; fontc ignores contexts (M8 planning pass). No corpus source has an anchor context. M8.21 (`crates/features/src/marks_contextual.rs`): a `*` anchor with a context attaches by its name without the `*` and without everything from the first `.`; a numbered one (`*top_2`) serves one ligature component. Each context and base name gets a lookup with the anchors, called from a chaining lookup after the plain attachment lookups, so it overrides them where the context matches. A master with such anchors gets the mark writer's `abvm`, `blwm`, `mark` and `mkmk` as feature code appended to the font's code; `curs`, the kerning and `GDEF` stay generated."
guesses = [
  "The contextual features are appended after the font's code, so their lookups come before the generated cursive and kerning lookups in the lookup list; a fontmake build with kerning, cursive and contextual anchors would settle the order.",
  "A variable font keeps the plain anchors and warns that the contexts were left out; fontmake's variable build would settle what the reference does.",
  "`abvm` and `blwm` take each contextual anchor by its own base name, where ufo2ft adds a context's whole anchor list to a feature when any one of them matches; a font with both kinds under one context would settle it.",
]

[[behavior]]
id = "anchors.contextSyntax"
area = "features"
milestone = "M8"
summary = "The anchor context is OpenType feature code for a glyph sequence in which * stands for the glyph holding the anchor; classes and tokens are allowed. An optional & marks where the mark glyph sits (needed when it does not come directly after the base), and a leading lookupflag …; statement sets lookup flags, typically UseMarkFilteringSet to restrict which marks the context applies to."
ref = "Edit View › Contextual Mark Attachment"
status = "handbook"
notes = "Documented, not yet observed. As ufo2ft reads the context (fontmake run on a font built for M8.21): each line is a separate context, trailing semicolons are dropped, the text before the semicolon is the lookup's flag statement, and without & the mark is put right after each *. Contexts that share a flag statement share one chaining lookup; longer contexts come first. A context that names a glyph the font does not have, or a class the feature code never names, is left out with a warning instead of failing the compile."
guesses = [
  "Tokens in a context are expanded with the compiled master's values before the context is read, as in feature code; a context whose token fails is left out with a warning.",
  "A context line without `*`, or with `{`, `}`, `#` or a double quote, leaves the anchor's context out with a warning, where ufo2ft passes it to the feature compiler; the running app would show whether it refuses such a context.",
  "With several semicolons the text up to the last one is the flag part, where ufo2ft fails on a second semicolon; the running app would settle it.",
  "A context naming an unknown glyph or class leaves that anchor's context out with a warning, where ufo2ft's feature compile fails; an export from the running app with such a context would settle it.",
]

