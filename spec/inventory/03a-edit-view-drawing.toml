# ───────────────────────────── Aligning ─────────────────────────────

[[command]]
id = "path.alignSelection"
label = "Align Selection"
menu = ["Path"]
shortcut = "Cmd+Shift+A"
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], axis?: auto|vertical|horizontal, origin?: object}"
area = "path-ops"
milestone = "M3"
summary = "Lines up all selected nodes, handles and anchors on one coordinate. It picks the axis on its own, collapsing whichever of the selection's width or height is smaller, and the coordinate they land on follows the transformation origin set in the Palette's transformations section. Special cases apply for anchors, components and single nodes (see the align.* behaviours)."
ref = "Edit View › Aligning"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:24–11:30: the Path menu lists Align Selection with Cmd+Shift+A. Not run."
guesses = [
  "When width equals height the selection aligns on one X, and the transformation origin's column or row picks min, centre or max (03a question 13).",
]

[[behavior]]
id = "align.viaZeroDimension"
area = "path-ops"
milestone = "M3"
summary = "Typing 0 into the width or height field of the Info box while two or more points are selected aligns them on that axis, as an alternative to Align Selection."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.anchorToPoints"
area = "components"
milestone = "M6"
summary = "When the selection is a single anchor plus a single path point, Align Selection moves the anchor horizontally so it sits above or below the point; with one anchor and two points it centres the anchor between the two. The point(s) do not move, and the horizontal position is corrected for the master's italic angle."
ref = "Edit View › Aligning"
status = "handbook"
notes = "Documented, not yet observed. `path.alignSelection` with exactly one anchor and one or two points, nothing else."
guesses = [
  "With two points the anchor keeps its height and moves horizontally onto the line at the italic angle through the points' midpoint, and a locked anchor refuses it; aligning an anchor between two nodes of different heights on an italic master in the reference app settles it.",
]

[[behavior]]
id = "align.componentOriginToNode"
area = "components"
milestone = "M6"
summary = "Align Selection with exactly one node and one component selected moves the component so that its origin point lands on the node; the node stays put."
ref = "Edit View › Aligning"
status = "handbook"
notes = "Documented, not yet observed. `path.alignSelection` with exactly one component in `shapes` and one on-curve node in `points`. A locked component, or one automatic alignment places, refuses it."

[[behavior]]
id = "align.componentOriginPoint"
area = "components"
milestone = "M6"
summary = "A component's origin point is the position of an anchor named origin in the referenced glyph when there is one. Otherwise, for upright masters it is where the baseline meets the left sidebearing; for slanted masters it is where the baseline is met by a vertical line drawn through the point at which the slanted left sidebearing reaches half the x-height."
ref = "Edit View › Aligning"
status = "handbook"
notes = "Documented, not yet observed. Only the base glyph's own anchors on the component's master are searched for origin, not anchors propagated from its components. Written sources (M6.25, docs/spec/09-reusing-shapes.md § 8.6): the corner tutorial (W8) gives the same rule for a corner glyph without an origin anchor, the point (0, 0) where the baseline meets the left sidebearing, on an upright master. A staff answer (forum 18125) says cap glyphs keep an unslanted bounding box so that their zero point is known; no written source covers a slanted master for ordinary components."
guesses = [
  "On a slanted master the left sidebearing line leaves the baseline at x = 0 and leans at the master's italic angle, so without an origin anchor the origin point is (x-height / 2 · tan(italic angle), 0) of the base glyph; aligning a component on an italic master in the reference app settles it.",
]
observe = [
  "On a master with an italic angle of 10° and an x-height of 500, select a node and a component of a glyph without an origin anchor, run Path › Align Selection and read the component's x: is it the node's x minus 44, or the node's x?",
]

[[behavior]]
id = "align.singleNodeToBackground"
area = "path-ops"
milestone = "M3"
summary = "Align Selection with only one node selected tries to move that node onto the closest node of the background layer."
ref = "Edit View › Aligning"
status = "handbook"

# ───────────────────────────── Duplicating and deleting ─────────────────────────────

[[behavior]]
id = "duplicate.optionDrag"
area = "drawing"
milestone = "M3"
summary = "Dragging a selection with Option held leaves the original in place and drags a copy to the new position. If only part of a path is selected, the selected segments are copied as a new open path (useful for repeating serifs and similar parts). The corner, cap and segment components and the brushes on what is copied come along. Copy (Cmd+C) and paste (Cmd+V) is the alternative."
ref = "Edit View › Duplicating Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 6:42–6:44 and 18:36–18:38: dragging a selected shape leaves the original and moves a copy, drawn darker during the drag, with a badge showing the offset. The modifier key is not visible. M3.20: a move or an Alt-drag copy shows its offset beside the pointer (`x:30 y:-20`). Release notes (updates.glyphsapp.com/Glyphs4.1-4100.html, build 3810): corner components stay on an Option-dragged copy."
guesses = [
  "The move badge shows the offset in whole units as `x:… y:…`; the reference app's wording is not visible in the video.",
  "Alt held at mouse-down on a selection drags a copy, and Alt pressed after the drag started switches to nudge (03a question 1).",
  "Alt held at mouse-down on lone nodes, with no whole segment, path or other object to copy, moves only the selected points (selection.move mode pointsOnly), as for nodes moved with Option; observing an Option-drag of one node would settle it.",
  "A copy of part of a path keeps a corner component when both segments at its node are copied, a cap with the segment after its node, and a segment component or brush with its own segment.",
]
observe = [
  "Option-drag a stem end with a corner component and a cap, once with all its nodes selected and once with half of them: note which attachments the copy has.",
  "Option-drag one selected node of a path: note whether a copy appears, or the node moves without its handles.",
]

