menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, from: [x, y], to: [x, y], shapes?: [index]} → {selection}"
area = "path-ops"
milestone = "M3"
summary = "Headless equivalent of the Knife tool: the segment from `from` to `to` cuts every path it crosses. Along the line, crossings with closed paths are paired in order within each stretch that enters and leaves the filled area (nonzero winding), and each pair is joined by straight segments along the line, so the pieces close along the cut and pieces of overlapping paths join one another. A stretch where the line starts or ends inside a shape is not cut; points where the line only touches a path are not crossings. Open paths are split where the line crosses them. Our own command."
ref = "Edit View › Cutting Paths"
status = "inferred"

# ───────────────────────────── Re-segmenting (open corners) ─────────────────────────────

[[command]]
id = "path.openCorner"
label = "Open Corner"
menu = []
context = ["canvas.node", "canvas.segment"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]} → {selection}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command that replaces a selected corner node by two nodes whose segments cross in a small triangular overlap, so the two segments can be edited independently. Does nothing on smooth nodes; with a segment selected it opens the nodes at both ends of that segment."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 15:30–15:36 and 28:34–28:45, and video \"Glyphs 3 quick tutorial. Open corners for better control\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=gcx9H6knvjM; it shows Glyphs 3, not Glyphs 4), 0:06.75–0:31: offered in the context menu of a selected corner node and of a selected segment; the corner becomes two nodes whose segments cross, leaving a small loop, and the nodes are then edited independently. Not shown: the no-op on smooth nodes, and that a selected segment opens the nodes at both of its ends. FontCraft: each end node moves along its own segment's direction, so the handles keep their directions. The distance is sqrt((dx·ox)² + (dy·oy)²) for a unit direction (dx, dy), where (ox, oy) is the overlap of `openCorner.overlapSize`. Corners whose two directions are within 1° of straight or reversed are left alone."

[[command]]
id = "path.reconnectNodes"
label = "Reconnect Nodes"
menu = []
context = ["canvas.node"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]} → {selection}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command with two uses: on the two nodes of an open corner it restores the single corner node; on any even number of selected nodes it pairs each node with its nearest selected neighbour and rewires the outline through those pairs, creating overlapping corners."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 28:34–28:35, and video \"Glyphs 3 quick tutorial. Open corners for better control\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=gcx9H6knvjM; it shows Glyphs 3, not Glyphs 4), 0:06.75: listed as the first item of the context menu, above Open Corner, with nodes selected. Its effect is not shown. FontCraft (03a question 15): pairs go nearest first. An open-corner pair becomes one node where the incoming direction of the first and the outgoing direction of the second meet. Any other pair is rewired: the path into each node continues, after a straight segment, along the path out of the other node; nodes at the same place become one corner. An odd number of nodes is refused."

[[command]]
id = "path.sharpenCorner"
label = "Sharpen Corner"
menu = []
context = ["canvas.node", "canvas.segment", "canvas.path"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points?: [[shape, node]], shapes?: [index]} → {selection}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command offered with selected nodes, a selected segment or a selected path, listed below Open Corner when that item is offered. What it does to the outline is not described in the handbook and has not been observed (03a open question 31)."
ref = "Edit View context menu; not described in the handbook"
status = "observed"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:12 (path selected) and 15:30 (corner node selected), and video \"Glyphs 3 quick tutorial. Open corners for better control\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=gcx9H6knvjM; it shows Glyphs 3, not Glyphs 4), 0:06.75 (segment selected): the item appears in the canvas context menu each time. It is never run. The name suggests it turns an opened or rounded corner back into one sharp corner; that is unconfirmed."

[[behavior]]
id = "openCorner.overlapSize"
area = "path-ops"
milestone = "M3"
summary = "The overlap produced when corners are opened or nodes reconnected is about half of the master's first vertical stem value and half of its first horizontal stem value (from Font Info › Masters)."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"

[[behavior]]
id = "openCorner.invisibleWhenSmall"
area = "path-ops"
milestone = "M3"
summary = "An opened corner whose triangular overlap is small compared with the visible segments next to it is treated as invisible and does not show in the final outline, which allows opened corners on the outside of a shape. Once the overlap exceeds the threshold it becomes visible. The threshold is not specified."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"
notes = "Video \"Glyphs 3 quick tutorial. Open corners for better control\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=gcx9H6knvjM; it shows Glyphs 3, not Glyphs 4), 0:24.5: in the filled preview the join is clean and the overlap loop of an opened corner does not show. The threshold is not visible."

