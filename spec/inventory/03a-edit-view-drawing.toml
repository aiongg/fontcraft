status = "handbook"
notes = "Built in M3.11: documented, not yet observed. Right of the path direction is outside a counter-clockwise outer path. Stored as the format version states it: version 3 from 0 (right) through 0.5 (centred) to 1 (left), version 4 from −1 (left) to 1 (right). A document not read from a `.glyphs` file uses the version 3 form, the version it is saved in. No stored position is a centred stroke."

[[behavior]]
id = "stroke.joinsAndCaps"
area = "path-ops"
milestone = "M3"
summary = "A stroke has one join style out of four, and open paths have a cap style out of five chosen separately for the start and the end node. The axis-aligned cap cuts the end parallel to the X or Y axis, picking whichever is closer to the cap's natural orientation unless an axis is forced."
ref = "Edit View › Stroke Style"
status = "handbook"
notes = "Built in M3.11: documented, not yet observed."
guesses = [
  "Every join and cap shape is our construction on offset curves (docs/spec/03a § 17): miter up to 4 half widths, then bevel.",
  "Round full is round on the outer side and fills the inner corner with an arc of half the stroke width; round inset is a round cap that ends at the end node.",
  "The axis-aligned cap cuts through the middle of the band at the end node and is a butt end when the path ends within about 6° of a forced axis.",
]

