[[command]]
id = "layer.inspect"
label = "Inspect Layer"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background} → {glyph, layer, master, side, locked, width, shapes: [{index, kind: path|component|image|other, closed?, locked?, nodes?: [{index, x, y, type, smooth}], component?: name, transform?: [xx, xy, yx, yy, dx, dy]}], anchors: [{name, x, y}], guides: [{scope: local|global, index, x, y, angle, locked}], annotations: [{index, type: text|arrow|circle|plus|minus (another type as stored), x, y, text?}]}"
area = "drawing"
milestone = "M3"
summary = "Query that returns one layer's outline with the address of every shape, node, anchor, guide and annotation, in the form the target parameters of the editing commands use. Agents and tests read outlines with it. Our own command."
ref = "Edit View › Selecting Nodes and Paths"
status = "inferred"

[[behavior]]
id = "tools.sharedButtonCycling"
area = "ui-chrome"
milestone = "M3"
summary = "Tools that share one toolbar button (Select/Lasso, the two Primitives modes, Erase/Knife) have one shortcut letter; pressing Shift plus that letter switches to the other tool of the group, and click-and-hold on the button opens a menu listing the group's tools."
ref = "Edit View › Cutting Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:54–11:57: the tooltip reads \"Knife (E)\" and the button carries a small menu triangle; 12:21: the Primitives button opens a menu listing Rectangle and Circle. Not shown: Shift plus the letter."

[[behavior]]
id = "points.terminology"
area = "drawing"
milestone = "M3"
summary = "Vocabulary used throughout: a node is an on-curve point, a handle is an off-curve (Bézier control) point, and point covers both."
ref = "Edit View › Draw Tool"
status = "handbook"

[[behavior]]
id = "nodes.smoothAndCornerTypes"
area = "drawing"
milestone = "M3"
summary = "Every node is either smooth or corner. A smooth node keeps its two handles collinear at all times and is drawn as a green circle; a corner node lets its handles take any angle (collinear or not) and is drawn as a blue square. Node size and colours come from the settings."
ref = "Edit View › Draw Tool"
status = "handbook"

[[behavior]]
id = "handles.display"
area = "drawing"
milestone = "M3"
summary = "Handles are drawn as small circles joined to their node by a thin grey line; they set the curvature of the segment they belong to."
ref = "Edit View › Draw Tool"
status = "handbook"
notes = "Built in M3.2: a cubic segment's first handle is joined to its start node and the second to its end node; a quadratic segment's handles are joined in order, as its control polygon."

[[behavior]]
id = "paths.openEndMarkers"
area = "drawing"
milestone = "M3"
summary = "An open path shows a short blue stroke, at right angles to the path, at each of its two end nodes; the first node additionally carries a (light) blue triangle pointing in path direction."
ref = "Edit View › Draw Tool"
status = "handbook"
notes = "Built in M3.2: the stroke crosses the path at each end node, at right angles to the direction to its neighbouring point; the triangle sits just past the first node, pointing along the path."

[[behavior]]
id = "paths.pointsStoredInDirectionOrder"
area = "drawing"
milestone = "M3"
summary = "A path stores its points in path-direction order starting at the start node, and several path operations depend on that order."
ref = "Edit View › Draw Tool"
status = "handbook"

[[command]]
id = "view.showNodesInForeground"
label = "In Foreground"
menu = ["View", "Show Nodes"]
shortcut = "Cmd+Shift+N"
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M3"
summary = "Toggles whether nodes and handles of the foreground layer are drawn in Edit View."
ref = "Edit View › Draw Tool"
status = "handbook"

# ───────────────────────────── Selecting ─────────────────────────────

[[tool]]
id = "select"
label = "Select"
shortcut = "V"
group = "select"
gestures = [
  "drag on empty canvas: rectangular marquee selecting the nodes and handles inside it",
  "Alt+drag marquee: select on-curve nodes only, skipping handles",
  "Ctrl while dragging a marquee: turn the marquee to a new angle; releasing Ctrl goes back to resizing at that angle (slanted selection)",
  "click a node, handle or segment: select it",
  "Shift+click or Shift+marquee: add to or remove from the selection",
  "double-click near a segment: select the whole path",
  "double-click a node: toggle it between smooth and corner (Alt keeps the outline unchanged)",
  "Shift+double-click a node: toggle super-smooth",
  "Alt+click a line segment: turn it into a curve segment",
  "drag a selected node: move the selection; attached handles follow",
  "Alt while moving nodes: move only the selected points, leaving unselected attached handles behind",
  "Ctrl+Alt while moving nodes (or Alt added after the drag started): nudge, scaling the neighbouring unselected handles in proportion",
  "drag a handle: move it (all selected handles move together)",
  "Alt+drag a handle: change its length while keeping its angle",
  "Ctrl+Alt+drag a handle of a smooth node: copy its length and angle to the opposite handle",
  "drag a segment: move its two nodes and their handles",
  "Alt+drag a segment: change the handle lengths while keeping each handle's angle",
  "Alt+drag a selection: drag out a duplicate (whole paths, the selected segments of partial paths, anchors, guides)",
  "drag an open path end onto another open end: join them, closing the path",
  "drag a bounding-box knob: scale about the opposite knob (Shift proportional, Alt about the box centre)",
  "drag just outside the bounding box: rotate about the opposite knob (Alt about the selection centre)",
  "Ctrl while dragging: suspend magnetic guides and node snapping",
  "click an anchor: select it; double-click an anchor: rename it",
  "click a guide: select it; drag its knob: move it; drag the guide elsewhere: change its angle; double-click the knob: turn it by 90°",
  "right-click or Ctrl+click: open the context menu for the item under the pointer",
  "Shift+V or click-and-hold on the toolbar icon › Lasso Select: switch to the Lasso tool",
]
area = "drawing"
milestone = "M3"
summary = "Main pointer tool: selects, moves, converts, duplicates, scales and rotates nodes, handles, segments, paths, anchors, guides and components, and gives access to the canvas context menu."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[tool]]
id = "lasso"
label = "Lasso Select"
shortcut = "V"
group = "select"
gestures = [
  "drag: draw a free-form outline; the points inside it become the selection",
  "Shift+V: switch back to the Select tool",
]
area = "drawing"
milestone = "M3"
summary = "Selection tool with a hand-drawn region instead of a rectangle, meant for dense outlines where a marquee would catch too much. Shares the toolbar button and the V key with Select."
ref = "Edit View › Free-form Selections"
status = "handbook"

[[behavior]]
id = "selection.marqueeSelectsNodesAndHandles"
area = "drawing"
milestone = "M3"
summary = "A marquee picks up both nodes and handles that fall inside it; with Option held it picks up on-curve nodes only."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 10:28: a marquee over a whole glyph selects its nodes and its handles. Not shown: the Option variant."

[[behavior]]
id = "selection.slantedMarquee"
area = "drawing"
milestone = "M3"
summary = "While a marquee is being dragged, holding Ctrl rotates the marquee instead of resizing it; after Ctrl is released the drag resizes the marquee at the new angle. Intended for italic outlines."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[behavior]]
id = "selection.shiftExtendsOrReduces"
area = "drawing"
milestone = "M3"
summary = "With Shift held, clicking or marquee-selecting toggles the hit items in the existing selection rather than replacing it. Handles are selectable on their own, so Shift-clicking handles builds a non-contiguous selection."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[behavior]]
id = "selection.doubleClickSelectsPath"
area = "drawing"
milestone = "M3"
summary = "Double-clicking close to a segment selects every point of the path that segment belongs to."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[behavior]]
id = "selection.segmentCountsAsSelected"
area = "drawing"
milestone = "M3"
summary = "A segment is treated as selected when both of its end nodes are selected or when at least one of its handles is selected."
ref = "Edit View › Deleting Nodes"
status = "handbook"
notes = "Video \"Glyphs 3 quick tutorial. Open corners for better control\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=gcx9H6knvjM; it shows Glyphs 3, not Glyphs 4), 0:06.5: with the two end nodes of a segment selected, the segment between them is drawn highlighted. Not shown: the case of a selected handle."

[[command]]
id = "edit.selectAll"
label = "Select All"
menu = ["Edit"]
shortcut = "Cmd+A"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "In edit mode the first use selects all paths of the layer; if all paths are already selected (or there are none left to add) it also selects all anchors and components, so selecting everything can take two presses."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[command]]
id = "edit.deselectAll"
label = "Deselect All"
menu = ["Edit"]
shortcut = "Cmd+Alt+A"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Empties the selection."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "edit.invertSelection"
label = "Invert Selection"
menu = ["Edit"]
shortcut = "Cmd+Alt+Shift+I"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Selects every point that is currently unselected and deselects the ones that were selected."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "selection.selectNext"
label = "Select Next"
menu = []
shortcut = "Tab"
when = "editView"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "With exactly one node or handle selected, moves the selection to the following point along the path. With an anchor selected it moves to the next anchor, and with a guide selected to the next guide."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "selection.selectPrevious"
label = "Select Previous"
menu = []
shortcut = "Shift+Tab"
when = "editView"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Counterpart of selection.selectNext: moves the selection to the preceding point on the path, the previous anchor or the previous guide."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "selection.set"
label = "Set Selection"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph: name, layer?: id, mode?: replace|add|remove|toggle, points?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index]}"
area = "drawing"
milestone = "M3"
summary = "Headless equivalent of clicking and Shift-clicking: sets or amends the Edit View selection from explicit object references. Our own command."
ref = "Edit View › Selecting Nodes and Paths"
status = "inferred"

[[command]]
id = "selection.selectInRegion"
label = "Select in Region"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph: name, layer?: id, rect?: [x, y, width, height], angle?: number, polygon?: [[x, y]], nodesOnly?: bool, mode?: replace|add|toggle}"
area = "drawing"
milestone = "M3"
summary = "Headless equivalent of the marquee (optionally slanted) and of the lasso: selects the points inside a rectangle or polygon given in font units, with the same nodes-only and extend options as the pointer gestures. Our own command."
ref = "Edit View › Free-form Selections"
status = "inferred"

# ───────────────────────────── Moving ─────────────────────────────

[[command]]
id = "selection.move"
label = "Move"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index], dx: number, dy: number, mode?: normal|pointsOnly|nudge, duplicate?: bool} → {selection}"
area = "drawing"
milestone = "M3"
summary = "Moves the selected nodes, handles, anchors or guides by an offset in font units. It is what the arrow keys run: one unit per press, 10 with Shift, 100 with Cmd; the mode mirrors the Option (points only) and Ctrl+Option (nudge) modifiers."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 13:42–13:45: dragging the two selected top nodes of a rectangle moves only them, which slants the stem. Arrow-key steps: see move.arrowKeyIncrements."

[[behavior]]
id = "move.arrowKeyIncrements"
area = "drawing"
milestone = "M3"
summary = "Each arrow key press moves the selection by 1 unit, by 10 units with Shift and by 100 units with Cmd. The same steps apply to selected handles, anchors and guides."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 6:48–6:51 and 8:02–8:06: with the pointer still, a selected shape moves in steps of exactly 10 units and a selected node in steps of 1 unit. The keys are not visible."

[[behavior]]
id = "move.nodesCarryHandles"
area = "drawing"
milestone = "M3"
summary = "Moving a node moves the handles attached to it by the same offset even when those handles are not selected. Holding Option moves only the points that are actually selected."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.nudge"
area = "drawing"
milestone = "M3"
summary = "Nudging (Ctrl+Option while moving nodes, or Option pressed after a drag has begun) moves the selected nodes and at the same time rescales the surrounding unselected handles in proportion, so the neighbouring curves keep their character instead of being sheared."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.handles"
area = "drawing"
milestone = "M3"
summary = "A handle moves by dragging or with the arrow keys (Shift 10, Cmd 100); several selected handles move together. With Option held the handle keeps its angle and only its length changes."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.mirrorHandleAcrossSmoothNode"
area = "drawing"
milestone = "M3"
summary = "While a handle of a smooth node is being moved with Ctrl and Option held, the opposite handle of that node is given the same length and the matching (opposite) angle, making the node symmetric."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.dragSegment"
area = "drawing"
milestone = "M3"
summary = "Dragging a segment moves its two end nodes together with their handles. Option-dragging a curve segment instead lengthens or shortens its handles along their existing angles, leaving the nodes in place."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

# ───────────────────────────── Converting nodes and segments ─────────────────────────────

[[command]]
id = "path.toggleNodeType"
label = "Toggle Node Type"
menu = []
context = ["canvas.node"]
shortcut = "Return"
when = "editView"
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]], to?: smooth|corner, keepOutline?: bool}"
area = "drawing"
milestone = "M3"
summary = "Switches each selected node between smooth and corner (also run by double-clicking a node). Turning a corner smooth adds handles on both sides where missing and may bend the outline to line the handles up; with keepOutline (Alt+Return or Alt+double-click) the shape is left exactly as it is."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[command]]
id = "path.toggleNodeTypeKeepingOutline"
label = "Toggle Node Type Keeping Outline"
menu = []
shortcut = "Alt+Return"
when = "editView"
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]}"
area = "drawing"
milestone = "M3"
summary = "Variant of path.toggleNodeType that changes only the node's type flag and never moves a point, so the drawn outline stays the same."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[command]]
id = "path.toggleSuperSmooth"
label = "Toggle Super Smooth"
menu = []
shortcut = "Alt+Shift+Return"
when = "editView"
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]], on?: bool}"
area = "drawing"
milestone = "fidelity"
summary = "Turns the selected nodes into super-smooth nodes, or back into ordinary ones (also run by Shift+double-click on a node)."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"
notes = "Deferred to the interaction-fidelity pass: the handbook gives no construction for the G2 join or for the points export emits (03a open question 12), and a guess would change exported outlines."

[[command]]
id = "path.convertSegmentToCurve"
label = "Convert Segment to Curve"
menu = []
context = ["canvas.segment"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, segments: [[shape, node]]} → {selection}"
area = "drawing"
milestone = "M3"
summary = "Turns a straight segment into a curve segment by adding one handle at each of its two nodes. The reference triggers it by Option-clicking the line segment."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[behavior]]
id = "segments.deleteHandleMakesLine"
area = "drawing"
milestone = "M3"
summary = "Selecting one or both handles of a curve segment and deleting them turns that segment back into a straight line."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[command]]
id = "path.tidyUpPaths"
label = "Tidy up Paths"
menu = ["Path"]
shortcut = "Cmd+Shift+T"
kind = "engine"
params = "{glyphs: [names], layer?: id, points?: [[shape, node]] (with one glyph)}"
area = "path-ops"
milestone = "M3"
summary = "Heuristically sets each node to smooth or corner and removes redundant points: handles lying on a straight segment, on-curve nodes sitting exactly on the line between their neighbours, and adjacent nodes with identical coordinates (which get merged). Works on the selected nodes, or on all nodes when nothing is selected."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:24–11:30: the Path menu lists Tidy up Paths with Cmd+Shift+T. Not run. FontCraft: points within 0.01 units count as on a line or as one point; a node is smooth when a curve meets it and its two directions are within 1° (03a question 9). Segment changes need both end nodes selected."

[[command]]
id = "path.tidyUpPathsForAllMasters"
label = "Tidy up Paths for all Masters"
menu = ["Path"]
shortcut = "Cmd+Alt+Shift+T"
kind = "engine"
params = "{glyphs: [names]}"
area = "path-ops"
milestone = "M3"
summary = "Runs Tidy up Paths on every master layer of the selected glyphs. Shown in the Path menu while Option is held."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[behavior]]
id = "tidyUp.mayBreakCompatibility"
area = "path-ops"
milestone = "M3"
summary = "Points that look redundant in one master can be required for point-compatibility with other masters, so tidying a single layer can make a glyph stop interpolating."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[behavior]]
id = "nodes.superSmoothBetweenCurves"
area = "drawing"
milestone = "fidelity"
summary = "A super-smooth node between two curve segments is drawn with a star icon and gives curvature (G2) continuity: both segments share tangent and curvature radius at the join. To achieve this the effective node position is shifted; the path as drawn is shown in grey behind the smoothed result and a small grey dot marks where the effective node is."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"
notes = "Deferred to the interaction-fidelity pass: the handbook gives no construction for the G2 join or for the points export emits (03a open question 12), and a guess would change exported outlines."

[[behavior]]
id = "nodes.superSmoothBetweenLineAndCurve"
area = "drawing"
milestone = "fidelity"
summary = "A super-smooth node between a straight and a curved segment is drawn with a half-square/half-circle (raindrop) icon and blends the line into the curve without a curvature jump (squircle-like corners). It needs a long enough straight segment; small grey dots on the line show the length it consumes and grey dots near the curve show the points that will be generated at export."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"
notes = "Deferred to the interaction-fidelity pass: the handbook gives no construction for the G2 join or for the points export emits (03a open question 12), and a guess would change exported outlines."

[[behavior]]
id = "nodes.superSmoothResolvedAtExport"
area = "compile"
milestone = "fidelity"
summary = "Super-smooth nodes are a source-level construct: the exported outline contains ordinary points computed from them (the grey preview dots), not the nodes as drawn."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"
notes = "Deferred to the interaction-fidelity pass: the handbook gives no construction for the G2 join or for the points export emits (03a open question 12), and a guess would change exported outlines."

[[behavior]]
id = "nodes.metricLineHighlight"
area = "guides-metrics"
milestone = "M3"
summary = "A beige diamond is drawn behind any node that sits precisely on one of the vertical metric lines, and a node inside an alignment zone with a beige circle, so their placement can be judged even when zoomed far out."
ref = "Edit View › Nodes in Alignment Zones"
status = "handbook"
notes = "Built in M3.2 (our reading): \"vertical metric lines\" are the master's horizontal lines that measure height (ascender, cap height, x-height, baseline, descender, and any other metric but the italic angle). A node on one, within 1e-6 units, gets the diamond; otherwise a node inside an alignment zone gets the circle."

[[behavior]]
id = "nodes.duplicateHighlight"
area = "drawing"
milestone = "M3"
summary = "Two neighbouring on-curve nodes with identical coordinates are flagged with a red circle; Tidy up Paths merges them."
ref = "Edit View › Duplicate Nodes"
status = "handbook"
notes = "Built in M3.2: neighbours are consecutive on-curve nodes in path order, the last and the first included on a closed path; coordinates must be equal."

# ───────────────────────────── Scaling and rotating ─────────────────────────────

[[tool]]
id = "rotate"
label = "Rotate"
shortcut = "R"
group = ""
gestures = [
  "click: set the transformation origin at the clicked position",
  "drag: rotate the current selection about the origin",
  "Shift while dragging: rotate in steps of 90°",
]
area = "drawing"
milestone = "M3"
summary = "Rotates the current selection freehand about an origin the user places with a click."
ref = "Edit View › Scaling & Rotating"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 12:25–12:30: with the Rotate tool, a drag rotates the selected rectangle about a pivot at the selection's centre, with a line drawn from the pivot to the pointer. Not shown: setting the origin with a click, Shift."

[[tool]]
id = "scale"
label = "Scale"
shortcut = "S"
group = ""
gestures = [
  "click: set the transformation origin at the clicked position",
  "drag: scale the current selection about the origin",
  "Shift while dragging: scale proportionally (same factor on both axes)",
]
area = "drawing"
milestone = "M3"
summary = "Scales the current selection freehand about an origin the user places with a click."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[command]]
id = "view.showBoundingBox"
label = "Show Bounding Box"
menu = ["View"]
shortcut = "Cmd+Alt+Shift+B"
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M3"
summary = "Toggles the selection bounding box with its scale knobs in Edit View."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "boundingBox.scaleKnobs"
area = "drawing"
milestone = "M3"
summary = "When more than one node is selected a bounding box with eight knobs (four sides, four corners) is drawn. Dragging a knob scales the selected points with the opposite knob as fixed point; Shift keeps proportions and Option uses the box centre as fixed point."
ref = "Edit View › Scaling & Rotating"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 23:51: with several nodes selected, dragging the top or bottom knob scales them vertically, with a badge showing the percentage and new height. 9:24–9:31: a corner-knob drag shrinks an ellipse about its centre with its proportions kept, which fits Shift+Option, but the keys are not visible."

[[behavior]]
id = "boundingBox.rotateOutside"
area = "drawing"
milestone = "M3"
summary = "Dragging from just outside the bounding box rotates the selection about the knob opposite the grab position; with Option it rotates about the centre of the selection."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "infoBox.selectionGeometryFields"
area = "drawing"
milestone = "M3"
summary = "With several nodes selected the Info box shows X, Y, width and height of the selection; editing X/Y moves it and editing width/height scales it about the reference point chosen in the nine-point origin control beside the fields. A closed lock scales width and height together, an open lock independently."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "infoBox.pointCounts"
area = "drawing"
milestone = "M3"
summary = "With several points selected the Info box shows two counts: how many points are selected (beside a filled square) and how many points the active layer holds altogether (beside an outlined square)."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "numberFields.arrowKeyStepping"
area = "ui-chrome"
milestone = "M3"
summary = "In every numeric text field of the app the Up and Down arrow keys raise or lower the value by 1, and by 10 with Shift."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

# ───────────────────────────── Aligning ─────────────────────────────

[[command]]
id = "path.alignSelection"
label = "Align Selection"
menu = ["Path"]
shortcut = "Cmd+Shift+A"
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], axis?: auto|vertical|horizontal, origin?: object}"
area = "path-ops"
milestone = "M3"
summary = "Lines up all selected nodes, handles and anchors on one coordinate. It picks the axis on its own, collapsing whichever of the selection's width or height is smaller, and the coordinate they land on follows the transformation origin set in the Palette's transformations section. Special cases apply for anchors, components and single nodes (see the align.* behaviours)."
ref = "Edit View › Aligning"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:24–11:30: the Path menu lists Align Selection with Cmd+Shift+A. Not run."

[[behavior]]
id = "align.viaZeroDimension"
area = "path-ops"
milestone = "M3"
summary = "Typing 0 into the width or height field of the Info box while two or more points are selected aligns them on that axis, as an alternative to Align Selection."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.anchorToPoints"
area = "components"
milestone = "M6"
summary = "When the selection is a single anchor plus a single path point, Align Selection moves the anchor horizontally so it sits above or below the point; with one anchor and two points it centres the anchor between the two. The point(s) do not move, and the horizontal position is corrected for the master's italic angle."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.componentOriginToNode"
area = "components"
milestone = "M6"
summary = "Align Selection with exactly one node and one component selected moves the component so that its origin point lands on the node; the node stays put."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.componentOriginPoint"
area = "components"
milestone = "M6"
summary = "A component's origin point is the position of an anchor named origin in the referenced glyph when there is one. Otherwise, for upright masters it is where the baseline meets the left sidebearing; for slanted masters it is where the baseline is met by a vertical line drawn through the point at which the slanted left sidebearing reaches half the x-height."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.singleNodeToBackground"
area = "path-ops"
milestone = "M3"
summary = "Align Selection with only one node selected tries to move that node onto the closest node of the background layer."
ref = "Edit View › Aligning"
status = "handbook"

# ───────────────────────────── Duplicating and deleting ─────────────────────────────

[[behavior]]
id = "duplicate.optionDrag"
area = "drawing"
milestone = "M3"
summary = "Dragging a selection with Option held leaves the original in place and drags a copy to the new position. If only part of a path is selected, the selected segments are copied as a new open path (useful for repeating serifs and similar parts). Copy (Cmd+C) and paste (Cmd+V) is the alternative."
ref = "Edit View › Duplicating Paths"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 6:42–6:44 and 18:36–18:38: dragging a selected shape leaves the original and moves a copy, drawn darker during the drag, with a badge showing the offset. The modifier key is not visible."

[[command]]
id = "edit.delete"
label = "Delete"
menu = []
shortcut = "Delete"
when = "editView"
kind = "engine"
params = "{glyph: name, layer?: id, points?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index]} → {selection}"
area = "drawing"
milestone = "M3"
summary = "Removes the selection. A deleted node is taken out without opening the path, and the neighbouring handles are refitted so the remaining segment follows the old shape as closely as possible. The same key removes selected anchors and pen points."
ref = "Edit View › Deleting Nodes"
status = "handbook"

[[command]]
id = "edit.deleteInAllMasters"
label = "Delete in All Masters"
menu = []
shortcut = "Alt+Delete"
when = "editView"
kind = "engine"
params = "{glyph: name, points?: [[shape, node]], shapes?: [index]} → {selection, skipped: [{layer, reason}]}"
area = "drawing"
milestone = "M3"
summary = "Deletes the selected nodes with shape reconstruction, and removes the corresponding nodes in every master of the glyph as well."
ref = "Edit View › Deleting Nodes"
status = "handbook"

[[command]]
id = "path.deleteAndBreak"
label = "Delete and Break"
menu = []
shortcut = "Shift+Delete"
when = "editView"
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]} → {selection}"
area = "drawing"
milestone = "M3"
summary = "Removes each selected node together with the two segments that meet at it, leaving the path open there. When whole segments are selected it removes just those segments and keeps every remaining part of the path unchanged."
ref = "Edit View › Deleting Nodes"
status = "handbook"

