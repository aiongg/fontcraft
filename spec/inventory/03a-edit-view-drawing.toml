ref = "Edit View › Focusing & Locking"
status = "handbook"

[[behavior]]
id = "paths.lockedPointsHoverRed"
area = "drawing"
milestone = "M3"
summary = "Hovering over a point on a locked path colours it red, a sign that the point cannot be dragged."
ref = "Edit View › Focusing & Locking"
status = "handbook"

[[command]]
id = "glyph.toggleLocked"
label = "Locked"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], locked?: bool}"
area = "drawing"
milestone = "M3"
summary = "Checkable item in a glyph's context menu that locks or unlocks the whole glyph. A locked glyph rejects every modification, whether from pointer tools, filters, plug-ins or scripts, and shows a lock icon in its top-right corner in both Edit View and Font View."
ref = "Edit View › Focusing & Locking"
status = "handbook"

# ───────────────────────────── Strokes ─────────────────────────────

[[panel]]
id = "palette.stroke"
label = "Stroke"
location = "palette"
controls = [
  "stroke width field (font units)",
  "stroke height field (font units; empty means same as width)",
  "Fill checkbox (closed paths: also fill the area enclosed by the stroke outlines)",
  "stroke position: percentage field plus three presets, centre (0 %), left of path (−100 %), right of path (100 %)",
  "stroke join: four icon buttons, the last being a full-round join (the reference names only that one)",
  "start cap and end cap (open paths, chosen separately): five icon buttons, the last two being round inset and aligned to an axis",
  "aligned-to-axis cap: click-and-hold to force the X or the Y axis instead of the automatic choice",
]
area = "path-ops"
milestone = "M3"
summary = "Palette section at the bottom right holding the live stroke attributes of the selected path. It is available only while Show Info is on and a path is selected."
ref = "Edit View › Strokes"
status = "handbook"

[[command]]
id = "path.setStroke"
label = "Set Stroke"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, paths?: [integer], width?: number|null, height?: number|null, fill?: bool, position?: number, join?: string, capStart?: string, capEnd?: string, capAxis?: auto|x|y}"
area = "path-ops"
milestone = "M3"
summary = "Writes the stroke attributes of one or more paths, the action behind the Stroke palette fields; setting width to null removes the stroke. The reference exposes these only as palette controls."
ref = "Edit View › Creating Strokes"
status = "inferred"

[[behavior]]
id = "stroke.nonDestructiveAttribute"
area = "path-ops"
milestone = "M3"
summary = "A stroke is an attribute of a path (open or closed), not new geometry: giving a path a stroke width makes it render as an expanded shape while the path itself remains editable. Width and height are in font units and height falls back to width when unset."
ref = "Edit View › Creating Strokes"
status = "handbook"

[[behavior]]
id = "stroke.fillForClosedPaths"
area = "path-ops"
milestone = "M3"
summary = "A stroked closed path renders as a ring by default; with Fill checked the area enclosed by the new outlines is filled as well."
ref = "Edit View › Creating Strokes"
status = "handbook"

[[behavior]]
id = "stroke.display"
area = "path-ops"
milestone = "M3"
summary = "In Edit View the original (centre) path of a stroked path is drawn light grey and the resulting stroke outline black."
ref = "Edit View › Creating Strokes"
status = "handbook"

[[command]]
id = "path.expandOutline"
label = "Expand Outline"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], layer?, paths?: [integer]}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command that replaces a stroked path by ordinary closed outlines of its stroke and drops the stroke attributes."
ref = "Edit View › Creating Strokes"
status = "handbook"

[[command]]
id = "path.expandOutlineForAllMasters"
label = "Expand Outline for All Masters"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], paths?: [integer]}"
area = "path-ops"
milestone = "M3"
summary = "Option variant of Expand Outline that expands the stroke on all masters of the glyph. The alternate item's label is not given in the reference."
ref = "Edit View › Creating Strokes"
status = "handbook"

[[behavior]]
id = "stroke.position"
area = "path-ops"
milestone = "M3"
summary = "Stroke position is a percentage: 0 % centres the stroke on the path, −100 % puts it entirely on the left of the path and 100 % entirely on the right (left and right relative to path direction); any value in between is allowed."
ref = "Edit View › Stroke Style"
status = "handbook"

[[behavior]]
id = "stroke.joinsAndCaps"
area = "path-ops"
milestone = "M3"
summary = "A stroke has one join style out of four, and open paths have a cap style out of five chosen separately for the start and the end node. The axis-aligned cap cuts the end parallel to the X or Y axis, picking whichever is closer to the cap's natural orientation unless an axis is forced."
ref = "Edit View › Stroke Style"
status = "handbook"

[[command]]
id = "path.addPenPoint"
label = "Add Pen Point"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, path: integer, at: [x, y] | {segment: integer, t: number}}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command (Select tool, right-click on a stroked path) that adds a pen point at that position along a segment, between nodes, without adding a node."
ref = "Edit View › Pen Points"
status = "handbook"

[[command]]
id = "path.setPenPoint"
label = "Set Pen Point"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, path: integer, node?: integer, penPoint?: integer, width?: number, height?: number, angle?: number, position?: number, progressionIn?: number, progressionOut?: number, clear?: bool}"
area = "path-ops"
milestone = "M3"
summary = "Writes or clears the pen-point data of a node or of a free pen point, the action behind the pen-point fields of the Info box. Clearing the data is how a pen point on a node is removed. The reference exposes this only as Info box fields."
ref = "Edit View › Pen Points"
status = "inferred"

[[behavior]]
id = "penPoints.overrideStrokeLocally"
area = "path-ops"
milestone = "M3"
summary = "A pen point overrides the path's stroke width and height at its location, and also carries a pen angle (rotating the pen, which changes the apparent thickness) and its own stroke position offset. It can sit on an existing node or anywhere along a segment."
ref = "Edit View › Pen Points"
status = "handbook"

[[behavior]]
id = "penPoints.openVersusClosedPaths"
area = "path-ops"
milestone = "M3"
summary = "On an open path the two end nodes keep the path-level stroke settings unless given pen points. On a closed path a single pen point replaces the settings for the whole path, so modulation needs at least two."
ref = "Edit View › Pen Points"
status = "handbook"

[[behavior]]
id = "penPoints.progression"
area = "path-ops"
milestone = "M3"
summary = "Each pen point has two progression values, the last two Info box fields: the upper one shapes how the stroke changes as it approaches the pen point, the lower one how it changes as it leaves. Range −1.0 to 2.0; low values concentrate the change close to the pen point, high values spread it over the segment."
ref = "Edit View › Pen Points"
status = "handbook"

[[behavior]]
id = "penPoints.deleting"
area = "path-ops"
milestone = "M3"
summary = "A free pen point is removed by selecting it and pressing Delete. A pen point attached to a node is removed by clearing its values in the node's Info box, since Delete would remove the node."
ref = "Edit View › Pen Points"
status = "handbook"

# ───────────────────────────── Compositing ─────────────────────────────

[[behavior]]
id = "compositing.shapesCombineInOrder"
area = "path-ops"
milestone = "M3"
summary = "The final outline of a layer is the composite of its shapes taken in their stored order; order matters because a mask only affects the shapes below it."
ref = "Edit View › Compositing"
status = "handbook"

[[command]]
id = "path.setMask"
label = "Mask"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, paths?: [integer], mask: bool}"
area = "path-ops"
milestone = "M3"
summary = "Sets or clears the Mask flag of the selected path (a Palette checkbox in the reference). A mask path is subtracted from every shape below it in shape order; it stays a normal editable path, so the subtraction is live."
ref = "Edit View › Masking"
status = "handbook"

[[behavior]]
id = "mask.display"
area = "path-ops"
milestone = "M3"
summary = "With masks in play, the parts of paths that are subtracted away are drawn light grey and the resulting outline black."
ref = "Edit View › Masking"
status = "handbook"

[[command]]
id = "filter.shapeOrder"
label = "Shape Order"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, order?: [integer]}"
area = "path-ops"
milestone = "M3"
summary = "Opens a dialog listing the layer's shapes for reordering by drag and drop; OK applies the new order. With an explicit order it reorders without the dialog."
ref = "Edit View › Masking"
status = "handbook"

[[panel]]
id = "dialog.shapeOrder"
label = "Shape Order"
location = "dialog"
controls = ["draggable list of the layer's shapes in stacking order", "OK button"]
area = "path-ops"
milestone = "M3"
summary = "Dialog of Filter › Shape Order used to rearrange the shapes of a layer; this chapter describes it only as far as masking needs."
ref = "Edit View › Masking"
status = "handbook"

# ───────────────────────────── Anchors ─────────────────────────────

[[behavior]]
id = "anchors.purpose"
area = "components"
milestone = "M6"
summary = "An anchor is a named point on a layer. By name convention anchors drive automatic alignment of components, corner and cap components, mark-to-base positioning, mark-to-mark positioning, cursive attachment and ligature carets; unknown names are kept and may be used by plug-ins."
ref = "Edit View › Anchors"
status = "handbook"

[[command]]
id = "anchor.add"
label = "Add Anchor"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, name?: string, x: number, y: number}"
area = "components"
milestone = "M6"
summary = "Canvas context-menu command that places an anchor at the clicked position. It is named new anchor and its name is immediately in edit state; Return or a click on the canvas confirms the typed name."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[command]]
id = "anchor.rename"
label = "Rename"
menu = []
shortcut = "Return"
kind = "engine"
params = "{glyph?, layer?, anchor: string, name: string}"
area = "components"
milestone = "M6"
summary = "Renames an anchor. In the UI this starts by double-clicking the anchor, by pressing Return with it selected, or by editing the name field of the Info box."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[command]]
id = "anchor.setPosition"
label = "Set Position"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, anchor: string, x: number, y: number}"
area = "components"
milestone = "M6"
summary = "Places an anchor at explicit coordinates, the headless form of dragging it, moving it with the arrow keys or typing coordinates into the Info box. Our own command."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "inferred"

[[command]]
id = "anchor.remove"
label = "Remove"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, anchors: [names]}"
area = "components"
milestone = "M6"
summary = "Removes the named anchors from a layer, the headless form of selecting anchors and pressing Delete. Our own command."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "inferred"

[[command]]
id = "glyph.setAnchors"
label = "Set Anchors"
menu = ["Glyph"]
shortcut = "Cmd+U"
kind = "engine"
params = "{glyphs?: [names], layer?}"
area = "components"
milestone = "M6"
summary = "Adds the default anchors that the glyph info database lists for each selected glyph. For ligature glyphs named after their parts it also adds the appropriate caret anchors."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[command]]
id = "glyph.setAnchorsForAllMasters"
label = "Set Anchors for all Masters"
menu = ["Glyph"]
shortcut = "Cmd+Alt+U"
kind = "engine"
params = "{glyphs?: [names]}"
area = "components"
milestone = "M6"
summary = "Option variant of Set Anchors that adds the default anchors on every master layer of the selected glyphs."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[command]]
id = "glyph.resetAnchors"
label = "Reset Anchors"
menu = ["Glyph"]
shortcut = "Cmd+Shift+U"
kind = "engine"
params = "{glyphs?: [names], layer?}"
area = "components"
milestone = "M6"
summary = "Deletes all anchors of the selected glyphs' layers and rebuilds the default set from the glyph info database."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[command]]
id = "glyph.resetAnchorsForAllMasters"
label = "Reset Anchors for All Masters"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names]}"
area = "components"
milestone = "M6"
summary = "Option variant of Reset Anchors that resets the anchors on all masters. The reference mentions the modifier but gives neither the item's label nor a shortcut."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[behavior]]
id = "anchors.selection"
area = "components"
milestone = "M6"
summary = "An anchor is selected by clicking its orange dot, several by Shift-clicking, the next or previous one with Tab or Shift+Tab. Only selected anchors show their name."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[behavior]]
id = "anchors.moveLikeNodes"
area = "components"
milestone = "M6"
summary = "A selected anchor moves the same way a node does: by dragging with the Select tool, with the arrow keys and their increments, or by typing coordinates in the Info box."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[behavior]]
id = "anchors.shapeShowsMetricPosition"
area = "components"
milestone = "M6"
summary = "The anchor marker is a diamond when the anchor sits precisely on a metric line (baseline or x-height, for instance), a square when it is inside an alignment zone, and a circle otherwise. Anchors whose name starts with an underscore are drawn with a hole in the same three shapes."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[behavior]]
id = "anchors.uniqueNamesPerLayer"
area = "components"
milestone = "M6"
summary = "Anchor names are unique within a layer. An Option-drag that duplicates an anchor therefore gives the copy the original name with an underscore appended."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[behavior]]
id = "anchors.originAnchor"
area = "components"
milestone = "M6"
summary = "An anchor named origin inside a glyph defines the point of that glyph's components that Align Selection places on a node."
ref = "Edit View › Anchors"
status = "handbook"

[[behavior]]
id = "anchors.markToBase"
area = "features"
milestone = "M8"
summary = "The mark feature is generated automatically from anchors: a combining mark carries an underscore-prefixed anchor (for example _top) and base glyphs carry the anchor of the same name without the underscore (top); each such pair becomes a mark-to-base attachment. Combining marks usually end in comb, have Unicode values and can be typed after any base."
ref = "Edit View › Mark to Base Positioning"
status = "handbook"

[[behavior]]
id = "anchors.ccmpAlongsideMark"
area = "features"
milestone = "M8"
summary = "When the mark feature is generated and glyphs such as idotless and jdotless exist, the ccmp feature is generated as well."
ref = "Edit View › Mark to Base Positioning"
status = "handbook"

[[behavior]]
id = "anchors.markToMark"
area = "features"
milestone = "M8"
summary = "The mkmk feature is generated automatically for every combining mark that has both an underscore anchor and the matching plain anchor, so marks carrying both can be stacked on each other."
ref = "Edit View › Mark to Mark Positioning"
status = "handbook"

[[behavior]]
id = "anchors.cursiveAttachment"
area = "features"
milestone = "M8"
summary = "Anchors named exit and entry, placed at the end and the beginning of the connecting strokes of initial, medial and final forms, define cursive attachment: each glyph's entry anchor is placed on the exit anchor of its predecessor. With right-to-left typesetting switched on, Edit View previews the attachment live."
ref = "Edit View › Cursive Attachment"
status = "handbook"

[[behavior]]
id = "anchors.ligatureCarets"
area = "features"
milestone = "M8"
summary = "Anchors on the baseline of a ligature glyph named caret_ plus a distinguishing suffix (caret_1, caret_2 …) mark text-cursor positions inside the ligature. The suffix only keeps the names unique and its order is ignored; at export they become LigatureCaretByPos entries in GDEF."
ref = "Edit View › Ligature Carets"
status = "handbook"

[[behavior]]
id = "anchors.contextual"
area = "features"
milestone = "M8"
summary = "An anchor whose name starts with an asterisk (for example *bottom) is contextual: it replaces the plain anchor of the same base name for mark attachment whenever the glyph occurs in the context written in the anchor's Anchor Context field, and the plain anchor is used everywhere else. Several contextual anchors for one base name are told apart by a free suffix (*bottom.noon, *bottom.reh)."
ref = "Edit View › Contextual Mark Attachment"
status = "handbook"

[[behavior]]
id = "anchors.contextSyntax"
area = "features"
milestone = "M8"
summary = "The anchor context is OpenType feature code for a glyph sequence in which * stands for the glyph holding the anchor; classes and tokens are allowed. An optional & marks where the mark glyph sits (needed when it does not come directly after the base), and a leading lookupflag …; statement sets lookup flags, typically UseMarkFilteringSet to restrict which marks the context applies to."
ref = "Edit View › Contextual Mark Attachment"
status = "handbook"

[[panel]]
id = "palette.anchorContext"
label = "Anchor Context"
location = "palette"
controls = ["text field for the feature-code context of the selected contextual anchor"]
area = "components"
milestone = "M8"
summary = "Field at the bottom of the Palette for the context of a selected asterisk-prefixed anchor. It is shown only while Show Info is on."
ref = "Edit View › Contextual Mark Attachment"
status = "handbook"

[[command]]
id = "anchor.setContext"
label = "Set Context"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, anchor: string, context: string}"
area = "components"
milestone = "M8"
summary = "Stores the context code of a contextual anchor, the action behind the Anchor Context field. The reference exposes it only as that field."
ref = "Edit View › Contextual Mark Attachment"
status = "inferred"

# ───────────────────────────── Guides ─────────────────────────────

[[behavior]]
id = "guides.magnetic"
area = "guides-metrics"
milestone = "M3"
summary = "While a node selection is dragged, temporary red lines appear whenever it lines up with other nodes or with a vertical metric. Holding Ctrl switches these magnetic guides off for the duration."
ref = "Edit View › Magnetic Guides"
status = "handbook"

[[behavior]]
id = "snapping.toNodesAndHandles"
area = "guides-metrics"
milestone = "M3"
summary = "Any dragged node or other object snaps to the nodes and handles of paths, including those inside components. Near a component node, small markers for the component's nodes fade in as snap targets. Holding Ctrl disables snapping."
ref = "Edit View › Magnetic Guides"
status = "handbook"

[[command]]
id = "guide.add"
label = "Add Guide"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, x?: number, y?: number, angle?: number, throughNodes?: [{path, index}, {path, index}]}"
area = "guides-metrics"
milestone = "M3"
summary = "Canvas context-menu command that adds a local guide to the displayed layer: horizontal through the clicked position, or, when exactly two nodes are selected, running through those two nodes."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[command]]
id = "guide.addGlobal"
label = "Add Global Guide"
menu = []
shortcut = ""
kind = "engine"
params = "{master?, x?: number, y?: number, angle?: number}"
area = "guides-metrics"
milestone = "M3"
summary = "Alternate context-menu item, shown while Option is held, that adds the guide as a global (master-wide) guide instead of a local one."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.fromMeasurementTool"
area = "guides-metrics"
milestone = "M3"
summary = "While a measurement line is being dragged with the Measurement tool, pressing G with Cmd, Option and Ctrl held turns that line into a guide."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[command]]
id = "view.showGuides"
label = "Show Guides"
menu = ["View"]
shortcut = "Cmd+Shift+L"
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M3"
summary = "Toggles the display of guides in Edit View."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.localVersusGlobal"
area = "guides-metrics"
milestone = "M3"
summary = "A local guide belongs to one glyph layer, is drawn blue and shows only on that layer. A global guide belongs to a master, is drawn red and shows on every glyph of that master unless its scope is restricted."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.knobAndSelection"
area = "guides-metrics"
milestone = "M3"
summary = "A guide is selected by clicking anywhere on it and shows a filled knob while selected. Dragging the knob moves the guide, dragging the guide anywhere else changes its angle, and double-clicking the knob turns the guide perpendicular to its present orientation."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.keyboard"
area = "guides-metrics"
milestone = "M3"
summary = "With a guide selected, Tab and Shift+Tab step to the next and previous guide, and the arrow keys move it by 1 unit (10 with Shift, 100 with Cmd) like a node."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.optionDragDuplicates"
area = "guides-metrics"
milestone = "M3"
summary = "Option-dragging one or more selected guides leaves the originals and drops copies at the new position."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[command]]
id = "guide.makeGlobal"
label = "Make Global Guide"
menu = []
shortcut = ""
kind = "engine"
params = "{guides?: [integer]}"
area = "guides-metrics"
milestone = "M3"
summary = "Context-menu command that moves the selected local guide from the layer to the master, turning it into a global guide."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[command]]
id = "guide.makeLocal"
label = "Make Local Guide"
menu = []
shortcut = ""
kind = "engine"
params = "{guides?: [integer]}"
area = "guides-metrics"
milestone = "M3"
summary = "Context-menu command that moves the selected global guide from the master to the current glyph layer, turning it into a local guide."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[command]]
id = "guide.lock"
label = "Lock Guides"
menu = []
shortcut = ""
kind = "engine"
params = "{guides?: [integer]}"
area = "guides-metrics"
milestone = "M3"
summary = "Context-menu command that locks the selected guides. Once locked, a guide can no longer be selected, and a lock icon replaces its knob."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[command]]
id = "guide.unlock"
label = "Unlock Guide"
menu = []
shortcut = ""
kind = "engine"
params = "{guide?: integer}"
area = "guides-metrics"
milestone = "M3"
summary = "Context-menu command, reached by right-clicking or Ctrl-clicking a locked guide's lock icon, that makes the guide selectable again."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[command]]
id = "guide.setProperties"
label = "Set Properties"
menu = []
shortcut = ""
kind = "engine"
params = "{guide: integer, scope?: local|global, x?: number, y?: number, angle?: number, angleLocked?: bool, relativeTo?: left|right|both, measurement?: bool, name?: string, filter?: object}"
area = "guides-metrics"
milestone = "M3"
summary = "Writes the properties of a guide that the reference edits through the Info box and Info for Selection: position, angle, angle lock, sidebearing reference, measurement flag, name and, for global guides, the glyph filter. Our own command."
ref = "Edit View › Local & Global Guides"
status = "inferred"

[[command]]
id = "guide.remove"
label = "Remove"
menu = []
shortcut = ""
kind = "engine"
params = "{guides: [integer], scope?: local|global}"
area = "guides-metrics"
milestone = "M3"
summary = "Removes guides. Our own command; the chapter does not say how a guide is deleted (presumably the Delete key on a selected guide)."
ref = "Edit View › Local & Global Guides"
status = "inferred"

[[behavior]]
id = "guides.infoBoxFields"
area = "guides-metrics"
milestone = "M3"
summary = "For a selected guide the Info box offers its position, its angle with a lock toggle, a three-way sidebearing reference control, a measurement toggle and a Name field."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.angleLock"
area = "guides-metrics"
milestone = "M3"
summary = "Closing the lock next to a guide's angle in the Info box freezes the angle, so dragging the guide can no longer rotate it until the lock is opened again."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.sidebearingReference"
area = "guides-metrics"
milestone = "M3"
summary = "A guide's horizontal position is measured from the left sidebearing by default. It can instead be tied to the right sidebearing or to both sidebearings, so that a (typically slanted or global) guide keeps its relation to the right edge when the glyph width changes."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.measurementFlag"
area = "guides-metrics"
milestone = "M3"
summary = "The measurement toggle in the Info box turns a selected guide into a measurement guide; what a measurement guide displays is covered with the measuring features."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.names"
area = "guides-metrics"
milestone = "M3"
summary = "A guide can be given a name through the Name field of the Info box; the name is drawn at the left end of the guide."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "guides.globalScopeFilter"
area = "guides-metrics"
milestone = "M4"
summary = "A global guide appears on all glyphs by default. Running Edit › Info for Selection (Cmd+Alt+I) on a selected global guide opens rules, built like Smart Filter rules, that limit the guide to the glyphs matching them."
ref = "Edit View › Local & Global Guides"
status = "handbook"

[[behavior]]
id = "undo.perGlyphHistory"
area = "drawing"
milestone = "M3"
summary = "Undo in Edit View and Font View is kept per glyph: each glyph has its own history. Changes to data that does not belong to a glyph, notably global guides (which belong to a master), are not recorded and cannot be undone."
ref = "Edit View › Glyph-Specific Undo History"
status = "handbook"

# ── Added after the audit of 2026-10-07: a tool the appendix names. ──

[[tool]]
id = "selectAllLayers"
label = "Select All Layers"
shortcut = "Shift+V"
group = "select"
gestures = ["as the Select tool, acting on the visible layers of the glyph at once (details not documented)"]
area = "drawing"
milestone = "M3"
summary = "A variant of the Select tool sharing its toolbar button, named only in the appendix with its shortcut. What exactly it selects across layers must be observed."
ref = "Appendix › Custom Parameters (mention only)"
status = "handbook"
