ref = "Edit View › Strokes"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 5:08: a Stroke section appears at the bottom of the Palette while a path is selected and is absent with nothing selected (partly visible). Its fields are not shown. Built in M3.11: a path counts as selected when it is selected whole or one of its nodes or handles is. Controls: width (emptying it removes the stroke); with a stroke, height (empty: the width), position with the presets −100, 0 and 100, Fill (closed paths), a Join row of icon buttons for miter, bevel, round and round full, and for open paths Start and End rows of icon buttons for the caps butt, square, round, round inset and axis-aligned; each icon names its choice on hover. Holding the axis-aligned cap for half a second opens a menu (automatic, X axis, Y axis); the forced axis is one per path, so it serves both ends, and the release that ends the hold sets nothing. Each control runs `path.setStroke` with only its own key. The buttons carry text, not icons."
