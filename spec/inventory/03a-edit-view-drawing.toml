# ───────────────────────────── Re-segmenting (open corners) ─────────────────────────────

[[command]]
id = "path.openCorner"
label = "Open Corner"
menu = []
context = ["canvas.node", "canvas.segment"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], segments?: [[shape, node]], overlap?: number | [x, y]} → {selection}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command that replaces a selected corner node by two nodes whose segments cross in a small triangular overlap, so the two segments can be edited independently. Does nothing on smooth nodes; with a segment selected it opens the nodes at both ends of that segment."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 15:30–15:36 and 28:34–28:45, and video \"Glyphs 3 quick tutorial. Open corners for better control\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=gcx9H6knvjM; it shows Glyphs 3, not Glyphs 4), 0:06.75–0:31: offered in the context menu of a selected corner node and of a selected segment; the corner becomes two nodes whose segments cross, leaving a small loop, and the nodes are then edited independently. Not shown: the no-op on smooth nodes, and that a selected segment opens the nodes at both of its ends. FontCraft: the distance is sqrt((dx·ox)² + (dy·oy)²) for a unit direction (dx, dy), where (ox, oy) is the overlap of `openCorner.overlapSize`. `overlap` overrides it. The context menu lists it only when a selected on-curve node is a corner (not smooth) and not an end of an open path."
guesses = [
  "A master with stems of one direction only uses that stem for both directions, and a master without stems uses an overlap of 4% of the em.",
  "Each end node moves along its own segment's direction, so the handles keep their directions.",
  "Corners whose two directions are within 1° of straight or reversed are left alone.",
]

[[command]]
id = "path.reconnectNodes"
label = "Reconnect Nodes"
menu = []
context = ["canvas.node"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, points: [[shape, node]]} → {selection}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command with two uses: on the two nodes of an open corner it restores the single corner node; on any even number of selected nodes it pairs each node with its nearest selected neighbour and rewires the outline through those pairs, creating overlapping corners."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 28:34–28:35, and video \"Glyphs 3 quick tutorial. Open corners for better control\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=gcx9H6knvjM; it shows Glyphs 3, not Glyphs 4), 0:06.75: listed as the first item of the context menu, above Open Corner, with nodes selected. Its effect is not shown. FontCraft: a pair that is not an open corner is rewired: the path into each node continues, after a straight segment, along the path out of the other node; nodes at the same place become one corner. An odd number of nodes is refused."
guesses = [
  "Pairs go nearest first, ties to the lower address (03a question 15).",
  "An open-corner pair becomes one node where the incoming direction of the first and the outgoing direction of the second meet; any other pair is rewired with straight segments.",
]

