guesses = [
  "The axis-aligned cap is stored as cap code 4; not confirmed against the reference's files.",
  "A forced cap axis is kept in the native key `lineCapAxis`, which .glyphs files do not hold, so saving as .glyphs loses it (a known loss).",
  "A UFO keeps strokes, masks and the other path attributes in FontCraft's own glyph lib key `com.fontcraft.pathAttributes` (glyphsLib keeps none); the key's name and form are ours, so the reference app and glyphsLib drop it when they read the UFO.",
