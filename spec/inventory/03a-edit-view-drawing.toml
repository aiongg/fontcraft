[[behavior]]
id = "tabs.windowHoldsFontViewPlusEditTabs"
area = "ui-chrome"
milestone = "M3"
summary = "One document window holds Font View as its fixed first tab followed by any number of Edit View tabs; clicking a tab title switches to it."
ref = "Edit View"
status = "handbook"
notes = "Built in M3.2. In `crates/ui` (`shell/tabs.rs`, `panels/tab_strip.rs`) the strip is craft's document tab strip at the top of the document area: Font View first and not closable, then the Edit View tabs titled by their first four glyphs. Tabs that do not fit are listed in the menu of the button at the strip's end (More Tabs; Alt+Down opens it), and a pick there shows the tab; every tab and close button has an accessible name (M14.9). Each tab keeps its glyph, camera, text and preview features, master and picked layers, selection and path focus, Edit Background and Preview Area; at most 1,000 tabs are open and the last 32 closed are kept. Each open document has its own tab set within those limits: switching the active document shows that document's tabs with the tab that showed last, and closing a document drops its tabs. A window and each new document open on Font View; `docs/ui.md` has the design. A renamed glyph keeps its place in every tab, closed ones included; a removed glyph leaves the tabs, a tab left without glyphs closes and is not kept for Reopen Last Closed Tab (Font View shows when it was showing), and a closed tab left without glyphs is forgotten."
guesses = [
  "A window, and each document opened into it, opens on Font View with no Edit View tab, and a file's stored tabs open behind Font View; the handbook does not say which tab a file opens on. Opening a new file in the reference app settles it.",
  "Font View draws in the master of the Edit View tab shown last; the handbook gives Font View no master of its own. Switching masters in two tabs and then showing Font View in the reference app settles it.",
  "A tab left without glyphs by a removal closes, and Font View shows when it was showing; removing the only glyph of the showing tab in the reference app settles it.",
]
observe = [
  "Open a new file and note which tab shows first.",
  "Open two tabs, pick another master in the second, show Font View, and note which master its cells draw.",
]

[[behavior]]
id = "menus.optionRevealsAlternateItems"
area = "ui-chrome"
milestone = "M3"
summary = "Holding Option while a menu or context menu is open swaps some items for an alternate form, typically the same action applied to all masters (Tidy up Paths, Correct Path Direction, Reverse Contours, Set/Reset Anchors, Expand Outline), plus Force Extremes, Add Global Guide and Reopen Last Closed Tab."
ref = "Edit View › Editing Paths"
status = "handbook"
notes = "The window (`crates/ui/src/app/menu_alternates.rs`, `ALTERNATES`) puts each pair on the base row of the menu bar: choosing the row with Alt held runs the alternate, and the alternate has no row of its own. While Alt is held the row shows the alternate command's own label and shortcut (`craft_ext::menu::held_alternate_labels`); the label updates as Alt goes down and up while the menu is open. The table takes shell commands too: Reopen Last Closed Tab is Close Tab's alternate in the View menu (M14.4b). `ui.menu.list` names a row's alternate in `alternate` and lists the alternate after it with `alternateOf`; `ui.menu.invoke` runs an alternate by its id. Expand Outline for All Masters and the node commands in All Masters (M3.52) are alternates in the canvas context menu (`context_menu::ALTERNATES`), since their base commands have no menu bar row; Align Selection in All Masters is Align Selection's alternate in the Path menu. Delete has no menu row anywhere, so Delete in All Masters stays its Alt+Delete key. Not yet in the table: the Font View batch forms, whose commands the window does not have yet."
guesses = [
  "Clear Background is the Alt alternate of Assign Background; the handbook says only that it shows while Alt is held. Holding Option in the reference app's Path menu settles it.",
  "An alternate row shows its own command's label and shortcut, as native macOS alternate items do; the handbook names the alternates but not their labels. The observe step below settles it.",
  "Expand Outline for All Masters is offered as Expand Outline's Alt alternate in the canvas context menu; the handbook names the pair but not which menu shows it.",
]
observe = [
  "Open the Path menu, hold Option, and note which items change, their labels, and whether each keeps its shortcut with Option added.",
  "Right-click a path in Edit View with Option held and note whether Expand Outline reads Expand Outline for All Masters; then open the View menu with Option held and note whether Close Tab reads Reopen Last Closed Tab.",
]

[[behavior]]
id = "menus.switchCheckMarks"
area = "ui-chrome"
milestone = "M3"
summary = "A menu item that switches something on and off shows a check mark while it is on: the View › Show items, the other display aids, and the menu switches of the Edit, Path and Window menus."
ref = "Edit View › Glyph Display › View Options"
status = "handbook"
notes = "Documented for View › Show Info and View › Show Metrics, not yet observed for the other items. FontCraft: every command in `SWITCHES` (crates/ui/src/app/menu_states.rs) carries `checked` in the menu tree and in `ui.menu.list`; a menu item that only opens a window (Space Center, Kerning, Macro Panel) has none. The menu cache hashes the state of every switch, so the tree is rebuilt only on a frame where one changed. In `crates/ui` the list is `SWITCHES` in `app/menu_states.rs`; each row reads its state after every drain and the menu bar is rebuilt when a mark changed. Show Image and Keep Layer Selection in Sync join it when their commands exist there."
guesses = [
  "Every on/off switch shows a check mark, including Lock Outline, Power Nudge, Edit Background, Palette, Preview Panel and Font Audit; opening the reference app's View, Path and Window menus with each switch on and off settles which ones do.",
  "View › Show Indexes shows a check mark while any kind of index is shown. Settled by turning on a single kind in the reference app and opening the View menu.",
]
observe = [
