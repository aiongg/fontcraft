milestone = "M3"
summary = "Switches to the tab at the given position. The reference binds Cmd+Alt+2 through Cmd+Alt+9 to tab positions 2 to 9 (position 1 is Font View); the shortcut field holds only the first of that range."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.showNextTab"
label = "Show Next Tab"
menu = ["View", "Navigation"]
shortcut = "Ctrl+Tab"
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M3"
summary = "Activates the tab to the right of the current one."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.showPreviousTab"
label = "Show Previous Tab"
menu = ["View", "Navigation"]
shortcut = "Ctrl+Shift+Tab"
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M3"
summary = "Activates the tab to the left of the current one."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.closeTab"
label = "Close Tab"
menu = ["View"]
shortcut = "Cmd+Shift+W"
kind = "ui"
params = "{index?: integer}"
area = "ui-chrome"
milestone = "M3"
summary = "Closes the current Edit View tab. The close button that appears when the pointer is over a tab title does the same for that tab."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.closeOtherTabs"
label = "Close Other Tabs"
menu = []
shortcut = ""
kind = "ui"
params = "{keep?: integer}"
area = "ui-chrome"
milestone = "M3"
summary = "Closes every tab except one. The reference offers this only as Option-click on a tab's close button, which keeps the current tab; it names no menu item."
ref = "Edit View"
status = "handbook"

[[command]]
id = "view.reopenLastClosedTab"
label = "Reopen Last Closed Tab"
menu = ["View"]
shortcut = "Cmd+Alt+Shift+W"
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M3"
summary = "Brings back the most recently closed tab. In the reference it is an alternate menu item that shows while Option is held."
ref = "Edit View"
status = "handbook"

[[behavior]]
id = "tabs.windowHoldsFontViewPlusEditTabs"
area = "ui-chrome"
milestone = "M3"
summary = "One document window holds Font View as its fixed first tab followed by any number of Edit View tabs; clicking a tab title switches to it."
ref = "Edit View"
status = "handbook"

[[behavior]]
id = "menus.optionRevealsAlternateItems"
area = "ui-chrome"
milestone = "M3"
summary = "Holding Option while a menu or context menu is open swaps some items for an alternate form, typically the same action applied to all masters (Tidy up Paths, Correct Path Direction, Reverse Contours, Set/Reset Anchors, Expand Outline), plus Force Extremes, Add Global Guide and Reopen Last Closed Tab."
ref = "Edit View › Editing Paths"
status = "handbook"

[[behavior]]
id = "editView.textModeAndEditMode"
area = "edit-text"
milestone = "M3"
summary = "Edit View is always in one of two modes. Text mode (entered by choosing the Text tool, shortcut T) inserts and removes glyphs and adjusts spacing and kerning; edit mode works on the outline of one glyph."
ref = "Edit View"
status = "handbook"

[[behavior]]
id = "editView.enteringEditMode"
area = "edit-text"
milestone = "M3"
summary = "Edit mode starts when any tool other than Text is chosen, when a glyph in the tab is double-clicked, or when Escape is pressed in text mode, which makes the glyph just after the text cursor the edited one."
ref = "Edit View"
status = "handbook"

# ───────────────────────────── Drawing tools ─────────────────────────────

[[tool]]
id = "draw"
label = "Draw"
shortcut = "P"
group = ""
gestures = [
  "click on empty canvas: place a node; successive nodes are joined into one path",
  "drag on empty canvas: place a node and pull two handles out of it, giving a curved segment",
  "Alt while dragging: change only the handle of the coming segment and leave the handle of the previous segment where it is",
  "Cmd while dragging: change only the length of the coming handle while both handles keep their shared angle",
  "Space while dragging: move the node being placed instead of its handles",
  "click on the first node of the open path being drawn: close the path",
  "click on a node of an existing path: open the path at that node",
  "Shift+click on a segment: insert a node at the extremum or inflection nearest to the click",
]
area = "drawing"
milestone = "M3"
summary = "Pen tool for building Bézier outlines node by node. Clicks give straight joins, drags give curve handles whose length sets the curvature; it also opens paths at a node and inserts nodes at extremes and inflections."
ref = "Edit View › Draw Tool"
status = "handbook"

[[tool]]
id = "pencil"
label = "Pencil"
shortcut = "B"
group = "pencil"
gestures = [
  "drag: draw a freehand stroke that is converted into a Bézier path following the pointer or stylus",
]
area = "drawing"
milestone = "M3"
summary = "Freehand drawing tool aimed at tablets and styluses. The traced result follows the hand closely and therefore carries more nodes than a constructed path, so it normally needs cleaning up afterwards."
ref = "Edit View › Pencil Tool"
status = "handbook"

[[tool]]
id = "rectangle"
label = "Primitives (Rectangle)"
shortcut = "F"
group = "primitives"
gestures = [
  "click: open a dialog to type the measurements of the rectangle to create at that spot",
  "drag: draw a rectangle between the press and release points",
  "Shift while dragging: constrain to a square",
  "Alt while dragging: grow the shape from its centre instead of from a corner",
  "Shift+F or click-and-hold on the toolbar icon: switch to the ellipse mode",
  "context menu › Draw Circle: switch to the ellipse mode",
]
area = "drawing"
milestone = "M3"
summary = "Rectangle mode of the Primitives tool, which adds a closed rectangular path either by dragging or from typed measurements."
ref = "Edit View › Primitives"
status = "handbook"

[[tool]]
id = "ellipse"
label = "Primitives (Ellipse)"
shortcut = "F"
group = "primitives"
gestures = [
  "click: open a dialog to type the measurements of the ellipse to create at that spot",
  "drag: draw an ellipse inside the dragged box",
  "Shift while dragging: constrain to a circle",
  "Alt while dragging: grow the shape from its centre instead of from a corner",
  "Shift+F or click-and-hold on the toolbar icon: switch to the rectangle mode",
  "context menu › Draw Rectangle: switch to the rectangle mode",
]
area = "drawing"
milestone = "M3"
summary = "Ellipse mode of the Primitives tool, which adds a closed elliptical path either by dragging or from typed measurements."
ref = "Edit View › Primitives"
status = "handbook"

[[command]]
id = "tool.drawRectangle"
label = "Draw Rectangle"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Context-menu item of the Primitives tool that puts the tool into rectangle mode."
ref = "Edit View › Primitives"
status = "handbook"

[[command]]
id = "tool.drawCircle"
label = "Draw Circle"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Context-menu item of the Primitives tool that puts the tool into ellipse mode."
ref = "Edit View › Primitives"
status = "handbook"

[[panel]]
id = "dialog.primitiveMeasurements"
label = "Primitive Measurements"
location = "dialog"
controls = ["numeric fields for the size of the shape (the reference does not list them; width and height assumed)", "confirm / cancel"]
area = "drawing"
milestone = "M3"
summary = "Dialog shown after a single click with the Primitives tool; the typed measurements define the rectangle or ellipse that is then created at the clicked position. Field names, defaults and which point of the shape lands on the click are not documented."
ref = "Edit View › Primitives"
status = "handbook"

[[command]]
id = "path.addRectangle"
label = "Add Rectangle"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, x: number, y: number, width: number, height: number, fromCenter?: bool}"
area = "drawing"
milestone = "M3"
summary = "Headless equivalent of the rectangle primitive: appends a closed four-node rectangular path to the layer. Our own command; the reference only has the tool."
ref = "Edit View › Primitives"
status = "inferred"

[[command]]
id = "path.addEllipse"
label = "Add Ellipse"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, x: number, y: number, width: number, height: number, fromCenter?: bool}"
area = "drawing"
milestone = "M3"
summary = "Headless equivalent of the ellipse primitive: appends a closed elliptical path with nodes at its four extremes to the layer. Our own command; the reference only has the tool."
ref = "Edit View › Primitives"
status = "inferred"

[[command]]
id = "path.addPath"
label = "Add Path"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, closed: bool, nodes: [{x, y, type: line|curve|offcurve, smooth?: bool}]}"
area = "drawing"
milestone = "M3"
summary = "Headless equivalent of drawing with the Draw tool: appends a path given as an ordered point list in path direction. Our own command."
ref = "Edit View › Draw Tool"
status = "inferred"

[[behavior]]
id = "tools.sharedButtonCycling"
area = "ui-chrome"
milestone = "M3"
summary = "Tools that share one toolbar button (Select/Lasso, the two Primitives modes, Erase/Knife) have one shortcut letter; pressing Shift plus that letter switches to the other tool of the group, and click-and-hold on the button opens a menu listing the group's tools."
ref = "Edit View › Cutting Paths"
status = "handbook"

[[behavior]]
id = "points.terminology"
area = "drawing"
milestone = "M3"
summary = "Vocabulary used throughout: a node is an on-curve point, a handle is an off-curve (Bézier control) point, and point covers both."
ref = "Edit View › Draw Tool"
status = "handbook"

[[behavior]]
id = "nodes.smoothAndCornerTypes"
area = "drawing"
milestone = "M3"
summary = "Every node is either smooth or corner. A smooth node keeps its two handles collinear at all times and is drawn as a green circle; a corner node lets its handles take any angle (collinear or not) and is drawn as a blue square. Node size and colours come from the settings."
ref = "Edit View › Draw Tool"
status = "handbook"

[[behavior]]
id = "handles.display"
area = "drawing"
milestone = "M3"
summary = "Handles are drawn as small circles joined to their node by a thin grey line; they set the curvature of the segment they belong to."
ref = "Edit View › Draw Tool"
status = "handbook"

[[behavior]]
id = "paths.openEndMarkers"
area = "drawing"
milestone = "M3"
summary = "An open path shows a short blue stroke, at right angles to the path, at each of its two end nodes; the first node additionally carries a (light) blue triangle pointing in path direction."
ref = "Edit View › Draw Tool"
status = "handbook"

[[behavior]]
id = "paths.pointsStoredInDirectionOrder"
area = "drawing"
milestone = "M3"
summary = "A path stores its points in path-direction order starting at the start node, and several path operations depend on that order."
ref = "Edit View › Draw Tool"
status = "handbook"

[[command]]
id = "view.showNodesInForeground"
label = "In Foreground"
menu = ["View", "Show Nodes"]
shortcut = "Cmd+Shift+N"
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M3"
summary = "Toggles whether nodes and handles of the foreground layer are drawn in Edit View."
ref = "Edit View › Draw Tool"
status = "handbook"

# ───────────────────────────── Selecting ─────────────────────────────

[[tool]]
id = "select"
label = "Select"
shortcut = "V"
group = "select"
gestures = [
  "drag on empty canvas: rectangular marquee selecting the nodes and handles inside it",
  "Alt+drag marquee: select on-curve nodes only, skipping handles",
  "Ctrl while dragging a marquee: turn the marquee to a new angle; releasing Ctrl goes back to resizing at that angle (slanted selection)",
  "click a node, handle or segment: select it",
  "Shift+click or Shift+marquee: add to or remove from the selection",
  "double-click near a segment: select the whole path",
  "double-click a node: toggle it between smooth and corner (Alt keeps the outline unchanged)",
  "Shift+double-click a node: toggle super-smooth",
  "Alt+click a line segment: turn it into a curve segment",
  "drag a selected node: move the selection; attached handles follow",
  "Alt while moving nodes: move only the selected points, leaving unselected attached handles behind",
  "Ctrl+Alt while moving nodes (or Alt added after the drag started): nudge, scaling the neighbouring unselected handles in proportion",
  "drag a handle: move it (all selected handles move together)",
  "Alt+drag a handle: change its length while keeping its angle",
  "Ctrl+Alt+drag a handle of a smooth node: copy its length and angle to the opposite handle",
  "drag a segment: move its two nodes and their handles",
  "Alt+drag a segment: change the handle lengths while keeping each handle's angle",
  "Alt+drag a selection: drag out a duplicate (whole paths, the selected segments of partial paths, anchors, guides)",
  "drag an open path end onto another open end: join them, closing the path",
  "drag a bounding-box knob: scale about the opposite knob (Shift proportional, Alt about the box centre)",
  "drag just outside the bounding box: rotate about the opposite knob (Alt about the selection centre)",
  "Ctrl while dragging: suspend magnetic guides and node snapping",
  "click an anchor: select it; double-click an anchor: rename it",
  "click a guide: select it; drag its knob: move it; drag the guide elsewhere: change its angle; double-click the knob: turn it by 90°",
  "right-click or Ctrl+click: open the context menu for the item under the pointer",
  "Shift+V or click-and-hold on the toolbar icon › Lasso Select: switch to the Lasso tool",
]
area = "drawing"
milestone = "M3"
summary = "Main pointer tool: selects, moves, converts, duplicates, scales and rotates nodes, handles, segments, paths, anchors, guides and components, and gives access to the canvas context menu."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[tool]]
id = "lasso"
label = "Lasso Select"
shortcut = "V"
group = "select"
gestures = [
  "drag: draw a free-form outline; the points inside it become the selection",
  "Shift+V: switch back to the Select tool",
]
area = "drawing"
milestone = "M3"
summary = "Selection tool with a hand-drawn region instead of a rectangle, meant for dense outlines where a marquee would catch too much. Shares the toolbar button and the V key with Select."
ref = "Edit View › Free-form Selections"
status = "handbook"

[[behavior]]
id = "selection.marqueeSelectsNodesAndHandles"
area = "drawing"
milestone = "M3"
summary = "A marquee picks up both nodes and handles that fall inside it; with Option held it picks up on-curve nodes only."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[behavior]]
id = "selection.slantedMarquee"
area = "drawing"
milestone = "M3"
summary = "While a marquee is being dragged, holding Ctrl rotates the marquee instead of resizing it; after Ctrl is released the drag resizes the marquee at the new angle. Intended for italic outlines."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[behavior]]
id = "selection.shiftExtendsOrReduces"
area = "drawing"
milestone = "M3"
summary = "With Shift held, clicking or marquee-selecting toggles the hit items in the existing selection rather than replacing it. Handles are selectable on their own, so Shift-clicking handles builds a non-contiguous selection."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[behavior]]
id = "selection.doubleClickSelectsPath"
area = "drawing"
milestone = "M3"
summary = "Double-clicking close to a segment selects every point of the path that segment belongs to."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[behavior]]
id = "selection.segmentCountsAsSelected"
area = "drawing"
milestone = "M3"
summary = "A segment is treated as selected when both of its end nodes are selected or when at least one of its handles is selected."
ref = "Edit View › Deleting Nodes"
status = "handbook"

[[command]]
id = "edit.selectAll"
label = "Select All"
menu = ["Edit"]
shortcut = "Cmd+A"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "In edit mode the first use selects all paths of the layer; if all paths are already selected (or there are none left to add) it also selects all anchors and components, so selecting everything can take two presses."
ref = "Edit View › Adding, Editing, & Removing Anchors"
status = "handbook"

[[command]]
id = "edit.deselectAll"
label = "Deselect All"
menu = ["Edit"]
shortcut = "Cmd+Alt+A"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Empties the selection."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "edit.invertSelection"
label = "Invert Selection"
menu = ["Edit"]
shortcut = "Cmd+Alt+Shift+I"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Selects every point that is currently unselected and deselects the ones that were selected."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "selection.selectNext"
label = "Select Next"
menu = []
shortcut = "Tab"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "With exactly one node or handle selected, moves the selection to the following point along the path. With an anchor selected it moves to the next anchor, and with a guide selected to the next guide."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "selection.selectPrevious"
label = "Select Previous"
menu = []
shortcut = "Shift+Tab"
kind = "ui"
params = "{}"
area = "drawing"
milestone = "M3"
summary = "Counterpart of selection.selectNext: moves the selection to the preceding point on the path, the previous anchor or the previous guide."
ref = "Edit View › Selecting Nodes and Paths"
status = "handbook"

[[command]]
id = "selection.set"
label = "Set Selection"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph?, layer?, mode?: replace|add|remove|toggle, points?: [{path: integer, index: integer}], paths?: [integer], anchors?: [names], guides?: [integer], components?: [integer]}"
area = "drawing"
milestone = "M3"
summary = "Headless equivalent of clicking and Shift-clicking: sets or amends the Edit View selection from explicit object references. Our own command."
ref = "Edit View › Selecting Nodes and Paths"
status = "inferred"

[[command]]
id = "selection.selectInRegion"
label = "Select in Region"
menu = []
shortcut = ""
kind = "ui"
params = "{rect?: [x, y, width, height], angle?: number, polygon?: [[x, y]], nodesOnly?: bool, mode?: replace|add|toggle}"
area = "drawing"
milestone = "M3"
summary = "Headless equivalent of the marquee (optionally slanted) and of the lasso: selects the points inside a rectangle or polygon given in font units, with the same nodes-only and extend options as the pointer gestures. Our own command."
ref = "Edit View › Free-form Selections"
status = "inferred"

# ───────────────────────────── Moving ─────────────────────────────

[[command]]
id = "selection.move"
label = "Move"
menu = []
shortcut = ""
kind = "engine"
params = "{dx: number, dy: number, mode?: normal|pointsOnly|nudge, keepHandleAngles?: bool}"
area = "drawing"
milestone = "M3"
summary = "Moves the selected nodes, handles, anchors or guides by an offset in font units. It is what the arrow keys run: one unit per press, 10 with Shift, 100 with Cmd; the mode mirrors the Option (points only) and Ctrl+Option (nudge) modifiers."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.arrowKeyIncrements"
area = "drawing"
milestone = "M3"
summary = "Each arrow key press moves the selection by 1 unit, by 10 units with Shift and by 100 units with Cmd. The same steps apply to selected handles, anchors and guides."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.nodesCarryHandles"
area = "drawing"
milestone = "M3"
summary = "Moving a node moves the handles attached to it by the same offset even when those handles are not selected. Holding Option moves only the points that are actually selected."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.nudge"
area = "drawing"
milestone = "M3"
summary = "Nudging (Ctrl+Option while moving nodes, or Option pressed after a drag has begun) moves the selected nodes and at the same time rescales the surrounding unselected handles in proportion, so the neighbouring curves keep their character instead of being sheared."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.handles"
area = "drawing"
milestone = "M3"
summary = "A handle moves by dragging or with the arrow keys (Shift 10, Cmd 100); several selected handles move together. With Option held the handle keeps its angle and only its length changes."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.mirrorHandleAcrossSmoothNode"
area = "drawing"
milestone = "M3"
summary = "While a handle of a smooth node is being moved with Ctrl and Option held, the opposite handle of that node is given the same length and the matching (opposite) angle, making the node symmetric."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

[[behavior]]
id = "move.dragSegment"
area = "drawing"
milestone = "M3"
summary = "Dragging a segment moves its two end nodes together with their handles. Option-dragging a curve segment instead lengthens or shortens its handles along their existing angles, leaving the nodes in place."
ref = "Edit View › Moving Selected Nodes and Paths"
status = "handbook"

# ───────────────────────────── Converting nodes and segments ─────────────────────────────

[[command]]
id = "path.toggleNodeType"
label = "Toggle Node Type"
menu = []
shortcut = "Return"
kind = "engine"
params = "{nodes?: [{path, index}], to?: smooth|corner, keepOutline?: bool}"
area = "drawing"
milestone = "M3"
summary = "Switches each selected node between smooth and corner (also run by double-clicking a node). Turning a corner smooth adds handles on both sides where missing and may bend the outline to line the handles up; with keepOutline (Alt+Return or Alt+double-click) the shape is left exactly as it is."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[command]]
id = "path.toggleNodeTypeKeepingOutline"
label = "Toggle Node Type Keeping Outline"
menu = []
shortcut = "Alt+Return"
kind = "engine"
params = "{nodes?: [{path, index}]}"
area = "drawing"
milestone = "M3"
summary = "Variant of path.toggleNodeType that changes only the node's type flag and never moves a point, so the drawn outline stays the same."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[command]]
id = "path.toggleSuperSmooth"
label = "Toggle Super Smooth"
menu = []
shortcut = "Alt+Shift+Return"
kind = "engine"
params = "{nodes?: [{path, index}], on?: bool}"
area = "drawing"
milestone = "M3"
summary = "Turns the selected nodes into super-smooth nodes, or back into ordinary ones (also run by Shift+double-click on a node)."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"

[[command]]
id = "path.convertSegmentToCurve"
label = "Convert Segment to Curve"
menu = []
shortcut = ""
kind = "engine"
params = "{segments?: [{path, index}]}"
area = "drawing"
milestone = "M3"
summary = "Turns a straight segment into a curve segment by adding one handle at each of its two nodes. The reference triggers it by Option-clicking the line segment."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[behavior]]
id = "segments.deleteHandleMakesLine"
area = "drawing"
milestone = "M3"
summary = "Selecting one or both handles of a curve segment and deleting them turns that segment back into a straight line."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[command]]
id = "path.tidyUpPaths"
label = "Tidy up Paths"
menu = ["Path"]
shortcut = "Cmd+Shift+T"
kind = "engine"
params = "{glyphs?: [names], layer?, nodes?: [{path, index}]}"
area = "path-ops"
milestone = "M3"
summary = "Heuristically sets each node to smooth or corner and removes redundant points: handles lying on a straight segment, on-curve nodes sitting exactly on the line between their neighbours, and adjacent nodes with identical coordinates (which get merged). Works on the selected nodes, or on all nodes when nothing is selected."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[command]]
id = "path.tidyUpPathsForAllMasters"
label = "Tidy up Paths for all Masters"
menu = ["Path"]
shortcut = "Cmd+Alt+Shift+T"
kind = "engine"
params = "{glyphs?: [names]}"
area = "path-ops"
milestone = "M3"
summary = "Runs Tidy up Paths on every master layer of the selected glyphs. Shown in the Path menu while Option is held."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[behavior]]
id = "tidyUp.mayBreakCompatibility"
area = "path-ops"
milestone = "M3"
summary = "Points that look redundant in one master can be required for point-compatibility with other masters, so tidying a single layer can make a glyph stop interpolating."
ref = "Edit View › Converting Nodes and Segments"
status = "handbook"

[[behavior]]
id = "nodes.superSmoothBetweenCurves"
area = "drawing"
milestone = "M3"
summary = "A super-smooth node between two curve segments is drawn with a star icon and gives curvature (G2) continuity: both segments share tangent and curvature radius at the join. To achieve this the effective node position is shifted; the path as drawn is shown in grey behind the smoothed result and a small grey dot marks where the effective node is."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"

[[behavior]]
id = "nodes.superSmoothBetweenLineAndCurve"
area = "drawing"
milestone = "M3"
summary = "A super-smooth node between a straight and a curved segment is drawn with a half-square/half-circle (raindrop) icon and blends the line into the curve without a curvature jump (squircle-like corners). It needs a long enough straight segment; small grey dots on the line show the length it consumes and grey dots near the curve show the points that will be generated at export."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"

[[behavior]]
id = "nodes.superSmoothResolvedAtExport"
area = "compile"
milestone = "M3"
summary = "Super-smooth nodes are a source-level construct: the exported outline contains ordinary points computed from them (the grey preview dots), not the nodes as drawn."
ref = "Edit View › Super-smooth Nodes"
status = "handbook"

[[behavior]]
id = "nodes.metricLineHighlight"
area = "guides-metrics"
milestone = "M3"
summary = "A beige diamond is drawn behind any node that sits precisely on one of the vertical metric lines, and a node inside an alignment zone with a beige circle, so their placement can be judged even when zoomed far out."
ref = "Edit View › Nodes in Alignment Zones"
status = "handbook"

[[behavior]]
id = "nodes.duplicateHighlight"
area = "drawing"
milestone = "M3"
summary = "Two neighbouring on-curve nodes with identical coordinates are flagged with a red circle; Tidy up Paths merges them."
ref = "Edit View › Duplicate Nodes"
status = "handbook"

# ───────────────────────────── Scaling and rotating ─────────────────────────────

[[tool]]
id = "rotate"
label = "Rotate"
shortcut = "R"
group = ""
gestures = [
  "click: set the transformation origin at the clicked position",
  "drag: rotate the current selection about the origin",
  "Shift while dragging: rotate in steps of 90°",
]
area = "drawing"
milestone = "M3"
summary = "Rotates the current selection freehand about an origin the user places with a click."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[tool]]
id = "scale"
label = "Scale"
shortcut = "S"
group = ""
gestures = [
  "click: set the transformation origin at the clicked position",
  "drag: scale the current selection about the origin",
  "Shift while dragging: scale proportionally (same factor on both axes)",
]
area = "drawing"
milestone = "M3"
summary = "Scales the current selection freehand about an origin the user places with a click."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[command]]
id = "view.showBoundingBox"
label = "Show Bounding Box"
menu = ["View"]
shortcut = "Cmd+Alt+Shift+B"
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M3"
summary = "Toggles the selection bounding box with its scale knobs in Edit View."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "boundingBox.scaleKnobs"
area = "drawing"
milestone = "M3"
summary = "When more than one node is selected a bounding box with eight knobs (four sides, four corners) is drawn. Dragging a knob scales the selected points with the opposite knob as fixed point; Shift keeps proportions and Option uses the box centre as fixed point."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "boundingBox.rotateOutside"
area = "drawing"
milestone = "M3"
summary = "Dragging from just outside the bounding box rotates the selection about the knob opposite the grab position; with Option it rotates about the centre of the selection."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "infoBox.selectionGeometryFields"
area = "drawing"
milestone = "M3"
summary = "With several nodes selected the Info box shows X, Y, width and height of the selection; editing X/Y moves it and editing width/height scales it about the reference point chosen in the nine-point origin control beside the fields. A closed lock scales width and height together, an open lock independently."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "infoBox.pointCounts"
area = "drawing"
milestone = "M3"
summary = "With several points selected the Info box shows two counts: how many points are selected (beside a filled square) and how many points the active layer holds altogether (beside an outlined square)."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

[[behavior]]
id = "numberFields.arrowKeyStepping"
area = "ui-chrome"
milestone = "M3"
summary = "In every numeric text field of the app the Up and Down arrow keys raise or lower the value by 1, and by 10 with Shift."
ref = "Edit View › Scaling & Rotating"
status = "handbook"

# ───────────────────────────── Aligning ─────────────────────────────

[[command]]
id = "path.alignSelection"
label = "Align Selection"
menu = ["Path"]
shortcut = "Cmd+Shift+A"
kind = "engine"
params = "{axis?: auto|horizontal|vertical, origin?: string}"
area = "path-ops"
milestone = "M3"
summary = "Lines up all selected nodes, handles and anchors on one coordinate. It picks the axis on its own, collapsing whichever of the selection's width or height is smaller, and the coordinate they land on follows the transformation origin set in the Palette's transformations section. Special cases apply for anchors, components and single nodes (see the align.* behaviours)."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.viaZeroDimension"
area = "path-ops"
milestone = "M3"
summary = "Typing 0 into the width or height field of the Info box while two or more points are selected aligns them on that axis, as an alternative to Align Selection."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.anchorToPoints"
area = "components"
milestone = "M6"
summary = "When the selection is a single anchor plus a single path point, Align Selection moves the anchor horizontally so it sits above or below the point; with one anchor and two points it centres the anchor between the two. The point(s) do not move, and the horizontal position is corrected for the master's italic angle."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.componentOriginToNode"
area = "components"
milestone = "M6"
summary = "Align Selection with exactly one node and one component selected moves the component so that its origin point lands on the node; the node stays put."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.componentOriginPoint"
area = "components"
milestone = "M6"
summary = "A component's origin point is the position of an anchor named origin in the referenced glyph when there is one. Otherwise, for upright masters it is where the baseline meets the left sidebearing; for slanted masters it is where the baseline is met by a vertical line drawn through the point at which the slanted left sidebearing reaches half the x-height."
ref = "Edit View › Aligning"
status = "handbook"

[[behavior]]
id = "align.singleNodeToBackground"
area = "path-ops"
milestone = "M3"
summary = "Align Selection with only one node selected tries to move that node onto the closest node of the background layer."
ref = "Edit View › Aligning"
status = "handbook"

# ───────────────────────────── Duplicating and deleting ─────────────────────────────

[[behavior]]
id = "duplicate.optionDrag"
area = "drawing"
milestone = "M3"
summary = "Dragging a selection with Option held leaves the original in place and drags a copy to the new position. If only part of a path is selected, the selected segments are copied as a new open path (useful for repeating serifs and similar parts). Copy (Cmd+C) and paste (Cmd+V) is the alternative."
ref = "Edit View › Duplicating Paths"
status = "handbook"

[[command]]
id = "edit.delete"
label = "Delete"
menu = []
shortcut = "Delete"
kind = "engine"
params = "{glyph?, layer?, points?: [{path, index}], anchors?: [names], guides?: [integer]}"
area = "drawing"
milestone = "M3"
summary = "Removes the selection. A deleted node is taken out without opening the path, and the neighbouring handles are refitted so the remaining segment follows the old shape as closely as possible. The same key removes selected anchors and pen points."
ref = "Edit View › Deleting Nodes"
status = "handbook"

[[command]]
id = "edit.deleteInAllMasters"
label = "Delete in All Masters"
menu = []
shortcut = "Alt+Delete"
kind = "engine"
params = "{glyph?, points?: [{path, index}]}"
area = "drawing"
milestone = "M3"
summary = "Deletes the selected nodes with shape reconstruction, and removes the corresponding nodes in every master of the glyph as well."
ref = "Edit View › Deleting Nodes"
status = "handbook"

[[command]]
id = "path.deleteAndBreak"
label = "Delete and Break"
menu = []
shortcut = "Shift+Delete"
kind = "engine"
params = "{glyph?, layer?, points?: [{path, index}]}"
area = "drawing"
milestone = "M3"
summary = "Removes each selected node together with the two segments that meet at it, leaving the path open there. When whole segments are selected it removes just those segments and keeps every remaining part of the path unchanged."
ref = "Edit View › Deleting Nodes"
status = "handbook"

[[command]]
id = "path.deleteAndBreakInAllMasters"
label = "Delete and Break in All Masters"
menu = []
shortcut = "Alt+Shift+Delete"
kind = "engine"
params = "{glyph?, points?: [{path, index}]}"
area = "drawing"
milestone = "M3"
summary = "Same as path.deleteAndBreak, applied to the corresponding nodes in every master of the glyph."
ref = "Edit View › Deleting Nodes"
status = "handbook"

# ───────────────────────────── Opening, closing, cutting ─────────────────────────────

[[behavior]]
id = "paths.openAtNodeWithDrawTool"
area = "drawing"
milestone = "M3"
summary = "Clicking a node of a closed path with the Draw tool splits the path at that node into two coincident end nodes; the ends can then be pulled apart with the Select tool."
ref = "Edit View › Opening and Closing Paths"
status = "handbook"

[[behavior]]
id = "paths.closeByDraggingEnds"
area = "drawing"
milestone = "M3"
summary = "With the Select tool, dragging the end node of an open path onto a second end node fuses the pair into one node, which closes a path or joins two open paths."
ref = "Edit View › Opening and Closing Paths"
status = "handbook"

[[command]]
id = "path.connectNodes"
label = "Connect Nodes"
menu = []
shortcut = ""
kind = "engine"
params = "{nodes?: [{path, index}, {path, index}]}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command for two selected open path ends: adds a straight segment between them, joining the two paths or closing the one path."
ref = "Edit View › Opening and Closing Paths"
status = "handbook"

[[command]]
id = "path.closeOpenPaths"
label = "Close Open Paths"
menu = []
shortcut = ""
kind = "engine"
params = "{paths?: [integer]}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command that closes every selected open path completely by connecting its last node back to its first."
ref = "Edit View › Opening and Closing Paths"
status = "handbook"

[[tool]]
id = "knife"
label = "Knife"
shortcut = "E"
group = "erase"
gestures = [
  "drag a line across one path: cut it into two outlines, each closed along the cutting line",
  "drag a line across several overlapping paths: cut them all and rewire the cut segments with one another",
  "Shift+E or click-and-hold on the toolbar icon › Knife: switch between Erase and Knife",
]
area = "path-ops"
milestone = "M3"
summary = "Cuts outlines along a straight line dragged across them and closes the resulting pieces along that line. Shares the toolbar button and the E key with the Erase tool."
ref = "Edit View › Cutting Paths"
status = "handbook"

[[tool]]
id = "erase"
label = "Erase"
shortcut = "E"
group = "erase"
gestures = []
area = "path-ops"
milestone = "M3"
summary = "Tool that shares the toolbar button and the E key with Knife. The reference names it in this chapter but does not describe what it does or its gestures; behaviour must be observed."
ref = "Edit View › Cutting Paths"
status = "handbook"

[[command]]
id = "path.cutWithLine"
label = "Cut with Line"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, from: [x, y], to: [x, y]}"
area = "path-ops"
milestone = "M3"
summary = "Headless equivalent of the Knife tool: splits every path crossed by the given line and closes the pieces along it. Our own command."
ref = "Edit View › Cutting Paths"
status = "inferred"

# ───────────────────────────── Re-segmenting (open corners) ─────────────────────────────

[[command]]
id = "path.openCorner"
label = "Open Corner"
menu = []
shortcut = ""
kind = "engine"
params = "{nodes?: [{path, index}]}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command that replaces a selected corner node by two nodes whose segments cross in a small triangular overlap, so the two segments can be edited independently. Does nothing on smooth nodes; with a segment selected it opens the nodes at both ends of that segment."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"

[[command]]
id = "path.reconnectNodes"
label = "Reconnect Nodes"
menu = []
shortcut = ""
kind = "engine"
params = "{nodes?: [{path, index}]}"
area = "path-ops"
milestone = "M3"
summary = "Context-menu command with two uses: on the two nodes of an open corner it restores the single corner node; on any even number of selected nodes it pairs each node with its nearest selected neighbour and rewires the outline through those pairs, creating overlapping corners."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"

[[behavior]]
id = "openCorner.overlapSize"
area = "path-ops"
milestone = "M3"
summary = "The overlap produced when corners are opened or nodes reconnected is about half of the master's first vertical stem value and half of its first horizontal stem value (from Font Info › Masters)."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"

[[behavior]]
id = "openCorner.invisibleWhenSmall"
area = "path-ops"
milestone = "M3"
summary = "An opened corner whose triangular overlap is small compared with the visible segments next to it is treated as invisible and does not show in the final outline, which allows opened corners on the outside of a shape. Once the overlap exceeds the threshold it becomes visible. The threshold is not specified."
ref = "Edit View › Re-segmenting Outlines"
status = "handbook"

# ───────────────────────────── Path direction ─────────────────────────────

[[behavior]]
id = "paths.startNodeDisplay"
area = "drawing"
milestone = "M3"
summary = "On a closed path the start node is drawn as an arrowhead pointing in path direction (green when the node is smooth) instead of the usual node shape."
ref = "Edit View › Controlling Path Direction"
status = "handbook"

[[behavior]]
id = "paths.directionConvention"
area = "path-ops"
milestone = "M3"
summary = "Outer contours must run counter-clockwise and contours enclosed by them (counters) clockwise; two overlapping paths with opposite directions therefore produce a cut-out."
ref = "Edit View › Controlling Path Direction"
status = "handbook"

[[command]]
id = "path.makeNodeFirst"
label = "Make Node First"
menu = []
shortcut = ""
kind = "engine"
params = "{node?: {path, index}}"
area = "path-ops"
milestone = "M3"
summary = "Node context-menu command that makes the clicked on-curve node the start node of its closed path, rotating the stored point order without changing the shape."
ref = "Edit View › Controlling Path Direction"
status = "handbook"

[[command]]
id = "path.reverseContours"
label = "Reverse Contours"
menu = ["Path"]
shortcut = "Cmd+Ctrl+Alt+R"
kind = "engine"
params = "{glyphs?: [names], layer?, paths?: [integer]}"
area = "path-ops"
milestone = "M3"
summary = "Reverses the point order of the selected paths, or of every path on the layer when no path is selected. The shortcut is stated in the Font View chapter. The context menu offers the same action as Reverse Selected Contours or Reverse All Contours depending on whether a path is selected."
ref = "Edit View › Controlling Path Direction"
status = "handbook"

[[command]]
id = "path.reverseContoursForAllMasters"
label = "Reverse Contours for All Masters"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], paths?: [integer]}"
area = "path-ops"
milestone = "M3"
summary = "Option variant of Reverse Contours that reverses the corresponding paths on all masters of the glyph. The reference describes the modifier but not the alternate item's label."
ref = "Edit View › Controlling Path Direction"
status = "handbook"

[[command]]
id = "path.correctPathDirection"
label = "Correct Path Direction"
menu = ["Path"]
shortcut = "Cmd+Shift+R"
kind = "engine"
params = "{glyphs?: [names], layer?}"
area = "path-ops"
milestone = "M3"
summary = "Works out the proper direction of every path on the current layer (or on each selected glyph layer) from how the paths nest, and applies it. As side effects it reorders the layer's shapes and moves each path's start node to its bottom-left node."
ref = "Edit View › Controlling Path Direction"
status = "handbook"

[[command]]
id = "path.correctPathDirectionForAllMasters"
label = "Correct Path Direction for all Masters"
menu = ["Path"]
shortcut = "Cmd+Alt+Shift+R"
kind = "engine"
params = "{glyphs?: [names]}"
area = "path-ops"
milestone = "M3"
summary = "Runs Correct Path Direction on every master layer and on every alternate and intermediate layer of the glyphs, skipping all other non-master layers. Shown while Option is held; meant to keep path order, start nodes and directions consistent for interpolation."
ref = "Edit View › Controlling Path Direction"
status = "handbook"

# ───────────────────────────── Extremes and inflections ─────────────────────────────

[[behavior]]
id = "extremes.definitions"
area = "path-ops"
milestone = "M3"
summary = "An extremum is a spot on a path where the tangent is exactly horizontal or vertical; an inflection is a spot inside a segment where the bend switches between clockwise and counter-clockwise. Nodes at extremes are expected by hinting and some renderers, and nodes at inflections help offsetting and avoid interpolation kinks."
ref = "Edit View › Extremes & Inflections"
status = "handbook"

[[command]]
id = "path.addExtremes"
label = "Add Extremes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], layer?}"
area = "path-ops"
milestone = "M3"
summary = "Inserts nodes at the horizontal and vertical extremes of all paths on the active layer. An extreme is skipped when adding it would leave a very short segment (the existing node placement is assumed deliberate); a node sitting only slightly off an extreme is moved onto it, with the shape preserved as far as possible and its handles made exactly horizontal or vertical."
ref = "Edit View › Extremes & Inflections"
status = "handbook"

[[command]]
id = "path.forceExtremes"
label = "Force Extremes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], layer?}"
area = "path-ops"
milestone = "M3"
summary = "Option variant of Add Extremes that inserts a node at every extreme without the short-segment exception."
ref = "Edit View › Extremes & Inflections"
status = "handbook"

[[command]]
id = "path.insertNode"
label = "Insert Node"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, segment: {path, index}, t?: number, near?: [x, y], snap?: extremum|inflection}"
area = "path-ops"
milestone = "M3"
summary = "Headless equivalent of the Draw tool's Shift-click on a segment: splits a segment at a parameter, or at the extremum or inflection closest to a given position, without changing the shape. Our own command."
ref = "Edit View › Extremes & Inflections"
status = "inferred"

[[behavior]]
id = "extremes.addedAtExportByFilter"
area = "compile"
milestone = "M7"
summary = "Extremes can be left out of the source and added only in the exported font through a Filter custom parameter with the value AddExtremes, which keeps shallow curves and some multi-master outlines simpler to edit."
ref = "Edit View › Extremes & Inflections"
status = "handbook"

# ───────────────────────────── Focusing and locking ─────────────────────────────

[[command]]
id = "path.focusOnSelectedPath"
label = "Focus on Selected Path"
menu = []
shortcut = ""
kind = "ui"
