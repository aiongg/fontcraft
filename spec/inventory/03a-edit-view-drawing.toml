[[tool]]
id = "knife"
label = "Knife"
shortcut = "E"
group = "erase"
gestures = [
  "drag a line across one path: cut it into two outlines, each closed along the cutting line",
  "drag a line across several overlapping paths: cut them all and rewire the cut segments with one another",
