# ───────────────────────────── Extremes and inflections ─────────────────────────────

[[behavior]]
id = "extremes.definitions"
area = "path-ops"
milestone = "M3"
summary = "An extremum is a spot on a path where the tangent is exactly horizontal or vertical; an inflection is a spot inside a segment where the bend switches between clockwise and counter-clockwise. Nodes at extremes are expected by hinting and some renderers, and nodes at inflections help offsetting and avoid interpolation kinks."
ref = "Edit View › Extremes & Inflections"
status = "handbook"

[[command]]
id = "path.addExtremes"
label = "Add Extremes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], shapes?: [index]} | {glyphs: [names], layer?: id | layers?: [ids]} → {glyphs, skipped, selection?}"
area = "path-ops"
milestone = "M3"
summary = "Inserts nodes at the horizontal and vertical extremes of all paths on the active layer. An extreme is skipped when adding it would leave a very short segment (the existing node placement is assumed deliberate); a node sitting only slightly off an extreme is moved onto it, with the shape preserved as far as possible and its handles made exactly horizontal or vertical."
ref = "Edit View › Extremes & Inflections"
status = "handbook"
notes = "New nodes are smooth and rounded to the grid, with their handles lined up with them."
guesses = [
  "A smooth node between two cubics moves onto an extreme within 2 units or 1% of the curve's chord, and the two curves are refitted, when they stay within half a unit of the old ones (03a question 17).",
  "Any other node within 2 units and 2° of an extreme keeps its place, and its handles within 2° of the axis are made exactly horizontal or vertical (03a question 17).",
  "An extreme is skipped when the chord from it to the end of its segment, or to the extreme before it, is shorter than 3 units, or shorter than both 10 units and a tenth of the segment's chord.",
]
observe = [
  "Draw a smooth node 2 units off the top of an arch, between two curves, and run Add Extremes: does the node move, by how much, and do the neighbouring handles change length?",
]

[[command]]
id = "path.forceExtremes"
label = "Force Extremes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], shapes?: [index]} | {glyphs: [names], layer?: id | layers?: [ids]} → {glyphs, skipped, selection?}"
area = "path-ops"
milestone = "M3"
summary = "Option variant of Add Extremes that inserts a node at every extreme without the short-segment exception."
ref = "Edit View › Extremes & Inflections"
status = "handbook"
notes = "The near-extreme handle rule of Add Extremes still applies."
guesses = [
  "Force Extremes adds every extreme that rounds to a new point, however short the segment it leaves.",
]

[[command]]
id = "path.addInflections"
label = "Add Inflections"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, points?: [[shape, node]], shapes?: [index]} or {glyphs: [names], layer?: id | layers?: [ids]} → {glyphs, skipped, selection?}"
area = "path-ops"
milestone = "M3"
summary = "Inserts a node at every inflection of the targeted cubic segments, splitting each segment there without changing the outline. It is the repair the audit runs for check.outlines.inflections; the Draw tool's Shift+click adds one inflection at a time."
ref = "Edit View › Extremes & Inflections; docs/spec/21-qa.md § 5"
status = "inferred"
notes = "Built in M3.18 as the audit fix `addInflections`, with the targets and result of path.addExtremes. New nodes are smooth and rounded to the grid."
guesses = [
  "An inflection within 1 unit of a segment end gets no node, the distance under which check.outlines.inflections ignores one.",
]

[[command]]
id = "path.insertNode"
label = "Insert Node"
menu = []
context = ["canvas.segment"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?, segment: [shape, node], t?: number, near?: [x, y], snap?: extremum|inflection, matchLayers?: bool} → {node: [shape, node], selection}"
area = "path-ops"
