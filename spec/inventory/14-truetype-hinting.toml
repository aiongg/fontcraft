[[behavior]]
id = "hinting.tt.snap.zoneAuto"
area = "hinting-tt"
milestone = "M10"
summary = "Snap with zone Auto, in vertical mode: if the point lies inside a TT zone it goes to the pixel edge that zone rounds to (so zone alignment, deltas and the rounding threshold all apply); otherwise it goes to the nearest pixel edge. Auto is the recommended setting."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"
guesses = ["In horizontal mode Auto ignores zones and rounds to the nearest pixel edge, since zones are vertical; the reference app would settle it.", "Round up and Round down on a Snap inside a zone take the zone's row like Round, since the handbook ties zone snapping to the zone choice only; the reference app would settle it."]
observe = ["T3: in horizontal mode, Snap a node that lies vertically inside a zone, with the zone choice left at Auto; note whether the zone changes the instruction or its effect."]
notes = "M10.18, crates/hinting/src/tt_glyph.rs: a vertical Snap whose point lies in the span of a TT zone that applies to the glyph (widened by TTFBlueFuzz) calls the zone-snap function, so the point takes the zone's fitted row; otherwise it is rounded by its mode. Documented, not yet observed."

[[behavior]]
id = "hinting.tt.snap.zoneNone"
area = "hinting-tt"
milestone = "M10"
summary = "Snap with No Zone ignores all zones and only looks for the nearest pixel edge according to the rounding mode, even when the point lies inside a zone."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"
notes = "M10.18, crates/hinting/src/tt_glyph.rs: the zones are skipped and the point is rounded by its mode (FN_POINT_ROUND). Documented, not yet observed."

[[behavior]]
id = "hinting.tt.snap.zoneNamed"
area = "hinting-tt"
milestone = "M10"
summary = "Snap with a named zone does not snap the point onto that zone. It keeps the point at a constant rounded distance from the zone and guarantees that it can never cross over the zone, in the same way one zone can be aligned to another in TTFZones."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"
notes = "M10.18, crates/hinting/src/tt_glyph.rs: a point outside the named zone keeps its rounded original distance to the zone's fitted row (FN_ZONE_DISTANCE, as zone alignment does); a point inside it takes the zone's row. A zone index the master lacks falls back to Auto with a warning. Documented, not yet observed."
guesses = ["A point that lies inside its named zone is snapped to the zone's row instead of being kept at a rounded distance; the reference app would settle it by snapping an overshoot point with that zone named."]

[[behavior]]
id = "hinting.tt.snap.noRoundingUse"
area = "hinting-tt"
milestone = "M10"
summary = "A Snap instruction set to No rounding leaves its point at its original position but still marks it as touched. This is the way to pin a point so that the final interpolation of untouched points does not move it and uses it as a reference."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

