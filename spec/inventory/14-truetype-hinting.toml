notes = "M10.28, crates/ui/src/dialogs/tt/zones.rs: opens from the value field of a master's TTFZones parameter in Font Info › Masters, on the master the tab shows. Each control runs its hint.tt.* command at once. The delta and globe buttons show on the main master only, drawn pressed when the zone has a delta or a filter; the Delta table's columns are the masters, plus any stored column that names no master. The globe opens the Smart Filter rule editor, and OK stores its rules as a glyph predicate. Documented, not yet observed. M10.41, crates/ui/src/dialogs/tt/wire_tests.rs: the filter sheet's Cancel posts nothing and leaves the font pointer-equal. X.fix120: the Font tab's TTFZones parameter opens it on the family zones, without delta and filter buttons; under the title it says whether they apply (as many as the main master has zones, and a TTFFamilyZonesThreshold)."
guesses = ["The editor of the font's TTFZones has no delta and filter buttons and compares its length with the main master's list; the reference app's sheet would settle both.", 
