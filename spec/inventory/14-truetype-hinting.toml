status = "handbook"

[[command]]
id = "hint.tt.deleteInstructions"
label = "Delete Instructions"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, instructions?: [index]}"
area = "hinting-tt"
milestone = "M10"
summary = "Removes only the selected instructions. The handbook does not describe deleting single TT instructions (the Delete key is the likely gesture, as for PostScript hints); verify before binding a key."
ref = "TrueType Hinting › Instructions"
status = "inferred"
guesses = ["The Delete key removes the selected instructions, as for PostScript hints; the reference app would settle it."]
observe = ["T3: with the TrueType Instructor, select an instruction badge and press Delete; note whether the instruction is removed."]

[[command]]
id = "hint.tt.listInstructions"
label = "List TrueType Instructions"
menu = []
