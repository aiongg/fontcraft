notes = "M10.25, crates/ui/src/canvas/hinting/badges.rs: badges and lines of the other direction are drawn in a translucent gray behind the current ones and take no clicks; hint.tt.selectInstructions refuses them. Documented, not yet observed."

[[behavior]]
id = "hinting.tt.hintOrder"
area = "hinting-tt"
milestone = "M10"
summary = "Instructions run in the order in which they were added, and the order matters because later instructions build on points moved by earlier ones. The layer therefore stores instructions as an ordered list. The handbook describes no way to reorder them other than removing and re-adding."
ref = "TrueType Hinting › Hint Order"
status = "handbook"
guesses = ["Instructions cannot be reordered: the list order is creation order, and deleting and re-adding is the way to move one to the end; the reference app would show whether a reorder exists."]
observe = ["T3: on a glyph with several instructions, look for any way (drag, menu item or key) to move an instruction earlier in the list; note whether instructions can be reordered."]

[[behavior]]
id = "hinting.tt.touchedPoints"
area = "hinting-tt"
milestone = "M10"
summary = "A point that an instruction has moved is a touched point (in that direction). Several instruction types have requirements on this state: Snap needs untouched points, Shift a touched origin and untouched targets, Interpolate two touched references and an untouched target. Commands must evaluate the state by replaying the instruction list in order."
ref = "TrueType Hinting › Hint Order; Instructions"
status = "handbook"
notes = "M10.6, crates/hinting/src/replay.rs: TouchedState::replay gives the touched points per direction after the first n instructions; TouchedState::check says whether an instruction's needs are met, unmet_needs lists the instructions of a list whose needs are not. Snap, Shift and Interpolate touch their target, Stem its origin and target. Documented, not yet observed."
guesses = ["A Delta instruction leaves its point untouched in the model, since it moves the point only at the sizes it lists; the reference app would settle whether a point with only a Delta can still take a Snap."]
observe = ["T3: add a Delta instruction to an untouched node, then select that node alone and press A; note whether a Snap instruction is added."]

[[behavior]]
id = "hinting.tt.iup"
area = "hinting-tt"
milestone = "M10"
summary = "After the last instruction of a direction, every point still untouched is repositioned by interpolating between the nearest touched points before and after it in point-index order along its contour (the IUP step). Snap with No rounding, and Interpolate, exist partly to stop this step from moving a point undesirably."
ref = "TrueType Hinting › Hint Order"
status = "handbook"
notes = "M10.18, crates/hinting/src/tt_glyph.rs: each glyph program ends with IUP for every direction that has instructions. Documented, not yet observed."

