ref = "TrueType Hinting › Snap (A); Stem (S); Shift (F); Interpolate (G)"
status = "handbook"

[[behavior]]
id = "hinting.tt.rounding.modes"
area = "hinting-tt"
milestone = "M10"
summary = "The five rounding modes: Round (nearest pixel edge), Round up (edge above in vertical mode, to the right in horizontal mode), Round down (edge below, or to the left), No rounding, and Round only in GDI ClearType (behaves like Round in the ClearType intent and like No rounding in Grayscale and DirectWrite). The last mode only matters in vertical hinting because GDI ClearType does not oversample vertically."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

# ---------------------------------------------------------------------------------------------
# Instructions: Snap
# ---------------------------------------------------------------------------------------------

[[command]]
id = "hint.tt.snapPoint"
label = "Snap Point"
menu = []
shortcut = "A"
when = "tool:trueTypeInstructor"
kind = "engine"
params = "{glyph?: name, layer?: id, nodes?: [nodeRef], direction?: 'vertical'|'horizontal', zone?: 'auto'|'none'|zoneName, rounding?: 'round'|'up'|'down'|'none'|'gdiOnly'}"
area = "hinting-tt"
milestone = "M10"
summary = "Adds one Snap instruction per selected point; each must be untouched so far. A Snap instruction rounds its point to a pixel edge in the current direction and makes it a touched point. Defaults: zone Auto, rounding Round."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

[[command]]
id = "hint.tt.setSnapZone"
label = "Set Snap Zone"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, instructions?: [index], zone: 'auto'|'none'|zoneName}"
area = "hinting-tt"
milestone = "M10"
summary = "Sets the zone option of the selected Snap instructions; in the UI this is the pop-up at the top of the Info box."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

[[behavior]]
id = "hinting.tt.snap.zoneAuto"
area = "hinting-tt"
milestone = "M10"
summary = "Snap with zone Auto, in vertical mode: if the point lies inside a TT zone it goes to the pixel edge that zone rounds to (so zone alignment, deltas and the rounding threshold all apply); otherwise it goes to the nearest pixel edge. Auto is the recommended setting."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"
guesses = ["In horizontal mode Auto ignores zones and rounds to the nearest pixel edge, since zones are vertical; the reference app would settle it."]
observe = ["T3: in horizontal mode, Snap a node that lies vertically inside a zone, with the zone choice left at Auto; note whether the zone changes the instruction or its effect."]

[[behavior]]
id = "hinting.tt.snap.zoneNone"
area = "hinting-tt"
milestone = "M10"
summary = "Snap with No Zone ignores all zones and only looks for the nearest pixel edge according to the rounding mode, even when the point lies inside a zone."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

[[behavior]]
id = "hinting.tt.snap.zoneNamed"
area = "hinting-tt"
milestone = "M10"
summary = "Snap with a named zone does not snap the point onto that zone. It keeps the point at a constant rounded distance from the zone and guarantees that it can never cross over the zone, in the same way one zone can be aligned to another in TTFZones."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

[[behavior]]
id = "hinting.tt.snap.noRoundingUse"
area = "hinting-tt"
milestone = "M10"
summary = "A Snap instruction set to No rounding leaves its point at its original position but still marks it as touched. This is the way to pin a point so that the final interpolation of untouched points does not move it and uses it as a reference."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

# ---------------------------------------------------------------------------------------------
# Instructions: Stem
# ---------------------------------------------------------------------------------------------

[[command]]
id = "hint.tt.addStemHint"
label = "Stem"
menu = []
shortcut = "S"
when = "tool:trueTypeInstructor"
kind = "engine"
params = "{glyph?: name, layer?: id, pairs?: [[originNodeRef, targetNodeRef]], direction?: 'vertical'|'horizontal', stem?: 'auto'|'none'|stemName, rounding?: 'round'|'up'|'down'|'none'|'gdiOnly'}"
area = "hinting-tt"
milestone = "M10"
summary = "Adds a Stem instruction that links two points, the origin and the target (arrowhead end). The target is moved to follow the origin's movement at a distance governed by a TT stem. A pair is valid when neither point is touched or when exactly one of them is. With an even number of points selected, one instruction is added per pair. Default rounding: none (the handbook states no default for the stem choice). The context-menu label is not given in the handbook."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"
guesses = ["The context-menu label of the Stem instruction is Stem, as the key list names it; the reference app would settle it."]
observe = ["T3: with the TrueType Instructor, select two nodes and right-click; note the exact label of the item that adds a stem instruction."]

[[command]]
id = "hint.tt.reverse"
label = "Reverse"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, instructions?: [index]}"
area = "hinting-tt"
milestone = "M10"
summary = "Context-menu item on a Stem instruction that swaps its originating and target points."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[command]]
id = "hint.tt.setStemReference"
label = "Set Stem Reference"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, instructions?: [index], stem: 'auto'|'none'|stemName}"
area = "hinting-tt"
milestone = "M10"
summary = "Sets the stem option of the selected Stem instructions; in the UI this is the pop-up at the top of the Info box."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[command]]
id = "hint.tt.makeTripleHint"
label = "Make Triple Hint"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, instructions?: [index, index, index]}"
area = "hinting-tt"
milestone = "M10"
summary = "Context-menu item available when three Stem instructions on three horizontal stems are selected (Shift+click each badge). It links them into a group that keeps at least one pixel of distance between the stems at every size; the linked instructions are drawn purple. How to dissolve a triple hint is not stated."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"
guesses = ["Deleting or reversing one member of a triple hint dissolves the group and the other two become plain Stem instructions; the reference app would settle it."]
observe = ["T3: make a triple hint, delete one of its members and note whether the group dissolves; make it again, reverse one member and note whether the group dissolves."]

[[behavior]]
id = "hinting.tt.stem.originInZoneSnaps"
area = "hinting-tt"
milestone = "M10"
summary = "When the originating point of a Stem instruction lies inside a zone, the instruction itself snaps that point to the zone's pixel edge, so no separate Snap instruction is needed on it."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[behavior]]
id = "hinting.tt.stem.optionAuto"
area = "hinting-tt"
milestone = "M10"
summary = "Stem option Auto: the instruction uses the TT stem of matching orientation whose size is closest to the measured distance between the two points. It is the recommended mode as long as the stem values are clearly distinct from each other."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[behavior]]
id = "hinting.tt.stem.optionNoStem"
area = "hinting-tt"
milestone = "M10"
summary = "Stem option No Stem: the target is not fitted to the grid; it only keeps its original distance to the origin, so it moves exactly when the origin moves. Suited to mid-range sizes and to shapes where grid distortion would be too strong."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[behavior]]
id = "hinting.tt.stem.optionNamed"
area = "hinting-tt"
milestone = "M10"
summary = "Stem option naming a specific TT stem forces that stem's width instead of the automatic choice; meant only for cases where Auto picks the wrong stem."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[behavior]]
id = "hinting.tt.stem.rounding"
area = "hinting-tt"
milestone = "M10"
summary = "Rounding of a Stem instruction applies to the stem's size. Round puts the target on the nearest pixel edge; Round up on the edge farther from the origin (below it when the instruction points downward); Round down on the edge nearer the origin. No rounding (default) uses the TT stem width, which is already rounded to the oversampling grid of the rendering intent, so one stem edge may show a gray border but shapes distort less and counters collapse less often. Round only in GDI ClearType rounds in that intent alone."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[behavior]]
id = "hinting.tt.stem.gdiOnlyForMiddleBars"
area = "hinting-tt"
milestone = "M10"
summary = "For a stem that touches no zone, such as the middle bar of E or e, the GDI-only rounding mode keeps at least one edge on a pixel boundary under ClearType; the reference recommends pairing it with an Interpolate instruction that positions the bar between the outer stems."
ref = "TrueType Hinting › Stem (S)"
status = "handbook"

[[behavior]]
id = "hinting.tt.stem.minimumDistance"
area = "hinting-tt"
milestone = "M10"
summary = "A stem with a Stem instruction never renders thinner than the minimum distance, a quarter pixel unless TTMinimumDistance says otherwise, at any pixel size."
ref = "TrueType Hinting › Advanced TrueType Hinting › TTMinimumDistance"
status = "handbook"

# ---------------------------------------------------------------------------------------------
# Instructions: Shift
# ---------------------------------------------------------------------------------------------

[[command]]
id = "hint.tt.shiftPoints"
label = "Shift Points"
menu = []
shortcut = "F"
when = "tool:trueTypeInstructor"
kind = "engine"
params = "{glyph?: name, layer?: id, origin?: nodeRef, targets?: [nodeRef], direction?: 'vertical'|'horizontal', rounding?: 'round'|'up'|'down'|'none'|'gdiOnly'}"
area = "hinting-tt"
milestone = "M10"
summary = "Adds a Shift instruction: an untouched target point is displaced by the same amount as its touched origin point, and the target counts as touched afterwards. The selection must contain exactly one touched point; every other selected point must be untouched and gets its own Shift instruction from that origin. Default rounding: No rounding (the recommended mode)."
ref = "TrueType Hinting › Shift (F)"
status = "handbook"

[[behavior]]
id = "hinting.tt.shift.rounding"
area = "hinting-tt"
milestone = "M10"
summary = "Shift rounding modes act on the target after the movement has been copied: Round to the nearest pixel edge, Round up to the edge above, Round down to the edge below, No rounding keeps the copied movement exactly, GDI-only rounds in the ClearType intent alone."
ref = "TrueType Hinting › Shift (F)"
status = "handbook"

[[behavior]]
id = "hinting.tt.shift.useCase"
area = "hinting-tt"
milestone = "M10"
summary = "Typical use, taking a sans-serif n: its left leg is snapped to the baseline zone, but a Stem instruction on the shoulder interrupts the contour, so the final interpolation moves the right leg from the stem instruction only. A Shift whose origin is the snapped left-leg point and whose target is a right-leg point makes both legs move alike; an m needs one Shift per additional leg."
ref = "TrueType Hinting › Shift (F)"
status = "handbook"

# ---------------------------------------------------------------------------------------------
# Instructions: Interpolate
# ---------------------------------------------------------------------------------------------

[[command]]
id = "hint.tt.interpolate"
label = "Interpolate"
menu = []
shortcut = "G"
when = "tool:trueTypeInstructor"
kind = "engine"
params = "{glyph?: name, layer?: id, references?: [nodeRef, nodeRef], target?: nodeRef, direction?: 'vertical'|'horizontal', rounding?: 'round'|'up'|'down'|'none'|'gdiOnly'}"
area = "hinting-tt"
milestone = "M10"
summary = "Adds an Interpolate instruction: with two touched points and one untouched point selected, the untouched point is placed so that its position relative to the two touched points stays as it was in the unhinted outline, and it becomes touched. Default rounding: No rounding (the recommended mode)."
ref = "TrueType Hinting › Interpolate (G)"
status = "handbook"

[[behavior]]
id = "hinting.tt.interpolate.rounding"
area = "hinting-tt"
milestone = "M10"
summary = "Interpolate rounding modes act on the interpolated position: Round to the nearest pixel edge (the mode to use when a Stem instruction is then started from the target), Round up to the next edge above, Round down to the next edge below, No rounding, and GDI-only which rounds in the ClearType intent alone."
ref = "TrueType Hinting › Interpolate (G)"
status = "handbook"

[[behavior]]
id = "hinting.tt.interpolate.useCase"
area = "hinting-tt"
milestone = "M10"
summary = "Typical use: keeping a middle stroke, such as the bar of a lowercase e, at the same relative height between the already touched top and bottom strokes, where the default interpolation of untouched points would give an uneven result."
ref = "TrueType Hinting › Interpolate (G)"
status = "handbook"

# ---------------------------------------------------------------------------------------------
# Instructions: Delta
# ---------------------------------------------------------------------------------------------

[[command]]
id = "hint.tt.addDelta"
label = "Delta"
menu = []
shortcut = "E"
when = "tool:trueTypeInstructor"
kind = "engine"
params = "{glyph?: name, layer?: id, nodes?: [nodeRef], cells?: {instanceOrMasterId: {ppm: 'up'|'down'|'none'}}}"
area = "hinting-tt"
milestone = "M10"
summary = "Adds a Delta instruction to each selected point (any number, touched or not). A Delta nudges its point a single pixel, upwards or downwards, at one pixel size in one static instance, as a last correction after all other instructions. Only available in vertical hinting direction."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"

[[command]]
id = "hint.tt.setDeltas"
label = "Set Delta Cells"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, instructions?: [index], cells: {instanceOrMasterId: {ppm: 'up'|'down'|'none'}}}"
area = "hinting-tt"
milestone = "M10"
summary = "Sets at which sizes, and in which column, the selected Delta instructions move their point up or down; in the UI this is the Delta icon in the Info box, which opens the same table as zone deltas. The zone table's columns are masters while the Delta text speaks of static instances; which of the two the columns are here must be checked."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"

[[behavior]]
id = "hinting.tt.delta.restrictions"
area = "hinting-tt"
milestone = "M10"
summary = "Delta instructions exist only for vertical hinting, are left out of variable-font exports entirely, and should be added last and sparingly. Pressing E in horizontal direction should do nothing (or report why)."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"

# ---------------------------------------------------------------------------------------------
# Export behaviour and variable fonts
# ---------------------------------------------------------------------------------------------

[[behavior]]
id = "hinting.tt.export.overlapRemovalMovesHints"
area = "hinting-tt"
milestone = "M10"
summary = "When a static font is exported with Remove Overlaps, points inside overlaps disappear and intersections become single points. An instruction on a point that is removed is reattached to whichever intersection point created by the removal lies closest, so hinting a regular node next to an intersection and hinting the intersection's extra node give the same result."
ref = "TrueType Hinting › Points in Overlapping Intersections"
status = "handbook"
observe = ["T4: instruct X on a node at the crossing and on a normal node, export a static TTF with Remove Overlaps and read X's glyph program; note which point the crossing node's instruction ends up on."]

[[behavior]]
id = "hinting.tt.variable.extraNodeHintsIgnored"
area = "hinting-tt"
milestone = "M10"
summary = "Variable fonts keep their overlaps, so intersection (extra) nodes do not exist in the output; an instruction placed on an extra node is dropped from a variable export. Glyphs meant for variable export must be instructed on regular nodes only; the UI should flag instructions on extra nodes."
ref = "TrueType Hinting › Points in Overlapping Intersections"
status = "handbook"
observe = ["T4: instruct X on a node at the crossing and on a normal node, export a variable TTF and read X's glyph program; note whether the instruction on the crossing node is dropped."]

[[behavior]]
id = "hinting.tt.variable.deltasIgnored"
area = "hinting-tt"
milestone = "M10"
summary = "Delta instructions are not written into variable fonts. The handbook says this for glyph-level Delta instructions; whether zone and stem deltas are also dropped in variable exports is not stated."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"
guesses = ["Zone and stem deltas reach a variable font only for the default master's column; per-instance Delta instructions are dropped as the handbook says; a variable export from the reference app would settle the zone and stem part."]
observe = ["T3: give a TT zone a delta and export a variable TTF; note whether the delta survives anywhere in prep or the glyph programs."]

[[behavior]]
id = "hinting.tt.variable.cvar"
area = "hinting-tt"
milestone = "M10"
summary = "In a variable TrueType export the glyph programs come once from the main master, and the control values derived from zones and stems (cvt) are those of the default master, with each other master's differences written to the cvar table so that zone positions and stem widths follow the design space. The handbook does not describe this; it follows from per-master zones and stems being the mechanism that replicates hints across masters."
ref = "TrueType Hinting › Font-level Hints; OpenType spec › cvar"
status = "inferred"
guesses = ["Per-master zones and stems reach a variable font as cvt values of the default master plus cvar deltas; a variable export from the reference app would settle it."]
observe = ["T3: give a TT zone a delta and export a variable TTF; note whether a cvar table is written and which cvt entries it varies."]

[[behavior]]
id = "hinting.tt.export.generatedPrograms"
area = "hinting-tt"
milestone = "M10"
summary = "For manually instructed fonts the exporter generates the supporting tables itself: cvt entries from the instance's TT zones (position and size, widened by TTFBlueFuzz) and stems; fpgm functions for zone rounding, stem width selection per rendering mode and triple hints; a prep program applying zone alignment, zone and stem deltas, the rounding threshold and overshoot suppression per pixel size; and per-glyph programs from the ordered instruction lists ending with IUP. The table split is our reading; the handbook only describes the resulting behaviour."
ref = "TrueType Hinting › Font-level Hints; Instructions; Advanced TrueType Hinting"
status = "inferred"
guesses = ["The fpgm, prep and cvt layout is FontCraft's own, written from the TrueType instruction set specification; byte parity with the reference app is not a goal and nothing from its output is copied."]

[[behavior]]
id = "hinting.tt.export.instanceValues"
area = "hinting-tt"
milestone = "M10"
summary = "For a static instance, TT zone positions and sizes, stem sizes and master-level TTFBlueFuzz are interpolated from the masters like other master values; instance-level parameters (TTFBlueFuzz, TTZoneRoundingThreshold, TTMinimumDistance, gasp Table) then override font-level ones. Zones and stems are matched across masters; the handbook does not say whether by name or by list position."
ref = "TrueType Hinting › TrueType BlueFuzz; Font-level Hints"
status = "handbook"
guesses = ["Composite glyphs get no glyph program of their own: their components' programs apply; Alternate and Intermediate layers that replace the main master's layer carry their own instructions, as the PostScript chapter says for hints; a reference export would settle both."]
observe = [
  "T3: instruct A, export as TTF and read Aacute in glyf; note whether the composite has instructions of its own.",
  "T3: add an Alternate layer for master 1 of n with instructions of its own, export as TTF and read n's glyph program; note which layer's instructions were used.",
]

[[behavior]]
id = "hinting.tt.export.compileError"
area = "hinting-tt"
milestone = "M10"
summary = "When a glyph's instructions cannot be compiled the reference reports 'There was a problem compiling TrueType instructions' (stated for the Autohint action). The engine should return a per-glyph error naming the offending instruction rather than a bare message."
ref = "TrueType Hinting › Instructions"
status = "handbook"
