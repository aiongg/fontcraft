[[behavior]]
id = "hinting.tt.instructions.addFromSelection"
area = "hinting-tt"
milestone = "M10"
summary = "An instruction is added by selecting the nodes it should act on and choosing its type from the context menu or pressing its letter key. Instructions may sit on any node the tool shows, including off-curve points and extra nodes. A placed instruction can be dragged to reposition it."
ref = "TrueType Hinting › Instructions; Points in Overlapping Intersections"
status = "handbook"
guesses = ["Dragging an instruction badge moves only the badge's drawn position, which is view state and not saved; dropping it on another node does not re-target it; the reference app would settle what the drag changes."]
observe = ["T3: drag an instruction badge, save, reopen, and note what the drag changed and whether it was saved; then drag a badge onto another node and note whether the instruction moves to that node."]

[[behavior]]
id = "hinting.tt.instructions.badgeColours"
area = "hinting-tt"
milestone = "M10"
summary = "Each instruction is drawn with a clickable badge whose colour identifies its type: Snap purple, Stem sky blue, Shift dark blue, Interpolate green; Stem instructions joined into a triple hint turn purple. The colour of Delta badges is not stated."
ref = "TrueType Hinting › Instructions"
status = "handbook"
guesses = ["Delta badges are orange, a colour no other instruction uses; the reference app would settle it."]
observe = ["T3: add a Delta instruction; note its badge colour and the icons of the rounding modes, next to the badges of the other instruction types."]

