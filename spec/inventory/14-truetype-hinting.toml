summary = "While the TrueType Instructor is active, the Preview Area moves from the bottom to the right edge of Edit View and shows the tab's glyphs in the current instance as a waterfall of hinted renderings. The same waterfall can be shown in the separate Preview Panel (Window › Preview Panel)."
ref = "TrueType Hinting › Hinting Preview"
status = "handbook"

[[command]]
id = "hint.tt.setPreviewScale"
label = "Preview Scale"
menu = []
shortcut = ""
kind = "ui"
params = "{scale: 1|2|4}"
area = "hinting-tt"
milestone = "M10"
summary = "Edit View context-menu choice of the magnification at which the Hinting Preview draws its pixels: no scaling (1x), 2x or 4x."
ref = "TrueType Hinting › Hinting Preview"
status = "handbook"

[[command]]
id = "hint.tt.showPreviewAddress"
label = "Show Preview Address…"
