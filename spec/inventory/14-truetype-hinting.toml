area = "hinting-tt"
milestone = "M10"
summary = "The five rounding modes: Round (nearest pixel edge), Round up (edge above in vertical mode, to the right in horizontal mode), Round down (edge below, or to the left), No rounding, and Round only in GDI ClearType (behaves like Round in the ClearType intent and like No rounding in Grayscale and DirectWrite). The last mode only matters in vertical hinting because GDI ClearType does not oversample vertically."
ref = "TrueType Hinting › Snap (A)"
status = "handbook"

# ---------------------------------------------------------------------------------------------
# Instructions: Snap
# ---------------------------------------------------------------------------------------------
notes = "M10.18, crates/hinting/src/tt_glyph.rs and the fpgm function FN_POINT_ROUND: Snap, Shift and Interpolate round to the nearest pixel (halves away from zero), CEILING for up, FLOOR for down, and under GDI ClearType only through the flag prep stores; Stem uses FN_STEM's modes. Up and down follow the axis (up, right) whatever the sign of the coordinate. Documented, not yet observed."

[[command]]
