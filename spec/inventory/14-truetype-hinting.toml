[[behavior]]
id = "hinting.tt.variable.extraNodeHintsIgnored"
area = "hinting-tt"
milestone = "M10"
summary = "Variable fonts keep their overlaps, so intersection (extra) nodes do not exist in the output; an instruction placed on an extra node is dropped from a variable export. Glyphs meant for variable export must be instructed on regular nodes only; the UI should flag instructions on extra nodes."
ref = "TrueType Hinting › Points in Overlapping Intersections"
status = "handbook"
notes = "M10.35, crates/compile/src/tt_hints.rs: a variable export compiles each glyph's instructions without those that name an extra node, and warns once per glyph with how many were left out. Flagging such instructions in the Instructor is not done yet. Documented, not yet observed."
guesses = ["A variable export drops the instructions on extra nodes with one warning per glyph, the other instructions of the glyph kept; a variable export from the reference app would show whether it warns and whether instructions that depend on the dropped ones change."]
observe = ["T4: instruct X on a node at the crossing and on a normal node, export a variable TTF and read X's glyph program; note whether the instruction on the crossing node is dropped."]

[[behavior]]
id = "hinting.tt.variable.deltasIgnored"
area = "hinting-tt"
milestone = "M10"
summary = "Delta instructions are not written into variable fonts. The handbook says this for glyph-level Delta instructions; whether zone and stem deltas are also dropped in variable exports is not stated."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"
notes = "M10.19 (crates/compile/src/tt_hints.rs): a variable export compiles each glyph's instructions without its Delta instructions and warns once that they were left out; `prep` applies the zone and stem deltas of the default master's column. Glyph-level deltas documented, not yet observed."
guesses = ["Zone and stem deltas reach a variable font only for the default master's column; per-instance Delta instructions are dropped as the handbook says; a variable export from the reference app would settle the zone and stem part."]
observe = ["T3: give a TT zone a delta and export a variable TTF; note whether the delta survives anywhere in prep or the glyph programs."]

[[behavior]]
id = "hinting.tt.variable.cvar"
area = "hinting-tt"
milestone = "M10"
summary = "In a variable TrueType export the glyph programs come once from the main master, and the control values derived from zones and stems (cvt) are those of the default master, with each other master's differences written to the cvar table so that zone positions and stem widths follow the design space. The handbook does not describe this; it follows from per-master zones and stems being the mechanism that replicates hints across masters."
ref = "TrueType Hinting › Font-level Hints; OpenType spec › cvar"
status = "inferred"
notes = "M10.19: a variable TrueType export with instructions uses the default master's cvt, fpgm and prep and the main master's instructions without Delta instructions. Its glyphs with instructions keep every on-curve point their nodes give, in all sources, so the instructions find them. M10.19b (crates/compile/src/var/cvar.rs): each other master's zone positions and stem widths, laid out on the main master's zone and stem lists, go into cvar as deltas from the default master's; prep then fits the varied positions at each size. Identical values write no cvar; values that do not line up write none, with a warning. A master with Dehint on adds no region and the others still vary the values, as fontTools treats a master without cvt as sparse. A master at a location another master already has adds no region, with a warning when its values differ (fontTools refuses the duplicate location)."
guesses = ["Per-master zones and stems reach a variable font as cvt values of the default master plus cvar deltas; a variable export from the reference app would settle it."]
observe = ["T3: give a TT zone a delta and export a variable TTF; note whether a cvar table is written and which cvt entries it varies."]

[[behavior]]
id = "hinting.tt.export.generatedPrograms"
area = "hinting-tt"
milestone = "M10"
summary = "For manually instructed fonts the exporter generates the supporting tables itself: cvt entries from the instance's TT zones (position and size, widened by TTFBlueFuzz) and stems; fpgm functions for zone rounding, stem width selection per rendering mode and triple hints; a prep program applying zone alignment, zone and stem deltas, the rounding threshold and overshoot suppression per pixel size; and per-glyph programs from the ordered instruction lists ending with IUP. The table split is our reading; the handbook only describes the resulting behaviour."
ref = "TrueType Hinting › Font-level Hints; Instructions; Advanced TrueType Hinting"
status = "inferred"
notes = "M10.17, crates/hinting/src/tt_font.rs: cvt holds per zone its position and fitted row, per stem its width and fitted width, then the family zone positions; fpgm holds seven functions (zone rounding, zone alignment, rounding, cvt delta, zone snap, stem, point delta); prep sets the rendering mode, overshoot and minimum-distance storage, then rounds, aligns and nudges zones and stems for the size. maxp limits come from the static analysis; skrifa runs every program at 8 to 72 PPM in the three intents within them. Stem rounding: Round takes the fitted width, Round up and Round down the ceiling and floor of the stem's own width. Triple hints and diagonal preservation wait for M10.18."
guesses = [
  "The fpgm, prep and cvt layout is FontCraft's own, written from the TrueType instruction set specification; byte parity with the reference app is not a goal and nothing from its output is copied.",
  "A font with TrueType programs sets head flags bits 2 (instructions depend on point size) and 3 (integer PPM); a reference export of an instructed font would show its head flags.",
]

[[behavior]]
id = "hinting.tt.export.instanceValues"
area = "hinting-tt"
milestone = "M10"
summary = "For a static instance, TT zone positions and sizes, stem sizes and master-level TTFBlueFuzz are interpolated from the masters like other master values; instance-level parameters (TTFBlueFuzz, TTZoneRoundingThreshold, TTMinimumDistance, gasp Table) then override font-level ones. Zones and stems are matched across masters; the handbook does not say whether by name or by list position."
ref = "TrueType Hinting › TrueType BlueFuzz; Font-level Hints"
status = "handbook"
notes = "M10.19: a static instance between the masters is exported from its interpolated font; each glyph there takes the hints of its main-master layer when that layer has hints and the same paths, and TTFZones and TTFStems positions, sizes and widths are interpolated by name in the main master's order (crates/compile/src/tt_hints.rs). The Delta column is the instance's location key; the zone and stem delta column is the instance's name. Documented, not yet observed."
guesses = ["Composite glyphs get no glyph program of their own: their components' programs apply; Alternate and Intermediate layers that replace the main master's layer carry their own instructions, as the PostScript chapter says for hints; a reference export would settle both."]
observe = [
  "T3: instruct A, export as TTF and read Aacute in glyf; note whether the composite has instructions of its own.",
  "T3: add an Alternate layer for master 1 of n with instructions of its own, export as TTF and read n's glyph program; note which layer's instructions were used.",
]

[[behavior]]
id = "hinting.tt.export.compileError"
area = "hinting-tt"
milestone = "M10"
summary = "When a glyph's instructions cannot be compiled the reference reports 'There was a problem compiling TrueType instructions' (stated for the Autohint action). The engine should return a per-glyph error naming the offending instruction rather than a bare message."
ref = "TrueType Hinting › Instructions"
status = "handbook"
notes = "M10.19: a glyph whose instructions cannot be compiled (a point its outline lacks, a program past the glyf limit) is exported without them; the export warning names the glyph and the reason. An instruction whose point cannot be resolved is left out of its program with a warning naming the glyph and the instruction. Font programs that cannot be built leave the whole font unhinted, with a warning."
guesses = ["A glyph whose instructions fail to compile is exported unhinted and the export goes on, with a warning naming the glyph; a reference export of a glyph with a broken instruction would show whether it stops instead."]
