[[command]]
id = "hint.tt.addDelta"
label = "Delta"
menu = []
shortcut = "E"
when = "tool:trueTypeInstructor"
context = ["canvas.node", "canvas.path"]
kind = "engine"
params = "{glyph: name, layer?: id, nodes: [point], direction?: 'vertical', cells?: {column: {ppm: 'up'|'down'|'none'}}}"
area = "hinting-tt"
milestone = "M10"
summary = "Adds a Delta instruction to each selected point (any number, touched or not). A Delta nudges its point a single pixel, upwards or downwards, at one pixel size in one static instance, as a last correction after all other instructions. Only available in vertical hinting direction."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"
observe = ["T3: select a Delta instruction, open its Delta table from the Info box and note whether the columns are masters or instances."]
guesses = ["Delta columns accept masters as well as static instances, both stored as the location key; the reference app's Delta table for an instruction would show which columns it offers."]
notes = "M10.7, crates/engine/src/cmd/hint_tt_more.rs: one Delta per point, touched or not, at the end of the list. A column is an instance or master by name or id, stored as the key of its location (fontcraft_hinting::tt::delta_column_key), or a key in braces, read as axis values and stored in the same form (so {100} and {100, 0, 0, 0, 0, 0} are one column); a PPM key is a size from 1 to 255 or a range such as 12-14. A horizontal direction and a layer outside the main master are refused. Documented, not yet observed. M10.34, crates/ui/src/app/context_menu: while the Instructor is active, the node and path sections of the canvas context menu start with it, on the selected points and the Instructor's direction; it is greyed out with the reason the command would refuse with (point_ready)."

[[command]]
id = "hint.tt.setDeltas"
label = "Set Delta Cells"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, instructions: [index], cells: {column: {ppm: 'up'|'down'|'none'}}}"
area = "hinting-tt"
milestone = "M10"
summary = "Sets at which sizes, and in which column, the selected Delta instructions move their point up or down; in the UI this is the Delta icon in the Info box, which opens the same table as zone deltas. The zone table's columns are masters while the Delta text speaks of static instances; which of the two the columns are here must be checked."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"
guesses = ["Set Delta Cells changes only the cells it names and keeps the rest, as clicking single cells of the table does; the reference app's table would settle it."]
notes = "M10.7, crates/engine/src/cmd/hint_tt_more.rs: sets the named cells of Delta instructions, keeping the others; none clears a cell and an emptied column is dropped. Columns and PPMs as for hint.tt.addDelta; other instruction types and layers outside the main master are refused. Documented, not yet observed."

[[behavior]]
id = "hinting.tt.delta.restrictions"
area = "hinting-tt"
milestone = "M10"
summary = "Delta instructions exist only for vertical hinting, are left out of variable-font exports entirely, and should be added last and sparingly. Pressing E in horizontal direction should do nothing (or report why)."
ref = "TrueType Hinting › Delta (E)"
status = "handbook"
notes = "M10.7: hint.tt.addDelta refuses the horizontal direction with a message, and both Delta commands refuse a layer outside the main master (hinting.tt.mainMasterOnly). Variable exports leave Delta instructions out (M10.19, hinting.tt.variable.deltasIgnored). Documented, not yet observed. M10.18, crates/hinting/src/tt_glyph.rs: a Delta compiles to one FN_POINT_DELTA call per cell of the build's delta column, at its place in the list and so before IUP (a rasterizer in backward-compatibility mode drops moves made after IUP); a horizontal Delta, or a cell outside 1 to 255 PPM, is left out with a warning."

# ---------------------------------------------------------------------------------------------
# Export behaviour and variable fonts
# ---------------------------------------------------------------------------------------------
guesses = ["Deltas run at their place in the list, before the final interpolation, so on an untouched point a Delta moves it from its unhinted position at that size; the reference app would settle it by adding a Delta to an untouched point and comparing that size with its neighbours."]

[[behavior]]
id = "hinting.tt.export.overlapRemovalMovesHints"
area = "hinting-tt"
milestone = "M10"
summary = "When a static font is exported with Remove Overlaps, points inside overlaps disappear and intersections become single points. An instruction on a point that is removed is reattached to whichever intersection point created by the removal lies closest, so hinting a regular node next to an intersection and hinting the intersection's extra node give the same result."
ref = "TrueType Hinting › Points in Overlapping Intersections"
status = "handbook"
notes = "The editor half (M10.3, crates/hinting/src/remap.rs): Path > Remove Overlap keeps instructions on nodes that survive, found by place, and moves an instruction on a removed node, or on an intersection extra node, to the nearest on-curve node the removal created; with no such node it is removed and reported under hintUpkeep in the command result. Other outline edits remove an instruction whose node is gone and report it. The export half (M10.19, crates/compile/src/points.rs): a node that overlap removal takes away maps to the nearest on-curve point the removal created, and an instruction on an intersection extra node to the created point nearest to where its two segments' chords cross, the rule the editor uses. M10.35: the Instructor selects extra nodes as intersection points, so a static export of an instruction placed on one in the tool lands on the crossing's point (crates/compile/src/tt_hints_tests.rs). Documented for export, not yet observed in the editor."
guesses = [
  "Path > Remove Overlap in the editor applies the documented export rule to instructions on removed nodes and on intersections, and PostScript ends on removed nodes become numbers; running Remove Overlap on an instructed glyph in the reference app would settle it.",
