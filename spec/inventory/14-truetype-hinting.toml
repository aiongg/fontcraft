guesses = ["One command edits any property of a TT stem, as the sheet's row does, and refuses deltas and filters outside the main master; the reference app's sheet would settle whether other masters show those buttons at all.", "Turning a stem's orientation turns the Stem instructions it no longer suits to Auto; the reference app would settle it by switching a stem that a Stem instruction names."]

# ---------------------------------------------------------------------------------------------
# Font-level hints: other settings
# ---------------------------------------------------------------------------------------------

[[behavior]]
id = "hinting.tt.param.ttfBlueFuzz"
area = "hinting-tt"
milestone = "M10"
summary = "TTFBlueFuzz widens every TT zone by the given number of units both above and below; the default is 1. It may be set on the font (applies to all instances), on masters (the values are interpolated at export), or on an export instance (overrides font and master values). Its main use is catching extremes that drop out of a zone through rounding in interpolated instances."
ref = "TrueType Hinting › TrueType BlueFuzz"
status = "handbook"
notes = "Read from the instance, else the master, else the font, default 1 (crates/hinting/src/settings.rs). Documented, not yet observed. M10.17: the fuzz widens each zone's span in the cvt layout (CvtLayout::spans), which decides whether a point is in a zone; the cvt values themselves are the zone positions."

[[behavior]]
id = "hinting.tt.param.overshootSuppressionBelowPpm"
area = "hinting-tt"
milestone = "M10"
summary = "TTFOvershootSuppressionBelowPPM is a font-level custom parameter (Font Info › Font) setting a pixel size; at smaller sizes, overshoots inside a zone are collapsed onto the zone's flat edge (its position). At that size and above, overshoots are allowed to show. No default is stated."
ref = "TrueType Hinting › Advanced TrueType Hinting"
status = "handbook"
notes = "M10.17: a Snap in a zone moves the point to the zone's row; from the given PPM up it adds the point's own distance from the zone position, rounded, so the overshoot shows (tested in skrifa: a 0.64 px overshoot at 40 PPM collapses below 60, a 0.96 px one shows at 60). Without the parameter overshoots inside a zone always collapse. Documented, not yet observed. An autohinted build without the parameter shows overshoots as ttfautohint does (autohint.tt.run); with it, as written here."
guesses = ["Absent TTFOvershootSuppressionBelowPPM: no size-based suppression beyond what the zones do on their own; a reference export without the parameter would settle it."]
observe = ["T3, without a TTFOvershootSuppressionBelowPPM parameter: look at o in the Hinting Preview from 30 to 60 PPM; note the first size at which the overshoot shows."]

[[behavior]]
id = "hinting.tt.param.zoneRoundingThreshold"
area = "hinting-tt"
milestone = "M10"
summary = "TTZoneRoundingThreshold (font or export instance; the font value applies to instances without their own) is a small decimal, default 0.09375, added to the pixel position of every positive zone before rounding and added twice for the zone named xHeight, making those zones more likely to round up. Example: at 0.15, a zone at 8.4 px becomes 9 px (8.4 + 0.15 = 8.55) and an xHeight zone at 6.25 px becomes 7 px (6.25 + 2 × 0.15 = 6.55)."
ref = "TrueType Hinting › Advanced TrueType Hinting"
status = "handbook"
notes = "M10.17, crates/hinting/src/tt_font.rs: prep rounds each zone that is not aligned to round(position + threshold), the threshold in whole 1/64 px, twice for the zone named xHeight. The handbook's example passes in skrifa's interpreter: at 0.2, 6.45 px gives 7 and 5.25 px gives 6; without a threshold they give 6 and 5. The documented default 0.09375 already lifts 6.45 px to 7 (6.54), so the example's 'without any change' means no threshold. Documented, not yet observed."
guesses = ["A 'positive zone' is read as a zone with a positive size (a top zone), so bottom zones get no threshold; rounding a negative-position top zone in the reference app would settle it.", "The threshold is clamped to plus or minus one pixel; a reference export with a larger value would settle it."]
observe = ["T3: in a font without TTZoneRoundingThreshold, set a small-caps TT zone whose top lands at 6.45 px at one size (e.g. 645 units at 10 PPM in a 1000-unit font), export, render that size and note whether the zone's edge lands on pixel row 6 or 7 (the documented default 0.09375 gives 6.54, which rounds to 7)."]

[[behavior]]
id = "hinting.tt.param.minimumDistance"
area = "hinting-tt"
milestone = "M10"
summary = "TTMinimumDistance is an export-instance custom parameter (Font Info › Exports) giving, in pixels, the smallest length a stem with a Stem instruction may be drawn at any PPM. The default is 0.25, a quarter pixel."
ref = "TrueType Hinting › Advanced TrueType Hinting"
status = "handbook"
notes = "M10.17: the Stem function of fpgm takes the larger of the rounded length and this distance after every rounding mode, No Stem included, and prep stores it in 1/64 px (tested in skrifa: a 0.3 px stem rounded down is drawn at 0.25 px, at 0.5 px with the parameter at 0.5). Documented, not yet observed."
guesses = ["The minimum distance also applies to Round up and Round down and to stems without a stem definition, and is clamped to 0 to 8 px; a reference export with a stem rounded to zero would settle it."]

[[behavior]]
id = "hinting.tt.param.controlValueProgram"
area = "hinting-tt"
milestone = "M10"
summary = "Opening a hinted TrueType font adds three custom parameters to the masters: CVT Table, prep Table Assembly and fpgm Table Assembly, holding the font's control values and the assembly source of its control-value and font programs. They exist so that the original hinting survives a re-export and are rarely edited by hand; at export they are written to the cvt, prep and fpgm tables."
ref = "TrueType Hinting › Advanced TrueType Hinting › Control Value Program"
status = "handbook"
notes = "Documented, not yet observed. M10.19: at export the cvt Table values and the assembled prep and fpgm Table Assembly programs are written as they are, and maxp takes what the analysis finds in them and in the imported glyph programs (a stack of 1024 when it cannot follow them). M10.22: opening a hinted TrueType font sets the three parameters on every master; when one of the tables cannot be read or is past a limit (4,096 cvt values, 1 MB of assembly), none is kept and neither are the glyph programs. Re-exporting an unchanged opened font gives byte-equal cvt, fpgm, prep and glyph programs. gasp becomes the font's gasp Table parameter."
guesses = [
  "The cvt Table parameter an opened font gets holds the values as text separated by commas, as the handbook gives its type as text; a .glyphs file saved by the reference app after opening a hinted TrueType font would show its form.",
  "No corpus source holds the prep or fpgm Table Assembly parameter, so FontCraft writes and reads them in its own assembly syntax (one instruction per line, mnemonics with bracketed flags as fontTools prints them, push values on the push's line; fontTools' layout with the values on the following lines and /* */ comments is read too); a file saved by the reference app after opening a hinted TrueType font would show its syntax, and the reader would then accept both.",
  "When a master carries any of the three parameters, manual instructions are not compiled, since they call functions of FontCraft's own fpgm, and a warning says to remove the parameters (the handbook says to remove them before instructing afresh); a reference export of a font with both would show what it does.",
]
observe = [
  "Open a hinted TTF that FontCraft exported from T3 and save it as .glyphs; note how the CVT Table, prep Table Assembly and fpgm Table Assembly values are stored in the file (keys, value types, layout).",
]

[[behavior]]
id = "hinting.tt.import.glyphPrograms"
area = "hinting-tt"
milestone = "M10"
summary = "The handbook describes how cvt, prep and fpgm of an opened font are preserved but does not say how the per-glyph instruction programs are kept. For the preserved tables to be of any use, each imported glyph's instructions must be stored on its layer (as assembly text) and written back unchanged when the glyph's outline is untouched and no editor instructions replace them."
ref = "TrueType Hinting › Advanced TrueType Hinting › Control Value Program"
status = "inferred"
notes = "M10.22: each simple or composite glyph program goes to the layer's user data as assembly text (com.fontcraft.ttGlyphProgram) with a fingerprint of the outline (com.fontcraft.ttGlyphProgramOutline: paths and nodes in order, on-curve flags, coordinates rounded to whole units, components and their transforms). Export writes a program back when the master carries the imported cvt, prep or fpgm parameters and the fingerprint still matches; a simple glyph is then written from its layer's nodes as they are (no overlap removal, no direction change), so the program's point numbers hold. A glyph not read exactly (a component placed by point matching, a contour the model could not draw) keeps no program. Variable fonts get none."
guesses = [
  "Imported glyph programs are kept per layer as assembly text with a fingerprint of the outline; they are written back while the outline is unchanged and the layer has no editor instructions, editor instructions win, and a changed outline drops the program with a warning; opening a hinted TTF in the reference app would settle how it stores them.",
  "A composite glyph's fingerprint covers its own components and transforms, not the outlines of the glyphs they point to, so editing a base glyph keeps the composite's program; editing the base of a hinted composite in the reference app and exporting would show whether it keeps that program.",
  "Glyph programs are kept only when the font has a cvt, fpgm or prep table, since export writes them only beside those tables; a reference export of a font opened with glyph programs and none of the tables would show otherwise.",
]
observe = [
  "Open a hinted TTF that FontCraft exported from T3 and look at a glyph with the TrueType Instructor; note how the imported program is shown. Add an instruction, export, and note whether the glyph program holds both the imported and the new instructions.",
]

[[command]]
id = "hint.tt.removeImportedHinting"
label = "Remove Imported TrueType Hinting"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphPrograms?: bool, controlValueProgram?: bool, gasp?: bool}"
area = "hinting-tt"
milestone = "M10"
summary = "Deletes the hinting brought in from an opened binary font: the CVT Table, prep Table Assembly and fpgm Table Assembly parameters on every master and the imported per-glyph programs. The reference has no single command for this (the parameters are removed by hand); added so that dehinting is one scriptable step."
ref = "TrueType Hinting › Advanced TrueType Hinting › Control Value Program"
status = "inferred"
own = true
notes = "M10.22: glyphPrograms and controlValueProgram default to true, gasp to false; each parameter is removed wherever it is set (font, masters, instances), since export reads it at each scope. One undo step; nothing to remove makes no step."
guesses = ["The gasp Table parameter stays unless gasp is true, since an unhinted font may still want its rendering ranges; whether the owner wants it removed by default would settle it."]

# ---------------------------------------------------------------------------------------------
# gasp
# ---------------------------------------------------------------------------------------------

[[behavior]]
id = "hinting.tt.param.gaspTable"
area = "hinting-tt"
milestone = "M10"
summary = "gasp Table is a custom parameter on the font or on an export instance (the font value applies to instances without their own) holding a pair of PPM thresholds, each a size where the rendering behaviour that the font recommends switches; the defaults are 8 and 20. The table carries recommendations for both grayscale and ClearType renderers, which a renderer is free to ignore."
ref = "TrueType Hinting › Advanced TrueType Hinting › gasp Table"
status = "handbook"
notes = "Read as the corpus stores it, a dictionary from maximum PPM to flags (instance, then master, then font); a size above 65535 is left out, as fontc does, and at most 256 ranges are read. Documented, not yet observed. The parameter's value holds the records themselves (largest PPM of each range to its flag bits), not two thresholds: fontc's test sources and glyphsLib read it that way, and M10.20 writes those records (crates/compile/src/gasp.rs); the instance's value replaces the font's."

[[behavior]]
id = "hinting.tt.gasp.ranges"
area = "hinting-tt"
milestone = "M10"
summary = "The two thresholds give three ranges. Up to the first: 'No Hinting & Symmetric', no grid-fitting, antialiased rendering. Between them: 'Hinting & Asymmetric', grid-fitting without grayscale smoothing; in ClearType, vertical grid-fitting with horizontal subpixel rendering. Above the second: 'Hinting & Symmetric', grid-fitting plus grayscale smoothing, and symmetric smoothing in ClearType (antialiasing in Y in addition to horizontal subpixels)."
ref = "TrueType Hinting › Advanced TrueType Hinting › gasp Table"
status = "handbook"
notes = "Documented, not yet observed. The default ranges a hinted font without a source gets (M10.20) follow these three descriptions; the flag bits chosen for them are in hinting.tt.gasp.flagMapping."

[[behavior]]
id = "hinting.tt.gasp.flagMapping"
area = "hinting-tt"
milestone = "M10"
summary = "Proposed gasp records for the three ranges, to verify against a reference export: up to threshold 1, DOGRAY + SYMMETRIC_SMOOTHING; up to threshold 2, GRIDFIT + SYMMETRIC_GRIDFIT; up to 65535, GRIDFIT + DOGRAY + SYMMETRIC_GRIDFIT + SYMMETRIC_SMOOTHING, in a version 1 table. The handbook describes the ranges in words only; whether the middle and upper behaviours are user-selectable per range is not stated."
ref = "TrueType Hinting › Advanced TrueType Hinting › gasp Table; OpenType spec › gasp"
status = "inferred"
notes = "M10 planning pass: the gasp Table parameter stores the records themselves, maximum PPM to flag bits (fontc's test source WghtVarGasp.glyphs holds 8 → 10, 20 → 7, 65535 → 15), and fontc writes them into a version 1 table; the mapping above is only the default for a hinted font without the parameter, which M10.20 writes (crates/compile/src/gasp.rs). The handbook calls the middle range grid-fitting without grayscale, which rules out WghtVarGasp's 7 (it sets the grayscale bit) as the default."
guesses = ["Without a gasp Table parameter a font with TrueType instructions gets three records: up to 8 PPM DOGRAY + SYMMETRIC_SMOOTHING, up to 20 GRIDFIT + SYMMETRIC_GRIDFIT, up to 65535 all four bits; an unhinted font gets no gasp table, as fontc and fontmake write none; an export from the reference app without the parameter would settle both."]

