[[behavior]]
id = "hinting.tt.interpolate.rounding"
area = "hinting-tt"
milestone = "M10"
summary = "Interpolate rounding modes act on the interpolated position: Round to the nearest pixel edge (the mode to use when a Stem instruction is then started from the target), Round up to the next edge above, Round down to the next edge below, No rounding, and GDI-only which rounds in the ClearType intent alone."
