notes = "M10.6, crates/engine/src/cmd/hint_tt.rs: one Stem per pair at the end of the list; an odd count or a pair of two touched points is refused and adds nothing. A named stem must suit the direction (horizontal stems for vertical instructions). Documented, not yet observed. M10.34, crates/ui/src/app/context_menu: while the Instructor is active, the node and path sections of the canvas context menu start with it, on the selected points and the Instructor's direction; it is greyed out with the reason the command would refuse with (point_ready)."

