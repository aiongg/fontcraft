[[behavior]]
id = "hinting.tt.instructions.addFromSelection"
area = "hinting-tt"
milestone = "M10"
summary = "An instruction is added by selecting the nodes it should act on and choosing its type from the context menu or pressing its letter key. Instructions may sit on any node the tool shows, including off-curve points and extra nodes. A placed instruction can be dragged to reposition it."
ref = "TrueType Hinting › Instructions; Points in Overlapping Intersections"
status = "handbook"
notes = "X.ui3: dragging a badge of the current direction and dropping it on a node or handle of the edited layer runs hint.tt.moveInstruction on the instruction's target (crates/ui/src/canvas/hinting/badges.rs); a drop elsewhere changes nothing. Documented, not yet observed. M10.34, crates/ui/src/app/context_menu: with the Instructor active, a right-click on a node, or on empty canvas with points selected, offers Snap Point, Stem, Shift Points, Interpolate and Delta first in the node or path section, each greyed out with the reason its command would refuse the selection with (an untouched point wanted, two touched and one untouched point for Interpolate, the vertical direction and the main master for Delta)."
guesses = ["Dragging an instruction badge onto another node moves the instruction's target point there, and the drag is not saved as a badge position; the reference app would settle what the drag changes.", "The node menu shows the instructions the selection does not allow greyed out with the reason, rather than leaving them out; the reference app would settle it.", "The instruction items come first in the node menu, in the order of the key list (Snap, Stem, Shift, Interpolate, Delta), before the path items; the reference app would settle the order."]
observe = ["T3: drag an instruction badge, save, reopen, and note what the drag changed and whether it was saved; then drag a badge onto another node and note whether the instruction moves to that node.", "T3: with the TrueType Instructor, right-click a selected node, a selected whole path and an instruction badge; note which items each menu holds and in what order, and whether items the selection does not allow are greyed out or missing."]

[[behavior]]
id = "hinting.tt.instructions.badgeColours"
area = "hinting-tt"
milestone = "M10"
summary = "Each instruction is drawn with a clickable badge whose colour identifies its type: Snap purple, Stem sky blue, Shift dark blue, Interpolate green; Stem instructions joined into a triple hint turn purple. The colour of Delta badges is not stated."
ref = "TrueType Hinting › Instructions"
status = "handbook"
notes = "M10.25, crates/ui/src/canvas/hinting/badges.rs and crates/ui/src/canvas/hinting/tokens.rs: Snap and the Stems of a triple hint purple, Stem sky blue, Shift dark blue, Interpolate green, Delta orange. Snap, Delta and Interpolate badges sit beside their point with a leader line (Interpolate also has thin lines to its references); Stem and Shift badges sit halfway along an arrow from origin to target; badges on one spot stack. A selected badge has a ring in the selection colour. Documented, not yet observed."
guesses = ["Delta badges are orange, a colour no other instruction uses; the reference app would settle it.", "Badges are plain discs placed beside the point (left of it for vertical instructions, below it for horizontal ones) or on the arrow of Stem and Shift; the reference app would show their shape, placement and icons."]
observe = ["T3: add a Delta instruction; note its badge colour and the icons of the rounding modes, next to the badges of the other instruction types."]

