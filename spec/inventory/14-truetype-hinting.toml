# Inventory: TrueType hinting
# Sources:
#   - Glyphs 4 Handbook, chapter "TrueType Hinting" (https://handbook.glyphsapp.com/), status "handbook"
#   - The autohint.tt.option.* rows and autohint.tt.controlInstructions.syntax follow the handbook's
#     description of the TTFAutohint options and control instructions parameters (Appendix ›
#     Custom Parameters), with defaults from the help text of the ttfautohint program, run as a
#     black box (M10 planning pass).
# Date: 2026-10-07
#
# Notes for readers of this file:
#   - Custom parameters named here (Get Hints From Master, TTFAutohint options, TTFAutohint control
#     instructions, TTFZones, TTFStems, TTFBlueFuzz, TTFOvershootSuppressionBelowPPM,
#     TTZoneRoundingThreshold, TTMinimumDistance, CVT Table, prep Table Assembly, fpgm Table Assembly,
#     gasp Table) are described as [[behavior]] rows with ids hinting.tt.param.*; their [[parameter]]
#     rows belong to the custom-parameter inventory so that parameter names stay unique across files.
#   - Context-menu commands carry menu = [] (the schema has no slot for context menus).
#   - Single-letter shortcuts are active only while the TrueType Instructor tool is the current tool.
#   - Ids: hinting.tt.* = rules, hint.tt.* = commands, autohint.tt.* = the export autohinter.

# ---------------------------------------------------------------------------------------------
# Concepts
# ---------------------------------------------------------------------------------------------

[[behavior]]
id = "hinting.tt.cubicSourceQuadraticOutput"
area = "hinting-tt"
milestone = "M10"
summary = "Sources keep cubic outlines; TrueType export converts them to quadratic outlines on the fly, and manual instructions, which refer to source nodes, are carried over to the matching points of the converted outline. Instructions are therefore stored against source nodes, never against final point numbers."
ref = "TrueType Hinting › introduction"
status = "handbook"
notes = "M10.19, crates/compile/src/points.rs: the point map is built by position on the outline the TrueType stage prepared, after decomposition, overlap removal, curve conversion and reversal. An on-curve node keeps its place and is never left out as an implied point; an off-curve node takes the nearest off-curve point between the points of its segment's ends. Tested in skrifa with an Interpolate on a cubic handle. Documented, not yet observed."
guesses = ["An instruction on a cubic handle moves the off-curve point of the converted segment nearest to the handle, and an on-curve node that the conversion could leave implied is written as a point; exporting a glyph instructed on a handle from the reference app and reading its glyf would settle both."]

[[behavior]]
id = "hinting.tt.mainMasterOnly"
area = "hinting-tt"
milestone = "M10"
summary = "Glyph-level TrueType instructions are defined on one master only, the main master: the first in the masters list, or the one named by a Get Hints From Master custom parameter on the font. The same parameter controls PostScript hints."
ref = "TrueType Hinting › introduction"
status = "handbook"
notes = "M10.2 reads and writes the instruction forms of the format samples (crates/hinting/src/tt.rs): horizontal = 1 for vertical hinting, the rounding in the low bits of options (0 round, 1 up, 2 down, 4 no rounding, as the reference's scripting constants name them), bit 128 for triple hints, stem −2 automatic and −1 none, the moved point in origin for Snap and Delta, settings.deltaV for deltas; format 2's Anchor, Align, Interpolate and Delta names are read too. An unchanged instruction is written back byte for byte. Documented, not yet observed."
guesses = [
  "Rounding only in GDI ClearType is stored as options 3, which no source shows; a file saved by the reference app with that rounding mode would show the value.",
  "A Snap stores its zone in the stem key (−2 automatic, −1 none, else the index), as a Stem stores its stem; a file with a Snap set to a named zone would show the key.",
  "Stem instructions flagged as triple form groups of three in list order; a file with two triple hints in one glyph would show how they are kept apart.",
  "A delta cell is stored as 8 (up) or −8 (down) under its PPM, in a column keyed by the instance's axis values in braces padded to six, as the one format sample shows; a file with deltas set for two instances would confirm both.",
  "An instruction of a TrueType type that lacks a point its type needs (the corpus has place-only Snap and Stem hints and a Stem without target) is detached: kept as stored, never listed or compiled; the reference app's export of such a glyph would settle it.",
  "Special layers' own TrueType instructions: an intermediate (brace) layer's are never exported, and an alternate (bracket) layer's are exported for its alternate glyph in a variable font when the layer belongs to the main master, since it is then that glyph's main-master layer; exporting a glyph whose special layers carry their own instructions from the reference app would settle both.",
]
observe = [
  "T3: give a glyph an intermediate layer and an alternate layer on the main master, each with its own Snap, export a variable TTF and a static instance inside the alternate range, and note which instructions each glyph program carries.",
  "T3: give n one Stem of each rounding mode, including Round only in GDI ClearType, save as .glyphs and note each options value.",
  "T3: set a Snap of n to a named zone and make one triple hint in E; save as .glyphs and note the keys each stores.",
  "T3: set one Delta of n up at 12 PPM in one instance and down at 13 PPM in another; save as .glyphs and note the deltaV keys and values.",
]

[[behavior]]
id = "hinting.tt.replicateToOtherMasters"
area = "hinting-tt"
milestone = "M10"
summary = "Every master carries its own TT zones and stems, and these font-level values are what lets the main master's instructions be re-applied to all other masters and to interpolated instances: an instruction that refers to zone or stem N uses that master's or instance's value of N. It follows (our inference, not stated) that zone and stem lists must correspond across masters."
ref = "TrueType Hinting › Font-level Hints"
status = "handbook"

[[behavior]]
id = "hinting.tt.param.getHintsFromMaster"
area = "hinting-tt"
milestone = "M10"
summary = "Get Hints From Master is a font-level custom parameter (Font Info › Font) whose value names the master whose layers supply glyph-level hints, overriding the first-master default."
ref = "TrueType Hinting › introduction"
status = "handbook"
notes = "Read from the font only; its value is matched to a master id, else a master name, and an unknown value falls back to the first master. Documented, not yet observed."

# ---------------------------------------------------------------------------------------------
# Autohinting at export
# ---------------------------------------------------------------------------------------------

[[behavior]]
id = "hinting.tt.export.autohintIgnoresManual"
area = "hinting-tt"
milestone = "M10"
summary = "Automatic and manual TrueType hinting cannot be combined. Exporting a TrueType-flavour font with the export dialog's Autohint option on discards all manual TT instructions for that export and hints the whole font with the autohinter (TTF Autohint in the reference)."
ref = "TrueType Hinting › Autohinting"
status = "handbook"
notes = "M10.21, crates/compile/src/tt_hints.rs: with Autohint on (the instance's Autohint parameter, else the export option) every simple glyph of the build gets the built-in autohinter's program, made from the layer being exported, and the manual instructions of the source are not compiled; a warning names the glyphs whose manual instructions were replaced. Imported cvt, prep and fpgm parameters are not written either. Documented, not yet observed."

[[behavior]]
id = "hinting.tt.export.manualWhenAutohintOff"
area = "hinting-tt"
milestone = "M10"
summary = "With the Autohint export option off, the manual instructions stored in the source are compiled into the exported font. Glyphs without instructions are exported unhinted."
ref = "TrueType Hinting › Autohinting"
status = "handbook"
notes = "M10.19, crates/compile/src/tt_hints.rs: with Autohint off (the instance's Autohint parameter, else the export option) each glyph whose main-master layer has instructions gets its glyph program, and the font gets our cvt, fpgm and prep and maxp values that cover the analysed needs of every program; glyphs without instructions and composites get none. skrifa runs every glyph at 8 to 72 PPM in the three intents. Documented, not yet observed."

[[behavior]]
id = "hinting.tt.param.ttfAutohintOptions"
area = "hinting-tt"
milestone = "M10"
summary = "TTFAutohint options is a custom parameter on an export instance (Font Info › Exports) holding the settings passed to the TrueType autohinter for that instance, edited in a dialog sheet; the settings are the autohint.tt.option.* rows."
ref = "TrueType Hinting › Autohinting; Appendix › Custom Parameters › TTFAutohint options"
status = "handbook"

[[behavior]]
id = "hinting.tt.param.ttfAutohintControlInstructions"
area = "hinting-tt"
milestone = "M10"
summary = "TTFAutohint control instructions is a custom parameter on an export instance (Font Info › Exports) holding text lines that correct the autohinter's result for individual glyphs and points. The lines address points by index, which Show Point Indexes displays in Edit View."
ref = "TrueType Hinting › Autohinting; Show Point Indexes"
status = "handbook"

[[command]]
id = "autohint.tt.run"
label = "Autohint TrueType"
menu = []
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], excludeGlyphs?: [names], instance?: name, options?: string, controlInstructions?: string}"
area = "hinting-tt"
milestone = "M10"
summary = "Runs the TrueType autohinter over the glyphs of the font (every exporting glyph unless some are named) and stores its Snap and Stem instructions on each glyph's main-master layer, replacing the instructions there, with the TTFAutohint options and control instructions of an instance or given as parameters. The export's Autohint option runs the same autohinter on the build; exposing it as a command is our design."
ref = "TrueType Hinting › Autohinting"
status = "inferred"
guesses = ["Above 3/4 pixel of overshoot a FontCraft autohinted build keeps flat extremes on the zone's row and puts round ones the rounded overshoot past it, where ttfautohint leaves both to its free edges, whose flat tops are then off the row by up to half a pixel.", "The built-in TrueType autohinter is FontCraft's own (decided in M10 § 7, question 2): Snap and Stem instructions from the PostScript autohinter's zone and stem analysis, compiled with the manual-instruction compiler; ttfautohint runs instead when the TTFAutohint binary path parameter names one; the reference app's built-in autohinter is ttfautohint."]
notes = "Facts from the ttfautohint manual and black-box runs (M10 planning pass): it accepts TrueType outlines only; it replaces cvt, fpgm and prep, always writes gasp with one record (65535: all four bits), removes hdmx, LTSH and VDMX and puts a dummy DSIG; on Oswald Italic it instructed 339 of 555 glyphs and none of the composites; on a static Inter (2,937 glyphs) it takes 0.09 s; rehinting a dehinted font with a later 1.8.4 build gave identical bytecode sizes, so it can serve as a byte-level oracle. fontmake runs it only for TrueType output, with -a or when an instance carries TTFAutohint options. M10.52b: overshoots show from half a pixel in an autohinted build unless TTFOvershootSuppressionBelowPPM is set. The rule is fitted to ttfautohint 1.8.4.16's rows on synthetic fonts (overshoots of 10 to 60 units at 2,000 per em, 8 to 200 PPM): the zone's overshoot at the size, scaled by the x-height factor, shows as nothing under 1/2 pixel, as 1/2 pixel from 1/2 and as 1 pixel from 3/4; above that ttfautohint switches the zone off and rounds the edges one by one, which puts the round extreme a whole number of pixels past the row. A round extreme past half of the zone's size takes the overshoot, all of them alike; nearer ones, and flat extremes, stay on the row."
observe = ["T3: export a TTF with Autohint on from a font whose glyphs carry TrueType instructions; render a hinted glyph at 12 PPM and note whether the manual instructions or the autohinter's result shows."]

[[behavior]]
id = "autohint.tt.option.hintingRange"
area = "hinting-tt"
milestone = "M10"
summary = "The hint set range (ttfautohint hinting-range-min and hinting-range-max, defaults 8 and 50 PPM) bounds the pixel sizes for which the autohinter computes its own hint set; sizes above the maximum, up to the hinting limit, use the set of the maximum. A wide range makes the font larger. The handbook names the setting and its file-size effect; the defaults come from the program's help text."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Black-box runs (M10.38, ttfautohint 1.8.4.16 on Oswald Regular, FreeType): inside the range the result does not depend on it (ranges 8–20, 8–50 and 8–100 give the same points at 9 to 20 PPM; 2–50 and 8–50 from 8 PPM up), and outside it up to 35 of 65 letters and figures differ, in the heights of edges outside every zone; zone rows and overshoots do not depend on it. FontCraft's glyph programs work every size out when they run, so one hint set serves all sizes, as the set of the range's maximum would above it: the range is checked and bounds nothing. The external program gets it."
guesses = ["The built-in autohinter has one hint set per glyph, so the hinting range changes nothing in its output; ttfautohint's output outside the range differs for a few glyphs, whose free edges it placed for the size at the range's end."]

[[behavior]]
id = "autohint.tt.option.hintingLimit"
area = "hinting-tt"
milestone = "M10"
summary = "The hinting limit (ttfautohint hinting-limit, default 200 PPM) is the size above which the generated bytecode switches hinting off; 0 means no limit. It must be larger than the top of the hint set range. Raising it does not make the font larger."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Applied by the built-in autohinter (M10.21): above the limit, `prep` switches glyph programs off with INSTCTRL."

[[behavior]]
id = "autohint.tt.option.increaseXHeight"
area = "hinting-tt"
milestone = "M10"
summary = "The x-height increase limit (ttfautohint increase-x-height, default 14) makes the x-height round up more readily for sizes from 6 PPM up to the given size; 0 turns this off. The x-height snapping exceptions (default none) list sizes and size ranges, comma-separated, that get no x-height snapping; a single dash exempts every size."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Applied by the built-in autohinter (M10.21b): `prep` rounds the top of the xHeight zone, overshoot included, up once it lies 3/8 of a pixel above a row, or 3/16 from 6 PPM up to the limit (the ttfautohint manual gives these as Super Round thresholds of 5/8 and 13/16), and scales every zone and every horizontal stem by the same factor, each rounded to the nearest row; at the sizes of the exceptions the factor is 1, so the zones are only rounded. The manual says the other zones are scaled before they are rounded; that the overshoot top is what gets rounded, and that the other zones round to the nearest row, comes from ttfautohint 1.8.4's output on a synthetic font (default options, `-X -`, `-x 0`), whose x-height and cap-height rows at 6 to 30 PPM the built-in autohinter reproduces at every size where no value lies within 0.03 px of a rounding boundary."
guesses = ["Under the built-in autohinter the zones round to the nearest row after the x-height scaling, as ttfautohint's output does, not by TTFZoneRoundingThreshold; zone and stem deltas still apply on top. The reference app autohinting a font with that parameter would settle it.", "The built-in autohinter scales the family zones it uses up to TTFFamilyZonesThreshold like the zones they replace; ttfautohint has no family zones.", "An autohinted export has x-height scaling only when the font draws one of u, v, x, z, o, e, s, c, and leaves out the xHeight zone when it draws none of them, and the capHeight zone when it draws none of T, H, E, Z, O, C, Q, S, unless the zone holds the top of a letter of the other list: the letters the ttfautohint manual lists for those zones, without which ttfautohint's output on the corpus leaves those heights unsnapped. On synthetic fonts whose only capitals are as tall as the x-height, ttfautohint rounds them to the nearest row and never up from 13/16. The reference app autohinting such a font would settle it."]

[[behavior]]
id = "autohint.tt.option.fallbackStemWidth"
area = "hinting-tt"
milestone = "M10"
summary = "The fallback stem width (ttfautohint fallback-stem-width) is the horizontal stem width, in font units, assumed for scripts whose standard characters the font lacks. Without it the program uses 50 units at 2,048 units per em, scaled to the font's units per em. Symbol fonts also need a fallback script for it to apply."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Applied by the built-in autohinter (M10.21) as the vertical standard stem of the stem analysis when the master has no vertical TT stem."

[[behavior]]
id = "autohint.tt.option.stemWidthMode"
area = "hinting-tt"
milestone = "M10"
summary = "The stem width mode is chosen separately for three rendering targets, grayscale, GDI ClearType and DirectWrite ClearType: natural, quantized (widths and zone positions take a few discrete values) or strong (snapped to whole pixels as far as possible). The program's default is quantized, strong, quantized (ttfautohint stem-width-mode qsq). The handbook's dialog offers a Strong Stems choice per target."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Built in M10.38: `prep` stores the mode of the rendering target and the autohinter's stem function takes each stem's width by it, scaled by the x-height factor first. The manual's words: natural changes no width, quantized takes a few discrete values, strong whole pixels. The numbers are fitted to ttfautohint 1.8.4.16's bar heights on synthetic fonts of one standard width (80, 160 of 2000, 60 of 2000; widths of 0.1 to 15 pixels, 9 to 100 PPM), d the width and s the standard width in pixels: quantized, for s from 5/8 up, raises d to 7/8, takes s (at least 3/4) within 5/8 of it, else under 3 pixels replaces a fraction from 5/32 to 1/2 by 5/32 and from 1/2 to 27/32 by 27/32, and from 3 pixels rounds d; for a smaller s it changes nothing. Strong takes the rounded s within 3/4 of it, else the rounded d, at least 1. FreeType 2.13.2's interpreter selects the third letter in its default and LCD modes and the first in monochrome mode. An autohinted export uses the modes; the commands that store instructions report the option as ignored. Zones are placed on whole pixel rows in every mode, as ttfautohint's output has them up to 50 PPM."
guesses = ["The standard width of a stem is the TT stem the instruction uses, the closest one; a master without horizontal TT stems gets one of the width of the thinnest horizontal stem of o, or the fallback stem width (50 at 2048 units per em) for a symbol font or without an o. ttfautohint clusters the widths it measures on o.", "The grayscale mode applies without ClearType, the GDI mode with ClearType and without symmetric smoothing, the DirectWrite mode otherwise, the test the built programs already use for GDI ClearType.", "TTFMinimumDistance does not apply to the stems of an autohinted build."]

[[behavior]]
id = "autohint.tt.option.scripts"
area = "hinting-tt"
milestone = "M10"
summary = "The default script (ttfautohint default-script, default latn) is used when handling OpenType features; the fallback script (fallback-script, default none) is given to glyphs that cannot be assigned a script. With fallback scaling (fallback-scaling) such glyphs are only scaled, not hinted. Fallback scaling is in the program's help text, not in the handbook."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Accepted and checked; the built-in autohinter has no script analysis, so these options are reported as ignored."

[[behavior]]
id = "autohint.tt.option.windowsCompatibility"
area = "hinting-tt"
milestone = "M10"
summary = "Windows compatibility (ttfautohint windows-compatibility) adds two blue zones at the OS/2 usWinAscent and usWinDescent heights so that hinted glyphs stay inside the band Windows clips to."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Applied by the built-in autohinter (M10.21): two TT zones, `winAscent` (1 unit up from usWinAscent) and `winDescent` (1 unit down from −usWinDescent), are added to the build, so extremes at those heights land on a pixel row."
guesses = ["The built-in autohinter's Windows compatibility adds zones one unit high at usWinAscent and −usWinDescent, which snap extremes there to the nearest row rather than keeping them below the clipping line; a hinted export of a glyph that reaches usWinAscent, rendered under GDI, would settle it."]

[[behavior]]
id = "autohint.tt.option.composites"
area = "hinting-tt"
milestone = "M10"
summary = "Hint composites (ttfautohint composites) hints each composite glyph as one outline instead of hinting its components separately, and adds a helper component named .ttfautohint to every glyph. Adjust subglyphs (adjust-subglyphs, formerly pre-hinting) runs the font's existing bytecode before analysis, for fonts whose instructions move components."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Hint composites is built in M10.38: an autohinted TrueType build writes every composite as contours, which the autohinter hints as one outline. Adjust subglyphs is reported as ignored, since the built-in autohinter runs no existing bytecode."
guesses = ["With Hint Composites the built-in autohinter's font has contours in place of composites rather than composite programs and a helper component .ttfautohint: the rendered outlines are the composites hinted as one, and no glyph of the font can switch the hinting off."]

[[behavior]]
id = "autohint.tt.option.symbol"
area = "hinting-tt"
milestone = "M10"
summary = "Symbol font (ttfautohint symbol) makes the autohinter accept a font in which it finds no standard character for any script, using default stem values. Ignore restrictions (ignore-restrictions) lets it process a font whose OS/2 fsType has bit 1 set."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). The built-in autohinter never refuses a font for lacking standard characters; Symbol font makes it take the fallback stem width, not the letter o's, as the standard width of a master without horizontal TT stems. An autohinted TrueType export of a font with fsType bit 1 gets no TrueType hinting and a warning, unless Ignore Restrictions is on (M10.38)."
guesses = ["A font the autohinter refuses for its fsType is exported unhinted with a warning; whether the reference app stops the export is not documented. autohint.tt.run and hint.tt.autohintGlyph, which work on the source, are not refused."]
observe = ["T3: set fsType to Restricted License (bit 1) in a font, export a TTF with Autohint on, and note whether the export stops, warns or writes a font, and whether the font has glyph programs."]

[[behavior]]
id = "autohint.tt.option.dehint"
area = "hinting-tt"
milestone = "M10"
summary = "Dehint (ttfautohint dehint) removes all hinting and overrides every other option; meant for testing."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Applied (M10.21): the export writes no TrueType hinting, and autohint.tt.run stores no instruction."

[[behavior]]
id = "autohint.tt.option.info"
area = "hinting-tt"
milestone = "M10"
summary = "By default the autohinter appends its name and version to the version strings (name ID 5). Detailed info (detailed-info) appends the version and its options instead; no info (no-info) appends nothing. The two settings exclude each other."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). Applied (M10.21): with Detailed info the export appends the autohinter's name and options to name ID 5; otherwise it leaves the version string alone."
guesses = ["With FontCraft's own TrueType autohinter (decided in M10 § 7, question 2) the name strings are left alone unless detailed or plain info is asked for; the reference app's choice between its default and No Autohint Info would settle it."]
observe = ["T3: export as TTF with Autohint and the default TTFAutohint options; read name ID 5 and note whether autohinter version information was added to it."]

[[behavior]]
id = "autohint.tt.option.ttfaTable"
area = "hinting-tt"
milestone = "M10"
summary = "The ttfa table option (ttfautohint ttfa-table) adds a TTFA table that records every autohinter parameter, the control instructions included, so a later run can repeat it; renderers ignore the table."
ref = "Appendix › Custom Parameters › TTFAutohint options; ttfautohint 1.8 --help"
status = "handbook"
notes = "Added by the M10 planning pass: the handbook's option list names it and no row covered it. Applied (M10.21): the export writes a TTFA table holding the options as long options, then the control instructions, as text."

[[behavior]]
id = "autohint.tt.controlInstructions.syntax"
area = "hinting-tt"
milestone = "M10"
summary = "The control instructions are lines of text, one instruction each, starting with one or more comma-separated production glyph names: left or right with point indexes and an optional offset (force a segment direction), nodir with point indexes, and touch or point with point indexes, an x shift and/or a y shift and @ with pixel sizes (single sizes, ranges with a hyphen, comma lists). Omitted offsets are 0; lines starting with # are comments; each keyword may be shortened to its first letter."
ref = "Appendix › Custom Parameters › TTFAutohint control instructions; TrueType Hinting › Show Point Indexes"
status = "handbook"
notes = "Verified by the M10 planning pass against the handbook's description of the TTFAutohint options parameter and the help text of the ttfautohint 1.8 program (run as a black box; its source was not read). The handbook bounds the shifts to 0.0 to 1.0; the ttfautohint manual is the place to check whether negative shifts are allowed. The ttfautohint manual (Control Instructions, read as public user documentation) adds what the handbook leaves out: an optional font index first; glyphs by name or index; style assignment (script feature @ glyphs) and stem widths (script feature width …) forms; left and right take optional (left, right) offsets in font units; nodir makes points weak and takes no sizes; touch acts before and point after IUP; shifts are pixels from −1.0 to 1.0 in eighths and sizes 6 to 53 PPM; entries end at a semicolon or a line end, a trailing backslash continues a line, and later entries override earlier ones. FontCraft parses the manual's full grammar."

# ---------------------------------------------------------------------------------------------
# Font-level hints: zones
# ---------------------------------------------------------------------------------------------
guesses = ["The built-in autohinter turns the y shift of a touch correction into a vertical Delta before IUP, one pixel up or down for a shift of at least half a pixel; point shifts and every x shift move the point after IUP by the shift in eighths of a pixel. Stored by autohint.tt.run or hint.tt.autohintGlyph, point shifts become Deltas as touch shifts do and x shifts are reported. The external program applies them as its manual describes.", "The built-in autohinter treats each left or right point as a one-point segment from its x plus the left offset to its x plus the right offset: snapped to a zone it lies in, else a vertical Stem from the nearest flat run above or below that overlaps the segment within 1.5 times the glyph's widest horizontal stem, else rounded to the grid. The manual's own example (a stem formed with a neighbouring segment) is the case it covers; ttfautohint's output on a glyph with a left or right point would settle the rest.", "The built-in autohinter keeps nodir points out of every instruction, and reads the style forms (script feature @ glyphs, script feature width) and leaves them out."]

[[behavior]]
id = "hinting.tt.zones.purpose"
area = "hinting-tt"
milestone = "M10"
summary = "TT zones make vertical extremes that belong together land on the same pixel row: when an outline is grid-fitted, extremes lying in one zone are rounded to one common height. Zones are placed at whatever heights the design repeats (baseline, descender, ascender, x-height, cap height, small-cap height, figure height, and script-specific heights such as shoulder, nabira or rekha height)."
ref = "TrueType Hinting › TrueType Zones"
status = "handbook"

[[behavior]]
