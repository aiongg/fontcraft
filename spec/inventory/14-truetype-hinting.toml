ref = "TrueType Hinting › Stem (S)"
status = "handbook"
guesses = ["The context-menu label of the Stem instruction is Stem, as the key list names it; the reference app would settle it.", "With four or more points selected, the points pair in the order given (first with second, third with fourth); the reference app would settle how a larger selection pairs.", "In a pair of one touched and one untouched point the touched one becomes the origin, and of two untouched points the first one does; the reference app would settle which end gets the arrowhead."]
