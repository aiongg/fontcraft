[[command]]
id = "hint.tt.shiftPoints"
label = "Shift Points"
menu = []
shortcut = "F"
when = "tool:trueTypeInstructor"
context = ["canvas.node", "canvas.path"]
kind = "engine"
params = "{glyph: name, layer?: id, nodes?: [point], origin?: point, targets?: [point], direction?: 'vertical'|'horizontal', rounding?: 'round'|'up'|'down'|'none'|'gdiOnly'}"
area = "hinting-tt"
milestone = "M10"
summary = "Adds a Shift instruction: an untouched target point is displaced by the same amount as its touched origin point, and the target counts as touched afterwards. The selection must contain exactly one touched point; every other selected point must be untouched and gets its own Shift instruction from that origin. Default rounding: No rounding (the recommended mode)."
ref = "TrueType Hinting › Shift (F)"
status = "handbook"
notes = "M10.7, crates/engine/src/cmd/hint_tt_more.rs: `nodes` is the selection (exactly one touched point, the origin; every other point an untouched target), or `origin` and `targets` name the parts; one Shift per target at the end of the list, each checked against the touched state, so a refused target adds nothing. Default rounding No rounding. Documented, not yet observed. M10.34, crates/ui/src/app/context_menu: while the Instructor is active, the node and path sections of the canvas context menu start with it, on the selected points and the Instructor's direction; it is greyed out with the reason the command would refuse with (point_ready)."

[[behavior]]
id = "hinting.tt.shift.rounding"
area = "hinting-tt"
milestone = "M10"
summary = "Shift rounding modes act on the target after the movement has been copied: Round to the nearest pixel edge, Round up to the edge above, Round down to the edge below, No rounding keeps the copied movement exactly, GDI-only rounds in the ClearType intent alone."
ref = "TrueType Hinting › Shift (F)"
status = "handbook"
notes = "M10.18, crates/hinting/src/tt_glyph.rs: SRP1 and SHP[1] copy the origin's movement, then FN_POINT_ROUND rounds the target unless the mode is No rounding. Documented, not yet observed."

[[behavior]]
id = "hinting.tt.shift.useCase"
area = "hinting-tt"
milestone = "M10"
summary = "Typical use, taking a sans-serif n: its left leg is snapped to the baseline zone, but a Stem instruction on the shoulder interrupts the contour, so the final interpolation moves the right leg from the stem instruction only. A Shift whose origin is the snapped left-leg point and whose target is a right-leg point makes both legs move alike; an m needs one Shift per additional leg."
ref = "TrueType Hinting › Shift (F)"
status = "handbook"

