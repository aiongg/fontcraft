# Source: Glyphs 4 Handbook, chapter "Edit View", sections Info Box, Glyph Display, Background,
#         Entering Text, Measuring, Annotating, Images, Previewing & Testing
#         (https://handbook.glyphsapp.com/edit-view/ ; scratch copy handbook/03-edit-view.txt, lines 557-1087)
# Date:   2026-10-07
# All wording is our own. Labels, menu paths and shortcuts match the reference where it states them.
# Rows marked `inferred` are FontCraft designs (mostly headless forms of pointer-only actions).

# ───────────────────────────── Info box ─────────────────────────────

[[panel]]
id = "infoBox.glyph"
label = "Info Box (glyph, horizontal layout)"
location = "inspector"
controls = [
  "glyph name, centred on the top row (editable)",
  "Unicode value, top right",
  "arrow button beside the Unicode value: open the code point in an external Unicode browser",
  "left sidebearing field (number or metrics key), left of the horizontal-metrics icon",
  "right sidebearing field (number or metrics key), right of the icon",
  "width field (number or metrics key), below the icon",
  "left kerning value and left kerning group, at the left edge",
  "right kerning value and right kerning group, at the right edge",
  "colour swatch: glyph colour on the left half, layer colour on the right half",
]
area = "ui-chrome"
milestone = "M5"
summary = "Floating box drawn under the current glyph in Edit View with its name, Unicode value, sidebearings, width, kerning values and kerning groups. Current glyph means the glyph being edited; with text mode on, it is the glyph immediately following the text cursor. Shown only while View > Show Info is on."
ref = "Edit View › Info Box"
status = "handbook"
notes = "Built in M5.8 (`panels/info_box_metrics.rs`, kerning in `panels/info_box_kerning.rs`): the name and Unicode value are shown, not edited; LSB, RSB and width are fields; each outer edge holds the kern field on the metrics row and the group field and lock below it. Still to build: editing the name, the Unicode arrow button, and the colour swatch in this box (it sits in the selection box)."
guesses = [
  "With several glyphs selected in the text, the Info box describes the glyph after the cursor only, and the Unicode value is shown, not edited.",
  "At each outer edge the kern field sits on the sidebearing row and the group field with its lock on the width row; a screenshot of the reference app's Info box in text mode would settle it.",
  "The preceding glyph's box sits beside the glyph box, on the side where the preceding glyph is drawn; the reference app with the Text tool would settle it.",
]

[[panel]]
id = "infoBox.glyphVertical"
label = "Info Box (glyph, vertical layout)"
location = "inspector"
controls = [
  "glyph name and Unicode value",
  "T: top sidebearing",
  "B: bottom sidebearing",
  "O: vertical origin",
  "H: vertical width (height)",
  "K: kerning value, one for the top and one for the bottom",
  "G: kerning group, one for the top and one for the bottom",
]
area = "ui-chrome"
milestone = "M5"
summary = "Variant of the glyph Info box that replaces the horizontal one when the text is laid out top to bottom. It exposes the vertical metrics (top and bottom sidebearing, vertical origin, vertical advance) and top and bottom kerning values and groups."
ref = "Edit View › Info Box › Vertical Layout"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.8a: T and B are fields running `spacing.setTopSidebearing` and `spacing.setBottomSidebearing`; In `crates/ui/src/panels/info_box.rs` all four are key-or-number fields, O and H running `spacing.setVerticalOrigin` and `spacing.setVerticalWidth` (M5.20). The window has no vertical text layout yet, so the box shows this layout only once one sets it. K and G are the kern field and the group field with its lock at the box's first and second edge, for the glyph above and the glyph below."

[[panel]]
id = "infoBox.selection"
label = "Info Box (selection)"
location = "inspector"
controls = [
  "X and Y of the selection, measured from the layer origin to the chosen reference point",
  "3x3 reference-point grid; the active point is drawn blue",
  "width and height of the selection bounding box (see Scaling & Rotating)",
  "for a single selected node: its X and Y coordinates",
  "for a selected handle: its coordinates, delta X, delta Y and length relative to its on-curve node",
]
area = "drawing"
milestone = "M3"
summary = "Part of the Info box that reports the current selection: position and size of its bounding box, or exact coordinates when one node is selected, plus offset and length when the selected point is a handle. Every number is an editable field. Selecting two nodes shows their distance in the width or height field, which is the quick way to read a stem width."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 5:06–5:08: with a new rectangle selected the Info box shows X and Y, width and height (146 × 700) and, in Glyphs 3, a node count of 4. Not shown: single-node coordinates, handle offset and length, the reference-point grid. Built in M3.15: the box sits at the foot of the canvas, centred, while Show Info is on, and only while something is selected (the glyph part is M5). Editing X or Y runs `selection.setPosition`; width or height runs `transform.scale` about the reference point; dX, dY and length of a handle place it relative to its node."

[[panel]]
id = "infoBox.component"
label = "Info Box (component / base glyph)"
location = "inspector"
controls = [
  "base glyph name; clicking it opens a glyph picker to repoint the component",
  "X and Y offset",
  "horizontal scale in percent",
  "vertical scale in percent",
  "slant to the right, in degrees",
  "rotation, counterclockwise degrees",
  "arrow button, top right: insert the base glyph into the tab text left of the current glyph and start editing it",
]
area = "components"
milestone = "M6"
summary = "Second Info box that appears to the right of the main one while a component is selected and describes the glyph the component references. Position edits are ignored while the component is automatically aligned."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Documented, not yet observed. M6.11: `crates/ui/src/panels/info_box_component.rs`. The box sits to the right of the selection box while Show Info is on and a component is selected. The name opens the glyph picker for component.setBaseGlyph; the fields run component.setTransform; the arrow runs component.editBaseGlyph. X and Y are greyed out on an aligned component (only X when it is aligned horizontally) and every field on a locked one."
guesses = [
  "With several components selected the box describes the first in shape order and shows how many more are selected beside its name; the reference app with two components selected settles it.",
  "A component whose transform is a matrix with slant that cannot be shown as scale and rotation shows only X and Y, the other fields empty and greyed out; a component with such a matrix in the reference app settles it.",
]

[[panel]]
id = "infoBox.componentGlyphPicker"
label = "Choose Base Glyph"
location = "dialog"
controls = ["searchable glyph list of the font", "confirm / cancel"]
area = "components"
milestone = "M6"
summary = "Pop-up glyph list opened by clicking the base glyph name in the component Info box. Picking a glyph makes the selected component reference it instead. The handbook only says it is a glyph list in a pop-up window, so the search field is our assumption."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Documented, not yet observed. M6.11: the component glyph picker (`dialogs/glyph_picker_component.rs`, `editView.chooseGlyph` with purpose baseGlyph) titled Choose Base Glyph; Return runs component.setBaseGlyph on the component that was selected when it opened."

[[panel]]
id = "infoBox.image"
label = "Info Box (image)"
location = "inspector"
controls = [
  "X and Y position",
  "width and height",
  "rotation angle in degrees, beside the curved-arrow icon",
  "right-pointing arrow: reveal the original image file in the file manager",
  "lock toggle",
]
area = "color"
milestone = "M11"
summary = "Info box contents while a placed image is selected: position, displayed dimensions, rotation, a reveal-file button and a lock button."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"
notes = "Documented, not yet observed. Shown in place of the selection part while the edited side's image is selected. X and Y run `image.setTransform` with `x` or `y`; width and height with `width` or `height` (each on its own: the box's proportion lock is not used); the angle with `rotation`; the arrow runs `image.revealFile`; the lock button runs `image.lock`, after which the image can no longer be selected and the box closes. A sheared image shows X and Y only."
guesses = [
  "Width and height are edited independently, without a proportion lock. Settled by typing a new width for a selected image in the reference's Info box and reading its height.",
]
observe = [
  "Image font: select H's image, type a width in the Info box; note whether the height follows.",
]

[[panel]]
id = "infoBox.annotations"
label = "Info Box (annotation palette)"
location = "inspector"
controls = [
  "Annotation Selection tool (first button)",
  "Text Annotation tool",
  "Arrow Annotation tool",
  "Circle Annotation tool",
  "Plus annotation button",
  "Minus annotation button",
]
area = "drawing"
milestone = "M3"
summary = "While the Annotation tool is active the Info box is replaced by a small strip of sub-tool buttons for selecting annotations and for adding text, arrow, circle, plus and minus marks. It is only visible when View > Show Info is on."
ref = "Edit View › Annotating"
status = "handbook"
notes = "Built in M3.15: while one of the six Annotation tools is the chosen tool and Show Info is on, the Info box shows one drawn-icon button per sub-tool instead of the selection fields; the active one is drawn selected and a click runs `annotation.setTool`. Holding Space for the Hand tool keeps the palette. Follows the handbook; not yet observed in the reference app."

[[command]]
id = "glyph.openInUnicodeBrowser"
label = "Open in UnicodeChecker"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph?: name, unicode?: hex}"
area = "ui-chrome"
milestone = "M14"
summary = "In the Info box, the arrow button beside the Unicode field hands the current glyph's code point to an external Unicode browser (UnicodeChecker in the reference). If that app is missing the reference offers a download link, and the first use triggers an OS permission prompt. FontCraft needs a cross-platform target; which one is undecided."
ref = "Edit View › Info Box"
status = "handbook"

[[command]]
id = "infoBox.setReferencePoint"
label = "Set Info Box Reference Point"
menu = []
shortcut = ""
kind = "ui"
params = "{point: 'topLeft'|'top'|'topRight'|'left'|'center'|'right'|'bottomLeft'|'bottom'|'bottomRight'}"
area = "drawing"
milestone = "M3"
summary = "Chooses which of the nine points of the selection bounding box the X and Y fields of the Info box report and edit. The chosen point is highlighted in blue; picking the centre makes X/Y the centre of the selection."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Built in M3.15. Bottom left is also the default of `selection.getInfo`."
guesses = [
  "The reference point starts at bottom left; the handbook gives no default.",
]

[[command]]
id = "selection.getInfo"
label = "Get Selection Info"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index], referencePoint?: bottomLeft|bottom|bottomRight|left|center|right|topLeft|top|topRight} → {glyph, layer, referencePoint, x?, y?, width?, height?, node?, handle?, distance?}"
area = "drawing"
milestone = "M3"
summary = "Query returning what the selection Info box shows: bounding box position at the reference point, width and height, and for a single node its coordinates, and for a single handle also delta X, delta Y and length to its on-curve node. Headless counterpart of reading the Info box; not a reference menu item."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "inferred"
own = true
guesses = [
  "Its default reference point, bottom left, is ours; the handbook gives none for the Info box.",
]

[[command]]
id = "selection.setPosition"
label = "Set Selection Position"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, points?: [[shape, node]], segments?: [[shape, node]], shapes?: [index], anchors?: [name], guides?: [{scope: local|global, index}], annotations?: [index], x?: number, y?: number, referencePoint?: bottomLeft|bottom|bottomRight|left|center|right|topLeft|top|topRight} → {dx, dy, selection}"
area = "drawing"
milestone = "M3"
summary = "Moves the selection so that the chosen reference point of its bounding box lands on the given X and/or Y, which is what typing into the X or Y field of the Info box does. For a single node or handle it sets that point's coordinates."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"

[[command]]
id = "component.setBaseGlyph"
label = "Change Component Glyph"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, component?: index, base: name}"
area = "components"
milestone = "M6"
summary = "Repoints the selected component at another glyph, keeping its transform. Triggered from the glyph picker that opens when the base glyph name in the component Info box is clicked."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Documented, not yet observed. Keeps the slot in the shape order, the transform, the alignment setting and the attachment anchor (see components.swapBaseKeepsPlacement); a base that would make the glyph contain itself is refused."

[[command]]
id = "component.setTransform"
label = "Set Component Transform"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, component?: index, x?: number, y?: number, scaleX?: percent, scaleY?: percent, slant?: degrees, rotation?: degrees}"
area = "components"
milestone = "M6"
summary = "Sets any of the component values shown in the base-glyph Info box: offset, horizontal and vertical scale in percent, rightward slant and counterclockwise rotation. Offset changes have no effect while the component is automatically aligned."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Documented, not yet observed. Positions are rounded to the grid. A matrix transform from a file is shown as position, scale, slant and rotation with a horizontal slant only; a position edit keeps it a matrix."
guesses = [
  "The command refuses a position edit on an aligned component (only `y` on one aligned horizontally) and any edit on a locked component, and accepts slants within ±89°, rotations within ±360° and scales from −10,000 % to 10,000 % except 0; typing such values into the Info box of the reference app settles it.",
]

[[command]]
id = "component.editBaseGlyph"
label = "Edit Base Glyph"
menu = []
shortcut = ""
kind = "ui"
params = "{tab?: id, component?: index, glyph?: name} → {glyph}"
area = "components"
milestone = "M6"
summary = "Arrow button of the component Info box: inserts the referenced glyph into the Edit View text immediately left of the current glyph and makes it the glyph being edited."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "M6.10: a shell command; the Select tool's double-click on a component runs it with that component. `glyph` names the base glyph directly, else `component` is a shape index of the edited layer, else the one selected component is used; the base glyph goes in just before the edited glyph and becomes the edited glyph."

[[behavior]]
id = "infoBox.currentGlyphDefinition"
area = "ui-chrome"
milestone = "M5"
summary = "The glyph Info box always describes the current glyph: the glyph open for editing, or in text mode the glyph that follows the text cursor."
ref = "Edit View › Info Box"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.8a: the box reads the tab's edited glyph and its active layer, and its fields target that glyph."

[[behavior]]
id = "infoBox.metricsFieldsAcceptKeys"
area = "spacing-kerning"
milestone = "M5"
summary = "The LSB, RSB and width fields of the Info box accept either a plain number or a metrics key expression."
ref = "Edit View › Info Box › Horizontal Layout"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.8a: text that reads as a number is sent as a number, anything else as a key, and the setter checks it."

[[behavior]]
id = "infoBox.fieldEditing"
area = "ui-chrome"
milestone = "M3"
summary = "Clicking a number in the Info box turns it into a text field. Return or leaving the field commits; Escape cancels the edit and leaves no field focused; Tab commits and moves to the next value, Shift+Tab to the previous one."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 6:36–6:40: typing a new width into the W field resizes the selected rectangle; X appears to stay the same (partly visible). Built in M3.15 for every panel field: clicking selects the text; a field left with its text unchanged commits nothing, so tabbing through adds no undo step."

[[behavior]]
id = "infoBox.arrowKeyStepping"
area = "ui-chrome"
milestone = "M3"
summary = "While an Info box field is focused, Up and Down raise or lower its value by 1, by 10 with Shift held, and by 100 with Cmd and Shift held."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"
notes = "Built in M3.15: each press commits at once, as one undo step. The handbook gives the step of 100 with Cmd+Shift for the glyph box's sidebearing fields; In the window the metric fields that take a number or a key step by 1, 10 and 100 while they hold a number (`craft_ext::ui::text::StepKeys`); its plain number fields are the framework's, which step by 1 and by 10 with Shift and have no Cmd+Shift step yet."

[[behavior]]
id = "infoBox.followsSelection"
area = "drawing"
milestone = "M3"
summary = "The Info box content tracks the selection at all times: one node shows its coordinates, a handle adds delta X, delta Y and length to its on-curve node, a component adds the base-glyph box, an image shows image fields, a guide shows guide fields."
ref = "Edit View › Measuring › Measuring with the Info box"
status = "handbook"

[[behavior]]
id = "infoBox.showsColorLabels"
area = "ui-chrome"
milestone = "M4"
summary = "The Info box shows the glyph colour label on its left half and the layer colour label on its right half, the same split used by glyph cells in Font View."
ref = "Edit View › Glyph Display › Glyph & Layer Colors"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The split square sits before the glyph's name in the Info box and is drawn only when the glyph or the active layer has a colour label; with several glyphs selected it is not drawn. Settled by observation.",
]

[[behavior]]
id = "infoBox.unicodeBrowserMissing"
area = "ui-chrome"
milestone = "M14"
summary = "When the external Unicode browser is not installed, pressing the arrow button shows where to download it instead of failing silently."
ref = "Edit View › Info Box"
status = "handbook"

# ───────────────────────────── Zooming and panning ─────────────────────────────

[[tool]]
id = "zoom"
label = "Zoom"
shortcut = "Z"
group = ""
gestures = [
  "click: zoom in at the clicked point",
  "Alt+click: zoom out",
  "drag a rectangle: zoom so that the dragged area fills the window",
  "hold Cmd+Space with any tool: temporary zoom-in tool",
  "hold Cmd+Alt+Space with any tool: temporary zoom-out tool",
]
area = "ui-chrome"
milestone = "M3"
summary = "Pointer tool that magnifies the Edit View canvas. If Cmd+Space is taken by the system, pressing Space first and then adding Cmd also reaches the temporary zoom tool."
ref = "Edit View › Glyph Display › Zooming"
status = "handbook"

[[tool]]
id = "hand"
label = "Hand"
shortcut = "H"
group = ""
gestures = [
  "drag: pan the canvas",
  "hold Space with any tool except Text: temporary Hand tool",
  "in text mode, press Cmd+Space then release Cmd: temporary Hand tool without typing a space",
]
area = "ui-chrome"
milestone = "M3"
summary = "Pointer tool that scrolls the Edit View canvas by dragging. While it is active the current glyph is drawn filled if Fill Preview is on."
ref = "Edit View › Glyph Display › Panning"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 10:48, 14:48 and 19:34: with the Hand tool highlighted, a drag pans and the edited glyph is drawn filled. Not shown: the H key, Space, Cmd+Space."

[[command]]
id = "view.zoomIn"
label = "Zoom In"
menu = ["View"]
shortcut = "Cmd+Plus"
kind = "ui"
params = "{tab?: id}"
area = "ui-chrome"
milestone = "M3"
summary = "Increases the Edit View magnification by one step. The step size is not stated in the handbook."
ref = "Edit View › Glyph Display › Zooming"
status = "handbook"
notes = "Built in M3.2."
guesses = [
  "One step multiplies the scale by √2, and the zoom value stays between 50 and 64,000 (03b question 8).",
]

[[command]]
id = "view.zoomOut"
label = "Zoom Out"
menu = ["View"]
shortcut = "Cmd+Minus"
kind = "ui"
params = "{tab?: id}"
area = "ui-chrome"
milestone = "M3"
summary = "Decreases the Edit View magnification by one step."
ref = "Edit View › Glyph Display › Zooming"
status = "handbook"

[[command]]
id = "view.zoomToActiveLayer"
label = "Zoom to Active Layer"
menu = ["View"]
shortcut = "Cmd+0"
kind = "ui"
params = "{tab?: id}"
area = "ui-chrome"
milestone = "M3"
summary = "Sets the zoom so that the span from descender to ascender of the active layer fills the window as far as possible."
ref = "Edit View › Glyph Display › Zooming"
status = "handbook"
notes = "Built in M3.2: the glyph's centre goes to the window's centre."
guesses = [
  "The descender-to-ascender span, or the advance width when that is the tighter limit, fills the window less 8% on each side.",
]

[[command]]
id = "view.zoomToActualSize"
label = "Zoom to Actual Size"
menu = ["View"]
shortcut = "Cmd+Alt+0"
kind = "ui"
params = "{tab?: id}"
area = "ui-chrome"
milestone = "M3"
summary = "Sets the zoom so that one font unit covers exactly one display point (zoom value 1000). A display point is one device pixel on a standard-density screen and two on a high-density one."
ref = "Edit View › Glyph Display › Zooming"
status = "handbook"

[[command]]
id = "view.setZoom"
label = "Set Zoom"
menu = []
shortcut = ""
kind = "ui"
params = "{tab?: id, size: number, center?: [x, y]}"
area = "ui-chrome"
milestone = "M3"
summary = "Sets the zoom numerically, as typing into the field between the zoom buttons at the bottom right of the window does. `size` is the number of display points that 1000 font units occupy, so 300 draws a 500-unit stem 150 points long."
ref = "Edit View › Glyph Display › Zooming"
status = "handbook"
notes = "Built in M3.2: `center` is in the edited glyph's font units; without it the window's centre stays where it is."

[[command]]
id = "view.zoomToRect"
label = "Zoom to Rectangle"
menu = []
shortcut = ""
kind = "ui"
params = "{tab?: id, rect: [x, y, width, height]}"
area = "ui-chrome"
milestone = "M3"
summary = "Zooms and scrolls so that a given canvas rectangle fills the window. Headless form of dragging a rectangle with the Zoom tool."
ref = "Edit View › Glyph Display › Zooming"
status = "inferred"
notes = "Built in M3.2: `rect` is in the edited glyph's font units."
guesses = [
  "The rectangle fills the window less 8% on each side, the margin of Zoom to Active Layer.",
]

[[command]]
id = "view.scrollTo"
label = "Scroll Canvas"
menu = []
shortcut = ""
kind = "ui"
params = "{tab?: id, x?: number, y?: number, dx?: number, dy?: number}"
area = "ui-chrome"
milestone = "M3"
summary = "Pans the Edit View canvas to an absolute position or by an offset. Headless form of dragging with the Hand tool, scrolling or dragging the scroll bars."
ref = "Edit View › Glyph Display › Panning"
status = "inferred"
own = true
notes = "Built in M3.2: `x` and `y` name the font point (edited glyph's units) shown at the window's centre; `dx` and `dy` then move the content by that many screen points, right and down. The wheel scrolls through this command; Shift turns a vertical wheel horizontal. Scroll bars are not drawn yet."

[[panel]]
id = "editView.bottomBar"
label = "Edit View bottom bar"
location = "statusbar"
controls = [
  "Features pop-up button (bottom left); shows the tags of the active features and is tinted with the accent colour when any is on",
  "Preview (eye) button (bottom left): show or hide the Preview Area",
  "writing direction buttons: left to right, right to left, top to bottom (bottom right)",
  "kerning mode button: no kerning, kerning, locked kerning (see Kerning Modes)",
  "zoom out and zoom in buttons (bottom right)",
  "zoom field between the zoom buttons: display points per 1000 units",
]
area = "ui-chrome"
milestone = "M3"
summary = "Row of controls along the lower edge of an Edit View tab: feature preview menu and preview toggle on the left, writing direction and zoom controls on the right. The exact order and the position of the kerning mode button are not described in this chapter."
ref = "Edit View › Glyph Display › Zooming; Entering Text › Writing Direction; Previewing & Testing"
status = "handbook"
notes = "In `crates/ui` (UI.41b, `panels/edit_bar.rs`) the controls sit in the window's status bar while an Edit View tab shows and read that tab's state: the Features menu and the Preview Area button at the start, then the status text; at the end the three writing direction buttons, the kerning mode button, and zoom out, the zoom field and zoom in. The zoom buttons run `view.zoomOut` and `view.zoomIn`, the field `view.setZoom`. Documented, not yet observed."
guesses = [
  "The controls share the window's status bar with the status text instead of a bar of their own under each tab; settle by looking at where the reference app's bottom bar ends and whether Font View has one.",
  "The icons come from the framework's catalog: pilcrows for left to right and right to left, a vertical type mark for top to bottom, unlink, link and lock for the three kerning modes, an eye for the Preview Area; settle by comparing with the reference app's bottom bar.",
