label = "Toggle Text Mode"
menu = []
shortcut = "Escape"
when = "editView"
kind = "ui"
params = "{tab?: id, mode?: 'text'|'edit'}"
area = "edit-text"
milestone = "M5"
summary = "Switches between typing text and editing the current glyph. The handbook states the Escape toggle but not which tool becomes active when leaving text mode."
