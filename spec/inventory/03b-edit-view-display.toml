[[behavior]]
id = "textPreview.exportedFonts"
area = "proofing"
milestone = "M14"
summary = "Text Preview can show the compiled fonts of the last export, or every font file in a chosen folder, instead of the open document, without installing them. The files are read again when they change on disk, and the text is laid out from the compiled tables (cmap, metrics, kerning and, once shaping exists, the layout features)."
ref = "Our design, after the reference vendor's free font-preview companion tool"
status = "inferred"
own = true
notes = "Built in M13.70 (`app/models/text_preview/exported.rs`): the files are read through the host's jobs under the engine's file size limit, opened as File › Open opens a compiled font, and shaped through a shaping font made from the file's own bytes; lines break on unshaped widths. The last export is the font files the latest export command of the session reported writing. A folder lists its .ttf, .otf, .woff, .woff2, .ttc and .otc files by name, at most 64. While a file shows, the document's kerning, colour drawings and styles do not apply."
guesses = [
  "A watched file is read again when its size or modification time changes, looked at once a second; a user report of missed or slow updates would settle it.",
  "A collection file shows its first font only.",
  "The last export is remembered for the session only, not saved with the document.",
]

