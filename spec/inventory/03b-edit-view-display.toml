[[behavior]]
id = "text.displayStrings"
area = "edit-text"
milestone = "M5"
summary = "The texts of the open Edit View tabs are stored in the document as its display strings, one string per tab, with a glyph that has no character written as `/name`. Opening a document opens its tabs again from them."
ref = "GlyphsSDK file-format specification, versions 3 and 4 › DisplayStrings (UIState.plist in a package)"
status = "docs"
notes = "The owner's decision (docs/plans/M5.md § 7 question 4): opening a document opens one tab per stored string, and saving writes the open tabs in tab order. When the `Write DisplayStrings` custom parameter is false, saving writes none, as the reference does. The string format is built in M5.6 (`textlayout::parse`, `Text::to_display_string`): a space after `/name` ends the name and is dropped, as the handbook describes sample strings; the 45 display strings of the 21 corpus sources that have them read and write back unchanged. Built in M5.7a: File › Open opens the tabs, Save and Save As write the open tabs first, without an undo step and without marking the document modified."
guesses = [
  "Changing a tab's text is not an undo step and does not mark the document modified; no source says, and the window's edited mark after typing in a tab of the reference app settles it.",
