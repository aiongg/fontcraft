status = "handbook"

[[tool]]
id = "annotationArrow"
label = "Arrow Annotation"
shortcut = ""
group = "annotation"
gestures = [
  "click: add a red arrow",
  "drag the handle on the arrow's stem: rotate it",
]
area = "drawing"
milestone = "M3"
summary = "Sub-tool that places red arrows pointing at a spot on the glyph."
ref = "Edit View › Annotating › Annotation Arrow"
status = "handbook"

[[tool]]
id = "annotationCircle"
label = "Circle Annotation"
shortcut = ""
group = "annotation"
gestures = [
  "click: add a red circle",
  "drag the circle's bottom handle: change its diameter",
]
area = "drawing"
milestone = "M3"
summary = "Sub-tool that places red circles around an area of the glyph."
ref = "Edit View › Annotating › Annotation Circle"
status = "handbook"

[[tool]]
id = "annotationPlus"
label = "Plus Annotation"
shortcut = ""
group = "annotation"
gestures = ["click: add a plus sign at the pointer"]
area = "drawing"
milestone = "M3"
summary = "Sub-tool that stamps a plus sign, the conventional mark for a part that should become heavier or larger."
ref = "Edit View › Annotating › Plus & Minus Annotations"
status = "handbook"

[[tool]]
id = "annotationMinus"
label = "Minus Annotation"
shortcut = ""
group = "annotation"
gestures = ["click: add a minus sign at the pointer"]
area = "drawing"
milestone = "M3"
summary = "Sub-tool that stamps a minus sign, the conventional mark for a part that should become lighter or smaller."
ref = "Edit View › Annotating › Plus & Minus Annotations"
status = "handbook"

