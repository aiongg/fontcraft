[[behavior]]
id = "image.supportedFormats"
area = "color"
milestone = "M11"
summary = "The reference accepts every image type its operating system can decode and names JPEG, PNG, PDF, TIFF and PSD. FontCraft must decide which of these it decodes itself on every platform."
ref = "Edit View › Images › Adding Images"
status = "handbook"
notes = "FontCraft decodes PNG, JPEG and TIFF itself on every platform, the web build included, and draws the first page of a PDF (`fontcraft-io-pdf`, row `image-pdf`). PSD and SVG references are kept and drawn as an unsupported-image marker (M11 § 7, question 3). A PDF has no pixel size: its page size in points stands in for one, so it is placed at one point to one unit and its width, height and crop work as for other images."
guesses = [
  "PSD images are kept as references and drawn as an unsupported-image marker with a message, not decoded. Settled by the owner's answer to M11 § 7 question 3.",
]
observe = ["Image font: add a PDF and a PSD image to a glyph; note how each is drawn."]

[[behavior]]
id = "image.dragAndDrop"
area = "color"
milestone = "M11"
summary = "Dropping an image file on a glyph cell in Font View or on a glyph in Edit View places it on that glyph's layer, the same as Glyph > Add Image…."
ref = "Edit View › Images › Adding Images"
status = "handbook"
notes = "Documented, not yet observed. On the canvas, one dropped file runs `glyph.addImage` on the edited glyph's active layer, on the side being edited. On a Font View cell, one file runs it on that glyph's layer of Font View's master. In both, several files run it once with the files matched to glyph names. Files dropped in the web build carry no path and are not placed yet."
guesses = [
  "A file dropped anywhere on the canvas goes on the edited glyph, not on the glyph under the pointer. Settled by dropping an image on a glyph of the line that is not being edited in the reference.",
  "Several files dropped on the canvas are matched to glyph names, as several files given to Add Image are. Settled by dropping two files on Edit View in the reference.",
]
observe = [
  "Image font: drag H.png onto Edit View showing H; note the image's place. Drag H.png and I.png together; note where each lands.",
]

[[behavior]]
id = "image.storedAsRelativePath"
area = "color"
milestone = "M11"
summary = "The document records only the image's path relative to the font file. If the file has moved or the path no longer resolves, the canvas shows a missing-image symbol in its place."
ref = "Edit View › Images › Adding Images"
status = "handbook"
notes = "Documented, not yet observed. Every save into another folder, the first save included, rewrites the image paths relative to the new file; undo and redo afterwards give the steps they restore paths relative to the new file too. Edit View draws a stored path that does not resolve, or a file that cannot be decoded, as a square with a cross at the image's position; a format kept as a reference but not decoded (PSD) as the square with the format's name."
guesses = [
  "A file outside the document's folder is stored with a path that climbs out of it (`../scans/A.png`), as the handbook says only a relative path is stored. Settled by adding an image from another folder in the reference and reading the saved path.",
  "An image added to a document that has never been saved keeps its absolute path until the first save, which rewrites it relative to the new file. Settled by adding an image to an untitled document in the reference and saving it.",
  "A stored path that names a network share or a device (`\\\\host\\share`, `//host/share`, `\\\\?\\`, `\\\\.\\`) is never read, on every platform, and the image counts as unreadable; absolute paths and paths climbing out with `..` are read. Settled by opening, in the reference, a file whose image path names a network share.",
]
observe = [
  "Image font: save, move H.png away and reopen the file; note how the missing image is drawn and whether a message appears.",
  "Image font: add an image from a folder beside the document's folder, save, and read the stored imagePath.",
]

