[[behavior]]
id = "preview.singleLine"
area = "proofing"
milestone = "M5"
summary = "The Preview Area and Preview Panel put the complete text of the active tab on one line, without wrapping, with the current glyph centred by default."
ref = "Edit View › Previewing & Testing › Previewing Interpolated Instances"
status = "handbook"

[[behavior]]
id = "preview.doubleClickEdits"
area = "proofing"
milestone = "M5"
summary = "Double-clicking a glyph in the preview makes it the glyph being edited in Edit View."
ref = "Edit View › Previewing & Testing › Previewing Interpolated Instances"
status = "handbook"

[[behavior]]
id = "preview.dashFollowsMaster"
area = "proofing"
milestone = "M9"
summary = "With the dash chosen in the instance pop-up, the preview is not interpolated: it mirrors whatever master Edit View is showing."
ref = "Edit View › Previewing & Testing › Previewing Interpolated Instances"
status = "handbook"

[[behavior]]
id = "preview.respectsInstanceData"
area = "proofing"
milestone = "M9"
summary = "Instance previews take intermediate and alternate layers into account and apply some, not all, of the instance's custom parameters. The handbook does not list which."
ref = "Edit View › Previewing & Testing › Previewing Interpolated Instances"
status = "handbook"

[[behavior]]
id = "preview.panelBlankWithoutEditTab"
area = "proofing"
milestone = "M5"
summary = "The Preview Panel is empty while the front tab is not an Edit View tab and fills in immediately when one is activated."
ref = "Edit View › Previewing & Testing › Previewing Interpolated Instances"
status = "handbook"

[[behavior]]
id = "proofing.systemFontCache"
area = "proofing"
milestone = "M12"
summary = "Operating systems and apps cache installed fonts, so a re-exported font may not show up until the testing app is quit and reopened. The reference's remedy is a Test Install option in the OTF export dialog, which activates the font from memory without writing a file; a restart of the testing app can still be needed."
ref = "Edit View › Previewing & Testing › Previewing on macOS"
status = "handbook"

[[behavior]]
id = "proofing.adobeFontsFolder"
area = "proofing"
milestone = "M12"
summary = "Exporting OTFs into /Library/Application Support/Adobe/Fonts (created by hand if absent) makes them available at once in Adobe apps only, bypassing the system font cache and showing all positioning features and the style menu order. Each export overwrites the previous file; the apps may need one restart the first time the folder is used."
ref = "Edit View › Previewing & Testing › Previewing in Adobe Applications"
status = "handbook"

[[behavior]]
id = "proofing.webfontPreview"
area = "proofing"
milestone = "M12"
summary = "Checking .woff2 (and optionally .woff for old browsers) in the export dialog writes webfonts that can be tested from a small HTML page with an @font-face rule. Reloading shows the new export, and a Shift-reload skips most browsers' font cache."
ref = "Edit View › Previewing & Testing › Previewing in Web Browsers"
status = "handbook"

[[behavior]]
id = "proofing.composerDifferences"
area = "proofing"
milestone = "M12"
summary = "Layout engines differ: the handbook warns that the same OpenType features can be applied differently by the different text composers of one layout application, so proofing must happen in the target software."
ref = "Edit View › Previewing & Testing › Previewing OpenType Features"
status = "handbook"
