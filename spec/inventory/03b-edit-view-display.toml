[[tool]]
id = "measurement"
label = "Measurement"
shortcut = "L"
group = ""
gestures = [
  "select the tool: show X/Y coordinates of every node and anchor and the deltas between on-curve nodes",
  "drag: draw a ruler that labels the distance between each pair of consecutive outline crossings",
  "Shift+drag: constrain the ruler to horizontal or vertical",
  "G while dragging: leave a measurement guide where the ruler is",
  "drag in text mode with the measurement line shown: move the measurement line to that height",
  "hold Cmd: temporary Select tool",
  "hold Cmd+Ctrl+Alt with any other tool: temporary Measurement tool (coordinates and ruler)",
  "off the Mac, hold Ctrl+Alt+Shift with any other tool: temporary Measurement tool",
]
area = "drawing"
milestone = "M3"
summary = "Read-only tool for coordinates and distances. It labels all points of every glyph visible in the tab and measures along a dragged ruler, showing the ruler's angle at its end."
ref = "Edit View › Measuring › Measurement Tool"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 10:31 and 29:27: with the Measurement tool active, every node and handle is labelled with its X and Y, and the deltas between consecutive on-curve nodes appear in red as dx, dy pairs. Not shown: the ruler drag, Shift, G, the temporary-tool keys. Built in M3.9; M3.21 added every glyph of the line and the temporary tools: Cmd held in the Measurement tool gives the Select tool and Cmd+Ctrl+Alt held in another tool gives the Measurement tool, as the handbook documents (not yet observed)."
guesses = [
  "The ruler's ends snap unless Ctrl is held, and Shift keeps it horizontal or vertical, whichever is nearer.",
  "The ruler stays until the next press, Escape or a tool change (03b question 9).",
  "G with any modifiers adds the measurement guide.",
  "A tool held with modifiers waits for a gesture in progress to end before it takes over or gives way, and its ruler goes when it gives way.",
  "The held tool does not see the keys that hold it, so the held Measurement tool's ruler snaps and the held Select tool clicks as a plain click.",
  "Cmd+Ctrl+Alt does not hold the Measurement tool in the Text tool, where the same keys move the measurement line.",
  "Off the Mac the Measurement tool is held with Ctrl+Alt+Shift: the Control key there also reports Command, the Windows and Super keys do not reach the app, and Ctrl+Alt alone is AltGr and the Select tool's mirror drag. The held ruler then cannot be constrained with Shift. The reference app runs only on the Mac, so no source settles it.",
  "Off the Mac, Ctrl+Alt in the Measurement tool holds nothing, since it may be AltGr; on the Mac Cmd+Alt there keeps the Select tool held, and the held Select tool still sees Ctrl.",
]
observe = [
  "Hold Cmd+Alt+Ctrl in the Draw tool: the coordinates show; drag a ruler, let the keys go during the drag and see whether the ruler stays.",
  "Hold Cmd in the Measurement tool and click a node: it is selected as with the Select tool.",
  "Hold Cmd in the Measurement tool, add Option, and Option-drag a node: note whether the Select tool stays and copies the node.",
  "Hold Cmd+Alt+Ctrl+Shift in the Draw tool and drag a ruler: note whether the ruler is constrained, which tells whether an extra Shift belongs to the held tool.",
]

[[command]]
id = "measure.ruler"
label = "Measure Along Line"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: foreground|background, from?: [x, y], to?: [x, y], guide?: {scope: local|global, index}, placements?: [{glyph, layer?, side?, x, y}]} → {crossings, gaps, length?, angle?}"
area = "drawing"
milestone = "M3"
summary = "Query returning the points where a line segment, or the whole line of a guide, crosses the layer's outlines and components, the distances between consecutive crossings with X deltas also relative to the italic angle, and the line's angle. Headless form of dragging a ruler with the Measurement tool and of the numbers a measurement guide prints; overlapping regions are treated as merged."
ref = "Edit View › Measuring › Measurement Tool"
status = "inferred"
notes = "Each gap says whether it lies inside the outline (a stem) or outside (a counter)."
guesses = [
  "Crossings follow the nonzero winding rule, and a line that only touches a contour does not cross it; the handbook does not say how the reference merges overlapping contours.",
  "Components are measured like paths, and the ruler stays until the next click or tool change (03b question 10).",
  "With placements, the outlines of all glyphs are merged together, so two glyphs that overlap measure as one shape; a ruler across two kerned glyphs that collide would settle it.",
]

