# ───────────────────────────── Images ─────────────────────────────

[[command]]
id = "glyph.addImage"
label = "Add Image…"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{files: [path], glyphs?: [names], layer?: id, side?: \"foreground\" | \"background\"}"
area = "color"
milestone = "M11"
summary = "Places an image file on a glyph layer. With one file it goes on the given (or selected) glyph's layer; with several files each is matched to the glyph of the same name without extension and goes on that glyph's current-master layer. The image is put at the layer origin and sized so that one typographic point of the image equals one font unit. Only a path relative to the document is stored, not the image data."
ref = "Edit View › Images › Adding Images"
status = "handbook"
notes = "Documented, not yet observed. With `glyphs`, one file goes on each named glyph; without, every file is matched by name, so one file with no glyph named works like a batch of one. A relative path in `files` is relative to the document's folder (to the working directory for a document never saved). The whole call is one undo step, and a file that cannot be read, is not an image or would replace a locked image refuses it."
guesses = [
  "A stored image path that starts with two separators (`//host/share`, `\\\\host\\share`) is refused on every platform, not only on Windows: a document comes from anywhere, and on other systems such a path is either a network share or one whose meaning the system decides. Settled by opening, in the reference app on a Mac, a file whose image path starts with `//`.",
  "Two files that name the same glyph (A.png and A.jpg) refuse the call instead of one winning. Settled by Add Image with both files in the reference.",
  "A layer holds one placed image, as the version 3 format stores one: Add Image on a layer that has an image replaces it. Image shapes of the version 4 format are read, drawn and written back but not created. Settled by adding a second image to a glyph in the reference and reading the saved file.",
]
observe = [
  "Image font: add a second image to H; note whether it replaces the first or both stay, and how the file stores them.",
  "Image font: in Font View, Add Image with H.png and H.jpg together; note which one H receives and any message.",
]

[[command]]
id = "image.setTransform"
label = "Set Image Transform"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, side?: \"foreground\" | \"background\", x?: number, y?: number, width?: number, height?: number, rotation?: degrees}"
area = "color"
milestone = "M11"
summary = "Sets position, displayed size and rotation of the layer's image, as the image fields of the Info box do. The same values change when the image is dragged, resized with the bounding box or Scale tool, turned with the Rotate tool or transformed from the Palette."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"
notes = "Documented, not yet observed. The glyph is a required parameter, as commands take explicit targets; `side` addresses the background's image. A transform stored as a matrix with shear can only be moved."
guesses = [
  "Width and height are the size of the whole image, so a crop does not change them. Settled by cropping an image in the reference and reading the Info box.",
  "Width and height are the displayed size in font units; rotation turns the image about its position point (its bottom-left corner before rotation), as the stored `pos`, `scale` and `angle` suggest. Settled by rotating an image in the reference's Info box and reading the saved file.",
]
observe = [
  "Image font: type a rotation in the image Info box and save; note the pivot of the rotation and the stored pos, scale and angle values.",
  "Image font: crop H's image, then read the width and height in the Info box; note whether they are the whole image's or the cropped part's.",
]

