status = "handbook"

[[behavior]]
id = "background.everyLayerHasOne"
area = "layers"
milestone = "M1"
summary = "Each glyph layer owns exactly one background layer that can hold paths and components. It is scratch space and a comparison copy and is not part of the exported outline."
ref = "Edit View › Background"
status = "handbook"

[[behavior]]
id = "background.outlineDisplay"
area = "layers"
milestone = "M3"
summary = "With Show Background on, the inactive side is drawn as a faint red outline behind the active side. The colour comes from the Appearance settings."
ref = "Edit View › Background"
status = "handbook"

[[behavior]]
id = "background.snapping"
area = "guides-metrics"
milestone = "M3"
summary = "While the background is displayed, its nodes and outlines are snapping targets for edits on the active side."
ref = "Edit View › Background"
status = "handbook"

[[behavior]]
id = "background.darkenedCanvas"
area = "layers"
milestone = "M3"
summary = "The Edit View canvas darkens a little while the background is the side being edited, as a mode indicator."
ref = "Edit View › Background"
status = "handbook"

[[behavior]]
id = "background.usedByFilters"
area = "path-ops"
milestone = "M3"
summary = "Some filters, Hatch Outline being the named example, keep the untouched original in the background so they can be re-run non-destructively."
ref = "Edit View › Background"
status = "handbook"

# ───────────────────────────── Entering text ─────────────────────────────

