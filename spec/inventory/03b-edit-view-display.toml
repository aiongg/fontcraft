[[behavior]]
id = "proofing.systemFontCache"
area = "proofing"
milestone = "M14"
summary = "Operating systems and apps cache installed fonts, so a re-exported font may not show up until the testing app is quit and reopened. The reference's remedy is a Test Install option in the OTF export dialog, which activates the font from memory without writing a file; a restart of the testing app can still be needed."
ref = "Edit View › Previewing & Testing › Previewing on macOS"
status = "handbook"
notes = "Moved from M12 to M14 by the M12 planning pass: testing advice that belongs with Test Install and the export destination (export.testInstall, M14), not with the command-line tools; docs/plans/M12.md § 7, question 2."

[[behavior]]
id = "proofing.adobeFontsFolder"
area = "proofing"
milestone = "M14"
summary = "Exporting OTFs into /Library/Application Support/Adobe/Fonts (created by hand if absent) makes them available at once in Adobe apps only, bypassing the system font cache and showing all positioning features and the style menu order. Each export overwrites the previous file; the apps may need one restart the first time the folder is used."
ref = "Edit View › Previewing & Testing › Previewing in Adobe Applications"
status = "handbook"
notes = "Moved from M12 to M14 by the M12 planning pass: testing advice that belongs with Test Install and the export destination (export.testInstall, M14), not with the command-line tools; docs/plans/M12.md § 7, question 2."

[[behavior]]
id = "proofing.webfontPreview"
area = "proofing"
milestone = "M12"
summary = "Checking .woff2 (and optionally .woff for old browsers) in the export dialog writes webfonts that can be tested from a small HTML page with an @font-face rule. Reloading shows the new export, and a Shift-reload skips most browsers' font cache."
ref = "Edit View › Previewing & Testing › Previewing in Web Browsers"
status = "handbook"
notes = "In M12 the test page is the HTML proof (format proof-html, `fontcraft-cli proof --format html`, built in M12.35): one file with the WOFF2 embedded as a data URL, so it needs no separate font file next to it and a reload after a new proof shows the new font. The handbook's page instead loads the exported .woff2 by URL. Documented, not yet observed."
observe = ["Any font: export WOFF2 alone, then WOFF2 with WOFF; note whether the app writes an HTML test page itself or only the font files."]

[[behavior]]
id = "proofing.composerDifferences"
