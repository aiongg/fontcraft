shortcut = "Cmd+Alt+J"
kind = "engine"
params = "{glyphs?: [names], layer?: id, selection?: [ids]}"
area = "layers"
milestone = "M3"
summary = "Alt variant of Selection to Background: copies the selection into the background and keeps what is already there."
ref = "Edit View › Background"
status = "handbook"

[[command]]
id = "path.swapWithBackground"
label = "Swap with Background"
menu = ["Path"]
shortcut = "Cmd+Ctrl+J"
kind = "engine"
params = "{glyphs?: [names], layer?: id}"
area = "layers"
milestone = "M3"
summary = "Exchanges the full contents of the foreground and the background of the layer."
ref = "Edit View › Background"
status = "handbook"

[[command]]
id = "path.clearBackground"
label = "Clear Background"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], layer?: id}"
area = "layers"
milestone = "M3"
summary = "Empties the background layers of the selected glyphs. In the reference it only appears in the Path menu while Alt is held; which entry it replaces is not stated."
ref = "Edit View › Background"
status = "handbook"

[[command]]
id = "path.assignBackground"
label = "Assign Background"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], source: fontPath|documentId, master?: id}"
area = "layers"
milestone = "M3"
summary = "Copies outlines from another font file into the background of every selected glyph; we assume glyphs are matched by name, which the handbook does not say. Choosing the font itself as the source snapshots the current outlines so later edits can be compared against them."
