guesses = [
  "Leaving text mode makes the Select tool active, and returning puts the text cursor before the glyph that was edited (at the end of the text, when the last glyph was edited, the cursor stays at the end); no source names either, and the toolbar after Escape, in the running app or a video, settles it.",
]

[[command]]
id = "editView.insertText"
label = "Insert Text"
menu = []
shortcut = ""
kind = "ui"
params = "{tab?: id, text?: string, chars?: string, glyphs?: [names], at?: index, replace?: [start, end]}"
area = "edit-text"
milestone = "M5"
summary = "Inserts characters or named glyphs into the tab's string at the text cursor or a given index. This is what typing and pasting do; characters map to glyphs through their Unicode values."
ref = "Edit View › Entering Text › Text Tool"
status = "handbook"
notes = "The tab text is view state that the shell holds, as the tab glyph list has been since M3, so this is a shell command (docs/plans/M5.md § 3). A glyph without a character is written `/name`, as the reference writes it into the display strings of the files it saves (`/Smily`, `/_part.test` in corpus files). `text` reads that form; `chars` takes every character as typed (what typing and pasting insert), a line break as a line break. Without `at` or `replace` the items take the place of the selection."
guesses = [
  "A `/name` escape ends at the next slash, space or line break, and one space after it is consumed; the corpus files show the escape but not how it ends.",
]

