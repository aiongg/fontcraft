# ───────────────────────────── Entering text ─────────────────────────────

[[tool]]
id = "text"
label = "Text"
shortcut = "T"
group = ""
gestures = [
  "select the tool: enter text mode with a text cursor in the tab's string",
  "type: insert the glyphs for the typed characters at the cursor",
  "Left / Right / Up / Down: move the text cursor",
  "Escape: toggle between text mode and editing the current glyph",
  "Home / End: replace the current glyph with the previous / next glyph of the font",
  "Shift+Home / Shift+End: same, stepping through the glyphs currently listed in Font View",
  "click: place the text cursor at the nearest item boundary; drag or Shift+click: select",
  "double-click on a glyph: edit it, with the Select tool",
  "Cmd+Ctrl+Alt+click or drag: set the height of the measurement line",
]
area = "edit-text"
milestone = "M5"
summary = "Switches Edit View to text mode, where the tab holds an editable string of glyphs: a character, a word, a sentence or several lines. Standard text editing applies (cursor keys, selection, cut, copy, paste to and from other apps). The glyph that follows the cursor counts as the current glyph."
ref = "Edit View › Entering Text › Text Tool"
status = "handbook"
notes = "Documented, not yet observed. The tool and the tab's text mode go together: choosing the Text tool puts the tab in text mode, choosing any other tool ends it, and a tab shown in text mode has the Text tool. In text mode, letters type instead of choosing tools; Backspace and Delete remove the selection or the item before or after the cursor; Shift with an arrow extends the selection and Cmd+A selects the whole text; Home and End (Shift: as Font View lists the glyphs) run editView.previousGlyph and editView.nextGlyph. The spacing and kerning shortcuts (`when = textMode`) take their targets from the cursor."
guesses = [
  "Return types a line break; the handbook allows several lines but does not name the key.",
  "Up and Down move to the nearest place on the line above or below, and to the start or the end of the text from the first or the last line; in right-to-left text Left steps forward in the text; in top-to-bottom text Up and Down step along the column and Left and Right move between columns. Moving the cursor in such texts in the reference app settles it.",
  "Backspace and Delete with Alt or Cmd do nothing (no word or line deletion); no source names them.",
]

[[command]]
