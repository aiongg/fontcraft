ref = "Edit View › Annotating"
status = "handbook"

# ───────────────────────────── Images ─────────────────────────────

[[command]]
id = "glyph.addImage"
label = "Add Image…"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyphs?: [names], layer?: id, path: file}"
area = "color"
milestone = "M11"
summary = "Places an image file on the layer of the selected glyph. The image is put at the layer origin and sized so that one typographic point of the image equals one font unit. Only a path relative to the document is stored, not the image data."
ref = "Edit View › Images › Adding Images"
status = "handbook"

[[command]]
id = "image.setTransform"
label = "Set Image Transform"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, x?: number, y?: number, width?: number, height?: number, rotation?: degrees}"
area = "color"
milestone = "M11"
summary = "Sets position, displayed size and rotation of the layer's image, as the image fields of the Info box do. The same values change when the image is dragged, resized with the bounding box or Scale tool, turned with the Rotate tool or transformed from the Palette."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[command]]
id = "image.revealFile"
label = "Reveal Image File"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph?: name, layer?: id}"
area = "color"
milestone = "M11"
summary = "Shows the image's source file in the system file manager. It is the right-pointing arrow in the image Info box."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[command]]
id = "image.lock"
label = "Lock Image"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id}"
area = "color"
milestone = "M11"
summary = "Locks the layer's image so it can no longer be selected, moved or transformed. Bound to the lock icon in the image Info box."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[command]]
id = "image.unlock"
label = "Unlock Image"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id}"
area = "color"
milestone = "M11"
summary = "Makes a locked image selectable and editable again. Since selection is impossible for a locked image, the reference offers this only in the context menu opened by right-clicking the image."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[command]]
id = "image.setCrop"
label = "Crop Image"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, rect: [x, y, width, height]}"
area = "color"
milestone = "M11"
summary = "Limits the visible part of the image to a rectangle. In the reference this is done by dragging one of the image's handles with Ctrl+Alt held; the coordinate space of the stored crop is not documented."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[command]]
id = "image.setCropToLayerBounds"
label = "Set Crop to Layer Bounds"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id}"
area = "color"
milestone = "M11"
summary = "Trims the image so that it ends at the layer bounds. Offered in the image's context menu; what exactly counts as the layer bounds (advance width by vertical metrics, or outline bounds) is not spelled out."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[command]]
id = "image.resetCrop"
label = "Reset Crop"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id}"
area = "color"
milestone = "M11"
summary = "Removes the crop so the whole image is shown again. Offered in the image's context menu."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[command]]
id = "image.getInfo"
label = "Get Image Info"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id}"
area = "color"
milestone = "M11"
summary = "Query returning the layer image's stored path, whether the file resolves, its position, size, rotation, crop and lock state."
ref = "Edit View › Images › Manipulating Images"
status = "inferred"

[[panel]]
id = "editView.imageContextMenu"
label = "Image context menu"
location = "window"
controls = ["Unlock Image (locked images)", "Set Crop to Layer Bounds", "Reset Crop"]
area = "color"
milestone = "M11"
summary = "Entries added to the canvas context menu when it is opened on a placed image."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[behavior]]
id = "image.supportedFormats"
area = "color"
milestone = "M11"
summary = "The reference accepts every image type its operating system can decode and names JPEG, PNG, PDF, TIFF and PSD. FontCraft must decide which of these it decodes itself on every platform."
ref = "Edit View › Images › Adding Images"
status = "handbook"

[[behavior]]
id = "image.dragAndDrop"
area = "color"
milestone = "M11"
summary = "Dropping an image file on a glyph cell in Font View or on a glyph in Edit View places it on that glyph's layer, the same as Glyph > Add Image…."
ref = "Edit View › Images › Adding Images"
status = "handbook"

[[behavior]]
id = "image.storedAsRelativePath"
area = "color"
milestone = "M11"
summary = "The document records only the image's path relative to the font file. If the file has moved or the path no longer resolves, the canvas shows a missing-image symbol in its place."
ref = "Edit View › Images › Adding Images"
status = "handbook"

[[behavior]]
id = "image.alwaysShownForEmptyGlyphs"
area = "color"
milestone = "M11"
summary = "A glyph with neither paths nor components shows its image even when View > Show Image is off."
ref = "Edit View › Images › Adding Images"
status = "handbook"

[[behavior]]
id = "image.ignoredAtExport"
area = "color"
milestone = "M11"
summary = "Placed images are left out of exported fonts, except when a bitmap colour font such as sbix is being produced."
ref = "Edit View › Images › Adding Images"
status = "handbook"

[[behavior]]
id = "image.defaultPlacement"
area = "color"
milestone = "M11"
summary = "A newly placed image sits at the layer origin, scaled so that one DTP point of the image maps to one font unit."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[behavior]]
id = "image.directManipulation"
area = "color"
milestone = "M11"
summary = "A selected image can be dragged to move it, resized with the bounding box or the Scale tool, rotated with the Rotate tool and transformed with the Transformations palette. Ctrl+Alt+dragging a handle crops instead of resizing."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

[[behavior]]
id = "image.lockedNotSelectable"
area = "color"
milestone = "M11"
summary = "A locked image ignores clicks and drags and is skipped by selection and transformation; only the context menu's Unlock Image reaches it."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"

