summary = "With the Measurement tool, on-curve coordinates are printed in blue, off-curve coordinates in green and the X/Y deltas between neighbouring on-curve nodes in red."
ref = "Edit View › Measuring › Measurement Tool"
status = "handbook"

[[behavior]]
id = "measurement.italicCorrectedDelta"
area = "drawing"
milestone = "M3"
summary = "The X deltas shown by the Measurement tool are taken relative to the master's italic angle, so a segment that runs exactly along the italic angle reports an X delta of zero."
ref = "Edit View › Measuring › Measurement Tool"
status = "handbook"

[[behavior]]
id = "measurement.rulerAngle"
area = "drawing"
milestone = "M3"
summary = "The ruler shows its angle at its end point in counterclockwise degrees, with 0 meaning a ruler dragged straight up."
ref = "Edit View › Measuring › Measurement Tool"
status = "handbook"

[[behavior]]
id = "measurement.allVisibleGlyphs"
area = "drawing"
milestone = "M3"
summary = "Coordinates and rulers of the Measurement tool cover every glyph shown in the Edit View tab, not only the active one, and a ruler may cross several glyphs."
ref = "Edit View › Measuring › Measurement Tool"
status = "handbook"

[[behavior]]
id = "measurement.overlapsIgnored"
area = "drawing"
milestone = "M3"
summary = "Rulers and measurement guides measure the merged shape: crossings that lie inside an overlap of paths are skipped. Such overlapped stretches are drawn light grey to show they will vanish when overlaps are removed at export."
ref = "Edit View › Measuring › Measurement Guides"
status = "handbook"

[[behavior]]
id = "measurement.guidesAlwaysOn"
area = "guides-metrics"
milestone = "M3"
summary = "A guide in measurement mode prints the distances between its crossings with outlines and components whenever guides are visible, whichever tool is active."
ref = "Edit View › Measuring › Measurement Guides"
status = "handbook"

[[behavior]]
id = "measurementLine.semantics"
area = "spacing-kerning"
milestone = "M5"
summary = "The measurement line reports sidebearings at one height only: the gap between each side of the advance width and the first place the line meets the outline, ignoring the shape above and below."
ref = "Edit View › Measuring › Measurement Line"
status = "handbook"

[[behavior]]
id = "measurementLine.display"
area = "spacing-kerning"
milestone = "M5"
summary = "In measurement mode thin grey vertical lines mark each glyph's advance width, negative kerning is shaded light blue and positive kerning yellow. Both kerning colours are settings."
ref = "Edit View › Measuring › Measurement Line"
status = "handbook"

[[behavior]]
id = "measurementLine.textToolOnly"
area = "spacing-kerning"
milestone = "M5"
summary = "The View Options list says the measurement line is visible only while the Text tool is active, while the Measuring section also lets the Measurement tool drag it; treat it as shown in text mode and adjustable with either tool."
ref = "Edit View › Glyph Display › View Options; Edit View › Measuring › Measurement Line"
status = "handbook"

# ───────────────────────────── Annotating ─────────────────────────────

[[tool]]
id = "annotation"
label = "Annotation"
shortcut = "A"
group = ""
gestures = [
  "select the tool: the Info box becomes the annotation palette",
  "Cmd+A: select all annotations on the active layer",
  "arrow keys: move selected annotations by 1 unit",
  "Shift+arrow keys: move by 10 units",
  "Cmd+arrow keys: move by 100 units",
  "Delete: remove the selected annotations",
]
area = "drawing"
milestone = "M3"
