[[behavior]]
id = "image.directManipulation"
area = "color"
milestone = "M11"
summary = "A selected image can be dragged to move it, resized with the bounding box or the Scale tool, rotated with the Rotate tool and transformed with the Transformations palette. Ctrl+Alt+dragging a handle crops instead of resizing."
ref = "Edit View › Images › Manipulating Images"
status = "handbook"
notes = "Documented, not yet observed. A click on the image with the Select tool selects it alone, where no other object lies. Dragging it runs `image.setTransform` with `x` and `y`; its knobs (shown while Show Bounding Box is on, as for other selections) run it with `x`, `y`, `width` and `height` about the opposite knob (Shift: proportional; Alt: about the centre); Ctrl+Alt on a knob runs `image.setCrop`, in whole pixels within the image. With the image selected and nothing else, the Rotate tool turns it about the centre of its shown part (Shift: steps of 90°) and the Scale tool scales it about that centre (Shift: proportional). Each drag is one undo step. Scaling along the image's own axes keeps a rotated image rectangular. While the image is selected, the arrow keys run `selection.move` with `image: true` by the font's increments (plain, Shift, Cmd), Delete or Backspace runs `edit.delete` with `image: true`, and the Palette's mirror, scale, rotate and slant buttons run their commands with `image: true`, about the box of the image's shown part when the origin is a box point. Not yet: the Scale and Rotate tools' reference point."
guesses = [
  "The image's knobs are the bounding box's, so they show only while Show Bounding Box is on, and cropping needs them too. Settled by selecting an image in the reference with Show Bounding Box off and Ctrl+Alt-dragging its corner.",
  "Shift while moving the image keeps the larger of the horizontal and vertical moves. Settled by Shift-dragging an image in the reference.",
  "A crop drag snaps the crop to whole image pixels. Settled by cropping an image in the reference and reading the saved crop.",
  "The Rotate and Scale tools turn and scale a selected image about the centre of its shown part, ignoring a placed reference point. Settled by placing a reference point and rotating an image with the Rotate tool in the reference.",
  "The arrow keys move a selected image by the steps they move nodes by (1, Shift 10, Cmd 100); Option and Ctrl+Option change nothing for an image. Settled by pressing the arrow keys with an image selected in the reference.",
  "A box origin of the Transformations palette is measured on the image's shown part (its crop), not on the whole image. Settled by cropping an image and scaling it from the palette in the reference.",
]
observe = [
  "Image font: select H's image and press the arrow keys, with and without Shift and Cmd; note the steps. Press Delete; note whether the image goes.",
  "Image font: crop H's image, select it and click Scale in the Transformations palette with the centre origin; note the point that stays fixed.",
  "Image font: select H's image and drag it; drag a corner knob with and without Shift; note what stays fixed.",
  "Image font: Ctrl+Alt-drag a corner of H's image; note the crop and whether it snaps to pixels.",
  "Image font: rotate H's image with the Rotate tool; note the pivot.",
]

