[[behavior]]
id = "textPreview.shaping"
area = "proofing"
milestone = "M8"
summary = "Text Preview shapes its text as an application would: every feature that a shaper turns on by default for the script applies, positioning features included, with the generated kerning and mark attachment of the master or instance shown."
ref = "Edit View › Entering Text › Text Preview"
status = "handbook"
notes = "Documented, not yet observed. The reference uses the operating system's shaper; FontCraft uses its own (M8 planning pass, `docs/plans/M8.md` § 3): a full preview font of the shown master (`GSUB` and `GPOS`, generated kerning and marks included) built on a thread of its own, or taken from `font.features.compile` when it built the same document revision and master (one compile of the feature code per revision serves both), harfrust with the script's default features and no others, each run of one bidirectional level shaped in its own direction (`crates/textlayout/src/line_shape.rs`). Advances come live from the model. Lines break on widths shaped through the same font (row `textPreview.lineBreaking`), then the lines in view and up to two screens around them are shaped. Vertical text is shaped top to bottom through the same font, measured before its columns break and shaped column by column (`vertical_features` in `crates/textlayout/src/line_shape.rs`): the shaper's vertical defaults (`vert`, the mark features), `vkrn`, and `vrt2` in place of `vert` when the font has `vrt2`; vertical advances and origins come live from the model (`crates/textlayout/src/live.rs`), and the model's vertical kerning, which the compiled font does not hold, adds to the shaped advances. Until the font is built, and when it cannot be built, the text is laid out by code point and the reason shows under it."
guesses = [
  "The preview's font is rebuilt from the current feature code, kerning and anchors after edits, once editing pauses for half a second, without pressing Compile; editing a feature without compiling while the reference app's Text Preview is open would settle it.",
  "Text is split into script runs by Script_Extensions, and characters without a script (Common, Inherited, unassigned and private-use) stay in the run around them, so a glyph typed by name is shaped with its neighbours; typing a glyph name between two letters that form a contextual substitution in the reference app would settle it.",
  "Vertical text is shaped with the shaper's vertical defaults plus `vkrn`, and with `vrt2` instead of `vert` when the font has `vrt2`; `vpal`, `vhal` and `valt` stay off, as horizontal text keeps optional features off. A font with `vrt2`, `vpal` and `vhal` in the reference app's vertical Text Preview would settle it.",
  "In vertical text a glyph without a vertical width advances by the ascender minus the descender, one without a vertical origin hangs from the ascender, and the document's vertical kerning applies on top of the compiled `vkrn` (the compiled font holds none of it). A vertical font with vertical kerning in the reference app's Text Preview would settle it.",
  "While a new font is built, the text stays shaped with the last font built for the same master; when the feature code does not compile, the text is laid out by code point with the compiler's message under it. Breaking a feature in the reference app while Text Preview is open would settle what it shows.",
]
observe = [
  "In F1 (Latin features), edit a feature without pressing Compile while Text Preview shows text the feature affects: note whether the preview follows the edit, and when.",
]

[[behavior]]
id = "textPreview.unicodeBidi"
area = "proofing"
milestone = "M8"
summary = "Text Preview orders mixed right-to-left and left-to-right text by the Unicode Bidirectional Algorithm (UAX #9), as the operating system's text system does, replacing M5's simple run rules."
ref = "Edit View › Entering Text › Text Preview"
status = "handbook"
notes = "Documented, not yet observed. Settles the M5 guesses on `textPreview.setWritingDirection` about digits and neutral characters. UAX #9 through unicode-bidi (`crates/textlayout/src/bidi.rs`): each line break ends a paragraph; a range with its own direction is an embedding (LRE or RLE … PDF), closed at each line break and opened again after it; levels come from the whole paragraph, and each line resets its trailing blanks and reverses its runs (rules L1 and L2). \"12 34\" in right-to-left text reads \"34 12\"."
guesses = [
  "A paragraph separator inside a line (U+2029) starts a new bidirectional paragraph whose runs follow the line's earlier runs, each paragraph ordered on its own; pasting text with U+2029 into the reference app's Text Preview would settle it.",
  "Every paragraph takes the text's base direction (set, or from the text's first letter), not its own first strong character; a text whose second paragraph starts in the other script, in the reference app, would settle it.",
  "A range set to the paragraph's own direction is an embedding too, one or two levels up as UAX #9 gives it, which changes only how neutral characters at its edges resolve; the reference app's Writing Direction on such a range would settle it.",
]
observe = [
  "In F2 (Arabic), type \"12 34\" inside right-to-left text in Text Preview: note the order of the digits.",
]

[[behavior]]
id = "textPreview.lineBreaking"
area = "proofing"
milestone = "M8"
summary = "Text Preview wraps its lines at the width of the window where the Unicode Line Breaking Algorithm (UAX #14) allows a break, measuring the text as shaped, as the operating system's text system does."
ref = "Edit View › Entering Text › Text Preview"
status = "handbook"
notes = "Documented, not yet observed: the handbook says the field draws through the operating system's text engine, whose text views wrap words at the view's width. UAX #14 in `crates/textlayout/src/linebreak.rs`, with the Line_Break classes of icu_properties: a line may end after spaces and hyphens and between ideographs, never before closing punctuation, an exclamation mark or small kana. Hard line breaks (a line break, U+2028) always end a line, and spaces at the end of a line hang past the width. The paragraph's bidirectional levels are resolved first, the lines are broken, then each line is reordered (UAX #9). Widths come from the full preview font (`crates/textlayout/src/measure.rs`), so kerning and substitutions decide where a line ends; until the font is built, and when it cannot be built, the glyphs' own widths and the document's kerning do."
guesses = [
  "A word wider than the line breaks before the cluster that overflows, never inside a cluster (a base and its marks, a ligature); a word wider than the reference app's Text Preview window would settle where it breaks.",
  "The text is measured in segments between break opportunities, so a kerning pair or a contextual substitution between a space and the next word does not move a break (the line is then shaped whole); a font with a space-to-letter kerning pair at a line end in the reference app would settle it.",
  "Korean breaks between syllables as UAX #14 gives it, not only at spaces; Korean text in the reference app's Text Preview would settle it.",
  "Thai, Lao, Khmer and Myanmar text break only at spaces and punctuation, without a dictionary; a long Thai sentence in the reference app would settle it.",
  "A soft hyphen allows a break, and no hyphen is drawn at the end of the line; text with soft hyphens in the reference app would settle it.",
]
observe = [
  "Type a long paragraph into Text Preview and narrow the window: note where lines end around a closing parenthesis after a space, a hyphenated word and a word wider than the window.",
]

