  "Shift+click: add to or remove from the selection",
]
area = "drawing"
milestone = "M3"
summary = "First sub-tool of the annotation palette; selects existing annotations so they can be moved or deleted."
ref = "Edit View › Annotating › Annotation Cursor"
status = "handbook"

[[tool]]
id = "annotationText"
label = "Text Annotation"
shortcut = ""
group = "annotation"
gestures = [
  "click: add a new text note at the pointer",
  "double-click a note: edit its text",
  "drag the handle on the right: change the width of the text box",
]
area = "drawing"
milestone = "M3"
summary = "Sub-tool that places text notes on the layer. A note can hold several lines and wraps to the box width."
