area = "proofing"
milestone = "M5"
summary = "Context-menu toggle of the Preview Area. On: the active glyph is kept in the horizontal centre. Off: the text is positioned to use the width as fully as possible, flush with the left or right edge."
ref = "Edit View › Previewing & Testing › Previewing Interpolated Instances"
status = "handbook"

