[[behavior]]
id = "text.displayStrings"
area = "edit-text"
milestone = "M5"
summary = "The texts of the open Edit View tabs are stored in the document as its display strings, one string per tab, with a glyph that has no character written as `/name`. Opening a document opens its tabs again from them."
ref = "GlyphsSDK file-format specification, versions 3 and 4 › DisplayStrings (UIState.plist in a package)"
status = "docs"
notes = "The owner's decision (docs/plans/M5.md § 7 question 4): opening a document opens one tab per stored string, and saving writes the open tabs in tab order. When the `Write DisplayStrings` custom parameter is false, saving writes none, as the reference does. The string format is built in M5.6 (`textlayout::parse`, `Text::to_display_string`): a space after `/name` ends the name and is dropped, as the handbook describes sample strings; the 45 display strings of the 21 corpus sources that have them read and write back unchanged. Built in M5.7a: File › Open opens the tabs, Save and Save As write the open tabs first, without an undo step and without marking the document modified. In `crates/ui` (`shell/tabs/upkeep.rs`) the same: File › Open and a URL that opens a file add one tab per string behind Font View, and Save and Save As write the open tabs of the active document first."
guesses = [
  "Changing a tab's text is not an undo step and does not mark the document modified; no source says, and the window's edited mark after typing in a tab of the reference app settles it.",
  "A `/` with an empty name is the slash character, and a glyph is written as the character it was typed as only while the font still maps that character to it; saving such a string in the reference app settles it.",
  "A `/name` the font lacks and a character no glyph encodes are kept in the text and take half the em with nothing drawn; opening such a string in the reference app settles it.",
  "A stored string over the 10,000-item tab limit opens cut to its first 10,000 items, with a warning in the log and the status bar, and a string that cannot be read (a `/name` longer than a glyph name may be) opens no tab; a file from the reference app with such a string settles it.",
  "Opening a document adds its tabs after the open ones and leaves Font View showing; opening a file with display strings in the reference app settles which tab shows.",
  "A tab is written as what it shows: its text while the canvas shows the text, else the one glyph it shows (picked in Font View after the text was typed); saving a file after picking another glyph into a tab of the reference app settles it.",
]

