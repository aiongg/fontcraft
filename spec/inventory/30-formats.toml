[[format]]
id = "nfnt"
label = "Mac OS bitmap font resources (NFNT, FONT)"
extensions = ["dfont", "bin", "rsrc", "suit"]
read = true
write = false
spec = "https://developer.apple.com/library/archive/documentation/mac/pdf/Text.pdf"
area = "import-export"
milestone = "M13"
summary = "The bitmap fonts of classic Mac OS: one `NFNT` (or older `FONT`) resource per size and style, grouped by a font family (`FOND`) resource, kept in a file's resource fork. Imported as one bitmap strike per size."
ref = "Inside Macintosh: Text › Font resources; More Macintosh Toolbox › Resource Manager"
status = "docs"
origin = "fontforge"
notes = "Reader built (M13.55f) in `crates/io-bitmap/src/nfnt.rs`, from Inside Macintosh (Text: the font record and the font family record; More Macintosh Toolbox: the resource fork layout), Apple's AppleSingle/AppleDouble description and the MacBinary II and III header descriptions; no code that reads these formats was consulted. Containers read: a plain file holding a resource fork (a fork copied out, or a `.dfont`), an AppleSingle or AppleDouble file (entry 2), and a MacBinary II or III file whose header checksum matches or that carries the MacBinary III signature (MacBinary I is not recognised). The first `FOND` names the family (its resource name, kept as `FAMILY_NAME`) and lists the strikes by point size, style and resource id; the plain-style strikes are read, smallest first, and styled ones are left out with a warning. Entries that repeat a size or a resource are dropped before their records are read, sizes above 32,767 points are left out with a warning, and a `FOND` that lists bitmap strikes but no plain-style one the file holds is refused. Without a `FOND`, or when it lists no bitmap strike or cannot be read (with a warning), every `NFNT` and `FONT` resource is read, a `FONT` id's low seven bits giving its point size. A strike's pixel size is its point size (Mac bitmap fonts are drawn at 72 dpi). Each character's bitmap is its column range of the font's bit image, cut to its rows that hold pixels; its left edge is `kernMax` plus its offset and its advance is its width entry. Codes are Mac OS Roman, mapped to Unicode; glyphs are named by their character for ASCII letters and digits, else `uniXXXX`; the missing-character glyph becomes `.notdef` without a code. Grey and colour fonts (font type depth bits) are refused, and so are character ranges outside 0..255, font rectangles above 1,024 pixels, image locations past the bit image, and tables or resources past their data. Limits: 1,024 resource types, 4,096 font resources and 64 strike records read per file, counting those dropped as repeats after reading. Reachable through `bitmap.importStrikes` (every strike) and `file.open` (glyphs and metrics from the smallest strike; the other strikes hold the bitmaps whose names it has). Documented, not yet checked against files the reference reads."
guesses = [
  "Only the first font family of a Mac file, and only its plain style, is read; a family's bold or italic strikes are separate fonts, not strikes. Opening a Mac suitcase with several styles in the secondary reference would settle it.",
  "A Mac strike without a font family record is taken to be its ascent plus descent pixels per em, with a warning; only the family record states the point size of an `NFNT`.",
  "Mac codes below 32 map to the same code points; a font that draws symbols there (such as command-key glyphs) gets control-character code points for them.",
  "Blank rows above and below a Mac character's bitmap are trimmed so its box is tight, as BDF and PCF boxes are; the record keeps every character as tall as the font rectangle.",
]

[[format]]
id = "sfd"
label = "FontForge Spline Font Database"
extensions = ["sfd", "sfdir"]
read = true
write = false
spec = "https://fontforge.org/docs/techref/sfdformat.html"
area = "import-export"
milestone = "M13"
summary = "ASCII keyword-and-value source file that starts with `SplineFontDB: <version>`: a font header, then `StartChar`…`EndChar` blocks with `SplineSet` contours, references, anchor points, hints and per-glyph kerning and substitutions that point at named lookups, then optional bitmap strikes; `.sfdir` is the same split into one file per glyph. Import covers outlines, references, anchors, metrics, layers, names and kerning as the public page describes them. That page says it can lag behind the program, whose source we may not read, so lookups and anything undescribed are skipped and reported."
ref = "FontForge documentation › Spline Font Database File Format (public docs only)"
status = "docs"
origin = "fontforge"
notes = "Built (M13.56) in `crates/io-sfd`, from FontForge's public pages \"Spline Font Database\" and \"Changes to the sfd format\" only (no code that reads or writes SFD was consulted). `read_sfd` takes a file's bytes, `read_sfdir` a folder's files (`font.props` and top-level `*.glyph`, ordered by glyph index). One master: family, PostScript and localised names (`LangName`, UTF-7), version, units per em (Ascent + Descent), ascender, descender, italic angle, creation date, comments, the absolute OS/2, hhea and underline values as master parameters, fsType, Panose and Use Typo Metrics as font parameters. Glyphs: code points (`Encoding`, `AltUni2`), width, vertical width, contours (`m`/`l`/`c` with point types; quadratic layers give quadratic segments, implied on-curve points are dropped), references (by glyph index, then code point), anchors, GDEF class, comment, colour; font layer 0 is the background, 1 the master layer, others extra layers by name. Kerning: `Kerns2` pairs and `KernClass2` classes in horizontal `kern` pair-positioning subtables, classes as kerning groups. Skipped and listed in the import's report, one entry per kind with a count and first line: lookups and their glyph data, contextual and AAT rules, stem hints, TrueType instructions and tables, the private dictionary, images, Spiro points, bitmap strikes, TeX, MATH, BASE and JSTF data, unknown keywords. Limits: 256 MiB per source, lines of 4 MiB, 10,000,000 points, 256 layers, 65,536 classes and 4,000,000 values per class table, 1,000,000 kerning pairs, 16,000,000 kerning values written (class values count once per member pair), 4,096 anchors per glyph, 500,000 points per glyph layer and 2,000,000 per glyph; code points beyond 1,024 per glyph are skipped and reported; multiple master sources are refused. File › Open and the CLI open `.sfd` files (by their `SplineFontDB:` header) and `.sfdir` folders (by `font.props`) view-only, as compiled fonts open, with each skipped kind as a warning; Save As writes another format. Documented, not yet checked against files the originating editor writes (it is not installed here)."
guesses = [
  "A contour is closed when its last point equals its first and open otherwise; the page does not say how an open contour is written. A file from the originating editor with an open path would settle it.",
  "In a quadratic layer a `c` line is read as a quadratic segment when both controls are the same point or are exactly two thirds of the way to one point; the page does not say how quadratic splines are written. A quadratic file from the editor would settle it.",
  "An on-curve point flagged 0x80 that lies halfway between two control points is dropped, so runs of quadratic control points come back. A TrueType-derived file from the editor would settle it.",
  "The point flags of a closed contour's start come from its `m` line, not from the line that returns to it. A file with a smooth start point would settle it.",
  "`Refer` and `Kerns2` glyph numbers are the third number of a glyph's `Encoding` line (its original position), or its position in the file when that is missing; a reference that matches no glyph falls back to its code point. Files with reordered glyphs would settle it.",
  "A glyph without a `Width` line is as wide as the em. A file with such a glyph would settle it.",
  "Anchor names follow the reference's convention: the class name for base and base-mark anchors, `_` before it for marks, `_1`, `_2`… after it for ligature components, `entry` and `exit` for cursive anchors. The page names only the classes.",
  "Pair positioning is lookup type 258 (0x102), read from the page's example; subtables no lookup declares count as kerning. A file with several lookup types would settle it.",
  "Glyph pairs take precedence over class pairs, and an earlier class table over a later one, as in the model; in OpenType the order of subtables decides. A file with overlapping subtables would settle it.",
  "A kerning class becomes a group named after its first glyph; a glyph already in a group on that side kerns by name instead. Files with a glyph in classes of two tables would settle it.",
  "Cap height and x-height, which the format does not store, are the tops of H and x, or 70% and 50% of the em; overshoots are zero.",
  "Hhea, typo and win values marked as offsets from a computed value are not kept, because the page does not say how the value is computed.",
  "The digits after the point in `Version` are thousandths (`1.5` is version 1.500).",
  "A TrueType instruction block (`TtTable`, `TtInstrs`) ends at a line starting `EndTt` or at the first line that is neither a mnemonic nor numbers; the page names no end line.",
  "A glyph layer the font does not declare (the multi-layered Type 3 form) is merged into the master layer.",
  "A glyph listed in more than one class on one side of a class kerning table belongs to the first of them; the later listings are skipped and reported. A table from the originating editor with such a repeat would settle which class it keeps.",
]

# ───────────────────────────── Outline interchange ─────────────────────────────

[[format]]
id = "svg-outline"
label = "SVG drawing (glyph outline import and export)"
extensions = ["svg"]
read = true
write = true
spec = "https://www.w3.org/TR/SVG2/"
area = "import-export"
milestone = "M3"
summary = "Imports the vector geometry of an SVG file into a glyph layer: paths and basic shapes after applying transforms, flipped to the y-up font coordinate system. Fill, stroke styling and everything that is not geometry is discarded. In Font View several files are matched to glyphs by file name; export writes one layer as a plain path."
ref = "Import & Export › Importing Outlines"
status = "handbook"

[[format]]
id = "pdf-outline"
label = "PDF artwork (glyph outline import)"
extensions = ["pdf"]
read = true
write = false
spec = "https://pdfa.org/resource/iso-32000-2/"
area = "import-export"
milestone = "M13"
summary = "Imports the path-construction operators of the first page's content stream as outlines; stroke width is kept as a stroke attribute on the path, while fill colour and other styling are dropped. Text, images, shadings and clipping are ignored."
ref = "Import & Export › Importing Outlines"
status = "handbook"
notes = "Built (M13.58) in `crates/io-pdf` (`read_pdf`, `looks_like_pdf`) on the `lopdf` crate (MIT; docs/plans/M13.md § 7 question 7) for the file structure; the content stream is read by our own tokenizer. It runs path construction (m l c v y h re), painting (f F f* S s B B* b b* n), q Q cm w, `gs` (its LW line width), colours (read and dropped), and form XObjects through `Do` with their /Matrix and resources; text objects, inline images, image XObjects and shadings are skipped and counted. A filled path gives closed contours; a stroked one keeps its subpaths open unless closed, and its line width (scaled by the transform and the placement) becomes the path's stroke width; a path both filled and stroked is closed, with the stroke width and the fill flag. The frame is the crop box, else the media box (inherited through the page tree), else the drawing's bounds, and /Rotate turns the page first. Limits: 256 MiB file, 10,000 streams, each stream decoded to at most 100 times its size (64 KiB for short streams) and 256 MiB in all (object streams are charged while the file loads), 8 filters a stream, nesting 64 (page tree, saved states, forms), 100,000 page tree nodes, 10,000,000 operators, 1 GiB of content read, 10,000 operands, 1,000,000 segments, numbers within ±1e9, 10,000 paths and 200,000 nodes. `file.importOutlines` reads PDF files by their header (unscaled or fitted to the em), and `edit.paste` reads a PDF clipboard flavour (`pdf`, base64) at one unit per point with the page's bottom-left corner on the origin (`Placement::Origin`). The handbook documents PDF import and the stroke style; behaviour on real files from drawing applications is not yet observed."
guesses = [
  "The frame for placement is the crop box, else the media box, with one point per unit and its top edge at the given top, matching EPS and SVG import; importing a PDF of known geometry in the reference app would settle it.",
  "A hairline stroke (line width 0) is given a stroke width of one unit; a reference import of a hairline would settle it.",
  "A path both filled and stroked keeps its stroke width and is marked as filled; a reference import of such a path would show which style it gets.",
  "Paths that only clip, or end without painting, are left out and counted as dropped, as for EPS; a reference import of a file with a clipping path would settle it.",
  "Only the first page is read, and its /Rotate is applied before placing; importing a two-page, rotated PDF in the reference app would settle both.",
]
observe = [
  "Import a one-page PDF with a filled square, a 4-point stroked line and a hairline into an empty glyph; note each path's position and stroke style.",
  "Import a PDF whose page has /Rotate 90; note whether the outlines are turned.",
]

[[format]]
id = "eps-outline"
label = "Encapsulated PostScript artwork (glyph outline import)"
extensions = ["eps"]
read = true
write = false
spec = ""
area = "import-export"
milestone = "M13"
summary = "Imports outlines from EPS files of the kind drawing applications save: a small interpreter for path, transform and paint operators, not a full PostScript implementation. Files that rely on procedures beyond that subset are rejected with a message rather than imported wrongly."
ref = "Import & Export › Importing Outlines; Adobe Technical Note 5002, Encapsulated PostScript File Format 3.0 (no stable public URL verified)"
status = "handbook"
notes = "Built (M13.57) in `crates/io-svg/src/eps.rs` (`read_eps`, `looks_like_eps`): a scanner and a fixed operator subset, not a PostScript interpreter. It runs path construction (moveto, rmoveto, lineto, rlineto, curveto, rcurveto, closepath, newpath), painting (fill, eofill, stroke, rectfill, rectstroke; clip operators counted and dropped), gsave/grestore/save/restore, the colour and line style operators (dropped), translate/scale/rotate/concat and the matrix operators, stack and arithmetic operators, and def/bind/load/array/astore. Prolog, setup, procedure-set and resource sections are not run; their `/name { … } bind def` and `/name /op load def` definitions are kept when their procedures use only the subset. The page runs until %%PageTrailer, %%Trailer or %%EOF. Files marked with `%AI` comments may use the drawing-application format's documented abbreviations (m l c v y, f s b n and variants, W; style, text, group and layer operators dropped with their operands). Anything else (conditionals, loops, exec, files, fonts, text, images, arcs) is refused naming the operator. DOS EPS binary headers are followed to the PostScript section. Limits: 16 MiB, 8,000,000 tokens, 2,000,000 stored procedure tokens, nesting 64, calls 32 deep, 64 saved states, operand stack 10,000, 10,000,000 operations, 1,000,000 array elements, 10,000 definitions, numbers within ±1e9, and the SVG reader's 10,000 paths and 200,000 nodes. `file.importOutlines` still reads SVG only; routing `.eps` files to `read_eps` is a change in `crates/engine/src/cmd/clipboard.rs`. The handbook documents EPS import; behaviour on real files from drawing applications is not yet observed."
guesses = [
  "Unscaled placement keeps one point per unit and puts the top edge of the bounding box (else of the drawing) at the given top, matching how SVG files are placed; importing an EPS of known geometry in the reference app would settle it.",
  "Paths that are only used to clip, or ended without painting, are left out and counted as dropped; the reference may import every path, which importing a file with a clipping path and an unpainted path would settle.",
  "Arcs (arc, arcn, arct), text and images make the file fail with a message rather than being skipped; an EPS with an arc or a text object imported in the reference app would show whether it skips them or converts them.",
  "A path filled inside gsave/grestore and stroked again afterwards is imported once; a reference import of such a file would settle it.",
]
observe = [
  "Import Outlines with an EPS of our own that draws a 100 × 100 point square at (50, 50) in a 0 0 200 200 bounding box: note where the square lands relative to the baseline and whether it is scaled.",
  "Import Outlines with an EPS that clips a filled triangle by a rectangle and also has an unpainted path: note which of the three paths arrive.",
  "Import Outlines with an EPS that uses `arc` and one that contains text: note whether each is refused, skipped or converted.",
]

