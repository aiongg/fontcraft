# ═════════════════════════════ Round-trip rules ═════════════════════════════

# ── All formats ──

[[behavior]]
id = "ufo.openTypeCategories"
area = "import-export"
milestone = "M4"
summary = "A UFO written from a font read from another format gets public.openTypeCategories from each glyph's category, subcategory and anchors: ligature for subcategory Ligature with an attaching anchor (a name without a leading underscore), mark for category Mark with subcategory Nonspacing or Spacing Combining, base for any other glyph with an attaching anchor, nothing otherwise. A class the glyph states wins. A UFO's own map is written back as it was read."
ref = "glyphsLib 6.15.0 builder/features.py (_build_public_opentype_categories); docs/spec/30-source-formats.md › Glyph classification"
status = "docs"
notes = "Built in M4.2 (crates/io-ufo/src/gdef.rs). The category and subcategory a glyph does not state come from the built-in glyph database, as glyphsLib takes them."
guesses = [
  "glyphsLib classifies after propagating anchors into composites; a layer without anchors of its own counts its components' attaching anchors, which gives the same class for the usual accented composites. Settled by comparing with glyphsLib's UFOs of the corpus.",
  "Custom glyph data files do not change the classes, as glyphsLib reads only its built-in data here. Settled by a reference export with a custom GlyphData file.",
]

[[behavior]]
id = "roundtrip.unknownKeysPreserved"
area = "import-export"
milestone = "M1"
summary = "Every key, attribute or element a reader does not model is stored untouched in the `extra` map of the struct it was found on and written back at the same place by the writer for that format. Readers never fail on an unknown key and never drop one silently; a strict mode only lists them."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"

[[behavior]]
id = "roundtrip.extraIsPerFormat"
area = "import-export"
milestone = "M1"
summary = "`extra` entries are tagged with the format family they came from (glyphs, ufo, designspace, binary). A writer emits only its own family's entries directly; entries from another family are written into that format's free-form container (Glyphs `userData`, UFO `lib`, designspace `lib`) under a `org.fontcraft.` key so that saving back to the original format restores them."
ref = "docs/spec/30-source-formats.md › Concepts that exist in only one format"
status = "inferred"

[[behavior]]
id = "roundtrip.noOpSaveIsByteIdentical"
area = "import-export"
milestone = "M1"
summary = "Opening a file written by the reference tools (Glyphs for .glyphs and .glyphspackage, fontTools ufoLib and designspaceLib for UFO and designspace) and saving it unedited in the same format and version reproduces every file byte for byte. This is tested on a corpus; any difference is a bug in the writer, not an accepted normalisation."
ref = "GlyphsSDK GlyphsFileFormatv3.md › File Format Details; our test policy"
status = "inferred"

[[behavior]]
id = "roundtrip.editsAreLocal"
area = "import-export"
milestone = "M1"
summary = "Changing one value changes only the lines that encode that value (plus timestamps the format requires). Lists keep their order, untouched glyphs keep their exact text, and no writer re-sorts, re-wraps or re-rounds data that was not edited."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"
notes = "The .glyphs reader keeps some spellings and layouts beside the fields they describe: code points spelled otherwise (`0065`, version 2 `41`), version 2 component transforms and master names, a single property value in quotes it does not need, node flags the writer would spell otherwise (`R`, `C` and `X` in another order, repeated or unknown letters), and one-line values (`com.fontcraft.glyphsLayout.<key>` entries). Each is written only while its field still gives it. Once an edit changes the field, the .glyphs writer leaves the kept value out and writes the field, also where the field itself is left out (no code points, an identity transform, a cleared master name). A native save also drops the layouts an edit made stale (`fontcraft_io_glyphs::without_stale_layouts`), so they do not travel on. Not covered: layouts kept inside a node's attribute dictionary stay in the model (the writer still checks them), and a version 2 name kept at the top level of a version 3 file is still written beside an edited property of the same name."
guesses = ["Node flags are read for `R`, `C` and `X` in any order (the first of `R` and `C` wins); when an edit changes the lock or orientation, the fields are written in the writer's order followed by the letters the model does not read, in their order. A file from the reference app with such flags would settle what it keeps."]

[[behavior]]
id = "roundtrip.stableKeyOrder"
area = "import-export"
milestone = "M1"
summary = "Key order is deterministic in every writer: dictionary keys of .glyphs files are sorted alphabetically as the format documents, native JSON writes struct fields in declaration order and map entries sorted by key, and UFO property lists are written with sorted keys. Order that carries meaning (glyphs, layers, shapes, nodes, features, parameters, kerning pairs as read) is kept as a list and never sorted."
ref = "GlyphsSDK GlyphsFileFormatv3.md › File Format Details (sorted keys)"
status = "docs"

[[behavior]]
id = "roundtrip.floatFormatting"
area = "import-export"
milestone = "M1"
summary = "Numbers are written as the shortest decimal text that reads back to the same 64-bit float, without exponent notation; whole values are written without a decimal point and negative zero as 0. The same routine serves every text writer, so a value never changes its spelling between two saves."
ref = "GlyphsSDK GlyphsFileFormatv3.md › Syntax (number grammar has no exponent); norad designspace tests (decimal values saved exactly)"
status = "inferred"

[[behavior]]
id = "roundtrip.coordinatesNotRounded"
area = "import-export"
milestone = "M1"
summary = "Coordinates, widths, kerning values and transform factors are 64-bit floats in memory and are stored exactly as read. Rounding happens only through explicit actions (grid snapping while editing, the round-coordinates commands, the compiler's conversion to font units), never as a side effect of opening, saving or converting between source formats."
ref = "Glyphs schema (`f64` for pos, width, kerning); UFO 3 conventions › integer or float"
status = "inferred"

[[behavior]]
id = "roundtrip.textEncoding"
area = "import-export"
milestone = "M1"
summary = "All text formats are written as UTF-8 without a byte-order mark and with LF line ends; on read a BOM and CRLF are accepted and remembered in `extra` so they can be restored on a no-op save. Glyph names and strings are never case-folded or Unicode-normalised."
ref = "GlyphsSDK GlyphsFileFormatv3.md › File Format Details (UTF-8); UFO 3 conventions"
status = "inferred"

[[behavior]]
id = "roundtrip.atomicSave"
area = "import-export"
milestone = "M1"
summary = "A single-file save writes a temporary file in the destination folder, flushes it to disk and renames it over the target, so a crash leaves either the old or the new file. Package and UFO saves apply the same per file and write index files (contents.plist, layercontents.plist, order.plist, fontinfo.plist) last; when a whole package is replaced (Save As, version change) it is built in a sibling temporary directory and swapped in by rename."
ref = "norad src/font.rs (Font::save doc: save to a temporary location then move)"
status = "inferred"

[[behavior]]
id = "roundtrip.unchangedFilesUntouched"
area = "import-export"
milestone = "M1"
summary = "In multi-file formats (.glyphspackage, UFO, a designspace with its UFOs) a file is rewritten only when its serialised bytes differ from what is on disk, and files that no longer belong (a deleted or renamed glyph) are removed. Modification times of untouched files do not change."
ref = "Import & Export › Glyphs File Package (only changed files are modified)"
status = "handbook"

[[behavior]]
id = "roundtrip.externalChangeDetected"
area = "import-export"
milestone = "M1"
summary = "Before overwriting, the saver compares the size, modification time and hash recorded at load with the file on disk; if they differ it stops and returns a conflict (reload, overwrite or save elsewhere) instead of writing. For packages and UFOs the check is per file, so an untouched glyph edited by another tool is reloaded rather than clobbered."
ref = "our design"
status = "inferred"

[[behavior]]
id = "roundtrip.lossReport"
area = "import-export"
milestone = "M1"
summary = "Every save or export to a format that cannot hold part of the document returns a structured list of losses (object path, concept, what was done: dropped, decomposed, moved to lib). The UI shows it as a warning before the write is committed and the command line prints it; with `strict` set the write fails instead."
ref = "Import & Export › Unified Font Object (unsupported features trigger a warning)"
status = "inferred"

[[behavior]]
id = "roundtrip.idsStable"
area = "import-export"
milestone = "M1"
summary = "Master ids, layer ids, instance ids, shape-group ids and UFO object identifiers are read as opaque strings and never regenerated. New objects get a fresh uppercase UUID in a Glyphs-backed document and an identifier only when one is needed (object lib, hint reference) in a UFO-backed one."
ref = "GlyphsSDK GlyphsFileFormatv3.md (fontMaster.id, layer.layerId, associatedMasterId); UFO 3 conventions › Identifiers"
status = "docs"

# ── Native format ──

[[behavior]]
id = "roundtrip.nativeVersioned"
area = "import-export"
milestone = "M1"
summary = "A .fontcraft file starts with `formatVersion` (integer) and `appVersion`. Older versions are migrated in memory by a chain of one-step upgrade functions and written back in the current version only on an explicit save; a file with a higher version than the application knows opens read-only with a clear message."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"

[[behavior]]
id = "roundtrip.nativeGzip"
area = "import-export"
milestone = "M1"
summary = "A .fontcraft file may be gzip-compressed; the reader looks at the first two bytes rather than the file name. The writer keeps the state the file had when opened, compresses new files above a size threshold set in the settings, and always writes gzip with a zeroed timestamp and no file name so equal documents give equal bytes."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"

[[behavior]]
id = "roundtrip.nativeDiffFriendly"
area = "import-export"
milestone = "M1"
summary = "Uncompressed native JSON is indented with one object member per line, but point-like tuples (a node, a position, a scale, a colour, a kerning pair) stay on one line, so a diff of an outline edit shows one line per node. The glyph list is written in glyph order with one glyph object after another and a trailing newline ends the file."
ref = "GlyphsSDK GlyphsFileFormatv3.md › File Format Details (compact tuples) as the model"
status = "inferred"

[[behavior]]
id = "roundtrip.nativeLosslessFromGlyphs"
area = "import-export"
milestone = "M1"
summary = "Converting .glyphs (version 2, 3 or 4, single file or package) to .fontcraft and back to the same .glyphs version and flavour gives a byte-identical file. The native file therefore records the source format version, the package flag, the original `.appVersion` and any formatting facts the Glyphs writer needs."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"

[[behavior]]
id = "roundtrip.nativeLosslessFromUfo"
area = "import-export"
milestone = "M1"
summary = "Converting a designspace with its UFOs (or a single UFO) to .fontcraft and back gives the same set of files with identical content: file names from contents.plist, layer directory names, identifiers, all libs, `data/` and `images/` entries and the designspace's relative paths are stored in the native file."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"

# ── .glyphs writer ──

[[behavior]]
id = "roundtrip.glyphsSyntax"
area = "import-export"
milestone = "M1"
summary = "The .glyphs writer follows the documented text conventions exactly: no indentation, one key or element per line, `key = value;` pairs, empty containers omitted except inside `userData`, tuples marked compact in the schema on one line, booleans as 1 and 0, and strings bare only when they match the bare-string grammar and do not look like a number. Tab and line-feed characters are written literally in the string values the reference writes that way (feature code, notes)."
ref = "GlyphsSDK GlyphsFileFormatv3.md › File Format Details, Syntax; Schemas (`glyphsCompact`)"
status = "docs"

[[behavior]]
id = "roundtrip.glyphsVersionDifferences"
area = "import-export"
milestone = "M1"
summary = "The writer is parameterised by format version: version 4 puts a comma after the last element of a multi-line array and writes colours as 0–1 floats, version 3 writes neither a trailing comma nor float colours, and version 2 writes legacy string forms for nodes, positions and transforms and accepts quoted booleans on read. Each key is written only in the versions the schema's version conditions allow."
ref = "GlyphsSDK GlyphsFileFormatv4.md › File Format Details (trailing comma), color; Schemas (`glyphsCondition` minVersion/maxVersion)"
status = "docs"

[[behavior]]
id = "roundtrip.glyphsFormatVersionKept"
area = "import-export"
milestone = "M1"
summary = "A document is saved in the Glyphs format version it was opened in until the user changes the file-format-version setting; new documents use version 3. When the document contains data the chosen version cannot hold, the save lists it through the loss report and nothing is silently moved into another key."
ref = "Font Info › Other › File Format Version; Import & Export › Glyphs File"
status = "handbook"

[[behavior]]
id = "roundtrip.glyphsDefaultsOmitted"
area = "import-export"
milestone = "M1"
summary = "Keys whose value equals the documented default are not written (for example `export` when true, component `scale` when 1,1, `angle` when 0, `locked` when false), with the exception that a key present at its default in the file as read is remembered and written again. Required keys are always written."
ref = "GlyphsSDK GlyphsFileFormatv3.md (defaults per key); Schemas (`default`, `required`)"
status = "docs"

[[behavior]]
id = "roundtrip.glyphsDerivedNamesNotWritten"
area = "import-export"
milestone = "M1"
summary = "Layer names that the application derives from the layer's role (a master layer shows its master's name, an intermediate layer shows its coordinates) are not stored; the `name` key is written only for layers whose name is real data, such as backups. `associatedMasterId` is omitted when it equals the layer id."
ref = "GlyphsSDK GlyphsFileFormatv3.md › layer.name, layer.associatedMasterId"
status = "docs"

[[behavior]]
id = "roundtrip.glyphsDependentValues"
area = "import-export"
milestone = "M1"
summary = "Values that reference each other are kept consistent by the model, not by the writer: master ids against layer ids, `associatedMasterId`, kerning tables, `instanceInterpolations` and component `masterId`; parallel lists (`axesValues`, `metricValues`, `stemValues`, `numberValues`, `axisRules`, `coordinates`) against the font-level list they index. Adding, removing or reordering an axis, metric, stem or number rewrites every parallel list in one undoable step."
ref = "GlyphsSDK GlyphsFileFormatv3.md › File Format Details (dependent values); fontMaster, layerAttr"
status = "docs"

[[behavior]]
id = "roundtrip.glyphsPackageLayout"
area = "import-export"
milestone = "M1"
summary = "A package keeps its split exactly: glyph files under `glyphs/` named by the same glyph-name-to-file-name rule the reference uses, order in `order.plist`, display strings in `UIState.plist`, and for version 4 the kerning, note and feature files in their own places. Display strings are UI state: changing them does not mark the document as edited for version control purposes and they are left out entirely when the `Write DisplayStrings` parameter is off."
ref = "GlyphsSDK GlyphsFileFormatv4.md › Package; Import & Export › Glyphs File Package; Appendix › Custom Parameters (Write DisplayStrings)"
status = "docs"

[[behavior]]
id = "roundtrip.glyphsLastChange"
area = "import-export"
milestone = "M1"
summary = "A glyph's `lastChange` is updated only when that glyph was actually edited, and not at all when the font carries a disabled `Write lastChange` parameter. Opening, converting and saving alone never touch it."
ref = "Font View › glyph properties (Write lastChange); GlyphsSDK GlyphsFileFormatv3.md › glyph.lastChange"
status = "handbook"

[[behavior]]
id = "roundtrip.glyphsAppVersionKept"
area = "import-export"
milestone = "M1"
summary = "The `.appVersion` build number found in a file is written back unchanged, because the reference may use it to decide how to interpret the file; our own tool name and version go into a `org.fontcraft.` entry of the font's `userData`. New files get the build number of the newest reference build whose output our writer has been tested against."
ref = "GlyphsSDK GlyphsFileFormatv3.md › .appVersion"
status = "inferred"

[[behavior]]
id = "roundtrip.glyphsUserDataVerbatim"
area = "import-export"
milestone = "M1"
summary = "`userData` on the font, masters, instances, glyphs, layers and (by version) anchors, guides, components and nodes is an arbitrary property-list value: kept as a tree including empty containers and binary data blocks, never interpreted, and written back in place. Custom parameters are kept as an ordered list of name, value and disabled flag, allowing repeated names and names we do not know."
ref = "GlyphsSDK GlyphsFileFormatv3.md › userData, customParameter; File Format Details (userData keeps empty structures)"
status = "docs"

# ── UFO and designspace writers ──

[[behavior]]
id = "roundtrip.ufoLibsVerbatim"
area = "import-export"
milestone = "M1"
summary = "lib.plist, every glyph `lib`, every layerinfo `lib`, and everything under `data/` are preserved as found, including keys of other tools. Keys we understand (the `public.` registry and the Glyphs converter keys) are parsed into model fields and written back from them; all others stay as opaque property-list values."
ref = "UFO 3 lib.plist, GLIF lib, layerinfo.plist, data directory"
status = "docs"

[[behavior]]
id = "roundtrip.ufoIdentifiers"
area = "import-export"
milestone = "M1"
summary = "An `identifier` on a point, contour, component, anchor or guideline is never removed or changed once present, and stays unique within its glyph. `public.objectLibs` is kept in step with them: an entry follows its object through edits and is deleted when the object is, and a new identifier is minted only when an object first needs an object lib."
ref = "UFO 3 conventions › Identifiers; GLIF › public.objectLibs; lib.plist › public.objectLibs"
status = "docs"

[[behavior]]
id = "roundtrip.ufoFileNames"
area = "import-export"
milestone = "M1"
summary = "GLIF file names and layer directory names are taken from contents.plist and layercontents.plist and reused on save; only new glyphs and layers get names from the specification's user-name-to-file-name algorithm. The `name` attribute inside a GLIF is ignored on read, as the specification asks, and rewritten to match contents.plist on save."
ref = "UFO 3 conventions › Common User Name to File Name Algorithm; glyphs/contents.plist; GLIF › glyph"
status = "docs"

[[behavior]]
id = "roundtrip.ufoXmlFormatting"
area = "import-export"
milestone = "M1"
summary = "UFO files are written in the layout fontTools ufoLib produces (XML declaration, indentation, attribute order per element, number spelling, property-list DOCTYPE), which is what most UFOs on disk look like. A document remembers the layout its files used when read (declaration, document type, indentation unit and level, final line break, whole numbers spelled as floats) and writes that back; a start tag or value spelled otherwise than the writer would is kept and written back while it still means what the model holds."
ref = "fontTools ufoLib glifLib.py and misc/plistlib (output rules); corpus UFOs written by ufoLib and robofab"
status = "inferred"

[[behavior]]
id = "roundtrip.ufoVersionKept"
area = "import-export"
milestone = "M1"
summary = "A UFO is saved in the major version it was opened in, 2 or 3; UFOs created by export are always version 3. Saving version 2 folds anchors back into single-point contours, drops identifiers, guidelines, images and extra layers through the loss report, and restores the original kerning group names remembered at load."
ref = "Import & Export › Unified Font Object (version maintained; export writes version 3)"
status = "handbook"

[[behavior]]
id = "roundtrip.ufoKerningGroups"
area = "import-export"
milestone = "M1"
summary = "A glyph's right-side kerning group R becomes membership of `public.kern1.R` and its left-side group L membership of `public.kern2.L`; reading inverts this. Kerning pair sides that name a group use the same prefixed names, and all groups without a kerning prefix are kept as ordinary named glyph groups in their stored order. A UFO 2's kerning groups are recognised as ufoLib recognises them (named `@MMK_L_`/`@MMK_R_` or used as a pair side) and written back under their own names."
ref = "UFO 3 groups.plist › Kerning Groups; fontc glyphs2fontir src/source.rs (right group is side 1, left group is side 2)"
status = "docs"

[[behavior]]
id = "roundtrip.ufoGlyphsLibKeys"
area = "import-export"
milestone = "M1"
summary = "When a document that began as a Glyphs source is written to UFO, Glyphs-only data goes into `com.schriftgestaltung.` lib keys in the spellings existing converters use, so other tools and a later import find them where they expect; data with no established key goes under `org.fontcraft.`. Reading a UFO restores model fields from both families."
ref = "docs/spec/30-source-formats.md › Concepts that exist in only one format; lib keys seen in fontc, fontTools and fontmake test data"
status = "inferred"

[[behavior]]
id = "roundtrip.ufoMastersShareStructure"
area = "import-export"
milestone = "M1"
summary = "Saving a multi-master document to designspace writes font-wide data once per UFO as each UFO requires it (glyph order, features, groups, names, units per em) and keeps it identical across masters unless the files differed when read. Differences found on load (per-master groups, feature text or glyph sets) are preserved as per-master overrides rather than merged away."
ref = "fontc fontir src/ir.rs (KerningInstance: groups are per source); UFO 3 specification (one UFO is one master)"
status = "inferred"

[[behavior]]
id = "roundtrip.designspaceVerbatim"
area = "import-export"
milestone = "M1"
summary = "A designspace keeps its relative `filename` paths as written (forward slashes, never made absolute), its source, instance and rule order, the `name` attributes used for cross references, its three kinds of `lib`, and any deprecated or unknown child elements. The `format` number is raised only when the document uses something a newer minor version introduced."
ref = "fontTools designspaceLib xml.rst; fontTools/designspaceLib/__init__.py (minimum version on write)"
status = "docs"

[[behavior]]
id = "roundtrip.designspaceCoordinates"
area = "import-export"
milestone = "M1"
summary = "Locations are stored in the space the file used: design coordinates (`xvalue`, optional `yvalue`) or user coordinates (`uservalue`) per dimension, and are written back in that space. An axis keeps its `map` nodes exactly; the model converts between the two spaces on demand and never rewrites one as the other."
ref = "fontTools designspaceLib xml.rst › dimension, map"
status = "docs"

# ── Outlines ──

[[behavior]]
id = "roundtrip.curveTypesKept"
area = "import-export"
milestone = "M1"
summary = "Cubic and quadratic segments are both first-class and are stored as drawn: opening a TrueType font or a UFO with `qcurve` points keeps quadratic curves, including runs of several off-curve points with implied on-curve points and contours made only of off-curve points. Conversion happens only on an explicit command or in the compiler."
ref = "Import & Export › Opening TrueType Font; UFO 3 GLIF › Point Types"
status = "docs"

[[behavior]]
id = "roundtrip.startNodeConvention"
area = "import-export"
milestone = "M1"
summary = "The model stores a closed path with its start node first. The Glyphs reader and writer convert from and to the Glyphs convention, in which the start node of a closed path is the last entry of the node list; the UFO reader and writer use the list as it is. Open paths begin with their first node in both formats, typed `move` in GLIF."
ref = "fontc glyphs-reader src/font.rs (last node is the start node), glyphs2fontir src/toir.rs; UFO 3 GLIF › Point Types (move)"
status = "docs"

[[behavior]]
id = "roundtrip.shapeOrderKept"
area = "import-export"
milestone = "M1"
summary = "Paths and components live in one ordered `shapes` list, as in Glyphs version 3 and later. GLIF and Glyphs version 2 store components and contours separately, so writing those formats records the interleaved order in a lib or user-data key and reading restores it; without the key, components come first, then contours."
ref = "GlyphsSDK GlyphsFileFormatv3.md › layer.shapes; UFO 3 GLIF › outline; lib key com.schriftgestaltung.Glyphs.shapeOrder seen in fontc test data"
status = "docs"

[[behavior]]
id = "roundtrip.componentTransformKept"
area = "import-export"
milestone = "M1"
summary = "A component stores the decomposed transform Glyphs uses (position, scale, rotation angle, slant) and the six-number matrix is derived from it in the order translate, slant, rotate, scale. A matrix read from UFO or Glyphs version 2 is decomposed once and the original six numbers are kept, so writing back to a matrix format reproduces them exactly instead of a recomputed approximation."
ref = "GlyphsSDK GlyphsFileFormatv3.md › component (pos, scale, angle, slant); UFO 3 GLIF › component; fontc glyphs-reader src/font.rs (composition order)"
status = "docs"

# ── Compiled fonts ──

[[behavior]]
id = "roundtrip.binaryOpenIsLossy"
area = "import-export"
milestone = "M1"
summary = "A compiled font opens as an unsaved, view-only document that must be saved to a source format before it can be changed in place; export never overwrites the file that was opened. Opening and exporting again is not expected to reproduce the original binary, and the open command returns the list of tables and data that did not become editable."
ref = "Import & Export › Opening Font Files"
status = "handbook"

[[behavior]]
id = "roundtrip.binaryGlyphOrderRecorded"
area = "import-export"
milestone = "M1"
summary = "The glyph order of an opened binary is written into the font's `glyphOrder` parameter so a later export keeps glyph ids, and original glyph names are kept when the keep-names setting is on. Otherwise names are mapped to the built-in naming scheme and the original name is stored as the production name."
ref = "Import & Export › Opening Font Files, Font File Importing Behaviors"
status = "handbook"

[[behavior]]
id = "roundtrip.binaryPassThroughTables"
area = "import-export"
milestone = "M12"
summary = "Tables the importer does not turn into editable data are kept as raw bytes in the font's `extra` (family `binary`) together with the checksum of the glyph set they belong to. The command-line tools can copy them into an export unchanged when asked; the editor's normal export ignores them, because stale tables next to edited glyphs are worse than missing ones."
ref = "our design; fontTools ttx keeps unknown tables as hex"
status = "inferred"
notes = "The compile half is built (M12.42, crates/compile/src/extras.rs): the tables sit in the font's extra data, family binary, each as data under `table.<tag>`, with the glyph order's checksum (FNV-1a over the names) under `tableGlyphSet`; extras::store_tables writes them, and font.compile's passThroughTables copies them into a build whose glyph order has the same checksum, leaving them out with a warning otherwise and never replacing a table the compile wrote. The kept tables are LTSH, VDMX, hdmx, JSTF, EBDT, EBLC, EBSC, morx, mort, feat, ltag, kerx, ankr and trak. Opening a compiled font (TrueType, CFF, a collection's chosen face, WOFF or WOFF2) stores them with the checksum of the opened font's glyph order (crates/engine/src/io.rs, keep_stored_tables)."
guesses = ["Stored tables are copied only when the whole glyph order is unchanged, since each of them indexes glyphs by id; settled by opening a TrueType font with an LTSH or hdmx table in the reference app, exporting it unchanged and checking whether the table is still there."]
