# File formats FontCraft reads and writes, and the round-trip rules it commits to.
# Date: 2026-10-07
#
# Sources (all permissively licensed or public documentation; wording is our own):
# - Glyphs file format, versions 2, 3 and 4, and JSON schemas (Apache-2.0):
#   refs/GlyphsSDK/GlyphsFileFormat/GlyphsFileFormatv2.md, v3.md, v4.md, Schemas/*.schema.json
#   https://github.com/schriftgestalt/GlyphsSDK/tree/Glyphs3/GlyphsFileFormat
# - Unified Font Object 3 and 2 specification: refs/ufo-spec/versions/ufo3, ufo2
#   https://unifiedfontobject.org/versions/ufo3/
# - designspace format 5 documentation and reference implementation (MIT):
#   refs/fonttools/Doc/source/designspaceLib/xml.rst, refs/fonttools/Lib/fontTools/designspaceLib/
#   https://fonttools.readthedocs.io/en/latest/designspaceLib/xml.html
# - Rust crates (MIT/Apache-2.0): refs/norad 0.19.0, refs/fontc/glyphs-reader 1.0.0,
#   refs/fontc/fontir 1.0.0, refs/fontc/fea-rs 1.0.0, refs/fontations (read-fonts 0.45.0, write-fonts 0.54.0)
# - Glyphs 4 Handbook, chapter "Import & Export" (and "Edit View › Images", "Color Fonts",
#   "Font Info › Other") for which formats the reference opens, saves, imports and exports
# - FontForge public documentation only: https://fontforge.org/docs/techref/sfdformat.html
#
# Reading aid for the rows below:
# - Compiled fonts have two rows each: `<id>.open` (decompile into the editor, M1) and
#   `<id>.export` (written by the compiler). They are split because the milestones differ.
# - `status = "docs"`: the format and the fact come from a specification or public documentation.
#   `status = "handbook"`: the only source is the reference handbook.
#   `status = "inferred"`: our own design. `status = "memory"`: recalled, no public description found.
# - The field-by-field study behind these rows is docs/spec/30-source-formats.md.

# ───────────────────────────── Native ─────────────────────────────

[[format]]
id = "fontcraft"
label = "FontCraft document"
extensions = ["fontcraft"]
read = true
write = true
spec = "docs/spec/30-source-formats.md#recommended-model"
area = "import-export"
milestone = "M1"
summary = "Our own source format: one UTF-8 JSON document that serialises the in-memory model directly, with a top-level integer `formatVersion` and the writing app version. It is a lossless superset of .glyphs 2/3/4, UFO 3 and designspace 5: every struct carries an `extra` map for keys we do not model. The same extension may hold a gzip stream, detected by its magic bytes."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"

# ───────────────────────────── Glyphs sources ─────────────────────────────

[[format]]
id = "glyphs2"
label = "Glyphs file, format version 2 (no .formatVersion key)"
extensions = ["glyphs"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv2.md"
area = "import-export"
milestone = "M1"
summary = "OpenStep-style text property list used by Glyphs 1 and 2: separate `paths` and `components` lists, nodes as strings such as `100 100 CURVE SMOOTH`, positions and transforms as brace strings, hexadecimal `unicode`, up to three fixed axes via weightValue/widthValue/customValue, a single `kerning` plus `vertKerning`, and per-master ascender/capHeight/xHeight/alignmentZones. Read by upgrading in memory to the version 3 shape; written back in version 2 form only when the file was opened as version 2, with a warning for everything version 2 cannot hold (RTL kerning, more than three axes, shape attributes, metrics beyond the fixed five)."
ref = "GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv2.md; Schemas/glyphs-1.schema.json; Import & Export › Glyphs File"
status = "docs"

[[format]]
id = "glyphs3"
label = "Glyphs file, format version 3"
extensions = ["glyphs"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv3.md"
area = "import-export"
milestone = "M1"
summary = "The reference app's default source format: a single UTF-8 OpenStep-style property list holding axes, masters, instances, glyphs with all their layers, three kerning tables (LTR, RTL, vertical), features, classes, prefixes, custom parameters and user data. Everything in the documented schema is modelled; keys outside the schema are kept verbatim in `extra` and written back. This is the format the model is closest to, so an unedited file must come back byte-identical."
ref = "GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv3.md; Schemas/glyphs-3.schema.json; Import & Export › Glyphs File"
status = "docs"
notes = "Paint attributes are typed (M11.5): `fillColor`, `strokeColor`, `gradient`, `shadow`, `shadowIn` and palette references `(p, index, alpha)`; `strokePos` is converted to the version 4 convention on reading and back on writing. Writing a font as version 3 reports conic gradients, extend modes, gradient radii and colours finer than 8 bits as losses."
guesses = [
  "A gray colour `(gray, alpha)` is read as an RGBA colour with equal components, and the shape remembers which of its colours the file wrote as gray so that they are written as gray again. Settled by watching whether the reference app writes a colour picked from the gray swatches as gray.",
  "A version 3 `strokePos` stored as text that is not a plain number stays a stored value, because it cannot be converted to the version 4 convention. Settled by finding a file whose stroke position is an expression.",
]

[[format]]
id = "glyphs4"
label = "Glyphs file, format version 4"
extensions = ["glyphs"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv4.md"
area = "import-export"
milestone = "M1"
summary = "Version 3 plus: `kerningContext`, localised axis `names`, glyph-level `axes`, `group` and `groupIdx`, instance `id`, master and layer `active`, images and shape groups as shapes, extra node types (u, h, r) and the tangent flag, per-node `hoi` data, conic gradients, colours as 0–1 floats, the `Color Palettes` parameter as an object, and trailing commas in multi-line arrays. Top-level `familyName` and instance `name` are gone (names live in `properties`), and anchor, guide and component user data moves into `attr`. Documented on 2026-07-17, so expect the schema to move; unknown keys are preserved."
ref = "GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv4.md; Schemas/glyphs-4.schema.json; Font Info › Other › File Format Version"
status = "docs"

[[format]]
id = "glyphspackage"
label = "Glyphs file package"
extensions = ["glyphspackage"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv4.md#package-glyphspackage"
area = "import-export"
milestone = "M1"
summary = "A directory with the same data as a .glyphs file split up: `fontinfo.plist` (everything but glyphs), `order.plist` (glyph names in order), `UIState.plist` (display strings) and one `glyphs/<name>.glyph` per glyph. Version 4 packages additionally move kerning to `kerning.plist`, the font note to `note.md`, and class, prefix and feature code to `features/@Name.fea`, `features/_Name.fea` and `features/<tag>.fea` (with `.2`, `.3` suffixes on name clashes). Saving rewrites only the files whose content changed."
ref = "GlyphsSDK GlyphsFileFormatv3.md and v4.md › Package; Schemas/fontinfo-3.schema.json, fontinfo-4.schema.json; Import & Export › Glyphs File Package"
status = "docs"

[[format]]
id = "glyphsproject"
label = "Glyphs project"
extensions = ["glyphsproject"]
read = true
write = false
spec = ""
area = "import-export"
milestone = "M13"
summary = "A separate file that links to a Glyphs source and holds its own list of instances and an export destination. The handbook describes the behaviour, but the key layout is not covered by the published format documents, so reading it is planned only after the file has been inspected; nothing is preserved beyond the instance list and the link."
ref = "Import & Export › Projects"
status = "handbook"
notes = "The key layout can be learned in the reference app's trial by saving a project file made from our own synthetic font (docs/plans/M13.md § 8); M13.59 builds the reader after that."
observe = [
  "Make a Project from the instances test font (two masters, three instances, one with a custom parameter), set an export destination, save it, and send back the `.glyphsproject` file: its keys show where the instances, the link to the source and the destination are stored.",
]

# ───────────────────────────── UFO and designspace ─────────────────────────────

[[format]]
id = "ufo3"
label = "Unified Font Object 3"
extensions = ["ufo"]
read = true
write = true
spec = "https://unifiedfontobject.org/versions/ufo3/"
area = "import-export"
milestone = "M1"
summary = "A directory of XML property lists and one GLIF file per glyph per layer: metainfo, fontinfo, groups, kerning, features.fea, lib, layercontents, glyph layers with layerinfo, plus `images/` and `data/`. One UFO is one master. Everything in the specification is read and written; the font, layer, glyph and object libs, the data directory and every identifier are preserved verbatim, while Glyphs-only concepts (smart components, hints tied to nodes, metrics keys, special layers) are carried in lib keys."
ref = "UFO 3 specification (all pages under versions/ufo3); norad 0.19.0; Import & Export › Unified Font Object"
status = "docs"
notes = "Colour layers travel in ufo2ft's lib keys (M11.5): palette layers as the UFO layers of `colorLayerMapping`, or, read from it, in the font-wide `com.github.googlei18n.ufo2ft.colorLayers` list as pairs; a list entry that is a paint (a PaintColrLayers, a list of paints or one paint, each a PaintGlyph over a PaintSolid or a linear, radial or sweep gradient, or a PaintColrGlyph, inside transform paints) opens as full-colour layers of one component each, the gradient geometry as fractions of the component's box, and is written back the same. Variable paints (PaintVarSolid, the variable gradients and transform paints) open as their static paint with their VarIndexBase values kept; a UFO has no variation store, so a designspace's masters hold static paints and the compiler varies them. Gradients under a turned, mirrored or skewed component are measured on the moved outline: linear ones under any transform, radial ones where circles stay circles, sweep ones where the transform only turns and scales. Every full-colour layer goes to the list (M11.5c). One whose shapes are not a single component is written as glyphsLib writes it for ufo2ft: per run of shapes with one fill, a glyph `<glyph>.color<i>` (no code points, not in the glyph order, `i` its place in the entry) holding the shapes, painted by a PaintGlyph; a component of a glyph with full-colour layers becomes a PaintColrGlyph; a master layer marked full colour with one fill is a PaintGlyph of the glyph itself. Reading folds those glyphs back into their layers where the writer gives back the same layers and glyphs and nothing else names the glyphs (components, kerning, groups, the glyph order, the rest of the list). An entry the writer would not give back (a composite paint, a radial gradient under a skew, a malformed value) stays lib data, written as read. Runs with a stroke stay UFO layers, their paint attributes reported as losses. Saving a UFO source converts its JPEG and TIFF images to PNG files (`image-jpeg`)."
guesses = [
  "A full-colour layer read from a colour layer list is named `Color`, the name the reference gives a new full-colour layer. Settled by opening a UFO whose lib has a colorLayers paint in the reference, if it reads one.",
  "glyphsLib does not fold `<glyph>.color<i>` glyphs back into colour layers when it reads a UFO; the reader folds them so a saved source opens as it was. Settled by opening such a UFO in the reference, if it reads the list.",
  "A full-colour layer whose runs glyphsLib would not split the same way (paths and components mixed) is split as the compiler merges runs, in shape order; glyphsLib puts paths before components. Settled by comparing glyphsLib's minimal UFOs of such a source.",
  "Colours of the list's full-colour layers that are not palette entries are added to the end of every palette, painted with alpha 1 and their own alpha in the palette, as the compiler adds them; glyphsLib adds them the same way but also puts the alpha in the paint. Settled by comparing the COLR of the reference's UFO export of a full-colour font with fontmake's build of it.",
]

[[format]]
id = "ufoz"
label = "UFO ZIP"
extensions = ["ufoz"]
read = true
write = true
spec = "https://unifiedfontobject.org/versions/ufo3/#storage-formats"
area = "import-export"
milestone = "M1"
summary = "A ZIP archive holding one UFO directory tree under a single root folder of arbitrary name; UTF-8 file names, ZIP64 allowed, compression optional, encryption forbidden. Content rules are identical to `ufo3`. Read with our own bounded ZIP reader (stored, deflated and ZIP64 entries); not written yet, so a UFOZ is saved with Save As to another format."
ref = "UFO 3 specification › Storage Formats; PKWARE APPNOTE (ZIP format)"
status = "docs"

[[format]]
id = "ufo2"
label = "Unified Font Object 2"
extensions = ["ufo"]
read = true
write = true
spec = "https://unifiedfontobject.org/versions/ufo2/"
area = "import-export"
milestone = "M1"
summary = "The older single-layer UFO: no layercontents, images, data, guidelines, anchor elements or identifiers; anchors are single-point `move` contours and kerning groups are told apart by name convention rather than the `public.kern1.`/`public.kern2.` prefixes. Read into the same model as UFO 3 (GLIF format 1 anchors become anchors) and written back as UFO 2, as the reference keeps the version when it saves. Kerning groups are recognised as ufoLib does it: a group used on the first (second) side of a kerning pair becomes a `public.kern1.` (`public.kern2.`) group, and saving writes each group back under its own name."
ref = "UFO 2 specification; UFO 3 specification › Changes from UFO 2, kerning.plist › Converting to UFO 3 formatted kerning; norad src/upconversion.rs; Import & Export › Unified Font Object"
status = "docs"

[[format]]
id = "ufo1"
label = "Unified Font Object 1"
extensions = ["ufo"]
read = true
write = false
spec = "https://unifiedfontobject.org/versions/ufo1/"
area = "import-export"
milestone = "M13"
summary = "Read-only import of the first UFO version, up-converted on read: `fontinfo.plist` keys get their UFO 2 names and values (ufoLib's tables), the feature code and PostScript hint data the lib kept under `org.robofab.*` keys move to `features.fea` and the font info, kerning groups get their UFO 3 names as in UFO 2, and GLIF files are format 1. The document is a UFO 3 source, so saving writes UFO 3."
ref = "fontTools ufoLib __init__.py (fontInfoAttributesVersion1To2 and the value tables); defcon objects/font.py (_convertFromFormatVersion1RoboFabData); norad src/upconversion.rs, src/font.rs (FormatVersion::V1)"
status = "docs"
notes = "The reference app's documentation names UFO 2 and 3 as the versions it opens and says it exports UFO 3; UFO 1 is ours, from the UFO 1 specification and the readers above. Test UFO 1 sources are written in code."
guesses = [
  "A font-info value that ufoLib cannot convert (an unknown `fontStyle`, `widthName` or `msCharSet`, or a value of the wrong type) is dropped and the file opens; ufoLib and norad refuse the file instead. A UFO 1 from the tools of that time with such a value would settle whether refusing is better.",
  "The feature code is joined as defcon joins it (a line break between the classes and each feature, tags sorted when the lib has no order); norad leaves out the line breaks between features. Both texts compile the same; a UFO 1 whose features only work with one of the two joins would settle it.",
  "A tag the feature order lists twice is written once, so a crafted order cannot multiply the feature code; defcon writes it each time.",
  "Font-info keys a UFO 1 does not define are dropped, as ufoLib drops them, so the saved UFO 3 holds only valid keys.",
]

[[format]]
id = "designspace5"
label = "Designspace document, format 5.x"
extensions = ["designspace"]
read = true
write = true
spec = "https://fonttools.readthedocs.io/en/latest/designspaceLib/xml.html"
area = "import-export"
milestone = "M1"
summary = "XML file that ties UFO masters into one family: axes (continuous or discrete, with user-to-design `map` nodes, localised names and STAT labels), cross-axis `mappings` (5.1, descriptions 5.2), location labels, sources (optionally a named layer of a UFO), variable-font subsets, instances, substitution rules and three lib dictionaries. Opening one loads every referenced UFO as a master of a single document; all elements are modelled and the document, variable-font and instance libs are preserved."
ref = "fontTools designspaceLib xml.rst; norad src/designspace.rs"
status = "docs"

[[format]]
id = "designspace4"
label = "Designspace document, format 4.x and earlier"
extensions = ["designspace"]
read = true
write = true
spec = "https://fonttools.readthedocs.io/en/latest/designspaceLib/xml.html"
area = "import-export"
milestone = "M1"
summary = "The subset without discrete axes, labels, variable-font elements, user-space locations and localised source names; a file with no `format` attribute is treated as 3.0. May still carry the deprecated MutatorMath elements (`glyph mute`, `kerning mute`, `info copy`, `lib copy`, `features copy` on sources, and per-instance `glyphs`), which we keep verbatim and write back but do not act on. On save the format number is raised to 5.0 only when a version 5 feature is in use."
ref = "fontTools designspaceLib xml.rst (deprecated elements); fontTools/designspaceLib/__init__.py (format selection on write)"
status = "docs"

# ───────────────────────────── Compiled fonts opened for editing ─────────────────────────────

[[format]]
id = "ttf.open"
label = "OpenType, TrueType outlines (opened for editing)"
extensions = ["ttf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/"
area = "import-export"
milestone = "M1"
summary = "Decompiles a static glyf-flavoured font into a one-master document: quadratic outlines stay quadratic, components stay components, names, metrics, cmap, kerning and layout are turned back into font info, parameters, kerning groups and feature code as far as possible, and the binary glyph order is recorded. Contextual kerning, most instructions and tables we cannot interpret do not become editable data."
ref = "Import & Export › Opening Font Files, Opening TrueType Font, Importing OpenType Features; read-fonts 0.45.0"
status = "handbook"

[[format]]
id = "otf.open"
label = "OpenType, CFF outlines (opened for editing)"
extensions = ["otf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/cff"
area = "import-export"
milestone = "M1"
summary = "Decompiles a static CFF-flavoured font into a one-master document with cubic outlines. Alignment zones and standard stems come back as master metrics and stems, and glyph-level stem hints are kept but lose their attachment to nodes; subroutines are flattened and CID font dictionaries are merged into one glyph set."
ref = "Import & Export › Opening Font Files, Importing PostScript Hints; Adobe TN 5176 (CFF), TN 5177 (Type 2 charstrings)"
status = "handbook"

[[format]]
id = "variable-ttf.open"
label = "Variable OpenType, TrueType outlines (opened for editing)"
extensions = ["ttf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/otvaroverview"
area = "import-export"
milestone = "M9"
summary = "Rebuilds axes from fvar, user-to-design maps from avar, named instances and STAT labels, and one master per variation-model peak by applying gvar, HVAR, MVAR and GDEF/GPOS deltas; intermediate regions that affect only some glyphs become intermediate layers. The reference handbook does not list variable fonts among the files it opens, so this is our extension and its fidelity target is ours to set."
ref = "OpenType specification › Font Variations Overview; fontTools varLib (reverse direction); not in Import & Export › Opening Font Files"
status = "inferred"
notes = "Built (M9.14) in `crates/decompile/src/variable.rs`; `file.open` reads every font with an `fvar` table this way and falls back to the default instance, with the reason among the warnings, when the variations cannot be read. Design coordinates are the user range laid over the normalized coordinates after `avar`, so they equal the user coordinates when the font has no `avar`; the Axis Mappings parameter holds the `avar` points as user-to-design pairs, and Variable Font Origin names the default master, which comes first. TrueType masters apply the `gvar` deltas to the `glyf` points (read-fonts infers the points a tuple leaves out) and are rounded to whole units, so contours stay quadratic and composites stay components. Advances come from `HVAR` or the phantom points; ascender, descender, cap height and x-height from `MVAR`. Not read: kerning variations (every master gets the default master's pairs), mark positions, `cvar`, hinting; each is named in the warnings. Limits: 64 axes, 1,024 locations, 256 `avar` points per axis, 2,000,000 added layers (glyphs times masters, plus intermediate layers, checked before any is made), 20,000,000 nodes, 500,000,000 delta applications (each layer counts one)."
guesses = [
  "A variable font beyond the limits (more than 256 avar points on an axis, more than 2,000,000 layers to make) opens as its default instance with the reason among the warnings rather than being refused; settled by checking what users expect when a huge variable font opens.",
  "A peak becomes a master when every coordinate is -1, 0 or 1, or when at least half of the glyphs with variations use it; any other peak becomes an intermediate layer of the glyphs that use it, on the nearest master. Settled by opening fonts built from sources with known masters and intermediate layers and comparing.",
  "A master takes the name of the named instance at its location, else its axis names and design coordinates; an intermediate layer is named by its coordinates in braces.",
]

[[format]]
id = "cff2.open"
label = "Variable OpenType, CFF2 outlines (opened for editing)"
extensions = ["otf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/cff2"
area = "import-export"
milestone = "M9"
summary = "Same reconstruction as `variable-ttf.open`, with masters rebuilt from CFF2 blend operators and the item variation store, so outlines stay cubic. Our extension; not listed by the reference handbook."
ref = "OpenType specification › CFF2; Adobe AFDKO tx (CFF2 reading)"
status = "inferred"
notes = "Built (M9.14) with `variable-ttf.open`: the same axes, instances, labels and mappings; the outlines at each master come from drawing the CFF2 charstrings at its location through skrifa, so they stay cubic."
guesses = [
  "Every region of the CFF2 variation store becomes a master, since the charstrings do not say which glyphs use which region without evaluating them. Settled by opening CFF2 fonts built from sources with intermediate layers and comparing.",
]

