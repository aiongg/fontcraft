milestone = "M13"
summary = "TeX's packed bitmap font: one font at one resolution, each character a run-length or bitmap raster with its TeX width and escapement. Imported as a bitmap strike, like `bdf`."
ref = "PKtype documentation (T. Rokicki), in the TeX distribution"
status = "docs"
origin = "fontforge"
notes = "Reader and writer built (M13.55f) in `crates/io-bitmap/src/pk.rs`, from the format description in the PKtype documentation and the files `gftopk` writes, and `pktype` prints, for METAFONT programs of our own; no code that reads or writes PK was consulted. Read: the preamble (design size, pixels per point), every character in the short, extended short and long preamble forms, rasters as a plain bitmap (`dyn_f` 14) or as run and repeat counts; specials and no-ops are skipped. A character's box is its width and height, its left edge `-hoff` and its bottom `voff - h + 1`; its advance is the escapement rounded to whole pixels and its scalable width the TeX width in thousandths of the design size. Ascent and descent are the glyphs' extent. The file has no glyph names or properties; the strike is marked `CHARSET_REGISTRY` `TeX`, `CHARSET_ENCODING` `FontSpecific`, so its codes are not taken for Unicode. A long-form character whose code is above 2,147,483,647 is left out with a warning. A run or repeat count that reaches past the last row of its box is refused with a message, as is a box above 1,024 pixels, a packet length that does not fit its preamble or the file, a run count beyond 32 bits, and two repeat counts for one row. Written: each character under its code in the smallest preamble form it fits, its raster run-coded with the `dyn_f` that packs it smallest, or as a plain bitmap when that is no larger; no repeat counts. Reachable through `bitmap.importStrikes`, `bitmap.exportStrikes` (format `pk`) and `file.open`. Documented, not yet checked against files the reference reads or writes."
guesses = [
  "A PK or GF strike is `design size × vertical pixels per point` pixels per em, rounded, and its resolution is the pixels per point times 72.27 (TeX points per inch), rounded; the format states no pixel size. Opening a PK file in the secondary reference would show the size it gives the strike.",
  "A PK or GF glyph is named after its code: the character itself for an ASCII letter or digit, else `char` and the decimal code; the file has no names. Importing a PK font into the secondary reference would show the names it picks.",
  "PK and GF codes are in the TeX font's own encoding (OT1, T1 and others; code 123 is an en dash in cmr10), so a PK or GF strike is marked `CHARSET_REGISTRY` `TeX`, `CHARSET_ENCODING` `FontSpecific` and its bitmaps match glyphs by name only, and opening one gives glyphs without code points; letters and digits still match by their names. A PK written from a Unicode strike reads back the same way. Importing a cmr10 PK into the secondary reference would show whether it maps TeX codes to Unicode.",
  "Writing PK leaves out bitmaps without a code and bitmaps whose code an earlier bitmap has, and gives the file a design size that reads back at the strike's pixel size.",
]

