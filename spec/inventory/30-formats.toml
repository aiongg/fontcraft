notes = "Written by file.exportFeatures with format fea-kern (M8.22): group classes, then one lookup per direction with glyph pairs, glyph–group pairs as enum rules and group pairs in that order. Reading is not built: file.importFeatures keeps a kern feature as feature code."

# ───────────────────────────── Tool formats ─────────────────────────────

[[format]]
id = "ttx"
label = "TTX (fontTools XML dump of OpenType tables)"
extensions = ["ttx"]
read = true
write = true
spec = "https://fonttools.readthedocs.io/en/latest/ttx.html"
area = "import-export"
milestone = "M12"
summary = "XML rendering of a compiled font, one element per table, used to inspect, diff and patch binaries. Written and read by the command-line tools for the tables we model; tables we do not model go through as hex dumps so a dump-and-compile cycle keeps them."
ref = "fontTools ttx documentation; AFDKO docs (ttx listed as a companion tool)"
notes = "M12.8, M12.9: reading covers the core tables, CFF, CFF2, VORG, GSUB, GPOS, GDEF, BASE, JSTF, MATH, STAT, fvar, avar, meta, kern, gvar, cvar, HVAR, VVAR, MVAR, CPAL, COLR version 0, SVG and tables written as hex, compiled as fontTools 4.66 compiles them (tables import, tables.importTtx): the layout tables share equal subtables and lay them out in fontTools' order. M12.7c: COLR version 1, the Apple tables (ankr, bsln, cidg, feat, gcid, lcar, ltag, opbd, prop, trak), DSIG, FFTM, LTSH, VDMX, sbix, EBSC, the bitmap tables (EBLC, EBDT, CBLC, CBDT, bloc, bdat) and cmap format 2 are read and written, and dumps split by table and by glyph (ttx -s, ttx -g) are written and read. M12.7e: bitmap images are also read in the row and bitwise forms (ttx -z row, ttx -z bitwise), packed as fontTools packs them. M12.7f: the writer writes them in all four forms of ttx -z (raw, row, bitwise, extfile), and images kept in external files are read, each file confined to the dump's folder. M12.7d: mort and morx are read and written. Not read: an offset that overflows is refused where fontTools would restructure the lookups; a compressed SVG document is stored uncompressed. The XML parser stops past 256 MiB of text, 64 levels of nesting and 50,000,000 elements, and reads literal line ends in attribute values as spaces, as XML parsers do."
status = "docs"

# ───────────────────────────── Images placed in glyphs ─────────────────────────────

[[format]]
id = "image-png"
label = "PNG image placed in a glyph layer"
extensions = ["png"]
read = true
write = true
spec = "https://www.w3.org/TR/png/"
area = "import-export"
milestone = "M11"
summary = "Placed as a tracing template or as the bitmap of a colour glyph. A Glyphs source stores only a path relative to the document, with position, scale, slant, rotation, crop and alpha; a UFO requires the file itself inside `images/` and allows PNG only, so other image types are converted to PNG when saving to UFO. Images are left out of exports except for bitmap colour fonts."
ref = "Edit View › Images; UFO 3 images directory, GLIF image element; Color Fonts › Standard Bitmap Graphics"
status = "docs"
notes = "Read by sniffing the header first (size and resolution), then decoded to RGBA within 64 MiB per file, 16,384 pixels per side and 2^26 pixels. A UFO written by FontCraft carries the image files of the UFO it was read from; saving converts its JPEG and TIFF images to PNG files first (`image-jpeg`) and reports every layer image that is still not a PNG file in the UFO's `images/` folder as a loss (an image of another document, or a file that does not decode)."

[[format]]
id = "image-jpeg"
label = "JPEG image placed in a glyph layer"
extensions = ["jpg", "jpeg"]
read = true
write = false
spec = "https://www.w3.org/Graphics/JPEG/itu-t81.pdf"
area = "import-export"
milestone = "M11"
summary = "Placed by reference like PNG and used as a tracing template or as bitmap colour-glyph data. Not valid inside a UFO, so saving a UFO source re-encodes the JPEG files of its `images/` folder as PNG files, and the images name the PNG file."
ref = "Edit View › Images; Color Fonts › Standard Bitmap Graphics"
status = "handbook"
notes = "Decoded to RGBA within the same limits as PNG; the resolution comes from the JFIF density or the Exif resolution. On saving a UFO (one UFO, a designspace or one UFO per master) each JPEG or TIFF file a glyph image names in the UFO's `images/` folder is decoded under those limits and written as a PNG file of the same pixels, named like the file with a `png` extension (`_1`, `_2`… after the name when that file exists), and the old file is left out. A file that does not decode stays, and the save reports it as an image file that is not a PNG file. The images of a source in another format are not copied into the UFO. The handbook does not say what the reference does with such images in a UFO."
guesses = [
  "A converted image keeps its file name with a `png` extension, numbered when that name is taken, and the original name is not kept. Settled by exporting a font with a JPEG image to UFO from the reference and looking at its images folder and GLIF image element.",
]
observe = ["Font with a JPEG and a TIFF image on two glyphs: export it as UFO; note the files in `images/`, their format and the GLIF `image` elements' file names."]

[[format]]
id = "image-tiff"
label = "TIFF image placed in a glyph layer"
extensions = ["tif", "tiff"]
read = true
write = false
spec = "https://www.itu.int/itudoc/itu-t/com16/tiff-fx/docs/tiff6.pdf"
area = "import-export"
milestone = "M11"
summary = "Placed by reference like PNG; baseline TIFF (uncompressed, LZW, PackBits, 8-bit grey, RGB and RGBA) is decoded for display and for bitmap colour fonts. Other variants show the missing-image marker but keep their reference."
ref = "Edit View › Images; Color Fonts › Standard Bitmap Graphics"
status = "handbook"
notes = "The first page of classic TIFF and BigTIFF is decoded, with at most 1,024 directory entries read; the size is checked before decoding. Saving a UFO source converts its TIFF images to PNG files as it converts JPEG files (`image-jpeg`)."

[[format]]
id = "image-pdf"
label = "PDF page placed as an image"
extensions = ["pdf"]
read = true
write = false
spec = "https://pdfa.org/resource/iso-32000-2/"
area = "import-export"
milestone = "M13"
summary = "The reference accepts every image type its operating system can draw, which includes PDF and PSD. We keep the reference for any file type, and render a PDF's first page as a template once a renderer is available; until then, and always for PSD, the missing-image marker is shown and the reference survives saving."
ref = "Edit View › Images › Adding Images"
status = "handbook"
notes = "M13.58: `crates/io-pdf` draws a PDF's first page (`render_pdf`): its filled and stroked paths in their colours on a transparent background, anti-aliased, at a chosen resolution lowered to fit a pixel budget; text, images and shadings are not drawn. Edit View and Font View draw a placed PDF this way (M11.13, M11.16). The page size in points (`page_size`: the crop box, else the media box, turned by the page's rotation) stands in for a pixel size, so Add Image places the page at one point to one unit and the image commands size and crop it (M11.13b). `glyph.autotraceImage` traces a placed PDF from the page drawn at 4 pixels per point (`decode_pixels` in `crates/engine/src/cmd/image.rs`). Using it in bitmap exports is not built. The reference app's drawing of a placed PDF is documented but not yet observed."
guesses = [
  "The page is drawn on a transparent background, not white, so the glyph shows through around the artwork; placing a PDF in the reference app would show which it uses.",
  "Text and images inside the PDF are not drawn; the reference draws them through the operating system, and a PDF with text placed in the reference app would show the difference.",
]

