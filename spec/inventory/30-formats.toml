# File formats FontCraft reads and writes, and the round-trip rules it commits to.
# Date: 2026-10-07
#
# Sources (all permissively licensed or public documentation; wording is our own):
# - Glyphs file format, versions 2, 3 and 4, and JSON schemas (Apache-2.0):
#   refs/GlyphsSDK/GlyphsFileFormat/GlyphsFileFormatv2.md, v3.md, v4.md, Schemas/*.schema.json
#   https://github.com/schriftgestalt/GlyphsSDK/tree/Glyphs3/GlyphsFileFormat
# - Unified Font Object 3 and 2 specification: refs/ufo-spec/versions/ufo3, ufo2
#   https://unifiedfontobject.org/versions/ufo3/
# - designspace format 5 documentation and reference implementation (MIT):
#   refs/fonttools/Doc/source/designspaceLib/xml.rst, refs/fonttools/Lib/fontTools/designspaceLib/
#   https://fonttools.readthedocs.io/en/latest/designspaceLib/xml.html
# - Rust crates (MIT/Apache-2.0): refs/norad 0.19.0, refs/fontc/glyphs-reader 1.0.0,
#   refs/fontc/fontir 1.0.0, refs/fontc/fea-rs 1.0.0, refs/fontations (read-fonts 0.45.0, write-fonts 0.54.0)
# - Glyphs 4 Handbook, chapter "Import & Export" (and "Edit View › Images", "Color Fonts",
#   "Font Info › Other") for which formats the reference opens, saves, imports and exports
# - FontForge public documentation only: https://fontforge.org/docs/techref/sfdformat.html
#
# Reading aid for the rows below:
# - Compiled fonts have two rows each: `<id>.open` (decompile into the editor, M1) and
#   `<id>.export` (written by the compiler). They are split because the milestones differ.
# - `status = "docs"`: the format and the fact come from a specification or public documentation.
#   `status = "handbook"`: the only source is the reference handbook.
#   `status = "inferred"`: our own design. `status = "memory"`: recalled, no public description found.
# - The field-by-field study behind these rows is docs/spec/30-source-formats.md.

# ───────────────────────────── Native ─────────────────────────────

[[format]]
id = "fontcraft"
label = "FontCraft document"
extensions = ["fontcraft"]
read = true
write = true
spec = "docs/spec/30-source-formats.md#recommended-model"
area = "import-export"
milestone = "M1"
summary = "Our own source format: one UTF-8 JSON document that serialises the in-memory model directly, with a top-level integer `formatVersion` and the writing app version. It is a lossless superset of .glyphs 2/3/4, UFO 3 and designspace 5: every struct carries an `extra` map for keys we do not model. The same extension may hold a gzip stream, detected by its magic bytes."
ref = "docs/spec/30-source-formats.md › Recommended model"
status = "inferred"

# ───────────────────────────── Glyphs sources ─────────────────────────────

[[format]]
id = "glyphs2"
label = "Glyphs file, format version 2 (no .formatVersion key)"
extensions = ["glyphs"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv2.md"
area = "import-export"
milestone = "M1"
summary = "OpenStep-style text property list used by Glyphs 1 and 2: separate `paths` and `components` lists, nodes as strings such as `100 100 CURVE SMOOTH`, positions and transforms as brace strings, hexadecimal `unicode`, up to three fixed axes via weightValue/widthValue/customValue, a single `kerning` plus `vertKerning`, and per-master ascender/capHeight/xHeight/alignmentZones. Read by upgrading in memory to the version 3 shape; written back in version 2 form only when the file was opened as version 2, with a warning for everything version 2 cannot hold (RTL kerning, more than three axes, shape attributes, metrics beyond the fixed five)."
ref = "GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv2.md; Schemas/glyphs-1.schema.json; Import & Export › Glyphs File"
status = "docs"

[[format]]
id = "glyphs3"
label = "Glyphs file, format version 3"
extensions = ["glyphs"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv3.md"
area = "import-export"
milestone = "M1"
summary = "The reference app's default source format: a single UTF-8 OpenStep-style property list holding axes, masters, instances, glyphs with all their layers, three kerning tables (LTR, RTL, vertical), features, classes, prefixes, custom parameters and user data. Everything in the documented schema is modelled; keys outside the schema are kept verbatim in `extra` and written back. This is the format the model is closest to, so an unedited file must come back byte-identical."
ref = "GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv3.md; Schemas/glyphs-3.schema.json; Import & Export › Glyphs File"
status = "docs"

[[format]]
id = "glyphs4"
label = "Glyphs file, format version 4"
extensions = ["glyphs"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv4.md"
area = "import-export"
milestone = "M1"
summary = "Version 3 plus: `kerningContext`, localised axis `names`, glyph-level `axes`, `group` and `groupIdx`, instance `id`, master and layer `active`, images and shape groups as shapes, extra node types (u, h, r) and the tangent flag, per-node `hoi` data, conic gradients, colours as 0–1 floats, the `Color Palettes` parameter as an object, and trailing commas in multi-line arrays. Top-level `familyName` and instance `name` are gone (names live in `properties`), and anchor, guide and component user data moves into `attr`. Documented on 2026-07-17, so expect the schema to move; unknown keys are preserved."
ref = "GlyphsSDK GlyphsFileFormat/GlyphsFileFormatv4.md; Schemas/glyphs-4.schema.json; Font Info › Other › File Format Version"
status = "docs"

[[format]]
id = "glyphspackage"
label = "Glyphs file package"
extensions = ["glyphspackage"]
read = true
write = true
spec = "https://github.com/schriftgestalt/GlyphsSDK/blob/Glyphs3/GlyphsFileFormat/GlyphsFileFormatv4.md#package-glyphspackage"
area = "import-export"
milestone = "M1"
summary = "A directory with the same data as a .glyphs file split up: `fontinfo.plist` (everything but glyphs), `order.plist` (glyph names in order), `UIState.plist` (display strings) and one `glyphs/<name>.glyph` per glyph. Version 4 packages additionally move kerning to `kerning.plist`, the font note to `note.md`, and class, prefix and feature code to `features/@Name.fea`, `features/_Name.fea` and `features/<tag>.fea` (with `.2`, `.3` suffixes on name clashes). Saving rewrites only the files whose content changed."
ref = "GlyphsSDK GlyphsFileFormatv3.md and v4.md › Package; Schemas/fontinfo-3.schema.json, fontinfo-4.schema.json; Import & Export › Glyphs File Package"
status = "docs"

[[format]]
id = "glyphsproject"
label = "Glyphs project"
extensions = ["glyphsproject"]
read = true
write = false
spec = ""
area = "import-export"
milestone = "M13"
summary = "A separate file that links to a Glyphs source and holds its own list of instances and an export destination. The handbook describes the behaviour, but the key layout is not covered by the published format documents, so reading it is planned only after the file has been inspected; nothing is preserved beyond the instance list and the link."
ref = "Import & Export › Projects"
status = "handbook"
notes = "The key layout can be learned in the reference app's trial by saving a project file made from our own synthetic font (docs/plans/M13.md § 8); M13.59 builds the reader after that."
observe = [
  "Make a Project from the instances test font (two masters, three instances, one with a custom parameter), set an export destination, save it, and send back the `.glyphsproject` file: its keys show where the instances, the link to the source and the destination are stored.",
]

# ───────────────────────────── UFO and designspace ─────────────────────────────

[[format]]
id = "ufo3"
label = "Unified Font Object 3"
extensions = ["ufo"]
read = true
write = true
spec = "https://unifiedfontobject.org/versions/ufo3/"
area = "import-export"
milestone = "M1"
summary = "A directory of XML property lists and one GLIF file per glyph per layer: metainfo, fontinfo, groups, kerning, features.fea, lib, layercontents, glyph layers with layerinfo, plus `images/` and `data/`. One UFO is one master. Everything in the specification is read and written; the font, layer, glyph and object libs, the data directory and every identifier are preserved verbatim, while Glyphs-only concepts (smart components, hints tied to nodes, metrics keys, special layers) are carried in lib keys."
ref = "UFO 3 specification (all pages under versions/ufo3); norad 0.19.0; Import & Export › Unified Font Object"
status = "docs"

[[format]]
id = "ufoz"
label = "UFO ZIP"
extensions = ["ufoz"]
read = true
write = true
spec = "https://unifiedfontobject.org/versions/ufo3/#storage-formats"
area = "import-export"
milestone = "M1"
summary = "A ZIP archive holding one UFO directory tree under a single root folder of arbitrary name; UTF-8 file names, ZIP64 allowed, compression optional, encryption forbidden. Content rules are identical to `ufo3`. Read with our own bounded ZIP reader (stored, deflated and ZIP64 entries); not written yet, so a UFOZ is saved with Save As to another format."
ref = "UFO 3 specification › Storage Formats; PKWARE APPNOTE (ZIP format)"
status = "docs"

[[format]]
id = "ufo2"
label = "Unified Font Object 2"
extensions = ["ufo"]
read = true
write = true
spec = "https://unifiedfontobject.org/versions/ufo2/"
area = "import-export"
milestone = "M1"
summary = "The older single-layer UFO: no layercontents, images, data, guidelines, anchor elements or identifiers; anchors are single-point `move` contours and kerning groups are told apart by name convention rather than the `public.kern1.`/`public.kern2.` prefixes. Read into the same model as UFO 3 (GLIF format 1 anchors become anchors) and written back as UFO 2, as the reference keeps the version when it saves. Kerning groups are kept as written; they are not yet recognised as the glyphs' kerning groups (UFO 2 tells them apart by name convention only)."
ref = "UFO 2 specification; UFO 3 specification › Changes from UFO 2, kerning.plist › Converting to UFO 3 formatted kerning; norad src/upconversion.rs; Import & Export › Unified Font Object"
status = "docs"

[[format]]
id = "ufo1"
label = "Unified Font Object 1"
extensions = ["ufo"]
read = true
write = false
spec = "https://unifiedfontobject.org/versions/ufo1/"
area = "import-export"
milestone = "M13"
summary = "Read-only import of the first UFO version, up-converted on read (font info and features stored in lib keys move to their UFO 3 homes). Saving always produces UFO 3. Not supported yet: opening a UFO 1 is refused."
ref = "norad src/upconversion.rs, src/font.rs (FormatVersion::V1)"
status = "docs"
notes = "M13.53 adds the up-conversion to `crates/io-ufo` as norad and fontTools' ufoLib describe it; test UFO 1 sources are written in code."

[[format]]
id = "designspace5"
label = "Designspace document, format 5.x"
extensions = ["designspace"]
read = true
write = true
spec = "https://fonttools.readthedocs.io/en/latest/designspaceLib/xml.html"
area = "import-export"
milestone = "M1"
summary = "XML file that ties UFO masters into one family: axes (continuous or discrete, with user-to-design `map` nodes, localised names and STAT labels), cross-axis `mappings` (5.1, descriptions 5.2), location labels, sources (optionally a named layer of a UFO), variable-font subsets, instances, substitution rules and three lib dictionaries. Opening one loads every referenced UFO as a master of a single document; all elements are modelled and the document, variable-font and instance libs are preserved."
ref = "fontTools designspaceLib xml.rst; norad src/designspace.rs"
status = "docs"

[[format]]
id = "designspace4"
label = "Designspace document, format 4.x and earlier"
extensions = ["designspace"]
read = true
write = true
spec = "https://fonttools.readthedocs.io/en/latest/designspaceLib/xml.html"
area = "import-export"
milestone = "M1"
summary = "The subset without discrete axes, labels, variable-font elements, user-space locations and localised source names; a file with no `format` attribute is treated as 3.0. May still carry the deprecated MutatorMath elements (`glyph mute`, `kerning mute`, `info copy`, `lib copy`, `features copy` on sources, and per-instance `glyphs`), which we keep verbatim and write back but do not act on. On save the format number is raised to 5.0 only when a version 5 feature is in use."
ref = "fontTools designspaceLib xml.rst (deprecated elements); fontTools/designspaceLib/__init__.py (format selection on write)"
status = "docs"

# ───────────────────────────── Compiled fonts opened for editing ─────────────────────────────

[[format]]
id = "ttf.open"
label = "OpenType, TrueType outlines (opened for editing)"
extensions = ["ttf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/"
area = "import-export"
milestone = "M1"
summary = "Decompiles a static glyf-flavoured font into a one-master document: quadratic outlines stay quadratic, components stay components, names, metrics, cmap, kerning and layout are turned back into font info, parameters, kerning groups and feature code as far as possible, and the binary glyph order is recorded. Contextual kerning, most instructions and tables we cannot interpret do not become editable data."
ref = "Import & Export › Opening Font Files, Opening TrueType Font, Importing OpenType Features; read-fonts 0.45.0"
status = "handbook"

[[format]]
id = "otf.open"
label = "OpenType, CFF outlines (opened for editing)"
extensions = ["otf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/cff"
area = "import-export"
milestone = "M1"
summary = "Decompiles a static CFF-flavoured font into a one-master document with cubic outlines. Alignment zones and standard stems come back as master metrics and stems, and glyph-level stem hints are kept but lose their attachment to nodes; subroutines are flattened and CID font dictionaries are merged into one glyph set."
ref = "Import & Export › Opening Font Files, Importing PostScript Hints; Adobe TN 5176 (CFF), TN 5177 (Type 2 charstrings)"
status = "handbook"

[[format]]
id = "variable-ttf.open"
label = "Variable OpenType, TrueType outlines (opened for editing)"
extensions = ["ttf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/otvaroverview"
area = "import-export"
milestone = "M9"
summary = "Rebuilds axes from fvar, user-to-design maps from avar, named instances and STAT labels, and one master per variation-model peak by applying gvar, HVAR, MVAR and GDEF/GPOS deltas; intermediate regions that affect only some glyphs become intermediate layers. The reference handbook does not list variable fonts among the files it opens, so this is our extension and its fidelity target is ours to set."
ref = "OpenType specification › Font Variations Overview; fontTools varLib (reverse direction); not in Import & Export › Opening Font Files"
status = "inferred"

[[format]]
id = "cff2.open"
label = "Variable OpenType, CFF2 outlines (opened for editing)"
extensions = ["otf"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/cff2"
area = "import-export"
milestone = "M9"
summary = "Same reconstruction as `variable-ttf.open`, with masters rebuilt from CFF2 blend operators and the item variation store, so outlines stay cubic. Our extension; not listed by the reference handbook."
ref = "OpenType specification › CFF2; Adobe AFDKO tx (CFF2 reading)"
status = "inferred"

[[format]]
id = "ttc.open"
label = "OpenType collection (opened for editing)"
extensions = ["ttc", "otc"]
read = true
write = false
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/otff#font-collections"
area = "import-export"
milestone = "M1"
summary = "Lists the member fonts of a collection and opens the chosen ones, each as its own document (or, on request, as masters of one document when they are compatible). The handbook names only the TrueType-flavoured `.ttc`; CFF-flavoured `.otc` files use the same container and are handled the same way."
ref = "Import & Export › Opening Font Files; OpenType specification › Font Collections; read-fonts FileRef"
status = "handbook"

[[format]]
id = "woff.open"
label = "WOFF 1.0 (opened for editing)"
extensions = ["woff"]
read = true
write = false
spec = "https://www.w3.org/TR/WOFF/"
area = "import-export"
milestone = "M1"
summary = "Unwraps the zlib-compressed table directory to the sfnt inside and then proceeds as `ttf.open` or `otf.open`. The metadata XML block and private data block are kept as opaque attachments so a later export can put them back."
ref = "W3C WOFF 1.0; UFO 3 fontinfo.plist › WOFF Data"
status = "docs"

[[format]]
id = "woff2.open"
label = "WOFF 2.0 (opened for editing)"
extensions = ["woff2"]
read = true
write = false
spec = "https://www.w3.org/TR/WOFF2/"
area = "import-export"
milestone = "M1"
summary = "Decodes the Brotli stream and reverses the glyf, loca and hmtx transforms to recover the sfnt, then proceeds as `ttf.open` or `otf.open`. Table order and checksums of the original file are not recoverable, which matters only to byte comparisons."
ref = "W3C WOFF 2.0"
status = "docs"

# ───────────────────────────── Compiled fonts written by export ─────────────────────────────

[[format]]
id = "ttf.export"
label = "OpenType, TrueType outlines (export)"
extensions = ["ttf"]
read = false
write = true
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/"
area = "import-export"
milestone = "M2"
summary = "Static font with a glyf table, one per exported instance: cubic curves are converted to quadratic, components are kept, and TrueType hinting data is compiled when present. Source-only data (guides, notes, backup layers, images, user data, disabled features and parameters) is dropped."
ref = "Import & Export › OpenType Export; write-fonts 0.54.0"
status = "handbook"

[[format]]
id = "otf.export"
label = "OpenType, CFF outlines (export)"
extensions = ["otf"]
read = false
write = true
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/cff"
area = "import-export"
milestone = "M2"
summary = "Static font with a CFF table, one per exported instance: cubic outlines as drawn, components decomposed, stem hints and alignment zones written into charstrings and the private dictionary. Quadratic paths in the source are converted to cubic. FontCraft's compiler builds this flavour of one master as fontmake does (M2.3b): alignment zones and stems in the Private DICT, no stem hints in the charstrings (autohinting is M10); the export command offers it from M2.5."
ref = "Import & Export › OpenType Export › Outline Flavor; Adobe TN 5176, TN 5177"
status = "handbook"

[[format]]
id = "variable-ttf.export"
label = "Variable OpenType, TrueType outlines (export)"
extensions = ["ttf"]
read = false
write = true
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/otvaroverview"
area = "import-export"
milestone = "M9"
summary = "One variable font per variable-font setting (or one default setting), always with TrueType outlines in the reference app: fvar, avar, gvar, HVAR, MVAR, STAT and variable GDEF/GPOS, with alternate layers compiled to feature variations. Requires compatible masters; incompatible glyphs are reported, not silently dropped."
ref = "Import & Export › Exporting Variable Fonts"
status = "handbook"

[[format]]
id = "cff2.export"
label = "Variable OpenType, CFF2 outlines (export)"
extensions = ["otf"]
read = false
write = true
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/cff2"
area = "import-export"
milestone = "M9"
summary = "Variable font with cubic outlines stored as CFF2 blends. The reference app exports variable fonts only with TrueType outlines, so this follows the AFDKO and fontmake tool chains instead and is offered as an extra flavour."
ref = "OpenType specification › CFF2; AFDKO buildcff2vf; fontmake variable-cff2 output"
status = "docs"
notes = "Built in M9 (M9.13) and offered from the command line and `file.exportVariable {flavour: cff2}` only; the Export dialog's Variable tab stays TrueType, as the reference app offers (docs/plans/M9.md § 7, question 8 (a), decided by the orchestrator on the owner's behalf)."

[[format]]
id = "ttc.export"
label = "OpenType collection (export)"
extensions = ["ttc", "otc"]
read = false
write = true
spec = "https://learn.microsoft.com/en-us/typography/opentype/spec/otff#font-collections"
area = "import-export"
milestone = "M12"
summary = "Packs several compiled fonts into one collection file and shares byte-identical tables between members. A command-line job modelled on the AFDKO collection tools; the reference app's export dialog has no collection option."
ref = "OpenType specification › Font Collections; AFDKO otf2otc, otc2otf; fontTools ttLib.ttCollection"
notes = "Written by collection.pack (plain or WOFF2) with otf2otc's layout; compiling straight to a collection is M12.42."
status = "docs"

[[format]]
id = "woff.export"
label = "WOFF 1.0 (export)"
extensions = ["woff"]
read = false
write = true
spec = "https://www.w3.org/TR/WOFF/"
area = "import-export"
milestone = "M2"
summary = "Wraps a compiled TTF or OTF table by table with zlib compression. Optional extended metadata comes from the WOFF fields of the font info when present; a private data block is written only when one was imported."
ref = "Import & Export › OpenType Export › File Format; W3C WOFF 1.0; UFO 3 fontinfo.plist › WOFF Data"
status = "handbook"

[[format]]
id = "woff2.export"
label = "WOFF 2.0 (export)"
extensions = ["woff2"]
read = false
write = true
spec = "https://www.w3.org/TR/WOFF2/"
area = "import-export"
milestone = "M2"
summary = "Wraps a compiled TTF or OTF with the WOFF2 table transforms and Brotli compression. Needs a pure-Rust Brotli encoder; the fontations crates in our reference set contain no WOFF2 writer, so the container code is ours."
ref = "Import & Export › OpenType Export › File Format; W3C WOFF 2.0"
status = "handbook"

# ───────────────────────────── Feature code ─────────────────────────────

[[format]]
id = "fea"
label = "OpenType feature file (AFDKO syntax)"
extensions = ["fea"]
read = true
write = true
spec = "https://adobe-type-tools.github.io/afdko/OpenTypeFeatureFileSpecification.html"
area = "import-export"
milestone = "M8"
summary = "Plain-text layout code. Importing splits a file into named classes, feature blocks and a prefix that receives everything else (language systems, standalone lookups, table blocks); exporting concatenates prefixes, classes and enabled features in order. Within UFO the whole `features.fea` text is already carried untouched from M1 on, including `include()` statements, whose targets are resolved relative to the UFO."
ref = "AFDKO OpenTypeFeatureFileSpecification; UFO 3 features.fea; Import & Export › Importing Feature Files; fea-rs 1.0.0"
status = "docs"

# ───────────────────────────── Legacy formats ─────────────────────────────

[[format]]
id = "type1"
label = "Adobe Type 1 (PFB binary, PFA text)"
extensions = ["pfb", "pfa"]
read = true
write = true
spec = "https://adobe-type-tools.github.io/font-tech-notes/pdfs/T1_SPEC.pdf"
area = "import-export"
milestone = "M12"
summary = "Reads the font dictionary, eexec-encrypted private dictionary and Type 1 charstrings into a one-master document with cubic outlines, stem hints, blue zones and standard stems; `seac` accents become components. Kerning and reliable metrics need the companion AFM or PFM, which are picked up when they sit next to the font. Writing exists for command-line conversion only; multiple-master Type 1 fonts are out of scope."
ref = "Import & Export › Opening Font Files (.pfb); Adobe Type 1 Font Format; AFDKO tx (-t1)"
status = "docs"

[[format]]
id = "afm"
label = "Adobe Font Metrics"
extensions = ["afm"]
read = true
write = true
spec = "https://adobe-type-tools.github.io/font-tech-notes/pdfs/5004.AFM_Spec.pdf"
area = "import-export"
milestone = "M5"
summary = "Text file with global metrics, per-glyph advance widths and bounding boxes, and flat kerning pairs. Exported for one master and imported into one master; group kerning is expanded to pairs on export and metrics keys are not representable, so importing can change sidebearings and break links."
ref = "Import & Export › Exporting Metrics, Importing Metrics; Adobe TN 5004"
status = "docs"
notes = "Built (M5.14) in `crates/spacing/src/afm.rs`. Written: StartFontMetrics 4.1, the names, ItalicAngle, FontBBox and the vertical metrics, a `C` line per glyph (WX and B, whole numbers; the code of the first Unicode value up to 255, else -1) and `KPX` pairs. Read: `C`/`CH` lines (WX, W0X, W, W0, N, B), `KPX` and `KP`, the global keywords; composites, track kerning, KPY and KPH are skipped. Line ends `\\n`, `\\r\\n` or `\\r`. Limits: 64 MB, lines of 4,096 bytes, 65,535 glyphs, 2,000,000 pairs (Inter's Regular master covers about 490,000). fontTools `afmLib` (MIT) is the oracle: it reads what FontCraft writes, and FontCraft reads what it writes; its glyph-name pattern lacks `-`, which the measure's script widens."
guesses = [
  "A glyph's code is its first Unicode value when that is at most 255, else -1; Adobe's note means a code in the font's encoding. An AFM exported by the reference would settle it.",
]

[[format]]
id = "pfm"
label = "Printer Font Metrics (Windows)"
extensions = ["pfm"]
read = true
write = false
spec = ""
area = "import-export"
milestone = "M13"
summary = "Binary companion of a Type 1 font holding widths, a few global metrics, Windows naming data and a pair-kerning table indexed by character code. Read only, as a metrics and kerning source when a PFB is opened without an AFM, or through Import Kerning from Metrics File; kerning is limited to the encoded glyphs."
ref = "Microsoft Windows 3.1 Device Development Kit, Printer Drivers, chapter 2 \"Printer Font Metrics (PFM) Files\" (PFMHEADER, EXTTEXTMETRIC, KERNPAIR), public copy at https://www.pcjs.org/documents/books/mspl13/win/w3ddkprn; Adobe Technical Note 5178 (no reachable copy found)"
status = "docs"
notes = "Verified by the M13 planning pass: the layout is described in the Windows 3.1 DDK chapter named in `ref`. No corpus file is a PFM; tests build PFM files in code (docs/plans/M13.md, M13.54)."

[[format]]
id = "cff"
label = "Bare CFF font program"
extensions = ["cff"]
read = true
write = true
spec = "https://adobe-type-tools.github.io/font-tech-notes/pdfs/5176.CFF.pdf"
area = "import-export"
milestone = "M12"
summary = "A CFF table on its own, without the sfnt wrapper: outlines, hints, glyph names and the top and private dictionaries, but no cmap, metrics tables, kerning or layout. Opened as a one-master document with code points guessed from glyph names; written for command-line conversion."
ref = "Adobe TN 5176; AFDKO tx (-cff)"
status = "docs"

[[format]]
id = "svg-font"
label = "SVG 1.1 font"
extensions = ["svg"]
read = true
write = true
spec = "https://www.w3.org/TR/SVG11/fonts.html"
area = "import-export"
milestone = "M12"
summary = "An SVG document with a `font` element: `font-face` metrics, `glyph` elements carrying a path, a unicode string and an advance, a `missing-glyph`, and `hkern`/`vkern` pairs. Paths are in font units with the y axis up; kerning is flat and there are no components, hints or layout features."
ref = "SVG 1.1 › Fonts; AFDKO tx (-svg)"
status = "docs"

[[format]]
id = "bdf"
label = "Glyph Bitmap Distribution Format"
extensions = ["bdf"]
read = true
write = false
spec = "https://adobe-type-tools.github.io/font-tech-notes/pdfs/5005.BDF_Spec.pdf"
area = "import-export"
milestone = "M13"
summary = "Text bitmap font, one pixel size per file, with per-glyph bounding box, advance and hex-encoded rows plus X font properties. Imported as a bitmap strike attached to glyphs matched by name or encoding: a tracing aid and a source for embedded bitmap strikes, never converted to outlines automatically."
ref = "Adobe TN 5005"
status = "docs"
notes = "M13.55; strikes are stored as M11 stores bitmap strikes."

[[format]]
id = "pcf"
label = "Portable Compiled Format (X11 bitmap font)"
extensions = ["pcf"]
read = true
write = false
spec = "https://fontforge.org/docs/techref/pcf-format.html"
area = "import-export"
milestone = "M13"
summary = "Binary sibling of BDF with a table directory (properties, metrics, bitmaps, encodings, glyph names, accelerators). Imported the same way as `bdf`; no official specification exists, only third-party format descriptions, so support is limited to what those describe."
ref = "FontForge documentation › PCF format (public docs only)"
status = "docs"
origin = "fontforge"
notes = "M13.55, with BDF."

[[format]]
id = "sfd"
label = "FontForge Spline Font Database"
extensions = ["sfd", "sfdir"]
read = true
write = false
spec = "https://fontforge.org/docs/techref/sfdformat.html"
area = "import-export"
milestone = "M13"
summary = "ASCII keyword-and-value source file that starts with `SplineFontDB: <version>`: a font header, then `StartChar`…`EndChar` blocks with `SplineSet` contours, references, anchor points, hints and per-glyph kerning and substitutions that point at named lookups, then optional bitmap strikes; `.sfdir` is the same split into one file per glyph. Import covers outlines, references, anchors, metrics, layers, names and kerning as the public page describes them. That page says it can lag behind the program, whose source we may not read, so lookups and anything undescribed are skipped and reported."
ref = "FontForge documentation › Spline Font Database File Format (public docs only)"
status = "docs"
origin = "fontforge"
notes = "M13.56, a new reader crate. If the owner installs FontForge on the build machine, running it as a black-box program on our own synthetic fonts produces test files; its source is never read."

# ───────────────────────────── Outline interchange ─────────────────────────────

[[format]]
id = "svg-outline"
label = "SVG drawing (glyph outline import and export)"
extensions = ["svg"]
read = true
write = true
spec = "https://www.w3.org/TR/SVG2/"
area = "import-export"
milestone = "M3"
summary = "Imports the vector geometry of an SVG file into a glyph layer: paths and basic shapes after applying transforms, flipped to the y-up font coordinate system. Fill, stroke styling and everything that is not geometry is discarded. In Font View several files are matched to glyphs by file name; export writes one layer as a plain path."
ref = "Import & Export › Importing Outlines"
status = "handbook"

[[format]]
id = "pdf-outline"
label = "PDF artwork (glyph outline import)"
extensions = ["pdf"]
read = true
write = false
spec = "https://pdfa.org/resource/iso-32000-2/"
area = "import-export"
milestone = "M13"
summary = "Imports the path-construction operators of the first page's content stream as outlines; stroke width is kept as a stroke attribute on the path, while fill colour and other styling are dropped. Text, images, shadings and clipping are ignored."
ref = "Import & Export › Importing Outlines"
status = "handbook"
notes = "M13.58, on the `lopdf` crate (MIT; docs/plans/M13.md § 7 question 7), with FontCraft's PDF limits checked before each call."

[[format]]
id = "eps-outline"
label = "Encapsulated PostScript artwork (glyph outline import)"
extensions = ["eps"]
read = true
write = false
spec = ""
area = "import-export"
milestone = "M13"
summary = "Imports outlines from EPS files of the kind drawing applications save: a small interpreter for path, transform and paint operators, not a full PostScript implementation. Files that rely on procedures beyond that subset are rejected with a message rather than imported wrongly."
ref = "Import & Export › Importing Outlines; Adobe Technical Note 5002, Encapsulated PostScript File Format 3.0 (no stable public URL verified)"
status = "handbook"
notes = "M13.57: our own interpreter for the path, transform and paint operators drawing applications write."

[[format]]
id = "clipboard"
label = "Clipboard flavours for shapes, glyphs and kerning"
extensions = []
read = true
write = true
spec = "docs/spec/30-source-formats.md#recommended-model"
area = "import-export"
milestone = "M3"
summary = "Copy places three flavours on the clipboard: our own JSON fragment of the model (shapes, anchors, whole layers or glyphs, or kerning pairs, with every attribute), an SVG path for drawing applications, and plain text. Paste prefers our JSON, then SVG, then PDF, as vector applications offer them; pasted artwork far outside the glyph box triggers the bounds-correction prompt and coordinates are rounded to the grid unless the grid is zero."
ref = "Import & Export › Vector Drawing Applications"
status = "inferred"
notes = "The PDF flavour waits for M11 with PDF import; M3 builds the JSON and SVG flavours."

# ───────────────────────────── Kerning and metrics interchange ─────────────────────────────

[[format]]
id = "kerning-text"
label = "Plain-text kerning and metrics table"
extensions = ["tsv", "txt"]
read = true
write = true
spec = "docs/spec/30-source-formats.md#211-kerning"
area = "import-export"
milestone = "M5"
summary = "Our own tab-separated exchange format for one master: kerning lines `first<TAB>second<TAB>value` where a side starting with `@` names a kerning group, group membership lines, and optional metrics lines giving LSB, RSB, width and metrics keys per glyph. It exists because AFM cannot hold groups or keys and the reference's own metrics file is undocumented; it is also what the Kerning window copies as text."
ref = "Import & Export › Exporting Metrics (the reference's undocumented Metrics File is the model for the content)"
status = "inferred"
own = true
notes = "Lines: an optional `kerning-text<TAB>1` header, `master` and `direction` lines, `group<TAB>side<TAB>name<TAB>member…` lines (a long group continues on further lines), `metrics<TAB>glyph<TAB>lsb<TAB>rsb<TAB>width<TAB>leftKey<TAB>rightKey<TAB>widthKey` lines and three-field pair lines in command spelling. The module doc of `crates/spacing/src/kerning_text.rs` is the full description. Limits: 16 MB, lines of 4,096 bytes, 500,000 pairs, values from -32,768 to 32,767."

[[format]]
id = "fea-kern"
label = "Kerning as feature code"
extensions = ["fea"]
read = true
write = true
spec = "https://adobe-type-tools.github.io/afdko/OpenTypeFeatureFileSpecification.html#6.b"
area = "import-export"
milestone = "M8"
summary = "Writes a master's kerning as a `kern` feature with class definitions and pair-positioning rules, and reads simple pair rules (glyph or class on each side, x-advance only) from a `kern` or `dist` feature back into kerning and groups. Contextual rules, device adjustments and value records that change more than the advance are left as feature code."
ref = "AFDKO OpenTypeFeatureFileSpecification › GPOS pair adjustment; Import & Export › Importing OpenType Features"
status = "docs"

