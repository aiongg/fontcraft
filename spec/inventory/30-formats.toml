read = true
write = false
spec = "https://ctan.org/pkg/mfware"
area = "import-export"
milestone = "M13"
summary = "The bitmap font METAFONT writes: each character painted row by row, with a postamble of escapements and TeX widths. Imported as a bitmap strike, like `bdf`."
ref = "GFtype documentation (D. E. Knuth), in the TeX distribution"
status = "docs"
origin = "fontforge"
notes = "Reader built (M13.55f) in `crates/io-bitmap/src/gf.rs`, from the format description in the GFtype documentation and the files METAFONT writes, and `gftype` prints, for programs of our own; no code that reads or writes GF was consulted. Every paint, skip, new-row, special and no-op command is read; `boc` and `boc1` start a character, whose columns run from `min_m` to `max_m` - 1 and rows from `max_n` down to `min_n` (pixel (m, n) is the unit square above and right of (m, n)). The postamble's design size and pixels per point give the strike's size, as for `pk`; its character locators give each character's advance (escapement rounded to pixels) and scalable width, by code modulo 256. A character without a locator advances by its bitmap's right edge, with a warning. A black paint outside the box its `boc` states is refused with a message, as is a box above 1,024 pixels or with coordinates beyond ±32,767, a negative code and a file cut short. Reachable through `bitmap.importStrikes` and `file.open`. Documented, not yet checked against files the reference reads."
