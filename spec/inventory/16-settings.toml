# --- Appearance ---

[[panel]]
id = "settings.appearance"
label = "Appearance"
location = "window"
controls = [
  "Display Unicode Value checkbox",
  "Always use Light Mode checkboxes: Font View, Edit View",
  "Text View Width field",
  "Handle size control",
  "Display Mark Cloud checkbox",
  "colour wells in two columns (light and dark appearance): corner nodes, smooth nodes, alignment zones, foreground stroke, background stroke, other layers stroke, canvas, negative kerning, positive kerning",
  "Standard button",
]
area = "ui-chrome"
milestone = "M14"
summary = "Section that sets how Font View and Edit View are drawn."
ref = "Settings › Appearance"
status = "handbook"
notes = "FontCraft (M14.2, dialogs/settings_appearance.rs): Display Unicode Value, the two Always use Light Mode checkboxes, the handle size as three segments, then a table with one row per colour and a Light and a Dark well in each row, then Standard (settings.resetColors). Every control writes its setting with settings.set; a well takes a colour from its picker or as #RRGGBB or #RRGGBBAA text, and text that is not a colour changes nothing. The column of the appearance the canvas is drawn in is marked In use. Text View Width and Display Mark Cloud are left out until their behaviour exists (M5.30, the mark cloud)."
guesses = [
  "The wells sit in a table with the light set left and the dark set right, one row per item, in the handbook's order.",
  "The handle size is a three-way choice, Small, Regular and Large; the handbook names the control only.",
]
observe = [
  "Open Settings › Appearance and note the order of the controls and how the light and dark wells are laid out.",
]

[[setting]]
id = "appearance.displayUnicodeValue"
label = "Display Unicode Value"
kind = "bool"
section = "Appearance"
values = ""
area = "font-view"
milestone = "M4"
summary = "Chooses what an encoded glyph's Font View cell shows in its bottom-right corner: either a small generic Unicode badge or the actual code point. Which state of the option gives which is not spelled out (presumably on shows the code point)."
ref = "Settings › Appearance"
status = "handbook"
notes = "Moved from M14 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): the Font View cell behaviour `fontView.cell.displayUnicodeValue` (M4) depends on it; it is set with settings.set until the settings window (M14)."
guesses = [
  "On shows the code point, off the small marker, as the handbook's wording implies. Settled by observation.",
  "Off by default (the small marker), as the handbook gives no default. Settled by observing a fresh install.",
]

