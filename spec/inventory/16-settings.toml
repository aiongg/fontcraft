# Inventory: Settings
# Source: Glyphs 4 Handbook, chapter "Settings" (https://handbook.glyphsapp.com/single-page/)
# Date: 2026-10-07
# All wording is our own. Setting ids are <section>.<name>. Rows with status "inferred" are
# FontCraft design; rows with status "memory" are recalled and not confirmed by this chapter.

# --- Settings window ---

[[command]]
id = "app.settings"
label = "Settings…"
menu = ["FontCraft"]
shortcut = "Cmd+Comma"
kind = "ui"
params = "{section?: \"updates\"|\"appearance\"|\"userSettings\"|\"sampleStrings\"|\"sharing\"|\"addons\"|\"shortcuts\"}"
area = "ui-chrome"
milestone = "M14"
summary = "Opens the settings window, optionally on a given section. In the reference it sits in the application menu."
ref = "Settings (chapter introduction)"
status = "handbook"

[[command]]
id = "settings.get"
label = "Get Setting"
menu = []
shortcut = ""
kind = "engine"
params = "{id?: string}"
area = "ui-chrome"
milestone = "M4"
summary = "Read-only query returning one preference value by setting id, or all of them when no id is given. Not in the reference; proposed so every preference is reachable headless."
ref = "Settings (whole chapter)"
status = "inferred"
notes = "Moved from M14 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): the Start Window, the Filters sidebar, the Languages list and Display Unicode Value keep user settings (the owner's decision, docs/plans/M4.md § 7 question 4). The settings window stays M14. Besides the preferences it returns the ids other commands write: fontView.filters, fontView.visibleScripts, file.recentDocuments, start.chooserPicks (crates/engine/src/settings.rs)."
guesses = [
  "Our own command; the reference has no headless access to settings, so there is nothing to settle.",
]

[[command]]
id = "settings.set"
label = "Set Setting"
menu = []
shortcut = ""
kind = "engine"
params = "{id: string, value: any}"
area = "ui-chrome"
milestone = "M4"
summary = "Writes one preference by setting id, with the same validation and side effects as changing it in the settings window. Not in the reference; proposed for agents and the CLI."
ref = "Settings (whole chapter)"
status = "inferred"
notes = "Moved from M14 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6), with settings.get. It accepts the [[setting]] ids FontCraft implements (crates/engine/src/settings.rs, SETTINGS), checks the value against the row's kind, and takes null for the default. The ids other commands write are refused. Limits: 1,024 ids, 1 MB per value, 64 levels of nesting, 8 MB per settings file; a settings file that cannot be read gives the defaults and a report."
guesses = [
  "Our own command; the reference has no headless access to settings, so there is nothing to settle.",
]

[[panel]]
id = "window.settings"
label = "Settings"
location = "window"
controls = [
  "section switcher: Updates, Appearance, User Settings, Sample Strings, Sharing, Addons, Shortcuts",
  "content area of the chosen section",
]
area = "ui-chrome"
milestone = "M14"
summary = "Application-wide preferences window with seven sections, shown in the order listed."
ref = "Settings (chapter introduction)"
status = "handbook"

[[behavior]]
id = "settings.menuItemNameOnOlderSystem"
area = "ui-chrome"
milestone = "M14"
summary = "On macOS 12 the menu item that opens the window is labelled Preferences instead of Settings…; the shortcut is the same. On other platforms FontCraft follows the platform's convention for the item name and place."
ref = "Settings (chapter introduction)"
status = "handbook"

[[behavior]]
id = "settings.surviveVersionChange"
area = "ui-chrome"
milestone = "M14"
summary = "Preferences are kept when a newer version is installed or an older one is reinstalled."
ref = "Settings › Updates"
status = "handbook"

# --- Updates ---

[[panel]]
id = "settings.updates"
label = "Updates"
location = "window"
controls = [
  "Check Now button",
  "Automatically check for updates checkbox",
  "Show cutting edge versions checkbox",
]
area = "ui-chrome"
milestone = "M14"
summary = "Section that controls how the application looks for and installs new versions."
ref = "Settings › Updates"
status = "handbook"

[[command]]
id = "settings.checkForUpdatesNow"
label = "Check Now"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M14"
summary = "Looks for a newer version immediately. When one exists the app offers to download it and shows the list of additions and changes."
ref = "Settings › Updates"
status = "handbook"

[[setting]]
id = "updates.automaticallyCheck"
label = "Automatically check for updates"
kind = "bool"
section = "Updates"
values = ""
area = "ui-chrome"
milestone = "M14"
summary = "When on, the app looks for new versions periodically in the background. The interval is not stated; the reference recommends leaving it on."
ref = "Settings › Updates"
status = "handbook"

[[setting]]
id = "updates.showCuttingEdgeVersions"
label = "Show cutting edge versions"
kind = "bool"
section = "Updates"
values = ""
area = "ui-chrome"
milestone = "M14"
summary = "When on, update checks also offer beta builds, which appear often and are less tested than releases. Default is not stated (presumably off)."
ref = "Settings › Updates"
status = "handbook"

[[behavior]]
id = "updates.offerShowsChangeList"
area = "ui-chrome"
milestone = "M14"
summary = "An available update is presented with its change list and a download offer; nothing is installed without the user accepting."
ref = "Settings › Updates"
status = "handbook"

[[behavior]]
id = "updates.revertByReinstallingStable"
area = "ui-chrome"
milestone = "M14"
summary = "There is no in-app downgrade: going back from a beta to the latest stable build means downloading the stable build again from the vendor's site."
ref = "Settings › Updates"
status = "handbook"

[[behavior]]
id = "updates.betaAdvice"
area = "ui-chrome"
milestone = "M14"
summary = "When beta builds are enabled, the user should be advised to work on copies of font files."
ref = "Settings › Updates"
status = "handbook"

# --- Appearance ---

[[panel]]
