ref = "Settings › Sharing"
status = "inferred"

# --- Addons ---

[[panel]]
id = "settings.addons"
label = "Addons"
location = "window"
controls = [
  "Python version pop-up",
  "Use system console for script output checkbox",
  "Alternate Plugin Repos multi-line text field",
]
area = "extensions"
milestone = "M13"
summary = "Section that configures how scripts, plug-ins and modules run and where the Plugin Manager finds them."
ref = "Settings › Addons"
status = "handbook"

[[setting]]
id = "addons.pythonVersion"
label = "Python version"
kind = "choice"
section = "Addons"
values = ""
area = "extensions"
milestone = "M13"
summary = "Which installed Python interpreter runs scripts and plug-ins; values are the interpreters found on the machine plus the one installed by the Plugin Manager, labelled (Glyphs). Needs Python 3 or later and a relaunch. FontCraft embeds no Python, so it has no such setting."
ref = "Settings › Addons › Python version"
status = "handbook"

[[setting]]
id = "addons.useSystemConsoleForScriptOutput"
label = "Use system console for script output"
kind = "bool"
section = "Addons"
values = ""
area = "extensions"
milestone = "M13"
summary = "Sends log output of scripts and plug-ins to the operating system's console instead of the Macro Panel console; meant for debugging when the Macro Panel cannot be reached."
ref = "Settings › Addons › Console Output"
status = "handbook"

[[setting]]
id = "addons.alternatePluginRepos"
label = "Alternate Plugin Repos"
kind = "string"
section = "Addons"
values = ""
area = "extensions"
milestone = "M13"
summary = "Extra extension repositories listed in addition to the main one, one entry per line. An entry is an HTTPS URL (HTTP Basic credentials allowed) or a full local file path."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.pythonRequired"
area = "extensions"
milestone = "M13"
summary = "Most scripts and plug-ins of the reference need Python, and only version 3 or later is accepted."
ref = "Settings › Addons › Python version"
status = "handbook"

[[behavior]]
id = "addons.pythonInstallViaModules"
area = "extensions"
milestone = "M13"
summary = "When no interpreter is chosen or the chosen one does not work, the remedy is to install Python from the Modules tab of the Plugin Manager and then pick the entry labelled (Glyphs)."
ref = "Settings › Addons › Python version"
status = "handbook"

[[behavior]]
id = "addons.pythonChangeNeedsRelaunch"
area = "extensions"
milestone = "M13"
summary = "A changed Python version is used only after the app is relaunched."
ref = "Settings › Addons › Python version"
status = "handbook"

[[behavior]]
id = "addons.repo.mainRepository"
area = "extensions"
milestone = "M13"
summary = "One main repository, available to every user, is always listed; alternates are added to it, never replace it."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.repo.httpBasicAuth"
area = "extensions"
milestone = "M13"
summary = "An alternate repository URL may require a user name and password, sent with HTTP Basic authentication over HTTPS."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.repo.localPath"
area = "extensions"
milestone = "M13"
summary = "A full file path in place of a URL makes a local repository definition usable."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.repo.purpose"
area = "extensions"
milestone = "M13"
summary = "Alternate repositories serve pre-release distribution and private, company-internal extensions."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.repo.definitionStructure"
area = "extensions"
milestone = "M13"
summary = "A repository definition is one property-list-style dictionary with a packages dictionary holding up to three lists: plugins, scripts and modules. Each entry has titles, url, path, descriptions and screenshot; further fields exist in the main repository file."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.repo.entryFields"
area = "extensions"
milestone = "M13"
summary = "Entry fields: titles and descriptions are dictionaries keyed by language code (en, …); url points at the extension's repository and path names the item inside it, e.g. a bundle (both read off the example, not explained); screenshot is an image URL."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.repo.optionalLists"
area = "extensions"
milestone = "M13"
summary = "Lists that are not used may be omitted, e.g. a scripts-only repository has no plugins or modules key."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

[[behavior]]
id = "addons.repo.localizedScreenshot"
area = "extensions"
milestone = "M13"
summary = "The screenshot is fetched with an Accept-Language header, so a server can answer with a localised image."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"

# --- Shortcuts ---

[[panel]]
id = "settings.shortcuts"
label = "Shortcuts"
location = "window"
controls = [
  "scope buttons: All, Customized, Menu, Commands",
  "search field (top right)",
  "action list grouped in collapsible sections",
  "per action: shortcut shown in key symbols, Record shortcut button",
  "while recording: curved-arrow icon (keep current), cross icon (remove shortcut)",
]
area = "ui-chrome"
milestone = "M14"
summary = "Section for viewing and recording keyboard shortcuts of actions."
ref = "Settings › Shortcuts"
status = "handbook"

[[setting]]
id = "shortcuts.custom"
label = "Custom Shortcuts"
kind = "shortcut"
section = "Shortcuts"
values = ""
area = "ui-chrome"
milestone = "M14"
summary = "The user's shortcut overrides: a map from action (command id) to a key combination or to none. Actions without an entry use their built-in shortcut."
ref = "Settings › Shortcuts"
status = "handbook"

[[command]]
id = "settings.recordShortcut"
label = "Record shortcut"
menu = []
shortcut = ""
kind = "ui"
params = "{command: id, shortcut: string}"
area = "ui-chrome"
milestone = "M14"
summary = "Assigns a key combination to an action. In the UI: click Record shortcut on the selected action, then press the keys. Headless: pass the combination in Mac notation."
ref = "Settings › Shortcuts"
status = "handbook"

[[command]]
id = "settings.cancelShortcutRecording"
label = "Keep Current Shortcut"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M14"
summary = "Leaves recording mode without changing the action's shortcut (curved-arrow icon)."
ref = "Settings › Shortcuts"
status = "handbook"

[[command]]
id = "settings.removeShortcut"
label = "Remove Shortcut"
menu = []
shortcut = ""
kind = "ui"
params = "{command: id}"
area = "ui-chrome"
milestone = "M14"
summary = "Clears the shortcut of an action so that no key combination triggers it (cross icon)."
ref = "Settings › Shortcuts"
status = "handbook"

[[command]]
id = "settings.resetShortcut"
label = "Reset Shortcut"
menu = []
shortcut = ""
kind = "ui"
params = "{command?: id}"
area = "ui-chrome"
milestone = "M14"
summary = "Drops the user's override for one action, or for all when no id is given, restoring built-in shortcuts. Not described in the source; proposed because Customized filtering implies a way back."
ref = "Settings › Shortcuts"
status = "inferred"

[[command]]
id = "settings.filterShortcuts"
label = "Filter Actions"
menu = []
shortcut = ""
kind = "ui"
params = "{scope?: \"all\"|\"customized\"|\"menu\"|\"commands\", search?: string}"
area = "ui-chrome"
milestone = "M14"
summary = "Narrows the action list: All shows everything, Customized only actions whose shortcut was changed, Menu only menu-bar actions, Commands the other group (see open question); search further narrows by text."
ref = "Settings › Shortcuts"
status = "handbook"

[[command]]
id = "settings.toggleShortcutSection"
label = "Collapse/Expand Section"
menu = []
shortcut = ""
kind = "ui"
params = "{section: string, collapsed?: bool}"
area = "ui-chrome"
milestone = "M14"
summary = "Collapses or expands one group of actions in the list (disclosure chevron beside the group title)."
ref = "Settings › Shortcuts"
status = "handbook"

[[command]]
id = "settings.listShortcuts"
label = "List Shortcuts"
menu = []
shortcut = ""
kind = "engine"
params = "{scope?: \"all\"|\"customized\"|\"menu\"|\"commands\"}"
area = "ui-chrome"
milestone = "M14"
summary = "Read-only query returning each action with its section, default shortcut and current shortcut. Proposed for agents; equals the content of the list."
ref = "Settings › Shortcuts"
status = "inferred"

[[behavior]]
id = "shortcuts.composition"
area = "ui-chrome"
milestone = "M14"
summary = "A shortcut is at least one modifier (Command, Option, Control, Shift) plus one ordinary key, which may be a letter, a digit, Return or Escape."
ref = "Settings › Shortcuts"
status = "handbook"

[[behavior]]
id = "shortcuts.keySymbolDisplay"
area = "ui-chrome"
milestone = "M14"
summary = "Shortcuts are displayed with the platform's key symbols rather than spelled-out key names."
ref = "Settings › Shortcuts"
status = "handbook"

[[behavior]]
id = "shortcuts.scopeFilters"
area = "ui-chrome"
milestone = "M14"
summary = "Four mutually exclusive scope buttons sit above the list: All, Customized, Menu, Commands. The source describes Commands only as actions within the current selection, which is unclear."
ref = "Settings › Shortcuts"
status = "handbook"

[[behavior]]
id = "shortcuts.sections"
area = "ui-chrome"
milestone = "M14"
summary = "Actions are listed in titled groups; each group can be folded with its chevron."
ref = "Settings › Shortcuts"
status = "handbook"

[[behavior]]
id = "shortcuts.search"
area = "ui-chrome"
milestone = "M14"
summary = "Typing in the search field filters the list to matching actions within the active scope."
ref = "Settings › Shortcuts"
status = "handbook"

[[behavior]]
id = "shortcuts.scriptsAreActions"
area = "extensions"
milestone = "M13"
summary = "Installed scripts appear as actions, so a script can be given a shortcut here."
ref = "Extensions › Scripts › Run Scripts"
status = "handbook"

[[behavior]]
id = "shortcuts.oneRegistry"
area = "ui-chrome"
milestone = "M14"
summary = "FontCraft derives the action list from the command registry: every command with a label is listed under its menu or noun prefix, and the stored override map is keyed by command id."
ref = "Settings › Shortcuts"
status = "inferred"
