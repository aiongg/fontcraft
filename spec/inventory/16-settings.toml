ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"
notes = "FontCraft (M13.10): entry fields `id`, `kind` (filter, reporter, check, macro), `version`, `titles` and `descriptions` keyed by language code, `vendor`, `url` (the `.wasm` or `.fcmacro` file: an https:// URL, or a path, relative to a local index), `sha256`, `size`, `homepage` and `funding` (https:// or http:// links), `screenshot`. Unknown fields are ignored. A bad entry refuses the whole index with the entry's number. Limits: 16 MiB per index, 10,000 entries, 4,096 characters per string, sizes up to the module or macro file limit."

[[behavior]]
id = "addons.repo.optionalLists"
area = "extensions"
milestone = "M13"
summary = "Lists that are not used may be omitted, e.g. a scripts-only repository has no plugins or modules key."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"
notes = "FontCraft (M13.10): an index holds one `entries` list; an index with no entries, or without the key, is valid."

[[behavior]]
id = "addons.repo.localizedScreenshot"
area = "extensions"
milestone = "M13"
summary = "The screenshot is fetched with an Accept-Language header, so a server can answer with a localised image."
ref = "Settings › Addons › Alternate Plugin Repositories"
status = "handbook"
notes = "FontCraft (M13.10): screenshots are fetched with an Accept-Language header naming the interface language (English until the interface is translated), as the reference does."

