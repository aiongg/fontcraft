ref = "Settings › Sharing"
status = "handbook"

[[behavior]]
id = "sharing.sameNetworkRequired"
area = "proofing"
milestone = "M14"
summary = "The computer and the viewing device must be on the same network; the viewer lists reachable computers and the user picks one."
ref = "Settings › Sharing"
status = "handbook"

[[behavior]]
id = "sharing.confirmConnectionOnHost"
area = "proofing"
milestone = "M14"
summary = "A first connection attempt from a device must be confirmed on the computer; confirmed devices are remembered as trusted."
ref = "Settings › Sharing"
status = "handbook"

[[behavior]]
id = "sharing.viewerShowsActiveEditView"
area = "proofing"
milestone = "M14"
summary = "The viewer shows the Edit View that is currently active, and every edit appears there immediately."
ref = "Settings › Sharing"
status = "handbook"

[[behavior]]
id = "sharing.viewerGestures"
area = "proofing"
milestone = "M14"
summary = "In the viewer: two-finger pinch zooms, one-finger drag pans, touch-and-hold returns to the viewer's menu."
ref = "Settings › Sharing"
status = "handbook"

[[behavior]]
id = "sharing.troubleshooting"
