# --- User Settings ---

[[panel]]
id = "settings.userSettings"
label = "User Settings"
location = "window"
controls = [
  "Keep Glyph Names from Imported Files checkbox",
  "Disable Automatic Alignment for Imported Files checkbox",
  "Disable Localization checkbox",
  "Use Versions checkbox",
  "Send Crash Reports checkbox",
  "name field",
  "email address field",
]
area = "ui-chrome"
milestone = "M14"
summary = "Section with import behaviour, interface language, file-saving and crash-report preferences."
ref = "Settings › User Settings"
status = "handbook"

[[setting]]
id = "user.keepGlyphNamesFromImportedFiles"
label = "Keep Glyph Names from Imported Files"
kind = "bool"
section = "User Settings"
values = ""
area = "import-export"
milestone = "M14"
summary = "When on, glyphs keep the names found in an opened file; when off, names are converted to the app's default naming scheme on import. Intended for round trips with other tools."
ref = "Settings › User Settings"
status = "handbook"

[[setting]]
id = "user.disableAutomaticAlignmentForImportedFiles"
label = "Disable Automatic Alignment for Imported Files"
kind = "bool"
section = "User Settings"
values = ""
area = "components"
milestone = "M14"
summary = "When on, components in an imported font are not put under automatic alignment, so they stay where the file places them."
ref = "Settings › User Settings"
status = "handbook"

[[setting]]
id = "user.disableLocalization"
label = "Disable Localization"
kind = "bool"
section = "User Settings"
values = ""
area = "ui-chrome"
milestone = "M14"
summary = "Forces the interface to English regardless of the system language. Takes effect after the app is restarted."
ref = "Settings › User Settings"
status = "handbook"

[[setting]]
id = "user.useVersions"
label = "Use Versions"
kind = "bool"
section = "User Settings"
values = ""
area = "import-export"
milestone = "M14"
summary = "Turns on the system's versioned-document saving: documents are saved automatically on close and earlier versions can be browsed. Off means a file is only written on an explicit save, so opening and closing never modifies it."
ref = "Settings › User Settings"
status = "handbook"

[[setting]]
id = "user.sendCrashReports"
label = "Send Crash Reports"
kind = "bool"
section = "User Settings"
values = ""
area = "ui-chrome"
milestone = "M14"
summary = "When on, diagnostic data is sent to the developers after a crash."
ref = "Settings › User Settings"
status = "handbook"

[[setting]]
id = "user.crashReportName"
label = "Name"
kind = "string"
section = "User Settings"
values = ""
area = "ui-chrome"
milestone = "M14"
summary = "Name attached to crash reports so the developers can reply. Exact field label not confirmed."
ref = "Settings › User Settings"
status = "handbook"

[[setting]]
id = "user.crashReportEmail"
label = "Email"
kind = "string"
section = "User Settings"
values = ""
area = "ui-chrome"
milestone = "M14"
summary = "Email address attached to crash reports so the developers can reply. Exact field label not confirmed."
ref = "Settings › User Settings"
status = "handbook"

[[command]]
id = "settings.resetWarnings"
label = "Reset Warnings"
menu = []
shortcut = ""
kind = "ui"
params = "{}"
area = "ui-chrome"
milestone = "M14"
summary = "Makes every warning dialog that was silenced with a do-not-show-again choice appear again. This chapter does not mention it; recalled from earlier versions of the reference and to be confirmed."
ref = "Settings › User Settings"
status = "memory"

[[behavior]]
id = "user.localizationNeedsRestart"
area = "ui-chrome"
milestone = "M14"
summary = "Changing Disable Localization shows no effect until the next launch; the UI should say so next to the option."
