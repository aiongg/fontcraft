  "Reset button (present only after a device has connected)",
]
area = "proofing"
milestone = "M14"
summary = "Section that controls streaming the current Edit View to a companion viewer app on a phone or tablet."
ref = "Settings › Sharing"
status = "handbook"

[[setting]]
id = "sharing.enableExternalPreview"
label = "Enable External Preview"
kind = "bool"
section = "Sharing"
values = ""
area = "proofing"
milestone = "M14"
summary = "Lets a companion viewer app on a device in the same local network connect and mirror the active Edit View. Default not stated."
ref = "Settings › Sharing"
status = "handbook"

[[command]]
id = "settings.resetTrustedDevices"
label = "Reset"
menu = []
shortcut = ""
