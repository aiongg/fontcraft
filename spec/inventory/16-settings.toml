[[setting]]
id = "appearance.textViewWidth"
label = "Text View Width"
kind = "number"
section = "Appearance"
values = ""
area = "edit-text"
milestone = "M14"
summary = "Line length at which Edit View text wraps, in thousandths of an em. It does not depend on the font's units per em. Default not stated."
ref = "Settings › Appearance"
status = "handbook"
notes = "Documented, not yet observed. Built in M5.30: a number field in Settings › Appearance; Edit View lays its text out at the setting × units per em / 1000 font units (`app/models/text.rs::line_width`), so a 2,048-unit font wraps at 20,480 units by default. Values from 1 to 100,000 are accepted; the width in font units is kept within the layout's 1 to 1,000,000."
guesses = [
  "10,000 thousandths of an em (ten em) by default; the handbook gives no default.",
  "The accepted range, 1 to 100,000 thousandths of an em, is ours; no source gives one.",
]
observe = [
  "Open Settings › Appearance in a fresh install and note the Text View Width default; type a long line in a 1,000-unit and a 2,048-unit font and note where each wraps.",
]

[[setting]]
id = "appearance.handleSize"
label = "Handle size"
kind = "choice"
section = "Appearance"
values = "small, regular, large"
area = "drawing"
milestone = "M14"
summary = "Drawn size of on-curve nodes, off-curve handles and anchors; smaller is tidier, larger is easier to see and hit. The available steps are not listed in the source."
ref = "Settings › Appearance"
status = "handbook"
notes = "Documented, not yet observed. The canvas scales node, handle, start-arrow, duplicate-ring, metric-highlight, Extra Node and anchor sizes by the step (`crates/ui/src/canvas/tokens.rs`)."
guesses = [
  "Three steps, small, regular and large, at 0.75, 1 and 1.5 times the regular sizes; the handbook lists no steps. Settled by opening the reference's Appearance settings and measuring a node at each step.",
  "The appearance colour settings default to the canvas colours FontCraft drew before they existed, the same value for light and dark; the handbook states no defaults. Settled by reading the reference's colour wells after Standard.",
]

