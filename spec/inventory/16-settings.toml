# Inventory: Settings
# Source: Glyphs 4 Handbook, chapter "Settings" (https://handbook.glyphsapp.com/single-page/)
# Date: 2026-10-07
# All wording is our own. Setting ids are <section>.<name>. Rows with status "inferred" are
# FontCraft design; rows with status "memory" are recalled and not confirmed by this chapter.

# --- Settings window ---

[[command]]
id = "app.settings"
label = "Settings…"
menu = ["Edit"]
shortcut = "Cmd+Comma"
kind = "ui"
params = "{section?: \"updates\"|\"appearance\"|\"userSettings\"|\"sampleStrings\"|\"sharing\"|\"addons\"|\"shortcuts\", open?: bool, group?: number}"
area = "ui-chrome"
milestone = "M14"
summary = "Opens the settings window, optionally on a given section. In the reference it sits in the application menu."
ref = "Settings (chapter introduction)"
status = "handbook"
notes = "FontCraft (M14.1, crates/ui/src/dialogs/settings.rs): with no section the window opens on the section last shown, else on User Settings. A section that is not built yet is refused with its reason and changes nothing. open: false closes the window and first writes any text still being typed in a field. The result lists the sections in order with whether each is available."
guesses = [
  "Settings… is the last item of the Edit menu on every platform, because FontCraft draws its own menu bar and has no application menu; the reference puts it in the application menu on macOS.",
  "The window reopens on the section last shown; the handbook does not say which section it opens on.",
]

[[command]]
id = "settings.get"
label = "Get Setting"
menu = []
shortcut = ""
kind = "engine"
params = "{id?: string}"
area = "ui-chrome"
milestone = "M4"
summary = "Read-only query returning one preference value by setting id, or all of them when no id is given. Not in the reference; proposed so every preference is reachable headless."
ref = "Settings (whole chapter)"
status = "inferred"
notes = "Moved from M14 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6): the Start Window, the Filters sidebar, the Languages list and Display Unicode Value keep user settings (the owner's decision, docs/plans/M4.md § 7 question 4). The settings window stays M14. Besides the preferences it returns the ids other commands write: fontView.filters, fontView.visibleScripts, file.recentDocuments, start.chooserPicks (crates/engine-core/src/settings.rs)."
guesses = [
  "Our own command; the reference has no headless access to settings, so there is nothing to settle.",
]

[[command]]
id = "settings.set"
label = "Set Setting"
menu = []
shortcut = ""
kind = "engine"
params = "{id: string, value: any}"
area = "ui-chrome"
milestone = "M4"
summary = "Writes one preference by setting id, with the same validation and side effects as changing it in the settings window. Not in the reference; proposed for agents and the CLI."
ref = "Settings (whole chapter)"
status = "inferred"
notes = "Moved from M14 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6), with settings.get. It accepts the [[setting]] ids FontCraft implements (crates/engine-core/src/settings.rs, SETTINGS), checks the value against the row's kind, and takes null for the default. The ids other commands write are refused. Limits: 1,024 ids, 1 MB per value, 64 levels of nesting, 8 MB per settings file; a settings file that cannot be read gives the defaults and a report. The desktop app reads the store from settings.json in its settings folder at start and writes it whenever it changes (apps/fontcraft/src/user_files.rs, M4.6); an unreadable file is kept as settings.json.bad. The folder's Info/GlyphData*.xml files are the user's custom glyph data."
guesses = [
  "Our own command; the reference has no headless access to settings, so there is nothing to settle.",
]

[[panel]]
id = "window.settings"
label = "Settings"
location = "window"
controls = [
  "section switcher: Updates, Appearance, User Settings, Sample Strings, Sharing, Addons, Shortcuts",
  "content area of the chosen section",
]
area = "ui-chrome"
milestone = "M14"
summary = "Application-wide preferences window with seven sections, shown in the order listed."
ref = "Settings (chapter introduction)"
status = "handbook"
notes = "FontCraft (M14.1): a section switcher on the left in the handbook's order and the chosen section's body on the right. Sections that are not built yet (Updates, Appearance, Sample Strings, Sharing, Shortcuts) are greyed, with the reason as hover text. Each section is a Section entry whose body other packages fill; a body reads settings and changes them only through settings.set or its own commands. FontCraft labels the Addons section Extensions (see settings.addons). The order is documented but not yet observed."
guesses = [
  "Sections that are not built yet stay in the switcher, greyed with the reason, so the order matches the reference; the reference has no such state.",
]
observe = [
  "Open Settings and note the order of the sections in the switcher and which section shows first.",
]

[[behavior]]
id = "settings.menuItemNameOnOlderSystem"
area = "ui-chrome"
milestone = "M14"
summary = "On macOS 12 the menu item that opens the window is labelled Preferences instead of Settings…; the shortcut is the same. On other platforms FontCraft follows the platform's convention for the item name and place."
ref = "Settings (chapter introduction)"
status = "handbook"
notes = "FontCraft (M14.1) labels the item Settings… on every platform and puts it at the end of the Edit menu (app.settings): the menu bar is drawn by the app, not by the system, so there is no application menu and no macOS 12 label."
guesses = [
  "One label and place on every platform, Settings… in the Edit menu, as many Linux and Windows applications do; a native macOS menu bar would move it to the application menu.",
]

[[behavior]]
id = "settings.surviveVersionChange"
area = "ui-chrome"
milestone = "M14"
summary = "Preferences are kept when a newer version is installed or an older one is reinstalled."
ref = "Settings › Updates"
status = "handbook"

