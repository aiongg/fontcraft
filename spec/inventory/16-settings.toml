[[command]]
id = "settings.resetColors"
label = "Standard"
menu = []
shortcut = ""
kind = "engine"
params = "{}"
area = "ui-chrome"
milestone = "M14"
summary = "Returns every colour of the Appearance section, in both the light and the dark set, to its built-in default."
ref = "Settings › Appearance"
status = "handbook"
notes = "FontCraft (M14.2): an engine command, because the colours are user settings. It returns every appearance.color.* id, light and dark, to its default in one command and names the ids it reset; the handle size, opacity and the switches stay."

[[behavior]]
id = "appearance.colorsPerSystemAppearance"
area = "ui-chrome"
milestone = "M14"
summary = "Each customisable colour is stored twice, once for the light and once for the dark appearance; the set in use follows the appearance the view is actually drawn in (including the Always use Light Mode overrides)."
ref = "Settings › Appearance"
status = "handbook"
notes = "FontCraft (M14.2, app/appearance.rs): the window follows the system's light or dark mode through the theme; the canvas takes the dark set while it is drawn dark and the light set otherwise, Always use Light Mode for Edit View included. The dark defaults of the canvas (#1e1e1e) and the foreground stroke (#e6e6e6) differ from the light ones; the other items share one default."

