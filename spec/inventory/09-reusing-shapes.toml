[[behavior]]
id = "smart.axesAreLocalToGlyph"
area = "components"
milestone = "M6"
summary = "Smart properties act like variation axes that exist only inside one glyph; each component instance carries its own value per property and the component outline is interpolated from the glyph's smart layers."
ref = "Reusing Shapes › Smart Components"
status = "handbook"
notes = "Documented, not yet observed. At export both oracles draw smart components as outlines when they load the source (glyphsLib `instantiate_smart_component`, fontc `glyphs-reader/src/smart_components.rs`), propagate the interpolated anchors, and keep a plain component when no layer maps to a pole. FontCraft's `model/smart.rs` (M2) draws them the glyphsLib way. Outline resolution (`Font::outline`, M6.4) draws every smart component through it, after the layer's other shapes as both oracles order them, so the editor, measurements and metrics see the interpolated outline; a smart component that cannot be interpolated is drawn as a plain component, as glyphsLib keeps it (fontc fails the build). Corpus: 10 smart glyphs and 15 smart components, all in fontc test data and the format samples. Compile (`fontcraft_compile::prepare_source`, M6.int1) draws every smart component as outlines before it resolves the master, after corner components are fitted, so the exported glyph holds the interpolated contours."

