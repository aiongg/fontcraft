# =====================================================================================
# Corner components
# =====================================================================================

[[behavior]]
id = "corner.glyphNaming"
area = "components"
milestone = "M6"
summary = "A glyph is a corner glyph when its name starts with _corner. followed by any name (_corner.serif). It holds an open path lying on both sides of the layer origin."
ref = "Reusing Shapes › Corner Components › Creating Corner Glyphs"
status = "handbook"
notes = "Documented, not yet observed. Both oracles apply corner components (the Corner hint type) when they build: glyphsLib's `cornerComponents` filter and fontc's `corner_components.rs`, both Apache-2.0; FontCraft ports fontc's (`model/corner.rs`, M6.4): outline resolution fits every corner of a layer, earlier paths and nodes first, and rounds the inserted nodes to whole units, and draws a layer whose corners cannot be fitted without them; `corner::insert_all_corner_components` rewrites a whole font the same way for export. Corpus: 29 corner hints in 3 sources. Compile (`fontcraft_compile::prepare_source`, M6.int1) fits the corners of every layer before it resolves the master, then draws smart components; a layer whose corners cannot be fitted is exported without them, with a warning. A corner hint counts a closed path's nodes in the file's order, start node last (glyphsLib keeps that numbering in a UFO's hints), while the model keeps the start node first; the fitting turns each closed path to the file's order and back. Measured against the reference app's outputs stored in fontc's `CornerComponents.glyphs`: 24 of 25 glyphs equal node for node (`au_left_anchoronpath` differs, see `corner.entryAnchor`)."
guesses = [
  "A layer with a corner that cannot be fitted (its path deleted, a zero-length segment next to it) is drawn in the editor without any of its corners, as the export leaves it; a hint whose path was deleted in the reference app shows what it draws.",
  "Corners are fitted on the layer's stored shapes, whose indices the hints name, before its smart components are drawn; fontc draws smart components first and then reads the indices against the shapes that result, which differs only in a layer that has both. A layer with a smart component before a path with a corner, built in the reference app, settles it.",
]

