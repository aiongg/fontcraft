[[behavior]]
id = "corner.entryAnchor"
area = "components"
milestone = "M6"
summary = "The entry point, where the stem runs into the corner, defaults to the layer origin. An anchor named left (named right when the open path faces right) relocates it; the anchor must lie on the line through the origin and the path's start node. Moving it from the start node toward the baseline lengthens the corner on the obtuse side of a diagonal and shortens it on the acute side; moving it the other way does the opposite."
ref = "Reusing Shapes › Corner Components › Adjusting the Entry Point of a Corner"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle uses the left and right anchors yet (fontc reads them and marks them unused), so sources that have them compile without the shift in both. fontc's test source `CornerComponents.glyphs` holds the reference app's output for two corner glyphs with a left anchor: `av_left_anchoroffpath` (anchor on the line through the origin and the start node) shows the corner slid along its baseline until the anchor is on the slanted stem, which FontCraft draws node for node; `au_left_anchoronpath` (anchor off that line, against the handbook's rule) keeps the corner's start node unmoved, which FontCraft does not reproduce."
guesses = [
  "The entry anchor slides the fitted corner along its own baseline until the anchor lies on the incoming stroke, and the corner is then fitted as without it; the reference app's output for `av_left_anchoroffpath` agrees, and a left anchor on a curved stem in the reference app settles the rest.",
  "A corner path faces right when its second node lies right of its start node; it then takes `right` as its entry anchor and `left` as its exit anchor. A right-facing corner glyph with both anchors in the reference app settles it.",
  "A mirrored corner (one negative scale) ignores its entry and exit anchors; a mirrored corner with a left anchor in the reference app settles it.",
]

[[behavior]]
id = "corner.exitAnchor"
area = "components"
milestone = "M6"
summary = "The exit point, where the outline leaves the corner back into the host path, defaults to the open path's end node. An anchor named right (left for a right-facing corner) replaces the end node as exit position, so the end node itself may sit above or below the baseline, as for cupped serifs."
ref = "Reusing Shapes › Corner Components › Adjusting the Exit Point of a Corner"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle uses it yet."
guesses = [
  "The exit anchor stands in for the end node when the corner is rotated and when the outgoing segment is cut (where it is nearest to the anchor); the end node stays where it is drawn and the outgoing segment runs on from it. A cupped serif in the reference app settles it.",
]

