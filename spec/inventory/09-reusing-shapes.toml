# =====================================================================================
# Brushes
# =====================================================================================

[[behavior]]
id = "brush.glyphNaming"
area = "components"
milestone = "M13"
summary = "A glyph is a brush glyph when its name starts with _brush. followed by any name (_brush.arrow). It must contain exactly one closed path plus two anchors, start and end; several closed shapes have to be merged into one with Remove Overlap first."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"
notes = "Moved from M6 to M13 by the M6 plan, which the owner accepted (docs/plans/M6.md § 7 question 4 (b)). The M13 plan (docs/plans/M13.md, packages M13.40 to M13.42) builds it after the checks of its § 8 have been made in the reference app; neither oracle supports it and no corpus source uses it, so a font exported by the reference app from our synthetic test font is the only comparison."
observe = [
  "Give `_brush.arrow` a second closed path and add the brush: note whether it is refused, uses the first path only, or merges both.",
]

[[behavior]]
id = "brush.startEndAnchors"
area = "components"
milestone = "M13"
summary = "Glyph › Set Anchors (Cmd+U) places a brush glyph's start and end anchors at the left and right of the layer. They normally sit on the baseline or at one equal distance from it."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"
notes = "Moved from M6 to M13 by the M6 plan, which the owner accepted (docs/plans/M6.md § 7 question 4 (b)). The M13 plan (docs/plans/M13.md, packages M13.40 to M13.42) builds it after the checks of its § 8 have been made in the reference app; neither oracle supports it and no corpus source uses it, so a font exported by the reference app from our synthetic test font is the only comparison. The anchor rule is already in `components::default_anchors` (M6.3); documented, not yet observed."
guesses = [
  "Set Anchors puts a brush glyph's start at (0, 0) and its end at (advance width, 0); Set Anchors on a brush glyph in the reference app settles it.",
]

[[behavior]]
id = "brush.stretchZoneBetweenAnchors"
area = "components"
milestone = "M13"
summary = "Only the part of the brush outline lying between the start and end anchors stretches and bends to follow the host segment. Outline before start and after end keeps its shape, which is how fixed ends such as an arrowhead are made."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"
notes = "Moved from M6 to M13 by the M6 plan, which the owner accepted (docs/plans/M6.md § 7 question 4 (b)). The M13 plan (docs/plans/M13.md, packages M13.40 to M13.42) builds it after the checks of its § 8 have been made in the reference app; neither oracle supports it and no corpus source uses it, so a font exported by the reference app from our synthetic test font is the only comparison."

[[behavior]]
id = "brush.bendingNeedsHandles"
area = "components"
milestone = "M13"
summary = "A segment of the brush outline bends along a curved host segment only if it is a curve segment with handles; straight line segments stay straight. Handles are added to a line segment by Option-clicking it."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"
notes = "Moved from M6 to M13 by the M6 plan, which the owner accepted (docs/plans/M6.md § 7 question 4 (b)). The M13 plan (docs/plans/M13.md, packages M13.40 to M13.42) builds it after the checks of its § 8 have been made in the reference app; neither oracle supports it and no corpus source uses it, so a font exported by the reference app from our synthetic test font is the only comparison."

[[behavior]]
id = "brush.expandsSegments"
area = "components"
milestone = "M13"
summary = "A brush turns a host path segment, straight or curved, into the brush's closed outline laid along it. It works on any segment but is intended mainly for open paths, most often an open path of a single segment."
ref = "Reusing Shapes › Brushes"
status = "handbook"
notes = "Moved from M6 to M13 by the M6 plan, which the owner accepted (docs/plans/M6.md § 7 question 4 (b)). The M13 plan (docs/plans/M13.md, packages M13.40 to M13.42) builds it after the checks of its § 8 have been made in the reference app; neither oracle supports it and no corpus source uses it, so a font exported by the reference app from our synthetic test font is the only comparison."

[[command]]
id = "brush.add"
label = "Add Brush"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, segments?: [{path: index, segment: index}], nodes?: [{path: index, node: index}], brush: name}"
area = "components"
milestone = "M13"
summary = "Attaches a brush to every selected segment. If nodes are selected in place of segments, brushes are added so that each selected node is the end node of a new brush. In the UI it is a context-menu item that opens a picker listing only brush glyphs; Return inserts the highlighted one."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"
notes = "Moved from M6 to M13 by the M6 plan, which the owner accepted (docs/plans/M6.md § 7 question 4 (b)). The M13 plan (docs/plans/M13.md, packages M13.40 to M13.42) builds it after the checks of its § 8 have been made in the reference app; neither oracle supports it and no corpus source uses it, so a font exported by the reference app from our synthetic test font is the only comparison."
guesses = [
  "The brush outline between start and end follows the host segment as segments do; the parts before start and after end are moved rigidly with the host's direction at its two ends; settled by the brush export check.",
  "With nodes selected, each selected node becomes the end node of a brush on the segment that ends there; a node at the start of an open path gets no brush. Settled by the node-selection check.",
]
observe = [
  "In the brush test font (`_brush.arrow`: one closed arrow outline, start anchor at the tail, end anchor where the head begins), add the brush to a straight open path and to a curved open path, export an OTF and send it back: the head should keep its shape and the shaft follow the curve.",
  "Select only the last node of a three-segment open path and choose Add Brush: count how many brushes are added and on which segments.",
]

