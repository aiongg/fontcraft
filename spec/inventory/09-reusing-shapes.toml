# Source: Glyphs 4 Handbook, chapter "Reusing Shapes" (Components, Smart Components, Corner
# Components, Cap Components, Segment Components, Brushes, Pixel Tool), public web handbook at
# https://handbook.glyphsapp.com/ . A few rows cite cross-referenced sections of other chapters
# (Edit View › Info Box, Edit View › Anchors, Font Info › Other, Spacing › Metrics Keys & Automatic
# Alignment, Appendix › Custom Parameters); those are named in `ref`.
# Date: 2026-10-07
#
# Conventions used in this file
# - Commands that exist in the reference only as an Info box field, a context-menu item or a mouse
#   gesture get a command id here so agents can run them headless; `menu = []` for those.
# - `status = "handbook"` means the behaviour is stated in the handbook. Where only the command
#   shape (id, params) is ours, the status stays `handbook`; where the behaviour itself is our
#   guess the row is `inferred`, and where it is recalled but absent from the handbook, `memory`.
# - Commands owned by other chapters (Glyph › Add Glyphs, Glyph › Set Anchors, Path › Align
#   Selection, Edit › Select All, Edit › Copy/Paste, Edit › Info for Selection, View › Show Info,
#   View › Show Bounding Box, Filter › Shape Order, Palette mirror buttons, custom parameters and
#   Font Info options) are NOT redefined here; their component-specific effects are `[[behavior]]`
#   rows.
# - component.setTransform, component.setBaseGlyph, component.editBaseGlyph, the panels
#   infoBox.component / infoBox.componentGlyphPicker and selection.selectNext live in the Edit View
#   inventory files (03a/03b); this file refers to them and does not repeat them.

# =====================================================================================
# Components: building composites
# =====================================================================================

[[command]]
id = "glyph.createComposite"
label = "Create Composite"
menu = ["Glyph"]
shortcut = "Cmd+Ctrl+C"
kind = "engine"
params = "{glyphs?: [names], layer?: id, allMasters?: bool}"
area = "components"
milestone = "M6"
summary = "Rebuilds the current layer of each target glyph as a composite: every path and component already on the layer is removed and the components named by the glyph info database for that glyph are inserted in the database's order. With allMasters it does the same on every master layer."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"
notes = "Documented, not yet observed. The list of components comes from the glyph database, whose published data has no composition column. Open decision D6, answered by the owner (M6 plan § 7 question 3 (a)): Unicode canonical decomposition mapped to glyph names, plus our own tables for what Unicode does not decompose; a custom GlyphData.xml overrides both. See the guesses."
guesses = [
  "The components are the full Unicode canonical decomposition of the glyph's code point, each code point mapped to its glyph name through the glyph database (U+0301 to acutecomb), suffixes carried over and the preferred-mark rules applied, plus our own table for glyphs Unicode does not decompose (i, j and ligatures by their name parts); the composites stored in corpus files saved by the reference app measure it (M6 plan § 5).",
  "A glyph the database cannot decompose, or one whose parts are missing from the font, is refused with a message naming the missing parts and nothing changes; running it on such a glyph in the reference app settles it.",
  "Create Composite keeps the layer's anchors and the glyph's metrics keys; the reference app settles it.",
]

[[command]]
id = "glyph.createCompositeAllMasters"
label = "Create Composite (all masters)"
menu = ["Glyph"]
shortcut = "Cmd+Ctrl+Alt+C"
kind = "engine"
params = "{glyphs?: [names]}"
area = "components"
milestone = "M6"
summary = "The Option-key alternate of Create Composite: replaces the shapes on all master layers of the glyph, not only the current one. The handbook gives the shortcut but no separate menu label, so the label here is ours."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[command]]
id = "glyph.addComponent"
label = "Add Component"
menu = ["Glyph"]
shortcut = "Cmd+Shift+C"
kind = "engine"
params = "{glyph?: name, layer?: id, component: name | unicode, allMasters?: bool}"
area = "components"
milestone = "M6"
summary = "Appends one component to the current layer. In the UI it opens the component picker, where the base glyph is found by glyph name or Unicode value; headless callers pass the base glyph directly."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:42–11:51: the canvas context menu offers Add Component…, which opens a search field titled Choose Component at the bottom of the window; typing O and confirming adds O as a component, drawn filled without nodes. Not shown: the Glyph menu, Cmd+Shift+C, lookup by Unicode value."

[[command]]
id = "glyph.addComponentAllMasters"
label = "Add Component (all masters)"
menu = ["Glyph"]
shortcut = "Cmd+Alt+Shift+C"
kind = "engine"
params = "{glyph?: name, component: name | unicode}"
area = "components"
milestone = "M6"
summary = "The Option-key alternate of Add Component: the chosen component is appended on every master layer of the glyph. The handbook gives the shortcut but no separate menu label."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[command]]
id = "glyph.componentFromSelection"
label = "Component from Selection"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, shapes?: [indices], name: string}"
area = "components"
milestone = "M6"
summary = "Moves the selected paths and components of a layer into a new glyph with the given name and puts a component referencing that glyph in their place. In the UI it first asks for the name, then appends the new glyph to the current Edit View tab and makes it the active glyph. Also offered in the canvas context menu."
ref = "Reusing Shapes › Components › Turning Paths into Components"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 16:09–16:21: offered in the canvas context menu; it asks for a name and then the selected paths are replaced by a component. Not shown: the Glyph menu entry, the new glyph being added to the tab. At the same point the dialog says the change applies to all master layers (dialog.componentFromSelection)."
guesses = [
  "The suggested name is `_part.` plus the current glyph's name, with `.001`, `.002` appended while the name is taken; the dialog of the reference app settles it.",
  "A name that is already a glyph is refused with a message; the reference app settles it.",
  "The new glyph keeps the shapes at their coordinates and the component sits at offset zero; anchors stay on the original layer; the reference app settles it.",
  "On each other master the shapes with the same indices move into the new glyph's layer of that master, and a master whose layer lacks them gets an empty layer; a two-master font in the reference app settles it.",
]

[[panel]]
id = "dialog.componentPicker"
label = "Component picker"
location = "dialog"
controls = ["search field matching glyph name or Unicode value", "result list of glyphs", "Return inserts the highlighted glyph"]
area = "components"
milestone = "M6"
summary = "The glyph picker shown by Add Component. It behaves exactly like the glyph picker the Text tool uses to insert glyphs in Edit View, so one picker implementation serves both."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[panel]]
id = "dialog.componentFromSelection"
label = "Component from Selection"
location = "dialog"
controls = [
  "glyph name field, pre-filled with a suggested name",
  "line stating that the change applies to all master layers",
  "Cancel and OK buttons",
]
area = "components"
milestone = "M6"
summary = "Asks for the name of the glyph that will hold the selected shapes. The field starts with a name suggested from context and accepts any other name; an underscore-prefixed name makes the new glyph a non-exporting part."
ref = "Reusing Shapes › Components › Turning Paths into Components"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 16:09–16:21: the dialog is titled Name of the Component Glyph, says that it applies to all master layers, and has a text field with Cancel and OK. Not shown: whether the field is pre-filled, an underscore name."

[[behavior]]
id = "components.liveUpdateFromBaseGlyph"
area = "components"
milestone = "M6"
summary = "A component is a live reference to its base glyph: editing the base glyph changes every component that points to it, and in Edit View the composites redraw while the base glyph is being edited."
ref = "Reusing Shapes › Components"
status = "handbook"
notes = "Positions and widths follow through alignment: after every font-changing command the engine re-aligns the composites that depend on the changed glyphs, in dependency order and in the same undo step (`fontcraft_components::metrics::realign`, M6.2). Documented, not yet observed. M6.1: the reverse component index (crates/components/src/index.rs) gives the glyphs that follow an edit of a base glyph, directly and through nesting, in dependency order; the engine's re-alignment and the canvas read it."
guesses = [
  "Re-alignment after an edit touches only the masters whose layers the edit changed, and on other masters only the layers whose components are pinned to one of them (and the composites built on those layers), so stale stored positions on other masters stay as the file has them; editing a base on one master in the reference app and reading the other masters' composites settles it.",
  "A locked composite is not re-aligned when its base changes, because a lock keeps the glyph's drawing; locking a composite in the reference app and editing its base settles it.",
]

[[behavior]]
id = "components.autoComposeOnAddGlyph"
area = "components"
milestone = "M6"
summary = "When a glyph that the glyph info database describes as a composite is added to the font, it is created already filled with its components (adding eacute yields e plus acutecomb). The database is the only source for which components go into which glyph."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"
notes = "Documented, not yet observed. The published glyph database has no composition column; `components::compose` (M6.3) takes a custom GlyphData.xml `decompose` list first, then our table for i and j, then the Unicode canonical decomposition mapped to glyph names (U+0301 to acutecomb), then a ligature's name parts (open decision D6, answered (a) in the M6 plan § 7 question 3). Rules in `crates/components/src/compose.rs`."
guesses = [
  "The Unicode decomposition is expanded fully (Aringacute is A, ringcomb, acutecomb), except that a letter with a horn stays whole when the font has it (Ohornacute is Ohorn, acutecomb); the composites stored in corpus sources saved by the reference app measure it (M6 plan § 5).",
  "Our exceptions to Unicode: a name containing commaaccent takes commaaccentcomb where Unicode has the cedilla, gcommaaccent takes commaturnedabovecomb, and dcaron, lcaron, Lcaron and tcaron prefer caroncomb.alt; composing these in the reference app settles it.",
  "Two marks in a row become their mark ligature (circumflexcomb_gravecomb, with the same suffix preferences) when the font has it; composing Acircumflexgrave in the reference app with the mark ligature present settles it.",
  "A base of a decomposition takes the composite's suffix and is required (agrave.sc needs a.sc), while a ligature part takes the suffix only when the font has the suffixed glyph (f_f_l.ss01 from f.ss01 and l); composing suffixed glyphs in the reference app settles it.",
]

[[behavior]]
id = "components.autoComposeNeedsAllParts"
area = "components"
milestone = "M6"
summary = "Automatic composition is all-or-nothing: if any one of the components the database calls for is missing from the font, no components are inserted."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"
notes = "Documented, not yet observed. `components::compose` returns the missing parts and builds nothing (M6.3)."
guesses = [
  "The refusal names every missing part once: a mark by its plain name, a base by the name it needed (a.sc for agrave.sc); the message of the reference app settles it.",
]

[[behavior]]
id = "components.preferMarkWithSameSuffix"
area = "components"
milestone = "M6"
summary = "While composing a glyph automatically, a mark glyph carrying the same dot suffix as the composite wins over the plain mark when it exists (agrave.sc takes gravecomb.sc before gravecomb)."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"
notes = "Documented, not yet observed. Implemented in `components::compose` (M6.3)."
guesses = [
  "For an uppercase composite with a suffix the marks are tried as the suffixed mark, the .case mark, then the plain mark (Agrave.ss01: gravecomb.ss01, gravecomb.case, gravecomb); composing it in the reference app with all three present settles it.",
]

[[behavior]]
id = "components.preferCaseMarksForUppercase"
area = "components"
milestone = "M6"
summary = "While composing an uppercase letter automatically, a mark with the suffix .case is used in place of the plain mark when the font has one (Agrave takes gravecomb.case before gravecomb)."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"
notes = "Documented, not yet observed. Implemented in `components::compose` (M6.3); uppercase is the case the font stores for the composite, else the glyph database's."

[[behavior]]
id = "components.preferNarrowMarksForIJ"
area = "components"
milestone = "M6"
summary = "Composites built on i or j (imacron, jcircumflex and the like) prefer mark glyphs whose names end in .i or .narrow when such marks exist."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"
notes = "Documented, not yet observed. Implemented in `components::compose` (M6.3)."
guesses = [
  "A mark ending in .i is tried before one ending in .narrow, and both only on the dotless lowercase i and j, not on I or J; composing imacron in the reference app with both marks present settles it.",
]

[[behavior]]
id = "components.ijBuiltFromDotless"
area = "components"
milestone = "M6"
summary = "The default composition of i and j is the dotless letter (idotless, jdotless) plus a dotaccentcomb component."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"
notes = "Documented, not yet observed. Implemented in `components::compose` (M6.3). Corpus: sources saved by the reference app hold i and j as idotless or jdotless plus dotaccentcomb, and iacute, imacron and jcircumflex on the dotless letters."
guesses = [
  "Composites lose the dot of i and j only before a mark above (Unicode combining class 230), so iogonek is i plus ogonekcomb; a suffixed i or j is composed only when the font has the suffixed dotless letter; composing iogonek and i.sc in the reference app settles it.",
]

[[behavior]]
id = "components.recipeSingleComponent"
area = "components"
milestone = "M6"
summary = "Add Glyphs accepts the recipe form component=glyph: the glyph named on the right of the equals sign is created holding the glyph on the left as its only component (Delta=increment makes increment from one Delta component)."
ref = "Reusing Shapes › Components › Recipes"
status = "handbook"
notes = "Documented, not yet observed. Parsing and part roles: `components::recipe` (M6.3); Add Glyphs uses it in M6.14."

[[behavior]]
id = "components.recipeBasePlusMarks"
area = "components"
milestone = "M6"
summary = "Add Glyphs accepts the recipe form base+mark=glyph: names joined by plus signs become the components, in that order, of the glyph named after the equals sign, and the mark components are positioned on the base through anchors (q+tildecomb=qtilde)."
ref = "Reusing Shapes › Components › Recipes"
status = "handbook"
notes = "Documented, not yet observed. Parsing and part roles: `components::recipe` (M6.3); Add Glyphs uses it in M6.14."
guesses = [
  "A part whose glyph has category Mark is a mark and attaches to the base before it; any other part is a base; a recipe holds only glyph names, no spaces (spaces separate items in Add Glyphs) and any number of plus signs; typing recipes with code points or spaces into the reference app settles it.",
  "The first part of a recipe is a base even when its glyph is a mark (dotaccentcomb+dotaccentcomb=dieresiscomb sets the second on the first), and the category stored in the font wins over the database's; typing such a recipe in the reference app settles it.",
]

[[behavior]]
id = "components.recipeMultipleBases"
area = "components"
milestone = "M6"
summary = "A recipe may join several base glyphs with plus signs (t+s.join=ts); they become base components set side by side, which is the usual way to build ligatures."
ref = "Reusing Shapes › Components › Recipes"
status = "handbook"
notes = "Documented, not yet observed. Parsing and part roles: `components::recipe` (M6.3); Add Glyphs uses it in M6.14."

[[behavior]]
id = "components.underscoreNameNotExported"
area = "components"
milestone = "M6"
summary = "A glyph whose name begins with an underscore defaults to non-exporting, so it can serve purely as a part inside other glyphs (an _f.connect shared by fl and f_f). The default comes from the name; the glyph's exports property remains the actual switch."
ref = "Reusing Shapes › Components › Underscore Components"
status = "handbook"

# =====================================================================================
# Components: selecting and editing
# =====================================================================================

[[command]]
id = "component.move"
label = "Move Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices], dx: number, dy: number}"
area = "components"
milestone = "M6"
summary = "Shifts the selected components by a delta; the UI drives it from mouse drags and arrow keys (1 unit, Shift 10, Cmd 100). Auto-aligned components ignore the move, except the blue single-number case which accepts only the vertical part; locked components do not move."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[command]]
id = "component.setAnchor"
label = "Choose Attachment Anchor"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, component: index, anchor: name}"
area = "components"
milestone = "M6"
summary = "Chooses which of several same-type anchors (top, top_alt, top_viet ...) an attached component snaps to. In the UI it is the anchor menu in the component Info box, which only appears when more than one candidate anchor exists."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"
notes = "Documented, not yet observed. Stored as the component's `anchor` attribute."
guesses = [
  "The anchor menu lists the anchors of the attachment target whose name is the mark anchor's name without its underscore or that name followed by an underscore and a suffix; when the stored name no longer exists, the component attaches to the plain name and keeps the stored value; the reference app settles it.",
]

[[command]]
id = "glyph.showGlyphsUsingAsComponent"
label = "Show all glyphs that use this glyph as a component"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph?: name}"
area = "components"
milestone = "M6"
summary = "Canvas context-menu item that displays every glyph containing the current glyph as a component. The handbook does not say whether the result opens in a new tab or replaces the current text."
ref = "Reusing Shapes › Components › Moving between Base Glyphs and Composites"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The glyphs open in a new Edit View tab, one per line slot in glyph order; the reference app settles it.",
]

[[command]]
id = "glyph.listComposites"
label = "List Glyphs Using Glyph as Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, recursive?: bool}"
area = "components"
milestone = "M6"
summary = "Read-only query returning the names of all glyphs that reference the given glyph as a component; the data behind the context-menu item above. The recursive option (users of users) is our addition."
ref = "Reusing Shapes › Components › Moving between Base Glyphs and Composites"
status = "inferred"
notes = "Our own query."
guesses = [
  "`recursive` adds glyphs that use the composites, to the component depth limit; it has no counterpart in the reference app.",
]
own = true

[[command]]
id = "component.disableAutomaticAlignment"
label = "Disable Automatic Alignment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item on an auto-aligned component that turns alignment off for it, so the component can be positioned by hand."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "observed"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 17:30–17:36: the context menu of a component lists Disable Automatic Alignment, and after choosing it the component is dragged freely. Stores alignment -1 on the component (file-format specification v3)."

[[command]]
id = "component.enableAutomaticAlignment"
label = "Enable Automatic Alignment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item on a manually placed component that turns automatic alignment back on for it."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Enable stores 0 (decided by the layer) on a layer of components only and 1 (forced) on a layer that has paths, so the item always aligns the component; enabling alignment on a component next to a path in the reference app settles it.",
]

[[command]]
id = "component.lock"
label = "Lock Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that pins a component in place so it cannot be moved. It applies to components that are not auto-aligned."
ref = "Reusing Shapes › Components › Locking Components"
status = "handbook"
notes = "Documented, not yet observed. Sets the component's `locked` flag, the same flag `path.lockPath` sets on components since M3; the two commands share one implementation."
guesses = [
  "Lock Component is offered only for components that are not aligned automatically, and the command refuses an aligned component with a message; the context menu of an aligned component in the reference app settles it.",
]

[[command]]
id = "component.unlock"
label = "Unlock Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that releases a locked component so it can be moved again."
ref = "Reusing Shapes › Components › Locking Components"
status = "handbook"

[[command]]
id = "glyph.decomposeGlyph"
label = "Decompose Glyph"
menu = ["Glyph"]
shortcut = "Cmd+Shift+D"
kind = "engine"
params = "{glyphs?: [names], layer?: id}"
area = "components"
milestone = "M6"
summary = "Replaces every component of the glyph layer with the paths and anchors of its base glyph, descending through nested components until none remain."
ref = "Reusing Shapes › Components › Decomposing"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The anchors that decomposition brings in are the propagated anchors the layer lacks, so mark attachment is unchanged; decomposing a composite with propagated anchors in the reference app settles it.",
]

[[command]]
id = "component.decompose"
label = "Decompose"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that turns only the selected components into their contents, one level deep: components nested inside them are kept as components."
ref = "Reusing Shapes › Components › Decomposing"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 17:30–17:36: Decompose is listed in the context menu of a component. Its effect is not shown. Documented, not yet observed."
guesses = [
  "Decomposing one level adds no anchors to the layer; a smart component becomes its interpolated outline; corner, cap, segment and brush components inside the base glyph are applied before its paths are copied. Decomposing such components in the reference app settles it.",
]

[[behavior]]
id = "components.tabCyclesComponents"
area = "components"
milestone = "M6"
summary = "With a component selected, Tab moves the selection to the next component on the layer and Shift+Tab to the previous one. This is the generic next/previous-object selection (selection.selectNext in the Edit View inventory) applied to components."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Tab steps through the layer's nodes in path order, then the components in shape order, then the anchors, then the guides; Tab on a layer with components and anchors in the reference app settles it.",
]

[[behavior]]
id = "components.infoBoxExtraControls"
area = "components"
milestone = "M6"
summary = "Beyond the fields listed for the component Info box in the Edit View inventory (infoBox.component: name, offset, scales, slant, rotation, arrow button), this chapter adds two conditional controls: an anchor menu, present only when the attached component has several candidate anchors, and a Smart badge on smart components. The box needs View › Show Info and at least one selected component."
ref = "Reusing Shapes › Components › Editing Components; Components › Anchors; Smart Components › Using Smart Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The arrow button sits at the top right of the component Info box, as the Measuring page says; the Components page says top left. A screenshot of the reference app settles it.",
]

[[behavior]]
id = "components.swapBaseKeepsPlacement"
area = "components"
milestone = "M6"
summary = "Changing the glyph a component points to (component.setBaseGlyph, defined in the Edit View inventory) is how a component is swapped; that the component keeps its slot in the shape order, its alignment state and its chosen anchor is our assumption, as the handbook only says the glyph is exchanged."
ref = "Edit View › Info Box; Reusing Shapes › Components › Editing Components"
status = "inferred"
notes = "The handbook (Components; Measuring › Info box) says only that the glyph is exchanged."
guesses = [
  "Swapping the base glyph keeps the component's slot in the shape order, its transform, its alignment setting and its stored attachment anchor; swapping a component in the reference app settles it.",
]

[[behavior]]
id = "components.flipViaNegativeScaleOrMirror"
area = "components"
milestone = "M6"
summary = "A component is flipped with the Palette mirror buttons or by transforming it through the Info box or bounding box (component.setTransform, defined in the Edit View inventory). The handbook does not spell out that a negative scale percentage is how a flip is stored for glyph components; it says so only for corner components."
