[[behavior]]
id = "corner.scaleInterpolatesWithIntermediateLayers"
area = "components"
milestone = "M6"
summary = "If the corner glyph has Intermediate layers tagged with a Width and Height in percent (for instance 150 % by 100 %), scaling interpolates between the main layer and those layers. An axis with no layer away from 100 % still stretches: with only a 150 % width layer, a 125 % width is interpolated while any height change stretches."
ref = "Reusing Shapes › Corner Components › Adjusting the Width and Height"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle handles these layers; the file format does not say how the Width and Height percentages are stored."
guesses = [
  "The percentages are read from the intermediate layer's name (for example `Width 150 Height 100`, a missing one is 100); on each axis the layers that vary it with the other axis at 100 % are interpolated piecewise linearly with the master layer at 100 %, scales beyond them are extrapolated, negative scales mirror after interpolation, and layers that vary both axes are not used. A corner glyph saved by the reference app with such a layer settles it.",
]

[[behavior]]
id = "corner.closedPathsAllowed"
area = "components"
milestone = "M6"
summary = "A corner glyph may hold closed paths besides its single open path; they are carried along with the corner as extra shapes inside or outside it. The open path has to be the first shape of the layer (reorder with Filter › Shape Order)."
ref = "Reusing Shapes › Corner Components › Closed Paths in Corners"
status = "handbook"
notes = "Documented, not yet observed. Ported from fontc: the corner glyph's first path is the corner, its other paths are added to the layer after the layer's shapes, fitted with the corner (the reference app's output for `as_closedpaths` in fontc's test source `CornerComponents.glyphs`)."

[[behavior]]
id = "corner.extraNodesAcceptCorners"
area = "components"
milestone = "M6"
summary = "Extra nodes, the points where overlapping paths intersect (displayed with View › Show Nodes › Extra Nodes), can take corner components through the same context-menu item. This gives smooth joins or ink traps at stem and crossbar crossings."
ref = "Reusing Shapes › Corner Components › Extra Nodes"
status = "handbook"
notes = "Documented, not yet observed. The file format stores such a corner with a four-number origin: a path and the node ending one segment, and a path and the node ending the other (GlyphsSDK file-format specification v3, `indexPath`); fontc reads only the first two numbers. FontCraft reads all four and leaves these corners out of outlines: fitting one needs the two paths' overlap removed first, which the model's outline resolution cannot do."

