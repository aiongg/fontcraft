status = "handbook"
notes = "Documented, not yet observed. The file format stores the properties per glyph (`partsSettings`) and the pole per layer (`partSelection`, 1 bottom, 2 top); a smart layer belongs to one master (`associatedMasterId`), so each master has its own smart layers (file-format specification v3)."

