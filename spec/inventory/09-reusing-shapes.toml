# Source: Glyphs 4 Handbook, chapter "Reusing Shapes" (Components, Smart Components, Corner
# Components, Cap Components, Segment Components, Brushes, Pixel Tool), public web handbook at
# https://handbook.glyphsapp.com/ . A few rows cite cross-referenced sections of other chapters
# (Edit View › Info Box, Edit View › Anchors, Font Info › Other, Spacing › Metrics Keys & Automatic
# Alignment, Appendix › Custom Parameters); those are named in `ref`.
# Date: 2026-10-07
#
# Conventions used in this file
# - Commands that exist in the reference only as an Info box field, a context-menu item or a mouse
#   gesture get a command id here so agents can run them headless; `menu = []` for those.
# - `status = "handbook"` means the behaviour is stated in the handbook. Where only the command
#   shape (id, params) is ours, the status stays `handbook`; where the behaviour itself is our
#   guess the row is `inferred`, and where it is recalled but absent from the handbook, `memory`.
# - Commands owned by other chapters (Glyph › Add Glyphs, Glyph › Set Anchors, Path › Align
#   Selection, Edit › Select All, Edit › Copy/Paste, Edit › Info for Selection, View › Show Info,
#   View › Show Bounding Box, Filter › Shape Order, Palette mirror buttons, custom parameters and
#   Font Info options) are NOT redefined here; their component-specific effects are `[[behavior]]`
#   rows.
# - component.setTransform, component.setBaseGlyph, component.editBaseGlyph, the panels
#   infoBox.component / infoBox.componentGlyphPicker and selection.selectNext live in the Edit View
#   inventory files (03a/03b); this file refers to them and does not repeat them.

# =====================================================================================
# Components: building composites
# =====================================================================================

[[command]]
id = "glyph.createComposite"
label = "Create Composite"
menu = ["Glyph"]
shortcut = "Cmd+Ctrl+C"
kind = "engine"
params = "{glyphs?: [names], layer?: id, allMasters?: bool}"
area = "components"
milestone = "M6"
summary = "Rebuilds the current layer of each target glyph as a composite: every path and component already on the layer is removed and the components named by the glyph info database for that glyph are inserted in the database's order. With allMasters it does the same on every master layer."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"
notes = "Documented, not yet observed. The list of components comes from the glyph database, whose published data has no composition column (open decision D6); see the guesses."
guesses = [
  "The components are the full Unicode canonical decomposition of the glyph's code point, each code point mapped to its glyph name through the glyph database (U+0301 to acutecomb), suffixes carried over and the preferred-mark rules applied, plus our own table for glyphs Unicode does not decompose (i, j and ligatures by their name parts); the composites stored in corpus files saved by the reference app measure it (M6 plan § 5).",
  "A glyph the database cannot decompose, or one whose parts are missing from the font, is refused with a message naming the missing parts and nothing changes; running it on such a glyph in the reference app settles it.",
  "Create Composite keeps the layer's anchors and the glyph's metrics keys; the reference app settles it.",
]

[[command]]
id = "glyph.createCompositeAllMasters"
label = "Create Composite (all masters)"
menu = ["Glyph"]
shortcut = "Cmd+Ctrl+Alt+C"
kind = "engine"
params = "{glyphs?: [names]}"
area = "components"
milestone = "M6"
summary = "The Option-key alternate of Create Composite: replaces the shapes on all master layers of the glyph, not only the current one. The handbook gives the shortcut but no separate menu label, so the label here is ours."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[command]]
id = "glyph.addComponent"
label = "Add Component"
menu = ["Glyph"]
shortcut = "Cmd+Shift+C"
kind = "engine"
params = "{glyph?: name, layer?: id, component: name | unicode, allMasters?: bool}"
area = "components"
milestone = "M6"
summary = "Appends one component to the current layer. In the UI it opens the component picker, where the base glyph is found by glyph name or Unicode value; headless callers pass the base glyph directly."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 11:42–11:51: the canvas context menu offers Add Component…, which opens a search field titled Choose Component at the bottom of the window; typing O and confirming adds O as a component, drawn filled without nodes. Not shown: the Glyph menu, Cmd+Shift+C, lookup by Unicode value."

[[command]]
id = "glyph.addComponentAllMasters"
label = "Add Component (all masters)"
menu = ["Glyph"]
shortcut = "Cmd+Alt+Shift+C"
kind = "engine"
params = "{glyph?: name, component: name | unicode}"
area = "components"
milestone = "M6"
summary = "The Option-key alternate of Add Component: the chosen component is appended on every master layer of the glyph. The handbook gives the shortcut but no separate menu label."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[command]]
id = "glyph.componentFromSelection"
label = "Component from Selection"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, shapes?: [indices], name: string}"
area = "components"
milestone = "M6"
summary = "Moves the selected paths and components of a layer into a new glyph with the given name and puts a component referencing that glyph in their place. In the UI it first asks for the name, then appends the new glyph to the current Edit View tab and makes it the active glyph. Also offered in the canvas context menu."
ref = "Reusing Shapes › Components › Turning Paths into Components"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 16:09–16:21: offered in the canvas context menu; it asks for a name and then the selected paths are replaced by a component. Not shown: the Glyph menu entry, the new glyph being added to the tab. At the same point the dialog says the change applies to all master layers (dialog.componentFromSelection)."
guesses = [
  "The suggested name is `_part.` plus the current glyph's name, with `.001`, `.002` appended while the name is taken; the dialog of the reference app settles it.",
  "A name that is already a glyph is refused with a message; the reference app settles it.",
  "The new glyph keeps the shapes at their coordinates and the component sits at offset zero; anchors stay on the original layer; the reference app settles it.",
  "On each other master the shapes with the same indices move into the new glyph's layer of that master, and a master whose layer lacks them gets an empty layer; a two-master font in the reference app settles it.",
]

[[panel]]
id = "dialog.componentPicker"
label = "Component picker"
location = "dialog"
controls = ["search field matching glyph name or Unicode value", "result list of glyphs", "Return inserts the highlighted glyph"]
area = "components"
milestone = "M6"
summary = "The glyph picker shown by Add Component. It behaves exactly like the glyph picker the Text tool uses to insert glyphs in Edit View, so one picker implementation serves both."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[panel]]
id = "dialog.componentFromSelection"
label = "Component from Selection"
location = "dialog"
controls = [
  "glyph name field, pre-filled with a suggested name",
  "line stating that the change applies to all master layers",
  "Cancel and OK buttons",
]
area = "components"
milestone = "M6"
summary = "Asks for the name of the glyph that will hold the selected shapes. The field starts with a name suggested from context and accepts any other name; an underscore-prefixed name makes the new glyph a non-exporting part."
ref = "Reusing Shapes › Components › Turning Paths into Components"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 16:09–16:21: the dialog is titled Name of the Component Glyph, says that it applies to all master layers, and has a text field with Cancel and OK. Not shown: whether the field is pre-filled, an underscore name."

[[behavior]]
id = "components.liveUpdateFromBaseGlyph"
area = "components"
milestone = "M6"
summary = "A component is a live reference to its base glyph: editing the base glyph changes every component that points to it, and in Edit View the composites redraw while the base glyph is being edited."
ref = "Reusing Shapes › Components"
status = "handbook"

[[behavior]]
id = "components.autoComposeOnAddGlyph"
area = "components"
milestone = "M6"
summary = "When a glyph that the glyph info database describes as a composite is added to the font, it is created already filled with its components (adding eacute yields e plus acutecomb). The database is the only source for which components go into which glyph."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[behavior]]
id = "components.autoComposeNeedsAllParts"
area = "components"
milestone = "M6"
summary = "Automatic composition is all-or-nothing: if any one of the components the database calls for is missing from the font, no components are inserted."
ref = "Reusing Shapes › Components › Building Composites"
status = "handbook"

[[behavior]]
id = "components.preferMarkWithSameSuffix"
area = "components"
milestone = "M6"
summary = "While composing a glyph automatically, a mark glyph carrying the same dot suffix as the composite wins over the plain mark when it exists (agrave.sc takes gravecomb.sc before gravecomb)."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"

[[behavior]]
id = "components.preferCaseMarksForUppercase"
area = "components"
milestone = "M6"
summary = "While composing an uppercase letter automatically, a mark with the suffix .case is used in place of the plain mark when the font has one (Agrave takes gravecomb.case before gravecomb)."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"

[[behavior]]
id = "components.preferNarrowMarksForIJ"
area = "components"
milestone = "M6"
summary = "Composites built on i or j (imacron, jcircumflex and the like) prefer mark glyphs whose names end in .i or .narrow when such marks exist."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"

[[behavior]]
id = "components.ijBuiltFromDotless"
area = "components"
milestone = "M6"
summary = "The default composition of i and j is the dotless letter (idotless, jdotless) plus a dotaccentcomb component."
ref = "Reusing Shapes › Components › Preferred Marks for Glyph Composition"
status = "handbook"

[[behavior]]
id = "components.recipeSingleComponent"
area = "components"
milestone = "M6"
summary = "Add Glyphs accepts the recipe form component=glyph: the glyph named on the right of the equals sign is created holding the glyph on the left as its only component (Delta=increment makes increment from one Delta component)."
ref = "Reusing Shapes › Components › Recipes"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "components.recipeBasePlusMarks"
area = "components"
milestone = "M6"
summary = "Add Glyphs accepts the recipe form base+mark=glyph: names joined by plus signs become the components, in that order, of the glyph named after the equals sign, and the mark components are positioned on the base through anchors (q+tildecomb=qtilde)."
ref = "Reusing Shapes › Components › Recipes"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A part whose glyph has category Mark is a mark and attaches to the base before it; any other part is a base; a recipe holds only glyph names, no spaces (spaces separate items in Add Glyphs) and any number of plus signs; typing recipes with code points or spaces into the reference app settles it.",
]

[[behavior]]
id = "components.recipeMultipleBases"
area = "components"
milestone = "M6"
summary = "A recipe may join several base glyphs with plus signs (t+s.join=ts); they become base components set side by side, which is the usual way to build ligatures."
ref = "Reusing Shapes › Components › Recipes"
status = "handbook"
notes = "Documented, not yet observed."

[[behavior]]
id = "components.underscoreNameNotExported"
area = "components"
milestone = "M6"
summary = "A glyph whose name begins with an underscore defaults to non-exporting, so it can serve purely as a part inside other glyphs (an _f.connect shared by fl and f_f). The default comes from the name; the glyph's exports property remains the actual switch."
ref = "Reusing Shapes › Components › Underscore Components"
status = "handbook"

# =====================================================================================
# Components: selecting and editing
# =====================================================================================

[[command]]
id = "component.move"
label = "Move Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices], dx: number, dy: number}"
area = "components"
milestone = "M6"
summary = "Shifts the selected components by a delta; the UI drives it from mouse drags and arrow keys (1 unit, Shift 10, Cmd 100). Auto-aligned components ignore the move, except the blue single-number case which accepts only the vertical part; locked components do not move."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[command]]
id = "component.setAnchor"
label = "Choose Attachment Anchor"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, component: index, anchor: name}"
area = "components"
milestone = "M6"
summary = "Chooses which of several same-type anchors (top, top_alt, top_viet ...) an attached component snaps to. In the UI it is the anchor menu in the component Info box, which only appears when more than one candidate anchor exists."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"
notes = "Documented, not yet observed. Stored as the component's `anchor` attribute."
guesses = [
  "The anchor menu lists the anchors of the attachment target whose name is the mark anchor's name without its underscore or that name followed by an underscore and a suffix; when the stored name no longer exists, the component attaches to the plain name and keeps the stored value; the reference app settles it.",
]

[[command]]
id = "glyph.showGlyphsUsingAsComponent"
label = "Show all glyphs that use this glyph as a component"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph?: name}"
area = "components"
milestone = "M6"
summary = "Canvas context-menu item that displays every glyph containing the current glyph as a component. The handbook does not say whether the result opens in a new tab or replaces the current text."
ref = "Reusing Shapes › Components › Moving between Base Glyphs and Composites"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The glyphs open in a new Edit View tab, one per line slot in glyph order; the reference app settles it.",
]

[[command]]
id = "glyph.listComposites"
label = "List Glyphs Using Glyph as Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph: name, recursive?: bool}"
area = "components"
milestone = "M6"
summary = "Read-only query returning the names of all glyphs that reference the given glyph as a component; the data behind the context-menu item above. The recursive option (users of users) is our addition."
ref = "Reusing Shapes › Components › Moving between Base Glyphs and Composites"
status = "inferred"
notes = "Our own query."
guesses = [
  "`recursive` adds glyphs that use the composites, to the component depth limit; it has no counterpart in the reference app.",
]
own = true

[[command]]
id = "component.disableAutomaticAlignment"
label = "Disable Automatic Alignment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item on an auto-aligned component that turns alignment off for it, so the component can be positioned by hand."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "observed"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 17:30–17:36: the context menu of a component lists Disable Automatic Alignment, and after choosing it the component is dragged freely. Stores alignment -1 on the component (file-format specification v3)."

[[command]]
id = "component.enableAutomaticAlignment"
label = "Enable Automatic Alignment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item on a manually placed component that turns automatic alignment back on for it."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Enable stores 0 (decided by the layer) on a layer of components only and 1 (forced) on a layer that has paths, so the item always aligns the component; enabling alignment on a component next to a path in the reference app settles it.",
]

[[command]]
id = "component.lock"
label = "Lock Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that pins a component in place so it cannot be moved. It applies to components that are not auto-aligned."
ref = "Reusing Shapes › Components › Locking Components"
status = "handbook"
notes = "Documented, not yet observed. Sets the component's `locked` flag, the same flag `path.lockPath` sets on components since M3; the two commands share one implementation."
guesses = [
  "Lock Component is offered only for components that are not aligned automatically, and the command refuses an aligned component with a message; the context menu of an aligned component in the reference app settles it.",
]

[[command]]
id = "component.unlock"
label = "Unlock Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that releases a locked component so it can be moved again."
ref = "Reusing Shapes › Components › Locking Components"
status = "handbook"

[[command]]
id = "glyph.decomposeGlyph"
label = "Decompose Glyph"
menu = ["Glyph"]
shortcut = "Cmd+Shift+D"
kind = "engine"
params = "{glyphs?: [names], layer?: id}"
area = "components"
milestone = "M6"
summary = "Replaces every component of the glyph layer with the paths and anchors of its base glyph, descending through nested components until none remain."
ref = "Reusing Shapes › Components › Decomposing"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The anchors that decomposition brings in are the propagated anchors the layer lacks, so mark attachment is unchanged; decomposing a composite with propagated anchors in the reference app settles it.",
]

[[command]]
id = "component.decompose"
label = "Decompose"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, components?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that turns only the selected components into their contents, one level deep: components nested inside them are kept as components."
ref = "Reusing Shapes › Components › Decomposing"
status = "handbook"
notes = "Video \"Design Amazing Fonts | The Best Beginners tutorial to Glyphs 3 and Type Design\" (channel of playlist PLcxk4zxYs459_dJ3WFzEkjdVFjd3sEWp8, https://www.youtube.com/watch?v=VGe96Qjlvvc; it shows Glyphs 3, not Glyphs 4), 17:30–17:36: Decompose is listed in the context menu of a component. Its effect is not shown. Documented, not yet observed."
guesses = [
  "Decomposing one level adds no anchors to the layer; a smart component becomes its interpolated outline; corner, cap, segment and brush components inside the base glyph are applied before its paths are copied. Decomposing such components in the reference app settles it.",
]

[[behavior]]
id = "components.tabCyclesComponents"
area = "components"
milestone = "M6"
summary = "With a component selected, Tab moves the selection to the next component on the layer and Shift+Tab to the previous one. This is the generic next/previous-object selection (selection.selectNext in the Edit View inventory) applied to components."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Tab steps through the layer's nodes in path order, then the components in shape order, then the anchors, then the guides; Tab on a layer with components and anchors in the reference app settles it.",
]

[[behavior]]
id = "components.infoBoxExtraControls"
area = "components"
milestone = "M6"
summary = "Beyond the fields listed for the component Info box in the Edit View inventory (infoBox.component: name, offset, scales, slant, rotation, arrow button), this chapter adds two conditional controls: an anchor menu, present only when the attached component has several candidate anchors, and a Smart badge on smart components. The box needs View › Show Info and at least one selected component."
ref = "Reusing Shapes › Components › Editing Components; Components › Anchors; Smart Components › Using Smart Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The arrow button sits at the top right of the component Info box, as the Measuring page says; the Components page says top left. A screenshot of the reference app settles it.",
]

[[behavior]]
id = "components.swapBaseKeepsPlacement"
area = "components"
milestone = "M6"
summary = "Changing the glyph a component points to (component.setBaseGlyph, defined in the Edit View inventory) is how a component is swapped; that the component keeps its slot in the shape order, its alignment state and its chosen anchor is our assumption, as the handbook only says the glyph is exchanged."
ref = "Edit View › Info Box; Reusing Shapes › Components › Editing Components"
status = "inferred"
notes = "The handbook (Components; Measuring › Info box) says only that the glyph is exchanged."
guesses = [
  "Swapping the base glyph keeps the component's slot in the shape order, its transform, its alignment setting and its stored attachment anchor; swapping a component in the reference app settles it.",
]

[[behavior]]
id = "components.flipViaNegativeScaleOrMirror"
area = "components"
milestone = "M6"
summary = "A component is flipped with the Palette mirror buttons or by transforming it through the Info box or bounding box (component.setTransform, defined in the Edit View inventory). The handbook does not spell out that a negative scale percentage is how a flip is stored for glyph components; it says so only for corner components."
ref = "Reusing Shapes › Components › Editing Components; Palette › Transformations"
status = "inferred"
notes = "The file format stores a component's transform as a scale, an angle and a slant, or as a matrix (file-format specification v3), so a flip is a negative scale."
guesses = [
  "The mirror buttons and a negative scale in the Info box give the same stored transform; mirroring a component in the reference app and saving settles it.",
]

[[behavior]]
id = "components.clickSelects"
area = "components"
milestone = "M6"
summary = "Clicking a component with the Select tool selects it; one or more selected components bring up the component Info box next to the glyph Info box."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[behavior]]
id = "components.rubberBandIgnoresComponents"
area = "components"
milestone = "M6"
summary = "A selection rectangle dragged with the Select tool skips components; holding Option while dragging includes them."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[behavior]]
id = "components.selectAllTwoStage"
area = "components"
milestone = "M6"
summary = "On a layer that has paths, the first Select All (Cmd+A) takes only the paths; a second Select All adds all components (and, per the Edit View chapter, anchors)."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[behavior]]
id = "components.transformVia"
area = "components"
milestone = "M6"
summary = "Components can be transformed three ways: by the fields of their Info box, by dragging the bounding box, and by the Transformations section of the Palette."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[behavior]]
id = "components.verticalFlipSwapsTopBottomAnchors"
area = "components"
milestone = "M6"
summary = "Mirroring a component top-to-bottom exchanges the roles of its top and bottom anchors, so the anchor that ends up above still acts as the top one and the one below as the bottom one. A flipped top mark can therefore attach as a bottom mark (gcommaaccent from g and a flipped commaaccentcomb)."
ref = "Reusing Shapes › Components › Editing Components; Palette › Transformations"
status = "handbook"
notes = "Documented, not yet observed. Both oracles swap anchor names when they propagate through a transformed component: a negative vertical scale swaps top and bottom in the name, a negative horizontal scale swaps left and right and entry and exit, and a 180° rotation does both (fontc `get_xy_rotation`). FontCraft uses the same rule for alignment, so a suffixed name (top_viet) swaps too."

[[behavior]]
id = "components.arrowKeyIncrements"
area = "components"
milestone = "M6"
summary = "Arrow keys nudge the selected components by 1 unit, by 10 with Shift held and by 100 with Cmd held."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[behavior]]
id = "components.optionDragDuplicates"
area = "components"
milestone = "M6"
summary = "Dragging a component with Option held leaves the original in place and drags a copy."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[behavior]]
id = "components.deleteKeyRemoves"
area = "components"
milestone = "M6"
summary = "Pressing Delete removes all selected components from the layer."
ref = "Reusing Shapes › Components › Editing Components"
status = "handbook"

[[behavior]]
id = "components.doubleClickOpensBase"
area = "components"
milestone = "M6"
summary = "Double-clicking a component places its base glyph next to the composite in the Edit View text and activates it for editing."
ref = "Reusing Shapes › Components › Moving between Base Glyphs and Composites"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The base glyph goes into the tab text to the left of the composite, as the Info box section of the Measuring page says; the Components page says only next to it. Double-clicking a component in the reference app settles it.",
]

[[behavior]]
id = "components.lockedCannotMove"
area = "components"
milestone = "M6"
summary = "A locked component rejects every move, from mouse, arrow keys or Info box, until it is unlocked."
ref = "Reusing Shapes › Components › Locking Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A lock blocks Info box position edits and the Palette's transformations as well as moves, and leaves the component's other settings editable; a locked component in the reference app settles it.",
]

[[behavior]]
id = "components.placeholderEmptyBase"
area = "components"
milestone = "M6"
summary = "A component whose base glyph exists but has an empty layer is drawn as an empty-base placeholder. The remedies are to delete the component or to draw something on that layer."
ref = "Reusing Shapes › Components › Component Placeholders"
status = "handbook"

[[behavior]]
id = "components.placeholderMissingBase"
area = "components"
milestone = "M6"
summary = "A component that names a glyph absent from the font is drawn as a no-base-glyph placeholder. Clicking it still shows the referenced name in the Info box, and it resolves when the component is removed or a glyph of that name is added."
ref = "Reusing Shapes › Components › Component Placeholders"
status = "handbook"

[[behavior]]
id = "components.placeholderCircularReference"
area = "components"
milestone = "M6"
summary = "A component whose base glyph, directly or through nesting, contains the glyph it sits in is flagged as a bad reference and drawn as a placeholder rather than expanded."
ref = "Reusing Shapes › Components › Component Placeholders"
status = "handbook"

[[behavior]]
id = "components.nodesInsideComponentsSnap"
area = "components"
milestone = "M6"
summary = "While a node, anchor or other element is being dragged, the nodes inside components on the layer are revealed as snap targets, and the dragged element snaps to one when it comes close."
ref = "Reusing Shapes › Components › Combining Paths and Components"
status = "handbook"

[[behavior]]
id = "components.alignOriginToNode"
area = "components"
milestone = "M6"
summary = "Path › Align Selection (Cmd+Shift+A) with exactly one node and one component selected moves the component so its origin lands on the node; the node does not move. The origin is the point where the baseline meets the left sidebearing (for an italic angle of zero), unless the base glyph has an anchor named origin, which then defines it."
ref = "Reusing Shapes › Components › Combining Paths and Components"
status = "handbook"

# =====================================================================================
# Components: nesting and anchor propagation
# =====================================================================================

[[behavior]]
id = "components.nestingAllowed"
area = "components"
milestone = "M6"
summary = "A base glyph may itself be made of components to any depth (dieresiscomb from two dotaccentcomb components, then used inside edieresis). Rendering, decomposition and export must resolve the whole chain."
ref = "Reusing Shapes › Components › Nesting Components"
status = "handbook"

[[behavior]]
id = "components.topBottomAnchorsPropagate"
area = "components"
milestone = "M6"
summary = "Anchors named top and bottom on a component's base glyph count as anchors of the composite that contains it, so further marks can attach to the composite although it holds no anchors of its own (Edieresis inherits bottom from E)."
ref = "Reusing Shapes › Components › Nesting Components"
status = "handbook"
notes = "Documented, not yet observed. The handbook and the Propagate Anchors parameter text name top and bottom; both oracles propagate every anchor name, with rules for underscore, entry, exit and origin anchors. fontc 1.0.0 `fontir/src/propagate_anchors.rs` (Apache-2.0; glyphsLib 6.15.0 `builder/transformations/propagate_anchors.py` is a port of it), checked by the M6 planning pass on a probe source built with fontc and fontmake 3.12.1, which gave identical anchors."
guesses = [
  "The editor and the compiler propagate anchors exactly as fontc does, every name included, since its algorithm gives top and bottom as the handbook says and also the other names both reference compilers export; a composite that inherits an ogonek or a cedilla anchor in the reference app settles it.",
]

[[behavior]]
id = "components.ownAnchorOverridesPropagated"
area = "components"
milestone = "M6"
summary = "An anchor placed directly in the composite replaces a propagated anchor of the same name."
ref = "Reusing Shapes › Components › Nesting Components"
status = "handbook"
notes = "Documented, not yet observed. Both oracles do the same (probe aacute with its own top). fontc 1.0.0 `fontir/src/propagate_anchors.rs` (Apache-2.0; glyphsLib 6.15.0 `builder/transformations/propagate_anchors.py` is a port of it), checked by the M6 planning pass on a probe source built with fontc and fontmake 3.12.1, which gave identical anchors."

[[behavior]]
id = "components.propagateAnchorsParameter"
area = "components"
milestone = "M6"
summary = "Propagation is on by default. A font-level custom parameter Propagate Anchors with its checkbox off stops it, which also suppresses the mark and mkmk rules that would be generated for composites from inherited anchors."
ref = "Reusing Shapes › Components › Nesting Components; Appendix › Custom Parameters › Propagate Anchors"
status = "handbook"
notes = "Documented, not yet observed. Both oracles read it as a font-level flag, on by default; off stops propagation entirely (fontc `glyphs2fontir/src/source.rs` `compilation_flags`; glyphsLib `TRANSFORMATION_CUSTOM_PARAMS`). Two fontc test sources set it off."

# =====================================================================================
# Components: anchors and automatic alignment
# =====================================================================================

[[behavior]]
id = "components.anchorsServeFeaturesAndComposition"
area = "components"
milestone = "M6"
summary = "One set of anchors drives both OpenType positioning (mark-to-base, mark-to-mark, cursive attachment) and the placement of components inside composites; the same anchor usually serves both jobs."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"

[[behavior]]
id = "components.underscoreAnchorSnapsToPlainAnchor"
area = "components"
milestone = "M6"
summary = "A component whose base glyph has an anchor with a leading underscore (_top) is positioned so that anchor coincides with the anchor of the same name without the underscore (top) on the base component, the same way mark-to-base positioning would place the mark glyph."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"

[[behavior]]
id = "components.alternativeAnchorSuffix"
area = "components"
milestone = "M6"
summary = "A layer may carry several anchors of one type, told apart by an underscore suffix after the shared name (top, top_alt, top_viet); the suffix text is free. A mark component can be switched between them."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"
notes = "Documented, not yet observed. The chosen anchor is stored as the component's `anchor` attribute (file-format specification v3). At export both oracles use it for components after the first: when the glyph has both X and _X, its X anchor takes the attribute's name, X being the part before the first underscore. Corpus attribute values: cedilla 72, right 20, top_2 9, top_1 4, top.alt 4."

[[behavior]]
id = "components.anchorMenuOnlyWhenChoiceExists"
area = "components"
milestone = "M6"
summary = "The anchor chooser in the component Info box is hidden unless the selected attached component has more than one anchor it could attach to."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"

[[behavior]]
id = "components.ligatureNumberedAnchors"
area = "components"
milestone = "M6"
summary = "In a composite whose glyph category is Ligature, the anchors propagated from each base component are numbered by base: top from the first base becomes top_1, from the second top_2, and an anchor already numbered is shifted by the number of bases before it. A later component whose anchor attribute is a numbered name (top_2) attaches to that numbered anchor. The handbook documents only the caret_N anchors of ligatures; under its alternative-anchor rule top_1 and top_2 are alternatives of top, so the anchor menu offers them."
ref = "fontc fontir/src/propagate_anchors.rs (ligature numbering, component anchor attribute); Reusing Shapes › Components › Anchors (alternative anchors)"
status = "docs"
notes = "Rewritten by the M6 planning pass from a recalled row: the oracles number ligature anchors this way (probe f_f gave top_1 and top_2; f_f with an acutecomb whose anchor attribute is top_2 attached it there). fontc 1.0.0 `fontir/src/propagate_anchors.rs` (Apache-2.0; glyphsLib 6.15.0 `builder/transformations/propagate_anchors.py` is a port of it), checked by the M6 planning pass on a probe source built with fontc and fontmake 3.12.1, which gave identical anchors."

[[behavior]]
id = "components.autoAlignDefaultOnWhenComponentsOnly"
area = "components"
milestone = "M6"
summary = "Automatic alignment is on by default for a glyph layer whose shapes are all components. It keeps both the component positions and the composite's metrics tied to the base glyphs, so a sidebearing change in U flows to every composite built on U."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed. The file format stores alignment per component as a number: -1 off, 0 decided by the layer (this rule and components.pathOnLayerDisablesAutoAlign), 1 forced on whatever the layer holds, 3 horizontal only (GlyphsSDK file-format specification v3, `GSComponentAlignment`, Apache-2.0). The model reads it as `Alignment` (M1). Positions are stored already aligned, so a file opens with the reference's placement."

[[behavior]]
id = "components.pathOnLayerDisablesAutoAlign"
area = "components"
milestone = "M6"
summary = "The presence of any path on a layer switches automatic alignment off for that layer. Components then keep fixed offsets and can drift out of place when their base glyphs change."
ref = "Reusing Shapes › Components › Combining Paths and Components"
status = "handbook"
notes = "Documented, not yet observed. The components keep the positions stored in the file when a path is added; the handbook's warning that they can shift when a base glyph changes says the same."

[[behavior]]
id = "components.fontWideDisableAutoAlign"
area = "components"
milestone = "M6"
summary = "The Font Info › Other option Disable Automatic Alignment turns off automatic component positioning and automatic metrics synchronisation for every composite in the font."
ref = "Reusing Shapes › Components › Automatic Alignment; Font Info › Other › Disable Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed. Stored as the font setting `disablesAutomaticAlignment` (file-format specification v3; `Settings.disables_automatic_alignment` in the model)."
guesses = [
  "The font-wide option also overrides components whose alignment is forced (1); a forced component in a font with the option on, in the reference app, settles it.",
]

[[behavior]]
id = "components.importedFilesDisableAutoAlignSetting"
area = "components"
milestone = "M6"
summary = "A user setting, Disable Automatic Alignment for Imported Files, decides whether fonts opened from OpenType or UFO sources start with automatic alignment switched off for all components."
ref = "Font Info › Other › Disable Automatic Alignment; Settings › User Settings"
status = "handbook"

[[behavior]]
id = "components.autoAlignColors"
area = "components"
milestone = "M6"
summary = "Component fill colour signals alignment state in Edit View: green for auto-aligned, gray for manually placed, blue for the vertically shiftable single-number case."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "handbook"

[[behavior]]
id = "components.autoAlignedCannotMove"
area = "components"
milestone = "M6"
summary = "An auto-aligned component cannot be dragged, nudged or repositioned through the Info box. The single exception is the blue case, which moves along the vertical axis only."
ref = "Reusing Shapes › Components › Editing Components; Edit View › Info Box"
status = "handbook"

[[behavior]]
id = "components.singleNumberComponentShiftsVertically"
area = "components"
milestone = "M6"
summary = "When a composite's only component has the glyph category Number (zero to nine), the component is drawn blue and may be moved up and down while its horizontal position and the composite's metrics stay automatic."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed. The file format has a value for this state, alignment 3 (horizontal only)."
guesses = [
  "A Number-category single component with alignment 0 behaves as alignment 3, and alignment 3 gives the same horizontal-only alignment to any component; the corpus alignment measure (M6 plan § 5) checks the stored positions of both.",
]

[[behavior]]
id = "components.autoAlignMetricsFromBase"
area = "components"
milestone = "M6"
summary = "The sidebearings of an auto-aligned composite are derived from its base components, so ordinary metrics keys cannot be set on it. Its metrics fields read auto followed by the derived value in parentheses."
ref = "Reusing Shapes › Components › Automatic Alignment; Spacing › Metrics Keys & Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed. Alignment writes the derived width into the layer, as the reference's files store it, so exported widths need no alignment step at compile."

[[behavior]]
id = "components.autoAlignMetricsOffsetKeys"
area = "components"
milestone = "M6"
summary = "An auto-aligned composite accepts exactly one kind of metrics key, a signed number written after an equals sign (=+18, =-12), which adds to or subtracts from the derived sidebearing while alignment stays on."
ref = "Reusing Shapes › Components › Automatic Alignment; Spacing › Metrics Keys & Automatic Alignment"
status = "handbook"

[[behavior]]
id = "components.autoAlignSingleComponent"
area = "components"
milestone = "M6"
summary = "A composite may consist of one auto-aligned component and then mirrors the base glyph's metrics. Typical uses are same-shape letters across scripts (Alpha, A, A-cy) and flipped twins (nine from six, mirrored brackets, guillemets and arrows)."
ref = "Reusing Shapes › Components › Automatic Alignment › Single Component"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A single aligned component keeps its transform; the composite takes the base glyph's width, and a horizontally flipped component is shifted so its outline keeps the base glyph's sidebearings mirrored (nine from six keeps six's width); the corpus alignment measure (M6 plan § 5) checks the flipped single components the sources hold.",
]

[[behavior]]
id = "components.autoAlignBaseThenMarks"
area = "components"
milestone = "M6"
summary = "In a base-plus-marks composite the base component comes first in the shape order and the combining marks follow it; each mark is placed on the base through a matching anchor pair."
ref = "Reusing Shapes › Components › Automatic Alignment › Base Component & Mark Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "The first base sits at x = 0 and y = 0 and keeps its scale, slant and rotation; only its offset is computed; the corpus alignment measure (M6 plan § 5) checks it.",
]

[[behavior]]
id = "components.marksStackInOrder"
area = "components"
milestone = "M6"
summary = "Several marks on one base stack in the order they were added: each later mark attaches to the mark before it. This requires every stacking mark glyph to carry both the underscore anchor (_top) and the plain anchor (top)."
ref = "Reusing Shapes › Components › Automatic Alignment › Base Component & Mark Components"
status = "handbook"
notes = "Documented, not yet observed. Propagation in both oracles gives the same result: a later component overwrites anchors of the same name, so after a mark with _top and top the composite's top is the mark's top, and a composite holding _bottom drops top and _top. fontc 1.0.0 `fontir/src/propagate_anchors.rs` (Apache-2.0; glyphsLib 6.15.0 `builder/transformations/propagate_anchors.py` is a port of it), checked by the M6 planning pass on a probe source built with fontc and fontmake 3.12.1, which gave identical anchors."
guesses = [
  "A mark's underscore anchor attaches to the anchor of that name the components before it give, as propagation computes it after each component (the most recent component that offers the name wins); a composite with two stacked marks and a third in the reference app settles it.",
]

[[behavior]]
id = "components.anchoredMarksDoNotAffectSidebearings"
area = "components"
milestone = "M6"
summary = "Mark components placed through anchors contribute nothing to the composite's sidebearings, so a wide mark may stick out of the glyph box (macron on dotless i). The stated cures are a narrower mark or an =+N / =-N metrics offset."
ref = "Reusing Shapes › Components › Automatic Alignment › Base Component & Mark Components"
status = "handbook"

[[behavior]]
id = "components.multipleBasesSetSideBySide"
area = "components"
milestone = "M6"
summary = "Several base components in one composite are laid out next to each other the way the same glyphs would be when typed in sequence."
ref = "Reusing Shapes › Components › Automatic Alignment › Multiple Base Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Each base after the first is placed at the sum of the advance widths before it, with no kerning, and the composite's width is the sum of the bases' widths; right-to-left glyphs are laid out the same way, in shape order; the corpus alignment measure (M6 plan § 5) checks it on the sources' ligatures.",
]

[[behavior]]
id = "components.marksBelongToPrecedingBase"
area = "components"
milestone = "M6"
summary = "With several bases, shape order assigns marks: each base component is followed by its own marks, then the next base and its marks. A mark therefore attaches to the nearest base before it."
ref = "Reusing Shapes › Components › Automatic Alignment › Multiple Base Components"
status = "handbook"

[[behavior]]
id = "components.exitEntryAnchorsConnectBases"
area = "components"
milestone = "M6"
summary = "Base components can be chained with cursive-attachment anchors: when one component's glyph has an anchor #exit and the next one's has #entry, the second is positioned so the two anchors coincide. A part carrying both can be repeated (m from _part.stem and two _part.arch)."
ref = "Reusing Shapes › Components › Automatic Alignment › Multiple Base Components"
status = "handbook"
notes = "Documented, not yet observed. Both oracles copy `#exit` and `#entry` anchors into composites like any name, and their mark writers ignore them, so they never reach curs."
guesses = [
  "Only the #-prefixed anchors connect components; the plain exit and entry anchors serve cursive attachment alone; the composite's width is the connected bases' widths after the shift, ending at the last base's advance. The corpus alignment measure (M6 plan § 5) checks it where sources use it.",
]

# =====================================================================================
# Export-time behaviour
# =====================================================================================

[[behavior]]
id = "export.componentsDecomposedWithRemoveOverlap"
area = "compile"
milestone = "M2"
summary = "Exporting with Remove Overlaps switched on converts every component to paths before overlaps are removed, so the output glyphs contain outlines only."
ref = "Reusing Shapes › Components"
status = "handbook"

[[behavior]]
id = "export.trueTypeKeepsNonOverlappingComponents"
area = "compile"
milestone = "M2"
summary = "A TrueType-flavour export without Remove Overlaps (variable fonts are the usual case) writes components that do not overlap as real composite-glyph references and decomposes only the composites whose components overlap."
ref = "Reusing Shapes › Components"
status = "handbook"

[[behavior]]
id = "export.keepOverlappingComponentsParameter"
area = "compile"
milestone = "M6"
summary = "The instance custom parameter Keep Overlapping Components makes a TrueType-flavour export keep overlapping components as references too (Ccedilla stays a composite). It does nothing for CFF output."
ref = "Reusing Shapes › Components; Appendix › Custom Parameters › Keep Overlapping Components"
status = "handbook"
notes = "See the parameter row Keep Overlapping Components and M6 plan § 7, question 5."

[[behavior]]
id = "export.underscoreGlyphsOmitted"
area = "compile"
milestone = "M2"
summary = "Non-exporting glyphs, which underscore-named part glyphs are by default, are left out of the exported font; composites using them must therefore have those components decomposed at export. The decomposition step is our inference from the non-export rule."
ref = "Reusing Shapes › Components › Underscore Components"
status = "inferred"
guesses = [
  "Components that use non-exporting glyphs are decomposed at export; our inference from the non-export rule.",
]

# =====================================================================================
# Smart components
# =====================================================================================

[[behavior]]
id = "smart.glyphDetection"
area = "components"
milestone = "M6"
summary = "A glyph is a smart glyph when its name starts with _smart. or _part. ; in addition every CJK radical glyph and every Korean base glyph is smart. Components that point at a smart glyph are smart components."
ref = "Reusing Shapes › Smart Components › Setting up Smart Glyphs"
status = "handbook"

[[behavior]]
id = "smart.layersHoldVariants"
area = "components"
milestone = "M6"
summary = "The alternative shapes of a smart glyph live on extra layers of that glyph (smart layers), added with the plus button of the Layers palette. A new layer is named with the current date and time and should be renamed, by double-clicking, to describe the variant (Narrow, Low Contrast)."
ref = "Reusing Shapes › Smart Components › Setting up Smart Glyphs"
status = "handbook"
notes = "Documented, not yet observed. The file format stores the properties per glyph (`partsSettings`) and the pole per layer (`partSelection`, 1 bottom, 2 top); a smart layer belongs to one master (`associatedMasterId`), so each master has its own smart layers (file-format specification v3)."

[[behavior]]
id = "smart.layersMustBeCompatible"
area = "components"
milestone = "M6"
summary = "Every smart layer must be outline-compatible with the master layer it varies, by the same rules as master compatibility, because instances are produced by interpolating between them."
ref = "Reusing Shapes › Smart Components › Setting up Smart Glyphs"
status = "handbook"

[[behavior]]
id = "smart.axesAreLocalToGlyph"
area = "components"
milestone = "M6"
summary = "Smart properties act like variation axes that exist only inside one glyph; each component instance carries its own value per property and the component outline is interpolated from the glyph's smart layers."
ref = "Reusing Shapes › Smart Components"
status = "handbook"
notes = "Documented, not yet observed. At export both oracles draw smart components as outlines when they load the source (glyphsLib `instantiate_smart_component`, fontc `glyphs-reader/src/smart_components.rs`), propagate the interpolated anchors, and keep a plain component when no layer maps to a pole. FontCraft's `model/smart.rs` (M2) draws them the glyphsLib way; M6 uses it in the editor and the compiler. Corpus: 10 smart glyphs and 15 smart components, all in fontc test data and the format samples."

