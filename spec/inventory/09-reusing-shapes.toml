# =====================================================================================
# Components: nesting and anchor propagation
# =====================================================================================

[[behavior]]
id = "components.nestingAllowed"
area = "components"
milestone = "M6"
summary = "A base glyph may itself be made of components to any depth (dieresiscomb from two dotaccentcomb components, then used inside edieresis). Rendering, decomposition and export must resolve the whole chain."
ref = "Reusing Shapes › Components › Nesting Components"
status = "handbook"
notes = "Documented, not yet observed. M6.1: the component index and anchor propagation follow nesting to the model's MAX_COMPONENT_DEPTH (32); deeper nesting is an error with a message."

[[behavior]]
id = "components.topBottomAnchorsPropagate"
area = "components"
milestone = "M6"
summary = "Anchors named top and bottom on a component's base glyph count as anchors of the composite that contains it, so further marks can attach to the composite although it holds no anchors of its own (Edieresis inherits bottom from E)."
ref = "Reusing Shapes › Components › Nesting Components"
status = "handbook"
notes = "Documented, not yet observed. The handbook and the Propagate Anchors parameter text name top and bottom; both oracles propagate every anchor name, with rules for underscore, entry, exit and origin anchors. fontc 1.0.0 `fontir/src/propagate_anchors.rs` (Apache-2.0; glyphsLib 6.15.0 `builder/transformations/propagate_anchors.py` is a port of it), checked by the M6 planning pass on a probe source built with fontc and fontmake 3.12.1, which gave identical anchors. The owner's answer to M6 plan § 7 question 7 (b): FontCraft's propagation is written from the handbook and from the oracles' outputs observed as a black box, with the plan's propagation measure (equal to glyphsLib's output on every corpus glyph and master layer) as its specification. Neither oracle's propagation code is read or ported: both derive from the reference app's source (docs/references.md). M6.1: FontCraft's propagation (crates/components/src/propagate.rs) follows rules found by running glyphsLib 6.15.0's public propagate_all_anchors on fonts built for the purpose; a model of those rules matched its output, names, positions and order, on random fonts and on 42,734 of the 42,736 master layers of the corpus sources it loads (the other two hold smart components, whose anchors glyphsLib interpolates from the pole layers). The rules are listed in the module doc: underscore anchors come only from the first component, names starting with entry only from the first component, exit anchors are dropped when a later component without underscore anchors has none, a base that is not a Mark with _top passes on no bottom (and the reverse), a Mark with anchors of its own keeps only those."
guesses = [
  "The editor and the compiler propagate anchors exactly as fontc does, every name included, since its algorithm gives top and bottom as the handbook says and also the other names both reference compilers export; a composite that inherits an ogonek or a cedilla anchor in the reference app settles it.",
  "A non-master layer whose base glyph has no layer with the same id reads the base's master layer of the same master, where glyphsLib interpolates the base's anchors at the layer's axis location; a brace layer in the reference app whose base lacks it settles it.",
  "A base glyph without a layer for the composite's master passes no anchors on, where glyphsLib stops with an error; the reference app with such a font settles it.",
  "A component pinned to another master (`masterId`) passes on the anchors of that master's layer of its base, the layer alignment places it from; a composite with a pinned component in the reference app, read through a mark attached to it, settles it.",
]

[[behavior]]
id = "components.ownAnchorOverridesPropagated"
area = "components"
milestone = "M6"
summary = "An anchor placed directly in the composite replaces a propagated anchor of the same name."
ref = "Reusing Shapes › Components › Nesting Components"
status = "handbook"
notes = "Documented, not yet observed. Both oracles do the same (probe aacute with its own top). fontc 1.0.0 `fontir/src/propagate_anchors.rs` (Apache-2.0; glyphsLib 6.15.0 `builder/transformations/propagate_anchors.py` is a port of it), checked by the M6 planning pass on a probe source built with fontc and fontmake 3.12.1, which gave identical anchors. The owner's answer to M6 plan § 7 question 7 (b): FontCraft's propagation is written from the handbook and from the oracles' outputs observed as a black box, with the plan's propagation measure (equal to glyphsLib's output on every corpus glyph and master layer) as its specification. Neither oracle's propagation code is read or ported: both derive from the reference app's source (docs/references.md). M6.1: implemented. Also observed in glyphsLib's output: an own _top anchor removes the propagated and own bottom and _bottom anchors, an own _bottom removes top and _top, and any own underscore anchor stops the first component's underscore anchor."

[[behavior]]
id = "components.propagateAnchorsParameter"
area = "components"
milestone = "M6"
summary = "Propagation is on by default. A font-level custom parameter Propagate Anchors with its checkbox off stops it, which also suppresses the mark and mkmk rules that would be generated for composites from inherited anchors."
ref = "Reusing Shapes › Components › Nesting Components; Appendix › Custom Parameters › Propagate Anchors"
status = "handbook"
notes = "Documented, not yet observed. Both oracles read it as a font-level flag, on by default; off stops propagation entirely (fontc `glyphs2fontir/src/source.rs` `compilation_flags`; glyphsLib `TRANSFORMATION_CUSTOM_PARAMS`). Two fontc test sources set it off. The owner's answer to M6 plan § 7 question 7 (b): FontCraft's propagation is written from the handbook and from the oracles' outputs observed as a black box, with the plan's propagation measure (equal to glyphsLib's output on every corpus glyph and master layer) as its specification. Neither oracle's propagation code is read or ported: both derive from the reference app's source (docs/references.md). M6.1: propagate_anchors_enabled reads the font parameter (off when present, enabled and false or 0); off, every layer keeps only its own anchors."

# =====================================================================================
# Components: anchors and automatic alignment
# =====================================================================================

[[behavior]]
id = "components.anchorsServeFeaturesAndComposition"
area = "components"
milestone = "M6"
summary = "One set of anchors drives both OpenType positioning (mark-to-base, mark-to-mark, cursive attachment) and the placement of components inside composites; the same anchor usually serves both jobs."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"

[[behavior]]
id = "components.underscoreAnchorSnapsToPlainAnchor"
area = "components"
milestone = "M6"
summary = "A component whose base glyph has an anchor with a leading underscore (_top) is positioned so that anchor coincides with the anchor of the same name without the underscore (top) on the base component, the same way mark-to-base positioning would place the mark glyph."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "A component whose underscore anchors find no plain anchor among the components before it is set after them as another base, as if typed; a mark added to a base without the matching anchor in the reference app settles it.",
]

[[behavior]]
id = "components.alternativeAnchorSuffix"
area = "components"
milestone = "M6"
summary = "A layer may carry several anchors of one type, told apart by an underscore suffix after the shared name (top, top_alt, top_viet); the suffix text is free. A mark component can be switched between them."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"
notes = "Documented, not yet observed. The chosen anchor is stored as the component's `anchor` attribute (file-format specification v3). At export both oracles use it for components after the first: when the glyph has both X and _X, its X anchor takes the attribute's name, X being the part before the first underscore. Corpus attribute values: cedilla 72, right 20, top_2 9, top_1 4, top.alt 4."
guesses = [
  "The component's anchor attribute is matched by its plain name, the part before the first underscore or period, against the mark's underscore anchor; the target is the attribute's anchor, else for a numbered name (top_2) the plain anchor of that base, else the plain anchor; a ligature with a mark set to top_1 after its second base in the reference app settles it.",
]

[[behavior]]
id = "components.anchorMenuOnlyWhenChoiceExists"
area = "components"
milestone = "M6"
summary = "The anchor chooser in the component Info box is hidden unless the selected attached component has more than one anchor it could attach to."
ref = "Reusing Shapes › Components › Anchors"
status = "handbook"

[[behavior]]
id = "components.ligatureNumberedAnchors"
area = "components"
milestone = "M6"
summary = "In a composite whose glyph category is Ligature, the anchors propagated from each base component are numbered by base: top from the first base becomes top_1, from the second top_2, and an anchor already numbered is shifted by the number of bases before it. A later component whose anchor attribute is a numbered name (top_2) attaches to that numbered anchor. The handbook documents only the caret_N anchors of ligatures; under its alternative-anchor rule top_1 and top_2 are alternatives of top, so the anchor menu offers them."
ref = "fontc fontir/src/propagate_anchors.rs (ligature numbering, component anchor attribute); Reusing Shapes › Components › Anchors (alternative anchors)"
status = "docs"
notes = "Rewritten by the M6 planning pass from a recalled row: the oracles number ligature anchors this way (probe f_f gave top_1 and top_2; f_f with an acutecomb whose anchor attribute is top_2 attached it there). fontc 1.0.0 `fontir/src/propagate_anchors.rs` (Apache-2.0; glyphsLib 6.15.0 `builder/transformations/propagate_anchors.py` is a port of it), checked by the M6 planning pass on a probe source built with fontc and fontmake 3.12.1, which gave identical anchors. The owner's answer to M6 plan § 7 question 7 (b): FontCraft's propagation is written from the handbook and from the oracles' outputs observed as a black box, with the plan's propagation measure (equal to glyphsLib's output on every corpus glyph and master layer) as its specification. Neither oracle's propagation code is read or ported: both derive from the reference app's source (docs/references.md). M6.1, observed in glyphsLib's output: a component counts as as many bases as its own components do; a component glyph without them counts 0 when it is a Mark, otherwise by its anchors: a ligature 1 (0 with an underscore anchor), any other glyph the largest of 1 per unnumbered name (none with an underscore anchor or for names starting with #), N for X_N and N+1 for caret_N. Components that count 0 keep their names; underscore, entry and exit names are never numbered, and X_text becomes X_k."

[[behavior]]
id = "components.autoAlignDefaultOnWhenComponentsOnly"
area = "components"
milestone = "M6"
summary = "Automatic alignment is on by default for a glyph layer whose shapes are all components. It keeps both the component positions and the composite's metrics tied to the base glyphs, so a sidebearing change in U flows to every composite built on U."
ref = "Reusing Shapes › Components › Automatic Alignment"
status = "handbook"
notes = "Documented, not yet observed. The file format stores alignment per component as a number: -1 off, 0 decided by the layer (this rule and components.pathOnLayerDisablesAutoAlign), 1 forced on whatever the layer holds, 3 horizontal only (GlyphsSDK file-format specification v3, `GSComponentAlignment`, Apache-2.0). The model reads it as `Alignment` (M1). Positions are stored already aligned, so a file opens with the reference's placement."
guesses = [
  "A component that is not aligned keeps its stored position but still counts: its anchors serve the marks after it and, as a base, it moves the next base to follow its stored place; a composite with one disabled base among aligned ones in the reference app settles it.",
]

