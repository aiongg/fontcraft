[[behavior]]
id = "components.verticalFlipSwapsTopBottomAnchors"
area = "components"
milestone = "M6"
summary = "Mirroring a component top-to-bottom exchanges the roles of its top and bottom anchors, so the anchor that ends up above still acts as the top one and the one below as the bottom one. A flipped top mark can therefore attach as a bottom mark (gcommaaccent from g and a flipped commaaccentcomb)."
ref = "Reusing Shapes › Components › Editing Components; Palette › Transformations"
status = "handbook"
notes = "Documented, not yet observed. Both oracles swap anchor names when they propagate through a transformed component: a negative vertical scale swaps top and bottom in the name, a negative horizontal scale swaps left and right and entry and exit, and a 180° rotation does both (fontc `get_xy_rotation`). FontCraft uses the same rule for alignment, so a suffixed name (top_viet) swaps too. The owner's answer to M6 plan § 7 question 7 (b): FontCraft's propagation is written from the handbook and from the oracles' outputs observed as a black box, with the plan's propagation measure (equal to glyphsLib's output on every corpus glyph and master layer) as its specification. Neither oracle's propagation code is read or ported: both derive from the reference app's source (docs/references.md). M6.1, observed in glyphsLib's output on 2,080 matrices: for rotated and sheared transforms an axis counts as flipped when the diagonal entry of M·R(−θ) is negative, θ being the angle of the transformed x axis, and a transform whose x axis points exactly left swaps both; the names are replaced by text (stop becomes sbottom), bottom checked before top, left before right and exit before entry."

