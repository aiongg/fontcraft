# =====================================================================================
# Brushes
# =====================================================================================

[[behavior]]
id = "brush.glyphNaming"
area = "components"
milestone = "M6"
summary = "A glyph is a brush glyph when its name starts with _brush. followed by any name (_brush.arrow). It must contain exactly one closed path plus two anchors, start and end; several closed shapes have to be merged into one with Remove Overlap first."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"
notes = "Neither oracle supports this hint type and no corpus source uses it (M6 planning pass); its geometry has no written source. M6 plan § 7, question 4 decides whether M6 builds it."

[[behavior]]
id = "brush.startEndAnchors"
area = "components"
milestone = "M6"
summary = "Glyph › Set Anchors (Cmd+U) places a brush glyph's start and end anchors at the left and right of the layer. They normally sit on the baseline or at one equal distance from it."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"

[[behavior]]
id = "brush.stretchZoneBetweenAnchors"
area = "components"
milestone = "M6"
summary = "Only the part of the brush outline lying between the start and end anchors stretches and bends to follow the host segment. Outline before start and after end keeps its shape, which is how fixed ends such as an arrowhead are made."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"

[[behavior]]
id = "brush.bendingNeedsHandles"
area = "components"
milestone = "M6"
summary = "A segment of the brush outline bends along a curved host segment only if it is a curve segment with handles; straight line segments stay straight. Handles are added to a line segment by Option-clicking it."
ref = "Reusing Shapes › Brushes › Creating Brush Glyphs"
status = "handbook"

[[behavior]]
id = "brush.expandsSegments"
area = "components"
milestone = "M6"
summary = "A brush turns a host path segment, straight or curved, into the brush's closed outline laid along it. It works on any segment but is intended mainly for open paths, most often an open path of a single segment."
ref = "Reusing Shapes › Brushes"
status = "handbook"

[[command]]
id = "brush.add"
label = "Add Brush"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, segments?: [{path: index, segment: index}], nodes?: [{path: index, node: index}], brush: name}"
area = "components"
milestone = "M6"
summary = "Attaches a brush to every selected segment. If nodes are selected in place of segments, brushes are added so that each selected node is the end node of a new brush. In the UI it is a context-menu item that opens a picker listing only brush glyphs; Return inserts the highlighted one."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

[[command]]
id = "brush.decompose"
label = "Decompose Brush"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, brushes?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that replaces a brush with the outline it produces and removes the brush."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

[[command]]
id = "brush.setGlyph"
label = "Replace Brush"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, brushes?: [indices], brush: name}"
area = "components"
milestone = "M6"
summary = "Swaps the brush glyph used by an attached brush; in the UI by clicking the component name in its Info box."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

[[command]]
id = "brush.editGlyph"
label = "Edit Brush Glyph"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph?: name, layer?: id, brush: index}"
area = "components"
milestone = "M6"
summary = "The arrow button of the brush Info box: adds the brush glyph to the Edit View text and activates it."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

[[panel]]
id = "infoBox.brush"
label = "Brush Info box"
location = "inspector"
controls = ["component name (click to replace with another brush glyph)", "arrow button: open the brush glyph in Edit View"]
area = "components"
milestone = "M6"
summary = "Shown for a selected brush when View › Show Info is on."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

[[panel]]
id = "dialog.brushPicker"
label = "Brush glyph picker"
location = "dialog"
controls = ["search field", "list restricted to brush glyphs", "Return inserts the highlighted glyph"]
area = "components"
milestone = "M6"
summary = "Glyph picker opened by Add Brush."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

[[behavior]]
id = "brush.highlightAndSelection"
area = "components"
milestone = "M6"
summary = "A brush is tinted with a faint blue background in Edit View. Clicking on the brush's outline selects it, Shift-click selects several, Delete removes the selected brushes."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

[[behavior]]
id = "brush.copyPasteOntoSegments"
area = "components"
milestone = "M6"
summary = "The standard Copy and Paste commands carry a selected brush over to other segments that are selected."
ref = "Reusing Shapes › Brushes › Using Brushes"
status = "handbook"

# =====================================================================================
# Pixel tool and pixel fonts
# =====================================================================================

[[tool]]
id = "pixel"
label = "Pixel"
shortcut = "X"
group = "pencil"
gestures = [
  "click on an empty grid cell: add a component of the glyph named pixel in that cell",
  "click on a cell that already holds a pixel: remove that pixel",
  "drag starting on an empty cell: add a pixel in every cell the pointer crosses",
  "drag starting on an existing pixel: remove the pixels in every cell the pointer crosses",
  "click when the font has no glyph named pixel: show the offer to add it",
]
area = "drawing"
milestone = "M6"
summary = "Paints glyphs out of pixel components snapped to the font grid, for pixel fonts and pixel symbols. Shortcut X; Shift+B switches to it while the Pencil tool is active, from which we take it that the two share a toolbar button (the group value is that reading, not a stated fact). Needs a grid spacing of 2 or more."
ref = "Reusing Shapes › Pixel Tool"
status = "handbook"

[[command]]
id = "pixel.addPixelGlyph"
label = "Add Pixel Glyph"
menu = []
shortcut = ""
kind = "engine"
params = "{size?: number}"
area = "drawing"
milestone = "M6"
summary = "Creates the glyph named pixel containing a square whose side equals the font's grid spacing. Run from the Add button of the prompt the Pixel tool shows when the glyph is missing."
ref = "Reusing Shapes › Pixel Tool › Setup"
status = "handbook"

[[command]]
id = "pixel.setPixels"
label = "Set Pixels"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, cells: [[column, row]], mode: add | remove | toggle}"
area = "drawing"
milestone = "M6"
summary = "Headless form of painting with the Pixel tool: adds, removes or toggles pixel components at grid cells given in grid units. The cell addressing is our design; the handbook describes only the mouse gestures."
ref = "Reusing Shapes › Pixel Tool › Drawing Pixels"
status = "inferred"
notes = "Our own headless form of the tool."
guesses = [
  "A pixel sits at the cell's lower left corner, at multiples of the grid spacing from the origin, and the tool finds an existing pixel by its exact offset; the reference app settles it.",
]
own = true

[[panel]]
id = "dialog.addPixelGlyph"
label = "Add pixel glyph prompt"
location = "dialog"
controls = ["Add button"]
area = "drawing"
milestone = "M6"
summary = "Shown on the first click with the Pixel tool in a font that has no glyph named pixel; Add creates the default square pixel glyph. The handbook names only the Add button."
ref = "Reusing Shapes › Pixel Tool › Setup"
status = "handbook"

[[behavior]]
id = "pixel.requiresGridSpacingTwoOrMore"
area = "drawing"
milestone = "M6"
summary = "The Pixel tool works only when the font's Grid Spacing (Font Info › Other) is 2 or greater; the grid spacing is the pixel pitch."
ref = "Reusing Shapes › Pixel Tool › Setup"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "With a grid spacing below 2 a click of the Pixel tool shows a message naming Font Info › Other › Grid Spacing and changes nothing; the reference app settles it.",
]

[[behavior]]
id = "pixel.usesGlyphNamedPixel"
area = "drawing"
milestone = "M6"
summary = "Every pixel the tool paints is a component referencing the glyph named exactly pixel, so redrawing that one glyph restyles the whole font."
ref = "Reusing Shapes › Pixel Tool › Setup"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Pixel components are written with alignment off (-1), since a layer of components only would otherwise be aligned automatically; a pixel glyph saved by the reference app settles it.",
  "The pixel glyph exports like any glyph whose name has no underscore, and pixel components export as components (TrueType) or outlines (CFF) by the usual rules; a pixel font exported by the reference app settles it.",
]

[[behavior]]
id = "pixel.defaultShapeIsGridSquare"
area = "drawing"
milestone = "M6"
summary = "The automatically created pixel glyph is a square with sides equal to the grid spacing in force when it is created."
ref = "Reusing Shapes › Pixel Tool › Setup"
status = "handbook"

[[behavior]]
id = "pixel.customShape"
area = "drawing"
milestone = "M6"
summary = "The pixel glyph may hold any shape (an x-mark for a stitched look). To draw detail finer than one pixel, lower the grid spacing temporarily (1 is the font default) and raise it again before painting with the Pixel tool."
ref = "Reusing Shapes › Pixel Tool › Pixel Shape"
status = "handbook"
