[[panel]]
id = "palette.smartComponent"
label = "Smart component settings (Palette)"
location = "palette"
controls = ["same per-property slider, number field and 0/1 checkbox as the Smart Component settings dialog"]
area = "components"
milestone = "M6"
summary = "The same per-instance controls shown at the bottom of the Palette. They are present only while the Palette is open, View › Show Info is checked and a smart component is selected."
ref = "Reusing Shapes › Smart Components › Using Smart Components"
status = "handbook"

[[behavior]]
id = "smart.badgeInInfoBox"
area = "components"
milestone = "M6"
summary = "The Info box of a smart component shows a Smart badge that marks it as smart and opens its settings when clicked."
ref = "Reusing Shapes › Smart Components › Using Smart Components"
status = "handbook"

[[behavior]]
id = "smart.propertyNamesFree"
area = "components"
milestone = "M6"
summary = "Property names are arbitrary and need not match layer names or font axis names. Only the exact names Width and Height (capitalised) carry extra meaning."
ref = "Reusing Shapes › Smart Components › Smart Glyph Properties Settings"
status = "handbook"

[[behavior]]
id = "smart.propertyRangeRules"
area = "components"
milestone = "M6"
summary = "A property range may be any pair of numbers with minimum strictly below maximum, negatives included; the default is 0 to 100. For unit-like properties the handbook suggests using real measurements as the range ends (Width 200 to 600 when the shape is drawn 200 and 600 units wide)."
ref = "Reusing Shapes › Smart Components › Smart Glyph Properties Settings"
status = "handbook"

[[behavior]]
id = "smart.valuesExtrapolate"
area = "components"
milestone = "M6"
summary = "Component values outside a property's range are legal and extrapolate the interpolation linearly past the pole layers (Width 150 or 700 on a 200 to 600 range). The slider is limited to the range; only the number field reaches beyond it."
ref = "Reusing Shapes › Smart Components › Smart Glyph Properties Settings"
status = "handbook"

[[behavior]]
id = "smart.zeroOneRangeIsToggle"
area = "components"
milestone = "M6"
summary = "A property with minimum 0 and maximum 1 is treated as an on/off switch: the component settings show a checkbox for it in place of a slider."
ref = "Reusing Shapes › Smart Components › Using Smart Components"
status = "handbook"

[[behavior]]
id = "smart.cornerLayersInferred"
area = "components"
milestone = "M6"
summary = "Layers are not needed at every combination of extremes. With N properties, the layer at all minimums plus one layer per property at its maximum suffice; shapes for combined extremes are computed by adding the per-property differences. A layer at a combined extreme is optional and, when present, overrides the computed shape."
ref = "Reusing Shapes › Smart Components › Smart Glyph Layers Settings"
status = "handbook"
notes = "Documented, not yet observed. FontCraft draws smart components with glyphsLib's model (`model/smart.rs`, ported in M2): the component master's first pole layer is the default location, every other pole layer sits at -1 or 1 on each property where its pole differs, and a variation model gives the outline, so a missing corner of the property space is the sum of the per-property differences. fontmake's output is the oracle (M6 plan § 5)."

[[behavior]]
id = "smart.widthHeightFollowBoundingBox"
area = "components"
milestone = "M6"
summary = "With View › Show Bounding Box on, dragging a selected smart component's bounding box horizontally changes its property named Width and dragging vertically changes Height. A smart component with neither property cannot be resized through the bounding box at all."
ref = "Reusing Shapes › Smart Components › Width & Height Properties"
status = "handbook"

[[behavior]]
id = "smart.handlesFromPropertyAnchors"
area = "components"
milestone = "M6"
summary = "An anchor whose name equals a property name exactly (case included), present on every layer of the smart glyph and moved on the layers that affect that property, becomes a gray drag handle on selected components; dragging it changes that property's value. Properties without such anchors simply get no handle."
ref = "Reusing Shapes › Smart Components › Smart Handles"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Dragging a handle sets the value whose interpolated anchor position is nearest the pointer, found by projecting the pointer on the line between the anchor's positions at the property's two poles, with no clamp; dragging a handle in the reference app settles it.",
]

# =====================================================================================
# Corner components
# =====================================================================================

[[behavior]]
id = "corner.glyphNaming"
area = "components"
milestone = "M6"
summary = "A glyph is a corner glyph when its name starts with _corner. followed by any name (_corner.serif). It holds an open path lying on both sides of the layer origin."
ref = "Reusing Shapes › Corner Components › Creating Corner Glyphs"
status = "handbook"
notes = "Documented, not yet observed. Both oracles apply corner components (the Corner hint type) when they build: glyphsLib's `cornerComponents` filter and fontc's `corner_components.rs`, both Apache-2.0; FontCraft ports fontc's. Corpus: 29 corner hints in 3 sources."

[[behavior]]
id = "corner.originPoint"
area = "components"
milestone = "M6"
summary = "The reference point of a corner glyph is the layer origin (0, 0), unless the layer has an anchor named origin, whose position then replaces it."
ref = "Reusing Shapes › Corner Components › Creating Corner Glyphs"
status = "handbook"

[[behavior]]
id = "corner.pathDirection"
area = "components"
milestone = "M6"
summary = "The open path must run in the direction it would have as part of the host outline. Normally its start node shares the X or the Y coordinate of the origin, and the position of its end node relative to the origin decides which way the corner grows out of the stem; a path drawn the wrong way round makes the corner grow in the wrong direction and is fixed by reversing the contour."
ref = "Reusing Shapes › Corner Components › Creating Corner Glyphs"
status = "handbook"
notes = "Documented, not yet observed. fontc decides the side from the order of the open path's nodes, as the handbook describes."

[[command]]
id = "cornerComponent.add"
label = "Add Corner Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, nodes?: [{path: index, node: index}], extraNodes?: [{x, y}], corner: name}"
area = "components"
milestone = "M6"
summary = "Attaches a corner component to each selected node, or to an extra node at a path intersection. In the UI it is a context-menu item that opens a glyph picker listing corner glyphs; Return inserts the highlighted one."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[command]]
id = "cornerComponent.decompose"
label = "Decompose Corner"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, corners?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that bakes a corner component into the host path: the fitted corner outline replaces the node and the component is removed."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[command]]
id = "cornerComponent.setGlyph"
label = "Replace Corner Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, corners?: [indices], corner: name}"
area = "components"
milestone = "M6"
summary = "Swaps the corner glyph an attached corner component uses, keeping its node, scale and alignment. In the UI: click the component name in its Info box and pick another."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[command]]
id = "cornerComponent.setScale"
label = "Set Corner Scale"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, corners?: [indices], scaleX?: percent, scaleY?: percent}"
area = "components"
milestone = "M6"
summary = "Sets the horizontal and vertical scale of a corner component in percent. A negative value mirrors the corner on that axis, so one serif glyph serves left and right or bottom and top."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[command]]
id = "cornerComponent.setAlignment"
label = "Set Corner Alignment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, corners?: [indices], mode: left | right | both | none}"
area = "components"
milestone = "M6"
summary = "Chooses how a corner adapts to a diagonal stem. left: the start node follows the diagonal and the end node stays; right: the end node follows and the start node stays; both: a blend of the two; none: neither end is adjusted."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"
notes = "Documented, not yet observed. fontc's `glyphs-reader/src/corner_components.rs` (a port of glyphsLib's `filters/cornerComponents.py`, both Apache-2.0) rotates the corner by the hint's alignment: left aligns to the outgoing segment, right to the incoming one, both to their mean angle, and none leaves it unrotated (fontc's `Alignment` names left and right as the reference does); FontCraft ports it, and the fontmake and fontc builds of the 3 corpus sources with corner hints are the oracle (M6 plan § 5)."

[[command]]
id = "cornerComponent.editGlyph"
label = "Edit Corner Glyph"
menu = []
shortcut = ""
kind = "ui"
params = "{glyph?: name, layer?: id, corner: index}"
area = "components"
milestone = "M6"
summary = "The arrow button of the corner Info box: adds the corner glyph to the Edit View text and activates it."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[panel]]
id = "infoBox.cornerComponent"
label = "Corner component Info box"
location = "inspector"
controls = [
  "component name (click to replace with another corner glyph)",
  "arrow button: open the corner glyph in Edit View",
  "horizontal scale field",
  "vertical scale field",
  "alignment mode buttons: left arrow, right arrow, left-right arrow, x-mark",
]
area = "components"
milestone = "M6"
summary = "Shown for a selected corner component when View › Show Info is on."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[panel]]
id = "dialog.cornerPicker"
label = "Corner glyph picker"
location = "dialog"
controls = ["search field", "list of corner glyphs", "Return inserts the highlighted glyph"]
area = "components"
milestone = "M6"
summary = "Glyph picker opened by Add Corner Component, showing the font's corner glyphs."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[behavior]]
id = "corner.highlightAndSelection"
area = "components"
milestone = "M6"
summary = "In Edit View a corner component is tinted with a faint blue background. A click selects it, Shift-click extends the selection to several corners, and Delete removes the selected ones."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[behavior]]
id = "corner.copyPasteOntoNodes"
area = "components"
milestone = "M6"
summary = "A selected corner component can be copied with Edit › Copy and, with other nodes selected, pasted onto them with Edit › Paste, giving each node the same corner."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"
notes = "Documented, not yet observed."
guesses = [
  "Pasting a corner, cap, segment or brush onto a selection of the wrong kind (a corner with a segment selected, a cap on nodes that are not neighbours) is refused with a message and nothing changes; the reference app settles it.",
]

[[behavior]]
id = "corner.mirrorViaPalette"
area = "components"
milestone = "M6"
summary = "The Palette's mirror buttons flip selected corner components, equivalent to negating the matching scale; a left corner becomes a right one and the reverse."
ref = "Reusing Shapes › Corner Components › Using Corner Components; Palette › Transformations"
status = "handbook"

[[behavior]]
id = "corner.alignmentTypicalUse"
area = "components"
milestone = "M6"
summary = "Typical alignment choices on diagonals: left for serifs at the bottom left or top right, right for serifs at the bottom right or top left, both for ink traps and similar notches."
ref = "Reusing Shapes › Corner Components › Using Corner Components"
status = "handbook"

[[behavior]]
id = "corner.entryAnchor"
area = "components"
milestone = "M6"
summary = "The entry point, where the stem runs into the corner, defaults to the layer origin. An anchor named left (named right when the open path faces right) relocates it; the anchor must lie on the line through the origin and the path's start node. Moving it from the start node toward the baseline lengthens the corner on the obtuse side of a diagonal and shortens it on the acute side; moving it the other way does the opposite."
ref = "Reusing Shapes › Corner Components › Adjusting the Entry Point of a Corner"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle uses the left and right anchors yet (fontc reads them and marks them unused), so sources that have them compile without the shift in both."
guesses = [
  "The entry anchor shifts the corner along the line through the origin and the start node by the anchor's distance from the origin before the corner is fitted, and the host segment is trimmed at the shifted point; a corner glyph with a left anchor on a diagonal stem in the reference app settles it.",
]

[[behavior]]
id = "corner.exitAnchor"
area = "components"
milestone = "M6"
summary = "The exit point, where the outline leaves the corner back into the host path, defaults to the open path's end node. An anchor named right (left for a right-facing corner) replaces the end node as exit position, so the end node itself may sit above or below the baseline, as for cupped serifs."
ref = "Reusing Shapes › Corner Components › Adjusting the Exit Point of a Corner"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle uses it yet."
guesses = [
  "The outline leaves the corner at the exit anchor's fitted position and joins the host's outgoing segment where that segment is nearest to it; a cupped serif in the reference app settles it.",
]

[[behavior]]
id = "corner.scaleStretchesByDefault"
area = "components"
milestone = "M6"
summary = "Without further setup, scaling a corner component stretches its outline geometrically."
ref = "Reusing Shapes › Corner Components › Adjusting the Width and Height"
status = "handbook"
notes = "Documented, not yet observed. Both oracles scale the corner by the hint's scale before fitting it."

[[behavior]]
id = "corner.scaleInterpolatesWithIntermediateLayers"
area = "components"
milestone = "M6"
summary = "If the corner glyph has Intermediate layers tagged with a Width and Height in percent (for instance 150 % by 100 %), scaling interpolates between the main layer and those layers. An axis with no layer away from 100 % still stretches: with only a 150 % width layer, a 125 % width is interpolated while any height change stretches."
ref = "Reusing Shapes › Corner Components › Adjusting the Width and Height"
status = "handbook"
notes = "Documented, not yet observed. Neither oracle handles these layers; the file format does not say how the Width and Height percentages are stored."
guesses = [
  "The percentages are read from the intermediate layer's name (for example `Width 150 Height 100`) and interpolated linearly per axis, with scales beyond the layers extrapolated and negative scales mirrored after interpolation; a corner glyph saved by the reference app with such a layer settles it.",
]

[[behavior]]
id = "corner.closedPathsAllowed"
area = "components"
milestone = "M6"
summary = "A corner glyph may hold closed paths besides its single open path; they are carried along with the corner as extra shapes inside or outside it. The open path has to be the first shape of the layer (reorder with Filter › Shape Order)."
ref = "Reusing Shapes › Corner Components › Closed Paths in Corners"
status = "handbook"

[[behavior]]
id = "corner.extraNodesAcceptCorners"
area = "components"
milestone = "M6"
summary = "Extra nodes, the points where overlapping paths intersect (displayed with View › Show Nodes › Extra Nodes), can take corner components through the same context-menu item. This gives smooth joins or ink traps at stem and crossbar crossings."
ref = "Reusing Shapes › Corner Components › Extra Nodes"
status = "handbook"

# =====================================================================================
# Cap components
# =====================================================================================

[[behavior]]
id = "cap.glyphNaming"
area = "components"
milestone = "M6"
summary = "A glyph is a cap glyph when its name starts with _cap. followed by any name (_cap.flag)."
ref = "Reusing Shapes › Cap Components › Creating Cap Glyphs"
status = "handbook"
notes = "Neither oracle supports this hint type and no corpus source uses it (M6 planning pass); its geometry has no written source. M6 plan § 7, question 4 decides whether M6 builds it."

[[behavior]]
id = "cap.attachesToTwoAdjacentNodes"
area = "components"
milestone = "M6"
summary = "A cap component is bound to two nodes that are neighbours on the same path (a corner is bound to one). It models stroke endings: spurs, terminals, flag serifs."
ref = "Reusing Shapes › Cap Components"
status = "handbook"

[[behavior]]
id = "cap.originAnchorSetup"
area = "components"
milestone = "M6"
summary = "Simple anchor setup for a cap glyph: a single anchor named origin gives the spot in the cap shape on which the first stem node of the pair lands."
ref = "Reusing Shapes › Cap Components › Creating Cap Glyphs"
status = "handbook"

[[behavior]]
id = "cap.node1Node2AnchorSetup"
area = "components"
milestone = "M6"
summary = "Flexible anchor setup for a cap glyph: two anchors named node1 and node2 stand for the two stem nodes, so both the position and the scaling of the cap are controlled relative to both nodes. This lets one cap fit stems of different widths."
ref = "Reusing Shapes › Cap Components › Creating Cap Glyphs"
status = "handbook"

[[command]]
id = "capComponent.add"
label = "Add Cap Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, path?: index, nodes?: [index, index], cap: name}"
area = "components"
milestone = "M6"
summary = "Attaches a cap component to two selected adjacent nodes of one path. In the UI it is a context-menu item that opens a glyph picker listing only cap glyphs; Return inserts the highlighted one."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[command]]
id = "capComponent.decompose"
label = "Decompose Cap"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, caps?: [indices]}"
area = "components"
milestone = "M6"
summary = "Context-menu item that bakes a cap component into the host path and removes the component."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[command]]
id = "capComponent.setFit"
label = "Fit Cap to Stroke"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, caps?: [indices], fit: bool}"
area = "components"
milestone = "M6"
summary = "Toggles the Fit option of a cap component. When on, the cap is resized automatically to the width of the stroke end it sits on, that is the distance between its two nodes."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[command]]
id = "capComponent.setGlyph"
label = "Replace Cap Component"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, caps?: [indices], cap: name}"
area = "components"
milestone = "M6"
summary = "Swaps the cap glyph used by an attached cap component. The handbook says caps are replaced the same way as corners, that is through the name in the Info box."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[command]]
id = "capComponent.setScale"
label = "Set Cap Scale"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, caps?: [indices], scaleX?: percent, scaleY?: percent}"
area = "components"
milestone = "M6"
summary = "Sets the horizontal and vertical scale of a cap component; negative values flip it. The handbook states only that caps transform like corners, so the field set is taken from the corner Info box."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[command]]
id = "capComponent.setAlignment"
label = "Set Cap Alignment"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph?: name, layer?: id, caps?: [indices], mode: left | right | both | none}"
area = "components"
milestone = "M6"
summary = "Sets the alignment mode of a cap component using the same four modes as corners. The handbook says caps align like corners without describing what each mode does on a two-node attachment."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[panel]]
id = "infoBox.capComponent"
label = "Cap component Info box"
location = "inspector"
controls = [
  "Fit checkbox",
  "component name (replace), scale fields and alignment modes as in the corner Info box",
]
area = "components"
milestone = "M6"
summary = "Shown for a selected cap component when View › Show Info is on. Only the Fit checkbox is described explicitly; the remaining controls follow from the statement that caps are replaced, transformed and aligned like corners."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[panel]]
id = "dialog.capPicker"
label = "Cap glyph picker"
location = "dialog"
controls = ["search field", "list restricted to cap glyphs", "Return inserts the highlighted glyph"]
area = "components"
milestone = "M6"
summary = "Glyph picker opened by Add Cap Component."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[behavior]]
id = "cap.highlightAndSelection"
area = "components"
milestone = "M6"
summary = "A cap component is tinted with a faint blue background in Edit View. Click selects, Shift-click selects several, Delete removes the selected caps."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

[[behavior]]
id = "cap.copyPasteOntoSegments"
area = "components"
milestone = "M6"
summary = "A selected cap component can be copied and then pasted onto other selected segments (node pairs) with the standard Copy and Paste commands."
ref = "Reusing Shapes › Cap Components › Using Cap Components"
status = "handbook"

# =====================================================================================
# Segment components
# =====================================================================================

[[behavior]]
id = "segment.glyphNaming"
area = "components"
milestone = "M6"
summary = "A glyph is a segment glyph when its name starts with _segment. followed by any name (_segment.stem). Its contents are a single open path laid on the baseline plus the anchors start and end."
ref = "Reusing Shapes › Segment Components › Creating Segment Glyphs"
status = "handbook"
notes = "Neither oracle supports this hint type and no corpus source uses it (M6 planning pass); its geometry has no written source. M6 plan § 7, question 4 decides whether M6 builds it."

[[behavior]]
id = "segment.startEndAnchors"
area = "components"
milestone = "M6"
summary = "The start and end anchors belong on the first and last node of the open path; Glyph › Set Anchors (Cmd+U) puts them there. If they sit elsewhere, the fitted component will not span the full length of the host segment. The path's two end nodes should both be on the baseline or both at one equal distance from it."
ref = "Reusing Shapes › Segment Components › Creating Segment Glyphs"
status = "handbook"

[[behavior]]
id = "segment.appliesToStraightAndCurved"
area = "components"
milestone = "M6"
summary = "A segment component replaces one straight or curved host segment with its open path, which may be a single bent segment or a long path with many nodes."
ref = "Reusing Shapes › Segment Components"
status = "handbook"

[[behavior]]
id = "segment.bendingAddsNoNodes"
area = "components"
milestone = "M6"
summary = "Bending a segment component along a curved host segment moves its existing points only and never inserts nodes. Fidelity to the curve can suffer, but the node count is identical in every master, which keeps the result interpolatable."
ref = "Reusing Shapes › Segment Components"
status = "handbook"

