[[table]]
tag = "CPAL"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M11"
summary = "Colour palettes referenced by COLR and SVG. Written only when the source defines at least one colour."
ref = "fontc fontbe/src/cpal.rs; write-fonts src/tables/cpal.rs"
status = "docs"

[[table]]
tag = "sbix"
flavour = ["ttf", "variable-ttf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M11"
summary = "Bitmap strikes holding PNG or other image data per glyph and ppem. write-fonts has Sbix, Strike and GlyphData types; fontc does not build the table, so strike selection, origin offsets and the mapping from placed images are ours."
