# ---------------------------------------------------------------------------------------------------
# Behaviours: pipeline and preflight
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.pipelineStages"
area = "compile"
milestone = "M2"
summary = "Compilation runs in fixed stages, each a function that reads only what earlier stages produced: master or instance preparation (the resolved projection of one master, or an instance at a master), preflight (component cycles refused, missing components dropped, non-exported glyphs inlined and removed, code point conflicts refused), final glyph order (.notdef first, drawn when absent, at most 65,535 glyphs), outline preparation (decompose, overlap removal, quadratic conversion, direction), per-table builders, layout compilation, variation tables, assembly with checksums, then container wrapping. Per-glyph stages can run in parallel, as in fontc's work graph. FontCraft orders glyphs before preparing outlines; fontc decides both in one step, with the same result. Layout, variations and containers are later milestones (M8, M9, M2.4)."
ref = "fontmake USAGE.md (Functional overview); fontc fontbe/src/orchestration.rs, fontir/src/glyph.rs; crates/compile (M2.1)"
status = "inferred"

[[behavior]]
id = "compile.filterOrder"
area = "compile"
milestone = "M2"
summary = "fontmake runs outline filters in this order: user pre-filters, explode colour layer glyphs, decompose components, flatten components, remove overlaps, cubic to quadratic, user post-filters. We keep the same relative order for the built-in steps."
ref = "fontmake USAGE.md (Included filters)"
status = "docs"

[[behavior]]
id = "compile.pruneMissingComponents"
area = "compile"
milestone = "M2"
summary = "A component that points at a glyph that does not exist is dropped with a warning and the build continues; this happens before any other glyph processing so one bad reference cannot cause its siblings to be decomposed. fontc does this to match fontmake."
ref = "fontc fontir/src/glyph.rs (prune_missing_components); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.nonExportGlyphs"
area = "compile"
milestone = "M2"
summary = "Glyphs marked not to export are removed from the final glyph order; any exported glyph that uses one as a component gets that component's outlines inlined first, so nothing references a glyph that is gone."
ref = "fontc fontir/src/glyph.rs (flatten_all_non_export_components, GlyphOrderWork); fontmake USAGE.md (--no-write-skipexportglyphs); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.interpolationCompatibility"
area = "compile"
milestone = "M9"
summary = "Before building a variable font every glyph is checked: all masters must use the same component sequence and path structures that convert to the same point counts; a glyph that fails stops the build with a per-glyph error. fontmake has --check-compatibility / --no-check-compatibility to run or skip the same check up front."
ref = "fontc fontbe/src/glyphs.rs (CheckedGlyph); fontmake Lib/fontmake/__main__.py"
status = "docs"

[[behavior]]
id = "compile.instanceInterpolation"
area = "compile"
milestone = "M9"
summary = "Static instances are produced by interpolating masters at the instance location before compiling. fontmake's default interpolator does not extrapolate outside the masters and does not support anisotropic locations; those need the optional MutatorMath path. Outline rounding at this stage is optional (--round-instances)."
ref = "fontmake USAGE.md (Options for instance generation)"
status = "docs"

[[behavior]]
id = "compile.instanceLayoutInterpolation"
area = "compile"
milestone = "M9"
summary = "fontmake's feature writers interpolate kerning and anchors for instances but not explicit pos statements in feature code; --interpolate-binary-layout builds master binaries and interpolates GPOS from them instead. Because we compile variable feature data once, instancing layout should come from the variable GPOS rather than from re-running writers."
ref = "fontmake USAGE.md (--interpolate-binary-layout)"
status = "docs"

[[behavior]]
id = "compile.expandFeatureIncludes"
area = "compile"
milestone = "M8"
summary = "Feature include() paths are resolved relative to the source file; fontmake needs --expand-features-to-instances or --fea-include-dir when instances are compiled from another directory. Our compiler always resolves includes against the original source location, so no flag is needed."
ref = "fontmake USAGE.md; fontmake Lib/fontmake/__main__.py (--fea-include-dir)"
status = "inferred"

# ---------------------------------------------------------------------------------------------------
# Behaviours: outline preparation
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.mixedGlyphsBecomeSimple"
area = "compile"
milestone = "M2"
summary = "A glyph with both contours and components cannot be stored in glyf. By default (fontc --prefer-simple-glyphs=true, and fontmake's DecomposeComponents for TTF) its components are converted to contours; with the preference off fontc instead moves the contours into a new glyph named <base>.<n> and makes the original a pure composite."
ref = "fontc fontc/src/args.rs, fontir/src/glyph.rs; fontmake USAGE.md (DecomposeComponents); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.otfDecomposesAllComponents"
area = "compile"
milestone = "M2"
summary = "For CFF outlines every component is decomposed, since CFF has no component mechanism; fontmake calls DecomposeComponents automatically for OTF output. The decomposed glyph keeps its own contours first, then each component's contours followed by those of its own components, depth first; a component under a mirroring transform has its contours reversed."
ref = "fontmake USAGE.md (Included filters); ufo2ft filters/decomposeComponents.py, util.py (decomposeCompositeGlyph); oracle runs against fontmake 3.12.1 (M2.3b)"
status = "observed"

[[behavior]]
id = "compile.inconsistentComponentsDecompose"
area = "compile"
milestone = "M9"
summary = "A composite whose component 2x2 transforms differ between masters is converted to a simple glyph, because gvar can vary component offsets but not their scale or rotation."
ref = "fontc fontir/src/glyph.rs (GlyphOrderWork: has_consistent_components)"
status = "docs"

[[behavior]]
id = "compile.overflowingComponentTransformDecompose"
area = "compile"
milestone = "M2"
summary = "A composite with a component transform value outside the F2Dot14 range of -2.0 to 2.0 is converted to a simple glyph instead of being clamped."
ref = "fontc fontir/src/glyph.rs (has_overflowing_component_transforms)"
status = "docs"

[[behavior]]
id = "compile.flattenNestedComponents"
area = "compile"
milestone = "M6"
summary = "Optional: components that are themselves composites are replaced by the simple glyphs they reference, with transforms combined, so composite depth is 1. Off by default in fontmake (-f / --flatten-components); in fontc the option is tri-state (omitted means the source's own setting)."
ref = "fontmake README.md (-f); fontc fontc/src/args.rs (--flatten-components), fontir/src/glyph.rs (flatten_glyph)"
status = "docs"

[[behavior]]
id = "compile.decomposeTransformedComponents"
area = "compile"
milestone = "M6"
summary = "Optional, off by default: any composite with a component whose 2x2 transform is not the identity is converted to contours (a mirrored or scaled component can rasterise and hint badly). When combined with flattening, transformed components are decomposed first and the rest flattened afterwards, which keeps more components."
ref = "fontc fontc/src/args.rs (--decompose-transformed-components), fontir/src/glyph.rs (apply_optional_transformations); fontmake USAGE.md (DecomposeTransformedComponents)"
status = "docs"

[[behavior]]
id = "compile.decomposeAllComponents"
area = "compile"
milestone = "M6"
summary = "Optional: decompose every composite, or the glyphs named by the source's decomposeComponents filter (all, an include list or an exclude list). Runs before the consistency checks and flattening, so a composite that referenced a decomposed glyph then sees a simple glyph."
ref = "fontc fontc/src/args.rs (--decompose-components), fontir/src/glyph.rs (decompose_components), fontir/src/ir/static_metadata.rs (FilterScope)"
status = "docs"

[[behavior]]
id = "compile.componentFlags"
area = "compile"
milestone = "M2"
summary = "Composite components are always written with ROUND_XY_TO_GRID set (fontc, citing ufo2ft's default). Offsets are rounded half-up to integers and transform values are rounded in double precision before conversion to F2Dot14."
ref = "fontc fontbe/src/glyphs.rs (create_component_ref_gid); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.useMyMetrics"
area = "compile"
milestone = "M2"
summary = "USE_MY_METRICS is set on the first component whose glyph has the same advance as the composite, an identity 2x2 and no x offset that survives rounding (y offset is allowed), and only in static fonts. In variable fonts it is never set automatically because composite and component advances may differ in other masters. fontmake exposes --auto-use-my-metrics / --no-auto-use-my-metrics with the same static-only default."
ref = "fontc fontbe/src/glyphs.rs (can_reuse_metrics, create_composite); fontmake Lib/fontmake/__main__.py; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.nonSpacingMarkWidth"
area = "compile"
milestone = "M2"
summary = "A .glyphs source's non-spacing marks (category Mark, subcategory Nonspacing) are compiled with advance 0; a UFO's advances are written as they are. The category and subcategory a glyph does not state come from the glyph database, as fontc and glyphsLib take them."
ref = "fontc glyphs2fontir/src/source.rs (process_layer), glyphs-reader font.rs (is_nonspacing_mark); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"
notes = "The glyph database part is built in M4.2 (compile::fill_glyph_data). A UFO that glyphsLib wrote stores a mark's width as 0 in the GLIF and the drawn width in the originalWidth lib key; the model reads the drawn width and compiles it, the oracles compile 0 (allow-listed for the two designspace_from_glyphs sources)."

[[behavior]]
id = "compile.compositeBounds"
area = "compile"
milestone = "M2"
summary = "A composite's bounding box is computed after all simple glyphs are built, by transforming each component's box; head's font box, hhea extents and side bearings depend on it, so the hmtx/hhea/maxp job waits for glyf."
ref = "fontc fontbe/src/glyphs.rs (compute_composite_bboxes), fontbe/src/metrics_and_limits.rs; runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.removeOverlapsStatic"
area = "compile"
milestone = "M2"
summary = "fontmake removes overlaps by default when building static fonts and skips it for interpolatable masters and variable fonts; --keep-overlaps turns it off and --overlaps-backend chooses booleanOperations (default) or pathops. fontc never removes overlaps and makeotf leaves it to a separate tool. We remove overlaps for static output by default using our own boolean engine and keep them for variable output."
ref = "fontmake USAGE.md (--keep-overlaps, --overlaps-backend), Lib/fontmake/font_project.py; fontc fontbe/src/glyphs.rs"
status = "docs"
notes = "M3.7: the outline stage runs fontcraft_pathops::remove_overlap on every glyph that has contours after decomposition, before cubic-to-quadratic conversion; ufo2ft's RemoveOverlapsFilter skips glyphs without contours the same way. Result points stay unrounded until the glyph is written, as in fontmake. The oracle compares the result with fontmake's (booleanOperations backend) by rendered coverage; see docs/spec/40-compile.md § 3.8 for the measures."
guesses = [
  "A composite glyph keeps its components at export, so components that overlap each other keep their overlaps, following fontmake; how the reference app exports such a glyph is not documented.",
]

[[behavior]]
id = "compile.overlapFlags"
area = "compile"
milestone = "M9"
summary = "write-fonts can set OVERLAP_SIMPLE (first point of the first contour) and OVERLAP_COMPOUND, but fontc's backend never sets either (no use of those fields in fontbe). Our choice: set them on glyphs of variable TrueType fonts, where overlaps are kept, and never on static fonts whose overlaps were removed."
ref = "write-fonts src/tables/glyf/simple.rs, glyf/composite.rs; fontc fontbe/src/glyphs.rs"
status = "inferred"

[[behavior]]
id = "compile.cu2quTolerance"
area = "compile"
milestone = "M2"
summary = "Cubic curves are approximated by quadratic splines with a maximum error of 0.001 em (one unit at 1000 units per em). fontTools cu2qu uses DEFAULT_MAX_ERR = 0.001, fontmake exposes it as -e / --conversion-error in em, and fontc computes units_per_em / 1000 and calls kurbo's cubics_to_quadratic_splines."
ref = "fonttools Lib/fontTools/cu2qu/ufo.py; fontmake USAGE.md (--conversion-error); fontc fontbe/src/glyphs.rs (cubics_to_quadratics); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.cu2quAcrossMasters"
area = "compile"
milestone = "M9"
summary = "For variable fonts each cubic segment is converted together with the matching segment of every other master, so all masters end up with the same number of quadratic points; a segment that cannot be converted compatibly is a hard failure for that glyph. Lines and existing quadratics pass through untouched."
ref = "fontc fontbe/src/glyphs.rs (cubics_to_quadratics); fontmake README.md (ttf-interpolatable)"
status = "docs"

[[behavior]]
id = "compile.ttfCurveModes"
area = "compile"
milestone = "M12"
summary = "fontmake --ttf-curves has four modes: cu2qu (default, everything quadratic), mixed (convert only when cheaper; needs draft glyf version 1), keep-quad and keep-cubic (no conversion). fontc always converts to quadratic. We ship cu2qu and keep-quad; the cubic-in-glyf modes wait for the format to be final."
ref = "fontmake Lib/fontmake/__main__.py (--ttf-curves), font_project.py (CurveConversion)"
status = "docs"

[[behavior]]
id = "compile.reverseContourDirection"
area = "compile"
milestone = "M2"
summary = "Sources are assumed to be drawn counter-clockwise (PostScript convention), so contours are reversed when writing TrueType outlines; --keep-direction (same name in fontmake and fontc) disables it. CFF output keeps the source direction. Composites are not touched."
ref = "fontmake USAGE.md (--keep-direction); fontc fontc/src/args.rs, fontbe/src/glyphs.rs (reverse_contour_direction); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.dropImpliedOnCurves"
area = "compile"
milestone = "M12"
summary = "Optional, off by default in fontmake: on-curve points lying exactly midway between two off-curve points are dropped from TrueType glyphs since the format implies them. Must be applied identically in all masters of a variable font."
ref = "fontmake Lib/fontmake/__main__.py (--drop-implied-oncurves)"
status = "docs"

[[behavior]]
id = "compile.rounding"
area = "compile"
milestone = "M2"
summary = "All font-unit values are rounded half up (OpenType rounding), not half to even. Master values such as point coordinates, anchors and kerning are rounded before deltas are computed, so instancing a variable font at a master location matches building that master as a static font."
ref = "fontc fontbe/src/glyphs.rs, fontbe/src/features.rs; write-fonts src/round.rs"
status = "docs"

[[behavior]]
id = "compile.cffRoundTolerance"
area = "compile"
milestone = "M2"
summary = "CFF charstring coordinates are rounded to integers by default; fontmake's --cff-round-tolerance defaults to 0.5 and a value of 0 disables rounding so fractional coordinates are kept. A tolerance between the two rounds a coordinate (half up) only when that moves it by no more than the tolerance. Points are rounded before they are made relative, and fractions are written as 16.16 fixed numbers."
ref = "fontmake USAGE.md (--cff-round-tolerance); fonttools misc/roundTools.py (roundFunc), pens/t2CharStringPen.py; crates/cff/crosscheck at tolerances 0, 0.3 and 0.5 (M2.3a)"
status = "observed"

[[behavior]]
id = "compile.glyphsOutlinePreSteps"
area = "compile"
milestone = "M6"
summary = "Two Glyphs-specific steps run before decomposition when the source asks for them: erase open corners and propagate anchors from components to composites. Anchor propagation must run before non-export components are flattened, because it reads the component references. fontc exposes both as tri-state flags; fontmake gets them through filters listed in the UFO lib (glyphsLib adds eraseOpenCorners there)."
ref = "fontc fontc/src/args.rs (--erase-open-corners, --propagate-anchors), fontir/src/glyph.rs; fontmake USAGE.md (Outline Filtering)"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: glyph order and names
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.notdefFirst"
area = "compile"
milestone = "M2"
summary = "Glyph id 0 is always .notdef: if the source has one elsewhere in the order it is moved to the front, and if it has none a glyph is generated."
ref = "fontc fontir/src/glyph.rs (ensure_notdef_exists_and_is_gid_0); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.notdefSynthesis"
area = "compile"
milestone = "M2"
summary = "The generated .notdef is a hollow rectangle: advance = half the em (rounded), stroke = 5 percent of the em (rounded), outer box from x = stroke to advance - stroke and from descender to ascender, inner box inset by one stroke, height = ascender - descender. In a variable font it gets extra masters only where ascender, descender or the typo ascender/descender differ from the default. makeotf instead offers -addn to replace .notdef with a built-in design matched to the font's weight and width."
ref = "fontc fontir/src/glyph.rs (synthesize_notdef, make_notdef_outline); AFDKO docs/MakeOTFUserGuide.md (-addn); runs of fontc 1.0.0 on the corpus (M2.1)"
status = "observed"

[[behavior]]
id = "compile.glyphOrder"
area = "compile"
milestone = "M2"
summary = "Glyph order is the source's explicit order restricted to glyphs that exist, followed by the remaining glyphs sorted by name, then .notdef forced to index 0 (fontc reading a UFO's public.glyphOrder). Glyphs created by the compiler are appended after the source glyphs: for Glyphs sources the bracket-layer and colour-layer glyphs go last together in sorted name order (fontc, citing ufo2ft), and a split-off contour glyph is added when it is created. FontCraft keeps the model's order as read and never re-sorts it (M2 plan § 3, question 14); only .notdef moves."
ref = "fontc ufo2fontir/src/source.rs (glyph_order), fontir/src/glyph.rs"
status = "docs"

[[behavior]]
id = "compile.glyphOrderMakeotf"
area = "compile"
milestone = "M12"
summary = "makeotf with -r or -ga orders glyphs differently: names in the CFF standard string list come first in that list's order, then glyphs in GlyphOrderAndAliasDB order, then anything else in source order. It cannot reorder a TrueType source. CID-keyed sources are always arranged in CID order. We offer this as an alternative ordering mode for AFDKO-style projects."
ref = "AFDKO docs/MakeOTFUserGuide.md (GlyphOrderAndAliasDB), docs/CIDKeyedUFOGuide.md"
status = "docs"

[[behavior]]
id = "compile.glyphCountLimit"
area = "compile"
milestone = "M2"
summary = "More than 65535 glyphs cannot be represented (maxp.numGlyphs and glyph ids are 16-bit; fontc simply unwraps the conversion). Preflight reports it as an error naming the count rather than failing later."
ref = "fontc fontbe/src/metrics_and_limits.rs"
status = "inferred"

[[behavior]]
id = "compile.productionNames"
area = "compile"
milestone = "M4"
summary = "By default glyphs are renamed to production names in the binary. fontmake: use the source's name map (public.postscriptNames); encoded glyphs without an entry become uniXXXX, unencoded ligatures are named from their components' production names, other unencoded glyphs keep their name; --no-production-names disables all renaming. fontc applies only the source's map (glyphs without an entry keep their name) and has the same flag."
ref = "fontmake USAGE.md (--no-production-names); fontc fontc/src/args.rs, fontbe/src/post.rs, ufo2fontir/src/source.rs"
status = "docs"
notes = "Moved from M2 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6). Built in M4.2 (crates/compile/src/names.rs): a glyph's production name is the one it stores, else the glyph database's (Resolved::apply_glyph_data, for the reference's format only); a UFO is renamed only through its public.postscriptNames, and one that maps no glyph is not renamed, as both oracles do. The Don't use Production Names parameter and Use Custom Naming (disablesNiceNames) keep the source names: the handbook gives them the same effect, while fontc and glyphsLib ignore disablesNiceNames (an allow-list entry for CornerComponents.glyphs). The oracle harness builds with production names on and compares the post table's names (post glyphName); every name FontCraft writes for the corpus's .glyphs and .glyphspackage sources equals fontc's (docs/plans/M4.md › M4.2 results)."
guesses = [
  "Use Custom Naming (disablesNiceNames) keeps the source names at export, as the handbook's Don't use Production Names entry says it has the same effect; the reference compilers ignore it. Settled by exporting a font with Use Custom Naming on from the reference app.",
]

[[behavior]]
id = "compile.productionNameSanitising"
area = "compile"
milestone = "M4"
summary = "Final names are stripped of every character outside A-Z, a-z, 0-9, period and underscore; a name that collides with an earlier one gets .1, .2 and so on appended. The stricter Adobe Glyph List rules (no leading digit or period, at most 63 characters) are not enforced by fontc; we enforce them as warnings."
ref = "fontc fontbe/src/post.rs"
status = "docs"
notes = "Moved from M2 by the M4 plan, which the owner accepted (docs/plans/M4.md § 7 question 6). Built in M4.2 (crates/compile/src/names.rs, ported from fontc fontbe/src/post.rs): font.compile and the CLI write the cleaned name and one warning that lists the changed names; a name that breaks the stricter rules is written with a warning. With production names off, a name post cannot hold becomes glyphNNNNN with a warning, as in M2. The app's File › Export refuses an invalid name instead (glyphName.invalidBlocksExport); the owner's decision (docs/plans/M4.md § 7 question 8)."
guesses = [
  "A name that is empty after cleaning, or longer than the 255 bytes post can store, becomes glyphNNNNN (by glyph id) with a warning; fontc would write the empty or long name. Settled only by a reference that writes such a font.",
]

[[behavior]]
id = "compile.goadbRenaming"
area = "compile"
milestone = "M12"
summary = "makeotf's GlyphOrderAndAliasDB has one glyph per line: final name, source name, optional Unicode override (uniXXXX or uXXXX[XX], uppercase hex only, comma-separated for several). Renaming and ordering apply only with -r or -ga; with -gf alone only the Unicode column is used; -gs additionally drops glyphs not listed. Source font and feature file must use the same names as each other."
ref = "AFDKO docs/MakeOTFUserGuide.md (GlyphOrderAndAliasDB, -ga, -gs, -gf)"
status = "docs"

[[behavior]]
id = "compile.unicodeFromGlyphNames"
area = "compile"
milestone = "M12"
summary = "makeotf assigns Unicode values to name-keyed glyphs in this order: the GOADB third column; else the Adobe Glyph List for New Fonts; else a uniXXXX / uXXXXXX glyph name; else none. It never assigns Private Use codes. The fontmake family instead takes codepoints from the source glyphs. We follow the source data and offer the makeotf lookup as an import-time fill-in."
ref = "AFDKO docs/MakeOTFUserGuide.md (GlyphOrderAndAliasDB rule 3); fontc fontbe/src/cmap.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: cmap and post
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.cmapSubtables"
area = "compile"
milestone = "M2"
summary = "Default cmap: a format 4 subtable for BMP characters referenced by both the Unicode (0,3) and Windows (3,1) records, plus a format 12 subtable referenced by (0,4) and (3,10) only if any character is above U+FFFF; records are ordered by platform then encoding. makeotf additionally writes a Macintosh platform subtable chosen by script heuristics (-cs/-cl override)."
ref = "write-fonts src/tables/cmap.rs (Cmap::from_mappings); AFDKO hotconv/map.cpp, docs/MakeOTFUserGuide.md"
status = "docs"

[[behavior]]
id = "compile.cmapConflict"
area = "compile"
milestone = "M2"
summary = "One codepoint mapped to two different glyphs is an error that names the codepoint and both glyphs (write-fonts names their ids; FontCraft names the glyphs, checked in preflight); identical duplicate mappings are merged silently. One glyph may carry several codepoints."
ref = "write-fonts src/tables/cmap.rs (CmapConflict)"
status = "docs"

[[behavior]]
id = "compile.cmapVariationSequences"
area = "compile"
milestone = "M2"
summary = "Unicode variation sequences produce a format 14 subtable at platform 0 encoding 5. A sequence whose glyph equals the base character's normal mapping is stored as a default UVS (ranges of consecutive codepoints, at most 256 per range); any other is a non-default UVS mapping. Sequences naming a missing glyph are skipped with a warning. makeotf reads them from a text file (-ci) of 'base selector; glyph' lines, or 'base selector; R-O; CID+n' for CID fonts."
ref = "fontc fontbe/src/cmap.rs; AFDKO docs/MakeOTFUserGuide.md (UVS file)"
status = "docs"

[[behavior]]
id = "compile.cmapLegacyOptions"
area = "compile"
milestone = "M12"
summary = "makeotf has two legacy cmap switches: -dbl double-maps a fixed list of glyphs (for example hyphen to U+002D and U+00AD, mu to U+00B5 and U+03BC) and -stubCmap4 writes a two-segment placeholder format 4 subtable for special-purpose fonts. Both are off by default and we expose them only in the AFDKO-compatible CLI."
ref = "AFDKO python/afdko/makeotf.py (-dbl, -stubCmap4)"
status = "docs"

[[behavior]]
id = "compile.postVersion"
area = "compile"
milestone = "M2"
summary = "Glyph names: fontc and fontmake write post 2.0 with names for TrueType fonts; fontmake (ufo2ft) and makeotf write 3.0 (no names) for CFF because CFF stores them; buildcff2vf writes 3.0 for CFF2 unless -k asks for format 2 names. Our defaults: 2.0 for TrueType and CFF2, 3.0 for CFF (the names go into the CFF charset), with an option to force 3.0 everywhere for size (not yet). maxp is version 0.5 (glyph count only) in a CFF font."
ref = "fontc fontbe/src/post.rs; ufo2ft outlineCompiler.py (setupTable_post, OutlineOTFCompiler.setupTable_maxp); AFDKO hotconv/post.cpp, python/afdko/buildcff2vf.py (-k), docs/CFF2_Support.md; oracle runs against fontmake 3.12.1 (M2.3b)"
status = "observed"

[[behavior]]
id = "compile.postFields"
area = "compile"
milestone = "M2"
summary = "post.italicAngle comes from the source's italic angle, underlinePosition and underlineThickness from the default master's metrics (rounded), isFixedPitch from the source flag and 0 when the source says nothing. fontc does not detect monospacing by measuring advances."
ref = "fontc fontbe/src/post.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: name table
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.namePlatforms"
area = "compile"
milestone = "M2"
summary = "fontc and fontmake write each name once, on the Windows platform with language 0x409 and encoding 1, or encoding 10 when the string contains a character outside the BMP. makeotf writes Windows and Macintosh records by default (-omitMacNames for Windows only). Our default is Windows only, with Mac records as an export option."
ref = "fontc fontir/src/ir/static_metadata.rs (NameKey); AFDKO python/afdko/makeotf.py (-omitMacNames, -useMacNames), hotconv/name.cpp"
status = "docs"

[[behavior]]
id = "compile.nameFallbacks"
area = "compile"
milestone = "M2"
summary = "Missing names are derived: family defaults to 'New Font' and subfamily to 'Regular'. If ID 2 is unset it takes the typographic subfamily when that is one of Regular, Italic, Bold, Bold Italic (case-insensitive); otherwise ID 2 becomes Regular and the typographic subfamily is appended to the ID 1 family name. IDs 16 and 17 fall back to IDs 1 and 2."
ref = "fontc fontir/src/ir.rs (NameBuilder::build, default_value, is_ribbi)"
status = "docs"

[[behavior]]
id = "compile.nameFullAndPostScript"
area = "compile"
milestone = "M2"
summary = "Unless set, ID 4 is typographic family + space + typographic subfamily. ID 6 is the typographic family with spaces removed, a hyphen, and the subfamily, then stripped of whitespace, of the characters [](){}<>/% and of anything outside printable ASCII (fontc drops such characters with a warning where fontmake transliterates them)."
ref = "fontc fontir/src/ir.rs (NameBuilder::build, normalize_for_postscript)"
status = "docs"

[[behavior]]
id = "compile.nameVersionString"
area = "compile"
milestone = "M2"
summary = "Unless set, ID 5 is 'Version <major>.<minor padded to 3 digits>'. fontc appends ';fontc <version>' to every ID 5 record, replacing an older stamp. makeotf writes 'Version x.xxx;addfeatures <client version>' and in non-release builds the string carries the word Development, which -r removes. We stamp ';fontcraft <version>' the same way and make it optional."
ref = "fontc fontir/src/ir.rs, fontbe/src/name.rs (stamp_compiler_version); AFDKO hotconv/name.cpp, docs/MakeOTFUserGuide.md (-r)"
status = "docs"

[[behavior]]
id = "compile.nameUniqueId"
area = "compile"
milestone = "M2"
summary = "Unless set, ID 3 is '<version without the word Version>;<vendor id>;<PostScript name>'. makeotf uses '<x.xxx>;<vendor>;<FontName>' with ';<license id>' appended when one is given."
ref = "fontc fontir/src/ir.rs (NameBuilder::build); AFDKO hotconv/name.cpp"
status = "docs"

[[behavior]]
id = "compile.nameTypographicDropped"
area = "compile"
milestone = "M2"
summary = "IDs 16 and 17 are removed when they equal IDs 1 and 2. Records whose string is empty are removed at the very end, after fallbacks, so an explicitly empty name suppresses its fallback."
ref = "fontc fontir/src/ir.rs (NameBuilder::build)"
status = "docs"

[[behavior]]
id = "compile.styleLinking"
area = "compile"
milestone = "M7"
summary = "Style-linked groups hold at most four fonts (Regular, Italic, Bold, Bold Italic) sharing ID 1. The linked family name is the family plus every word of the style name that is not the Regular/Bold/Italic(Oblique) word already expressed by the bold and italic flags, so 'Family' + 'Semibold Italic' with the italic flag gives 'Family Semibold' and ID 2 'Italic'. makeotf expresses the same thing with explicit FontMenuNameDB entries."
ref = "fontc fontir/src/ir.rs (style_map_family_name, citing glyphsLib); AFDKO docs/MakeOTFUserGuide.md (FontMenuNameDB)"
status = "docs"

[[behavior]]
id = "compile.fontMenuNameDb"
area = "compile"
milestone = "M12"
summary = "makeotf's FontMenuNameDB keys entries by [PostScriptName] with f= (preferred family), s= (style), l= (compatible family) and m=1, (Mac compatible full name). With only f= it goes to ID 1; when l= differs, f= goes to ID 16, l= to ID 1 and ID 2 is chosen from the bold/italic flags; s= goes to ID 17 only when it differs from that style; m=1, goes to Mac ID 18. Keys take an optional platform,script,language triplet and backslash hex escapes; the older c= syntax selects the pre-2.5 naming scheme."
ref = "AFDKO docs/MakeOTFUserGuide.md (FontMenuNameDB Version 2 and Version 1)"
status = "docs"

[[behavior]]
id = "compile.nameLengthAdvice"
area = "compile"
milestone = "M12"
summary = "AFDKO recommends that family, style and compatible family names each stay within 31 characters for legacy menus. We report longer names as a warning, not an error."
ref = "AFDKO docs/MakeOTFUserGuide.md (Note on length restrictions)"
status = "docs"

[[behavior]]
id = "compile.nameFeaOverrides"
area = "compile"
milestone = "M8"
summary = "Name records declared in a feature-file name table block replace generated records with the same platform, encoding, language and name id, and the merged list is sorted. Name ids that feature code allocates for stylistic set or character variant labels are renumbered to start after the highest id already used. makeotf only lets feature code override menu names with -overrideMenuNames, and never IDs 2 and 6."
ref = "fontc fontbe/src/name.rs (merge_name_records), fontbe/src/features.rs; AFDKO python/afdko/makeotf.py (-overrideMenuNames)"
status = "docs"

[[behavior]]
id = "compile.nameIdAllocation"
area = "compile"
milestone = "M9"
summary = "Axis, instance and STAT label names are allocated from name id 256 upward and one record is shared by identical strings. Axis names may only reuse a record with id 256 or higher. An instance at the default location may reuse ID 2 or 17 when its name matches; STAT value labels and the elided fallback name may reuse any existing record. Registration order follows fontTools so ids match fontmake's."
ref = "fontc fontir/src/ir/static_metadata.rs (StaticMetadata::new, set_stat), fontbe/src/fvar.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: OS/2, head, hhea, metrics
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.os2Version"
area = "compile"
milestone = "M2"
summary = "write-fonts chooses the OS/2 version from the fields present: 5 with optical size bounds, 4 when x-height, cap height, default char, break char or max context is set (fontc always sets them, so it writes 4), otherwise 1 or 0 by code page ranges. makeotf defaults to version 3 and switches to 4 when any of fsSelection bits 7 to 9 is used; -osv forces a version."
ref = "write-fonts src/tables/os2.rs (compute_version); fontc fontbe/src/os2.rs; AFDKO docs/MakeOTFUserGuide.md (-osv); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2WeightWidthClass"
area = "compile"
milestone = "M2"
summary = "For a .glyphs source fontc reads no weight or width class: usWeightClass is the wght axis default clamped to 1..1000 when the font has that axis with a range, else 400; usWidthClass is the class nearest to the wdth axis default percentage, else 5. For a UFO it is the source's openTypeOS2WeightClass and openTypeOS2WidthClass, else 400 and 5 (a static build of one UFO has no axes). FontCraft takes the target's own user location on the axis."
ref = "fontc fontbe/src/os2.rs (Os2Work::exec); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2WeightAdvice"
area = "compile"
milestone = "M12"
summary = "AFDKO's Windows guidance: weight classes 100 and 200 can trigger smeared or wrongly linked bold in old Windows applications, so regular-linked fonts should use 250 or more, and the bold partner should fall in a range that depends on the regular's weight (for example 600 to 850 for a 400 regular). Reported as an informational check, never applied silently."
ref = "AFDKO docs/WinWeights.md"
status = "docs"

[[behavior]]
id = "compile.os2FsSelection"
area = "compile"
milestone = "M2"
summary = "fsSelection for a .glyphs source: ITALIC when the italic angle is not 0, BOLD and ITALIC from a master named Bold, Italic or Bold Italic (any case), REGULAR when neither, USE_TYPO_METRICS and WWS from the Use Typo Metrics and Has WWS Names parameters. For a UFO: the explicit openTypeOS2Selection bits, plus the bits the style-map style names, or else the preferred subfamily or style name when it is Regular, Italic, Bold or Bold Italic, else REGULAR; the italic angle does not count. makeotf sets bold and italic with -b / -i or fontinfo keys and bits 7, 8, 9 with -osbOn / -osbOff or the keys PreferOS/2TypoMetrics, IsOS/2WidthWeigthSlopeOnly and IsOS/2OBLIQUE."
ref = "fontc ufo2fontir/src/source.rs, glyphs2fontir/src/source.rs; AFDKO docs/MakeOTFUserGuide.md (fontinfo, New OS/2.fsSelection Bits); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.headMacStyle"
area = "compile"
milestone = "M2"
summary = "head.macStyle bold and italic bits are copied from the OS/2 fsSelection BOLD and ITALIC bits; no other macStyle bit is set."
ref = "fontc fontbe/src/head.rs (apply_macstyle); AFDKO hotconv/head.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2VendorId"
area = "compile"
milestone = "M2"
summary = "achVendID comes from the source; when it has none, or only spaces, fontc 1.0.0 writes NONE (checked on empty-vendorid.ufo, M2.0). makeotf looks for a known foundry in the font's notice string and otherwise writes UKWN. FontCraft follows fontc: NONE."
ref = "fontc fontir/src/ir.rs (DEFAULT_VENDOR_ID), fontir/src/ir/static_metadata.rs; AFDKO hotconv/hot.cpp (setVendId); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2FsType"
area = "compile"
milestone = "M2"
summary = "fsType comes from the source. The default when unset depends on the source format in fontc: bit 2 (0x0004, preview and print embedding) for UFO sources and bit 3 (0x0008, editable embedding) for Glyphs sources. Our native format stores the value explicitly so no default guess is needed after import."
ref = "fontc ufo2fontir/src/source.rs, glyphs2fontir/src/source.rs; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2AvgCharWidth"
area = "compile"
milestone = "M2"
summary = "xAvgCharWidth is the rounded mean of all non-zero advance widths in hmtx (zero-width glyphs are not counted). makeotf computes the same mean but truncates the division."
ref = "fontc fontbe/src/os2.rs (x_avg_char_width); AFDKO hotconv/hot.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2UnicodeRanges"
area = "compile"
milestone = "M2"
summary = "ulUnicodeRange bits are computed from the mapped codepoints using the specification's block table, setting a bit as soon as one codepoint of the block is present, plus bit 57 for any codepoint beyond the BMP. Bits given explicitly in the source or in a FEA OS/2 block replace the computed set."
ref = "fontc fontbe/src/os2.rs (UNICODE_RANGES, apply_unicode_range); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2CodePageRanges"
area = "compile"
milestone = "M2"
summary = "ulCodePageRange bits are guessed from marker characters (a table of one or two tell-tale characters per code page, some requiring full printable ASCII or the box-drawing character), and bit 0 (Latin 1) is set when nothing else matches so the font works in MS Word. Explicit source bits replace the guess."
ref = "fontc fontbe/src/os2.rs (codepage_range_bits); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2CharIndexes"
area = "compile"
milestone = "M2"
summary = "usFirstCharIndex and usLastCharIndex are the lowest and highest mapped codepoints, each clamped to 0xFFFF; with no code point they are 0xFFFF and 0. usDefaultChar is 0 and usBreakChar is 32 whether the font has a space or not, in fontc; makeotf sets the break char to space only when a space glyph exists and has -dcs to put the space codepoint in usDefaultChar for an old QuarkXPress problem."
ref = "fontc fontbe/src/os2.rs; AFDKO hotconv/hot.cpp, docs/MakeOTFUserGuide.md (-dcs); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.os2MaxContext"
area = "compile"
milestone = "M8"
summary = "usMaxContext is the longest glyph context any GSUB or GPOS lookup needs, computed from the compiled lookups (0 when there is no layout); the OS/2 builder therefore runs after layout compilation."
ref = "fontc fontbe/src/os2.rs (apply_max_context), fontbe/src/os2/max_context.rs"
status = "docs"

[[behavior]]
id = "compile.ascenderDescenderDefaults"
area = "compile"
milestone = "M2"
summary = "When a master has no value: a .glyphs source means fixed values, ascender 800, descender -200, cap height 700, x-height 500 (glyphsLib's master defaults, read so by fontc); a UFO means ufo2ft's fractions of the em, 0.8, -0.2, 0.7 and 0.5. FontCraft applies them when resolving a master; the model keeps the value absent. makeotf instead measures x-height and cap height from the top of the o and O glyphs, or 0 when they are missing."
ref = "fontc fontir/src/ir.rs (populate_defaults); AFDKO hotconv/hot.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.typoMetricsDefaults"
area = "compile"
milestone = "M2"
summary = "fontc/ufo2ft defaults: sTypoAscender = ascender, sTypoDescender = descender, sTypoLineGap = max(0, 1.2 em + descender - ascender). makeotf defaults: sTypoAscender = the taller of the d glyph's top and cap height (falling back to the font box top, capped at one em), sTypoDescender = sTypoAscender - em, sTypoLineGap = 1.2 em - ascender + descender; for CID fonts it uses the box of a reference ideograph or 880/-120 per 1000 and a line gap of ascender - descender."
ref = "fontc fontir/src/ir.rs (populate_defaults); AFDKO hotconv/hot.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.winMetricsDefaults"
area = "compile"
milestone = "M2"
summary = "fontc/ufo2ft defaults: usWinAscent = ascender + sTypoLineGap, usWinDescent = absolute value of the descender. makeotf defaults: usWinAscent = top of the font bounding box, usWinDescent = minus its bottom, with a warning when their sum is less than one em. Our export dialog offers both strategies; the fontc one is the default."
ref = "fontc fontir/src/ir.rs (populate_defaults); AFDKO hotconv/hot.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.hheaMetricsDefaults"
area = "compile"
milestone = "M2"
summary = "fontc/ufo2ft defaults: hhea ascender = ascender + sTypoLineGap, descender = descender, lineGap = 0. makeotf defaults: hhea ascender, descender and line gap copy the three typo values. Both can be overridden per field from feature code."
ref = "fontc fontir/src/ir.rs (populate_defaults); AFDKO hotconv/hmtx.cpp (hheaFill); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.subSuperStrikeoutDefaults"
area = "compile"
milestone = "M2"
summary = "Defaults shared by fontc/ufo2ft and makeotf: subscript and superscript size 0.65 em wide by 0.60 em high, subscript lowered by 0.075 em, superscript raised by 0.35 em, x offsets from the italic angle (zero when upright), strikeout thickness = underline thickness, strikeout position = 0.6 of the x-height or 0.22 em when the x-height is zero."
ref = "fontc fontir/src/ir.rs (populate_defaults); AFDKO hotconv/hot.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.underlineDefaults"
area = "compile"
milestone = "M2"
summary = "Default underline thickness 50 and position -100 for a .glyphs source (fixed values, as glyphsLib and fontc use); ufo2ft's are 0.05 em and -0.075 em, which the UFO reader stores as parameters when a UFO has no value, so the compiler applies the .glyphs defaults to every model."
ref = "fontc fontir/src/ir.rs (populate_defaults); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.caretSlopeDefaults"
area = "compile"
milestone = "M2"
summary = "hhea caretSlopeRise defaults to the em size and caretSlopeRun to the horizontal shift for that rise at the italic angle (0 when upright); caretOffset defaults to 0. vhea defaults are rise 0, run 1, offset 0."
ref = "fontc fontir/src/ir.rs (populate_defaults); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.verticalMetrics"
area = "compile"
milestone = "M2"
summary = "vhea and vmtx are written only with vertical data: for a .glyphs source when the font or a master has all three vhea parameters, or any layer has a vertical width or origin; for a UFO when the three openTypeVheaVertTypo values are all set. A glyph's advance height is its own or the typographic ascender minus descender; its vertical origin is the typographic ascender minus its own offset, or the typographic ascender. Defaults for a .glyphs source: vhea ascender half the em, descender minus half, line gap one em; for a UFO 0. The drawn .notdef's advance height is the ascender minus the descender. makeotf's defaults when values are missing: vertical typo ascender = half the em, descender = minus that, line gap = ascender - descender, default vertical advance = typo descender - typo ascender, default vertical origin Y = typo ascender."
ref = "fontc fontbe/src/vertical_metrics.rs, fontir/src/ir/static_metadata.rs (build_vertical); AFDKO hotconv/hot.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.headFlagsAndPpem"
area = "compile"
milestone = "M2"
summary = "head.flags defaults to bit 0 (baseline at y=0) and bit 1 (left side bearing at x=0); bit 1 is always added because left side bearings always equal xMin. The openTypeHeadFlags parameter replaces the default bits, openTypeHeadLowestRecPPEM the lowestRecPPEM of 6 (3 in makeotf, which also sets fontDirectionHint to 2)."
ref = "fontc fontir/src/ir/static_metadata.rs; AFDKO hotconv/head.cpp; runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.headFontRevision"
area = "compile"
milestone = "M2"
summary = "head.fontRevision is the decimal number written as major, a point, and the minor version zero-padded to three digits and read literally (minor 7000 gives 1.7, not 8.0). A FontRevision in a FEA head block overrides it. makeotf's -rev edits that FEA value: no argument adds 5 to the minor part, an integer adds that much, a three-decimal number sets it."
ref = "fontc fontbe/src/head.rs (apply_font_revision); AFDKO docs/MakeOTFUserGuide.md (-rev); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.timestamps"
area = "compile"
milestone = "M2"
summary = "head.created is the source's creation date when it has one, otherwise the build time; head.modified is the build time. When the SOURCE_DATE_EPOCH environment variable holds a valid Unix timestamp it replaces the build time (fontc and fontTools both honour it); an invalid value falls back to the clock with a warning. makeotf writes the current time into both fields."
ref = "fontc fontbe/src/head.rs (current_timestamp, apply_created_modified); fonttools Lib/fontTools/misc/timeTools.py; AFDKO hotconv/head.cpp"
status = "docs"

[[behavior]]
id = "compile.reproducibleOutput"
area = "compile"
milestone = "M2"
summary = "The same source, options and SOURCE_DATE_EPOCH must give byte-identical output: no iteration over unordered maps reaches the binary, ties are broken by glyph order or first occurrence (write-fonts keeps shared gvar tuples with equal counts in first-seen order for this reason), and parallel jobs merge in glyph order."
ref = "write-fonts src/tables/gvar.rs (compute_shared_peak_tuples); fontc fontir/src/glyph.rs (batch_interpolate_missing)"
status = "inferred"

[[behavior]]
id = "compile.hmtxConstruction"
area = "compile"
milestone = "M2"
summary = "Advances are rounded default-master widths; the left side bearing is the built glyph's xMin, or 0 for a glyph with no outline. numberOfHMetrics is the glyph count minus the length of the trailing run of identical advances plus one."
ref = "fontc fontbe/src/metrics_and_limits.rs (MetricsBuilder); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.hheaExtents"
area = "compile"
milestone = "M2"
summary = "advanceWidthMax considers every glyph including empty ones; minLeftSideBearing, minRightSideBearing (advance - lsb - box width) and xMaxExtent (lsb + box width) consider only glyphs that have a bounding box, saturate at the int16 limits, and are 0 when no glyph has outlines."
ref = "fontc fontbe/src/metrics_and_limits.rs (MetricsBuilder::update); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.maxpCompositeLimits"
area = "compile"
milestone = "M2"
summary = "maxCompositePoints and maxCompositeContours are the largest sums over a composite's fully resolved components, and maxComponentDepth is the deepest nesting (1 for a composite of simple glyphs); they are resolved bottom-up so nested composites are counted correctly."
ref = "fontc fontbe/src/metrics_and_limits.rs (update_composite_limits); runs of fontc 1.0.0 on the corpus (M2.2)"
status = "observed"

[[behavior]]
id = "compile.feaTableOverrides"
area = "compile"
milestone = "M8"
summary = "Table blocks in feature code override computed values after the builders run: head (FontRevision only), hhea (Ascender, Descender, LineGap, CaretOffset), vhea (the three vertical typo values), OS/2 (only the fields actually written in the block, including an explicit zero), name (per record), and whole BASE and STAT tables."
ref = "fontc fontbe/src/head.rs, metrics_and_limits.rs, vertical_metrics.rs, os2.rs (merge_fea_os2), name.rs, stat.rs, orchestration.rs (ExtraFeaTables)"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: assembly and containers
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.sfntVersion"
area = "compile"
milestone = "M2"
summary = "The sfnt version tag is OTTO when the font contains a CFF or CFF2 table and 0x00010000 otherwise; searchRange, entrySelector and rangeShift are computed from the table count."
ref = "write-fonts src/font_builder.rs (TableDirectory::from_table_records)"
status = "docs"

[[behavior]]
id = "compile.tableOrder"
area = "compile"
milestone = "M2"
summary = "Table data is laid out in the specification's recommended order: for TrueType head, hhea, maxp, OS/2, hmtx, LTSH, VDMX, hdmx, cmap, fpgm, prep, cvt, loca, glyf, kern, name, post, gasp, PCLT; for fonts with a CFF table head, hhea, maxp, OS/2, name, cmap, post, CFF. Remaining tables follow in tag order and DSIG is always last. Directory records are sorted by tag. This is write-fonts's order and it matches fontTools's sortedTagList; note the CFF order is keyed on 'CFF ' only, so a CFF2 font uses the TrueType list."
ref = "write-fonts src/font_builder.rs (ordered_tags); fonttools Lib/fontTools/ttLib/ttFont.py (sortedTagList)"
status = "docs"

[[behavior]]
id = "compile.checksums"
area = "compile"
milestone = "M2"
summary = "Every table is zero-padded to a multiple of four bytes and its checksum is computed over the padded data; head is checksummed with checkSumAdjustment zeroed. checkSumAdjustment is 0xB1B0AFBA minus the sum of all table checksums and the directory checksum, modulo 2^32."
ref = "write-fonts src/font_builder.rs (FontBuilder::build)"
status = "docs"

[[behavior]]
id = "compile.variableOnlyTables"
area = "compile"
milestone = "M9"
summary = "avar, fvar, gvar, HVAR, VVAR and MVAR are built only when the font has at least one ranged axis; a static build skips them. STAT is the exception and may appear in a static font. Axes that are a single point are removed from the variation model and from fvar."
ref = "fontc fontbe/src/font.rs (is_variable_only), fontir/src/ir/static_metadata.rs"
status = "docs"

[[behavior]]
id = "compile.woff2Encoding"
area = "compile"
milestone = "M2"
summary = "WOFF2 as fontTools writes it: glyf and loca are stored with the WOFF2 transform by default (the hmtx transform is available but optional; an empty transform set stores every table untransformed, glyf and loca with transform version 3), DSIG is always dropped, bit 11 of head.flags is always set, even with no transform, and when glyf is transformed it is first normalised to 4-byte glyph padding with loca and indexToLocFormat updated. Table directory and data are sorted by tag, tables are concatenated without padding, checkSumAdjustment is computed for the sfnt laid out in tag order, and the whole table stream is one Brotli stream at quality 11, window 22, font mode; metadata uses text mode, and the private block starts on a 4-byte boundary. fontTools' head round trip also moves created and modified times below 0x7C259DC0 by that amount (it reads them as Unix time); FontCraft does not copy that. No Rust crate in the reference folder encodes WOFF2, so the transform is ours and Brotli comes from a pure-Rust crate."
ref = "fonttools Lib/fontTools/ttLib/woff2.py; W3C WOFF 2.0; cross-check against fontTools 4.66.1 (crates/container/crosscheck, M2.4a: untransformed only)"
status = "observed"

[[behavior]]
id = "compile.woffEncoding"
area = "compile"
milestone = "M2"
summary = "WOFF 1.0 compresses each table separately with zlib; fontTools uses compression level 6 by default and can use Zopfli instead. The head table is always stored uncompressed, and any other table is stored raw when its compressed form is not smaller. Table data follow fontTools' recommended order (head, hhea, maxp, OS/2, then the TrueType or CFF order list, the other tags sorted, DSIG last), the directory is sorted by tag, each table is padded to four bytes, checkSumAdjustment is computed for the sfnt the file unwraps to, the header version is head.fontRevision unless given, the metadata is compressed at level 6 and the private block starts on a 4-byte boundary. FontCraft's zlib (miniz_oxide) chooses other encodings of the same data than zlib, so the compressed bytes differ."
ref = "fonttools Lib/fontTools/ttLib/sfnt.py (ZLIB_COMPRESSION_LEVEL, USE_ZOPFLI, SFNTWriter), ttLib/ttFont.py (sortedTagList, reorderFontTables); cross-check against fontTools 4.66.1 (crates/container/crosscheck, M2.4a)"
status = "observed"

[[behavior]]
id = "compile.collectionSharing"
area = "compile"
milestone = "M12"
summary = "A font collection stores byte-identical tables once and points several fonts at them; fontTools's TTCollection.save shares tables by default, and reads the timestamp once so head tables do not differ needlessly. write-fonts declares a TTCHeader type whose version computation panics as not supported yet, so the collection writer is ours. AFDKO has otf2otc and otc2otf for the same job."
ref = "fonttools Lib/fontTools/ttLib/ttCollection.py; write-fonts src/font_builder.rs (TTCHeader); AFDKO python/afdko/otf2otc.py"
status = "docs"

[[behavior]]
id = "compile.outputNaming"
area = "compile"
milestone = "M2"
summary = "Reference defaults for output paths: fontmake writes into per-format folders (master_ttf, master_otf, instance_ttf, instance_otf, variable_ttf, variable_otf) unless --output-dir or --output-path is given; makeotf writes <PostScript-Name>.otf next to the source; fontc writes build/font.ttf. Ours: <PostScript name>.<ext> in the chosen export folder, with explicit paths in headless use."
ref = "fontmake README.md; AFDKO docs/MakeOTFUserGuide.md (-o); fontc fontc/src/args.rs"
status = "docs"

[[behavior]]
id = "compile.outputFormats"
area = "compile"
milestone = "M2"
summary = "fontmake's -o accepts otf, ttf, otf-cff2, variable, variable-cff2, plus the intermediate otf-interpolatable, ttf-interpolatable and ufo; with no -o it builds otf and ttf for each master, and instances only with -i. fontc builds exactly one variable or static TrueType font per run. Our export covers static and variable TTF and OTF plus WOFF, WOFF2 and collections as wrappers."
ref = "fontmake README.md (Output file format options); fontc README.md"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: variation tables
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.gvarIupOptimisation"
area = "compile"
milestone = "M9"
summary = "Deltas that a renderer can infer by interpolating untouched points are dropped from gvar for simple glyphs, using a tolerance of 0.5 font units; composite glyphs are not optimised this way, their all-zero deltas are simply omitted. fontmake does the same by default and --no-optimize-gvar turns it off; fontc has no switch."
ref = "fontc fontbe/src/glyphs.rs (compute_deltas, should_iup); write-fonts src/tables/gvar/iup.rs; fontmake USAGE.md (--no-optimize-gvar)"
status = "docs"

[[behavior]]
id = "compile.gvarEveryGlyph"
area = "compile"
milestone = "M9"
summary = "gvar holds variation data for every glyph id in glyph order, empty for glyphs that do not vary. A glyph defined at only some master locations gets its own variation model built from just those locations; otherwise the font-wide model is used."
ref = "fontc fontbe/src/gvar.rs (make_variations), fontbe/src/glyphs.rs"
status = "docs"

[[behavior]]
id = "compile.gvarPhantomPoints"
area = "compile"
milestone = "M9"
summary = "Each glyph's point list ends with four phantom points: (0, 0), (advance width, 0), (0, vertical origin) and (0, vertical origin - advance height); the last two are (0, 0) when the font has no vertical metrics. For a composite the list is one point per component (its rounded offset) followed by the phantoms. Their deltas are stored like any other point, so advances vary even without HVAR."
ref = "fontc fontbe/src/glyphs.rs (point_seqs_for_simple_glyph, point_seqs_for_composite_glyph)"
status = "docs"

[[behavior]]
id = "compile.gvarSharedTuples"
area = "compile"
milestone = "M9"
summary = "Peak tuples used by more than one tuple variation across the font are moved into the shared tuple list, most frequent first, at most 4095 of them. The offset array switches to 32-bit offsets when the data no longer fits 16-bit halved offsets."
ref = "write-fonts src/tables/gvar.rs (Gvar::new, compute_flags)"
status = "docs"

[[behavior]]
id = "compile.hvarStoreChoice"
area = "compile"
milestone = "M9"
summary = "HVAR and VVAR are built twice when possible (direct store indexed by glyph id, and deduplicated store plus index map) and the smaller serialised result is kept, preferring direct on a tie. A .notdef with a single master is given dense deltas at every location so the region list comes out in the same order as fontTools's."
ref = "fontc fontbe/src/hvar.rs, vvar.rs, metric_variations.rs"
status = "docs"

[[behavior]]
id = "compile.avarMaps"
area = "compile"
milestone = "M9"
summary = "avar always writes the -1, 0 and 1 mappings for every axis even when the axis has no custom mapping, because some implementations require them (fontc matches fontTools here). The table is dropped only when all axes are identity and there is no avar 2 data."
ref = "fontc fontbe/src/avar.rs"
status = "docs"

[[behavior]]
id = "compile.fvarInstances"
area = "compile"
milestone = "M9"
summary = "Named instances are written only for variable fonts and their locations are reduced to the ranged axes. Instance subfamily names take ids from 256 up except that an instance at the default location reuses ID 2 or 17 when its name matches."
ref = "fontc fontir/src/ir/static_metadata.rs (StaticMetadata::new), fontbe/src/fvar.rs"
status = "docs"

[[behavior]]
id = "compile.statDefaults"
area = "compile"
milestone = "M9"
summary = "STAT axes default to the fvar axes with no value labels; a source can supply a longer list, including axes with no fvar counterpart (a point width axis, or an ital axis for an upright family). The elided fallback name id defaults to 2. Axis names share the fvar axis name records."
ref = "fontc fontir/src/ir/static_metadata.rs (set_stat), fontbe/src/stat.rs"
status = "docs"

[[behavior]]
id = "compile.cff2VariableBuild"
area = "compile"
milestone = "M9"
summary = "Reference routes to a CFF2 variable font: fontmake -o variable-cff2 builds interpolatable CFF masters and merges them; AFDKO builds one CFF OTF per master with buildmasterotfs (running makeotf on each font.ufo) and merges them with buildcff2vf (options: -k keep glyph names in post format 2, --omit-mac-names, -c check compatibility and fix flat curves, -i per-master glyph inclusion). AFDKO's newer flow merges outlines into a bare CFF2 OTF first and then adds layout with addfeatures. We build CFF2 directly from the source model, which is the newer flow without intermediate files."
ref = "fontmake README.md; AFDKO python/afdko/buildmasterotfs.py, buildcff2vf.py, docs/CFF2_Support.md"
status = "docs"

[[behavior]]
id = "compile.cff2CompanionTables"
area = "compile"
milestone = "M9"
summary = "Because CFF2 drops data that CFF carried, a CFF2 font needs it elsewhere: advances in hmtx with HVAR, glyph names in post (when names are wanted), all naming strings in name, and the em size and font box in head. A CFF table's built-in encoding is ignored in favour of cmap."
ref = "AFDKO docs/CFF2_Support.md (CFF2 Portability)"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: layout compilation
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.featureCompilation"
area = "compile"
milestone = "M8"
summary = "Feature code is lexed, parsed, validated once and compiled to GSUB, GPOS and GDEF plus any head, hhea, vhea, OS/2, name, BASE and STAT blocks, against the final glyph order (fontc uses fea-rs). When masters carry different feature files each is compiled separately and the results merged into one variable compilation; generated kerning and marks are then added once."
ref = "fontc fea-rs/README.md, fea-rs/src/compile/output.rs, fontbe/src/features.rs"
status = "docs"

[[behavior]]
id = "compile.featureWriterModes"
area = "compile"
milestone = "M8"
summary = "Generated features have two modes. skip (default): a generated feature is not written when the feature code already declares that feature, unless the code contains the comment '# Automatic Code', in which case the generated lookups are inserted at that position. append: generated lookups are added after all hand-written lookups and markers are ignored. A source can replace the whole writer list, and an empty list or fontmake's --feature-writer None disables generation."
ref = "fontmake USAGE.md (Feature writing); fontc fontbe/src/features.rs, fea-rs/src/compile/output.rs (insert_markers)"
status = "docs"

[[behavior]]
id = "compile.kernValueLookup"
area = "compile"
milestone = "M5"
summary = "The kerning value for a pair is resolved per master in this order: the exact pair; then for each side a glyph is tried both as itself and as its group; then zero. This is the UFO kerning lookup, applied against each master's own groups."
ref = "fontc fontbe/src/features/kern.rs (lookup_kerning_value)"
status = "docs"
notes = "Moved from M8 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 3): M5.17 ports fontc's kern writer (fontbe/src/features/kern.rs) to write pair kerning to GPOS at export. A hand-written kern feature and `# Automatic Code` stay in M8. The same order serves kerning.getPair (kerning.pairLookupOrder). Built in M5.17 (`crates/features`, ported from fontc at commit 4504578): one master of a static build. Right-to-left pairs join the left-to-right ones as fontc and glyphsLib join them: in logical order, a glyph with right-to-left kerning given by its left group as the first glyph of a pair and by its right group as the second. A glyph–group pair becomes one glyph pair per member with the value that applies to it; group–group pairs of 0 are left out, zero exceptions kept, values rounded half up."

[[behavior]]
id = "compile.kernGroupReconciliation"
area = "compile"
milestone = "M9"
summary = "When masters group glyphs differently for kerning, output classes are the common refinement of all masters' groupings: glyphs that share a kerned group in every master stay together and the rest split into smaller classes. A glyph-to-class pair is treated as per-glyph exceptions and emitted glyph by glyph. Pairs that are zero in every master are dropped."
ref = "fontc fontbe/src/features/kern.rs (build_variable_kern_adjustments, refine_divergent_groups)"
status = "docs"

[[behavior]]
id = "compile.kernFeatureWriter"
area = "compile"
milestone = "M5"
summary = "Generated kerning is split into lookups by script and writing direction using Unicode data for each glyph (through cmap and substitution closure); scripts that need it get the dist feature and the others kern. Common-script glyphs are added to every script's lookups, pairs mixing strong left-to-right and right-to-left glyphs are dropped, and lookups nobody references are pruned. Lookups ignore marks by default; pairs involving marks go to separate lookups, and a mark with an advance width turns the flag into a mark filtering set."
ref = "fontc fontbe/src/features/kern.rs; fontmake USAGE.md (KernFeatureWriter)"
status = "docs"
notes = "Moved from M8 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 3): M5.17 ports fontc's kern writer (fontbe/src/features/kern.rs) to write pair kerning to GPOS at export. A hand-written kern feature and `# Automatic Code` stay in M8. Built in M5.17 (`crates/features`, ported from fontc at commit 4504578) for sources without feature code: the substitution closure and feature-code language systems are not used, since such sources get no generated kerning before M8. Lookups that skip marks get the IgnoreMarks flag and no GDEF is written (fontc uses a mark filtering set when the font has spacing marks); without GDEF neither changes shaping. Marks are the glyphs of category Mark with subcategory Nonspacing or Spacing Combining; a UFO's are its stored categories, not public.openTypeCategories. Unicode data: ICU4X 2.1.2 with fontc's Unicode 18 overlay."

[[behavior]]
id = "compile.kernQuantisation"
area = "compile"
milestone = "M8"
summary = "fontmake's kern and mark writers accept a quantization option that rounds values to a multiple of a given number to make tables compress better; it is off by default. fontc has no such option. We expose it as an export option, off by default."
ref = "fontmake USAGE.md (KernFeatureWriter, MarkFeatureWriter); fontc fontbe/src/features/"
status = "docs"

[[behavior]]
id = "compile.markFeatureWriter"
area = "compile"
milestone = "M8"
summary = "Anchors generate mark (mark to base and mark to ligature), mkmk (mark to mark), abvm and blwm (for scripts that use them) and, from entry/exit anchor pairs, curs. An anchor 'top' pairs with '_top'; 'entry' pairs with 'exit' and 'entry.N' with 'exit.N' only. fontc emits one lookup per mark class. curs is a separate writer from the mark writer."
ref = "fontc fontbe/src/features/marks.rs, fontbe/src/features.rs"
status = "docs"

[[behavior]]
id = "compile.gdefClasses"
area = "compile"
milestone = "M8"
summary = "GDEF glyph classes come from an explicit GDEF block in feature code when there is one; otherwise from the source's glyph categories. For Glyphs sources the categories are refined from anchors (a glyph with attaching anchors becomes a base; a ligature without attaching anchors loses its ligature class); for UFO sources the stored categories are used as they are. fontmake's --no-generate-GDEF stops the generated block when the feature code already has one."
ref = "fontc fontbe/src/features.rs, fontir/src/glyph.rs (recompute_gdef_categories); fontmake USAGE.md (--no-generate-GDEF)"
status = "docs"

[[behavior]]
id = "compile.gdefLigatureCarets"
area = "compile"
milestone = "M8"
summary = "Ligature caret positions in GDEF come from anchors named caret_N (horizontal text, x coordinate) and vcaret_N (vertical text, y coordinate), and vary with the masters in a variable font."
ref = "fontmake USAGE.md (GdefFeatureWriter); fontc fontbe/src/features/marks.rs"
status = "docs"

[[behavior]]
id = "compile.featureVariations"
area = "compile"
milestone = "M9"
summary = "Glyph swaps tied to axis ranges compile to single-substitution lookups plus a FeatureVariations table. For designspace rules the feature is rvrn when rules are processed first and rclt when processed last; for Glyphs bracket layers it is rvrn unless the 'Feature for Feature Variations' parameter names another tag. Overlapping condition boxes are split into non-overlapping regions first. When the only feature is rvrn its lookups go at the front of the lookup list."
ref = "fontc ufo2fontir/src/source.rs, glyphs2fontir/src/source.rs (make_feature_variations), fontir/src/feature_variations.rs, fontbe/src/features/feature_variations.rs"
status = "docs"

[[behavior]]
id = "compile.bracketLayerGlyphs"
area = "compile"
milestone = "M9"
summary = "Each alternate (bracket) layer set becomes an extra glyph named after its parent with a suffix; it is appended to the glyph order, takes the parent's production name plus the same suffix, has no codepoint, and is reached only through the feature variation substitution."
ref = "fontc glyphs2fontir/src/source.rs"
status = "docs"

[[behavior]]
id = "compile.layoutPacking"
area = "compile"
milestone = "M8"
summary = "write-fonts resolves subtable offsets with a graph packer that reorders subtables, deduplicates identical ones, splits some oversized subtables and promotes lookups to extension lookups when 16-bit offsets overflow. A table that still cannot be packed is a build error naming the table, never a silently truncated font."
ref = "write-fonts src/graph.rs, src/graph/splitting.rs; fontc fontbe/src/font.rs (failure_to_pack_a_table_is_an_error)"
status = "docs"

[[behavior]]
id = "compile.skipFeatures"
area = "compile"
milestone = "M8"
summary = "fontc's --skip-features builds the font without any layout tables, for fast outline-only iteration. We offer the same switch for preview builds."
ref = "fontc fontc/src/args.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: CFF path
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.cffOptimisationLevels"
area = "compile"
milestone = "M2"
summary = "fontmake --optimize-cff: 0 writes plain charstrings, 1 specialises operators (hlineto, vlineto and friends, which drop zero arguments), 2 (default) also subroutinises. --no-subroutinize is the deprecated spelling of level 1. Specialising (fontTools specializeCommands) also changes topology: successive moves merge, zero-length lines and degenerate curves are dropped or turned into lines, runs of horizontal or vertical lines are summed, and operators combine while fewer than 48 operands are on the stack. crates/cff writes level 1 (or level 0 on request) byte for byte as fontTools does."
ref = "fontmake USAGE.md (--optimize-cff), Lib/fontmake/font_project.py; fonttools cffLib/specializer.py; crates/cff/crosscheck (M2.3a)"
status = "observed"

[[behavior]]
id = "compile.cffSubroutinisation"
area = "compile"
milestone = "M2"
summary = "Repeated charstring sequences are moved into subroutines. fontmake delegates to compreffor for CFF (the default there, CFF only) or cffsubr for CFF2 (selectable with --subroutinizer). makeotf does it only with -S or in release mode (-r), turns it off with -nS, and can cap the number of subroutines with -maxs; its guide warns of large memory and time cost for CID fonts and little gain for Japanese and Chinese fonts. Nothing in fontations subroutinises, so this is our own code."
ref = "fontmake USAGE.md (--subroutinizer); AFDKO docs/MakeOTFUserGuide.md (-S, -r), python/afdko/makeotf.py (-maxs)"
status = "docs"

[[behavior]]
id = "compile.cffWidthOptimisation"
area = "compile"
milestone = "M2"
summary = "A charstring can omit its width when it equals the Private DICT's defaultWidthX and otherwise stores the difference from nominalWidthX. fontTools has an optimiser (cffLib.width.optimizeWidths) that picks the pair minimising total bytes in time linear in em size plus glyph count; makeotf optimises by default and -swo suppresses it. ufo2ft runs it on the rounded advances unless the source sets either value, and compares the unrounded advance with the default when deciding to leave a width out. crates/cff ports the optimiser; its pairs match fontTools' on every cross-checked font."
ref = "fonttools Lib/fontTools/cffLib/width.py; AFDKO python/afdko/makeotf.py (-swo); ufo2ft outlineCompiler.py (getDefaultAndNominalWidths, getCharStringForGlyph); crates/cff/crosscheck (M2.3a)"
status = "observed"

[[behavior]]
id = "compile.cffFontBBox"
area = "compile"
milestone = "M2"
summary = "Top DICT FontBBox is the union of all charstring bounds expanded to integers (floor of the minima, ceiling of the maxima), or the format's default box, which is then left out, when no glyph has an outline (fontTools recalcFontBBox, run when the table is compiled). The bounds are those of the drawn charstring: every on-curve point including each contour's start, plus curve extremes where a control point lies outside the box so far (BoundsPen), not the control-point box. It must agree with head's xMin/yMin/xMax/yMax."
ref = "fonttools Lib/fontTools/cffLib/__init__.py (recalcFontBBox), pens/boundsPen.py; crates/cff/crosscheck (M2.3a)"
status = "observed"

[[behavior]]
id = "compile.cffNamesAndStrings"
area = "compile"
milestone = "M2"
summary = "A CFF table carries its own PostScript font name, full name, family name, copyright and glyph names (standard names by string id, others in the String INDEX), which must agree with name ID 6 and the glyph order. CFF2 has none of these. fontmake (ufo2ft) writes: the font name = postscriptFontName; version = major.minor; Notice and Copyright from the trademark and the copyright with the copyright sign spelt out and reduced to printable ASCII (compatibility decomposition, then ? for what is left), empty strings when missing; FullName = postscriptFullName or the typographic family and subfamily; FamilyName = the typographic family; Weight only from postscriptWeightName; ItalicAngle always a real; FontMatrix 1/upem. FontCraft takes the names from its own name table, so the two tables agree."
ref = "AFDKO docs/CFF2_Support.md (name, post); ufo2ft outlineCompiler.py (setupTable_CFF), fontInfoData.py (normalizeStringForPostscript); oracle runs against fontmake 3.12.1 (M2.3b)"
status = "observed"

[[behavior]]
id = "compile.cffPrivateDictValues"
area = "compile"
milestone = "M2"
summary = "Private DICT values of a static CFF font as fontmake writes them: BlueValues and OtherBlues from the master's alignment zones (overshoots of the metrics, then the master's other zones), rounded; only when some blue array is present also BlueFuzz (default 0), BlueShift (7), BlueScale (3 / (4 × the tallest zone), else 0.039625) and ForceBold, each overridable by its parameter; StemSnapH and StemSnapV sorted with StdHW and StdVW the first stem of each direction, written only when both directions have stems; defaultWidthX and nominalWidthX from the source when it sets either, else optimised. No LanguageGroup or ExpansionFactor."
ref = "ufo2ft outlineCompiler.py (setupTable_CFF), fontInfoData.py (postscriptBlueScaleFallback); glyphsLib builder/blue_values.py; oracle runs against fontmake 3.12.1 (M2.3b)"
status = "observed"

[[behavior]]
id = "compile.cidKeyedFonts"
area = "compile"
milestone = "M12"
summary = "A source becomes CID-keyed when it declares a Registry-Ordering-Supplement and a glyph name to CID map; optional font dictionaries (hint values per glyph group) are selected by groups named FDArraySelect.<index>[.<label>]. Glyphs are written in CID order whatever the editing order. makeotf -cn can also convert a name-keyed CFF to CID-keyed with the Adobe-Identity-0 ordering as an experimental post step."
ref = "AFDKO docs/CIDKeyedUFOGuide.md; python/afdko/makeotf.py (-cn)"
status = "docs"

[[behavior]]
id = "compile.cidCmapResources"
area = "compile"
milestone = "M12"
summary = "For CID-keyed fonts makeotf takes encodings from Adobe CMap resources chosen by ROS: a Macintosh CMap, a UTF-32 horizontal CMap and a UTF-32 vertical CMap (for example UniJIS-UTF32-H/V for Adobe-Japan1); only glyphs named in them are encoded. Options -cm, -ch, -cv override the files. Our CID path reads codepoints from the source glyphs and can import a CMap resource to fill them."
ref = "AFDKO docs/MakeOTFUserGuide.md (Adobe character code map)"
status = "docs"

[[behavior]]
id = "compile.makeotfReleaseMode"
area = "compile"
milestone = "M12"
summary = "makeotf distinguishes development and release builds. -r turns on subroutinisation, applies the GlyphOrderAndAliasDB (order, final names, Unicode overrides), removes the word Development from the version string and adds a stub DSIG; later options can undo parts of it (-r -nS does not subroutinise, -nS -r does). Our export presets 'draft' and 'release' map onto this: draft skips subroutinisation and renaming."
ref = "AFDKO docs/MakeOTFUserGuide.md (-r, option order), python/afdko/makeotf.py (-addDSIG)"
status = "docs"

[[behavior]]
id = "compile.makeotfOptionPrecedence"
area = "compile"
milestone = "M12"
summary = "makeotf reads settings in increasing priority from the fontinfo file, then the project file (current.fpr or -fp), then the command line left to right, where a later option overrides an earlier conflicting one; the last used options are always saved to current.fpr."
ref = "AFDKO docs/MakeOTFUserGuide.md (MakeOTF options)"
status = "docs"

[[behavior]]
id = "compile.makeotfSyntheticGlyphs"
area = "compile"
milestone = "M12"
summary = "makeotf -adds synthesises missing Euro, Apple symbol and a few standard glyphs from built-in multiple master designs matched to the font's zero width and stem weight (needs zero and O; -serif or -sans picks the design). We do not synthesise designed glyphs at compile time; a missing-glyph report covers it."
ref = "AFDKO docs/MakeOTFUserGuide.md (Synthetic Glyphs)"
status = "docs"

[[behavior]]
id = "compile.kernClassOptimisation"
area = "compile"
milestone = "M12"
summary = "makeotf by default saves space in class kerning by using left-side class 0 for non-zero values, which confuses some programs; -skco suppresses it. Our pair positioning comes from write-fonts's PairPosBuilder and does not use this trick."
ref = "AFDKO python/afdko/makeotf.py (-skco/-nskco); write-fonts src/tables/gpos/builders.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Behaviours: hinting, colour, misc
# ---------------------------------------------------------------------------------------------------

[[behavior]]
id = "compile.instructionBytes"
area = "compile"
milestone = "M10"
summary = "write-fonts stores glyph instructions as an opaque byte vector on simple and composite glyphs and checks only that the length fits 16 bits; a composite sets WE_HAVE_INSTRUCTIONS when the vector is not empty. Turning our hinting model into bytecode, and filling the matching maxp limits, is entirely ours."
ref = "write-fonts src/tables/glyf/simple.rs, glyf/composite.rs"
status = "docs"

[[behavior]]
id = "compile.ttfAutohintPostStep"
area = "compile"
milestone = "M10"
summary = "fontmake hints TrueType output by running the external ttfautohint program on the finished binary (-a, with optional pass-through arguments), not during compilation. We keep autohinting as a post-compile stage too, so unhinted and hinted builds share everything before it."
ref = "fontmake USAGE.md (-a)"
status = "docs"

[[behavior]]
id = "compile.colrClipBoxes"
area = "compile"
milestone = "M11"
summary = "COLR clip boxes are the colour glyph's bounds expanded outward to multiples of a quantum equal to a tenth of the em rounded to the nearest 10 units (100 at 1000 units per em, 200 at 2048), so that many glyphs share a box; consecutive glyphs with the same box are stored as one range."
ref = "fontc fontbe/src/colr.rs"
status = "docs"

[[behavior]]
id = "compile.colrGradientGeometry"
area = "compile"
milestone = "M11"
summary = "Glyphs gradient coordinates are fractions of the layer's bounding box and are scaled to font units at compile time. A radial gradient without an explicit radius uses the largest distance from its centre to the four box corners. A linear gradient's third point is obtained by rotating the start-to-end vector by -90 degrees around the start point."
ref = "fontc fontbe/src/colr.rs"
status = "docs"

[[behavior]]
id = "compile.subsetOnExport"
area = "compile"
milestone = "M12"
summary = "fontmake subsets an instance when it carries a Keep Glyphs parameter, unless --no-subset is given. We apply instance-level glyph filters before the glyph-order stage so removed glyphs never reach the builders."
ref = "fontmake USAGE.md (--subset / --no-subset)"
status = "docs"

[[behavior]]
id = "compile.oracleComparison"
area = "compile"
milestone = "M2"
summary = "fontc validates itself by compiling thousands of families with both fontc and fontmake and diffing normalised dumps (its repository ships ttx_diff, otl-normalizer and fontc_crater for this). Our harness (crates/oracle, fontcraft-cli oracle) compares FontCraft's build with fontc's for TrueType and fontmake's for CFF, static, at the same master: a single-master source as it is, a designspace through its first source's UFO, a multi-master .glyphs source as fontc's variable font at its default location against FontCraft's build of the variable font origin, fontmake's output file of that master. Normalised: checksums, dates and offsets removed; name as a set of records without the reference's version stamp and without IDs 256 and up; cmap as code point to glyph name mappings; hmtx as advances and side bearings by glyph name; glyf and CFF as drawn outlines within half a unit with start points free; head, hhea, maxp, OS/2 and post field by field. Layout tables are skipped until M8 (fontc builds with --skip-features), variation tables until M9. Accepted differences are in crates/oracle/allow.toml with their reasons."
ref = "fontc README.md (Are we there yet?, Plan), ttx_diff/, otl-normalizer/; runs of fontc 1.0.0 and fontmake 3.12.1 on the corpus"
status = "observed"
