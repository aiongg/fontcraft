status = "docs"

[[table]]
tag = "SVG "
flavour = ["ttf", "otf"]
read = "read-fonts"
write = "none-yet"
area = "compile"
milestone = "M11"
summary = "SVG documents keyed by glyph id ranges, optionally gzip-compressed. read-fonts can list the documents; write-fonts has no SVG table, so the document index and the per-glyph SVG generation are ours."
