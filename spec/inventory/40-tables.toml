status = "docs"

[[table]]
tag = "CBDT"
flavour = ["ttf"]
read = "read-fonts"
write = "none-yet"
area = "compile"
milestone = "M11"
summary = "Colour bitmap data with its companion location table CBLC (strike list, index subtables, glyph metrics). read-fonts reads both; write-fonts has neither, so the index subtable formats and bitmap data formats are ours."
ref = "read-fonts src/tables/cbdt.rs, cblc.rs, bitmap.rs; write-fonts src/tables.rs"
status = "docs"

