# Compile inventory: OpenType tables and compiler rules.
# Date: 2026-10-07
#
# Sources (all permissively licensed, read as code and docs from local clones):
#   fontations  (MIT/Apache-2.0)  refs/fontations @ d6a9007
#       read-fonts 0.45.0, write-fonts 0.54.0, font-types 0.12.6, skrifa 0.48.0, skera 0.8.0, kurbo 0.13.0
#       read-fonts/src/tables/, read-fonts/src/ps/, write-fonts/src/tables/, write-fonts/src/ps/,
#       write-fonts/generated/, write-fonts/src/font_builder.rs
#   fontc       (Apache-2.0)      refs/fontc @ f7d2bd9  (fontc, fontbe, fontir, fea-rs all 1.0.0)
#       README.md, fontc/src/args.rs, fontbe/src/*.rs, fontbe/src/features/*.rs, fontir/src/glyph.rs,
#       fontir/src/ir.rs, fontir/src/ir/static_metadata.rs, ufo2fontir/src/source.rs, glyphs2fontir/src/source.rs
#   fontmake    (Apache-2.0)      refs/fontmake @ 92f6ea7  (pins fonttools 4.63.0, ufo2ft 3.8.0, glyphsLib 6.11.6,
#       cffsubr 0.3.0, compreffor 0.6.0)  README.md, USAGE.md, Lib/fontmake/__main__.py, font_project.py
#   fonttools   (MIT)             refs/fonttools @ 9d3adb4 (4.66.2.dev0)  ttLib/ttFont.py, ttLib/woff2.py,
#       ttLib/sfnt.py, ttLib/ttCollection.py, cu2qu/, cffLib/__init__.py, cffLib/width.py, misc/timeTools.py
#   AFDKO       (Apache-2.0)      refs/afdko @ c53bdc6  docs/MakeOTFUserGuide.md, WinWeights.md, CFF2_Support.md,
#       CIDKeyedUFOGuide.md, python/afdko/makeotf.py (option help), buildmasterotfs.py, buildcff2vf.py,
#       c/addfeatures/hotconv/{hot,name,head,hmtx,post,map}.cpp
#
# ufo2ft and glyphsLib are NOT in the reference folder. Where a row describes their behaviour it does so
# through fontmake's documentation or through fontc source comments that cite them, and says so.
#
# Conventions used in this file
#   read  = "read-fonts"  a typed reader exists in read-fonts 0.45.0
#           "own"         read-fonts has no typed reader; we parse the bytes ourselves
#   write = "write-fonts" a typed, serialising table exists in write-fonts 0.54.0 and is exported from src/tables.rs
#           "own"         no typed writer, but the payload is an opaque or trivial byte array that we emit
#                         ourselves through FontBuilder::add_raw
#           "none-yet"    write-fonts has no usable writer and a real encoder has to be built by us
#   flavour values: "ttf", "otf" (CFF), "variable-ttf", "variable-otf" (CFF2)
#   status = "docs" for facts read in the references above, "inferred" for FontCraft design choices,
#            "memory" where a fact is recalled and could not be checked in the reference folder.

# ---------------------------------------------------------------------------------------------------
# Tables: static core (M2)
# ---------------------------------------------------------------------------------------------------

[[table]]
tag = "head"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "unitsPerEm, fontRevision (major.minor with the minor as three literal decimal digits), flags, created/modified, font bounding box, macStyle mirrored from OS/2 fsSelection bold and italic, lowestRecPPEM, indexToLocFormat from the loca builder. checksumAdjustment is filled by the font assembler, not the table builder. fontc and makeotf both default flags to bits 0 and 1; they differ on lowestRecPPEM (6 against 3)."
ref = "fontc fontbe/src/head.rs, fontir/src/ir/static_metadata.rs; write-fonts src/font_builder.rs; AFDKO hotconv/head.cpp"
status = "docs"

[[table]]
tag = "hhea"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Line metrics (ascender, descender, lineGap) from the default master's global metrics, caret slope rise/run/offset, advanceWidthMax over all glyphs, minimum left and right side bearing and xMaxExtent over glyphs with outlines only, and numberOfHMetrics from the hmtx builder. A FEA table hhea block overrides Ascender, Descender, LineGap and CaretOffset."
ref = "fontc fontbe/src/metrics_and_limits.rs; AFDKO hotconv/hmtx.cpp"
status = "docs"

[[table]]
tag = "hmtx"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "One advance and left side bearing per glyph in glyph order: advance is the default-master width rounded, lsb is the glyph's xMin (0 for empty glyphs). A trailing run of equal advances is collapsed so only the first of the run keeps a full record and the rest store lsb only. For CFF2 fonts this table is the only place advances live."
ref = "fontc fontbe/src/metrics_and_limits.rs; AFDKO docs/CFF2_Support.md"
status = "docs"

[[table]]
tag = "maxp"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "numGlyphs for every font. For TrueType outlines also maxPoints, maxContours, maxCompositePoints, maxCompositeContours, maxComponentElements and maxComponentDepth computed from the built glyphs; fontc writes maxZones 1 and zero for all instruction limits because it emits no instructions. write-fonts picks version 0.5 or 1.0 from which optional fields are set, so the CFF flavours must leave them unset."
ref = "fontc fontbe/src/metrics_and_limits.rs; write-fonts src/tables/maxp.rs; AFDKO docs/CFF2_Support.md"
status = "docs"

[[table]]
tag = "OS/2"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Weight and width class, fsType, vendor id, fsSelection, PANOSE, family class, typo and win metrics, sub/superscript and strikeout metrics, x-height and cap height, xAvgCharWidth, Unicode and code page range bits, first/last char index, default and break char, usMaxContext. Computed fields are derived from cmap, hmtx and GSUB/GPOS; a FEA table OS/2 block overrides only the fields it names. write-fonts derives the table version from which optional fields are present (4 when the version 2 fields are set, 5 with optical size bounds)."
ref = "fontc fontbe/src/os2.rs; write-fonts src/tables/os2.rs; AFDKO docs/MakeOTFUserGuide.md, hotconv/hot.cpp"
status = "docs"

[[table]]
tag = "name"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Name records from font info plus derived defaults for IDs 1, 2, 3, 4, 5, 6 and optionally 16/17, then the axis, instance and STAT label names from ID 256 up, then records from a FEA table name block which replace records with the same platform, encoding, language and name id. fontc and fontmake write Windows platform records only; makeotf writes Windows and Macintosh records unless told to omit the Mac ones."
ref = "fontc fontir/src/ir.rs (NameBuilder), fontbe/src/name.rs; AFDKO docs/MakeOTFUserGuide.md, hotconv/name.cpp"
status = "docs"

[[table]]
tag = "cmap"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Codepoint to glyph map built from every glyph's Unicode values. write-fonts Cmap::from_mappings emits a format 4 subtable shared by the (0,3) and (3,1) encoding records and, only when a supplementary-plane character exists, a format 12 subtable shared by (0,4) and (3,10); fontc adds a format 14 subtable at (0,5) for variation sequences. Typed structs exist for formats 0, 2, 4, 6, 8, 10, 12, 13 and 14, but builders only for 4, 12 and 14."
ref = "write-fonts src/tables/cmap.rs; fontc fontbe/src/cmap.rs; AFDKO hotconv/map.cpp"
status = "docs"

[[table]]
tag = "post"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "italicAngle, underlinePosition, underlineThickness, isFixedPitch and, in version 2.0, the glyph names in glyph order (the 258 standard Macintosh names by index, other names in a deduplicated string pool). write-fonts has a helper only for version 2.0 (Post::new_v2); a version 3.0 table is built by setting the fields directly. fontc always writes 2.0; makeotf writes 3.0 for CFF because the CFF table already carries the names."
ref = "write-fonts src/tables/post.rs; fontc fontbe/src/post.rs; AFDKO hotconv/post.cpp, docs/CFF2_Support.md"
status = "docs"

[[table]]
tag = "glyf"
flavour = ["ttf", "variable-ttf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Quadratic outlines of the default master, one simple or composite glyph per glyph id. write-fonts covers simple glyphs (built from a kurbo BezPath, with an overlaps flag that sets OVERLAP_SIMPLE on the first point and an opaque instruction byte array), composite glyphs (component flags including USE_MY_METRICS, ROUND_XY_TO_GRID and OVERLAP_COMPOUND, 2x2 transforms, instructions) and a GlyfLocaBuilder; it does not assemble instructions and has no cubic (glyf version 1) outlines."
ref = "write-fonts src/tables/glyf.rs, glyf/simple.rs, glyf/composite.rs, glyf/glyf_loca_builder.rs; fontc fontbe/src/glyphs.rs"
status = "docs"

[[table]]
tag = "loca"
flavour = ["ttf", "variable-ttf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Glyph offsets produced together with glyf by GlyfLocaBuilder, which also reports whether the short or long format was chosen so head.indexToLocFormat can be set to match."
ref = "write-fonts src/tables/loca.rs, glyf/glyf_loca_builder.rs; fontc fontbe/src/glyphs.rs"
status = "docs"

[[table]]
tag = "CFF "
flavour = ["otf"]
read = "read-fonts"
write = "own"
area = "compile"
milestone = "M2"
summary = "Cubic outlines as Type 2 charstrings plus Name, Top DICT, String, Global Subr, Charset, CharStrings, Private DICT and Local Subr structures, and FDArray/FDSelect for CID-keyed fonts. read-fonts parses all of it and evaluates charstrings. write-fonts 0.54.0 cannot write it: generated/generated_cff.rs has header, INDEX, FDSelect and charset structs but is not included by any module, and there is no DICT encoder, charstring encoder, specialiser or subroutiniser. fontc has no CFF output at all. Our own writer is crates/cff (M2.3a): name-keyed, unhinted, unsubroutinised. The compiler writes it for Flavour::Cff (M2.3b): over the corpus, 320 of 331 tables decode to fontmake's outlines within half a unit (the rest are source-reading differences) and 195 are byte-identical to fontmake's at --optimize-cff 1."
ref = "read-fonts src/ps/cff/, src/ps/cs.rs; write-fonts src/ps/cff.rs, generated/generated_cff.rs; fontc fontbe/src/font.rs; fontmake USAGE.md; AFDKO docs/MakeOTFUserGuide.md; oracle runs against fontmake 3.12.1 (M2.3b)"
status = "observed"

[[table]]
tag = "vhea"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Written only when the source carries vertical data. Version 1.1; ascender, descender and line gap from the vertical global metrics, vertical caret slope (defaults rise 0, run 1, offset 0), advanceHeightMax, minimum top and bottom side bearing and yMaxExtent from the built glyphs. A FEA table vhea block overrides VertTypoAscender, VertTypoDescender and VertTypoLineGap."
ref = "fontc fontbe/src/vertical_metrics.rs, fontir/src/ir.rs; AFDKO hotconv/hot.cpp"
status = "docs"

[[table]]
tag = "vmtx"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M2"
summary = "Written together with vhea. Advance height per glyph from the glyph's height (or the font default), top side bearing as vertical origin minus the glyph's yMax, with the same trailing-run compression as hmtx."
ref = "fontc fontbe/src/vertical_metrics.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Tables: layout (M8)
# ---------------------------------------------------------------------------------------------------

[[table]]
tag = "GSUB"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M8"
summary = "Substitution lookups compiled from feature code, plus single-substitution lookups and a FeatureVariations table generated from designspace rules or Glyphs bracket layers. write-fonts has typed tables for every lookup type, contextual formats 1 to 3, extension lookups and FeatureVariations with condition formats 1 to 5, and builders for single, multiple, alternate and ligature substitution; contextual and reverse-chain lookups are assembled by fea-rs."
ref = "write-fonts src/tables/gsub.rs, gsub/builders.rs, generated/generated_layout.rs; fontc fea-rs/src/compile/, fontbe/src/features/feature_variations.rs"
status = "docs"

[[table]]
tag = "GPOS"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M8"
summary = "Positioning lookups from feature code plus generated kern/dist, mark, mkmk, abvm, blwm and curs lookups. Values that vary across masters are written as VariationIndex references into the GDEF item variation store. write-fonts has builders for single, pair (glyph and class), cursive, mark-to-base, mark-to-ligature and mark-to-mark positioning, value records and anchors with device or variation deltas."
ref = "write-fonts src/tables/gpos.rs, gpos/builders.rs, gpos/value_record.rs; fontc fontbe/src/features/kern.rs, marks.rs"
status = "docs"

[[table]]
tag = "GDEF"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M8"
summary = "Glyph class definitions (from an explicit FEA GDEF block when present, otherwise from the source's glyph categories), ligature caret list from caret anchors, mark attachment classes and mark glyph sets used by lookup flags, and in variable fonts the ItemVariationStore that GPOS and caret VariationIndex records point into."
ref = "write-fonts src/tables/gdef.rs, generated/generated_gdef.rs; fontc fontbe/src/features.rs, fontbe/src/features/marks.rs"
status = "docs"

[[table]]
tag = "BASE"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M8"
summary = "Baseline tags and per-script baseline coordinates and min/max extents. fontc only emits it when the feature code has a table BASE block and copies fea-rs's result unchanged; write-fonts supports BaseCoord formats 1 to 3 and bumps the version to 1.1 when an item variation store is attached."
ref = "fontc fontbe/src/font.rs; write-fonts src/tables/base.rs, generated/generated_base.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Tables: variations (M9)
# ---------------------------------------------------------------------------------------------------

[[table]]
tag = "fvar"
flavour = ["variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M9"
summary = "One axis record per ranged source axis (axes whose minimum, default and maximum coincide are left out) with name ids from 256 up, and one instance record per named instance with its subfamily name id and optional PostScript name id. If any instance has a PostScript name every instance record must carry the field, using the explicit no-name value for the others."
ref = "fontc fontbe/src/fvar.rs, fontir/src/ir/static_metadata.rs; write-fonts src/tables/fvar.rs, instance_record.rs"
status = "docs"

[[table]]
tag = "avar"
flavour = ["variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M9"
summary = "Per-axis segment maps from default normalisation to the designer's mapping; every axis always gets the three required maps (-1, 0, 1). The table is left out when every map is an identity and there are no cross-axis mappings. With cross-axis mappings it becomes version 2 with an axis index map and an item variation store; write-fonts selects version 2 automatically when either is present."
ref = "fontc fontbe/src/avar.rs; write-fonts src/tables/avar.rs"
status = "docs"

[[table]]
tag = "gvar"
flavour = ["variable-ttf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M9"
summary = "Per-glyph tuple variations for outline points and the four phantom points, one (possibly empty) entry for every glyph in glyf. write-fonts provides Gvar::new with shared peak tuples (tuples used more than once, most frequent first, at most 4095), shared point numbers, packed deltas, automatic long offsets, and the IUP optimiser in gvar/iup.rs."
ref = "write-fonts src/tables/gvar.rs, gvar/iup.rs, variations.rs; fontc fontbe/src/gvar.rs, fontbe/src/glyphs.rs"
status = "docs"

[[table]]
tag = "HVAR"
flavour = ["variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M9"
summary = "Advance width deltas for every glyph. fontc builds an indirect store with a glyph to delta-set index map and, when all glyphs share one variation model, also a direct store indexed by glyph id, then keeps the direct one if it is no larger than store plus map. Side bearing mappings are not written. Required for CFF2 because CFF2 has no phantom points."
ref = "fontc fontbe/src/hvar.rs, fontbe/src/metric_variations.rs; write-fonts src/tables/hvar.rs, variations/ivs_builder.rs; AFDKO docs/CFF2_Support.md"
status = "docs"

[[table]]
tag = "VVAR"
flavour = ["variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M9"
summary = "Advance height deltas, built exactly like HVAR (direct or indirect store, whichever is smaller) and only when the font has vertical metrics, that is when vmtx is written."
ref = "fontc fontbe/src/vvar.rs; write-fonts src/tables/vvar.rs"
status = "docs"

[[table]]
tag = "MVAR"
flavour = ["variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M9"
summary = "Deltas for the global metrics that have an MVAR value tag (OS/2 typo and win metrics, x-height, cap height, sub/superscript, strikeout, underline, caret values and so on); hhea ascender, descender and line gap have no tag and are skipped. Metrics whose deltas are all zero are not encoded and the table is omitted when nothing varies."
ref = "fontc fontbe/src/mvar.rs; write-fonts src/tables/mvar.rs; AFDKO docs/CFF2_Support.md"
status = "docs"

[[table]]
tag = "STAT"
flavour = ["ttf", "otf", "variable-ttf", "variable-otf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M9"
summary = "Design axis records and axis value tables with their flags (elidable, older sibling) and the elided fallback name id (default name id 2). Axis value format is 3 when a linked value is given, 2 when a range bound is given (a missing bound becomes the Fixed minimum or maximum), otherwise 1; format 4 exists in write-fonts but fontc does not emit it. A STAT block in feature code replaces the generated table. It is also valid in a static font."
ref = "fontc fontbe/src/stat.rs, fontbe/src/font.rs, fontir/src/ir/static_metadata.rs; write-fonts src/tables/stat.rs"
status = "docs"

[[table]]
tag = "CFF2"
flavour = ["variable-otf"]
read = "read-fonts"
write = "none-yet"
area = "compile"
milestone = "M9"
summary = "Variable cubic outlines: charstrings with blend operators, a variation store, FDArray/Private DICTs with blended hint values, no glyph names, no widths and no encoding. read-fonts parses it and evaluates blends. write-fonts 0.54.0 exposes only a Cff2Header struct (raw Top DICT bytes and raw trailing bytes) and Index::from_items; DICT encoding, charstring encoding with blend, the variation store placement and subroutinisation are missing. fontc does not produce it; fontmake does with -o variable-cff2 and AFDKO with buildmasterotfs plus buildcff2vf."
ref = "write-fonts src/ps/cff/v2.rs, generated/generated_cff2.rs; read-fonts src/ps/cff/v2.rs, blend.rs; fontmake README.md; AFDKO docs/CFF2_Support.md"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Tables: hinting (M10)
# ---------------------------------------------------------------------------------------------------

[[table]]
tag = "gasp"
flavour = ["ttf", "variable-ttf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M10"
summary = "Grid-fitting and smoothing ranges from the source, sorted by rangeMaxPPEM, version 1. Omitted when the source defines no ranges."
ref = "fontc fontbe/src/gasp.rs; write-fonts src/tables/gasp.rs"
status = "docs"

[[table]]
tag = "cvt "
flavour = ["ttf", "variable-ttf"]
read = "read-fonts"
write = "own"
area = "compile"
milestone = "M10"
summary = "Control values as a plain array of big-endian int16. read-fonts returns the array; write-fonts has no table type for it, so we serialise the values ourselves and add them with FontBuilder::add_raw. None of fontc, fontmake or makeotf generates it from stems and zones; fontmake only gets it by running ttfautohint as a post step."
ref = "read-fonts src/table_provider.rs (cvt); write-fonts src/tables.rs; fontmake USAGE.md (-a)"
status = "docs"

[[table]]
tag = "fpgm"
flavour = ["ttf", "variable-ttf"]
read = "own"
write = "own"
area = "compile"
milestone = "M10"
summary = "Font program bytecode. Neither crate has a typed view (read-fonts hands back the raw bytes; skrifa can execute them), so decoding to mnemonics and assembling from our hinting model is ours, and the bytes go in through add_raw. Writing it also obliges us to fill maxp's function, storage, stack and instruction limits, which fontc leaves at zero."
ref = "read-fonts src/table_provider.rs; skrifa src/outline/glyf/hint; fontc fontbe/src/metrics_and_limits.rs"
status = "docs"

[[table]]
tag = "prep"
flavour = ["ttf", "variable-ttf"]
read = "own"
write = "own"
area = "compile"
milestone = "M10"
summary = "Control value program bytecode, handled exactly like fpgm: raw bytes in and out, with our own assembler and disassembler."
ref = "read-fonts src/table_provider.rs; skrifa src/outline/glyf/hint"
status = "docs"

[[table]]
tag = "cvar"
flavour = ["variable-ttf"]
read = "read-fonts"
write = "write-fonts"
area = "compile"
milestone = "M10"
summary = "Tuple variations for cvt values: one scalar delta per control value per region. write-fonts has a builder taking tents and delta lists (CvarVariationData). No reference compiler here generates it from source hinting data, so the input model is ours."
ref = "write-fonts src/tables/cvar.rs"
status = "docs"

# ---------------------------------------------------------------------------------------------------
# Tables: colour and images (M11)
# ---------------------------------------------------------------------------------------------------

[[table]]
