notes = "Built in M13.63: a strike glyph stores its references (`crates/model/src/strike.rs`, `BitmapReference`: the drawn glyph and a pixel offset of its origin), set with `bitmap.setPixels` `references`. The model refuses a reference to the glyph itself, references that lead back to a glyph, chains more than 8 deep, more than 64 references on one glyph, more than 4,096 bitmaps drawn for one glyph, and a drawn-in bitmap over 1,024 pixels a side. `bitmap.exportStrikes` draws references into the pixels, since the bitmap file formats and our `EBDT` writer hold pixels only; a pixel drawn twice takes the darker level. Renaming a glyph renames the references to it; deleting it or removing its bitmap removes them. Building an accented composite does not yet make bitmap references. Documented, not yet observed. Moved from M11 to M13 by the M11 planning pass (owner decision M3 § 7, question 3; M5 § 7, question 5)."
origin = "fontforge"
guesses = [
  "Where a reference overlaps the glyph's own pixels or another reference, the darker level wins.",
  "References are drawn in on export rather than written as composite bitmaps (`EBDT` formats 8 and 9).",
  "A reference names a glyph by name, and a reference to a bitmap that is later removed draws nothing until it is removed too.",
]

