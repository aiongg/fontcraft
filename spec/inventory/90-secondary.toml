[[command]]
id = "kerning.autoKern"
label = "Auto Kern"
menu = ["Font", "Kerning"]
shortcut = ""
kind = "engine"
params = "{pairs?: [[left, right]], glyphsLeft?: [names], glyphsRight?: [names], masters?: [id], separation?: number, minKern?: number, onlyCloser?: bool, touching?: bool, keepExisting?: bool}"
area = "spacing-kerning"
milestone = "M13"
summary = "Proposes kerning values for the given pairs from the optical gap between the two glyph profiles, aiming at a target separation. Options drop values too small to matter, restrict results to tightening, or let glyphs touch; existing pairs are kept unless told otherwise (FontLab key in kerning mode: semicolon)."
ref = "FontLab 8 What's new › Metrics & kerning › Kerning (autokerning); FontLab 7 manual › Pairs and Phrases panel; FontForge dialogs › Lookups (pair kerning subtable: Default Separation, Min Kern, Touching, Only kern closer)"
status = "docs"
origin = "fontlab"
notes = "Moved from M5 to M13 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 5): it goes beyond the primary reference, like the secondary drawing aids the M3 pass moved (docs/plans/M5.md § 2)."
guesses = [
  "The proposed value is the target separation minus the pair's optical gap, the mean horizontal distance between the left glyph's right profile and the right glyph's left profile over the same band and depth clipping as auto-spacing, rounded to the nearest 5 units by default; the target separation defaults to the optical gap of a reference pair (n n for lowercase, H H for capitals) without kerning. FontLab documents neither K1 nor K2 (open decision D11).",
]

[[command]]
