# =====================================================================================================
# FontLab — elements, references, live filters, composites
# =====================================================================================================

[[command]]
id = "component.copyTransformation"
label = "Copy Component Transformation"
menu = ["Edit"]
shortcut = ""
kind = "engine"
params = "{glyph: name, layer?: id, component: index, to: [{glyph?: name, layer?: id, components: [indices]}]}"
area = "components"
milestone = "M13"
summary = "Copies the position and live scale, rotation and slant of one element or component so they can be pasted onto others. FontCraft: copies one component's transform (position, scale, rotation, slant) and applies it to the components named in `to`, in one undo step."
ref = "FontLab 8 What's new › Build & assemble › Elements (Copy transformation)"
status = "docs"
origin = "fontlab"
notes = "FontCraft has no element references (open decision D7, docs/plans/M13.md § 7 question 3), so the command works on components only and its label names components. The reference's label is Copy Element Transformation. Copy and paste are one command with explicit source and targets, so no transform clipboard is kept. Documented, not yet observed."
guesses = [
  "A target entry without `glyph` or `layer` means the source glyph and the source layer's id; the reference copies to whatever is selected, so it has no such default.",
  "An automatically aligned target takes the scale, rotation and slant but keeps the position alignment gives it on the aligned axes; the reference has no automatic alignment, so nothing settles this but use.",
]

[[command]]
id = "font.detectComposites"
label = "Detect Composites"
menu = ["Font"]
shortcut = ""
kind = "engine"
params = "{glyphs?, layer? | layers?, tolerance?: number, flips?: bool}"
area = "components"
milestone = "M13"
summary = "Scans the glyphs for outlines that repeat the complete outline of another glyph and replaces each match with a component. Useful after opening a compiled font whose composites were flattened; FontForge documents the same job as Edit › Replace with Reference."
ref = "FontLab 8 What's new › Build & assemble › Components (Detect Composites); FontForge Edit menu › Replace With Reference"
status = "docs"
origin = "fontlab"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). Documented, not yet observed. Built on the outline matcher (`pathops::matcher`): base outlines are indexed by the signature of their largest contour, so a font is searched without comparing every glyph with every other, and one run's work is capped."
guesses = [
  "A match needs every point of the other glyph's outline within 0.5 unit after the best translation, or after a translation and flip when `flips` is on; FontLab gives no tolerance.",
  "Only glyphs whose layer has closed paths and no components serve as bases; running it in the reference app on a font whose base glyphs are themselves composites would settle it.",
  "Bases are tried from the most nodes down, a base must have fewer nodes than the target or as many and come earlier in the glyph order (no cycles), and among bases of equal size one whose name (without suffix and 'comb') appears in the target's name goes first; comparing the reference app's choice between identical outlines (period and dotaccentcomb) would settle it.",
  "Without `layer` or `layers` every master layer is searched, each on its own, and a glyph whose masters got different components is warned about; the reference app's behaviour on a multi-master font would settle it.",
  "A mirrored match is a mirrored copy drawn in the opposite direction, as a mirrored component draws once decomposed; the offset is rounded to the font's grid when the match still holds.",
  "A detected component keeps the default automatic alignment when aligning puts it where the outline was (within the tolerance) and leaves the width as it is; alignment is turned off on the components it would move, and on all new components of a layer whose width it would change, as the primary reference's Import Metrics does for metrics that alignment would change. Checking the alignment setting of components the reference app detected, with and without matching anchors, would settle it.",
]

[[command]]
id = "path.detectComponent"
label = "Detect Component"
menu = ["Path", "Convert"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, shapes?: [indices], tolerance?: number, flips?: bool}"
area = "components"
milestone = "M13"
summary = "Looks for a glyph whose whole outline equals the selected paths and, when found, replaces the selection with a component of it."
ref = "FontLab 8 What's new › Build & assemble › Components (Detect Component)"
status = "docs"
origin = "fontlab"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). Documented, not yet observed. The selection is given as shape indices (`paths` is accepted as another name for `shapes`); without one, every path of the layer is the outline searched for."
guesses = [
  "The first glyph in font order whose same-id layer has only closed paths equal to the selection wins, within 0.5 unit after a translation (and a flip with `flips`); selecting an outline shared by two glyphs in the reference app would settle which one it picks.",
  "No matching glyph is an error that changes nothing; the reference app's message or silence when nothing matches would settle it.",
  "The new component keeps the default automatic alignment unless aligning would move it beyond the tolerance or change the width, and then alignment is off on it; alignment is judged on the layer as it ends up, so a component next to remaining paths keeps the default. Checking the alignment setting of a component the reference app detected would settle it.",
]
observe = [
  "Draw a copy of a glyph's outline in another glyph, select it and run Detect Component: note which glyph the component names and where it sits.",
  "Select an outline no glyph has and run Detect Component: note the message, if any.",
]

[[command]]
id = "glyph.setAutoLayerRecipe"
label = "Set Auto Layer Recipe"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyph?, glyphs?, masters?: [id], recipe?: string, auto?: bool}"
area = "components"
milestone = "M13"
summary = "Marks a glyph layer as automatic and stores the recipe it is built from. An automatic layer is rebuilt whenever its sources change, and is created empty-but-pending when a component source does not exist yet so it fills in once that glyph is added. A companion action copies the recipe to all masters."
ref = "FontLab 8 What's new › Build & assemble › Components, auto layers, mark attachment"
status = "docs"
origin = "fontlab"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). FontCraft (M13.16): the recipe is a string in the layer's user data (`com.fontcraft.autoLayerRecipe`); after every font-changing command the engine rebuilds the automatic layers whose glyph changed or whose recipe names a glyph that was added or removed, and automatic alignment then places the components. Documented by the reference, not yet observed."
guesses = [
  "`masters` defaults to every master, which covers the reference's companion action that copies the recipe to all masters; seeing whether that action is a command of its own would settle it.",
  "Without `recipe`, a glyph keeps the recipe one of its layers has, else takes the components its name decomposes into by Create Composite's rules; the reference's default recipe is not documented.",
  "An automatic layer holds only the recipe's components: paths or components added by hand are replaced at the next rebuild; whether the reference lets one draw on an automatic layer would settle it.",
  "A recipe whose components contain the glyph is refused, and a layer whose recipe becomes circular later stays empty.",
  "Recipe parts are glyph names only, without placement suffixes such as `@anchor`.",
]

[[behavior]]
id = "recipe.directives"
area = "components"
milestone = "M13"
summary = "Recipe text accepts directives beside glyph names: a comment marker for ignored notes, a marker that copies the rest of the line into the glyph note, and a no-anchors keyword that stops the built glyph from inheriting anchors from its sources at export (reference spellings: # comment, #! note, #?noanchors)."
ref = "FontLab 8 What's new › Build & assemble › Components, auto layers, mark attachment"
status = "docs"
origin = "fontlab"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). FontCraft (M13.16): read by `fontcraft_components::auto_layer`; with `#?noanchors` anchor propagation gives the layer only its own anchors, so export, the mark feature and composites built on the glyph see no inherited anchors. Documented by the reference, not yet observed."
guesses = [
  "A recipe has one line of components; directives may follow it on that line or stand on lines of their own, several `#!` lines are joined with line breaks, and the note is written when the recipe is set, not at every rebuild.",
  "An unknown `#?` keyword is refused, and `noanchors` is matched without regard to case; the reference's handling is not documented.",
]

