[[behavior]]
id = "constructions.ruleGrammar"
area = "components"
milestone = "M13"
summary = "A construction rule names a target glyph, an equals sign and the parts it is built from, joined by plus signs. A part may be placed with an at sign: by coordinates, percentages, a transform matrix, keywords such as center and top, or an anchor of another glyph, and a backtick formula may compute a coordinate; an ampersand sets parts side by side, optionally kerned. A caret sets the width or the margins from numbers or other glyphs, a bar sets code points, an exclamation mark a colour label, and a hash starts a comment or a glyph note. Prefixes ask to decompose the result or to skip glyphs that exist; dollar variables are declared once and used in braces; flag comments set options for the whole file."
ref = "Glyph Construction README (github.com/typemytype/GlyphConstruction, MIT), linked from RoboFont topics › Accented glyphs"
status = "docs"
origin = "robofont"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). Verified by the M13 planning pass against the project's README. M13.17 ports the project's parser (MIT) to Rust with credit in the file header and NOTICE; the README's examples become tests."

