[[command]]
id = "font.buildFromConstructions"
label = "Build Glyphs from Constructions…"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{rules?: string, path?: path (one of the two), glyphs?: [names], masters?: [id], overwrite?: bool, autoUnicodes?: bool, markColor?: [r, g, b, a] | false, preview?: bool}"
area = "components"
milestone = "M13"
summary = "Builds or rebuilds composite glyphs from a text file of construction rules. Beyond anchor-to-anchor attachment a rule can position a part against a guideline, at a distance or percentage of a metric, at a named reference point of another glyph, or through a transform matrix, and can set width and vertical metrics. With preview it returns the results without storing them."
ref = "RoboFont topics › Accented glyphs (Glyph Construction positioning); RoboFont technical specification (embedded libraries: glyphConstruction)"
