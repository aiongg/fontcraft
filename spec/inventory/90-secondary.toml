  "The document's own unsaved edits are kept and never listed, so Update All merges rather than reloads; the manual speaks of taking the incoming change, and a document with unsaved edits in the reference settles whether it keeps them.",
  "Font-level data is grouped into nine parts (info, axes, masters, instances, kerning, features, groups, glyph order, other), each accepted whole; the manual mentions font-level data without saying how finely it is split.",
