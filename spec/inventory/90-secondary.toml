# =====================================================================================================
# FontLab — elements, references, live filters, composites
# =====================================================================================================

[[behavior]]
id = "element.referenceModel"
area = "components"
milestone = "M13"
summary = "An element reference is a shared shape with no owning glyph: every glyph that uses it holds an equal reference, and editing the shape's nodes in any of them changes all. This differs from a component, whose content belongs to one source glyph and which also brings that glyph's anchors and hints."
ref = "FontLab 8 What's new › Build & assemble › Elements and components"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "element.perOccurrenceTransform"
area = "components"
milestone = "M13"
summary = "Each occurrence of a shared element keeps its own live scale, rotation, slant, flip and position. Transforming with the element-level tool changes only that occurrence; transforming the nodes inside changes every occurrence."
ref = "FontLab 8 What's new › Build & assemble › Elements and components"
status = "docs"
origin = "fontlab"

[[command]]
id = "element.newFromSelection"
label = "Selection to New Element"
menu = ["Path", "Convert"]
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, paths?: [pathRef], name?: string}"
area = "components"
milestone = "M13"
summary = "Moves the selected paths into a new named shared element, leaving a reference to it in place. Named elements appear in the element gallery for reuse in other glyphs."
ref = "FontLab 8 What's new › Build & assemble › Elements (To New Element)"
status = "docs"
origin = "fontlab"

[[command]]
id = "element.detectReferences"
label = "Detect Element References"
menu = ["Path", "Convert"]
shortcut = ""
kind = "engine"
params = "{glyphs?, layer?, paths?: [pathRef]}"
area = "components"
milestone = "M13"
summary = "Finds identical copies of the selected paths in other glyphs and replaces them all with references to one shared element."
ref = "FontLab 8 What's new › Build & assemble › Elements (Detect Element Reference)"
status = "docs"
origin = "fontlab"

[[command]]
id = "element.linkReference"
