# Secondary references: features the primary reference (Glyphs 4 handbook) lacks or leaves to plug-ins.
# Sources (public user documentation only, read 2026-10-07):
#   FontLab 8 "What's new" pages      https://help.fontlab.com/fontlab/8/whats-new/
#   FontLab 7 User Manual (the detailed manual the FontLab 8 help site still relies on)
#                                     https://help.fontlab.com/fontlab/7/manual/
#   RoboFont documentation            https://robofont.com/documentation/
#   FontForge user documentation      https://fontforge.org/docs/        (docs only; no source code read)
#   Fontra documentation              https://docs.fontra.xyz/           (docs only; no source code read)
# Date: 2026-10-07
#
# Conventions specific to this file:
# - Every row carries `origin`. `status = "docs"` means the feature was read on a public doc page;
#   `status = "memory"` means recalled and not confirmed on a page; `status = "inferred"` is our design.
# - `shortcut` is left empty on purpose: the primary reference owns the keymap. Where the secondary
#   reference documents a key, the summary quotes it as "(FontLab key: L)" so it can be offered as an
#   alternative binding later.
# - No [[format]] rows here (another file owns formats); legacy formats appear only as the commands
#   that import or export them.

# =====================================================================================================
# FontLab — drawing aids, curve tension, measuring, snapping
# =====================================================================================================

[[command]]
id = "view.showTunniLines"
label = "Tunni Lines"
menu = ["View"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Toggles Tunni lines: for every curve segment, a dotted line joining its two handle ends plus a control dot where the extended handles meet. They are the canvas handles for balanced tension editing (FontLab key: L, tap to toggle or hold to show temporarily)."
ref = "FontLab 7 manual › Tunni Lines; FontLab 8 What's new › Explore & prepare › View panel"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.selectTunniLines"
label = "Edit Tunni Lines"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph?, layer?, segments?: [segmentRef]}"
area = "drawing"
milestone = "M13"
summary = "Selects the Tunni lines of every curve segment inside the current selection, or of all curve segments on the layer when nothing is selected, and switches Tunni line display on. With Tunni lines visible, Select All selects them all."
ref = "FontLab 7 manual › Tunni Lines; FontLab 8 What's new › Edit & refine › Selecting contours"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "tunni.dragLineSymmetric"
area = "drawing"
milestone = "M13"
summary = "Dragging a Tunni line (or Shift-dragging its control dot) lengthens or shortens both handles of the segment together, keeping their directions, so the curve tension changes symmetrically. With several Tunni lines selected (Shift-click to add), dragging any one applies the same change to all."
ref = "FontLab 7 manual › Tunni Lines"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "tunni.dragPointAsymmetric"
area = "drawing"
milestone = "M13"
summary = "Alt-dragging a Tunni line, or dragging its control dot without Shift, moves only one handle of the segment, giving an asymmetric tension change."
ref = "FontLab 7 manual › Tunni Lines"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.setCurveTension"
label = "Set Curve Tension"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{segments?: [segmentRef], tension: percent, relative?: bool}"
area = "drawing"
milestone = "M13"
summary = "Sets both handles of the selected curve segments to a proportional tension given in percent of the distance to the handle intersection (the same percentage a Tunni line reports), or adjusts the current tension by a signed step when relative is true."
ref = "FontLab 8 What's new › Edit & refine › Curve segments (Node panel: Set proportional curve tension)"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.showCurveTension"
label = "Show Curve Tension"
menu = ["View", "Show"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Shows the tension of each curve segment next to it as a percentage of handle length, together with the lengths-and-angles readout it depends on."
ref = "FontLab 8 What's new › Consistency & precision › Measuring details"
status = "docs"
origin = "fontlab"

[[parameter]]
name = "curveTension"
scope = ["master"]
kind = "number"
area = "drawing"
milestone = "M13"
summary = "Default curve tension (percent) used by tension-driven drawing tools such as the Rapid tool and by tension-based ovals. Stored per master with the font dimensions."
ref = "FontLab 8 What's new › Draft & draw › Drawing contours (Font Info › Font Dimensions › Curve tension)"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.harmonizeNodes"
label = "Harmonize Nodes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef], glyphs?, layer?}"
area = "path-ops"
milestone = "M13"
summary = "Moves each selected smooth node along its handle line to the position where the curvature on both sides is equal (G2 continuity), leaving the handles where they are. Applies to all smooth nodes of the layer when nothing is selected. FontForge documents the same idea as Element › Align › Harmonize."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles; FontForge Element menu › Align"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.harmonizeHandles"
label = "Harmonize Handles"
menu = ["Path", "Handles"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef], order?: 'g2' | 'g3'}"
area = "path-ops"
milestone = "M13"
summary = "Reaches curvature continuity at the selected smooth nodes by changing handle lengths while the nodes stay put. Order g3 (Superharmonize in the reference) also equalises the rate of curvature change."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.togglePowerNudge"
label = "Power Nudge"
menu = ["Path"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Switches the node-dragging mode in which the unselected neighbours of a moved selection are sorted automatically into fixed points and servant points that follow proportionally, so a stem or bowl can be moved without distorting what joins it (FontLab keys: Shift+C to toggle, hold C for temporary use)."
ref = "FontLab 8 What's new › Edit & refine › Contour tool"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.setServantNode"
label = "Set Servant Node"
menu = ["Path", "Nodes"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef], axis: 'x' | 'y' | 'none'}"
area = "drawing"
milestone = "M13"
summary = "Declares the selected nodes as servants on the x or y axis so they always follow neighbouring edits proportionally on that axis, or clears the declaration with axis none. An optional status display marks every node as x-servant, y-servant or static."
ref = "FontLab 8 What's new › Edit & refine › Contour tool (Servant declarations; Clear Genius & Servant)"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "nodes.slideAlongCurve"
area = "drawing"
milestone = "M13"
summary = "A slide drag moves a node along its existing curve without changing the curve's shape, and past the end extends the curve; arrow keys do the same for a single node while the mode is on (FontLab: Shift+Alt-drag). RoboFont documents the related Cmd-drag that slides a smooth on-curve point between its two handles."
ref = "FontLab 8 What's new › Edit & refine › Contour tool (Slide); RoboFont reference › Editing Tool"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "drag.leverPrecision"
area = "drawing"
milestone = "M13"
summary = "With the lever modifier held, a dragged node, handle, sidebearing or kerning value moves by 1/n of the pointer distance so fine corrections do not need zooming in. The ratio is a setting; holding Shift in metrics and kerning modes restores 1:1."
ref = "FontLab 8 What's new › Edit & refine › Contour lever; Metrics & kerning › lever precision dragging"
status = "docs"
origin = "fontlab"

[[setting]]
id = "editing.leverRatio"
label = "Lever Ratio"
section = "Editing"
kind = "number"
values = "1 (off) to 100"
area = "drawing"
milestone = "M14"
summary = "Divisor applied to pointer movement during lever dragging. The reference defaults to 6 for contours and suggests 4 to 10 for spacing; 1 disables the lever."
ref = "FontLab 8 What's new › Edit & refine (Preferences › Distances › Contour lever); Metrics & kerning"
status = "docs"
origin = "fontlab"

[[tool]]
id = "rapid"
label = "Rapid"
shortcut = ""
group = ""
gestures = [
  "click: add a node of the current sub-mode (corner, curve or tangent); handles are placed automatically from the default curve tension",
  "click a tension point: adjust how tight that one segment is",
  "Cmd+Alt+click: add a tangent node when no sub-mode is latched",
  "Esc or switching tools: finish the contour",
]
area = "drawing"
milestone = "M13"
summary = "Draws contours by clicking on-curve positions only; the tool supplies handles with a consistent tension, which suits tracing a scan quickly. Each segment keeps a tension point for later adjustment (FontLab key: 5)."
ref = "FontLab 8 What's new › Draft & draw › Drawing contours"
status = "docs"
origin = "fontlab"

[[tool]]
id = "thickness"
label = "Thickness"
shortcut = ""
group = ""
gestures = [
  "Shift+drag a control point: change the thickness of the whole stroked path",
  "Alt+drag a control point: change the thickness at one node, on both sides",
  "Shift+Alt+drag: shift the stroke from one side of the skeleton to the other without changing its width",
  "Backspace on a control point: drop the per-node value and fall back to the path value",
  "marquee several control points: edit them together",
]
area = "path-ops"
milestone = "M13"
summary = "Edits the width of a live stroke on canvas, per path and per node, so a skeleton can carry modulated contrast before it is expanded to outlines (FontLab key: 8). The primary reference has per-path stroke width only."
ref = "FontLab 8 What's new › Draft & draw › Thickness tool"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.makeInkTrap"
label = "Make Ink Trap"
menu = ["Path", "Nodes"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef], width?: number}"
area = "path-ops"
milestone = "M13"
summary = "Turns each selected corner node into a simple ink trap by duplicating the node and separating the two copies by the ink trap width, which defaults to a per-master font dimension."
ref = "FontLab 8 What's new › Edit & refine › Scissors tool; Ink traps and rounded corners"
status = "docs"
origin = "fontlab"

[[parameter]]
name = "inkTrapWidth"
scope = ["master"]
kind = "number"
area = "path-ops"
milestone = "M7"
summary = "Default opening width of generated ink traps. The short-segment audit check also uses it as its length threshold."
ref = "FontLab 8 What's new › Edit & refine › Ink traps (Font Info › Font Dimensions); Test & adjust › FontAudit"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.loopCorner"
label = "Loop Corner"
menu = ["Path", "Nodes"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef]}"
area = "path-ops"
milestone = "M13"
summary = "Replaces each selected corner node with a small loop that extends both adjoining segments past the corner and crosses them, which keeps corners sharp under offsetting and interpolation. A font-level option decides whether the loop area counts as filled."
ref = "FontLab 8 What's new › Edit & refine › Scissors tool (Loop Corner)"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.replaceWithCorner"
label = "Replace with Corner"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{segments?: [segmentRef]}"
area = "path-ops"
milestone = "M13"
summary = "Deletes the selected segment, or the gap of an open contour, and joins its two neighbours in a sharp corner at the point where their extensions intersect."
ref = "FontLab 8 What's new › Edit & refine › Other contour operations"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.alignToMask"
label = "Align Points to Background"
menu = ["Path", "Align Points"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef], tolerance?: number}"
area = "path-ops"
milestone = "M13"
summary = "Moves each selected point onto the nearest point of the background (mask) layer when one lies within the tolerance; the reference uses 50 units."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles (Align Points › To Mask)"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.collapsePoints"
label = "Collapse Points"
menu = ["Path", "Align Points"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef]}"
area = "path-ops"
milestone = "M13"
summary = "Moves the selected nodes to their common centre and retracts their handles to zero length."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles (Align Points › Collapse)"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.scaleToSameSize"
label = "Same Width / Same Height"
menu = ["Path", "Align Points"]
shortcut = ""
kind = "engine"
params = "{paths?: [pathRef], dimension: 'width' | 'height', proportional?: bool}"
area = "path-ops"
milestone = "M13"
summary = "Scales several selected paths about their own centres so they share one width or height, either proportionally or along that dimension only. With one path selected the target is the advance width, x-height or cap height."
ref = "FontLab 8 What's new › Edit & refine › Node names (Scale paths to same width or height)"
status = "docs"
origin = "fontlab"

[[panel]]
id = "palette.selections"
label = "Selections"
location = "palette"
controls = ["list of named selections stored with the glyph", "Add, Update and Remove buttons", "click an entry to restore that selection"]
area = "drawing"
milestone = "M13"
summary = "Stores node selections per glyph under names and recalls them later, also on the matching nodes of other compatible masters. Selection changes get their own undo steps, separate from edits."
ref = "FontLab 8 What's new › Edit & refine › Selecting contours"
status = "docs"
origin = "fontlab"

[[command]]
id = "edit.storeSelection"
label = "Store Selection"
menu = ["Edit", "Selection"]
shortcut = ""
kind = "engine"
params = "{glyph?, name: string, nodes?: [nodeRef]}"
area = "drawing"
milestone = "M13"
summary = "Saves the current node selection of the glyph under a name in the glyph's data, replacing an existing entry of that name."
ref = "FontLab 8 What's new › Edit & refine › Selections panel"
status = "docs"
origin = "fontlab"

[[command]]
id = "edit.recallSelection"
label = "Recall Selection"
menu = ["Edit", "Selection"]
shortcut = ""
kind = "ui"
params = "{glyph?, name: string, layer?}"
area = "drawing"
milestone = "M13"
summary = "Selects the nodes recorded in a stored selection; on another compatible master the nodes with the same indexes are selected."
ref = "FontLab 8 What's new › Edit & refine › Selections panel"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.lockOutline"
label = "Lock Outline"
menu = ["View", "Lock"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Blocks pointer and keyboard editing of outlines in the window while leaving guides, anchors and metrics editable, and shows a lock badge on the canvas. Commands run through the registry are not affected."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles (Lock outline)"
status = "docs"
origin = "fontlab"

# --- measuring -----------------------------------------------------------------------------------

[[command]]
id = "view.showStemWidths"
label = "Show Stem Widths"
menu = ["View", "Measure"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "Labels every detected stem of the visible glyphs with its width, measured between opposing segments whose end nodes are extremes. Detection is limited to a per-font minimum and maximum width (reference default 20 to 250 units)."
ref = "FontLab 8 What's new › Consistency & precision › Auto-meter"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.showCounterWidths"
label = "Show Counter Widths"
menu = ["View", "Measure"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "Labels the white space between adjacent stems (counter width or height) in the same way stem widths are labelled."
ref = "FontLab 8 What's new › Consistency & precision › Auto-meter"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.showCornerAngles"
label = "Show Corner Angles"
menu = ["View", "Measure"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "Shows the angle at each sharp node once the view is zoomed in far enough to fit the label."
ref = "FontLab 8 What's new › Consistency & precision › Auto-meter"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "autometer.editStemNumerically"
area = "guides-metrics"
milestone = "M13"
summary = "A stem-width label on canvas is editable: clicking it accepts a typed width or Up/Down steps and the stem's nodes move to match. Labels are colour-coded as a common stem, an uncommon stem within the irregular-stem tolerance, or other, and a marker on a near-miss snaps it to the nearest common stem."
ref = "FontLab 8 What's new › Consistency & precision › Auto-meter (Editing stems numerically; Automatic stem adjustment)"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.showQuickMeasurement"
label = "Quick Measurement"
menu = ["View", "Measure"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "While on, hovering between two opposite segments shows the distance between them without a tool switch; Shift restricts the measure to horizontal or vertical. Hovering a guide or metric line shows its distance to the nearest segments, and optionally anchors report their distance to metric lines and sidebearings."
ref = "FontLab 8 What's new › Consistency & precision › Quick measurement"
status = "docs"
origin = "fontlab"

[[panel]]
id = "palette.measurements"
label = "Measurements"
location = "palette"
controls = ["table of design values per master: vertical dimensions, overshoots, contrast, stem widths", "Recalculate button for the selected cells", "icon per design feature"]
area = "guides-metrics"
milestone = "M13"
summary = "A per-master table of design measurements that can be typed in or recalculated from the outlines. The values are working notes: they feed stem suggestions and audits but are never exported."
ref = "FontLab 8 What's new › Consistency & precision › Measurements panel"
status = "docs"
origin = "fontlab"

[[command]]
id = "font.recalculateMeasurements"
label = "Recalculate Measurements"
menu = ["Font"]
shortcut = ""
kind = "engine"
params = "{masters?: [id], fields?: [name]}"
area = "guides-metrics"
milestone = "M13"
summary = "Measures the chosen design values (heights, overshoots, common stem widths) from the outlines of each master and writes them into the measurements table."
ref = "FontLab 8 What's new › Consistency & precision › Measurements panel (Auto-calculation)"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.showDetailsAcrossGlyphs"
label = "Details Across Glyphs"
menu = ["View"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "edit-text"
milestone = "M13"
summary = "Draws nodes, measurements and other detail overlays for every glyph in the text line instead of only the active one, so stems and overshoots can be compared across a word."
ref = "FontLab 8 What's new › Explore & prepare › View menu (canvas); Test & adjust › Stem discovery methods"
status = "docs"
origin = "fontlab"

# --- snapping suggestions ---------------------------------------------------------------------------

[[command]]
id = "view.suggestHandles"
label = "Suggest Handles"
menu = ["View", "Suggest"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "While a handle is dragged, offers snap targets that make it horizontal or vertical, match the angle of the opposite handle of the segment, or stand at 90 degrees to it."
ref = "FontLab 8 What's new › Consistency & precision › Snapping suggestions"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.suggestLines"
label = "Suggest Lines"
menu = ["View", "Suggest"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "While a node is dragged, shows temporary snap lines: the continuation of nearby line segments and handle vectors at any angle, perpendiculars to diagonal guides, and the centrelines of stems, counters, hints and thick guides."
ref = "FontLab 8 What's new › Consistency & precision › Snapping suggestions"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.suggestDistance"
label = "Suggest Distance"
menu = ["View", "Suggest"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "Shows snap outlines at fixed distances from existing contours and open skeletons, so a parallel edge can be drawn at a set weight. The distances come from the per-master suggestDistance values."
ref = "FontLab 8 What's new › Consistency & precision › Snapping suggestions; Draft & draw › Working with stroke"
status = "docs"
origin = "fontlab"

[[parameter]]
name = "suggestDistance"
scope = ["master"]
kind = "dict"
area = "guides-metrics"
milestone = "M7"
summary = "Horizontal and vertical distances ({x, y}) at which the Suggest Distance snapping aid offers parallel snap outlines."
ref = "FontLab 8 What's new › Consistency & precision (Font Info › Other Values › Suggest distance)"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.suggestStems"
label = "Suggest Stems"
menu = ["View", "Suggest"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "guides-metrics"
milestone = "M13"
summary = "While an edge is dragged, snaps the thickness being formed to the master's declared horizontal and vertical stem values. Stems may carry tags (uc, lc, sc, fig, a script tag) that limit the glyphs in which they are suggested."
ref = "FontLab 8 What's new › Draft & draw › Working with stroke (Suggest › Stems; Font Info › Stems)"
status = "docs"
origin = "fontlab"

[[setting]]
id = "snapping.suggestActivation"
label = "Suggestions Activate"
section = "Editing"
kind = "choice"
values = "immediately | on pointer idle | after a delay"
area = "guides-metrics"
milestone = "M14"
summary = "When snapping suggestions appear during a drag. Holding Cmd during the drag suppresses snapping to suggestions altogether."
ref = "FontLab 8 What's new › Consistency & precision › Suggestion timing; Draft & draw › Working with stroke"
status = "docs"
origin = "fontlab"

# --- guides ------------------------------------------------------------------------------------------

[[tool]]
id = "magnet"
label = "Magnet"
shortcut = ""
group = ""
gestures = [
  "drag a node onto a guide, metric line or zone: link the node to it (the line becomes a power guide)",
  "drag a linked node into empty space: remove that node's link",
  "double-click a guide: make it a power guide; double-click a power guide: unlink all its nodes",
  "Shift+click a node: add a ghost hint at that node",
  "Shift+drag between two nodes: add a stem hint linked to both",
]
area = "guides-metrics"
milestone = "M13"
summary = "Creates and removes links between nodes and guides (power guides) and between nodes and PostScript hints (FontLab key: U)."
ref = "FontLab 7 manual › Power Guides; FontLab 8 What's new › Test & adjust › Power guides; Consistency & precision › Ghost hints, Hint linking"
status = "docs"
origin = "fontlab"

[[command]]
id = "guide.makePowerGuide"
label = "Make Power Guide"
menu = ["Path", "Guides"]
shortcut = ""
kind = "engine"
params = "{guides?: [guideRef], nodes?: [nodeRef]}"
area = "guides-metrics"
milestone = "M13"
summary = "Links the given nodes (or all nodes lying on the guide) to a guide, turning it into a power guide marked with a rhombus. Moving a power guide moves its linked nodes with it while unlinked nodes between power guides are repositioned proportionally."
ref = "FontLab 7 manual › Power Guides; FontLab 8 What's new › Test & adjust › Power guides"
status = "docs"
origin = "fontlab"

[[command]]
id = "guide.addPowerGuides"
label = "Add Power Guides"
menu = ["Path", "Guides"]
shortcut = ""
kind = "engine"
params = "{glyphs?, layers?: [id]}"
area = "guides-metrics"
milestone = "M13"
summary = "Adds a power guide on each side of every detected horizontal and vertical stem, linked to the stem's nodes, so the glyph can then be widened, narrowed or re-proportioned by moving guides while stem widths are preserved."
ref = "FontLab 7 manual › Power Guides (Creating Power guides, Scaling with Power guides); FontLab 8 What's new › Test & adjust"
status = "docs"
origin = "fontlab"

[[command]]
id = "guide.unlinkPowerGuides"
label = "Unlink Power Guides"
menu = ["Path", "Guides"]
shortcut = ""
kind = "engine"
params = "{glyphs?, layers?: [id], guides?: [guideRef]}"
area = "guides-metrics"
milestone = "M13"
summary = "Removes all node links from the given power guides, or from every guide of the glyph, without changing outlines; the guides remain as ordinary guides."
ref = "FontLab 7 manual › Power Guides (Removing links); FontLab 8 What's new › Test & adjust"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "guide.powerGuideScope"
area = "guides-metrics"
milestone = "M13"
summary = "A power guide may be a glyph guide, a font-level guide, a metric line or an alignment zone; a setting limits which kinds may take links. Links to font-level lines mean one drag reshapes every glyph linked to that line, and links are drawn as dashed lines that can be shown or hidden."
ref = "FontLab 7 manual › Power Guides (Cautions; View › Show › Node Links)"
status = "docs"
origin = "fontlab"

[[command]]
id = "guide.setThickness"
label = "Set Guide Thickness"
menu = ["Path", "Guides"]
shortcut = ""
kind = "engine"
