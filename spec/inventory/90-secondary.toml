origin = "robofont"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). M13.17; rules follow constructions.ruleGrammar; anchors come from M6's propagation. Implemented on fontcraft_components::construction. As the extension's builder does, the rules run in file order and each built glyph is visible to the rules after it; a line or rule that fails is listed and the others still run; overwrite and automatic code points default to on, as the builder's sheet does on first use, and the file's option comments preset them. Taken from the project's README and source, not yet observed in the running extension."
guesses = [
  "Components a rule places are stored with automatic alignment off, so the realignment after every edit keeps the rule's positions; the original runs where there is no automatic alignment, so nothing there settles it.",
  "Built glyphs get a colour label only when a rule, the file's `# MarkGlyphs:` line or `markColor` gives one; the extension's sheet marks them red by default. Building with the extension's first-use settings would show whether that default stands.",
  "A rule without a `#` note leaves an existing glyph's note as it is; the extension writes the rule's note, empty or not.",
  "A new glyph gets a layer for every master; `masters` limits only which master layers of existing glyphs are rebuilt.",
  "Kerning applied with a backslash also moves the marks placed over the kerned base; the original measures them from where the unkerned base would be, which looks like an oversight.",
]
