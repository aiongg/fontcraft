[[command]]
id = "filter.changeWeight"
label = "Change Weight…"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph | glyphs, layer? | layers?: [id], amount: number, method?: 'auto' | 'cjk' | 'lcg' | 'custom', zones?: {bottom: number, top: number, serifHeight?: number}, counters?: 'auto' | 'squish' | 'retain', cleanup?: bool}"
area = "path-ops"
milestone = "M13"
summary = "Thickens or thins stems by the given amount. The lcg method then pulls the glyph back between its bottom and top zones so letter heights do not grow, keeping serifs near the zones fixed; the cjk method only expands. Counters are either allowed to shrink or kept by widening the glyph."
ref = "FontForge dialogs › Stylistic Transformations › Change Weight"
status = "docs"
origin = "fontforge"
notes = "Implemented from the public dialog description only: each closed contour is offset outwards by half the amount (nodes along the bisector of their normals, handles with their nodes), then lcg shifts nodes back so the zones keep their heights, with nodes within the serif height of a zone shifted rigidly. The secondary reference cannot be observed in the trial."
guesses = [
  "The offset moves nodes and handles without adding nodes, so curves are only approximately parallel to the original; an outline comparison against the secondary reference would settle how close it must be.",
  "Method auto picks cjk for CJK ideographs, Hangul and kana and lcg for everything else; the secondary reference's documentation on auto would settle it.",
  "Default zones: bottom at the baseline, top at the x-height for lowercase glyphs (by code point, else by the first letter of the name) and the cap height for the rest, serif height 0; the secondary reference's dialog defaults would settle them.",
  "Counters auto means retain with lcg and squish with cjk; retain moves each vertical stem right by the amount times its index so the counters keep their widths, and the advance width grows by the amount times (stems − 1).",
  "Squish keeps the advance width, so the outline grows into both sidebearings by half the amount each.",
  "Cleanup (Remove Overlap after the change) is off by default.",
  "One work budget covers the whole command across all glyphs and layers; past it the command fails, names the glyph where it stopped and changes nothing. Our own limit; the secondary reference on a very large selection would show whether it stops or runs on.",
]

