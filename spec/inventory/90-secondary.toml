  "The counter add applies only to counters between two stems; the parts of the outline left of the first stem and right of the last (arms, serifs) only scale. The secondary reference on a T would settle it.",
  "A glyph with no vertical stem scales as one piece by the counter scale.",
  "Counters scaled below zero width become zero width.",
  "One work budget covers the whole command across all glyphs and layers; past it the command fails, names the glyph where it stopped and changes nothing. Our own limit; the secondary reference on a very large selection would show whether it stops or runs on.",
]

