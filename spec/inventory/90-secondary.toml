[[command]]
id = "filter.adjustStems"
label = "Adjust Stems"
menu = ["Filter"]
shortcut = ""
kind = "engine"
params = "{glyph | glyphs, layer? | layers?: [id], horizontal?: [{from: number, to: number, set?: number, offset?: number}], vertical?: [{from: number, to: number, set?: number, offset?: number}]}"
area = "path-ops"
milestone = "M13"
summary = "Changes the thickness of every detected horizontal or vertical stem whose width falls in a given range, either by an offset or to a fixed value, one range per rule. Diagonal stems are left alone."
ref = "FontLab 8 What's new › Test & adjust › Actions (Adjust stems)"
status = "docs"
origin = "fontlab"
notes = "Stems come from fontcraft_pathops::stems (straight edge pairs and round cross-sections at vertical or horizontal tangents). The documented behaviour (rules by width range, offset or fixed value, diagonals untouched) is followed; the secondary reference cannot be observed in the trial. The dialog dialog.filterAdjustStems shows one rule per direction; the command takes up to 64 each."
guesses = [
  "Both edges of a stem move by half the change, so the stem keeps its centre line; the secondary reference running a rule on a stem away from the sidebearings would settle it.",
  "A horizontal stem's edge on the baseline, x-height, cap height, ascender or descender stays and the other edge takes the whole change; the secondary reference on a serif sitting on the baseline would settle it.",
  "A round stem (the sides of o) is adjusted by moving the extreme nodes on both sides with their handles; one without a node at either measured point is left alone.",
  "A rule that would make a stem narrower than 1 unit makes the whole command fail; the secondary reference with an offset larger than a stem would settle it.",
  "One work budget covers the whole command across all glyphs and layers; past it the command fails, names the glyph where it stopped and changes nothing. Our own limit; the secondary reference on a very large selection would show whether it stops or runs on.",
]

