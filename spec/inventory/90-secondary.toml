[[command]]
id = "bitmap.setStrikes"
label = "Bitmap Strikes…"
menu = ["Font"]
shortcut = ""
kind = "engine"
params = "{add?: [{ppem: number, depth?: 1 | 2 | 4 | 8}], remove?: [{ppem: number, depth?: number}], rasterize?: bool}"
area = "color"
milestone = "M13"
summary = "Declares which embedded bitmap sizes (strikes) the font carries, in pixels per em, each either black-and-white or grey with 2, 4 or 8 bits per pixel. A new strike is filled by rasterising the outlines unless rasterize is false; removing a strike deletes its glyph bitmaps."
ref = "FontForge Element menu › Bitmap Strikes Available"
status = "docs"
notes = "Built in M13.55b and M13.55c (`crates/engine/src/cmd/bitmap_strikes.rs`) on the model's strikes (`crates/model/src/strike.rs`): removing works; adding with `rasterize: false` gives an empty strike, and with `rasterize` on (the default) fills the strike from the outlines with the preview rasteriser (`fontcraft_render::render_path`, anti-aliased, non-zero fill). At 1 bit a pixel is on from half coverage; at 2, 4 or 8 bits its level is the covered fraction, rounded. Each bitmap spans the outline's box in whole pixels, the advance is the glyph width scaled and rounded, and the strike's ascent and descent are the master's, scaled and rounded. A bitmap beyond 1,024 pixels a side, more than 64 Mi pixels for one strike or 256 Mi pixels for all the strikes one call adds, or bitmaps that would take the font's strikes past 256 MiB together, is refused; every new strike is measured before any is drawn. A glyph with no paths and no components whose first-master layer has a placed PDF gets the page as its bitmap (X.pdf2): the page is drawn at 4 samples across each bitmap pixel (at most 16 Mi pixels a page, charged against the strike's pixel budget, once for a page repeated on consecutive glyphs; each bitmap pixel of such a glyph is charged as its 16 samples), the image's transform and crop place it, and a pixel's level is the average darkness (alpha × (1 − luminance)) of its samples. A placed PDF that cannot be read or drawn, or would be wider or taller than 1,024 pixels, is left out and named in `warnings` instead of refusing the strike. Documented, not yet observed. Moved from M11 to M13 by the M11 planning pass: it comes from a secondary reference and goes beyond the primary one (owner decision M3 § 7, question 3; M5 § 7, question 5). The primary reference has no strikes; its handbook knows pixel fonts only as outlines drawn with the pixel tool."
origin = "fontforge"
guesses = [
  "A strike to remove given without a depth removes every depth of that size, and one to add without a depth is black and white; the secondary reference's dialog lists sizes with their depth, so its behaviour for a bare size would settle it.",
  "Adding a strike the font already has is refused rather than ignored.",
  "Rasterising draws the first master's exported glyphs only; glyphs that are not exported get no bitmap. Rasterising a font with an unexported glyph in the secondary reference would settle it.",
  "At 1 bit a pixel is on when the outline covers at least half of it, with no grid-fitting or hinting; the secondary reference's rasteriser may differ at the edges. Rasterising a glyph with a half-covered row in the secondary reference would settle it.",
  "Each bitmap spans the outline's box rounded out to whole pixels, so an empty glyph has a 0 × 0 bitmap that keeps its advance.",
  "A glyph without outlines draws its placed PDF, as dark as the page is, with transparent counting as white; neither reference rasterises placed artwork into strikes, so this is our choice.",
  "A placed PDF too large for a bitmap is left out with a warning rather than refusing the strike, since a template image is often larger than the glyph.",
]

