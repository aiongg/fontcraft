notes = "Our tracer is written from published descriptions of outline tracing; GPL tracers, potrace among them, are not read. It walks the pixel boundaries, straightens staircases, finds corners on a simplified polygon and fits cubic curves between them. The image is decoded within 64 megapixels and a trace keeps at most 100,000 contours. A placed PDF is traced from its first page drawn by `fontcraft-io-pdf` at 4 pixels per point (fewer when the page would pass 64 megapixels); its crop is in points. The traced paths land where the image is drawn (its transform, and its crop when it has one)."
guesses = [
  "A pixel is ink when its darkness, laid on white, is above the threshold (default 0.5); transparent pixels count as white. Settled by tracing a grey and a semi-transparent scan in a reference app that has an autotracer.",
  "Smoothness runs from 0 to 1 (default 0.25): a vertex is a corner when the path turns by more than 30° + 120° × smoothness there, and curves stay within 0.3 + 1.2 × smoothness pixels of the boundary. Settled by comparing corner counts with a reference tracer on our own scans.",
  "Ink pixels that touch only at a corner make separate contours, and contours under 2.5 square pixels (specks) are dropped. Settled by tracing a checkerboard and a dotted scan in a reference tracer.",
  "Traced contours are added after the layer's existing shapes, and the image stays unless `removeImage` is true; a locked image is never removed. Settled by autotracing a glyph that already has paths in a reference app.",
  "Without `glyphs`, every glyph whose layer has an image is traced. Settled by running the reference command with no glyphs selected.",
]

[[tool]]
id = "spiro"
label = "Spiro"
shortcut = ""
group = ""
gestures = [
  "click: add a spiro control point of the current kind (G4 curve, G2 curve, corner, or left/right transition between a curve and a straight line)",
  "drag a control point: the whole curve through the points is recomputed",
  "toggle spiro mode off: the contour becomes ordinary Bezier segments",
]
area = "drawing"
milestone = "M13"
summary = "Draws a contour as a sequence of on-curve control points through which a smooth spiral-based curve is fitted, instead of placing handles. The fitted curve is converted to cubic segments for storage."
ref = "FontForge main views › Outline Glyph View (Spiro point tools; Spiro mode toggle)"
status = "docs"
origin = "fontforge"
notes = "Documented, not yet observed in the reference app. The curve fitting is written from Raph Levien's published thesis on spiral splines (fontcraft_geom::spiro); libspiro (GPL) is not read. Each segment is a spiral whose curvature is a cubic in arc length, solved by Newton's method; with G2 points only it is the spline of Euler spirals, and points on a circle give the circle. Point kinds: G4 and G2 curve points, corner, left (curve, then a straight line) and right (straight line, then a curve). Clicking the first point closes the contour; Return, Escape, a double-click or switching tools adds it open; Backspace removes the last point. The contour is added with one path.addPath as cubic segments within 0.25 units of the spiral, at most 128 points a contour."
guesses = [
  "Plain click adds a G4 point, Shift+click G2, Alt+click a corner, Cmd+click a left point and Cmd+Shift+click a right point when no kind is latched; the reference's point tools have no modifier keys, so any mapping is ours.",
  "At a G2 point the second derivative of curvature is zero on both sides, at a corner (and an open contour's end) the first two derivatives are zero on each side, and a curve meeting a straight line is tangent to it with a zero second derivative; the thesis's exact end conditions, compared on a shared test contour, would settle it.",
  "A left point is followed by the straight line and a right point preceded by it; drawing a left point and a right point in the reference app would settle it.",
  "Spiro points are not kept with the path: once added, the contour is ordinary cubic segments, so there is no spiro mode to toggle back. A contour key in the stored data would be needed to keep them.",
]
observe = [
  "Draw four G2 points around a circle and convert to cubics: how many cubic segments result, and do they follow a circle?",
  "Draw a left point then a right point: which side of each is the straight line on?",
]

