[[panel]]
id = "palette.selections"
label = "Selections"
location = "palette"
controls = ["list of named selections stored with the glyph", "Add, Update and Remove buttons", "click an entry to restore that selection"]
area = "drawing"
milestone = "M13"
summary = "Stores node selections per glyph under names and recalls them later, also on the matching nodes of other compatible masters. Selection changes get their own undo steps, separate from edits."
ref = "FontLab 8 What's new › Edit & refine › Selecting contours"
status = "docs"
origin = "fontlab"
notes = "Documented, not yet observed. FontCraft's Palette section lists the edited glyph's stored selections with a name field; Add stores the current selection under the typed name (edit.storeSelection), Update stores it under the clicked entry's name, Remove deletes the clicked entry (edit.removeStoredSelection), and clicking a name recalls it (edit.recallSelection). Selection changes are view state in FontCraft and make no undo steps, so the separate selection undo is not built."
guesses = [
  "The section sits after Transformations in the Palette and shows only the edited glyph's entries; FontLab's panel placement would settle it.",
  "Add with a name that already exists replaces that entry rather than refusing; observing the panel's Add on a duplicate name would settle it.",
]
observe = [
  "In FontLab 8, store a selection named 'stem' in one master, switch to another master and click the entry: check whether the same node indexes are selected and whether a mismatched master selects part or nothing.",
]

