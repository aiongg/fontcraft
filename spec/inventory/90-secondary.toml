  "`masters` defaults to every master, which covers the reference's companion action that copies the recipe to all masters; seeing whether that action is a command of its own would settle it.",
  "Without `recipe`, a glyph keeps the recipe one of its layers has, else takes the components its name decomposes into by Create Composite's rules; the reference's default recipe is not documented.",
  "An automatic layer holds only the recipe's components: paths or components added by hand are replaced at the next rebuild; whether the reference lets one draw on an automatic layer would settle it.",
  "A recipe whose components contain the glyph is refused, and a layer whose recipe becomes circular later stays empty.",
  "Recipe parts are glyph names only, without placement suffixes such as `@anchor`.",
]

