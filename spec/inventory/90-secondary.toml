[[command]]
id = "glyph.addSmallCaps"
label = "Add Small Caps…"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyphs?, masters?: [id], suffix?: string, height?: number, stemScale?: {h?: number, v?: number}, petite?: bool, includeSymbols?: bool}"
area = "components"
milestone = "M13"
summary = "Creates a small-capital glyph for each selected letter by scaling the capital to the target height and thickening stems to lowercase weight, without touching the originals, and adds the substitution features from capitals and from lowercase. Covers Latin, Greek and Cyrillic; a petite-caps variant uses its own suffix and features. A drafting aid whose results need review."
ref = "FontForge dialogs › Stylistic Transformations › Add Small Caps"
status = "docs"
origin = "fontforge"
notes = "Documented in the reference's user manual, not yet observed: selecting A or a both make a.sc from A's outlines; capitals scale from the cap height to the small-cap height (x-height by default); stems scale so the capital's stem matches the lowercase stem; features c2sc and smcp, or c2pc and pcap for petite caps with the same default sizes; symbols, when asked for, get both mappings under their own suffix; an existing small cap is changed rather than duplicated. FontCraft: the height default is the master's smallCapHeight parameter, else its x-height; stems are measured on H (else I) and n (else l) and changed with Change Weight (lcg, zones kept) and Adjust Stems for horizontal stems; any cased letter with a one-letter case pair qualifies, so Greek and Cyrillic are covered by their case mapping; the lines go into a hand-written feature, a new one, or an automatic feature's regeneration, never twice."
guesses = [
  "Petite caps use the suffix .pc, as the handbook's naming rules expect, where the reference uses its own extension; making petite caps with the reference app would settle it.",
  "Symbols take the same suffix as the letters (nine.sc), where the reference documents an old-style figure extension; the reference's naming for other symbols would settle it.",
  "Horizontal stems scale by the vertical stem ratio unless stemScale.h is given, because there is no lowercase horizontal stem to measure against; the reference's default horizontal stem value would settle it.",
  "Without glyphs, every glyph with a character is considered and those that give no small cap are left out quietly; the reference always works on the Font View selection.",
  "An automatic feature with the tag is regenerated rather than edited, so substitutions to a suffix the feature generator does not know are not written there; a test with the reference's automatic features would settle whether it should warn.",
]
observe = [
  "Select A and a in a test font, run Add Small Caps with default settings, and record the new glyph names, their heights and stem widths, and the c2sc and smcp lookups.",
  "Run Add Small Caps twice and check whether the lookups gain duplicate entries.",
]

[[command]]
id = "glyph.addSubSuperscripts"
