# =====================================================================================================
# FontLab — spacing and kerning
# =====================================================================================================

[[command]]
id = "spacing.autoSpace"
label = "Auto Space"
menu = ["Glyph"]
shortcut = ""
kind = "engine"
params = "{glyphs?, masters?: [id], method?: 'optical' | 'tight' | 'custom', step?: number, depth?: number, area?: number, separation?: number, percentOfUpm?: number, min?: number, max?: number, beam?: number}"
area = "spacing-kerning"
milestone = "M13"
summary = "Computes left and right sidebearings for the given glyphs from their shapes. Method optical judges the side profiles, tight sets both to zero, custom sets a percentage of the em; parts flagged as non-spacing are ignored (FontLab key: semicolon). FontForge's Auto Width does the same per script with a target separation plus minimum and maximum bearings, and warns against running it on glyphs built from references."
ref = "FontLab 8 What's new › Metrics & kerning › Metrics (Auto-spacing; Autospace method); FontForge dialogs › Auto Width"
status = "docs"
origin = "fontlab"
notes = "Moved from M5 to M13 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 5): it goes beyond the primary reference, like the secondary drawing aids the M3 pass moved (docs/plans/M5.md § 2). Built in M13.20 on the side profiles of `fontcraft_spacing::profile`. The non-spacing parts of FontLab (flagged parts ignored) are not built: FontCraft has no such flag. The corpus measure (docs/plans/M13.md § 5) compares the result with Inter's and Oswald's stored sidebearings."
guesses = [
  "Method optical is FontCraft's own (open decision D11, docs/plans/M13.md § 3): for each side, the side profile sampled every `step` units (default 5) over a band from the baseline less its overshoot to the reference height plus its overshoot is clipped to `depth` inward from its extreme; the distance from the advance edge to the extreme plus a weight times the clipped profile's mean depth equals `area`. Neither FontLab nor FontForge documents its method; comparing the results on a font spaced in either app would show how far they differ.",
  "The clipping depth defaults to 10% of the x-height: on the corpus measure (docs/plans/M13.md § 5) shares from 5% to 10% did about equally well and 15% or more did worse. Spacing a test font in FontLab with its defaults would show whether its depth is similar.",
  "The mean depth is taken over the rows with ink rather than over the whole band, so a glyph with ink in part of the band (a period, a hyphen) is not pushed away by the empty rows; FontLab's and FontForge's pages say nothing about such glyphs.",
  "The area and the depth weight of a group are calibrated on the font's own n, o and v (capitals and figures: H, O and V) as they stand: a least-squares line through their six sides, white outside the extreme against mean depth, gives the weight as its slope (held between 0 and 2) and the area as its value at depth 0, so a straight, a round and a diagonal side keep about their spacing. With only straight controls the weight is 1. A group without its control glyphs takes the other group's; a master without any has weight 1 and is refused unless `area` is given, which replaces the area and keeps the weight. On the corpus measure at the same depth, fitting the weight lowered Inter's worst median error from 89% to 75% against a weight fixed at 1, with Oswald's about the same (12%). FontForge asks for a separation instead; it accepts `separation` as twice the area.",
  "Capitals and figures (case upper or category Number) use the cap-height band, everything else the x-height band.",
  "Without `glyphs`, every exported letter and figure is spaced; without `masters`, every master. Masters that take their widths from another are skipped.",
  "Sidebearings are rounded to whole units, then held between `min` and `max`. Method custom defaults to 5% of the em.",
  "A side whose field holds a metrics key keeps its value, and a layer with a width key or under automatic alignment is skipped, so keys stay in sync. FontLab's page does not say what auto-spacing does with its own metrics expressions.",
  "`beam` applies to tight and custom: both sidebearings are measured where the outline meets the beam. Optical refuses it, as the profiles cover the whole band.",
]

[[setting]]
id = "spacing.autoSpaceMethod"
label = "Auto Space Method"
section = "Spacing"
kind = "choice"
values = "optical | tight | custom"
area = "spacing-kerning"
milestone = "M14"
summary = "Default method for Auto Space, with the percentage of the em used by the custom method."
ref = "FontLab 8 What's new › Metrics & kerning › Metrics (Autospace method)"
status = "docs"
origin = "fontlab"

[[command]]
id = "view.showMetricsBeam"
label = "Metrics Beam"
menu = ["View"]
shortcut = ""
kind = "ui"
params = "{on?: bool, y?: number}"
area = "spacing-kerning"
milestone = "M13"
summary = "Shows a draggable horizontal line and reports sidebearings where it crosses each glyph's outline rather than at the bounding box, with the values coloured differently from bounding-box values. Auto-spacing and set-sidebearing actions can be told to measure at the beam. RoboFont's Space Center has the same aid, called Beam."
ref = "FontLab 8 What's new › Metrics & kerning › Metrics (Metrics line); RoboFont reference › Space Center › Display options"
status = "docs"
origin = "fontlab"
notes = "Moved from M5 to M13 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 5): it goes beyond the primary reference, like the secondary drawing aids the M3 pass moved (docs/plans/M5.md § 2). Edit View (M13.31) draws the line across the canvas and the sidebearings where it meets the outline, set with the `y` parameter. Dragging the line up or down beside the glyphs runs view.showMetricsBeam with the height under the pointer (X.ui3, crates/ui-egui/src/canvas/edit_aids.rs). Documented, not yet observed in the reference app."
