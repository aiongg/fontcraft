]

[[behavior]]
id = "constructions.ruleGrammar"
area = "components"
milestone = "M13"
summary = "A construction rule names a target glyph, an equals sign and the parts it is built from, joined by plus signs. A part may be placed with an at sign: by coordinates, percentages, a transform matrix, keywords such as center and top, or an anchor of another glyph, and a backtick formula may compute a coordinate; an ampersand sets parts side by side, optionally kerned. A caret sets the width or the margins from numbers or other glyphs, a bar sets code points, an exclamation mark a colour label, and a hash starts a comment or a glyph note. Prefixes ask to decompose the result or to skip glyphs that exist; dollar variables are declared once and used in braces; flag comments set options for the whole file."
ref = "Glyph Construction README (github.com/typemytype/GlyphConstruction, MIT), linked from RoboFont topics › Accented glyphs"
status = "docs"
origin = "robofont"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). Verified by the M13 planning pass against the project's README. M13.17 ports the project's parser (MIT) to Rust with credit in the file header and NOTICE; the README's examples become tests. Ported from Lib/glyphConstruction.py (crates/components/src/construction.rs); the README examples, rebuilt with our own glyphs, and the library's own test values are tests. The option comments (OverwriteExistingGlyphs, AutoUnicodes, MarkGlyphs) come from the extension's builder."
guesses = [
  "A part whose suffixed name the font lacks falls back to the name before the first dot wherever it appears, as the README says; the library itself does this only for parts with a position.",
  "Variable values may use other variables (at most 16 deep) and a `#` ends a value; the original replaces variables in one pass and keeps a trailing comment in the value, which breaks its own README example.",
  "A code point or colour that cannot be read makes the rule an error; the original drops it silently.",
  "A number before a position name works with + and * (`10+top`), and position names may hold dots (`top.alt`); the original fails on both.",
]

