[[command]]
id = "bitmap.exportStrikes"
label = "Export Bitmap Strikes…"
menu = ["File", "Export"]
shortcut = ""
kind = "engine"
params = "{strikes?: [{ppem: number, depth?: number}], format?: 'bdf' | 'pcf' | 'pcf.gz' | 'fnt' | 'fon' | 'pk' | 'embedded' | 'otb', path?: path, destination?: path, font?: path}"
area = "import-export"
milestone = "M13"
summary = "Writes the chosen strikes as BDF files, embeds them in the exported TrueType or OpenType font, or writes a bitmap-only font in an sfnt wrapper. The reference also writes Windows FON and FNT, Mac NFNT and Palm formats."
ref = "FontForge dialogs › Generate Font › Bitmap Formats"
status = "docs"
notes = "Built in M13.55b (`crates/engine/src/cmd/bitmap_strikes.rs`) for BDF and PCF, written by `crates/io-bitmap`, and TeX PK (M13.55f; format `pk`, the default for a path ending in `.pk` or `.<dpi>pk`): `path` names the file of one strike, `destination` a folder that gets one file per strike. `embedded` and `otb` built in M13.55c on `crates/tables/src/embedded_bitmaps.rs`, which writes `EBDT` and `EBLC` version 2 in the layout fontTools compiles (checked byte for byte against fontTools 4.66 on a two-strike test): image format 1 (small metrics, byte-aligned rows, the model's own layout at 1, 2, 4 and 8 bits), index subtables of format 3, or 1 when the images span more than 64 KiB, a new subtable where more than 8 glyphs without a bitmap lie between two with one, flags 1 (horizontal metrics) and zero vertical line metrics. `embedded` writes the strikes into `font` (a TrueType or OpenType file; default: the open font compiled as TrueType), replacing its bitmap tables, and maps bitmaps to glyph ids by name, else by the glyph's code point through `cmap`. `otb` compiles the open font as TrueType and keeps `head hhea hmtx maxp cmap name OS/2 post`, with a zero-length `glyf`, a short `loca` of zeros, a version 1.0 `maxp` with only the glyph count and `maxZones` 1, and the strikes, as the secondary reference's page on bitmap-only sfnts describes for X11 `.otb` files. Refused: a strike above 255 ppem and a bitmap whose size, offsets or advance do not fit small glyph metrics (one byte each). Documented, not yet checked against files the secondary reference writes. The secondary reference does not list PCF among its export formats; we write it because the reader and writer exist. M13.55e adds `pcf.gz` (one file per strike, like `pcf`), `fnt` (a Windows FNT version 3 file per strike, see the `fnt` format row; what it leaves out is listed in the file's `warnings`) and `fon` (every chosen strike in the one Windows FON file `path` names; `destination` is refused). Moved from M11 to M13 by the M11 planning pass (owner decision M3 § 7, question 3; M5 § 7, question 5). Documented, not yet checked in the secondary reference."
