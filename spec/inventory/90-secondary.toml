[[command]]
id = "hint.tt.setAssembly"
label = "Set TrueType Instructions"
menu = []
shortcut = ""
kind = "engine"
params = "{target: {glyph: name} | 'fpgm' | 'prep', master?: id, assembly: string}"
area = "hinting-tt"
milestone = "M13"
summary = "Assembles the text and stores it as the raw instructions of a glyph or of a font-level program, failing without change on a parse error. Raw instructions on a glyph take precedence over visual hints at export."
ref = "FontForge dialogs › Viewing and Editing truetype instructions"
status = "docs"
origin = "fontforge"
notes = "Built in M13.51 (`crates/engine/src/cmd/tt_assembly.rs`). A glyph's program is stored as the layer's glyph program, the store an opened hinted font uses (`fontcraft_hinting::imported`), with the outline's fingerprint; fpgm and prep go to the fpgm Table Assembly and prep Table Assembly parameters. Numbers after an instruction other than a push are pushed before it, last on top; unbalanced IF, FDEF and IDEF blocks are refused. Export writes a glyph's own program in place of its TrueType Instructor hints, with or without the cvt Table, prep Table Assembly and fpgm Table Assembly parameters (`crates/compile/src/tt_hints.rs`); with Autohint on, the autohinter's programs replace it. Without those parameters, a glyph program that calls functions (CALL, LOOPCALL), uses the control values (RCVT, WCVTP, WCVTF, MIAP, MIRP, DELTAC) or reads storage (RS), or that the analysis cannot follow, is left out with a warning naming the glyph, since the font programs it was written for are not exported; its Instructor hints, if any, are compiled instead. Glyph programs are also written when the Instructor's own tables cannot be built. The result's `warnings` say when the layer also has Instructor hints, and when the program needs font programs (the same check, `fontcraft_ttasm::uses_font_programs`) and neither the master nor the font has one of those parameters, so export would leave it out. When those parameters exist, a program that calls functions (CALL, LOOPCALL) is checked against the functions the master's fpgm and prep Table Assembly parameters (else the font's) define: the warning says when they define none, or names the called numbers they lack."
guesses = [
  "A call's function number is known only when a push sits just before the call, as hand-written programs put it; other calls only need the font programs to define some function. A program that computes its numbers would need the interpreter to check, and nothing in the secondary reference says it checks at all.",
  "Without `master`, fpgm and prep text goes to every master and the font-level parameter is removed, as opening a hinted font stores them on every master; the secondary reference has a single font, so nothing settles it there.",
  "Without the cvt Table, prep Table Assembly and fpgm Table Assembly parameters, a glyph program that needs font programs is left out rather than written against FontCraft's own fpgm and cvt; an export from the secondary reference of a glyph program that calls a function, with no font programs set, would settle it.",
  "Text that assembles to no bytes removes the program instead of storing an empty one; an empty program and none export the same.",
  "Arguments written after an instruction are pushed in the order written, so the last ends on top of the stack; the secondary reference's documentation does not give the order, and its dialog would settle it.",
]
observe = [
  "In the secondary reference's instruction dialog, type `MDAP[rnd] 3 4` (two arguments) and Parse: check the order of the values in the push it makes.",
]

