[[parameter]]
name = "curveTension"
scope = ["master"]
kind = "number"
area = "drawing"
milestone = "M13"
summary = "Default curve tension (percent) used by tension-driven drawing tools such as the Rapid tool and by tension-based ovals. Stored per master with the font dimensions."
ref = "FontLab 8 What's new › Draft & draw › Drawing contours (Font Info › Font Dimensions › Curve tension)"
status = "docs"
origin = "fontlab"
notes = "FontCraft: a master custom parameter read as a number from 1 to 100; path.setCurveTension uses it when no tension is given."
guesses = [
  "A master without the parameter, or with a value outside 1 to 100, uses 55 percent, close to a circle's tension; FontLab's default value is not documented and a new FontLab font would show it.",
]

[[command]]
id = "path.harmonizeNodes"
label = "Harmonize Nodes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points?: [[shape, node]]} or {glyphs, layer? | layers?}"
area = "path-ops"
milestone = "M13"
summary = "Moves each selected smooth node along its handle line to the position where the curvature on both sides is equal (G2 continuity), leaving the handles where they are. Applies to all smooth nodes of the layer when nothing is selected. FontForge documents the same idea as Element › Align › Harmonize."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles; FontForge Element menu › Align"
status = "docs"
origin = "fontlab"
notes = "The node moves along the line between its handles so that the incoming and outgoing handle lengths are in the ratio of the square roots of the far handles' distances from that line; curvature is then equal within rounding to the grid."
guesses = [
  "At an inflection (the far handles on opposite sides of the tangent) the two curvatures are made equal in size, since equal signed curvature is impossible there; running Harmonize on an S-curve in FontLab would settle it.",
  "A smooth node with a straight side, or a selected node that is not between two curve segments, is left unchanged and listed in the result; FontLab does not say.",
]

[[command]]
id = "path.harmonizeHandles"
label = "Harmonize Handles"
menu = ["Path", "Handles"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points?: [[shape, node]]} or {glyphs, layer? | layers?}, order?: 'g2' | 'g3'"
area = "path-ops"
milestone = "M13"
summary = "Reaches curvature continuity at the selected smooth nodes by changing handle lengths while the nodes stay put. Order g3 (Superharmonize in the reference) also equalises the rate of curvature change."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles"
status = "docs"
origin = "fontlab"
guesses = [
  "G2 keeps the sum of the two handle lengths at the node and only divides it differently; FontLab does not say which lengths it keeps, and comparing handle lengths before and after Harmonize Handles in FontLab would settle it.",
  "G3 changes the lengths of the two neighbouring handles along their own directions, by the smallest change found, so the neighbouring nodes keep their tangents; FontLab does not describe Superharmonize's method.",
  "With no node selected both orders act on every smooth node of the layer, as Harmonize Nodes does; FontLab documents only the selection.",
]

[[command]]
id = "path.togglePowerNudge"
label = "Power Nudge"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Switches the node-dragging mode in which the unselected neighbours of a moved selection are sorted automatically into fixed points and servant points that follow proportionally, so a stem or bowl can be moved without distorting what joins it (FontLab keys: Shift+C to toggle, hold C for temporary use)."
ref = "FontLab 8 What's new › Edit & refine › Contour tool"
status = "docs"
origin = "fontlab"
notes = "FontCraft: an engine command that flips the user setting editing.powerNudge, which the Select tool reads when a move starts; the setting lasts across sessions, as FontLab's toggle does. Holding C for temporary use and the per-node status display are not built. Documented, not yet observed in the reference app."
guesses = [
  "From each moved node the walk goes both ways along the contour over unselected smooth nodes that are not extremes (a handle horizontal or vertical) and stops at the first corner node, extreme or locked node, which stays fixed; FontLab does not document how it sorts fixed from servant points, and moving one node of a contour with intermediate smooth nodes in FontLab would settle it.",
  "A servant moves by the drag times its position between the fixed node and the moved node on each axis (by length along the contour where the two share that coordinate), its handles with it; between two moved nodes, or towards an open end, servants move by the whole drag; FontLab says only that servants move proportionally.",
  "Power Nudge acts on plain moves only: duplicating drags and nudge drags (Alt) move no servants.",
]
observe = [
  "Turn on Power Nudge in FontLab, move the top node of a stem whose curve has two intermediate smooth nodes, and note which nodes move and by how much.",
]

[[command]]
id = "path.setServantNode"
label = "Set Servant Node"
menu = ["Path", "Nodes"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points: [[shape, node]], axis: 'x' | 'y' | 'both' | 'none'}"
area = "drawing"
milestone = "M13"
summary = "Declares the selected nodes as servants on the x or y axis so they always follow neighbouring edits proportionally on that axis, or clears the declaration with axis none. An optional status display marks every node as x-servant, y-servant or static."
ref = "FontLab 8 What's new › Edit & refine › Contour tool (Servant declarations; Clear Genius & Servant)"
status = "docs"
origin = "fontlab"
notes = "FontCraft: the link is stored in the node's user data (com.fontcraft.servant), so .glyphs and UFO keep it. A declared servant follows moves of its neighbours in the Select tool with Power Nudge on or off, as FontLab documents, and is placed by the same walk and proportions as Power Nudge's servants. The per-node status display is not built. Documented, not yet observed in the reference app."
guesses = [
  "axis both declares a servant on both axes; FontLab offers only X-Servant and Y-Servant, and turning both on for one node in FontLab would show whether that is possible.",
  "A declared servant follows only when it is reached from a moved node over other servants (or Power Nudge's smooth nodes), not from anywhere on the contour; FontLab does not say which edits count as neighbouring.",
]

[[behavior]]
id = "nodes.slideAlongCurve"
area = "drawing"
milestone = "M13"
summary = "A slide drag moves a node along its existing curve without changing the curve's shape, and past the end extends the curve; arrow keys do the same for a single node while the mode is on (FontLab: Shift+Alt-drag). RoboFont documents the related Cmd-drag that slides a smooth on-curve point between its two handles."
ref = "FontLab 8 What's new › Edit & refine › Contour tool (Slide); RoboFont reference › Editing Tool"
status = "docs"
origin = "fontlab"
notes = "FontCraft: Shift+Alt-drag on a node in the Select tool, one interaction and one undo step. The segment slid into is cut at the new place exactly; at a smooth node between two curves the other segment and the slid-over piece become one curve, which is exact when the two came from cutting one curve; past an open end the end curve is extended. The Slide toggle in the toolbox and sliding with arrow keys are not built. Documented, not yet observed in the reference app."
guesses = [
  "Only an open end slides past the end; FontLab also extends at a sharp node, which needs a curve where FontCraft has a corner, and sliding past a sharp node in FontLab would show what it adds.",
  "At a corner node, or next to a line, the other segment keeps its far handle and its near handle moves with the node, so that segment changes shape; FontLab says the shape is preserved without saying how in this case.",
]
observe = [
  "Shift+Alt-drag a corner node between a curve and a line in FontLab and note how the curve on the other side changes.",
]

[[behavior]]
id = "drag.leverPrecision"
area = "drawing"
milestone = "M13"
summary = "With the lever modifier held, a dragged node, handle, sidebearing or kerning value moves by 1/n of the pointer distance so fine corrections do not need zooming in. The ratio is a setting; holding Shift in metrics and kerning modes restores 1:1."
ref = "FontLab 8 What's new › Edit & refine › Contour lever; Metrics & kerning › lever precision dragging"
status = "docs"
origin = "fontlab"
notes = "FontCraft: the lever modifier is Cmd (Control off the Mac), as FontLab documents; it applies to the Select tool's moves, Tunni line drags and slides. Pressing or releasing it during a drag continues from where the drag stands. Sidebearing and kerning drags and the toolbox toggle that keeps the lever on are not built. Documented, not yet observed in the reference app."
guesses = [
  "The drag follows 1/ratio of the pointer's movement over the first 50 screen points and the pointer's full speed beyond; FontLab says only that short drags are slowed and longer ones gradually match the pointer, and timing a long lever drag in FontLab would settle the curve.",
]
observe = [
  "Hold Cmd and drag a node 200 screen points in FontLab with the ratio 6; note how far the node moved.",
]

