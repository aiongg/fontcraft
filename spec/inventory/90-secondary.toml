status = "docs"
origin = "fontforge"
notes = "Documented in the reference's user manual, not yet observed: the originals stay; each copy takes the indicated extension (zero.superior); one lookup in the chosen feature maps each original to its copy; defaults scale 2/3, stems 3/4, raise 450 units. FontCraft: stems change by (stemScale − scale) × the reference stem of H (else I) for capitals and figures, of n (else l) for lowercase, with Change Weight (lcg) keeping the copy's baseline and top; the substitution lines go into a hand-written feature, a new one, or an automatic feature's regeneration, never twice."
guesses = [
  "The raise of 450 units is read per 1000 units of the em and scaled to the font's units per em; running the command on a 2048-unit font in the reference would settle it.",
  "subs and sinf default to a drop of 150 units per 1000 and dnom to no shift, where the reference has one raise for every feature; the reference documents no subscript default.",
  "Without glyphs, the figures zero to nine are used, as in the reference's example; the reference always works on the Font View selection.",
  "A suffix without a leading dot gets one (sups gives one.sups); the reference's handling of a bare extension would settle it.",
]
observe = [
  "Select the figures of a test font, run Add Subscripts/Superscripts with the defaults and feature sups, and record the copies' names, heights, offsets and stem widths, and the lookup.",
]

