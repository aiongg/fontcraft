  "Each action's parameter form is the command's own dialog when it has one, and otherwise a JSON editor checked against the command's params doc; FontLab's dialog lists only its own actions, each with a form.",
  "Visible layers are the active layer plus every layer marked visible in any glyph of the scope, sent as one `layers` list, so a glyph without one of those layers skips it; how FontLab picks visible layers per glyph would settle it.",
  "A command that takes only one `layer` runs once per layer of the scope, and one that takes `allMasters` gets it when the scope is every master; FontLab's actions all take a layer scope of their own.",
  "Set steps take the scope through the macro arguments `glyphs` and `layers` when the command takes a `layers` list; for other commands the layer is fixed when the step is added. Running a saved FontLab action set on another layer scope would settle it.",
