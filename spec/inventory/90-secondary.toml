[[command]]
id = "kerning.autoKern"
label = "Auto Kern"
menu = ["Font", "Kerning"]
shortcut = ""
kind = "engine"
params = "{pairs?: [[left, right]], glyphsLeft?: [names], glyphsRight?: [names], masters?: [id], direction?: 'ltr' | 'rtl', separation?: number, minKern?: number, onlyCloser?: bool, touching?: bool, keepExisting?: bool, round?: number, step?: number, depth?: number, apply?: bool}"
area = "spacing-kerning"
milestone = "M13"
summary = "Proposes kerning values for the given pairs from the optical gap between the two glyph profiles, aiming at a target separation. Options drop values too small to matter, restrict results to tightening, or let glyphs touch; existing pairs are kept unless told otherwise (FontLab key in kerning mode: semicolon)."
ref = "FontLab 8 What's new › Metrics & kerning › Kerning (autokerning); FontLab 7 manual › Pairs and Phrases panel; FontForge dialogs › Lookups (pair kerning subtable: Default Separation, Min Kern, Touching, Only kern closer)"
status = "docs"
origin = "fontlab"
notes = "Moved from M5 to M13 by the M5 plan, which the owner accepted (docs/plans/M5.md § 7 question 5): it goes beyond the primary reference, like the secondary drawing aids the M3 pass moved (docs/plans/M5.md § 2). Built in M13.21 on the side profiles of `fontcraft_spacing::profile`, with the bands and clipping of `spacing.autoSpace`. Documented, not yet observed. The corpus measure (docs/plans/M13.md § 5) compares the proposals with Inter's and Oswald's stored kerning."
guesses = [
  "The proposed value is the target separation minus the pair's optical gap, rounded to the nearest 5 units by default; the target separation defaults to the optical gap of a reference pair (n n for lowercase, H H for capitals) without kerning. The optical gap is taken between the left glyph's right profile and the right glyph's left profile over auto-spacing's bands, each clipped to `depth` (default 30% of the x-height) inward from its extreme, as the power mean of order −2 of the row distances (each at least 1 unit), so the rows where the glyphs come closest count most. On the corpus measure (docs/plans/M13.md § 5) the depth of 15% that auto-spacing first used agreed in sign with Inter's kerning in 74% of pairs, 25% to 30% in about 85%, and the power mean added one to two points and raised the correlation. FontLab documents neither K1 nor K2 (open decision D11).",
  "A pair mixing a capital or figure with any other glyph is measured over the x-height band, and its target is the mean of the two glyphs' reference gaps (n n and H H); comparing proposals for To, Av and the like with a font kerned in the reference app would settle it.",
  "A group side is measured on one member: the glyph named like the group, else the group's first member in glyph order; FontLab's page does not say how class pairs are measured.",
  "With `touching`, the gap and the reference gap are both measured at the outlines' closest approach, as Kern to Distance measures them; FontForge's Lookups page names the Touching option without describing its measure in detail.",
  "A value of 0, a value smaller in size than `minKern`, or a positive value with `onlyCloser` stores nothing; when `keepExisting` is false such a value also removes the stored pair. `minKern` defaults to 0.",
  "`keepExisting` (default true) leaves every pair whose sides are stored already in that master, whatever its value; pairs that apply through groups do not count as stored.",
  "`apply: false` returns the proposals without storing them, for the pair review windows.",
]

[[command]]
id = "kerning.kernToDistance"
label = "Kern to Distance"
menu = ["Font", "Kerning"]
shortcut = ""
kind = "engine"
params = "{distance: number, pairs?: [[left, right]], glyphsLeft?: [names], glyphsRight?: [names], masters?: [id], direction?: 'ltr' | 'rtl', apply?: bool}"
area = "spacing-kerning"
milestone = "M13"
summary = "Sets each given pair so that the smallest gap between the two outlines equals the target distance."
