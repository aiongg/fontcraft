# Secondary references: features the primary reference (Glyphs 4 handbook) lacks or leaves to plug-ins.
# Sources (public user documentation only, read 2026-10-07):
#   FontLab 8 "What's new" pages      https://help.fontlab.com/fontlab/8/whats-new/
#   FontLab 7 User Manual (the detailed manual the FontLab 8 help site still relies on)
#                                     https://help.fontlab.com/fontlab/7/manual/
#   RoboFont documentation            https://robofont.com/documentation/
#   FontForge user documentation      https://fontforge.org/docs/        (docs only; no source code read)
#   Fontra documentation              https://docs.fontra.xyz/           (docs only; no source code read)
# Date: 2026-10-07
#
# Conventions specific to this file:
# - Every row carries `origin`. `status = "docs"` means the feature was read on a public doc page;
#   `status = "memory"` means recalled and not confirmed on a page; `status = "inferred"` is our design.
# - `shortcut` is left empty on purpose: the primary reference owns the keymap. Where the secondary
#   reference documents a key, the summary quotes it as "(FontLab key: L)" so it can be offered as an
#   alternative binding later.
# - No [[format]] rows here (another file owns formats); legacy formats appear only as the commands
#   that import or export them.

# =====================================================================================================
# FontLab — drawing aids, curve tension, measuring, snapping
# =====================================================================================================

[[command]]
id = "view.showTunniLines"
label = "Tunni Lines"
menu = ["View"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Toggles Tunni lines: for every curve segment, a dotted line joining its two handle ends plus a control dot where the extended handles meet. They are the canvas handles for balanced tension editing (FontLab key: L, tap to toggle or hold to show temporarily)."
ref = "FontLab 7 manual › Tunni Lines; FontLab 8 What's new › Explore & prepare › View panel"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.selectTunniLines"
label = "Edit Tunni Lines"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points?: [[shape, node]], segments?: [[shape, node]]}"
area = "drawing"
milestone = "M13"
summary = "Selects the Tunni lines of every curve segment inside the current selection, or of all curve segments on the layer when nothing is selected, and switches Tunni line display on. With Tunni lines visible, Select All selects them all."
ref = "FontLab 7 manual › Tunni Lines; FontLab 8 What's new › Edit & refine › Selecting contours"
status = "docs"
origin = "fontlab"
notes = "FontCraft: a query that returns the named curve segments (all of the layer's without a list) with their Tunni points and tensions, and those segments as the selection; switching Tunni line display on is the view's part (view.showTunniLines)."
guesses = [
  "A segment counts as inside the selection when one of its handles is selected, both its end nodes are, or the segment itself is, as for Fit Curve; FontLab does not define it, and selecting nodes in FontLab with Tunni lines on would settle it.",
]

[[behavior]]
id = "tunni.dragLineSymmetric"
area = "drawing"
milestone = "M13"
summary = "Dragging a Tunni line (or Shift-dragging its control dot) lengthens or shortens both handles of the segment together, keeping their directions, so the curve tension changes symmetrically. With several Tunni lines selected (Shift-click to add), dragging any one applies the same change to all."
ref = "FontLab 7 manual › Tunni Lines"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "tunni.dragPointAsymmetric"
area = "drawing"
milestone = "M13"
summary = "Alt-dragging a Tunni line, or dragging its control dot without Shift, moves only one handle of the segment, giving an asymmetric tension change."
ref = "FontLab 7 manual › Tunni Lines"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.setCurveTension"
label = "Set Curve Tension"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points?: [[shape, node]], segments?: [[shape, node]]} or {glyphs, layer? | layers?}, tension?: percent, relative?: bool"
area = "drawing"
milestone = "M13"
summary = "Sets both handles of the selected curve segments to a proportional tension given in percent of the distance to the handle intersection (the same percentage a Tunni line reports), or adjusts the current tension by a signed step when relative is true."
ref = "FontLab 8 What's new › Edit & refine › Curve segments (Node panel: Set proportional curve tension)"
status = "docs"
origin = "fontlab"
notes = "Tension is each handle's length as a percentage of the distance from its node to the Tunni point; a quarter circle drawn with the usual handle factor has about 55.23 %. Without `tension` the master's curveTension parameter is used."
guesses = [
  "Where a segment's handles are parallel or diverge, so they have no intersection, tension is shown as a dash and Set Curve Tension leaves the segment unchanged with a warning; FontLab does not say (open question 9 in docs/spec/90-secondary-references.md).",
  "A zero-length handle has no direction, so its segment counts as having no Tunni point and is left unchanged too; running the command on such a segment in FontLab would settle it.",
  "With no segments named the command acts on every curve segment of the layer, and it also takes a list of glyphs; FontLab documents only the selection.",
  "An absolute tension must be 1 to 100 percent and a relative step keeps each handle within 1 to 100; FontLab gives no range, and entering larger values in its Node panel would settle it.",
  "A relative step is added to each handle's own tension, so unequal handles stay unequal; FontLab does not say whether it balances them first.",
]

[[command]]
id = "view.showCurveTension"
label = "Show Curve Tension"
menu = ["View", "Show"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Shows the tension of each curve segment next to it as a percentage of handle length, together with the lengths-and-angles readout it depends on."
ref = "FontLab 8 What's new › Consistency & precision › Measuring details"
status = "docs"
origin = "fontlab"

[[parameter]]
name = "curveTension"
scope = ["master"]
kind = "number"
area = "drawing"
milestone = "M13"
summary = "Default curve tension (percent) used by tension-driven drawing tools such as the Rapid tool and by tension-based ovals. Stored per master with the font dimensions."
ref = "FontLab 8 What's new › Draft & draw › Drawing contours (Font Info › Font Dimensions › Curve tension)"
status = "docs"
origin = "fontlab"
notes = "FontCraft: a master custom parameter read as a number from 1 to 100; path.setCurveTension uses it when no tension is given."
guesses = [
  "A master without the parameter, or with a value outside 1 to 100, uses 55 percent, close to a circle's tension; FontLab's default value is not documented and a new FontLab font would show it.",
]

[[command]]
id = "path.harmonizeNodes"
label = "Harmonize Nodes"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points?: [[shape, node]]} or {glyphs, layer? | layers?}"
area = "path-ops"
milestone = "M13"
summary = "Moves each selected smooth node along its handle line to the position where the curvature on both sides is equal (G2 continuity), leaving the handles where they are. Applies to all smooth nodes of the layer when nothing is selected. FontForge documents the same idea as Element › Align › Harmonize."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles; FontForge Element menu › Align"
status = "docs"
origin = "fontlab"
notes = "The node moves along the line between its handles so that the incoming and outgoing handle lengths are in the ratio of the square roots of the far handles' distances from that line; curvature is then equal within rounding to the grid."
guesses = [
  "At an inflection (the far handles on opposite sides of the tangent) the two curvatures are made equal in size, since equal signed curvature is impossible there; running Harmonize on an S-curve in FontLab would settle it.",
  "A smooth node with a straight side, or a selected node that is not between two curve segments, is left unchanged and listed in the result; FontLab does not say.",
]

[[command]]
id = "path.harmonizeHandles"
label = "Harmonize Handles"
menu = ["Path", "Handles"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points?: [[shape, node]]} or {glyphs, layer? | layers?}, order?: 'g2' | 'g3'"
area = "path-ops"
milestone = "M13"
summary = "Reaches curvature continuity at the selected smooth nodes by changing handle lengths while the nodes stay put. Order g3 (Superharmonize in the reference) also equalises the rate of curvature change."
ref = "FontLab 8 What's new › Edit & refine › Nodes and handles"
status = "docs"
origin = "fontlab"
guesses = [
  "G2 keeps the sum of the two handle lengths at the node and only divides it differently; FontLab does not say which lengths it keeps, and comparing handle lengths before and after Harmonize Handles in FontLab would settle it.",
  "G3 changes the lengths of the two neighbouring handles along their own directions, by the smallest change found, so the neighbouring nodes keep their tangents; FontLab does not describe Superharmonize's method.",
  "With no node selected both orders act on every smooth node of the layer, as Harmonize Nodes does; FontLab documents only the selection.",
]

[[command]]
id = "path.togglePowerNudge"
label = "Power Nudge"
menu = ["Path"]
shortcut = ""
kind = "ui"
params = "{on?: bool}"
area = "drawing"
milestone = "M13"
summary = "Switches the node-dragging mode in which the unselected neighbours of a moved selection are sorted automatically into fixed points and servant points that follow proportionally, so a stem or bowl can be moved without distorting what joins it (FontLab keys: Shift+C to toggle, hold C for temporary use)."
ref = "FontLab 8 What's new › Edit & refine › Contour tool"
status = "docs"
origin = "fontlab"

[[command]]
id = "path.setServantNode"
label = "Set Servant Node"
menu = ["Path", "Nodes"]
shortcut = ""
kind = "engine"
params = "{nodes?: [nodeRef], axis: 'x' | 'y' | 'none'}"
area = "drawing"
milestone = "M13"
summary = "Declares the selected nodes as servants on the x or y axis so they always follow neighbouring edits proportionally on that axis, or clears the declaration with axis none. An optional status display marks every node as x-servant, y-servant or static."
ref = "FontLab 8 What's new › Edit & refine › Contour tool (Servant declarations; Clear Genius & Servant)"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "nodes.slideAlongCurve"
area = "drawing"
milestone = "M13"
summary = "A slide drag moves a node along its existing curve without changing the curve's shape, and past the end extends the curve; arrow keys do the same for a single node while the mode is on (FontLab: Shift+Alt-drag). RoboFont documents the related Cmd-drag that slides a smooth on-curve point between its two handles."
ref = "FontLab 8 What's new › Edit & refine › Contour tool (Slide); RoboFont reference › Editing Tool"
status = "docs"
origin = "fontlab"

[[behavior]]
id = "drag.leverPrecision"
area = "drawing"
milestone = "M13"
summary = "With the lever modifier held, a dragged node, handle, sidebearing or kerning value moves by 1/n of the pointer distance so fine corrections do not need zooming in. The ratio is a setting; holding Shift in metrics and kerning modes restores 1:1."
ref = "FontLab 8 What's new › Edit & refine › Contour lever; Metrics & kerning › lever precision dragging"
status = "docs"
origin = "fontlab"

[[setting]]
id = "editing.leverRatio"
label = "Lever Ratio"
section = "Editing"
kind = "number"
values = "1 (off) to 100"
area = "drawing"
milestone = "M14"
summary = "Divisor applied to pointer movement during lever dragging. The reference defaults to 6 for contours and suggests 4 to 10 for spacing; 1 disables the lever."
ref = "FontLab 8 What's new › Edit & refine (Preferences › Distances › Contour lever); Metrics & kerning"
status = "docs"
origin = "fontlab"

[[tool]]
id = "rapid"
label = "Rapid"
shortcut = ""
group = ""
gestures = [
  "click: add a node of the current sub-mode (corner, curve or tangent); handles are placed automatically from the default curve tension",
  "click a tension point: adjust how tight that one segment is",
  "Cmd+Alt+click: add a tangent node when no sub-mode is latched",
  "Esc or switching tools: finish the contour",
]
area = "drawing"
milestone = "M13"
summary = "Draws contours by clicking on-curve positions only; the tool supplies handles with a consistent tension, which suits tracing a scan quickly. Each segment keeps a tension point for later adjustment (FontLab key: 5)."
ref = "FontLab 8 What's new › Draft & draw › Drawing contours"
status = "docs"
origin = "fontlab"

[[tool]]
id = "thickness"
label = "Thickness"
shortcut = ""
group = ""
gestures = [
  "Shift+drag a control point: change the thickness of the whole stroked path",
  "Alt+drag a control point: change the thickness at one node, on both sides",
  "Shift+Alt+drag: shift the stroke from one side of the skeleton to the other without changing its width",
  "Backspace on a control point: drop the per-node value and fall back to the path value",
  "marquee several control points: edit them together",
]
area = "path-ops"
milestone = "M13"
summary = "Edits the width of a live stroke on canvas, per path and per node, so a skeleton can carry modulated contrast before it is expanded to outlines (FontLab key: 8). The primary reference has per-path stroke width only."
ref = "FontLab 8 What's new › Draft & draw › Thickness tool"
status = "docs"
origin = "fontlab"
notes = "Documented in the secondary reference's release notes, not yet observed. FontCraft: each on-curve node of a stroked path shows two control points, one on each edge of the stroke, perpendicular to the path. Per-node widths are stored as `[left, right]` in the node's user data (`com.fontcraft.nodeWidth`), written by `path.setNodeWidths`; whole-path gestures run `path.setStroke`. The stroke outline (canvas, Expand Outline, export) reads the widths. The tool has a toolbar button with an icon drawn in code and no shortcut letter, and `tool.select` reaches it too."
guesses = [
  "A drag with no modifier changes the width on the dragged side only, at the dragged node or at every picked control point; the release notes list only the modified drags, and watching the tool would settle it.",
  "Shift+drag changes the path's stroke width by twice the drag distance and adds the drag distance to both sides of every node with its own widths, so the modulation is kept; the release notes do not say what happens to nodes with their own widths.",
  "Shift+Alt+drag acts on the whole path: it changes the stroke position and moves the per-node widths of that path sideways by the same amount, each side kept at 0 or more.",
  "Between two nodes the left and right widths change linearly with the curve parameter; the release notes do not describe the interpolation.",
  "Once any node has its own widths the pen is round (the stroke height is not used), and round-inset and axis-aligned caps end the stroke as butt caps.",
  "Delete clears the picked control points' per-node widths as Backspace does.",
]

[[command]]
id = "path.setNodeWidths"
label = "Set Node Widths"
menu = []
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points: [[shape, node]], left?: units | [units], right?: units | [units], clear?: bool} → {glyph, layer, points, widths: [[left, right] | null]}"
area = "path-ops"
milestone = "M13"
summary = "Our command behind the Thickness tool's per-node gestures: gives on-curve nodes of stroked paths their own left and right stroke widths, or removes them so the nodes take the path's stroke width again."
ref = "FontLab 8 What's new › Draft & draw › Thickness tool"
status = "inferred"
own = true

[[command]]
id = "path.makeInkTrap"
label = "Make Ink Trap"
menu = ["Path", "Nodes"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points: [[shape, node]], width?: number}"
area = "path-ops"
milestone = "M13"
summary = "Turns each selected corner node into a simple ink trap by duplicating the node and separating the two copies by the ink trap width, which defaults to a per-master font dimension."
ref = "FontLab 8 What's new › Edit & refine › Scissors tool; Ink traps and rounded corners"
status = "docs"
origin = "fontlab"
notes = "The reference's help documents duplicating the node and moving the two copies apart by the ink trap width from Font Info; not yet observed. Smooth nodes, handles, open path ends and nearly straight corners are left alone."
guesses = [
  "The two copies move half the width each, perpendicular to the corner's bisector, with the copy ending the incoming segment on that segment's side, and their neighbouring handles move with them; the reference only says the nodes move apart 'intelligently', so watching it trap an inside and an outside corner would settle it.",
  "Without an inkTrapWidth parameter the width is 2% of the em; the reference's default for a new font would settle it.",
]
observe = [
  "Make Ink Trap on the inside corner of an L with ink trap width 20: record where the two nodes land.",
]

[[parameter]]
name = "inkTrapWidth"
scope = ["master"]
kind = "number"
area = "path-ops"
milestone = "M13"
summary = "Default opening width of generated ink traps. The short-segment audit check also uses it as its length threshold."
ref = "FontLab 8 What's new › Edit & refine › Ink traps (Font Info › Font Dimensions); Test & adjust › FontAudit"
status = "docs"
origin = "fontlab"
notes = "Moved from M7 to M13 by the M7 planning pass with the other secondary-reference rows (owner decision M3 § 7, question 3)."

[[command]]
id = "path.loopCorner"
label = "Loop Corner"
menu = ["Path", "Nodes"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, points: [[shape, node]], size?: number}"
area = "path-ops"
milestone = "M13"
summary = "Replaces each selected corner node with a small loop that extends both adjoining segments past the corner and crosses them, which keeps corners sharp under offsetting and interpolation. A font-level option decides whether the loop area counts as filled."
ref = "FontLab 8 What's new › Edit & refine › Scissors tool (Loop Corner)"
status = "docs"
origin = "fontlab"
notes = "Geometry as Open Corner with the same reach in every direction. The reference's font-level option that renders a loop outside the filled area as unfilled is a display and export matter not covered here. Documented in the reference's help; not yet observed."
guesses = [
  "Each segment goes on past the corner by `size`, which defaults to half the master's first vertical stem (4% of the em without stems); the reference does not say how far its loops reach, so measuring one would settle it.",
]
observe = [
  "Loop Corner on a rectangle corner in a master with a 100-unit vertical stem: measure how far each segment goes past the corner.",
]

[[command]]
id = "path.replaceWithCorner"
label = "Replace with Corner"
menu = ["Path"]
shortcut = ""
kind = "engine"
params = "{glyph, layer?, side?, segments?: [[shape, node]], shapes?: [index] (open paths: their gap)}"
area = "path-ops"
milestone = "M13"
summary = "Deletes the selected segment, or the gap of an open contour, and joins its two neighbours in a sharp corner at the point where their extensions intersect."
ref = "FontLab 8 What's new › Edit & refine › Other contour operations"
status = "docs"
origin = "fontlab"
notes = "The gap of an open path is addressed by giving the path in `shapes`. Refused when the neighbours are within 5° of parallel (the reference says the angle must be large enough) or when their extensions meet behind them. Documented in the reference's help; not yet observed."
guesses = [
  "One segment or gap per path per call, and neighbours whose extensions meet behind them are refused rather than shortened; trying both in the reference would settle it.",
]

