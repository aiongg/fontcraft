[[tool]]
id = "rapid"
label = "Rapid"
shortcut = ""
group = ""
gestures = [
  "click: add a node of the current sub-mode (corner, curve or tangent); handles are placed automatically from the default curve tension",
  "click a tension point: adjust how tight that one segment is",
  "Cmd+Alt+click: add a tangent node when no sub-mode is latched",
  "Esc or switching tools: finish the contour",
]
area = "drawing"
milestone = "M13"
summary = "Draws contours by clicking on-curve positions only; the tool supplies handles with a consistent tension, which suits tracing a scan quickly. Each segment keeps a tension point for later adjustment (FontLab key: 5)."
ref = "FontLab 8 What's new › Draft & draw › Drawing contours"
status = "docs"
origin = "fontlab"
notes = "Documented, not yet observed in the reference app. FontCraft: a segment between two corner or tangent nodes is straight, every other one a curve; a curve node takes the direction from the node before it to the node after it, a tangent node the direction of its straight side, and a corner (or an open contour's end) aims its handle at the other end's handle. Handles are set to the tension as a share of the distance to the segment's Tunni point. The contour is added as one undo step: path.addPath, then path.setCurveTension without a value for the segments not adjusted by hand, so they take the master's curveTension parameter. Clicking the first node closes the contour; Return, Escape, a double-click or switching tools adds it open; Backspace removes the last node; dragging a node moves it."
guesses = [
  "With no sub-mode latched, a plain click adds a smooth curve node, Alt+click a corner and Cmd+Alt+click a tangent node; the reference's documentation of the tool's modifier keys would settle it.",
  "A segment's tension point sits halfway between its two handles and is dragged towards or away from the Tunni point; a click on it without dragging returns the segment to the master's tension. Watching the reference's tension points would settle it.",
  "A segment whose handle lines do not meet ahead of both nodes (an S-curve) gets handles of the tension times the chord length over √2, a quarter circle's proportion; the reference's handles on an S-shaped run of clicks would settle it.",
]
observe = [
  "Draw four clicks around a circle with the Rapid tool and read the handle lengths: are they the master's curve tension of the distance to the Tunni point?",
  "Alt+click and Cmd+Alt+click with no sub-mode latched: which node types do they add?",
  "Click a segment's tension point without dragging: does it change the tension, and to what?",
]

[[tool]]
id = "thickness"
label = "Thickness"
shortcut = ""
group = ""
gestures = [
  "Shift+drag a control point: change the thickness of the whole stroked path",
  "Alt+drag a control point: change the thickness at one node, on both sides",
  "Shift+Alt+drag: shift the stroke from one side of the skeleton to the other without changing its width",
  "Backspace on a control point: drop the per-node value and fall back to the path value",
  "marquee several control points: edit them together",
]
area = "path-ops"
milestone = "M13"
summary = "Edits the width of a live stroke on canvas, per path and per node, so a skeleton can carry modulated contrast before it is expanded to outlines (FontLab key: 8). The primary reference has per-path stroke width only."
ref = "FontLab 8 What's new › Draft & draw › Thickness tool"
status = "docs"
origin = "fontlab"
notes = "Documented in the secondary reference's release notes, not yet observed. FontCraft: each on-curve node of a stroked path shows two control points, one on each edge of the stroke, perpendicular to the path. Per-node widths are stored as `[left, right]` in the node's user data (`com.fontcraft.nodeWidth`), written by `path.setNodeWidths`; whole-path gestures run `path.setStroke`. The stroke outline (canvas, Expand Outline, export) reads the widths. The tool has a toolbar button with an icon drawn in code and no shortcut letter, and `tool.select` reaches it too."
guesses = [
  "A drag with no modifier changes the width on the dragged side only, at the dragged node or at every picked control point; the release notes list only the modified drags, and watching the tool would settle it.",
  "Shift+drag changes the path's stroke width by twice the drag distance and adds the drag distance to both sides of every node with its own widths, so the modulation is kept; the release notes do not say what happens to nodes with their own widths.",
  "Shift+Alt+drag acts on the whole path: it changes the stroke position and moves the per-node widths of that path sideways by the same amount, each side kept at 0 or more.",
  "Between two nodes the left and right widths change linearly with the curve parameter; the release notes do not describe the interpolation.",
  "Once any node has its own widths the pen is round (the stroke height is not used), and round-inset and axis-aligned caps end the stroke as butt caps.",
  "Delete clears the picked control points' per-node widths as Backspace does.",
]

