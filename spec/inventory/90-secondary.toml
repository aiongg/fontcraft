notes = "Documented in the reference's public manual, not yet observed. The comparison is three-way by model equality (the document, the font as last read or written, the file), so the document's own unsaved edits are never offered as changes; items both sides changed are marked conflict. M12's source diff can replace the model comparison when it lands. A review that leaves nothing out refreshes the document's stamp, so file.save writes without asking; after a refusal file.save refuses until force: true. The menu item is dialog.externalChanges."
