status = "docs"
origin = "fontlab"
notes = "Documented in the secondary reference's release notes, not yet observed. FontCraft: a View › Suggest switch; while the Select tool drags one handle, the handle snaps to the horizontal or vertical through its node, to the direction of the segment's other handle, or to the right angle to it. Plain snap targets (nodes, handles, guides, metric lines) win over suggestions; suggestions win over alignment with other nodes. Holding Cmd to suppress suggestions belongs to the snapping.suggestActivation setting (M14). The View › Suggest item shows a check mark while the switch is on."
guesses = [
  "Every suggestion switch starts off; the reference's defaults are not documented, and a fresh install of the reference app would settle it.",
  "Nodes, handles, guides and metric lines within reach win over a suggestion, and a suggestion wins over alignment with another node; dragging a handle near both in the reference app would settle it.",
]
observe = [
  "With View › Suggest › Handles on, drag one handle of a curve near the horizontal through its node and see whether it snaps flat.",
  "Drag the same handle near the direction of the segment's other handle and near the right angle to it, and note which directions snap.",
]

