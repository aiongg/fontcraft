[[behavior]]
id = "anchor.positionExpressions"
area = "components"
milestone = "M13"
summary = "An anchor's x and y may each be an expression instead of a number, re-evaluated whenever what it names changes. Expressions use + - * / and parentheses over numbers, the vertical metrics (ascender, descender, x-height, cap height, baseline), the glyph's advance width, other guides, anchors and zones by name, and user-defined font parameters. FontCraft keeps the expressions in the anchor's user data, so `.glyphs` and UFO files keep them, and re-evaluates them after every font-changing command, in the step that re-aligns components."
ref = "FontLab 7 manual › Using Expressions; FontLab 8 What's new › Build & assemble › Anchors"
status = "docs"
origin = "fontlab"
notes = "Moved from M6 to M13 by the M6 planning pass: it comes from a secondary reference and goes beyond the primary one, as the M3 and M5 passes moved such rows (owner decision M3 § 7, question 3; M5 § 7, question 5). Verified by the M13 planning pass against the FontLab 7 manual page Using Expressions, which gives the operators, the variables and examples but no formal grammar. FontCraft (M13.16): grammar and limits in `fontcraft_geom::expr` (1,024 bytes, nesting 64, 10,000 steps, finite results), names and the engine hook in `fontcraft_components::expressions`, set with `anchor.setExpressions`. Documented by the reference, not yet observed."
guesses = [
  "FontCraft's variable names are ascender, descender, xHeight, capHeight, baseline and width, plus `anchor:<name>.x`, `guide:<name>`, `zone:<name>` and `param:<name>` references; the reference's spellings (x_height, caps_height) are read as aliases. Nothing settles it in the primary reference, which has no anchor expressions.",
  "An expression that names something missing, divides by zero or gives a value that is not finite leaves the anchor where it was and is reported in the command's warnings; the reference's handling is not documented.",
  "When expressions are worked out again after other commands, failures leave the anchors in place without a warning; `anchor.setExpressions` reports them.",
  "Results are rounded to the font's grid, as typed anchor positions are.",
  "An anchor with expressions that is moved by hand goes back to its expressions' values at once; removing the expressions frees it.",
  "Anchors are worked out once per change, in layer order, so `anchor:NAME` sees the new position of an anchor before it and the old position of one after it.",
  "`guide:NAME` is the y of a horizontal guide and the x of a vertical one (`.x` and `.y` pick either), looked up on the layer and then on the master; `zone:NAME` is a master metric by name, then by kind; `param:NAME` is a master number value, then a numeric font custom parameter.",
]

