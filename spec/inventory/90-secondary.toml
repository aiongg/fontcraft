guesses = [
  "The gap is the smallest horizontal distance between the two outlines at any height, measured on the decomposed and overlap-removed outlines; FontLab says only that the pair's minimum horizontal gap becomes the value.",
  "The smallest distance is found on rows at most one unit apart, then refined between the neighbouring rows by a golden-section search on the outlines' exact crossings; the value is rounded to a whole unit.",
  "Without `pairs` or glyph lists, every pair stored in the master is set; FontLab applies the command to the pairs selected in its window.",
  "A group side is measured on the member named like the group, else its first member, not on every member; a pair whose value is 0 is stored only where another pair would otherwise apply.",
]

