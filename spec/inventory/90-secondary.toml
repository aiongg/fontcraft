  "An `.otb` keeps every glyph of the compiled font, and its `loca` has one zero entry per glyph plus one; the secondary reference's page says `maxp` counts the bitmap glyphs and `loca` holds one entry. We keep a `loca` that validators and every reader accept. Opening an `.otb` the secondary reference writes in ttx would settle it.",
