notes = "Documented in the secondary reference's release notes, not yet observed. Built (M9.36): a fontRef is an open document's title or path, anything else is read as a font file. Each font needs one master and the same units per em. A font's place is its weight class (the weightClass parameter of its master or font, else its first static instance's class, else 400) on `wght` and its width class, as a percentage, on `wdth`; an axis is made only for a class the fonts differ in, and two fonts at the same place are refused. The new font opens as an untitled document: a copy of the first font with every font's master (metric, stem and number values matched by definition), every layer tied to that master (backgrounds and special layers included), its kerning, and one static instance at each master. The menu item opens its dialog (dialog.mergeFontsToMasters)."
