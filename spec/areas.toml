# Parity areas. Every inventory entry names one of these in `area`.
# `weight` is the share of the product (and of real users' work) the area represents; the parity
# table in ROADMAP.md and docs/parity.md is computed as  sum(weight * score) / sum(weight).
# Scores are never stored here: `cargo xtask parity` derives them from spec/inventory/*.toml
# (entries with a live command or a `done` flag) and ROADMAP.md records the behaviour grade.

[[area]]
id = "ui-chrome"
title = "Window, tabs, toolbar, sidebars, settings, shortcuts"
weight = 5

