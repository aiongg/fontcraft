[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/fontcraft", "apps/fontcraft-cli", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/aiongg/fontcraft"

[workspace.dependencies]
# internal (register every new crate in xtask/src/layers.rs)
fontcraft-geom = { path = "crates/geom" }
fontcraft-plist = { path = "crates/plist" }
fontcraft-cff = { path = "crates/cff" }
fontcraft-container = { path = "crates/container" }
fontcraft-model = { path = "crates/model" }
fontcraft-audit = { path = "crates/audit" }
fontcraft-format = { path = "crates/format" }
fontcraft-io-glyphs = { path = "crates/io-glyphs" }
fontcraft-io-ufo = { path = "crates/io-ufo" }
fontcraft-io-svg = { path = "crates/io-svg" }
fontcraft-io-sfd = { path = "crates/io-sfd" }
fontcraft-decompile = { path = "crates/decompile" }
fontcraft-compile = { path = "crates/compile" }
fontcraft-oracle = { path = "crates/oracle" }
fontcraft-engine = { path = "crates/engine" }
fontcraft-mcp = { path = "crates/mcp" }
fontcraft-ui-egui = { path = "crates/ui-egui" }
fontcraft-tools = { path = "crates/tools" }
fontcraft-testkit = { path = "crates/testkit" }
fontcraft-pathops = { path = "crates/pathops" }
fontcraft-render = { path = "crates/render" }
fontcraft-glyphdata = { path = "crates/glyphdata" }
fontcraft-glyphquery = { path = "crates/glyphquery" }
fontcraft-spacing = { path = "crates/spacing" }
fontcraft-textlayout = { path = "crates/textlayout" }
fontcraft-features = { path = "crates/features" }
fontcraft-components = { path = "crates/components" }
fontcraft-fontinfo = { path = "crates/fontinfo" }
fontcraft-fea = { path = "crates/fea" }
fontcraft-shaping = { path = "crates/shaping" }
fontcraft-interp = { path = "crates/interp" }
fontcraft-ttasm = { path = "crates/ttasm" }
fontcraft-autohint = { path = "crates/autohint" }
fontcraft-hinting = { path = "crates/hinting" }
fontcraft-color = { path = "crates/color" }
fontcraft-imagery = { path = "crates/imagery" }
fontcraft-tables = { path = "crates/tables" }
fontcraft-proof = { path = "crates/proof" }
fontcraft-plugins = { path = "crates/plugins" }

# The Craft suite's shared libraries (MIT OR Apache-2.0), pinned to one commit of craft-libs.
# Bump the rev in its own commit, with the gate (docs/decisions/0008-shared-suite-libraries.md).
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "e9546e191dd62f2bc1d61eca45dbdc2f1b3c1d8e" }

# foundation (all MIT OR Apache-2.0 unless noted)
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
log = "0.4"
base64 = "0.22"
# TOML, the editable form of the user's feature code snippet files (MIT OR Apache-2.0). Pure Rust,
# builds for wasm.
toml = "1"
# Curve booleans for overlap removal (MIT OR Apache-2.0). See docs/plans/M3.md › M3.6.
linesweeper = "0.5"
# Unicode compatibility decomposition (NFKD) for PostScript strings in CFF (MIT OR Apache-2.0).
unicode-normalization = "0.1"
# Regular expressions for glyph search and smart filters (MIT OR Apache-2.0), with size limits.
# Without default features: no extra performance tables. Builds for wasm32.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

# Unicode Script, Script_Extensions and Bidi_Class for the kern writer (Unicode-3.0). Pinned to the
# version fontc 1.0.0 reads, so that scripts split as there.
icu_properties = "=2.1.2"

# fonts: the fontations crates (MIT OR Apache-2.0). See docs/decisions/0002-compile-pipeline.md.
write-fonts = "0.54"
read-fonts = "0.45"
skrifa = "0.48"

# The feature compiler (MIT OR Apache-2.0), used only by `fea`. fea-rs 1.0.0 is built on
# write-fonts 0.52, so `fea` alone also sees that version, renamed. See docs/plans/M8.md § 3.
fea-rs = { version = "=1.0.0", default-features = false }
write-fonts-052 = { package = "write-fonts", version = "=0.52.0" }
# fea-rs's `VariationInfo` names its coordinate and axis types; `fea` alone uses them.
fontdrasil = { version = "=1.0.0", default-features = false }

# Shaping for Edit View and Text Preview (MIT), on the workspace's read-fonts. Never its `icu`
# feature, which pins another icu_properties.
harfrust = { version = "0.14", default-features = false, features = ["std"] }
# The Unicode Bidirectional Algorithm (MIT OR Apache-2.0), with its data from icu_properties'
# `unicode_bidi` feature (turned on in `shaping`).
unicode-bidi = { version = "0.3", default-features = false }
# PDF writing for proof sheets (MIT OR Apache-2.0). Pure Rust, builds for wasm.
pdf-writer = "0.15"

# Rasterising for `render` (BSD-3-Clause): nonzero fills, anti-aliased, PNG output. Builds for wasm.
tiny-skia = "0.12"

# SVG reading (MIT OR Apache-2.0). Without its default features: no text layout, no system fonts.
usvg = { version = "0.47", default-features = false }

# Image decoding for `imagery` (MIT OR Apache-2.0): the PNG, JPEG and TIFF decoders only. Builds for wasm.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
# Sandboxed WebAssembly modules (MIT OR Apache-2.0): a pure-Rust interpreter that builds for wasm32
# too. No text format, no memory64; `validate` keeps full module validation; the portable
# dispatcher cannot overflow the host stack on long-running modules.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
# Tests only: WebAssembly text to binary for the module fixtures (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
# The system file and folder choosers of the desktop app (MIT). On Linux through the desktop
# portal only, so the build needs no GTK.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
# FontCraft never crashes: shipped code returns `Result`/`Option` instead of panicking
# (AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# The implicit forms: `v[i]`, `&v[a..b]` and `&s[a..b]` panic when out of range. Use `.get(…)`.
indexing_slicing = "deny"
string_slice = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Speed measures and oracle runs: release optimisation without the link-time cost.
[profile.measure]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
