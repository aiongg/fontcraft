# Corpus files whose round trip may differ from the original, each with the reason.
# `cargo xtask roundtrip` reports them as "allowed" instead of "different". A reason must say why
# the difference is not our bug (for example: the file was edited by hand after the app saved it).
#
# [[allow]]
# path = "fontc/resources/testdata/glyphs3/Example.glyphs"   # relative to corpus/
# reason = "…"

[[allow]]
path = "glyphssdk/GlyphsFileFormat/GlyphsFileFormatv2.glyphs"
reason = "The format document's sample file, arranged by hand: its root, glyph and layer keys are in an order no file the app saved uses (for example vertKerning right after kerning). Every other version 2 file the app saved round-trips."
