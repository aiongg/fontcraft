# Sources of the built-in language and glyph-set data, crates/glyphdata/data/sets.bin.
#
# `cargo xtask glyphsets --fetch` downloads them into data-sources/glyphsets/ (git-ignored); `--generate`
# rebuilds the blob and the licence files beside it. A git commit names its content. `--generate`
# also reads the built-in glyph database (crates/glyphdata/data/glyphdata.bin) to give each
# language a script.

[cldr]
repo = "https://github.com/unicode-org/cldr"
# The final CLDR 48.2 release (tag release-48-2, 2026-03-16). The main exemplar characters of
# common/main/<locale>.xml give the languages; common/main/en.xml gives their English names.
release = "release-48-2"
commit = "11299982335beb974c1c63c45265184e759c0f41"
licence = "Unicode-3.0 (LICENSE at this commit)"
paths = ["/common/main/*.xml", "/LICENSE"]

[glyphsets]
repo = "https://github.com/googlefonts/glyphsets"
# 2026-09-22, "Regenerate using latest gflanguages". The built sets in data/results/glyphs/ give
# each glyph's name and code point.
commit = "432104e3ecb119c44b3cc29d7209d7b54bf41017"
licence = "Apache-2.0 (LICENSE at this commit); the characters come from gflanguages (Apache-2.0), adapted from CLDR (Unicode-3.0)"
paths = ["/data/results/glyphs/*.glyphs", "/LICENSE"]

# The glyph sets the Start Window offers, in its order. `file` is the name in
# data/results/glyphs/ without `.glyphs`; every file there must be listed. `script` is the glyph
# database's script id the chooser lists the set under; `default` sets are picked when a script is
# chosen without naming its sets.

[[set]]
file = "GF_Latin_Kernel"
id = "latin-kernel"
name = "Latin Kernel"
script = "latin"

[[set]]
file = "GF_Latin_Core"
id = "latin-core"
name = "Latin Core"
