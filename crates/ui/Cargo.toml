[package]
name = "fontcraft-ui"
description = "FontCraft user interface on the craft framework: app layer, shell and panel views (L6)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fontcraft-engine.workspace = true
fontcraft-geom.workspace = true
fontcraft-glyphquery.workspace = true
fontcraft-tools.workspace = true
fontcraft-model.workspace = true
fontcraft-render.workspace = true
fontcraft-spacing.workspace = true
fontcraft-textlayout.workspace = true
fontcraft-craft-ext.workspace = true
base64.workspace = true
craft = { workspace = true, features = ["ui-app", "keymap", "menu", "tracked", "settings", "platform", "quit", "automation", "color-ui"] }
# egui 0.37 is the craft fork (the workspace's `[patch.crates-io]`). Not a workspace dependency
# while `fontcraft-ui-egui` keeps egui 0.36 under that name.
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
serde_json.workspace = true
log.workspace = true

# The system file pickers and the OS clipboard: native only (craft's clipboard backend does not
# build for wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft = { workspace = true, features = ["dialogs", "platform-clipboard"] }

[dev-dependencies]
craft = { workspace = true, features = ["screen-testing"] }
