# --- fontmake and fontc disagree; FontCraft follows fontc (M2.2) ------------------------------
# Where the two reference compilers write different values, M2.2 matched fontc. Each entry below
# was checked against fontc's build of the same sources: FontCraft's value is fontc's. fontmake
# writes CFF fonts and fontc does not, so these differences show in every comparison with
# fontmake, TrueType and CFF alike.

[[allow]]
table = "head"
key = "head.fontRevision"
oracle = "fontmake"
ours = "0"
theirs = "1"
reason = "A source without a version: glyphsLib reads it as 1.000, fontc as 0.000 (FontCraft follows fontc)."

[[allow]]
table = "name"
key = "name 3/1/0x0409/5"
