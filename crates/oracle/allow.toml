sources = ["/SmartComponents.glyphs"]
reason = "Follows from the smart components the reference interpolates (see glyf); M6."

# --- Reading questions ------------------------------------------------------------------------

[[allow]]
table = "hmtx"
key = "hmtx * advance"
sources = ["/MissingWidth.glyphs", "/VersionMajorMinor.glyphs", "/An-Italic.glyphs", "/SuperscriptCustomParamFallback.glyphs"]
reason = "Source reading: a `.glyphs` layer without a `width` key reads as 0 in FontCraft; glyphsLib and fontc read it as 600. Files from the reference app always state the width; these are hand-written tests. Open question for the `.glyphs` reader."

[[allow]]
table = "hhea"
key = "hhea.advanceWidthMax"
sources = ["/MissingWidth.glyphs", "/VersionMajorMinor.glyphs", "/An-Italic.glyphs", "/SuperscriptCustomParamFallback.glyphs"]
reason = "Follows from a layer without a width (see hmtx)."

[[allow]]
table = "OS/2"
key = "OS/2.xAvgCharWidth"
sources = ["/MissingWidth.glyphs", "/VersionMajorMinor.glyphs", "/An-Italic.glyphs", "/SuperscriptCustomParamFallback.glyphs"]
reason = "Follows from a layer without a width (see hmtx)."

[[allow]]
table = "OS/2"
key = "OS/2.s*"
keys = ["OS/2.usWin*", "OS/2.yStrikeoutPosition"]
sources = ["/fontinfo_var.designspace"]
reason = "Source reading: the designspace's first source has no ascender, descender, x-height or cap height while another source has them. The reference builds that UFO alone and uses ufo2ft's defaults; the model holds one list of metrics for all masters and reads a value a master lacks as 0. Open question for the designspace reader."

[[allow]]
table = "hhea"
key = "hhea.ascender"
keys = ["hhea.descender"]
sources = ["/fontinfo_var.designspace"]
reason = "Follows from the metrics the first source lacks (see OS/2)."

[[allow]]
table = "head"
key = "head.yMin"
keys = ["head.yMax"]
sources = ["/fontinfo_var.designspace"]
reason = "Follows from the metrics the first source lacks (see OS/2): the drawn `.notdef` spans the descender to the ascender."

[[allow]]
table = "glyf"
key = "glyf .notdef *"
sources = ["/fontinfo_var.designspace"]
reason = "Follows from the metrics the first source lacks (see OS/2): the drawn `.notdef` spans the descender to the ascender."

[[allow]]
table = "name"
key = "name *"
sources = ["/TheBestV2NamesInAV3File.glyphs"]
reason = "Source reading: a version 3 file with version 2's top-level name keys (`copyright`, `designer`…). FontCraft's version 3 reader keeps them as unknown keys; fontc reads them as names. Open question for the `.glyphs` reader."

[[allow]]
table = "vmtx"
key = "vmtx * advance"
sources = ["HVVAR/SingleModel_", "/Vertical.ufo"]
reason = "Source reading: a UFO glyph without a height has advance height 0 in ufo2ft and fontc. The UFO reader, following glyphsLib's crosswalk, keeps no height both for such a glyph and for one whose height is the default, so FontCraft writes the default. Open question for the UFO reader."

[[allow]]
table = "vhea"
key = "vhea.minBottomSideBearing"
sources = ["HVVAR/SingleModel_"]
reason = "Follows from the UFO glyphs without a height (see vmtx)."

# --- Decided differences ----------------------------------------------------------------------

[[allow]]
