# --- Glyph names and mark widths (M4) ---------------------------------------------------------

[[allow]]
table = "post"
key = "post glyphName *"
sources = ["glyphs3/CornerComponents.glyphs"]
reason = "Decided difference: the source sets Use Custom Naming (`disablesNiceNames`), which keeps the source names in the font as the handbook says (`Don't use Production Names`); the reference compilers ignore that setting and write the glyphs' production names."

[[allow]]
table = "hmtx"
key = "hmtx * advance"
ours = "*"
theirs = "0"
sources = ["designspace_from_glyphs/IntermediateLayer", "designspace_from_glyphs/WghtVar_Anchors"]
reason = "Decided difference: a UFO that glyphsLib wrote stores a non-spacing mark's width as 0 in the GLIF and its drawn width in the `com.schriftgestaltung.Glyphs.originalWidth` lib key. The model reads the drawn width, so the UFO converts back to the reference's format unchanged; the reference compilers read the GLIF's 0, and the compiler takes a UFO's widths as the model holds them."

[[allow]]
table = "hhea"
key = "hhea.minRightSideBearing"
sources = ["designspace_from_glyphs/IntermediateLayer", "designspace_from_glyphs/WghtVar_Anchors"]
reason = "Follows from the mark widths of a UFO glyphsLib wrote (see hmtx)."

[[allow]]
table = "OS/2"
key = "OS/2.xAvgCharWidth"
sources = ["designspace_from_glyphs/IntermediateLayer", "designspace_from_glyphs/WghtVar_Anchors"]
reason = "Follows from the mark widths of a UFO glyphsLib wrote (see hmtx)."

