key = "cmap *"
oracle = "fontmake"
sources = ["glyphs2/AxisRules.glyphs"]
reason = "Source reading: the glyph has an alternate (bracket) layer and no master layer. glyphsLib makes only `space.BRACKET.varAlt01`, without the code point, and fontmake writes no character map; FontCraft keeps the glyph, empty, with its code point. Alternate layers are compiled from M9."

[[allow]]
