oracle = "fontmake"
sources = ["/CornerComponents.glyphs"]
reason = "The reference compilers differ: glyphsLib's corner filter places one node of the cut outgoing curve a unit away from fontc's. FontCraft follows fontc, whose result equals the reference app's stored output (`ai_curved_outstroke.expectation`)."

[[allow]]
table = "CFF"
key = "CFF av_left_anchoroffpath outline"
keys = ["CFF au_left_anchoronpath outline", "CFF ai_curved_outstroke outline"]
sources = ["/CornerComponents.glyphs"]
