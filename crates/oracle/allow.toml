sources = ["/NestedSmartComponent.glyphs"]
reason = "The reference compilers differ on `w`, whose smart component's glyph holds another smart component: FontCraft's outline equals glyphsLib's (fontmake), which `fontcraft_model::smart` follows, not fontc's."

[[allow]]
