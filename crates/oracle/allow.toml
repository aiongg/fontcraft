key = "lookup *"
oracle = "fontmake"
sources = ["/AlumniSans-wononly.glyphs › ", "/BracketTestFontKerning.glyphs › ", "/LibreFranklin-bracketlayer.glyphs › ", "/glyph-with-bracket-component.glyphs › ", "/bracket-glyph-order.glyphs › ", "/bracket-rules-processed-in-glyph-order.glyphs › "]
theirs = "*BRACKET*"
reason = "Follows from the alternate glyphs fontmake keeps in a static instance (see GDEF): its kerning and mark attachment rules name them as well."

