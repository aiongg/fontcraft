sources = ["/color-and-bracket-glyph-order", "glyphs2/AxisRules.glyphs", "/Alexandria-bracketglyphs", "/AlumniSans-wononly", "/BracketTestFontKerning", "/WorkSans-minimal-bracketlayer", "/LibreFranklin-bracketlayer", "/bracket-glyph-order", "/bracket-rules-processed", "/glyph-with-bracket-component", "/manual_bracket_layer_and_component", "decreasing_axis/axis.glyphs", "/PropagateAnchorsTest", "/COLRv0-2masters-brace"]
reason = "Source reading: the average advance counts the glyphs the reference makes of alternate and colour layers (see maxp); M8, M9, M11."

[[allow]]
