keys = ["OS/2.usFirstCharIndex", "OS/2.usLastCharIndex"]
oracle = "fontmake"
sources = ["glyphs2/AxisRules.glyphs"]
reason = "Follows from the code point fontmake does not map (see cmap); M9."

