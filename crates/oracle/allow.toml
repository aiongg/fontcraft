reason = "A static build of a master uses the master's custom parameters in place of the font's, as glyphsLib (fontmake's reader) and the reference app do; fontc reads these parameters from the font only (docs/spec/40-compile.md › Where FontCraft differs from fontc)."

[[allow]]
table = "name"
key = "name 3/1/0x0409/7"
oracle = "fontc"
sources = ["/master_custom_params_override.glyphs"]
reason = "The master's `trademark` parameter in place of the font's, as for the other parameters of this source (see OS/2)."
