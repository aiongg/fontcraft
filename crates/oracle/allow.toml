sources = ["/VersionMajorMinor.glyphs"]
reason = "Source reading: the file lists its glyphs before its masters. glyphsLib reads keys in file order and links a layer to its master only when the master is already known, so the glyph's one layer belongs to no master and the glyph is left out. The reference app writes the masters first; fontc and FontCraft keep the glyph."

