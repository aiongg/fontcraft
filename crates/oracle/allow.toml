key = "head.xMax"
keys = ["head.xMin"]
sources = ["/AlumniSans-wononly", "/BlankAlternateLayers", "decreasing_axis/axis.glyphs"]
reason = "Source reading: the font box includes the glyphs the reference makes of alternate layers (see maxp); M8, M9."

[[allow]]
table = "cmap"
key = "cmap *"
oracle = "fontmake"
sources = ["glyphs2/AxisRules.glyphs"]
reason = "Source reading: the glyph has an alternate (bracket) layer and no master layer. glyphsLib makes only `space.BRACKET.varAlt01`, without the code point, and fontmake writes no character map; FontCraft keeps the glyph, empty, with its code point. Alternate layers are compiled from M9."

[[allow]]
table = "OS/2"
key = "OS/2.ulUnicodeRange1"
keys = ["OS/2.usFirstCharIndex", "OS/2.usLastCharIndex"]
oracle = "fontmake"
sources = ["glyphs2/AxisRules.glyphs"]
reason = "Follows from the code point fontmake does not map (see cmap); M9."

