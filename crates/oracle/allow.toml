[[allow]]
table = "glyf"
key = "glyf * outline"
keys = ["glyf * bounds", "glyf * structure"]
sources = ["/OpenCorners.ufo", "/NestedSmartComponent.glyphs", "/SmartComponent.glyphs", "/SmartComponents.glyphs", "/CornerComponents.glyphs"]
reason = "Source reading: the reference interpolates smart components, applies corner components and erases open corners before compiling; FontCraft does from M6."

[[allow]]
table = "hmtx"
key = "hmtx * lsb"
sources = ["/CornerComponents.glyphs"]
reason = "Follows from the corner components the reference applies (see glyf); M6."

[[allow]]
table = "head"
key = "head.xMax"
sources = ["/SmartComponents.glyphs"]
reason = "Follows from the smart components the reference interpolates (see glyf); M6."

[[allow]]
