# --- Overlap removal (M3.7) ----------------------------------------------------------------------
# fontmake removes overlaps with booleanOperations, FontCraft with its own engine. Both give the
# same shape; where they place a point differs (docs/spec/40-compile.md § 3.8).

[[allow]]
table = "glyf"
