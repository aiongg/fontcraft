keys = ["glyf av_left_anchoroffpath bounds"]
sources = ["/CornerComponents.glyphs"]
reason = "Decided difference: the corner glyph's left anchor slides the corner along the baseline onto the slanted stem, as the reference app's own output stored in the source (`av_left_anchoroffpath.expectation`) shows node for node; both reference compilers ignore the left anchor."

[[allow]]
