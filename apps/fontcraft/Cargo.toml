[package]
name = "fontcraft"
description = "FontCraft, the font editor (desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fontcraft-ui.workspace = true
fontcraft-engine.workspace = true
craft = { workspace = true, features = ["settings", "platform"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
eframe = { workspace = true, features = ["wayland"] }

# The print service: native only, as `fontcraft-ui` uses it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft = { workspace = true, features = ["print"] }

# The pasteboard's PDF for a paste on the canvas, in the versions the clipboard crate of eframe already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }

# The clipboard's PDF for a paste on the canvas, in the version the clipboard crate of eframe already pulls in.
[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["std"] }

[build-dependencies]
# Icon and VERSIONINFO for fontcraft.exe; build.rs uses it only when targeting Windows.
winresource = "0.1"
