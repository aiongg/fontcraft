[package]
name = "fontcraft"
description = "FontCraft, the font editor (desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fontcraft-engine.workspace = true
fontcraft-ui-egui.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd.workspace = true
serde_json.workspace = true
log.workspace = true
ureq.workspace = true
craft-quit = { workspace = true, features = ["egui"] }

# The app menu whose Quit asks first. The pasteboard's PDF for Edit View's paste, in the versions
# the clipboard crate of eframe already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
craft-quit = { workspace = true, features = ["egui", "menu"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }

# The clipboard's PDF for Edit View's paste, in the version the clipboard crate of eframe already
# pulls in.
[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["std"] }
